name: 케이점검 수정

# 준호가 /admin 「점검」에서 승인한 항목 가운데 자동 수정 가능한 것만 고쳐서 커밋한다.
# 2시간마다 확인 + 손으로(또는 Supabase Database Webhook → repository_dispatch 'audit-approved').
on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [audit-approved]

permissions:
  contents: write

concurrency:
  group: kedu-audit-fix

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 승인된 항목 있는지
        id: chk
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "none=1" >> "$GITHUB_OUTPUT"; echo "::warning::SUPABASE_SERVICE_KEY 없음"; exit 0; fi
          N=$(node -e "require('./audit/upload.js').fetchApproved().then(a=>console.log(a.length)).catch(e=>{console.error(e.message);console.log(0)})")
          echo "승인·수정가능 $N 건"
          if [ "$N" = "0" ]; then echo "none=1" >> "$GITHUB_OUTPUT"; fi

      - name: 의존성
        if: steps.chk.outputs.none != '1'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: 고치기
        if: steps.chk.outputs.none != '1'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node audit/fix.js

      - name: 회귀 테스트 (고친 뒤 깨진 게 없는지)
        if: steps.chk.outputs.none != '1'
        run: |
          node audit/inspector.js --rules=r04,r09 --quiet || true
          node -e "const r=require('./audit/out/report.json');const h=r.findings.filter(f=>f.severity==='high');if(h.length){console.log(h.map(f=>f.file+' '+f.msg).join('\n'));}"

      - name: 커밋·푸시
        if: steps.chk.outputs.none != '1'
        id: push
        run: |
          git config user.name "kedu-audit"
          git config user.email "kedu-audit@users.noreply.github.com"
          git add -A ':!audit/out'
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; echo "고친 파일 없음"; exit 0; fi
          N=$(node -p "Object.values(require('./audit/out/fixed.json')).filter(r=>r.ok).length")
          git commit -m "audit-fix: 승인된 항목 ${N}건 자동 수정 (케이점검)"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 상태 갱신 (applied)
        if: steps.chk.outputs.none != '1'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node audit/upload.js --applied "${{ steps.push.outputs.sha }}"

      - name: 요약
        if: always() && steps.chk.outputs.none != '1'
        run: |
          echo '## 케이점검 수정' >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./audit/out/fixed.json');for(const [k,v] of Object.entries(r))console.log('- '+(v.ok?'✔':'✗')+' \`'+(v.file||'')+'\` '+(v.note||v.why||''))" >> "$GITHUB_STEP_SUMMARY" || true

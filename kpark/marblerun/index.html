<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>케이파크 · 마블런</title>
<style>
  :root {
    --bg: #0a0f2c; --panel: rgba(16, 22, 54, 0.82); --line: #3b4a8f;
    --text: #e8ecff; --dim: #8a93c8; --accent: #4de1ff; --gold: #ffd35c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif; color: var(--text); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button { pointer-events: auto; }

  #mr-title { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 18px; }
  #mr-title .park { font-size: 12px; letter-spacing: 3px; color: var(--dim); }
  #mr-title .ride { font-size: 22px; font-weight: 800; }
  #mr-track { display: block; margin-top: 8px; font: inherit; font-size: 14px; font-weight: 700;
    color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 12px; backdrop-filter: blur(8px); pointer-events: auto; cursor: pointer; }
  #mr-desc { margin-top: 5px; font-size: 12px; color: var(--dim); max-width: 46vw; }
  #mr-title .tag { font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 20px; padding: 2px 8px; vertical-align: middle; margin-left: 6px; opacity: 0.85; }

  #mr-hud { position: absolute; top: max(18px, env(safe-area-inset-top)); right: 18px; text-align: right;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px;
    backdrop-filter: blur(8px); }
  #mr-speed { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
  #mr-state { font-size: 12px; color: var(--dim); }

  #mr-result button {
    font: inherit; font-size: 15px; font-weight: 700; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 13px 20px; backdrop-filter: blur(8px); cursor: pointer; transition: transform .08s, background .15s; }
  button.primary { background: linear-gradient(135deg, #2a6dff, #4de1ff); border: none; color: #04122e; }

  #mr-result { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--panel); border: 1px solid var(--gold); border-radius: 20px;
    padding: 24px 30px; text-align: center; backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(255, 211, 92, 0.25); pointer-events: auto; }
  #mr-result.hidden { display: none; }
  #mr-sharepanel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(13, 18, 48, 0.96); border: 1px solid rgba(255, 211, 92, 0.35);
    border-radius: 16px; padding: 20px 22px; min-width: 320px; max-width: 92vw; z-index: 30;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); }
  #mr-sharepanel.hidden { display: none; }
  #mr-sharepanel .share-title { font-size: 18px; font-weight: 800; color: var(--gold); margin-bottom: 14px; }
  #mr-sharepanel .share-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  #mr-sharepanel .share-label { font-size: 12px; color: var(--dim); min-width: 84px; }
  #mr-sharepanel input { flex: 1; min-width: 140px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; color: var(--text); padding: 7px 9px; font-size: 13px; font-family: monospace; }
  #mr-sharepanel .share-slot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 0; border-top: 1px dashed rgba(255,255,255,.12); font-size: 13px; color: var(--text); flex-wrap: wrap; }
  #mr-sharepanel .share-slot small { color: var(--dim); margin-left: 6px; }
  #mr-sharepanel .slot-btns { display: flex; gap: 6px; }
  #mr-shareclose { margin-top: 12px; width: 100%; }
  #mr-result .result-title { font-size: 24px; font-weight: 800; color: var(--gold); margin-bottom: 12px; }
  #mr-result .result-body { font-size: 14px; line-height: 2; color: var(--text); margin-bottom: 16px; }
  #mr-result .result-body b { color: var(--accent); }

  /* ── 건설 모드 ── */
  #mr-build { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(94vw, 640px); }
  #mr-palette { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  #mr-palette .prow { display: flex; gap: 6px; justify-content: center; width: 100%; }
  #mr-palette button { pointer-events: auto; flex: 1; max-width: 100px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 2px 6px;
    backdrop-filter: blur(8px); cursor: pointer; font-size: 19px; line-height: 1.1;
    display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .08s, border-color .15s; }
  #mr-palette button span { font-size: 11px; font-weight: 700; }
  #mr-palette button:active:not(:disabled) { transform: scale(0.92); border-color: var(--accent); }
  #mr-palette button:disabled { opacity: 0.32; cursor: default; }
  /* 골 벨 유도 — 놓을 수 있는데 아직 안 놓았을 때 */
  @keyframes mr-nudge {
    0%, 70%, 100% { transform: translateY(0); box-shadow: 0 0 0 0 rgba(255, 209, 74, 0); }
    80% { transform: translateY(-5px); box-shadow: 0 0 0 4px rgba(255, 209, 74, 0.28); }
    90% { transform: translateY(0); box-shadow: 0 0 0 8px rgba(255, 209, 74, 0); }
  }
  #mr-palette button.nudge:not(:disabled) { border-color: #ffd14a; animation: mr-nudge 2.2s ease-in-out infinite; }
  @keyframes mr-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  #mr-gorun.shake { animation: mr-shake 0.36s ease-in-out; }
  /* 카메라 조작 버튼 */
  #mr-recenter, #mr-frameall { font-size: 17px; padding: 10px 12px; line-height: 1; }
  #mr-recenter.lit { border-color: #4de1ff; color: #4de1ff; box-shadow: 0 0 0 2px rgba(77, 225, 255, 0.22); }
  #mr-buildops button:disabled { cursor: help; }
  #mr-buildops { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #mr-buildops button { pointer-events: auto; font: inherit; font-size: 14px; font-weight: 700; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
    backdrop-filter: blur(8px); cursor: pointer; }
  #mr-buildops button:disabled { opacity: 0.32; cursor: default; }
  #mr-buildops button.primary { background: linear-gradient(135deg, #2a6dff, #4de1ff); border: none; color: #04122e; }
  #mr-height { pointer-events: auto; display: flex; gap: 6px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 5px 10px; backdrop-filter: blur(8px); }
  #mr-height .lbl { font-size: 12px; color: var(--dim); }
  #mr-height b { min-width: 18px; text-align: center; font-size: 16px; color: var(--accent); }
  #mr-height button { font-size: 16px; font-weight: 800; width: 30px; height: 30px; padding: 0; border-radius: 10px;
    color: var(--text); background: transparent; border: 1px solid var(--line); cursor: pointer; }

  /* ── 실행 모드 ── */
  #mr-run { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
  #mr-count { pointer-events: auto; display: flex; gap: 4px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 5px 7px; backdrop-filter: blur(8px); }
  #mr-count button { font: inherit; font-size: 17px; width: 38px; height: 38px; padding: 0;
    color: var(--dim); background: transparent; border: 1px solid transparent; border-radius: 12px; cursor: pointer; }
  #mr-count button.on { color: #04122e; background: linear-gradient(135deg, #2a6dff, #4de1ff); font-weight: 800; }
  #mr-branch { border-color: #b84dff !important; color: #e2b8ff !important; }
  #mr-run button { pointer-events: auto; font: inherit; font-size: 15px; font-weight: 700; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 13px 20px;
    backdrop-filter: blur(8px); cursor: pointer; transition: transform .08s; }
  #mr-run button:active { transform: scale(0.94); }
  #mr-slomo.on { border-color: var(--gold); color: var(--gold);
    box-shadow: 0 0 0 2px rgba(255, 211, 92, 0.22); }

  /* ── 안내 ── */
  #mr-hint { position: absolute; top: 104px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); white-space: nowrap; }
  #mr-hint.good { color: #8dff7a; border-color: #8dff7a; }
  #mr-hint.warn { color: #ff9a5c; border-color: #ff9a5c; }
  #mr-hint.info { color: var(--dim); }
  .hidden { display: none !important; }

  #err { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #ff7a7a;
    background: var(--panel); border: 1px solid #ff7a7a; border-radius: 12px; padding: 16px 22px;
    font-size: 14px; display: none; max-width: 80vw; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui"></div>
<div id="err"></div>

<!-- 코어: 순수 로직 (window.MarbleSim) -->
<script src="core/hexgrid.js"></script>
<script src="core/parts/basic.js"></script>
<script src="core/parts/action.js"></script>
<script src="core/parts/ballistic.js"></script>
<script src="core/parts/switchpart.js"></script>
<script src="core/parts/splitter.js"></script>
<script src="core/parts/mergepart.js"></script>
<script src="core/parts/lifter.js"></script>
<script src="core/graph.js"></script>
<script src="core/sim.js"></script>
<script src="core/multisim.js"></script>
<script src="core/serialize.js"></script>
<script src="core/tracks.js"></script>
<script src="core/builder.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { createRenderer, buildTrackMeshes, makeSlotMarker, updateSlotMarker, makeGhostMarble, makeMarble, updateSwitchFlipper } from './stage/renderer.js';
import { createCameras } from './stage/cameras.js';
import { ringBell, animateBell, updateBell, createConfetti, placeClick, thudSound, boomSound, boingSound, catchSound, flipSound, createRollSound } from './stage/fx.js';
import { createUI } from './stage/ui.js';

const NS = window.MarbleSim;
const C = NS.CONST;
const TRACKS = NS.TRACKS;

// 구슬 팔레트 (다중 방출 순서대로)
const MARBLE_STYLES = [
  { emoji: '🔵', color: 0x4de1ff, emissive: 0x0a6fa0 },
  { emoji: '🩷', color: 0xff6bd6, emissive: 0x8a1560 },
  { emoji: '🟡', color: 0xffd35c, emissive: 0x8a6200 },
];

// ── 스테이지 ──
const canvas = document.getElementById('stage');
const { renderer, scene } = createRenderer(canvas);
const confetti = createConfetti(scene);
const slotMarker = makeSlotMarker(C);
scene.add(slotMarker);
const ghostMarble = makeGhostMarble(C);
scene.add(ghostMarble);

// 비활성 갈래 마커 (탭하면 그 갈래로 전환)
let dimMarkers = new THREE.Group();
scene.add(dimMarkers);

// ── 상태 ──
let mode = 'build';                        // 'build' | 'run'
let builderState = { startH: 3, seq: [] }; // 빌더 = 단일 소스 (seq 항목: 문자열 | 스위치 노드)
let editLog = [];                          // 배치 이력: push된 배열 참조 목록 (undo용)
let activeDecisions = [];                  // 활성 갈래 (스위치 선택 0/1 나열)
let comp = null;                           // compile 결과
let cur = null;                            // { routesData, group, bells, switches, activeRD, ghostSim }
let multi = null;                          // MultiSim (실행 모드)
let marbleMeshes = [];                     // 실행 중 구슬 메쉬
let marbleCount = 1;
let ghostWait = 0;
let vMax = 0;
let finishes = [];                         // [{m, time, routeIdx}]

/* 건설 프론티어 = 활성 갈래의 다음 자리 */
function frontierPoint() {
  if (!comp) return { x: 0, y: 0.08, z: 0 };
  const H = C.H;
  if (comp.next && !comp.ended) {
    const c = NS.hexgrid.tileCenter(comp.next.q, comp.next.r, C.R);
    return { x: c.x, y: comp.exitH * H + 0.02, z: c.z };
  }
  const last = comp.pieces[comp.pieces.length - 1];
  const c = NS.hexgrid.tileCenter(last.q, last.r, C.R);
  return { x: c.x, y: last.h * H + 0.02, z: c.z };
}

function allTilePoints() {
  if (!comp) return [];
  return comp.pieces.map(p => {
    const c = NS.hexgrid.tileCenter(p.q, p.r, C.R);
    return { x: c.x, y: p.h * C.H, z: c.z };
  });
}

function trackCenter(pieces) {
  const box = { x: 0, z: 0 };
  pieces.forEach(p => { const c = NS.hexgrid.tileCenter(p.q, p.r, C.R); box.x += c.x; box.z += c.z; });
  box.x /= pieces.length; box.z /= pieces.length;
  return box;
}

function disposeGroup(group) {
  group.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
  });
  scene.remove(group);
}

/* 잎 빌드 결과 → 렌더 entries (부품×방향 중복 제거, air 로컬 인덱스) */
function computeRenderEntries(comp, routesData) {
  const seen = new Set();
  const entries = [];
  for (const rd of routesData) {
    for (const rg of rd.track.pieceRanges) {
      const piece = rd.leafPieces[rg.pieceIndex];
      const globalIdx = comp.routes[rd.routeIdx].pieceIdxs[rg.pieceIndex];
      const key = globalIdx + ':' + (piece.dir != null ? piece.dir : '') + ':' + (piece.arm != null ? piece.arm : '');
      if (seen.has(key)) continue;
      seen.add(key);
      const airLocal = new Set();
      for (const ar of (rd.track.airIndexRanges || [])) {
        const i0 = Math.max(ar.i0 + 1, rg.i0), i1 = Math.min(ar.i1 - 1, rg.i1);
        for (let i = i0; i <= i1; i++) airLocal.add(i - rg.i0);
      }
      entries.push({ piece, pts: rd.track.points.slice(rg.i0, rg.i1 + 1), airLocal, globalIdx });
    }
  }
  return entries;
}

/* 비활성 갈래 마커 재구성 */
function rebuildDimMarkers() {
  disposeGroup(dimMarkers);
  dimMarkers = new THREE.Group();
  scene.add(dimMarkers);
  if (!comp || comp.routes.length < 2) return;
  const activeRef = comp.routes[comp.activeRoute] && comp.routes[comp.activeRoute].seqRef;
  const seenRef = new Set();
  comp.routes.forEach((rt, ri) => {
    if (ri === comp.activeRoute || rt.ended || !rt.next) return;
    if (rt.seqRef === activeRef || seenRef.has(rt.seqRef)) return; // 합류된 형제 갈래 = 같은 끝
    seenRef.add(rt.seqRef);
    const c = NS.hexgrid.tileCenter(rt.next.q, rt.next.r, C.R);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(C.R * 0.8, 0.0035, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0x4de1ff, transparent: true, opacity: 0.35 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.rotation.z = Math.PI / 6;
    ring.position.set(c.x, rt.exitH * C.H + 0.012, c.z);
    ring.userData.decisions = rt.decisions.map(d => d.dir);
    dimMarkers.add(ring);
  });
}

/* 빌더 상태 → 컴파일 → 잎 빌드 → 씬 재구성. 편집의 유일한 통로. */
function rebuild(recenter) {
  comp = NS.compile(builderState, activeDecisions);
  activeDecisions = comp.routes[comp.activeRoute] ? comp.routes[comp.activeRoute].decisions.map(d => d.dir) : [];
  const cr = NS.compileRoutes(comp, { allowNoGoal: true });
  const routesData = cr.routesData;
  if (cur) disposeGroup(cur.group);
  const entries = computeRenderEntries(comp, routesData);
  const { group, bells, switches, levers } = buildTrackMeshes(comp.pieces, entries, C);
  scene.add(group);
  // 발사 지점 s → 부품 타입 (대포/트램펄린 사운드 구분)
  for (const rd of routesData) {
    rd.launchTypeAt = (rd.track.launchMarks || []).map(mk => {
      const rg = rd.track.pieceRanges.find(r => mk.i >= r.i0 && mk.i <= r.i1);
      return { s: rd.pd.cum[mk.i], type: rg ? rd.leafPieces[rg.pieceIndex].type : 'cannon' };
    });
  }
  const activeRD = routesData.find(rd => rd.routeIdx === comp.activeRoute) || routesData[0];
  const mergeGems = [];
  group.traverse(o => { if (o.name === 'mergegem') mergeGems.push(o); });
  cur = {
    routesData, group, bells, switches, levers, activeRD, mergeGems,
    ghostSim: activeRD ? new NS.Sim(activeRD.pd) : null,
  };
  if (cur.ghostSim) cur.ghostSim.release(0);
  ghostWait = 0;
  rebuildDimMarkers();
  ui.setBuildState(comp, NS.canPlace, comp.ok && NS.canMerge(builderState));
  if (cams) {
    if (recenter) cams.frameAll(allTilePoints());
    else cams.ensureVisible(frontierPoint());
  }
}

/* 실행 준비: MultiSim + 구슬 메쉬 */
function armRun() {
  multi = new NS.MultiSim(cur.routesData, { count: marbleCount });
  multi.reset();
  for (const m of marbleMeshes) {
    cur.group.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material) m.material.dispose();
  }
  marbleMeshes = [];
  for (let i = 0; i < marbleCount; i++) {
    const st = MARBLE_STYLES[i % MARBLE_STYLES.length];
    const mesh = makeMarble(C, st.color, st.emissive);
    mesh.visible = false;
    cur.group.add(mesh);
    marbleMeshes.push(mesh);
  }
  vMax = 0;
  finishes = [];
}

function setMode(m) {
  if (m === 'build') {
    slomo = false; ceremonyHold = 0; ui.setSlomo(false); roll.stop();
    if (cams && cams.getMode() !== 'orbit') {   // 마블캠·추적으로 못 돌아가는 화면 방지
      cams.setMode('orbit'); cams.frameAll(allTilePoints()); ui.setCamLabel('orbit');
    }
  }
  mode = m;
  ui.setMode(mode, comp);
  slotMarker.visible = false;
  ghostMarble.visible = false;
  dimMarkers.visible = mode === 'build';
  if (mode === 'run') {
    armRun();
  } else {
    for (const mm of marbleMeshes) mm.visible = false;
    multi = null;
    if (cur.ghostSim) cur.ghostSim.release(0);
  }
}

/* 갈래 리스트에서 다음 열린 갈래로 순환 */
function cycleBranch() {
  const seenRef = new Set();
  const open = comp.routes.filter(rt => {
    if (rt.ended || seenRef.has(rt.seqRef)) return false;
    seenRef.add(rt.seqRef); return true;
  });
  if (open.length < 2) return;
  const curIdx = open.findIndex(rt => rt === comp.routes[comp.activeRoute]);
  const next = open[(curIdx + 1) % open.length];
  activeDecisions = next.decisions.map(d => d.dir);
  rebuild(false);
  cams.ensureVisible(frontierPoint());
}

/* 프리셋 seq(중첩 포함) 딥카피 + 편집 로그 재구성 (DFS) */
function cloneSeq(seq) { return JSON.parse(JSON.stringify(seq)); }
function rebuildLog(seq, log) {
  for (const item of seq) {
    log.push(seq);
    if (item && typeof item === 'object' && (item.type === 'switch' || item.type === 'splitter')) {
      rebuildLog(item.left || [], log);
      rebuildLog(item.right || [], log);
      if (item.merged) { log.push({ mergeNode: item }); rebuildLog(item.tail || [], log); }
    }
  }
  return log;
}

// ── UI ──
const ui = createUI(document.getElementById('ui'), {
  onAppend(type) {
    if (!NS.canPlace(comp, type)) return;
    const route = comp.routes[comp.activeRoute];
    const branch = type === 'switch' || type === 'splitter';
    const item = branch ? { type, left: [], right: [] } : type;
    route.seqRef.push(item);
    editLog.push(route.seqRef);
    if (branch) activeDecisions = activeDecisions.concat([0]); // 왼길부터
    placeClick();
    rebuild(false);
    if (type === 'switch') ui.showHint('🔀 갈림길! 왼길부터 짓자 — 오른길은 갈래 버튼으로', 'good');
    if (type === 'splitter') ui.showHint('🚦 신호기! 왼길부터 짓자 — 실행 중에 탭하면 길이 바뀐다', 'good');
  },
  onUndo() {
    if (editLog.length === 0) return;
    const rec = editLog.pop();
    if (rec && rec.mergeNode) {
      NS.unMerge(rec.mergeNode);
      ui.showHint('합류를 풀었어 — 갈래가 다시 둘로', 'info');
    } else {
      rec.pop();
    }
    rebuild(false);
  },
  onClear() {
    builderState = { startH: builderState.startH, seq: [] };
    editLog = [];
    activeDecisions = [];
    rebuild(true);
  },
  onStartH(delta) {
    const h = builderState.startH + delta;
    if (h < 1 || h > 6) return;
    const trial = NS.compile({ startH: h, seq: builderState.seq });
    if (!trial.ok) { ui.showHint('이 높이로 낮추면 경사가 바닥을 뚫어 — 안 돼', 'warn'); return; }
    builderState.startH = h;
    rebuild(false);
  },
  onSelectPreset(i) {
    builderState = { startH: TRACKS[i].startH, seq: cloneSeq(TRACKS[i].seq) };
    editLog = rebuildLog(builderState.seq, []);
    activeDecisions = [];
    marbleCount = TRACKS[i].marbles || 1;
    ui.setMarbleCount(marbleCount);
    rebuild(true);
    if (mode === 'run') setMode('run');
  },
  onBranch() { cycleBranch(); },
  onShareOpen() {
    let code = '';
    try { code = NS.serialize.encodeCode(builderState); }
    catch (e) { ui.showHint('아직 코드로 만들 수 없어 — ' + e.message, 'warn'); return; }
    ui.openShare(code, loadSlots());
  },
  onLoadCode(text) { applyCode(text, '📥 친구의 트랙을 불러왔어!'); },
  onSlotSave(i) {
    let code = '';
    try { code = NS.serialize.encodeCode(builderState); }
    catch (e) { ui.showHint('저장할 수 없어 — ' + e.message, 'warn'); return; }
    const slots = loadSlots();
    const name = (window.prompt('트랙 이름을 지어줘!', slots[i] && slots[i].name || '내 트랙 ' + (i + 1)) || '').trim();
    if (!name) return;
    slots[i] = { name, code, date: new Date().toLocaleDateString('ko-KR') };
    saveSlots(slots);
    ui.renderSlots(slots);
    ui.showHint('💾 "' + name + '" 저장 완료!', 'good');
  },
  onSlotOpen(i) {
    const sl = loadSlots()[i];
    if (sl && sl.code) applyCode(sl.code, '💾 "' + (sl.name || '트랙') + '" 불러왔어!');
  },
  onSlotDelete(i) {
    const slots = loadSlots();
    if (!window.confirm('정말 지울까?')) return;
    slots[i] = null;
    saveSlots(slots);
    ui.renderSlots(slots);
  },
  onMerge() {
    const t = NS.tryMerge(builderState);
    if (!t.ok) { ui.showHint('아직 합칠 수 없어 — 두 갈래가 같은 자리를 같은 높이로 바라봐야 해', 'warn'); return; }
    editLog.push({ mergeNode: t.node });
    placeClick();
    rebuild(false);
    ui.showHint('🤝 두 갈래가 하나로! 이제 꼬리는 같이 쓴다', 'good');
  },
  onMarbleCount(n) {
    marbleCount = n;
    if (mode === 'run') armRun();
  },
  onMode(m) {
    if (m === 'run' && !comp.ended) {
      // 열린 갈래 전부에 골 벨을 자동으로 놓아줄 수 있으면 놓아준다.
      const seenRef = new Set();
      const open = comp.routes.filter(rt => {
        if (rt.ended || seenRef.has(rt.seqRef)) return false;
        seenRef.add(rt.seqRef); return true;
      });
      if (open.some(rt => !NS.canPlaceRoute(comp, rt, 'goal'))) {
        ui.showHint('앞이 막힌 갈래가 있어서 골 벨을 못 놓아 — ↩ 되돌리기로 물러나자', 'warn');
        return;
      }
      for (const rt of open) { rt.seqRef.push('goal'); editLog.push(rt.seqRef); }
      rebuild(false);
      ui.showHint(open.length > 1 ? '🔔 갈래마다 골 벨을 놓아줬어!' : '🔔 골 벨을 끝에 놓아줬어!', 'good');
    }
    setMode(m);
  },
  onRelease() {
    ui.hideHint();
    ceremonyHold = 0;
    armRun();
    multi.release();
  },
  onReset() { ui.hideHint(); ceremonyHold = 0; roll.stop(); armRun(); },
  onSlomo() { slomo = !slomo; return slomo; },
  onToggleCamera() {
    const order = ['orbit', 'follow', 'marble'];   // 전경 → 추적 → 마블캠
    const next = order[(order.indexOf(cams.getMode()) + 1) % order.length];
    cams.setMode(next);
    if (next === 'orbit') cams.frameAll(allTilePoints());
    return next;
  },
  onRecenter() {
    if (!cams) return;
    if (mode === 'run') cams.frameAll(allTilePoints());
    else cams.recenter(frontierPoint());
  },
  onFrameAll() {
    if (cams) cams.frameAll(allTilePoints());
  },
}, TRACKS);

// ── 갈래 마커 탭 전환 (드래그와 구분: 6px 이동 이내) ──
const raycaster = new THREE.Raycaster();
let downXY = null;
canvas.addEventListener('pointerdown', (e) => { downXY = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY.x, e.clientY - downXY.y);
  downXY = null;
  if (moved > 6) return;
  const ndc = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, cams.cam);
  raycaster.params.Line = raycaster.params.Line || {};

  // 실행 모드: 신호기 탭 → 레버 전환 (다음 구슬부터 새 길)
  if (mode === 'run' && multi && cur.levers && cur.levers.size > 0) {
    const hits = raycaster.intersectObjects([...cur.levers.values()], false);
    if (hits.length > 0) {
      const id = hits[0].object.userData.pieceIdx;
      const dir = multi.toggleLever(id);
      if (dir !== null) {
        flipSound(dir);
        ui.showHint(dir === 0 ? '🚦 신호기를 왼길로! 다음 구슬부터 왼길' : '🚦 신호기를 오른길로! 다음 구슬부터 오른길', 'good');
      }
    }
    return;
  }

  if (mode !== 'build' || dimMarkers.children.length === 0) return;
  const hits = raycaster.intersectObjects(dimMarkers.children, false);
  if (hits.length > 0) {
    activeDecisions = hits[0].object.userData.decisions.slice();
    rebuild(false);
    cams.ensureVisible(frontierPoint());
    ui.showHint('이 갈래를 이어서 짓자!', 'good');
  }
});

// ── 공유 유틸 (M4) ──
const SLOT_KEY = 'kpark.marblerun.slots.v1';
function loadSlots() {
  try {
    const raw = JSON.parse(localStorage.getItem(SLOT_KEY) || '[]');
    return [raw[0] || null, raw[1] || null, raw[2] || null];
  } catch (e) { return [null, null, null]; }
}
function saveSlots(slots) {
  try { localStorage.setItem(SLOT_KEY, JSON.stringify(slots)); } catch (e) { /* 사생활 모드 등 */ }
}
function applyCode(text, okMsg) {
  let st = null;
  try { st = NS.serialize.decodeCode(text); }
  catch (e) { ui.showHint('❌ ' + e.message, 'warn'); return false; }
  const trial = NS.compile(st);
  if (!trial.ok) { ui.showHint('❌ 이 코드의 트랙은 세울 수 없어 — ' + (trial.errors[0] && trial.errors[0].msg || ''), 'warn'); return false; }
  builderState = st;
  editLog = rebuildLog(builderState.seq, []);
  activeDecisions = [];
  ui.closeShare();
  rebuild(true);
  if (mode === 'run') setMode('build');
  ui.showHint(okMsg || '트랙을 불러왔어!', 'good');
  return true;
}

// ── 메인 루프 상태 (초기화보다 먼저 선언 — setMode가 참조) ──
const PLAYBACK = 0.28;          // 검수 확정 기준선 (불변)
const SLOMO = 0.35;             // 🐌 수동 슬로모 배율
const CEREMONY = 0.45;          // 골 직전 자동 드라마 배율
let slomo = false;
let ceremonyHold = 0;           // 골 세리머니 잔여 시간(초)
let curRate = PLAYBACK;
const roll = createRollSound();

// ── 초기화 ──
let cams = null;
rebuild(false);
cams = createCameras(renderer, trackCenter(comp.pieces));
cams.frameAll(allTilePoints());
cams.onLockChange((locked) => ui.setCamLocked(locked));
setMode('build');
ui.showHint('🧩 부품을 눌러 길을 이어보자 — 예시 불러오기에서 ✨별빛 대서커스도 구경해봐!', 'good');

// URL로 받은 트랙 코드 자동 로드 (?t=CODE)
{
  const t = new URLSearchParams(location.search).get('t');
  if (t) applyCode(t, '🔗 링크의 트랙을 불러왔어!');
}

// ── 리사이즈 ──
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  cams.resize(w, h);
}
window.addEventListener('resize', resize);
resize();

/* 벨 라벨: 골 부품 등장 순서대로 A·B·C… */
function bellLabel(goalPieceIdx) {
  const goals = [...cur.bells.keys()].sort((a, b) => a - b);
  const i = goals.indexOf(goalPieceIdx);
  return '🔔' + (goals.length > 1 ? String.fromCharCode(65 + Math.max(0, i)) : '');
}

/* 선두 구슬 = 방출된 것 중 아직 달리는 첫 구슬 (없으면 마지막 방출) */
function leadMarble() {
  if (!multi) return null;
  let lastReleased = null;
  for (const M of multi.marbles) {
    if (!M.released) continue;
    lastReleased = M;
    if (M.sim.status === 'rolling' || M.sim.status === 'air' || M.sim.status === 'falling') return M;
  }
  return lastReleased;
}

// ── 메인 루프: 고정 틱 120Hz 시뮬 + rAF 렌더 ──

/* 골 직전 자동 슬로모 — 달리는 구슬이 결승 9cm 안에 들어오면 시간이 늘어진다.
 * 시뮬은 그대로(결정론 불변), 화면·소리만 늘어난다. */
function finishNear() {
  if (!multi) return false;
  for (const M of multi.marbles) {
    if (!M.released || M.sim.status !== 'rolling' || M.sim.v <= 0) continue;
    const rem = M.sim.pd.total - M.sim.s;
    if (rem > 0 && rem < 0.09) return true;
  }
  return false;
}

let last = performance.now();
let acc = 0;
let clock = 0;
const DT = NS.PHYS.dt;

function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min((now - last) / 1000, 0.1);
  last = now;
  clock += dtReal;
  if (ceremonyHold > 0) ceremonyHold -= dtReal;
  const drama = mode === 'run' && (ceremonyHold > 0 || finishNear());
  curRate = mode === 'run' && slomo ? PLAYBACK * SLOMO : drama ? PLAYBACK * CEREMONY : PLAYBACK;
  acc += dtReal * curRate;

  while (acc >= DT) {
    if (mode === 'run' && multi) {
      const events = multi.step();
      for (const ev of events) {
        if (ev.type === 'bell') {
          ringBell();
          const M = multi.marbles[ev.m];
          const bell = cur.bells.get(cur.routesData[M.routeIdx].goalPieceIdx);
          if (bell) animateBell(bell);
        }
        if (ev.type === 'switch') {
          flipSound(ev.dir);
          const st = MARBLE_STYLES[ev.m % MARBLE_STYLES.length];
          if (ev.flip === false) {
            ui.showHint(st.emoji + ' 🚦 신호기 통과 — ' + (ev.dir === 0 ? '왼길' : '오른길') + '로! (탭하면 길이 바뀐다)', 'good');
          } else {
            ui.showHint(st.emoji + ' ' + (ev.dir === 0 ? '왼길로! 스위치가 딸깍 — 다음은 오른길' : '오른길로! 스위치가 딸깍 — 다음은 왼길'), 'good');
          }
        }
        if (ev.type === 'launch') {
          const M = multi.marbles[ev.m];
          const rd = cur.routesData[M.routeIdx];
          const hit = (rd.launchTypeAt || []).find(L => Math.abs(L.s - ev.s) < 1e-6);
          ((hit && hit.type === 'trampoline') ? boingSound : boomSound)();
          ui.hideHint();
        }
        if (ev.type === 'catch') {
          catchSound(ev.wall);
          ui.showHint(ev.wall ? '🧱 뒷벽에 맞고 툭! 아슬아슬하게 들어갔다' : '🎯 착지대에 쏙! 완벽한 발사', 'good');
        }
        if (ev.type === 'miss') {
          ui.showHint(ev.over ? '💨 너무 빨라서 착지대를 훌쩍 넘어버렸어!' : '💧 속도가 모자라 착지대에 못 미쳤어!', 'warn');
        }
        if (ev.type === 'detach') {
          ui.showHint(ev.conv ? '너무 빨라서 마루에서 붕 떠올랐다! 🛫' : '앗! 구슬이 레일에서 떨어졌어 — 속도가 부족해!', ev.conv ? 'good' : 'warn');
        }
        if (ev.type === 'railcatch') {
          catchSound(false);
          const M = multi.marbles[ev.m];
          const p = M.sim.pos();
          confetti.burst({ x: p.x, y: p.y + 0.03, z: p.z });
          ui.showHint('✨ 날아서 레일에 착지! 나이스 캐치', 'good');
        }
        if (ev.type === 'crash') thudSound();
        if (ev.type === 'finish') {
          finishes.push({ m: ev.m, time: ev.ticks * DT, routeIdx: ev.routeIdx });
          const M = multi.marbles[ev.m];
          const p = M.sim.pos();
          // 골 세리머니: 색종이 두 발 + 벨로 시선 글라이드 + 0.7초 여운 슬로모
          confetti.burst({ x: p.x, y: p.y + 0.04, z: p.z }, 130);
          confetti.burst({ x: p.x, y: p.y + 0.10, z: p.z }, 70);
          ceremonyHold = 0.7;
          const bellMesh = cur.bells.get(cur.routesData[ev.routeIdx].goalPieceIdx);
          if (bellMesh && cams.getMode() === 'orbit') {
            const wp = new THREE.Vector3();
            bellMesh.getWorldPosition(wp);
            cams.focus({ x: wp.x, y: wp.y, z: wp.z });   // 각도·줌 유지, 시선만 벨로
          }
        }
        if (ev.type === 'alldone') {
          if (finishes.length > 0) {
            if (multi.count === 1) {
              ui.showResult({ time: finishes[0].time, vMax, length: cur.routesData[finishes[0].routeIdx].pd.total });
            } else {
              ui.showResult({
                marbles: finishes.slice().sort((a, b) => a.m - b.m).map(f => ({
                  emoji: MARBLE_STYLES[f.m % MARBLE_STYLES.length].emoji,
                  bell: bellLabel(cur.routesData[f.routeIdx].goalPieceIdx),
                  time: f.time,
                })),
                vMax,
              });
            }
          }
        }
      }
      for (const M of multi.marbles) if (M.released && M.sim.speed() > vMax) vMax = M.sim.speed();
    } else if (mode === 'build' && cur.ghostSim) {
      if (cur.ghostSim.status === 'rolling') cur.ghostSim.step();
      else {
        ghostWait += DT;
        if (ghostWait > 0.35) { cur.ghostSim.release(0); ghostWait = 0; }
      }
    }
    acc -= DT;
  }

  if (mode === 'run' && multi) {
    for (let i = 0; i < multi.marbles.length; i++) {
      const M = multi.marbles[i];
      const mesh = marbleMeshes[i];
      if (!mesh) continue;
      mesh.visible = M.released;
      if (!M.released) continue;
      const p = M.sim.pos();
      mesh.position.set(p.x, p.y, p.z);
      const t = M.sim.tangent();
      const axis = new THREE.Vector3(t.z, 0, -t.x);
      if (axis.lengthSq() > 1e-12) mesh.rotateOnWorldAxis(axis.normalize(), (M.sim.speed() * dtReal * curRate) / C.MR);
    }
    for (const bell of cur.bells.values()) updateBell(bell, dtReal);
    // 플리퍼: 현재 스위치 상태를 가리킨다
    for (const [id, flipper] of cur.switches) updateSwitchFlipper(flipper, multi.states.get(id) || 0, dtReal);
    const lead = leadMarble();
    let fwd = null;
    if (lead) {
      const t = lead.sim.tangent();
      const sgn = lead.sim.status === 'rolling' && lead.sim.v < 0 ? -1 : 1;
      fwd = { x: t.x * sgn, y: (t.y || 0) * sgn, z: t.z * sgn };
    }
    cams.update(lead ? lead.sim.pos() : null, fwd);
    // 굴림음: 달리는 구슬 중 최고 속도 기준, 선두가 공중이면 바람 소리
    let vNow = 0, airborne = false;
    for (const M of multi.marbles) {
      if (!M.released) continue;
      const st = M.sim.status;
      if (st === 'rolling' || st === 'air' || st === 'falling') vNow = Math.max(vNow, M.sim.speed());
    }
    if (lead) airborne = lead.sim.status === 'air' || lead.sim.status === 'falling';
    if (vNow > 0) roll.update(vNow, airborne, curRate / PLAYBACK); else roll.stop();
    ui.update(lead ? lead.sim : { speed: () => 0, status: 'ready', v: 0 }, mode);
  } else {
    if (cur.ghostSim) {
      const gp = cur.ghostSim.pos();
      ghostMarble.position.set(gp.x, gp.y, gp.z);
      ghostMarble.visible = cur.ghostSim.status === 'rolling';
    }
    updateSlotMarker(slotMarker, C, comp.ended ? null : comp.next, comp.exitH, clock);
    for (const [, flipper] of cur.switches) updateSwitchFlipper(flipper, 0, dtReal);
    dimMarkers.children.forEach(m => { m.material.opacity = 0.28 + 0.14 * Math.sin(clock * 3); });
    cams.update(null);
  }

  if (cur && cur.mergeGems) for (const gem of cur.mergeGems) {
    gem.rotation.y += dtReal * 1.6;
    gem.position.y += Math.sin(clock * 2.2) * 0.00003;
  }
  confetti.update(dtReal);
  renderer.render(scene, cams.cam);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

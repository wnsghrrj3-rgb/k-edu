<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손으로 비눗방울 터뜨리기</title>
<style>
:root{--bg:#f4f6fb;--fg:#1d2433;--panel:#ffffff;--accent:#2f6df6;--muted:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--fg:#e8ecf5;--panel:#1a2133;--accent:#6b9cff;--muted:#9aa3b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--fg:#e8ecf5;--panel:#1a2133;--accent:#6b9cff;--muted:#9aa3b5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.3rem;margin:0 0 8px}
.wrap{position:relative;width:100%;max-width:720px;aspect-ratio:4/3;background:#000;border-radius:16px;overflow:hidden}
video{display:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{display:flex;gap:16px;margin:10px 0;font-size:1.1rem;font-weight:700}
.hud span{background:var(--panel);padding:6px 14px;border-radius:999px}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:1.05rem;font-weight:700;cursor:pointer}
p{color:var(--muted);font-size:.9rem;max-width:720px;text-align:center;margin:6px 0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;gap:12px;font-size:1.4rem;font-weight:700}
</style>
</head>
<body>
<h1>🫧 손으로 비눗방울 터뜨리기</h1>
<div class="hud"><span id="score">점수 0</span><span id="time">30초</span></div>
<div class="wrap">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="c" width="640" height="480"></canvas>
  <div class="overlay" id="ov"><div>카메라 앞에서 손을 흔들어 방울을 터뜨려요</div><button id="start">시작</button></div>
</div>
<p>카메라 영상은 이 기기 안에서만 처리되고 어디에도 보내지 않아요. 화면은 거울처럼 보여요.</p>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),ctx=c.getContext('2d',{willReadFrequently:true});
const ov=document.getElementById('ov'),sc=document.getElementById('score'),tm=document.getElementById('time');
const W=640,H=480,S=8; // 모션 격자 크기
const off=document.createElement('canvas');off.width=W/S;off.height=H/S;const octx=off.getContext('2d',{willReadFrequently:true});
let prev=null,motion=null,bubbles=[],score=0,timeLeft=30,running=false,timer=null,pops=[];
const colors=['#7dd3fc','#f9a8d4','#a7f3d0','#fde68a','#c4b5fd'];

document.getElementById('start').onclick=async()=>{
  try{
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:W,height:H,facingMode:'user'},audio:false});
    await v.play();
  }catch(e){ov.innerHTML='<div>카메라를 열 수 없어요</div><div style="font-size:.9rem;font-weight:400">브라우저 주소창에서 카메라 허용을 눌러 주세요</div>';return;}
  ov.style.display='none';score=0;timeLeft=30;bubbles=[];running=true;
  sc.textContent='점수 0';tm.textContent='30초';
  timer=setInterval(()=>{timeLeft--;tm.textContent=timeLeft+'초';if(timeLeft<=0)end();},1000);
  requestAnimationFrame(loop);
};
function end(){running=false;clearInterval(timer);ov.style.display='flex';
  ov.innerHTML=`<div>끝! 점수 ${score}</div><button id="start">다시 하기</button>`;
  document.getElementById('start').onclick=()=>{ov.style.display='none';score=0;timeLeft=30;bubbles=[];running=true;sc.textContent='점수 0';tm.textContent='30초';timer=setInterval(()=>{timeLeft--;tm.textContent=timeLeft+'초';if(timeLeft<=0)end();},1000);requestAnimationFrame(loop);};
}
function detect(){
  octx.drawImage(v,0,0,off.width,off.height);
  const d=octx.getImageData(0,0,off.width,off.height).data;
  const n=off.width*off.height; if(!motion)motion=new Uint8Array(n);
  if(prev){for(let i=0;i<n;i++){const j=i*4;const diff=Math.abs(d[j]-prev[j])+Math.abs(d[j+1]-prev[j+1])+Math.abs(d[j+2]-prev[j+2]);motion[i]=diff>90?1:0;}}
  prev=new Uint8ClampedArray(d);
}
function motionAt(x,y,r){ // 거울 좌표 → 원본 격자
  let hit=0,tot=0;const gx=(W-x)/S,gy=y/S,gr=r/S;
  for(let yy=Math.max(0,gy-gr|0);yy<Math.min(off.height,gy+gr);yy++)for(let xx=Math.max(0,gx-gr|0);xx<Math.min(off.width,gx+gr);xx++){tot++;if(motion[yy*off.width+xx])hit++;}
  return tot?hit/tot:0;
}
function loop(){
  if(!running)return;
  detect();
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(v,0,0,W,H);ctx.restore();
  if(Math.random()<0.04&&bubbles.length<8)bubbles.push({x:40+Math.random()*(W-80),y:H+30,r:28+Math.random()*22,vy:1.2+Math.random()*1.5,col:colors[Math.random()*colors.length|0]});
  for(const b of bubbles){
    b.y-=b.vy;
    if(motion&&motionAt(b.x,b.y,b.r)>0.25){b.dead=true;score++;sc.textContent='점수 '+score;pops.push({x:b.x,y:b.y,r:b.r,t:1});}
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=b.col+'99';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.2,0,Math.PI*2);ctx.fillStyle='#fffc';ctx.fill();
  }
  bubbles=bubbles.filter(b=>!b.dead&&b.y>-40);
  for(const p of pops){p.t-=0.08;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.8-p.t*.8),0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,${p.t})`;ctx.lineWidth=4;ctx.stroke();}
  pops=pops.filter(p=>p.t>0);
  requestAnimationFrame(loop);
}
</script>
</body>
</html>

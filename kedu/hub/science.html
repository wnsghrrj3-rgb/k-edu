<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔬 과학 실험실</title>
<script src="/kedu_gate.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style id="kedu-title-font">/* 케이에듀 제목 폰트 토큰 — 교체 시 이 블록만 수정 (2026-07-04, 학교안심 모험가) */
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
</style>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--kedu-title);background:#F4F7FF;color:#1B3A57;padding:16px 14px 60px;}
  .wrap{max-width:860px;margin:0 auto;}
  h1{font-size:25px;text-align:center;color:#1565C0;margin:4px 0 2px;}
  .sub{text-align:center;font-size:13.5px;color:#6b8199;margin-bottom:16px;}
  /* 학년 선택 — 화면의 유일한 버튼 줄 */
  .filter{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
  .gbtn{font-family:inherit;font-size:15px;font-weight:800;padding:10px 17px;border-radius:999px;border:2.5px solid #DCE6F2;background:#fff;color:#5a7894;cursor:pointer;line-height:1;}
  .gbtn.on{background:#1565C0;border-color:#1565C0;color:#fff;}
  /* 아코디언 */
  .acc{background:#fff;border:2.5px solid #E3EAF5;border-radius:18px;margin-bottom:12px;overflow:hidden;}
  .acc-h{display:flex;align-items:center;gap:11px;padding:15px 17px;cursor:pointer;user-select:none;}
  .acc-h .ico{font-size:25px;}
  .acc-h .nm{font-size:18.5px;font-weight:800;flex:1;line-height:1.2;}
  .acc-h .nm small{display:block;font-size:12px;color:#8aa0b6;font-weight:800;margin-top:1px;}
  .acc-h .cnt{font-size:13px;font-weight:800;color:#1565C0;background:#E7F0FF;border-radius:999px;padding:5px 11px;}
  .acc-h .arr{font-size:15px;color:#B8C7D9;transition:transform .25s;}
  .acc.open .arr{transform:rotate(180deg);}
  .acc.empty{opacity:.38;pointer-events:none;}
  .acc-b{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .acc.open .acc-b{max-height:1600px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:2px 14px 15px;}
  /* 카드 = 버튼 없이 통째로 링크 */
  a.card{display:block;text-decoration:none;color:inherit;background:#F8FAFF;border:2px solid #E9EFF8;border-radius:14px;padding:12px 13px;transition:.13s;}
  a.card:active{transform:scale(.98);}
  a.card:hover{border-color:#1565C0;background:#fff;}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .card .cico{font-size:22px;}
  .card .cnm{font-size:16px;font-weight:800;line-height:1.15;flex:1;}
  .card .go{color:#B8C7D9;font-size:14px;}
  .card .meta{font-size:11.5px;font-weight:800;color:#6B3FD4;margin-bottom:4px;}
  .card .meta b{color:#1565C0;margin-right:6px;}
  .card .why{font-size:12px;color:#7e93a8;line-height:1.4;}
  a.card.hero{border-color:#FFB27D;background:#FFF9F3;}
  .hero .meta::after{content:'NEW';color:#E8590C;margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 과학 실험실</h1>
  <div class="sub">영역을 눌러 펼쳐 보세요 — 카드의 <b style="color:#1565C0;">학년·학기</b>와 <b style="color:#6B3FD4;">단원</b>이 "언제 쓰는지"예요</div>

  <div class="filter">
    <button class="gbtn on" data-g="all">전체</button>
    <button class="gbtn" data-g="3">3학년</button>
    <button class="gbtn" data-g="4">4학년</button>
    <button class="gbtn" data-g="5">5학년</button>
    <button class="gbtn" data-g="6">6학년</button>
  </div>

  <div id="areas"></div>

  <div class="acc" id="rmapAcc">
    <div class="acc-h" data-acc="rmap">
      <span class="ico">📚</span>
      <span class="nm">학년 로드맵<small>같은 주제가 학년마다 깊어져요 (나선형)</small></span>
      <span class="arr">▼</span>
    </div>
    <div class="acc-b"><div style="padding:2px 17px 15px;font-size:13px;color:#5a7894;line-height:2;">
      <b style="color:#1565C0;">3학년</b> 물질의 상태 · 자석 · 동물 한살이 · 소리<br>
      <b style="color:#1565C0;">4학년</b> 식물 한살이 · 지층과 화석 · 화산과 지진 · 물의 상태변화 · 전기<br>
      <b style="color:#1565C0;">5학년</b> 온도와 열 · 태양계와 별 · 용해와 용액 · 물체의 운동 · 산과 염기 · 생물과 환경<br>
      <b style="color:#1565C0;">6학년</b> 지구와 달의 운동 · 빛 · 연소와 소화 · 계절의 변화 · 우리 몸
    </div></div>
  </div>
</div>

<script>
(function(){
  var TOOLS={
    earth:[
      {t:'earthsun',ico:'🌏',nm:'지구와 태양 — 발견의 여정',gr:[6],unit:'지구와 달·계절 (심화)',why:'자전·공전·계절·남중고도를 한 무대에서. 하루 살아보기 → 계절의 범인 찾기.',hero:true,proto:'/labs/earthsun_proto.html'},
      {t:'earth',ico:'🌍',nm:'지구 자전·낮밤',gr:[6],unit:'6-1 지구와 달의 운동',why:'지구가 돌아 낮과 밤이 생기는 원리.'},
      {t:'moon',ico:'🌙',nm:'달의 위상',gr:[6],unit:'6-1 지구와 달의 운동',why:'달 모양이 변하는 까닭 + 일식·월식 실험.'},
      {t:'season',ico:'🍂',nm:'계절의 변화',gr:[6],unit:'6-2 계절의 변화',why:'자전축 기울기가 만드는 사계절.'},
      {t:'solar',ico:'☀️',nm:'태양계와 별',gr:[5],unit:'5-1 태양계와 별',why:'8행성 실제 비율 여행.'},
      {t:'constellation',ico:'✨',nm:'계절별 별자리',gr:[5],unit:'5-1 태양계와 별',why:'계절마다 다른 별자리와 북극성.'},
      {t:'volcano',ico:'🌋',nm:'화산과 지진',gr:[4],unit:'4-2 화산과 지진',why:'3D 분출 · 화성암 · 지진 대비.'},
      {t:'strata',ico:'🪨',nm:'지층과 화석',gr:[4],unit:'4-1 지층과 화석',why:'산에서 조개가 나오는 까닭.'}
    ],
    matter:[
      {t:'states',ico:'🧊',nm:'물질의 상태',gr:[3],unit:'3-1 물질의 상태',why:'고체·액체·기체 — 밀폐하면 무게 그대로!'},
      {t:'melt',ico:'💧',nm:'물의 상태변화',gr:[4],unit:'4-2 물의 상태변화',why:'얼음↔물↔수증기, 증발과 응결.'},
      {t:'dissolve',ico:'🥄',nm:'용해와 용액',gr:[5],unit:'5-1 용해와 용액',why:'식히면 설탕이 도로 나오는 재결정!'},
      {t:'acid',ico:'🧪',nm:'산과 염기',gr:[5],unit:'5-2 산과 염기',why:'중화점에서 색이 확 뒤집혀요.'},
      {t:'burn',ico:'🔥',nm:'연소와 소화',gr:[6],unit:'6-2 연소와 소화',why:'기름 불엔 물 금지!'},
      {t:'heat',ico:'🌡️',nm:'열의 이동',gr:[5],unit:'5-1 온도와 열',why:'전도·대류·복사로 열이 가는 길.'}
    ],
    life:[
      {t:'animal',ico:'🦋',nm:'동물의 한살이',gr:[3],unit:'3-2 동물의 한살이',why:'어른벌레는 더 안 자라요.'},
      {t:'plant',ico:'🌱',nm:'식물의 한살이',gr:[4],unit:'4-1 식물의 한살이',why:'빛 없이도 싹이 틀까?'},
      {t:'foodchain',ico:'🦅',nm:'먹이사슬·먹이그물',gr:[5],unit:'5-2 생물과 환경',why:'포식자를 없애면 생태계 연쇄 붕괴!'},
      {t:'bodysys',ico:'🫁',nm:'우리 몸 기관계',gr:[6],unit:'6-2 우리 몸의 구조와 기능',why:'소화·호흡·순환·배설이 잇는 길.'}
    ],
    force:[
      {t:'magnet',ico:'🧲',nm:'자석의 성질',gr:[3],unit:'3-1 자석의 이용',why:'반으로 잘라도 양쪽 다 N·S극!'},
      {t:'sound',ico:'🔊',nm:'소리의 성질',gr:[3],unit:'3-2 소리의 성질',why:'진동이 만드는 소리의 높낮이.'},
      {t:'circuit',ico:'💡',nm:'전기 회로',gr:[4],unit:'4-2 전기의 이용',why:'전구를 늘리면 오히려 어두워져요.'},
      {t:'motion',ico:'🏃',nm:'물체의 운동',gr:[5],unit:'5-2 물체의 운동',why:'속력 = 거리 ÷ 시간.'},
      {t:'light',ico:'🔦',nm:'빛의 성질',gr:[6],unit:'6-1 빛과 렌즈',why:'직진·반사·굴절과 그림자.'}
    ]
  };
  var AREAS=[
    {k:'earth',ico:'🌏',nm:'지구와 우주',desc:'지구·달·태양·별과 우리 땅'},
    {k:'matter',ico:'🧪',nm:'물질과 변화',desc:'상태·용해·산염기·연소'},
    {k:'life',ico:'🌱',nm:'생명',desc:'식물·동물·생태계·우리 몸'},
    {k:'force',ico:'⚡',nm:'힘과 에너지',desc:'자석·전기·빛·소리·운동'}
  ];
  function toBand(g){ return g<=3?'low':g<=4?'mid':'high'; }
  var host=document.getElementById('areas'), curG='all', openK='earth';

  function link(x){
    if(x.proto)return x.proto;
    var g=(curG==='all')?x.gr[0]:+curG;
    return '../teacher/klab.html?tool='+encodeURIComponent(x.t)+'&label='+encodeURIComponent(x.nm)+'&grade='+toBand(g)+'&from=hub';
  }
  function render(){
    host.innerHTML='';
    AREAS.forEach(function(A){
      var items=TOOLS[A.k].filter(function(x){return curG==='all'||x.gr.indexOf(+curG)>=0;});
      var acc=document.createElement('div');
      acc.className='acc'+(items.length===0?' empty':'')+((openK===A.k&&items.length)?' open':'');
      acc.innerHTML='<div class="acc-h" data-k="'+A.k+'">'
        +'<span class="ico">'+A.ico+'</span>'
        +'<span class="nm">'+A.nm+'<small>'+A.desc+'</small></span>'
        +'<span class="cnt">'+items.length+'개</span><span class="arr">▼</span></div>'
        +'<div class="acc-b"><div class="grid">'
        +items.map(function(x){
          return '<a class="card'+(x.hero?' hero':'')+'" href="'+link(x)+'">'
            +'<div class="top"><span class="cico">'+x.ico+'</span><span class="cnm">'+x.nm+'</span><span class="go">›</span></div>'
            +'<div class="meta"><b>'+x.gr.map(function(g){return g+'학년';}).join('·')+'</b>'+x.unit+'</div>'
            +'<div class="why">'+x.why+'</div></a>';
        }).join('')
        +'</div></div>';
      host.appendChild(acc);
    });
    document.querySelectorAll('.acc-h[data-k]').forEach(function(h){
      h.onclick=function(){
        var k=h.dataset.k;
        openK=(openK===k)?null:k;
        document.querySelectorAll('.acc[class]').forEach(function(a){
          var hk=a.querySelector('.acc-h[data-k]');
          if(hk)a.classList.toggle('open',hk.dataset.k===openK);
        });
      };
    });
  }
  document.querySelectorAll('.gbtn').forEach(function(b){
    b.onclick=function(){ curG=b.dataset.g;
      document.querySelectorAll('.gbtn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      // 학년 고르면: 도구가 있는 첫 영역을 자동으로 펼침
      var first=null;
      AREAS.forEach(function(A){ if(first)return;
        if(TOOLS[A.k].some(function(x){return curG==='all'||x.gr.indexOf(+curG)>=0;}))first=A.k; });
      openK=first; render(); };
  });
  // 로드맵 아코디언
  document.querySelector('[data-acc="rmap"]').onclick=function(){
    document.getElementById('rmapAcc').classList.toggle('open');
  };
  render();
})();
</script>
</body>
</html>

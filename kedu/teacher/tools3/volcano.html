<!--
  케이랩 v3 · A트랙 — 화산과 지진 (2026-07-11 · 페이블)

    ④ 즉각 반응(압력→산체 발광, 분출 파티클, 지진 판 휨→파단)
    ⑤ 🔴 용암 강(신기술 — 분화구→기슭 3줄기 setDrawRange 성장 + 식으면 현무암색 굳음, E-2 검증 기법)
  v2 무손실: 학년칸(저/중/고)·미션(2/4/4)·퀴즈 5문·만약에 3종(끈적마그마·가스갇힘·티끌지진)
    ·변수 슬라이더(점성·힘세기)·예측 무장/해소·예측 노트 칩(5칩 토스트)·분출물 3종·현무암/화강암·단면 보기.
  config: ?grade=low|mid|high(지정 시 잠금) · ?mode=free|mission|quiz|whatif
-->

<script>
(function(){
  'use strict';

  /* ── 학년 칸 (v2 GRADES 무손실) ── */
  var GRADES={
    low:  { modes:['free','mission'],                 exps:['volcano'],         cool:'none',   cut:false, ejecta:false, wif:[],                               v2:false },
    mid:  { modes:['free','mission','quiz','whatif'], exps:['volcano','quake'], cool:'basalt', cut:false, ejecta:true,  wif:['slowforce'],                    v2:false },
    high: { modes:['free','mission','quiz','whatif'], exps:['volcano','quake'], cool:'all',    cut:true,  ejecta:true,  wif:['sticky','gasblock','slowforce'], v2:true }
  };

  /* ── 미션 (v2 문구·판정 무손실 — check는 상태 st를 받는 순수 함수) ── */
  var LOW_MISSIONS=[
    { exp:'volcano', text:'🔥 <b>압력 키우기</b>를 눌러 땅속 마그마를 밀어 올려요!',
      check:function(st){ return st.exp==='volcano' && st.vol.press>=20; } },
    { exp:'volcano', text:'계속 눌러 압력을 가득 채우면 — 펑! <b>화산이 분출</b>해요!',
      check:function(st){ return st.exp==='volcano' && st.vol.erupting; } }
  ];
  var MID_MISSIONS=[
    { exp:'volcano', text:'🔥 <b>압력 키우기</b>로 마그마 압력을 채워 <b>화산 분출</b>!',
      check:function(st){ return st.exp==='volcano' && st.vol.erupting; } },
    { exp:'volcano', text:'분출물 <b>용암·화산재·화산 가스</b> 라벨을 모두 눌러 이름을 확인해요!',
      check:function(st){ return st.exp==='volcano' && st.vol.erupting && st.vol.seen.lava && st.vol.seen.ash && st.vol.seen.gas; } },
    { exp:'volcano', text:'🪨 빨리 식히면 굳어서 <b>현무암</b>이 돼요 — 만들어 봐요!',
      check:function(st){ return st.exp==='volcano' && st.vol.made.basalt; } },
    { exp:'quake', text:'➡️ <b>힘 가하기</b>로 땅을 끊어 <b>지진</b>을 일으켜요!',
      check:function(st){ return st.exp==='quake' && st.qk.broken; } }
  ];
  var HIGH_MISSIONS=[
    { exp:'volcano', text:'🔥 <b>압력 키우기</b>를 눌러 마그마 방 압력을 한계까지 — <b>화산 분출</b>!',
      check:function(st){ return st.exp==='volcano' && st.vol.erupting; } },
    { exp:'volcano', text:'분출물 <b>용암·화산재·화산 가스</b> 라벨을 모두 눌러 이름을 확인해 봐요!',
      check:function(st){ return st.exp==='volcano' && st.vol.erupting && st.vol.seen.lava && st.vol.seen.ash && st.vol.seen.gas; } },
    { exp:'volcano', text:'🪨 빨리 식혀 <b>현무암</b>, 💎 천천히 식혀 <b>화강암</b> — 둘 다 만들어 봐요!',
      check:function(st){ return st.exp==='volcano' && st.vol.made.basalt && st.vol.made.granite; } },
    { exp:'quake', text:'➡️ <b>힘 가하기</b>를 계속 눌러 땅을 끊어 봐요 — <b>지진</b> 발생!',
      check:function(st){ return st.exp==='quake' && st.qk.broken; } }
  ];
  var MISSIONS={ low:LOW_MISSIONS, mid:MID_MISSIONS, high:HIGH_MISSIONS };

  /* ── 퀴즈 5문 (v2 무손실) ── */
  var QUIZ=[
    { pic:'volcano', q:'땅속 깊은 곳에서 암석이 녹아 있는 것을 무엇이라고 할까요?', ch:['마그마','용암','화산재'], a:0 },
    { pic:'volcano', q:'마그마가 땅 위로 흘러나온 것을 무엇이라고 할까요?', ch:['용암','마그마','화산 가스'], a:0 },
    { pic:'volcano', q:'표면에서 빨리 식어 구멍이 송송 뚫린 어두운 암석은?', ch:['현무암','화강암','대리암'], a:0 },
    { pic:'volcano', q:'땅속 깊은 곳에서 천천히 식어 알갱이가 큰 암석은?', ch:['화강암','현무암','석회암'], a:0 },
    { pic:'quake', q:'건물 안에서 지진이 났을 때 가장 올바른 행동은?', ch:['책상 아래로 들어가 머리 보호','창문 옆에 서 있기','엘리베이터 타고 내려가기'], a:0 }
  ];

  /* ── 만약에 3종 (v2 무손실) — cond(st)=해소 조건, play(sim)=상태 세팅 ── */
  var WHATIF={
    sticky:{ icon:'🍯', title:'아주 끈적한 마그마라면?',
      q:'묽은 마그마와 끈적한 마그마 — 어느 쪽이 더 크게 터질까요?',
      ch:['묽고 뜨거운 쪽이 크게 터져요','끈적한 쪽이 막혔다가 훨씬 크게 터져요','점성은 상관없어요'], a:1,
      reveal:'끈적한 마그마는 가스가 못 빠져나가 압력이 안에 갇혀요! 사이다 병을 흔들고 꽉 막아 둔 것처럼 — 통로가 막혔다가 뻥! 훨씬 크게 폭발해요. 묽은 마그마는 가스가 술술 빠져 조용히 흘러내리죠.',
      tip:'🔥 압력을 계속 키워 봐요 — 100%가 넘어도 막혀 있다가…!',
      play:function(sim){ sim.state.exp='volcano'; sim.volReset(); sim.state.sealed=false; sim.state.visc=1; },
      cond:function(st){ return st.exp==='volcano' && st.vol.erupting; } },
    gasblock:{ icon:'🫧', title:'가스가 빠질 구멍이 하나도 없다면?',
      q:'가스가 빠질 구멍을 몽땅 막아 버리면, 분출도 없어질까요?',
      ch:['분출이 아예 없어져요','산이 통째로 날아가는 초대형 폭발이 나요','지금과 똑같아요'], a:1,
      reveal:'압력은 사라지지 않고 계속 쌓여요! 구멍을 막으면 분출이 없어지는 게 아니라 산체가 통째로 날아가는 대폭발이 돼요. 화산 분출은 지구가 속의 압력을 빼내는 방법이에요.',
      tip:'구멍을 꽉 막았어요. 🔥 압력을 끝까지 쌓아 봐요…!',
      play:function(sim){ sim.state.exp='volcano'; sim.volReset(); sim.state.sealed=true; sim.state.visc=0.5; },
      cond:function(st){ return st.exp==='volcano' && st.vol.erupting; } },
    slowforce:{ icon:'⏳', title:'힘을 아주 조금씩만 가한다면?',
      q:'땅을 살살, 조금씩만 밀면 지진이 안 날까요?',
      ch:['살살 밀면 지진이 안 나요','천천히 쌓여도 한계가 오면 결국 끊어져요','오히려 더 크게 나요'], a:1,
      reveal:'힘의 크기가 아니라 쌓인 양이 정해요! 조금씩이라도 계속 쌓이면 한계에서 결국 우지끈. 그래서 지진은 예고 없이 와요 — 평소에 대비해 두는 게 답이에요.',
      tip:'➡️ 약한 힘을 여러 번 — 게이지가 천천히 차다가 결국…!',
      play:function(sim){ sim.state.exp='quake'; sim.qkReset(); sim.state.qforce=0; },
      cond:function(st){ return st.exp==='quake' && st.qk.broken; } }
  };

  /* ── 예측 무장 2종 (v2 3층 무손실) — 정답 선택지=1 ── */
  var PRED={
    visc:{ q:'예측 먼저! 어떤 마그마가 더 크게 터질까요?',
      ch:['묽고 뜨거운 마그마','끈적끈적한 마그마','점성은 상관없다'],
      tip:'슬라이더를 🍯 끈적 끝까지 밀고 🔥 압력을 한계까지 채워 봐요!' },
    qf:{ q:'예측 먼저! 아주 약한 힘만 계속 가하면 어떻게 될까요?',
      ch:['지진이 안 난다','조금씩 쌓여 결국 끊어진다','땅이 더 단단해진다'],
      tip:'힘 세기를 🪶 약 끝까지 내리고 ➡️ 계속 밀어 봐요!' }
  };
  var CHIPNM={sticky:'🍯 끈적마그마',gasblock:'🫧 가스갇힘',slowforce:'⏳ 티끌지진',visc:'🌡 점성실험',qf:'🪶 약한힘실험'};

  /* ── 시뮬 생성 ── */
  function createSim(grade){
    grade=(['low','mid','high'].indexOf(grade)>=0)?grade:'high';
    var sim={};
    sim.grade=grade;
    sim.G=function(){ return GRADES[sim.grade]; };
    sim.state={ exp:'volcano', vol:null, qk:null, visc:0.5, qforce:0.5, sealed:false, cut:false };
    sim.volReset=function(){ sim.state.vol={ press:0, erupting:false, style:'', flowT:0, hardT:0,
      seen:{lava:false,ash:false,gas:false}, made:{basalt:false,granite:false} }; };
    sim.qkReset=function(){ sim.state.qk={ stress:0, broken:false, pushes:0 }; };
    sim.v2reset=function(){ sim.state.visc=0.5; sim.state.qforce=0.5; sim.state.sealed=false; };
    sim.resetAll=function(){ sim.state.exp='volcano'; sim.state.cut=false; sim.volReset(); sim.qkReset(); };
    sim.resetAll();

    /* v2 변수 물리 (무손실): 한계 압력=밀봉160 / 60+점성*80 · 분출 형태 · 힘 증가량 */
    sim.thrOf=function(){ return sim.state.sealed?160:Math.round(60+sim.state.visc*80); };
    sim.styleOf=function(){ var s=sim.state; return s.sealed?'mega':(s.visc>=0.7?'boom':(s.visc<0.35?'quiet':'normal')); };
    sim.pushInc=function(){ return 8+Math.round(sim.state.qforce*24); };
    sim.viscName=function(){ var v=sim.state.visc; return (v>=0.7?'🍯 끈적':(v<0.35?'💧 묽음':'중간'))+' · 한계 '+sim.thrOf()+'%'; };
    sim.qfName=function(){ var q=sim.state.qforce; return (q<=0.3?'🪶 약':(q>=0.7?'💪 강':'중간'))+' · 한 번 +'+sim.pushInc()+'%'; };

    /* 조작 */
    sim.pump=function(){
      var v=sim.state.vol;
      if(v.erupting) return {act:'already'};
      var thr=sim.thrOf();
      v.press=Math.min(thr, v.press+20);
      if(v.press>=thr){ v.erupting=true; v.style=sim.styleOf(); return {act:'erupt', style:v.style}; }
      return {act:'pump', press:v.press};
    };
    sim.cool=function(kind){
      var v=sim.state.vol;
      if(!v.erupting) return {act:'blocked'};
      v.made[kind]=true;
      return {act:'made', kind:kind};
    };
    sim.see=function(k){ sim.state.vol.seen[k]=true; return {act:'seen', k:k}; };
    sim.push=function(){
      var q=sim.state.qk;
      if(q.broken) return {act:'already'};
      q.pushes++;
      q.stress=Math.min(100, q.stress+sim.pushInc());
      if(q.stress>=100){ q.broken=true; return {act:'broke'}; }
      return {act:'push', stress:q.stress};
    };

  }
  plateL = makePlate(-1); plateR = makePlate(1);
  function prop(parent, x, z, build) { const g = new THREE.Group(); g.position.set(x, 0.042, z); build(g); parent.add(g); }
  const wallM = new THREE.MeshStandardMaterial({ color: 0xE8E2D6, roughness: 0.85 });
  const roofM = new THREE.MeshStandardMaterial({ color: 0xB9522F, roughness: 0.8 });
  const leafM = new THREE.MeshStandardMaterial({ color: 0x2E7D4F, roughness: 0.9 });
  const trunkM = new THREE.MeshStandardMaterial({ color: 0x6b4b2e, roughness: 0.95 });
  prop(plateL, -0.1, 0.05, g => { // 집
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.05, 0.06), wallM); b.position.y = 0.025; b.castShadow = true; g.add(b);
    const r = new THREE.Mesh(new THREE.ConeGeometry(0.052, 0.035, 4), roofM); r.position.y = 0.068; r.rotation.y = Math.PI / 4; r.castShadow = true; g.add(r);
  });
  prop(plateL, 0.06, -0.12, g => { // 나무
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.009, 0.035, 8), trunkM); t.position.y = 0.017; g.add(t);
    const l = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.06, 8), leafM); l.position.y = 0.062; l.castShadow = true; g.add(l);
  });
  prop(plateR, 0.06, 0.02, g => { // 학교
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.06, 0.07), wallM); b.position.y = 0.03; b.castShadow = true; g.add(b);
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.05, 0.008), new THREE.MeshStandardMaterial({ color: 0x9aa4ae })); f.position.set(0.045, 0.085, 0); g.add(f);
  });
  prop(plateR, -0.08, -0.15, g => { // 나무
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.009, 0.035, 8), trunkM); t.position.y = 0.017; g.add(t);
    const l = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.065, 8), leafM); l.position.y = 0.065; l.castShadow = true; g.add(l);
  });
  // 단층 균열 (파단 후)
  crackMesh = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.075, 0.52), new THREE.MeshStandardMaterial({ color: 0x241812, roughness: 1 }));
  crackMesh.position.set(0, 0.062, 0); crackMesh.visible = false; quakeGroup.add(crackMesh);
  // 힘 화살표
  function arrow(dir) {
    const g = new THREE.Group();
    const m = new THREE.MeshStandardMaterial({ color: 0x9B7BF5, emissive: 0x5a3fd0, emissiveIntensity: 0.6, roughness: 0.5 });
    const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.1, 10), m);
    sh.rotation.z = Math.PI / 2; g.add(sh);
    const hd = new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.05, 12), m);
    hd.rotation.z = -dir * Math.PI / 2; hd.position.x = dir * 0.07; g.add(hd);
    g.position.set(-dir * 0.56, 0.1, 0);
    quakeGroup.add(g); return g;
  }
  arrowL = arrow(1); arrowR = arrow(-1);
}

async function startWif(key) {
  wifKey = key; wifChoice = -1; wifRevealed = false; wifPlaying = false;
  const W = Sim.WHATIF[key];
  renderWifPick();
  K3.sound.play('select');
  wifChoice = await K3.cards.predict(W.q, W.ch.map((c, i) => ({ id: i, label: c })));
  W.play(sim);
  wifPlaying = true;
  syncExpScene();
  renderAll();
  K3.toast(W.icon + ' ' + W.tip, false, T(4200));
}
function wifResolve() {
  if (!wifKey || wifRevealed || !wifPlaying) return;
  const W = Sim.WHATIF[wifKey];
  if (!W.cond(sim.state)) return;
  wifRevealed = true;
  sim.wifChip(wifKey, wifChoice);
  const hit = wifChoice === W.a;
  K3.sound.play(hit ? 'chime' : 'pop');
  chipToast();
  setTimeout(() => {
    K3.cards.result(
      `<h3 style="color:${hit ? '#0d7a5c' : '#B9522F'}">${hit ? '🎯 예측 적중!' : '🤔 예측과 달랐죠?'}</h3>
       <p style="font-size:13px;line-height:1.7;color:#41546a">${W.reveal}</p>`,
      [{ label: '계속 실험', cls: 'pri', value: 0 }, { label: '🌀 다른 만약에', value: 1 }]
    ).then(v => { if (v === 1) act('wifBack'); else renderAll(); });
    renderChips();
  }, T(1100));
}

/* 예측 무장 (free · v2) */
async function armPred(kind) {
  if (mode !== 'free' || !sim.G().v2) return;
  if (!sim.predArm(kind)) return;
  const P = Sim.PRED[kind];
  K3.sound.play('select');
  const ch = await K3.cards.predict(P.q, P.ch.map((c, i) => ({ id: i, label: c })));
  sim.predChoose(kind, ch);
  K3.toast('📝 예측 접수! ' + P.tip, false, T(4200));
}
function resolvePreds() {
  sim.checkPred().forEach(r => {
    const msg = r.kind === 'visc'
      ? (r.hit ? '✔ 예측 적중 — 끈적한 마그마가 훨씬 크게! 가스가 갇혀 압력이 폭발적으로 터져요.'
               : '✘ 예측 빗나감 — 끈적할수록 크게 터져요! 가스가 못 빠져나가 압력이 갇혔다가 한꺼번에 터지거든요.')
      : (r.hit ? '✔ 예측 적중 — 약해도 쌓이면 결국 끊어져요! 지진은 힘의 크기가 아니라 쌓인 양이 정해요.'
               : '✘ 예측 빗나감 — 약한 힘도 계속 쌓이면 결국 우지끈! 쌓인 양이 지진을 정해요.');
    K3.sound.play(r.hit ? 'chime' : 'pop');
    K3.toast(msg, !r.hit, T(4600));
  });
  renderChips(); chipToast();
}
function chipToast() {
  if (sim.chips.length === 5) setTimeout(() => { K3.sound.play('ting'); K3.toast('🌋 꼬마 화산학자 — 오늘 가설 5개를 실험했어요!'); }, T(600));
}

    if (r.act === 'erupt') {
      const EM = { quiet: '🌋 스르륵~ 묽은 용암이 조용히 흘러넘쳐요 (넓적한 순상 화산)',
                   boom: '💥 콰콰콰쾅!! 막혔던 통로가 뚫리며 대폭발! (뾰족한 종상 화산)',
                   mega: '💥💥 빠질 곳 없던 압력이 산을 통째로 날렸어요!! 초대형 폭발!',
                   normal: '🌋 콰과광! 화산이 분출했어요!' };
      K3.sound.play('whoosh'); K3.sound.play('pop');
      K3.toast(EM[r.style] || EM.normal, false, T(3800));
      resolvePreds(); wifResolve();
    } else K3.sound.play('charge');
  }
  else if (a === 'basalt' || a === 'granite') {
    const r = sim.cool(a);
    if (r.act === 'blocked') { K3.toast('먼저 화산을 분출시켜야 해요!', true); return; }
    K3.sound.play('pop');
    K3.toast(a === 'basalt' ? '🪨 표면에서 빨리 식어 현무암! 구멍이 송송' : '💎 땅속에서 천천히 식어 화강암! 알갱이가 커요');
  }
  else if (a === 'cut') {
    st.cut = !st.cut;
    controls.target.set(0, st.cut ? UG * 0.7 + 0.05 : 0.2, 0); controls.update();
    K3.sound.play('select');
    syncExpScene();
  }
  else if (a === 'volReset') { sim.volReset(); resetRivers(); K3.sound.play('tap'); }
  else if (a === 'push') {
    const r = sim.push();
    if (r.act === 'already') { K3.toast('이미 끊어졌어요! ↺ 새 땅으로', true); return; }
    if (r.act === 'broke') {
      K3.sound.play('whoosh'); quakeShake = 1.1;
      K3.toast('🌍 우지끈! 땅이 끊어지며 지진!', false, T(3400));
      resolvePreds(); wifResolve();
    } else K3.sound.play('charge');
  }
  else if (a === 'qkReset') { sim.qkReset(); quakeShake = 0; K3.sound.play('tap'); }
  else if (a === 'wifBack') {
    wifKey = null; wifPlaying = false; wifRevealed = false;
    sim.resetAll(); sim.v2reset(); K3.cards.hide(); syncExpScene(); renderAll(); return;
  }
  if (mode === 'mission') missionTick();
  renderCtrls(); renderStatus();
}
function doSee(k) {
  sim.see(k);
  K3.sound.play('tap');
  const M = { lava: '🔥 용암 — 마그마가 땅 위로 흘러나온 것!', ash: '🌫️ 화산재 — 잘게 부서진 돌가루가 하늘 높이!', gas: '💨 화산 가스 — 수증기 등 여러 기체!' };
  K3.toast(M[k]);
  if (mode === 'mission') missionTick();
}
function missionTick() {
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  if (r.act === 'next') setTimeout(() => { resetRivers(); syncExpScene(); renderAll(); }, T(1300));
  else setTimeout(() => renderAll(), T(1300));
}

function setGrade(g) {
  sim.grade = g;
  mode = 'free';
  wifKey = null; wifPlaying = false;
  sim.resetAll(); sim.v2reset(); sim.mStep = 0; sim.mDone = false;
  K3.cards.hide(); resetRivers(); syncExpScene(); renderAll();
}
function setMode(m) {
  mode = m;
  wifKey = null; wifPlaying = false; wifRevealed = false;
  sim.resetAll(); sim.v2reset(); K3.cards.hide(); resetRivers();
  if (m === 'mission') sim.missionStart();
  if (m === 'quiz') { quizScore = 0; quizCount = 0; quizUsed = []; newQuiz(); }
  syncExpScene(); renderAll();
}
function setExp(e) {
  sim.state.exp = e;
  syncExpScene(); renderAll();
}
function resetRivers() { rivers.forEach(r => { r.tube.geometry.setDrawRange(0, 0); r.mat.color.copy(LAVA_HOT); }); }
function syncExpScene() {
  const st = sim.state;
  const showExp = mode === 'quiz' ? Sim.QUIZ[quizIdx].pic : st.exp;
  const vol = showExp === 'volcano';
  volGroup.visible = vol && !(st.cut && sim.G().cut);
  cutGroup.visible = vol && st.cut && sim.G().cut && mode !== 'quiz';
  quakeGroup.visible = !vol;
  if (!vol) { controls.target.set(0, 0.1, 0); controls.update(); }
  else if (!st.cut) { controls.target.set(0, 0.2, 0); controls.update(); }
}
function renderAll() {
  renderHUD(); renderCtrls(); renderBar(); renderV2(); renderQuiz(); renderWifPick(); renderChips(); renderStatus();
  syncExpScene();
}

/* ═══════════ 루프 ═══════════ */
const clock = new THREE.Clock();
let gI = 0, volShake = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const st = sim.state, v = st.vol;
  sim.tick(dt);

  const cooled = v.made.basalt || v.made.granite;
  const styleMul = { quiet: 0.4, normal: 1, boom: 1.9, mega: 2.8 }[v.style] || 1;
  const strength = v.erupting ? (cooled ? 0.18 : styleMul) : 0;

  // 발광 램프
  const gT = v.erupting ? (cooled ? 0.5 : 1.1) : (v.press / 100) * 0.4;
  gI += (gT - gI) * Math.min(1, dt * 6);
  lavaLight.intensity = gI * (1.2 + v.flowT) * (1 - v.hardT * 0.8);
  throatMat.opacity += ((v.erupting ? 1 : v.press / 150) - throatMat.opacity) * Math.min(1, dt * 6);
  craterGlowMat.opacity += ((v.erupting ? 0.9 : v.press / 200) - craterGlowMat.opacity) * Math.min(1, dt * 6);
  throat.scale.setScalar(0.8 + gI * 0.3);
  const eT = v.erupting ? (cooled ? 0.5 : 2.3) : (v.press / 100) * 1.3;
  volMat.emissiveIntensity += (eT - volMat.emissiveIntensity) * Math.min(1, dt * 4);

  // 🔴 용암 강 — 성장 + 굳음
  rivers.forEach(r => {
    r.tube.geometry.setDrawRange(0, Math.floor(r.total * Math.min(1, v.flowT / Math.max(0.001, r.stag)) * r.stag));
    r.mat.color.copy(LAVA_HOT).lerp(LAVA_ROCK, v.hardT);
  });

  // 산체 흔들림
  const trembling = (!v.erupting && v.press >= 60) || (v.erupting && !cooled);
  const shakeCap = { quiet: 0.003, normal: 0.007, boom: 0.011, mega: 0.017 }[v.style] || 0.007;
  volShake = trembling ? Math.min(shakeCap, volShake + dt * 0.02) : Math.max(0, volShake - dt * 0.03);
  mountain.position.x = (Math.random() - 0.5) * volShake;
  mountain.position.z = (Math.random() - 0.5) * volShake;

  // 파티클
  if (strength > 0) {
    emit(sysLava, Math.round(5 * strength), spawnLava);
    emit(sysAsh, Math.round(3 * strength), spawnAsh);
    emit(sysGas, Math.round(2 * strength), spawnGas);
  } else if (v.press > 0 && Math.random() < 0.35) emit(sysGas, 1, spawnGas);
  stepSys(sysLava, dt, 1.15, fadeLava, 0.002);
  stepSys(sysAsh, dt, 0.05, fadeAsh);
  stepSys(sysGas, dt, 0.08, fadeGas);

  // 단면
  if (cutGroup.visible) {
    const now = performance.now();
    const pulse = 0.93 + Math.sin(now * 0.004) * 0.06 + gI * 0.06;
    cutChamber.scale.set(1.7 * pulse, 1.0 * pulse, 0.5);
    cutChamber.material.color.setRGB(1, 0.30 + 0.12 * (0.5 + 0.5 * Math.sin(now * 0.006)), 0.09);
    cutHalo.material.opacity = 0.45 + 0.32 * (v.press / 100) + (v.erupting ? 0.18 : 0);
    cutConduit.material.opacity = 0.45 + 0.5 * (v.erupting ? 1 : v.press / 100);
    cutPool.material.opacity = v.erupting ? 1 : Math.min(1, 0.3 + v.press / 150);
    cutGranite.visible = !!v.made.granite;
    cutBasalt.visible = !!v.made.basalt;
    if ((v.press > 0 || v.erupting) && Math.random() < 0.4) emit(cutBubbles, 1, spawnBubble);
    stepSys(cutBubbles, dt, 0, fadeBubble);
  }

  // 지진 판
  if (quakeGroup.visible) {
    const q = st.qk;
    const bend = q.broken ? 0 : q.stress * 0.0009;
    plateL.rotation.z = bend; plateR.rotation.z = -bend;
    plateL.position.y = q.broken ? 0.028 : 0.06;
    crackMesh.visible = q.broken;
    arrowL.visible = arrowR.visible = !q.broken;
    const tremQ = (!q.broken && q.stress >= 60) ? 0.003 : 0;
    quakeShake = Math.max(tremQ, quakeShake - dt * 0.9);
    quakeGroup.position.x = (Math.random() - 0.5) * quakeShake * (quakeShake > 0.01 ? 1 : 0.4);
    quakeGroup.position.z = (Math.random() - 0.5) * quakeShake * (quakeShake > 0.01 ? 1 : 0.4);
    const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.06;
    arrowL.scale.setScalar(pulse); arrowR.scale.setScalar(pulse);
  }

  // 라벨 투영
  const showChips = volGroup.visible && v.erupting && sim.G().ejecta && mode !== 'quiz';
  projectAnno(chipLava, mountain, _tmp.set(0.19, 0.12, 0.12), showChips);
  projectAnno(chipAsh, mountain, _tmp2.set(0, VOL.rimY + 0.3, 0), showChips);
  projectAnno(chipGas, mountain, _tmp3.set(0.14, VOL.rimY + 0.13, 0.05), showChips);
  if (showChips) {
    chipLava.innerHTML = '🔥 용암' + (v.seen.lava ? ' ✓' : '');
    chipAsh.innerHTML = '🌫️ 화산재' + (v.seen.ash ? ' ✓' : '');
    chipGas.innerHTML = '💨 화산 가스' + (v.seen.gas ? ' ✓' : '');
  }
  const cutOn = cutGroup.visible;
  projectAnno(labMag, cutGroup, _tmp4.set(0, -0.155, CUT_D / 2), cutOn);
  projectAnno(labCon, cutGroup, _tmp5.set(0, 0.04, CUT_D / 2), cutOn);
  projectAnno(labCra, cutGroup, _tmp6.set(0, VOL.craterY + 0.03, CUT_D / 2), cutOn);
  projectAnno(labBas, cutGroup, _tmp7.set(0.135, 0.17, CUT_D / 2), cutOn && v.made.basalt);
  projectAnno(labGra, cutGroup, _tmp8.set(0.115, -0.1, CUT_D / 2), cutOn && v.made.granite);
  // 암석 결과 카드
  $('rockBas').style.display = (volGroup.visible && v.made.basalt) ? '' : 'none';
  $('rockGra').style.display = (volGroup.visible && v.made.granite) ? '' : 'none';

  updateGauge();
  controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}
const _tmp = new THREE.Vector3(), _tmp2 = new THREE.Vector3(), _tmp3 = new THREE.Vector3(),
      _tmp4 = new THREE.Vector3(), _tmp5 = new THREE.Vector3(), _tmp6 = new THREE.Vector3(),
      _tmp7 = new THREE.Vector3(), _tmp8 = new THREE.Vector3();

renderer.domElement.addEventListener('pointerdown', hideHint, { once: true });

if (mode === 'mission') sim.missionStart();
if (mode === 'quiz') { newQuiz(); }
renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast('화산 모형을 돌려 보고 🔥 압력을 키워 봐요');
animate();

/* 테스트용 앱 훅 */
window.VolcanoApp = {
  sim, get mode() { return mode; }, setMode, setGrade, setExp, act, doSee,
  rivers, volGroup, cutGroup, quakeGroup, mountain, crack: crackMesh
};
</script>
</body>
</html>

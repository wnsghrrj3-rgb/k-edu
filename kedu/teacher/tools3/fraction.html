<!--
  케이랩 v3 · B트랙 양산 5호 — 분수 모형 (2026-07-13) · B트랙 최대 도구
  SPEC = handoff/klab/designs3/SPEC_fraction.md (도면=정답)
  v2(engine/tools/fraction.js 499줄 · v7) 콘텐츠 무손실 이식:
    학년칸(저 area만·maxDenom6·약분/대분수/비교/퀴즈 숨김 / 중 area+line·비교·make 퀴즈
           / 고 4표상·make+guess) · 미션 저2·중3·고4 · 양방향 퀴즈 · 구 config(single/compare) 호환
    4표상 = 면적(막대/원/격자) · 수직선 · 묶음 · 몫 — 같은 Sn/Sd를 «재료만 갈아끼우며» 본다
  v3 질감: 다크 스튜디오 + 원목 조리대. 면적 = 초콜릿 바 / 파이 / 판초콜릿,
          수직선 = 나무 자, 묶음 = 사탕 봉지, 몫 = 쿠키 나누기. 조각 seam = 자른 자국(흰 4px).
  와우 3종:
    A(v2 계승·연출 승격) ⚖ 통분 모핑 — 조각 seam이 «늘어나며 쪼개진다»(stagger) whoosh→ting
    B(v3 신설) 🔮 오개념 예측 — 분모가 다른 두 분수에서 ⚖ «처음 누를 때» 「어느 쪽이 클까?」를
      먼저 묻는다(1회 가드·리셋/전환 시 재무장). 「조각 수가 많다고 더 큰 게 아니에요」
    C(v3 신설) ✨ 동치 발견 — 퀴즈 만들기에서 목표와 «표기는 다른데 같은 양»을 내면 초록 배너 + ting
  ⚠️ v2 결함 2건 수정:
    ① 「크기가 같아요 — 동치분수!」가 «도달 불가능한 죽은 코드»였다 — 조건이
       `commonOn && Ad!==Bd`(경고) → `else if(eq && An!==Bn)`(동치) 순서인데, 분모가 같으면서
       값이 같으면 분자도 같아져 An!==Bn이 성립할 수 없다. 1/2 vs 2/4 같은 교과서적 동치분수에서도
       한 번도 뜨지 않았다 → 통분해서 두 분수가 완전히 같아진 순간에 말해 준다(문구는 v2 그대로).
    ② 표시 불일치(SPEC §6-2):
    quotient가 nPies=max(1,Sn)이라 Sn=0인데 쿠키가 1개 그려졌다 — 문구는 「0개를 4명이 나누면 … = 0」
    인데 화면엔 쿠키가 있다(그림-문구 모순) → Sn=0이면 쿠키 0개 + 빈 접시 실루엣 + 안내.
  config: ?grade= & mode=(free|mission|quiz|single|compare) & model= & shape= & denom= & numer=
          & maxDenom= & maxWholes= & notation= & setPer= & quizDir=
-->

<!-- ═══ 순수 로직 (node/jsdom 테스트 대상 · DOM 무의존) ═══ -->
<script>
(function(){
  'use strict';
  /* SPEC §1 — GRADES 전문 보존 */
  var GRADES={
    low:  { modes:['free','mission'],        models:['area'],                          notation:false, equiv:false, compare:false, maxDenom:6,  quizDirs:[] },
    mid:  { modes:['free','mission','quiz'], models:['area','line'],                   notation:true,  equiv:true,  compare:true,  maxDenom:12, quizDirs:['make'] },
    high: { modes:['free','mission','quiz'], models:['area','line','set','quotient'],  notation:true,  equiv:true,  compare:true,  maxDenom:12, quizDirs:['make','guess'] }
  };
  var GRADE_LABEL={ low:'저학년', mid:'중학년', high:'고학년' };
  var MODE_LABEL={ free:'자유탐구', mission:'미션', quiz:'퀴즈' };
  var ALLM=['area','line','set','quotient'];
  var MLABEL={ area:'▭ 면적', line:'┼ 수직선', set:'⦿ 묶음', quotient:'➗ 나눗셈' };

  /* v2 28~30 */
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a||1; }
  function lcm(a,b){ return a/gcd(a,b)*b; }
  /* ⚠️ 오름차순 + 엄격부등호라 √n 양옆 약수 중 «작은 쪽»을 고른다(12→3, 8→2) — v2 실측 그대로 */
  function bestCols(n){ var x=1,t=Math.sqrt(n); for(var c=1;c<=n;c++) if(n%c===0&&Math.abs(c-t)<Math.abs(x-t)) x=c; return x; }
  /* v2 274 */
  function notate(m,n,style){
    var W=Math.floor(m/n), r=m%n;
    if(style==='mixed'){
      if(r===0) return { whole:String(W), m:null, n:null };
      return { whole:(W>0?String(W):''), m:String(r), n:String(n) };
    }
    return { whole:'', m:String(m), n:String(n) };
  }
  /* v2 306·331~333 분기의 근거 */
  function reduceInfo(Sn,Sd){
    var g=gcd(Sn,Sd);
    var isWhole=(Sn>0&&Sn%Sd===0);
    var reduced=(Sn>0&&g>1&&Sn%Sd!==0);
    return { g:g, reduced:reduced, isWhole:isWhole, rn:Sn/g, rd:Sd/g };
  }
  /* v2 248·263·310·339·364 공통식 단일화 */
  function wholesOf(Sn,Sd,maxWholes){
    var wn=Math.max(1,Math.min(Math.ceil(Sn/Sd)||1,maxWholes));
    if(Sn===0) wn=1;
    return wn;
  }
  function clampState(s){
    var Sd=Math.max(1,Math.min(s.Sd,s.maxDenom));
    var Sn=Math.max(0,Math.min(s.Sn,Sd*s.maxWholes));
    return { Sn:Sn, Sd:Sd };
  }
  /* v2 405 */
  function commonView(Ad,An,Bd,Bn){
    var L=lcm(Ad,Bd);
    return { L:L, nA:An*(L/Ad), nB:Bn*(L/Bd), d:L };
  }
  /* v2 408 */
  function cmpSign(An,Ad,Bn,Bd){
    var va=An/Ad, vb=Bn/Bd;
    if(Math.abs(va-vb)<1e-9) return '＝';
    return (va>vb)?'＞':'＜';
  }

  /* 미션 — v2 텍스트·판정식 무손실. check(state) */
  var LOW_MISSIONS=[
    { text:'＋조각 버튼으로 <b>3/4</b>을 만들어 봐요! (4조각 중 3조각)',
      check:function(s){ return s.mode==='single'&&s.Sn===3&&s.Sd===4; } },
    { text:'등분을 바꿔 <b>절반(1/2)</b>을 만들어 봐요!',
      check:function(s){ return s.mode==='single'&&s.Sn===1&&s.Sd===2; } }
  ];
  var MID_MISSIONS=[
    { text:'＋조각 버튼으로 <b>3/4</b>을 만들어 봐요!',
      check:function(s){ return s.mode==='single'&&s.Sn===3&&s.Sd===4; } },
    { text:'등분·조각을 바꿔 3/4과 <b>같은 양인 6/8</b>을 만들어 봐요! (동치분수)',
      check:function(s){ return s.mode==='single'&&s.Sn===6&&s.Sd===8; } },
    { text:'표상을 <b>┼ 수직선</b>으로 바꾸고, <b>절반(1/2) 지점</b>에 점을 놓아 봐요!',
      check:function(s){ return s.mode==='single'&&s.model==='line'&&s.Sd>0&&s.Sn*2===s.Sd&&s.Sn>0; } }
  ];
  var HIGH_MISSIONS=MID_MISSIONS.concat([
    { text:'<b>두 개 비교</b>로 가서 <b>⚖ 같은 크기로 맞추기</b>(통분)를 눌러 봐요!',
      check:function(s){ return s.mode==='compare'&&s.commonized===true; } }
  ]);
  function missionsFor(grade){
    return (grade==='low')?LOW_MISSIONS:(grade==='mid')?MID_MISSIONS:HIGH_MISSIONS;
  }

  /* 퀴즈 — v2 로직 그대로, rand 주입 */
  function newQuiz(maxDenom,qDir,rand){
    rand=rand||Math.random;
    var topD=Math.max(2,Math.min(6,maxDenom));
    var qD=2+Math.floor(rand()*(topD-1));
    var qN=1+Math.floor(rand()*qD);
    var o={ qN:qN, qD:qD, qPhase:'try', qCounted:false };
    if(qDir==='make'){ o.Sd=qD; o.Sn=0; } else { o.gD=2; o.gN=1; }
    return o;
  }
  /* v2 484~485 — 값 비교(동치 정답 허용이 «의도된 설계» = 와우 C의 재료) */
  function gradeQuiz(qDir,s){
    if(qDir==='make'){
      if(s.Sn===0) return 'wrong';
      return (Math.abs(s.Sn/s.Sd-s.qN/s.qD)<1e-9)?'right':'wrong';
    }
    return (Math.abs(s.gN/s.gD-s.qN/s.qD)<1e-9)?'right':'wrong';
  }
  function sameAmountButDifferent(Sn,Sd,qN,qD){
    return Math.abs(Sn/Sd-qN/qD)<1e-9 && (Sn!==qN||Sd!==qD);
  }

  var API={ GRADES:GRADES, GRADE_LABEL:GRADE_LABEL, MODE_LABEL:MODE_LABEL, ALLM:ALLM, MLABEL:MLABEL,
            gcd:gcd, lcm:lcm, bestCols:bestCols, notate:notate, reduceInfo:reduceInfo,
            wholesOf:wholesOf, clampState:clampState, commonView:commonView, cmpSign:cmpSign,
            LOW_MISSIONS:LOW_MISSIONS, MID_MISSIONS:MID_MISSIONS, HIGH_MISSIONS:HIGH_MISSIONS,
            missionsFor:missionsFor, newQuiz:newQuiz, gradeQuiz:gradeQuiz,
            sameAmountButDifferent:sameAmountButDifferent };
  if(typeof window!=='undefined') window.FracCore=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

<!-- ═══ 앱 ═══ -->
<script>
(function(){
  'use strict';
  var FC=window.FracCore, K3=window.K3;
  var $=function(id){ return document.getElementById(id); };
  document.documentElement.style.setProperty('--noise','url("'+K3.NOISE+'")');

  var Q=new URLSearchParams(location.search);
  var grade=(['low','mid','high'].indexOf(Q.get('grade'))>=0)?Q.get('grade'):'high';
  var locked=!!Q.get('grade');
  function G(){ return FC.GRADES[grade]; }

  var cfg={
    mode:Q.get('mode'), model:Q.get('model'), shape:Q.get('shape'),
    denom:Q.get('denom')!=null?+Q.get('denom'):null,
    numer:Q.get('numer')!=null?+Q.get('numer'):null,
    maxDenom:Q.get('maxDenom')!=null?+Q.get('maxDenom'):null,
    maxWholes:Q.get('maxWholes')!=null?+Q.get('maxWholes'):null,
    notation:Q.get('notation'), setPer:Q.get('setPer')!=null?+Q.get('setPer'):null,
    quizDir:Q.get('quizDir')
  };

  var maxDenom, maxWholes=(cfg.maxWholes>=1)?cfg.maxWholes:3;
  var klMode, mode, shape, notation, models, model, setPer;
  var Sd, Sn, Ad, An, Bd, Bn, commonized=false;
  var mStep=0, mDone=false, mLock=false;
  var qN=0, qD=2, qPhase='try', qCounted=false, qDir='make', gN=1, gD=2, qScore=0, qCount=0;
  var magicShown=false, pred=null;      /* 와우B 1회 가드 */
  var splitFx=false, equivFx=false;     /* 통분 모핑 · 동치 발견 배너 */
  var STEP_MS=window.__K3_FAST?60:1500;

  function snd(n){ K3.sound.play(n); }
  function equivOn(){ return G().equiv; }
  function commonOn(){ return G().compare; }

  function initGrade(){
    maxDenom=(cfg.maxDenom>=2)?Math.min(cfg.maxDenom,G().maxDenom):G().maxDenom;
    models=FC.ALLM.filter(function(m){ return G().models.indexOf(m)>=0; });
    if(!models.length) models=[G().models[0]];
    model=(models.indexOf(cfg.model)>=0)?cfg.model:models[0];
    setPer=(cfg.setPer>=1)?Math.min(cfg.setPer,6):2;
    shape=(['bar','circle','grid'].indexOf(cfg.shape)>=0)?cfg.shape:'bar';
    notation=(G().notation&&cfg.notation==='mixed')?'mixed':'improper';
    Sd=(cfg.denom>=1)?Math.min(cfg.denom,maxDenom):4;
    Sn=(cfg.numer!=null)?Math.max(0,Math.min(cfg.numer,Sd*maxWholes)):0;
    Ad=Math.min(4,maxDenom); An=3; Bd=Math.min(3,maxDenom); Bn=2;
    commonized=false; magicShown=false; pred=null;
  }
  initGrade();

  /* 구 config 호환: single/compare → 자유탐구 셸 + 내부 mode */
  klMode=(cfg.mode==='mission')?'mission'
        :(cfg.mode==='quiz'&&G().modes.indexOf('quiz')>=0)?'quiz':'free';
  if(G().modes.indexOf(klMode)<0) klMode='free';
  mode=(['single','compare'].indexOf(cfg.mode)>=0)?cfg.mode:'single';
  if(mode==='compare'&&!G().compare) mode='single';
  if(klMode==='quiz') mode='quiz';
  qDir=(G().quizDirs.indexOf('guess')>=0&&cfg.quizDir==='guess')?'guess':(G().quizDirs[0]||'make');

  function state(){
    return { mode:mode, model:model, Sn:Sn, Sd:Sd, commonized:commonized,
             gN:gN, gD:gD, qN:qN, qD:qD };
  }
  function curMissions(){ return FC.missionsFor(grade); }
  function loadQuiz(){
    var o=FC.newQuiz(maxDenom,qDir);
    qN=o.qN; qD=o.qD; qPhase=o.qPhase; qCounted=o.qCounted;
    if(qDir==='make'){ Sd=o.Sd; Sn=o.Sn; } else { gD=o.gD; gN=o.gN; }
    equivFx=false;
  }

  /* ── 조작 ── */
  function clampN(){ Sn=Math.max(0,Math.min(Sn,Sd*maxWholes)); }
  function retry(){ if(klMode==='quiz'&&qPhase!=='try'){ qPhase='try'; equivFx=false; } }
  var H={
    nplus:function(){ if(Sn<Sd*maxWholes){ Sn++; snd('pop'); if(Sn>0&&Sn%Sd===0) snd('ting'); retry(); render(); } },
    nminus:function(){ if(Sn>0){ Sn--; snd('tap'); retry(); render(); } },
    dplus:function(){ if(Sd<maxDenom){ Sd++; clampN(); snd('select'); retry(); render(); } },
    dminus:function(){ if(Sd>1){ Sd--; clampN(); snd('select'); retry(); render(); } },
    perplus:function(){ if(setPer<6){ setPer++; snd('pop'); render(); } },
    perminus:function(){ if(setPer>1){ setPer--; snd('tap'); render(); } },
    gnplus:function(){ if(gN<gD*maxWholes){ gN++; snd('pop'); qPhase='try'; render(); } },
    gnminus:function(){ if(gN>0){ gN--; snd('tap'); qPhase='try'; render(); } },
    gdplus:function(){ if(gD<maxDenom){ gD++; snd('select'); qPhase='try'; render(); } },
    gdminus:function(){ if(gD>1){ gD--; snd('select'); qPhase='try'; render(); } },
    reset:function(){
      snd('select');
      if(mode==='single'){
        Sd=(cfg.denom>=1)?Math.min(cfg.denom,maxDenom):4;
        Sn=(cfg.numer!=null)?Math.max(0,cfg.numer):0;
        notation=(G().notation&&cfg.notation==='mixed')?'mixed':'improper';
        shape=(['bar','circle','grid'].indexOf(cfg.shape)>=0)?cfg.shape:'bar';
        model=(models.indexOf(cfg.model)>=0)?cfg.model:models[0];
      } else {
        Ad=Math.min(4,maxDenom); An=3; Bd=Math.min(3,maxDenom); Bn=2;
        commonized=false;
      }
      magicShown=false; pred=null;   /* 와우B 재무장 */
      build();
    }
  };
  function pairAdj(set,k,d){
    if(set==='A'){
      if(k==='n'){ An=Math.max(0,Math.min(An+d,Ad*maxWholes)); }
      else { var nd=Ad+d; if(nd>=1&&nd<=maxDenom){ Ad=nd; An=Math.min(An,Ad*maxWholes); } }
    } else {
      if(k==='n'){ Bn=Math.max(0,Math.min(Bn+d,Bd*maxWholes)); }
      else { var nd2=Bd+d; if(nd2>=1&&nd2<=maxDenom){ Bd=nd2; Bn=Math.min(Bn,Bd*maxWholes); } }
    }
    snd(d>0?'pop':'tap');
    if(commonized&&Ad!==Bd) commonized=false;   /* 분모가 다시 어긋나면 통분 해제 */
    render();
  }
  function setFrac(n,d){ Sd=Math.max(1,Math.min(d,maxDenom)); Sn=Math.max(0,Math.min(n,Sd*maxWholes)); retry(); render(); }
  function setPair(set,n,d){
    if(set==='A'){ Ad=Math.max(1,Math.min(d,maxDenom)); An=Math.max(0,Math.min(n,Ad*maxWholes)); }
    else { Bd=Math.max(1,Math.min(d,maxDenom)); Bn=Math.max(0,Math.min(n,Bd*maxWholes)); }
    render();
  }

  /* ── 와우A/B — ⚖ 통분(모핑) + 첫 시도에 오개념 예측 카드 ── */
  function doCommonize(){
    commonized=!commonized;
    if(commonized){ splitFx=true; snd('whoosh'); }
    else { snd('select'); }
    render();
    if(commonized){
      setTimeout(function(){ snd('ting'); }, window.__K3_FAST?20:420);
    }
  }
  function commonize(){
    /* 와우B — 분모가 다른 상태에서 «처음» 통분하려 할 때, 눈으로 보기 전에 먼저 예측한다 */
    if(!magicShown && commonOn() && !commonized && Ad!==Bd){
      magicShown=true;
      snd('charge');
      K3.cards.predict('분모가 다른 두 분수 — <b>어느 쪽이 클까요?</b><br>'
        +'<span style="color:#0d7a5c">A = '+An+'/'+Ad+'</span> · <span style="color:#B9522F">B = '+Bn+'/'+Bd+'</span>',
        [{id:'A', label:'① A가 크다'},
         {id:'B', label:'② B가 크다'},
         {id:'same', label:'③ 크기가 같다'}]
      ).then(function(id){
        pred=id;
        doCommonize();
        setTimeout(function(){
          var sign=FC.cmpSign(An,Ad,Bn,Bd);
          var truth=(sign==='＝')?'same':(sign==='＞'?'A':'B');
          var okP=(pred===truth);
          var cv=FC.commonView(Ad,An,Bd,Bn);
          K3.cards.result(
            '<h3 style="color:'+(okP?'#0d7a5c':'#B9522F')+'">'+(okP?'✨ 맞혔어요!':'🤔 조각 수가 많다고 더 큰 게 아니에요!')+'</h3>'
            +'<p style="font-size:13.5px;line-height:1.75;color:#41546a">'
            +'분모가 다르면 <b>조각의 «크기»가 다르다</b>는 게 함정이에요. 조각 수만 세면 속아요.<br>'
            +'분모를 <b>'+cv.L+'</b>로 같게 맞추니(통분) 조각 크기가 같아졌고, 이제 개수로 바로 견줄 수 있어요 — '
            +'<b>'+cv.nA+'/'+cv.L+' '+sign+' '+cv.nB+'/'+cv.L+'</b>.<br>'
            +'같은 자로 재야 길이를 견줄 수 있는 것과 같아요.</p>',
            [{label:'좋아, 계속 탐구', cls:'pri', value:'done'}]
          );
        }, window.__K3_FAST?60:1000);
      });
      return;
    }
    doCommonize();
  }

  /* ── 퀴즈 채점 ── */
  function check(){
    var ph=FC.gradeQuiz(qDir,state());
    qPhase=ph;
    /* 와우C — 목표와 «표기는 다른데 같은 양» = 동치 발견 */
    equivFx=(qDir==='make'&&ph==='right'&&FC.sameAmountButDifferent(Sn,Sd,qN,qD));
    if(!qCounted){ qCount++; if(ph==='right') qScore++; qCounted=true; }
    if(ph==='right'){ snd('chime'); if(equivFx){ snd('ting'); K3.toast('✨ 같은 양이에요! <b>'+Sn+'/'+Sd+' = '+qN+'/'+qD+'</b>'); } else K3.toast('🎉 정답!'); }
    else { snd('fail'); K3.toast('🤔 다시 해 볼까요?', true); }
    build();
  }
  function next(){ snd('select'); loadQuiz(); build(); }

  /* ── 빌드 ── */
  function build(){
    var gs=$('gradeSeg');
    if(locked){ gs.style.display='none'; }
    else{
      gs.innerHTML=['low','mid','high'].map(function(g){
        return '<button data-g="'+g+'" class="'+(g===grade?'on':'')+'">'+FC.GRADE_LABEL[g]+'</button>';
      }).join('');
      gs.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){ if(b.dataset.g!==grade) setGrade(b.dataset.g); });
      });
    }
    var ms=$('modeSeg');
    ms.innerHTML=G().modes.map(function(m){
      return '<button data-m="'+m+'" class="'+(m===klMode?'on':'')+'">'+FC.MODE_LABEL[m]+'</button>';
    }).join('');
    ms.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){ if(b.dataset.m!==klMode) setKlMode(b.dataset.m); });
    });

    var bar=$('barSlot');
    if(klMode==='mission'){
      var M=curMissions();
      bar.innerHTML=mDone
        ? '<div class="k3bar done">🎉 미션을 모두 해냈어요! 자유탐구에서 마음껏 나눠 봐요.</div>'
        : '<div class="k3bar"><span>'+M[mStep].text+'</span><span class="prog">'+(mStep+1)+' / '+M.length+'</span></div>';
    } else if(klMode==='quiz'){
      bar.innerHTML='<div class="k3bar"><span>'+(qDir==='make'
        ? '🎯 목표 분수만큼 색칠하고 ✓ 확인을 눌러요!'
        : '🔍 그림이 나타내는 분수를 맞히고 ✓ 확인을 눌러요!')
        +'</span><span class="prog">점수 '+qScore+' / '+qCount+'</span></div>';
    } else bar.innerHTML='';

    var rows='';
    /* 행 1 — 한 개 보기 / 두 개 비교 (퀴즈 셸에는 없음) */
    if(klMode!=='quiz'){
      var mb='<button class="fr-tab'+(mode==='single'?' on':'')+'" data-mode="single">한 개 보기</button>';
      if(G().compare) mb+='<button class="fr-tab'+(mode==='compare'?' on':'')+'" data-mode="compare">두 개 비교</button>';
      rows+='<div class="fr-row">'+mb+'</div>';
    }
    /* 행 2 — 표상(단일) 또는 퀴즈 방향 */
    if(klMode!=='quiz'&&mode==='single'&&models.length>1){
      rows+='<div class="fr-row">'+models.map(function(m){
        return '<button class="fr-tab teal'+(m===model?' on':'')+'" data-model="'+m+'">'+FC.MLABEL[m]+'</button>';
      }).join('')+'</div>';
    }
    if(klMode==='quiz'&&G().quizDirs.length>1){
      rows+='<div class="fr-row">'+G().quizDirs.map(function(d){
        return '<button class="fr-tab'+(qDir===d?' on':'')+'" data-dir="'+d+'">'+(d==='make'?'🎯 만들기':'🔍 맞히기')+'</button>';
      }).join('')+'</div>';
    }
    /* 행 3 — 메인 컨트롤 */
    var c='';
    if(mode==='single'||(klMode==='quiz'&&qDir==='make')){
      c+='<button class="ck-btn minus" data-act="nminus" style="--c1:#3EE6B0;--c2:#1F9E75">－ 조각</button>'
        +'<button class="ck-btn" data-act="nplus" style="--c1:#3EE6B0;--c2:#1F9E75">＋ 조각</button>'
        +'<button class="ck-btn minus" data-act="dminus" style="--c1:#5B9BF0;--c2:#3E7BD4">－ '+(model==='quotient'&&klMode!=='quiz'?'사람':'등분')+'</button>'
        +'<button class="ck-btn" data-act="dplus" style="--c1:#5B9BF0;--c2:#3E7BD4">＋ '+(model==='quotient'&&klMode!=='quiz'?'사람':'등분')+'</button>';
      if(klMode!=='quiz'&&model==='area'){
        c+='<span class="ctrl-lab">모양</span>'
          +['bar','circle','grid'].map(function(sh){
            return '<button class="fr-tab teal'+(shape===sh?' on':'')+'" data-shape="'+sh+'">'
              +(sh==='bar'?'▭':sh==='circle'?'◔':'▦')+'</button>';
          }).join('');
        if(G().notation){
          c+='<span class="ctrl-lab">표기</span>'
            +['improper','mixed'].map(function(nt){
              return '<button class="fr-tab'+(notation===nt?' on':'')+'" data-notation="'+nt+'">'
                +(nt==='improper'?'가분수':'대분수')+'</button>';
            }).join('');
        }
      }
      if(klMode!=='quiz'&&model==='set'){
        c+='<button class="ck-btn minus" data-act="perminus" style="--c1:#FFA75E;--c2:#D97B33">－ 묶음개수</button>'
          +'<button class="ck-btn" data-act="perplus" style="--c1:#FFA75E;--c2:#D97B33">＋ 묶음개수</button>';
      }
    } else if(mode==='compare'){
      c+='<span class="ctrl-lab" style="color:#3EE6B0">A</span>'
        +'<button class="ck-btn minus" data-set="A" data-k="n" data-d="-1" style="--c1:#3EE6B0;--c2:#1F9E75">－조각</button>'
        +'<button class="ck-btn" data-set="A" data-k="n" data-d="1" style="--c1:#3EE6B0;--c2:#1F9E75">＋조각</button>'
        +'<button class="ck-btn minus" data-set="A" data-k="d" data-d="-1" style="--c1:#3EE6B0;--c2:#1F9E75">－등분</button>'
        +'<button class="ck-btn" data-set="A" data-k="d" data-d="1" style="--c1:#3EE6B0;--c2:#1F9E75">＋등분</button>'
        +'<span class="ctrl-lab" style="color:#FFA75E">B</span>'
        +'<button class="ck-btn minus" data-set="B" data-k="n" data-d="-1" style="--c1:#FFA75E;--c2:#D97B33">－조각</button>'
        +'<button class="ck-btn" data-set="B" data-k="n" data-d="1" style="--c1:#FFA75E;--c2:#D97B33">＋조각</button>'
        +'<button class="ck-btn minus" data-set="B" data-k="d" data-d="-1" style="--c1:#FFA75E;--c2:#D97B33">－등분</button>'
        +'<button class="ck-btn" data-set="B" data-k="d" data-d="1" style="--c1:#FFA75E;--c2:#D97B33">＋등분</button>';
      if(commonOn()) c+='<button class="ck-btn wow" id="cmnBtn">⚖ 같은 크기로 맞추기</button>';
    } else if(klMode==='quiz'&&qDir==='guess'){
      c+='<span class="ctrl-lab">내 답</span>'
        +'<button class="ck-btn minus" data-act="gnminus" style="--c1:#3EE6B0;--c2:#1F9E75">－ 분자</button>'
        +'<button class="ck-btn" data-act="gnplus" style="--c1:#3EE6B0;--c2:#1F9E75">＋ 분자</button>'
        +'<button class="ck-btn minus" data-act="gdminus" style="--c1:#5B9BF0;--c2:#3E7BD4">－ 분모</button>'
        +'<button class="ck-btn" data-act="gdplus" style="--c1:#5B9BF0;--c2:#3E7BD4">＋ 분모</button>';
    }
    if(klMode==='quiz'){
      c+='<button class="ck-btn" id="chkBtn" style="--c1:#3EE6B0;--c2:#12B886">✓ 확인</button>'
        +'<button class="ck-btn wow" id="nextBtn">↻ 다음 문제</button>';
    } else {
      c+='<button class="ck-btn ghost" data-act="reset" title="처음으로">↺</button>';
    }
    rows+='<div class="fr-row">'+c+'</div>';

    var ct=$('ctrlSlot');
    ct.innerHTML='<div class="fr-rows">'+rows+'</div>';
    ct.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click',function(){ var f=H[b.dataset.act]; if(f)f(); });
    });
    ct.querySelectorAll('[data-mode]').forEach(function(b){
      b.addEventListener('click',function(){ setMode(b.dataset.mode); });
    });
    ct.querySelectorAll('[data-model]').forEach(function(b){
      b.addEventListener('click',function(){ setModel(b.dataset.model); });
    });
    ct.querySelectorAll('[data-shape]').forEach(function(b){
      b.addEventListener('click',function(){ setShape(b.dataset.shape); });
    });
    ct.querySelectorAll('[data-notation]').forEach(function(b){
      b.addEventListener('click',function(){ setNotation(b.dataset.notation); });
    });
    ct.querySelectorAll('[data-dir]').forEach(function(b){
      b.addEventListener('click',function(){ setDir(b.dataset.dir); });
    });
    ct.querySelectorAll('[data-set]').forEach(function(b){
      b.addEventListener('click',function(){ pairAdj(b.dataset.set,b.dataset.k,+b.dataset.d); });
    });
    var cb=$('cmnBtn'); if(cb){ cb.addEventListener('click',commonize); cb.classList.toggle('on',commonized); }
    var kb=$('chkBtn'); if(kb) kb.addEventListener('click',check);
    var nb=$('nextBtn'); if(nb) nb.addEventListener('click',next);

    render();
  }

  function setGrade(g){
    grade=g; snd('select');
    initGrade();
    if(G().modes.indexOf(klMode)<0) klMode='free';
    mode='single'; shape='bar'; notation='improper'; Sd=4; Sn=0; commonized=false;
    mStep=0; mDone=false; mLock=false;
    if(klMode==='quiz'){ qDir=G().quizDirs[0]||'make'; mode='quiz'; qScore=0; qCount=0; loadQuiz(); }
    build();
  }
  function setKlMode(m){
    klMode=m; snd('select');
    mStep=0; mDone=false; mLock=false; commonized=false; magicShown=false; pred=null;
    if(m==='quiz'){ mode='quiz'; qDir=G().quizDirs[0]||'make'; qScore=0; qCount=0; loadQuiz(); }
    else if(m==='mission'){
      /* 미션 시드 — 4/0은 미션①(3/4) 조건과 «불일치» = 자동달성 없음(시드 변경 금지) */
      mode='single'; model='area'; shape='bar'; notation='improper'; Sd=4; Sn=0;
    } else {
      mode='single';
      model=(models.indexOf(cfg.model)>=0)?cfg.model:models[0];
      Sd=(cfg.denom>=1)?Math.min(cfg.denom,maxDenom):4;
      Sn=(cfg.numer!=null)?Math.max(0,cfg.numer):0;
    }
    build();
  }
  function setMode(m){
    if(mode===m||klMode==='quiz') return;
    mode=m; snd('select'); commonized=false; magicShown=false; pred=null;
    build();
  }
  function setModel(m){ if(model===m)return; model=m; snd('select'); build(); }
  function setShape(s){ if(shape===s)return; shape=s; snd('select'); build(); }
  function setNotation(n){ if(notation===n)return; notation=n; snd('select'); build(); }
  function setDir(d){ if(qDir===d)return; qDir=d; snd('select'); loadQuiz(); build(); }

  /* ═══ 무대 — 원목 조리대 위 「나눠 먹기」 세계 ═══ */
  var VBW=940, VBH=480;
  function svgEl(t,a){ var e=document.createElementNS('http://www.w3.org/2000/svg',t); for(var k in a)e.setAttribute(k,a[k]); return e; }
  function pt(cx,cy,r,d){ var x=(d-90)*Math.PI/180; return [cx+r*Math.cos(x), cy+r*Math.sin(x)]; }
  function txt(svg,x,y,s,size,fill,anchor,cls){
    var t=svgEl('text',{ x:x, y:y, 'text-anchor':anchor||'middle',
      'font-family':'var(--kedu-title)', 'font-size':size, 'font-weight':800, fill:fill });
    if(cls) t.setAttribute('class',cls);
    t.textContent=s; svg.appendChild(t); return t;
  }
  function defs(svg){
    var d=svgEl('defs',{});
    d.innerHTML=
      '<filter id="frSh" x="-25%" y="-25%" width="150%" height="170%">'
      +'<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>'
      +'<linearGradient id="frA" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="#5EE6A8"/><stop offset="1" stop-color="#12B886"/></linearGradient>'
      +'<linearGradient id="frB" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="#FFB066"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>'
      +'<linearGradient id="frGloss" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="rgba(255,255,255,0.4)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>';
    svg.appendChild(d);
  }
  var EMPTY='rgba(255,255,255,0.07)', EMPTY_EDGE='rgba(255,255,255,0.26)';
  var SEAM='rgba(255,255,255,0.92)';
  var A_EDGE='rgba(11,122,92,0.85)', B_EDGE='rgba(194,78,14,0.85)';
  var INK='#EAF2FB', MUT='#9fb2c6', NUM='#3EE6B0', DEN='#7FB2F5', WHOLE='#BCA7FF';
  var GOOD='#3EE6B0', WARN='#FFA75E';
  function fillOf(on,set){ return on?('url(#fr'+(set==='B'?'B':'A')+')'):EMPTY; }

  /* 초콜릿 바 */
  function barsAt(svg,x0,y0,W,H,denom,numer,set,opts){
    opts=opts||{};
    var wholes=FC.wholesOf(numer,denom,maxWholes);
    var gap=18, ww=(W-gap*(wholes-1))/wholes, edge=(set==='B')?B_EDGE:A_EDGE, gk=0;
    for(var w=0;w<wholes;w++){
      var wx=x0+w*(ww+gap), cw=ww/denom, g=svgEl('g',{ filter:'url(#frSh)' });
      for(var i=0;i<denom;i++){
        var on=gk<numer;
        var cls='fr-piece'+(opts.split?' fr-split':'');
        var r=svgEl('rect',{ x:wx+i*cw, y:y0, width:cw, height:H, rx:(denom===1?14:4),
          fill:fillOf(on,set), stroke:SEAM, 'stroke-width':4,
          'data-gk':gk, 'data-set':set, class:cls });
        if(opts.split) r.setAttribute('style','animation-delay:'+(i*24)+'ms');
        if(opts.noTap){ r.setAttribute('class',opts.split?'fr-split':''); r.setAttribute('pointer-events','none'); }
        g.appendChild(r);
        if(on) g.appendChild(svgEl('rect',{ x:wx+i*cw+5, y:y0+5, width:Math.max(2,cw-10), height:10, rx:5,
          fill:'url(#frGloss)', 'pointer-events':'none' }));
        gk++;
      }
      g.appendChild(svgEl('rect',{ x:wx, y:y0, width:ww, height:H, rx:13,
        fill:'none', stroke:edge, 'stroke-width':4, 'pointer-events':'none' }));
      svg.appendChild(g);
    }
  }
  /* 파이(원형 팬) */
  function circlesAt(svg,cxC,cy,rBase,denom,numer,set){
    var wholes=FC.wholesOf(numer,denom,maxWholes);
    var r=Math.min(rBase,(580/wholes-30)/2), gap=24;
    var total=wholes*(2*r)+gap*(wholes-1), startx=cxC-total/2+r, gk=0;
    var edge=(set==='B')?B_EDGE:A_EDGE;
    for(var w=0;w<wholes;w++){
      var cx=startx+w*(2*r+gap), g=svgEl('g',{ filter:'url(#frSh)' });
      if(denom===1){
        g.appendChild(svgEl('circle',{ cx:cx, cy:cy, r:r, fill:fillOf(gk<numer,set),
          stroke:SEAM, 'stroke-width':5, 'data-gk':gk, 'data-set':set, class:'fr-piece' }));
        gk++;
      } else {
        var st=360/denom;
        for(var i=0;i<denom;i++){
          var p0=pt(cx,cy,r,i*st), p1=pt(cx,cy,r,(i+1)*st), lg=(st>180)?1:0;
          g.appendChild(svgEl('path',{ d:'M '+cx+' '+cy+' L '+p0[0]+' '+p0[1]+' A '+r+' '+r+' 0 '+lg+' 1 '+p1[0]+' '+p1[1]+' Z',
            fill:fillOf(gk<numer,set), stroke:SEAM, 'stroke-width':4,
            'data-gk':gk, 'data-set':set, class:'fr-piece' }));
          gk++;
        }
      }
      g.appendChild(svgEl('circle',{ cx:cx, cy:cy, r:r, fill:'none', stroke:edge,
        'stroke-width':4, 'pointer-events':'none' }));
      svg.appendChild(g);
    }
  }
  /* 큰 분수 표기 */
  function drawFrac(svg,cx,cy,m,n,style,big){
    var o=FC.notate(m,n,style), s=big?86:48, gap=big?20:12, lw=big?130:74, fx=cx;
    if(o.whole){
      txt(svg,cx-(o.m?(big?95:55):0), cy+(o.m?(big?30:18):0), o.whole, big?108:60, WHOLE);
      fx=cx+(o.m?(big?45:28):0);
    }
    if(o.m!==null){
      txt(svg,fx,cy-gap,o.m,s,NUM);
      svg.appendChild(svgEl('rect',{ x:fx-lw/2, y:cy+(big?-28:-16), width:lw, height:big?8:6, rx:4, fill:INK }));
      txt(svg,fx,cy+s-(big?4:0),o.n,s,DEN);
    }
  }

  function render(){
    var desk=$('desk');
    var svg=svgEl('svg',{ viewBox:'0 0 '+VBW+' '+VBH, id:'frSvg',
      style:'display:block;width:min(92vw,860px);height:auto;max-height:54vh' });
    defs(svg);

    if(klMode==='quiz') renderQuiz(svg);
    else if(mode==='compare') renderCompare(svg);
    else if(model==='line') renderLine(svg);
    else if(model==='set') renderSet(svg);
    else if(model==='quotient') renderQuotient(svg);
    else renderArea(svg);

    desk.innerHTML=''; desk.appendChild(svg);
    splitFx=false;

    /* 조각 직접 탭 */
    svg.querySelectorAll('.fr-piece').forEach(function(p){
      p.addEventListener('click',function(){
        var gk=+p.getAttribute('data-gk'), set=p.getAttribute('data-set');
        if(set==='A'){ An=(An===gk+1)?gk:gk+1; snd('pop'); }
        else if(set==='B'){ Bn=(Bn===gk+1)?gk:gk+1; snd('pop'); }
        else { Sn=(Sn===gk+1)?gk:gk+1; snd('pop'); retry(); }
        if(commonized&&Ad!==Bd) commonized=false;
        render();
      });
    });
    /* 수직선 핫존 — 가장 가까운 등분점으로 스냅 */
    var hot=svg.querySelector('.fr-linehot');
    if(hot) hot.addEventListener('click',function(ev){
      var box=svg.getBoundingClientRect();
      var lx=+hot.getAttribute('data-x0'), lw=+hot.getAttribute('data-w'), wn=+hot.getAttribute('data-wholes');
      var rel=(ev.clientX-box.left)*(VBW/(box.width||VBW))-lx;
      var frac=Math.max(0,Math.min(1,rel/lw));
      var nv=Math.round(frac*wn*Sd);
      if(nv!==Sn){ Sn=Math.max(0,Math.min(nv,Sd*maxWholes)); snd('tick'); retry(); render(); }
    });

    updateStatus();
    updateButtons();
    if(klMode==='mission') checkMission();
  }

  /* ── 면적 — 초콜릿 바 / 파이 / 판초콜릿 ── */
  function renderArea(svg){
    var SX=40, SW=600;
    var R=FC.reduceInfo(Sn,Sd);
    var showRed=(equivOn()&&R.reduced&&shape==='bar');
    if(shape==='bar') barsAt(svg,SX,(showRed?70:(VBH-200)/2-10),SW,(showRed?150:200),Sd,Sn,'S');
    else if(shape==='circle') circlesAt(svg,SX+SW/2,VBH/2-10,150,Sd,Sn,'S');
    else {
      var wholes=FC.wholesOf(Sn,Sd,maxWholes);
      var cols=FC.bestCols(Sd), rows=Math.ceil(Sd/cols), gap=20;
      var bw=(SW-gap*(wholes-1))/wholes, cell=Math.min(bw/cols,260/rows,90)-6, gk=0;
      for(var w=0;w<wholes;w++){
        var gw=cell*cols+6*(cols-1), gh=cell*rows+6*(rows-1);
        var bx=SX+w*(bw+gap)+(bw-gw)/2, by=(VBH-gh)/2-10;
        var gg=svgEl('g',{ filter:'url(#frSh)' });
        for(var i=0;i<Sd;i++){
          var c=i%cols, r2=Math.floor(i/cols), on=gk<Sn;
          gg.appendChild(svgEl('rect',{ x:bx+c*(cell+6), y:by+r2*(cell+6), width:cell, height:cell, rx:9,
            fill:fillOf(on,'S'), stroke:(on?A_EDGE:EMPTY_EDGE), 'stroke-width':3,
            'data-gk':gk, 'data-set':'S', class:'fr-piece' }));
          gk++;
        }
        svg.appendChild(gg);
      }
    }
    /* 약분 보조 막대 — 같은 양을 «더 적은 조각»으로 */
    if(showRed){
      barsAt(svg,SX,300,SW,120,R.rd,R.rn,'S',{ noTap:true });
      txt(svg,SX,290,'↓ 같은 양을 더 적은 조각으로 (약분)',22,WHOLE,'start','fr-fade');
      drawFrac(svg,SX+SW+95,360,R.rn,R.rd,'improper',false);
    }
    var px=750;
    drawFrac(svg,px,140,Sn,Sd,notation,true);
  }

  /* ── 수직선 — 나무 자 ── */
  function renderLine(svg){
    var wn=FC.wholesOf(Sn,Sd,maxWholes);
    var x0=70, x1=870, W=x1-x0, y=250;
    /* 나무 자 몸통 */
    svg.appendChild(svgEl('rect',{ x:x0-16, y:y-34, width:W+32, height:68, rx:12,
      fill:'rgba(255,255,255,0.06)', stroke:'rgba(255,255,255,0.22)', 'stroke-width':1.5, filter:'url(#frSh)' }));
    svg.appendChild(svgEl('rect',{ x:x0, y:y-60, width:W, height:120, fill:'transparent',
      class:'fr-linehot', 'data-x0':x0, 'data-w':W, 'data-wholes':wn }));
    var fx=x0+W*(Sn/Sd)/wn;
    svg.appendChild(svgEl('line',{ x1:x0, y1:y, x2:fx, y2:y, stroke:'#12B886', 'stroke-width':12, 'stroke-linecap':'round' }));
    svg.appendChild(svgEl('line',{ x1:fx, y1:y, x2:x1, y2:y, stroke:'rgba(255,255,255,0.35)', 'stroke-width':8, 'stroke-linecap':'round' }));
    svg.appendChild(svgEl('polygon',{ points:(x1+4)+','+y+' '+(x1-14)+','+(y-9)+' '+(x1-14)+','+(y+9),
      fill:'rgba(255,255,255,0.45)' }));
    for(var i=0;i<=wn*Sd;i++){
      var gx=x0+W*i/(wn*Sd), big=(i%Sd===0);
      svg.appendChild(svgEl('line',{ x1:gx, y1:y-(big?22:11), x2:gx, y2:y+(big?22:11),
        stroke:(big?INK:'rgba(255,255,255,0.4)'), 'stroke-width':big?4:2 }));
      if(big) txt(svg,gx,y+52,String(i/Sd),26,INK);
    }
    svg.appendChild(svgEl('line',{ x1:fx, y1:y-70, x2:fx, y2:y+24, stroke:WHOLE, 'stroke-width':4, 'stroke-dasharray':'5 5' }));
    svg.appendChild(svgEl('circle',{ cx:fx, cy:y, r:13, fill:WHOLE, stroke:'#fff', 'stroke-width':4, class:'fr-mark' }));
    drawFrac(svg,fx,y-95,Sn,Sd,'improper',false);
  }

  /* ── 묶음 — 사탕 봉지 ── */
  function renderSet(svg){
    var wn=FC.wholesOf(Sn,Sd,maxWholes);
    var groups=Sd*wn;
    var perRow=Math.min(groups,Math.max(2,Math.ceil(Math.sqrt(groups))));
    var rows=Math.ceil(groups/perRow);
    var gw=Math.min(150,820/perRow), gh=Math.min(120,360/rows);
    var startx=(VBW-perRow*gw)/2, starty=70, gk=0;
    for(var r=0;r<rows;r++){
      for(var c=0;c<perRow;c++){
        if(gk>=groups) break;
        var bx=startx+c*gw, by=starty+r*gh, on=gk<Sn;
        svg.appendChild(svgEl('rect',{ x:bx+6, y:by+6, width:gw-12, height:gh-12, rx:14,
          fill:(on?'rgba(18,184,134,0.18)':EMPTY), stroke:(on?A_EDGE:EMPTY_EDGE), 'stroke-width':3,
          'data-gk':gk, 'data-set':'S', class:'fr-piece', filter:'url(#frSh)' }));
        var pcols=Math.min(Math.min(setPer,4),2);
        var prows=Math.ceil(setPer/pcols);
        var dr=Math.min((gw-30)/pcols,(gh-30)/prows,26)/2;
        for(var p=0;p<setPer;p++){
          var pcl=p%pcols, prw=Math.floor(p/pcols);
          var ox=bx+gw/2+(pcl-(pcols-1)/2)*(dr*2+6);
          var oy=by+gh/2+(prw-(prows-1)/2)*(dr*2+6);
          svg.appendChild(svgEl('circle',{ cx:ox, cy:oy, r:dr,
            fill:(on?'url(#frA)':'rgba(255,255,255,0.14)'),
            stroke:(on?A_EDGE:EMPTY_EDGE), 'stroke-width':2, 'pointer-events':'none' }));
        }
        gk++;
      }
    }
  }

  /* ── 몫 — 쿠키 나누기 ── */
  function renderQuotient(svg){
    var people=Math.max(1,Sd);
    /* ★ v2 표시 불일치 수정 — v2는 nPies=max(1,Sn)이라 Sn=0인데 쿠키가 1개 그려졌다.
       문구는 「0개를 4명이 나누면 … = 0」인데 화면엔 쿠키가 있다 = 그림이 문구를 배신.
       → 0개면 «빈 접시»를 보여주고, 올리라고 말한다. */
    if(Sn===0){
      svg.appendChild(svgEl('ellipse',{ cx:VBW/2, cy:200, rx:120, ry:70,
        fill:'rgba(255,255,255,0.05)', stroke:'rgba(255,255,255,0.28)', 'stroke-width':2,
        'stroke-dasharray':'8 8', class:'fr-emptyplate' }));
      txt(svg,VBW/2,208,'빈 접시',26,MUT);
      return;
    }
    var nPies=Sn;
    var r=Math.min(70,(820/Math.min(nPies,6))/2-8), gap=18;
    var rowN=Math.min(nPies,Math.floor(820/(2*r+gap))||1);
    var startx=(VBW-(rowN*(2*r+gap)-gap))/2+r, y=170;
    for(var k=0;k<nPies;k++){
      var col=k%rowN, row=Math.floor(k/rowN);
      var cx=startx+col*(2*r+gap), cy=y+row*(2*r+gap);
      var st=360/people;
      for(var i=0;i<people;i++){
        var p0=pt(cx,cy,r,i*st), p1=pt(cx,cy,r,(i+1)*st), lg=(st>180)?1:0, mine=(i===0);
        svg.appendChild(svgEl('path',{ d:'M '+cx+' '+cy+' L '+p0[0]+' '+p0[1]+' A '+r+' '+r+' 0 '+lg+' 1 '+p1[0]+' '+p1[1]+' Z',
          fill:(mine?'url(#frA)':EMPTY), stroke:SEAM, 'stroke-width':3,
          class:(mine?'fr-mine':'') }));
      }
      svg.appendChild(svgEl('circle',{ cx:cx, cy:cy, r:r, fill:'none', stroke:A_EDGE, 'stroke-width':3 }));
    }
  }

  /* ── 두 개 비교 + ⚖ 통분 모핑 ── */
  function renderCompare(svg){
    var x0=50, W=540, H=110;
    var dA=Ad, nA=An, dB=Bd, nB=Bn;
    var showCommon=(commonOn()&&commonized&&Ad!==Bd);
    if(showCommon){ var cv=FC.commonView(Ad,An,Bd,Bn); nA=cv.nA; nB=cv.nB; dA=cv.L; dB=cv.L; }
    barsAt(svg,x0,75,W,H,dA,nA,'A',{ split:splitFx&&showCommon });
    barsAt(svg,x0,275,W,H,dB,nB,'B',{ split:splitFx&&showCommon });
    drawFrac(svg,x0+W+75,128,nA,dA,'improper',false);
    drawFrac(svg,x0+W+75,328,nB,dB,'improper',false);
    var sign=FC.cmpSign(An,Ad,Bn,Bd), eq=(sign==='＝');
    txt(svg,VBW/2,238,sign,eq?86:78,eq?WHOLE:INK,'middle','fr-sign');
  }

  /* ── 퀴즈 ── */
  function renderQuiz(svg){
    var SX=40, SW=600, px=770;
    if(qDir==='make'){
      txt(svg,px,80,'이만큼 색칠해 봐요',24,MUT);
      drawFrac(svg,px,200,qN,qD,'improper',true);
      barsAt(svg,SX,(VBH-200)/2-30,SW,200,Sd,Sn,'S');
      if(qPhase==='right'){
        txt(svg,px,340,'⭕ 정답!',46,GOOD);
        if(equivFx){
          svg.appendChild(svgEl('rect',{ x:px-190, y:368, width:380, height:44, rx:12,
            fill:'rgba(18,184,134,0.2)', stroke:GOOD, 'stroke-width':2, class:'fr-banner' }));
          txt(svg,px,398,'✨ '+Sn+'/'+Sd+' = '+qN+'/'+qD+' 같은 양!',24,GOOD,'middle','fr-banner');
        }
      } else if(qPhase==='wrong'){
        txt(svg,px,340,'다시 해 볼까요?',34,WARN);
      }
    } else {
      txt(svg,SX+SW/2,64,'이 그림은 얼마일까요?',24,MUT);
      var wholes=Math.max(1,Math.ceil(qN/qD)), gap=18, ww=(SW-gap*(wholes-1))/wholes, gk=0;
      for(var w=0;w<wholes;w++){
        var wx=SX+w*(ww+gap), cw=ww/qD, y0=140;
        for(var i=0;i<qD;i++){
          var on=gk<qN;
          svg.appendChild(svgEl('rect',{ x:wx+i*cw, y:y0, width:cw, height:170, rx:4,
            fill:on?'url(#frA)':EMPTY, stroke:SEAM, 'stroke-width':4, 'pointer-events':'none' }));
          gk++;
        }
        svg.appendChild(svgEl('rect',{ x:wx, y:y0, width:ww, height:170, rx:13,
          fill:'none', stroke:A_EDGE, 'stroke-width':4, 'pointer-events':'none' }));
      }
      txt(svg,px,80,'내 답',24,MUT);
      drawFrac(svg,px,200,gN,gD,'improper',true);
      if(qPhase==='right') txt(svg,px,340,'⭕ 정답!',46,GOOD);
      else if(qPhase==='wrong') txt(svg,px,340,'다시 해 볼까요?',34,WARN);
    }
  }

  /* ── 상태줄 (v2 문구 그대로) ── */
  function updateStatus(){
    var st=$('statusRow'), h='', sub='';
    if(klMode==='quiz'){
      if(qDir==='make'){
        h='<div class="timeread"><span class="u">지금: </span><span class="g">'+Sn+'</span>'
          +'<span class="u"> / </span><span class="b">'+Sd+'</span></div>';
        sub=(qPhase==='right')
          ? (equivFx?'<span class="go">✨ '+Sn+'/'+Sd+' = '+qN+'/'+qD+' 같은 양!</span> · ↻ 다음 문제'
                    :'<span class="go">⭕ 정답!</span> · ↻ 다음 문제')
          : (qPhase==='wrong'?'<span class="grabline">목표 '+qN+'/'+qD+', 지금 '+Sn+'/'+Sd+'</span>'
                             :'다 만들면 <b>✓ 확인</b>');
      } else {
        h='<div class="timeread"><span class="u">내 답: </span><span class="g">'+gN+'</span>'
          +'<span class="u"> / </span><span class="b">'+gD+'</span></div>';
        sub=(qPhase==='right')?'<span class="go">⭕ 정답!</span> · ↻ 다음 문제'
           :(qPhase==='wrong'?'<span class="grabline">그림을 잘 세어 봐요</span>'
                             :'분자·분모 맞추고 <b>✓</b>');
      }
      st.innerHTML=h+'<div class="hint">'+sub+'</div>';
      return;
    }
    if(mode==='compare'){
      var sign=FC.cmpSign(An,Ad,Bn,Bd), eq=(sign==='＝');
      h='<div class="timeread"><span class="g">'+An+'/'+Ad+'</span><span class="u"> '+sign+' </span>'
        +'<span class="o">'+Bn+'/'+Bd+'</span></div>';
      /* ★ v2 결함 수정: v2의 「크기가 같아요 — 동치분수!」는 «도달 불가능한 죽은 코드»였다.
         조건이 `commonOn && Ad!==Bd`(경고) → `else if(eq && An!==Bn)`(동치) 순서인데,
         분모가 같으면서 값이 같으면 분자도 같아지므로 An!==Bn이 성립할 수 없다.
         즉 1/2 vs 2/4 같은 «교과서적 동치분수»에서도 이 문구가 한 번도 뜨지 않았다.
         → 통분해서 두 분수가 완전히 같아진 순간에 동치분수를 «말해 준다». 문구는 v2 그대로. */
      if(commonOn()&&Ad!==Bd){
        if(commonized){
          sub='<span class="go">분모를 '+FC.lcm(Ad,Bd)+'로 같게! 이제 조각 수로 바로 비교돼요</span>';
          if(eq) sub+='<br><span class="go">크기가 같아요 — 동치분수!</span>';
        } else {
          sub='<span class="grabline">분모가 달라요 — 조각 수로 바로 못 비교해요. ⚖ 를 눌러봐요</span>';
        }
      } else if(eq&&An!==Bn){
        sub='<span class="go">크기가 같아요 — 동치분수!</span>';
      } else sub='<span class="grabline">✋ 조각을 직접 눌러도 돼요</span>';
      st.innerHTML=h+'<div class="hint">'+sub+'</div>';
      return;
    }
    /* single — 표상별 */
    if(model==='line'){
      h='<div class="timeread"><span class="g">'+Sn+'</span><span class="u"> / </span><span class="b">'+Sd+'</span></div>';
      sub=(Sn===0)?'0 위치':(Sn+'/'+Sd+' 은 0에서 <b>'+Sn+'칸</b> (한 칸 = 1/'+Sd+')');
      sub+='<br><span class="grabline">✋ 선 위를 누르거나 ＋조각/＋등분으로 옮겨 봐요</span>';
      st.innerHTML=h+'<div class="hint">'+sub+'</div>';
      return;
    }
    if(model==='set'){
      var wn=FC.wholesOf(Sn,Sd,maxWholes), groups=Sd*wn;
      h='<div class="timeread"><span class="u">한 묶음 </span><span class="o">'+setPer+'</span>'
        +'<span class="u">개 × </span><span class="b">'+groups+'</span><span class="u">묶음 = </span>'
        +'<span class="p">'+(groups*setPer)+'</span><span class="u">개</span></div>';
      sub='<span class="go">색칠한 '+Sn+'묶음 = '+(Sn*setPer)+'개  ⟶  '+Sn+'/'+Sd
        +(wn>1?'':' (전체의 '+Sn+'/'+Sd+')')+'</span>';
      st.innerHTML=h+'<div class="hint">'+sub+'</div>';
      return;
    }
    if(model==='quotient'){
      var isInt=(Sn>0&&Sn%Sd===0);
      h='<div class="timeread"><span class="u">🍪 </span><span class="g">'+Sn+'</span>'
        +'<span class="u">개를 </span><span class="b">'+Sd+'</span><span class="u">명이 똑같이 나누면</span></div>';
      sub='<span class="go">'+Sn+' ÷ '+Sd+' = '+Sn+'/'+Sd+(isInt?' = '+(Sn/Sd):'')+'</span>'
        +'<br>한 명 몫(초록) = '+(isInt?(Sn/Sd)+'개':Sn+'/'+Sd+'개');
      if(Sn===0) sub+='<br><span class="grabline">✋ ＋조각으로 쿠키를 올려 봐요</span>';
      st.innerHTML=h+'<div class="hint">'+sub+'</div>';
      return;
    }
    /* area */
    var R=FC.reduceInfo(Sn,Sd);
    if(!equivOn()){
      /* ★ 저학년 — 약분·대분수 없이 「○분의 △」 읽기 닻 */
      h='<div class="timeread"><span class="g">'+Sn+'</span><span class="u"> / </span><span class="b">'+Sd+'</span></div>';
      sub='전체를 똑같이 <b>'+Sd+'</b>로 나눈 한 조각'
        +'<br><span class="go">'+Sd+'분의 '+Sn+' 이라고 읽어요</span>'
        +'<br>색칠한 조각 <b>'+Sn+'</b>개 = '+Sn+'/'+Sd;
      st.innerHTML=h+'<div class="hint">'+sub+'</div>';
      return;
    }
    var other=(notation==='improper')?'mixed':'improper';
    var o2=FC.notate(Sn,Sd,other);
    var subTxt=(other==='mixed')
      ? (o2.m!==null?((o2.whole?o2.whole+'과 ':'')+o2.m+'/'+o2.n):o2.whole)
      : (o2.m+'/'+o2.n);
    h='<div class="timeread"><span class="g">'+Sn+'</span><span class="u"> / </span><span class="b">'+Sd+'</span>'
      +'<span class="u"> ＝ '+subTxt+'</span></div>';
    sub='전체 1을 <b>'+Sd+'</b>로 나눈 조각 <b>'+Sn+'</b>개<br>';
    if(R.reduced) sub+='<span class="go">＝ '+R.rn+'/'+R.rd+' 로 약분돼요!</span>';
    else if(Sn>0&&!R.isWhole&&R.g===1) sub+='더 약분 못 해요 (기약분수)';
    else if(R.isWhole) sub+='<span class="go">＝ '+(Sn/Sd)+' (자연수가 됐어요!)</span>';
    else sub+='한 조각 = 1/'+Sd;
    st.innerHTML=h+'<div class="hint">'+sub+'</div>';
  }

  function updateButtons(){
    var ct=$('ctrlSlot');
    var d=function(sel,dis){ var b=ct.querySelector(sel); if(b) b.disabled=dis; };
    if(mode==='single'||(klMode==='quiz'&&qDir==='make')){
      d('[data-act="nplus"]',Sn>=Sd*maxWholes); d('[data-act="nminus"]',Sn<=0);
      d('[data-act="dplus"]',Sd>=maxDenom);     d('[data-act="dminus"]',Sd<=1);
      d('[data-act="perplus"]',setPer>=6);      d('[data-act="perminus"]',setPer<=1);
    } else if(klMode==='quiz'&&qDir==='guess'){
      d('[data-act="gnplus"]',gN>=gD*maxWholes); d('[data-act="gnminus"]',gN<=0);
      d('[data-act="gdplus"]',gD>=maxDenom);     d('[data-act="gdminus"]',gD<=1);
    } else if(mode==='compare'){
      ct.querySelectorAll('[data-set]').forEach(function(b){
        var s=b.dataset.set, k=b.dataset.k, dd=+b.dataset.d;
        var dn=(s==='A')?Ad:Bd, nm=(s==='A')?An:Bn;
        b.disabled=(k==='n')?((dd>0)?nm>=dn*maxWholes:nm<=0)
                            :((dd>0)?dn>=maxDenom:dn<=1);
      });
    }
  }

  function checkMission(){
    if(klMode!=='mission'||mDone||mLock) return;
    var M=curMissions();
    if(M[mStep].check(state())){
      mLock=true; snd('chime');
      K3.toast('🎉 참 잘했어요!');
      setTimeout(function(){
        mLock=false; mStep++;
        if(mStep>=M.length){ mStep=M.length-1; mDone=true; }
        build();
      }, STEP_MS);
    }
  }

  $('sndBtn').addEventListener('click',function(){
    K3.sound.setOn(!K3.sound.on);
    this.textContent=K3.sound.on?'🔊':'🔇';
    this.classList.toggle('off',!K3.sound.on);
    if(K3.sound.on)snd('select');
  });

  if(klMode==='quiz') loadQuiz();
  build();

  window.FracApp={
    get grade(){return grade;}, get klMode(){return klMode;}, get mode(){return mode;},
    get model(){return model;}, get shape(){return shape;}, get notation(){return notation;},
    get models(){return models.slice();},
    get Sn(){return Sn;}, get Sd(){return Sd;}, get An(){return An;}, get Ad(){return Ad;},
    get Bn(){return Bn;}, get Bd(){return Bd;}, get setPer(){return setPer;},
    get maxDenom(){return maxDenom;}, get maxWholes(){return maxWholes;},
    get commonized(){return commonized;}, get magicShown(){return magicShown;}, get pred(){return pred;},
    get mStep(){return mStep;}, get mDone(){return mDone;},
    get qDir(){return qDir;}, get qN(){return qN;}, get qD(){return qD;}, get qPhase(){return qPhase;},
    get qScore(){return qScore;}, get qCount(){return qCount;}, get gN(){return gN;}, get gD(){return gD;},
    get equivFx(){return equivFx;},
    setGrade:setGrade, setKlMode:setKlMode, setMode:setMode, setModel:setModel,
    setShape:setShape, setNotation:setNotation, setDir:setDir,
    act:function(a){ var f=H[a]; if(f)f(); },
    setFrac:setFrac, setPair:setPair, setGuess:function(n,d){ gN=n; gD=d; qPhase='try'; render(); },
    commonize:commonize, check:check, next:next, build:build
  };
})();
</script>
<script src="/kedu_back.js"></script>
</body>

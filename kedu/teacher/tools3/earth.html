<!-- ═══ 순수 로직 (window.EarthSim · node 테스트 대상 · DOM/THREE 무의존) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 천문 수리 (v2 무손실) ── */
  function sunDot(h, lat){
    var ang=((h-12)/24)*2*Math.PI;          /* 정오=0 · 자정=±π */
    var latr=(lat||0)*Math.PI/180;
    return Math.cos(latr)*Math.cos(ang);    /* 태양 고도의 sin */
  }
  function timeOfDay(h, lat){
    var d=sunDot(h, lat);
    if(d>0.06) return (h<12?'morning':(h<13.5?'noon':'afternoon'));
    if(d<-0.06) return 'night';
    return (h<12?'sunrise':'sunset');
  }
  function clockStr(h){
    var hh=Math.floor(h)%24, mm=Math.floor((h-Math.floor(h))*60);
    return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  }
  /* 자전각 ↔ 시각 (🔴 지구 잡아 돌리기 = 역산이 핵심) */
  function angleOf(h){ return ((h-12)/24)*2*Math.PI; }
  function hourFromAngle(a){
    var h=12+(a/(2*Math.PI))*24;
    return ((h%24)+24)%24;
  }
  function wrapHour(h){ return ((h%24)+24)%24; }

  /* ── 와우: 거리 오개념 (v2 상수·수리 무손실) ── */
  var SUN_DIST_KM=149600000, EARTH_R_KM=6371;
  function dayDistKm(){ return SUN_DIST_KM-EARTH_R_KM; }
  function nightDistKm(){ return SUN_DIST_KM+EARTH_R_KM; }
  function distDiffKm(){ return 2*EARTH_R_KM; }
  function distDiffPct(){ return 2*EARTH_R_KM/SUN_DIST_KM*100; }
  function fmtKm(n){
    n=Math.round(n);
    var eok=Math.floor(n/100000000), man=Math.floor((n%100000000)/10000), rest=n%10000, s='';
    if(eok) s+=eok+'억 ';
    if(man) s+=man+'만 ';
    if(rest||!s) s+=rest;
    return s.trim();
  }

  /* ── 우리나라 하늘 창 (v2 renderSky 수리 무손실) ── */
  function skySun(h, lat, rev){
    var day=(h>=6 && h<=18);
    if(!day) return { day:false };
    var t=(h-6)/12;                                        /* 0=동 → 1=서 */
    var x=-64+128*t;
    if(rev) x=-x;                                          /* 거꾸로 자전 = 서→동 */
    var amp=58*Math.max(0.15, Math.cos((lat||0)*Math.PI/180));  /* 위도 높을수록 태양이 낮게 */
    var y=30-Math.sin(t*Math.PI)*amp;
    return { day:true, t:t, x:x, y:y };
  }

  /* ── 학년 칸 (v2 GRADES 무손실) ── */
  var GRADES={
    low:  { modes:['free','mission'],        quiz:false, wow:false, whatif:false, missionN:3,
            v2:{ pin:false, spd:false, dir:false, view:false } },
    mid:  { modes:['free','mission','quiz'], quiz:true,  wow:false, whatif:false, missionN:4,
            v2:{ pin:true,  spd:false, dir:false, view:false } },
    high: { modes:['free','mission','quiz'], quiz:true,  wow:true,  whatif:true,  missionN:6,
            v2:{ pin:true,  spd:true,  dir:true,  view:true } }
  };

  /* ── 미션 (v2 문구·판정 무손실 — 학년별 풀) ── */
  var LOW_MISSIONS=[
    { type:'make', text:'☀️ 지구를 돌려 <b>환한 낮(점심때쯤)</b>을 만들어 봐요!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='noon'; } },
    { type:'make', text:'🌙 이번엔 반대로 — <b>깜깜한 밤</b>으로 옮겨 봐요!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='night'; } },
    { type:'make', text:'▶ <b>하루 재생</b>을 켜고 지구가 빙글 한 바퀴 도는 걸 지켜봐요!',
      check:function(s){ return s.spinAcc>=24; } }
  ];
  var MID_MISSIONS=[
    { type:'make', text:'☀️ 지구를 돌려 <b>우리나라 정오</b>를 만들어 봐요!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='noon'; } },
    { type:'make', text:'🌙 태양 반대쪽 — <b>한밤(자정쯤)</b>으로!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='night'; } },
    { type:'make', text:'🌅 낮과 밤의 경계, <b>해돋이(아침 6시쯤)</b>를 잡아 봐요!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='sunrise'; } },
    { type:'make', text:'▶ <b>하루 재생</b>으로 지구가 한 바퀴(하루) 자전하는 걸 끝까지 봐요!',
      check:function(s){ return s.spinAcc>=24; } }
  ];
  var HIGH_MISSIONS=[
    { type:'make', text:'☀️ 지구를 돌려 <b>우리나라 정오(낮 12시쯤)</b>를 만들어 봐요!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='noon'; } },
    { type:'think', text:'🤔 우리 눈엔 <b>태양이 하늘을 가로질러 움직이는</b> 것처럼 보여요. 진짜는 무엇이 움직일까요?',
      ch:['지구가 자전해서 그렇게 보여요','태양이 지구 둘레를 돌아요','태양이 켜졌다 꺼졌다 해요'], a:0,
      why:'움직이는 건 우리(지구)! 회전목마를 타면 바깥 풍경이 도는 것처럼 보이는 것과 같아요.' },
    { type:'make', text:'🌙 이번엔 태양 반대쪽 — <b>한밤(자정쯤)</b>으로!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='night'; } },
    { type:'make', text:'🌅 낮과 밤의 경계, <b>해돋이(아침 6시쯤)</b> 순간을 잡아 봐요!',
      check:function(s){ return timeOfDay(s.hour, s.lat)==='sunrise'; } },
    { type:'make', text:'▶ <b>하루 재생</b>을 켜고 지구가 한 바퀴 도는 걸 끝까지 지켜봐요!',
      check:function(s){ return s.spinAcc>=24; } },
    { type:'think', text:'🤔 마지막 질문! 내일 아침, 해는 <b>어느 쪽</b>에서 뜰까요?',
      ch:['동쪽 — 지구가 늘 같은 방향(서→동)으로 도니까','서쪽 — 날마다 바뀌니까','남쪽 — 한국은 남쪽이 밝으니까'], a:0,
      why:'지구는 언제나 서→동으로 자전해요. 그래서 해는 어제도 내일도 동쪽에서!' }
  ];

  /* ── 퀴즈 (v2 무손실 — 장면 관찰형) ── */
  var QUIZ=[
    { hour:12, q:'빨간 핀(우리나라)이 태양 쪽을 보고 있어요. 지금 우리나라는?', ch:['낮','밤','알 수 없어요'], a:0 },
    { hour:0,  q:'빨간 핀이 태양 반대쪽에 있어요. 지금 우리나라는?', ch:['밤','낮','정오'], a:0 },
    { hour:12, q:'낮과 밤이 생기는 까닭은 무엇일까요?', ch:['지구가 자전해서','태양이 지구 둘레를 돌아서','달이 태양을 가려서'], a:0 },
    { hour:18, q:'지구가 한 바퀴 자전하는 데 걸리는 시간은?', ch:['하루 (24시간)','한 달','일 년'], a:0 },
    { hour:6,  q:'지구의 자전 방향은 어느 쪽일까요?', ch:['서쪽 → 동쪽','동쪽 → 서쪽','북쪽 → 남쪽'], a:0 }
  ];

  /* ── 만약에 4종 (v2 무손실 + v3 조작 게이트) ── */
  var WHATIF={
    rev:  { icon:'🔄', title:'지구가 거꾸로 자전한다면?',
      q:'지구가 반대 방향으로 자전하면, 해는 어느 쪽에서 뜰까요?',
      ch:['서쪽에서 떠요!','동쪽 그대로예요','해가 안 떠요'], a:0,
      tip:'▶ 하루 재생을 눌러 봐요 — 빨간 핀이 반대로 돌아요!',
      reveal:'「해가 서쪽에서 뜨겠네」라는 말 알죠? 자전이 거꾸로면 진짜로 서쪽에서 해가 떠요. 해 뜨는 방향은 지구의 자전 방향이 정하는 거예요!',
      chip:'🔄 역방향 → 해가 서쪽에서', need:8 },
    fast: { icon:'⏩', title:'자전이 2배 빨라진다면?',
      q:'지구가 2배 빨리 돌면 하루는 어떻게 될까요?',
      ch:['12시간으로 짧아져요','24시간 그대로예요','이틀(48시간)이 돼요'], a:0,
      tip:'▶ 하루 재생 — 시계가 휙휙! 하루가 두 배 빨리 지나가요.',
      reveal:'하루 = 지구가 한 바퀴 도는 시간! 2배 빨리 돌면 하루가 12시간 — 낮 6시간, 밤 6시간이 돼요. 잠잘 시간이 모자라겠죠?',
      chip:'⏩ 2배 자전 → 하루 12시간', need:14 },
    stop: { icon:'⏸', title:'자전이 멈춘다면?',
      q:'자전이 딱 멈추면, 지금 낮인 곳은 어떻게 될까요?',
      ch:['아주 오랫동안 낮이 계속돼요','곧바로 밤이 돼요','지금처럼 하루가 흘러요'], a:0,
      tip:'▶ 시간 흐르기 — 시간이 흘러도 시계와 핀이 그대로예요!',
      reveal:'자전이 멈추면 태양 쪽은 계속 낮! (아주 느린 공전 때문에 결국 바뀌긴 하지만, 반년짜리 낮이에요.) 하루의 리듬은 자전이 만든다는 것!',
      chip:'⏸ 멈춤 → 낮이 계속', need:6 },
    big:  { icon:'🌍', title:'지구가 2배 커진다면?',
      q:'지구가 2배 커지면(도는 빠르기는 그대로), 하루 길이는 어떻게 될까요?',
      ch:['24시간 그대로예요','48시간으로 길어져요','12시간으로 짧아져요'], a:0,
      tip:'▶ 하루 재생 — 커다래진 지구도 시계는 똑같이 하루 한 바퀴!',
      reveal:'하루 = 지구가 한 바퀴 도는 시간! 커져도 도는 횟수는 그대로라 하루는 24시간이에요. 대신 적도의 땅은 2배 먼 길을 같은 시간에 달리니 2배 빨리 움직이는 셈 — 하루의 길이는 크기가 아니라 도는 횟수가 정해요.',
      chip:'🌍 2배 크기 → 하루 그대로', need:14 }
  };
  var WIF_KEYS=['rev','fast','stop','big'];

  function createSim(grade, opts){
    grade=(['low','mid','high'].indexOf(grade)>=0)?grade:'high';
    opts=opts||{};
    var sim={};
    sim.grade=grade;
    sim.G=function(){ return GRADES[sim.grade]; };
    sim.lat0=(typeof opts.lat==='number' && !isNaN(opts.lat))?Math.max(-90,Math.min(90,opts.lat)):37.5;
    sim.hour0=(typeof opts.hour==='number' && !isNaN(opts.hour))?wrapHour(opts.hour):12;

    sim.state={
      hour:sim.hour0, lat:sim.lat0,
      spinSpd:1, dirRev:false, viewMode:'space',
      playing:false, spinAcc:0, hrCnt:0,
      wif:null, wifPred:null, wifActed:false, wifDone:false,
      wowPred:null, distArmed:false,
      chips:[], chipToast:false,
      acted:false
    };

    sim.setHour=function(v){
      sim.state.hour=wrapHour(v);
      sim.state.acted=true;
      return sim.state.hour;
    };
    /* 🔴 잡아 돌리기: 자전각 델타 → 시각 델타 (역산) */
    sim.spinBy=function(dAngle){
      var h=sim.state.hour + (dAngle/(2*Math.PI))*24;
      sim.state.spinAcc += Math.abs((dAngle/(2*Math.PI))*24);
      return sim.setHour(h);
    };
    sim.setLat=function(v){
      sim.state.lat=Math.max(-90, Math.min(90, v));
      sim.state.acted=true;
      return sim.state.lat;
    };
    sim.setSpd=function(v){ sim.state.spinSpd=Math.max(0.25, Math.min(4, v)); sim.state.acted=true; return sim.state.spinSpd; };
    sim.toggleDir=function(){ sim.state.dirRev=!sim.state.dirRev; sim.state.acted=true; return sim.state.dirRev; };
    sim.toggleView=function(){ sim.state.viewMode=(sim.state.viewMode==='pin')?'space':'pin'; return sim.state.viewMode; };
    sim.togglePlay=function(){ sim.state.playing=!sim.state.playing; sim.state.acted=true; return sim.state.playing; };

    /* 시간 진행 (v2 loop 무손실 — 만약에가 속도·방향을 덮어씀) */
    sim.spinSpeed=function(){
      var st=sim.state;
      if(st.wif==='rev')  return -3;
      if(st.wif==='fast') return 6;
      if(st.wif==='big')  return 3;
      if(st.wif==='stop') return 0;
      return 3*st.spinSpd*(st.dirRev?-1:1);
    };
    sim.tick=function(dt){
      var st=sim.state;
      if(!st.playing) return;
      dt=Math.min(dt, 0.05);
      if(st.wif==='stop'){ st.hrCnt+=dt*8; st.wifActed=true; return; }   /* 멈춤: 시계만 흐름 */
      var spd=sim.spinSpeed();
      st.hour=wrapHour(st.hour + dt*spd);
      st.spinAcc += dt*Math.abs(spd);
      if(st.wif) st.wifActed=true;
    };
    sim.bigScale=function(){ return sim.state.wif==='big' ? 1.8 : 1; };
    sim.skyRev=function(){ return sim.state.wif==='rev' || sim.state.dirRev; };

    /* ── 만약에 흐름 (v3: 예측 → «조작» → 해소. 진입 즉시 자동 해소 차단) ── */
    sim.canWhatif=function(mode){ return mode==='free' && sim.G().whatif; };
    sim.wifStart=function(key){
      if(WIF_KEYS.indexOf(key)<0) return null;
      var st=sim.state;
      st.wif=key; st.wifPred=null; st.wifActed=false; st.wifDone=false;
      st.playing=false; st.spinAcc=0; st.hrCnt=0;
      st.hour=(key==='stop')?12:5;                 /* v2 onSelect 무손실 */
      st.distArmed=false; st.wowPred=null;
      return key;
    };
    sim.wifPredict=function(i){
      sim.state.wifPred=(typeof i==='number' && i>=0 && i<=2)?i:null;
      return sim.state.wifPred;
    };
    /* 해소 조건 = 학생이 실제로 «돌려 봤을 때»만 (조작 게이트) */
    sim.wifResolved=function(){
      var st=sim.state;
      if(!st.wif || st.wifDone || st.wifPred===null || !st.wifActed) return false;
      var need=WHATIF[st.wif].need;
      return (st.wif==='stop') ? (st.hrCnt>=need) : (st.spinAcc>=need);
    };
    sim.wifResolve=function(){
      var st=sim.state;
      if(!sim.wifResolved()) return null;
      st.wifDone=true;
      var W=WHATIF[st.wif];
      var hit=(st.wifPred===W.a);
      st.chips.push({ k:st.wif, hit:hit });
      var toast=(st.chips.length===5 && !st.chipToast);
      if(toast) st.chipToast=true;
      return { key:st.wif, hit:hit, reveal:W.reveal, chipToast:toast };
    };
    sim.wifExit=function(){
      var st=sim.state;
      st.wif=null; st.wifPred=null; st.wifActed=false; st.wifDone=false;
      st.playing=false; st.hour=12; st.spinAcc=0; st.hrCnt=0;
      return true;
    };
    sim.chipLabel=function(c){ return WHATIF[c.k].chip + ' ' + (c.hit?'✔예측적중':'✘예측빗나감'); };

    /* ── 와우: 낮·밤 거리 오개념 (v2 무손실 + 예측 카드 승격) ── */
    sim.canWow=function(mode){ return mode==='free' && sim.G().wow && !sim.state.wif; };
    sim.wowArm=function(){
      var st=sim.state;
      st.distArmed=true; st.wowPred=null;
      st.playing=false; st.hour=12; st.spinSpd=1; st.dirRev=false; st.viewMode='space';
      return st.hour;
    };
    sim.setWowPred=function(i){
      sim.state.wowPred=(typeof i==='number' && i>=0 && i<=2)?i:null;
      return sim.state.wowPred;
    };
    sim.wowReveal=function(){
      if(!sim.state.distArmed) return null;
      return {
        day:dayDistKm(), night:nightDistKm(), diff:distDiffKm(), pct:distDiffPct(),
        dayTxt:fmtKm(dayDistKm()), nightTxt:fmtKm(nightDistKm()), diffTxt:fmtKm(distDiffKm())
      };
    };
    sim.wowLine=function(){
      var p=sim.state.wowPred;
      if(p===null) return '';
      if(p===1) return '<br>🔮 「거의 같다」 — 네 예측이 딱 맞았어요!';
      return '<br>🔮 「'+(p===0?'훨씬 가깝다':'더 멀다')+'」고 예측했지만 — 예측이 빗나갔어요!';
    };
    /* 직접 조작 시 무장 해제 (예측→확인 구조 보호 · v2 clearDist) */
    sim.clearDist=function(){
      if(!sim.state.distArmed) return false;
      sim.state.distArmed=false; sim.state.wowPred=null;
      return true;
    };

    /* ── 미션 (v2 무손실 + acted 게이트) ── */
    sim.missionList=function(){
      if(sim.grade==='low') return LOW_MISSIONS.slice();
      if(sim.grade==='mid') return MID_MISSIONS.slice();
      return HIGH_MISSIONS.slice();
    };
    sim.mStep=0; sim.mDone=false;
    sim.missionStart=function(){
      sim.mStep=0; sim.mDone=false;
      var st=sim.state;
      st.hour=9; st.lat=sim.lat0;                 /* v2: 미션 진입 hour=9 (자동달성 방지) */
      st.playing=false; st.spinAcc=0; st.hrCnt=0;
      st.spinSpd=1; st.dirRev=false; st.viewMode='space';
      st.wif=null; st.wifPred=null; st.distArmed=false; st.wowPred=null;
      st.acted=false;
    };
    sim.missionCur=function(){ return sim.missionList()[sim.mStep]; };
    sim.missionCheck=function(){
      if(sim.mDone) return { act:'none' };
      var M=sim.missionList(), m=M[sim.mStep];
      if(m.type!=='make') return { act:'none' };                /* think = 카드로 처리 */
      if(!sim.state.acted) return { act:'none' };               /* 자동달성 없음 */
      if(!m.check(sim.state)) return { act:'none' };
      return sim.missionAdvance();
    };
    sim.missionAdvance=function(){
      var M=sim.missionList();
      sim.state.spinAcc=0; sim.state.acted=false;
      if(sim.mStep < M.length-1){
        sim.mStep++;
        return { act:'next', step:sim.mStep };
      }
      sim.mDone=true;
      return { act:'done' };
    };

    /* ── 퀴즈 (v2 무반복 순환 무손실 — rand 주입 순수화) ── */
    sim.qIdx=0; sim.qScore=0; sim.qCount=0; sim.qUsed=[];
    sim.quizList=function(){ return QUIZ.slice(); };
    sim.newQuiz=function(rand){
      rand=rand||Math.random;
      if(sim.qUsed.length>=QUIZ.length) sim.qUsed=[];
      var cand=[];
      for(var i=0;i<QUIZ.length;i++) if(sim.qUsed.indexOf(i)<0) cand.push(i);
      sim.qIdx=cand[Math.floor(rand()*cand.length)];
      sim.qUsed.push(sim.qIdx);
      sim.state.hour=QUIZ[sim.qIdx].hour;         /* 장면 세팅 */
      sim.state.playing=false;
      return sim.qIdx;
    };
    sim.quizAnswer=function(i){
      var q=QUIZ[sim.qIdx], ok=(i===q.a);
      sim.qCount++;
      if(ok) sim.qScore++;
      return { ok:ok, correct:q.ch[q.a] };
    };
    sim.quizReset=function(rand){
      sim.qScore=0; sim.qCount=0; sim.qUsed=[];
      sim.newQuiz(rand);
    };

    /* ── 상태줄 (v2 문구 무손실) ── */
    sim.statusText=function(mode){
      var st=sim.state, out={ lines:[], warn:false };
      if(mode==='quiz'){
        out.lines.push('지구와 빨간 핀, 태양을 잘 보고 답을 골라요! (화면을 끌어 돌려볼 수 있어요)');
        return out;
      }
      if(st.wif){
        var W=WHATIF[st.wif];
        out.warn=true;
        if(st.wif==='stop'){
          out.lines.push('<span class="big">⏱ +'+Math.floor(st.hrCnt)+'시간</span>');
          out.lines.push('시간이 흘러도 빨간 핀은 계속 낮 — 자전이 하루를 만들어요!');
        } else if(st.wif==='rev'){
          out.lines.push('🔄 거꾸로 도는 지구 — 빨간 핀의 아침이 어느 쪽에서 시작되는지 봐요!');
        } else if(st.wif==='big'){
          out.lines.push('🌍 2배로 커진 지구 — 그런데 시계를 봐요, 하루는 똑같이 한 바퀴 24시간!');
        } else {
          out.lines.push('⏩ 2배 자전 — 시계가 두 배 빨리! 낮도 밤도 절반씩이에요.');
        }
        if(!st.wifDone && st.wifPred!==null) out.lines.push('<span class="hold">'+W.tip+'</span>');
        return out;
      }
      var tod=timeOfDay(st.hour, st.lat), nm, sub;
      if(tod==='noon'){ nm='낮 · 정오 ☀️'; sub='우리나라가 태양을 정면으로 봐요. 태양이 하늘 가장 높이 떠 있어요.'; }
      else if(tod==='morning'){ nm='낮 · 아침 🌤️'; sub='우리나라가 막 태양 쪽으로 들어왔어요. 태양이 동쪽 하늘에 낮게 떠 있어요.'; }
      else if(tod==='afternoon'){ nm='낮 · 오후 🌇'; sub='태양이 서쪽으로 기울어요. 곧 우리나라가 어두운 쪽(밤)으로 들어가요.'; }
      else if(tod==='sunrise'){ nm='해돋이 🌅'; sub='낮과 밤의 경계예요. 자전으로 우리나라가 태양 쪽으로 막 들어오는 순간 — 해가 떠요.'; }
      else if(tod==='sunset'){ nm='해넘이 🌆'; sub='낮과 밤의 경계예요. 우리나라가 태양 반대쪽으로 넘어가는 순간 — 해가 져요.'; }
      else { nm='밤 🌙'; sub='우리나라가 태양 반대쪽이에요. 태양 빛이 닿지 않아 어두운 밤이에요.'; }
      out.lines.push('<span class="big">'+clockStr(st.hour)+' — '+nm+'</span>');
      out.lines.push(sub);
      out.lines.push(sim.grade==='low'
        ? '지구가 빙글 돌아서 낮과 밤이 생겨요. ☀️🌙'
        : '지구는 하루에 한 바퀴 서→동으로 자전해요. 태양이 도는 게 아니라 지구가 돌아서 낮과 밤이 생겨요.');
      if(mode==='free' && Math.abs(st.lat)>=80){
        out.lines.push('🧊 극지방 — (축이 안 기운 이 지구에선) 태양이 지평선에 딱 붙어 돌아요. 계절 도구에서 기울기를 만나면 백야가 생겨요!');
      }
      if(mode==='free' && st.viewMode==='pin'){
        out.lines.push('📍 핀 위 시점 — 하늘(태양)이 도는 게 아니라 우리가 돌고 있어요!');
      }
      if(mode==='free' && st.distArmed){
        out.lines.push('<span class="hold">낮과 밤을 가르는 건 「거리」일까요, 태양을 「향한 방향」일까요? 📏</span>');
      }
      return out;
    };

    return sim;
  }

  var API={ sunDot:sunDot, timeOfDay:timeOfDay, clockStr:clockStr,
    angleOf:angleOf, hourFromAngle:hourFromAngle, wrapHour:wrapHour, skySun:skySun,
    SUN_DIST_KM:SUN_DIST_KM, EARTH_R_KM:EARTH_R_KM,
    dayDistKm:dayDistKm, nightDistKm:nightDistKm, distDiffKm:distDiffKm, distDiffPct:distDiffPct, fmtKm:fmtKm,
    GRADES:GRADES, LOW_MISSIONS:LOW_MISSIONS, MID_MISSIONS:MID_MISSIONS, HIGH_MISSIONS:HIGH_MISSIONS,
    QUIZ:QUIZ, WHATIF:WHATIF, WIF_KEYS:WIF_KEYS, createSim:createSim };
  if(typeof window!=='undefined') window.EarthSim=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();

<script type="module">

/* 태양광 = 한 방향 평행광(+X). 밤면은 형체만 보이게 (터미네이터 선명도 = 검수 항목) */

/* 별 900 */
{

/* 🔴 대기 프레넬 림 — BackSide 커스텀 셰이더(뷰 프레넬 × 태양 방향 가중) */

  side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});

      ' km)</b>뿐 — 태양까지 거리의 <b>' + r.pct.toFixed(3) + '%</b>예요.<br>낮과 밤은 <b>「거리」가 아니라</b> 태양을 <b>「향했느냐 등졌느냐」</b>의 차이!' +

function wifTick() {
  if (!sim.wifResolved()) return;

  if (r.hit) K3.sound.play('ting');

  K3.toast(

  );

/* ── 🔴 지구 잡아 돌리기 · 핀 잡아 위도 이동 ── */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let grab = null, lastXY = null;
function pick(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  if (sim.G().v2.pin && mode === 'free' && ray.intersectObject(pinProxy, false).length) return 'pin';
  if (ray.intersectObject(earthMesh, false).length) return 'earth';
  return null;
}
renderer.domElement.addEventListener('pointerdown', e => {
  hideHint();
  if (sim.state.viewMode === 'pin' || mode === 'quiz') return;   /* 퀴즈·핀 시점 = 시간 조작 잠금 */
  const p = pick(e.clientX || 0, e.clientY || 0);
  if (!p) return;
  grab = p;
  lastXY = [e.clientX || 0, e.clientY || 0];
  controls.enabled = false;
  if (sim.state.playing) { sim.togglePlay(); renderCtrls(); }
  sim.clearDist();
  K3.sound.play('tap');
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!grab) return;
  const x = e.clientX || 0, y = e.clientY || 0;
  const dx = x - lastXY[0], dy = y - lastXY[1];
  lastXY = [x, y];
  if (grab === 'pin') {
    sim.setLat(sim.state.lat + (-dy) * 0.4);        /* 위로 끌면 북쪽 */
    placePin();
  } else {
    /* 가로 드래그 → 자전각 → 시각 역산 (신기술) */
    sim.spinBy(dx * 0.0075);
    earthGrp.rotation.y = Sim.angleOf(sim.state.hour);
  }
  renderSky(); renderStatus(); renderCtrls();
  missionTick();
});
function endGrab() {
  if (!grab) return;
  grab = null;
  controls.enabled = (sim.state.viewMode === 'space');
}
renderer.domElement.addEventListener('pointerup', endGrab);
renderer.domElement.addEventListener('pointercancel', endGrab);

/* ── 미션 ── */
let thinkOpen = false;
function missionTick() {
  if (mode !== 'mission' || sim.mDone) return;
  const cur = sim.missionCur();
  if (cur.type === 'think') { openThink(cur); return; }
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  setTimeout(() => { renderAll(); missionTick(); }, T(1300));
}
function openThink(m) {
  if (thinkOpen) return;
  thinkOpen = true;
  K3.cards.predict(m.text.replace(/<[^>]+>/g, ''), m.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      thinkOpen = false;
      if (+v === m.a) {
        K3.sound.play('chime'); K3.sound.play('ting');
        K3.toast('🎉 정답!<br>' + m.why, false, T(4200));
        const r = sim.missionAdvance();
        setTimeout(() => { renderAll(); if (!sim.mDone) missionTick(); }, T(1400));
      } else {
        K3.sound.play('fail');
        K3.toast('음… 다시 생각해 볼까요? 지구가 무엇을 하고 있는지 봐요!', true, T(2600));
        setTimeout(() => missionTick(), T(2700));
      }
    });
}

/* ── 모드·학년 ── */
function setGrade(g) {
  sim.grade = g;
  if (!sim.G().modes.includes(mode)) mode = 'free';
  if (!sim.G().v2.view) sim.state.viewMode = 'space';
  sim.wifExit(); sim.clearDist();
  sim.state.lat = sim.lat0; sim.state.spinSpd = 1; sim.state.dirRev = false;
  controls.enabled = true;
  if (mode === 'mission') sim.missionStart();
  else if (mode === 'quiz') sim.quizReset(Math.random);
  else sim.state.hour = sim.hour0;
  syncScene(); renderAll();
  if (mode === 'mission') missionTick();
}
function setMode(m) {
  mode = m;
  sim.wifExit(); sim.clearDist();
  sim.state.viewMode = 'space'; sim.state.lat = sim.lat0;
  sim.state.spinSpd = 1; sim.state.dirRev = false;
  controls.enabled = true;
  qLock = false;
  if (m === 'mission') sim.missionStart();
  else if (m === 'quiz') sim.quizReset(Math.random);
  else sim.state.hour = 12;
  syncScene(); renderAll();
  if (m === 'mission') missionTick();
}

const clock = new THREE.Clock();
const FASTX = window.__K3_FAST ? 14 : 1;
const _pv = new THREE.Vector3();
const _sunDir = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()) * FASTX;

  if (sim.state.playing) {
    sim.tick(dt);
    syncScene();
    renderStatus();
    const hs = $('hourSlider');
    if (hs) hs.value = sim.state.hour.toFixed(2);
    if (mode === 'mission') missionTick();
    if (sim.state.wif) wifTick();
  }

  /* 핀 위 시점 = 지표 1인칭 (v2 camPos 무손실) */
  if (sim.state.viewMode === 'pin') {
    pin.getWorldPosition(_pv);
    camera.position.copy(_pv).multiplyScalar(1.55);
    camera.position.y += 0.12;
    camera.lookAt(sunSpr.position);
  }

  /* 프레넬 림에 태양 방향 주입 (지구 회전과 무관한 월드 방향) */
  _sunDir.copy(sun.position).normalize();
  rimMat.uniforms.uSun.value.copy(_sunDir);

  /* 핀 라벨 투영 */
  if (mode !== 'quiz' && sim.state.viewMode === 'space') {
    pin.getWorldPosition(_pv);
    const wp = _pv.clone();
    _pv.project(camera);
    const facing = wp.clone().normalize().dot(camera.position.clone().normalize());
    if (_pv.z < 1 && facing > -0.15) {
      pinAnno.style.left = ((_pv.x * 0.5 + 0.5) * innerWidth) + 'px';
      pinAnno.style.top = ((-_pv.y * 0.5 + 0.5) * innerHeight - 22) + 'px';
      pinAnno.style.display = '';
    } else pinAnno.style.display = 'none';
  } else pinAnno.style.display = 'none';

  controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}

if (mode === 'mission') sim.missionStart();
else if (mode === 'quiz') sim.quizReset(Math.random);
syncScene();
renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast('지구를 <b>잡아서 돌려 봐요</b> — 시간이 흐르고 낮과 밤이 바뀌어요!');
animate();
if (mode === 'mission') missionTick();

/* 테스트용 앱 훅 */
window.EarthApp = {
  sim, get mode() { return mode; }, setMode, setGrade, act, startWhatif,
  earthGrp, earthMesh, pin, pinProxy, rim, rimMat, sunSpr, camera, sun,
  get texReal() { return texReal; },
  syncScene, renderAll, missionTick, wifTick,
  spinDrag(dx) { sim.spinBy(dx * 0.0075); syncScene(); renderStatus(); renderCtrls(); missionTick(); },
  dragPinLat(dy) { sim.setLat(sim.state.lat + (-dy) * 0.4); placePin(); renderStatus(); renderCtrls(); },
  setHour(v) { sim.setHour(v); syncScene(); renderStatus(); renderCtrls(); missionTick(); },
  runFor(sec) {
    sim.state.playing = true;
    for (let t = 0; t < sec; t += 0.05) sim.tick(0.05);
    syncScene(); renderStatus(); renderCtrls();
    if (mode === 'mission') missionTick();
    if (sim.state.wif) wifTick();
  },
  answerQuiz(i) { const btns = document.querySelectorAll('#choices button'); for (const b of btns) if (+b.dataset.v === i) { b.click(); return true; } return false; }
};
</script>
<script src="/kedu_back.js"></script>

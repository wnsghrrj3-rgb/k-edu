<!--
  케이랩 v3 · B트랙 양산 4호 — 나눗셈 모형 (2026-07-13) · 셸 = clock/tenframe/place_value/array 계보
  SPEC = handoff/klab/designs3/SPEC_division.md (도면=정답)
  v2(engine/tools/division.js 243줄) 콘텐츠 무손실 이식:
    학년칸(저 12·등분제만·÷ 기호 노출 금지·나머지/퀴즈 숨김 / 중 20·포함제·나머지·÷ 식·몫 퀴즈 / 고 30·나머지 퀴즈)
    미션(저2·중3·고4) · 퀴즈(몫/나머지) · 상태줄 3형 · 토글(몇 묶음으로 | 몇 개씩)
    와우A(±로 나누다가 «어! 못 들어가는 알»이 튀어나오는 나머지 등장 — pop+tap·튀어오름·플래시)
  v3 질감: 다크 스튜디오 + 원목 매트, 원목 접시(나뭇결 그라데이션·테 하이라이트),
          담긴 알 = 초록 사탕 유리알 · 남은 알 = 주황 유리알.
  v3 신설 — 와우B(🔮 예측 카드: 「12개를 3묶음(한 묶음 4개). 묶음을 4개로 «늘리면» 한 묶음은?」
    ① 5개(늘렸으니 늘어난다) / ② 3개(나눌 곳이 늘면 줄어든다) / ③ 4개(그대로) → 재분배를 목격 →
    결과 카드: 「전체는 그대로인데 나눌 곳이 늘면 몫은 «작아진다» — 12÷3=4, 12÷4=3」. 반복 가능)
    ※ array 와우B(늘리면 줄 수만큼 는다)와 짝을 이루는 «나눗셈의 반비례» 오개념.
  ⚠️ v2 라이브 버그 수정(SPEC §6 확정 설계):
    미션 진입 기본값(12,3)이 미션① 조건과 같고, 미션 간 리셋 시드(7,3,4)가 미션②(나머지>0) 조건을
    이미 충족 → 학생이 «아무것도 안 해도» ①→② 연쇄 자동달성, 미션 ③부터 시작됐다.
    → acted 게이트: 미션 시작마다 acted=false, ±·토글 조작이 있어야 판정. 문구·판정식·시드는 그대로.
  config: ?grade= & mode= & total= & groups= & size= & divMode=(partition|quotition)
-->

<!-- ═══ 순수 로직 (node/jsdom 테스트 대상 · DOM 무의존) ═══ -->
<script>
(function(){
  'use strict';
  /* SPEC §1 — GRADES 전문 보존 */
  var GRADES={
    low:  { modes:['free','mission'],        maxTotal:12, quotition:false, eqSign:false, quiz:false, askRem:false },
    mid:  { modes:['free','mission','quiz'], maxTotal:20, quotition:true,  eqSign:true,  quiz:true,  askRem:false },
    high: { modes:['free','mission','quiz'], maxTotal:30, quotition:true,  eqSign:true,  quiz:true,  askRem:true  }
  };
  var GRADE_LABEL={ low:'저학년', mid:'중학년', high:'고학년' };
  var MODE_LABEL={ free:'자유탐구', mission:'미션', quiz:'퀴즈' };

  /* 핵심 수리 — 등분제(몇 묶음으로) / 포함제(몇 개씩) */
  function derive(T,dMode,G2,S){
    if(dMode==='quotition'){
      var nb=Math.floor(T/S), rem=T-S*nb;
      var g=nb+(rem>0?1:0); if(g<1) g=1;
      return { per:S, rem:rem, g:g, nb:nb };
    }
    var per=Math.floor(T/G2), r=T-per*G2;
    return { per:per, rem:r, g:G2, nb:G2 };
  }

  /* 미션 — v2 텍스트·판정 무손실. check(total,groups,size,dMode) */
  var LOW_MISSIONS=[
    { text:'<b>12</b>개를 <b>3묶음</b>으로 똑같이 나눠 봐요! 한 묶음에 몇 개?',
      check:function(t,g,s,dm){ return t===12&&g===3; } },
    { text:'<b>8</b>개를 <b>4묶음</b>으로 똑같이 나눠 봐요!',
      check:function(t,g,s,dm){ return t===8&&g===4; } }
  ];
  var MID_MISSIONS=[
    { text:'<b>12</b>개를 <b>3묶음</b>으로 똑같이 나눠 봐요! (12 ÷ 3)',
      check:function(t,g,s,dm){ return dm==='partition'&&t===12&&g===3; } },
    { text:'<b class="or">나머지</b>가 생기게 만들어 봐요! (똑 떨어지지 않게)',
      check:function(t,g,s,dm){ return derive(t,dm,g,s).rem>0; } },
    { text:'<b>[몇 개씩]</b>으로 바꾸고, <b>13</b>개를 <b>4개씩</b> 묶어 봐요!',
      check:function(t,g,s,dm){ return dm==='quotition'&&t===13&&s===4; } }
  ];
  var HIGH_MISSIONS=[
    { text:'<b>12</b>개를 <b>3묶음</b>으로 똑같이 나눠 봐요! (12 ÷ 3)',
      check:function(t,g,s,dm){ return dm==='partition'&&t===12&&g===3; } },
    { text:'<b class="or">나머지</b>가 생기게 만들어 봐요! (똑 떨어지지 않게)',
      check:function(t,g,s,dm){ return derive(t,dm,g,s).rem>0; } },
    { text:'<b>[몇 개씩]</b>으로 바꾸고, <b>13</b>개를 <b>4개씩</b> 묶어 봐요 — 몇 묶음에 몇 개가 남나요?',
      check:function(t,g,s,dm){ return dm==='quotition'&&t===13&&s===4; } },
    { text:'나머지가 <b class="gr">0</b>이 되게 (똑 떨어지게) 만들어 봐요!',
      check:function(t,g,s,dm){ return derive(t,dm,g,s).rem===0&&t>1; } }
  ];
  function missionsFor(grade){
    return (grade==='low')?LOW_MISSIONS:(grade==='mid')?MID_MISSIONS:HIGH_MISSIONS;
  }

  /* 퀴즈 — v2 로직 그대로, rand 주입으로 순수화 */
  function newQuiz(askRemAllowed,rand){
    rand=rand||Math.random;
    var qG=2+Math.floor(rand()*4);        // 2~5
    var quot=2+Math.floor(rand()*4);      // 2~5
    var rem=Math.floor(rand()*qG);        // 0~qG-1
    var qT=qG*quot+rem;
    var ask=(askRemAllowed&&rem>0&&rand()<0.45)?'rem':'quot';
    return { t:qT, g:qG, ask:ask };
  }
  function qAnswer(q){ return q.ask==='quot'?Math.floor(q.t/q.g):(q.t%q.g); }
  function qQuestion(q){
    return q.ask==='quot'
      ? (q.t+'개를 '+q.g+'묶음으로 똑같이 나누면 한 묶음에 몇 개?')
      : (q.t+'개를 '+q.g+'묶음으로 나누면 나머지는 몇 개?');
  }
  function quizChoices(ans,rand){
    rand=rand||Math.random;
    var set={}, out=[ans], guard=0; set[ans]=1;
    while(out.length<4&&guard++<200){
      var d=ans+(Math.floor(rand()*5)-2);
      if(d>=0&&d<=12&&!set[d]){ set[d]=1; out.push(d); }
    }
    /* 보기 4개 계약 — rand가 한 값에 갇혀도(테스트 스텁) 인접 수로 채운다 */
    for(var v=0; out.length<4 && v<=12; v++){ if(!set[v]){ set[v]=1; out.push(v); } }
    out.sort(function(a,b){ return a-b; });
    return out;
  }

  var API={ GRADES:GRADES, GRADE_LABEL:GRADE_LABEL, MODE_LABEL:MODE_LABEL,
            derive:derive, LOW_MISSIONS:LOW_MISSIONS, MID_MISSIONS:MID_MISSIONS, HIGH_MISSIONS:HIGH_MISSIONS,
            missionsFor:missionsFor, newQuiz:newQuiz, qAnswer:qAnswer, qQuestion:qQuestion,
            quizChoices:quizChoices };
  if(typeof window!=='undefined') window.DivCore=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

<script>
(function(){
  'use strict';
  var DC=window.DivCore, K3=window.K3;
  var $=function(id){ return document.getElementById(id); };
  document.documentElement.style.setProperty('--noise','url("'+K3.NOISE+'")');

  var Q=new URLSearchParams(location.search);
  var grade=(['low','mid','high'].indexOf(Q.get('grade'))>=0)?Q.get('grade'):'high';
  var locked=!!Q.get('grade');
  function G(){ return DC.GRADES[grade]; }
  function maxTotal(){ return G().maxTotal; }
  var cfgTotal=+Q.get('total')||12, cfgGroups=+Q.get('groups')||3, cfgSize=+Q.get('size')||4;

  var total=Math.min(cfgTotal,maxTotal());
  var groups=Math.max(1,cfgGroups), size=Math.max(1,cfgSize);
  var dMode=(G().quotition&&Q.get('divMode')==='quotition')?'quotition':'partition';
  var mode=(G().modes.indexOf(Q.get('mode'))>=0)?Q.get('mode'):'free';
  var mStep=0, mDone=false, mLock=false;
  var acted=false;              /* ★ 자동달성 차단 게이트(SPEC §6) */
  var prevRem=-1;               /* 나머지 등장 1회 플래시 */
  var quiz=null, qScore=0, qCount=0, qLock=false;
  var revealing=false, prediction=null;
  var STEP_MS=window.__K3_FAST?60:1500;
  var BEAT_MS=window.__K3_FAST?80:900;

  function snd(n){ K3.sound.play(n); }
  function curMissions(){ return DC.missionsFor(grade); }
  function der(){ return DC.derive(total,dMode,groups,size); }
  function missionStart(){ acted=false; }   /* 미션 진입·단계 전환마다 게이트를 닫는다 */

  /* ── 동작 (v2 무손실 + acted 게이트) ── */
  function act(f){
    return function(){
      if(revealing) return;
      if(!f()) return;
      acted=true;
      render({ act:'dist' });
      checkMission();
    };
  }
  var tp=act(function(){ if(total>=maxTotal()) return false; total++; return true; });
  var tm=act(function(){ if(total<=1) return false; total--; return true; });
  var gp=act(function(){ if(groups>=10) return false; groups++; return true; });
  var gm=act(function(){ if(groups<=1) return false; groups--; return true; });
  var sp=act(function(){ if(size>=maxTotal()) return false; size++; return true; });
  var sm=act(function(){ if(size<=1) return false; size--; return true; });
  function setDMode(m){
    if(revealing||dMode===m||!G().quotition) return;
    dMode=m; acted=true; snd('select');
    build();
    checkMission();
  }
  function reset(){
    if(revealing) return;
    snd('select');
    total=Math.min(cfgTotal,maxTotal()); groups=Math.max(1,cfgGroups); size=Math.max(1,cfgSize);
    render();   /* ↺는 조작으로 치지 않는다 — 시드 복귀만(자동달성 게이트 유지) */
  }
  function setTGS(t,g,s){   /* 테스트·연출 공용 */
    total=Math.max(1,Math.min(t,maxTotal()));
    groups=Math.max(1,g); size=Math.max(1,s);
    acted=true;
    render({ act:'dist' }); checkMission();
  }

  /* ── 와우B(v3 신설) — 🔮 「나눌 곳을 늘리면 한 묶음은?」(반비례) ── */
  function startReveal(){
    if(revealing) return;
    revealing=true;
    var T=Math.min(12,maxTotal());
    dMode='partition'; total=T; groups=3; render();      /* 무대 세팅(무음): 12를 3묶음 = 4개씩 */
    var before=DC.derive(T,'partition',3,size).per;
    setTimeout(function(){
      groups=4; snd('pop');
      render({ act:'dist', drop:true });                  /* 접시가 하나 늘고, 다시 나눠 담긴다 */
      setTimeout(function(){
        revealing=false;
        var after=DC.derive(T,'partition',4,size).per;
        var okP=(prediction==='less');
        K3.cards.result(
          '<h3 style="color:'+(okP?'#0d7a5c':'#B9522F')+'">'+(okP?'🎯 예측 적중!':'🤔 예측과 달랐죠?')+'</h3>'
          +'<p style="font-size:13.5px;line-height:1.75;color:#41546a">'
          +'사탕은 <b>'+T+'개</b> 그대로예요. 그런데 나눠 담을 접시가 <b>3개 → 4개</b>로 늘자, '
          +'한 접시의 몫은 <b>'+before+'개 → '+after+'개</b>로 <b>줄었어요</b>.<br>'
          +'나눌 곳이 많아지면 각자 받는 몫은 <b>작아진다</b> — 더하기·곱하기와는 반대 방향이죠.<br>'
          +'<b>'+T+' ÷ 3 ＝ '+before+' · '+T+' ÷ 4 ＝ '+after+'</b></p>',
          [{label:'🔁 다시 보기', value:'again'},{label:'좋아, 계속 탐구', cls:'pri', value:'done'}]
        ).then(function(v){ if(v==='again') startReveal(); });
      }, BEAT_MS+STEP_MS);
    }, BEAT_MS);
  }
  function askPredict(){
    if(revealing) return;
    snd('charge');
    var T=Math.min(12,maxTotal());
    var b=DC.derive(T,'partition',3,size).per, a=DC.derive(T,'partition',4,size).per;
    K3.cards.predict('사탕 <b>'+T+'개</b>를 접시 <b>3개</b>에 똑같이 나눠 담았어요(한 접시에 '+b+'개). '
      +'접시를 <b>4개</b>로 늘리면, 한 접시에는 몇 개가 될까요?',
      [{id:'more', label:'① '+(b+1)+'개 — 접시를 늘렸으니 더 많아진다'},
       {id:'less', label:'② '+a+'개 — 나눌 곳이 늘었으니 줄어든다'},
       {id:'same', label:'③ '+b+'개 — 그대로다'}]
    ).then(function(id){ prediction=id; startReveal(); });
  }

  /* ── 빌드 ── */
  function build(){
    var gs=$('gradeSeg');
    if(locked){ gs.style.display='none'; }
    else{
      gs.innerHTML=['low','mid','high'].map(function(g){
        return '<button data-g="'+g+'" class="'+(g===grade?'on':'')+'">'+DC.GRADE_LABEL[g]+'</button>';
      }).join('');
      gs.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){
          if(b.dataset.g===grade)return;
          grade=b.dataset.g; snd('select');
          if(G().modes.indexOf(mode)<0) mode='free';
          if(!G().quotition) dMode='partition';
          total=Math.min(cfgTotal,maxTotal()); groups=Math.max(1,cfgGroups); size=Math.max(1,cfgSize);
          mStep=0; mDone=false; mLock=false; revealing=false; prevRem=-1; missionStart();
          if(mode==='quiz'){ qScore=0; qCount=0; quiz=DC.newQuiz(G().askRem); }
          build();
        });
      });
    }
    var ms=$('modeSeg');
    ms.innerHTML=G().modes.map(function(m){
      return '<button data-m="'+m+'" class="'+(m===mode?'on':'')+'">'+DC.MODE_LABEL[m]+'</button>';
    }).join('');
    ms.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        if(b.dataset.m===mode)return;
        mode=b.dataset.m; snd('select');
        if(!G().quotition) dMode='partition';
        mStep=0; mDone=false; mLock=false; revealing=false; prevRem=-1; missionStart();
        if(mode==='quiz'){ qScore=0; qCount=0; quiz=DC.newQuiz(G().askRem); }
        build();
      });
    });

    var bar=$('barSlot');
    if(mode==='mission'){
      var M=curMissions();
      bar.innerHTML=mDone
        ? '<div class="k3bar done">🎉 미션을 모두 해냈어요! 자유탐구에서 마음껏 나눠 봐요.</div>'
        : '<div class="k3bar"><span>'+M[mStep].text+'</span><span class="prog">'+(mStep+1)+' / '+M.length+'</span></div>';
    } else if(mode==='quiz'){
      bar.innerHTML='<div class="k3bar"><span>❓ '+DC.qQuestion(quiz)+'</span><span class="prog">점수 '+qScore+' / '+qCount+'</span></div>';
    } else bar.innerHTML='';

    var ct=$('ctrlSlot'), s='';
    if(mode!=='quiz'){
      if(G().quotition){
        s+='<button class="dv-tg'+(dMode==='partition'?' on':'')+'" data-dm="partition">몇 묶음으로</button>'
          +'<button class="dv-tg'+(dMode==='quotition'?' on':'')+'" data-dm="quotition">몇 개씩</button>';
      }
      s+='<span class="ctrl-lab">전체</span>'
        +'<button class="ck-btn minus" data-act="tm" style="--c1:#5B9BF0;--c2:#3E7BD4">－</button>'
        +'<button class="ck-btn" data-act="tp" style="--c1:#5B9BF0;--c2:#3E7BD4">＋</button>';
      if(dMode==='partition'){
        s+='<span class="ctrl-lab">묶음 수</span>'
          +'<button class="ck-btn minus" data-act="gm" style="--c1:#3EE6B0;--c2:#1F9E75">－</button>'
          +'<button class="ck-btn" data-act="gp" style="--c1:#3EE6B0;--c2:#1F9E75">＋</button>';
      } else {
        s+='<span class="ctrl-lab">한 묶음 개수</span>'
          +'<button class="ck-btn minus" data-act="sm" style="--c1:#3EE6B0;--c2:#1F9E75">－</button>'
          +'<button class="ck-btn" data-act="sp" style="--c1:#3EE6B0;--c2:#1F9E75">＋</button>';
      }
      s+='<button class="ck-btn ghost" data-act="reset" title="처음으로">↺</button>';
      if(mode==='free') s+='<button class="ck-btn wow" id="wowBtn">🔮 접시를 늘리면?</button>';
    } else {
      s=DC.quizChoices(DC.qAnswer(quiz)).map(function(v){
        return '<button class="ck-choice" data-v="'+v+'">'+v+'</button>';
      }).join('');
    }
    ct.innerHTML=s;
    var H={ tp:tp, tm:tm, gp:gp, gm:gm, sp:sp, sm:sm, reset:reset };
    ct.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click',function(){ H[b.dataset.act](); });
    });
    ct.querySelectorAll('.dv-tg').forEach(function(b){
      b.addEventListener('click',function(){ setDMode(b.dataset.dm); });
    });
    var wb=$('wowBtn'); if(wb) wb.addEventListener('click',askPredict);
    ct.querySelectorAll('.ck-choice').forEach(function(b){
      b.addEventListener('click',function(){
        if(qLock)return; qLock=true; qCount++;
        var ans=DC.qAnswer(quiz), okA=(+b.dataset.v===ans);
        var full=Math.floor(quiz.t/quiz.g), rm=quiz.t%quiz.g;
        if(okA){ qScore++; snd('chime'); K3.toast('🎉 정답! <b>'+ans+'</b>'); }
        else { snd('fail'); K3.toast('🤔 <b>'+quiz.t+'÷'+quiz.g+'='+full+(rm>0?' … '+rm:'')+'</b>!', true); }
        setTimeout(function(){ quiz=DC.newQuiz(G().askRem); qLock=false; build(); }, STEP_MS);
      });
    });

    render();
  }

  /* ── 무대 그리기 — 접시에 사탕 나눠 담기 (SPEC §3 좌표 유지) ── */
  var VBW=880, VBH=380;
  function svgEl(t,a){ var e=document.createElementNS('http://www.w3.org/2000/svg',t); for(var k in a)e.setAttribute(k,a[k]); return e; }

  function defs(){
    var d=svgEl('defs',{});
    d.innerHTML=
      '<filter id="dvSh" x="-30%" y="-30%" width="160%" height="160%">'
      +'<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.42"/></filter>'
      +'<linearGradient id="dvPlate" x1="0" y1="0" x2="0.4" y2="1">'
      +'<stop offset="0" stop-color="#E0BE93"/><stop offset=".5" stop-color="#C29A6B"/><stop offset="1" stop-color="#9E7548"/></linearGradient>'
      +'<pattern id="dvGrain" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(88)">'
      +'<rect width="10" height="10" fill="none"/><rect width="2" height="10" fill="rgba(70,40,15,0.14)"/></pattern>'
      +'<radialGradient id="dvCandy" cx="34%" cy="28%" r="80%">'
      +'<stop offset="0" stop-color="#8FF3C9"/><stop offset=".55" stop-color="#12B886"/><stop offset="1" stop-color="#0B7A5C"/></radialGradient>'
      +'<radialGradient id="dvRem" cx="34%" cy="28%" r="80%">'
      +'<stop offset="0" stop-color="#FFC98F"/><stop offset=".55" stop-color="#FF8A3D"/><stop offset="1" stop-color="#D65E12"/></radialGradient>'
      +'<radialGradient id="dvBlue" cx="34%" cy="28%" r="80%">'
      +'<stop offset="0" stop-color="#9CC4FA"/><stop offset=".55" stop-color="#5B9BF0"/><stop offset="1" stop-color="#2E62B8"/></radialGradient>'
      +'<linearGradient id="dvGloss" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="rgba(255,255,255,0.4)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>';
    return d;
  }
  function candy(svg,cx,cy,r,kind,cls){
    svg.appendChild(svgEl('circle',{ cx:cx, cy:cy, r:r, fill:'url(#'+kind+')',
      stroke:'rgba(10,50,35,0.5)', 'stroke-width':1.5, filter:'url(#dvSh)',
      class:'dv-candy'+(cls?' '+cls:''), 'data-kind':kind }));
    svg.appendChild(svgEl('ellipse',{ cx:cx-r*0.3, cy:cy-r*0.34, rx:r*0.28, ry:r*0.18,
      fill:'rgba(255,255,255,0.55)', 'pointer-events':'none' }));
  }

  function render(opts){
    opts=opts||{};
    var desk=$('desk');
    var isQuiz=(mode==='quiz');
    var T=isQuiz?quiz.t:total;
    var G2=isQuiz?quiz.g:groups;
    var S=isQuiz?null:size;
    var useMode=isQuiz?'partition':dMode;
    var D=DC.derive(T,useMode,G2,S);
    var g=D.g, per=D.per, rem=D.rem, nb=D.nb;

    /* 와우A — 분배 pop / 나머지 등장 tap + 1회 플래시 */
    var doFlash=false;
    if(!isQuiz&&opts.act==='dist'){
      snd('pop');
      if(rem>0){ snd('tap'); if(rem!==prevRem) doFlash=true; }
    }

    var svg=svgEl('svg',{ viewBox:'0 0 '+VBW+' '+VBH, id:'dvSvg',
      style:'display:block;width:min(90vw,800px);height:auto;max-height:52vh' });
    svg.appendChild(defs());

    var cols=Math.min(g,5), rws=Math.ceil(g/cols);
    var bw=Math.min((VBW-80)/cols-16, 240), bh=Math.min((VBH-60)/rws-16, 150);
    var x0=(VBW-(bw+16)*cols+16)/2, y0=(VBH-(bh+16)*rws+16)/2;
    var hide=(isQuiz&&quiz.ask==='quot');

    for(var gi=0;gi<g;gi++){
      var col=gi%cols, row=Math.floor(gi/cols);
      var bx=x0+col*(bw+16), by=y0+row*(bh+16);
      /* 원목 접시 */
      svg.appendChild(svgEl('rect',{ x:bx, y:by, width:bw, height:bh, rx:18,
        fill:'url(#dvPlate)', stroke:'rgba(60,35,12,0.55)', 'stroke-width':2, filter:'url(#dvSh)',
        class:'dv-plate', 'data-plate':gi }));
      svg.appendChild(svgEl('rect',{ x:bx, y:by, width:bw, height:bh, rx:18,
        fill:'url(#dvGrain)', 'pointer-events':'none' }));
      svg.appendChild(svgEl('rect',{ x:bx+6, y:by+5, width:bw*0.42, height:8, rx:4,
        fill:'url(#dvGloss)', 'pointer-events':'none' }));
      if(hide){
        var tq=svgEl('text',{ x:bx+bw/2, y:by+bh/2+14, 'text-anchor':'middle',
          'font-family':'var(--kedu-title)', 'font-size':42, 'font-weight':800, fill:'#FFD05E', class:'dv-hide' });
        tq.textContent='?'; svg.appendChild(tq);
        continue;
      }
      var inThis=(useMode==='partition')?per:(gi<nb?S:rem);
      for(var b=0;b<inThis;b++){
        var pc=b%5, pr=Math.floor(b/5);
        var dotR=Math.min(bw/12,bh/8,15);
        var dx=bx+18+pc*(dotR*2+6)+dotR, dy=by+22+pr*(dotR*2+6)+dotR;
        candy(svg,dx,dy,dotR,'dvCandy',opts.drop?'dv-drop':'');
      }
    }

    /* 남은 알 — 우측 세로 열(등분제에서만 별도 표시) */
    if(useMode==='partition'&&rem>0&&!hide){
      for(var rr=0;rr<rem;rr++){
        candy(svg,VBW-50,46+rr*32+13,13,'dvRem',doFlash?'dv-rem-pop':'');
      }
      var tl=svgEl('text',{ x:VBW-50, y:30, 'text-anchor':'middle',
        'font-family':'var(--kedu-title)', 'font-size':19, 'font-weight':800, fill:'#FFA75E', class:'dv-remlab' });
      tl.textContent=(G().eqSign?'나머지':'남은 것');
      svg.appendChild(tl);
    }

    if(doFlash){
      var fx=svgEl('text',{ x:VBW/2-30, y:22, 'text-anchor':'middle',
        'font-family':'var(--kedu-title)', 'font-size':24, 'font-weight':800,
        fill:'#FFA75E', class:'dv-flash' });
      fx.textContent='어! '+rem+'개가 어디에도 못 들어가 따로 남았어요 (나머지 '+rem+')';
      svg.appendChild(fx);
    }
    if(!isQuiz) prevRem=rem;    /* 퀴즈 렌더에서는 갱신하지 않는다(1회성 보장) */

    /* 퀴즈 상단 — 전체 알 일렬 */
    if(isQuiz){
      for(var i=0;i<T;i++){
        var ddR=11, ddx=VBW/2-(T*(ddR*2+5)-5)/2+i*(ddR*2+5)+ddR;
        candy(svg,ddx,8+ddR,ddR,'dvBlue','');
      }
    }

    desk.innerHTML=''; desk.appendChild(svg);
    updateStatus(T,G2,S,useMode,D);
    updateButtons();
  }

  function updateStatus(T,G2,S,useMode,D){
    var st=$('statusRow');
    if(mode==='quiz'){
      st.innerHTML='<div class="timeread"><span class="b">'+T+'</span><span class="u"> ÷ </span>'
        +'<span class="b">'+G2+'</span><span class="u"> ＝ </span><span class="q">?</span>'
        +(quiz.ask==='rem'?'<span class="u"> … 나머지 </span><span class="q">?</span>':'')+'</div>'
        +'<div class="hint">아래에서 답을 골라 누르세요</div>';
      return;
    }
    if(!G().eqSign){
      /* ★ 저학년 — ÷ 기호 없이 일상어 */
      st.innerHTML='<div class="timeread"><span class="u">한 묶음에 </span><span class="g">'+D.per+'</span>'
        +'<span class="u">개씩!</span></div>'
        +'<div class="hint">'+(D.rem>0
          ? '<span class="grabline">(남은 '+D.rem+'개)</span>'
          : '<span class="go">똑같이 나눠졌어요!</span>')
        +'<br><span class="grabline">✋ ＋－로 사탕 수와 묶음 수를 바꿔 봐요</span></div>';
      return;
    }
    var tail=(D.rem>0)?'<span class="u"> … 나머지 </span><span class="o">'+D.rem+'</span>':'';
    if(useMode==='partition'){
      st.innerHTML='<div class="timeread"><span class="b">'+T+'</span><span class="u"> ÷ </span>'
        +'<span class="b">'+G2+'</span><span class="u"> ＝ </span><span class="g">'+D.per+'</span>'+tail+'</div>'
        +'<div class="hint"><span class="grabline">✋ 「몇 개씩」으로 바꾸면 같은 수를 다른 눈으로 볼 수 있어요</span></div>';
    } else {
      st.innerHTML='<div class="timeread"><span class="b">'+T+'</span><span class="u"> 을 </span>'
        +'<span class="b">'+S+'</span><span class="u">개씩 ＝ </span><span class="g">'+D.nb+'</span>'
        +'<span class="u">묶음</span>'+tail+'</div>'
        +'<div class="hint"><span class="grabline">✋ 「몇 묶음으로」와 견줘 봐요 — 같은 나눗셈, 다른 물음</span></div>';
    }
  }

  function updateButtons(){
    var ct=$('ctrlSlot');
    var b=function(a){ return ct.querySelector('[data-act="'+a+'"]'); };
    if(b('tp')) b('tp').disabled=revealing||total>=maxTotal();
    if(b('tm')) b('tm').disabled=revealing||total<=1;
    if(b('gp')) b('gp').disabled=revealing||groups>=10;
    if(b('gm')) b('gm').disabled=revealing||groups<=1;
    if(b('sp')) b('sp').disabled=revealing||size>=maxTotal();
    if(b('sm')) b('sm').disabled=revealing||size<=1;
    if(b('reset')) b('reset').disabled=revealing;
    var wb=$('wowBtn'); if(wb) wb.disabled=revealing;
  }

  function checkMission(){
    if(mode!=='mission'||mDone||mLock) return;
    /* ★ v2 버그 차단 — 학생이 «무언가 한 뒤»에만 판정한다.
       (v2는 진입 기본값 12·3이 미션① 조건과 같고, 단계 전환 시드 7·3·4가 미션②를 이미 충족해
        아무 조작 없이 ①→② 연쇄 자동달성 후 ③부터 시작됐다.) */
    if(!acted) return;
    var M=curMissions();
    if(M[mStep].check(total,groups,size,dMode)){
      mLock=true; snd('chime');
      K3.toast('🎉 참 잘했어요!');
      setTimeout(function(){
        mLock=false;
        if(mStep<M.length-1){
          mStep++;
          total=7; groups=3; size=4;   /* v2 시드 그대로 */
          missionStart();              /* 게이트 재차단 */
        } else mDone=true;
        build();
      }, STEP_MS);
    }
  }

  $('sndBtn').addEventListener('click',function(){
    K3.sound.setOn(!K3.sound.on);
    this.textContent=K3.sound.on?'🔊':'🔇';
    this.classList.toggle('off',!K3.sound.on);
    if(K3.sound.on)snd('select');
  });

  if(mode==='quiz') quiz=DC.newQuiz(G().askRem);
  build();

  window.DivApp={
    get grade(){return grade;}, get mode(){return mode;}, get total(){return total;},
    get groups(){return groups;}, get size(){return size;}, get dMode(){return dMode;},
    get maxTotal(){return maxTotal();}, get rem(){return der().rem;}, get per(){return der().per;},
    get acted(){return acted;}, get revealing(){return revealing;},
    get mStep(){return mStep;}, get mDone(){return mDone;},
    get qScore(){return qScore;}, get qCount(){return qCount;}, get quiz(){return quiz;},
    tp:tp, tm:tm, gp:gp, gm:gm, sp:sp, sm:sm, reset:reset,
    setDMode:setDMode, setTGS:setTGS, build:build,
    askPredict:askPredict, startReveal:startReveal,
    _set:function(o){ if(o.prediction!==undefined) prediction=o.prediction; }
  };
})();
</script>
</body>
</html>

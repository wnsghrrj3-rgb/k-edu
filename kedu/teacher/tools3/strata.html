<!--
  케이랩 v3 · A트랙 — 지층과 화석 (2026-07-12 · 페이블)
  v2 engine/tools/strata.js(569줄 + 와우 27호 impl 08f6517) 전면 재건 · r185 + klab3 코어.
  스튜디오 5요소: ① 다크 스튜디오 + 실험대 위 유리 수조(강 하구 모형) 디오라마
    ② 실물 질감(유리 수조·굴절 물·역암/사암/이암 절차 텍스처·원목 받침)
    ③ 직접 조작(궤도 회전·퇴적물 붓기·층 탭·생물 두기·융기·비바람 깎기·양옆 밀기)
    ④ 즉각 반응(층 낙하 가라앉음·물살 흐름선·습곡 휨·단층 어긋남·물 빠짐)
    ⑤ 와우 = 「몽땅 섞어 부으면?」 분급(graded bedding) — 예측→반전(와우 27호 이식)
  v2 무손실: 학년칸(저/중/고)·미션(2/4/4)·퀴즈 5문·만약에 3종(침식·습곡단층·거센바다)
    ·변수 슬라이더(물살·쌓는 시간)·예측 무장/해소·예측 노트 칩(5칩 토스트)
    ·화석 3종(조개·고사리·물고기)·융기(산에서 조개 서사)·층 순서 번호·강 하구 분급 모형.
  config: ?grade=low|mid|high(지정 시 잠금) · ?mode=free|mission|quiz|whatif
-->

<!-- ═══ 순수 로직 (window.StrataSim · node 테스트 대상 · DOM/THREE 무의존) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 데이터 (v2 무손실) ── */
  var TYPES={ gravel:{nm:'자갈'}, sand:{nm:'모래'}, mud:{nm:'진흙'} };
  var FOSSILS={ shell:{nm:'조개',ic:'🐚',env:'바다'}, fern:{nm:'고사리',ic:'🌿',env:'따뜻하고 습한 곳'}, fish:{nm:'물고기',ic:'🐟',env:'물속'} };
  var MAXL=7, MAXTH=8;

  /* ── 학년 칸 (v2 GRADES + 와우 27호 wow 플래그 무손실) ── */
  var GRADES={
    low:  { modes:['free','mission'],                 low:true,  v2:null,                 wif:[],                          wow:false },
    mid:  { modes:['free','mission','quiz','whatif'], low:false, v2:{dur:true},           wif:['erosion','storm'],         wow:true  },
    high: { modes:['free','mission','quiz','whatif'], low:false, v2:{flow:true,dur:true}, wif:['erosion','fold','storm'],  wow:true  }
  };

  /* ── 미션 (v2 문구·판정 무손실 — check는 상태 st를 받는 순수 함수) ── */
  function fossilCount(st){ var n=0,i; for(i=0;i<st.layers.length;i++)if(st.layers[i].fossil)n++; return n; }
  function stripes(st){ var t={},i; for(i=0;i<st.layers.length;i++)t[st.layers[i].type]=1;
    return st.layers.length>=3 && Object.keys(t).length>=2; }
  var LOW_MISSIONS=[
    { text:'🪨🟡🟤 <b>서로 다른 퇴적물을 3층 이상</b> 차곡차곡 쌓아 줄무늬를 만들어요!',
      keep:false, check:function(st){ return stripes(st); } },
    { text:'🐚 <b>조개를 두고 위에 퇴적물을 덮어</b> 화석을 만들어요!',
      keep:true, check:function(st){ return fossilCount(st)>0; } }
  ];
  var MAIN_MISSIONS=[
    { text:'퇴적물을 <b>서로 다른 종류로 3층 이상</b> 쌓아 줄무늬 지층을 만들어요!',
      keep:false, check:function(st){ return stripes(st); } },
    { text:'<b>가장 먼저 쌓인(가장 오래된) 층</b>을 클릭해 찾아요!',
      keep:true, check:function(st){ return st.clickedOldest; } },
    { text:'🐚 <b>조개를 두고 위에 퇴적물을 덮어</b> 화석을 만들어요!',
      keep:true, check:function(st){ return fossilCount(st)>0; } },
    { text:'⛰️ <b>융기!</b> 화석이 든 지층을 땅 위로 — 산에서 조개가 나오는 까닭을 확인해요!',
      keep:true, check:function(st){ return st.up>=1 && fossilCount(st)>0; } }
  ];
  var MISSIONS={ low:LOW_MISSIONS, mid:MAIN_MISSIONS, high:MAIN_MISSIONS };

  /* ── 퀴즈 5문 (v2 무손실) ── */
  var QUIZ=[
    { q:'지층에서 가장 먼저 쌓인 층은 어디에 있을까요?', ch:['맨 아래','맨 위','가운데'], a:0 },
    { q:'지층은 주로 어디에서 만들어질까요?', ch:['바다나 호수의 물 밑','뜨거운 사막 위','구름 속'], a:0 },
    { q:'죽은 생물이 화석이 되려면 어떻게 되어야 할까요?', ch:['퇴적물이 빨리 덮어야 해요','햇빛에 오래 말라야 해요','바람에 날려가야 해요'], a:0 },
    { q:'산에서 조개 화석이 발견되면 알 수 있는 것은?', ch:['옛날에 그곳이 바다였다','조개가 산을 좋아했다','누가 조개를 버렸다'], a:0 },
    { q:'지층에 줄무늬가 생기는 까닭은?', ch:['종류가 다른 퇴적물이 차례로 쌓여서','누가 줄을 그어서','비가 많이 와서'], a:0 }
  ];

  /* ── 만약에 3종 (v2 무손실) — play(sim)=상태 세팅, cond(st)=해소 조건 ── */
  function preLayers(n){
    return ['gravel','sand','mud','sand','gravel'].slice(0,n).map(function(t){ return {type:t,fossil:null,th:1}; });
  }
  var WHATIF={
    erosion:{ icon:'🏜️', title:'융기한 뒤 비바람이 아주 오래 깎는다면?',
      q:'땅 위로 올라온 지층 — 맨 아래(가장 오래된) 층은 영영 못 볼까요?',
      ch:['맨 아래층은 영영 못 봐요','위부터 깎여 옛 층이 드러나요','지층이 통째로 사라져요'], a:1,
      reveal:'위층부터 깎여 나가며 깊은 옛 층이 오히려 드러나요! 계곡 절벽의 줄무늬(그랜드캐니언)가 바로 그 모습 — 쌓임의 기록을 침식이 펼쳐 보여 주는 거예요.',
      tip:'🌬 비바람 깎기를 계속 눌러 봐요 — 위층부터 사라지면…!',
      play:function(sim){ sim.reset(); sim.v2reset(); sim.state.layers=preLayers(5); sim.state.up=1; },
      cond:function(st){ return st.erodeN>0 && st.layers.length===1; } },
    fold:{ icon:'↔️', title:'굳은 지층을 양옆에서 계속 민다면?',
      q:'돌처럼 딱딱하게 굳은 지층을 아주 오래 밀면 어떻게 될까요?',
      ch:['와장창 부서져 가루가 돼요','엿가락처럼 휘거나 우지끈 끊어져요','아무 일도 없어요'], a:1,
      reveal:'오랜 시간 큰 힘을 받으면 딱딱한 지층도 엿가락처럼 휘고(습곡), 더 밀면 우지끈 끊어져 어긋나요(단층)! 교과서의 휘어진 지층·끊어진 지층 사진이 이렇게 생겼어요 — 지진(끊어짐)과 같은 힘 이야기예요.',
      tip:'↔️ 밀기를 계속 눌러 봐요 — 휘다가… 결국!',
      play:function(sim){ sim.reset(); sim.v2reset(); sim.state.layers=preLayers(4); sim.state.up=1; },
      cond:function(st){ return st.foldN>=3; } },
    storm:{ icon:'🌊', title:'물살이 늘 거세기만 한 바다라면?',
      q:'물살이 늘 거센 곳에서도 줄무늬 지층이 잘 쌓일까요?',
      ch:['어디서나 잘 쌓여요','가벼운 알갱이가 못 가라앉아 줄무늬가 잘 안 생겨요','오히려 더 빨리 쌓여요'], a:1,
      reveal:'거센 물살에선 진흙·모래가 가라앉지 못하고 떠내려가요 — 무거운 자갈만 남죠. 고운 줄무늬 지층은 잔잔한 물속이 주는 선물이에요!',
      tip:'거센 물살이에요. 🟤 진흙과 🟡 모래를 부어 봐요 — 어라?',
      play:function(sim){ sim.reset(); sim.v2reset(); sim.state.flow=1; },
      cond:function(st){ return st.awayN>=1; } }
  };

  /* ── 예측 무장 2종 (v2 3층 무손실) — 정답 선택지=1 ── */
  var PRED={
    flow:{ q:'예측 먼저! 물살이 거세지면 퇴적물은 어디에 쌓일까요?',
      ch:['어디든 똑같이 쌓인다','무거운 것부터 가까이 가라앉는다','가벼운 것부터 가까이 가라앉는다'],
      tip:'물살을 🌊 거셈까지 올리고 자갈·모래·진흙을 하나씩 부어 봐요!' },
    dur:{ q:'예측 먼저! 오래오래 쌓으면 층은 어떻게 될까요?',
      ch:['두께는 그대로다','층이 더 두꺼워진다','층 개수만 늘어난다'],
      tip:'쌓는 시간을 오래 끝까지 올리고 한 층 부어 봐요!' }
  };
  var CHIPNM={erosion:'🏜️ 침식',fold:'↔️ 습곡단층',storm:'🌊 거센바다',flow:'🌀 물살실험',dur:'⏳ 시간실험'};

  /* ── 와우(27호): 분급 입자 시드 (v2 makeMixParticles 무손실 — 자갈9·모래12·진흙14) ── */
  function mixSeed(){
    var arr=[], seq=['gravel','sand','mud'], id=0, t, i;
    for(t=0;t<seq.length;t++){ var ty=seq[t], n=(ty==='gravel'?9:(ty==='sand'?12:14));
      for(i=0;i<n;i++){
        var s=Math.sin((id+1)*12.9898)*43758.5453; s-=Math.floor(s);
        var s2=Math.sin((id+7)*78.233)*43758.5453; s2-=Math.floor(s2);
        arr.push({ type:ty, rx:s, ry:s2, id:id++ });
      }
    }
    return arr;
  }

  /* ── 시뮬 생성 ── */
  function createSim(grade){
    grade=(['low','mid','high'].indexOf(grade)>=0)?grade:'high';
    var sim={};
    sim.grade=grade;
    sim.G=function(){ return GRADES[sim.grade]; };
    sim.state={ layers:[], farLayers:[], pending:null, up:0, sel:-1, clickedOldest:false,
                flow:0.2, dur:0.5, erodeN:0, foldN:0, awayN:0, mixArmed:false, mixSettled:false };

    sim.reset=function(){ var st=sim.state;
      st.layers=[]; st.farLayers=[]; st.pending=null; st.up=0; st.sel=-1; st.clickedOldest=false;
      sim.clearMix(); };
    sim.v2reset=function(){ var st=sim.state; st.flow=0.2; st.dur=0.5; st.erodeN=0; st.foldN=0; st.awayN=0; };
    sim.resetAll=function(){ sim.reset(); sim.v2reset(); };

    /* v2 변수 물리 (무손실): 층 두께 = 시간, 가라앉는 자리 = 무게 × 물살 */
    sim.thOf=function(){ return 0.4+sim.state.dur*1.2; };
    sim.zoneOf=function(type){ var f=sim.state.flow;
      if(f<0.35)return 'near';
      if(f<0.7)return type==='mud'?'far':'near';
      return type==='gravel'?'near':(type==='sand'?'far':'away');
    };
    sim.flowName=function(){ var f=sim.state.flow; return (f>=0.7?'🌊 거셈':(f<0.35?'🫧 잔잔':'중간')); };
    sim.durName=function(){ var d=sim.state.dur; return (d>=0.8?'오래':(d<0.25?'짧게':'보통'))+' · 두께 ×'+sim.thOf().toFixed(1); };
    sim.sumTh=function(list){ var s=0,i; for(i=0;i<list.length;i++)s+=list[i].th; return s; };
    sim.embeddedFossils=function(){ var r=[],i,L=sim.state.layers; for(i=0;i<L.length;i++)if(L[i].fossil)r.push(L[i].fossil); return r; };

    /* 조작 (v2 판정 무손실 — 직접 조작 = clearMix) */
    sim.deposit=function(type,useFlow){
      var st=sim.state; sim.clearMix();
      if(st.up>0) return {act:'dry'};
      var zone=useFlow?sim.zoneOf(type):'near';
      if(zone==='away'){ st.awayN++; return {act:'away',type:type,preds:sim.checkPred(zone)}; }
      var list=(zone==='far')?st.farLayers:st.layers;
      if(list.length>=MAXL||sim.sumTh(list)+sim.thOf()>MAXTH) return {act:'full'};
      var f=null;
      if(zone==='near'&&st.pending){ f=st.pending; st.pending=null; }
      list.push({ type:type, fossil:f, th:sim.thOf() });
      st.sel=-1;
      return {act:'deposit',zone:zone,fossilized:!!f,preds:sim.checkPred(zone)};
    };
    sim.placeFossil=function(kind){

function wifResolve() {

    ).then(v => { if (v === 1) act('wifBack'); else renderAll(); });

/* 예측 무장 (free · v2 변수) */
async function armPred(kind) {
  if (mode !== 'free' || !sim.G().v2) return;
  if (kind === 'flow' && !sim.G().v2.flow) return;
  if (kind === 'dur' && !sim.G().v2.dur) return;
  if (!sim.predArm(kind)) return;
  const P = Sim.PRED[kind];
  K3.sound.play('select');
  const ch = await K3.cards.predict(P.q, P.ch.map((c, i) => ({ id: i, label: c })));
  sim.predChoose(kind, ch);
  K3.toast('📝 예측 접수! ' + P.tip, false, T(4200));
}
function resolvePreds(list) {
  (list || []).forEach(r => {
    const msg = r.kind === 'flow'
      ? (r.hit ? '✔ 예측 적중 — 무거운 자갈은 가까이, 가벼운 진흙은 멀리 가거나 떠내려가요! 알갱이 크기가 가라앉는 자리를 정해요.'
               : '✘ 예측 빗나감 — 무거운 것부터 가까이 가라앉아요! 가벼운 진흙은 멀리 떠가거나 아예 못 가라앉죠.')
      : (r.hit ? '✔ 예측 적중 — 오래 쌓일수록 층이 두꺼워요! 줄무늬의 굵기는 시간의 기록이에요.'
               : '✘ 예측 빗나감 — 오래 쌓으면 층이 두꺼워져요! 줄무늬의 굵기가 곧 시간의 기록이거든요.');
    K3.sound.play(r.hit ? 'chime' : 'pop');
    K3.toast(msg, !r.hit, T(4600));
  });
  if (list && list.length) { renderChips(); chipToast(); }
}

  if (sim.chips.length === 5) setTimeout(() => { K3.sound.play('ting'); K3.toast('🪨 꼬마 지질학자 — 오늘 가설 5개를 실험했어요!'); }, T(600));

    if (r.act === 'away') {
      K3.sound.play('whoosh');
      K3.toast('🌊 가벼운 ' + Sim.TYPES[type].nm + '은(는) 거센 물살에 떠내려가 여기엔 못 쌓여요!', true, T(3200));
      sedBurst = { type, cx: 0.1, w: 0.5, t: 0.5, sweep: true };
      syncMixScene(); resolvePreds(r.preds); wifResolve();
    } else if (r.act === 'full') {
      K3.toast('층이 가득! 이만하면 멋진 지층이에요');
    } else {
      K3.sound.play('tap');
      if (r.fossilized) { K3.sound.play('pop'); K3.toast(Sim.FOSSILS[sim.state.layers[sim.state.layers.length - 1].fossil].ic + ' 퇴적물이 덮었어요 — 오랜 시간이 지나면 화석이 돼요!'); }
      sedBurst = { type, cx: r.zone === 'far' ? FXc : NX, w: r.zone === 'far' ? FW : NW, t: 0.9 };
      rebuildStacks(); syncMixScene();
      resolvePreds(r.preds); wifResolve();
    }
  }
  else if (a.indexOf('f-') === 0) {
    const r = sim.placeFossil(a.slice(2));
    if (r.act === 'dry') { K3.toast('물이 빠진 뒤엔 생물이 가라앉지 못해요 — ↺ 처음부터!', true); return; }
    if (r.act === 'full') { K3.toast('덮을 자리가 없어요!', true); return; }
    K3.sound.play('select');
    pendingSp.material.map = fossilTex[r.kind];
    syncMixScene();
  }
  else if (a === 'uplift') {
    const r = sim.uplift();
    if (r.act === 'already') return;
    if (r.act === 'empty') { K3.toast('먼저 지층을 쌓아야 들어 올리죠!', true); return; }
    if (r.lost) K3.toast('덮이지 못한 생물은 화석이 못 돼요…', true, T(2600));
    K3.sound.play('whoosh');
    K3.toast('땅이 솟아오르는 중… (실제로는 아주아주 오랜 시간!)', false, T(3000));
    syncMixScene();
  }
  else if (a === 'erode') {
    const r = sim.erode();
    if (r.act === 'none') { K3.toast('깎을 층이 없어요', true); return; }
    if (r.act === 'bottom') { K3.toast('🏜️ 가장 오래된 층까지 다 드러났어요!', true); return; }
    K3.sound.play('pop');
    K3.toast(r.bottomReached ? '🏜️ 맨 아래 — 가장 오래된 층이 드러났어요!' : '🌬 위층이 깎여 나갔어요 — 더 옛날 층이 보여요!', false, T(2200));
    rebuildStacks(); wifResolve();
  }
  else if (a === 'fold') {
    const r = sim.pushFold();
    if (r.act === 'max') { K3.toast('이미 끊어졌어요 — ↺ 새 지층으로!', true); return; }
    if (r.act === 'fault') { K3.sound.play('whoosh'); K3.sound.play('pop'); K3.toast('우지끈! 끊어져 어긋났어요 (단층)!', false, T(2600)); }
    else { K3.sound.play('pop'); K3.toast(r.n === 1 ? '으으… 딱딱한 지층이 휘기 시작해요 (습곡)' : '더 크게 휘어요 — 엿가락처럼!', false, T(2200)); }
    applyTectonics(); wifResolve();
  }
  else if (a === 'reset') {
    sim.reset(); upT = 0; K3.sound.play('tap');
    rebuildStacks(); syncMixScene();
  }
  else if (a === 'wowArm') {
    const r = sim.wowArm();
    if (r.act !== 'arm') return;
    upT = 0;
    K3.sound.play('charge');
    K3.toast('🌀 자갈·모래·진흙을 <b>몽땅 섞어</b> 잔잔한 물에 부었어요. 이대로 가라앉으면 — <b>뒤죽박죽 섞인 덩어리</b>가 될까요, <b>줄무늬</b>가 생길까요? 예상해 봐요!', false, T(4600));
    armMixParticles();
    rebuildStacks(); syncMixScene();
  }
  else if (a === 'wowReveal') {
    const r = sim.wowReveal();
    if (r.act === 'nudge') {
      K3.sound.play('select');
      K3.toast('먼저 🔮 <b>몽땅 섞어 부으면?</b> 버튼으로 예상부터 해 봐요!', true, T(2600));
      return;
    }
    K3.sound.play('whoosh'); K3.sound.play('ting');
    K3.toast('✨ 한꺼번에 부었는데 <b>저절로 줄무늬</b>가 생겼어요! 무거운 <b>자갈이 먼저</b> 가라앉고, 그 위에 <b>모래</b>, 맨 위에 고운 <b>진흙</b> — 알갱이 크기가 다르면 가라앉는 빠르기가 달라 <b>아래는 굵고 위는 고운</b> 층이 저절로 나뉘어요!', false, T(7200));
    syncMixScene();
  }
  else if (a === 'wifBack') {
    wifKey = null; wifPlaying = false; wifRevealed = false;
    sim.resetAll(); upT = 0; K3.cards.hide();
    rebuildStacks(); syncMixScene(); renderAll(); return;
  }
  if (mode === 'mission') missionTick();
  renderCtrls(); renderStatus();
}

function clickLayer(i) {
  const r = sim.clickLayer(i);
  if (r.act !== 'sel') return;
  K3.sound.play('select');
  if (mode === 'mission') missionTick();
  renderStatus();
}
function digFossil(slot) {
  const fos = sim.embeddedFossils();
  const kind = fos[slot];
  if (!kind) return;
  K3.sound.play('ting');
  const F = Sim.FOSSILS[kind];
  K3.toast(F.ic + ' ' + F.nm + ' 화석 — 옛날에 이곳이 <b>' + F.env + '</b>였다는 증거예요!', false, T(3200));
  const fs = fossilSlots[slot];
  if (fs) { fs.grp.getWorldPosition(_pv); sparkSpawn0.x = _pv.x; sparkSpawn0.y = _pv.y; sparkSpawn0.z = _pv.z; emit(sysSpark, 12, sparkSpawn); }
}
function missionTick() {
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  setTimeout(() => { upT = sim.state.up; rebuildStacks(); syncMixScene(); renderAll(); }, T(1300));
}

function setGrade(g) {
  sim.grade = g;
  mode = 'free';
  wifKey = null; wifPlaying = false; wifRevealed = false;
  sim.resetAll(); sim.mStep = 0; sim.mDone = false; upT = 0;
  K3.cards.hide(); rebuildStacks(); syncMixScene(); renderAll();
}
function setMode(m) {
  mode = m;
  wifKey = null; wifPlaying = false; wifRevealed = false;
  sim.resetAll(); upT = 0; K3.cards.hide();
  if (m === 'mission') sim.missionStart();
  if (m === 'quiz') { quizScore = 0; quizCount = 0; quizUsed = []; newQuiz(); }
  rebuildStacks(); syncMixScene(); renderAll();
}
function syncMixScene() {
  const st = sim.state;
  if (!st.mixArmed && !st.mixSettled) mixGrp.visible = false;
}
function renderAll() {
  renderHUD(); renderCtrls(); renderBar(); renderV2(); renderQuiz(); renderWifPick(); renderChips(); renderStatus();
}

/* ── 층·화석 탭 (레이캐스트) ── */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  hideHint();
  if (mode === 'quiz') return;
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const meshes = [];
  nearVis.forEach(v => v.halves.forEach(m => { m.userData.li = v.li; meshes.push(m); }));
  const hit = ray.intersectObjects(meshes, false)[0];
  if (hit) clickLayer(hit.object.userData.li);
});

/* ═══════════ 루프 ═══════════ */
const clock = new THREE.Clock();
const FASTX = window.__K3_FAST ? 12 : 1;   // 하니스 가속(연출 트윈만 — 물리 판정은 Sim 즉시)
let fossilSlots = [];
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()) * FASTX;
  const st = sim.state;

  /* 융기 트윈 + 물 빠짐 */
  upT += (st.up - upT) * Math.min(1, dt * (st.up > upT ? 0.9 : 4));
  if (st.up >= 1 && upT > 0.995) upT = 1;
  liftGrp.position.y = upT * 0.075;
  liftGrp.rotation.z = upT * 0.035;
  const wh = Math.max(0.015, (1 - upT) * (WL - TANK.y0));
  water.scale.y = wh / (WL - TANK.y0);
  water.position.y = TANK.y0 + wh / 2;
  water.visible = upT < 0.99;

  /* 와우 흙탕물 탁해짐 */
  const murkTarget = (st.mixArmed && !st.mixSettled) ? 1 : 0;
  murkT += (murkTarget - murkT) * Math.min(1, dt * 2.5);
  waterMat.attenuationColor.copy(CLEAR_C).lerp(MURK_C, murkT);
  waterMat.attenuationDistance = 0.5 - murkT * 0.36;

  /* 층 낙하 가라앉음 */
  [nearVis, farVis].forEach(arr => arr.forEach(v => {
    if (v.dropT < 1) {
      v.dropT = Math.min(1, v.dropT + dt * 1.6);
      const e = 1 - Math.pow(1 - v.dropT, 3);
      v.grp.position.y = v.cy + (1 - e) * 0.16;
    } else v.grp.position.y = v.cy;
  }));

  /* 낙하 퇴적 입자 */
  if (sedBurst && sedBurst.t > 0) {
    sedBurst.t -= dt;
    emit(sysSed, 3, sedSpawn(sedBurst.type, sedBurst.cx, sedBurst.w));
    if (sedBurst.sweep) sysSed.P.forEach(q => { if (q.life > 0) q.vx = 0.3; });
  }
  stepSys(sysSed, dt, 0.02, TANK.y0 + 0.02);

  /* 물살 흐름선 */
  const fOn = flowActive() && st.up < 1;
  divGrp.visible = fOn;
  if (fOn && st.flow > 0.05 && Math.random() < 0.3 + st.flow * 0.5) emit(sysFlow, 1, flowSpawn);
  stepSys(sysFlow, dt, 0);

  /* 만약에 침식 — 비바람 */
  if (mode === 'whatif' && wifPlaying && wifKey === 'erosion' && st.erodeN > 0) emit(sysRain, 2, rainSpawn);
  stepSys(sysRain, dt, 0.3, TANK.y0);
  stepSys(sysSpark, dt, 0.15);

  /* 와우 분급 입자 물리 */
  if ((st.mixArmed || st.mixSettled) && mixGrp.visible) {
    const now = performance.now();
    mixPts.forEach(p => {
      if (st.mixSettled) {
        const band = MIX[p.type].band;
        if (p.m.position.y > band) p.m.position.y = Math.max(band, p.m.position.y - MIX[p.type].g * dt);
      } else {
        p.m.position.y = p.y0 + Math.sin(now * 0.002 + p.id) * 0.008;
      }
    });
  }

  /* 기다리는 생물 */
  const topY = BASE_TOP + sim.sumTh(st.layers) * TH_UNIT;
  pendingSp.visible = !!st.pending && !st.mixArmed && !st.mixSettled;
  if (pendingSp.visible) {
    pendingSp.position.set(NX, topY + 0.035 + Math.sin(performance.now() * 0.003) * 0.006, 0.02);
  }

  /* 융기 후 풀·새 (v2: up>0.65 · foldN 0 · 비만약에) */
  const grassOn = upT > 0.65 && st.layers.length > 0 && st.foldN === 0 && mode !== 'whatif';
  grassGrp.visible = grassOn;
  if (grassOn) {
    const gs = Math.max(0.001, (upT - 0.65) / 0.35);
    grassGrp.scale.set(1, gs, 1);
    grassGrp.position.y = topY;
    grassGrp.children.forEach(c => { c.position.y = 0.015; });
  }
  birdSp.visible = grassOn;
  if (birdSp.visible) {
    const t = performance.now() * 0.0008;
    birdSp.position.set(Math.sin(t) * 0.3, WL + 0.16 + Math.sin(t * 2.3) * 0.02, Math.cos(t) * 0.1);
  }

  /* 주석 투영 */
  const showOrd = st.sel >= 0 && !st.mixArmed && !st.mixSettled && mode !== 'quiz';
  for (let i = 0; i < 7; i++) {
    const v = nearVis[i];
    if (showOrd && v && v.dropT >= 1) {
      ordAnnos[i].style.color = ordAnnos[i].style.borderColor = (i === st.sel ? '#CBB7FF' : '#8fa3b8');
      projectAnno(ordAnnos[i], v.grp, _t1.set(-NW / 2 - 0.07, 0, LD / 2), true);
    } else ordAnnos[i].style.display = 'none';
  }
  fossilSlots = [];
  nearVis.forEach(v => { if (v.fossil) fossilSlots.push(v.fossil); });
  for (let i = 0; i < 3; i++) {
    const fs = fossilSlots[i];
    if (fs && !st.mixArmed && !st.mixSettled && mode !== 'quiz') {
      fosAnnos[i].innerHTML = Sim.FOSSILS[fs.kind].ic + ' ' + Sim.FOSSILS[fs.kind].nm;
      projectAnno(fosAnnos[i], fs.grp, _t2.set(0, 0.038, 0), true);
    } else fosAnnos[i].style.display = 'none';
  }
  projectAnno(zoneNear, scene, _t3.set(NX, TANK.y0 - 0.05, LD / 2), fOn);
  projectAnno(zoneFar, scene, _t4.set(FXc, TANK.y0 - 0.05, LD / 2), fOn);
  projectAnno(upLab, liftGrp, _t5.set(NX, topY + 0.09, 0), grassOn);
  if (st.mixArmed || st.mixSettled) {
    mixLab.innerHTML = st.mixSettled ? '⬇ 무거운 자갈부터 가라앉아 아래 · 고운 진흙은 맨 위' : '🌀 섞인 흙탕물 — 🌀 한꺼번에 쏟기를 눌러 봐요!';
    mixLab.style.color = mixLab.style.borderColor = st.mixSettled ? '#CBB7FF' : '#8AC2FF';
    projectAnno(mixLab, scene, _t6.set(NX, WL + 0.09, 0), true);
  } else mixLab.style.display = 'none';

  controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}
const _t1 = new THREE.Vector3(), _t2 = new THREE.Vector3(), _t3 = new THREE.Vector3(),
      _t4 = new THREE.Vector3(), _t5 = new THREE.Vector3(), _t6 = new THREE.Vector3();

if (mode === 'mission') sim.missionStart();
if (mode === 'quiz') { newQuiz(); }
rebuildStacks();
renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast('수조를 돌려 보고, 퇴적물을 차곡차곡 부어 봐요');
animate();

/* 테스트용 앱 훅 */
window.StrataApp = {
  sim, get mode() { return mode; }, setMode, setGrade, act, clickLayer, digFossil,
  get nearVis() { return nearVis; }, get farVis() { return farVis; },
  get upT() { return upT; },
  mixGrp, water, grassGrp, crackMesh, liftGrp
};
</script>
</body>
</html>

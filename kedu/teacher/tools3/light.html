<!--
  케이랩 v3 · A트랙 5호 — 빛·그림자·거울 (2026-07-12 · 페이블)
  v2 engine/tools/light.js(514줄) 전면 재건 · r185 + klab3 코어.
  🔴 신기술(페이블 몫) 이행: 거울 반사 «광선 실선» — 손전등에서 나온 광선 부채꼴 9줄이
     발광 빔(가산 블렌딩 실린더)으로 거울에 닿아 입사각=반사각으로 실시간 튕김.
     마주 보는 거울(만약에)에선 최대 8바운스 지그재그 왕복 + 튕긴 횟수 라벨.
     휘는-빛 세상(만약에)에선 곡선 튜브 빔이 물체를 우회 — 실제 그림자(spotlight shadow map)가 사라짐.
  스튜디오 5요소: ① 다크 암실 스튜디오 + 실험대 위 광학 벤치
    ② 실물 질감(금속 손전등·유리 렌즈·원목 차단판·아크릴 스크린·은거울, PMREM 광택)
    ③ 직접 조작(손전등·차단판·거울을 집어 끌기 · 거울 돌리기 · 궤도 회전)
    ④ 즉각 반응(진짜 그림자 맵 — 전구를 옮기면 스크린 그림자 크기가 실시간으로 변함 · 광선 빔 실시간 추적)
    ⑤ 탐구 구조 = v2 4층 무손실
  v2 무손실: 학년칸(저=그림자·미션1 / 중=미션2·만약에2종 / 고=거울 토글·미션4·변수·만약에3종)
    · 미션 4(가까이=크게→멀리=작게→반사 위로→아래로, acted 게이트) · 퀴즈 5문(장면 전환·상태 숨김)
    · 만약에 3종(💡💡 전구 둘=그림자 둘·겹침만 진함 / 🌀 휘는 빛=그림자 소멸 / 🪞🪞 마주 거울=다중 반사)
    · 변수 슬라이더(📏 물체 크기 80~260 · 🪞 거울 각도 -138°~46°) · 예측 무장 2종(size·ang)
    · 예측 노트 칩 + 5칩 «🔦 꼬마 빛탐정» · 상태줄 문구 · 관측 dataset(sh/sh2/ov/bend/bounces)
  config: ?grade=low|mid|high(지정 시 잠금) · ?mode=free|mission|quiz|whatif · ?exp=shadow|mirror
    (옛 config mode=mirror도 거울 진입으로 호환)
-->

<!-- ═══ 순수 로직 (window.LightSim · node 테스트 대상 · DOM/THREE 무의존) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 논리 좌표계 (v2 무손실): 900×460, 스크린 x=810, 무대 45~415 ── */
  var TOP=45, BOT=415, SCRX=810, VBW=900, VBH=460;

  /* ── 학년 칸 (v2 GRADES 무손실) —
     저=그림자 만들기 / 중=광원 위치와 그림자 크기(직진) / 고=거울 반사(입사각=반사각) ── */
  var GRADES={
    low:  { mIdx:[0],       showExp:false, modes:['free','mission','quiz'],          v2:false, wif:[] },
    mid:  { mIdx:[0,1],     showExp:false, modes:['free','mission','quiz','whatif'], v2:false, wif:['two','bend'] },
    high: { mIdx:[0,1,2,3], showExp:true,  modes:['free','mission','quiz','whatif'], v2:true,  wif:['two','bend','mirror2'] }
  };

  /* ── 광학 기하 (v2 수식 무손실 · 전부 순수 함수) ── */
  function hitScreen(S,px,py){ if(px<=S.x)return null; return S.y+(py-S.y)*(SCRX-S.x)/(px-S.x); }
  /* 광원 S가 물체 obj 뒤 스크린에 만드는 그림자 밴드 [a,b] (없으면 null) */
  function bandOf(S,obj){
    if(S.x>=obj.x)return null;
    var oy1=obj.y-obj.h/2, oy2=obj.y+obj.h/2, f=(SCRX-S.x)/(obj.x-S.x);
    var y1=S.y+(oy1-S.y)*f, y2=S.y+(oy2-S.y)*f;
    var a=Math.max(TOP,Math.min(y1,y2)), b=Math.min(BOT,Math.max(y1,y2));
    return (b>a)?{a:a,b:b}:null;
  }
  function mirEnds(M){ var hx=Math.cos(M.ang)*M.len/2, hy=Math.sin(M.ang)*M.len/2;
    return [[M.x-hx,M.y-hy],[M.x+hx,M.y+hy]]; }
  /* 광선(o + t·d)과 거울 선분 교차 */
  function raySeg(ox,oy,dx,dy,M){
    var m=mirEnds(M),p1=m[0],p2=m[1],ex=p2[0]-p1[0],ey=p2[1]-p1[1];
    var den=dx*ey-dy*ex; if(Math.abs(den)<1e-6)return null;
    var t=((p1[0]-ox)*ey-(p1[1]-oy)*ex)/den, s=((p1[0]-ox)*dy-(p1[1]-oy)*dx)/den;
    if(t>0.5&&s>=0&&s<=1)return {t:t,x:ox+dx*t,y:oy+dy*t};
    return null;
  }
  /* 반사의 법칙: 입사각=반사각 */
  function reflect(dx,dy,ang){
    var nx=-Math.sin(ang), ny=Math.cos(ang), dot=dx*nx+dy*ny;
    return { rx:dx-2*dot*nx, ry:dy-2*dot*ny };
  }
  /* 중심 광선의 반사 방향 (거울 미션 판정 — v2 무손실) */
  function centralReflect(src,mir){
    var base=Math.atan2(mir.y-src.y,mir.x-src.x), dx=Math.cos(base), dy=Math.sin(base);
    var hit=raySeg(src.x,src.y,dx,dy,mir); if(!hit)return null;
    var r=reflect(dx,dy,mir.ang);
    return { rx:r.rx, ry:r.ry, hx:hit.x, hy:hit.y };
  }
  /* 부채꼴 9줄 추적 (거울 모드 렌더 원자료 — v2 renderMirror 무손실) */
  function traceFan(src,mir){
    var base=Math.atan2(mir.y-src.y,mir.x-src.x), out=[];
    for(var r=-4;r<=4;r++){
      var ang=base+r*0.06, dx=Math.cos(ang), dy=Math.sin(ang);
      var hit=raySeg(src.x,src.y,dx,dy,mir);
      if(hit){
        var rf=reflect(dx,dy,mir.ang);
        out.push({hit:true,x1:src.x,y1:src.y,hx:hit.x,hy:hit.y,rx:rf.rx,ry:rf.ry});
      } else out.push({hit:false,x1:src.x,y1:src.y,ex:src.x+dx*1200,ey:src.y+dy*1200});
    }
    return out;
  }
  /* 마주 보는 거울 다중 반사 (최대 8바운스 — v2 renderMirror2 무손실) */
  function multiBounce(src,MA,MBb,tilt){
    var MB={x:MBb.x,y:MBb.y,ang:MBb.ang+tilt,len:MBb.len}, MIRS=[MA,MB];
    var base=Math.atan2(60, MA.x-src.x), dx=Math.cos(base), dy=Math.sin(base);
    var ox=src.x, oy=src.y, pts=[[ox,oy]], b=0;
    for(var i=0;i<8;i++){
      var best=null,bm=null;
      for(var j=0;j<2;j++){ var h=raySeg(ox,oy,dx,dy,MIRS[j]); if(h&&(!best||h.t<best.t)){best=h;bm=MIRS[j];} }
      if(!best)break;
      pts.push([best.x,best.y]); b++;
      var r=reflect(dx,dy,bm.ang); dx=r.rx; dy=r.ry;
      ox=best.x+dx*0.5; oy=best.y+dy*0.5;
    }
    pts.push([ox+dx*1200,oy+dy*1200]);
    return { pts:pts, b:b, mirrors:MIRS };
  }
  /* 휘는-빛 곡선 9줄 (v2 renderBend 무손실 — 물체를 크게 우회하는 Q곡선) */
  function bendCurves(src,obj){
    var out=[];
    for(var k=0;k<=8;k++){
      var ty=TOP+(BOT-TOP)*k/8;
      var midY=(ty<obj.y)?(obj.y-obj.h/2-70-k*4):(obj.y+obj.h/2+70+(8-k)*4);
      out.push({x0:src.x,y0:src.y,cx:obj.x,cy:midY,x1:SCRX,y1:ty});
    }
    return out;
  }

  /* ── 미션 (v2 문구·판정 무손실 · acted 게이트=v3 표준) ── */
  var MISSIONS=[
    { exp:'shadow', text:'💡 전구를 물체 <b>가까이</b> 옮겨 그림자를 크게 만들어 봐요!',
      check:function(st){ return st.exp==='shadow' && st.src.x<st.obj.x && (st.obj.x-st.src.x)<200; } },
    { exp:'shadow', text:'💡 이번엔 전구를 <b>멀리</b> 옮겨 그림자를 작게 만들어 봐요!',
      check:function(st){ return st.exp==='shadow' && st.src.x<st.obj.x && (st.obj.x-st.src.x)>420; } },
    { exp:'mirror', text:'🪞 거울을 돌려 반사된 주황 빛을 <b>위쪽</b>으로 보내 봐요!',
      check:function(st){ if(st.exp!=='mirror')return false; var r=centralReflect(st.src,st.mir); return !!r && r.ry<-0.4; } },
    { exp:'mirror', text:'🪞 이번엔 빛을 <b>아래 바닥 쪽</b>으로 보내 봐요!',
      check:function(st){ if(st.exp!=='mirror')return false; var r=centralReflect(st.src,st.mir); return !!r && r.ry>0.4; } }
  ];

  /* ── 퀴즈 5문 (v2 무손실 — 장면 exp 포함) ── */
  var QUIZ=[
    { exp:'shadow', q:'그림자는 물체의 어느 쪽에 생길까요?', ch:['빛의 반대쪽 (물체 뒤)','빛이 오는 쪽','아무 데나 생겨요'], a:0 },
    { exp:'shadow', q:'전구를 물체에 더 가까이 가져가면 그림자는?', ch:['더 커져요','더 작아져요','없어져요'], a:0 },
    { exp:'shadow', q:'빛은 어떻게 나아갈까요?', ch:['곧게 나아가요','구불구불 휘어 가요','제자리에 멈춰요'], a:0 },
    { exp:'mirror', q:'빛이 거울에 부딪히면 어떻게 될까요?', ch:['들어온 각과 같은 각으로 튕겨요','거울을 그냥 통과해요','빛이 사라져요'], a:0 },
    { exp:'shadow', q:'그림자가 생기려면 꼭 필요한 두 가지는?', ch:['빛과 빛을 막는 물체','소리와 바람','물과 공기'], a:0 }
  ];

  /* ── 만약에 3종 (v2 무손실) — play(sim)=상태 세팅, cond(sim)=해소 조건(조작 게이트) ── */
  var WHATIF={
    two:{ icon:'💡', title:'전구를 두 개 켜면?',
      q:'전구를 하나 더 켜면 물체의 그림자는 어떻게 될까요?',
      ch:['그림자가 더 진해져요','그림자가 두 개 생겨요','그림자가 사라져요'], a:1,
      reveal:'그림자는 검은 물질이 아니라 "그 전구의 빛이 못 닿은 자리"예요! 그래서 전구마다 그림자가 하나씩 — 두 그림자가 겹친 곳만 두 빛이 모두 못 닿아 진해요. 축구장 야간 경기에서 선수 그림자가 여러 개인 까닭이에요.',
      tip:'💡 두 전구를 끌어 옮겨 봐요 — 그림자가 몇 개? 겹치면 어떻게 되나요?',
      play:function(sim){ sim.state.exp='shadow'; sim.state.src={x:150,y:150}; sim.state.src2={x:180,y:340}; sim.state.obj={x:430,y:230,h:150}; },
      cond:function(sim){ return sim.state.wifActed && sim.overlap()>0; } },
    bend:{ icon:'🌀', title:'빛이 휘어서 모퉁이를 돈다면?',
      q:'만약 빛이 구불구불 휘어서 물체 뒤로 돌아갈 수 있다면, 그림자는 어떻게 될까요?',
      ch:['그림자가 더 진해져요','그림자가 사라져요','그림자가 두 배가 돼요'], a:1,
      reveal:'빛이 휘어 물체 뒤까지 돌아가면 빛이 못 닿는 자리가 없어져 그림자가 사라져요! 거꾸로 말하면 — 그림자가 있다는 것 자체가 빛이 곧게 나아간다는 증거예요. 휘는-빛 세상엔 그림자도, 밤도 없답니다.',
      tip:'↔ 버튼으로 직진 세상과 비교해 봐요!',
      play:function(sim){ sim.state.exp='shadow'; sim.state.src={x:130,y:200}; sim.state.obj={x:430,y:230,h:150}; sim.state.bend=true; },
      cond:function(sim){ return sim.state.wifActed && sim.state.bend===false; } },
    mirror2:{ icon:'🪞', title:'거울 두 장을 마주 보게 하면?',
      q:'두 거울을 마주 보게 세우고 빛을 쏘면, 빛은 몇 번 튕길까요?',
      ch:['딱 한 번만 튕겨요','여러 번 왔다 갔다 튕겨요','거울 사이에서 사라져요'], a:1,
      reveal:'빛은 거울에 닿을 때마다 입사각=반사각으로 또 튕겨요! 마주 보는 거울 사이에선 여러 번 왕복하며 지그재그로 나아가요 — 이발소·엘리베이터의 끝없는 거울 나라가 바로 이 원리예요.',
      tip:'전구를 끌고 ↻ 거울을 기울여 봐요 — 몇 번 튕기나!',
      play:function(sim){ sim.state.exp='mirror2'; sim.state.src={x:450,y:90}; sim.state.m2tilt=0; sim.state.m2b=0; },
      cond:function(sim){ return sim.state.wifActed && sim.state.m2b>=2; } }
  };

  /* ── 예측 무장 2종 (v2 3층 무손실 — 정답 선택지=1) ── */
  var PRED={
    size:{ q:'🔮 예측 먼저! 물체가 두 배로 커지면 그림자는 어떻게 될까요?',
      ch:['그림자는 그대로다','물체가 커진 만큼 그림자도 커진다','오히려 작아진다'],
      tip:'📏 슬라이더를 끝까지 키워 그림자를 지켜봐요!' },
    ang:{ q:'🔮 예측 먼저! 빛이 거울에 부딪히면 어떻게 튕길까요?',
      ch:['아무 각도로나 튕긴다','들어온 각과 같은 각으로 튕긴다','거울을 그냥 통과한다'],
      tip:'🪞 슬라이더로 각도를 이리저리 돌려 봐요 — 규칙이 보여요!' }
  };
  var CHIPNM={two:'💡 그림자둘',bend:'🌀 휘는빛',mirror2:'🪞 무한거울',size:'📏 크기예측',ang:'🪞 반사예측'};

  /* ── 시뮬 생성 ── */
  function createSim(grade){
    grade=(['low','mid','high'].indexOf(grade)>=0)?grade:'high';
    var sim={};
    sim.grade=grade;
    sim.G=function(){ return GRADES[sim.grade]; };
    sim.M2A={x:330,y:230,ang:1.45,len:310};
    sim.M2B={x:760,y:230,ang:-1.45,len:310};
    sim.state=null;
    sim.reset=function(){
      sim.state={ exp:'shadow',
        src:{x:130,y:200}, src2:{x:180,y:340},
        obj:{x:430,y:230,h:150},
        mir:{x:540,y:270,ang:-0.78,len:220},
        bend:true, m2tilt:0, m2b:0,
        angSpan:{min:null,max:null},
        acted:false, wifActed:false };
    };
    sim.reset();
    sim.v2reset=function(){ var st=sim.state;
      st.src2={x:180,y:340}; st.bend=true; st.m2tilt=0; st.m2b=0;
      st.angSpan={min:null,max:null}; st.wifActed=false; };

    /* 조작 (전부 acted 게이트 세움 — v3 표준) */
    function clampY(v,lo,hi){ return Math.max(lo,Math.min(v,hi)); }
    sim.moveSrc=function(x,y){ var s=sim.state.src;
      s.x=clampY(x,40,VBW-40); s.y=clampY(y,TOP,BOT);
      sim.state.acted=true; sim.state.wifActed=true; };
    sim.moveSrc2=function(x,y){ var s=sim.state.src2;
      s.x=clampY(x,40,VBW-40); s.y=clampY(y,TOP,BOT);
      sim.state.acted=true; sim.state.wifActed=true; };
    sim.moveObj=function(x,y){ var o=sim.state.obj;
      o.x=clampY(x,120,SCRX-60); o.y=clampY(y,TOP+o.h/2,BOT-o.h/2);
      sim.state.acted=true; sim.state.wifActed=true; };
    sim.moveMir=function(x,y){ var m=sim.state.mir;
      m.x=clampY(x,260,VBW-80); m.y=clampY(y,TOP+40,BOT-40);
      sim.state.acted=true; sim.state.wifActed=true; };
    sim.rotMir=function(){ sim.state.mir.ang+=Math.PI/12; sim.state.acted=true; };
    sim.tiltM2=function(){ sim.state.m2tilt-=0.05; sim.state.wifActed=true; };
    sim.toggleBend=function(){ sim.state.bend=!sim.state.bend; sim.state.wifActed=true; return sim.state.bend; };
    sim.setObjH=function(h){ var o=sim.state.obj;
      o.h=Math.max(80,Math.min(260,h));
      o.y=clampY(o.y,TOP+o.h/2,BOT-o.h/2);
      sim.state.acted=true; };
    sim.setMirAng=function(a){ var st=sim.state;
      st.mir.ang=Math.max(-2.4,Math.min(0.8,a));
      if(st.angSpan.min==null||st.mir.ang<st.angSpan.min)st.angSpan.min=st.mir.ang;
      if(st.angSpan.max==null||st.mir.ang>st.angSpan.max)st.angSpan.max=st.mir.ang;
      st.acted=true; };

    /* 파생 기하 */
    sim.band=function(){ return bandOf(sim.state.src, sim.state.obj); };
    sim.band2=function(){ return bandOf(sim.state.src2, sim.state.obj); };
    sim.overlap=function(){ var b1=sim.band(), b2=sim.band2();
      if(!b1||!b2)return 0;
      return Math.max(0, Math.min(b1.b,b2.b)-Math.max(b1.a,b2.a)); };
    sim.centralReflect=function(){ return centralReflect(sim.state.src, sim.state.mir); };
    sim.fan=function(){ return traceFan(sim.state.src, sim.state.mir); };
    sim.bounceTrace=function(){ var r=multiBounce(sim.state.src, sim.M2A, sim.M2B, sim.state.m2tilt);
      sim.state.m2b=r.b; return r; };
    sim.bends=function(){ return bendCurves(sim.state.src, sim.state.obj); };

    /* 미션 러너 (학년칸 mIdx slice · acted 게이트) */
    sim.mStep=0; sim.mDone=false;
    sim.missionList=function(){ return sim.G().mIdx.map(function(i){return MISSIONS[i];}); };
    sim.missionStart=function(){
      sim.mStep=0; sim.mDone=false; sim.reset();
      sim.state.exp=sim.missionList()[0].exp;
    };
    sim.missionCheck=function(){
      if(sim.mDone) return {act:'none'};
      var M=sim.missionList();
      if(!sim.state.acted) return {act:'none'};
      if(!M[sim.mStep].check(sim.state)) return {act:'none'};
      if(sim.mStep<M.length-1){
        sim.mStep++;
        sim.state.exp=M[sim.mStep].exp;
        sim.state.acted=false;
        return {act:'next', step:sim.mStep};
      }
      sim.mDone=true;
      return {act:'done'};
    };

    /* 퀴즈 (rand 주입 순수화 · v2 무반복 순환 무손실) */
    sim.qUsed=[];
    sim.newQuiz=function(rand){
      rand=rand||Math.random;
      if(sim.qUsed.length>=QUIZ.length)sim.qUsed=[];
      var cand=[]; for(var i=0;i<QUIZ.length;i++)if(sim.qUsed.indexOf(i)<0)cand.push(i);
      var idx=cand[Math.floor(rand()*cand.length)];
      sim.qUsed.push(idx);
      sim.reset();
      sim.state.exp=QUIZ[idx].exp;
      return idx;
    };

    /* 예측 무장/해소 + 칩 (v2 3층 무손실) */
    sim.chips=[];
    sim.pred={ size:{asked:false,ch:-1,done:false}, ang:{asked:false,ch:-1,done:false} };
    sim.predArm=function(kind){ if(sim.pred[kind].asked)return false; sim.pred[kind].asked=true; return true; };
    sim.predChoose=function(kind,i){ sim.pred[kind].ch=i; };
    sim.checkPred=function(){
      var out=[], st=sim.state;
      ['size','ang'].forEach(function(kind){
        var p=sim.pred[kind]; if(p.done||p.ch<0)return;
        var hitCond = kind==='size'
          ? (st.exp==='shadow' && st.obj.h>=220 && st.src.x<st.obj.x)
          : (st.exp==='mirror' && st.angSpan.min!=null && (st.angSpan.max-st.angSpan.min)>=0.9);
        if(!hitCond)return;
        p.done=true;
        var hit=(p.ch===1);
        sim.chips.push({k:kind,hit:hit});
        out.push({kind:kind,hit:hit});
      });
      return out;
    };
    sim.wifChip=function(key,choice){ sim.chips.push({k:key,hit:(choice===WHATIF[key].a)}); };

    /* 상태줄 문구 (v2 무손실) */
    sim.statusText=function(wifKey){
      var st=sim.state;
      if(wifKey==='two'){
        return sim.overlap()>0
          ? '그림자가 두 개! 겹친 곳만 두 빛이 모두 못 닿아 진해요.'
          : '전구마다 그림자가 하나씩 — 두 전구를 움직여 그림자를 겹쳐 봐요!';
      }
      if(wifKey==='bend'){
        return st.bend
          ? '빛이 물체를 휘어 돌아가니 스크린이 온통 환해요 — 그림자가 사라졌어요!'
          : '직진 세상에선 물체 뒤에 그림자가 또렷해요 — 그림자는 직진의 증거!';
      }
      if(wifKey==='mirror2'){
        return '빛이 두 거울 사이를 '+st.m2b+'번 튕기며 지그재그로 나아가요 — 닿을 때마다 입사각=반사각!';
      }
      if(st.exp==='shadow'){
        if(st.src.x>=st.obj.x)return '전구를 물체 왼쪽으로 옮기면 그림자가 스크린에 생겨요.';
        return '빛은 곧게 나아가요. 물체에 막힌 곳 뒤로 그림자가 생겨요 — '
          +(st.obj.x-st.src.x<200?'전구가 가까워 그림자가 커요.':'전구가 멀어 그림자가 작아요.');
      }
      return '빛이 거울에 부딪히면 들어온 각(입사각)과 똑같은 각(반사각)으로 튕겨 나가요. 거울을 돌리면 반사 방향이 바뀌어요.';
    };

    return sim;
  }

  var API={ GRADES:GRADES, MISSIONS:MISSIONS, QUIZ:QUIZ, WHATIF:WHATIF, PRED:PRED, CHIPNM:CHIPNM,
    TOP:TOP, BOT:BOT, SCRX:SCRX, VBW:VBW, VBH:VBH,
    hitScreen:hitScreen, bandOf:bandOf, mirEnds:mirEnds, raySeg:raySeg, reflect:reflect,
    centralReflect:centralReflect, traceFan:traceFan, multiBounce:multiBounce, bendCurves:bendCurves,
    createSim:createSim };
  if(typeof window!=='undefined') window.LightSim=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

function sparkAdd(x, y, s) {
  if (sparkUsed >= sparks.length) return;
  const sp = sparks[sparkUsed++];
  sp.position.set(wx(x), wy(y), 0.005); sp.scale.setScalar(s || 0.06); sp.visible = true;
}
function sparkFlush() { for (let i = sparkUsed; i < sparks.length; i++) sparks[i].visible = false; }

/* 휘는-빛 곡선 튜브 (만약에 🌀 — 재생성형) */
const bendGroup = new THREE.Group(); scene.add(bendGroup);
function rebuildBendTubes() {
  bendGroup.clear();
  if (!(wifKey === 'bend' && sim.state.bend)) return;
  sim.bends().forEach(c => {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(wx(c.x0), wy(c.y0), 0),
      new THREE.Vector3(wx(c.cx), wy(c.cy), 0),
      new THREE.Vector3(wx(c.x1), wy(c.y1), 0));
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 26, 0.0045, 6),
      new THREE.MeshBasicMaterial({ color: 0xFFC078, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
    bendGroup.add(tube);
  });
}

/* 빛 원뿔 (암실 분위기 — 아주 옅은 가산 원뿔) + 먼지 입자 */
const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 24, 1, true),
  new THREE.MeshBasicMaterial({ color: 0xFFE3B0, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
scene.add(cone);
const dustN = 110;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) {
  dustPos[i * 3] = -0.7 + Math.random() * 1.4;
  dustPos[i * 3 + 1] = 0.08 + Math.random() * 0.6;
  dustPos[i * 3 + 2] = -0.1 + Math.random() * 0.2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xFFE9C4, size: 0.006, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(dust);

/* ═══════════ DOM 주석 (튕긴 횟수·겹침·휘는빛 라벨 투영) ═══════════ */
const annoHost = document.getElementById('anno');
function mkAnno(color) {
  const d = document.createElement('div');
  d.className = 'lt-anno';
  d.style.color = color; d.style.borderColor = color;
  annoHost.appendChild(d);
  return d;
}
const annoBounce = mkAnno('#CBB7FF');
const annoOv = mkAnno('#FFE3C4');
const annoBend = mkAnno('#CBB7FF');
const _pv = new THREE.Vector3();
function placeAnno(el2, x, y, html, on) {
  if (!on) { el2.style.display = 'none'; return; }
  _pv.set(wx(x), wy(y), 0).project(camera);
  if (_pv.z > 1) { el2.style.display = 'none'; return; }
  if (html != null) el2.innerHTML = html;
  el2.style.left = ((_pv.x * 0.5 + 0.5) * innerWidth) + 'px';
  el2.style.top = ((-_pv.y * 0.5 + 0.5) * innerHeight) + 'px';
  el2.style.display = '';
}

/* ═══════════ 장면 동기화 (조작·전환 시 호출) ═══════════ */
const _aim = new THREE.Vector3();
function aimLamp(g, sx, sy, tx, ty) {
  g.position.set(wx(sx), wy(sy), 0);
  g.rotation.z = Math.atan2(wy(ty) - wy(sy), wx(tx) - wx(sx));
}
function sceneExp() {
  if (mode === 'quiz') return Sim.QUIZ[quizIdx].exp;
  if (wifKey === 'mirror2') return 'mirror2';
  return sim.state.exp;
}
function syncScene() {
  const st = sim.state, exp = sceneExp();
  const shadowish = exp === 'shadow';
  const mirrorish = exp === 'mirror';
  const m2ish = exp === 'mirror2';
  const bendOn = wifKey === 'bend' && st.bend;

  /* 손전등 */
  const aimT = mirrorish ? st.mir : (m2ish ? sim.M2A : st.obj);
  aimLamp(lampG, st.src.x, st.src.y, aimT.x, aimT.y);
  lamp2G.visible = wifKey === 'two';
  if (lamp2G.visible) aimLamp(lamp2G, st.src2.x, st.src2.y, st.obj.x, st.obj.y);

  /* 차단판·스크린 */
  blocker.visible = shadowish;
  screenG.visible = shadowish;
  if (shadowish) {
    const h = st.obj.h * S;
    blocker.scale.y = h;
    blocker.position.set(wx(st.obj.x), wy(st.obj.y), 0);
    blocker.castShadow = !bendOn;                 // 🌀 휘는-빛 세상 = 진짜 그림자 소멸
  }

  /* 그림자 스포트라이트 */
  spot.visible = shadowish;
  spot2.visible = shadowish && wifKey === 'two';
  if (shadowish) {
    spot.position.set(wx(st.src.x) + 0.05, wy(st.src.y), 0);
    spot.target.position.set(wx(Sim.SCRX), wy(st.obj.y), 0);
    if (spot2.visible) {
      spot2.position.set(wx(st.src2.x) + 0.05, wy(st.src2.y), 0);
      spot2.target.position.set(wx(Sim.SCRX), wy(st.obj.y), 0);
    }
  }

  /* 원뿔·먼지 */
  cone.visible = shadowish && !bendOn;
  dust.visible = shadowish;
  if (cone.visible) {
    const cx1 = wx(st.src.x), cy1 = wy(st.src.y);
    const cx2 = wx(Sim.SCRX), cy2 = wy((Sim.TOP + Sim.BOT) / 2);
    _aim.set(cx2 - cx1, cy2 - cy1, 0);
    const len = _aim.length();
    cone.position.set((cx1 + cx2) / 2, (cy1 + cy2) / 2, 0);
    cone.quaternion.setFromUnitVectors(_up, _aim.normalize());
    cone.scale.set(0.34, len, 0.2);
    cone.rotation.z += Math.PI;                    // 꼭짓점을 손전등 쪽으로
  }

  /* 거울들 */
  mirrorG.visible = mirrorish;
  if (mirrorish) {
    mirrorG.position.set(wx(st.mir.x), wy(st.mir.y), 0);
    mirrorTiltG.rotation.z = -st.mir.ang;
    const rod = mirrorG.getObjectByName('rod'), base = mirrorG.getObjectByName('base');
    const H = wy(st.mir.y);
    rod.scale.y = Math.max(0.05, H);
    rod.position.y = -H / 2;
    base.position.y = -H + 0.01;
  }
  m2AG.visible = m2BG.visible = m2ish;
  if (m2ish) {
    m2AG.position.set(wx(sim.M2A.x), wy(sim.M2A.y), 0);
    m2AG.rotation.z = -sim.M2A.ang;
    m2BG.position.set(wx(sim.M2B.x), wy(sim.M2B.y), 0);
    m2BG.rotation.z = -(sim.M2B.ang + st.m2tilt);
  }

  /* ── 🔴 광선 실선 재계산 ── */
  beamReset(); sparkReset();
  if (mirrorish) {
    sim.fan().forEach(r => {
      if (r.hit) {
        beamAdd(r.x1, r.y1, r.hx, r.hy, 0xFFC078, 0.5, 0.005);
        beamAdd(r.hx, r.hy, r.hx + r.rx * 900, r.hy + r.ry * 900, 0xFF922B, 0.62, 0.006);
        sparkAdd(r.hx, r.hy, 0.05);
      } else {
        beamAdd(r.x1, r.y1, r.ex, r.ey, 0xFFC078, 0.3, 0.004);
      }
    });
  } else if (m2ish) {
    const tr = sim.bounceTrace();
    for (let i = 0; i < tr.pts.length - 1; i++) {
      const p = tr.pts[i], q2 = tr.pts[i + 1];
      beamAdd(p[0], p[1], q2[0], q2[1], i === 0 ? 0xFFC078 : 0xFF922B,
        Math.max(0.22, 0.66 - i * 0.07), i === 0 ? 0.005 : 0.006);
      if (i > 0) sparkAdd(p[0], p[1], 0.055);
    }
  } else if (shadowish && !bendOn) {
    const b = sim.band();
    if (b && st.src.x < st.obj.x) {                 // 직진 안내선 2줄 (v2 점선 계승)
      const oy1 = st.obj.y - st.obj.h / 2, oy2 = st.obj.y + st.obj.h / 2;
      const y1 = Sim.hitScreen(st.src, st.obj.x, oy1), y2 = Sim.hitScreen(st.src, st.obj.x, oy2);
      if (y1 != null) beamAdd(st.src.x, st.src.y, Sim.SCRX, y1, 0xFFC078, 0.34, 0.0035);
      if (y2 != null) beamAdd(st.src.x, st.src.y, Sim.SCRX, y2, 0xFFC078, 0.34, 0.0035);
    }
  }
  beamFlush(); sparkFlush();
  rebuildBendTubes();

  /* 라벨 */
  const ov = sim.overlap();
  placeAnno(annoOv, Sim.SCRX - 60, sim.band() && sim.band2() && ov > 0 ? (Math.max(sim.band().a, sim.band2().a) + Math.min(sim.band().b, sim.band2().b)) / 2 : 0,
    '겹침 — 진해요!', wifKey === 'two' && ov > 0);
  placeAnno(annoBounce, 545, 70, '튕긴 횟수: <b>' + st.m2b + '</b>번!', m2ish);
  placeAnno(annoBend, 450, 78,
    st.bend ? '🌀 휘는-빛 세상 — 그림자가 없어요!' : '↔ 직진 세상 — 그림자가 돌아왔어요',
    wifKey === 'bend');

  /* 관측 dataset (v2 검증 관측점 계승) */
  const sEl = document.getElementById('stage');
  sEl.dataset.exp = exp;
  sEl.dataset.srcx = String(Math.round(st.src.x)); sEl.dataset.srcy = String(Math.round(st.src.y));
  sEl.dataset.objx = String(Math.round(st.obj.x)); sEl.dataset.objh = String(Math.round(st.obj.h));
  sEl.dataset.mirang = st.mir.ang.toFixed(2);
  const bb = sim.band(); sEl.dataset.sh = bb ? String(Math.round(bb.b - bb.a)) : '0';
  const bb2 = sim.band2(); sEl.dataset.sh2 = bb2 ? String(Math.round(bb2.b - bb2.a)) : '0';
  sEl.dataset.ov = String(Math.round(ov));
  sEl.dataset.bend = st.bend ? '1' : '0';
  sEl.dataset.bounces = String(st.m2b);
}

/* ═══════════ UI ═══════════ */
const $ = id => document.getElementById(id);
const hudL = $('hudL'), ctrls = $('ctrls'), mbar = $('mbar'), v2row = $('v2row'),
      wifpick = $('wifpick'), choicesEl = $('choices'), chipsEl = $('chips'), statusEl = $('status');
let hintHidden = false;
function hideHint() { if (!hintHidden) { hintHidden = true; $('hint').classList.add('hide'); } }

const MODE_NM = { free: '🔭 자유탐구', mission: '🎯 미션', quiz: '❓ 퀴즈', whatif: '🌀 만약에' };
const GRADE_NM = { low: '🌱 저학년', mid: '🌿 중학년', high: '🌳 고학년' };

function renderHUD() {
  let h = '';
  if (!lockedGrade) {
    h += '<div class="lt-seg">' + ['low', 'mid', 'high'].map(g =>
      `<button data-g="${g}" class="${sim.grade === g ? 'on' : ''}">${GRADE_NM[g]}</button>`).join('') + '</div>';
  }
  h += '<div class="lt-seg">' + sim.G().modes.map(m =>
    `<button data-m="${m}" class="${mode === m ? 'on' : ''}">${MODE_NM[m]}</button>`).join('') + '</div>';
  if (mode === 'free' && sim.G().showExp) {
    h += '<div class="lt-seg">' + [['shadow', '💡 그림자'], ['mirror', '🪞 거울 반사']].map(x =>
      `<button data-e="${x[0]}" class="${sim.state.exp === x[0] ? 'on hot' : ''}">${x[1]}</button>`).join('') + '</div>';
  }
  hudL.innerHTML = h;
  hudL.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => setGrade(b.dataset.g)));
  hudL.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
  hudL.querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => { hideHint(); setExp(b.dataset.e); }));
}

function renderCtrls() {
  if (mode === 'quiz') { ctrls.style.display = 'none'; return; }
  ctrls.style.display = '';
  let h = '';
  const exp = sceneExp();
  if (exp === 'mirror') h += '<button class="k3-btn accent" data-a="rot">↻ 거울 돌리기</button>';
  if (wifKey === 'bend') h += `<button class="k3-btn fire" data-a="bendTgl">${sim.state.bend ? '↔ 직진 세상과 비교' : '🌀 휘는-빛 세상으로'}</button>`;
  if (wifKey === 'mirror2') h += '<button class="k3-btn accent" data-a="tilt">↻ 거울 조금 기울이기</button>';
  h += '<button class="k3-btn" data-a="reset">↺ 처음으로</button>';
  if (mode === 'whatif' && wifKey) h += '<button class="k3-btn" data-a="wifBack">🌀 다른 만약에</button>';
  ctrls.innerHTML = h;
  ctrls.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => act(b.dataset.a)));
}

function renderBar() {
  if (mode === 'mission') {
    mbar.style.display = '';
    const M = sim.missionList();
    mbar.innerHTML = sim.mDone
      ? '<b>🎉 미션 완주!</b> 자유탐구에서 빛을 마음껏 다뤄 봐요<div class="st">완료 ' + M.length + ' / ' + M.length + '</div>'
      : M[sim.mStep].text + `<div class="st">미션 ${sim.mStep + 1} / ${M.length}</div>`;
  } else if (mode === 'quiz') {
    mbar.style.display = '';
    mbar.innerHTML = `${Sim.QUIZ[quizIdx].q}<div class="st">점수 ${quizScore} / ${quizCount}</div>`;
  } else mbar.style.display = 'none';
}

/* 변수 슬라이더 (v2 1층 — 고학년·자유탐구 전용) */
function renderV2() {
  const G = sim.G(), st = sim.state;
  if (mode !== 'free' || !G.v2) { v2row.style.display = 'none'; return; }
  v2row.style.display = '';
  if (st.exp === 'shadow') {
    v2row.innerHTML = `<div>📏 물체 크기 <input id="slSize" type="range" min="80" max="260" step="2" value="${st.obj.h}"></div>
      <div class="vl" id="slSizeLb">${st.obj.h}</div>`;
    $('slSize').addEventListener('input', e => {
      sim.setObjH(+e.target.value);
      $('slSizeLb').textContent = String(st.obj.h);
      armPred('size');
      resolvePreds(); syncScene(); renderStatus();
    });
  } else {
    v2row.innerHTML = `<div>🪞 거울 각도 <input id="slAng" type="range" min="-2.4" max="0.8" step="0.02" value="${st.mir.ang}"></div>
      <div class="vl" id="slAngLb">${Math.round(st.mir.ang * 180 / Math.PI)}°</div>`;
    $('slAng').addEventListener('input', e => {
      sim.setMirAng(+e.target.value);
      $('slAngLb').textContent = Math.round(st.mir.ang * 180 / Math.PI) + '°';
      armPred('ang');
      resolvePreds(); syncScene(); renderStatus();
    });
  }
}

/* 상태 카드 (퀴즈에선 숨김 = 정답 누설 차단) */
function renderStatus() {
  if (mode === 'quiz') { statusEl.style.display = 'none'; return; }
  statusEl.style.display = '';
  statusEl.innerHTML = `<div class="card">${sim.statusText(wifKey)}</div>`;
}

function renderChips() {
  chipsEl.innerHTML = sim.chips.map(c =>
    `<span class="chip ${c.hit ? 'hit' : 'miss'}">${Sim.CHIPNM[c.k] || c.k} · ${c.hit ? '✔적중' : '✘빗나감'}</span>`).join('');
}

function renderQuiz() {
  if (mode !== 'quiz') { choicesEl.style.display = 'none'; return; }
  choicesEl.style.display = '';
  const q = Sim.QUIZ[quizIdx];
  const order = q.ch.map((c, i) => ({ c, i })).sort(() => Math.random() - 0.5);
  choicesEl.innerHTML = order.map(o => `<button data-v="${o.i}">${o.c}</button>`).join('');
  choicesEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    if (quizLock) return; quizLock = true;
    const ok = +b.dataset.v === q.a;
    quizCount++; if (ok) quizScore++;
    K3.sound.play(ok ? 'chime' : 'fail');
    K3.toast(ok ? '🎉 정답! ' + q.ch[q.a] : '아쉬워요 — 정답은 「' + q.ch[q.a] + '」', !ok, T(1300));
    setTimeout(() => {
      quizIdx = sim.newQuiz();
      quizLock = false; syncScene(); renderAll();
    }, T(1450));
  }));
}

/* 만약에 고르기 패널 */
function renderWifPick() {
  if (mode !== 'whatif' || wifKey) { wifpick.style.display = 'none'; return; }
  wifpick.style.display = '';
  wifpick.innerHTML = '<div class="ti">🌀 만약에… 하나를 골라 실험해 봐요</div>' +
    sim.G().wif.map(k => `<button data-w="${k}">${Sim.WHATIF[k].icon} ${Sim.WHATIF[k].title}</button>`).join('');
  wifpick.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => startWif(b.dataset.w)));
}
async function startWif(key) {
  wifKey = key; wifChoice = -1; wifRevealed = false; wifPlaying = false;
  const W = Sim.WHATIF[key];
  renderWifPick(); renderCtrls();
  K3.sound.play('charge');
  wifChoice = await K3.cards.predict(W.q, W.ch.map((c, i) => ({ id: i, label: c })));
  W.play(sim);
  sim.state.wifActed = false;
  wifPlaying = true;
  K3.toast('🧪 ' + W.tip, false, T(4600));
  syncScene(); renderCtrls(); renderStatus();
}
function wifResolve() {
  if (!wifKey || wifRevealed || !wifPlaying) return;
  const W = Sim.WHATIF[wifKey];
  if (!W.cond(sim)) return;
  wifRevealed = true;
  sim.wifChip(wifKey, wifChoice);
  const hit = wifChoice === W.a;
  K3.sound.play(hit ? 'chime' : 'pop'); K3.sound.play('ting');
  setTimeout(() => {
    K3.cards.result(
      `<h3 style="color:${hit ? '#0d7a5c' : '#B9522F'}">${hit ? '🎯 예측 적중!' : '🤔 예측과 달랐죠?'}</h3>
       <p style="font-size:13px;line-height:1.7;color:#41546a">${W.reveal}</p>`,
      [{ label: '계속 실험', cls: 'pri', value: 0 }, { label: '🌀 다른 만약에', value: 1 }]
    ).then(v => { if (v === 1) act('wifBack'); else renderAll(); });
    renderChips(); chipToast();
  }, T(1100));
}

/* 예측 무장 (free · v2) */
async function armPred(kind) {
  if (mode !== 'free' || !sim.G().v2) return;
  if (!sim.predArm(kind)) return;
  const P = Sim.PRED[kind];
  K3.sound.play('select');
  const ch = await K3.cards.predict(P.q, P.ch.map((c, i) => ({ id: i, label: c })));
  sim.predChoose(kind, ch);
  K3.toast('📝 예측 접수! ' + P.tip, false, T(4200));
}
function resolvePreds() {
  sim.checkPred().forEach(r => {
    const msg = r.kind === 'size'
      ? (r.hit ? '✔ 예측 적중 — 물체가 커진 만큼 그림자도 커져요! 빛이 곧게 가다 막힌 자리가 그림자거든요.'
               : '✘ 예측 빗나감 — 물체가 커지면 그림자도 커져요! 빛을 막는 부분이 그만큼 넓어지니까요.')
      : (r.hit ? '✔ 예측 적중 — 어느 각도로 돌려도 들어온 각=나간 각! 반사의 법칙이에요.'
               : '✘ 예측 빗나감 — 빛은 언제나 들어온 각과 같은 각으로 튕겨요! 어느 각도에서든 똑같은 규칙이에요.');
    K3.sound.play(r.hit ? 'chime' : 'pop');
    K3.toast(msg, !r.hit, T(4600));
  });
  renderChips(); chipToast();
}
function chipToast() {
  if (sim.chips.length === 5) setTimeout(() => { K3.sound.play('ting'); K3.toast('🔦 꼬마 빛탐정 — 오늘 가설 5개를 실험했어요!'); }, T(600));
}

/* ── 조작 ── */
function act(a) {
  hideHint();
  if (a === 'rot') {
    sim.rotMir();
    K3.sound.play('select');
  }
  else if (a === 'bendTgl') {
    const on = sim.toggleBend();
    K3.sound.play(on ? 'whoosh' : 'select');
    wifResolve();
  }
  else if (a === 'tilt') {
    sim.tiltM2();
    K3.sound.play('select');
    sim.bounceTrace();
    wifResolve();
  }
  else if (a === 'reset') {
    const keepExp = sim.state.exp;
    sim.reset(); sim.state.exp = keepExp;
    if (wifKey) Sim.WHATIF[wifKey].play(sim);
    K3.sound.play('tap');
  }
  else if (a === 'wifBack') {
    wifKey = null; wifPlaying = false; wifRevealed = false;
    sim.reset(); K3.cards.hide(); syncScene(); renderAll(); return;
  }
  if (mode === 'mission') missionTick();
  syncScene(); renderCtrls(); renderStatus();
}
function missionTick() {
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  setTimeout(() => { syncScene(); renderAll(); }, T(1300));
}

function setGrade(g) {
  sim.grade = g;
  mode = 'free';
  wifKey = null; wifPlaying = false; wifRevealed = false;
  sim.reset(); sim.mStep = 0; sim.mDone = false;
  K3.cards.hide(); syncScene(); renderAll();
}
function setMode(m) {
  mode = m;
  wifKey = null; wifPlaying = false; wifRevealed = false;
  sim.reset(); K3.cards.hide();
  if (m === 'mission') sim.missionStart();
  if (m === 'quiz') { quizScore = 0; quizCount = 0; sim.qUsed = []; quizIdx = sim.newQuiz(); }
  syncScene(); renderAll();
}
function setExp(e) {
  sim.state.exp = e;
  syncScene(); renderAll();
}
function renderAll() {
  renderHUD(); renderCtrls(); renderBar(); renderV2(); renderQuiz(); renderWifPick(); renderChips(); renderStatus();
}

/* ═══════════ 집어 끌기 (레이캐스트 → 광학면 z=0 평면 드래그) ═══════════ */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const _hitP = new THREE.Vector3();
let dragKey = null, dragMoved = false;
function grabTargets() {
  const st = sim.state, exp = sceneExp(), out = [];
  if (mode === 'quiz') return out;
  lampG.userData.grabMeshes.forEach(m => out.push(m));
  if (lamp2G.visible) lamp2G.userData.grabMeshes.forEach(m => out.push(m));
  if (exp === 'shadow') out.push(blocker);
  if (exp === 'mirror') mirrorTiltG.children.forEach(m => out.push(m));
  return out;
}
function ptrSet(e) {
  ptr.x = (e.clientX / innerWidth) * 2 - 1;
  ptr.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
}
renderer.domElement.addEventListener('pointerdown', e => {
  ptrSet(e);
  const hit = ray.intersectObjects(grabTargets(), false)[0];
  if (!hit) return;
  dragKey = hit.object.userData.grab; dragMoved = false;
  controls.enabled = false;
  K3.sound.play('tap');
  hideHint();
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragKey) return;
  ptrSet(e);
  if (!ray.ray.intersectPlane(dragPlane, _hitP)) return;
  const X = lx(_hitP.x), Y = ly(_hitP.y);
  if (dragKey === 'src') sim.moveSrc(X, Y);
  else if (dragKey === 'src2') sim.moveSrc2(X, Y);
  else if (dragKey === 'obj') sim.moveObj(X, Y);
  else if (dragKey === 'mir') sim.moveMir(X, Y);
  dragMoved = true;
  syncScene(); renderStatus();
});
addEventListener('pointerup', () => {
  if (!dragKey) return;
  dragKey = null;
  controls.enabled = true;
  if (dragMoved) {
    if (mode === 'mission') missionTick();
    resolvePreds(); wifResolve();
  }
});

/* ═══════════ 루프 (먼지 드리프트 · 반짝 맥동) ═══════════ */
const clock = new THREE.Clock();
const FASTX = window.__K3_FAST ? 12 : 1;
let tAcc = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()) * FASTX;
  tAcc += dt;
  if (dust.visible) {
    const p = dustGeo.attributes.position.array;
    for (let i = 0; i < dustN; i++) {
      p[i * 3] += Math.sin(tAcc * 0.5 + i) * 0.00012;
      p[i * 3 + 1] += Math.cos(tAcc * 0.4 + i * 1.7) * 0.0001;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }
  const sPulse = 1 + Math.sin(tAcc * 5) * 0.12;
  for (let i = 0; i < sparkUsed; i++) sparks[i].scale.setScalar(0.055 * sPulse);
  controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}

if (mode === 'mission') sim.missionStart();
if (mode === 'quiz') quizIdx = sim.newQuiz();
syncScene(); renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast('🔦 손전등·물체·거울을 집어 끌어 봐요 — 빛의 길이 실시간으로 따라와요');
animate();

/* 테스트용 앱 훅 */
window.LightApp = {
  sim, get mode() { return mode; }, setMode, setGrade, setExp, act,
  get wifKey() { return wifKey; }, startWif,
  get quizIdx() { return quizIdx; }, get quizScore() { return quizScore; },
  syncScene, beams, sparks,
  lampG, lamp2G, blocker, mirrorG, mirrorTiltG, m2AG, m2BG, spot, spot2, bendGroup,
  drag(key, x, y) {
    if (key === 'src') sim.moveSrc(x, y); else if (key === 'src2') sim.moveSrc2(x, y);
    else if (key === 'obj') sim.moveObj(x, y); else if (key === 'mir') sim.moveMir(x, y);
    syncScene(); renderStatus();
    if (mode === 'mission') missionTick();
    resolvePreds(); wifResolve();
  }
};
</script>
<script src="/kedu_back.js"></script>
</body>

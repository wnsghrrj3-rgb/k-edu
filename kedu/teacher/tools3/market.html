<!--
  케이랩 v3 · B트랙 양산 20호 = ★ B트랙 완주 마지막 한 종 — 시장 놀이 (market) · 셸 = clock 골든샘플 / foodchain·bodysys 계보
  SPEC = handoff/klab/designs3/SPEC_market.md (도면=정답)
  v2(engine/tools/market.js 325줄) 콘텐츠 무손실 이식:
    학년칸(저 물가카드X·퀴즈X·미션2 / 중 물가·퀴즈·미션3 / 고 와우·미션4)
    경제 모델(fair/want/sold/profit) 상수 신성불가침: BASE 100·COST 40·PMIN 10·PMAX 320·PSTEP 10
    SITS 6종(수요·공급·물가 변동)·drawSit·availSits(물가카드=중고만) 그대로
    미션 문구·정답 인덱스·해설 그대로(축제→올림·풍년→내림·흉작→올림·용돈→올림) · 퀴즈 5문·정답 문자열 그대로 · 상태줄/미리보기 문구 전부
  ★ setTimeout 연쇄 «없음» — foodchain/bodysys의 순수 stepper 분리 계약 해당 없음. 경제 모델이 이 도구의 생명줄.
  ★ 와우(v3 신설·예측 카드·1회 가드·중고 자유탐구) = 「💰 싸게 팔면 무조건 이득일까?」 = 가격 역설.
    상황을 깔고 🔮 예측(커진다 / 오히려 줄 수 있다) → 적정가 이익 vs 원가 근처(50원) 이익 나란히 →
    「싼 게 늘 이득은 아니에요」. profit = sold×(price−COST), COST 40이라 원가 근처면 남는 게 없음.
    저학년 숨김(수요·공급 방향 닻). ↺·상황 뽑기·학년/모드 전환 시 재무장.
  ⚠️ 미션 정답 인덱스 a=[0,1,0,0]·퀴즈 정답 문자열 → 둘 다 셔플 필수(rand 주입 · §6-2·§6-3).
  ⚠️ 미션은 생각형(상황 깔고 3선택지) — 선택해야 판정 = 자동달성 없음(SPEC §1). 진입 시 시드 초기화로 이중 봉인.
  v3 질감: 다크 스튜디오 + 원목 좌판 위 「과일 가게」 — 손님(수요)·사과(공급)를 아이콘 수로(곡선 아님·초등 직관).
  config: ?grade= & mode=(free|mission|quiz)
-->

<!-- ═══ 순수 로직 (node/jsdom 테스트 대상 · DOM 무의존) ═══ -->
<script>
(function(){
  'use strict';
  /* ── 학년 칸 (헌법 3장) — v2 GRADES 그대로 ── */
  var GRADES={
    low:  { modes:['free','mission'],        infl:false, quiz:false, missionN:2, showWow:false },
    mid:  { modes:['free','mission','quiz'], infl:true,  quiz:true,  missionN:3, showWow:true  },
    high: { modes:['free','mission','quiz'], infl:true,  quiz:true,  missionN:4, showWow:true  }
  };
  var GRADE_LABEL={ low:'저학년', mid:'중학년', high:'고학년' };
  var MODE_LABEL={ free:'자유탐구', mission:'미션', quiz:'퀴즈' };

  /* ── 경제 모델 (초등 직관용 단순화 · ★ 상수 신성불가침 SPEC §6-1) ──
       적정가 fair = BASE × (손님/물건) × 물가          (PSTEP 10원 반올림 · PMIN 하한)
       팔리는 손님 want = 손님 × (fair / 가격)          → 가격↑이면 손님↓, 가격↓이면 손님↑
       판매량 sold = min(물건, round(want))             → 손님이 물건보다 많으면 품절(공급 상한)
       이익 profit = 판매량 × (가격 − 원가)             → 원가(40) 근처면 많이 팔려도 남는 게 없음
     ★ 순수 함수 = 상태 무의존. 손님(d)·물건(s)·물가(infl)를 «인자로» 받는다(하니스가 수치 고정). */
  var BASE=100, COST=40, PMIN=10, PMAX=320, PSTEP=10;
  function fairPrice(d,s,infl){
    var f=BASE*(d/s)*(infl==null?1:infl);
    return Math.max(PMIN, Math.round(f/PSTEP)*PSTEP);
  }
  function wantAt(p,d,s,infl){ return d*(fairPrice(d,s,infl)/p); }
  function soldAt(p,d,s,infl){ return Math.max(0, Math.min(s, Math.round(wantAt(p,d,s,infl)))); }
  function profitAt(p,d,s,infl){ return soldAt(p,d,s,infl)*(p-COST); }

  /* ── 상황 카드 (수요·공급·물가 변동) — v2 SITS 그대로 신성불가침 ── */
  var SITS=[
    { ic:'☀️', t:'사과 풍년!',     ds:'햇빛이 좋아 사과가 잔뜩 열렸어요.',       dd:0,  dsup:3,  di:0,    why:'물건이 많아졌어요 (공급 늘어남)' },
    { ic:'🌧️', t:'가뭄 흉작',      ds:'비가 안 와서 사과가 적게 열렸어요.',       dd:0,  dsup:-3, di:0,    why:'물건이 귀해졌어요 (공급 줄어듦)' },
    { ic:'🎉', t:'마을 축제!',     ds:'축제라서 사람들이 북적북적 모였어요.',      dd:3,  dsup:0,  di:0,    why:'손님이 많아졌어요 (수요 늘어남)' },
    { ic:'🥶', t:'추운 날',        ds:'날이 추워 거리에 손님이 뜸해요.',          dd:-3, dsup:0,  di:0,    why:'손님이 줄었어요 (수요 줄어듦)' },
    { ic:'🏪', t:'옆 가게 등장',    ds:'옆 가게도 사과를 잔뜩 들여왔어요.',        dd:0,  dsup:3,  di:0,    why:'경쟁! 사과가 흔해졌어요' },
    { ic:'💰', t:'용돈이 풀렸어요', ds:'마을에 돈이 많이 풀려 다들 지갑이 두둑!',   dd:2,  dsup:0,  di:0.15, why:'물가가 슬슬 올라요 (인플레이션)' }
  ];
  /* 상황 적용(순수) — 현재 물가를 받아 새 손님·물건·물가를 반환. price는 App이 fairPrice로 세팅. */
  function applySit(idx, curInfl){
    var st=SITS[idx];
    return {
      demand: Math.max(1, Math.min(10, 5+st.dd)),
      supply: Math.max(1, Math.min(10, 5+st.dsup)),
      infl:   Math.round(((curInfl==null?1:curInfl)+st.di)*100)/100
    };
  }
  /* 인플레이션(물가) 카드는 중·고만 — 저학년은 용돈(di>0) 카드 제외 */
  function availSits(grade){
    var full=[0,1,2,3,4,5];
    return GRADES[grade].infl ? full : full.filter(function(i){ return SITS[i].di===0; });
  }

  /* ── 미션 (생각형 — 상황 깔고 「가격을 어떻게?」 3선택지) — v2 문구·정답 인덱스·해설 그대로 ──
     ★ a=[0,1,0,0] → 보기 셔플 필수(§6-2). 선택해야 판정 = 자동달성 없음(SPEC §1). */
  var CHOICES=['값을 올린다','값을 내린다','그대로 둔다'];
  var MTASK=[
    { sit:2, a:0, q:'🎉 축제라 손님이 북적여요! 사과는 그대로인데 사려는 사람이 많아요. 가격을 어떻게 할까요?',
      why:'손님이 물건보다 많으면 올려도 다 팔려요. 비싸게 팔수록 이익이 커져요!' },
    { sit:0, a:1, q:'☀️ 풍년이라 사과가 넘쳐요! 손님은 그대로인데 물건이 많아요. 가격을 어떻게 할까요?',
      why:'물건이 흔하면 값을 내려야 손님이 많이 사 가요. 안 그러면 사과가 남아요!' },
    { sit:1, a:0, q:'🌧️ 가뭄으로 사과가 귀해졌어요! 손님은 많은데 물건이 적어요. 가격을 어떻게 할까요?',
      why:'귀한 물건은 값이 올라가요. 적은 물건을 비싸게 팔면 이익이 커져요!' },
    { sit:5, a:0, q:'💰 마을에 용돈이 잔뜩 풀려 다들 지갑이 두둑해요! 가격을 어떻게 할까요?',
      why:'돈이 많이 풀리면 물가가 올라요. 올려도 손님이 척척 사 가죠 — 이게 인플레이션!' }
  ];
  function missionsFor(grade){ return MTASK.slice(0, GRADES[grade].missionN); }

  /* ── 퀴즈 (경제 어휘) — v2 문항·보기·정답(문자열) 그대로. ★ 셔플 필수(§6-3) ── */
  var QUIZ=[
    { q:'손님이 많아지고 물건은 그대로면, 가격은 어떻게 될까요?', a:'올라가요', ch:['올라가요','내려가요','그대로예요'] },
    { q:'물건이 흔해지고 손님은 그대로면, 가격은 어떻게 될까요?', a:'내려가요', ch:['내려가요','올라가요','그대로예요'] },
    { q:'흉년이 들어 물건이 귀해지면, 가격은 어떻게 될까요?',     a:'올라가요', ch:['올라가요','내려가요','그대로예요'] },
    { q:'마을에 돈이 아주 많이 풀리면, 물가는 어떻게 될까요?',     a:'올라가요', ch:['올라가요','내려가요','그대로예요'] },
    { q:'물건은 그대로인데 손님이 줄어들면, 가격은 어떻게 될까요?', a:'내려가요', ch:['내려가요','올라가요','그대로예요'] }
  ];
  /* 중학년 = 기본 3문(손님↑·물건↑·손님↓), 고학년 = 전체 5문(흉년·물가 포함) */
  function quizPool(grade){ return (grade==='mid') ? [0,1,4] : [0,1,2,3,4]; }
  function newQuizIdx(pool,used,rand){
    rand=rand||Math.random;
    if(used.length>=pool.length) used=[];
    var cand=[]; for(var i=0;i<pool.length;i++) if(used.indexOf(pool[i])<0) cand.push(pool[i]);
    var idx=cand[Math.floor(rand()*cand.length)];
    return { idx:idx, used:used.concat([idx]) };
  }
  function shuffleChoices(n,rand){
    rand=rand||Math.random;
    var a=[]; for(var i=0;i<n;i++)a.push(i);
    for(var k=a.length-1;k>0;k--){ var j=Math.floor(rand()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    return a;
  }

  /* ── 미리보기 문구(순수) — v2 paintPreview 판정 그대로 · {band, tip} ── */
  function priceBand(price,fair){
    if(price>fair*1.15) return 'high';   // 너무 비쌈 → 손님 발길 돌림
    if(price<fair*0.7)  return 'low';    // 너무 쌈 → 이익 얇음
    return 'ok';                         // 알맞음
  }
  function previewText(price,d,s,infl){
    var fair=fairPrice(d,s,infl);
    var w=Math.round(wantAt(price,d,s,infl)), sold=soldAt(price,d,s,infl), p=profitAt(price,d,s,infl);
    return { fair:fair, want:w, sold:sold, profit:p, band:priceBand(price,fair) };
  }

  /* ── 와우: 가격 역설(순수) — 적정가 vs 원가 근처(50원)의 이익 비교. §5-7 ── */
  var NEAR_COST=COST+PSTEP;             // 원가(40) 바로 위 = 50원
  function paradox(d,s,infl){
    var fair=fairPrice(d,s,infl);
    return {
      fairPrice:fair,  fairSold:soldAt(fair,d,s,infl),   fairProfit:profitAt(fair,d,s,infl),
      cheapPrice:NEAR_COST, cheapSold:soldAt(NEAR_COST,d,s,infl), cheapProfit:profitAt(NEAR_COST,d,s,infl),
      costProfit:profitAt(COST,d,s,infl)  // 원가에 팔면 = 0
    };
  }

  var API={ GRADES:GRADES, GRADE_LABEL:GRADE_LABEL, MODE_LABEL:MODE_LABEL,
            BASE:BASE, COST:COST, PMIN:PMIN, PMAX:PMAX, PSTEP:PSTEP, NEAR_COST:NEAR_COST,
            SITS:SITS, CHOICES:CHOICES,
            fairPrice:fairPrice, wantAt:wantAt, soldAt:soldAt, profitAt:profitAt,
            applySit:applySit, availSits:availSits,
            MTASK:MTASK, missionsFor:missionsFor, QUIZ:QUIZ, quizPool:quizPool,
            newQuizIdx:newQuizIdx, shuffleChoices:shuffleChoices,
            priceBand:priceBand, previewText:previewText, paradox:paradox };
  if(typeof window!=='undefined') window.MarketCore=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

<!-- ═══ 앱 ═══ -->
<script>
(function(){
  'use strict';
  if(typeof window==='undefined'||!window.MarketCore||!window.K3) return;
  var MC=window.MarketCore, K3=window.K3;
  var $=function(id){ return document.getElementById(id); };
  document.documentElement.style.setProperty('--noise','url("'+K3.NOISE+'")');

  var Q=new URLSearchParams(location.search);
  var grade=(['low','mid','high'].indexOf(Q.get('grade'))>=0)?Q.get('grade'):'high';
  var locked=!!Q.get('grade');
  function G(){ return MC.GRADES[grade]; }
  var mode=(G().modes.indexOf(Q.get('mode'))>=0)?Q.get('mode'):'free';

  /* §6-2·§6-3 — 모든 난수는 이 rand를 통과(퀴즈 뽑기·미션/퀴즈 보기 셔플). Math.random 직접 호출 0. */
  var rand=window.__K3_RAND || Math.random;

  /* ── 시장 상태 ── */
  var demand=5, supply=5, infl=1.0, price=100, coins=0, round=1;
  var sitIdx=null, last=null;
  /* 미션(생각형) */
  var mStep=0, mDone=false, mLock=false, mOrder=null;   // mOrder = 현재 단계 보기 셔플 순서
  /* 퀴즈 */
  var qIdx=0, qScore=0, qCount=0, qLock=false, qUsed=[], qOrder=null;
  /* 와우(가격 역설) */
  var magicShown=false, pred=null, revealing=false, wowData=null;

  var STEP_MS=window.__K3_FAST?60:2200;   // 미션 정답 후 다음 단계
  var QUIZ_MS=window.__K3_FAST?60:1500;
  var CARD_MS=window.__K3_FAST?60:850;
  var FLASH_MS=window.__K3_FAST?400:4200;
  var MAGIC_MS=window.__K3_FAST?400:7600;

  function snd(n){ K3.sound.play(n); }
  function curMissions(){ return MC.missionsFor(grade); }

  /* ── 무대 배너 (bodysys bs-flash 계보 · desk 직속 absolute) ── */
  function clearFlash(){ var d=$('desk'); if(!d)return; d.querySelectorAll('.mk-flash,.mk-flash-magic,.mk-nudge').forEach(function(n){ n.remove(); }); }
  function flash(cls,html,ms){
    var d=$('desk'); if(!d)return; clearFlash();
    var e=document.createElement('div'); e.className=cls; e.innerHTML=html; d.appendChild(e);
    if(ms) setTimeout(function(){ if(e.parentNode)e.parentNode.removeChild(e); }, ms);
  }

  /* ── 와우 재무장(§3) — 상황이 바뀌거나 새로 탐구를 시작하면 예측을 다시 물어봄 ── */
  function rearmWow(){ magicShown=false; pred=null; wowData=null; }

  /* ── 조작 ── */
  function drawSit(i){
    var r=MC.applySit(i, infl);
    demand=r.demand; supply=r.supply; infl=r.infl; sitIdx=i;
    price=MC.fairPrice(demand,supply,infl); last=null;
    rearmWow();
    snd('select');
    if(mode==='mission'){ render(); }
    else render();
  }
  function setPrice(p){
    p=Math.max(MC.PMIN, Math.min(MC.PMAX, Math.round(p/MC.PSTEP)*MC.PSTEP));
    if(p===price) return;
    price=p; snd('tick'); renderPreview();
  }
  function sell(){
    var sold=MC.soldAt(price,demand,supply,infl), p=MC.profitAt(price,demand,supply,infl);
    last={ sold:sold, profit:p, price:price, left:supply-sold };
    coins+=p;
    if(p>0){ snd('chime'); K3.toast('🪙 <b>'+p+'원</b> 벌었어요! (사과 '+sold+'개 팔림)'); }
    else if(p<0){ snd('fail'); K3.toast('앗, 원가보다 싸게 팔았어요…', true); }
    else { snd('fail'); K3.toast('한 개도 못 팔았거나 남는 게 없어요 😢', true); }
    render();
  }
  function nextCustomer(){
    round++; snd('pop');
    var pool=MC.availSits(grade);
    drawSit(pool[Math.floor(rand()*pool.length)]);
    K3.toast('새 손님이 왔어요! 👀');
  }

  /* ── 와우 (가격 역설) — 중·고 자유탐구 · 예측 카드 → 적정가 vs 원가근처 이익 나란히 ── */
  function wowOn(){ return G().showWow && mode==='free'; }
  function wow(){
    if(!wowOn()||revealing) return;
    /* 상황이 없으면(균형 5:5) 축제를 깔아 «가격 역설»이 또렷이 보이게 — SPEC 검증 수치(fair160·600 vs 50) */
    if(sitIdx===null){ drawSit(2); }
    revealing=true;
    if(!magicShown){
      magicShown=true; snd('charge');
      K3.cards.predict('사과가 잘 팔리게 <b>가격을 확 내리면</b> — 이익은 <b>더 커질까요</b>?',
        [{id:'more', label:'① 더 많이 팔리니 이익도 커져요'},
         {id:'less', label:'② 오히려 줄 수 있어요'}]
      ).then(function(id){
        pred=id;
        showParadox(function(){ revealing=false; });
      });
      return;
    }
    showParadox(function(){ revealing=false; });   // 이후 반복 = 결과 카드 다시 보기
  }
  function showParadox(done){
    var px=MC.paradox(demand,supply,infl);
    wowData=px;
    snd('whoosh');
    setTimeout(function(){
      var okP=(pred==='less');
      var moreUnits=(px.cheapSold>px.fairSold);
      var line = moreUnits
        ? '싸게 파니 <b>'+px.cheapSold+'개</b>로 더 많이 팔렸지만 — 남는 돈은 <b>'+px.cheapProfit+'원</b>뿐이에요.'
        : '사과는 <b>'+px.fairSold+'개</b>로 똑같이 다 팔렸는데 — 남는 돈만 <b>'+px.cheapProfit+'원</b>으로 확 줄었어요.';
      K3.cards.result(
        '<h3 style="color:'+(okP?'#c25e00':'#3f77d8')+'">'+(okP?'✨ 맞아요 — 싼 게 늘 이득은 아니에요!':'💰 싸게 팔면 이득일 것 같지만…')+'</h3>'
        +'<div style="display:flex;gap:10px;justify-content:center;margin:8px 0 4px;">'
        +'  <div style="background:#E6FCF5;border:2px solid #12B886;border-radius:12px;padding:9px 13px;min-width:120px;">'
        +'    <div style="font-size:12.5px;color:#0B7A5C;">적정가 '+px.fairPrice+'원</div>'
        +'    <div style="font-size:20px;font-weight:800;color:#0B7A5C;">🪙 '+px.fairProfit+'원</div>'
        +'    <div style="font-size:11.5px;color:#5a7894;">사과 '+px.fairSold+'개 팔림</div></div>'
        +'  <div style="background:#FFF0F0;border:2px solid #FA5252;border-radius:12px;padding:9px 13px;min-width:120px;">'
        +'    <div style="font-size:12.5px;color:#C92A2A;">확 싸게 '+px.cheapPrice+'원</div>'
        +'    <div style="font-size:20px;font-weight:800;color:#C92A2A;">🪙 '+px.cheapProfit+'원</div>'
        +'    <div style="font-size:11.5px;color:#5a7894;">사과 '+px.cheapSold+'개 팔림</div></div>'
        +'</div>'
        +'<p style="font-size:13px;line-height:1.7;color:#41546a;">'+line+'<br>'
        +'원가는 <b>'+MC.COST+'원</b> — 원가에 딱 맞춰 팔면 아무리 많이 팔아도 남는 건 <b>0원</b>이에요.<br>'
        +'<b>많이 파는 것</b>이 아니라 <b>«남는 것»</b>을 봐야 해요!</p>',
        [{label:'좋아, 계속 팔아 보기', cls:'pri', value:'done'}]
      );
      snd('chime');
      flash('mk-flash-magic','💰 싸다고 이득이 아니에요 — <b>남는 돈(이익)</b>을 봐야 해요!', MAGIC_MS);
      if(done) done();
    }, CARD_MS);
  }

  /* ── 미션 (생각형) — 상황 깔고 3선택지, 정답 클릭 시 다음 단계 ── */
  function seedMission(){
    if(mode!=='mission'||mDone) return;
    var M=curMissions();
    if(mStep>=M.length){ mStep=M.length-1; }
    var m=M[mStep];
    var r=MC.applySit(m.sit, 1.0);              // 미션은 물가 누적 없이 각 상황을 «깔기»만(진입 시드)
    demand=r.demand; supply=r.supply; infl=r.infl; sitIdx=m.sit;
    price=MC.fairPrice(demand,supply,infl);
    mOrder=MC.shuffleChoices(MC.CHOICES.length, rand);   // §6-2 보기 셔플
  }
  function answerMission(origIdx){
    if(mode!=='mission'||mDone||mLock) return;
    var M=curMissions(), m=M[mStep];
    if(origIdx!==m.a){ snd('fail'); K3.toast('🤔 다시 생각해 봐요', true); return; }
    mLock=true; snd('chime');
    K3.toast('🎉 정답! '+m.why);
    setTimeout(function(){
      mLock=false;
      if(mStep<M.length-1){ mStep++; seedMission(); }
      else mDone=true;
      build();
    }, STEP_MS);
  }

  /* ── 퀴즈 ── */
  function newQuiz(){
    var r=MC.newQuizIdx(MC.quizPool(grade), qUsed, rand);
    qIdx=r.idx; qUsed=r.used; qLock=false;
    qOrder=MC.shuffleChoices(MC.QUIZ[qIdx].ch.length, rand);   // §6-3 보기 셔플
  }
  function answer(v){
    if(qLock) return;
    qLock=true; qCount++;
    var q=MC.QUIZ[qIdx], okA=(v===q.a);
    if(okA){ qScore++; snd('chime'); K3.toast('🎉 정답! <b>'+q.a+'</b>'); }
    else { snd('fail'); K3.toast('🤔 정답은 <b>'+q.a+'</b>', true); }
    setTimeout(function(){ newQuiz(); build(); }, QUIZ_MS);
  }

  /* ── 모드/학년 전환 ── */
  function resetPlay(){
    demand=5; supply=5; infl=1.0; price=100; coins=0; round=1; sitIdx=null; last=null;
    mStep=0; mDone=false; mLock=false; mOrder=null;
    qIdx=0; qScore=0; qCount=0; qLock=false; qUsed=[]; qOrder=null;
    rearmWow();
  }
  function setGrade(g){
    if(g===grade) return;
    grade=g;
    if(G().modes.indexOf(mode)<0) mode='free';
    resetPlay();
    if(mode==='quiz') newQuiz(); else if(mode==='mission') seedMission();
    build();
  }
  function setMode(m){
    if(m===mode) return;
    mode=m; resetPlay();
    if(m==='quiz') newQuiz(); else if(m==='mission') seedMission();
    build();
  }

  /* ── 빌드 ── */
  function build(){
    /* 학년 세그 */
    var gs=$('gradeSeg');
    if(locked){ gs.style.display='none'; }
    else{
      gs.innerHTML=['low','mid','high'].map(function(g){
        return '<button data-g="'+g+'" class="'+(g===grade?'on':'')+'">'+MC.GRADE_LABEL[g]+'</button>';
      }).join('');
      gs.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){ setGrade(b.dataset.g); });
      });
    }
    /* 모드 세그 */
    var ms=$('modeSeg');
    ms.innerHTML=G().modes.map(function(m){
      return '<button data-m="'+m+'" class="'+(m===mode?'on':'')+'">'+MC.MODE_LABEL[m]+'</button>';
    }).join('');
    ms.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){ setMode(b.dataset.m); });
    });

    /* 바 */
    var bar=$('barSlot');
    if(mode==='mission'){
      var M=curMissions();
      if(mStep>=M.length) mStep=M.length-1;
      bar.innerHTML=mDone
        ? '<div class="k3bar done">🎉 미션을 모두 해냈어요! 자유탐구에서 마음껏 장사해 봐요.</div>'
        : '<div class="k3bar"><span>'+M[mStep].q+'</span><span class="prog">'+(mStep+1)+' / '+M.length+'</span></div>';
    } else if(mode==='quiz'){
      var q=MC.QUIZ[qIdx];
      bar.innerHTML='<div class="k3bar"><span>❓ '+q.q+'</span><span class="prog">점수 '+qScore+' / '+qCount+'</span></div>';
    } else bar.innerHTML='';

    /* 컨트롤 */
    var ct=$('ctrlSlot'); ct.innerHTML=''; var s='';
    if(mode==='quiz'){
      var qq=MC.QUIZ[qIdx];
      if(!qOrder) qOrder=MC.shuffleChoices(qq.ch.length, rand);
      s=qOrder.map(function(i){ return '<button class="ck-choice" data-v="'+qq.ch[i]+'">'+qq.ch[i]+'</button>'; }).join('');
    } else if(mode==='mission'){
      var mm=curMissions()[mStep];
      if(!mDone){
        if(!mOrder) mOrder=MC.shuffleChoices(MC.CHOICES.length, rand);
        s=mOrder.map(function(i){ return '<button class="ck-choice" data-mv="'+i+'">'+MC.CHOICES[i]+'</button>'; }).join('');
      }
    } else {
      /* 자유탐구: 상황 카드 뽑기 (물가 카드는 학년칸 게이팅) */
      MC.availSits(grade).forEach(function(i){
        s+='<button class="mk-sit" data-sit="'+i+'">'+MC.SITS[i].ic+' '+MC.SITS[i].t+'</button>';
      });
      if(wowOn()) s+='<button class="mk-wow" data-wow="1">🔮 싸게 팔면 이득일까?</button>';
    }
    ct.innerHTML=s;
    ct.querySelectorAll('.mk-sit').forEach(function(b){ b.addEventListener('click',function(){ drawSit(+b.dataset.sit); }); });
    ct.querySelectorAll('.mk-wow').forEach(function(b){ b.addEventListener('click',function(){ wow(); }); });
    ct.querySelectorAll('.ck-choice[data-v]').forEach(function(b){ b.addEventListener('click',function(){ answer(b.dataset.v); }); });
    ct.querySelectorAll('.ck-choice[data-mv]').forEach(function(b){ b.addEventListener('click',function(){ answerMission(+b.dataset.mv); }); });

    render();
  }

  /* ═══ 무대 — 과일 가게 좌판 (viewBox 820x380) ═══ */
  var VBW=820, VBH=380;
  function svgEl(t,a){ var e=document.createElementNS('http://www.w3.org/2000/svg',t); for(var k in a)e.setAttribute(k,a[k]); return e; }
  function txt(svg,x,y,s,sz,f,an){ var t=svgEl('text',{x:x,y:y,'text-anchor':an||'middle','font-family':'Gowun Dodum,sans-serif','font-size':sz,'font-weight':800,fill:f}); t.textContent=s; svg.appendChild(t); }
  function emo(svg,x,y,ch,sz){ var t=svgEl('text',{x:x,y:y,'text-anchor':'middle','font-size':sz}); t.textContent=ch; svg.appendChild(t); }

  function render(){
    var desk=$('desk'); if(!desk) return;
    /* desk 안의 배너는 유지, svg만 교체 */
    var old=desk.querySelector('svg.mk-stage'); if(old) old.remove();

    var svg=svgEl('svg',{'class':'mk-stage',viewBox:'0 0 '+VBW+' '+VBH,width:'min(760px,94vw)',height:'auto'});
    svg.style.display='block';

    if(mode==='quiz'){
      emo(svg, VBW/2-130, 210, '👥', 82); emo(svg, VBW/2+130, 210, '🍎', 82);
      txt(svg, VBW/2, 120, '손님과 사과를 떠올려 봐요', 25, '#FFE1A6');
      txt(svg, VBW/2, 310, '많아지면? 적어지면? 가격은 어떻게 움직일까요?', 20, '#E7C79A');
      desk.appendChild(svg); return;
    }

    /* 좌판 나무 판 */
    svg.appendChild(svgEl('rect',{x:34,y:252,width:VBW-68,height:26,rx:8,fill:'#C98A3C'}));
    svg.appendChild(svgEl('rect',{x:34,y:278,width:VBW-68,height:58,rx:6,fill:'#9c621f'}));

    /* 상황 카드 배너 */
    if(sitIdx!==null){
      var st=MC.SITS[sitIdx];
      svg.appendChild(svgEl('rect',{x:34,y:14,width:VBW-68,height:54,rx:14,fill:'#FFF4D6',stroke:'#F0B24A','stroke-width':3}));
      emo(svg, 72, 54, st.ic, 32);
      txt(svg, 104, 40, st.t, 21, '#B25E00', 'start');
      txt(svg, 104, 60, st.why, 15.5, '#9A7B3A', 'start');
    } else {
      txt(svg, VBW/2, 44, '🍎 사과 가게에 오신 걸 환영해요! 상황 카드를 뽑아 시작해요', 19, '#FFE1A6');
    }

    /* 손님(수요) — 왼쪽 */
    txt(svg, 150, 100, '손님 (사려는 사람)', 18, '#8CC0FF');
    for(var i=0;i<demand;i++) emo(svg, 74+(i%5)*36, 150+Math.floor(i/5)*44, '🧑', 30);
    txt(svg, 150, 240, '수요 '+demand, 22, '#8CC0FF');

    /* 사과(공급) — 오른쪽 */
    txt(svg, VBW-150, 100, '사과 (파는 물건)', 18, '#FFB08A');
    for(var j=0;j<supply;j++) emo(svg, VBW-224+(j%5)*36, 150+Math.floor(j/5)*44, '🍎', 30);
    txt(svg, VBW-150, 240, '공급 '+supply, 22, '#FFB08A');

    if(mode==='free'){
      /* 가운데 가격표 + 물가 배지 + 동전 */
      svg.appendChild(svgEl('rect',{x:VBW/2-96,y:96,width:192,height:92,rx:16,fill:'#0f2036',stroke:'#12B886','stroke-width':3}));
      txt(svg, VBW/2, 124, '내 가격', 17, '#8EE3C6');
      txt(svg, VBW/2, 166, price+'원', 36, '#B2F2BB');
      if(G().infl && infl>1.001){
        svg.appendChild(svgEl('rect',{x:VBW/2-66,y:196,width:132,height:28,rx:12,fill:'#3a1e28',stroke:'#E64980','stroke-width':2}));
        txt(svg, VBW/2, 216, '🎈 물가 ×'+infl.toFixed(2), 15.5, '#FF9Fc0');
      }
      txt(svg, VBW/2, 302, '🪙 모은 돈', 16, '#E7C77A');
      txt(svg, VBW/2, 328, coins+'원', 24, '#FFD98A');
    } else {
      /* 미션: 가운데 판단 안내 */
      emo(svg, VBW/2, 178, '🤔', 58);
      txt(svg, VBW/2, 316, '손님과 사과를 보고 가격을 어떻게 할지 골라요', 17, '#E7C79A');
    }

    desk.appendChild(svg);
    if(mode==='free') renderPreview();
  }

  /* 슬라이더 + 미리보기 = 상태줄에 (자유탐구만) */
  function renderPreview(){
    var sr=$('statusRow'); if(!sr) return;
    if(mode!=='free'){ sr.innerHTML=''; return; }
    var pv=MC.previewText(price,demand,supply,infl);
    var fp=((pv.fair-MC.PMIN)/(MC.PMAX-MC.PMIN))*100;
    var lo=((Math.max(MC.PMIN,pv.fair*0.7)-MC.PMIN)/(MC.PMAX-MC.PMIN))*100;
    var hi=((Math.min(MC.PMAX,pv.fair*1.15)-MC.PMIN)/(MC.PMAX-MC.PMIN))*100;
    var tip = pv.band==='high' ? '<span style="color:#FF8787;">너무 비싸요! 손님이 발길을 돌려요</span>'
            : pv.band==='low'  ? '<span style="color:#FFC078;">너무 싸요! 다 팔려도 남는 게 얇아요</span>'
            :                    '<span style="color:#8EE3C6;">알맞은 가격이에요! 👍</span>';
    sr.innerHTML=
      '<div class="mk-pricebox">'
      +'  <div class="mk-plabel">💲 가격을 정해요 — <b>'+price+'원</b></div>'
      +'  <div class="mk-track" style="background:linear-gradient(90deg,#7a5a10 0%,#7a5a10 '+lo+'%,#124a34 '+lo+'%,#124a34 '+hi+'%,#4a1520 '+hi+'%,#4a1520 100%)">'
      +'    <div class="mk-tri" style="left:'+fp+'%">▼적정 '+pv.fair+'</div></div>'
      +'  <input class="mk-range" id="mkPrice" type="range" min="'+MC.PMIN+'" max="'+MC.PMAX+'" step="'+MC.PSTEP+'" value="'+price+'">'
      +'  <div class="mk-preview">사려는 손님 약 <b>'+pv.want+'명</b> · 팔릴 사과 <b>'+pv.sold+'개</b> · 예상 이익 '
      +'    <b style="color:'+(pv.profit>0?'#8EE3C6':'#FF8787')+'">'+pv.profit+'원</b><br>'+tip+'</div>'
      +'  <div style="text-align:center;margin-top:9px;display:flex;gap:8px;justify-content:center;">'
      +'    <button class="ck-btn" id="mkSell" style="--c1:#12B886;--c2:#0B7A5C">🛒 팔기!</button>'
      +'    <button class="ck-btn" id="mkNext" style="--c1:#5a6675;--c2:#3d4653">다음 손님 ▶</button>'
      +'  </div>'
      +'</div>';
    var pr=$('mkPrice'); if(pr) pr.addEventListener('input',function(){ setPrice(+pr.value); });
    var sb=$('mkSell'); if(sb) sb.addEventListener('click',sell);
    var nb=$('mkNext'); if(nb) nb.addEventListener('click',nextCustomer);
  }

  /* ── 사운드 토글 ── */
  $('sndBtn').addEventListener('click',function(){
    K3.sound.setOn(!K3.sound.on);
    this.textContent=K3.sound.on?'🔊':'🔇';
    this.classList.toggle('off',!K3.sound.on);
    if(K3.sound.on)snd('select');
  });

  /* ── 부트 ── */
  if(mode==='quiz') newQuiz();
  else if(mode==='mission') seedMission();
  build();

  window.MarketApp={
    get grade(){return grade;}, get mode(){return mode;},
    get demand(){return demand;}, get supply(){return supply;}, get infl(){return infl;},
    get price(){return price;}, get coins(){return coins;}, get round(){return round;},
    get sit(){return sitIdx;}, get last(){return last;},
    get mStep(){return mStep;}, get mDone(){return mDone;}, get mOrder(){return mOrder&&mOrder.slice();},
    get qIdx(){return qIdx;}, get quiz(){return MC.QUIZ[qIdx];},
    get qScore(){return qScore;}, get qCount(){return qCount;}, get qOrder(){return qOrder&&qOrder.slice();},
    get magicShown(){return magicShown;}, get pred(){return pred;}, get wowData(){return wowData;},
    get rand(){return rand;}, set rand(fn){rand=fn;},
    setGrade:setGrade, setMode:setMode, drawSit:drawSit, setPrice:setPrice,
    sell:sell, nextCustomer:nextCustomer, wow:wow,
    answer:answer, answerMission:answerMission, build:build
  };
})();
</script>
<script src="/kedu_back.js"></script>
</body>

<!--
  케이랩 v3 · B트랙 양산 7호 — 규칙·패턴 (2026-07-13) · 셸 = clock 계보
  SPEC = handoff/klab/designs3/SPEC_pattern.md (도면=정답)
  v2(engine/tools/pattern.js 264줄) 콘텐츠 무손실 이식:
    학년칸(저 2색·반복 마디 띠 닻·✨/퀴즈 숨김 / 중 3색·퀴즈 / 고 4색·미션 4)
    미션 저3·중3·고4 · 퀴즈(다음 색 맞히기) · 상태줄 5형
  ★ 이 도구의 심장 = 와우 「✨ 100번째는?」 일반항 점프 —
    「끝까지 세지 않아도 규칙이면 안다」는 대수적 사고의 첫 씨앗. 이 순간을 흐리게 만들지 않는다.
  v3 질감: 다크 스튜디오 + 원목 매트, 도색된 나무 블록 띠(유광 페인트 + 나뭇결 + 흰 테=블록 틈).
  와우:
    ② 생성 팝 — ▶로 만든 칸이 위에서 «척» 떨어짐
    ④ 일반항 점프(핵심) — ⋯ 세 점이 «차례로» 찍히며 세기를 건너뛰고,
       100번째 칸이 «먼 곳에서 날아와 착지»(0.5s·whoosh) + 주황 테 + 무한 반짝임 + 플래시
       + chime. **1회 가드 없음이 의도된 설계**(코어를 바꿔 가며 몇 번이고 다시 본다)
    ⑤ 🔮 예측 카드(v3 신설·중고·1회) — ✨ 를 처음 누를 때 「100번째 색은? 세지 말고 규칙으로」
  ⚠️ v2 라이브 버그 2건 수정:
    ① 학년 사다리 «누수» — palCount()가 config.colors가 있으면 그 길이를 그대로 썼다.
       차시에서 colors:[4색]을 넘기면 «저학년인데 팔레트 4색»이 나와 「두 색 반복」 사다리가 무너진다.
       (구판 41종 pattern에도 살아 있음) → 커스텀 색상표는 존중하되 «개수는 학년칸이 상한».
    ② v2가 부르던 «success» 효과음은 목록에 없는 이름이었다(목록: tick/tap/select/pop/ting/whoosh/charge/chime/fail).
       조용히 무시되어 점프의 성취감이 소리로 완성되지 않았다 → chime으로 매핑.
  config: ?grade= & mode= & colors=(쉼표) & preset=(쉼표 인덱스)
-->

<!-- ═══ 순수 로직 (node/jsdom 테스트 대상 · DOM 무의존) ═══ -->
<script>
(function(){
  'use strict';
  var DEF=['#E64980','#1565C0','#F59F00','#0CA678'];      /* 빨강·파랑·노랑·초록 */
  var NAME=['빨강','파랑','노랑','초록','보라','주황'];
  var GRADES={
    low:  { modes:['free','mission'],        palN:2, bandHint:true  },
    mid:  { modes:['free','mission','quiz'], palN:3, bandHint:false },
    high: { modes:['free','mission','quiz'], palN:4, bandHint:false }
  };
  var GRADE_LABEL={ low:'저학년', mid:'중학년', high:'고학년' };
  var MODE_LABEL={ free:'자유탐구', mission:'미션', quiz:'퀴즈' };

  /* ★ v2 버그① 수정 — 학년 사다리 누수.
     v2: (config.colors && config.colors.length) ? config.colors.length : min(DEF.length, palN)
     → 차시가 colors:[4색]을 넘기면 저학년인데 팔레트가 4색이 되어 「두 색 반복」 사다리가 무너졌다.
     v3: 커스텀 색상표는 존중하되 «개수는 학년칸이 상한». */
  function palCountFor(grade,configColors){
    var pool=(configColors&&configColors.length)?configColors:DEF;
    return Math.min(pool.length, GRADES[grade].palN);
  }

  /* 최소 반복 주기 — L ≤ floor(len/2)만 검사(3칸 [A,B,C]가 0인 건 정의) */
  function findCoreOf(s){
    for(var L=1;L<=Math.floor(s.length/2);L++){
      var ok=true;
      for(var i=L;i<s.length;i++){ if(s[i]!==s[i%L]){ ok=false; break; } }
      if(ok) return L;
    }
    return 0;
  }
  function distinct(s){ var set={},n=0; for(var i=0;i<s.length;i++) if(!set[s[i]]){ set[s[i]]=1; n++; } return n; }
  function nextColor(s,core){ return (core>0)?s[s.length%core]:null; }
  function nth(s,core,n){ return (core>0)?s[(n-1)%core]:null; }   /* 1-시작 인덱싱 */

  /* 미션 — v2 텍스트·판정식 무손실. check(state, act) */
  var LOW_MISSIONS=[
    { text:'<b>두 가지 색</b>을 번갈아 <b>6칸</b> 만들어 봐요! (예: 빨강-파랑-빨강-파랑…)',
      check:function(s,act){ var c=findCoreOf(s.seq); return s.seq.length>=6&&c>0&&c<=2&&distinct(s.seq)===2; } },
    { text:'<b>🔍 규칙 찾기</b>를 눌러 — 어디까지가 한 묶음이고 다음 색이 뭔지 봐요!',
      check:function(s,act){ return act==='rule'&&s.showRule&&findCoreOf(s.seq)>0; } },
    { text:'두 가지 색 반복을 <b>8칸</b>까지 길게 이어 봐요!',
      check:function(s,act){ var c=findCoreOf(s.seq); return s.seq.length>=8&&c>0&&c<=2&&distinct(s.seq)===2; } }
  ];
  var MID_MISSIONS=[
    { text:'<b>두 가지 색</b>이 반복되는 패턴을 <b>6칸 이상</b> 만들어 봐요!',
      check:function(s,act){ var c=findCoreOf(s.seq); return s.seq.length>=6&&c>0&&c<=2&&distinct(s.seq)===2; } },
    { text:'이번엔 <b>세 가지 색</b>이 반복되는 패턴을 <b>6칸 이상</b>!',
      check:function(s,act){ var c=findCoreOf(s.seq); return s.seq.length>=6&&c===3&&distinct(s.seq)===3; } },
    { text:'<b>🔍 규칙 찾기</b>를 눌러 케이가 찾은 규칙과 "다음" 색을 확인해 봐요!',
      check:function(s,act){ return act==='rule'&&s.showRule&&findCoreOf(s.seq)>0; } }
  ];
  var HIGH_MISSIONS=MID_MISSIONS.concat([
    { text:'자유 도전! 규칙 단위가 <b>4칸</b>인 패턴을 <b>8칸 이상</b> 만들어 봐요!',
      check:function(s,act){ var c=findCoreOf(s.seq); return s.seq.length>=8&&c===4; } }
  ]);
  function missionsFor(grade,colorCount){
    var pool=(grade==='low')?LOW_MISSIONS:(grade==='mid')?MID_MISSIONS:HIGH_MISSIONS;
    var f=pool.filter(function(m){ return /세 가지 색/.test(m.text) ? colorCount>=3 : true; });
    return f.length?f:pool.slice(0,1);
  }

  /* 퀴즈 — v2 로직 그대로, rand 주입 */
  function newQuiz(colorCount,rand){
    rand=rand||Math.random;
    var coreLen=2+Math.floor(rand()*2);            /* 2~3 */
    var core=[], guard=0;
    while(core.length<coreLen&&guard++<200){
      var c=Math.floor(rand()*Math.min(colorCount,4));
      if(core.length===0||core[core.length-1]!==c) core.push(c);   /* 인접 중복만 금지 */
    }
    while(core.length<coreLen) core.push((core[core.length-1]+1)%Math.min(colorCount,4));
    var shows=coreLen*2+1+Math.floor(rand()*coreLen);
    var qSeq=[]; for(var i=0;i<shows;i++) qSeq.push(core[i%coreLen]);
    return { qSeq:qSeq };
  }
  function qAnswerOf(qSeq){ var c=findCoreOf(qSeq); return qSeq[qSeq.length%c]; }
  function quizChoicesOf(colorCount){
    var n=Math.min(colorCount,4), out=[];
    for(var i=0;i<n;i++) out.push(i);
    return out;
  }

  var API={ DEF:DEF, NAME:NAME, GRADES:GRADES, GRADE_LABEL:GRADE_LABEL, MODE_LABEL:MODE_LABEL,
            palCountFor:palCountFor, findCoreOf:findCoreOf, distinct:distinct,
            nextColor:nextColor, nth:nth,
            LOW_MISSIONS:LOW_MISSIONS, MID_MISSIONS:MID_MISSIONS, HIGH_MISSIONS:HIGH_MISSIONS,
            missionsFor:missionsFor, newQuiz:newQuiz, qAnswerOf:qAnswerOf, quizChoicesOf:quizChoicesOf };
  if(typeof window!=='undefined') window.PatCore=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

<!-- ═══ 앱 ═══ -->
<script>
(function(){
  'use strict';
  var PC=window.PatCore, K3=window.K3;
  var $=function(id){ return document.getElementById(id); };
  document.documentElement.style.setProperty('--noise','url("'+K3.NOISE+'")');

  var Q=new URLSearchParams(location.search);
  var grade=(['low','mid','high'].indexOf(Q.get('grade'))>=0)?Q.get('grade'):'high';
  var locked=!!Q.get('grade');
  function G(){ return PC.GRADES[grade]; }
  var cfgColors=Q.get('colors')?Q.get('colors').split(',').filter(Boolean):null;
  var allColors=(cfgColors&&cfgColors.length)?cfgColors:PC.DEF;
  var cfgPreset=Q.get('preset')?Q.get('preset').split(',').map(Number).filter(function(n){return !isNaN(n);}):[];

  var colors=allColors.slice(0,PC.palCountFor(grade,cfgColors));
  var seq=cfgPreset.filter(function(i){ return i<colors.length; });
  var showRule=false, jump100=null;
  var mode=(G().modes.indexOf(Q.get('mode'))>=0)?Q.get('mode'):'free';
  var mStep=0, mDone=false, mLock=false;
  var qSeq=[], qScore=0, qCount=0, qLock=false;
  var magicShown=false, pred=null, revealing=false;
  var fxGen=false, fxMagic=false;      /* 1회성 연출 플래그 */
  var STEP_MS=window.__K3_FAST?60:1500;

  function snd(n){ K3.sound.play(n); }
  function state(){ return { seq:seq, showRule:showRule, jump100:jump100 }; }
  function curMissions(){ return PC.missionsFor(grade,colors.length); }
  function core(){ return PC.findCoreOf(seq); }
  function nameOf(i){ return PC.NAME[i]||('색'+(i+1)); }
  function loadQuiz(){ qSeq=PC.newQuiz(colors.length).qSeq; qLock=false; }

  /* ── 조작 ── */
  function pushColor(i){
    if(revealing) return;
    seq.push(i); showRule=false; jump100=null; snd('tap');
    render(); checkMission();
  }
  function doJump(){
    var c=core();
    showRule=true;
    jump100=PC.nth(seq,c,100);
    snd('whoosh');
    fxMagic=true;
    render();
    setTimeout(function(){ snd('chime'); }, window.__K3_FAST?20:520);   /* ★ v2의 없는 사운드 success → chime */
  }
  var H={
    rule:function(){
      if(revealing) return;
      showRule=!showRule; jump100=null;
      if(showRule&&core()>0) snd('select');
      render(); checkMission('rule');
    },
    next:function(){
      if(revealing) return;
      var c=core();
      if(c<=0){ snd('fail'); warn('먼저 색을 눌러 반복되는 규칙을 만들어요 (예: 빨강-파랑-빨강-파랑)'); return; }
      showRule=true; jump100=null;
      seq.push(seq[seq.length%c]);
      snd('pop'); fxGen=true;
      render(); checkMission();
    },
    jump:function(){
      if(revealing) return;
      var c=core();
      if(c<=0){ snd('fail'); warn('먼저 색을 눌러 반복되는 규칙을 만들어요 — 그럼 100번째도 규칙으로 알 수 있어요!'); return; }
      /* 🔮 예측 — 세지 말고 «규칙으로» 생각해 보게 한다(중·고 · 1회) */
      if(!magicShown&&grade!=='low'&&mode==='free'){
        magicShown=true; revealing=true;
        snd('charge');
        K3.cards.predict('<b>100번째</b> 색은 무엇일까요? 세지 말고 <b>규칙</b>으로 생각해 봐요.',
          colors.map(function(c2,i){
            return { id:String(i),
              label:'<span style="display:inline-block;width:22px;height:22px;border-radius:6px;'
                +'background:'+c2+';vertical-align:middle;margin-right:7px;border:2px solid #fff"></span>'+nameOf(i) };
          })
        ).then(function(id){
          pred=+id; revealing=false;
          doJump();
          setTimeout(function(){
            var okP=(pred===jump100);
            K3.cards.result(
              '<h3 style="color:'+(okP?'#0d7a5c':'#B9522F')+'">'+(okP?'✨ 맞혔어요!':'🤔 규칙으로 나눠 보면…')+'</h3>'
              +'<p style="font-size:13.5px;line-height:1.75;color:#41546a">'
              +'규칙 단위가 <b>'+c+'개</b>니까, 100번째는 <b>(100−1) ÷ '+c+'</b>의 나머지 자리 — '
              +'곧 <b>'+nameOf(jump100)+'</b>이에요.<br>'
              +(okP?'규칙만 알면 <b>100번째든 1000번째든</b> 세지 않고 바로 알 수 있어요.'
                   :'하나하나 세지 않아도 돼요. <b>규칙</b>이 100번째를 대신 알려 줘요.')
              +'</p>',
              [{label:'좋아, 계속 탐구', cls:'pri', value:'done'}]
            );
          }, window.__K3_FAST?60:1200);
        });
        return;
      }
      doJump();
    },
    back:function(){
      if(revealing) return;
      seq.pop(); showRule=false; jump100=null; snd('tap');
      render(); checkMission();
    },
    reset:function(){
      if(revealing) return;
      seq=[]; showRule=false; jump100=null;
      magicShown=false; pred=null;    /* 🔮 재무장 */
      snd('select');
      render();
    }
  };
  function warn(msg){
    $('statusRow').innerHTML='<div class="hint"><span class="grabline">'+msg+'</span></div>';
  }
  function answer(v){
    if(qLock) return;
    qLock=true; qCount++;
    var ans=PC.qAnswerOf(qSeq), okA=(+v===ans);
    if(okA){ qScore++; snd('chime'); K3.toast('🎉 정답! <b>'+nameOf(ans)+'</b>'); }
    else { snd('fail'); K3.toast('🤔 정답은 <b>'+nameOf(ans)+'</b>!', true); }
    setTimeout(function(){ loadQuiz(); qLock=false; build(); }, STEP_MS);
  }

  /* ── 빌드 ── */
  function build(){
    var gs=$('gradeSeg');
    if(locked){ gs.style.display='none'; }
    else{
      gs.innerHTML=['low','mid','high'].map(function(g){
        return '<button data-g="'+g+'" class="'+(g===grade?'on':'')+'">'+PC.GRADE_LABEL[g]+'</button>';
      }).join('');
      gs.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){ if(b.dataset.g!==grade) setGrade(b.dataset.g); });
      });
    }
    var ms=$('modeSeg');
    ms.innerHTML=G().modes.map(function(m){
      return '<button data-m="'+m+'" class="'+(m===mode?'on':'')+'">'+PC.MODE_LABEL[m]+'</button>';
    }).join('');
    ms.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){ if(b.dataset.m!==mode) setMode(b.dataset.m); });
    });

    var bar=$('barSlot');
    if(mode==='mission'){
      var M=curMissions();
      bar.innerHTML=mDone
        ? '<div class="k3bar done">🎉 미션을 모두 해냈어요! 자유탐구에서 마음껏 패턴을 만들어 봐요.</div>'
        : '<div class="k3bar"><span>'+M[mStep].text+'</span><span class="prog">'+(mStep+1)+' / '+M.length+'</span></div>';
    } else if(mode==='quiz'){
      bar.innerHTML='<div class="k3bar"><span>❓ 다음에 올 색은 무엇일까요?</span><span class="prog">점수 '+qScore+' / '+qCount+'</span></div>';
    } else bar.innerHTML='';

    var ct=$('ctrlSlot'), s='';
    if(mode==='quiz'){
      s=PC.quizChoicesOf(colors.length).map(function(i){
        return '<button class="ck-choice" data-v="'+i+'">'
          +'<span style="display:inline-block;width:32px;height:32px;border-radius:9px;background:'+colors[i]
          +';vertical-align:middle;border:2px solid #fff"></span></button>';
      }).join('');
    } else {
      s='<span class="ctrl-lab">색 고르기</span>'
       +colors.map(function(c,i){
          return '<button class="pt-pal" data-i="'+i+'" style="background:'+c+'"></button>';
        }).join('')
       +'<button class="ck-btn" data-act="rule" style="--c1:#8a67ee;--c2:#6d43d8">🔍 규칙 찾기</button>'
       +'<button class="ck-btn" data-act="next" style="--c1:#3EE6B0;--c2:#1F9E75">다음 ▶</button>'
       +(grade!=='low'?'<button class="ck-btn" data-act="jump" style="--c1:#FFA75E;--c2:#D97B33">✨ 100번째는?</button>':'')
       +'<button class="ck-btn minus" data-act="back" style="--c1:#5B9BF0">← 하나 지우기</button>'
       +'<button class="ck-btn ghost" data-act="reset">↺ 비우기</button>';
    }
    ct.innerHTML=s;
    ct.querySelectorAll('.pt-pal').forEach(function(b){
      b.addEventListener('click',function(){ pushColor(+b.dataset.i); });
    });
    ct.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click',function(){ var f=H[b.dataset.act]; if(f)f(); });
    });
    ct.querySelectorAll('.ck-choice').forEach(function(b){
      b.addEventListener('click',function(){ answer(b.dataset.v); });
    });

    render();
  }
  function setGrade(g){
    grade=g; snd('select');
    colors=allColors.slice(0,PC.palCountFor(grade,cfgColors));
    if(G().modes.indexOf(mode)<0) mode='free';
    seq=seq.filter(function(i){ return i<colors.length; });   /* 새 팔레트에 없는 색 제거 */
    mStep=0; mDone=false; mLock=false; showRule=false; jump100=null;
    magicShown=false; pred=null; revealing=false;
    if(mode==='quiz') { qScore=0; qCount=0; loadQuiz(); }
    build();
  }
  function setMode(m){
    mode=m; snd('select');
    mStep=0; mDone=false; mLock=false;
    seq=[]; showRule=false; jump100=null;
    magicShown=false; pred=null; revealing=false;
    if(m==='quiz'){ qScore=0; qCount=0; loadQuiz(); }
    build();
  }

  /* ═══ 무대 — 도색 나무 블록 띠 ═══ */
  var VBW=880, VBH=300;
  function svgEl(t,a){ var e=document.createElementNS('http://www.w3.org/2000/svg',t); for(var k in a)e.setAttribute(k,a[k]); return e; }
  function txt(svg,x,y,s,size,fill,cls){
    var t=svgEl('text',{ x:x, y:y, 'text-anchor':'middle',
      'font-family':'var(--kedu-title)', 'font-size':size, 'font-weight':800, fill:fill });
    if(cls) t.setAttribute('class',cls);
    t.textContent=s; svg.appendChild(t); return t;
  }

  function render(){
    var desk=$('desk');
    var gen=fxGen, magic=fxMagic; fxGen=false; fxMagic=false;   /* 1회성 스냅샷 */
    var isQuiz=(mode==='quiz');
    var S=isQuiz?qSeq:seq;

    var svg=svgEl('svg',{ viewBox:'0 0 '+VBW+' '+VBH, id:'ptSvg',
      style:'display:block;width:min(92vw,840px);height:auto;max-height:44vh' });
    var d=svgEl('defs',{});
    d.innerHTML=
      '<filter id="ptSh" x="-20%" y="-20%" width="140%" height="140%">'
      +'<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>'
      +'<pattern id="ptGrain" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(92)">'
      +'<rect width="8" height="8" fill="none"/><rect width="1.6" height="8" fill="rgba(0,0,0,0.09)"/></pattern>'
      +'<linearGradient id="ptGloss" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="rgba(255,255,255,0.42)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>';
    svg.appendChild(d);

    var jShow=(!isQuiz && jump100!=null);
    var c=isQuiz?0:(showRule?PC.findCoreOf(S):0);
    var nextIdx=PC.nextColor(S,c);
    var showNext=(!isQuiz&&showRule&&c>0&&!jShow);   /* 점프 중엔 작은 「다음!」 숨김(헤드라인 = 100번째) */
    var qMark=isQuiz;
    var total=S.length+(jShow?2:((showNext||qMark)?1:0));
    var size=Math.min(72,(VBW-60)/Math.max(total,1)-12), gap=12;
    var rowW=total*(size+gap)-gap, x0=(VBW-rowW)/2, y=VBH/2-size/2;

    /* ★ 저학년 닻 — 반복 마디 교차 배경 띠 */
    if(G().bandHint&&c>0&&S.length>=c){
      for(var mB=0; mB*c<S.length; mB++){
        if(mB%2===1) continue;
        var bs=mB*c, be=Math.min(bs+c,S.length);
        var bxL=x0+bs*(size+gap)-6, bxR=x0+(be-1)*(size+gap)+size+6;
        svg.appendChild(svgEl('rect',{ x:bxL, y:y-14, width:bxR-bxL, height:size+28, rx:16,
          fill:'#9B7BF5', 'fill-opacity':0.16, class:'pt-band' }));
      }
    }
    /* 블록 */
    for(var i=0;i<S.length;i++){
      var bx=x0+i*(size+gap);
      if(c>0&&i<c){
        svg.appendChild(svgEl('rect',{ x:bx-5, y:y-5, width:size+10, height:size+10, rx:14,
          fill:'none', stroke:'#BCA7FF', 'stroke-width':4, 'stroke-dasharray':'8 5', class:'pt-rule' }));
      }
      var g=svgEl('g',{ class:'pt-cell'+((gen&&i===S.length-1)?' pt-pop':'') });
      g.appendChild(svgEl('rect',{ x:bx, y:y, width:size, height:size, rx:12,
        fill:colors[S[i]], stroke:'#fff', 'stroke-width':4, filter:'url(#ptSh)',
        class:'pt-block', 'data-i':i, 'data-ci':S[i] }));
      g.appendChild(svgEl('rect',{ x:bx, y:y, width:size, height:size, rx:12,
        fill:'url(#ptGrain)', 'pointer-events':'none' }));
      g.appendChild(svgEl('rect',{ x:bx+6, y:y+5, width:size-12, height:size*0.26, rx:6,
        fill:'url(#ptGloss)', 'pointer-events':'none' }));
      svg.appendChild(g);
    }
    if(c>0) txt(svg,x0+(c*(size+gap)-gap)/2,y-18,(G().bandHint?'반복 마디':'규칙'),20,'#BCA7FF','pt-rulelab');

    if(showNext){
      var bx2=x0+S.length*(size+gap);
      svg.appendChild(svgEl('rect',{ x:bx2, y:y, width:size, height:size, rx:12,
        fill:colors[nextIdx], stroke:'#BCA7FF', 'stroke-width':4, 'stroke-dasharray':'7 5',
        filter:'url(#ptSh)', class:'pt-next' }));
      txt(svg,bx2+size/2,y-18,'다음!',22,'#BCA7FF');
    }
    if(qMark){
      var bx3=x0+S.length*(size+gap);
      svg.appendChild(svgEl('rect',{ x:bx3, y:y, width:size, height:size, rx:12,
        fill:'rgba(255,255,255,0.08)', stroke:'#FFA75E', 'stroke-width':4, 'stroke-dasharray':'7 5',
        filter:'url(#ptSh)', class:'pt-qmark' }));
      txt(svg,bx3+size/2,y+size/2+14,'?',40,'#FFA75E');
    }
    if(S.length===0) txt(svg,VBW/2,VBH/2,'색을 눌러 패턴을 만들어 보세요',24,'#7d8fa3');

    /* ★★ 와우④ — 일반항 점프: ⋯ 로 세기를 건너뛰고, 100번째가 날아와 착지 */
    if(jShow){
      var exX=x0+S.length*(size+gap)+size/2;
      for(var dd=0;dd<3;dd++){
        var dot=svgEl('circle',{ cx:exX+(dd-1)*13, cy:y+size/2, r:4.4, fill:'#9fb2c6',
          class:'pt-dot' });
        if(magic) dot.setAttribute('style','animation-delay:'+(dd*100)+'ms');
        svg.appendChild(dot);
      }
      var jx=x0+(S.length+1)*(size+gap);
      var jg=svgEl('g',{ class:magic?'pt-land':'' });
      jg.appendChild(svgEl('rect',{ x:jx, y:y, width:size, height:size, rx:12,
        fill:colors[jump100], stroke:'#FFA75E', 'stroke-width':5, filter:'url(#ptSh)',
        class:'pt-spark pt-jump', 'data-ci':jump100 }));
      jg.appendChild(svgEl('rect',{ x:jx+6, y:y+5, width:size-12, height:size*0.26, rx:6,
        fill:'url(#ptGloss)', 'pointer-events':'none' }));
      svg.appendChild(jg);
      txt(svg,jx+size/2,y-16,'✨100번째',22,'#FFA75E');
      if(magic){
        txt(svg,VBW/2,26,'✨ 세어 보지 않아도, 규칙이면 100번째 색도 바로 알 수 있어요!',23,'#FFA75E','pt-flash');
      }
    }

    desk.innerHTML=''; desk.appendChild(svg);
    updateStatus(S,c,jShow);
  }

  function updateStatus(S,c,jShow){
    var st=$('statusRow');
    if(mode==='quiz'){
      st.innerHTML='<div class="hint">패턴의 규칙을 찾아 ? 자리에 올 색을 골라요</div>';
      return;
    }
    if(jShow){
      st.innerHTML='<div class="timeread">✨ <span class="o">100번째 색 = '+nameOf(jump100)+'</span></div>'
        +'<div class="hint">끝까지 세지 않고 <span class="grabline">규칙</span>으로 바로 알았어요!</div>';
      return;
    }
    if(showRule){
      var c2=PC.findCoreOf(S);
      if(c2>0){
        var nx=nameOf(S[S.length%c2]);
        if(G().bandHint){
          var unit=[]; for(var u=0;u<c2;u++) unit.push(nameOf(S[u]));
          st.innerHTML='<div class="timeread"><span class="p">『'+unit.join('-')+'』</span>'
            +'<span class="u">가 계속 반복돼요! → 다음은 </span><span class="b">'+nx+'</span></div>';
        } else {
          st.innerHTML='<div class="timeread"><span class="u">규칙 단위 </span><span class="p">'+c2+'</span>'
            +'<span class="u">개가 반복돼요 → 다음은 </span><span class="b">'+nx+'</span></div>';
        }
      } else {
        st.innerHTML='<div class="hint">아직 반복 규칙이 안 보여요 (블록을 더 넣어 보세요)</div>';
      }
      return;
    }
    st.innerHTML='<div class="hint">색 블록을 눌러 패턴을 만들고 <b>[규칙 찾기]</b>를 눌러요</div>';
  }

  function checkMission(act){
    if(mode!=='mission'||mDone||mLock) return;
    var M=curMissions();
    if(M[mStep].check(state(),act)){
      mLock=true; snd('chime');
      K3.toast('🎉 참 잘했어요!');
      setTimeout(function(){
        mLock=false;
        var M2=curMissions();
        if(mStep<M2.length-1){
          mStep++;
          /* v2 고유 — 다음이 「규칙 찾기」 미션이면 판을 남긴다(방금 만든 패턴으로 바로 🔍) */
          if(!/규칙 찾기/.test(M2[mStep].text)){ seq=[]; showRule=false; jump100=null; }
        } else mDone=true;
        build();
      }, STEP_MS);
    }
  }

  $('sndBtn').addEventListener('click',function(){
    K3.sound.setOn(!K3.sound.on);
    this.textContent=K3.sound.on?'🔊':'🔇';
    this.classList.toggle('off',!K3.sound.on);
    if(K3.sound.on)snd('select');
  });

  if(mode==='quiz') loadQuiz();
  if(mode==='mission') seq=[];
  build();

  window.PatApp={
    get grade(){return grade;}, get mode(){return mode;}, get seq(){return seq.slice();},
    get colors(){return colors.slice();}, get showRule(){return showRule;}, get jump100(){return jump100;},
    get core(){return core();}, get revealing(){return revealing;},
    get mStep(){return mStep;}, get mDone(){return mDone;},
    get qSeq(){return qSeq.slice();}, get qScore(){return qScore;}, get qCount(){return qCount;},
    get magicShown(){return magicShown;}, get pred(){return pred;},
    setGrade:setGrade, setMode:setMode, pushColor:pushColor,
    act:function(a){ var f=H[a]; if(f)f(); },
    setSeq:function(a){ seq=a.slice(); showRule=false; jump100=null; render(); checkMission(); },
    answer:answer, build:build
  };
})();
</script>
</body>
</html>

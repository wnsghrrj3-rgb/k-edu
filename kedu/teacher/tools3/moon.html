    ④ 즉각 반응(3D 달 위치 → 「지구에서 본 달」 2D 원반 · 저녁 하늘 · 상태줄이 한 몸으로)
    ⑤ 탐구 구조(미션 6 · 퀴즈 5 · 만약에 4 · 예측 칩 · 와우=동주기 자전 반증)
  🔴 신기술 2종(페이블 몫 이행):
    ① 궤도 평면 레이캐스트 달 끌기 — 화면을 끄는 게 아니라 «달을 직접 집어» 궤도 평면(y=0)에
       투영, phase=atan2(z,x)로 역산. 어디에 놓느냐가 곧 위상이 됨 = 「모양이 변하는 게 아니라
       보는 각도가 변한다」를 손으로 체득. (earth의 자전각 역산 계보)
    ② 지구조(earthshine) — 원점(지구)에 푸른 PointLight, 강도 ∝ (1-illum). 삭 근처일수록 강함
       = 달에서 본 지구가 「보름지구」라 밝음. 초승달의 어두운 원반이 희미하게 떠오름(다빈치의 설명).
  v2 무손실: 학년칸 저(슬라이더만·미션3)/중(재생·달잡기·미션5·⏩)/고(속도·스스로빛·관측시각·만약에4·미션6)

    ·만약에 4종(💡스스로빛 ⏸공전멈춤 ⏩2배공전 🌗같은평면=일식·월식)
    ·예측 노트(🌙보름자리·💡빛토글)·칩 5개=꼬마 과학자 토스트·상태줄 문구 전부
    ·「지구에서 본 달」 위상 path(limb+terminator 합성)·저녁 하늘 창(남중 시각 물리 배치·날마다 동쪽으로)
    ·일식/월식 배너·텍스처 승급 로더(moon.png + earth_day.png 재사용)
  v3 추가: 만약에 조작 게이트(wifActed — 카드 열자마자 자동 해소 차단 = light·earth 교훈)
    · 🐰 와우 신설(동주기 자전 — v2에 와우 없음 → 신설. ratio SPEC 선례)
  config: ?grade=low|mid|high(지정 시 잠금) · ?mode=free|mission|quiz · ?phase=0~360

<!-- ═══ 순수 로직 (window.MoonSim · node 테스트 대상 · DOM/THREE 무의존) ═══ -->
<script>
(function(){
  'use strict';

  var ORBIT_R = 4.2;                       /* 달 궤도 반지름(무대 단위) */
  var SYNODIC = 29.5;                      /* 삭망월(일) */

  function wrapDeg(d){ return ((d % 360) + 360) % 360; }
  function degDiff(a, b){                  /* 최단 각차 (부호 없음) */
    var d = Math.abs(wrapDeg(a) - wrapDeg(b));
    return d > 180 ? 360 - d : d;
  }

  /* ── 천문 수리 (v2 무손실) ── */
  function illum(phi){ return (1 - Math.cos(wrapDeg(phi) * Math.PI / 180)) / 2; }
  function phaseInfo(phi){
    phi = wrapDeg(phi);
    if(phi < 11 || phi > 349) return { k:'new',     nm:'삭 (신월)',   emo:'🌑' };
    if(phi < 79)              return { k:'wax_cre', nm:'초승달',       emo:'🌒' };
    if(phi < 101)             return { k:'first',   nm:'상현달',       emo:'🌓' };
    if(phi < 169)             return { k:'wax_gib', nm:'상현~보름',    emo:'🌔' };
    if(phi < 191)             return { k:'full',    nm:'보름달 (망)',  emo:'🌕' };
    if(phi < 259)             return { k:'wan_gib', nm:'보름~하현',    emo:'🌖' };
    if(phi < 281)             return { k:'last',    nm:'하현달',       emo:'🌗' };
    return                           { k:'wan_cre', nm:'그믐달',       emo:'🌘' };
  }
  /* 2D 위상 path — limb 반원 + terminator 타원 합성 (v2 litPath 무손실) */
  function litPath(R, phi){
    phi = wrapDeg(phi);
    var rx = Math.abs(R * Math.cos(phi * Math.PI / 180)).toFixed(2);
    var limbSweep = (phi < 180) ? 1 : 0;
    var termSweep;
    if(phi < 90) termSweep = 1; else if(phi < 180) termSweep = 0;
    else if(phi < 270) termSweep = 1; else termSweep = 0;
    return 'M 0 ' + (-R) + ' A ' + R + ' ' + R + ' 0 0 ' + limbSweep + ' 0 ' + R
         + ' A ' + rx + ' ' + R + ' 0 0 ' + termSweep + ' 0 ' + (-R) + ' Z';
  }
  function ageStr(phi){ return '약 ' + (wrapDeg(phi) / 360 * SYNODIC).toFixed(1) + '일'; }
  function evAge(phi){ var a = Math.round(wrapDeg(phi) / 12); return a === 0 ? 30 : a; }
  function hourLabel(h){
    h = +h;
    if(h <= 20) return '저녁 ' + (h - 12) + '시';
    if(h < 24)  return '밤 ' + (h - 12) + '시';
    if(h === 24) return '자정';
    return '새벽 ' + (h - 24) + '시';
  }
  /* 저녁 하늘 — 남중 시각 T = 12h + 위상/360×24h · 시간각 HA = (h−T)×15° (v2 evPos 무손실) */
  function evPos(pp, h){
    var Tt = 12 + wrapDeg(pp) / 360 * 24;
    var dh = h - Tt; dh = ((dh % 24) + 24) % 24; if(dh > 12) dh -= 24;
    var HA = dh * 15;
    if(Math.abs(HA) >= 88) return { vis:false, HA:HA };
    return { vis:true, x:HA / 90 * 70, y:28 - Math.cos(HA * Math.PI / 180) * 40, HA:HA };
  }

  /* ── 🔴 궤도 평면 역산 (달 잡아 끌기의 심장) ── */
  function moonXZ(phase){                     /* 위상 → 궤도 위 좌표 (v2 render 무손실) */
    var r = wrapDeg(phase) * Math.PI / 180;
    return { x: Math.cos(r) * ORBIT_R, z: Math.sin(r) * ORBIT_R };
  }
  function phaseFromXZ(x, z){                 /* 궤도 평면 위 한 점 → 위상 */
    return wrapDeg(Math.atan2(z, x) * 180 / Math.PI);
  }
  /* ── 🔴 지구조: 달에서 본 지구의 밝기 ∝ (1 − 달의 밝기). 삭에서 최대 ── */
  function earthshine(phase){ return 1 - illum(phase); }

  /* ── 🐰 동주기 자전 (와우) ── */
  function tidalRotY(phase){                  /* 앞면이 늘 지구를 향하는 자전각 */
    return Math.PI - wrapDeg(phase) * Math.PI / 180;
  }
  function rabbitDot(phase, tidalOff){        /* 앞면 무늬가 지구를 향한 정도 (>0 = 보임) */
    return tidalOff ? Math.cos(wrapDeg(phase) * Math.PI / 180) : 1;
  }

  /* ── 학년 칸 (v2 GRADES 무손실 — 노출·미션·만약에만 스왑) ── */
  var GRADES = {
    low:  { modes:['free','mission','quiz'], showPlay:false, mIdx:[0,2,3],
            wif:[], wow:false, v2:{ grab:false, spd:false, glow:false, hour:false },
            hint:'슬라이더를 움직여 날마다 달 모양이 어떻게 바뀌는지 봐요.' },
    mid:  { modes:['free','mission','quiz'], showPlay:true,  mIdx:[0,1,2,3,5],
            wif:['fastm'], wow:false, v2:{ grab:true, spd:false, glow:false, hour:false },
            hint:'▶ 공전 재생으로 달 모양이 규칙적으로 돌아오는 걸 봐요.' },
    high: { modes:['free','mission','quiz'], showPlay:true,  mIdx:[0,1,2,3,4,5],
            wif:['glow','stopm','fastm','plane'], wow:true, v2:{ grab:true, spd:true, glow:true, hour:true },
            hint:'💡 만약에로 위상의 비밀(반사광)을 파헤쳐 봐요.' }
  };

  /* ── 미션 6단계 (v2 문구·판정 무손실 · mIdx로 학년 스왑) ── */
  var MISSIONS = [
    { type:'make', text:'🌒 달을 움직여 <b>초승달</b>(오른쪽 가는 낫)을 만들어 봐요 — 삭 직후예요!',
      check:function(s){ return phaseInfo(s.phase).k === 'wax_cre'; } },
    { type:'think', text:'🤔 방금 만든 초승달의 밝은 부분 — 저 빛은 <b>무엇 때문에</b> 빛날까요?',
      ch:['태양 빛을 반사해서','달이 스스로 빛나서','지구 빛을 받아서'], a:0,
      why:'달은 스스로 빛나지 않아요 — 거대한 거울처럼 태양 빛을 반사할 뿐! 그래서 태양 쪽 면만 밝아요.' },
    { type:'make', text:'🌓 달의 나이 약 7일 — <b>상현달</b>(오른쪽 반달)을 만들어 봐요!',
      check:function(s){ return phaseInfo(s.phase).k === 'first'; } },
    { type:'make', text:'🌕 약 15일 — <b>보름달(망)</b>! 달이 태양 반대편으로 가면?',
      check:function(s){ return phaseInfo(s.phase).k === 'full'; } },
    { type:'think', set:function(s){ s.phase = 0; },
      text:'🤔 지금 달은 <b>삭</b>(태양과 지구 사이) 위치예요. 달이 안 보이는 까닭은?',
      ch:['빛 받는 면이 태양 쪽이라 우리에겐 그늘진 면만 보여서','달이 잠시 사라져서','구름이 가려서'], a:0,
      why:'삭일 때도 달은 그 자리에! 다만 밝은 면이 전부 태양 쪽이라 지구에서는 깜깜한 뒷면만 보여요.' },
    { type:'make', text:'🌗 약 22일 — <b>하현달</b>(왼쪽 반달)까지 만들면 한 달 완성!',
      check:function(s){ return phaseInfo(s.phase).k === 'last'; } }
  ];

  /* ── 퀴즈 (v2 무손실 — 장면 세팅형) ── */
  var QUIZ = [
    { phase:180, q:'왼쪽 아래 \'지구에서 본 달\'처럼 꽉 찬 달의 이름은?', ch:['보름달 (망)','초승달','하현달'], a:0 },
    { phase:90,  q:'오른쪽이 밝은 반달 — 이 달의 이름은?', ch:['상현달','하현달','그믐달'], a:0 },
    { phase:40,  q:'오른쪽 가는 낫 모양 — 이 달의 이름은?', ch:['초승달','보름달','하현달'], a:0 },
    { phase:180, q:'달의 모양이 날마다 변하는 까닭은?', ch:['태양 빛 받는 면을 보는 각도가 달라져서','달이 실제로 커졌다 작아져서','구름이 달을 가려서'], a:0 },

  var WOW = {

  function createSim(grade, opts){
    grade = (['low','mid','high'].indexOf(grade) >= 0) ? grade : 'high';
    opts = opts || {};
    var sim = {};
    sim.grade = grade;
    sim.G = function(){ return GRADES[sim.grade]; };
    sim.phase0 = (typeof opts.phase === 'number' && !isNaN(opts.phase)) ? wrapDeg(opts.phase) : 180;

      phase: sim.phase0,
      spd: 1, glow: false, hour: 19,
      playing: false, moveAcc: 0, dayCnt: 0,

      wowArmed: false, wowPred: null, wowDone: false, tidalOff: false,
      pred: { grab:{ asked:false, ch:-1, done:false, acc0:0 },
              glowp:{ asked:false, ch:-1, done:false, acc0:0 } },
      chips: [], chipToast: false,
      acted: false
    };

    /* ── 위상 변경 (모든 조작의 단일 관문 — moveAcc 누적) ── */
    sim.setPhase = function(v){
      var st = sim.state, nv = wrapDeg(v);
      st.moveAcc += degDiff(nv, st.phase);
      st.phase = nv;
      st.acted = true;
      if(st.wif) st.wifActed = true;       /* 만약에 중 «직접 끌기»도 조작으로 인정 (재생 전용 아님) */
      if(sim.planeOn()) sim.eclipse();     /* 끌어서 삭·망을 지나도 일식·월식 목격 기록 */
      return st.phase;
    };
    /* 🔴 달 잡아 끌기: 궤도 평면 위 한 점 → 위상 역산 */
    sim.grabTo = function(x, z){ return sim.setPhase(phaseFromXZ(x, z)); };
    sim.canGrab = function(mode){ return mode !== 'quiz' && sim.G().v2.grab; };

    sim.setSpd  = function(v){ sim.state.spd = Math.max(0.5, Math.min(4, v)); sim.state.acted = true; return sim.state.spd; };
    sim.setHour = function(v){ sim.state.hour = Math.max(18, Math.min(30, Math.round(v))); return sim.state.hour; };
    sim.toggleGlow = function(){
      var st = sim.state;
      st.glow = !st.glow; st.acted = true;
      return st.glow;
    };
    sim.togglePlay = function(){ sim.state.playing = !sim.state.playing; sim.state.acted = true; return sim.state.playing; };
    sim.dayStep = function(){ return sim.setPhase(sim.state.phase + 12); };   /* 📅 하루 뒤 (v2) */

    /* 스스로 빛 = 상시 변수 OR 만약에 glow (v2 effGlow) */
    sim.effGlow = function(){ return sim.state.glow || sim.state.wif === 'glow'; };
    sim.planeOn = function(){ return sim.state.wif === 'plane'; };
    /* 지구에서 보이는 위상 (스스로 빛나면 늘 보름) */
    sim.seenPhase = function(){ return sim.effGlow() ? 180 : sim.state.phase; };

    /* 공전 속도 (v2 loop 무손실 — 만약에가 덮어씀) */
    sim.orbitSpeed = function(){
      var st = sim.state;
      if(st.wif === 'stopm') return 0;
      if(st.wif === 'fastm') return 60;
      return 30 * st.spd;
    };
    sim.tick = function(dt){
      var st = sim.state;
      if(!st.playing) return;
      dt = Math.min(dt, 0.05);
      if(st.wif === 'stopm'){ st.dayCnt += dt * 8; st.wifActed = true; return; }
      var spd = sim.orbitSpeed();
      st.phase = wrapDeg(st.phase + dt * spd);
      st.moveAcc += dt * spd;

    };

    sim.eclipse = function(){
      if(!sim.planeOn()) return '';

       grab: 옮겨서 보름달 도달 · glowp: 켠 채로 옮김. 이미 보름인 채로 예측만 하면 해소 없음. */
    sim.predResolved = function(kind, mode){

      st.wifDone = true;

      var st = sim.state;
      st.wif = null; st.wifPred = null; st.wifActed = false; st.wifDone = false; st.eclSeen = false;

      return true;
    };

    /* ── 🐰 와우: 동주기 자전 (v3 신설) ── */
    sim.canWow = function(mode){ return mode === 'free' && sim.G().wow && !sim.state.wif && !sim.state.wowDone; };
    sim.wowArm = function(){
      var st = sim.state;
      st.wowArmed = true; st.wowPred = null; st.tidalOff = false;

    sim.setWowPred = function(i){
      sim.state.wowPred = (typeof i === 'number' && i >= 0 && i <= 2) ? i : null;

    sim.wowResolve = function(){

      if(!sim.wowResolved()) return null;

      var hit = (st.wowPred === WOW.a);
      st.chips.push({ k:'wow', hit:hit, label:WOW.chip });

      if(toast) st.chipToast = true;

      var st = sim.state;
      st.wowArmed = false; st.wowPred = null; st.tidalOff = false; st.playing = false;

    /* 직접 조작 시 무장 해제 (예측→확인 구조 보호) */

    sim.missionList = function(){ return sim.G().mIdx.map(function(i){ return MISSIONS[i]; }); };
    sim.mStep = 0; sim.mDone = false;
    sim.missionStart = function(){
      sim.mStep = 0; sim.mDone = false;

      st.phase = 180; st.playing = false; st.moveAcc = 0; st.dayCnt = 0;
      st.spd = 1; st.glow = false; st.hour = 19;

    };
    sim.missionCur = function(){ return sim.missionList()[sim.mStep]; };
    sim.missionCheck = function(){
      if(sim.mDone) return { act:'none' };
      var M = sim.missionList(), m = M[sim.mStep];
      if(m.type !== 'make') return { act:'none' };
      if(!sim.state.acted) return { act:'none' };            /* 자동달성 없음 */
      if(!m.check(sim.state)) return { act:'none' };
      return sim.missionAdvance();

    sim.missionAdvance = function(){
      var M = sim.missionList();
      sim.state.acted = false; sim.state.moveAcc = 0;
      if(sim.mStep < M.length - 1){
        sim.mStep++;
        var nx = M[sim.mStep];
        if(nx.set) nx.set(sim.state);                        /* think 시드 (삭 배치) */
        return { act:'next', step:sim.mStep };

    sim.qIdx = 0; sim.qScore = 0; sim.qCount = 0; sim.qUsed = [];

      sim.state.phase = QUIZ[sim.qIdx].phase;                /* 장면 세팅 */
      sim.state.playing = false;
      sim.state.glow = false;
      return sim.qIdx;
    };
    sim.quizAnswer = function(i){
      var q = QUIZ[sim.qIdx], ok = (i === q.a);
      sim.qCount++;
      if(ok) sim.qScore++;
      return { ok:ok, correct:q.ch[q.a] };
    };
    sim.quizReset = function(rand){
      sim.qScore = 0; sim.qCount = 0; sim.qUsed = [];
      sim.newQuiz(rand);
    };

    /* ── 상태줄 (v2 문구 무손실) ── */
    sim.statusText = function(mode){
      var st = sim.state, out = { lines:[], warn:false };
      if(mode === 'quiz'){

        return out;
      }
      if(st.wowArmed){
        out.warn = true;
        if(st.tidalOff){
          out.lines.push('<span class="big">🔒 자전 꺼짐</span>');
          out.lines.push('<span class="hold">▶ 공전 재생 — 🐰 토끼 무늬가 지구에서 보였다 사라졌다 하나요?</span>');
        } else {
          out.lines.push('🐰 달의 앞면(토끼 무늬)이 늘 지구를 향해 있어요 — 예측을 골라 봐요!');
        }
        return out;
      }
      if(st.wif){
        var W = WHATIF[st.wif];
        out.warn = true;
        if(st.wif === 'stopm'){
          out.lines.push('<span class="big">📅 +' + Math.floor(st.dayCnt) + '일</span>');
          out.lines.push('날짜가 흘러도 달 모양은 그대로 — 위상은 공전이 만들어요!');
        } else if(st.wif === 'glow'){
          out.lines.push('💡 스스로 빛나는 달 — 어느 위치든 \'지구에서 본 달\'이 꽉 차 있죠?');
        } else if(st.wif === 'plane'){
          out.lines.push('🌗 같은 평면 — 삭 자리에서 🌞 일식, 망 자리에서 🔴 월식! ▶ 재생으로 궤도를 돌려 봐요.');
        } else {
          out.lines.push('⏩ 2배 공전 — 초승→보름→그믐이 두 배 빨리! 한 달이 보름이 됐어요.');
        }
        if(!st.wifDone && st.wifPred !== null) out.lines.push('<span class="hold">' + W.tip + '</span>');
        return out;
      }
      var info = phaseInfo(st.phase), pct = Math.round(illum(st.phase) * 100), sub;
      if(info.k === 'new') sub = '달이 태양과 지구 사이에 있어요. 밝은 면이 태양 쪽(반대편)이라 지구에선 거의 안 보여요.';
      else if(info.k === 'full') sub = '달이 태양 반대편에 있어요. 밝은 면을 지구에서 정면으로 봐서 꽉 찬 달이에요.';
      else if(info.k === 'first' || info.k === 'last') sub = '달이 옆쪽에 있어요. 밝은 면의 절반만 지구에서 보여 반달이에요.';
      else if(info.k.indexOf('cre') >= 0) sub = '밝은 면이 거의 태양 쪽이라, 지구에선 가느다란 낫 모양만 보여요.';
      else sub = '밝은 면 대부분이 지구를 향해 불룩하게 보여요.';
      out.lines.push('<span class="big">' + info.emo + ' ' + info.nm + ' · 밝기 ' + pct + '%</span>');
      out.lines.push(sub);
      out.lines.push('달은 스스로 빛나지 않아요. 태양 빛 받는 면을 지구에서 보는 각도가 달라져 모양이 변해요.');
      if(mode === 'free' && sim.G().v2.grab){
        out.lines.push('🌙 달을 집어 궤도 위에서 직접 옮겨요!');
      }
      if(mode === 'free' && st.glow){
        out.lines.push('💡 스스로 빛 ON — 위치를 바꿔도 \'지구에서 본 달\'이 변하는지 봐요!');
      }
      if(mode === 'free' && !st.glow && earthshine(st.phase) >= 0.72){
        out.lines.push('🌍 초승달의 어두운 부분이 희미하게 보여요 — 지구가 반사한 빛(지구조)이에요!');
      }
      return out;
    };

    return sim;
  }

  var API = {
    ORBIT_R:ORBIT_R, SYNODIC:SYNODIC, wrapDeg:wrapDeg, degDiff:degDiff,
    illum:illum, phaseInfo:phaseInfo, litPath:litPath, ageStr:ageStr, evAge:evAge,
    hourLabel:hourLabel, evPos:evPos, moonXZ:moonXZ, phaseFromXZ:phaseFromXZ,
    earthshine:earthshine, tidalRotY:tidalRotY, rabbitDot:rabbitDot,
    GRADES:GRADES, MISSIONS:MISSIONS, QUIZ:QUIZ, WHATIF:WHATIF, WIF_KEYS:WIF_KEYS,
    PRED:PRED, WOW:WOW, createSim:createSim
  };
  if(typeof window !== 'undefined') window.MoonSim = API;
  if(typeof module !== 'undefined' && module.exports) module.exports = API;
})();
</script>

{

function earthFallback() {

new THREE.TextureLoader().load(

/* 태양 코로나 스프라이트 (+X) */
const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({

/* ═══════════ UI ═══════════ */
const $ = id => document.getElementById(id);
const hudL = $('hudL'), ctrls = $('ctrls'), mbar = $('mbar'), choicesEl = $('choices'),
      statusEl = $('status'), chipsEl = $('chips'), skyEl = $('sky'), moonpEl = $('moonp'),
      eclEl = $('ecl'), annoHost = $('anno'), texlabEl = $('texlab');
let hintHidden = false;
function hideHint() { if (!hintHidden) { hintHidden = true; $('hint').classList.add('hide'); } }

const rabAnno = document.createElement('div');
rabAnno.className = 'mn-anno';
rabAnno.textContent = '🐰 달의 앞면';
annoHost.appendChild(rabAnno);

const MODE_NM = { free: '🔭 자유탐구', mission: '🎯 미션', quiz: '❓ 퀴즈' };
const GRADE_NM = { low: '🌱 저학년', mid: '🌿 중학년', high: '🌳 고학년' };

function renderTexLabel() { texlabEl.textContent = texReal ? '🖼️ 실사 달 텍스처' : '🎨 기본 그림 달'; }
renderTexLabel();

function renderHUD() {
  let h = '';

function renderCtrls() {
  if (mode === 'quiz') { ctrls.style.display = 'none'; return; }

  const st = sim.state, g2 = sim.G().v2;

  let h = `<div class="mn-age" id="age">${info.emo} ${Sim.ageStr(st.phase)}</div>`;
  if (sim.G().showPlay) {
    h += `<button class="k3-btn ${st.playing ? '' : 'fire'}" data-a="play">${st.playing ? '■ 멈춤' : (frozen ? '▶ 시간 흐르기' : '▶ 공전 재생')}</button>`;

    h += `<div class="mn-lab">달의 나이 (위상)</div><input class="mn-slider" id="phSlider" type="range" min="0" max="360" step="1" value="${Math.round(st.phase)}">`;

/* ── 「지구에서 본 달」 2D 원반 (v2 무손실 + 지구조·🐰) ── */
function renderMoonPanel() {
  const lit = $('mlit'), es = $('mearthshine'), rb = $('mrabbit'), cap = $('mcap');
  if (!lit) return;
  const pp = sim.seenPhase();
  const ecl = sim.eclipse();
  lit.setAttribute('d', Sim.litPath(50, pp));

/* ── 저녁 하늘 창 (v2 renderEvening 무손실) ── */
const NS = 'http://www.w3.org/2000/svg';
function renderSky() {
  const g = $('spg'), cap = $('skycap');
  if (!g) return;
  if (mode === 'quiz') { skyEl.style.display = 'none'; return; }
  skyEl.style.display = '';
  while (g.firstChild) g.removeChild(g.firstChild);
  const S = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const st = sim.state;
  const pp = sim.seenPhase();
  cap.textContent = Sim.hourLabel(st.hour) + ', 남쪽 하늘 · 달 나이 ' + Sim.evAge(st.phase) + '일';
  const msg = txt => {
    const t = S('text', { x: 0, y: -4, 'text-anchor': 'middle', fill: '#9fb6e6', 'font-size': 10, 'font-family': 'Gowun Dodum' });
    t.textContent = txt; g.appendChild(t);
  };
  if (pp < 15 || pp > 345) { msg('삭 무렵 — 달이 보이지 않아요'); return; }
  const ev = Sim.evPos(pp, st.hour);
  if (!ev.vis) { msg(ev.HA < 0 ? '이 시각엔 아직 안 떴어요 (더 늦게 떠요)' : '이 시각엔 이미 졌어요 (다음에 다시 떠요)'); return; }
  for (let d = -2; d <= 2; d++) {                    /* 며칠 전후 자취 — '날마다 동쪽으로' */
    if (d === 0) continue;
    const p2 = Sim.wrapDeg(pp + d * 12);
    if (p2 < 15 || p2 > 345) continue;
    const e2 = Sim.evPos(p2, st.hour);
    if (!e2.vis) continue;
    g.appendChild(S('circle', { cx: e2.x.toFixed(1), cy: e2.y.toFixed(1), r: 2.2, fill: '#8d9dc8', opacity: 0.45, class: 'sptrace' }));
  }
  const grp = S('g', { transform: `translate(${ev.x.toFixed(1)},${ev.y.toFixed(1)}) scale(0.17)`, id: 'spmoon' });
  grp.appendChild(S('circle', { cx: 0, cy: 0, r: 50, fill: '#1A2440', stroke: '#3a4a6a', 'stroke-width': 3 }));
  const lp = S('path', { fill: '#FDF6D8' });
  lp.setAttribute('d', Sim.litPath(50, pp));
  grp.appendChild(lp);
  g.appendChild(grp);
  if (pp > 40 && pp < 196 && st.hour <= 20) {
    const ar = S('text', { x: Math.min(ev.x + 14, 46), y: Math.max(ev.y - 9, -38), fill: '#FFD43B', 'font-size': 9, 'font-family': 'Gowun Dodum' });
    ar.textContent = '← 날마다 동쪽으로';
    g.appendChild(ar);
  }
}

/* ── 일식·월식 배너 (v2 무손실) ── */
let eclLast = '';
function renderEcl() {
  const cur = sim.eclipse();
  if (cur !== eclLast) { if (cur) K3.sound.play('whoosh'); eclLast = cur; }
  if (cur === 'sun') {
    eclEl.style.display = ''; eclEl.style.color = '#FFD43B';
    eclEl.textContent = '🌞→🌑 일식! 달이 태양을 가려요';
  } else if (cur === 'moon') {
    eclEl.style.display = ''; eclEl.style.color = '#FF8787';
    eclEl.textContent = '🔴 월식! 지구 그림자가 달을 가려요';
  } else eclEl.style.display = 'none';
}

function renderQuiz() {
  if (mode !== 'quiz') { choicesEl.style.display = 'none'; return; }
  choicesEl.style.display = '';
  const q = sim.quizList()[sim.qIdx];
  const order = [0, 1, 2].sort(() => Math.random() - 0.5);
  choicesEl.innerHTML = order.map(i => `<button data-v="${i}">${q.ch[i]}</button>`).join('');
  choicesEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    if (qLock) return; qLock = true;
    const r = sim.quizAnswer(+b.dataset.v);
    K3.sound.play(r.ok ? 'chime' : 'fail');
    K3.toast(r.ok ? '🎉 정답!' : '아쉬워요 — 정답은 「' + r.correct + '」', !r.ok, T(1300));
    renderBar();
    setTimeout(() => {
      sim.newQuiz(Math.random);
      qLock = false;
      syncScene(); renderAll();
    }, T(1500));
  }));
}
let qLock = false;

function renderAll() {
  renderHUD(); renderCtrls(); renderBar(); renderQuiz();
  renderStatus(); renderChips(); renderMoonPanel(); renderSky(); renderEcl();
}

/* ═══════════ 씬 동기 ═══════════ */
function syncScene() {
  const st = sim.state;
  const p = Sim.moonXZ(st.phase);
  moonGrp.position.set(p.x, 0, p.z);
  /* 🐰 동주기 자전 — 앞면이 늘 지구를 향함. 와우에서 끄면 고정 */
  moonMesh.rotation.y = st.tidalOff ? Math.PI : Sim.tidalRotY(st.phase);
  rabbit.visible = st.wowArmed;
  /* 🔴 지구조 — 삭 근처일수록 강함 (스스로 빛 켜면 꺼짐) */
  earthShineLight.intensity = sim.effGlow() ? 0 : Sim.earthshine(st.phase) * 1.5;
  /* 스스로 빛 = 달 자체 발광 (v2 effGlow) */
  moonMat.emissive = moonMat.emissive || new THREE.Color(0x000000);
  moonMat.emissive.setHex(sim.effGlow() ? 0xFFF6D8 : 0x000000);
  moonMat.emissiveIntensity = sim.effGlow() ? 0.85 : 0;
  renderMoonPanel(); renderSky(); renderEcl();
}
syncScene();

/* ── 조작 ── */
function act(a) {
  hideHint();
  const st = sim.state;
  if (a === 'play') {
    sim.clearWow();
    sim.togglePlay();
    K3.sound.play(st.playing ? 'whoosh' : 'select');
    renderCtrls(); renderStatus();
  } else if (a === 'day') {
    sim.clearWow();
    if (st.playing) sim.togglePlay();
    sim.dayStep();
    K3.sound.play('tap');
    syncScene(); renderAll(); afterAct();
  } else if (a === 'glow') {
    const on = sim.toggleGlow();
    K3.sound.play('select');
    syncScene(); renderAll();
    if (on && sim.predArm('glowp', mode)) askPred('glowp');
    else predTick();
  } else if (a === 'reset') {
    sim.wifExit(); sim.wowExit();
    st.spd = 1; st.glow = false; st.hour = 19; st.phase = sim.phase0;
    K3.sound.play('tap');
    syncScene(); renderAll();
  } else if (a === 'whatif') {
    K3.cards.result('<h3>🌀 만약에… 무엇을 바꿔 볼까요?</h3>',
      sim.wifList().map(k => ({ label: Sim.WHATIF[k].icon + ' ' + Sim.WHATIF[k].title, value: k }))
    ).then(k => { if (k) startWhatif(k); });
  } else if (a === 'wifexit') {
    sim.wifExit();
    K3.sound.play('select');
    syncScene(); renderAll();
  } else if (a === 'wowarm') {
    sim.wowArm();
    K3.sound.play('charge');
    syncScene(); renderAll();
    K3.cards.predict(Sim.WOW.q.replace(/<[^>]+>/g, ''),
      Sim.WOW.ch.map((c, i) => ({ id: String(i), label: c }))
    ).then(v => {
      sim.setWowPred(+v);
      K3.sound.play('charge');
      K3.toast('🔒 「달의 자전 꺼보기」를 누르고 ▶ 공전 재생 — 토끼 무늬를 지켜봐요!', false, T(3800));
      renderCtrls(); renderStatus();
    });
  } else if (a === 'wowunlock') {
    if (!sim.wowUnlock()) return;
    K3.sound.play('whoosh');
    renderCtrls(); renderStatus(); syncScene();
  } else if (a === 'wowexit') {
    sim.wowExit();
    K3.sound.play('select');
    syncScene(); renderAll();
  }
}

/* ── 만약에 (v3 조작 게이트) ── */
function startWhatif(key) {
  sim.wifStart(key);
  K3.sound.play('whoosh');
  syncScene(); renderAll();
  const W = Sim.WHATIF[key];
  K3.cards.predict(W.q, W.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      sim.wifPredict(+v);
      K3.sound.play('charge');
      K3.toast(W.icon + ' ' + W.tip, false, T(3600));
      renderStatus();
    });
}
function wifTick() {
  if (!sim.wifResolved()) return;
  const r = sim.wifResolve();
  if (!r) return;
  K3.sound.play(r.hit ? 'chime' : 'pop');
  if (r.hit) K3.sound.play('ting');
  const W = Sim.WHATIF[r.key];
  K3.toast(
    '<b>' + W.icon + ' ' + W.title + '</b><br>' + W.reveal +
    (r.hit ? '<br>🔮 네 예측이 딱 맞았어요! ✔' : '<br>🔮 예측이 빗나갔어요 — 그래서 실험이 재밌죠! ✘'),
    !r.hit, T(6000)
  );
  sim.state.playing = false;
  renderChips(); renderCtrls(); renderStatus();
  if (r.chipToast) setTimeout(() => K3.toast('🔭 꼬마 과학자 — 오늘 가설 5개를 실험했어요!', false, T(3000)), T(6200));
}

/* ── 🐰 와우 해소 ── */
function wowTick() {
  if (!sim.wowResolved()) return;
  const r = sim.wowResolve();
  if (!r) return;
  K3.sound.play('whoosh');
  setTimeout(() => K3.sound.play(r.hit ? 'ting' : 'pop'), T(240));
  K3.cards.result(
    '<h3>🐰 달의 앞면, 뒷면</h3>' +
    '<div style="font-size:13px;line-height:1.55;color:#243043">자전을 끄니 토끼 무늬가 <b>보였다 사라졌다</b> 했죠? ' +
    '달의 <b>모든 면</b>이 지구에 보인 거예요.<br>실제 달은 한 바퀴 공전하는 동안 <b>정확히 한 바퀴 자전</b>해요 — ' +
    '이게 <b>동주기 자전</b>! 달은 자전을 «안 하는» 게 아니라, 공전에 <b>딱 맞춰서</b> 하고 있어요. ' +
    '그래서 우리는 평생 달의 앞면만 봐요.' +
    (r.hit ? '<br>🔮 네 예측이 딱 맞았어요! ✔' : '<br>🔮 예측이 빗나갔어요 — 「자전을 안 한다」가 가장 흔한 오해예요! ✘') +
    '</div>',
    [{ label: '알겠어요!', cls: 'pri', value: true }]
  ).then(() => {
    sim.wowExit();
    syncScene(); renderAll();
    if (r.chipToast) setTimeout(() => K3.toast('🔭 꼬마 과학자 — 오늘 가설 5개를 실험했어요!', false, T(3000)), T(400));
  });
  renderChips();
}

/* ── 예측 노트 (v2 3층) ── */
function askPred(kind) {
  const P = Sim.PRED[kind];
  K3.cards.predict(P.q, P.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      sim.predPick(kind, +v);
      K3.sound.play('charge');
      K3.toast('📝 예측 접수! ' + P.tip, false, T(3400));
      renderStatus();
    });
}
function predTick() {
  ['grab', 'glowp'].forEach(kind => {
    if (!sim.predResolved(kind, mode)) return;
    const r = sim.predResolve(kind, mode);
    if (!r) return;
    K3.sound.play(r.hit ? 'chime' : 'pop');
    if (r.hit) K3.sound.play('ting');
    K3.toast(r.msg, !r.hit, T(5000));
    renderChips(); renderStatus();
    if (r.chipToast) setTimeout(() => K3.toast('🔭 꼬마 과학자 — 오늘 가설 5개를 실험했어요!', false, T(3000)), T(5200));
  });
}

/* ── 조작 후처리 (한 곳으로 모음: 어떤 조작이든 예측·미션·만약에·와우가 함께 판정된다.
      ★ 재생 루프에서만 판정하면 「끌어서 확인」이 해소되지 않는다 = 배선 구멍) ── */
function afterAct() {
  predTick();
  if (mode === 'mission') missionTick();
  if (sim.state.wif) wifTick();
  if (sim.state.wowArmed) wowTick();
}

/* ── 🔴 달 잡아 끌기 (궤도 평면 레이캐스트 역산) ── */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const orbitPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPt = new THREE.Vector3();
let grabbing = false;
function castOrbit(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  return ray.ray.intersectPlane(orbitPlane, hitPt) ? hitPt : null;
}
function pickMoon(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  return ray.intersectObject(moonProxy, false).length > 0;
}
renderer.domElement.addEventListener('pointerdown', e => {
  hideHint();
  if (!sim.canGrab(mode)) return;
  if (!pickMoon(e.clientX || 0, e.clientY || 0)) return;
  grabbing = true;
  controls.enabled = false;
  if (sim.state.playing) { sim.togglePlay(); renderCtrls(); }
  sim.clearWow();
  K3.sound.play('tap');
  if (sim.predArm('grab', mode)) askPred('grab');
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!grabbing) return;
  const p = castOrbit(e.clientX || 0, e.clientY || 0);
  if (!p) return;
  sim.grabTo(p.x, p.z);
  syncScene(); renderStatus(); renderCtrls();
  afterAct();
});
function endGrab() {
  if (!grabbing) return;
  grabbing = false;
  controls.enabled = true;
  K3.sound.play('select');
}
renderer.domElement.addEventListener('pointerup', endGrab);
renderer.domElement.addEventListener('pointercancel', endGrab);

/* ── 미션 ── */
let thinkOpen = false;
function missionTick() {
  if (mode !== 'mission' || sim.mDone) return;
  const cur = sim.missionCur();
  if (cur.type === 'think') { openThink(cur); return; }
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  setTimeout(() => { syncScene(); renderAll(); missionTick(); }, T(1300));
}
function openThink(m) {
  if (thinkOpen) return;
  thinkOpen = true;
  K3.cards.predict(m.text.replace(/<[^>]+>/g, ''), m.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      thinkOpen = false;
      if (+v === m.a) {
        K3.sound.play('chime'); K3.sound.play('ting');
        K3.toast('🎉 정답!<br>' + m.why, false, T(4200));
        sim.missionAdvance();
        setTimeout(() => { syncScene(); renderAll(); if (!sim.mDone) missionTick(); }, T(1400));
      } else {
        K3.sound.play('fail');
        K3.toast('음… 다시 생각해 볼까요? 달이 어디에 있는지 봐요!', true, T(2600));
        setTimeout(() => missionTick(), T(2700));
      }
    });
}

/* ── 모드·학년 ── */
function resetForMode() {
  sim.wifExit(); sim.wowExit();
  const st = sim.state;
  st.spd = 1; st.glow = false; st.hour = 19; st.moveAcc = 0; st.dayCnt = 0;
  st.pred.grab = { asked:false, ch:-1, done:false, acc0:0 };
  st.pred.glowp = { asked:false, ch:-1, done:false, acc0:0 };
  st.wowDone = false;
  controls.enabled = true;
  qLock = false;
}
function setGrade(g) {
  sim.grade = g;
  if (!sim.G().modes.includes(mode)) mode = 'free';
  resetForMode();
  if (mode === 'mission') sim.missionStart();
  else if (mode === 'quiz') sim.quizReset(Math.random);
  else sim.state.phase = sim.phase0;
  syncScene(); renderAll();
  if (mode === 'mission') missionTick();
}
function setMode(m) {
  mode = m;
  resetForMode();
  if (m === 'mission') sim.missionStart();
  else if (m === 'quiz') sim.quizReset(Math.random);
  else sim.state.phase = 180;
  syncScene(); renderAll();
  if (m === 'mission') missionTick();
}

/* ═══════════ 루프 ═══════════ */
const clock = new THREE.Clock();
const FASTX = window.__K3_FAST ? 14 : 1;
const _wp = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()) * FASTX;

  if (sim.state.playing) {
    sim.tick(dt);
    syncScene();
    renderStatus();
    const ps = $('phSlider');
    if (ps) ps.value = Math.round(sim.state.phase);
    afterAct();
  }

  /* 🐰 앞면 라벨 투영 (와우 중에만) */
  if (sim.state.wowArmed && mode !== 'quiz') {
    rabbit.getWorldPosition(_wp);
    const wp = _wp.clone();
    _wp.project(camera);
    const facing = wp.clone().sub(camera.position).normalize()
      .dot(wp.clone().sub(moonGrp.position).normalize());
    if (_wp.z < 1 && facing < 0.35) {
      rabAnno.style.left = ((_wp.x * 0.5 + 0.5) * innerWidth) + 'px';
      rabAnno.style.top = ((-_wp.y * 0.5 + 0.5) * innerHeight - 20) + 'px';
      rabAnno.style.display = '';
    } else rabAnno.style.display = 'none';
  } else rabAnno.style.display = 'none';

  controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}

if (mode === 'mission') sim.missionStart();
else if (mode === 'quiz') sim.quizReset(Math.random);
syncScene();
renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast(sim.G().v2.grab
  ? '달을 <b>잡아서 궤도 위에 놓아 봐요</b> — 어디에 놓느냐가 달의 모양을 정해요!'
  : '슬라이더를 움직여 <b>날마다 달 모양이 어떻게 바뀌는지</b> 봐요!');
animate();
if (mode === 'mission') missionTick();

/* 테스트용 앱 훅 */
window.MoonApp = {
  sim, get mode() { return mode; }, setMode, setGrade, act, startWhatif,
  moonGrp, moonMesh, rabbit, moonProxy, earthMesh, ring, sunSpr, earthShineLight,
  moonMat, earthMat, camera, sun, controls,
  get texReal() { return texReal; },
  syncScene, renderAll, missionTick, wifTick, wowTick, predTick,
  setPhase(v) { sim.setPhase(v); syncScene(); renderStatus(); renderCtrls(); afterAct(); },
  grabTo(x, z) { sim.grabTo(x, z); syncScene(); renderStatus(); renderCtrls(); afterAct(); },
  runFor(sec) {
    sim.state.playing = true;
    for (let t = 0; t < sec; t += 0.05) sim.tick(0.05);
    syncScene(); renderStatus(); renderCtrls();
    afterAct();
  },
  answerQuiz(i) { const bs = document.querySelectorAll('#choices button'); for (const b of bs) if (+b.dataset.v === i) { b.click(); return true; } return false; }
};
</script>
</body>
</html>

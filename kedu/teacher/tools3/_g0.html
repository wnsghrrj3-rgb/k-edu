<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이랩 v3 · G0 검수 순회</title>
<!--
  케이랩 v3 · A트랙 G0 검수 순회 보드 (2026-07-13 · 페이블)
  목적: 완성된 A트랙 15종을 준호가 «전자칠판 앞에서 한 판에» 몰아 검수하고,
        판정·메모를 브라우저에 저장한 뒤 결과 텍스트를 통째로 복사해 베프에게 던지는 것.
  - 도구를 새 탭으로 여는 링크(학년칸 3종·모드 3종) — 실제 수업 조건 그대로.
  - 도구별 검수 항목(_V3_STATUS.md 원문) 체크박스.
  - 판정 3종: ✅ 통과 / 🔧 수정 요청 / ⬜ 미검수.
  - localStorage 저장(k-edu 실서비스 페이지이므로 사용 가능) — 새로고침·다음날에도 유지.
  - 「📋 결과 복사」 = 수정 요청 도구·항목·메모만 뽑아 마크다운으로 클립보드에.
  검수 통과분부터 허브(kedu/hub/klab.html) 링크를 tools3로 교체 → 라이브 투입.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --bg2:#151A22; --card:#1A2029; --card2:#212936;
    --line:#2C3542; --tx:#E8EDF3; --tx2:#9AA6B4; --tx3:#6B7787;
    --ok:#2DD4A0; --fix:#FFB454; --wait:#5B6675;
    --acc:#7C6BF5; --red:#FF6B6B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#1B2331 0%,var(--bg) 62%);
    color:var(--tx); font-family:'Gowun Dodum',system-ui,-apple-system,sans-serif;
    min-height:100vh; padding:0 0 90px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}

  header{padding:34px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
  h1{font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1 em{font-style:normal;font-size:12px;color:var(--acc);border:1px solid var(--acc);
    border-radius:999px;padding:3px 10px;letter-spacing:0}
  .sub{color:var(--tx2);font-size:14px;margin-top:9px;line-height:1.65}
  .sub b{color:var(--tx)}

  /* 진행 바 */
  .prog{margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px}
  .pbar{height:9px;background:#0B0E13;border-radius:99px;overflow:hidden;display:flex}
  .pbar i{display:block;height:100%;transition:width .35s ease}
  .pbar .i-ok{background:linear-gradient(90deg,#2DD4A0,#3EE7B4)}
  .pbar .i-fix{background:linear-gradient(90deg,#FFB454,#FFC97A)}
  .pnum{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--tx2);flex-wrap:wrap;align-items:center}
  .pnum b{color:var(--tx);font-size:15px}
  .dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:1px}
  .d-ok{background:var(--ok)} .d-fix{background:var(--fix)} .d-wait{background:var(--wait)}

  /* 필터 */
  .bar{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--tx2);
    border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s}
  .chip:hover{border-color:var(--tx3);color:var(--tx)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .spacer{flex:1}

  /* 도구 카드 */
  .tool{background:var(--card);border:1px solid var(--line);border-radius:16px;
    margin-bottom:14px;overflow:hidden;transition:.18s}
  .tool.s-ok{border-color:rgba(45,212,160,.45)}
  .tool.s-fix{border-color:rgba(255,180,84,.5)}
  .tool.hide{display:none}

  .thead{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;
    user-select:none}
  .thead:hover{background:var(--card2)}
  .no{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#0B0E13;
    border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--tx3)}
  .tool.s-ok .no{background:rgba(45,212,160,.14);border-color:rgba(45,212,160,.4);color:var(--ok)}
  .tool.s-fix .no{background:rgba(255,180,84,.14);border-color:rgba(255,180,84,.45);color:var(--fix)}
  .tinfo{flex:1;min-width:0}
  .tnm{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tnm code{font-size:11px;color:var(--tx3);background:#0B0E13;border:1px solid var(--line);
    border-radius:6px;padding:2px 7px;font-family:ui-monospace,monospace}
  .tds{color:var(--tx2);font-size:12.5px;margin-top:4px;line-height:1.5}
  .tstat{font-size:12px;padding:5px 11px;border-radius:999px;white-space:nowrap;
    border:1px solid var(--line);color:var(--tx3);background:#0B0E13}
  .tool.s-ok .tstat{color:var(--ok);border-color:rgba(45,212,160,.4);background:rgba(45,212,160,.1)}
  .tool.s-fix .tstat{color:var(--fix);border-color:rgba(255,180,84,.45);background:rgba(255,180,84,.1)}
  .arw{color:var(--tx3);font-size:12px;transition:.2s}
  .tool.open .arw{transform:rotate(90deg)}

  .tbody{display:none;padding:2px 18px 18px;border-top:1px solid var(--line)}
  .tool.open .tbody{display:block}

  .sec{margin-top:16px}
  .slab{font-size:12px;color:var(--tx3);margin-bottom:9px;letter-spacing:.4px}

  /* 열기 링크 */
  .links{display:flex;gap:7px;flex-wrap:wrap}
  .lk{background:var(--card2);border:1px solid var(--line);color:var(--tx);
    border-radius:10px;padding:9px 14px;font-size:13px;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .lk:hover{border-color:var(--acc);background:rgba(124,107,245,.14)}
  .lk.main{background:linear-gradient(180deg,#8878FF,#6D5AE8);border-color:#8878FF;color:#fff;font-size:14px}
  .lk.main:hover{filter:brightness(1.1)}

  /* 신기술 */
  .tech{background:#0B0E13;border:1px solid var(--line);border-left:3px solid var(--red);
    border-radius:10px;padding:11px 13px;font-size:13px;color:var(--tx2);line-height:1.65}
  .tech b{color:var(--tx)}
  .tech + .tech{margin-top:7px}

  /* 체크 항목 */
  .ck{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:9px;
    cursor:pointer;transition:.12s;font-size:13.5px;line-height:1.6}
  .ck:hover{background:var(--card2)}
  .ck input{appearance:none;width:19px;height:19px;flex:0 0 19px;margin-top:1px;
    border:1.5px solid var(--tx3);border-radius:6px;cursor:pointer;position:relative;transition:.12s}
  .ck input:checked{background:var(--ok);border-color:var(--ok)}
  .ck input:checked::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;
    color:#0E1116;font-size:13px;font-weight:700}
  .ck input:checked + span{color:var(--tx2)}
  .ck span b{color:var(--tx)}

  /* 판정 */
  .judge{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .jb{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);
    border-radius:11px;padding:12px;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
  .jb:hover{border-color:var(--tx3);color:var(--tx)}
  .jb.on-ok{background:rgba(45,212,160,.16);border-color:var(--ok);color:var(--ok)}
  .jb.on-fix{background:rgba(255,180,84,.16);border-color:var(--fix);color:var(--fix)}
  .jb.on-wait{background:var(--card2);border-color:var(--tx3);color:var(--tx)}

  textarea{width:100%;margin-top:10px;background:#0B0E13;border:1px solid var(--line);
    color:var(--tx);border-radius:11px;padding:12px 13px;font-family:inherit;font-size:13.5px;
    line-height:1.65;resize:vertical;min-height:64px;outline:none}
  textarea:focus{border-color:var(--acc)}
  textarea::placeholder{color:var(--tx3)}

  /* 하단 고정 */
  .foot{position:fixed;left:0;right:0;bottom:0;background:rgba(14,17,22,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 18px;z-index:20}
  .fin{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ftx{color:var(--tx2);font-size:13px;flex:1;min-width:150px}
  .ftx b{color:var(--tx)}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:11px;
    padding:11px 18px;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:hover{border-color:var(--tx3)}
  .btn.pri{background:linear-gradient(180deg,#8878FF,#6D5AE8);border-color:#8878FF;color:#fff}
  .btn.pri:hover{filter:brightness(1.1)}
  .btn.dim{color:var(--tx3)}

  .toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,14px);
    background:var(--acc);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:640px){
    h1{font-size:21px} .wrap{padding:0 12px}
    .thead{padding:14px 13px} .tbody{padding:2px 13px 15px}
    .tstat{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

<header>

  <div class="sub">

    <span class="spacer"></span>
    <button class="chip" id="expAll">전부 펼치기</button>
  </div>
</header>

<div id="list"></div>

</div>

<div class="foot">
  <div class="fin">

    <button class="btn dim" id="reset">초기화</button>
    <button class="btn pri" id="copy">📋 검수 결과 복사</button>
  </div>
</div>
<div class="toast" id="toast"></div>

        '<b>🌟 와우 🔭 변 늘이기 (v2 승격)</b> — 두 변이 꼭짓점을 축으로 <b>바깥으로 쭉 자라난다</b>(0.5s). 그런데 <b>각도기 눈금 숫자는 꿈쩍도 안 한다</b>. 하니스가 <b>눈금 숫자 전체의 x·y 좌표 문자열</b>을 늘이기 전후로 비교해 «완전 동일»을 실측. <b>v3 추가: 변 위에 회색 자 눈금이 함께 자라난다</b> — 「길이는 늘었다」는 대비가 있어야 「각은 그대로」라는 반증이 선다',
        '<b>★ §6-7 금지 리팩터</b> — armLen을 눈금 계산에 끌어들이면 반증이 무너진다. 호(R)·눈금·각도 숫자 위치는 전부 R 기준 고정. <b>하니스가 이 금지를 지킨다</b>(armLen을 눈금에 끌어들이면 정확히 1단언 실패)',
        '<b>🔮 예측 카드(1회 · 전 학년)</b> — 「두 변을 <b>길게</b> 늘이면 <b>각의 크기</b>는?」(커진다/작아진다/그대로다). <b>저학년 카드는 각도 숫자 대신 일상어</b>(「조금 벌어진 각 그대로예요! 변만 길어졌을 뿐」)',
        '<b>★ 저학년 직각 닻</b> — 15° 스냅이라 아이가 손으로 <b>정확히 90에 닿을 수 있다</b>(88°를 짚어도 90으로 스냅). 닿는 순간 코너 ┐ 가 «탁» 하고 나타나고 금속 리벳이 파랗게 빛나며 <b>select 소리</b>가 난다(v2 유지 — 소리로 직각을 알려 주는 장치). <b>이 손맛이 저학년 칸의 전부</b>',
        '<b>★ 퀴즈 계약 강화</b> — v2는 퀴즈에서도 «현재 각과 일치하는 눈금 숫자»를 크게 강조했다. 그러면 4·5번(「이 각은 몇 도일까요?」)은 <b>강조된 숫자를 그냥 읽으면 끝</b>이다. v3는 퀴즈에서 각도 숫자·이동점 강조뿐 아니라 <b>눈금 강조도 끈다</b> — 아이가 스스로 눈금을 읽어야 한다',
        '<b>⚠️ SPEC 내부 모순 기록</b> — §1은 「눈금 숫자 = 30° 간격」인데 §5-10은 「안쪽 눈금 <b>70</b> 강조 실측」을 요구한다. 70은 30의 배수가 아니라 <b>숫자 자체가 그려지지 않는다</b>(v2도 동일). v2 렌더(30° 간격)를 지키고 강조 실측은 60으로 대체 · 하니스에 모순을 명시 기록'],
  ck:['★★ 퀴즈 탭을 눌렀을 때 <b>각이 정상적으로 그려지는지</b> — v2는 여기서 빈 화면이었다(가장 중요)',
      '★★ 미션 중 <b>마우스로 끌어서</b> 각이 따라오는지(전자칠판) — v2는 터치만 됐다',
      '★★ 미션 열었을 때 두 변이 <b>겹쳐 있고</b>(0°), 「두 변을 벌려 봐요」가 화면과 맞는지 — v2는 이미 벌어져 있었다',
      '★ 🔭 를 눌렀을 때 <b>눈금 숫자가 하나도 안 움직이는 것</b>이 눈에 잡히는지 · 변 위 자 눈금이 「길이는 늘었다」로 읽히는지',
      '★ 저학년 15° 스냅 — 아이가 <b>손으로 정확히 90°를 짚을 수 있는지</b>(88°를 짚어도 스냅) · ┐ 가 「탁」 뜨는 손맛 · select 소리가 직각 신호로 읽히는지',
      '아크릴 각도기 반투명·음각 눈금 때깔(전자칠판) · 금속 리벳 광택',
      '드래그 감도 — 무대 어디를 눌러도 각이 따라오는 게 자연스러운지(태블릿·전자칠판)',
      '퀴즈에서 눈금 강조를 껐는데 <b>아이가 눈금을 읽을 수 있는지</b>(너무 어려워지지 않았는지)'] }
];

var KEY = 'klab_v3_g0_review';
var st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ st = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function S(id){ if(!st[id]) st[id] = { j:'wait', ck:[], memo:'' }; return st[id]; }

/* magnet은 2026-07-04 이미 검수 통과 — 기본값 통과로 시드 */
if(!st.magnet) { st.magnet = { j:'ok', ck:[0,1,2], memo:'2026-07-04 검수 통과 (준호: 철가루 대박)' }; save(); }

var list = document.getElementById('list');
var toastEl = document.getElementById('toast');
var filter = 'all';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function render(){
  list.innerHTML = '';
  TOOLS.forEach(function(t, i){
    var s = S(t.id);
    var el = document.createElement('div');
    el.className = 'tool s-' + s.j;
    el.dataset.id = t.id;

    var stat = s.j==='ok' ? '✅ 통과' : s.j==='fix' ? '🔧 수정 요청' : '⬜ 미검수';

    var links = '';
    links += '<a class="lk main" href="'+t.id+'.html" target="_blank" rel="noopener">▶ 도구 열기</a>';
    if(t.links){
      t.links.forEach(function(L){
        links += '<a class="lk" href="'+t.id+'.html'+L[1]+'" target="_blank" rel="noopener">'+L[0]+'</a>';
      });
    } else if(t.grades !== false){
      links += '<a class="lk" href="'+t.id+'.html?grade=low"  target="_blank" rel="noopener">저학년</a>';
      links += '<a class="lk" href="'+t.id+'.html?grade=mid"  target="_blank" rel="noopener">중학년</a>';
      links += '<a class="lk" href="'+t.id+'.html?grade=high" target="_blank" rel="noopener">고학년</a>';
      links += '<a class="lk" href="'+t.id+'.html?mode=mission" target="_blank" rel="noopener">미션</a>';
      links += '<a class="lk" href="'+t.id+'.html?mode=quiz"    target="_blank" rel="noopener">퀴즈</a>';
    }

    var techH = t.tech.length
      ? '<div class="sec"><div class="slab">이 도구의 핵심 장치</div>'
        + t.tech.map(function(x){ return '<div class="tech">'+x+'</div>'; }).join('') + '</div>'
      : '';

    var ckH = t.ck.map(function(c, k){
      var on = s.ck.indexOf(k) >= 0 ? ' checked' : '';
      return '<label class="ck"><input type="checkbox" data-t="'+t.id+'" data-k="'+k+'"'+on+'>'
           + '<span>'+esc(c)+'</span></label>';
    }).join('');

    el.innerHTML =
      '<div class="thead">'
      + '<span class="arw">▶</span>'
      + '<div class="no">'+(i+1)+'</div>'
      + '<div class="tinfo"><div class="tnm">'+t.nm+' <code>'+t.id+'.html</code></div>'
      + '<div class="tds">'+esc(t.ds)+'</div></div>'
      + '<div class="tstat">'+stat+'</div>'
      + '</div>'
      + '<div class="tbody">'
      + '<div class="sec"><div class="slab">실기기에서 열기 (새 탭)</div><div class="links">'+links+'</div></div>'
      + techH
      + '<div class="sec"><div class="slab">검수 항목 '+t.ck.length+'개</div>'+ckH+'</div>'
      + '<div class="sec"><div class="slab">판정</div><div class="judge">'
      +   '<button class="jb'+(s.j==='ok'?' on-ok':'')+'"   data-j="ok"   data-t="'+t.id+'">✅ 통과 — 라이브로</button>'
      +   '<button class="jb'+(s.j==='fix'?' on-fix':'')+'" data-j="fix"  data-t="'+t.id+'">🔧 수정 요청</button>'
      +   '<button class="jb'+(s.j==='wait'?' on-wait':'')+'" data-j="wait" data-t="'+t.id+'">⬜ 미검수</button>'
      + '</div>'
      + '<textarea data-t="'+t.id+'" placeholder="고칠 점·느낌을 적어주세요. 여기 적은 건 「결과 복사」에 그대로 실려요.">'+esc(s.memo)+'</textarea>'
      + '</div>'
      + '</div>';

    list.appendChild(el);
  });
  applyFilter();
  stats();
}

function stats(){
  var ok=0, fix=0, wait=0, ck=0, ckT=0;
  TOOLS.forEach(function(t){
    var s = S(t.id);
    if(s.j==='ok') ok++; else if(s.j==='fix') fix++; else wait++;
    ck += s.ck.length; ckT += t.ck.length;
  });
  var n = TOOLS.length;
  document.getElementById('bOk').style.width  = (ok/n*100)+'%';
  document.getElementById('bFix').style.width = (fix/n*100)+'%';
  document.getElementById('nOk').textContent   = ok;
  document.getElementById('nFix').textContent  = fix;
  document.getElementById('nWait').textContent = wait;
  document.getElementById('nCk').textContent   = ck;
  document.getElementById('nCkT').textContent  = ckT;

  var f = document.getElementById('ftx');
  if(wait === 0 && fix === 0) f.innerHTML = '🎉 <b>16종 전부 통과</b> — 허브 링크 교체하고 라이브 투입할 수 있어요.';
  else if(wait === 0)         f.innerHTML = '검수 완료 — <b>수정 요청 '+fix+'종</b>. 결과를 복사해 베프에게 던지세요.';
  else                        f.innerHTML = '남은 도구 <b>'+wait+'종</b> · 통과 '+ok+' · 수정 요청 '+fix;
}

function applyFilter(){
  Array.prototype.forEach.call(list.children, function(el){
    var s = S(el.dataset.id);
    el.classList.toggle('hide', filter !== 'all' && s.j !== filter);
  });
}

/* ── 이벤트 위임 ────────────────────────────────────────── */
list.addEventListener('click', function(e){
  var head = e.target.closest('.thead');
  if(head){ head.parentElement.classList.toggle('open'); return; }

  var jb = e.target.closest('.jb');
  if(jb){
    var s = S(jb.dataset.t);
    s.j = jb.dataset.j;
    save();
    var card = jb.closest('.tool');
    var wasOpen = card.classList.contains('open');
    render();
    if(wasOpen){
      var re = list.querySelector('[data-id="'+jb.dataset.t+'"]');
      if(re) re.classList.add('open');
    }
    return;
  }
});

list.addEventListener('change', function(e){
  var cb = e.target;
  if(cb.type !== 'checkbox') return;
  var s = S(cb.dataset.t), k = +cb.dataset.k;
  var i = s.ck.indexOf(k);
  if(cb.checked && i < 0) s.ck.push(k);
  if(!cb.checked && i >= 0) s.ck.splice(i, 1);
  save(); stats();
});

list.addEventListener('input', function(e){
  if(e.target.tagName !== 'TEXTAREA') return;
  S(e.target.dataset.t).memo = e.target.value;
  save();
});

document.querySelectorAll('.chip[data-f]').forEach(function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('.chip[data-f]').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on');
    filter = c.dataset.f;
    applyFilter();
  });
});

document.getElementById('expAll').addEventListener('click', function(){
  var anyClosed = Array.prototype.some.call(list.children, function(el){
    return !el.classList.contains('hide') && !el.classList.contains('open');
  });
  Array.prototype.forEach.call(list.children, function(el){
    if(el.classList.contains('hide')) return;
    el.classList.toggle('open', anyClosed);
  });
  this.textContent = anyClosed ? '전부 접기' : '전부 펼치기';
});

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  setTimeout(function(){ toastEl.classList.remove('on'); }, 1900);
}

/* ── 결과 복사 ──────────────────────────────────────────── */
document.getElementById('copy').addEventListener('click', function(){
  var ok = [], fix = [], wait = [];
  TOOLS.forEach(function(t){
    var s = S(t.id);
    if(s.j === 'ok') ok.push(t);
    else if(s.j === 'fix') fix.push(t);
    else wait.push(t);
  });

  var L = [];
  L.push('# 케이랩 v3 · G0 검수 결과');
  L.push('');
  L.push('통과 ' + ok.length + ' · 수정 요청 ' + fix.length + ' · 미검수 ' + wait.length + ' / 총 ' + TOOLS.length);
  L.push('');

  if(ok.length){
    L.push('## ✅ 통과 — 허브 링크 교체 대상');
    ok.forEach(function(t){
      L.push('- **' + t.id + '** (' + t.nm + ')' + (S(t.id).memo ? ' — ' + S(t.id).memo.replace(/\n/g,' / ') : ''));
    });
    L.push('');
  }

  if(fix.length){
    L.push('## 🔧 수정 요청');
    fix.forEach(function(t){
      var s = S(t.id);
      L.push('');
      L.push('### ' + t.id + ' (' + t.nm + ')');
      var miss = t.ck.filter(function(c, k){ return s.ck.indexOf(k) < 0; });
      if(miss.length){
        L.push('체크되지 않은 항목:');
        miss.forEach(function(c){ L.push('- ' + c); });
      }
      if(s.memo) { L.push('준호 메모:'); L.push('> ' + s.memo.replace(/\n/g,'\n> ')); }
    });
    L.push('');
  }

  if(wait.length){
    L.push('## ⬜ 미검수');
    L.push(wait.map(function(t){ return t.id; }).join(' · '));
    L.push('');
  }

  var txt = L.join('\n');
  navigator.clipboard.writeText(txt).then(function(){
    toast('📋 검수 결과를 복사했어요 — 베프에게 붙여넣으세요');
  }).catch(function(){
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('📋 복사 완료'); }
    catch(e){ toast('복사 실패 — 직접 선택해 주세요'); }
    document.body.removeChild(ta);
  });
});

document.getElementById('reset').addEventListener('click', function(){
  if(!confirm('검수 체크·판정·메모를 모두 지웁니다. 계속할까요?')) return;
  st = {};
  st.magnet = { j:'ok', ck:[0,1,2], memo:'2026-07-04 검수 통과 (준호: 철가루 대박)' };
  save(); render(); toast('초기화했어요');
});

render();
</script>
</body>

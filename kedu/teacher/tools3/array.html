<!--
  케이랩 v3 · B트랙 양산 3호 — 곱셈 배열판 (2026-07-13) · 셸 = clock/tenframe/place_value 계보
  SPEC = handoff/klab/designs3/SPEC_array.md (도면=정답)
  v2(engine/tools/array.js 222줄) 콘텐츠 무손실 이식:
    학년칸(저 5×5·동수누가 닻·× 기호 노출 금지·교환/퀴즈 숨김 / 중 9×9·곱셈식·교환·퀴즈 / 고 config 우선)
    미션(저 3종 = 2개씩3줄·5개씩2줄·3개씩4줄 / 중·고 4종 = 곱12·다른 배열·⇄·곱18)
    퀴즈(배열 보고 곱 맞히기) · 상태줄 3형(퀴즈/저 동수누가/중·고 곱셈식)
    와우A(배열 그리드 «자체»를 탭하면 돌아간다 = 교환법칙 · whoosh · 회전 스프링 · 플래시)
  v3 질감: 다크 스튜디오 + 원목 매트, 아크릴 계란판(음각 홈), 유리알 파랑 비드(shape=square면 파랑 칠 나무 큐브).
  v3 신설 — 와우B(🔮 예측 카드: 「한 줄 개수를 1 늘리면 전체는 몇 개 늘까?」
    ① 1개 ② 줄 수만큼 ③ 두 배 → 새 열이 «줄마다 하나씩» 놓이는 걸 목격 → 결과 카드:
    「한 줄 개수 +1 = 줄 수만큼 늘어난다 — 3×5 = 3×4 ＋ 3」. 반복 가능)
    ※ 와우A(교환법칙)와 각도가 다르다: 이쪽은 «1 늘리면 1 는다» 오개념(가법적 사고)을 정면으로 침.
  v2 라이브 결함 2건 수정:
    ① ⇄가 곱을 바꿔버렸다 — v2 swap은 min(cols,maxR)·min(rows,maxC)로 잘라서, 비대칭 상한
       (maxR=3·maxC=9에서 2×9)이면 돌린 뒤 3×2 = 알 18개→6개. 그런데 플래시는 「돌려도 개수는
       그대로!」라고 뜬다 = 교환법칙 도구가 교환법칙을 배신 → 곱이 보존되는 경우에만 ⇄·그리드 탭 허용.
    ② 상한이 좁을 때(maxR=1) 퀴즈가 2줄짜리 배열을 냈다(2+rand*0) — 판이 1줄뿐인데 무대와
       어긋난 문항 → 상한 clamp.
  config: ?grade= & mode= & rows= & cols= & maxR= & maxC= & shape=(dot|square)
-->

<!-- ═══ 순수 로직 (node/jsdom 테스트 대상 · DOM 무의존) ═══ -->
<script>
(function(){
  'use strict';
  /* SPEC §1 — GRADES 전문 보존 */
  var GRADES={
    low:  { modes:['free','mission'],        maxR:5,    maxC:5,    addForm:true,  swap:false },
    mid:  { modes:['free','mission','quiz'], maxR:9,    maxC:9,    addForm:false, swap:true  },
    high: { modes:['free','mission','quiz'], maxR:null, maxC:null, addForm:false, swap:true  }
  };
  var GRADE_LABEL={ low:'저학년', mid:'중학년', high:'고학년' };
  var MODE_LABEL={ free:'자유탐구', mission:'미션', quiz:'퀴즈' };

  function maxRFor(grade,cfg){ return (cfg>=1)?cfg:(GRADES[grade].maxR||10); }
  function maxCFor(grade,cfg){ return (cfg>=1)?cfg:(GRADES[grade].maxC||10); }

  /* 미션 — v2 텍스트·판정 무손실. check(act,rows,cols,mFound)로 시그니처 통일
     ※ 「2개씩 3줄」 = 한 줄 개수(cols) 2 · 줄 수(rows) 3 — 판정식 순서 주의 */
  var LOW_MISSIONS=[
    { text:'한 줄에 <b>2개씩 3줄</b>을 만들어 봐요 — 모두 몇 개? (2 ＋ 2 ＋ 2)',
      check:function(act,r,c,f){ return r===3&&c===2; } },
    { text:'한 줄에 <b>5개씩 2줄</b>을 만들어 봐요 — 5 ＋ 5 = 10!',
      check:function(act,r,c,f){ return r===2&&c===5; } },
    { text:'한 줄에 <b>3개씩 4줄</b>을 만들어 모두 12개! (3 ＋ 3 ＋ 3 ＋ 3)',
      check:function(act,r,c,f){ return r===4&&c===3; } }
  ];
  var FULL_MISSIONS=[
    { text:'곱이 <b>12</b>가 되는 배열을 만들어 봐요!',
      /* ★ 양방향 기록 — 3×4를 찾았으면 4×3도 「찾은 것」. ②가 단순 ⇄로 뚫리지 않게 하는 핵심 */
      check:function(act,r,c,f){ if(r*c===12){ f[r+'x'+c]=1; f[c+'x'+r]=1; return true; } return false; } },
    { text:'곱이 12가 되는 <b>다른 배열</b>도 찾아 봐요! (아까와 줄 수가 달라야 해요)',
      check:function(act,r,c,f){ return r*c===12 && !f[r+'x'+c]; } },
    { text:'<b class="gr">⇄ 가로세로</b> 버튼을 눌러 보세요 — 곱이 그대로인가요? (교환법칙)',
      check:function(act,r,c,f){ return act==='swap'; } },
    { text:'곱이 <b>18</b>이 되는 배열을 만들어 봐요!',
      check:function(act,r,c,f){ return r*c===18; } }
  ];
  function missionsFor(grade,maxR,maxC){
    var pool=(grade==='low')?LOW_MISSIONS:FULL_MISSIONS;
    var f=pool.filter(function(m){
      if(/⇄|교환법칙/.test(m.text)) return !!GRADES[grade].swap;
      if(m.text.indexOf('18')>=0) return maxR*maxC>=18;
      if(m.text.indexOf('12')>=0||/다른 배열/.test(m.text)) return maxR*maxC>=12;
      return true;
    });
    return f.length?f:pool.slice(0,1);
  }

  /* 퀴즈 — v2 로직 그대로, rand 주입으로 순수화 */
  function newQuiz(maxR,maxC,rand){
    rand=rand||Math.random;
    /* ★ v2 결함② 수정: v2는 상한이 좁을 때(maxR=1) 2+rand*0 = 2줄을 냈다 — 판이 1줄뿐인데
       2줄짜리 배열을 묻는, 무대와 어긋난 문항. 상한으로 clamp(최소 1). */
    return { r:Math.max(1,Math.min(2+Math.floor(rand()*Math.min(maxR-1,5)),maxR)),
             c:Math.max(1,Math.min(2+Math.floor(rand()*Math.min(maxC-1,5)),maxC)) };
  }
  function qAnswer(q){ return q.r*q.c; }
  function qQuestion(){ return '이 배열의 곱은 얼마일까요?'; }
  function quizChoices(ans,qR,qC){
    var set={}, out=[ans]; set[ans]=1;
    var near=[ans+qR,ans-qR,ans+qC,ans-qC,ans+1,ans-1,ans+2];
    for(var i=0;i<near.length&&out.length<4;i++){
      var d=near[i]; if(d>1&&!set[d]){ set[d]=1; out.push(d); }
    }
    /* 보기 4개 계약 — 작은 곱(2×2=4 등)에서 near가 겹쳐 모자랄 때 인접 수로 채운다 */
    for(var v=2; out.length<4 && v<=ans+8; v++){ if(!set[v]){ set[v]=1; out.push(v); } }
    out.sort(function(a,b){ return a-b; });
    return out;
  }
  /* 저학년 동수누가 — 「4 ＋ 4 ＋ 4」 (× 기호 절대 노출 금지) */
  function addParts(rows,cols){
    var p=[]; for(var i=0;i<rows;i++) p.push(cols);
    return p.join(' ＋ ');
  }

  var API={ GRADES:GRADES, GRADE_LABEL:GRADE_LABEL, MODE_LABEL:MODE_LABEL,
            maxRFor:maxRFor, maxCFor:maxCFor,
            LOW_MISSIONS:LOW_MISSIONS, FULL_MISSIONS:FULL_MISSIONS, missionsFor:missionsFor,
            newQuiz:newQuiz, qAnswer:qAnswer, qQuestion:qQuestion, quizChoices:quizChoices,
            addParts:addParts };
  if(typeof window!=='undefined') window.ArrCore=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

<!-- ═══ 앱 ═══ -->
<script>
(function(){
  'use strict';
  var AC=window.ArrCore, K3=window.K3;
  var $=function(id){ return document.getElementById(id); };
  document.documentElement.style.setProperty('--noise','url("'+K3.NOISE+'")');

  var Q=new URLSearchParams(location.search);
  var grade=(['low','mid','high'].indexOf(Q.get('grade'))>=0)?Q.get('grade'):'high';
  var locked=!!Q.get('grade');
  function G(){ return AC.GRADES[grade]; }
  var cfgRows=+Q.get('rows')||3, cfgCols=+Q.get('cols')||4;
  var cfgMaxR=+Q.get('maxR')||0, cfgMaxC=+Q.get('maxC')||0;
  var shape=(Q.get('shape')==='square')?'square':'dot';

  var maxR=AC.maxRFor(grade,cfgMaxR), maxC=AC.maxCFor(grade,cfgMaxC);
  var rows=Math.min(cfgRows,maxR), cols=Math.min(cfgCols,maxC);
  var mode=(G().modes.indexOf(Q.get('mode'))>=0)?Q.get('mode'):'free';
  var mStep=0, mDone=false, mLock=false, mFound={};
  var quiz=null, qScore=0, qCount=0, qLock=false;
  var revealing=false, prediction=null;
  var STEP_MS=window.__K3_FAST?60:1500;
  var BEAT_MS=window.__K3_FAST?80:900;

  function snd(n){ K3.sound.play(n); }
  function curMissions(){ return AC.missionsFor(grade,maxR,maxC); }

  /* ── 동작 (v2 무손실) ── */
  function rp(){ if(revealing||rows>=maxR) return; rows++; snd('pop'); render(); checkMission(); }
  function rm(){ if(revealing||rows<=1) return; rows--; snd('pop'); render(); checkMission(); }
  function cp(){ if(revealing||cols>=maxC) return; cols++; snd('pop'); render(); checkMission(); }
  function cm(){ if(revealing||cols<=1) return; cols--; snd('pop'); render(); checkMission(); }
  /* 와우A — 배열을 «그대로» 돌린다: 개수는 그대로, 보는 방향만 바뀐다(교환법칙)
     ★ v2 결함① 수정: v2는 swap에서 min(cols,maxR)·min(rows,maxC)로 «잘랐다». 비대칭 상한
       (maxR=3·maxC=9에서 2×9)이면 돌린 뒤 3×2가 되어 알이 18개→6개로 «사라진다».
       그런데 플래시는 「돌려도 개수는 그대로!」라고 뜬다 — 도구가 가르치려는 것을 도구가 배신한다.
       곱이 보존되지 않는 교환은 애초에 내주지 않는다: 돌릴 수 없으면 ⇄와 그리드 탭을 잠근다. */
  function canSwap(){ return cols<=maxR && rows<=maxC; }
  function swap(){
    if(revealing||!canSwap()) return;
    var t=rows; rows=cols; cols=t;
    snd('whoosh');
    render({ rotate:true, flash:true });
    checkMission('swap');
  }
  function reset(){
    if(revealing) return;
    snd('select');
    rows=Math.min(cfgRows,maxR); cols=Math.min(cfgCols,maxC);
    render(); checkMission();
  }
  function setRC(r,c){   /* 테스트·연출 공용 — render+미션 판정 경유 */
    rows=Math.max(1,Math.min(r,maxR)); cols=Math.max(1,Math.min(c,maxC));
    render(); checkMission();
  }

  /* ── 와우B(v3 신설) — 🔮 「한 줄 개수를 1 늘리면 전체는 몇 개 늘까?」 ── */
  function startReveal(){
    if(revealing) return;
    revealing=true;
    var r=Math.min(3,maxR), c=Math.min(4,maxC-1);   /* 늘릴 칸을 반드시 남긴다 */
    rows=r; cols=c; render();                 /* 무대 세팅(무음): 3줄 × 4개 = 12 */
    setTimeout(function(){
      cols=Math.min(c+1,maxC); snd('pop');
      render({ newCol:cols-1 });              /* 새 열이 «줄마다 하나씩» 놓인다 */
      setTimeout(function(){
        revealing=false;
        var grew=rows;                        /* 늘어난 개수 = 줄 수 */
        var okP=(prediction==='rows');
        K3.cards.result(
          '<h3 style="color:'+(okP?'#0d7a5c':'#B9522F')+'">'+(okP?'🎯 예측 적중!':'🤔 예측과 달랐죠?')+'</h3>'
          +'<p style="font-size:13.5px;line-height:1.75;color:#41546a">'
          +'한 줄 개수를 <b>1개</b> 늘렸는데, 늘어난 알은 <b>'+grew+'개</b>예요. '
          +'새 자리가 <b>줄마다 하나씩</b> 생기니까요.<br>'
          +'그래서 「1 늘리면 1 는다」가 아니라 <b>「1 늘리면 줄 수만큼 는다」</b>.<br>'
          +'<b>'+rows+' × '+cols+' ＝ '+rows+' × '+(cols-1)+' ＋ '+rows+'</b> — 곱셈은 이렇게 «줄 단위»로 자란답니다.</p>',
          [{label:'🔁 다시 보기', value:'again'},{label:'좋아, 계속 탐구', cls:'pri', value:'done'}]
        ).then(function(v){ if(v==='again') startReveal(); });
      }, BEAT_MS+STEP_MS);
    }, BEAT_MS);
  }
  function askPredict(){
    if(revealing) return;
    snd('charge');
    var r=Math.min(3,maxR), c=Math.min(4,maxC-1);
    K3.cards.predict('<b>'+r+'줄</b>에 <b>'+c+'개</b>씩 놓여 있어요(모두 '+(r*c)+'개). '
      +'한 줄 개수를 <b>'+c+'→'+(c+1)+'</b>로 하나만 늘리면, 알은 모두 몇 개가 될까요?',
      [{id:'one',  label:'① '+(r*c+1)+'개 — 하나 늘렸으니 하나 늘어난다'},
       {id:'rows', label:'② '+(r*(c+1))+'개 — 줄마다 하나씩, 줄 수만큼 늘어난다'},
       {id:'dbl',  label:'③ '+(r*c*2)+'개 — 두 배가 된다'}]
    ).then(function(id){ prediction=id; startReveal(); });
  }

  /* ── 빌드 ── */
  function build(){
    var gs=$('gradeSeg');
    if(locked){ gs.style.display='none'; }
    else{
      gs.innerHTML=['low','mid','high'].map(function(g){
        return '<button data-g="'+g+'" class="'+(g===grade?'on':'')+'">'+AC.GRADE_LABEL[g]+'</button>';
      }).join('');
      gs.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){
          if(b.dataset.g===grade)return;
          grade=b.dataset.g; snd('select');
          maxR=AC.maxRFor(grade,cfgMaxR); maxC=AC.maxCFor(grade,cfgMaxC);
          rows=Math.min(rows,maxR); cols=Math.min(cols,maxC);
          if(G().modes.indexOf(mode)<0) mode='free';
          mStep=0; mDone=false; mLock=false; mFound={}; revealing=false;
          if(mode==='quiz'){ qScore=0; qCount=0; quiz=AC.newQuiz(maxR,maxC); }
          build();
        });
      });
    }
    var ms=$('modeSeg');
    ms.innerHTML=G().modes.map(function(m){
      return '<button data-m="'+m+'" class="'+(m===mode?'on':'')+'">'+AC.MODE_LABEL[m]+'</button>';
    }).join('');
    ms.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        if(b.dataset.m===mode)return;
        mode=b.dataset.m; snd('select');
        mStep=0; mDone=false; mLock=false; mFound={}; revealing=false;
        if(mode==='quiz'){ qScore=0; qCount=0; quiz=AC.newQuiz(maxR,maxC); }
        build();
      });
    });

    var bar=$('barSlot');
    if(mode==='mission'){
      var M=curMissions();
      bar.innerHTML=mDone
        ? '<div class="k3bar done">🎉 미션을 모두 해냈어요! 자유탐구에서 마음껏 배열을 바꿔 봐요.</div>'
        : '<div class="k3bar"><span>'+M[mStep].text+'</span><span class="prog">'+(mStep+1)+' / '+M.length+'</span></div>';
    } else if(mode==='quiz'){
      bar.innerHTML='<div class="k3bar"><span>❓ '+AC.qQuestion()+'</span><span class="prog">점수 '+qScore+' / '+qCount+'</span></div>';
    } else bar.innerHTML='';

    var ct=$('ctrlSlot'), s='';
    if(mode!=='quiz'){
      s='<span class="ctrl-lab">'+(G().addForm?'줄 수':'줄(행)')+'</span>'
       +'<button class="ck-btn minus" data-act="rm" style="--c1:#5B9BF0;--c2:#3E7BD4">－</button>'
       +'<button class="ck-btn" data-act="rp" style="--c1:#5B9BF0;--c2:#3E7BD4">＋</button>'
       +'<span class="ctrl-lab">한 줄 개수'+(G().addForm?'':'(열)')+'</span>'
       +'<button class="ck-btn minus" data-act="cm" style="--c1:#FFA75E;--c2:#D97B33">－</button>'
       +'<button class="ck-btn" data-act="cp" style="--c1:#FFA75E;--c2:#D97B33">＋</button>';
      if(G().swap) s+='<button class="ck-btn" data-act="swap" style="--c1:#3EE6B0;--c2:#1F9E75">⇄ 가로세로</button>';
      s+='<button class="ck-btn ghost" data-act="reset" title="처음으로">↺</button>';
      if(mode==='free'&&maxC>=3&&maxR>=2) s+='<button class="ck-btn wow" id="wowBtn">🔮 한 줄만 더 늘리면?</button>';
    } else {
      s=AC.quizChoices(AC.qAnswer(quiz),quiz.r,quiz.c).map(function(v){
        return '<button class="ck-choice" data-v="'+v+'">'+v+'</button>';
      }).join('');
    }
    ct.innerHTML=s;
    var H={ rp:rp, rm:rm, cp:cp, cm:cm, swap:swap, reset:reset };
    ct.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click',function(){ H[b.dataset.act](); });
    });
    var wb=$('wowBtn'); if(wb) wb.addEventListener('click',askPredict);
    ct.querySelectorAll('.ck-choice').forEach(function(b){
      b.addEventListener('click',function(){
        if(qLock)return; qLock=true; qCount++;
        var ans=AC.qAnswer(quiz), okA=(+b.dataset.v===ans);
        if(okA){ qScore++; snd('chime'); K3.toast('🎉 정답! <b>'+ans+'</b>'); }
        else { snd('fail'); K3.toast('🤔 정답은 <b>'+quiz.r+'×'+quiz.c+'='+ans+'</b>!', true); }
        setTimeout(function(){ quiz=AC.newQuiz(maxR,maxC); qLock=false; build(); }, STEP_MS);
      });
    });

    render();
  }

  /* ── 무대 그리기 — 계란판 은유 (SPEC §3 좌표 유지) ── */
  var VBW=900, VBH=440, PADX=80, PADY=50;
  function svgEl(t,a){ var e=document.createElementNS('http://www.w3.org/2000/svg',t); for(var k in a)e.setAttribute(k,a[k]); return e; }

  function defs(){
    var d=svgEl('defs',{});
    d.innerHTML=
      '<filter id="arSh" x="-30%" y="-30%" width="160%" height="160%">'
      +'<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.42"/></filter>'
      +'<radialGradient id="arBead" cx="34%" cy="28%" r="80%">'
      +'<stop offset="0" stop-color="#9CC4FA"/><stop offset=".55" stop-color="#5B9BF0"/><stop offset="1" stop-color="#2E62B8"/></radialGradient>'
      +'<linearGradient id="arWood" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(10)">'
      +'<stop offset="0" stop-color="#7FB2F5"/><stop offset=".55" stop-color="#5B9BF0"/><stop offset="1" stop-color="#3E7BD4"/></linearGradient>'
      +'<linearGradient id="arGloss" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="rgba(255,255,255,0.4)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>';
    return d;
  }

  function render(opts){
    opts=opts||{};
    var desk=$('desk');
    var R=(mode==='quiz')?quiz.r:rows, Co=(mode==='quiz')?quiz.c:cols;
    var canRotate=(mode!=='quiz' && !!G().swap && !revealing && canSwap());   /* 저학년은 그리드 탭 비활성 · 곱이 안 지켜지면 탭도 잠금 */

    var svg=svgEl('svg',{ viewBox:'0 0 '+VBW+' '+VBH, id:'arSvg',
      style:'display:block;width:min(90vw,820px);height:auto;max-height:54vh' });
    svg.appendChild(defs());

    var areaW=VBW-PADX*2, areaH=VBH-PADY*2;
    var s=Math.min(areaW/Co, areaH/R, 86), size=s*0.66;
    var gridW=s*Co, gridH=s*R, x0=(VBW-gridW)/2, y0=(VBH-gridH)/2;

    /* 아크릴 계란판 */
    svg.appendChild(svgEl('rect',{ x:x0-16, y:y0-16, width:gridW+32, height:gridH+32, rx:18,
      fill:'rgba(255,255,255,0.06)', stroke:'rgba(255,255,255,0.26)', 'stroke-width':1.5, filter:'url(#arSh)' }));
    svg.appendChild(svgEl('rect',{ x:x0-9, y:y0-13, width:(gridW+32)*0.4, height:9, rx:5,
      fill:'url(#arGloss)', 'pointer-events':'none' }));

    var g=svgEl('g',{ class:'ar-grid'+(opts.rotate?' ar-rotate':'')+(canRotate?' ar-tappable':'') });
    for(var r=0;r<R;r++){
      for(var c=0;c<Co;c++){
        var cx=x0+c*s+s/2, cy=y0+r*s+s/2;
        /* 음각 홈 — 알이 놓이는 자리가 «파여 있다» */
        g.appendChild(svgEl('circle',{ cx:cx, cy:cy+1.5, r:size/2+4,
          fill:'rgba(0,0,0,0.22)', 'pointer-events':'none' }));
        g.appendChild(svgEl('path',{ d:'M '+(cx-(size/2+4))+' '+(cy+1.5)+' A '+(size/2+4)+' '+(size/2+4)+' 0 0 0 '+(cx+(size/2+4))+' '+(cy+1.5),
          fill:'none', stroke:'rgba(255,255,255,0.14)', 'stroke-width':1.4, 'pointer-events':'none' }));
        var isNew=(opts.newCol!=null && c===opts.newCol);
        var cls='ar-bead'+(isNew?' ar-new':'');
        if(shape==='square'){
          g.appendChild(svgEl('rect',{ x:cx-size/2, y:cy-size/2, width:size, height:size, rx:8,
            fill:'url(#arWood)', stroke:'rgba(255,255,255,0.55)', 'stroke-width':2.5,
            class:cls, 'data-cell':(r*Co+c) }));
        } else {
          g.appendChild(svgEl('circle',{ cx:cx, cy:cy, r:size/2,
            fill:'url(#arBead)', stroke:'rgba(15,50,100,0.55)', 'stroke-width':2,
            class:cls, 'data-cell':(r*Co+c) }));
          g.appendChild(svgEl('ellipse',{ cx:cx-size*0.14, cy:cy-size*0.17, rx:size*0.14, ry:size*0.09,
            fill:'rgba(255,255,255,0.55)', 'pointer-events':'none', class:(isNew?'ar-new':'') }));
        }
      }
    }
    svg.appendChild(g);

    /* 와우A 마법모먼트 — 돌려도 개수는 그대로 (v2 문구·표기 그대로: 스왑 «후» rows/cols 기준) */
    if(opts.flash){
      var fl=svgEl('text',{ x:VBW/2, y:30, 'text-anchor':'middle',
        'font-family':'var(--kedu-title)', 'font-size':26, 'font-weight':800,
        fill:'#BCA7FF', class:'ar-flash' });
      fl.textContent='돌려도 개수는 그대로! '+cols+' × '+rows+' ＝ '+rows+' × '+cols+' ＝ '+(rows*cols)+' (교환법칙)';
      svg.appendChild(fl);
    }

    desk.innerHTML=''; desk.appendChild(svg);
    if(canRotate) g.addEventListener('click',function(){ swap(); });

    updateStatus();
    updateButtons();
  }

  function updateStatus(){
    var st=$('statusRow');
    if(mode==='quiz'){
      st.innerHTML='<div class="timeread"><span class="b">'+quiz.r+'</span><span class="u"> 줄 × 한 줄 </span>'
        +'<span class="b">'+quiz.c+'</span><span class="u">개 ＝ </span><span class="q">?</span></div>'
        +'<div class="hint">아래에서 답을 골라 누르세요</div>';
      return;
    }
    if(G().addForm){
      /* ★ 저학년 묶어세기 닻 — × 기호 없이 동수누가 덧셈식 */
      st.innerHTML='<div class="timeread"><span class="u">한 줄에 </span><span class="o">'+cols+'</span>'
        +'<span class="u">개씩 </span><span class="b">'+rows+'</span><span class="u">줄</span></div>'
        +'<div class="timeread" style="font-size:min(4.4vh,30px);margin-top:4px">'
        +'<span class="g">'+AC.addParts(rows,cols)+' ＝ '+(rows*cols)+'</span></div>'
        +'<div class="hint"><b>'+cols+'</b>씩 <b>'+rows+'</b>묶음 = 모두 <b>'+(rows*cols)+'</b>개'
        +'<br><span class="grabline">✋ ＋－로 줄과 한 줄 개수를 바꿔 봐요</span></div>';
      return;
    }
    st.innerHTML='<div class="timeread"><span class="b">'+rows+'</span><span class="u"> 줄 × 한 줄 </span>'
      +'<span class="o">'+cols+'</span><span class="u">개 ＝ </span>'
      +'<span class="u">'+rows+' × '+cols+' ＝ </span><span class="g">'+(rows*cols)+'</span></div>'
      +'<div class="hint"><span class="grabline">✋ 배열을 그대로 누르면 가로세로가 돌아가요 — 곱은 그대로일까요?</span></div>';
  }

  function updateButtons(){
    var ct=$('ctrlSlot');
    var b=function(a){ return ct.querySelector('[data-act="'+a+'"]'); };
    if(b('rp')) b('rp').disabled=revealing||rows>=maxR;
    if(b('rm')) b('rm').disabled=revealing||rows<=1;
    if(b('cp')) b('cp').disabled=revealing||cols>=maxC;
    if(b('cm')) b('cm').disabled=revealing||cols<=1;
    if(b('swap')) b('swap').disabled=revealing||!canSwap();
    if(b('reset')) b('reset').disabled=revealing;
    var wb=$('wowBtn'); if(wb) wb.disabled=revealing;
  }

  function checkMission(act){
    if(mode!=='mission'||mDone||mLock) return;
    var M=curMissions();
    if(M[mStep].check(act,rows,cols,mFound)){
      mLock=true; snd('chime');
      K3.toast('🎉 참 잘했어요!');
      setTimeout(function(){
        mLock=false;
        /* v2 사양 — 미션 단계 전환 시 배열 리셋 없음(②가 ①의 상태에서 이어진다) */
        if(mStep<curMissions().length-1) mStep++;
        else mDone=true;
        build();
      }, STEP_MS);
    }
  }

  $('sndBtn').addEventListener('click',function(){
    K3.sound.setOn(!K3.sound.on);
    this.textContent=K3.sound.on?'🔊':'🔇';
    this.classList.toggle('off',!K3.sound.on);
    if(K3.sound.on)snd('select');
  });

  if(mode==='quiz') quiz=AC.newQuiz(maxR,maxC);
  build();

  window.ArrApp={
    get grade(){return grade;}, get mode(){return mode;}, get rows(){return rows;}, get cols(){return cols;},
    get maxR(){return maxR;}, get maxC(){return maxC;}, get shape(){return shape;},
    get product(){return rows*cols;}, get revealing(){return revealing;},
    get mStep(){return mStep;}, get mDone(){return mDone;}, get mFound(){return mFound;},
    get qScore(){return qScore;}, get qCount(){return qCount;}, get quiz(){return quiz;},
    swap:swap, setRC:setRC, rp:rp, rm:rm, cp:cp, cm:cm, reset:reset, build:build,
    askPredict:askPredict, startReveal:startReveal,
    _set:function(o){ if(o.prediction!==undefined) prediction=o.prediction; }
  };
})();
</script>
<script src="/kedu_back.js"></script>
</body>

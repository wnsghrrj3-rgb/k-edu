<!--
  케이랩 v3 · A트랙 — 전개도 (2026-07-12 · 페이블)
  v2 engine/tools/net.js(300줄 · 와우 main 4e106f3) 전면 재건 · r185 + klab3 코어.
  스튜디오 5요소: ① 다크 스튜디오 + 원목 책상 위 마분지 공작 전개도
    ② 실물 질감(색지 붙인 두꺼운 마분지 · 섬유 노이즈 · 옆면 크라프트 두께 · 접힘 종이 그림자)
    ③ 직접 조작(궤도 회전 · 슬라이더/버튼 접기 · 면 탭=이름·마주보는 면)
    ④ 즉각 반응(힌지 접힘 이징 · 불량 완성 시 겹친 면 빨강 발광 펄스)
    ⑤ 와우 = «불량 전개도» — 면이 6개여도 정육면체가 안 됨(오개념 반증 · mid/high · v2 무손실)
      + 도전 진입 시 🔮 예측 카드(된다/안 된다 — v2 status 문구의 카드 승격)
  v2 무손실: 학년칸(저=자유·미션2 / 중=+퀴즈3 / 고=미션4·퀴즈5)·미션 4(접기→펼치기→중간 관찰→접고 돌리기)
    ·퀴즈 풀 5(중=기본 3문 지정)·불량 전개도 와우 서사·마법 1회 가드·복귀 후 첫 완성=초록 해소
  기하 수정(실부팅 하니스가 v2 라이브 버그 실측): v2는 뚜껑 힌지가 뒷면 중앙선 → 접으면 천장이 아닌
    상자 속 중간 높이. v3 = 정상 뚜껑은 뒷면 꼭대기 모서리(천장 완성) / 불량은 앞면 오른쪽 모서리
    (접으면 오른쪽 면과 겹침·윗면 빔 — 펼친 모양부터 다른 진짜 불량 배치).
    ·상태줄 문구 전부·6면 색/이름·config(?grade/?mode/?fold).
  config: ?grade=low|mid|high(지정 시 잠금) · ?mode=free|mission|quiz · ?fold=0~1
-->

<!-- ═══ 순수 로직 (window.NetSim · node 테스트 대상 · DOM/THREE 무의존) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 6면 색·이름 (v2 무손실) ── */
  var FACE=['#E64980','#1565C0','#F59F00','#0CA678','#7048E8','#FF8A3D'];
  var FACE_NAME=['분홍(바닥)','파랑(앞)','노랑(뒤)','초록(오른쪽)','보라(왼쪽)','주황(위)'];
  var FACE_PAIR=[5,2,1,4,3,0]; /* 마주보는 면: 바닥↔위 · 앞↔뒤 · 오른쪽↔왼쪽 */

  /* ── 학년 칸 (v2 GRADES 무손실) ── */
  var GRADES={
    low:  { modes:['free','mission'],        quiz:false, missionN:2, quizN:0 },
    mid:  { modes:['free','mission','quiz'], quiz:true,  missionN:3, quizN:3 },
    high: { modes:['free','mission','quiz'], quiz:true,  missionN:4, quizN:5 }
  };

  /* ── 접기 기하 (v2 applyFold 이식 + 힌지 버그 수정) ──
     v2 라이브 버그 실측(실부팅 하니스): 뚜껑 힌지가 뒷면 «중앙선»에 붙어 있어
     접으면 뚜껑이 천장이 아닌 상자 속 중간 높이에 걸림. v3 수정 설계:
     · 정상 = 뒷면 꼭대기 모서리 힌지(x축 접힘) → 접으면 천장을 딱 덮음
     · 불량 = 앞면 «오른쪽 모서리» 힌지(z축 접힘) → 접으면 오른쪽 면과 겹침·윗면 빔
       (펼친 모양부터 다르게 보이는 진짜 불량 전개도 — v2 반증 서사 무손실) */
  function clamp01(v){ return Math.max(0, Math.min(v, 1)); }
  function foldAngle(t){ return clamp01(t)*Math.PI/2; }
  function topHinge(badNet){
    return badNet
      ? { parent:'front', axis:'z', overlapFace:3 }   /* 오른쪽(초록) 면과 겹침 */
      : { parent:'back',  axis:'x', overlapFace:null };
  }
  /* 불량 겹침 판정 — 빨강 발광 게이트 */
  function overlapNow(badNet,t){ return !!badNet && t>=0.9; }
  /* 도전 버튼 게이팅 (v2 무손실: 자유탐구 + 중·고만) */
  function canChallenge(grade,mode){ return mode==='free' && grade!=='low'; }

  function createSim(grade, opts){
    grade=(['low','mid','high'].indexOf(grade)>=0)?grade:'high';
    opts=opts||{};
    var sim={};
    sim.grade=grade;
    sim.G=function(){ return GRADES[sim.grade]; };

    sim.state={ t: clamp01(typeof opts.fold==='number'?opts.fold:0),
      rotated:false, badNet:false, magicShown:false, magicArmed:false, pred:null };

    sim.setFold=function(v){
      var st=sim.state;
      st.t=clamp01(v);
      if(st.t<0.5) st.magicShown=false;   /* v2 무손실: 반쯤 펼치면 마법 재무장 */
      return st.t;
    };
    sim.foldDone=function(){ return sim.state.t>=0.98; };
    sim.flat=function(){ return sim.state.t<=0.02; };

    /* 와우 ④ 전개도 전환 (v2 badnet/goodnet 무손실) */
    sim.toggleNet=function(bad){
      var st=sim.state;
      st.badNet=!!bad; st.magicShown=false;
      st.magicArmed=!bad;          /* 복귀 시에만 무장 → 다음 정상 완성에 해소 배너 1회 */
      if(bad) st.pred=null;        /* 도전마다 새 예측 */
      st.t=0; st.rotated=false;
      return st.badNet;
    };
    sim.setPred=function(v){ sim.state.pred=(v==='yes'||v==='no')?v:null; return sim.state.pred; };
    sim.predLine=function(){
      if(sim.state.pred==='yes') return '<br>🔮 「된다」고 예측했지만 — 예측이 빗나갔어요!';
      if(sim.state.pred==='no')  return '<br>🔮 「안 된다」 — 네 예측이 딱 맞았어요!';
      return '';
    };

    /* 접기 완성 마법 판정 (v2 fireMagic 무손실 · free 전용 · 1회 가드) */
    sim.fireMagic=function(mode){
      var st=sim.state;
      if(mode!=='free'||st.magicShown||st.t<0.98) return null;
      if(st.badNet){ st.magicShown=true; return 'bad'; }
      if(st.magicArmed){ st.magicShown=true; st.magicArmed=false; return 'good'; }
      return null;
    };

    /* 상태줄 (v2 문구 무손실) */
    sim.statusText=function(mode){
      var st=sim.state, pct=Math.round(st.t*100);
      if(mode==='quiz') return { warn:false, text:'전개도를 보고 아래에서 선택하세요!' };
      if(st.badNet){
        if(st.t<0.02) return { warn:true, text:'이 전개도도 정육면체가 될까요? 🤔' };
        if(st.t>0.98) return { warn:true, hold:true, text:'윗면이 비고 면이 겹쳤어요!' };
        return { warn:true, text:'접는 중 '+pct+'%' };
      }
      var doneMsg=(!sim.G().quiz)?'접으니 상자(정육면체)가 됐어요! ✅':'정육면체 완성! ✅';
      if(st.t<0.02) return { warn:false, text:'평면 전개도' };
      if(st.t>0.98) return { warn:false, text:doneMsg };
      return { warn:false, text:'접는 중 '+pct+'%' };
    };

    /* 면 탭 문구 — 접힌 상태면 마주보는 면 안내 */
    sim.faceTapText=function(i){
      if(sim.foldDone()) return FACE_NAME[i]+' — 마주보는 면은 <b>'+FACE_NAME[FACE_PAIR[i]]+'</b>';
      return FACE_NAME[i]+' 면';
    };

    /* 미션 (v2 문구·판정 무손실 — 학년칸 missionN slice) */
    var MISSIONS=[
      { text:'슬라이더나 <b>접기 ▶</b> 버튼으로 전개도를 완전히 <b>접어</b> 정육면체를 만들어 봐요!',
        check:function(st){ return st.t>=0.98; } },
      { text:'이번엔 <b>◀ 펼치기</b>로 다시 평면 전개도로 펼쳐 봐요!',
        check:function(st){ return st.t<=0.02; } },
      { text:'슬라이더를 중간(50%)쯤에 놓고, <b>면이 접히는 모습</b>을 관찰해 봐요!',
        check:function(st){ return st.t>=0.35 && st.t<=0.65; } },
      { text:'완전히 접은 뒤, <b>끌어서 돌려</b> 6면을 모두 확인해 봐요!',
        check:function(st){ return st.t>=0.98 && st.rotated; } }
    ];
    sim.mStep=0; sim.mDone=false;
    sim.missionList=function(){ return MISSIONS.slice(0, sim.G().missionN); };
    sim.missionStart=function(){
      sim.mStep=0; sim.mDone=false;
      sim.state.t=0; sim.state.rotated=false;
      sim.state.badNet=false; sim.state.magicShown=false; sim.state.magicArmed=false;
    };
    sim.missionCheck=function(){
      if(sim.mDone) return {act:'none'};
      var M=sim.missionList();
      if(!M[sim.mStep].check(sim.state)) return {act:'none'};
      if(sim.mStep<M.length-1){
        sim.mStep++;
        /* v2 무손실: M2(펼치기) 진입 시 접힌 상태 유지 지시 */
        return {act:'next', step:sim.mStep, foldTo:(sim.mStep===1?1:null)};
      }
      sim.mDone=true;
      return {act:'done'};
    };

    /* 퀴즈 풀 (v2 무손실 — 중학년=기본 개념 3문 지정, 고학년=전체 5문) */
    var QUIZ_POOL=[
      { q:'전개도를 접으면 어떤 입체가 될까요?', answer:'정육면체', choices:['직육면체','정육면체','삼각형','원기둥'] },
      { q:'정육면체의 면은 몇 개인가요?', answer:'6개', choices:['4개','5개','6개','8개'] },
      { q:'정육면체에서 마주보는 면은 몇 쌍인가요?', answer:'3쌍', choices:['1쌍','2쌍','3쌍','4쌍'] },
      { q:'전개도에서 면의 수는?', answer:'6개', choices:['4개','5개','6개','7개'] },
      { q:'정육면체의 꼭짓점은 몇 개인가요?', answer:'8개', choices:['6개','7개','8개','12개'] }
    ];
    sim.quizPool=function(){
      return (sim.grade==='mid') ? [QUIZ_POOL[0],QUIZ_POOL[1],QUIZ_POOL[3]] : QUIZ_POOL.slice();
    };
    /* 무반복 순환 셔플 (v3 표준 — rand 주입 순수화) */
    sim.newQuiz=function(rand){
      rand=rand||Math.random;
      var list=sim.quizPool().slice();
      for(var i=list.length-1;i>0;i--){ var j=Math.floor(rand()*(i+1)); var tmp=list[i]; list[i]=list[j]; list[j]=tmp; }
      return list;
    };

    return sim;
  }

  var API={ GRADES:GRADES, FACE:FACE, FACE_NAME:FACE_NAME, FACE_PAIR:FACE_PAIR,
    clamp01:clamp01, foldAngle:foldAngle, topHinge:topHinge, overlapNow:overlapNow,
    canChallenge:canChallenge, createSim:createSim };
  if(typeof window!=='undefined') window.NetSim=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

<script type="importmap">

<script type="module">
import { THREE, initScene, makeMaterials, makeStage, canvasTexture } from '/kedu/teacher/engine3/klab3-core.js';

const Sim = window.NetSim;
const K3 = window.K3;
const T = ms => (window.__K3_FAST ? 60 : ms);

/* ── config (v2 무손실) ── */
const Q = new URLSearchParams(location.search);
const lockedGrade = ['low','mid','high'].includes(Q.get('grade'));
const cfgFold = parseFloat(Q.get('fold'));
const sim = Sim.createSim(lockedGrade ? Q.get('grade') : 'high',
  { fold: isNaN(cfgFold) ? 0 : cfgFold });
let mode = 'free';
{
  const m = Q.get('mode');
  if (sim.G().modes.includes(m)) mode = m;
}
let target = sim.state.t;
let qList = [], qIdx = 0, qScore = 0, qCount = 0, qLock = false;

/* ── 씬 ── */
const app = initScene(document.getElementById('stage'), {
  camPos: [0.55, 0.9, 1.5], target: [0, 0.16, -0.08], fov: 42,
  minDist: 0.55, maxDist: 2.8, maxPolar: 1.42
});
const { renderer, scene, camera, controls } = app;
makeMaterials();
makeStage(scene, { deskStyle: 'wood' });

/* ═══════════ 마분지 전개도 (색지 붙인 두꺼운 종이) ═══════════ */
const S = 0.34, TH = 0.012;
const KRAFT = '#C9A876';
function paperTex(tint, kraftSide) {
  return canvasTexture(256, 256, g => {
    g.fillStyle = kraftSide ? KRAFT : tint; g.fillRect(0, 0, 256, 256);
    /* 종이 섬유 */
    for (let i = 0; i < 1400; i++) {
      const a = Math.random();
      g.fillStyle = a > 0.5 ? `rgba(255,255,255,${Math.random() * 0.10})`
                            : `rgba(70,50,28,${Math.random() * 0.08})`;
      g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1);
    }
    /* 색지 가장자리 살짝 눌린 자국 */
    g.strokeStyle = 'rgba(40,26,12,0.18)'; g.lineWidth = 5;
    g.strokeRect(3, 3, 250, 250);
  });
}
function faceMats(hex) {
  const kraft = new THREE.MeshStandardMaterial({ map: paperTex(null, true), roughness: 0.86, metalness: 0 });
  const color = new THREE.MeshStandardMaterial({ map: paperTex(hex, false), roughness: 0.78, metalness: 0, envMapIntensity: 0.45 });
  /* BoxGeometry 면 순서: px nx py ny pz nz — 윗면만 색지, 나머지 크라프트 */
  return [kraft, kraft, color, kraft, kraft, kraft];
}
function faceBox(i) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(S, TH, S), faceMats(Sim.FACE[i]));
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData.faceIdx = i;
  return mesh;
}
const Y0 = TH / 2 + 0.001;
const root = new THREE.Group();
root.position.y = Y0;
scene.add(root);

const faces = [];                       /* [바닥,앞,뒤,오른쪽,왼쪽,위] */
const bottom = faceBox(0); root.add(bottom); faces[0] = bottom;
function hinge(px, pz, parent) { const g = new THREE.Group(); g.position.set(px, 0, pz); (parent || root).add(g); return g; }
const pFront = hinge(0, S / 2);  const fFront = faceBox(1); fFront.position.set(0, 0, S / 2);  pFront.add(fFront); faces[1] = fFront;
const pBack  = hinge(0, -S / 2); const fBack  = faceBox(2); fBack.position.set(0, 0, -S / 2);  pBack.add(fBack);  faces[2] = fBack;
const pRight = hinge(S / 2, 0);  const fRight = faceBox(3); fRight.position.set(S / 2, 0, 0);  pRight.add(fRight); faces[3] = fRight;
const pLeft  = hinge(-S / 2, 0); const fLeft  = faceBox(4); fLeft.position.set(-S / 2, 0, 0);  pLeft.add(fLeft);  faces[4] = fLeft;
const pTop   = new THREE.Group();
const fTop = faceBox(5); pTop.add(fTop); faces[5] = fTop;

/* 힌지 자리 (v2 applyNetShape 계승 — §순수 로직 topHinge 도면) */
function applyNetShape() {
  const h = Sim.topHinge(sim.state.badNet);
  pTop.rotation.set(0, 0, 0);
  if (h.parent === 'back') {          /* 정상: 뒷면 꼭대기 모서리 · x축 접힘 */
    pBack.add(pTop);
    pTop.position.set(0, 0, -S);
    fTop.position.set(0, 0.004, -S / 2);
  } else {                            /* 불량: 앞면 오른쪽 모서리 · z축 접힘 */
    pFront.add(pTop);
    pTop.position.set(S / 2, 0.006, S / 2);
    fTop.position.set(S / 2, 0, 0);
  }
}
/* 접힘 (v2 applyFold 계승) */
function applyFold() {
  const a = Sim.foldAngle(sim.state.t);
  pFront.rotation.x = -a; pBack.rotation.x = a;
  pRight.rotation.z = a;  pLeft.rotation.z = -a;
  if (Sim.topHinge(sim.state.badNet).axis === 'x') pTop.rotation.x = a;
  else pTop.rotation.z = a;
}
applyNetShape(); applyFold();

/* 불량 겹침 빨강 발광 (겹치는 두 면 = 뚜껑·오른쪽) */
const glowMats = [...fTop.material, ...fRight.material];
let glowOn = false;
function setGlow(v) {
  glowOn = v;
  if (!v) glowMats.forEach(m => { m.emissive.setHex(0x000000); m.emissiveIntensity = 0; });
}

/* ═══════════ UI ═══════════ */
const $ = id => document.getElementById(id);
const hudL = $('hudL'), ctrls = $('ctrls'), mbar = $('mbar'), choicesEl = $('choices'), statusEl = $('status');
let hintHidden = false;
function hideHint() { if (!hintHidden) { hintHidden = true; $('hint').classList.add('hide'); } }

const MODE_NM = { free: '🔭 자유탐구', mission: '🎯 미션', quiz: '❓ 퀴즈' };
const GRADE_NM = { low: '🌱 저학년', mid: '🌿 중학년', high: '🌳 고학년' };

function renderHUD() {
  let h = '';
  if (!lockedGrade) {
    h += '<div class="nt-seg">' + ['low', 'mid', 'high'].map(g =>
      `<button data-g="${g}" class="${sim.grade === g ? 'on' : ''}">${GRADE_NM[g]}</button>`).join('') + '</div>';
  }
  h += '<div class="nt-seg">' + sim.G().modes.map(m =>
    `<button data-m="${m}" class="${mode === m ? 'on' : ''}">${MODE_NM[m]}</button>`).join('') + '</div>';
  hudL.innerHTML = h;
  hudL.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => setGrade(b.dataset.g)));
  hudL.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
}

function renderCtrls() {
  if (mode === 'quiz') { ctrls.style.display = 'none'; return; }
  ctrls.style.display = '';
  let h = '<button class="k3-btn" data-a="unfold">◀ 펼치기</button>';
  h += `<div class="nt-sliderow"><label>접기 정도</label><input class="nt-slider" id="foldSlider" type="range" min="0" max="100" value="${Math.round(sim.state.t * 100)}"></div>`;
  h += '<button class="k3-btn fire" data-a="fold">접기 ▶</button>';
  if (Sim.canChallenge(sim.grade, mode)) {
    h += sim.state.badNet
      ? '<button class="k3-btn accent" data-a="goodnet">✅ 바른 전개도로</button>'
      : '<button class="k3-btn accent" data-a="badnet">🔮 다른 전개도 도전</button>';
  }
  h += '<button class="k3-btn" data-a="reset">↺ 처음으로</button>';
  ctrls.innerHTML = h;
  ctrls.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => act(b.dataset.a)));
  const sl = $('foldSlider');
  if (sl) sl.addEventListener('input', () => {
    hideHint();
    target = (+sl.value) / 100;
    sim.setFold(target);           /* 즉시 반영 (v2 무손실) — 이징은 표시상 동일점 */
    applyFold();
    missionDirty = true;
    renderStatus();
  });
}

function renderBar() {
  if (mode === 'mission') {
    mbar.style.display = '';
    const M = sim.missionList();
    mbar.innerHTML = sim.mDone
      ? '<b>🎉 미션 완주!</b> 자유탐구에서 마음껏 접어 봐요<div class="st">완료 ' + M.length + ' / ' + M.length + '</div>'
      : M[sim.mStep].text + `<div class="st">미션 ${sim.mStep + 1} / ${M.length}</div>`;
  } else if (mode === 'quiz') {
    mbar.style.display = '';
    mbar.innerHTML = `${qList[qIdx].q}<div class="st">점수 ${qScore} / ${qCount}</div>`;
  } else mbar.style.display = 'none';
}

/* 상태줄 (v2 문구 무손실 — 퀴즈에선 무대 안내만) */
function renderStatus() {
  const s = sim.statusText(mode);
  statusEl.innerHTML = `<div class="card${s.warn ? ' warnc' : ''}">${s.hold ? '<span class="hold">' + s.text + '</span>' : s.text}</div>`;
  const st = $('stage');
  st.dataset.fold = sim.state.t.toFixed(2);
  st.dataset.badnet = sim.state.badNet ? '1' : '0';
  st.dataset.overlap = Sim.overlapNow(sim.state.badNet, sim.state.t) ? '1' : '0';
}

function renderQuiz() {
  if (mode !== 'quiz') { choicesEl.style.display = 'none'; return; }
  choicesEl.style.display = '';
  const q = qList[qIdx];
  const order = q.choices.slice().sort(() => Math.random() - 0.5);
  choicesEl.innerHTML = order.map(c => `<button data-v="${c}">${c}</button>`).join('');
  choicesEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    if (qLock) return; qLock = true;
    const ok = b.dataset.v === String(q.answer);
    qCount++; if (ok) qScore++;
    K3.sound.play(ok ? 'chime' : 'fail');
    K3.toast(ok ? '🎉 정답! ' + q.answer : '아쉬워요 — 정답은 「' + q.answer + '」', !ok, T(1300));
    setTimeout(() => {
      qIdx++; if (qIdx >= qList.length) shuffleQuiz();
      qLock = false; renderAll();
    }, T(1450));
  }));
}
function shuffleQuiz() {
  qList = sim.newQuiz(Math.random);
  qIdx = 0; qScore = 0; qCount = 0; qLock = false;
}

function renderAll() { renderHUD(); renderCtrls(); renderBar(); renderQuiz(); renderStatus(); }

/* ── 조작 ── */
let missionDirty = false;
function act(a) {
  hideHint();
  if (a === 'fold') { target = 1; K3.sound.play('whoosh'); missionDirty = true; }
  else if (a === 'unfold') { target = 0; K3.sound.play('select'); missionDirty = true; }
  else if (a === 'badnet' || a === 'goodnet') {
    const bad = (a === 'badnet');
    sim.toggleNet(bad); target = 0;
    setGlow(false); applyNetShape(); applyFold();
    K3.sound.play('select');
    renderCtrls(); renderStatus();
    if (bad) {
      /* 🔮 예측 카드 (v2 status 문구의 카드 승격 — 선택 즉시 저장 = light 교훈) */
      K3.cards.predict('이 전개도도 정육면체가 될까요?',
        [{ id: 'yes', label: '🙆 정육면체가 된다' }, { id: 'no', label: '🙅 안 된다' }])
        .then(v => { sim.setPred(v); K3.sound.play('charge'); });
    }
    return;
  }
  else if (a === 'reset') {
    target = 0; sim.setFold(0);
    sim.state.rotated = false;
    if (sim.state.badNet) { sim.toggleNet(false); sim.state.magicArmed = false; }
    setGlow(false); applyNetShape(); applyFold();
    K3.sound.play('tap');
    missionDirty = true;   /* 리셋=펼치기 행동 — M2 판정 포함 */
    renderCtrls();
  }
  renderStatus();
}

/* 면 탭 (직접 조작 — 이름·마주보는 면) */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downXY = null;
function tapFace(i) {
  hideHint();
  if (mode === 'quiz') return;
  faces[i].userData.tapT = 1;
  K3.sound.play('tap');
  K3.toast(sim.faceTapText(i), false, T(1800));
}
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX || 0, e.clientY || 0]; });
renderer.domElement.addEventListener('pointermove', e => {
  if (!downXY) return;
  const moved = Math.hypot((e.clientX || 0) - downXY[0], (e.clientY || 0) - downXY[1]);
  if (moved > 6 && sim.foldDone() && !sim.state.rotated) {
    sim.state.rotated = true;          /* M4: 접은 채 돌리기 (v2 무손실) */
    missionDirty = true;
  }
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot((e.clientX || 0) - downXY[0], (e.clientY || 0) - downXY[1]);
  downXY = null;
  if (moved > 8) return;
  ptr.x = ((e.clientX || 0) / innerWidth) * 2 - 1;
  ptr.y = -((e.clientY || 0) / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(faces, false)[0];
  if (hit) tapFace(hit.object.userData.faceIdx);
});
renderer.domElement.addEventListener('pointerdown', hideHint, { once: true });

function missionTick() {
  if (mode !== 'mission') return;
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  if (r.foldTo != null) { target = r.foldTo; sim.setFold(r.foldTo); applyFold(); }
  setTimeout(() => renderAll(), T(1300));
}

function fireMagicNow() {
  const kind = sim.fireMagic(mode);
  if (!kind) return;
  if (kind === 'bad') {
    K3.sound.play('fail');
    K3.toast('면이 <b>6개</b>인데도 정육면체가 <b>안 돼요!</b> 🤔<br>한 면이 안쪽으로 겹치고 윗면이 뻥 뚫렸어요 — 면이 6개라고 다 정육면체가 되는 건 아니에요'
      + sim.predLine(), true, T(4200));
  } else {
    K3.sound.play('chime'); K3.sound.play('ting');
    K3.toast('이번엔 <b>딱 맞는 전개도!</b> ✨<br>빈틈도 겹침도 없이 정육면체가 됐어요', false, T(2800));
  }
}

function setGrade(g) {
  sim.grade = g;
  if (!sim.G().modes.includes(mode)) mode = 'free';
  sim.missionStart(); target = 0;
  sim.state.pred = null;
  setGlow(false); applyNetShape(); applyFold();
  if (mode === 'quiz') shuffleQuiz();
  renderAll();
}
function setMode(m) {
  mode = m;
  sim.missionStart(); target = 0;
  sim.state.pred = null;
  setGlow(false); applyNetShape(); applyFold();
  if (m === 'quiz') shuffleQuiz();
  renderAll();
}

/* ═══════════ 루프 ═══════════ */
const clock = new THREE.Clock();
const FASTX = window.__K3_FAST ? 12 : 1;
let elapsed = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()) * FASTX;
  elapsed += dt;

  /* 접힘 이징 (v2 무손실) */
  if (Math.abs(target - sim.state.t) > 0.004) {
    sim.setFold(sim.state.t + (target - sim.state.t) * Math.min(1, dt * 7.2));
    if (Math.abs(target - sim.state.t) <= 0.004) sim.setFold(target);
    applyFold();
    const sl = $('foldSlider');
    if (sl) sl.value = Math.round(sim.state.t * 100);
    renderStatus();
  } else if (missionDirty) {
    missionDirty = false;
    missionTick();
    if (mode === 'free') fireMagicNow();
  }
  if (mode === 'free' && sim.state.t >= 0.98) fireMagicNow();

  /* 불량 겹침 빨강 발광 펄스 */
  const ov = Sim.overlapNow(sim.state.badNet, sim.state.t);
  if (ov) {
    if (!glowOn) glowOn = true;
    const k = (Math.sin(elapsed * 6) * 0.5 + 0.5) * 0.55 + 0.15;
    glowMats.forEach(m => { m.emissive.setHex(0xE03131); m.emissiveIntensity = k; });
  } else if (glowOn) setGlow(false);

  /* 면 탭 통통 */
  faces.forEach(f => {
    if (f.userData.tapT > 0) {
      f.userData.tapT = Math.max(0, f.userData.tapT - dt * 3);
      f.scale.setScalar(1 + Math.sin(f.userData.tapT * Math.PI) * 0.07);
    } else f.scale.setScalar(1);
  });

  controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}

if (mode === 'mission') sim.missionStart();
else { target = sim.state.t; applyFold(); }
shuffleQuiz();
renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast('슬라이더나 접기 ▶ 로 접어 봐요 — 완전히 접으면 정육면체!');
animate();

/* 테스트용 앱 훅 */
window.NetApp = {
  sim, get mode() { return mode; }, setMode, setGrade, act, tapFace,
  faces, pTop, pFront,
  get target() { return target; },
  setFoldTarget(v) { hideHint(); target = Math.max(0, Math.min(v, 1)); sim.setFold(target); applyFold(); missionDirty = true; renderStatus(); },
  get glowMats() { return glowMats; }
};
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

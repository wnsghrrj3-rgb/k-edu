<!--
  케이랩 v3 · A트랙 — 계절의 변화 (2026-07-13 · 페이블) · 천체 통합 재건 3호
  v2 engine/tools/season.js(630줄 · 탐구 표준 v2 4층 완료본) 전면 재건 · r185 + klab3 코어.
  스튜디오 5요소: ① 우주 무대(별 900 · 태양 중심 · 궤도 링 + 4계절 마커 · 실사 지구)
    ② 실물 질감(텍스처 승급 로더 + 캔버스 폴백 · 자전축 금색 실린더 · 북극 손잡이)
    ③ 직접 조작(🔴 자전축을 «잡아 돌리기» · 지구를 궤도 위에서 끌기 · 계절 버튼 · 슬라이더)
    ④ 즉각 반응(기울기 → 남중고도·낮 길이·태양의 길·그림자·계절이 한 몸으로)
    ⑤ 탐구 구조(미션 6 · 퀴즈 5 · 만약에 4 · 예측 칩 · 와우=🔦 햇빛 다발 밀도)
  🔴 신기술 2종(페이블 몫 이행):
    ① 자전축 잡아 돌리기 — 북극 손잡이를 레이캐스트로 집고 끌면, 후보 기울기들의 «화면 투영점»을
       스캔해 마우스에 가장 가까운 각을 역산(tiltFromScreen). 슬라이더가 아니라 축 자체를 손으로
       세웠다 눕혔다 하는 것 = 「계절을 만드는 건 이 각도」를 손이 먼저 안다.
    ② 🔦 햇빛 다발 밀도 — 같은 굵기의 평행 광선 다발이 지표에 «비스듬히» 닿으면 타원으로 퍼진다.
       퍼짐 배율 = 1/sin(남중고도). 위도 37.5°·기울기 23.5°에서 여름 1.03배 ↔ 겨울 2.06배 =
       정확히 «2배». 여름이 더운 건 가까워서가 아니라 다발이 좁게 모이기 때문 — 미션② think의 물증.
  v2 무손실: 학년칸 저(계절 버튼만·미션3)/중(재생·공전·위도·🦘)/고(기울기·거리·지구잡기·만약에4·미션6)
    ·미션 6단계(make+think · mIdx 스왑) ·퀴즈 5문(장면 세팅·무반복 순환)
    ·만약에 4종(🪐기울기90=천왕성 · 🦘남반구 반전 · ⏸공전멈춤 · 🥚타원 궤도)
    ·예측 노트(📏거리 실험=양 끝 다 가봐야 해소 · 🧭위도 실험) ·🌐기울기 0 확인 칩 ·5칩 토스트
    ·2D 패널 2종(우리나라 정오의 태양 = 남중고도 호 / 하루 동안 태양의 길과 막대 그림자)
    ·남반구 계절 반전표 ·백야·극야 ·상태줄 문구 전부 ·텍스처 승급(earth_day.png 재사용)
  v3 추가: 만약에 조작 게이트(wifActed) · 판정 후처리 일원화(afterAct — moon 교훈)
  config: ?grade=low|mid|high(지정 시 잠금) · ?mode=free|mission|quiz · ?orb=0~360 · ?tilt=0~35 · ?lat=-90~90
-->

<!-- ═══ 순수 로직 (window.SeasonSim · node 테스트 대상 · DOM/THREE 무의존) ═══ -->
<script>
(function(){
  'use strict';

  var ORBIT_R = 5;
  var ELL_E = 0.55;                        /* 만약에 🥚 타원 이심률 (v2 무손실) */

  function wrapDeg(d){ return ((d % 360) + 360) % 360; }
  function degDiff(a, b){
    var d = Math.abs(wrapDeg(a) - wrapDeg(b));
    return d > 180 ? 360 - d : d;
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  /* ── 천문 수리 (v2 무손실) ── */
  /* 태양 적위 δ = ε·sin(공전각). 0=춘분 · 90=하지 · 180=추분 · 270=동지 */
  function decl(orb, tilt){ return tilt * Math.sin(orb * Math.PI / 180); }
  /* 남중고도 = 90 − |위도 − δ| */
  function noonAlt(orb, tilt, lat){ return 90 - Math.abs(lat - decl(orb, tilt)); }
  /* 낮 길이: cosH = −tan(위도)·tan(δ) · 낮 = 2H/15 */
  function dayHours(orb, tilt, lat){
    var d = decl(orb, tilt) * Math.PI / 180, la = lat * Math.PI / 180;
    var c = clamp(-Math.tan(la) * Math.tan(d), -1, 1);
    var H = Math.acos(c) * 180 / Math.PI;
    return 2 * H / 15;
  }
  /* 계절 판정 — 기울기 0이면 계절이 없다 (v2 무손실) */
  function seasonOf(orb, tilt){
    if(tilt <= 1) return { k:'none', nm:'계절 없음', emo:'⚪', col:'#9DB2C8' };
    orb = wrapDeg(orb);
    if(orb >= 45  && orb < 135) return { k:'summer', nm:'여름', emo:'☀️', col:'#FF922B' };
    if(orb >= 225 && orb < 315) return { k:'winter', nm:'겨울', emo:'❄️', col:'#4DABF7' };
    if(orb >= 135 && orb < 225) return { k:'fall',   nm:'가을', emo:'🍂', col:'#E8590C' };
    return                             { k:'spring', nm:'봄',   emo:'🌸', col:'#F06595' };
  }
  var FLIP = { summer:['❄️','겨울'], winter:['☀️','여름'], spring:['🍂','가을'],
               fall:['🌸','봄'], none:['⚪','계절 없음'] };

  /* ── 🔴 햇빛 다발 밀도 (와우의 심장) ──
     같은 굵기의 평행 광선 다발이 지표에 «비스듬히» 닿으면 타원으로 퍼진다.
     퍼짐 배율 = 1/sin(남중고도). 해가 지평선에 붙으면 무한대로 퍼진다(=열이 안 모임). */
  function sunSpread(orb, tilt, lat){
    var a = noonAlt(orb, tilt, lat);
    if(a <= 0.5) return Infinity;
    return 1 / Math.sin(a * Math.PI / 180);
  }
  /* 단위 면적당 열 = 1/퍼짐 = sin(고도) */
  function heatDensity(orb, tilt, lat){
    var s = sunSpread(orb, tilt, lat);
    return (s === Infinity) ? 0 : 1 / s;
  }

  /* ── 궤도 기하 (v2 무손실: 거리 슬라이더=원 스케일 · 🥚=타원, 태양=초점) ── */
  function orbGeom(distAU, ell){
    if(ell){ var a = ORBIT_R, b = a * Math.sqrt(1 - ELL_E * ELL_E); return { a:a, b:b, cx:-a * ELL_E }; }
    var r = ORBIT_R * distAU;
    return { a:r, b:r, cx:0 };
  }
  function earthPos(orb, distAU, ell){
    var g = orbGeom(distAU, ell), ph = (orb + 90) * Math.PI / 180;
    return { x: g.cx + g.a * Math.cos(ph), z: g.b * Math.sin(ph) };
  }
  function sunDistAU(orb, distAU, ell){
    var p = earthPos(orb, distAU, ell);
    return Math.sqrt(p.x * p.x + p.z * p.z) / ORBIT_R;
  }

  var SEASONS = [ { k:'spring', o:0,   l:'🌸 봄(춘분)' }, { k:'summer', o:90,  l:'☀️ 여름(하지)' },
                  { k:'fall',   o:180, l:'🍂 가을(추분)' }, { k:'winter', o:270, l:'❄️ 겨울(동지)' } ];

  /* ── 학년 칸 (v2 GRADES 무손실) ── */
  var GRADES = {
    low:  { modes:['free','mission','quiz'], showPlay:false, showOrb:false, showTilt:false, mIdx:[0,1,2],
            wif:[], wow:false, v2:{ lat:false, dist:false, grab:false },
            hint:'계절 버튼을 눌러 봄·여름·가을·겨울 해의 높이를 비교해 봐요.' },
    mid:  { modes:['free','mission','quiz'], showPlay:true,  showOrb:true,  showTilt:false, mIdx:[0,1,2],
            wif:['south'], wow:false, v2:{ lat:true, dist:false, grab:false },
            hint:'▶ 1년 재생으로 계절마다 해 높이·낮 길이가 달라지는 걸 봐요.' },
    high: { modes:['free','mission','quiz'], showPlay:true,  showOrb:true,  showTilt:true,  mIdx:[0,1,2,3,4,5],
            wif:['ura','south','stops','ell'], wow:true, v2:{ lat:true, dist:true, grab:true },
            hint:'🌐 자전축 기울기를 0으로 내려 보세요 — 계절이 사라질까요?' }
  };

  /* ── 미션 6단계 (v2 문구·판정 무손실) ── */
  var MISSIONS = [
    { type:'make', text:'☀️ <b>여름(하지)</b> 위치로! 남중고도가 가장 높아지는 곳을 찾아요!',
      check:function(s){ return s.tilt > 5 && decl(s.orb, s.tilt) >= s.tilt * 0.93; } },
    { type:'think', text:'🤔 여름이 더 <b>더운 까닭</b>은 무엇일까요?',
      ch:['남중고도가 높아 햇빛이 곧게(세게) 들어와서','지구가 태양에 더 가까워져서','여름엔 바람이 안 불어서'], a:0,
      why:'거리가 아니라 각도! 햇빛이 높이서 곧게 내리쬐면 같은 땅에 더 많은 열이 모여요. 손전등을 바닥에 똑바로 vs 비스듬히 비춰 보면 알 수 있죠.' },
    { type:'make', text:'❄️ 이번엔 <b>겨울(동지)</b> — 남중고도가 가장 낮아져요!',
      check:function(s){ return s.tilt > 5 && decl(s.orb, s.tilt) <= -s.tilt * 0.93; } },
    { type:'make', text:'🔭 자전축 <b>기울기를 0°</b>으로! 계절이 사라지는지 확인해요!',
      check:function(s){ return s.tilt <= 1; } },
    { type:'think', text:'🤔 기울기가 0°이 되니 계절이 사라졌어요. <b>왜</b>일까요?',
      ch:['공전해도 햇빛 받는 각도가 일 년 내내 똑같아져서','태양이 멀어져서','지구가 자전을 멈춰서'], a:0,
      why:'계절의 진짜 원인 = 기울어진 채 공전! 축이 똑바로 서면 어디를 돌아도 남중고도와 낮 길이가 그대로예요.' },
    { type:'make', text:'🌐 기울기를 다시 <b>20° 넘게</b> 올려 계절을 되살려 봐요!',
      check:function(s){ return s.tilt >= 20; } }
  ];

  /* ── 퀴즈 (v2 무손실 — 장면 세팅형) ── */
  var QUIZ = [
    { orb:90,  tilt:23.5, q:'북반구(북극 쪽)가 태양 쪽으로 기울어 있어요. 우리나라는 어떤 계절일까요?', ch:['여름','겨울','가을'], a:0 },

  var PRED = {

  var TILT0_CHIP = '🌐 기울기 0 → 계절 소멸';

    q:'🔦 같은 굵기의 햇빛 다발이 «땅에 닿는 넓이»는 여름과 겨울에 어떻게 다를까요?',

  function createSim(grade, opts){
    grade = (['low','mid','high'].indexOf(grade) >= 0) ? grade : 'high';
    opts = opts || {};
    var sim = {};
    sim.grade = grade;
    sim.G = function(){ return GRADES[sim.grade]; };
    sim.orb0  = (typeof opts.orb  === 'number' && !isNaN(opts.orb))  ? wrapDeg(opts.orb) : 90;
    sim.tilt0 = (typeof opts.tilt === 'number' && !isNaN(opts.tilt)) ? clamp(opts.tilt, 0, 35) : 23.5;
    sim.lat0  = (typeof opts.lat  === 'number' && !isNaN(opts.lat))  ? clamp(opts.lat, -90, 90) : 37.5;

    sim.state = {
      orb: sim.orb0, tilt: sim.tilt0, lat: sim.lat0, distAU: 1,
      playing: false, orbAcc: 0, dayCnt: 0,
      wif: null, wifPred: null, wifActed: false, wifDone: false,
      wowArmed: false, wowPred: null, wowDone: false, seenSummer: false, seenWinter: false,
      pred: { dist:{ asked:false, ch:-1, lo:false, hi:false, done:false },
              lat: { asked:false, ch:-1, done:false } },
      tilt0Chip: false,
      chips: [], chipToast: false,
      acted: false
    };

    /* ── 조작 ── */
    sim.setOrb = function(v){
      var st = sim.state;
      if(st.wif === 'stops') return st.orb;                 /* 공전 멈춤 = 잠금 (v2) */
      var nv = wrapDeg(v);
      st.orbAcc += degDiff(nv, st.orb);
      st.orb = nv;
      st.acted = true;
      if(st.wif) st.wifActed = true;
      sim.markSeason();
      return st.orb;
    };
    /* 🔴 자전축 잡아 돌리기 — 각도 자체가 조작 대상 */
    sim.setTilt = function(v){
      var st = sim.state;
      if(st.wif === 'stops' || st.wif === 'ura') return st.tilt;   /* 만약에가 기울기를 점유 (v2) */
      st.tilt = clamp(v, 0, 35);
      st.acted = true;
      if(st.wif) st.wifActed = true;
      /* 🌐 기울기 0 도달 = 계절 소멸 확인 칩 (v2 무손실 · 자유탐구 1회) */
      var fired = false;
      if(st.tilt <= 1 && !st.tilt0Chip){
        st.tilt0Chip = true;
        st.chips.push({ k:'tilt0', hit:true, confirm:true, label:TILT0_CHIP });
        if(st.chips.length === 5 && !st.chipToast){ st.chipToast = true; fired = true; }
      }
      sim.markSeason();
      return st.tilt;
    };
    sim.tiltChipFired = function(){ return sim.state.tilt0Chip; };
    sim.setLat = function(v){
      var st = sim.state;
      st.lat = clamp(v, -90, 90);
      st.acted = true;
      return st.lat;
    };
    sim.setDist = function(v){
      var st = sim.state;
      st.distAU = clamp(v, 0.8, 1.2);
      st.acted = true;
      if(st.distAU <= 0.82) st.pred.dist.lo = true;
      if(st.distAU >= 1.18) st.pred.dist.hi = true;
      return st.distAU;
    };
    sim.togglePlay = function(){ sim.state.playing = !sim.state.playing; sim.state.acted = true; return sim.state.playing; };
    sim.canGrab = function(mode){ return mode !== 'quiz' && sim.G().v2.grab; };
    sim.canTilt = function(mode){ return mode !== 'quiz' && sim.G().showTilt; };

    /* 여름·겨울 방문 기록 (🔦 와우 조작 게이트) */
    sim.markSeason = function(){
      var st = sim.state, k = seasonOf(st.orb, st.tilt).k;
      if(k === 'summer') st.seenSummer = true;
      if(k === 'winter') st.seenWinter = true;
    };

    /* ── 파생값 ── */
    sim.ell = function(){ return sim.state.wif === 'ell'; };
    sim.effTilt = function(){ return sim.state.wif === 'ura' ? 90 : sim.state.tilt; };
    sim.south = function(){ return sim.state.lat < 0 || sim.state.wif === 'south'; };
    sim.alt  = function(){ return noonAlt(sim.state.orb, sim.effTilt(), sim.state.lat); };
    sim.day  = function(){ return dayHours(sim.state.orb, sim.effTilt(), sim.state.lat); };
    sim.season = function(){ return seasonOf(sim.state.orb, sim.effTilt()); };
    /* 남반구면 계절 표시 반전 (v2 FLIP) */
    sim.seasonDisp = function(){
      var s = sim.season();
      if(!sim.south() || s.k === 'none') return { emo:s.emo, nm:s.nm, col:s.col, k:s.k };
      var f = FLIP[s.k];
      return { emo:f[0], nm:f[1], col:s.col, k:s.k };
    };
    sim.pos = function(){ return earthPos(sim.state.orb, sim.state.distAU, sim.ell()); };
    sim.dist = function(){ return sunDistAU(sim.state.orb, sim.state.distAU, sim.ell()); };
    sim.spread = function(){ return sunSpread(sim.state.orb, sim.effTilt(), sim.state.lat); };

    /* ── 공전 tick (v2 loop 무손실 — 약 10초에 1년) ── */
    sim.tick = function(dt){
      var st = sim.state;
      if(!st.playing) return;
      dt = Math.min(dt, 0.05);
      if(st.wif === 'stops'){ st.dayCnt += dt * 8; st.wifActed = true; return; }
      var d = dt * 36;
      st.orb = wrapDeg(st.orb + d);
      st.orbAcc += d;
      if(st.wif) st.wifActed = true;
      sim.markSeason();
    };

    /* ── 예측 노트 (v2 3층) ── */
    sim.predArm = function(kind, mode){
      var p = sim.state.pred[kind];
      if(mode !== 'free' || p.asked) return false;
      p.asked = true;
      return true;
    };
    sim.predPick = function(kind, i){
      sim.state.pred[kind].ch = (typeof i === 'number' && i >= 0 && i <= 2) ? i : -1;
      return sim.state.pred[kind].ch;
    };
    /* 해소: dist = 양 끝(0.8·1.2) «둘 다» 가봐야 · lat = 남반구(−20° 이하) 도달 */
    sim.predResolved = function(kind, mode){
      var st = sim.state, p = st.pred[kind];
      if(mode !== 'free' || p.done || p.ch < 0) return false;
      if(kind === 'dist') return p.lo && p.hi;
      if(kind === 'lat')  return st.lat <= -20;
      return false;
    };
    sim.predResolve = function(kind, mode){
      if(!sim.predResolved(kind, mode)) return null;
      var st = sim.state, p = st.pred[kind], P = PRED[kind];
      p.done = true;
      var hit, msg;
      if(kind === 'dist'){
        hit = (p.ch !== 0);                                  /* v2: 1·2번 모두 적중 처리 */
        msg = (p.ch === 1)
          ? '✔ 예측 적중 — 거리를 아무리 바꿔도 남중고도·낮 길이는 그대로! 거리는 계절의 원인이 아니에요.'
          : (p.ch === 2)
          ? '✔ 절반 적중 — 계절은 그대로 맞아요! 다만 「아무 변화 없음」은 아니에요. 지구 전체가 받는 빛의 양은 달라져요(온 지구가 더워지거나 추워짐). 계절의 원인이 아닐 뿐!'
          : '✘ 예측 빗나감 — 가까워져도 여름이 되지 않았죠? 계절은 거리가 아니라 자전축 기울기가 정해요.';
      } else {
        hit = (p.ch === 1);
        msg = hit
          ? '✔ 예측 적중 — 남반구는 계절이 정반대! 북반구가 태양 쪽으로 기울 때 남반구는 반대쪽으로 기울어요.'
          : '✘ 예측 빗나감 — 남반구는 계절이 정반대예요! 호주의 크리스마스가 한여름인 까닭이죠.';
      }
      st.chips.push({ k:kind, hit:hit, label:P.chip });
      var toast = (st.chips.length === 5 && !st.chipToast);
      if(toast) st.chipToast = true;
      return { kind:kind, hit:hit, msg:msg, chipToast:toast };
    };

    /* ── 만약에 (v3 조작 게이트) ── */
    sim.canWhatif = function(mode){ return mode === 'free' && sim.G().wif.length > 0; };
    sim.wifList = function(){ return sim.G().wif.slice(); };
    sim.wifStart = function(key){
      if(sim.G().wif.indexOf(key) < 0) return null;
      var st = sim.state;
      st.wif = key; st.wifPred = null; st.wifActed = false; st.wifDone = false;
      st.playing = false; st.orbAcc = 0; st.dayCnt = 0;
      st.orb = 90; st.tilt = 23.5; st.distAU = 1;              /* v2 onSelect 무손실 */
      st.wowArmed = false; st.wowPred = null;
      return key;
    };
    sim.wifPredict = function(i){
      sim.state.wifPred = (typeof i === 'number' && i >= 0 && i <= 2) ? i : null;
      return sim.state.wifPred;
    };
    sim.wifResolved = function(){
      var st = sim.state;
      if(!st.wif || st.wifDone || st.wifPred === null || !st.wifActed) return false;
      if(st.wif === 'stops') return st.dayCnt >= WHATIF.stops.need;
      return st.orbAcc >= WHATIF[st.wif].need;
    };
    sim.wifResolve = function(){
      var st = sim.state;
      if(!sim.wifResolved()) return null;
      st.wifDone = true;
      var W = WHATIF[st.wif], hit = (st.wifPred === W.a);
      st.chips.push({ k:st.wif, hit:hit, label:W.chip });
      var toast = (st.chips.length === 5 && !st.chipToast);
      if(toast) st.chipToast = true;
      return { key:st.wif, hit:hit, reveal:W.reveal, chipToast:toast };
    };
    sim.wifExit = function(){
      var st = sim.state;
      st.wif = null; st.wifPred = null; st.wifActed = false; st.wifDone = false;
      st.playing = false; st.orb = 90; st.tilt = 23.5; st.distAU = 1;
      st.orbAcc = 0; st.dayCnt = 0;
      return true;
    };

    /* ── 🔦 와우: 햇빛 다발 밀도 (v3 신설) ── */
    sim.canWow = function(mode){ return mode === 'free' && sim.G().wow && !sim.state.wif && !sim.state.wowDone; };
    sim.wowArm = function(){
      var st = sim.state;
      st.wowArmed = true; st.wowPred = null;
      st.playing = false; st.orb = 90; st.tilt = 23.5; st.lat = sim.lat0; st.distAU = 1;
      st.seenSummer = false; st.seenWinter = false;
      sim.markSeason();                                        /* orb=90 → 여름 방문 기록 */
      return st.orb;
    };
    sim.setWowPred = function(i){
      sim.state.wowPred = (typeof i === 'number' && i >= 0 && i <= 2) ? i : null;
      return sim.state.wowPred;
    };
    /* 해소 = 여름·겨울을 «둘 다» 가봐야 (한쪽만 보면 비교가 안 된다) */
    sim.wowResolved = function(){
      var st = sim.state;
      return st.wowArmed && !st.wowDone && st.wowPred !== null && st.seenSummer && st.seenWinter;
    };
    sim.wowReveal = function(){
      var st = sim.state, t = st.tilt, la = st.lat;
      var sAlt = noonAlt(90, t, la),  wAlt = noonAlt(270, t, la);
      var sSpd = sunSpread(90, t, la), wSpd = sunSpread(270, t, la);
      return {
        summerAlt: sAlt, winterAlt: wAlt,
        summerSpread: sSpd, winterSpread: wSpd,
        ratio: (sSpd > 0 && sSpd !== Infinity && wSpd !== Infinity) ? wSpd / sSpd : Infinity,
        summerHeat: heatDensity(90, t, la), winterHeat: heatDensity(270, t, la)
      };
    };
    sim.wowResolve = function(){
      var st = sim.state;
      if(!sim.wowResolved()) return null;
      st.wowDone = true; st.playing = false;
      var hit = (st.wowPred === WOW.a);
      st.chips.push({ k:'wow', hit:hit, label:WOW.chip });
      var toast = (st.chips.length === 5 && !st.chipToast);
      if(toast) st.chipToast = true;
      return { hit:hit, chipToast:toast, data:sim.wowReveal() };
    };
    sim.wowExit = function(){
      var st = sim.state;
      st.wowArmed = false; st.wowPred = null; st.playing = false;
      return true;
    };
    sim.clearWow = function(){
      var st = sim.state;
      if(!st.wowArmed || st.wowPred !== null) return false;   /* 예측 전 이탈만 무장 해제 */
      st.wowArmed = false;
      return true;
    };

    /* ── 미션 (v2 무손실 + acted 게이트) ── */
    sim.missionList = function(){ return sim.G().mIdx.map(function(i){ return MISSIONS[i]; }); };
    sim.mStep = 0; sim.mDone = false;
    sim.missionStart = function(){
      sim.mStep = 0; sim.mDone = false;
      var st = sim.state;
      st.orb = 0; st.tilt = 23.5; st.lat = sim.lat0; st.distAU = 1;   /* v2: 미션 진입 orb=0(춘분) */
      st.playing = false; st.orbAcc = 0; st.dayCnt = 0;
      st.wif = null; st.wifPred = null; st.wowArmed = false; st.wowPred = null;
      st.acted = false;
    };
    sim.missionCur = function(){ return sim.missionList()[sim.mStep]; };
    sim.missionCheck = function(){
      if(sim.mDone) return { act:'none' };
      var M = sim.missionList(), m = M[sim.mStep];
      if(m.type !== 'make') return { act:'none' };
      if(!sim.state.acted) return { act:'none' };
      if(!m.check(sim.state)) return { act:'none' };
      return sim.missionAdvance();
    };
    sim.missionAdvance = function(){
      var M = sim.missionList();
      sim.state.acted = false; sim.state.orbAcc = 0;
      if(sim.mStep < M.length - 1){
        sim.mStep++;
        var nx = M[sim.mStep];
        if(nx.set) nx.set(sim.state);
        return { act:'next', step:sim.mStep };
      }
      sim.mDone = true;
      return { act:'done' };
    };

    /* ── 퀴즈 (v2 무반복 순환 무손실) ── */
    sim.qIdx = 0; sim.qScore = 0; sim.qCount = 0; sim.qUsed = [];
    sim.quizList = function(){ return QUIZ.slice(); };
    sim.newQuiz = function(rand){
      rand = rand || Math.random;
      if(sim.qUsed.length >= QUIZ.length) sim.qUsed = [];
      var cand = [];
      for(var i = 0; i < QUIZ.length; i++) if(sim.qUsed.indexOf(i) < 0) cand.push(i);
      sim.qIdx = cand[Math.floor(rand() * cand.length)];
      sim.qUsed.push(sim.qIdx);
      sim.state.orb = QUIZ[sim.qIdx].orb;
      sim.state.tilt = QUIZ[sim.qIdx].tilt;                   /* 장면 세팅 */
      sim.state.lat = sim.lat0; sim.state.distAU = 1;
      sim.state.playing = false;
      return sim.qIdx;
    };
    sim.quizAnswer = function(i){
      var q = QUIZ[sim.qIdx], ok = (i === q.a);

      return { ok:ok, correct:q.ch[q.a] };
    };
    sim.quizReset = function(rand){
      sim.qScore = 0; sim.qCount = 0; sim.qUsed = [];
      sim.newQuiz(rand);

        return out;
      }
      if(st.wowArmed){
        out.warn = true;
        var sp = sim.spread();
        out.lines.push('<span class="big">🔦 햇빛 다발이 ' + (sp === Infinity ? '한없이' : sp.toFixed(2) + '배') + ' 퍼졌어요</span>');
        out.lines.push('같은 굵기의 빛이 땅에 «얼마나 넓게» 깔리는지 봐요 — 넓게 퍼질수록 한 뼘이 받는 열은 적어져요.');
        if(st.wowPred !== null && !(st.seenSummer && st.seenWinter)){
          out.lines.push('<span class="hold">☀️ 여름과 ❄️ 겨울을 «둘 다» 가봐야 비교할 수 있어요!</span>');
        }
        return out;
      }
      if(st.wif){
        var W = WHATIF[st.wif], sea = sim.season();
        out.warn = true;
        if(st.wif === 'stops'){
          out.lines.push('<span class="big">📅 +' + Math.floor(st.dayCnt) + '일</span>');
          out.lines.push('날짜가 흘러도 ' + sea.emo + ' ' + sea.nm + ' 그대로 — 계절은 공전이 만들어요!');
        } else if(st.wif === 'south'){
          var d = sim.seasonDisp();
          out.lines.push('🦘 호주 기준: 지금은 ' + d.emo + ' <b>' + d.nm + '</b>! (우리나라는 ' + sea.emo + ' ' + sea.nm + ')');
          out.lines.push('북반구와 남반구는 기우는 방향이 반대 — 계절도 정반대예요.');
        } else if(st.wif === 'ell'){
          out.lines.push('🥚 거리 ' + sim.dist().toFixed(2) + ' AU · 남중고도 ' + Math.round(sim.alt()) + '° <b>그대로</b>');
          out.lines.push('가까워져도 계절은 기울기가 정해요. 진짜 지구도 한겨울(1월 초)에 태양과 가장 가까워요!');

        return out;
      }
      var alt = sim.alt(), dh = sim.day(), sea2 = sim.season(), disp = sim.seasonDisp(), sub;
      if(sea2.k === 'none')
        sub = '자전축이 똑바로 서 있어요(기울기 0°). 공전 위치를 아무리 바꿔도 남중고도·낮 길이 그대로 — 계절이 생기지 않아요.';

      else if(sea2.k === 'winter')

      out.lines.push('<span class="big">' + disp.emo + ' ' + disp.nm
        + (sea2.k !== 'none' ? ' · 남중고도 ' + Math.round(alt) + '° · 낮 ' + dh.toFixed(1) + '시간' : '')
        + (sim.south() ? ' (남반구 기준)' : '') + '</span>');
      out.lines.push(sub);
      out.lines.push('계절이 생기는 건 지구-태양 거리 때문이 아니라, 자전축이 기울어진 채 공전하기 때문이에요.');
      if(mode === 'free' && st.distAU !== 1){
        out.lines.push('📏 거리 ' + st.distAU.toFixed(2) + ' AU — 남중고도·낮 길이는 그대로! 거리는 계절의 원인이 아니에요.');
      }
      if(mode === 'free' && st.lat < 0){
        out.lines.push('🧭 남반구 관측 — 북반구와 계절이 정반대예요.');
      }
      if(mode === 'free' && st.tilt > 1 && dh >= 23.5){
        out.lines.push('🧊 백야 — 하루 종일 해가 지지 않아요! (극지방 × 기울어진 지구)');
      }
      if(mode === 'free' && st.tilt > 1 && dh <= 0.5){
        out.lines.push('🌑 극야 — 하루 종일 해가 뜨지 않아요! (극지방 × 기울어진 지구)');
      }
      if(mode === 'free' && sim.G().showTilt){
        out.lines.push('🌐 자전축(금색 막대)의 북극을 잡아 돌려 봐요 — 이 각도가 계절을 만들어요!');
      }

    };

    return sim;
  }

  var API = {

{

/* ── 「하루 동안 태양의 길과 막대 그림자」 패널 (v2 renderSunPath 무손실) ── */
const NS = 'http://www.w3.org/2000/svg';
function renderPath() {
  const g = $('pathg'), cap = $('pathcap');
  if (!g) return;
  while (g.firstChild) g.removeChild(g.firstChild);
  const S = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const st = sim.state;
  const alt = Math.max(0, sim.alt());
  const dh = Math.max(0.5, sim.day());
  const half = Math.min(76, dh / 24 * 152 / 2 + 18);
  const peak = 26 - (alt / 90) * 62;
  /* 참조: 기울기 0°(계절 없음) 경로 — 점선 */
  const alt0 = 90 - Math.abs(st.lat), peak0 = 26 - (alt0 / 90) * 62, half0 = Math.min(76, 12 / 24 * 152 / 2 + 18);
  g.appendChild(S('path', { d: `M ${-half0} 26 Q 0 ${peak0.toFixed(1)} ${half0} 26`, stroke: '#7d8db5', 'stroke-width': 1.4, fill: 'none', 'stroke-dasharray': '4 4', opacity: 0.65 }));
  /* 현재 경로 */
  g.appendChild(S('path', { d: `M ${-half} 26 Q 0 ${peak.toFixed(1)} ${half} 26`, stroke: '#FFD43B', 'stroke-width': 2.6, fill: 'none', id: 'sparc' }));
  g.appendChild(S('circle', { cx: 0, cy: peak.toFixed(1), r: 5, fill: '#FFD43B', id: 'spsun' }));
  /* 해 뜨고 지는 시각 */
  const rise = 12 - dh / 2, set = 12 + dh / 2;
  const hm = h => { let H = Math.floor(h), M = Math.round((h - H) * 60); if (M === 60) { H++; M = 0; } return H + '시' + (M ? ' ' + M + '분' : ''); };
  const tr = S('text', { x: -half, y: 14, 'text-anchor': 'middle', fill: '#FFE08A', 'font-size': 8, 'font-family': 'Gowun Dodum' });
  tr.textContent = '↑' + hm(rise); g.appendChild(tr);
  const tset = S('text', { x: half, y: 14, 'text-anchor': 'middle', fill: '#FFE08A', 'font-size': 8, 'font-family': 'Gowun Dodum' });
  tset.textContent = '↓' + hm(set); g.appendChild(tset);
  /* 막대와 그림자 — 그림자 길이 = 막대 ÷ tan(남중고도) */
  const sx = 44, h2 = 13;
  const shadow = (alt > 2) ? Math.min(h2 / Math.tan(alt * Math.PI / 180), 52) : 52;
  g.appendChild(S('line', { x1: sx, y1: 30, x2: sx - shadow, y2: 30, stroke: '#0e1426', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0.85, id: 'spshadow' }));
  g.appendChild(S('line', { x1: sx, y1: 30, x2: sx, y2: 30 - h2, stroke: '#D9A066', 'stroke-width': 3.2, 'stroke-linecap': 'round' }));
  cap.textContent = (sim.effTilt() <= 1)
    ? '기울기 0° — 일 년 내내 같은 길, 같은 그림자'
    : ('남중고도 ' + Math.round(alt) + '° → 그림자가 ' + (alt >= 60 ? '짧아요' : (alt <= 35 ? '길어요' : '중간이에요')) + ' · 낮 ' + dh.toFixed(1) + '시간');
}

/* ═══════════ 씬 동기 ═══════════ */
const _pinW = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
function syncScene() {
  const st = sim.state;
  /* 궤도 그룹 = 거리(원 스케일) 또는 🥚 타원 (v2 무손실) */
  const og = Sim.orbGeom(st.distAU, sim.ell());
  orbGrp.scale.set(og.a / Sim.ORBIT_R, 1, og.b / Sim.ORBIT_R);
  orbGrp.position.x = og.cx;
  /* 지구 = 궤도 위 위치 · 자전축은 «월드 고정 방향»으로 기울어진 채 (v2 핵심) */
  const p = sim.pos();
  earthPivot.position.set(p.x, 0, p.z);
  earthPivot.rotation.z = sim.effTilt() * Math.PI / 180;
  placePin();
  renderBeam();
  renderNoon(); renderPath();
}

/* 🔦 햇빛 다발 — 핀 위치에 «고정 굵기» 다발을 태양 방향에서 쏘고, 지표 패치를 1/sin(입사각)로 늘린다 */
const _sunDir = new THREE.Vector3();
const _q = new THREE.Quaternion();
function renderBeam() {
  const st = sim.state;
  beamGrp.visible = st.wowArmed && mode !== 'quiz';
  if (!beamGrp.visible) return;
  earthMesh.updateMatrixWorld(true);
  pin.getWorldPosition(_pinW);
  /* 태양(원점) → 핀 방향 */
  _sunDir.copy(_pinW).normalize();
  /* 다발 = 태양 쪽에서 핀으로 오는 원기둥 */
  const L = 2.6;
  const start = _pinW.clone().addScaledVector(_sunDir, -L);
  beamRod.scale.set(1, L, 1);
  beamRod.position.copy(start).addScaledVector(_sunDir, L / 2);
  _q.setFromUnitVectors(_up, _sunDir);
  beamRod.quaternion.copy(_q);
  /* 지표 패치 — 입사각이 얕을수록 넓게 퍼진다 (퍼짐 배율 = 1/sin(고도)) */
  const spread = sim.spread();
  const sc = (spread === Infinity) ? 6 : Math.min(spread, 6);
  patch.position.copy(_pinW).addScaledVector(_sunDir, -0.02);
  /* 패치는 지표에 눕는다: 법선 = 핀의 지표 법선 */
  const nrm = _pinW.clone().sub(earthPivot.position).normalize();
  _q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nrm);
  patch.quaternion.copy(_q);
  patch.scale.set(sc, 1, 1);                       /* 한 방향으로만 늘어난다 = 타원 */
  patchMat.opacity = Math.max(0.18, 0.78 / sc);    /* 넓게 퍼질수록 옅다 = 열이 안 모임 */
}

syncScene();

/* ── 조작 후처리 (moon 교훈: 판정을 루프에 두지 말고 한 곳에 모은다) ── */

function act(a) {

/* ── 🔴 자전축 잡아 돌리기 · 지구 궤도 위 끌기 ── */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const orbitPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPt = new THREE.Vector3();
let grab = null;
function setPtr(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
}
function pick(cx, cy) {
  setPtr(cx, cy);
  if (sim.canTilt(mode) && ray.intersectObject(npoleProxy, false).length) return 'axis';
  if (sim.canGrab(mode) && ray.intersectObject(earthProxy, false).length) return 'earth';
  return null;
}
/* 🔴 화면 좌표 → 자전축 기울기 역산.
   후보 각을 0.5° 간격으로 스캔하며 «북극이 화면 어디에 찍히는지»를 투영해 마우스와 가장 가까운 각을 고른다.
   (축은 pivot.rotation.z만 쓰므로 1자유도 — 스캔이 정확하고 카메라 각도에 무관하다) */
const _cand = new THREE.Vector3();
function tiltFromScreen(cx, cy) {
  const mx = (cx / innerWidth) * 2 - 1;
  const my = -(cy / innerHeight) * 2 + 1;
  const base = earthPivot.position;
  let best = sim.state.tilt, bestD = Infinity;
  for (let t = 0; t <= 35.0001; t += 0.5) {
    const r = t * Math.PI / 180;
    /* 로컬 +Y(0,1,0)를 rotation.z = r 로 돌린 월드 방향 */
    _cand.set(-Math.sin(r) * 1.0, Math.cos(r) * 1.0, 0).add(base);
    _cand.project(camera);
    const d = (_cand.x - mx) * (_cand.x - mx) + (_cand.y - my) * (_cand.y - my);
    if (d < bestD) { bestD = d; best = t; }
  }
  return best;
}
renderer.domElement.addEventListener('pointerdown', e => {
  hideHint();
  const p = pick(e.clientX || 0, e.clientY || 0);
  if (!p) return;
  grab = p;
  controls.enabled = false;
  if (sim.state.playing) { sim.togglePlay(); renderCtrls(); }
  sim.clearWow();
  K3.sound.play('tap');
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!grab) return;
  const cx = e.clientX || 0, cy = e.clientY || 0;
  if (grab === 'axis') {
    sim.setTilt(tiltFromScreen(cx, cy));
  } else {
    setPtr(cx, cy);
    if (!ray.ray.intersectPlane(orbitPlane, hitPt)) return;
    sim.setOrb(Math.atan2(hitPt.z, hitPt.x) * 180 / Math.PI - 90);   /* earthPos 역산 (φ=orb+90) */
  }
  syncScene(); renderStatus(); renderCtrls(); renderChips();
  afterAct();
});
function endGrab() {
  if (!grab) return;
  grab = null;
  controls.enabled = true;
  K3.sound.play('select');
}
renderer.domElement.addEventListener('pointerup', endGrab);
renderer.domElement.addEventListener('pointercancel', endGrab);

/* ── 미션 ── */
let thinkOpen = false;
function missionTick() {
  if (mode !== 'mission' || sim.mDone) return;
  const cur = sim.missionCur();
  if (cur.type === 'think') { openThink(cur); return; }
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  setTimeout(() => { syncScene(); renderAll(); missionTick(); }, T(1300));
}
function openThink(m) {
  if (thinkOpen) return;
  thinkOpen = true;
  K3.cards.predict(m.text.replace(/<[^>]+>/g, ''), m.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      thinkOpen = false;
      if (+v === m.a) {
        K3.sound.play('chime'); K3.sound.play('ting');
        K3.toast('🎉 정답!<br>' + m.why, false, T(4600));
        sim.missionAdvance();
        setTimeout(() => { syncScene(); renderAll(); if (!sim.mDone) missionTick(); }, T(1400));
      } else {
        K3.sound.play('fail');
        K3.toast('음… 다시 생각해 볼까요? 자전축이 어느 쪽으로 기울었는지 봐요!', true, T(2600));
        setTimeout(() => missionTick(), T(2700));
      }
    });
}

/* ── 모드·학년 ── */
function resetForMode() {
  sim.wifExit(); sim.wowExit();
  const st = sim.state;
  st.lat = sim.lat0; st.distAU = 1; st.orbAcc = 0; st.dayCnt = 0;
  st.pred.dist = { asked:false, ch:-1, lo:false, hi:false, done:false };
  st.pred.lat = { asked:false, ch:-1, done:false };
  st.tilt0Chip = false;
  st.wowDone = false; st.seenSummer = false; st.seenWinter = false;
  controls.enabled = true;
  qLock = false;
}
function setGrade(g) {
  sim.grade = g;
  if (!sim.G().modes.includes(mode)) mode = 'free';
  resetForMode();
  if (mode === 'mission') sim.missionStart();
  else if (mode === 'quiz') sim.quizReset(Math.random);
  else { sim.state.orb = sim.orb0; sim.state.tilt = sim.tilt0; }
  placePin(); syncScene(); renderAll();
  if (mode === 'mission') missionTick();
}
function setMode(m) {
  mode = m;
  resetForMode();
  if (m === 'mission') sim.missionStart();
  else if (m === 'quiz') sim.quizReset(Math.random);
  else { sim.state.orb = 90; sim.state.tilt = 23.5; }
  placePin(); syncScene(); renderAll();
  if (m === 'mission') missionTick();
}

/* ═══════════ 루프 ═══════════ */
const clock = new THREE.Clock();
const FASTX = window.__K3_FAST ? 14 : 1;
let spin = 0;
const _np = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()) * FASTX;

  spin += dt * 0.9;
  earthMesh.rotation.y = spin;                    /* 자전 (시각 디테일) */

  if (sim.state.playing) {
    sim.tick(dt);
    syncScene();
    renderStatus();
    const os = $('orbSlider');
    if (os) os.value = Math.round(sim.state.orb);
    afterAct();
  }

  if (sim.state.wowArmed) renderBeam();

  /* 자전축 라벨 투영 */
  if (mode !== 'quiz' && sim.G().showTilt) {
    npole.getWorldPosition(_np);
    _np.project(camera);
    if (_np.z < 1) {
      axisAnno.textContent = '🧲 자전축 ' + sim.effTilt().toFixed(1) + '°';
      axisAnno.style.left = ((_np.x * 0.5 + 0.5) * innerWidth) + 'px';
      axisAnno.style.top = ((-_np.y * 0.5 + 0.5) * innerHeight - 24) + 'px';
      axisAnno.style.display = '';
    } else axisAnno.style.display = 'none';
  } else axisAnno.style.display = 'none';

  controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}

if (mode === 'mission') sim.missionStart();
else if (mode === 'quiz') sim.quizReset(Math.random);
placePin();
syncScene();
renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast(sim.G().showTilt
  ? '자전축(금색 막대)의 <b>북극을 잡아 돌려 봐요</b> — 이 각도가 계절을 만들어요!'
  : '<b>계절 버튼</b>을 눌러 봄·여름·가을·겨울의 해 높이를 비교해 봐요!');
animate();
if (mode === 'mission') missionTick();

/* 테스트용 앱 훅 */
window.SeasonApp = {
  sim, get mode() { return mode; }, setMode, setGrade, act, startWhatif,
  earthPivot, earthMesh, npole, npoleProxy, earthProxy, axisRod, pin, orbGrp, ring, sunSpr,
  beamGrp, beamRod, patch, patchMat, earthMat, camera, controls, sunLight,
  get texReal() { return texReal; },
  syncScene, renderAll, afterAct, missionTick, wifTick, wowTick, predTick, tiltFromScreen,
  setOrb(v) { sim.setOrb(v); syncScene(); renderStatus(); renderCtrls(); renderChips(); afterAct(); },
  setTilt(v) { sim.setTilt(v); syncScene(); renderStatus(); renderCtrls(); renderChips(); afterAct(); },
  setLat(v) { sim.setLat(v); placePin(); syncScene(); renderStatus(); renderCtrls(); afterAct(); },
  setDist(v) { sim.setDist(v); syncScene(); renderStatus(); renderCtrls(); afterAct(); },
  armPred(kind) { if (sim.predArm(kind, mode)) askPred(kind); },
  runFor(sec) {
    sim.state.playing = true;
    for (let t = 0; t < sec; t += 0.05) sim.tick(0.05);
    syncScene(); renderStatus(); renderCtrls();
    afterAct();
  },
  answerQuiz(i) { const bs = document.querySelectorAll('#choices button'); for (const b of bs) if (+b.dataset.v === i) { b.click(); return true; } return false; }
};
</script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이랩 · 시계 읽기 — 스튜디오</title>
<!--
  케이랩 v3 · B트랙 황금 샘플 1호 — 시계 읽기 (2026-07-04)
  §2-B 프리미엄 2D 질감 레시피를 코드로 확정하는 판:
    ① 스튜디오 화면(다크 그라데이션 + 원목 작업 매트 + 스포트라이트)
    ② 실물 질감(호두나무 테·금속 베젤·아이보리 유리 문자판·황동 축·노이즈)
    ③ 직접 조작(긴바늘을 잡고 돌리기 — 집으면 떠오름)
    ④ 즉각 반응(분침 비례 시침 연동, 분침 한 바퀴 → 시침 한 칸 톱니 마법)
    ⑤ 탐구 구조(🔮 예측 카드 → 한 바퀴 돌려 확인 + 미션·퀴즈)
  v2 콘텐츠 무손실 이식: 학년칸(저/중/고)·미션 3~4·퀴즈 5문·와우(톱니 연동).
  클래식 스크립트(모듈 아님) = jsdom 하니스에서 전체 실행 가능(테스트 표준 확정 겸함).
  config: ?grade=low|mid|high & mode=free|mission|quiz & h= & m=   (grade 지정 시 선택기 잠금)
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style id="kedu-title-font">
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Gowun Dodum',sans-serif}
</style>
<link rel="stylesheet" href="/kedu/teacher/engine3/klab3-ui.css">
<style>
  /* ── 페이지 골격 ── */
  #root{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    background:var(--studio);overflow:hidden}
  #root::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 8%, transparent 55%, rgba(0,0,0,.4) 100%)}  /* 비네트 */
  .hudrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    margin-top:52px;z-index:21}
  .barslot{min-height:8px;z-index:21;width:min(680px,94vw);margin-top:8px}
  .stagewrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;
    min-height:0;z-index:2;padding:6px 0}
  .ctrlslot{z-index:21;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    padding:2px 10px;max-width:96vw}
  .statusrow{z-index:21;text-align:center;padding:6px 12px 14px}

  /* ── HUD 세그먼트(학년·모드) ── */
  .seg{display:flex;gap:4px;background:var(--hud);backdrop-filter:blur(8px);
    border:1px solid var(--hudline);border-radius:999px;padding:4px}
  .seg button{font-family:'Gowun Dodum';font-size:13.5px;color:#c6d4e2;background:transparent;
    border:none;border-radius:999px;padding:7px 13px;cursor:pointer;transition:all .15s}
  .seg button.on{background:rgba(91,155,240,.28);color:#fff;
    box-shadow:0 0 0 1.5px rgba(91,155,240,.55), 0 0 18px -4px #5B9BF0}
  .sndbtn{background:var(--hud);border:1px solid var(--hudline);border-radius:999px;
    color:#c6d4e2;font-size:15px;padding:7px 12px;cursor:pointer}
  .sndbtn.off{opacity:.45}

  /* ── 미션·퀴즈 바 ── */
  .k3bar{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);
    border-radius:16px;padding:11px 16px;color:#e6eef7;font-size:15px;line-height:1.6;
    display:flex;align-items:center;gap:12px}
  .k3bar .prog{margin-left:auto;flex:0 0 auto;font-size:12.5px;color:var(--mut);white-space:nowrap}
  .k3bar b{color:#BCA7FF}
  .k3bar.done{border-color:rgba(18,184,134,.5);box-shadow:0 0 24px -8px #12B886}

  /* ── 작업 매트(원목 책상) + 스포트라이트 ── */
  .desk{position:relative;border-radius:30px;padding:min(3.4vh,26px) min(4vw,34px);
    background:
      radial-gradient(90% 70% at 50% 26%, rgba(255,240,214,.10), transparent 62%),
      repeating-linear-gradient(94deg, rgba(46,28,12,.16) 0 2px, transparent 2px 9px),
      linear-gradient(150deg,#8a5a34 0%,#77492a 52%,#63391f 100%);
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.14),
               inset -3px -5px 14px rgba(0,0,0,.38),
               0 26px 60px -18px rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.07)}
  .desk::before{content:'';position:absolute;inset:0;border-radius:30px;pointer-events:none;
    background-image:var(--noise, none);opacity:.5;mix-blend-mode:overlay}

  /* ── 시계 SVG ── */
  #clockSvg{display:block;width:min(52vh,86vw,470px);height:auto;touch-action:none}
  .ck-mhand{cursor:grab}
  .ck-mhand.lift .mh-line{stroke-width:11.5}
  .ck-mhand.lift{filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
  .ck-gear{animation:ckGearKf .8s ease both}
  @keyframes ckGearKf{0%{stroke-width:14}45%{stroke-width:22;stroke:#9B7BF5}100%{stroke-width:14}}

  /* ── 실물 조작 버튼(§2-B 레이어드 조명 3종 세트) ── */
  .ck-btn{font-family:'Gowun Dodum';font-size:16.5px;font-weight:700;color:#fff;border:none;
    border-radius:14px;padding:12px 16px;cursor:pointer;position:relative;line-height:1;
    background:linear-gradient(145deg, var(--c1), var(--c2));
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),
               inset -2px -3px 6px rgba(0,0,0,.25),
               0 6px 14px rgba(0,0,0,.4);
    transition:transform .1s, box-shadow .1s}
  .ck-btn:active{transform:translateY(3px);
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),
               inset -2px -3px 6px rgba(0,0,0,.25),
               0 2px 6px rgba(0,0,0,.4)}
  .ck-btn.minus{background:linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    color:var(--c1);border:1.5px solid var(--c1)}
  .ck-btn.ghost{background:linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    color:#9fb2c6;border:1.5px solid rgba(255,255,255,.22);font-size:18px;padding:12px 14px}
  .ck-btn.wow{background:linear-gradient(145deg,#8a67ee,#6d43d8);font-size:15px}

  /* ── 퀴즈 선택지 ── */
  .ck-choice{font-family:'Gowun Dodum';font-size:16px;font-weight:700;color:var(--card-ink);
    background:linear-gradient(160deg,#ffffff,#eef2f7);border:2px solid #d5dee9;border-radius:14px;
    padding:13px 18px;cursor:pointer;min-width:132px;
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.9), 0 6px 14px rgba(0,0,0,.4);
    transition:transform .1s}
  .ck-choice:active{transform:translateY(2px)}

  /* ── 상태 표시 ── */
  .timeread{font-family:var(--kedu-title);font-size:min(6.2vh,42px);color:#EAF2FB;
    text-shadow:0 0 22px rgba(91,155,240,.45), 0 2px 8px rgba(0,0,0,.5)}
  .hint{font-size:13.5px;color:var(--mut);margin-top:4px;line-height:1.6}
  .hint b{color:#cfe0f2}
  .hint .grabline{color:#FFB27A}
</style>

<!-- ═══ 순수 로직 (node/jsdom 테스트 대상 · DOM 무의존) ═══ -->
<script>
(function(){
  'use strict';
  /* 학년 칸 — v2 무손실: 저=정각·30분 닻(퀴즈 숨김) / 중=5분·퀴즈 / 고=1분·"분 전"·퀴즈 */
  var GRADES={
    low:  { modes:['free','mission'],        steps:[60,30] },
    mid:  { modes:['free','mission','quiz'], steps:[60,5]  },
    high: { modes:['free','mission','quiz'], steps:[60,5,1] }
  };
  var STEP_META={ 60:{c:'#5B9BF0',c2:'#3E7BD4',label:'1시간'}, 30:{c:'#9B7BF5',c2:'#7B57E0',label:'30분'},
                  5:{c:'#FF8A3D',c2:'#E06B1E',label:'5분'},   1:{c:'#12B886',c2:'#0B9A6E',label:'1분'} };
  var MODE_LABEL={ free:'자유탐구', mission:'미션', quiz:'퀴즈' };
  var GRADE_LABEL={ low:'저학년', mid:'중학년', high:'고학년' };

  /* 미션 — v2 텍스트 무손실 (b 색만 v3 보라 토큰으로) */
  var MISSIONS={
    low:[
      { text:'🕒 바늘을 움직여 <b>3시 정각</b>을 만들어 봐요! (긴바늘이 12 위에!)', tm:180 },
      { text:'🕢 이번엔 <b>7시 30분</b>! 긴바늘이 6 아래로, 짧은바늘은 7과 8 <b>사이</b>!', tm:450 },
      { text:'🕘 <b>9시 정각</b>을 만들어 봐요!', tm:540 }
    ],
    mid:[
      { text:'🕒 바늘을 움직여 <b>3시 정각</b>을 만들어 봐요!', tm:180 },
      { text:'🕢 이번엔 <b>7시 30분</b>! 짧은바늘이 7과 8 <b>사이</b>로 가는지 봐요!', tm:450 },
      { text:'⏱ <b>9시 5분</b> — 긴바늘이 숫자 1을 가리키면 5분이에요!', tm:545 }
    ],
    high:[
      { text:'🕒 바늘을 움직여 <b>3시 정각</b>을 만들어 봐요!', tm:180 },
      { text:'🕢 이번엔 <b>7시 30분</b>! 짧은바늘이 7과 8 <b>사이</b>로 가는지 봐요!', tm:450 },
      { text:'⏱ <b>9시 5분</b> — 긴바늘이 숫자 1을 가리키면 5분이에요!', tm:545 },
      { text:'🕦 <b>11시 55분</b>을 만들어 봐요 — "12시 5분 전"이라고도 해요!', tm:715 }
    ]
  };

  /* 퀴즈 — v2 5문 무손실 */
  var QUIZ_POOL=[
    { tm:180, q:'시계가 가리키는 시각은 몇 시일까요?', answer:'3시',
      choices:['3시','12시 15분','9시'] },
    { tm:450, q:'짧은바늘이 7과 8 사이에 있어요. 지금 시각은?', answer:'7시 30분',
      choices:['7시 30분','8시 30분','7시 6분'] },
    { tm:545, q:'긴바늘이 숫자 1을 가리켜요. 지금 시각은?', answer:'9시 5분',
      choices:['9시 5분','9시 1분','1시 45분'] },
    { tm:0,   q:'긴바늘(분침)이 시계를 한 바퀴 돌면 시간이 얼마나 지날까요?', answer:'1시간 (60분)',
      choices:['1시간 (60분)','1분','12시간'] },
    { tm:255, q:'지금 시계가 가리키는 시각은?', answer:'4시 15분',
      choices:['4시 15분','4시 3분','3시 15분'] }
  ];

  function norm(t){ return ((t%720)+720)%720; }

  /* 시계 상태 기계 — tm(0~719) 하나로 시침·분침 모두 계산(연동의 원천) */
  function makeClock(startM){
    var c={ tm: norm(startM||0) };
    c.hh=function(){ var h=Math.floor(c.tm/60)%12; return h===0?12:h; };
    c.mm=function(){ return c.tm%60; };
    c.timeStr=function(){ return c.hh()+'시'+(c.mm()===0?' 정각':' '+c.mm()+'분'); };
    /* apply — v2 applyTm 판정 무손실:
       revolved = 시(時) 칸이 바뀌었고 그것이 분침 회전(분값 변화) 때문일 때만(톱니 마법). */
    c.apply=function(newTm){
      var oldH=Math.floor(c.tm/60), oldMin=c.tm%60;
      c.tm=norm(newTm);
      var newH=Math.floor(c.tm/60), newMin=c.tm%60;
      return { revolved:(newH!==oldH)&&(newMin!==oldMin), minuteChanged:(newMin!==oldMin) };
    };
    return c;
  }

  /* 드래그: 중심 기준 벡터 → 분(0~59) */
  function minuteFromVec(dx,dy){
    var ang=Math.atan2(dx,-dy); if(ang<0)ang+=2*Math.PI;
    return Math.round(ang/(2*Math.PI)*60)%60;
  }
  /* 드래그 중 분침이 12를 넘으면 시(時) 칸 이동 — v2 carry 무손실 */
  function carryHour(dragHour,lastMin,minute){
    if(lastMin>=45 && minute<=15) return (dragHour+1)%12;
    if(lastMin<=15 && minute>=45) return (dragHour+11)%12;
    return dragHour;
  }

  var API={ GRADES:GRADES, STEP_META:STEP_META, MODE_LABEL:MODE_LABEL, GRADE_LABEL:GRADE_LABEL,
            MISSIONS:MISSIONS, QUIZ_POOL:QUIZ_POOL,
            norm:norm, makeClock:makeClock, minuteFromVec:minuteFromVec, carryHour:carryHour };
  if(typeof window!=='undefined') window.ClockCore=API;
  if(typeof module!=='undefined'&&module.exports) module.exports=API;
})();
</script>

<!-- ═══ 앱 (v3 스튜디오 화면·질감·조작·탐구) ═══ -->
<script>
(function(){
  'use strict';
  var CC=window.ClockCore, K3=window.K3;
  var $=function(id){ return document.getElementById(id); };
  document.documentElement.style.setProperty('--noise','url("'+K3.NOISE+'")');

  /* ── config (URL) ── */
  var Q=new URLSearchParams(location.search);
  var grade=(['low','mid','high'].indexOf(Q.get('grade'))>=0)?Q.get('grade'):'high';
  var locked=!!Q.get('grade');
  function G(){ return CC.GRADES[grade]; }
  var startM=CC.norm((((+Q.get('h')||12)%12)*60)+(+Q.get('m')||0));
  var mode=(G().modes.indexOf(Q.get('mode'))>=0)?Q.get('mode'):'free';

  var clock=CC.makeClock(startM);
  var mStep=0, mDone=false, mLock=false;
  var qList=[], qIdx=0, qScore=0, qCount=0, qLock=false;
  var dragging=false, dragHour=0, lastMin=0;
  var revealing=false, prediction=null;
  var REVEAL_MS=window.__K3_FAST?80:1700;

  function snd(n){ K3.sound.play(n); }
  function shuffled(arr){
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function shuffleQuiz(){ qList=shuffled(CC.QUIZ_POOL); qIdx=0;qScore=0;qCount=0; }
  function curMissions(){ return CC.MISSIONS[grade]; }

  /* ── tm 변경 공통 진입 (v2 applyTm 무손실 + v3 연출) ── */
  function applyTm(newTm, viaMinute){
    var ev=clock.apply(newTm);
    if(ev.revolved){                       // 와우 A: 분침 한 바퀴 → 시침 한 칸 (톱니)
      snd('ting'); render({gear:true});
      if(!revealing) K3.toast('🔗 분침이 12를 지나 시침이 한 칸! 두 바늘이 <b>톱니처럼 맞물려</b> 돌아요');
    } else if(ev.minuteChanged){
      if(!revealing) snd(viaMinute?'tick':'tap');
      render({});
    } else { if(!revealing) snd('tap'); render({}); }
    if(mode==='mission') checkMission();
  }
  function step(d){ applyTm(clock.tm+d,false); }

  /* ── 미션 ── */
  function checkMission(){
    if(mode!=='mission'||mDone||mLock) return;
    var M=curMissions();
    if(clock.tm===M[mStep].tm){
      mLock=true; snd('chime');
      K3.toast('🎉 참 잘했어요! <b>'+clock.timeStr()+'</b> 완성!');
      setTimeout(function(){
        mLock=false; mStep++;
        if(mStep>=curMissions().length) mDone=true;
        build();
      }, window.__K3_FAST?60:1500);
    }
  }

  /* ── 와우 B: 🔮 예측 → 한 바퀴 확인 ── */
  function startReveal(){
    if(revealing) return;
    revealing=true; snd('whoosh');
    var t0=clock.tm, tgt=t0+60, begin=null;
    function ease(p){ return p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; }
    function frame(ts){
      if(begin===null) begin=ts;
      var p=Math.min((ts-begin)/REVEAL_MS,1);
      applyTm(Math.round(t0+60*ease(p)), true);
      if(p<1){ requestAnimationFrame(frame); return; }
      revealing=false; snd('chime');
      var ok=(prediction==='one');
      K3.cards.result(
        '<h3 style="color:'+(ok?'#0d7a5c':'#B9522F')+'">'+(ok?'🎯 예측 적중!':'🤔 예측과 달랐죠?')+'</h3>'
        +'<p style="font-size:13.5px;line-height:1.75;color:#41546a">'
        +'긴바늘이 <b>한 바퀴(60분)</b> 도는 동안 짧은바늘은 <b>숫자 딱 한 칸(1시간)</b>만 갔어요.<br>'
        +'두 바늘은 <b>톱니처럼 맞물려</b> 함께 돌아요 — 짧은바늘이 숫자 <b>사이</b>에 있으면 몇 분이 지나는 중이라는 뜻!</p>',
        [{label:'🔁 한 바퀴 더!', value:'again'},{label:'좋아, 계속 탐구', cls:'pri', value:'done'}]
      ).then(function(v){ if(v==='again') startReveal(); });
    }
    requestAnimationFrame(frame);
  }
  function askPredict(){
    snd('charge');
    K3.cards.predict('긴바늘(분침)이 한 바퀴 돌면, 짧은바늘(시침)은 어떻게 될까요?',
      [{id:'full', label:'① 짧은바늘도 한 바퀴 돈다'},
       {id:'one',  label:'② 숫자 한 칸만 움직인다'},
       {id:'none', label:'③ 짧은바늘은 안 움직인다'}]
    ).then(function(id){ prediction=id; startReveal(); });
  }

  /* ── 빌드 ── */
  function build(){
    /* 학년 세그 */
    var gs=$('gradeSeg');
    if(locked){ gs.style.display='none'; }
    else{
      gs.innerHTML=['low','mid','high'].map(function(g){
        return '<button data-g="'+g+'" class="'+(g===grade?'on':'')+'">'+CC.GRADE_LABEL[g]+'</button>';
      }).join('');
      gs.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){
          if(b.dataset.g===grade)return;
          grade=b.dataset.g; snd('select');
          if(G().modes.indexOf(mode)<0) mode='free';
          mStep=0;mDone=false;mLock=false;
          clock.tm=(mode==='mission')?0:startM;
          if(mode==='quiz')shuffleQuiz();
          build();
        });
      });
    }
    /* 모드 세그 */
    var ms=$('modeSeg');
    ms.innerHTML=G().modes.map(function(m){
      return '<button data-m="'+m+'" class="'+(m===mode?'on':'')+'">'+CC.MODE_LABEL[m]+'</button>';
    }).join('');
    ms.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){
        if(b.dataset.m===mode)return;
        mode=b.dataset.m; snd('select');
        mStep=0;mDone=false;mLock=false;
        clock.tm=(mode==='mission')?0:startM;   // 미션은 12시 정각에서 시작(v2)
        if(mode==='quiz')shuffleQuiz();
        K3.cards.hide();
        build();
      });
    });

    /* 미션·퀴즈 바 */
    var bar=$('barSlot');
    if(mode==='mission'){
      var M=curMissions();
      bar.innerHTML=mDone
        ? '<div class="k3bar done">🎉 미션을 모두 해냈어요! 자유탐구에서 마음껏 돌려 봐요.</div>'
        : '<div class="k3bar"><span>'+M[mStep].text+'</span><span class="prog">'+(mStep+1)+' / '+M.length+'</span></div>';
    } else if(mode==='quiz'){
      var q=qList[qIdx]||qList[0];
      clock.tm=q.tm;
      bar.innerHTML='<div class="k3bar"><span>❓ '+q.q+'</span><span class="prog">점수 '+qScore+' / '+qCount+'</span></div>';
    } else bar.innerHTML='';

    /* 무대(시계) */
    $('desk').innerHTML=clockSVG();
    bindDrag();

    /* 컨트롤 */
    var ct=$('ctrlSlot'), s='';
    if(mode!=='quiz'){
      G().steps.forEach(function(d){
        var m=CC.STEP_META[d];
        s+='<button class="ck-btn minus" data-d="-'+d+'" style="--c1:'+m.c+';--c2:'+m.c2+'">－'+m.label+'</button>'
          +'<button class="ck-btn" data-d="'+d+'" style="--c1:'+m.c+';--c2:'+m.c2+'">＋'+m.label+'</button>';
      });
      s+='<button class="ck-btn ghost" data-d="reset" title="처음으로">↺</button>';
      if(mode==='free') s+='<button class="ck-btn wow" id="wowBtn">🔮 한 바퀴 돌리면?</button>';
    } else {
      var q2=qList[qIdx]||qList[0];
      s=shuffled(q2.choices).map(function(v){
        return '<button class="ck-choice" data-v="'+v+'">'+v+'</button>';
      }).join('');
    }
    ct.innerHTML=s;
    ct.querySelectorAll('.ck-btn[data-d]').forEach(function(b){
      b.addEventListener('click',function(){
        if(revealing)return;
        if(b.dataset.d==='reset'){ snd('select'); clock.tm=(mode==='mission')?0:startM; render({}); if(mode==='mission')checkMission(); }
        else step(+b.dataset.d);
      });
    });
    var wb=$('wowBtn'); if(wb) wb.addEventListener('click',function(){ if(!revealing) askPredict(); });
    ct.querySelectorAll('.ck-choice').forEach(function(b){
      b.addEventListener('click',function(){
        if(qLock)return; qLock=true; qCount++;
        var q3=qList[qIdx], ok=(b.dataset.v===String(q3.answer));
        if(ok){ qScore++; snd('chime'); K3.toast('🎉 정답! <b>'+q3.answer+'</b>'); }
        else { snd('fail'); K3.toast('🤔 아까워요! 정답은 <b>'+q3.answer+'</b>', true); }
        setTimeout(function(){
          qIdx++; if(qIdx>=qList.length)shuffleQuiz();
          qLock=false; build();
        }, window.__K3_FAST?60:1400);
      });
    });

    render({});
  }

  /* ── 시계 그리기 (§2-B 질감: 호두나무 테·금속 베젤·아이보리 문자판·유리 광택·노이즈·황동 축) ── */
  var VB=480, cx=VB/2, cy=VB/2, R=190;
  function clockSVG(){
    var s='<svg id="clockSvg" viewBox="0 0 '+VB+' '+VB+'" xmlns="http://www.w3.org/2000/svg">';
    s+='<defs>'
      +'<filter id="ckDrop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>'
      +'<filter id="ckHand" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/></filter>'
      +'<filter id="ckNoise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer><feComposite operator="in" in2="SourceGraphic"/></filter>'
      +'<radialGradient id="ckWood" cx="36%" cy="28%" r="90%"><stop offset="0" stop-color="#9a6a3e"/><stop offset=".55" stop-color="#7c4f28"/><stop offset="1" stop-color="#5d3818"/></radialGradient>'
      +'<pattern id="ckGrain" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(94)"><rect width="9" height="9" fill="none"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(40,22,8,0.22)" stroke-width="2"/></pattern>'
      +'<linearGradient id="ckMetal" x1="0" y1="0" x2="1" y2="0.18"><stop offset="0" stop-color="#9aa2ac"/><stop offset=".24" stop-color="#e6ebf1"/><stop offset=".48" stop-color="#8d949e"/><stop offset=".74" stop-color="#ced4dc"/><stop offset="1" stop-color="#7e858f"/></linearGradient>'
      +'<radialGradient id="ckFace" cx="38%" cy="30%" r="85%"><stop offset="0" stop-color="#FFFDF6"/><stop offset=".7" stop-color="#F4ECDC"/><stop offset="1" stop-color="#E7DCC6"/></radialGradient>'
      +'<linearGradient id="ckGloss" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.5)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>'
      +'<linearGradient id="ckHour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FA6F2"/><stop offset="1" stop-color="#2E62B8"/></linearGradient>'
      +'<linearGradient id="ckMin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA75E"/><stop offset="1" stop-color="#E0661A"/></linearGradient>'
      +'<radialGradient id="ckBrass" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#F6DE9B"/><stop offset=".6" stop-color="#D2A24A"/><stop offset="1" stop-color="#9C6F22"/></radialGradient>'
      +'</defs>';
    /* 몸통: 호두나무 테(나뭇결 패턴) + 금속 베젤 */
    s+='<g filter="url(#ckDrop)">'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+38)+'" fill="url(#ckWood)"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+38)+'" fill="url(#ckGrain)"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+38)+'" fill="none" stroke="rgba(255,236,200,0.28)" stroke-width="2.5" transform="translate(-1.5,-1.5)"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+13)+'" fill="url(#ckMetal)"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+4)+'" fill="rgba(0,0,0,0.35)"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#ckFace)"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#fff" filter="url(#ckNoise)"/>'
      +'</g>';
    /* 눈금(음각: 어두운 선 + 좌상단 하이라이트) */
    for(var i=0;i<60;i++){
      var a=i*6*Math.PI/180, big=(i%5===0);
      var r1=R-(big?22:12), r2=R-6;
      var x1=cx+r1*Math.sin(a), y1=cy-r1*Math.cos(a), x2=cx+r2*Math.sin(a), y2=cy-r2*Math.cos(a);
      s+='<line x1="'+(x1-0.8)+'" y1="'+(y1-0.8)+'" x2="'+(x2-0.8)+'" y2="'+(y2-0.8)+'" stroke="rgba(255,255,255,0.7)" stroke-width="'+(big?4:2)+'" stroke-linecap="round"/>'
        +'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(big?'#3A4A5E':'#9AA8B8')+'" stroke-width="'+(big?4:2)+'" stroke-linecap="round"/>';
    }
    /* 숫자 1~12 (제목 폰트) + 분 보조(비퀴즈) */
    for(var n=1;n<=12;n++){
      var an=n*30*Math.PI/180;
      s+='<text x="'+(cx+(R-48)*Math.sin(an))+'" y="'+(cy-(R-48)*Math.cos(an))+'" text-anchor="middle" dominant-baseline="central" font-family="var(--kedu-title)" font-size="35" fill="#2A3B50">'+n+'</text>';
      if(mode!=='quiz'){
        s+='<text class="ck-minnum" x="'+(cx+(R-82)*Math.sin(an))+'" y="'+(cy-(R-82)*Math.cos(an))+'" text-anchor="middle" dominant-baseline="central" font-family="Gowun Dodum" font-weight="700" font-size="14" fill="#E07B2E">'+((n*5)%60)+'</text>';
      }
    }
    /* 바늘 + 유리 광택 + 황동 축 (render에서 각도 갱신) */
    s+='<line id="hourHand" x1="0" y1="0" x2="0" y2="0" stroke="url(#ckHour)" stroke-width="14" stroke-linecap="round" filter="url(#ckHand)"/>';
    s+='<g id="minHand" class="ck-mhand"><line class="mh-line" x1="0" y1="0" x2="0" y2="0" stroke="url(#ckMin)" stroke-width="9" stroke-linecap="round" filter="url(#ckHand)"/></g>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="13" fill="url(#ckBrass)" filter="url(#ckHand)"/><circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="#FFF7E6"/>';
    s+='<ellipse cx="'+(cx-58)+'" cy="'+(cy-76)+'" rx="'+(R*0.66)+'" ry="'+(R*0.42)+'" fill="url(#ckGloss)" transform="rotate(-24 '+(cx-58)+' '+(cy-76)+')" pointer-events="none"/>';
    s+='</svg>';
    return s;
  }

  /* ── 렌더(바늘·상태만 갱신 — 무대는 build 시 1회) ── */
  function render(opts){
    opts=opts||{};
    var svg=$('clockSvg'); if(!svg) return;
    var ha=(clock.tm/720)*2*Math.PI, ma=(clock.mm()/60)*2*Math.PI;
    var hh=$('hourHand');
    hh.setAttribute('x1',cx-18*Math.sin(ha)); hh.setAttribute('y1',cy+18*Math.cos(ha));
    hh.setAttribute('x2',cx+(R-108)*Math.sin(ha)); hh.setAttribute('y2',cy-(R-108)*Math.cos(ha));
    var ml=svg.querySelector('#minHand .mh-line');
    ml.setAttribute('x1',cx-22*Math.sin(ma)); ml.setAttribute('y1',cy+22*Math.cos(ma));
    ml.setAttribute('x2',cx+(R-44)*Math.sin(ma)); ml.setAttribute('y2',cy-(R-44)*Math.cos(ma));
    if(opts.gear){ hh.classList.remove('ck-gear'); try{hh.getBBox();}catch(e){} hh.classList.add('ck-gear');
      setTimeout(function(){ hh.classList.remove('ck-gear'); }, 850); }

    var st=$('statusRow');
    if(mode==='quiz'){
      st.innerHTML='<div class="hint">짧은바늘(파랑)=<b>시</b>, 긴바늘(주황)=<b>분</b>! 잘 보고 답을 골라요.</div>';
      return;
    }
    var hint=(grade==='low')
      ? '긴바늘(주황)이 <b>12 위</b>면 정각, <b>6 아래</b>면 30분이에요!'
      : '짧은바늘(파랑)이 <b>시</b>, 긴바늘(주황)이 <b>분</b>이에요. 긴바늘이 한 바퀴(60분) 돌면 짧은바늘이 숫자 한 칸 움직여요.';
    st.innerHTML='<div class="timeread">'+clock.timeStr()+'</div>'
      +'<div class="hint">'+hint+'<br><span class="grabline">✋ 긴바늘(주황)을 잡고 돌려 보세요 — 시침이 톱니처럼 따라와요</span></div>';
  }

  /* ── 드래그(직접 조작 · 집으면 떠오름) ── */
  function minuteFromEvent(e){
    var svg=$('clockSvg'); if(!svg) return null;
    var r=svg.getBoundingClientRect();
    var px=(e.clientX!=null)?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:null);
    var py=(e.clientY!=null)?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:null);
    if(px==null||py==null||!r.width) return null;
    return CC.minuteFromVec(px-(r.left+r.width/2), py-(r.top+r.height/2));
  }
  function dragStart(e){
    if(mode==='quiz'||revealing) return;
    dragging=true; dragHour=Math.floor(clock.tm/60); lastMin=clock.tm%60;
    var mh=document.querySelector('#minHand'); if(mh)mh.classList.add('lift');
    if(e.preventDefault)e.preventDefault();
  }
  function dragMove(e){
    if(!dragging) return;
    var minute=minuteFromEvent(e); if(minute==null) return;
    dragHour=CC.carryHour(dragHour,lastMin,minute);
    lastMin=minute;
    applyTm(dragHour*60+minute, true);
    var mh=document.querySelector('#minHand'); if(mh)mh.classList.add('lift');
    if(e.preventDefault)e.preventDefault();
  }
  function dragEnd(){
    dragging=false;
    var mh=document.querySelector('#minHand'); if(mh)mh.classList.remove('lift');
  }
  function bindDrag(){
    var svg=$('clockSvg'); if(!svg) return;
    svg.addEventListener('pointerdown',dragStart);
    svg.addEventListener('pointermove',dragMove);
    svg.addEventListener('pointerup',dragEnd);
    svg.addEventListener('pointerleave',dragEnd);
    svg.addEventListener('touchstart',dragStart,{passive:false});
    svg.addEventListener('touchmove',dragMove,{passive:false});
    svg.addEventListener('touchend',dragEnd);
  }

  /* ── 사운드 토글 ── */
  $('sndBtn').addEventListener('click',function(){
    K3.sound.setOn(!K3.sound.on);
    this.textContent=K3.sound.on?'🔊':'🔇';
    this.classList.toggle('off',!K3.sound.on);
    if(K3.sound.on)snd('select');
  });

  if(mode==='quiz')shuffleQuiz();
  if(mode==='mission')clock.tm=0;
  build();

  /* 테스트 훅 */
  window.ClockApp={
    get grade(){return grade;}, get mode(){return mode;}, get clock(){return clock;},
    get mStep(){return mStep;}, get mDone(){return mDone;},
    get qScore(){return qScore;}, get qCount(){return qCount;},
    get quiz(){return { list:qList, idx:qIdx };},
    applyTm:applyTm, build:build, startReveal:startReveal,
    _set:function(o){ if(o.prediction!==undefined)prediction=o.prediction; }
  };
})();
</script>
</body>
</html>

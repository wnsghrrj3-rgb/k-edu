<!--
  케이랩 v3 · A트랙 — 태양계 (2026-07-13 · 페이블) · 천체 통합 재건 4호
  v2 engine/tools/solar.js(639줄 · 탐구 표준 v2 4층 완료본) 전면 재건 · r185 + klab3 코어.
  스튜디오 5요소: ① 우주 무대(별 1200 · 태양 · 8행성 · 궤도 링 · 토성 고리 · 🟢 골디락스 띠)
    ② 실물 질감(sun/jupiter/saturn/saturn_ring + earth_day 승급 로더 · 폴백 절대 안 깨짐)
    ③ 직접 조작(🔴 지구를 궤도째 «집어» 끌기 · 🔭 비율 연속 슬라이더 · 행성 선택 · 지구에서 보기)
    ④ 즉각 반응(비율을 당길수록 행성이 점이 되고 우주가 비어 감 · 골디락스 이탈 = 끓음/얼음)
    ⑤ 탐구 구조(미션 6 · 퀴즈 5 · 만약에 4+저1 · 예측 칩 · 와우=🚀 빛의 여행)
  🔴 신기술 2종(페이블 몫 이행):
    ① 지구 궤도째 잡아 끌기 — 지구를 레이캐스트로 집고 궤도 평면에 투영, 무대 반지름을 «AU로 역산»
       (auFromDist = auToDist의 역함수, 이진 탐색). v2의 「가로 드래그 = 지수 스케일」을 승격 —
       이제 골디락스 띠(초록 링)를 손으로 넘나든다. 띠 밖 = 바다가 끓거나 꽁꽁.
    ② 🚀 빛의 여행 — 태양에서 출발한 빛 껍질이 «실제 광행시 비율»로 퍼져 나간다(1 AU = 499초).
       무대 1초 = 실제 10분. 지구 도달 = 8분 19초, 해왕성 = 4시간 10분. 빛조차 아직도 못 닿는
       그 시간이 흐르는 동안, 태양계가 얼마나 «크고 텅 비었는지»가 몸으로 들어온다.
       「지금 네가 보는 햇빛은 8분 19초 전의 태양이다.」
  v2 무손실: 학년칸 저(낮과 밤 닻 = 지구 자전 클로즈업·미션3·🛑자전멈춤)/중(행성 선택·지구 잡기·미션4·🔥🧊)
    /고(비율·속도·시점 풀·미션6·만약에4)
    ·미션 6단계(make+think) ·저학년 미션 3단계 ·퀴즈 5문
    ·만약에 4종(🔥수성자리 · 🧊해왕성자리 · 🕳공전멈춤=나선 추락 · ☀️태양소멸=관성 직선 이탈)
    ·저학년 만약에(🛑자전멈춤=끝없는 낮/밤) ·예측 노트(🔭실제 비율) ·5칩 토스트
    ·🟢 골디락스 띠(0.85~1.4 AU)·끓음/얼음 틴트 ·👁 지구에서 보기 ·상태줄 문구 전부
  v3 추가: 만약에 조작 게이트(wifActed) · 판정 후처리 일원화(afterAct)
  config: ?grade=low|mid|high(지정 시 잠금) · ?mode=free|mission|quiz · ?ratio=0~1 · ?au=0.39~30.1
-->

<!-- ═══ 순수 로직 (window.SolarSim · node 테스트 대상 · DOM/THREE 무의존) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 8행성 (v2 무손실) ── */
  var PL = [
    { k:'mer', nm:'수성',   au:0.39, r:0.38, col:0x9c8a7a, yr:0.24, desc:'태양에서 가장 가깝고 가장 작은 행성' },
    { k:'ven', nm:'금성',   au:0.72, r:0.95, col:0xe6c47a, yr:0.62, desc:'두꺼운 구름에 싸인 가장 뜨거운 행성' },
    { k:'ear', nm:'지구',   au:1.00, r:1.00, col:0x2b6cb0, yr:1.00, desc:'생명이 사는 우리 행성' },
    { k:'mar', nm:'화성',   au:1.52, r:0.53, col:0xc1440e, yr:1.88, desc:'붉게 보이는 행성' },
    { k:'jup', nm:'목성',   au:5.20, r:11.2, col:0xc99039, yr:11.9, desc:'태양계에서 가장 큰 행성' },
    { k:'sat', nm:'토성',   au:9.50, r:9.40, col:0xe0c884, yr:29.5, desc:'아름다운 고리를 가진 행성' },
    { k:'ura', nm:'천왕성', au:19.2, r:4.00, col:0x9fd8e0, yr:84,   desc:'옆으로 누워 자전하는 행성' },
    { k:'nep', nm:'해왕성', au:30.1, r:3.90, col:0x3b5bdb, yr:165,  desc:'태양에서 가장 먼 행성' }
  ];
  var AU_MIN = 0.39, AU_MAX = 30.1;
  var GOLD_LO = 0.85, GOLD_HI = 1.4;

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  /* ── 스케일 (v2 무손실): 보기 좋게(t=0) ↔ 실제 비율(t=1) 연속 보간 ── */
  function auIdx(au){                        /* 임의 AU → 「보기 좋게」 간격의 가상 순번 (조각별 선형) */
    if(au <= PL[0].au) return 0;
    for(var i = 0; i < PL.length - 1; i++){
      if(au <= PL[i + 1].au) return i + (au - PL[i].au) / (PL[i + 1].au - PL[i].au);
    }
    return PL.length - 1;
  }
  function auToDist(au, t){
    var p = 3.4 + auIdx(au) * 2.0;           /* 보기 좋게 = 순번 등간격 */
    var r = 3 + au * 3.4;                    /* 실제 = AU 비례 */
    return p + (r - p) * t;
  }
  /* 🔴 역함수 — 무대 반지름 → AU (auToDist가 au에 대해 단조증가 → 이진 탐색) */
  function auFromDist(d, t){
    var lo = AU_MIN, hi = AU_MAX;
    if(d <= auToDist(lo, t)) return lo;
    if(d >= auToDist(hi, t)) return hi;
    for(var i = 0; i < 40; i++){
      var mid = (lo + hi) / 2;
      if(auToDist(mid, t) < d) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  function dist(i, t){ return auToDist(PL[i].au, t); }
  function prad(i, t){
    var p = 0.34 + Math.log(PL[i].r + 1) * 0.42;
    var r = Math.max(0.08, PL[i].r * 0.28);
    return p + (r - p) * t;
  }
  function band(au){ return au < GOLD_LO ? 'hot' : (au > GOLD_HI ? 'cold' : 'ok'); }

  /* ── 🚀 빛의 여행 (와우의 심장) ── */
  var LIGHT_SEC_PER_AU = 499;                /* 1 AU를 빛이 가는 데 499초 (8분 19초) */
  var LIGHT_AU_PER_SEC = 1.204;              /* 무대 진행 속도: 해왕성(30.1 AU)까지 25초 */
  function lightSec(au){ return au * LIGHT_SEC_PER_AU; }
  function lightTimeStr(sec){
    sec = Math.round(sec);
    if(sec < 60) return sec + '초';
    if(sec < 3600){
      var m = Math.floor(sec / 60), s = sec % 60;
      return m + '분' + (s ? ' ' + s + '초' : '');
    }
    var h = Math.floor(sec / 3600), mm = Math.round((sec % 3600) / 60);
    return h + '시간' + (mm ? ' ' + mm + '분' : '');
  }

  /* ── 학년 칸 (v2 GRADES 무손실) ── */
  var GRADES = {
    low:  { showReal:false, showPlanets:false, mIdx:[], lowScene:true,
            wif:['stopspin'], wow:false, v2:{ grab:false, ratio:false, spd:false, view:false },
            hint:'🌞 하루 돌리기로 지구를 돌려, 낮과 밤이 어떻게 생기는지 봐요.' },
    mid:  { showReal:false, showPlanets:true,  mIdx:[0,1,2,5], lowScene:false,
            wif:['mer','nep'], wow:false, v2:{ grab:true, ratio:false, spd:false, view:false },
            hint:'행성을 골라 보고, 🌍 지구를 잡아 궤도를 옮기면 어떻게 될지 봐요.' },
    high: { showReal:true,  showPlanets:true,  mIdx:[0,1,2,3,4,5], lowScene:false,
            wif:['mer','nep','stopo','sunoff'], wow:true, v2:{ grab:true, ratio:true, spd:true, view:true },
            hint:'🔭 비율 슬라이더를 스르륵 당겨 진짜 거리·크기를 봐요.' }
  };

  /* ── 미션 6단계 (v2 무손실) ── */
  var MISSIONS = [
    { type:'make', text:'🌍 행성 버튼에서 <b>우리가 사는 지구</b>를 찾아 골라 봐요!',
      check:function(s){ return s.sel === 'ear'; } },
    { type:'think', text:'🤔 태양에서 <b>멀리 있는 행성일수록</b> 어떻게 될까요?',
      ch:['더 춥고, 공전도 더 느려요','더 뜨겁고 빨라요','거리와 상관없이 똑같아요'], a:0,
      why:'태양에서 멀수록 받는 빛과 열이 적어 춥고, 한 바퀴 도는 길도 길어 공전이 오래 걸려요. 해왕성의 1년은 지구의 165년!' },
    { type:'make', text:'🪐 태양계에서 <b>가장 큰 행성</b>은 누구일까요? 골라 봐요!',
      check:function(s){ return s.sel === 'jup'; } },
    { type:'make', text:'🔭 <b>실제 비율</b>을 켜서 진짜 거리·크기를 봐요!',
      check:function(s){ return s.real === true; } },
    { type:'think', text:'🤔 실제 비율에서 행성들이 <b>점처럼 작아 보인</b> 까닭은?',
      ch:['우주가 그만큼 어마어마하게 텅 비어 있어서','화면이 고장 나서','행성이 진짜로 줄어들어서'], a:0,
      why:'태양계는 거의 다 빈 공간! 태양을 농구공이라 하면 지구는 30m쯤 떨어진 콩알이에요.' },
    { type:'make', text:'🌀 <b>태양에서 가장 먼 행성</b>을 찾아 골라 봐요!',
      check:function(s){ return s.sel === 'nep'; } }
  ];
  /* 저학년 전용 — 낮과 밤(지구 자전) 닻 (v2 무손실) */
  var LOW_MISSIONS = [
    { type:'make', text:'🌞 <b>하루 돌리기</b>를 눌러 지구를 빙글 돌려 봐요!',
      check:function(s){ return s.playing === true; } },
    { type:'think', text:'🤔 내가 사는 곳(<b>빨간 점</b>)이 <b>밝은 쪽</b>에 오면 지금은?',
      ch:['낮','밤','겨울'], a:0,
      why:'태양 빛을 받는 쪽이 낮이에요! 지구가 돌면서 빨간 점이 밝은 쪽으로 오면 낮이 돼요.' },
    { type:'think', text:'🤔 빨간 점이 <b>어두운 쪽</b>으로 넘어가면?',
      ch:['밤이 돼요','낮이 그대로예요','계절이 바뀌어요'], a:0,
      why:'태양 빛을 못 받는 쪽이 밤! 지구가 하루에 한 바퀴 돌며 낮과 밤이 번갈아 와요.' }
  ];

  /* ── 퀴즈 (v2 무손실) ── */
  var QUIZ = [
    { q:'태양에서 가장 가까운 행성은?', ch:['수성','금성','지구'], a:0 },
    { q:'태양계에서 가장 큰 행성은?', ch:['목성','토성','지구'], a:0 },
    { q:'우리가 사는 지구는 태양에서 몇 번째 행성일까요?', ch:['세 번째','첫 번째','다섯 번째'], a:0 },
    { q:'아름다운 고리를 가진 행성은?', ch:['토성','화성','수성'], a:0 },
    { q:'태양에서 가장 먼 행성은?', ch:['해왕성','천왕성','목성'], a:0 }
  ];

  /* ── 만약에 (v2 무손실 + v3 조작 게이트) ── */
  var WHATIF = {
    mer:   { icon:'🔥', title:'지구가 수성 자리에 있다면?',
      q:'지구를 태양 바로 옆(수성 자리)으로 옮기면 어떻게 될까요?',

    sim.missionList = function(){

        var nx = M[sim.mStep];
        if(nx.set) nx.set(sim.state);
        return { act:'next', step:sim.mStep };
      }
      sim.mDone = true;
      return { act:'done' };
    };

    /* ── 퀴즈 (v2 무반복 순환) ── */
    sim.qIdx = 0; sim.qScore = 0; sim.qCount = 0; sim.qUsed = [];
    sim.quizList = function(){ return QUIZ.slice(); };
    sim.newQuiz = function(rand){
      rand = rand || Math.random;
      if(sim.qUsed.length >= QUIZ.length) sim.qUsed = [];
      var cand = [];
      for(var i = 0; i < QUIZ.length; i++) if(sim.qUsed.indexOf(i) < 0) cand.push(i);
      sim.qIdx = cand[Math.floor(rand() * cand.length)];
      sim.qUsed.push(sim.qIdx);
      sim.state.sel = null;
      return sim.qIdx;
    };
    sim.quizAnswer = function(i){
      var q = QUIZ[sim.qIdx], ok = (i === q.a);
      sim.qCount++;
      if(ok) sim.qScore++;
      return { ok:ok, correct:q.ch[q.a] };
    };
    sim.quizReset = function(rand){
      sim.qScore = 0; sim.qCount = 0; sim.qUsed = [];
      sim.newQuiz(rand);
    };

    /* ── 상태줄 (v2 문구 무손실) ── */
    sim.statusText = function(mode){
      var st = sim.state, out = { lines:[], warn:false };

      /* 저학년 = 낮과 밤 */
      if(sim.G().lowScene){
        if(st.wif === 'stopspin'){
          out.warn = true;
          out.lines.push('<span class="big">🛑 자전이 멈춘 지구 — 태양 쪽은 끝없는 낮, 반대쪽은 끝없는 밤!</span>');
          if(!st.wifDone && st.wifPred !== null) out.lines.push('<span class="hold">' + LOW_WHATIF.stopspin.tip + '</span>');
          return out;
        }
        if(mode === 'quiz'){ out.lines.push('태양계 그림을 보면서 답을 골라요!'); return out; }
        var day = sim.isDay();
        out.lines.push('<span class="big">' + (day ? '☀️ 지금 빨간 점이 있는 곳은 낮!' : '🌙 지금 빨간 점이 있는 곳은 밤!') + '</span>');
        out.lines.push(GRADES.low.hint);
        return out;
      }

      if(mode === 'quiz'){
        out.lines.push('태양계 그림을 보면서 답을 골라요! (화면을 끌어 돌려볼 수 있어요)');
        return out;
      }

      /* 🚀 와우 */
      if(st.wowArmed){
        out.warn = true;
        if(!st.lightOn && st.lightAU === 0){
          out.lines.push('<span class="big">🚀 빛의 여행</span>');
          out.lines.push('태양에서 빛을 «지금» 쏘아 봐요. 실제 비율의 태양계를 빛이 가로지릅니다.');
          if(st.wowPred !== null) out.lines.push('<span class="hold">🔦 「빛 쏘기」를 눌러 출발!</span>');
        } else {
          var pass = [];
          for(var i = 0; i < PL.length; i++) if(st.lightAU >= PL[i].au) pass.push(PL[i].nm);
          out.lines.push('<span class="big">🚀 빛이 달린 시간 — ' + lightTimeStr(sim.lightElapsed()) + '</span>');
          out.lines.push(pass.length ? ('지나온 행성: ' + pass.join(' · ')) : '아직 아무 행성에도 닿지 못했어요…');
          if(st.lightAU < AU_MAX) out.lines.push('<span class="hold">빛은 우주에서 가장 빠른데도 — 아직 해왕성까지 못 갔어요!</span>');
        }
        return out;
      }

      /* 🌀 만약에 */
      if(st.wif){
        var W = WHATIF[st.wif];
        out.warn = true;
        if(st.wif === 'mer'){
          out.lines.push('<span class="big">🔥 수성 자리의 지구</span>');
          out.lines.push('햇빛 7배, 낮 400°C! 바다가 남아날까요?');
        } else if(st.wif === 'nep'){
          out.lines.push('<span class="big">🧊 해왕성 자리의 지구</span>');
          out.lines.push('햇빛 1/900, 영하 200°C 얼음 세상!');
        } else if(st.wif === 'sunoff'){
          out.lines.push('<span class="big">☀️ 태양이 사라졌다!</span>');
          out.lines.push('행성들이 돌던 방향 그대로 곧게 날아가요 — 멈추지도, 가운데로 떨어지지도 않아요. 곧게 가려는 성질(관성)!');
        } else {
          if(sim.fallen()){
            out.lines.push('<span class="big">🕳 풍덩! 공전이 멈추면 태양의 중력에 끌려 들어가요</span>');
            out.lines.push('빙글빙글 도는 것이 곧 떠 있는 비결!');
          } else {
            out.lines.push('<span class="big">🕳 공전을 멈춘 지구가… 어디로 가는지 지켜봐요!</span>');
          }
        }
        if(!st.wifDone && st.wifPred !== null) out.lines.push('<span class="hold">' + W.tip + '</span>');
        return out;
      }

      /* 자유탐구 — 잡기·시점·비율 안내 우선 (v2 순서 무손실) */
      if(mode === 'free' && st.auV !== 1){
        var b = sim.band();
        out.lines.push('<span class="big">🌍 지구가 ' + st.auV.toFixed(2) + ' AU 자리에 있어요</span>');
        out.lines.push(b === 'hot'  ? '🔥 태양이 너무 가까워 바다가 펄펄 끓어요!'
                     : b === 'cold' ? '🧊 햇빛이 약해 온 세상이 꽁꽁 얼어요!'
                     :                '🟢 골디락스 띠 안 — 물이 얼지도 끓지도 않는 자리!');
        return out;
      }
      if(mode === 'free' && st.viewE){
        out.lines.push('<span class="big">👁 지구에서 본 하늘 — 수성·금성은 태양 근처에서만 보여요</span>');
        out.lines.push('그래서 금성은 해 뜰 녘·해 질 녘에만 반짝 — 샛별이라 불려요!');
        return out;
      }
      var t = sim.effT(mode);
      if(mode === 'free' && sim.G().v2.ratio && st.ratioT > 0.12 && st.ratioT < 0.88){
        out.lines.push('<span class="big">스르륵… 행성들이 점이 되고 우주가 비어 가요 🔭 (실제 ' + Math.round(st.ratioT * 100) + '%)</span>');
        out.lines.push('끝까지 당기면 진짜 태양계 — 얼마나 텅 비어 있을까요?');
        return out;
      }
      if(st.sel){
        var f = sim.planetOf(st.sel);
        out.lines.push('<span class="big">' + f.p.nm + ' — 태양에서 ' + (f.idx + 1) + '번째</span>');
        out.lines.push(f.p.desc);
        out.lines.push('태양까지 거리 약 ' + f.p.au + 'AU · 크기(지구=1) 약 ' + f.p.r + '배');
        return out;
      }
      if(t >= 0.999){
        out.lines.push('<span class="big">실제 비율로 보는 중 🔭</span>');
        out.lines.push('안쪽 4행성은 태양 가까이 다닥, 바깥 행성은 까마득히 멀어요. 행성 사이는 거의 텅 비어 있어요.');
        return out;
      }
      out.lines.push('<span class="big">☀️ 태양계</span>');
      out.lines.push(sim.G().hint);
      return out;
    };

    return sim;
  }

  var API = {
    PL:PL, AU_MIN:AU_MIN, AU_MAX:AU_MAX, GOLD_LO:GOLD_LO, GOLD_HI:GOLD_HI, clamp:clamp,
    auIdx:auIdx, auToDist:auToDist, auFromDist:auFromDist, dist:dist, prad:prad, band:band,
    LIGHT_SEC_PER_AU:LIGHT_SEC_PER_AU, LIGHT_AU_PER_SEC:LIGHT_AU_PER_SEC,
    lightSec:lightSec, lightTimeStr:lightTimeStr,
    GRADES:GRADES, MISSIONS:MISSIONS, LOW_MISSIONS:LOW_MISSIONS, QUIZ:QUIZ,
    WHATIF:WHATIF, LOW_WHATIF:LOW_WHATIF, WIF_KEYS:WIF_KEYS, PRED:PRED, WOW:WOW,
    createSim:createSim
  };
  if(typeof window !== 'undefined') window.SolarSim = API;
  if(typeof module !== 'undefined' && module.exports) module.exports = API;
})();

{

}

function renderPlanets() {
  const G = sim.G();
  if (!G.showPlanets || mode === 'quiz' || sim.state.wowArmed || sim.state.wif) {
    planetsEl.style.display = 'none';
    return;
  }
  planetsEl.style.display = '';
  planetsEl.innerHTML = PL.map(p =>
    `<button data-k="${p.k}" class="${sim.state.sel === p.k ? 'on' : ''}">${p.nm}</button>`).join('');
  planetsEl.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    hideHint();
    sim.select(b.dataset.k);
    K3.sound.play('tap');
    renderPlanets(); renderStatus(); afterAct();
  }));
}

function renderBar() {
  if (mode === 'mission') {
    mbar.style.display = '';
    const M = sim.missionList();
    mbar.innerHTML = sim.mDone
      ? '<b>🎉 미션 완주!</b> 자유탐구에서 마음껏 태양계를 살펴봐요<div class="st">완료 ' + M.length + ' / ' + M.length + '</div>'
      : M[sim.mStep].text + `<div class="st">미션 ${sim.mStep + 1} / ${M.length}</div>`;
  } else if (mode === 'quiz') {
    mbar.style.display = '';
    const q = sim.quizList()[sim.qIdx];
    mbar.innerHTML = `${q.q}<div class="st">점수 ${sim.qScore} / ${sim.qCount}</div>`;
  } else mbar.style.display = 'none';
}

function renderStatus() {
  const s = sim.statusText(mode);
  statusEl.innerHTML = s.lines.map(l => `<div class="card${s.warn ? ' warnc' : ''}">${l}</div>`).join('');
  const st = $('stage');
  st.dataset.t = sim.effT(mode).toFixed(3);
  st.dataset.au = sim.earAu().toFixed(2);
  st.dataset.band = sim.band();
  st.dataset.sel = sim.state.sel || '';
  st.dataset.wif = sim.state.wif || '';

}

function renderChips() {
  chipsEl.innerHTML = sim.state.chips.map(c =>
    `<div class="chip" style="border-color:${c.hit ? '#12B886' : '#E8590C'};color:${c.hit ? '#7CF0C9' : '#FFC078'}">${c.label} ${c.hit ? '✔예측적중' : '✘예측빗나감'}</div>`
  ).join('');
}

function renderLightBar() {
  const st = sim.state;
  if (!st.wowArmed || (!st.lightOn && st.lightAU === 0)) { lightbar.style.display = 'none'; return; }
  lightbar.style.display = '';
  $('ltime').textContent = '🚀 ' + Sim.lightTimeStr(sim.lightElapsed());
  const reached = PL.filter(p => st.lightAU >= p.au);
  $('lsub').textContent = reached.length
    ? ('빛이 ' + reached[reached.length - 1].nm + '까지 왔어요 · ' + st.lightAU.toFixed(2) + ' AU')
    : '빛이 태양을 떠났어요…';
}

function renderQuiz() {
  if (mode !== 'quiz') { choicesEl.style.display = 'none'; return; }
  choicesEl.style.display = '';
  const q = sim.quizList()[sim.qIdx];
  const order = [0, 1, 2].sort(() => Math.random() - 0.5);
  choicesEl.innerHTML = order.map(i => `<button data-v="${i}">${q.ch[i]}</button>`).join('');
  choicesEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    if (qLock) return; qLock = true;
    const r = sim.quizAnswer(+b.dataset.v);
    K3.sound.play(r.ok ? 'chime' : 'fail');
    K3.toast(r.ok ? '🎉 정답!' : '아쉬워요 — 정답은 「' + r.correct + '」', !r.ok, T(1300));
    renderBar();
    setTimeout(() => {
      sim.newQuiz(Math.random);
      qLock = false;
      syncScene(); renderAll();
    }, T(1500));
  }));
}
let qLock = false;

function renderAll() {
  renderHUD(); renderCtrls(); renderPlanets(); renderBar(); renderQuiz();
  renderStatus(); renderChips(); renderLightBar();
}

/* ═══════════ 씬 동기 ═══════════ */
function earthTint() {
  const m = planets[2].material;
  const b = sim.band();
  if (b === 'hot') m.color.setHex(0xFF8A50);
  else if (b === 'cold') m.color.setHex(0x9AD9FF);
  else m.color.setHex(texOK.ear ? 0xffffff : 0x2b6cb0);
}
function fitCam() {
  const st = sim.state;
  if (sim.G().lowScene) return;
  const t = sim.effT(mode);
  const far = Sim.dist(PL.length - 1, t);
  const want = far * (1.15 + 0.40 * t);
  const d = camera.position.length();
  if (d < 1e-6) return;
  camera.position.multiplyScalar(want / d);
}
function syncScene() {
  const st = sim.state;
  const G = sim.G();
  const t = sim.effT(mode);

  /* 저학년 = 지구 클로즈업 낮밤 장면 (v2 layout 무손실) */
  if (G.lowScene) {
    planets.forEach((m, i) => { m.visible = (i === 2); m.scale.setScalar(i === 2 ? 2.4 : 0.001); });
    rings.forEach(r => { r.visible = false; });
    satRing.visible = false;
    goldRing.visible = false;
    marker.visible = true;
    sunMesh.visible = true; sunGlow.visible = true;
    sunMesh.scale.setScalar(1.4);
    planets[2].position.set(8, 0, 0);
    planets[2].rotation.y = st.dayAngle;
    lightShell.visible = false; lightRing.visible = false;
    return;
  }

  planets.forEach(m => { m.visible = true; });
  rings.forEach(r => { r.visible = !st.sunGone; });
  satRing.visible = true;
  marker.visible = false;
  sunMesh.visible = !st.sunGone;
  sunGlow.visible = !st.sunGone;
  sunMesh.scale.setScalar(1.0);

  planets.forEach((m, i) => {
    const p = sim.planetPos(i, mode);
    m.position.set(p.x, 0, p.z);
    m.scale.setScalar(Sim.prad(i, t));
    const d = sim.planetDist(i, mode);
    rings[i].scale.set(d, d, 1);
  });
  earthTint();

  /* 🟢 골디락스 띠 — t에 따라 폭 자체가 변하니 지오메트리 갱신 (v2 무손실) */
  const showGold = sim.canGrab(mode);
  goldRing.visible = showGold;
  if (showGold) {
    goldRing.geometry.dispose();
    goldRing.geometry = new THREE.RingGeometry(Sim.auToDist(Sim.GOLD_LO, t), Sim.auToDist(Sim.GOLD_HI, t), 128);
  }

  /* 🚀 빛 껍질 */
  const lightOn = st.wowArmed && (st.lightOn || st.lightAU > 0);
  lightShell.visible = lightOn;
  lightRing.visible = lightOn;
  if (lightOn) {
    const r = Sim.auToDist(Math.max(st.lightAU, 0.001), 1) - 3;   /* 태양 표면 기준 */
    const rr = Math.max(r, 0.05);
    lightShell.scale.setScalar(rr);
    lightRing.scale.set(rr, rr, 1);
  }

  /* 👁 지구에서 보기 (v2 camPos 무손실) */
  if (st.viewE && mode === 'free') {
    const p = sim.planetPos(2, mode);
    const len = Math.hypot(p.x, p.z) || 1;
    camera.position.set(p.x * (1 + 0.22 / len), 0.5, p.z * (1 + 0.22 / len));
    controls.target.set(0, 0, 0);
    controls.enabled = false;
  } else if (!grabbing) {
    controls.enabled = true;
  }
}

/* ── 조작 후처리 (moon 교훈: 판정을 한 곳에 모은다) ── */
function afterAct() {
  predTick();
  if (mode === 'mission') missionTick();
  if (sim.state.wif) wifTick();
  if (sim.state.wowArmed) wowTick();
}

function act(a) {
  hideHint();
  const st = sim.state;
  if (a === 'play') {
    sim.clearWow();
    sim.togglePlay();
    K3.sound.play(st.playing ? 'whoosh' : 'select');
    renderCtrls(); renderStatus(); afterAct();
  } else if (a === 'real') {
    sim.toggleReal();
    K3.sound.play('whoosh');
    fitCam(); syncScene(); renderAll(); afterAct();
  } else if (a === 'view') {
    sim.toggleView();
    K3.sound.play('whoosh');
    if (!st.viewE) { controls.enabled = true; fitCam(); }
    syncScene(); renderAll();
  } else if (a === 'reset') {
    sim.wifExit(); sim.wowExit();
    st.sel = null; st.real = false; st.ratioT = sim.ratio0; st.spd = 1;
    st.auV = sim.au0; st.viewE = false;
    controls.enabled = true;
    K3.sound.play('tap');
    fitCam(); syncScene(); renderAll();
  } else if (a === 'whatif') {
    const SRC = sim.wifSrc();
    K3.cards.result('<h3>🌀 만약에… 무엇을 바꿔 볼까요?</h3>',
      sim.wifList().map(k => ({ label: SRC[k].icon + ' ' + SRC[k].title, value: k }))
    ).then(k => { if (k) startWhatif(k); });
  } else if (a === 'wifexit') {
    sim.wifExit();
    K3.sound.play('select');
    fitCam(); syncScene(); renderAll();
  } else if (a === 'wowarm') {
    sim.wowArm();
    K3.sound.play('charge');
    fitCam(); syncScene(); renderAll();
    K3.cards.predict(Sim.WOW.q, Sim.WOW.ch.map((c, i) => ({ id: String(i), label: c })))
      .then(v => {
        sim.setWowPred(+v);
        K3.sound.play('charge');
        K3.toast('🔦 「빛 쏘기」를 눌러 태양에서 빛을 출발시켜 봐요!', false, T(3600));
        renderCtrls(); renderStatus();
      });
  } else if (a === 'fire') {
    if (!sim.lightFire()) return;
    K3.sound.play('whoosh');
    lightHitLast = -1;
    renderCtrls(); renderStatus(); renderLightBar();
  } else if (a === 'wowexit') {
    sim.wowExit();
    K3.sound.play('select');
    fitCam(); syncScene(); renderAll();
  }
}

/* ── 만약에 ── */
function startWhatif(key) {
  sim.wifStart(key);
  K3.sound.play('whoosh');
  const W = sim.wifSrc()[key];
  fitCam(); syncScene(); renderAll();
  K3.cards.predict(W.q, W.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      sim.wifPredict(+v);
      K3.sound.play('charge');
      /* ☀️ 태양 소멸·🕳 공전 멈춤은 예측 직후 «자동 시작» (v2 onPlay 무손실) */
      if (key === 'sunoff') { sim.armEscape(mode); K3.sound.play('whoosh'); }
      else if (key === 'stopo') { sim.state.playing = false; }
      else if (key !== 'stopspin') { sim.state.playing = true; }
      K3.toast(W.icon + ' ' + W.tip, false, T(3800));
      syncScene(); renderCtrls(); renderStatus();
    });
}
function wifTick() {
  if (!sim.wifResolved()) return;
  const r = sim.wifResolve();
  if (!r) return;
  K3.sound.play(r.hit ? 'chime' : 'pop');
  if (r.hit) K3.sound.play('ting');
  const W = sim.wifSrc()[r.key];
  K3.toast(
    '<b>' + W.icon + ' ' + W.title + '</b><br>' + W.reveal +
    (r.hit ? '<br>🔮 네 예측이 딱 맞았어요! ✔' : '<br>🔮 예측이 빗나갔어요 — 그래서 실험이 재밌죠! ✘'),
    !r.hit, T(6800)
  );
  renderChips(); renderCtrls(); renderStatus();
  if (r.chipToast) setTimeout(() => K3.toast('🔭 꼬마 과학자 — 오늘 가설 5개를 실험했어요!', false, T(3000)), T(7000));
}

/* ── 🚀 와우: 빛의 여행 ── */
let lightHitLast = -1;
function wowTick() {
  const st = sim.state;
  /* 행성 도달 이벤트 */
  const hit = sim.lightPass();
  if (hit) {
    K3.sound.play(hit.idx === 2 ? 'ting' : 'tap');

      (hit.idx === 2 ? '<br>지금 네가 보는 햇빛은 <b>8분 19초 전</b>의 태양이에요!' : ''),

    '<div style="font-size:13px;line-height:1.55;color:#243043">우주에서 가장 빠른 빛도 지구까지 <b>' + d.earthStr + '</b>, ' +
    '해왕성까지는 <b>' + d.nepStr + '</b>이 걸려요.<br>' +
    '지금 네가 창밖에서 보는 햇빛은 <b>' + d.earthStr + ' 전</b>에 태양을 떠난 빛이에요. ' +
    '태양이 방금 사라졌더라도 우리는 <b>' + d.earthStr + '</b> 동안 그걸 모릅니다.<br>' +
    '태양계가 이토록 <b>크고 텅 비어 있다</b>는 뜻이에요.' +
    (r.hit ? '<br>🔮 네 예측이 딱 맞았어요! ✔' : '<br>🔮 예측이 빗나갔어요 — 빛도 「즉시」는 아니에요! ✘') +
    '</div>',
    [{ label: '알겠어요!', cls: 'pri', value: true }]
  ).then(() => {
    sim.wowExit();
    fitCam(); syncScene(); renderAll();
    if (r.chipToast) setTimeout(() => K3.toast('🔭 꼬마 과학자 — 오늘 가설 5개를 실험했어요!', false, T(3000)), T(400));
  });
  renderChips(); renderCtrls();
}
function lightTable(d) {
  const rows = [
    ['☿ 수성', d.merStr], ['🌍 지구', d.earthStr], ['🪐 목성', d.jupStr], ['🔵 해왕성', d.nepStr]
  ];
  return '<div style="margin:8px 0 6px;font-family:Gowun Dodum">' + rows.map(r =>

}

/* ── 예측 노트 ── */
function askPred(kind) {
  const P = Sim.PRED[kind];
  K3.cards.predict(P.q, P.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      sim.predPick(kind, +v);
      K3.sound.play('charge');
      K3.toast('📝 예측 접수! ' + P.tip, false, T(3600));
      renderStatus();
    });
}
function predTick() {
  ['ratio'].forEach(kind => {
    if (!sim.predResolved(kind, mode)) return;
    const r = sim.predResolve(kind, mode);
    if (!r) return;
    K3.sound.play(r.hit ? 'chime' : 'pop');
    if (r.hit) K3.sound.play('ting');
    K3.toast(r.msg, !r.hit, T(5400));
    renderChips(); renderStatus();
    if (r.chipToast) setTimeout(() => K3.toast('🔭 꼬마 과학자 — 오늘 가설 5개를 실험했어요!', false, T(3000)), T(5600));
  });
}

/* ── 🔴 지구 궤도째 잡아 끌기 (레이캐스트 → 궤도 평면 → AU 역산) ── */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const orbitPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPt = new THREE.Vector3();
let grabbing = false;
function setPtr(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
}
renderer.domElement.addEventListener('pointerdown', e => {
  hideHint();
  if (!sim.canGrab(mode)) return;
  setPtr(e.clientX || 0, e.clientY || 0);
  if (!ray.intersectObject(earthProxy, false).length) return;
  grabbing = true;
  controls.enabled = false;
  if (sim.state.playing) { sim.togglePlay(); renderCtrls(); }
  K3.sound.play('tap');
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!grabbing) return;
  setPtr(e.clientX || 0, e.clientY || 0);
  if (!ray.ray.intersectPlane(orbitPlane, hitPt)) return;
  const d = Math.hypot(hitPt.x, hitPt.z);
  const before = sim.inGold();
  sim.grabTo(d, mode);
  sim.state.ang[2] = Math.atan2(hitPt.z, hitPt.x);       /* 잡은 방향으로 지구가 따라온다 */
  if (before !== sim.inGold()) K3.sound.play(sim.inGold() ? 'chime' : 'fail');
  syncScene(); renderStatus(); renderCtrls();
  afterAct();
});
function endGrab() {
  if (!grabbing) return;
  grabbing = false;
  controls.enabled = !(sim.state.viewE && mode === 'free');
  K3.sound.play('select');
}
renderer.domElement.addEventListener('pointerup', endGrab);
renderer.domElement.addEventListener('pointercancel', endGrab);

/* ── 미션 ── */
let thinkOpen = false;
function missionTick() {
  if (mode !== 'mission' || sim.mDone) return;
  const cur = sim.missionCur();
  if (cur.type === 'think') { openThink(cur); return; }
  const r = sim.missionCheck();
  if (r.act === 'none') return;
  K3.sound.play('chime');
  K3.toast('🎉 좋아요!', false, T(1200));
  setTimeout(() => { syncScene(); renderAll(); missionTick(); }, T(1300));
}
function openThink(m) {
  if (thinkOpen) return;
  thinkOpen = true;
  K3.cards.predict(m.text.replace(/<[^>]+>/g, ''), m.ch.map((c, i) => ({ id: String(i), label: c })))
    .then(v => {
      thinkOpen = false;
      if (+v === m.a) {
        K3.sound.play('chime'); K3.sound.play('ting');
        K3.toast('🎉 정답!<br>' + m.why, false, T(4600));
        sim.missionAdvance();
        setTimeout(() => { syncScene(); renderAll(); if (!sim.mDone) missionTick(); }, T(1400));
      } else {
        K3.sound.play('fail');
        K3.toast('음… 다시 생각해 볼까요? 태양계를 잘 살펴봐요!', true, T(2600));
        setTimeout(() => missionTick(), T(2700));
      }
    });
}

/* ── 모드·학년 ── */
function resetForMode() {
  sim.wifExit(); sim.wowExit();
  const st = sim.state;
  st.sel = null; st.real = false; st.ratioT = 0; st.spd = 1; st.auV = 1; st.viewE = false;
  st.ang = PL.map((_, i) => i * 0.7);
  st.orbAcc = 0; st.dayAngle = 0.6; st.lowObs = 0;
  st.pred.ratio = { asked:false, ch:-1, done:false };
  st.wowDone = false;
  controls.enabled = true;
  qLock = false;
  lightHitLast = -1;
}
function setGrade(g) {
  sim.grade = g;
  resetForMode();
  if (mode === 'mission') sim.missionStart();
  else if (mode === 'quiz') sim.quizReset(Math.random);
  if (sim.G().lowScene) { camera.position.set(3.6, 2.4, 5.4); controls.target.set(8, 0, 0); }
  else { camera.position.set(10, 12, 14); controls.target.set(0, 0, 0); fitCam(); }
  syncScene(); renderAll();
  if (mode === 'mission') missionTick();
}
function setMode(m) {
  mode = m;
  resetForMode();
  if (m === 'mission') sim.missionStart();
  else if (m === 'quiz') sim.quizReset(Math.random);
  fitCam(); syncScene(); renderAll();
  if (m === 'mission') missionTick();
}

/* ═══════════ 루프 ═══════════ */
const clock = new THREE.Clock();
const FASTX = window.__K3_FAST ? 14 : 1;
const _sp = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta()) * FASTX;

  const st = sim.state;
  const active = st.playing || st.wif === 'stopo' || st.sunGone || st.lightOn ||
                 (sim.G().lowScene && st.wif === 'stopspin');
  if (active) {
    sim.tick(dt);
    syncScene();
    renderStatus();
    renderLightBar();
    afterAct();
  }

  /* 선택 행성 라벨 투영 */
  if (sim.state.sel && mode !== 'quiz' && !sim.G().lowScene) {
    const f = sim.planetOf(sim.state.sel);
    planets[f.idx].getWorldPosition(_sp);
    _sp.project(camera);
    if (_sp.z < 1) {
      selAnno.textContent = f.p.nm + ' · ' + f.p.au + ' AU';
      selAnno.style.left = ((_sp.x * 0.5 + 0.5) * innerWidth) + 'px';
      selAnno.style.top = ((-_sp.y * 0.5 + 0.5) * innerHeight - 22) + 'px';
      selAnno.style.display = '';
    } else selAnno.style.display = 'none';
  } else selAnno.style.display = 'none';

  if (controls.enabled) controls.update();
  renderer.render(scene, camera);
  app.tickQuality();
}

if (mode === 'mission') sim.missionStart();
else if (mode === 'quiz') sim.quizReset(Math.random);
if (sim.G().lowScene) { camera.position.set(3.6, 2.4, 5.4); controls.target.set(8, 0, 0); }
else fitCam();
syncScene();
renderAll();
document.getElementById('loading').classList.add('hide');
K3.toast(sim.G().lowScene
  ? '<b>🌞 하루 돌리기</b>를 눌러 지구를 돌려 봐요 — 낮과 밤이 생겨요!'
  : (sim.G().v2.grab
    ? '<b>지구를 잡아 궤도째 옮겨 봐요</b> — 초록 띠(골디락스) 밖으로 나가면?'
    : '<b>행성 버튼</b>을 눌러 태양계 식구들을 만나 봐요!'));
animate();
if (mode === 'mission') missionTick();

/* 테스트용 앱 훅 */
window.SolarApp = {
  sim, get mode() { return mode; }, setMode, setGrade, act, startWhatif,
  planets, rings, satRing, goldRing, sunMesh, marker, lightShell, lightRing, earthProxy,
  camera, controls, sunLight,
  get texOK() { return texOK; },
  syncScene, renderAll, afterAct, fitCam, missionTick, wifTick, wowTick, predTick,
  select(k) { sim.select(k); renderPlanets(); renderStatus(); afterAct(); },
  setRatio(v) { sim.setRatio(v); fitCam(); syncScene(); renderStatus(); renderCtrls(); afterAct(); },
  setAU(v) { sim.setAU(v); syncScene(); renderStatus(); renderCtrls(); afterAct(); },
  grabTo(d) { sim.grabTo(d, mode); syncScene(); renderStatus(); renderCtrls(); afterAct(); },
  armPred(kind) { if (sim.predArm(kind, mode)) askPred(kind); },
  runFor(sec) {
    for (let t = 0; t < sec; t += 0.05) sim.tick(0.05);
    syncScene(); renderStatus(); renderLightBar(); renderCtrls();
    afterAct();
  },
  answerQuiz(i) { const bs = document.querySelectorAll('#choices button'); for (const b of bs) if (+b.dataset.v === i) { b.click(); return true; } return false; }
};
</script>
<script src="/kedu_back.js"></script>

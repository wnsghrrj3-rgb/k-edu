<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이랩 교구 — 과목별</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:24px;font-family:'Jua','Apple SD Gothic Neo',sans-serif;background:#EAF2FB;color:#1B3A57;}
  .wrap{max-width:1000px;margin:0 auto;}
  h1{font-size:30px;margin:0 0 2px;}
  .sub{color:#5a7894;font-size:16px;margin:0 0 18px;}
  .grades{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .gtab{font-size:22px;padding:12px 26px;border-radius:16px;border:3px solid #1565C0;background:#fff;color:#1565C0;cursor:pointer;font-family:inherit;font-weight:800;}
  .gtab.on{background:#1565C0;color:#fff;}
  .grp{flex-basis:100%;width:100%;font-size:20px;font-weight:800;color:#1565C0;margin:16px 4px 2px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:#fff;border-radius:18px;padding:18px;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 10px rgba(21,101,192,.08);transition:transform .1s,border-color .15s;}
  .card:hover{transform:translateY(-3px);border-color:#1565C0;}
  .card.soon{opacity:.5;cursor:default;}
  .card.soon:hover{transform:none;border-color:transparent;}
  .card .nm{font-size:21px;font-weight:800;margin-bottom:6px;}
  .card .ds{font-size:15px;color:#5a7894;line-height:1.4;}
  .card .badge{display:inline-block;margin-top:10px;font-size:13px;padding:4px 12px;border-radius:10px;background:#E7F1FB;color:#1565C0;}
  .card.soon .badge{background:#eee;color:#999;}
  .mount{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(21,101,192,.08);min-height:420px;}
  .mount .ph{text-align:center;color:#9AB7D4;font-size:20px;padding:160px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧊 케이랩 교구</h1>
  <p class="sub">과목을 고르면 그 과목 교구가 나와요. 교구를 누르면 바로 띄웁니다.</p>
  <div class="grades" id="grades"></div>
  <div class="cards" id="cards"></div>
  <div class="mount"><div id="mountEl" style="width:100%;"><div class="ph">위에서 교구를 골라 주세요</div></div></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="engine/klab.js"></script>
<script src="engine/tools/shape3d.js"></script>
<script src="engine/tools/place_value.js"></script>
<script src="engine/tools/fraction.js"></script>
<script src="engine/tools/cubes.js"></script>
<script src="engine/tools/graph.js"></script>
<script src="engine/tools/array.js"></script>
<script src="engine/tools/angle.js"></script>
<script src="engine/tools/area.js"></script>
<script src="engine/tools/symmetry.js"></script>
<script src="engine/tools/tenframe.js"></script>
<script src="engine/tools/division.js"></script>
<script src="engine/tools/pattern.js"></script>
<script src="engine/tools/decimal.js"></script>
<script src="engine/tools/net.js"></script>
<script src="engine/tools/probability.js"></script>
<script src="engine/tools/circle.js"></script>
<script src="engine/tools/ratio.js"></script>
<script src="engine/tools/circuit.js"></script>
<script src="engine/tools/states.js"></script>
<script src="engine/tools/magnet.js"></script>
<script src="engine/tools/light.js"></script>
<script src="engine/tools/sound.js"></script>
<script src="engine/tools/earth.js"></script>
<script src="engine/tools/moon.js"></script>
<script src="engine/tools/solar.js"></script>
<script src="engine/tools/season.js"></script>
<script src="engine/tools/constellation.js"></script>
<script src="engine/tools/heat.js"></script>
<script src="engine/tools/dissolve.js"></script>
<script src="engine/tools/plant.js"></script>
<script src="engine/tools/strata.js"></script>
<script src="engine/tools/hangul_build.js"></script>
<script src="../../english/v3/engine/k-tts.js"></script>
<script src="engine/tools/phonics_blocks.js"></script>
<script>
// 과목별 교구 카탈로그 (도구당 대표 1개, 영역으로 묶음)
var CATALOG = {
  math: [
    {group:'수와 연산', items:[
      {nm:'자릿값 수모형', ds:'10개씩 묶어 자리값 보기 + 미션·퀴즈', tool:'place_value', cfg:{start:24,max:50}},
      {nm:'십 배열판(텐프레임)', ds:'10을 한눈에, 가르기·모으기 + 미션·퀴즈', tool:'tenframe', cfg:{num:7,frames:2}},
      {nm:'곱셈 배열판', ds:'몇 줄 × 몇 개 = 곱, 교환법칙 + 미션·퀴즈', tool:'array', cfg:{rows:4,cols:6}},
      {nm:'나눗셈 모형', ds:'똑같이 나눠 담기, 나머지 + 미션·퀴즈', tool:'division', cfg:{total:12,groups:3}},
      {nm:'분수 — 4가지 표상', ds:'면적·수직선·묶음·나눗셈 + 비교·통분·퀴즈', tool:'fraction', cfg:{denom:4,showQuiz:true}},
      {nm:'소수 모형', ds:'100칸으로 소수=분수 보기', tool:'decimal', cfg:{value:0.37}},
      {nm:'비와 비율', ds:'두 양의 비·기약비·백분율', tool:'ratio', cfg:{a:2,b:3}}
    ]},
    {group:'도형', items:[
      {nm:'입체도형', ds:'직육면체·원기둥·구 굴리고 세우기', tool:'shape3d', cfg:{shapes:['box','cylinder','ball'],actions:['roll','flip'],terms:'math'}},
      {nm:'대칭(선·점)', ds:'한쪽 그리면 대칭 자동 완성', tool:'symmetry', cfg:{n:8,mode:'line',axis:'v'}},
      {nm:'전개도·겨냥도', ds:'전개도가 입체로 접히는 과정', tool:'net', cfg:{fold:0}},
      {nm:'원·컴퍼스', ds:'반지름·지름·원주, 원의 넓이', tool:'circle', cfg:{mode:'draw',r:4}}
    ]},
    {group:'측정', items:[
      {nm:'각도기', ds:'양쪽 눈금·각 만들고 재고 분류', tool:'angle', cfg:{deg:50}},
      {nm:'넓이 격자', ds:'단위넓이로 채워 넓이·둘레', tool:'area', cfg:{w:5,h:3}},
      {nm:'쌓기나무·부피', ds:'위·앞·옆 보기, 부피 세기', tool:'cubes', cfg:{}}
    ]},
    {group:'규칙성', items:[
      {nm:'규칙·패턴', ds:'패턴 만들고 규칙·다음 찾기 + 미션·퀴즈', tool:'pattern', cfg:{preset:[0,1,0,1,0,1]}}
    ]},
    {group:'자료와 가능성', items:[
      {nm:'그래프', ds:'그림·막대·꺾은선·원·띠그래프', tool:'graph', cfg:{title:'좋아하는 운동',unit:'명',types:['picto','bar','line','pie','band']}},
      {nm:'가능성', ds:'동전·주사위 여러 번 굴려 빈도', tool:'probability', cfg:{type:'coin'}}
    ]}
  ],
  science: [
    {group:'물질 · 상태변화', items:[
      {nm:'🧊 입자·상태변화', ds:'온도로 녹이고 끓여 상태 전환·입자 운동 보기 + 미션', tool:'states', cfg:{temp:25}},
      {nm:'🍬 용해와 용액', ds:'설탕이 입자로 풀려 골고루 — 무게 보존·젓기·온도·포화·석출 + 미션·퀴즈', tool:'dissolve', cfg:{}}
    ]},
    {group:'빛 · 그림자', items:[
      {nm:'💡 빛·그림자·거울', ds:'빛 직진·그림자 + 거울 반사(입사각=반사각)', tool:'light', cfg:{}}
    ]},
    {group:'소리 · 진동', items:[
      {nm:'🔊 소리·진동', ds:'진폭·진동수 바꿔 파형·실제 소리 듣고 큰·작은·높은·낮은 소리 미션', tool:'sound', cfg:{amp:3,freq:3}}
    ]},
    {group:'에너지 · 전기', items:[
      {nm:'🔌 전기 회로', ds:'전지·전구·스위치를 자유 자리에 놓고 잇고 켜기', tool:'circuit', cfg:{}},
      {nm:'🧲 자석·자기장', ds:'자기력선·나침반으로 자기장 보고 두 자석 끌림·밀림 탐구', tool:'magnet', cfg:{count:1}},
      {nm:'🌡️ 열의 이동', ds:'전도(구리·철·유리 버터 경주)·대류(물·공기, 가열 위치 비교) + 미션·퀴즈', tool:'heat', cfg:{}}
    ]},
    {group:'생명', items:[
      {nm:'🌱 식물의 한살이', ds:'씨앗→싹→꽃→열매→씨앗 시간 압축 + 물·빛 바꿔 비교 실험(변인 통제)', tool:'plant', cfg:{}}
    ]},
    {group:'지구 · 우주', items:[
      {nm:'🪨 지층과 화석', ds:'바다 밑에 자갈·모래·진흙 쌓아 줄무늬 지층 + 생물 덮어 화석 + 융기 — 산에서 조개가 나오는 까닭', tool:'strata', cfg:{}},
      {nm:'🌍 지구 자전·낮밤', ds:'지구를 자전시켜 우리나라의 낮·밤·해돋이 보기 (태양이 아니라 지구가 돈다)', tool:'earth', cfg:{hour:12}},
      {nm:'🌙 달의 위상', ds:'달을 공전시켜 초승·상현·보름·하현 — 지구에서 본 달 모양과 연동', tool:'moon', cfg:{phase:180}},
      {nm:'☀️ 태양계', ds:'8행성 공전 + 실제 비율 토글로 진짜 거리·크기 비교', tool:'solar', cfg:{}},
      {nm:'🌗 계절의 변화', ds:'자전축 기울기를 0으로 바꿔 계절이 사라지는 걸 확인 — 남중고도·낮길이 연동', tool:'season', cfg:{orb:90,tilt:23.5}},
      {nm:'✨ 계절별 별자리', ds:'지구 공전으로 밤하늘 별자리가 바뀌는 이유 + 북두칠성으로 북극성 찾기', tool:'constellation', cfg:{orb:270}}
    ]}
  ],
  korean: [
    {group:'한글 — 글자 깨치기', items:[
      {nm:'글자 조립', ds:'자음+모음이 만나 글자가 돼요 (ㄱ+ㅏ=가)', tool:'hangul_build', cfg:{consonant:'ㄱ',vowel:'ㅏ'}}
    ]}
  ],
  english: [
    {group:'파닉스 — 블렌딩 (영어 v3 Lv1)', items:[
      {nm:'🧩 파닉스 블록 — 합치기', ds:'소리 블록을 붙이면 단어 소리가 돼요 (c+a+t→cat, 떼면 분리)', tool:'phonics_blocks', cfg:{mode:'build',words:['cat','mat','sat']}},
      {nm:'🔁 파닉스 블록 — 첫소리 교체', ds:'끝소리 _at 고정, 첫소리만 바꿔 끼우기 + 듣고 만들기', tool:'phonics_blocks', cfg:{mode:'swap',ending:'at',onsets:['c','m','s','n']}},
      {nm:'📖 파닉스 블록 — 스스로 읽기', ds:'처음 보는 단어를 읽고 정답 듣고 확인', tool:'phonics_blocks', cfg:{mode:'read',words:['bat','tap','rag','nap']}},
      {nm:'👂 파닉스 블록 — 듣고 고르기', ds:'듣고 맞는 단어 고르기 (숙달·게이트)', tool:'phonics_blocks', cfg:{mode:'listen',words:['cat','mat','sat','man','nap']}}
    ]}
  ]
};

var grades=document.getElementById('grades'), cardsEl=document.getElementById('cards'), mountEl=document.getElementById('mountEl');
var cleanup=null, cur='math';

var SUBJECTS=[{key:'math',label:'수학'},{key:'korean',label:'국어'},{key:'english',label:'영어'},{key:'science',label:'과학'}];
SUBJECTS.forEach(function(sub,i){
  var b=document.createElement('button'); b.className='gtab'+(i===0?' on':''); b.textContent=sub.label;
  b.onclick=function(){cur=sub.key;document.querySelectorAll('.gtab').forEach(function(x){x.classList.toggle('on',x.textContent===sub.label);});renderCards();};
  grades.appendChild(b);
});

function renderCards(){
  cardsEl.innerHTML='';
  (CATALOG[cur]||[]).forEach(function(grp){
    var h=document.createElement('div'); h.className='grp'; h.textContent=grp.group; cardsEl.appendChild(h);
    grp.items.forEach(function(item){
      var c=document.createElement('div'); c.className='card'+(item.tool?'':' soon');
      c.innerHTML='<div class="nm">'+item.nm+'</div><div class="ds">'+item.ds+'</div><div class="badge">'+(item.tool?'열기':'준비 중')+'</div>';
      if(item.tool) c.onclick=function(){mount(item.tool,item.cfg);};
      cardsEl.appendChild(c);
    });
  });
}
function mount(tool,cfg){
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  mountEl.innerHTML='';
  cleanup=window.KLab.mount(mountEl,tool,cfg||{})||null;
}
renderCards();
</script>
</body>
</html>

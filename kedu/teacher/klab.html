<style id="kedu-title-font">/* 케이에듀 제목 폰트 토큰 — 교체 시 이 블록만 수정 (2026-07-04, 학교안심 모험가) */
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
</style>
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:24px;font-family:'Gowun Dodum',sans-serif;background:#EAF2FB;color:#1B3A57;}
  .wrap{max-width:1000px;margin:0 auto;}
  h1{font-size:30px;margin:0 0 2px;font-family:var(--kedu-title);}
  .sub{color:#5a7894;font-size:16px;margin:0 0 18px;}
  .grades{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .gtab{font-size:22px;padding:12px 26px;border-radius:16px;border:3px solid #1565C0;background:#fff;color:#1565C0;cursor:pointer;font-family:inherit;font-weight:800;}
  .gtab.on{background:#1565C0;color:#fff;}
  .grp{width:100%;font-size:20px;font-weight:800;color:#1565C0;margin:24px 4px 12px;}
  .grp:first-child{margin-top:4px;}
  .cards{margin-bottom:22px;}
  .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:6px;}
  .card{background:#fff;border-radius:18px;padding:18px;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 10px rgba(21,101,192,.08);transition:transform .1s,border-color .15s;}
  .card:hover{transform:translateY(-3px);border-color:#1565C0;}
  .card.soon{opacity:.5;cursor:default;}
  .card.soon:hover{transform:none;border-color:transparent;}
  .card .nm{font-size:21px;font-weight:800;margin-bottom:6px;}
  .card .ds{font-size:15px;color:#5a7894;line-height:1.4;}
  .card .badge{display:inline-block;margin-top:10px;font-size:13px;padding:4px 12px;border-radius:10px;background:#E7F1FB;color:#1565C0;}
  .card.soon .badge{background:#eee;color:#999;}
  .mount{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(21,101,192,.08);min-height:420px;}
  .mount .ph{text-align:center;color:#9AB7D4;font-size:20px;padding:160px 0;}
  /* ── 케이랩 독립 제품 얼굴 ── */
  .hero{position:relative;overflow:hidden;border-radius:26px;padding:30px 28px 26px;margin-bottom:18px;color:#fff;
    background:radial-gradient(130% 160% at 18% -20%,#27406e 0%,#13234a 45%,#0a1330 100%);
    box-shadow:0 8px 26px rgba(13,28,74,.28);}
  .hero .hstar{position:absolute;border-radius:50%;background:#cdd6ff;animation:hTw 2.6s ease-in-out infinite;}
  @keyframes hTw{0%,100%{opacity:.25;}50%{opacity:.85;}}
  .hero h1{font-size:38px;margin:0 0 6px;color:#fff;letter-spacing:1px;}
  .hero .tag{font-size:20px;color:#BFD3FF;margin:0 0 14px;}
  .hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .hero .bdg{font-size:14px;font-weight:800;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.28);color:#EAF2FF;}
</style>
  <script src="/kedu_gate.js"></script>
</head>
<body>
<div class="wrap">
  <a href="/" id="kedu-home" title="케이에듀 시작 화면으로" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:9px 16px;border-radius:12px;border:2.5px solid #1565C0;background:#fff;color:#1565C0;font-weight:800;font-size:15px;text-decoration:none;font-family:inherit;">🏠 케이에듀로 가기</a>

    <button id="back-to-lesson" style="font-family:inherit;cursor:pointer;font-size:20px;font-weight:800;padding:12px 22px;border-radius:14px;border:none;background:#1565C0;color:#fff;">↩ 수업으로 돌아가기</button>

    <p class="tag">만지고 · 생각하고 · 상상하는 디지털 교구</p>

  <div class="mount"><div id="mountEl" style="width:100%;"><div class="ph">위에서 교구를 골라 주세요</div></div></div>
</div>

      {nm:'🗺 기호 지도 읽기', g:'3학년', ds:'전국 실제 지도 ⇄ 항공사진 토글 · 방위표 · 약속된 기호', gr:[3,4], tool:'map', cfg:{start:'symbol'}},
      {nm:'🛰 우리 동네 (실제 항공)', g:'3학년', ds:'검색으로 우리 학교·동네를 실제 항공사진으로 둘러보기', gr:[3,4], tool:'map', cfg:{start:'real'}},
      {nm:'✏️ 백지도 꾸미기', g:'3학년', ds:'행정구역 백지도 위에 기호를 직접 찍어 우리 고장 그리기', gr:[3,4], tool:'map', cfg:{start:'blank'}}
    ]},
    {group:'경제생활 (시장 놀이)', items:[
      {nm:'🍎 시장 놀이 — 가게 사장님', g:'4~6학년', ds:'상황 카드를 뽑아 가격을 정해 팔고 이익 모으기 — 수요·공급·물가를 손으로', gr:[4,6], tool:'market', cfg:{}}
    ]}
  ]
};

var grades=document.getElementById('grades'), gradeRow=document.getElementById('gradeRow'), cardsEl=document.getElementById('cards'), mountEl=document.getElementById('mountEl');
var cleanup=null, cur='math', curGrade=0;   // curGrade 0 = 전체

var SUBJECTS=[{key:'math',label:'수학'},{key:'korean',label:'국어'},{key:'english',label:'영어'},{key:'social',label:'사회'},{key:'science',label:'과학'}];
SUBJECTS.forEach(function(sub,i){
  var b=document.createElement('button'); b.className='gtab'+(i===0?' on':''); b.textContent=sub.label;
  b.onclick=function(){cur=sub.key;grades.querySelectorAll('.gtab').forEach(function(x){x.classList.toggle('on',x.textContent===sub.label);});renderCards();};
  grades.appendChild(b);
});
// 학년 탭 (과목 → 학년 → 영역 3단 분류)
[{v:0,l:'전체'},{v:1,l:'1학년'},{v:2,l:'2학년'},{v:3,l:'3학년'},{v:4,l:'4학년'},{v:5,l:'5학년'},{v:6,l:'6학년'}].forEach(function(gd){
  var b=document.createElement('button'); b.className='gtab gsub'+(gd.v===0?' on':''); b.textContent=gd.l;
  b.style.cssText='font-size:16px;padding:8px 14px;';
  b.onclick=function(){curGrade=gd.v;gradeRow.querySelectorAll('.gtab').forEach(function(x){x.classList.toggle('on',x===b);});renderCards();};
  gradeRow.appendChild(b);
});
function gradeFit(item){
  if(curGrade===0)return true;
  var gr=item.gr||[1,6];
  return curGrade>=gr[0] && curGrade<=gr[1];
}

function renderCards(){
  cardsEl.innerHTML='';
  var shown=0;
  (CATALOG[cur]||[]).forEach(function(grp){
    var items=grp.items.filter(gradeFit);
    if(!items.length)return;
    shown+=items.length;
    var h=document.createElement('div'); h.className='grp'; h.textContent=grp.group; cardsEl.appendChild(h);
    var grid=document.createElement('div'); grid.className='catgrid';
    items.forEach(function(item){
      var c=document.createElement('div'); c.className='card'+((item.tool||item.link)?'':' soon');
      c.innerHTML='<div class="nm">'+item.nm
        +(item.g?' <span style="font-size:12px;font-weight:800;color:#1565C0;background:#E3F0FF;border:1.5px solid #B9D6F5;border-radius:9px;padding:3px 8px;vertical-align:2px;margin-left:6px;white-space:nowrap;">'+item.g+'</span>':'')
        +'</div><div class="ds">'+item.ds+'</div><div class="badge">'+((item.tool||item.link)?'열기':'준비 중')+'</div>';
      if(item.tool) c.onclick=function(){ try{history.pushState({klab:'focus'},'');focusPushed=true;}catch(e){} enterFocus(item.nm); mount(item.tool,item.cfg); window.scrollTo({top:0,behavior:'smooth'});};
      else if(item.link){ var lk=item.link; c.onclick=function(){window.open(lk,'_blank');}; }
      grid.appendChild(c);
    });
    cardsEl.appendChild(grid);
  });
  if(!shown){
    var e=document.createElement('div'); e.className='ph';
    e.textContent='이 학년에 맞는 교구는 준비 중이에요!';
    cardsEl.appendChild(e);
  }
}
function mount(tool,cfg){
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  mountEl.innerHTML='';
  cleanup=window.KLab.mount(mountEl,tool,cfg||{})||null;
  curTool=tool; curCfg=cfg||{}; renderShare();
}

/* ===== 집중 화면 (교구 하나만 보기) =====
   카드를 누르면 카탈로그(제목·과목 탭·카드 목록)를 숨기고 그 교구만 띄운다.
   딥링크 진입도 같은 함수를 쓴다. 복귀 = 🧊 전체 교구 보기. */
function enterFocus(label, fromLesson){
  inFocus=true;
  var kh=document.getElementById('kedu-home'); if(kh)kh.style.display='none';
  document.getElementById('grades').style.display='none';
  document.getElementById('gradeRow').style.display='none';
  cardsEl.style.display='none';
  document.getElementById('klab-h1').style.display='none';
  var bar=document.getElementById('back-bar');
  bar.style.display='flex';
  document.getElementById('back-bar-title').textContent='🧊 '+label;
  document.getElementById('back-to-lesson').style.display=fromLesson?'':'none';
}
function exitFocus(){
  inFocus=false; focusPushed=false;
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  mountEl.innerHTML='<div class="ph">위에서 교구를 골라 주세요</div>';
  curTool=null; curCfg=null; renderShare();
  document.getElementById('back-bar').style.display='none';
  document.getElementById('grades').style.display='';
  document.getElementById('gradeRow').style.display='';
  cardsEl.style.display='';
  document.getElementById('klab-h1').style.display='';
  var kh=document.getElementById('kedu-home'); if(kh)kh.style.display='inline-flex';
}
var inFocus=false, focusPushed=false;
// '전체 교구 보기' 버튼: history를 쌓고 들어온 경우엔 뒤로가기로 처리(popstate→exitFocus), 아니면(딥링크) 바로 복귀
document.getElementById('show-all-tools').addEventListener('click', function(){
  if(focusPushed){ history.back(); } else { exitFocus(); }
});
// 브라우저/기기 뒤로가기: focus 상태면 그리드로 한 단계만 복귀(페이지를 떠나지 않음)
window.addEventListener('popstate', function(){
  if(inFocus){ focusPushed=false; exitFocus(); }
});

/* ===== 프리셋 공유 링크 (2026-06-11) =====
   띄운 교구를 모드까지 박아 링크로 복사 — 학생에게 보내면 퀴즈 모드로 바로 입장.
   cfg.mode를 자체 용도로 쓰는 도구(phonics_blocks 등)는 모드 덮어쓰기 버튼을 숨김. */
var curTool=null, curCfg=null;
var shareBar=document.createElement('div');
shareBar.id='share-bar';
shareBar.style.cssText='display:none;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:10px 0 4px;';
/* ── ⚙️ 왼쪽 서랍 — 보조 버튼 격납 (2026-07-02 준호 정돈 지시: 화면엔 모드탭+교구 버튼만) ── */
var klDrawer=document.createElement('div'); klDrawer.id='kl-drawer';
klDrawer.innerHTML='<div style="font-size:19px;font-weight:800;color:#1565C0;margin-bottom:12px;font-family:Jua,sans-serif;">⚙️ 교구 설정</div>'
 +'<div style="font-size:13px;font-weight:800;color:#8aa0b6;margin:8px 0 6px;">학년 칸</div>'
 +'<div id="dw-grades"><div id="dw-grades-note" style="font-size:13px;color:#9AB7D4;line-height:1.5;">이 교구는 학년이 자동으로 맞춰져 있어요</div></div>'
 +'<div style="font-size:13px;font-weight:800;color:#8aa0b6;margin:16px 0 6px;">수업 공유</div><div id="dw-share"></div>';
document.body.appendChild(klDrawer);
var klHandle=document.createElement('button'); klHandle.id='kl-drawer-handle'; klHandle.textContent='⚙️'; klHandle.title='교구 설정';
document.body.appendChild(klHandle);
var klDcss=document.createElement('style');
klDcss.textContent='#kl-drawer{position:fixed;left:0;top:0;bottom:0;width:256px;background:#fff;box-shadow:4px 0 24px rgba(13,28,74,.16);padding:64px 16px 22px;z-index:60;transform:translateX(-100%);transition:transform .28s ease;overflow-y:auto;font-family:Jua,sans-serif;}'
 +'#kl-drawer.open{transform:translateX(0);}'
 +'#kl-drawer .kl-grades{flex-direction:column;align-items:stretch;margin:0 !important;}'
 +'#kl-drawer .kl-grade{width:100%;}'
 +'#kl-drawer #dw-share{display:flex;flex-direction:column;gap:8px;}'
 +'#kl-drawer #share-bar{display:flex !important;flex-direction:column;gap:8px;margin:0 !important;align-items:stretch !important;}'
 +'#kl-drawer-handle{position:fixed;left:0;top:42%;z-index:61;font-size:21px;padding:13px 11px;border:2.5px solid #1565C0;border-left:none;border-radius:0 15px 15px 0;background:#fff;color:#1565C0;cursor:pointer;box-shadow:2px 2px 12px rgba(21,101,192,.16);font-family:inherit;}'
 +'#kl-drawer-handle.nudge{animation:klNud 1.1s ease 2;}@keyframes klNud{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}';
document.head.appendChild(klDcss);
function klToggleDrawer(o){klDrawer.classList.toggle('open',o);}
klHandle.addEventListener('click',function(e){e.stopPropagation();klToggleDrawer(!klDrawer.classList.contains('open'));});
document.addEventListener('click',function(e){
  if(klDrawer.classList.contains('open')&&!klDrawer.contains(e.target)&&e.target!==klHandle)klToggleDrawer(false);
});
document.getElementById('dw-share').appendChild(shareBar);   /* 링크복사·모드칩 줄 = 서랍으로 */
/* 도구가 그리는 학년군(.kl-grades)을 서랍으로 이동 — 도구가 다시 그릴 때마다 */
(function(){
  var mEl=document.getElementById('mountEl'); if(!mEl)return;
  new MutationObserver(function(){
    var g=mEl.querySelector('.kl-grades'); if(!g)return;
    var slot=document.getElementById('dw-grades');
    var note=document.getElementById('dw-grades-note'); if(note)note.style.display='none';
    Array.prototype.slice.call(slot.querySelectorAll('.kl-grades')).forEach(function(x){x.remove();});
    slot.appendChild(g);
    klHandle.classList.add('nudge'); setTimeout(function(){klHandle.classList.remove('nudge');},2300);
  }).observe(mEl,{childList:true,subtree:true});
})();
function shareURL(mode){
  var cfg={}; var src=curCfg||{}; for(var k in src)cfg[k]=src[k];
  if(mode)cfg.mode=mode;
  var base=location.href.split('?')[0];
  var u=base+'?tool='+encodeURIComponent(curTool);
  if(Object.keys(cfg).length)u+='&cfg='+encodeURIComponent(JSON.stringify(cfg));
  return u;
}
function copyText(t,btn){
  function done(){var old=btn.textContent;btn.textContent='✓ 복사됐어요!';btn.disabled=true;setTimeout(function(){btn.textContent=old;btn.disabled=false;},1300);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){window.prompt('링크를 복사하세요',t);});}
  else window.prompt('링크를 복사하세요',t);
}
function renderShare(){
  if(!curTool){shareBar.style.display='none';return;}
  var foreignMode=!!(curCfg&&curCfg.mode&&['free','mission','quiz'].indexOf(curCfg.mode)<0);
  var sb='font-size:16px;padding:8px 14px;border-radius:12px;border:2.5px solid #1565C0;background:#fff;color:#1565C0;cursor:pointer;font-weight:800;font-family:inherit;line-height:1;';
  var html='<span style="font-size:15px;font-weight:800;color:#5a7894;">🔗 링크 복사</span>';
  if(foreignMode){
    html+='<button class="shr" data-m="" style="'+sb+'">이 교구 그대로</button>';
  } else {
    html+='<button class="shr" data-m="" style="'+sb+'border-color:#9aa;color:#666;">기본</button>'
        +'<button class="shr" data-m="free" style="'+sb+'">🧭 자유탐구</button>'
        +'<button class="shr" data-m="mission" style="'+sb+'border-color:#7048E8;color:#7048E8;">🎯 미션</button>'
        +'<button class="shr" data-m="quiz" style="'+sb+'border-color:#FF8A3D;color:#FF8A3D;">❓ 퀴즈</button>';
  }
  shareBar.innerHTML=html; shareBar.style.display='flex';
  shareBar.querySelectorAll('.shr').forEach(function(b){
    b.addEventListener('click',function(){copyText(shareURL(b.dataset.m||null),b);});
  });
}
renderCards();

/* ===== 케이랩 제품 얼굴: 실제 수치 자동 집계 + 추천 교구 + 잔별 ===== */
(function(){
  // 히어로 잔별
  var hero=document.querySelector('.hero');
  if(hero)for(var i=0;i<26;i++){
    var d=document.createElement('i'); d.className='hstar';
    var sz=(Math.random()*2.4+1).toFixed(1);
    d.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*2.5).toFixed(1)+'s;';
    hero.appendChild(d);
  }
  // 추천 교구 카드(바로 만져 보기)는 심플 정리로 제거됨
})();

/* ===== 딥링크 모드 (케이티처 차시 → 교구 바로 적용) =====
   klab.html?tool=tenframe&cfg=<JSON>&label=십 배열판&from=kteacher
   - tool: KLab 등록 이름 (필수)
   - cfg : JSON.stringify 후 encodeURIComponent한 도구 설정 (선택)
   - label: 복귀 바에 보일 교구 이름 (선택)
   - from=kteacher: 케이티처에서 열림 — 복귀 바 노출 */
(function(){
  var sp;
  try { sp = new URLSearchParams(location.search); } catch(e) { return; }
  var tool = sp.get('tool');
  if (!tool) return;
  var cfg = {};
  try { cfg = JSON.parse(sp.get('cfg') || '{}'); } catch(e) { cfg = {}; }
  var label = sp.get('label') || tool;
  var fromLesson = sp.get('from') === 'kteacher';

  enterFocus(label, fromLesson);
  if (window.KLab && window.KLab.has(tool)) mount(tool, cfg);
  else mountEl.innerHTML = '<div class="ph">준비 중인 교구입니다: ' + label + '</div>';

  document.getElementById('back-to-lesson').addEventListener('click', function(){
    window.close();
    // 스크립트로 못 닫는 창(직접 연 탭)이면 히스토리로
    setTimeout(function(){ try { history.back(); } catch(e){} }, 150);
  });
})();
</script>

/* activity-core.css — 케이티처 활동 표준 셸 (Phase 3)
 * 헌법: 설계 §6 현장 헌장이 여기 박혀 있다. 도구는 이 스타일을 다시 쓰지 않는다.
 *   §6-2 답 버튼은 가로 일렬 (.ansgrp = row 고정)
 *   §6-3 판독 우선 (숫자·핵심 정보는 고대비 카드 위)
 *   §6-6 우상단은 호스트 구역 (#hud right: var(--kb-safe-right))
 *   §6-8 [넘기기]·[그만하기]는 HUD 상설

 */
:root {
  --cream:#fffbf5; --ink:#78350f; --deep:#92400e; --amber:#f59e0b; --amber-d:#d97706;
  --good:#22c55e; --bad:#f87171; --teamA:#f59e0b; --teamB:#10b981;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; }
body { background:var(--cream); font-family:'Jua',sans-serif; color:var(--ink);
       display:flex; align-items:center; justify-content:center; overflow:hidden; }
.num { font-family:'Nunito',sans-serif; font-weight:800; }
.screen { display:none; width:100%; height:100%; padding:clamp(10px,2vw,28px);
          flex-direction:column; align-items:center; justify-content:center; gap:clamp(10px,2vh,22px); }
.screen.active { display:flex; }
h1 { font-size:clamp(30px,6vw,58px); color:var(--deep); margin:0; text-align:center; }
/* [D36] 브랜드는 겹치지 않는다 — position:fixed 좌상단이 시작 화면 제목과
   수업 모드 팀 점수판 위에 그대로 포개져 있었다(전 30종 동일). 흐름에서 빼되 자리를 비켜 준다. */
.brand { position:fixed; top:10px; left:14px; font-size:15px; color:var(--amber-d); z-index:1;
         pointer-events:none; opacity:.55; }
@media (max-width:820px), (orientation:portrait) { .brand { display:none; } }
.btn { font-family:'Jua',sans-serif; border:none; border-radius:16px; cursor:pointer;
       min-height:44px; min-width:44px; font-size:clamp(18px,2.6vw,26px); padding:12px 28px;
       background:var(--amber); color:#fff; box-shadow:0 4px 0 var(--amber-d); }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--amber-d); }
.btn.ghost { background:#fff; color:var(--deep); box-shadow:0 4px 0 #e7d9c4; border:2px solid #f3e2c4; }

#teams { display:none; width:100%; max-width:900px; justify-content:space-between; }
.team { border-radius:14px; padding:6px 20px; color:#fff; font-size:clamp(18px,2.6vw,26px); }
.team.A { background:var(--teamA); } .team.B { background:var(--teamB); }

/* 무대: 장르가 채우는 영역 */
#stage { flex:1; display:flex; align-items:center; justify-content:center; width:100%; min-height:0; }

#explain { min-height:clamp(34px,5vh,52px); font-size:clamp(17px,2.6vw,26px); color:var(--deep);

/* 답 버튼 — §6-2: 그룹 내부는 언제나 가로 일렬 */

/* [D37] 실물 전자칠판(1920)에서 6버튼+라벨은 약 1,156px이 필요한데 960px로 묶여 있어
   두 팀 줄이 넘쳤다. 축소 미리보기 탓이 아니라 실기기 결함이었다. 폭을 판에 맞춘다. */

/* [D38] 답 버튼 글자는 줄바꿈하지 않는다 — 「같아요」가 「같아/요」로 쪼개져 있었다. */

        background:#fff; color:var(--deep); border:3px solid var(--amber); box-shadow:0 4px 0 #e7c890; }
.abtn:active { transform:translateY(3px); box-shadow:none; }
.ansgrp.A .abtn { border-color:var(--teamA); } .ansgrp.B .abtn { border-color:var(--teamB); }
.abtn.locked { opacity:.45; pointer-events:none; }
.abtn.shake { animation:shake .45s; border-color:var(--bad); }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-9px)} 40%,80%{transform:translateX(9px)} }
#why-box { display:none; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:640px; }
#why-box .wq { font-size:clamp(18px,2.6vw,26px); color:var(--deep); }
#why-box .whyrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

/* ── 종료 화면 ── */
#scr-end .big { font-size:clamp(40px,8vw,84px); color:var(--deep); }
#scr-end .line { font-size:clamp(18px,3vw,30px); color:var(--amber-d); text-align:center; }

@media (orientation:portrait) {
  #answers-class { flex-direction:column; align-items:center; }  /* 그룹 간 상하, 그룹 내부는 가로 (§6-2) */
}

/* ── 무대 스타일 ── */
/* 무대 — 관찰 고르기 (observe_pick) */
#op { display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.6vh,16px); width:100%; max-width:min(96vw,1100px); }
#op-ask { font-family:'Jua',sans-serif; font-size:clamp(22px,3vw,40px); line-height:1.3; color:var(--deep); text-align:center; word-break:keep-all;
          background:#fff; border:4px solid var(--amber); border-radius:20px; padding:clamp(8px,1.4vh,14px) clamp(14px,2vw,26px); box-shadow:0 5px 0 #e7c890; }
#op-pair { display:flex; gap:clamp(10px,2vw,28px); width:100%; justify-content:center; }
.op-card { position:relative; flex:1 1 0; max-width:min(44vw,40vh,440px); aspect-ratio:1/1; background:#fff; border:5px solid #d6dfe8; border-radius:22px;
           padding:clamp(4px,.8vw,10px); box-shadow:0 6px 0 #c3ccd6; cursor:pointer; transition:transform .15s, border-color .2s, opacity .2s; }
.op-card:active { transform:translateY(3px); box-shadow:none; }
.op-pic, .op-pic svg { width:100%; height:100%; display:block; }
.op-tag { position:absolute; top:-14px; left:-10px; width:1.7em; height:1.7em; display:flex; align-items:center; justify-content:center; border-radius:50%;
          background:var(--deep); color:#fff; font-family:'Jua',sans-serif; font-size:clamp(20px,2.4vw,32px); box-shadow:0 3px 0 rgba(0,0,0,.25); z-index:1; }
.op-card.ok { border-color:var(--good); background:#f0fdf4; box-shadow:0 6px 0 #86efac; }
.op-card.show { border-color:var(--amber); box-shadow:0 6px 0 #fcd34d; }
.op-card.dim { opacity:.45; }
.op-card.unk { border-style:dashed; border-color:#a78bfa; }
.op-card.unk::after { content:'🤔'; position:absolute; right:6px; bottom:4px; font-size:clamp(28px,3.6vw,48px); }
.op-card.no { border-color:var(--bad); }
#op-step { font-size:clamp(17px,2.2vw,28px); color:var(--amber-d); background:#fef3c7; border-radius:12px; padding:6px 20px; word-break:keep-all; text-align:center; }
@media (orientation:portrait) { .op-card { max-width:46vw; } }

<!-- 케이박스 스택 (assign 제출용 — 없으면 조용히 무시됨) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu_config.js"></script>
<script src="/kedu_kbox_adapter.js"></script>

<script>
/* core/bridge.js — 케이티처 활동 시스템 브리지 v1.1.0
 * 헌법: handoff/kedu/activities/케이티처_활동시스템_설계.md §3·§4·§8
 * v1.0.0 프로토콜(§4 postMessage)은 동결 유지 — 변경 없음.
 * v1.1.0 추가: assign 재제출 병합(§8-4, M3 해소). cw_submit이 upsert(last-write-wins)이므로
 *   시도 이력이 서버에 쌓이지 않는다 → 브리지가 제출 직전에 이전 제출을 읽어 정책대로 병합한다.
 *   정책 sc = best(기본, D4) | first(D10 성향) | last. 조회 원천은 RPC cw_open_bundle(서버) >
 *   localStorage 백업(기기) > 없음(첫 시도). 조회 실패해도 제출은 반드시 수행한다(유실 0 우선).
 *
 * 프로토콜(§4): 상행 ACTIVITY_READY / PROGRESS / RESULT / EXIT, 하행 ACTIVITY_CONFIG / CLOSE. v:1 고정.
 * 모드 판정(§20-2): URL에 cwb+cwi(케이박스 딥링크)가 있으면 무조건 assign. 그 외 ?mode=, 기본 solo.
 * 설정 우선순위(§3-3): CONFIG > URL 파라미터 > init defaults(카탈로그 기본값) > 코드 기본값.
 * 핸드셰이크(§4-1): 선택적. CONFIG 800ms 미도착 = standalone 진행. 실패가 도구를 멈추게 하지 않는다.
 * 케이박스 제출(§20-2): finish 시 assign이면 KBox.submit 직결. 실패 시 localStorage 보관 +
 *   지수 백오프 재시도(기본 [2000,6000,18000]ms, window.__KBRIDGE_RETRY_MS__로 오버라이드) +
 *   재진입 시 자동 재제출. 학생 결과는 절대 유실하지 않는다(§4-4). 어댑터는 무수정(전 도구 공용).
 * detail(§13-3): 문항 수준 기록은 assign 모드에서만 발신·제출. 최대 100항목.
 * 안전 여백(§6-6): hosted면 <html>에 .kb-hosted + --kb-safe-right=128px. 도구 우상단 HUD는
 *   right: var(--kb-safe-right, 12px)로 선언한다 — 호스트 [활동 닫기]와 겹치지 않는다.
 * 시드(§3-1): ?seed= 있으면 고정(mulberry32), 없으면 랜덤. KBridge.rng로 노출.
 *
 * API(§4-5):
 *   KBridge.init({ activityId, defaults, onConfig(cfg), onClose, getProgress, configWaitMs })
 *   KBridge.progress({ q, total, ok, type })
 *   KBridge.finish({ score, total, durationSec, byType, detail, onSubmit })  → true | false(중복)
 *   KBridge.exit(reason, progress)
 *   KBridge.mode / .seed / .scoring / .rng() / .version
 */
(function () {
  'use strict';
  var VERSION = '1.1.0';
  var MODES = ['class', 'solo', 'assign'];
  var SCORING = ['best', 'first', 'last'];
  var PKEY = 'kbridge_pending_v1';
  var BKEY = 'kbridge_best_v1';        // 서버 조회 실패 대비 기기 백업 (§8-4)
  var PREV_WAIT_MS = 1500;             // 이전 제출 조회 상한 — 넘으면 병합 없이 제출

  var q = new URLSearchParams(location.search);
  var isLocal = location.protocol === 'file:' ||
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  var TARGET = isLocal ? '*' : location.origin;

  // ── 모드 판정: 케이박스 딥링크(cwb+cwi) = assign 강제 (§20-2)
  var kboxDeep = !!(q.get('cwb') && q.get('cwi'));
  var urlMode = q.get('mode');
  var mode = kboxDeep ? 'assign' : (MODES.indexOf(urlMode) >= 0 ? urlMode : 'solo');

  // ── 시드 난수 (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var seedRaw = q.get('seed');
  var seed = (seedRaw != null && seedRaw !== '' && !isNaN(+seedRaw))
    ? (+seedRaw | 0) : Math.floor(Math.random() * 2147483647);
  var rng = mulberry32(seed);

  var state = {
    activityId: null,
    mode: mode,
    aid: q.get('aid') || null,
    sid: (q.get('sid') != null && q.get('sid') !== '') ? parseInt(q.get('sid'), 10) : null,
    mute: q.get('mute') === '1',
    sc: (SCORING.indexOf(q.get('sc')) >= 0 ? q.get('sc') : 'best'),   // §8-4 재시도 채점 정책
    startedAt: Date.now(),
    finished: false,
    closed: false
  };

  function post(msg) {
    try { (window.parent || window).postMessage(msg, TARGET); } catch (e) { /* 발신 실패는 무해 */ }
  }
  function validOrigin(ev) { return isLocal || ev.origin === location.origin; }

  // ── localStorage 보류 큐 (§4-4 유실 방지; 시크릿 모드 등 불가 환경은 조용히 무시 §14-10)
  function loadPending() {
    try { return JSON.parse(localStorage.getItem(PKEY) || '[]'); } catch (e) { return []; }
  }
  function savePending(arr) {
    try { localStorage.setItem(PKEY, JSON.stringify(arr)); } catch (e) { /* no-op */ }
  }
  function addPending(env) {
    var arr = loadPending();
    arr.push({ ts: Date.now(), env: env });
    savePending(arr);
  }
  function removePendingByTs(ts) {
    savePending(loadPending().filter(function (p) { return p.ts !== ts; }));
  }
  function retryDelays() {
    return (typeof window !== 'undefined' && window.__KBRIDGE_RETRY_MS__) || [2000, 6000, 18000];
  }

  // ── 케이박스 제출 (어댑터 직결 §20-2). done(res)는 최종 1회.
  function kboxSubmit(env, attempt, pendingTs, done) {
    var KB = window.KBox;
    if (!(KB && KB.active)) { if (done) done({ status: 'inactive' }); return; }
    var p;
    try { p = Promise.resolve(KB.submit(env)); }
    catch (e) { p = Promise.resolve({ status: 'error', message: String(e) }); }
    p.then(function (res) {
      var st = res && res.status;
      var fail = (st === 'error' || st === 'no_client' || st === 'no_session');
      if (!fail) { // ok·dup·inactive = 종결 (dup: 어댑터 이중 가드 통과 = 이미 제출됨)
        if (pendingTs != null) removePendingByTs(pendingTs);
        if (done) done(res || { status: 'ok' });
        return;
      }
      var delays = retryDelays();
      if (attempt < delays.length) {
        setTimeout(function () { kboxSubmit(env, attempt + 1, pendingTs, done); }, delays[attempt]);
      } else {
        if (pendingTs == null) addPending(env); // 최초 실패분만 보관 (재진입분은 이미 큐에 있음)
        if (done) done({ status: 'pending' });
      }
    });
  }

  // ── 재진입 시 보류분 자동 재제출 (init에서 호출)
  // 보류 봉투는 detail.attempt(이번 시도 raw)를 품고 있으므로 재병합해서 보낸다 —
  // 다른 기기에서 그 사이에 제출이 있었어도 정책(best/first)이 깨지지 않는다.
  function flushPending() {
    if (!(window.KBox && window.KBox.active)) return;
    loadPending().forEach(function (p) {
      var at = p.env && p.env.detail && p.env.detail.attempt;
      if (at) submitAssign(at, p.env.detail.activityId, p.ts, null);
      else kboxSubmit(p.env, 0, p.ts, null);   // v1.0.0 봉투 호환 (attempt 없음)
    });
  }

  // ── 재제출 병합 (§8-4) ────────────────────────────────────────────────────
  function itemKey() {
    var KB = window.KBox;
    return (KB && KB.bundleId && KB.itemId) ? (KB.bundleId + ':' + KB.itemId) : null;
  }
  function loadBackup() {
    var k = itemKey(); if (!k) return null;
    try { return (JSON.parse(localStorage.getItem(BKEY) || '{}'))[k] || null; } catch (e) { return null; }
  }
  function saveBackup(payload) {
    var k = itemKey(); if (!k) return;
    try {
      var all = JSON.parse(localStorage.getItem(BKEY) || '{}');
      all[k] = payload;
      localStorage.setItem(BKEY, JSON.stringify(all));
    } catch (e) { /* 시크릿 모드 등 — 서버가 원천이므로 무해 */ }
  }
  function sbClient() {
    if (window.sb && window.sb.rpc) return window.sb;
    if (typeof window.getKeduDb === 'function') { try { return window.getKeduDb(); } catch (e) { return null; } }
    return (window.supabase && window.supabase.rpc) ? window.supabase : null;
  }
  // 이전 제출 payload 조회: 서버(cw_open_bundle) > 기기 백업 > null. 실패해도 절대 막지 않는다.
  function readPrev(cb) {
    var KB = window.KBox;
    if (!(KB && KB.active && KB.bundleId && KB.itemId)) { cb(null); return; }
    var sb = sbClient();
    if (!sb || !sb.rpc) { cb(loadBackup()); return; }
    var settled = false;
    var timer = setTimeout(function () {
      if (settled) return; settled = true; cb(loadBackup());
    }, PREV_WAIT_MS);
    var p;
    try { p = Promise.resolve(sb.rpc('cw_open_bundle', { p_bundle_id: KB.bundleId })); }
    catch (e) { clearTimeout(timer); settled = true; cb(loadBackup()); return; }
    p.then(function (res) {
      if (settled) return; settled = true; clearTimeout(timer);
      var d = res && res.data, mine = null;
      var items = d && d.items;
      if (Array.isArray(items)) {
        for (var i = 0; i < items.length; i++) {
          if (items[i] && items[i].id === KB.itemId) { mine = items[i].payload || null; break; }
        }
      }
      cb((mine && mine.tool === 'activity') ? mine : loadBackup());
    }).catch(function () {
      if (settled) return; settled = true; clearTimeout(timer); cb(loadBackup());
    });
  }
  function rate(s, m) { return (m > 0) ? (s || 0) / m : 0; }

  // prev(이전 payload) + attempt(이번 시도) → 정책대로 병합된 KEDU_RESULT 봉투
  function mergeEnv(prev, attempt, activityId) {
    var pd = (prev && prev.detail) || null;
    var policy = state.sc;
    var mine = { score: attempt.score, max: attempt.max, at: attempt.at };
    var attempts = (pd && pd.attempts | 0) || 0;
    attempts += 1;

    var chosen;                                   // 채택된 시도 (최상위 score/max·byType·items의 원천)
    if (!prev || !pd) chosen = attempt;
    else if (policy === 'last') chosen = attempt;
    else if (policy === 'first') {
      chosen = {
        score: prev.score, max: prev.max, byType: pd.byType || {},
        items: pd.items || [], durationSec: pd.durationSec || 0,
        at: (pd.first && pd.first.at) || mine.at
      };
    } else {                                      // best (기본, D4) — 동률이면 이전 기록 존중
      chosen = (rate(attempt.score, attempt.max) > rate(prev.score, prev.max)) ? attempt : {
        score: prev.score, max: prev.max, byType: pd.byType || {},
        items: pd.items || [], durationSec: pd.durationSec || 0, at: mine.at
      };
    }

    var history = ((pd && pd.history) || []).concat([mine]).slice(-10);
    return {
      tool: 'activity', kind: 'auto',
      score: chosen.score, max: chosen.max,
      detail: {
        activityId: activityId,
        byType: chosen.byType || {},
        durationSec: chosen.durationSec,
        items: chosen.items || [],
        policy: policy,
        attempts: attempts,
        attempt: attempt,                          // 이번 시도 raw (보류 재제출 시 재병합용)
        first: (pd && pd.first) || mine,
        last: mine,
        history: history
      }
    };
  }

  // assign 제출 진입점: 이전 제출 조회 → 병합 → 제출(+실패 시 보류·재시도)
  function submitAssign(attempt, activityId, pendingTs, done) {
    readPrev(function (prev) {
      var env = mergeEnv(prev, attempt, activityId);
      kboxSubmit(env, 0, pendingTs, function (res) {
        if (res && (res.status === 'ok' || res.status === 'dup')) saveBackup(env);
        if (done) done(res);
      });
    });
  }

  // ── 설정 병합 (§3-3): CONFIG > URL > defaults
  function resolveConfig(hostCfg, defaults) {
    var params = {};
    var d = defaults || {};
    Object.keys(d).forEach(function (k) { params[k] = d[k]; });
    Object.keys(d).forEach(function (k) {           // URL 오버라이드 (defaults 선언 키만 — §3-1 미지 파라미터 무시)
      var v = q.get(k);
      if (v != null && v !== '') params[k] = isNaN(+v) ? v : +v;
    });
    var tRaw = q.get('t');                          // 예약 파라미터 t(제한 시간)
    if (tRaw != null && tRaw !== '' && !isNaN(+tRaw)) params.t = parseInt(tRaw, 10);
    if (hostCfg && hostCfg.params && SCORING.indexOf(hostCfg.params.sc) >= 0) state.sc = hostCfg.params.sc;
    params.sc = state.sc;                           // 예약 파라미터 sc(재시도 채점 정책, §8-4)

    var meta = { sid: state.sid, aid: state.aid, mute: state.mute, teamNames: null };
    if (hostCfg) {
      if (hostCfg.mode && MODES.indexOf(hostCfg.mode) >= 0 && !kboxDeep) state.mode = hostCfg.mode; // 딥링크 assign은 불가침
      if (hostCfg.params && typeof hostCfg.params === 'object') {
        Object.keys(hostCfg.params).forEach(function (k) { params[k] = hostCfg.params[k]; });
      }
      var hm = hostCfg.meta;
      if (hm && typeof hm === 'object') {
        if (hm.sid != null) { state.sid = hm.sid; meta.sid = hm.sid; }
        if (hm.aid != null) { state.aid = hm.aid; meta.aid = hm.aid; }
        if (hm.mute != null) { state.mute = !!hm.mute; meta.mute = state.mute; }
        if (hm.teamNames) meta.teamNames = hm.teamNames;
      }
    }
    return { mode: state.mode, params: params, meta: meta, seed: seed, hosted: !!hostCfg };
  }

  var KBridge = {
    version: VERSION,
    get mode() { return state.mode; },
    get seed() { return seed; },
    get scoring() { return state.sc; },
    rng: rng,

    // 부팅 시 1회 (§4-5)
    init: function (opts) {
      opts = opts || {};
      state.activityId = opts.activityId || 'unknown';
      post({ t: 'ACTIVITY_READY', v: 1, activityId: state.activityId, coreVersion: VERSION });
      flushPending();

      var settled = false;
      var timer = null;
      function settle(hostCfg) {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        var cfg = resolveConfig(hostCfg, opts.defaults);
        // §6-6 우상단은 호스트 구역: hosted면 도구 HUD가 피할 여백을 알려준다.
        // 도구는 right: var(--kb-safe-right, 12px) 만 쓰면 된다 (표준).
        try {
          var de = document.documentElement;
          if (cfg.hosted) {
            de.classList.add('kb-hosted');
            de.style.setProperty('--kb-safe-right', '128px');
          } else {
            de.style.setProperty('--kb-safe-right', '12px');
          }
        } catch (e) { /* DOM 없는 환경 무해 */ }
        if (typeof opts.onConfig === 'function') opts.onConfig(cfg);
      }

      window.addEventListener('message', function (ev) {
        if (!validOrigin(ev)) return;
        var m = ev.data;
        if (!m || m.v !== 1) return;
        if (m.t === 'ACTIVITY_CONFIG') {
          settle(m);
        } else if (m.t === 'ACTIVITY_CLOSE') {       // §4-2 ⑥: 현재 상태로 EXIT/RESULT 후 정지
          if (state.finished || state.closed) return;
          if (typeof opts.onClose === 'function') opts.onClose();       // 도구가 RESULT로 마감할 기회
          if (!state.finished && !state.closed) {
            KBridge.exit('host_close', typeof opts.getProgress === 'function' ? opts.getProgress() : null);
          }
        }
      });

      timer = setTimeout(function () { settle(null); }, opts.configWaitMs || 800); // §4-1 standalone 진행
    },

    // 판정마다 (선택, §4-2 ②)
    progress: function (p) {
      p = p || {};
      post({
        t: 'ACTIVITY_PROGRESS', v: 1, activityId: state.activityId,
        q: p.q, total: p.total, ok: !!p.ok, type: p.type
      });
    },

    // 종료 시 1회 (§4-2 ③). 중복 호출 = false 반환 (이중 가드)
    finish: function (r) {
      if (state.finished) return false;
      state.finished = true;
      r = r || {};
      var durationSec = (r.durationSec != null) ? r.durationSec
        : Math.round((Date.now() - state.startedAt) / 1000);
      var byType = r.byType || {};
      var msg = {
        t: 'ACTIVITY_RESULT', v: 1,
        activityId: state.activityId, mode: state.mode,
        score: r.score, total: r.total, durationSec: durationSec, byType: byType
      };
      var detail = null;
      if (state.mode === 'assign') {                 // §13-3: detail은 assign에서만
        if (state.aid) msg.aid = state.aid;
        if (state.sid != null) msg.sid = state.sid;
        if (Array.isArray(r.detail)) { detail = r.detail.slice(0, 100); msg.detail = detail; }
      }
      post(msg);

      if (state.mode === 'assign') {                 // §8: KBox.submit 직결 + §8-4 정책 병합
        submitAssign({
          score: r.score, max: r.total, byType: byType,
          items: detail || [], durationSec: durationSec, at: Date.now()
        }, state.activityId, null, r.onSubmit || null);
      }
      return true;
    },

    // 중도 이탈 (§4-2 ④)
    exit: function (reason, progress) {
      if (state.finished || state.closed) return;
      state.closed = true;
      post({
        t: 'ACTIVITY_EXIT', v: 1, activityId: state.activityId,
        mode: state.mode, reason: reason || 'user', progress: progress || null
      });
    }
  };

  window.KBridge = KBridge;
})();
</script>
<script>
/* activity-core.js — 케이티처 활동 공통 프레임 v1.0.0 (Phase 3)
 * 헌법: 설계 §9-2. 여기 있는 것은 모든 활동이 공짜로 얻는다. 도구는 다시 만들지 않는다.
 *
 * core가 하는 일: 셸 DOM(3막 화면·HUD·팀 점수판·설정 칩·답 버튼·explain) · 효과음 ·
 *   점수/byType/judged 집계 · [넘기기]/[그만하기] · 부분 마감(§6-8) · 브리지 연동 · solo 최고 기록.
 * core가 하지 않는 일: 문제 렌더 · 게임 루프 · 승패 판정 — 그건 장르(genre/*.js)의 일.
 *
 * 사용:
 *   var app = ACore.create({
 *     activityId, title, subtitle, defaults, settings: [{key,label,options:[{v,label}]}],
 *     stageHtml, onConfig(app,cfg), onStart(app)
 *   });
 *   app.mode / app.cfg / app.settings / app.sfx / app.rng
 *   app.el(sel) / app.setStage(html)
 *   app.begin()                      // 게임 화면 진입 (장르가 호출)
 *   app.setProg(i, n) / app.addScore(delta) / app.teamScore(idx, delta)
 *   app.tally(type, ok) / app.markJudged()
 *   app.answers(list, onPick)        // §6-2 가로 일렬. class면 2팀 그룹 자동
 *   app.lockAnswers() / app.lockTeam(idx) / app.shake(idx, pick)
 *   app.explain(text, ok) / app.clearExplain()
 *   app.onSkip(fn) / app.finish(opts) / app.judged
 */
(function () {
  'use strict';

  var SHELL =
    '<div class="brand">K✦edu 놀이터</div>' +
    '<div class="screen active" id="scr-start">' +
      '<h1 id="a-title"></h1>' +
      '<div class="sub" id="a-sub"></div>' +
      '<div id="sid-badge"></div>' +
      '<div id="settings"></div>' +
      '<div id="best-line"></div>' +
      '<button class="btn" id="start-btn">시작!</button>' +
    '</div>' +
    '<div class="screen" id="scr-game">' +
      '<div id="hud">' +
        '<div class="pill" id="prog"></div>' +
        '<div class="pill num" id="score-pill">0점</div>' +
        '<button id="mute-btn" title="소리 켜기/끄기">🔊</button>' +
        '<button id="skip-btn" title="이 문제는 넘기기">넘기기 ⏭</button>' +
        '<button id="quit-btn">그만하기</button>' +
      '</div>' +
      '<div id="teams">' +
        '<div class="team A"><span id="tA-name">케이팀</span> <span class="num" id="tA-score">0</span></div>' +
        '<div class="team B"><span id="tB-name">듀팀</span> <span class="num" id="tB-score">0</span></div>' +
      '</div>' +
      '<div id="stage"></div>' +
      '<div id="explain"></div>' +
      '<div id="answers-solo"></div>' +
      '<div id="answers-class">' +
        '<div class="ansgrp A" data-team="0" data-label="케이팀"></div>' +
        '<div class="ansgrp B" data-team="1" data-label="듀팀"></div>' +
      '</div>' +
      '<div id="why-box"><div class="wq" id="why-q">🦉 어떻게 알았어?</div><div class="whyrow" id="why-opts"></div></div>' +
    '</div>' +
    '<div class="screen" id="scr-end">' +
      '<div class="big" id="end-big">🎉</div>' +
      '<div class="line" id="end-line"></div>' +
      '<div class="line" id="end-best" style="display:none"></div>' +
      '<div class="line" id="submit-line" style="display:none"></div>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">' +
        '<button class="btn" id="again-btn">다시 하기</button>' +
      '</div>' +
    '</div>';

  function create(opts) {
    opts = opts || {};
    var doc = document;
    var host = doc.getElementById('a-root') || doc.body;
    host.innerHTML = SHELL + host.innerHTML;

    var $ = function (s) { return doc.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(doc.querySelectorAll(s)); };

    // ── 효과음 (mute 반영, 시작 제스처 뒤 생성)
    var AC = null, muted = false;
    function sfxInit() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    function tone(f, dur, type, vol) {
      if (muted || !AC) return;
      try {
        var o = AC.createOscillator(), g = AC.createGain();
        o.type = type || 'sine'; o.frequency.value = f;
        g.gain.value = vol || .12;
        o.connect(g); g.connect(AC.destination);
        o.start(); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + (dur || .15));
        o.stop(AC.currentTime + (dur || .15) + .02);
      } catch (e) {}
    }
    var sfx = {
      good: function () { tone(660, .12); setTimeout(function () { tone(880, .18); }, 90); },
      bad: function () { tone(200, .2, 'triangle', .08); },
      tick: function () { tone(440, .06, 'square', .05); },
      win: function () { [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { tone(f, .22); }, i * 130); }); }
    };

    var app = {
      activityId: opts.activityId || 'unknown',
      mode: 'solo', cfg: null, settings: {},
      sfx: sfx,
      rng: function () { return Math.random(); },
      judged: 0, skipped: 0, score: 0, i: 0, n: 0,
      byType: {}, detail: [], teams: [{ name: '케이팀', score: 0 }, { name: '듀팀', score: 0 }],
      started: false, over: false,
      el: $, els: $$
    };

    // ── 설정 칩 (solo 전용 노출 — §3-2)
    function renderSettings() {
      var box = $('#settings');
      if (!opts.settings || !opts.settings.length) { box.style.display = 'none'; return; }
      box.innerHTML = opts.settings.map(function (s) {
        return '<div class="setrow"><span class="lb">' + s.label + '</span>' +
          s.options.map(function (o) {
            var on = (app.settings[s.key] === o.v) ? ' on' : '';
            return '<button class="chip' + on + '" data-set="' + s.key + '" data-v="' + o.v + '">' + o.label + '</button>';
          }).join('') + '</div>';
      }).join('');
      $$('.chip').forEach(function (c) {
        c.addEventListener('click', function () {
          $$('.chip[data-set="' + c.dataset.set + '"]').forEach(function (x) { x.classList.remove('on'); });
          c.classList.add('on');
          // 값 변환 규칙은 브리지와 같다 (§9-3, D21): 숫자로 읽히면 숫자, 아니면 문자열 그대로.
          // 무조건 +v 하면 'add' 같은 열거값이 NaN이 되어 설정이 조용히 무시된다.
          var raw = c.dataset.v;
          app.settings[c.dataset.set] = (raw !== '' && !isNaN(+raw)) ? +raw : raw;
        });
      });
    }

    // ── solo 최고 기록
    var BEST_KEY = 'kedu_act_best_' + app.activityId;
    var LEGACY_KEYS = opts.legacyRecordKeys || [];      // 구 단일파일 시절 키 (D13: 마이그레이션은 코드가 한다)
    app.record = {
      get: function () {
        try {
          var v = JSON.parse(localStorage.getItem(BEST_KEY) || 'null');
          if (v) return v;
          for (var i = 0; i < LEGACY_KEYS.length; i++) {
            var old = JSON.parse(localStorage.getItem(LEGACY_KEYS[i]) || 'null');
            if (old) { localStorage.setItem(BEST_KEY, JSON.stringify(old)); return old; }
          }
        } catch (e) {}
        return null;
      },
      set: function (v) { try { localStorage.setItem(BEST_KEY, JSON.stringify(v)); } catch (e) {} }
    };
    function refreshBest() {
      var b = app.record.get();
      if (b) {
        $('#best-line').style.display = 'block';
        $('#best-line').textContent = '🏅 나의 최고 기록: ' + b.score + '점 / ' + b.total;
      }
    }

    // ── 화면
    function show(id) {
      $$('.screen').forEach(function (s) { s.classList.remove('active'); });
      $(id).classList.add('active');
    }
    app.show = show;
    app.setStage = function (html) { $('#stage').innerHTML = html; };

    // ── HUD
    app.setProg = function (i, n) { app.i = i; app.n = n; $('#prog').textContent = i + ' / ' + n; };
    app.addScore = function (d) { app.score += (d || 0); $('#score-pill').textContent = app.score + '점'; };
    app.teamScore = function (idx, d) {
      app.teams[idx].score += (d || 0);
      $(idx === 0 ? '#tA-score' : '#tB-score').textContent = app.teams[idx].score;
    };
    app.tally = function (type, ok) {
      if (!type) return;
      var t = app.byType[type] || (app.byType[type] = { ok: 0, miss: 0 });
      if (ok) t.ok++; else t.miss++;
    };
    app.markJudged = function () { app.judged++; };   // §6-8 채점 분모

    // ── 답 버튼 (§6-2 가로 일렬. class = 2팀 그룹)
    app.answers = function (list, onPick) {
      var mk = function (o, teamIdx) {
        return '<button class="abtn" data-pick="' + o.pick + '"' +
          (teamIdx != null ? ' data-team="' + teamIdx + '"' : '') + '>' + o.label + '</button>';
      };
      if (app.mode === 'class') {
        $('#answers-class').style.display = 'flex';
        $('#answers-solo').style.display = 'none';
        [0, 1].forEach(function (t) {
          var g = $('.ansgrp' + (t === 0 ? '.A' : '.B'));
          g.innerHTML = list.map(function (o) { return mk(o, t); }).join('');
        });
      } else {
        $('#answers-solo').style.display = 'flex';
        $('#answers-class').style.display = 'none';
        $('#answers-solo').innerHTML = list.map(function (o) { return mk(o, null); }).join('');
      }
      $$('.abtn[data-pick]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.classList.contains('locked')) return;
          var t = b.dataset.team;
          onPick(b.dataset.pick, (t == null || t === '') ? null : +t, b);
        });
      });
    };
    app.hideAnswers = function () {
      $('#answers-solo').style.display = 'none';
      $('#answers-class').style.display = 'none';
      $('#why-box').style.display = 'none';
    };
    app.unlockAnswers = function () {
      $$('.abtn').forEach(function (b) { b.classList.remove('locked', 'shake'); });
    };
    app.lockAnswers = function () { $$('.abtn').forEach(function (b) { b.classList.add('locked'); }); };
    app.lockTeam = function (idx) {
      $$('.ansgrp[data-team="' + idx + '"] .abtn').forEach(function (b) { b.classList.add('locked'); });
    };
    app.shake = function (btn) {
      if (!btn) return;
      btn.classList.add('shake');
      setTimeout(function () { btn.classList.remove('shake'); }, 460);
    };

    // ── explain (정답 근거 — §10-2에서 규약으로 승격)
    app.explain = function (text, ok) {
      var e = $('#explain');
      e.innerHTML = '<span class="mark">' + (ok ? '⭕' : '❌') + '</span> ' + text;
      e.classList.add('show');
    };
    app.clearExplain = function () { $('#explain').classList.remove('show'); };

    // ── why 보너스 (선택)
    app.why = function (question, list, onPick) {
      $('#why-q').textContent = question;
      $('#why-opts').innerHTML = list.map(function (o) {
        return '<button class="abtn" data-why="' + o.v + '">' + o.label + '</button>';
      }).join('');
      $('#answers-solo').style.display = 'none';
      $('#answers-class').style.display = 'none';
      $('#why-box').style.display = 'flex';
      $$('#why-opts .abtn').forEach(function (b) {
        b.addEventListener('click', function () { onPick(b.dataset.why, b); });
      });
    };
    app.hideWhy = function () { $('#why-box').style.display = 'none'; };

    // ── 넘기기 (§6-8)
    var skipFn = null;
    app.onSkip = function (fn) { skipFn = fn; };
    $('#skip-btn').addEventListener('click', function () {
      if (!app.started || app.over || !skipFn) return;
      app.skipped++;
      skipFn();
    });

    // ── 마감 (§6-8: judged 0이면 결과 없음)
    app.finish = function (o) {
      o = o || {};
      if (app.over) return false;
      if (app.judged === 0) {                       // 판정 0 → 빈 수첩 금지
        KBridge.exit('user', { q: app.i, total: app.n });
        app.over = true;
        show('#scr-start');
        return false;
      }
      app.over = true;
      var total = (o.total != null) ? o.total : app.judged;
      var score = (o.score != null) ? o.score
        : (app.mode === 'class' ? app.teams[0].score + app.teams[1].score : app.score);

      show('#scr-end'); sfx.win();
      if (app.mode === 'class') {
        var A = app.teams[0], B = app.teams[1];
        $('#end-big').textContent = A.score === B.score ? '🤝' : '🏆';
        $('#end-line').innerHTML =
          (A.score === B.score ? '무승부! ' : (A.score > B.score ? A.name : B.name) + ' 승리! ') +
          '<br><span class="num">' + A.name + ' ' + A.score + ' : ' + B.score + ' ' + B.name + '</span>';
      } else {
        $('#end-big').textContent = score >= total * 0.8 ? '🎉' : '💪';
        $('#end-line').innerHTML = '<span class="num" style="font-size:1.4em">' + score + '</span> / ' + total + '점';
        if (app.mode === 'solo') {
          var b = app.record.get();
          var isNew = !b || score > b.score;
          if (isNew) app.record.set({ score: score, total: total });
          $('#end-best').style.display = 'block';
          $('#end-best').textContent = isNew ? '🏅 최고 기록 갱신!' : ('🏅 최고 기록: ' + b.score + '점');
        }
      }
      if (app.mode === 'assign') {
        var sl = $('#submit-line');
        sl.style.display = 'block'; sl.textContent = '제출하는 중…';
        $('#again-btn').style.display = 'none';    // 재시도는 과제 정책 소관 (케이박스가 결정)
      }
      KBridge.finish({

        muted = !!(cfg.meta && cfg.meta.mute);

        $('#a-title').textContent = opts.title || '';
        $('#a-sub').textContent = opts.subtitle || '';
        if (opts.stageHtml) app.setStage(opts.stageHtml);

        if (app.mode !== 'solo') $('#settings').style.display = 'none';   // §3-2
        else renderSettings();
        if (app.mode === 'assign') {
          $('#skip-btn').style.display = 'none';                          // §6-8 과제는 완주가 제출 조건
          if (cfg.meta.sid != null) {

            $('#sid-badge').textContent = cfg.meta.sid + '번';
          }
        }
        if (app.mode === 'class' && cfg.meta.teamNames) {
          app.teams[0].name = cfg.meta.teamNames[0] || '케이팀';
          app.teams[1].name = cfg.meta.teamNames[1] || '듀팀';
          $('#tA-name').textContent = app.teams[0].name;
          $('#tB-name').textContent = app.teams[1].name;
          $('.ansgrp.A').setAttribute('data-label', app.teams[0].name);
          $('.ansgrp.B').setAttribute('data-label', app.teams[1].name);
        }
        if (cfg.hosted) $('#quit-btn').style.display = 'none';            // §6-6 출구는 하나
        if (app.mode === 'solo') refreshBest();
        if (typeof opts.onConfig === 'function') opts.onConfig(app, cfg);
      },
      onClose: function () {
        if (app.started && !app.over && app.judged > 0) app.finish({});   // §6-8 부분 결과도 결과다
      },
      getProgress: function () { return app.started ? { q: app.i, total: app.n } : null; }
    });

    // ── 시작 / 다시 / 음소거 / 그만하기
    $('#start-btn').addEventListener('click', function () {
      sfxInit();
      app.started = true; app.over = false;
      app.judged = 0; app.skipped = 0; app.score = 0;
      app.byType = {}; app.detail = [];
      app.teams[0].score = 0; app.teams[1].score = 0;
      $('#tA-score').textContent = '0'; $('#tB-score').textContent = '0';
      $('#score-pill').textContent = '0점';
      show('#scr-game');
      if (app.mode === 'class') { $('#teams').style.display = 'flex'; $('#score-pill').style.display = 'none'; }
      if (typeof opts.onStart === 'function') opts.onStart(app);
    });
    $('#again-btn').addEventListener('click', function () { location.reload(); });
    $('#mute-btn').addEventListener('click', function () {
      muted = !muted;
      $('#mute-btn').textContent = muted ? '🔇' : '🔊';
    });
    $('#quit-btn').addEventListener('click', function () {
      if (!app.started || app.over) return;
      if (!confirm('활동을 그만할까요?')) return;
      if (app.judged > 0) { app.finish({}); return; }   // §6-8 여기까지의 결과로 마감
      KBridge.exit('user', { q: app.i, total: app.n });
      app.started = false;
      show('#scr-start');
    });

    // 관측 훅 (D21) — 내부 상태 계약은 볼 수 없으면 지켜지지 않는다. 게이트 전용 읽기 참조.
    try { window.__ACORE_APP__ = app; } catch (e) {}
    return app;
  }

  window.ACore = { create: create, version: '1.0.0' };

<script>
/* core/ko.js — 한국어 조사 부품 (설계 §6-10 「읽을 수 있는 한국어」)
 *
 * 화면에 "은(는)"을 내보내지 않기 위한 단 하나의 판정처.
 * 순수 함수·DOM 무관. node(require)와 브라우저(self.KEDU_KO) 양쪽에서 산다.
 *
 * 규칙 (§6-10):
 *   1항 조사 병기 금지 — 받침을 보고 하나를 고른다.
 *   2항 수는 소리로 읽는다 — 한자어 읽기의 마지막 음절 받침을 따른다.
 *        끝자리 2·4·5·9 → 받침 없음(이·사·오·구). 나머지와 0으로 끝나는 수 → 받침 있음
 *        (일·삼·육·칠·팔 / 십·백·천·만 — 단위어는 전부 받침이 있다).
 *   3항 서술격 조사도 조사다 — 받침 있으면 '이에요', 없으면 '예요'.
 *
 * 쓰는 법:
 *   KO.j(40, '이/가')      → '40이'
 *   KO.j('오렌지', '은/는') → '오렌지는'
 *   KO.ida(9)              → '9예요'
 *   KO.ro('9')             → '9로'      (ㄹ 받침·무받침은 '로', 그 밖은 '으로')
 *
 * 판정할 수 없는 말(빈 문자열·기호로 끝나는 말)을 받으면 **던진다.**
 * 조용히 하나를 고르면 §6-9-4가 금지한 "조용한 되돌림"과 같은 병이 된다.
 */
(function (root, factory) {
  var m = factory();
  if (typeof module === 'object' && module.exports) module.exports = m;
  root.KEDU_KO = m;
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* 단위 기호는 읽는 소리로 판정한다 (§6-10 3항) */
  var UNIT = {
    m: false, cm: false, mm: false, km: false,      // 미터·센티미터·밀리미터·킬로미터
    L: false, l: false, ml: false, mL: false,        // 리터·밀리리터
    g: true, kg: true                                // 그램·킬로그램
  };

  /* 마지막 음절에 받침이 있는가. 판정 불가면 null */
  function batchim(word) {
    var s = String(word == null ? '' : word).trim();
    if (!s) return null;

    var u = s.match(/([A-Za-z]+)$/);
    if (u) return Object.prototype.hasOwnProperty.call(UNIT, u[1]) ? UNIT[u[1]] : null;

    var last = s.charAt(s.length - 1);
    if (last >= '0' && last <= '9') return '2459'.indexOf(last) < 0;   // §6-10 2항

    var c = s.charCodeAt(s.length - 1);
    if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
    return null;
  }

  /* 받침이 ㄹ 인가 ('으로/로' 판정용) */
  function isRieul(word) {
    var s = String(word == null ? '' : word).trim();
    if (!s) return false;
    var last = s.charAt(s.length - 1);
    if (last >= '0' && last <= '9') return '178'.indexOf(last) >= 0;   // 일·칠·팔
    var c = s.charCodeAt(s.length - 1);
    if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 === 8;
    return false;
  }

  var PAIRS = {
    '은/는': ['은', '는'], '이/가': ['이', '가'], '을/를': ['을', '를'],
    '와/과': ['과', '와'], '아/야': ['아', '야'], '이라/라': ['이라', '라'],
    '이랑/랑': ['이랑', '랑'], '이나/나': ['이나', '나'], '이야/야': ['이야', '야'],
    '이니까/니까': ['이니까', '니까'], '이니/니': ['이니', '니']
  };

    var b = batchim(word);
    if (b === null)

    return b;
  }

  /* KO.j(말, '은/는') → 말 + 고른 조사 */
  function j(word, pair) {
    var set = PAIRS[pair];
    if (!set) throw new Error('[ko] 모르는 조사 짝: ' + pair);
    return String(word) + (need(word, pair) ? set[0] : set[1]);
  }

  /* KO.only(말, '은/는') → 조사만 */
  function only(word, pair) {
    var set = PAIRS[pair];
    if (!set) throw new Error('[ko] 모르는 조사 짝: ' + pair);
    return need(word, pair) ? set[0] : set[1];
  }

  /* 서술격 조사 (§6-10 3항) */
  function ida(word) { return String(word) + (need(word, '이에요') ? '이에요' : '예요'); }

  /* '으로/로' — ㄹ 받침과 무받침은 '로' */
  function ro(word) {
    var b = need(word, '으로/로');
    return String(word) + (!b || isRieul(word) ? '로' : '으로');
  }

  return {
    batchim: batchim, isRieul: isRieul,
    j: j, only: only, ida: ida, iya: iya, ro: ro
  };
}));
</script>
<script>
/* genre/observe_pick.js — 관찰 고르기 장르 엔진 v1.0.0 (설계 v4 §4 · D62, 과학)
 * 그림 두 장(가·나)을 보고 조건에 맞는 쪽을 고른다. 답은 셋 — 가 · 나 · 🤔 그림으로는 알 수 없어요.
 * byType 축 = 관찰 vs 추측: 그림에 보이는 것은 보고 고르고, 안 보이는 것(가려진 줄기 · 땅속 뿌리)이나
 * 사람마다 다른 것(예쁜가)은 짐작하지 않고 「알 수 없어요」를 고른다.
 *
 * 규칙(헌법):
 *  §9-4 score = 첫 시도 정답 수 (문항당 1점)
 *  byType = 문항당 한 번 — 첫 시도에 맞혀야 ok
 *  §6-8 [넘기기] = 판정 전에만
 *  class = 선점제(stream 과 같음): 오답 팀 잠금, 두 팀 다 틀리면 정답 공개·무득점
 *  solo·assign = 다시 고를 수 있다(첫 시도 실패는 miss 로 남는다). 그림 카드를 눌러도 고른다(답 버튼과 같은 길)
 *  답 미노출 — 판정 전 카드·버튼 어디에도 정답 표시가 없다(그림 속성은 생성기가 SVG 에 남기지 않는다)
 *
 * gen.next() → { ask, cards:[{svg},{svg}], answer:'a'|'b'|'q', type, explain }
 */
(function () {
  'use strict';

  var PICKS = [
    { pick: 'a', label: '가' },
    { pick: 'b', label: '나' },
    { pick: 'q', label: '🤔 알 수 없어요' }
  ];

  function run(app, gen, spec) {
    spec = spec || {};
    var waits = spec.waits || {};
    var W_OK = waits.correct != null ? waits.correct : (app.mode === 'class' ? 2600 : 2200);
    var W_ALL = waits.wrongAll != null ? waits.wrongAll : 3200;
    var N = app.settings.n || 8;
    var i = 0, S = null;

    app.onSkip(function () { if (S && !S.lock) next(); });

    // 그림 카드 누르기 — 혼자·과제만 (교실은 팀 버튼으로 선점)
    ['a', 'b'].forEach(function (side) {
      var card = app.el('#op-' + side);
      card.addEventListener('click', function () {
        if (app.mode === 'class') return;
        onPick(side, null, card);
      });
    });

    function step(text) { app.el('#op-step').textContent = text; }

    function render() {
      var q = S.q;
      app.el('#op-ask').textContent = q.ask;
      ['a', 'b'].forEach(function (side, k) {
        var c = app.el('#op-' + side);
        c.className = 'op-card';
        app.el('#op-' + side + ' .op-pic').innerHTML = q.cards[k].svg;
      });
      step(app.mode === 'class' ? '자세히 보고, 먼저 맞히는 팀!' : (app.mode === 'assign' ? '자세히 보고 골라요' : '자세히 보고 골라요 — 그림을 눌러도 돼요'));
    }

    function next() {
      if (i >= N) return app.finish({});
      var q = gen.next();
      S = { q: q, lock: false, first: true, teamLocked: [false, false], t0: Date.now() };
      i++;

      app.clearExplain();
      app.hideWhy();
      render();
      app.answers(PICKS, onPick);
      app.unlockAnswers();
    }

    function reveal(ok) {
      var q = S.q;
      if (q.answer === 'q') { app.el('#op-a').classList.add('unk'); app.el('#op-b').classList.add('unk'); }
      else {
        app.el('#op-' + q.answer).classList.add(ok ? 'ok' : 'show');
        app.el('#op-' + (q.answer === 'a' ? 'b' : 'a')).classList.add('dim');
      }
      step(q.answer === 'q' ? '🤔 그림으로는 알 수 없어요' : ('정답은 「' + (q.answer === 'a' ? '가' : '나') + '」'));
    }

    function onPick(pick, teamIdx, btn) {
      if (!S || S.lock) return;
      var q = S.q, ok = (pick === q.answer);
      if (app.mode === 'assign') app.detail.push({ q: q.ask, a: q.answer, pick: pick, ok: ok, type: q.type, ms: Date.now() - S.t0 });
      if (ok) {
        S.lock = true;
        app.markJudged();
        app.tally(q.type, S.first);
        if (app.mode === 'class' && teamIdx != null) app.teamScore(teamIdx, 1);
        else if (S.first) app.addScore(1);
        app.sfx.good();
        app.hideAnswers();
        reveal(true);
        app.explain(q.explain, true);
        setTimeout(next, W_OK);
        return;
      }
      S.first = false;
      app.sfx.bad();
      if (app.mode === 'class' && teamIdx != null) {
        S.teamLocked[teamIdx] = true;
        app.lockTeam(teamIdx);
        if (S.teamLocked[0] && S.teamLocked[1]) {            // 두 팀 다 틀림 → 공개·무득점
          S.lock = true;
          app.markJudged();
          app.tally(q.type, false);
          app.hideAnswers();
          reveal(false);
          app.explain(q.explain, false);
          setTimeout(next, W_ALL);
        }
      } else {
        app.shake(btn);
        if (btn && btn.classList && btn.classList.contains('op-card')) {
          btn.classList.add('no');
          setTimeout(function () { btn.classList.remove('no'); }, 500);
        }
      }
    }

    next();
  }

  window.ObservePick = { run: run, version: '1.0.0', PICKS: PICKS };
})();
</script>
<script>
/* gens/science/observe_animal.js — 「동물의 생활」 관찰 고르기 (3학년 1학기 과학 2단원 · l01~l06)
 * 순수 함수·DOM 무관 (§9-3). 장르 observe_pick(관찰 고르기)이 쓴다. 그림은 SVG 글자열로 돌려준다.

 *   사람마다 달라지는 것을 묻는 문항(귀여운가 · 예쁜가 — 정본 l02 오개념)에만 정답이다.
 * 이름표 0 — 카드에도 물음에도 동물 이름을 적지 않는다. 그림 속 동물은 실제 종이 아니라 특징만 가진 지어낸 동물이다
 *   (이름을 알면 보지 않고 아는 것으로 답한다 — 관찰을 재는 장르). 다리는 셀 수 있게 따로따로 그린다.
 * 그림은 매번 rng 로 새로 그린다(색 · 방향 · 크기 · 자세) — 외워서는 못 푼다. 그림 속성은 SVG 에 남기지 않는다(답 미노출).

 * 낱말은 정본 data/g3_science_u2.js 에서만: 목·등딱지·귀(l01) · 날개·다리·귀여운·예쁜(l02) · 기어다녀·구부렸다·걷거나·굴(l03)
 *   · 곤충·새·다리 2개·6개·깃털·얇은(l04) · 지느러미·아가미·물고기·다리로(l05) · 털·지방·추위·혹(l06).
 *   범위 밖 낱말은 그 차시 문항에 나오지 않는다(스모크가 잰다). 「빨리·빠르」(l08)는 쓰지 않는다.
 *
 * params: { upto: 'l01'|…|'l06'|'all' } — 단원 처음부터 그 차시까지 누적, 이번 차시 문항 먼저.
 * next() → { id, l, type, ask, cards:[{svg},{svg}], answer:'a'|'b'|'q', explain, prompt }
 */
(function (root, factory) {
  var g = factory();

    } },
    { l: 'l01', type: 'look_part', make: function (rng) {
      return { ask: '등딱지가 있는 동물은 어느 쪽일까요?', scene: 'ground', yes: beast(rng, { shell: true }), no: beast(rng, {}),
        ex: function (Y, N) { return '「' + Y + '」 동물은 등에 단단한 등딱지가 있어요. 「' + N + '」 동물은 등딱지가 없어요.'; } };
    } },
    { l: 'l01', type: 'look_part', make: function (rng) {
      var conf = rng() < 0.5;                             // 헷갈림 짝: 목이 길고 귀는 짧은 동물
      return { ask: '귀가 긴 동물은 어느 쪽일까요?', scene: 'ground', yes: beast(rng, { ears: 'long' }), no: beast(rng, { ears: 'short', neck: conf ? 'long' : 'short' }),
        ex: function (Y, N) { return '「' + Y + '」 동물은 귀가 길어요.' + (conf ? ' 「' + N + '」 동물은 목이 길고 귀는 짧아요.' : ' 「' + N + '」 동물은 귀가 짧아요.'); } };
    } },
    // l02 특징에 따라 나누어요 — 날개가 있는가 · 다리가 있는가 (누가 봐도 같은 기준)
    { l: 'l02', type: 'has_part', make: function (rng) {
      return { ask: '날개가 있는 동물은 어느 쪽일까요?', scene: 'ground', yes: rng() < 0.5 ? bird(rng) : insect(rng), no: rng() < 0.7 ? beast(rng, {}) : worm(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 날개가 있어요. 「' + N + '」 동물은 날개가 없어요 — 날개가 있는가는 누가 봐도 같은 기준이에요.'; } };
    } },
    { l: 'l02', type: 'has_part', make: function (rng) {
      return { ask: '날개가 없는 동물은 어느 쪽일까요?', scene: 'ground', yes: beast(rng, {}), no: rng() < 0.5 ? bird(rng) : insect(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 날개가 없어요. 「' + N + '」 동물은 날개가 있어요.'; } };
    } },
    { l: 'l02', type: 'has_part', make: function (rng) {
      return { ask: '다리가 있는 동물은 어느 쪽일까요?', scene: 'ground', yes: walker(rng), no: worm(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 다리가 있어요. 「' + N + '」 동물은 다리가 없어요.'; } };
    } },
    { l: 'l02', type: 'cannot_see', make: function (rng) {
      var ask = rng() < 0.5 ? '더 귀여운 동물은 어느 쪽일까요?' : '더 예쁜 동물은 어느 쪽일까요?';
      return { ask: ask, q: true, scene: 'ground', cards: [walker(rng), walker(rng)],
        ex: function () { return '귀여운지, 예쁜지는 사람마다 달라요. 그림을 아무리 자세히 봐도 정할 수 없어요 — 그래서 분류 기준이 될 수 없어요.'; } };
    } },
    // l03 땅에 사는 동물 — 다리가 있으면 걷거나 뛰고, 없으면 기어다녀요
    { l: 'l03', type: 'move_legs', make: function (rng) {
      return { ask: '기어다니는 동물은 어느 쪽일까요?', scene: 'ground', yes: worm(rng), no: rng() < 0.6 ? beast(rng, {}) : insect(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 다리가 없어 몸을 구부렸다 폈다 하며 기어다녀요. 「' + N + '」 동물은 다리로 걷거나 뛰어요.'; } };
    } },
    { l: 'l03', type: 'move_legs', make: function (rng) {
      return { ask: '다리로 걷거나 뛰는 동물은 어느 쪽일까요?', scene: 'ground', yes: rng() < 0.6 ? beast(rng, {}) : insect(rng), no: worm(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 다리가 있어 걷거나 뛰어요. 「' + N + '」 동물은 다리가 없어 기어다녀요 — 다리가 없어도 잘 움직여요.'; } };
    } },
    { l: 'l03', type: 'cannot_see', make: function (rng) {
      return { ask: '다리가 있는 동물은 어느 쪽일까요?', q: true, scene: 'ground',
        cards: [{ k: 'burrow', x: Math.round(between(rng, 86, 114)), hue: pick(rng, FUR.concat(WORM)) }, { k: 'burrow', x: Math.round(between(rng, 86, 114)), hue: pick(rng, FUR.concat(WORM)) }],
        ex: function () { return '두 동물 모두 땅속 굴에 몸이 들어가 머리만 보여요. 다리가 있는지는 그림으로는 알 수 없어요 — 보이지 않는 것은 짐작하지 말아요.'; } };
    } },
    // l04 날 수 있는 동물 — 새냐 곤충이냐(다리를 세어 봐요)
    { l: 'l04', type: 'bird_insect', make: function (rng) {
      return { ask: '곤충은 어느 쪽일까요?', scene: 'sky', yes: insect(rng, true), no: bird(rng, true),
        ex: function (Y, N) { return '둘 다 날개가 있어요. 다리를 세어 보면 「' + Y + '」는 6개 — 곤충이에요. 「' + N + '」는 2개 — 새예요.'; } };
    } },
    { l: 'l04', type: 'bird_insect', make: function (rng) {
      return { ask: '새는 어느 쪽일까요?', scene: 'sky', yes: bird(rng, true), no: insect(rng, true),
        ex: function (Y, N) { return '날면 다 새는 아니에요. 「' + Y + '」는 깃털 날개와 다리 2개 — 새예요. 「' + N + '」는 얇은 날개와 다리 6개 — 곤충이에요.'; } };
    } },
    { l: 'l04', type: 'leg_count', make: function (rng) {
      return { ask: '다리가 6개인 동물은 어느 쪽일까요?', scene: 'ground', yes: insect(rng, false), no: rng() < 0.6 ? beast(rng, {}) : bird(rng, false),
        ex: function (Y, N) { return '하나씩 세어 봐요. 「' + Y + '」 동물은 다리가 6개예요 — 곤충이에요.'; } };
    } },
    { l: 'l04', type: 'leg_count', make: function (rng) {
      return { ask: '다리가 2개인 동물은 어느 쪽일까요?', scene: 'ground', yes: bird(rng, false), no: rng() < 0.5 ? beast(rng, {}) : insect(rng, false),
        ex: function (Y, N) { return '하나씩 세어 봐요. 「' + Y + '」 동물은 다리가 2개예요 — 새예요.'; } };
    } },
    { l: 'l04', type: 'cannot_see', make: function (rng) {
      return { ask: '곤충은 어느 쪽일까요?', q: true, scene: 'sky',
        cards: [{ k: 'cloud', side: rng() < 0.5, y: Math.round(between(rng, 96, 122)) }, { k: 'cloud', side: rng() < 0.5, y: Math.round(between(rng, 96, 122)) }],
        ex: function () { return '두 동물 모두 구름 뒤에 숨어 몸이 보이지 않아요. 다리를 셀 수 없으니 곤충인지 새인지 그림으로는 알 수 없어요.'; } };
    } },
    // l05 물에 사는 동물 — 물에 살아도 다 물고기는 아니에요(지느러미가 있는가)
    { l: 'l05', type: 'fin_fish', make: function (rng) {
      return { ask: '물고기는 어느 쪽일까요?', scene: 'water', yes: fish(rng), no: legged(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 지느러미로 헤엄치고 아가미로 숨 쉬어요 — 물고기예요. 「' + N + '」 동물은 물에 살지만 지느러미가 없어요.'; } };
    } },
    { l: 'l05', type: 'fin_fish', make: function (rng) {
      return { ask: '지느러미가 있는 동물은 어느 쪽일까요?', scene: 'water', yes: fish(rng), no: legged(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 몸에 지느러미가 붙어 있어요. 「' + N + '」 동물은 지느러미가 없고 다리로 움직여요.'; } };
    } },
    { l: 'l05', type: 'fin_fish', make: function (rng) {
      return { ask: '다리로 움직이는 물속 동물은 어느 쪽일까요?', scene: 'water', yes: legged(rng), no: fish(rng),
        ex: function (Y, N) { return '「' + Y + '」 동물은 지느러미가 없고 다리로 움직여요 — 물에 살아도 물고기가 아니에요. 「' + N + '」 동물은 지느러미로 헤엄쳐요.'; } };
    } },
    { l: 'l05', type: 'cannot_see', make: function (rng) {
      return { ask: '물고기는 어느 쪽일까요?', q: true, scene: 'water',
        cards: [{ k: 'rock', x: Math.round(between(rng, 84, 116)) }, { k: 'rock', x: Math.round(between(rng, 84, 116)) }],
        ex: function () { return '두 동물 모두 바위 뒤에 숨어 눈만 보여요. 지느러미가 있는지 볼 수 없으니 그림으로는 알 수 없어요.'; } };
    } },
    // l06 특별한 곳에 사는 동물 — 사는 곳에 알맞은 생김새(두꺼운 털 · 혹)
    { l: 'l06', type: 'fit_place', make: function (rng) {
      var conf = rng() < 0.5;                             // 헷갈림 짝: 혹이 있는 동물
      return { ask: '추운 곳에서 추위를 견디기 알맞은 생김새는 어느 쪽일까요?', scene: 'ground', yes: beast(rng, { fur: true }), no: beast(rng, { fur: false, hump: conf }),
        ex: function (Y, N) { return '「' + Y + '」 동물은 털이 두꺼워요 — 두꺼운 털이 옷처럼 추위를 막아 줘요.' + (conf ? ' 「' + N + '」 동물의 혹은 추위가 아니라 먹이가 적은 곳에서 오래 견디게 도와요.' : ''); } };
    } },
    { l: 'l06', type: 'fit_place', make: function (rng) {
      return { ask: '등에 혹이 있는 동물은 어느 쪽일까요?', scene: 'ground', yes: beast(rng, { hump: true, ears: 'short' }), no: beast(rng, { fur: rng() < 0.5 }),
        ex: function (Y, N) { return '「' + Y + '」 동물은 등에 혹이 있어요. 혹은 먹이가 적은 곳에서 오래 견디게 도와요.'; } };
    } },
    { l: 'l06', type: 'cannot_see', make: function (rng) {
      var f = rng() < 0.5;
      return { ask: '지방이 더 두꺼운 동물은 어느 쪽일까요?', q: true, scene: 'ground', cards: [beast(rng, { fur: f }), beast(rng, { fur: !f })],
        ex: function () { return '지방은 몸 안에 있어 그림에 보이지 않아요. 털이 두껍다고 지방까지 두껍다고 짐작하면 안 돼요 — 보이는 것만 말해요.'; } };
    } }
  ];

  function build(t, k, rng) {
    var m = t.make(rng), cards, answer;
    if (m.q) { cards = m.cards; answer = 'q'; }
    else if (rng() < 0.5) { cards = [m.yes, m.no]; answer = 'a'; }
    else { cards = [m.no, m.yes]; answer = 'b'; }
    var Y = answer === 'b' ? '나' : '가', N = answer === 'b' ? '가' : '나';
    return { id: 'oa' + k, l: t.l, type: t.type, ask: m.ask, cards: cards.map(function (c) { return { svg: draw(look(rng, c, m.scene)) }; }),
             answer: answer, explain: m.ex(Y, N), prompt: m.ask };
  }

  return {
    id: 'observe_animal',
    title: '관찰 고르기 — 동물의 생활',
    T: T,
    ORDER: ORDER,
    draw: draw,
    create: function (params, rng) {
      var p = params || {};
      var upto = ORDER.indexOf(p.upto) >= 0 ? p.upto : 'all';
      var lim = upto === 'all' ? ORDER.length - 1 : ORDER.indexOf(upto);
      var idx = [];
      T.forEach(function (t, k) { if (ORDER.indexOf(t.l) <= lim) idx.push(k); });
      var focus = upto === 'all' ? [] : idx.filter(function (k) { return T[k].l === upto; });
      var deck = shuffle(rng, focus).concat(shuffle(rng, idx.filter(function (k) { return focus.indexOf(k) < 0; })));
      var last = -1, n = 0;
      return {
        size: idx.length,
        next: function () {
          if (!deck.length) {
            deck = shuffle(rng, idx);
            if (deck.length > 1 && deck[0] === last) deck.push(deck.shift());   // 같은 틀이 연달아 나오지 않게
          }
          var k = deck.shift(); last = k;
          return build(T[k], k + '_' + (n++), rng);
        },
        check: function (pick, q) { return pick === q.answer; }
      };
    },
    printRender: function (q) {
      var sm = function (s) { return s.replace('<svg ', '<svg width="88" height="88" '); };
      return q.ask + '<br><span style="display:inline-flex;gap:14px;align-items:center">가 ' + sm(q.cards[0].svg) + ' 나 ' + sm(q.cards[1].svg) + '</span><br>( 가 · 나 · 그림으로는 알 수 없어요 )';
    },
    printAnswer: function (q) { return ({ a: '가', b: '나', q: '그림으로는 알 수 없어요' })[q.answer]; },
    printHead: '두 그림을 자세히 보고 알맞은 쪽에 ○ 하세요. 그림만 봐서는 정할 수 없으면 「알 수 없어요」에 ○ 하세요.'
  };
}));
</script>
<script>
/* src/g3s_u2_observe_animal.js — 관찰 고르기: 동물의 생활 (3학년 1학기 과학 2단원 · l01~l06)
 * 장르: observe_pick(관찰 고르기) · 생성기: observe_animal
 * 범위(upto)는 단원 처음부터 그 차시까지 — 케이티처가 차시마다 알맞은 범위를 넣어 준다(map.paramsByLesson).
 */
(function () {
  'use strict';
  ACore.create({
    activityId: 'g3s_u2_observe_animal',
    title: '🔍 관찰 고르기',
    subtitle: '두 그림을 자세히 보고 골라요. 그림만 봐서는 모르겠으면 「알 수 없어요」!',
    defaults: { n: 8, upto: 'all' },
    settings: [
      { key: 'upto', label: '범위', options: [
        { v: 'l01', label: '1차시까지' },
        { v: 'l02', label: '2차시까지' },
        { v: 'l03', label: '3차시까지' },
        { v: 'l04', label: '4차시까지' },
        { v: 'l05', label: '5차시까지' },
        { v: 'l06', label: '6차시까지' },
        { v: 'all', label: '단원 전체' }] },
      { key: 'n', label: '문제 수', options: [{ v: 5, label: '5' }, { v: 8, label: '8' }, { v: 10, label: '10' }] }
    ],
    stageHtml:
      '<div id="op">' +
        '<div id="op-ask"></div>' +
        '<div id="op-pair">' +
          '<div class="op-card" id="op-a"><div class="op-tag">가</div><div class="op-pic"></div></div>' +
          '<div class="op-card" id="op-b"><div class="op-tag">나</div><div class="op-pic"></div></div>' +
        '</div>' +
        '<div id="op-step"></div>' +
      '</div>',
    onStart: function (app) {
      var gen = GENS['observe_animal'].create({ upto: app.settings.upto }, app.rng);
      ObservePick.run(app, gen, {});
    }
  });
})();
</script>

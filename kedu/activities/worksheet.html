<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>활동지 — K✦edu</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<!-- worksheet.html — 활동지 시스템 (설계 §11)
     활동지는 독립 제작물이 아니라 생성기의 인쇄 렌더다. 게임 1개 = 활동지 1종.
     URL: worksheet.html?gen=compare50&n=10&range=50&seed=17&answers=0&title=...
     seed가 같으면 같은 문제 — 정답지와 문제지가 반드시 일치한다. -->
<style>
  :root { --cream:#fffbf5; --ink:#78350f; --deep:#92400e; --amber:#f59e0b; --amber-d:#d97706; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; background:#e7e5e4; font-family:'Jua',sans-serif; color:var(--ink); }

  /* 화면 UI — 인쇄 시 사라진다 */
  .bar { position:sticky; top:0; z-index:9; background:#fff; border-bottom:2px solid #f3e2c4;
         padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .bar .grp { display:flex; gap:6px; align-items:center; }
  .bar .lb { font-size:14px; color:var(--amber-d); }
  .chip { border:2px solid var(--amber); background:#fff; color:var(--deep); border-radius:999px;
          padding:6px 14px; font-size:14px; font-family:'Jua',sans-serif; cursor:pointer; min-height:38px; }
  .chip.on { background:var(--amber); color:#fff; }
  .btn { font-family:'Jua',sans-serif; border:none; border-radius:12px; cursor:pointer; min-height:40px;
         font-size:15px; padding:9px 18px; background:var(--amber); color:#fff; }
  .btn.ghost { background:#fff; color:var(--deep); border:2px solid #f3e2c4; }
  .warn { color:var(--bad); font-size:13px; }

  /* A4 종이 — 미리보기가 곧 인쇄 결과 (종이 낭비 방지) */
  .paper { width:210mm; min-height:297mm; margin:18px auto; background:#fff; padding:16mm 14mm;
           box-shadow:0 6px 24px rgba(0,0,0,.18); }
  .head { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid var(--amber); padding-bottom:8px; }
  .head h1 { margin:0; font-size:26px; color:var(--deep); }
  .head .meta { font-size:13px; color:var(--amber-d); }
  .name-row { display:flex; gap:16px; margin-top:10px; font-size:14px; color:var(--ink); }
  .name-row span { border-bottom:1.5px solid #d6cfc2; padding:2px 40px 2px 6px; }
  .lead { margin:14px 0 10px; font-size:15px; color:var(--deep); background:#fef3c7; border-radius:8px; padding:8px 12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; }
  .q { display:flex; align-items:center; gap:10px; border:1.5px solid #eadfc9; border-radius:12px; padding:12px 14px; min-height:56px; }
  .q .no { font-family:'Nunito',sans-serif; font-weight:800; color:var(--amber-d); font-size:15px; min-width:24px; }
  .q .body { flex:1; display:flex; align-items:center; gap:8px; }
  .w-num { font-family:'Nunito',sans-serif; font-weight:800; font-size:26px; color:var(--deep); }
  .w-box { display:inline-block; min-width:34px; height:34px; line-height:32px; text-align:center;
           border:2px dashed #cbb894; border-radius:8px; margin:0 6px; color:#cbb894; font-size:18px; }
  .ans { color:var(--bad); font-family:'Nunito',sans-serif; font-weight:800; font-size:22px; margin-left:auto; }
  .foot { margin-top:14px; display:flex; justify-content:space-between; font-size:12px; color:var(--amber-d); }
  .badge-ans { display:none; }
  body.answers .badge-ans { display:inline-block; background:var(--bad); color:#fff; border-radius:999px; padding:2px 10px; font-size:12px; }

  @media print {
    body { background:#fff; }
    .bar { display:none !important; }
    .paper { width:auto; min-height:auto; margin:0; padding:12mm 10mm; box-shadow:none; }
    @page { size:A4 portrait; margin:8mm; }
  }
</style>
</head>
<body>

<div class="bar">
  <button class="btn" id="print">🖨 인쇄</button>
  <button class="btn ghost" id="toggle-ans">정답지 보기</button>
  <button class="btn ghost" id="reseed">다른 판 만들기</button>
  <div class="grp"><span class="lb">문제 수</span><span id="chips-n"></span></div>
  <div class="grp" id="grp-range"><span class="lb">수 범위</span><span id="chips-range"></span></div>
  <span class="warn" id="err"></span>
</div>

<div class="paper" id="paper">
  <div class="head">
    <div>
      <h1 id="ws-title">활동지</h1>
      <div class="meta" id="ws-meta"></div>
    </div>
    <span class="badge-ans">정답지</span>
  </div>
  <div class="name-row"><span>이름</span><span>번호</span><span>날짜</span></div>
  <div class="lead" id="ws-lead"></div>
  <div class="grid" id="ws-grid"></div>
  <div class="foot">
    <span>K✦edu · keduclass.com</span>
    <span id="ws-seed"></span>
  </div>
</div>

<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var genId = q.get('gen') || 'compare50';
  var state = {
    n: +(q.get('n') || 10),
    range: +(q.get('range') || 50),
    max: +(q.get('max') || 9),
    qmode: q.get('qmode') || 'mix',
    seed: +(q.get('seed') || Math.floor(Math.random() * 100000)),
    answers: q.get('answers') === '1',
    title: q.get('title') || ''
  };
  var schema = {};      // 카탈로그의 paramsSchema — 어떤 칩을 보일지는 이게 정한다

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function load(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = res; s.onerror = function () { rej(new Error('부품 로드 실패: ' + src)); };
      document.head.appendChild(s);
    });
  }

  // 카탈로그가 단일 원천 — gen 파일 경로도 여기서 찾는다
  fetch('/kedu/activities/_CATALOG.json').then(function (r) { return r.json(); }).then(function (cat) {
    var item = cat.filter(function (a) { return a.gen && a.gen.indexOf('/' + genId + '.js') >= 0; })[0];
    if (!item) throw new Error('카탈로그에 생성기가 없어요: ' + genId);
    if (!state.title) state.title = item.title;
    schema = item.paramsSchema || {};
    document.getElementById('ws-meta').textContent =
      (item.map ? item.map.grade + '학년 ' + item.map.unit + '단원' : '') + (item.pages ? ' · ' + item.pages : '');
    // §6-10 5항 — 조사 부품이 생성기보다 먼저 와야 한다 (없으면 생성기가 소리 내어 죽는다)
    return load('/kedu/activities/core/ko.js').then(function () {
      return load('/kedu/activities/' + item.gen);
    });
  }).then(function () {
    render();
  }).catch(function (e) {
    document.getElementById('err').textContent = e.message;
  });

  function render() {
    var G = (window.GENS || {})[genId];
    if (!G) { document.getElementById('err').textContent = '생성기를 찾을 수 없어요'; return; }
    var gen = G.create({ range: state.range, max: state.max, qmode: state.qmode }, mulberry32(state.seed));

    document.body.classList.toggle('answers', state.answers);
    document.getElementById('ws-title').textContent = state.title;
    document.getElementById('ws-lead').textContent = G.printHead || '문제를 풀어 보세요.';
    document.getElementById('ws-seed').textContent = '문제 번호 ' + state.seed;
    document.getElementById('toggle-ans').textContent = state.answers ? '문제지 보기' : '정답지 보기';

    var html = '';
    for (var i = 1; i <= state.n; i++) {
      var p = gen.next();
      var body = G.printRender ? G.printRender(p) : esc(p.prompt);
      var ans = state.answers ? '<span class="ans">' + esc(G.printAnswer ? G.printAnswer(p) : p.answer) + '</span>' : '';
      html += '<div class="q"><span class="no">' + i + '</span><span class="body">' + body + '</span>' + ans + '</div>';
    }
    document.getElementById('ws-grid').innerHTML = html;
    chips();
  }

  function chips() {
    var mk = function (host, key, opts) {
      document.getElementById(host).innerHTML = opts.map(function (v) {
        return '<button class="chip' + (state[key] === v ? ' on' : '') + '" data-k="' + key + '" data-v="' + v + '">' + v + '</button>';
      }).join('');
    };
    mk('chips-n', 'n', [10, 16, 20]);                    // 활동지 문항 수는 종이 기준 (게임과 별개)
    // 수 범위 칩: 생성기가 range(또는 max)를 받을 때만 — 카탈로그가 알려준다
    var rk = schema.range ? 'range' : (schema.max ? 'max' : null);
    if (rk) {
      mk('chips-range', rk, schema[rk].options);
      document.getElementById('grp-range').style.display = 'flex';
      document.querySelector('#grp-range .lb').textContent = schema[rk].label || '수 범위';
    } else {
      document.getElementById('grp-range').style.display = 'none';
    }
    [].forEach.call(document.querySelectorAll('.chip'), function (c) {
      c.addEventListener('click', function () {
        state[c.dataset.k] = +c.dataset.v;
        render();
      });
    });
  }

  document.getElementById('print').addEventListener('click', function () { window.print(); });
  document.getElementById('toggle-ans').addEventListener('click', function () {
    state.answers = !state.answers; render();
  });
  document.getElementById('reseed').addEventListener('click', function () {
    state.seed += 1; render();
  });

  window.__WS__ = { state: state, render: render };   // 스모크용
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

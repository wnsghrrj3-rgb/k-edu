<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>케이글쓰기 — 케이에듀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#FBF8F2;--card:#fff;--ink:#2B2620;--soft:#5B534A;--muted:#8B8378;--rule:#E6DFD3;--accent:#5B8EF8;--accent-soft:#EBF4FF;--ok:#3d7a52;--ok-soft:#E4F0E5;--wait:#a08a3a;--wait-soft:#F7F0D9;--no:#b8493f;--no-soft:#F9E5E2;--radius:18px;--shadow:0 2px 18px rgba(43,38,32,.07);--fs:17px}
body{font-family:'Gowun Dodum',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:var(--fs)}
body.band-low{--fs:20px}body.band-high{--fs:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.bar .brand{font-family:'Gowun Batang',serif;font-weight:700;color:var(--accent)}
.bar .ttl{color:var(--soft);font-size:15px}
.page{max-width:680px;margin:0 auto;padding:20px 16px 90px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
h1{font-family:'Gowun Batang',serif;font-size:1.45em;line-height:1.4;margin-bottom:10px}
h2{font-family:'Gowun Batang',serif;font-size:1.1em;margin-bottom:10px;color:var(--soft)}
.topic{font-size:1.15em;line-height:1.6;padding:12px 14px;background:var(--accent-soft);border-radius:12px;margin-bottom:12px}
.topic small{display:block;color:var(--muted);font-size:.8em;margin-top:4px}
.passage{font-size:1em;line-height:1.85;padding:14px 16px;background:#FFFDF9;border:1px solid var(--rule);border-radius:12px;margin-bottom:12px;font-family:'Gowun Batang',serif}
.passage small{display:block;color:var(--muted);font-size:.78em;margin-top:8px;font-family:'Gowun Dodum',sans-serif}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pick{border:1.5px solid var(--rule);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:.9em;cursor:pointer;color:var(--soft)}
.pick[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
input[type=text],textarea{width:100%;padding:13px;border:1px solid var(--rule);border-radius:14px;font:inherit;font-size:1em;line-height:1.7;background:#fff}
textarea{min-height:240px;resize:vertical}
.note{font-size:.82em;color:var(--muted);line-height:1.6;margin-top:8px}
.notice{font-size:.85em;color:var(--wait);background:var(--wait-soft);border-radius:12px;padding:10px 14px;margin-top:12px;line-height:1.6}
.big{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:1.1em;font-weight:700;cursor:pointer;margin-top:12px}
.big.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.big:disabled{opacity:.4;cursor:default}
.count{font-size:.82em;color:var(--muted);text-align:right;margin-top:6px}
/* 글 틀 그림 */
.frame{border:2px dashed var(--rule);border-radius:16px;padding:14px;background:#FFFDF9}
.slot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;margin-bottom:8px;border:1.5px solid var(--rule);background:#fff}
.slot .box{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:2px solid var(--rule);background:repeating-linear-gradient(45deg,#f2ede4 0 4px,#fff 4px 8px)}
.slot.green .box{background:var(--c);border-color:var(--c)}
.slot.yellow .box{background:linear-gradient(135deg,var(--c) 50%,#fff 50%);border-color:var(--c)}
.slot .nm{font-weight:700;min-width:64px}
.slot .st{font-size:.85em;color:var(--muted)}
.slot.green .st{color:var(--ok)}
.fb{border-radius:14px;padding:13px 15px;margin-bottom:10px;line-height:1.65;display:flex;gap:10px;align-items:flex-start}
.fb .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;margin-top:6px}
.fb.red{background:var(--no-soft)}.fb.red .dot{background:var(--no)}
.fb.yellow{background:var(--wait-soft)}.fb.yellow .dot{background:var(--wait)}
.fb.tidy{background:#F3F1EC}.fb.tidy .dot{background:var(--muted)}
.done{text-align:center;padding:22px 10px}
.done .stamp{display:inline-block;background:var(--ok-soft);color:var(--ok);font-family:'Gowun Batang',serif;font-size:1.3em;font-weight:700;padding:12px 24px;border-radius:999px;margin-bottom:10px}
.meta{display:flex;gap:14px;font-size:.82em;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.hidden{display:none}
.tasks a{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--rule);border-radius:12px;padding:11px 13px;margin-bottom:8px;background:#fff}
.tasks a b{display:block}.tasks a small{color:var(--muted)}
.tasks a .tag{float:right;font-size:.75em;border-radius:999px;padding:2px 9px;background:var(--wait-soft);color:var(--wait)}.tasks a .tag.ret{background:var(--ok-soft);color:var(--ok)}
.legendwrap{margin-top:8px}
.tcount{display:inline-block;background:var(--no-soft);color:var(--no);border-radius:999px;padding:2px 10px;font-size:.8em;font-weight:700;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<div class="bar"><span class="brand">케이에듀</span><span class="ttl">케이글쓰기</span></div>
<div class="page" id="app"></div>

<script src="/kedu_back.js" data-mount=".bar"></script>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu/write/engine.js"></script>
<script src="/kedu/write/paper.js"></script>
<script>
/* ===================== 케이글쓰기 — 학생 연습 화면 (설계 v2 §11) =====================
   /kedu/write/?type=argue&grade=3&topic=…&kw=급식,김치&prompt=<id>
   연습 모드: 저장 0 · 네트워크 = 데이터 JSON + (학급 세션이면) 우리 반 글쓰기 과제 목록.
   흐름: ① 고르기·쓰기 → ② 선생님 표시(종이 위 빨간 펜 + ✎ 넣어 볼 것 메모 + 도장, 누르면 이유·바꾸기) → 다시 고치기
   준호 결정(2026-09-08): 「내 글에 색칠하기」·별도 글 틀 화면은 뺐다. 과제(선생님이 연 것)는 task.html — 거기선 자동 점검을 보지 않고 보내기만 한다.
   규칙: 점수·등급·판정 낱말 0.
=================================================================================== */
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var app=$('#app'), q=new URLSearchParams(location.search);
  var D=null, state={type:q.get('type')||'argue', grade:parseInt(q.get('grade'),10)||3, topic:q.get('topic')||'', kw:(q.get('kw')||'').split(',').map(function(s){return s.trim();}).filter(Boolean), text:'', step:1, result:null, pop:null, tasks:null};
  var fixed=!!q.get('topic'); state.prompt=null;
  var esc=KWPAPER.esc;
  var st=document.createElement('style'); st.textContent=KWPAPER.css; document.head.appendChild(st);
  function band(){return KWRITE.bandOf(state.grade);}
  function setBand(){document.body.className='band-'+band();}

  Promise.all(['templates','signals','feedback','prompts','corrections'].map(function(n){return fetch('/kedu/write/data/'+n+'.json').then(function(r){return r.json();});}))
  .then(function(a){D={templates:a[0],signals:a[1],feedback:a[2],prompts:a[3],corrections:a[4]};KWRITE.init(D);
    var pid=q.get('prompt'); if(pid){var pr=D.prompts.prompts.filter(function(x){return x.id===pid;})[0]; if(pr)usePrompt(pr);}
    render(); loadTasks();})
  .catch(function(){app.innerHTML='<div class="card note">불러오지 못했어요. 새로고침해 볼까요?</div>';});

  /* 학급 세션이면 우리 반 글쓰기 과제 — 없으면 조용히 */
  function loadTasks(){
    try{ if(!window.getKeduDb)return; var db=getKeduDb();
      db.auth.getSession().then(function(r){ if(!r||!r.data||!r.data.session)return; return db.rpc('list_write_runs_mine'); })
        .then(function(r){ if(r&&!r.error&&Array.isArray(r.data)&&r.data.length){state.tasks=r.data; if(state.step===1)render();} }).catch(function(){});
    }catch(e){}
  }
  function usePrompt(pr){state.prompt=pr;state.type=pr.type;state.topic=pr.topic;state.kw=pr.keywords.slice();fixed=true;
    if(pr.bands.indexOf(KWRITE.bandOf(state.grade))<0){state.grade={low:2,mid:3,high:5}[pr.bands[0]];}}
  function render(){setBand();app.innerHTML='';[step1,step2][state.step-1]();window.scrollTo(0,0);}
  function analyze(){return KWRITE.analyze({text:state.text,type:state.type,band:state.grade,topic:state.topic,keywords:state.kw});}

  /* ① 고르기·쓰기 */
  function step1(){
    var tp=D.templates.types;
    if(state.tasks&&state.tasks.length){var t=document.createElement('div');t.className='card';
      t.innerHTML='<h2>우리 반 글쓰기 과제</h2><div class="tasks">'+state.tasks.map(function(x){var tag=x.closed?'<span class="tag">마감</span>':x.ask_rewrite?'<span class="tag">다시 쓰기</span>':x.returned>0&&x.returned===x.attempts?'<span class="tag ret">돌아온 글</span>':x.attempts>0?'<span class="tag">선생님이 보는 중</span>':'<span class="tag">써 보내요</span>';
        return '<a href="/kedu/write/task.html?run='+x.run+'">'+tag+'<b>'+esc(x.title)+'</b><small>'+esc(x.topic)+'</small></a>';}).join('')+'</div><div class="note">아래는 혼자 연습하는 자리예요. 저장되지 않아요.</div>';
      app.appendChild(t);}
    var c=document.createElement('div'); c.className='card';
    var h='<h1>'+(fixed?'오늘의 글쓰기':'무슨 글을 쓸까요?')+'</h1>';
    if(fixed){h+='<div class="topic">'+esc(state.topic)+'<small>'+esc(tp[state.type].name)+' · '+state.grade+'학년 틀</small></div>';
      if(state.prompt){h+='<div class="passage">'+esc(state.prompt.passage)+'<small>'+esc(state.prompt.source.name)+'</small></div>';
        if(state.prompt.guide)h+='<div class="note">✏️ '+esc(state.prompt.guide)+'</div>';
        if(!q.get('prompt'))h+='<button class="pick" id="unpick">다른 글감 고르기</button>';}}
    else{
      h+='<div class="row" id="types">'+Object.keys(tp).map(function(k){return '<button class="pick" data-k="'+k+'" aria-pressed="'+(k===state.type)+'">'+tp[k].name+'</button>';}).join('')+'</div>';
      h+='<div class="row" id="grades">'+[1,2,3,4,5,6].map(function(g){return '<button class="pick" data-g="'+g+'" aria-pressed="'+(g===state.grade)+'">'+g+'학년</button>';}).join('')+'</div>';
      h+='<input type="text" id="topic" placeholder="무엇에 대해 쓰나요? (예: 급식에 김치가 매일 나와야 할까?)" value="'+esc(state.topic)+'">';
      h+='<div class="note">'+esc(tp[state.type].hint)+'</div>';
      var list=D.prompts.prompts.filter(function(x){return x.status==='live'&&x.type===state.type&&x.bands.indexOf(band())>=0;});
      if(list.length)h+='<h2 style="margin-top:14px">글감 고르기</h2><div class="row" id="prompts">'+list.map(function(x){return '<button class="pick" data-p="'+x.id+'">'+esc(x.title)+'</button>';}).join('')+'</div><div class="note">글감을 고르면 논제와 읽을 글이 나와요. 안 골라도 돼요.</div>';
    }
    c.innerHTML=h; app.appendChild(c);
    var w=document.createElement('div'); w.className='card';
    var spec=tp[state.type].bands[band()];
    w.innerHTML='<h2>글 쓰기</h2><textarea id="text" placeholder="여기에 글을 써요. 생각이 바뀌는 곳에서 줄을 바꿔요.">'+esc(state.text)+'</textarea><div class="count" id="count"></div><div class="meta"><span>이 틀에 필요한 것: '+Object.keys(spec.need).map(function(k){return D.templates.colors[k].name;}).join(' · ')+'</span><span>글자 '+spec.length[0]+'~'+spec.length[1]+' 정도</span></div><button class="big" id="go">'+esc(D.feedback.teacher.title)+' 보기</button><div class="notice">'+esc(D.feedback.state.notice)+'</div>';
    app.appendChild(w);
    var ta=$('#text'); function cnt(){$('#count').textContent=ta.value.replace(/\s+/g,'').length+'자';$('#go').disabled=!ta.value.trim();} cnt();
    ta.addEventListener('input',function(){state.text=ta.value;cnt();});
    if(!fixed){
      $('#types').addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;state.type=b.dataset.k;state.topic=$('#topic').value;state.text=ta.value;render();});
      $('#grades').addEventListener('click',function(e){var b=e.target.closest('[data-g]');if(!b)return;state.grade=+b.dataset.g;state.topic=$('#topic').value;state.text=ta.value;render();});
      $('#topic').addEventListener('input',function(e){state.topic=e.target.value;});
      var pl=$('#prompts'); if(pl)pl.addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(!b)return;state.text=ta.value;usePrompt(D.prompts.prompts.filter(function(x){return x.id===b.dataset.p;})[0]);render();});
    }
    var un=$('#unpick'); if(un)un.addEventListener('click',function(){state.prompt=null;state.topic='';state.kw=[];fixed=false;state.text=ta.value;render();});
    $('#go').addEventListener('click',function(){state.text=ta.value; if(!fixed)state.topic=$('#topic').value; state.result=analyze(); state.pop=null; state.step=2; render();});
  }

  /* ② 선생님 표시 — 종이 위 빨간 펜 + ✎ 메모 + 도장 */
  function step2(){
    var r=state.result, TF=D.feedback.teacher, KD=D.corrections.kinds, marks=r.teacher.marks, colors=D.templates.colors;
    var memos=KWPAPER.placeMemos(r,D.templates,D.feedback), total=marks.length+memos.n;
    var c=document.createElement('div'); c.className='card';
    var h='<h1>'+esc(TF.title)+(total?'<span class="tcount">'+KWRITE.fill(TF.count,{n:total})+'</span>':'')+'</h1><div class="note" style="margin:0 0 10px">'+esc(total?TF.intro:TF.none)+'</div>';
    h+='<div class="frame" style="margin-bottom:12px">'+Object.keys(r.elements).map(function(k){var e=r.elements[k];var stt=e.status==='green'?'있어요':e.status==='yellow'?'조금 더':'아직 없어요';return '<div class="slot '+e.status+'" style="--c:'+colors[k].hex+'"><span class="box"></span><span class="nm">'+colors[k].name+'</span><span class="st">'+stt+(e.need>1?' ('+Math.min(e.have,e.need)+'/'+e.need+')':'')+'</span></div>';}).join('')
      +(r.topic?'<div class="slot '+r.topic.status+'" style="--c:#8B8378"><span class="box"></span><span class="nm">논제</span><span class="st">'+esc(r.topic.keywords.join(', '))+'</span></div>':'')+'</div>';
    h+=KWPAPER.render({result:r,templates:D.templates,corrections:D.corrections,feedback:D.feedback,memos:memos,pop:state.pop,popHtml:popHtml});
    h+='<div class="legendwrap">'+KWPAPER.legend(r.teacher,D.corrections)+'</div>';
    if(marks.some(function(m){return m.soft;}))h+='<div class="note">'+esc(TF.softNote)+'</div>';
    h+='<div class="note">'+esc(TF.stampNote)+'</div><div class="meta"><span>글자 '+r.length.chars+'</span><span>문단 '+r.paras.count+'</span></div>';
    h+='<button class="big" id="fix">다시 고치기</button><div class="notice">'+esc(D.feedback.state.notice)+'</div>';
    c.innerHTML=h; app.appendChild(c);
    function popHtml(p){var m=marks[p.idx], canApply=!(m.fix==='(다른 말)'||/^~/.test(m.fix));
      return '<div class="pop" style="--tc:'+KD[m.kind].hex+'"><b>'+esc(KD[m.kind].name)+' · '+esc(KD[m.kind].label)+'</b><div>'+esc(m.why)+'</div>'+(canApply?'<div class="row"><button class="pick apply" id="apply">'+esc(TF.apply)+(m.append?' (마침표)':': '+esc(m.fix==='(빼기)'?'빼기':m.fix))+'</button><button class="pick" id="keep">'+esc(TF.keep)+'</button></div>':'')+'</div>';}
    $('.kwp').addEventListener('click',function(e){
      var ap=e.target.closest('#apply'), kp=e.target.closest('#keep');
      if(ap){var m=marks[state.pop.idx], s=r.sentences[m.i]; state.text=KWPAPER_apply(state.text,s.text,m); state.result=analyze(); state.pop=null; render(); return;}
      if(kp){state.pop=null;render();return;}
      var t=e.target.closest('.tm[data-a]'); if(!t)return; var idx=+t.dataset.a; state.pop=(state.pop&&state.pop.idx===idx)?null:{type:'auto',idx:idx,i:marks[idx].i}; render(); var el=document.querySelector('.tm.on'); if(el)el.scrollIntoView({block:'center'});
    });
    $('#fix').addEventListener('click',function(){state.step=1;render();});
  }
  function KWPAPER_apply(text,sentenceText,m){return KWRITE.applyMark(text,sentenceText,m);}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이글쓰기 — 선생님</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF9F5;--card:#fff;--ink:#2E3338;--soft:#5A6169;--muted:#8B9199;--rule:#D3CABA;--tint:#F3F0EA;--blue:#1f5fbf;--red:#c0392b;--ok:#3d7a52}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Gowun Dodum',sans-serif;color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:36px 18px 80px}
h1{font-family:'Gowun Batang',serif;font-size:26px;font-weight:700;margin:0 0 4px}
h2{font-family:'Gowun Batang',serif;font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:15px;margin:0 0 22px}
.backlink{display:inline-block;color:var(--soft);text-decoration:none;font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.gate,.soon{padding:26px 22px;border:1px dashed var(--rule);border-radius:12px;color:var(--muted);line-height:1.8;font-size:14.5px;text-align:center}
.form{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;align-items:start;font-size:14px}
.form label{color:var(--soft);padding-top:8px}
.form input[type=text],.form textarea,.form select,.form input[type=date]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:10px;background:#fff}
.form textarea{min-height:90px;line-height:1.6}
.form .hint{grid-column:2;color:var(--muted);font-size:12.5px;margin-top:-4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--soft)}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.setrow{border-top:1px solid var(--rule);padding:14px 0}
.setrow:first-child{border-top:0}
.meta{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.6}
.badge{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);margin-left:6px}
.badge.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge.ok{background:#E4F0E5;color:var(--ok);border-color:#E4F0E5}
.badge.wait{background:#F7F0D9;color:#a08a3a;border-color:#F7F0D9}
/* 첨삭 */
.review{display:grid;grid-template-columns:220px 1fr;gap:16px}
@media(max-width:820px){.review{grid-template-columns:1fr}}
.students{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:#fff;font-size:13.5px;align-self:start}
.students button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--tint);background:#fff;padding:9px 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.students button.on{background:var(--tint);font-weight:700}
.students button.none{color:var(--muted)}
.students .st{font-size:11px;border-radius:999px;padding:1px 7px;background:var(--tint);color:var(--muted);flex:0 0 auto}
.students .st.sub{background:#E7F0FF;color:var(--blue)}.students .st.ret{background:#E4F0E5;color:var(--ok)}
.paperbox{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:18px}
.paperbox .kwp{font-size:16.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin:0 0 10px;align-items:center}
.tools .k{display:inline-flex;align-items:center;gap:4px}
.tools .k i{width:14px;border-bottom:3px solid var(--red);display:inline-block}.tools .k i.b{border-color:var(--blue)}
.side{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.side{grid-template-columns:1fr}}
.side textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;min-height:96px;line-height:1.6}
.rub{width:100%;border-collapse:collapse;font-size:12.5px}
.rub th,.rub td{border:1px solid var(--rule);padding:6px;text-align:left;vertical-align:top}
.rub th{background:#f7f4ee;color:var(--soft);font-weight:600}
.rub td.nm{font-weight:700;white-space:nowrap}
.rub td label{display:flex;gap:6px;cursor:pointer;line-height:1.5}
.rub td label input{margin-top:3px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin:0 0 10px}
.stats b{color:var(--ink)}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.slots span{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--rule);color:var(--muted)}
.slots span.green{background:#E4F0E5;color:var(--ok);border-color:#E4F0E5}.slots span.yellow{background:#F7F0D9;color:#a08a3a;border-color:#F7F0D9}.slots span.red{background:#F9E5E2;color:#b8493f;border-color:#F9E5E2}
.attempts{display:flex;gap:6px;margin:0 0 10px}
.attempts button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--soft)}
.attempts button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
<script src="/kedu_teacher_gate.js"></script>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="/?role=teacher">← 선생님 도구</a>
  <h1>케이글쓰기</h1>
  <p class="sub">논제를 정해 우리 반에 열고, 아이들이 보낸 글에 자동 첨삭 위로 파란 펜을 얹어 돌려줍니다.</p>
  <div class="tabs" id="tabs"><button data-tab="open" class="on">과제 열기</button><button data-tab="mine">연 과제 · 첨삭</button></div>
  <div id="view"><div class="gate">불러오는 중…</div></div>
</div>
<div id="toast"></div>

<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu/write/engine.js"></script>
<script src="/kedu/write/paper.js"></script>
<script>
/* ===================== 케이글쓰기 — 선생님 화면 (설계 v2 §11, G4·G5) =====================
   ① 과제 열기: 유형·학년 틀·논제·핵심 낱말·글감(지문)·안내·다시 쓰기 횟수·마감 → write_runs 1건 + class_openings(write:<run>) 카드
   ② 연 과제: 제출 현황 → 첨삭 화면 — 종이 위 자동 표시(빨강)에 파란 펜(낱말 표시·문장 메모)을 얹고, 오탐은 지우고(write_fp_log),
      한마디·루브릭·「고쳐서 다시」 → 저장 / 돌려주기(returned_at). 학생은 돌려준 것만 본다(get_write_run).
   준호 결정(09-08): 학생 자동 점검 없음 · 지운 오탐은 장부에 쌓아 사전 재료로 · 다시 쓰기 기본 1회(0~3).
====================================================================================== */
const db = getKeduDb(), view = document.getElementById('view'), esc = KWPAPER.esc;
let ME = null, CLASSES = [], D = null, TAB = 'open', RUNS = [], REV = null;
const BANDS = { low: '1~2학년', mid: '3~4학년', high: '5~6학년' };
const st = document.createElement('style'); st.textContent = KWPAPER.css; document.head.appendChild(st);
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }
function f(id){ const el = document.getElementById(id); return el ? el.value : ''; }
document.getElementById('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; TAB = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); REV = null; render(); };

(async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if (!session){ view.innerHTML = `<div class="gate">선생님 로그인이 필요해요.<br><br><a class="btn" href="/auth/?redirect=${encodeURIComponent(location.href)}">로그인</a></div>`; return; }
  const { data: t } = await db.from('teachers').select('id, name').eq('user_id', session.user.id).maybeSingle();
  if (!t){ view.innerHTML = `<div class="gate">교사 계정이 아니에요.</div>`; return; }
  ME = t;
  const [{ data: cc }, ...ds] = await Promise.all([
    db.from('class_codes').select('id, code, is_active').eq('teacher_id', t.id).eq('is_active', true),
    ...['templates', 'signals', 'feedback', 'prompts', 'corrections', 'rubric'].map(n => fetch('/kedu/write/data/' + n + '.json').then(r => r.json()))
  ]);
  CLASSES = cc || []; D = { templates: ds[0], signals: ds[1], feedback: ds[2], prompts: ds[3], corrections: ds[4], rubric: ds[5] }; KWRITE.init(D);
  if (new URLSearchParams(location.search).get('tab') === 'mine'){ TAB = 'mine'; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'mine')); }
  render();
})();
function render(){ if (TAB === 'open') renderOpen(); else renderMine(); }

/* ---------- ① 과제 열기 ---------- */
let OPEN = { type: 'argue', band: 'mid', prompt: null };
function renderOpen(){
  const tp = D.templates.types, list = D.prompts.prompts.filter(p => p.status === 'live' && p.type === OPEN.type && p.bands.includes(OPEN.band));
  view.innerHTML = `<div class="panel">
    <h2>새 글쓰기 과제</h2>
    <div class="form">
      <label>학급</label><div><select id="oClass">${CLASSES.length ? CLASSES.map(c => `<option value="${c.id}">${esc(c.code)}</option>`).join('') : '<option value="">학급 없음 — 대시보드에서 학급코드를 먼저 만들어 주세요</option>'}</select></div>
      <label>글 유형</label><div class="chips" id="oType">${Object.keys(tp).map(k => `<button data-k="${k}" class="${k === OPEN.type ? 'on' : ''}">${esc(tp[k].name)}</button>`).join('')}</div>
      <div class="hint">${esc(tp[OPEN.type].hint)}</div>
      <label>학년 틀</label><div class="chips" id="oBand">${Object.keys(BANDS).map(k => `<button data-k="${k}" class="${k === OPEN.band ? 'on' : ''}">${BANDS[k]}</button>`).join('')}</div>
      <div class="hint">필요한 것: ${Object.keys(tp[OPEN.type].bands[OPEN.band].need).map(k => D.templates.colors[k].name).join(' · ')} · 글자 ${tp[OPEN.type].bands[OPEN.band].length.join('~')}</div>
      <label>글감 고르기</label><div class="chips" id="oPrompt"><button data-p="" class="${OPEN.prompt ? '' : 'on'}">직접 쓰기</button>${list.map(p => `<button data-p="${p.id}" class="${OPEN.prompt === p.id ? 'on' : ''}">${esc(p.title)}</button>`).join('')}</div>
      <div class="hint">글감을 고르면 논제·핵심 낱말·읽을 글이 채워져요. 그대로 써도, 고쳐도 돼요.</div>
      <label>논제</label><div><input type="text" id="oTopic" placeholder="예: 급식에 김치가 매일 나와야 할까요?" value="${esc(OPEN.topic || '')}"></div>
      <label>핵심 낱말</label><div><input type="text" id="oKw" placeholder="쉼표로 1~3개 (비우면 논제에서 자동)" value="${esc(OPEN.kw || '')}"></div>
      <div class="hint">글에 이 낱말이 있는지로 논제 이탈을 짚어요.</div>
      <label>읽을 글(선택)</label><div><textarea id="oPassage" placeholder="아이들이 쓰기 전에 읽을 짧은 글">${esc(OPEN.passage || '')}</textarea></div>
      <label>안내 한 줄(선택)</label><div><input type="text" id="oGuide" placeholder="예: 이유를 두 가지 이상 써요" value="${esc(OPEN.guide || '')}"></div>
      <label>다시 쓰기</label><div><select id="oRewrite">${[0,1,2,3].map(n => `<option value="${n}" ${n === (OPEN.rewrite == null ? 1 : OPEN.rewrite) ? 'selected' : ''}>${n === 0 ? '없음 — 한 번만' : n + '회까지'}</option>`).join('')}</select></div>
      <div class="hint">돌려줄 때 「고쳐서 다시」를 켜면 아이가 고쳐서 다시 보낼 수 있어요. 기본 1회.</div>
      <label>마감(선택)</label><div><input type="date" id="oDue" value="${esc(OPEN.due || '')}"></div>
      <label>학생 카드 이름</label><div><input type="text" id="oTitle" placeholder="비우면 논제 앞부분" value="${esc(OPEN.title || '')}"></div>
    </div>
    <div class="row"><button class="btn" id="oGo" ${CLASSES.length ? '' : 'disabled'}>우리 반에 열기</button><span class="meta">열면 아이들 케이박스·글쓰기 입구에 카드가 뜨고, 보낸 글은 「연 과제 · 첨삭」에 모여요.</span></div>
  </div>`;
  const keep = () => { OPEN.topic = f('oTopic'); OPEN.kw = f('oKw'); OPEN.passage = f('oPassage'); OPEN.guide = f('oGuide'); OPEN.rewrite = +f('oRewrite'); OPEN.due = f('oDue'); OPEN.title = f('oTitle'); };
  document.getElementById('oType').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; keep(); OPEN.type = b.dataset.k; OPEN.prompt = null; renderOpen(); };
  document.getElementById('oBand').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; keep(); OPEN.band = b.dataset.k; renderOpen(); };
  document.getElementById('oPrompt').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; keep(); OPEN.prompt = b.dataset.p || null;
    const p = OPEN.prompt && D.prompts.prompts.find(x => x.id === OPEN.prompt);
    if (p){ OPEN.topic = p.topic; OPEN.kw = (p.keywords || []).join(', '); OPEN.passage = p.passage; OPEN.title = p.title; }
    renderOpen(); };
  document.getElementById('oGo').onclick = openRun;
}
async function openRun(){
  const classId = f('oClass'), topic = f('oTopic').trim(); if (!classId) return toast('학급을 골라 주세요.'); if (!topic) return toast('논제를 써 주세요.');
  const kw = f('oKw').split(',').map(s => s.trim()).filter(Boolean).slice(0, 3);
  const title = f('oTitle').trim() || topic.slice(0, 24);
  const due = f('oDue') ? new Date(f('oDue') + 'T23:59:59+09:00').toISOString() : null;
  const b = document.getElementById('oGo'); b.disabled = true;
  const { data: run, error } = await db.from('write_runs').insert({ class_code_id: classId, teacher_id: ME.id, type: OPEN.type, band: OPEN.band, title, topic, keywords: kw, prompt_id: OPEN.prompt || null, passage: f('oPassage').trim() || null, guide: f('oGuide').trim() || null, rewrite_max: +f('oRewrite'), due_at: due }).select('id').single();
  if (error){ b.disabled = false; return toast('열지 못했어요 — SQL #51(setup_write_v1.sql) 적용 여부를 확인해 주세요.'); }
  const { error: e2 } = await db.rpc('open_for_class', { p_class_code_id: classId, p_content_key: 'write:' + run.id, p_title: '✏️ ' + title, p_kind: 'link', p_url: '/kedu/write/task.html?run=' + run.id });
  if (e2) toast('과제는 열렸지만 케이박스 카드는 만들지 못했어요.'); else toast(`「${title}」을 우리 반에 열었어요.`);
  OPEN = { type: OPEN.type, band: OPEN.band, prompt: null }; TAB = 'mine'; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'mine')); render();
}

/* ---------- ② 연 과제 ---------- */
async function loadRuns(){
  const { data, error } = await db.from('write_runs').select('*, write_submissions(id, student_id, attempt, submitted_at, write_reviews(returned_at, ask_rewrite))').eq('teacher_id', ME.id).order('opened_at', { ascending: false });
  if (error) return null; return (RUNS = data || []);
}
async function renderMine(){
  if (REV) return renderReview();
  view.innerHTML = `<div class="gate">불러오는 중…</div>`;
  const runs = await loadRuns();
  if (!runs){ view.innerHTML = `<div class="soon">연 과제를 읽을 수 없어요 — SQL #51(setup_write_v1.sql) 적용 여부를 확인해 주세요.</div>`; return; }
  if (!runs.length){ view.innerHTML = `<div class="panel"><p class="meta" style="margin:0">아직 연 과제가 없어요. 「과제 열기」에서 열어 보세요.</p></div>`; return; }
  view.innerHTML = `<div class="panel">${runs.map(r => { const cls = CLASSES.find(c => c.id === r.class_code_id) || {}; const subs = r.write_submissions || [];
    const students = new Set(subs.map(s => s.student_id)).size, waiting = subs.filter(s => !(s.write_reviews && s.write_reviews.length && s.write_reviews[0].returned_at)).length;
    return `<div class="setrow"><h3>${esc(r.title)} <span class="badge">${esc(D.templates.types[r.type].name)}</span><span class="badge">${BANDS[r.band]}</span>${r.closed_at ? '<span class="badge on">마감</span>' : ''}</h3>
      <div class="meta">${esc(r.topic)}<br>반 ${esc(cls.code || '')} · ${new Date(r.opened_at).toLocaleDateString('ko-KR')}${r.due_at ? ' · ' + new Date(r.due_at).toLocaleDateString('ko-KR') + '까지' : ''} · 다시 쓰기 ${r.rewrite_max}회 · 보낸 학생 <b>${students}</b>${waiting ? ` · <span class="badge wait">볼 것 ${waiting}</span>` : ''}</div>
      <div class="row"><button class="btn" data-rev="${r.id}">첨삭하기</button><button class="btn ghost" data-close="${r.id}" data-closed="${r.closed_at ? 1 : 0}">${r.closed_at ? '다시 열기' : '마감'}</button><a class="btn ghost" href="task.html?run=${r.id}&preview=1" target="_blank">학생 화면 미리보기</a><button class="btn ghost" data-copy="${r.id}">학생 주소 복사</button></div></div>`; }).join('')}</div>`;
  view.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => openReview(b.dataset.rev));
  view.querySelectorAll('[data-close]').forEach(b => b.onclick = async () => { const closing = b.dataset.closed !== '1'; const { error } = await db.from('write_runs').update({ closed_at: closing ? new Date().toISOString() : null }).eq('id', b.dataset.close); if (error) return toast('바꾸지 못했어요.'); toast(closing ? '마감했어요.' : '다시 열었어요.'); renderMine(); });
  view.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { const u = location.origin + '/kedu/write/task.html?run=' + b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('복사했어요.'), () => prompt('학생 주소', u)); });
}

/* ---------- ③ 첨삭 ---------- */
async function openReview(runId){
  const run = RUNS.find(r => r.id === runId); if (!run) return;
  view.innerHTML = `<div class="gate">불러오는 중…</div>`;
  const [{ data: sps }, { data: subs }] = await Promise.all([
    db.from('student_profiles').select('id, nickname, seat_no').eq('class_code_id', run.class_code_id).eq('is_active', true).order('seat_no', { nullsFirst: false }).order('nickname'),
    db.from('write_submissions').select('*, write_reviews(*)').eq('run_id', runId).order('attempt')
  ]);
  const bySt = {}; (subs || []).forEach(s => { (bySt[s.student_id] = bySt[s.student_id] || []).push(s); });
  const students = (sps || []).map(p => ({ id: p.id, name: p.nickname, no: p.seat_no, subs: bySt[p.id] || [] }));
  Object.keys(bySt).forEach(id => { if (!students.some(s => s.id === id)) students.push({ id, name: '(명단 밖)', no: null, subs: bySt[id] }); });
  const first = students.find(s => s.subs.length && !returned(s.subs[s.subs.length - 1])) || students.find(s => s.subs.length) || students[0];
  REV = { run, students, cur: first ? first.id : null, attempt: null, pop: null, dirty: false, draft: null };
  renderReview();
}
function returned(sub){ return !!(sub && sub.write_reviews && sub.write_reviews.length && sub.write_reviews[0].returned_at); }
function reviewOf(sub){ return (sub && sub.write_reviews && sub.write_reviews[0]) || null; }
function curSub(){ const s = REV.students.find(x => x.id === REV.cur); if (!s || !s.subs.length) return null; return REV.attempt ? s.subs.find(x => x.attempt === REV.attempt) || s.subs[s.subs.length - 1] : s.subs[s.subs.length - 1]; }
function draftFor(sub){
  if (REV.draft && REV.draft.sid === sub.id) return REV.draft;
  const rv = reviewOf(sub) || {};
  REV.draft = { sid: sub.id, marks: JSON.parse(JSON.stringify(rv.teacher_marks || [])), removed: (rv.removed || []).slice(), comment: rv.comment || '', levels: Object.assign({}, rv.levels || {}), ask: !!rv.ask_rewrite, returned: !!rv.returned_at };
  return REV.draft;
}
function renderReview(){
  const run = REV.run, tp = D.templates.types[run.type];
  const listHtml = REV.students.map(s => { const last = s.subs[s.subs.length - 1]; const st = !last ? '' : returned(last) ? '<span class="st ret">돌려줌</span>' : '<span class="st sub">볼 것</span>';
    return `<button data-st="${s.id}" class="${s.id === REV.cur ? 'on' : ''} ${last ? '' : 'none'}"><span>${s.no != null ? s.no + '. ' : ''}${esc(s.name)}${s.subs.length > 1 ? ' <small>×' + s.subs.length + '</small>' : ''}</span>${st}</button>`; }).join('');
  const sub = curSub(), me = REV.students.find(x => x.id === REV.cur);
  let paper = '';
  if (!sub) paper = `<div class="soon">${me ? esc(me.name) + ' 학생은 아직 보내지 않았어요.' : '학생을 골라 주세요.'}</div>`;
  else {
    const d = draftFor(sub), r = KWRITE.analyze({ text: sub.text, type: run.type, band: run.band, topic: run.topic, keywords: run.keywords || [] });
    const memos = KWPAPER.placeMemos(r, D.templates, D.feedback);
    const slots = Object.keys(r.elements).map(k => `<span class="${r.elements[k].status}">${esc(D.templates.colors[k].name)} ${r.elements[k].status === 'green' ? '○' : r.elements[k].status === 'yellow' ? '△' : '×'}</span>`).join('') + (r.topic ? `<span class="${r.topic.status}">논제 ${r.topic.status === 'green' ? '○' : r.topic.status === 'yellow' ? '△' : '×'}</span>` : '');
    const attempts = me.subs.length > 1 ? `<div class="attempts">${me.subs.map(x => `<button data-at="${x.attempt}" class="${x.id === sub.id ? 'on' : ''}">${x.attempt}번째${returned(x) ? ' ✓' : ''}</button>`).join('')}</div>` : '';
    paper = `<div class="paperbox">
      ${attempts}
      <div class="stats"><span>글자 <b>${r.length.chars}</b></span><span>문단 <b>${r.paras.count}</b></span><span>자동 표시 <b>${r.teacher.count}</b></span><span>보낸 때 ${new Date(sub.submitted_at).toLocaleString('ko-KR')}</span>${d.returned ? '<span class="badge ok">돌려줌</span>' : ''}</div>
      <div class="slots">${slots}</div>
      <div class="tools"><span class="k"><i></i>자동(빨강) — 누르면 지우기</span><span class="k"><i class="b"></i>선생님(파랑)</span><span>문장을 누르면 메모·낱말 표시 · 글자를 드래그해도 돼요</span></div>
      ${KWPAPER.render({ result: r, templates: D.templates, corrections: D.corrections, feedback: D.feedback, memos, teacher: d.marks, removed: d.removed, pop: REV.pop, popHtml: (p, s) => popHtml(p, s, r, d) })}
      <div class="side">
        <div><h3>선생님 한마디</h3><textarea id="rvComment" placeholder="글 전체에 대해 한두 문장">${esc(d.comment)}</textarea>
          <label style="display:block;margin-top:8px;font-size:14px"><input type="checkbox" id="rvAsk" ${d.ask ? 'checked' : ''}> 고쳐서 다시 보내 달라고 하기 ${sub.attempt > run.rewrite_max ? '<span class="badge">허용 횟수 끝 — 켜도 더 못 보내요</span>' : ''}</label></div>
        <div><h3>루브릭</h3><table class="rub"><tr><th></th>${D.rubric.levels.map(l => `<th>${l}</th>`).join('')}</tr>${D.rubric.criteria.map((c, i) => `<tr><td class="nm">${esc(c.name)}</td>${c.levels.map((l, j) => `<td><label><input type="radio" name="lv${i}" value="${j}" ${d.levels[String(i)] === j ? 'checked' : ''}><span>${esc(l.desc)}</span></label></td>`).join('')}</tr>`).join('')}</table>
          <div class="meta">비워 두면 아이 화면에 수준이 안 떠요. 점수 숫자는 어디에도 없어요.</div></div>
      </div>
      <div class="row"><button class="btn ghost" id="rvSave">저장 (아이는 아직 못 봄)</button><button class="btn blue" id="rvReturn">${d.returned ? '다시 돌려주기' : '돌려주기'}</button><span class="meta" id="rvState">${REV.dirty ? '저장 안 된 변경이 있어요' : ''}</span><span style="flex:1"></span><button class="btn ghost" id="rvPrev">← 이전 학생</button><button class="btn ghost" id="rvNext">다음 학생 →</button></div>
    </div>`;
  }
  view.innerHTML = `<div class="panel"><div class="row" style="margin:0 0 12px"><button class="btn ghost" id="rvBack">← 연 과제</button><h2 style="margin:0">${esc(run.title)}</h2><span class="badge">${esc(tp.name)}</span><span class="badge">${BANDS[run.band]}</span></div>
    <div class="meta" style="margin-bottom:12px">${esc(run.topic)}</div>
    <div class="review"><div class="students">${listHtml}</div><div>${paper}</div></div></div>`;
  document.getElementById('rvBack').onclick = () => { if (REV.dirty && !confirm('저장하지 않은 변경이 있어요. 나갈까요?')) return; REV = null; renderMine(); };
  view.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { if (REV.dirty && !confirm('저장하지 않은 변경이 있어요. 옮길까요?')) return; REV.cur = b.dataset.st; REV.attempt = null; REV.pop = null; REV.dirty = false; REV.draft = null; renderReview(); });
  if (!sub) return;
  view.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { REV.attempt = +b.dataset.at; REV.pop = null; REV.draft = null; REV.dirty = false; renderReview(); });
  const d = draftFor(sub), r = KWRITE.analyze({ text: sub.text, type: run.type, band: run.band, topic: run.topic, keywords: run.keywords || [] });
  const kwp = view.querySelector('.kwp');
  kwp.addEventListener('click', e => {
    if (e.target.closest('.pop')) return;
    const a = e.target.closest('.tm[data-a]'), b = e.target.closest('.tm[data-b]'), m = e.target.closest('[data-tmemo]'), sx = e.target.closest('.sx');
    if (a){ const idx = +a.dataset.a; REV.pop = (REV.pop && REV.pop.type === 'auto' && REV.pop.idx === idx) ? null : { type: 'auto', idx, i: r.teacher.marks[idx].i }; renderReview(); return; }
    if (b){ const idx = +b.dataset.b; REV.pop = (REV.pop && REV.pop.type === 'blue' && REV.pop.idx === idx) ? null : { type: 'blue', idx, i: d.marks[idx].i }; renderReview(); return; }
    if (m){ const idx = +m.dataset.tmemo; REV.pop = { type: 'blue', idx, i: d.marks[idx].i }; renderReview(); return; }
    if (sx){ const i = +sx.dataset.i; const sel = window.getSelection ? String(window.getSelection()).trim() : '';
      REV.pop = (REV.pop && REV.pop.type === 'sent' && REV.pop.i === i && !sel) ? null : { type: 'sent', i, sel }; renderReview();
      const inp = document.getElementById('bOrig'); if (inp && sel) inp.value = sel; return; }
  });
  document.getElementById('rvComment').oninput = e => { d.comment = e.target.value; markDirty(); };
  document.getElementById('rvAsk').onchange = e => { d.ask = e.target.checked; markDirty(); };
  view.querySelectorAll('.rub input[type=radio]').forEach(x => x.onchange = () => { d.levels[x.name.slice(2)] = +x.value; markDirty(); });
  document.getElementById('rvSave').onclick = () => saveReview(sub, d, false);
  document.getElementById('rvReturn').onclick = () => saveReview(sub, d, true);
  document.getElementById('rvPrev').onclick = () => step(-1); document.getElementById('rvNext').onclick = () => step(1);
  wirePop(sub, d, r);
}
function markDirty(){ REV.dirty = true; const el = document.getElementById('rvState'); if (el) el.textContent = '저장 안 된 변경이 있어요'; }
function step(dir){ const idx = REV.students.findIndex(s => s.id === REV.cur), n = REV.students.length; if (REV.dirty && !confirm('저장하지 않은 변경이 있어요. 옮길까요?')) return; REV.cur = REV.students[(idx + dir + n) % n].id; REV.attempt = null; REV.pop = null; REV.dirty = false; REV.draft = null; renderReview(); }
function popHtml(p, s, r, d){
  const KD = D.corrections.kinds;
  if (p.type === 'auto'){ const m = r.teacher.marks[p.idx], gone = d.removed.includes(KWPAPER.key(m));
    return `<div class="pop" style="--tc:${KD[m.kind].hex}"><b>${esc(KD[m.kind].name)} · ${esc(KD[m.kind].label)}</b><div>${esc(m.why)}</div><div class="row">${gone ? '<button class="pick apply" id="pRestore">다시 살리기</button>' : '<button class="pick apply" id="pRemove">이 표시 지우기 (아이에게 안 보임)</button>'}</div></div>`; }
  if (p.type === 'blue'){ const t = d.marks[p.idx];
    return `<div class="pop" style="--tc:#1f5fbf"><b>선생님 표시</b><div>${t.from != null ? esc(t.original) + ' → ' + esc(t.fix || '') + '<br>' : ''}${esc(t.why || t.memo || '')}</div><div class="row"><button class="pick apply" id="pDel">이 표시 지우기</button></div></div>`; }
  return `<div class="pop" style="--tc:#1f5fbf"><b>이 문장에</b>
    <div style="margin-top:6px"><input type="text" id="bOrig" placeholder="고칠 낱말(문장 안 글자 그대로) — 드래그하면 저절로" value="${esc(p.sel || '')}"><input type="text" id="bFix" placeholder="바꿔 볼 말"><input type="text" id="bWhy" placeholder="왜 (아이에게 보임, 선택)"></div>
    <div class="row"><button class="pick apply" id="bMark">낱말 표시 달기</button></div>
    <textarea id="bMemo" placeholder="문장 메모 — 내용에 대해 한 줄" rows="2"></textarea>
    <div class="row"><button class="pick apply" id="bMemoAdd">메모 달기</button><button class="pick" id="bClose">닫기</button></div></div>`;
}
function wirePop(sub, d, r){
  const g = id => document.getElementById(id);
  if (g('pRemove')) g('pRemove').onclick = async () => { const m = r.teacher.marks[REV.pop.idx]; d.removed.push(KWPAPER.key(m)); markDirty(); REV.pop = null; renderReview();
    db.from('write_fp_log').insert({ kind: m.kind, original: m.original || '', fix: m.fix, sentence: r.sentences[m.i].text, band: REV.run.band, teacher_id: ME.id }).then(() => {}, () => {}); };
  if (g('pRestore')) g('pRestore').onclick = () => { const m = r.teacher.marks[REV.pop.idx]; d.removed = d.removed.filter(k => k !== KWPAPER.key(m)); markDirty(); REV.pop = null; renderReview(); };
  if (g('pDel')) g('pDel').onclick = () => { d.marks.splice(REV.pop.idx, 1); markDirty(); REV.pop = null; renderReview(); };
  if (g('bClose')) g('bClose').onclick = () => { REV.pop = null; renderReview(); };
  if (g('bMark')) g('bMark').onclick = () => { const i = REV.pop.i, s = r.sentences[i], orig = g('bOrig').value.trim(); if (!orig) return toast('고칠 낱말을 써 주세요.');
    const from = s.text.indexOf(orig); if (from < 0) return toast('그 글자가 이 문장에 없어요.');
    d.marks.push({ i, from, to: from + orig.length, original: orig, fix: g('bFix').value.trim(), why: g('bWhy').value.trim() }); markDirty(); REV.pop = null; renderReview(); };
  if (g('bMemoAdd')) g('bMemoAdd').onclick = () => { const memo = g('bMemo').value.trim(); if (!memo) return toast('메모를 써 주세요.'); d.marks.push({ i: REV.pop.i, memo }); markDirty(); REV.pop = null; renderReview(); };
}
async function saveReview(sub, d, ret){
  const row = { submission_id: sub.id, teacher_marks: d.marks, removed: d.removed, comment: d.comment || null, levels: d.levels, ask_rewrite: d.ask, reviewed_by: ME.id, updated_at: new Date().toISOString() };
  if (ret) row.returned_at = new Date().toISOString(); else if (d.returned) row.returned_at = (reviewOf(sub) || {}).returned_at;
  const { data, error } = await db.from('write_reviews').upsert(row, { onConflict: 'submission_id' }).select('*').single();
  if (error) return toast('저장하지 못했어요 — SQL #51 적용 여부를 확인해 주세요.');
  sub.write_reviews = [data]; d.returned = !!data.returned_at; REV.dirty = false;
  toast(ret ? '돌려줬어요. 아이 화면에 바로 떠요.' : '저장했어요.');
  if (ret){ const idx = REV.students.findIndex(s => s.id === REV.cur); const next = REV.students.slice(idx + 1).concat(REV.students.slice(0, idx)).find(s => s.subs.length && !returned(s.subs[s.subs.length - 1])); if (next){ REV.cur = next.id; REV.attempt = null; REV.draft = null; } }
  REV.pop = null; renderReview();
}

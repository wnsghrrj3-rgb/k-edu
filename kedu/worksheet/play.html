<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/kedu_scope.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>케이학습지</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
/* v5 공책(2026-10-15) — 종이 학습지처럼 연필·줄 노트. 색은 종이·연필·빨간 펜·파란 펜 네 가지뿐.
   학년 띠(html[data-band]): low 줄 간격 넓고 글자 큼 · mid 보통 · high 촘촘. 왼쪽 여백 선 색만 띠별로 다름 */
--desk:#E6E1D6;--paper:#FFFDF7;--card:#FFFFFF;--ink:#2A2D33;--ink-soft:#575C66;--muted:#8A8F99;
--rule:#D9E2EE;--rule-strong:#B6C2D1;--tint:#F6F3EC;
--pencil:#4D5159;--pen:#D2452F;--pen-soft:#FBEAE6;--bluepen:#2E5BC6;--blue-soft:#E8EEFB;--hl:#FFF0A6;--note:#FFF6BF;
--accent:#D2452F;--accent-soft:#FBEAE6;
--ok:#D2452F;--ok-soft:#FBEAE6;--no:#2E5BC6;--no-soft:#E8EEFB;--wait:#C97A12;--wait-soft:#FFF4DF;
--shadow:0 1px 0 rgba(42,45,51,.05),0 14px 30px -18px rgba(42,45,51,.35);
--radius:10px;--bw:1.5px;--display:'Gaegu',cursive;--stem:'Gowun Dodum',sans-serif;
--line:30px;--margin:#D2452F;--stemsize:22px}
html[data-band="low"]{--line:36px;--stemsize:25px;--margin:#D2452F}
html[data-band="mid"]{--line:32px;--stemsize:23px;--margin:#3E9A6B}
html[data-band="high"]{--line:28px;--stemsize:21px;--margin:#2E5BC6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Gowun Dodum',sans-serif;min-height:100%;
 -webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding:14px 16px 48px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}

/* 상단 */
.bar{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.bar .home{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 12px;font-size:15px;text-decoration:none;color:var(--ink-soft);line-height:1}
.bar .home:hover{border-color:var(--rule-strong)}
.bar button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 14px;font-size:15px;color:var(--ink-soft)}
.bar button:hover{border-color:var(--rule-strong)}
.tts.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--rule);display:block}
.dots i.done{background:var(--ok)}.dots i.wrong{background:var(--no)}.dots i.now{background:var(--ink)}

/* 표지 */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:40px 0}
.cover .badge{font-family:'Gowun Batang',serif;font-size:15px;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);padding:9px 26px}
.cover h1{font-family:'Gowun Batang',serif;font-size:31px;margin:2px 0 0;line-height:1.4;font-weight:700}
.cover p{margin:0;color:var(--muted);font-size:17px}
.big{background:var(--ink);color:var(--paper);font-size:18px;padding:14px 34px;border-radius:10px;transition:background .12s}
.big:hover{background:#1F2429}
.big.ghost{background:var(--card);color:var(--ink-soft);border:1px solid var(--rule)}
.big.ghost:hover{background:var(--tint)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.alt{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);margin-top:6px}
.alt a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule-strong);padding-bottom:2px}
.alt a:hover{color:var(--ink);border-color:var(--ink)}

/* 문항 */
.q{background:var(--card);border:1px solid var(--rule-strong);border-radius:14px;box-shadow:var(--shadow);padding:26px 24px 22px}
.q .num{display:block;font-size:13px;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
.stem{font-size:22px;line-height:1.6;white-space:pre-line}
/* v3.4 세로 분수 — 글 속 ⟨a/b⟩·⟨n a/b⟩ 표기를 esc 가 그린다 (6학년) */
.fr{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin:0 2px;line-height:1}
.fr b{font-weight:600}.fr .fs{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;font-size:.78em}
.fr .fs sup,.fr .fs sub{font-size:1em;vertical-align:baseline;position:static;line-height:1.15;padding:0 3px}.fr .fs sup{border-bottom:1.5px solid currentColor}
.fbarw{display:flex;flex-direction:column;gap:6px;align-items:center;max-width:100%;overflow-x:auto}.fbarw svg{max-width:100%;height:auto}
.pfbarw{margin:4px 0}.pfbarw svg{max-width:100%;height:auto}
.asset{margin:22px 0 4px;display:flex;justify-content:center}
.count{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:400px;font-size:42px;line-height:1}
.scatter{position:relative;width:100%;max-width:400px;height:180px;border:1px solid var(--rule);border-radius:10px;background:var(--tint)}
.scatter span{position:absolute;font-size:36px;line-height:1;transform:translate(-50%,-50%)}
.dotsv{display:inline-flex;gap:8px;font-size:24px;line-height:1;color:var(--ink)}
.hidden{display:flex;align-items:flex-end;gap:12px;font-size:38px;line-height:1}
.hidden .box{width:132px;height:84px;background:var(--tint);border:1px solid var(--rule-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:30px}
.picto{border-collapse:collapse;font-size:16px;background:var(--card);border:1px solid var(--rule-strong)}
.picto td{padding:10px 16px;border:1px solid var(--rule)}
.picto td:first-child{background:var(--tint);color:var(--ink-soft);min-width:82px;text-align:center}
.picto td:last-child{font-size:28px;letter-spacing:8px}
.rule{display:flex;align-items:center;gap:12px;font-size:20px;color:var(--ink-soft)}
.rule .cell{background:var(--card);border:1px solid var(--rule-strong);border-radius:8px;padding:12px 14px;min-width:72px;text-align:center;letter-spacing:4px}
.rule .cell.next{border-style:dashed;color:var(--muted)}
.pair-boxes{display:flex;gap:22px;font-size:24px;align-items:center;letter-spacing:6px}
.pair-boxes .b{background:var(--card);border:1px solid var(--rule-strong);border-radius:8px;padding:16px 20px}
.numline{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.numline .c{min-width:46px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--rule-strong);border-radius:8px;font-size:24px;font-family:'Gowun Batang',serif}
.numline .c.blank{border-style:dashed;color:var(--muted);background:var(--tint)}
.numline .c.mark{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ordrow{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:100%}
.ordrow .items{display:flex;gap:10px;font-size:34px;line-height:1}
.ordrow .items span{width:46px;text-align:center}
.ordrow .items span.mark{background:var(--accent-soft);border-radius:8px;outline:2px solid var(--accent)}
.ordrow .arrow{display:flex;justify-content:space-between;width:100%;font-size:14px;color:var(--muted)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp .r{display:flex;align-items:center;gap:12px}
.cmp .r em{font-style:normal;font-size:16px;color:var(--ink-soft);min-width:62px;text-align:right}
.cmp .r .g{display:flex;gap:8px;font-size:30px;line-height:1}
.plate{display:flex;flex-direction:column;align-items:center;gap:8px}
.plate .tray{min-width:180px;min-height:86px;border:1px solid var(--rule-strong);border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px;padding:12px 18px}
.plate .tray.empty::after{content:'비어 있어요';font-size:15px;color:var(--muted)}
.plate em{font-style:normal;font-size:15px;color:var(--muted)}
/* v0.9 — 국어 에셋: 짧은 글·말풍선·장면 (2026-09-29) */
.passage{width:100%;max-width:560px;border:1px solid var(--rule-strong);border-radius:14px;background:var(--tint);padding:14px 18px;font-size:19px;line-height:1.75}
.passage h4{margin:0 0 6px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.passage .ln{display:flex;gap:10px;align-items:flex-start}
.passage .ln i{font-style:normal;flex:0 0 22px;height:22px;border-radius:11px;background:var(--card);border:1px solid var(--rule-strong);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-top:6px}
.passage .ln b{background:#FFF3B0;border-radius:4px;padding:0 3px;font-weight:700}
.speech{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
.speech .tn{display:flex;gap:10px;align-items:flex-start}
.speech .tn.me{flex-direction:row-reverse}
.speech .who{flex:0 0 auto;font-size:14px;color:var(--muted);padding-top:10px;min-width:34px;text-align:center}
.speech .bub{background:var(--card);border:1px solid var(--rule-strong);border-radius:16px;padding:10px 14px;font-size:19px;line-height:1.55;max-width:80%}
.speech .tn.me .bub{background:#E8F5EE}
.scene{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:520px;text-align:center}
.scene .ic{font-size:54px;line-height:1.15;letter-spacing:.06em}
.scene .cap{font-size:18px;line-height:1.55;color:var(--ink-soft)}
.pq .ppass{margin:8px 0 8px 30px;padding:8px 12px;border:1px solid #888;border-radius:8px;font-size:13px;line-height:1.75}
.pq .ppass h4{margin:0 0 2px;font-size:11px;color:#555}
.pq .ppass b{text-decoration:underline;font-weight:400}
.pq .pspeech{margin:8px 0 8px 30px;font-size:13px;line-height:1.8}
.pq .pspeech b{display:inline-block;min-width:40px;font-weight:400;color:#555}
.pq .pscene{margin:6px 0 6px 30px;font-size:13px;line-height:1.6}
/* v1.5 — 국어 에셋: 글자 짜임 상자 · 음절표 (2026-10-07) — 자음자 파랑 · 모음자 주황(자기주도 차시와 같은 색 약속) */
.jamo{display:flex;flex-direction:column;align-items:center;gap:12px}
.jamo .eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.jamo .eq b{font-size:30px;color:var(--muted);font-weight:400}
.jamo .cd{min-width:74px;height:84px;padding:0 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;font-weight:700;border:3px solid var(--rule-strong);background:var(--card)}
.jamo .cd.c{color:#1D5FBF;border-color:#7FA8E6;background:#EEF4FD}
.jamo .cd.v{color:#C25A00;border-color:#F0B37A;background:#FFF4E8}
.jamo .cd.s{color:var(--ink);min-width:90px}
.jamo .cd.q{color:var(--muted);border-style:dashed;background:transparent}
.jamo .lay{display:grid;width:150px;height:150px;border:3px solid var(--rule-strong);border-radius:12px;overflow:hidden;background:var(--card)}
.jamo .lay i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:46px;font-weight:700}
.jamo .lay i.c{background:#EEF4FD;color:#1D5FBF}
.jamo .lay i.v{background:#FFF4E8;color:#C25A00}
.jamo .lay i.q{color:var(--muted)}
.jamo .lay.side{grid-template-columns:1fr 1fr}
.jamo .lay.side i+i{border-left:2px dashed var(--rule-strong)}
.jamo .lay.stack{grid-template-rows:1fr 1fr}
.jamo .lay.stack i+i{border-top:2px dashed var(--rule-strong)}
.jamo .lay.mix{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.jamo .lay.mix i.c{grid-column:1;grid-row:1}
.jamo .lay.mix i.v{grid-column:1 / 3;grid-row:2;border-top:2px dashed var(--rule-strong)}
.jamo .lay.mix i.v2{grid-column:2;grid-row:1;border-left:2px dashed var(--rule-strong);background:#FFF4E8}
.jamo em{font-style:normal;font-size:15px;color:var(--muted)}
/* v1.6 — 받침 글자 (2026-10-07) — 자음자 파랑 · 모음자 주황 · 받침 초록 */
.jamo .cd.b{color:#2E7D32;border-color:#8BC48F;background:#EDF7EE}
.jamo .lay3{display:grid;width:150px;border:3px solid var(--rule-strong);border-radius:12px;overflow:hidden;background:var(--card)}
.jamo .lay3 i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:40px;font-weight:700;height:62px}
.jamo .lay3 i.c{background:#EEF4FD;color:#1D5FBF}
.jamo .lay3 i.v,.jamo .lay3 i.v2{background:#FFF4E8;color:#C25A00}
.jamo .lay3 i.b{background:#EDF7EE;color:#2E7D32;border-top:2px dashed var(--rule-strong)}
.jamo .lay3 i.q{color:var(--muted)}
.jamo .lay3.side{grid-template-columns:1fr 1fr}
.jamo .lay3.side i.v{border-left:2px dashed var(--rule-strong)}
.jamo .lay3.side i.b,.jamo .lay3.mix i.b{grid-column:1 / 3}
.jamo .lay3.stack i.v{border-top:2px dashed var(--rule-strong)}
.jamo .lay3.mix{grid-template-columns:1fr 1fr}
.jamo .lay3.mix i.v2{border-left:2px dashed var(--rule-strong)}
.jamo .lay3.mix i.v{grid-column:1 / 3;border-top:2px dashed var(--rule-strong)}
.batw{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.batw .pic{font-size:64px;line-height:1}
.batw .w{display:flex;gap:6px}
.batw .sy{display:flex;flex-direction:column;align-items:center;min-width:72px;padding:6px 8px;border:3px solid var(--rule-strong);border-radius:14px;background:var(--card);font-size:48px;font-weight:700;line-height:1.1}
.batw .sy i{font-style:normal;margin-top:4px;width:44px;height:30px;border:3px dashed #8BC48F;border-radius:8px;background:#EDF7EE;color:#2E7D32;font-size:22px;display:flex;align-items:center;justify-content:center}
.pq .pbatw{margin:8px 0 8px 30px;font-size:20px;letter-spacing:.08em}
.pq .pbatw .ppic{font-size:26px;margin-right:12px}
.pq .pbatw sub{font-size:13px;border:1px dashed #555;padding:0 4px;margin-left:1px}
.wgridw{text-align:center}
.wgrid{border-collapse:collapse;font-size:32px;margin:0 auto;font-weight:700}
.wgrid td{width:58px;height:58px;text-align:center;border:2px solid var(--rule-strong);background:var(--card)}
.wgcap{margin-top:6px;font-size:15px;color:#6B6253}
.pq .pwgridw{margin:8px 0 8px 30px}
.pq .pwgrid{border-collapse:collapse;font-size:17px;display:inline-table;vertical-align:middle}
.pq .pwgrid td{border:1px solid #555;width:30px;height:28px;text-align:center}
.pq .pwgridw small{margin-left:10px;font-size:12px;color:#555}
.syl{border-collapse:collapse;font-size:30px;margin:0 auto}
.syl th,.syl td{width:62px;height:58px;text-align:center;border:2px solid var(--rule-strong)}
.syl thead th{background:#FFF4E8;color:#C25A00}
.syl tbody th{background:#EEF4FD;color:#1D5FBF}
.syl thead th:first-child{background:var(--tint)}
.syl td.q{background:#FFF3B0;font-weight:700}
.pq .pjamo{margin:8px 0 8px 30px;font-size:20px;letter-spacing:.06em}
.pq .pjamo .pl{display:inline-grid;margin-left:14px;border:1px solid #555;vertical-align:middle;font-size:14px}
.pq .pjamo .pl span{display:flex;align-items:center;justify-content:center;width:26px;height:26px}
.pq .pjamo .pl.side{grid-template-columns:26px 26px}
.pq .pjamo .pl.side span+span{border-left:1px dashed #555}
.pq .pjamo .pl.stack span+span{border-top:1px dashed #555}
.pq .psyl{border-collapse:collapse;margin:8px 0 8px 30px;font-size:15px}
.pq .psyl th,.pq .psyl td{border:1px solid #555;width:30px;height:26px;text-align:center}
.pq .psyl th{font-weight:400;color:#444}
/* v1.0 — 국어 에셋: 그림일기 틀 (2026-10-06) — 날짜·날씨 줄 / 그림 칸 / 글 칸, 비운 자리는 점선 빈칸 */
.diary{width:100%;max-width:520px;border:2px solid var(--rule-strong);border-radius:14px;background:var(--card);overflow:hidden}
.diary .dh{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px dashed var(--rule-strong);font-size:17px;background:var(--tint)}
.diary .dh span{flex:1 1 auto}
.diary .dh .wx{flex:0 0 auto;text-align:right}
.diary .dp{min-height:88px;display:flex;align-items:center;justify-content:center;font-size:46px;letter-spacing:.08em;border-bottom:1px dashed var(--rule-strong);padding:10px 14px}
.diary .dt{padding:10px 16px;font-size:19px;line-height:1.8;background:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px)}
.diary .dt div{min-height:34px}
.diary .dt b{background:#FFF3B0;border-radius:4px;padding:0 3px;font-weight:700}
.diary .blank{color:var(--muted);font-size:15px;font-style:normal}
.diary .blank::before{content:'( 비어 있어요 )'}
.diary .dn{font-size:13px;color:var(--muted);text-align:right;padding:0 12px 6px}
.pq .pdiary{margin:8px 0 8px 30px;border:1px solid #888;border-radius:8px;font-size:13px;line-height:1.7;max-width:420px}
.pq .pdiary .pdh{display:flex;justify-content:space-between;padding:4px 10px;border-bottom:1px dashed #888}
.pq .pdiary .pdp{min-height:40px;display:flex;align-items:center;justify-content:center;font-size:22px;border-bottom:1px dashed #888;padding:4px}
.pq .pdiary .pdt{padding:6px 10px}
.pq .pdiary .pdt b{text-decoration:underline;font-weight:400}
.pq .pdiary .pblank{color:#777}
.pq .pdiary .pblank::before{content:'(      )'}
.pq .pscene span{font-size:20px;margin-right:8px}
/* v0.3 — 1학년 2학기 「100까지의 수」 에셋 3종 */
.bund{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.bund .ten{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:6px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--tint)}
.bund .ten span{width:13px;height:13px;border-radius:50%;background:var(--accent)}
.bund .ones{display:flex;gap:6px;flex-wrap:wrap;max-width:132px;align-items:center;justify-content:center;padding:8px 10px;border:1px dashed var(--rule-strong);border-radius:8px;min-width:56px;min-height:44px}
.bund .ones span{width:13px;height:13px;border-radius:50%;background:var(--ink-soft)}
.bund .ones.none::after{content:'낱개 없음';font-size:13px;color:var(--muted)}
.chart{display:grid;gap:4px;justify-content:center}
.chart .c{min-width:38px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--rule-strong);border-radius:7px;font-size:19px;font-family:'Gowun Batang',serif}
.chart .c.blank{border-style:dashed;color:var(--muted);background:var(--tint)}
.chart .c.mark{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pairrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.pairrow .p{display:flex;gap:5px;padding:6px 9px;border:1px solid var(--rule-strong);border-radius:22px;background:var(--tint)}
.pairrow .p span{width:15px;height:15px;border-radius:50%;background:var(--accent)}
.pairrow .p.left{border-style:dashed;border-color:var(--accent)}
.tenf{display:inline-grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border:2px solid var(--rule-strong);border-radius:10px;background:var(--tint)}

.pad button{font-size:22px;padding:14px 0;border-radius:8px;background:var(--card);border:1px solid var(--rule)}

.pad button.go{grid-column:span 2;background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:17px}
textarea{width:100%;font-family:inherit;font-size:19px;line-height:1.6;padding:14px;border:1px solid var(--rule);border-radius:10px;resize:vertical;min-height:104px;background:var(--tint);color:var(--ink)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--card)}
.match{display:grid;grid-template-columns:1fr 56px 1fr;gap:9px;position:relative}
.match .col{display:flex;flex-direction:column;gap:9px}
.mi{background:var(--card);border:1px solid var(--rule);border-radius:10px;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:21px}
.mi:hover:not(:disabled){background:var(--tint)}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}.mi.done{border-color:var(--rule-strong);background:var(--tint)}
.mi.ok{border-color:var(--ok);background:var(--ok-soft)}.mi.no{border-color:var(--no);background:var(--no-soft)}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.match svg line{stroke:var(--rule-strong);stroke-width:2}
.match svg line.ok{stroke:var(--ok)}.match svg line.no{stroke:var(--no)}
.confirm{margin-top:14px;display:flex;justify-content:flex-end}

/* 피드백 */
.fb{border-radius:12px;padding:18px 20px;margin-top:20px;border:1px solid var(--rule)}
.fb.ok{background:var(--ok-soft);border-color:#CBDBCC}.fb.no{background:var(--no-soft);border-color:#E4CFC7}.fb.wait{background:var(--wait-soft);border-color:#E0D6BC}

.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--no)}.fb.wait h3{color:var(--wait)}

.fb .next{margin-top:16px;display:flex;justify-content:flex-end}

/* 마무리 */

.stamp{width:132px;height:132px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--accent);color:var(--accent);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:'Gowun Batang',serif;font-size:19px;line-height:1.3;transform:rotate(-7deg)}
.stamp small{font-size:12px;letter-spacing:.08em}
.finish h2{font-family:'Gowun Batang',serif;font-size:25px;margin:10px 0 0;font-weight:700}
.finish p{margin:0;font-size:17px;color:var(--muted)}
.weak{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:16px 20px;font-size:17px;max-width:440px;text-align:left;color:var(--ink-soft)}
.weak b{color:var(--ink);font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.stem{font-size:20px}.count{font-size:36px}.opt{font-size:18px}.cover h1{font-size:26px}}

@media print{.toolbar{display:none}.sheet{margin:0;box-shadow:none;height:296mm;break-after:page}.sheet:last-child{break-after:auto}.sheet.key-sheet{height:auto;min-height:0;overflow:visible}.sheet+.sheet{page-break-before:auto}html,body{margin:0;background:#fff}@page{size:A4;margin:0}}

/* ---------- 2026-10-16 종이 모드 정돈 ---------- */
/* 인쇄가 오른쪽으로 쏠리던 원인: .app 이 620px 상자라 210mm 시험지가 그 안에서 오른쪽으로 넘쳤다 → 종이 모드는 .app 상자를 푼다. */
body.paper .app{max-width:none;padding:0;margin:0;display:block;min-height:0}

.pbody.loose{gap:9mm}
.ph{align-items:flex-end;padding-bottom:9px;border-bottom:1.5px solid #1A1A1A}

.ph .idbox span.w1{width:52px}.ph .idbox span.w2{width:52px}.ph .idbox span.w3{width:92px}

/* 10개씩 묶음·낱개 — 글꼴마다 깨지던 ▥ 글자 대신 막대·점 그림(SVG) */

/* ---------- v5 공책: 종이 위에 연필로 ---------- */
body:not(.paper){background:var(--desk)}
body:not(.paper) .app{max-width:680px;margin:18px auto 40px;padding:22px 34px 56px 74px;min-height:calc(100vh - 58px);background:var(--paper);
 box-shadow:var(--shadow),inset 0 0 0 1px rgba(42,45,51,.06);border-radius:3px 10px 10px 3px;
 background-image:
  radial-gradient(circle at 26px 120px,#E6E1D6 7px,transparent 8px),radial-gradient(circle at 26px 50%,#E6E1D6 7px,transparent 8px),radial-gradient(circle at 26px calc(100% - 120px),#E6E1D6 7px,transparent 8px),
  linear-gradient(to right,transparent 58px,var(--margin) 58px,var(--margin) 59.5px,transparent 59.5px);
 background-attachment:local}

  linear-gradient(to right,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px)}}

/* 상단: 공책 귀퉁이 */
.bar{padding:0 0 14px;gap:8px}

.tts.on{color:var(--pen);border-color:var(--pen);background:var(--pen-soft)}
.dots{gap:5px}.dots i{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--rule-strong);background:transparent;display:block;flex:none}

/* 표지 */

.big:hover{background:var(--pencil);filter:brightness(1.1)}

.big.ghost{background:var(--card);color:var(--ink-soft);border:1px solid var(--rule-strong);box-shadow:0 2px 0 var(--rule-strong)}
.big.ghost:hover{background:var(--tint);filter:none}
.alt a{border:0;color:var(--muted);border-bottom:1px dotted var(--muted)}.alt a:hover{color:var(--pen);border-color:var(--pen)}

/* 문항: 카드 없이 공책 위에 바로 */
.q{background:transparent;border:0;box-shadow:none;padding:4px 0 0;border-radius:0}

 color:var(--pencil);background:var(--paper);font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:0;margin-bottom:10px;transform:rotate(-5deg)}

/* 시드 난수 — 같은 시드면 같은 배치(자동 저장·복원 일관성) */

function frGcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ const t = a % b; a = b; b = t; } return a || 1; }

const HG_C = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', HG_V = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';

      if (useZero && !pic && !cmpMode){ x = rint(1, MAX, r); y = r() < 0.5 ? 0 : x; }
      else if (useZero && pic === 'take_row'){ x = rint(2, MAX, r); y = r() < 0.5 ? 0 : x; }
      else { x = rint(2, MAX, r); y = rint(1, x - 1, r); }
    }
    const ans = op === 'add' ? x + y : x - y; const sg = op === 'add' ? '+' : '−';
    const dflt = misOf((q.options && q.options.length) ? q.options : q.reason_options, 0, null);
    const ITEMS = S.items || ['🍓', '🐝', '🦋', '🍎', '🐤', '🌸', '🥚', '🐟'];
    if (pic === 'group_row'){ const it = pick(ITEMS, r); a.groups = [{item:it, n:x}, {item:it, n:y}]; a.op = '+'; }
    if (pic === 'take_row'){ a.item = pick(ITEMS, r); a.n = x; a.cross = y; }
    if (pic === 'compare_groups'){ a.rows[0].n = x; a.rows[1].n = y; }
    const L0 = pic === 'compare_groups' ? a.rows[0].label : '', L1 = pic === 'compare_groups' ? a.rows[1].label : '';
    /* 이야기 — 합치기·더 오기 / 덜어 내기·견주기 */
    const NAMES = ['지우', '서아', '하루', '유나', '도이'];
    const ST = {
      add: [ (p, q2) => `${pick(NAMES, r)}는 빨간 구슬 ${p}개와 파란 구슬 ${q2}개를 가지고 있어요. 구슬은 모두 몇 개인가요?`,
             (p, q2) => `나뭇가지에 참새가 ${p}마리 앉아 있었어요. ${q2}마리가 더 날아왔어요. 참새는 모두 몇 마리인가요?`,
             (p, q2) => `꽃밭에 노란 꽃이 ${p}송이, 빨간 꽃이 ${q2}송이 피었어요. 꽃은 모두 몇 송이인가요?`,
             (p, q2) => `버스에 ${p}명이 타고 있었어요. 정류장에서 ${q2}명이 더 탔어요. 버스에 탄 사람은 모두 몇 명인가요?` ],
      take: [ (p, q2) => `접시에 쿠키가 ${p}개 있었어요. ${q2}개를 먹었어요. 남은 쿠키는 몇 개인가요?`,
              (p, q2) => `연못에 개구리가 ${p}마리 있었어요. ${q2}마리가 뛰어 나갔어요. 연못에 남은 개구리는 몇 마리인가요?`,
              (p, q2) => `풍선이 ${p}개 있었어요. ${q2}개가 터졌어요. 남은 풍선은 몇 개인가요?` ],
      cmp:  [ (p, q2) => `사과가 ${p}개, 배가 ${q2}개 있어요. 사과는 배보다 몇 개 더 많은가요?`,
              (p, q2) => `강아지가 ${p}마리, 고양이가 ${q2}마리 있어요. 강아지는 고양이보다 몇 마리 더 많은가요?`,
              (p, q2) => `줄넘기를 지우는 ${p}번, 서아는 ${q2}번 넘었어요. 지우는 서아보다 몇 번 더 넘었나요?` ] };
    const kindKey = op === 'add' ? 'add' : (cmpMode ? 'cmp' : 'take');
    const story = pick(ST[kindKey], r)(x, y);
    const picStem = pic === 'group_row' ? '그림을 보고 덧셈을 해요. 두 무리를 모으면 모두 몇 개인가요?'
                  : pic === 'take_row' ? '그림을 보고 뺄셈을 해요. 빗금 친 것을 덜어 내면 남는 것은 몇 개인가요?'
                  : pic === 'compare_groups' ? `그림을 보세요. ${L0}${WEUN(L0)} ${L1}보다 몇 개 더 많은가요?` : null;
    const ask = S.ask || 'value';
    const expl = op === 'add'
      ? [`${x}${GW(x)} ${y}${EUL(y)} 모아요${y === 0 || x === 0 ? ' — 0을 더하면 처음 수 그대로예요' : ''}.`, `${x} + ${y} = ${ans}${IEYO(ans)}.`, x === 0 || y === 0 ? '0은 아무것도 없다는 뜻이에요.' : '큰 수에서 이어 세면 빨라요.']
      : cmpMode ? [`하나씩 짝을 지으면 ${y}개씩 짝이 되고 ${ans}개가 남아요.`, `${x} − ${y} = ${ans}${IEYO(ans)}.`, '「몇 개 더 많은가」도 뺄셈으로 구해요.']
      : [`${x}에서 ${y}${EUL(y)} 덜어 내요${y === 0 ? ' — 0을 빼면 그대로예요' : (y === x ? ' — 모두 빼면 0이에요' : '')}.`, `${x} − ${y} = ${ans}${IEYO(ans)}.`, y === 0 || y === x ? '0을 빼기와 모두 빼기를 헷갈리지 않아요.' : '덜어 낸 것은 세지 않고 남은 것만 세요.'];
    /* 오답은 「종류」로 물려받는다 — 원본 오답이 어떤 실수였는지(연산 바꿈·뺀 수·한 수만·0·1 차이)를 원본 수로 가려내고,
       새 문제에서 같은 종류의 오답을 만들어 원본의 오개념 코드를 그대로 단다. 자리 순서로 물려받으면 코드가 뜻과 어긋난다. */
    const NUMS = t => (String(t).match(/\d+/g) || []).map(Number);
    const orig = (() => { const oa = q.asset && typeof q.asset === 'object' ? q.asset : null;
      if (oa && oa.type === 'group_row') return {x:oa.groups[0].n, y:oa.groups[1].n, op:'add'};
      if (oa && oa.type === 'take_row') return {x:oa.n, y:oa.cross, op:'sub'};
      if (oa && oa.type === 'compare_groups') return {x:oa.rows[0].n, y:oa.rows[1].n, op:'sub'};
      const m = String(q.stem).match(/(\d+|□)\s*([+−])\s*(\d+|□)(?:\s*=\s*(\d+|□))?/);
      if (m){ const cor = (q.options || []).find(o => o.correct); const hv = cor ? Number(cor.t) : (q.answer ? Number(q.answer[0]) : null);
        const val = t => t === '□' ? hv : Number(t);
        return {x:val(m[1]), y:val(m[3]), op:m[2] === '+' ? 'add' : 'sub', res:m[4] !== undefined ? val(m[4]) : null, front:m[1] === '□', miss:/□/.test(m[0])}; }
      const ns = NUMS(q.stem); return {x:ns[0], y:ns[1], op:(S.op === 'sub' ? 'sub' : 'add')}; })();
    const candMap = (cx, cy, cop, miss, front) => { const an = cop === 'add' ? cx + cy : cx - cy;
      if (miss){ const hid = front ? cx : cy, known = front ? cy : cx;
        return {ans:hid, m:{whole:an, swap:cop === 'add' ? an + known : (front ? Math.abs(an - cy) : cx + an), one:known, off1:hid + 1, off2:hid - 1}}; }
      const zero = cx === 0 || cy === 0 || (cop === 'sub' && cx === cy);
      return {ans:an, zero, m:{zero:zero ? 0 : null, swap:cop === 'add' ? Math.abs(cx - cy) : cx + cy, took:cop === 'sub' ? cy : null, one:cop === 'add' ? Math.max(cx, cy) : cx, off1:an + 1, off2:an - 1}}; };
    const ORDER = ['zero', 'swap', 'took', 'one', 'whole', 'off1', 'off2'];
    const inherit = (newMap, newAns) => {
      const om = candMap(orig.x, orig.y, orig.op, !!orig.miss, !!orig.front);
      const wrongs = (q.options || []).filter(o => !o.correct); const used = [String(newAns)]; const out = [];
      wrongs.slice(0, want).forEach(o => { const w = Number(o.t); let kind = null;
        for (const k of ORDER){ if (om.m[k] !== null && om.m[k] !== undefined && om.m[k] === w && w !== om.ans){ kind = k; break; } }
        const tries = [kind ? newMap[kind] : null, newMap.off1, newMap.off2, newAns + 2, newAns + 3];
        for (const c of tries){ if (c === null || c === undefined || c < 0 || c > 18) continue; if (used.indexOf(String(c)) >= 0) continue; used.push(String(c)); out.push({t:String(c), mis:o.mis || o.mis_target || dflt}); break; } });
      return [{t:String(newAns), correct:true}].concat(out); };
    if (ask === 'missing'){
      const front = !pic && r() < 0.3;
      const hid = front ? x : y;
      const IGA2 = n => VOWEL_END(n) ? '가' : '이';
      v.stem = front ? `□ ${sg} ${y} = ${ans} 에서 □에 알맞은 수는 무엇인가요?` : `${x} ${sg} □ = ${ans} 에서 □에 알맞은 수는 무엇인가요?`;
      if (q.kind === 'sa') v.answer = [String(hid)];
      else v.options = inherit(candMap(x, y, op, true, front).m, hid);
      v.explanation = [op === 'add' ? `${front ? y : x}에 무엇을 더해야 ${ans}${IGA2(ans)} 될까요?` : (front ? `어떤 수에서 ${y}${EUL(y)} 빼야 ${ans}${IGA2(ans)} 될까요?` : `${x}에서 얼마를 빼야 ${ans}${IGA2(ans)} 될까요?`),
                       `${x} ${sg} ${y} = ${ans} — □는 ${hid}${IEYO(hid)}.`, '□에 답을 넣어 식이 맞는지 다시 계산해 보세요.'];
      return v;
    }
    if (ask === 'check' || q.kind === 'ox'){
      const hasZero = x === 0 || y === 0 || (op === 'sub' && x === y);
      const truth = r() < 0.5; const wrong = hasZero ? (ans === 0 ? x : 0) : (op === 'add' ? (Math.abs(x - y) !== ans ? Math.abs(x - y) : ans + 1) : (y > 0 ? x + y : ans + 1));
      const said = truth ? ans : wrong;
      v.stem = pic ? `그림을 식으로 나타내면 ${x} ${sg} ${y} = ${said} 입니다.` : `${x} ${sg} ${y} = ${said} 입니다.`;
      v.answer = truth ? 'O' : 'X';
      const IGA = n => VOWEL_END(n) ? '가' : '이';
      v.reason_options = [{t: op === 'add' ? `${x}${GW(x)} ${y}${EUL(y)} 모으면 ${ans}${IGA(ans)} 되니까` : `${x}에서 ${y}${EUL(y)} 빼면 ${ans}${IGA(ans)} 되니까`, correct:true},
                          {t: hasZero ? (ans === 0 ? '빼도 처음 수 그대로 남으니까' : '0이 있는 식은 답이 늘 0이니까') : (op === 'add' ? '두 수 가운데 큰 수가 답이니까' : '뺄셈도 두 수를 모으는 것이니까'), mis:dflt}];
      v.explanation = [expl[0], truth ? `${said}${IEYO(said)} — 맞아요.` : `${said}${EUN(said)} 틀렸어요. 바른 답은 ${ans}${IEYO(ans)}.`, expl[2]];
      return v;
    }
    if (ask === 'expr'){
      const ok = `${x} ${sg} ${y} = ${ans}`;
      const NEW = {swap: op === 'add' ? `${Math.max(x, y)} − ${Math.min(x, y)} = ${Math.max(x, y) - Math.min(x, y)}` : `${x} + ${y} = ${x + y}`,
                   off: `${x} ${sg} ${y} = ${ans + 1}`,
                   num: op === 'add' ? `${x} + ${y + 1} = ${ans + 1}` : `${x} − ${y} = ${ans >= 1 ? ans - 1 : ans + 2}`};
      const okSign = (q.options || []).find(o => o.correct); const oSign = okSign && /−/.test(okSign.t) ? '−' : '+';
      const kindOf = t => { const sgn = /−/.test(t) ? '−' : '+'; if (sgn !== oSign) return 'swap'; const cn = NUMS(okSign.t), tn = NUMS(t); return (cn[0] === tn[0] && cn[1] === tn[1]) ? 'off' : 'num'; };
      v.stem = pic ? `그림에 알맞은 식은 어느 것인가요?` : `다음 이야기에 알맞은 식은 어느 것인가요?\n${story}`;
      const used = [ok]; const out = [];
      (q.options || []).filter(o => !o.correct).slice(0, want).forEach(o => { const k = kindOf(o.t);
        for (const c of [NEW[k], NEW.off, NEW.num, NEW.swap]){ if (used.indexOf(c) < 0){ used.push(c); out.push({t:c, mis:o.mis || dflt}); break; } } });
      v.options = [{t:ok, correct:true}].concat(out);
      v.explanation = [op === 'add' ? '모으거나 더 오는 이야기는 덧셈이에요.' : (cmpMode ? '두 수를 견주는 이야기도 뺄셈이에요.' : '덜어 내거나 없어지는 이야기는 뺄셈이에요.'), `알맞은 식은 ${ok}${IEYO(ans)}.`, '식의 두 수가 이야기의 어느 수인지 짚어 보세요.'];
      return v;
    }
    /* value · story */
    v.stem = ask === 'story' && !pic ? story : (picStem || `${x} ${sg} ${y}${EUN(y)} 얼마인가요?`);
    if (q.kind === 'sa') v.answer = [String(ans)];
    else v.options = inherit(candMap(x, y, op, false, false).m, ans);
    v.explanation = expl;
    return v;
  }
  return v;
}

/* ---------- 문항 전처리: 특수 발문을 에셋으로 ---------- */
function prep(q){
  const v = JSON.parse(JSON.stringify(q));
  if (v.kind === 'sa' && /규칙/.test(v.stem) && !v.asset){ v.asset = {type:'rule', cells:[1,2,3]}; v.stem = '점이 규칙대로 늘어나요. 다음 칸의 점은 몇 개인가요? 숫자로 쓰세요.'; }
  if (v.kind === 'essay' && /왼쪽 상자/.test(v.stem) && !v.asset){ v.asset = {type:'pair_boxes', left:2, right:3}; v.stem = '왼쪽 상자와 오른쪽 상자의 공은 모두 몇 개인가요? 숫자를 쓰고, 어떻게 세었는지 말해 보세요.'; }
  if (v.kind === 'error' && !v.asset){ const m = v.stem.match(/(\p{Emoji_Presentation}|●)\1*/u); if (m){ v.asset = m[0].startsWith('●') ? {type:'dots', n:m[0].length} : {type:'count_group', item:[...m[0]][0], n:[...m[0]].length}; v.stem = v.stem.replace(/\s?(\p{Emoji_Presentation}|●)+\s?(를|을)?/u, ' 그림을 ').replace(/ {2,}/g, ' ').replace(/^ /, ''); } }
  if (v.kind === 'ox' && !v.asset){ const m = v.stem.match(/\p{Emoji_Presentation}+/u); if (m && !/보다/.test(v.stem)){ v.asset = {type:'count_group', item:[...m[0]][0], n:[...m[0]].length}; v.stem = v.stem.replace(m[0], '이 그림'); } }
  return v;
}

/* ---------- 상태 ---------- */
let DATA, Q = [], idx = 0, state = { answers: {}, started: 0, retry: false };
function save(){ try { localStorage.setItem(STORE, JSON.stringify({idx, answers: state.answers, retry: state.retry})); } catch(e){} }
function load(){ try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e){ return null; } }

const app = document.getElementById('app');
/* 정본은 둘 중 하나 — 파일(자기주도·미리보기) 또는 원장(교사가 조립한 쪽지).
   어느 쪽이든 아래 렌더러가 받는 모양은 같다. */
const source = QUIZ
  ? new Promise(res => {
      const wait = () => window.keduQuiz ? res(window.keduQuiz.load(QUIZ)) : setTimeout(wait, 150);
      wait();
    })
  : fetch(`data/${SET}.json`).then(r => r.json());
if (!QUIZ) fetch('data/_concepts.json').then(r => r.json()).then(d => { window.__MISDIC = d; }).catch(() => {});   /* 마무리 「연습할 것」 이름용, 실패해도 그만 */

source.then(d => {
  if (!d) throw new Error('no-set');
  DATA = d;
  // 학년 띠 — 1~2 low · 3~4 mid · 5~6 high(기본). grade 가 없으면 header 의 「N학년」을 읽는다.
  try { const g = +d.grade || +((String(d.header || '').match(/(\d)학년/) || [])[1]) || 0; document.documentElement.dataset.band = g && g <= 2 ? 'low' : g && g <= 4 ? 'mid' : 'high'; } catch(e){}
  if (QUIZ && !PREVIEW && d.closed){   // 마감된 세트는 종이 인쇄도 학생에게는 닫힌다
    app.innerHTML = `<div class="cover"><h1>${esc(d.title || '단원 정리')}</h1><p>응시가 마감됐어요.${d.reveal ? ' 결과는 「내 학습」에서 볼 수 있어요.' : ' 선생님이 결과를 열면 볼 수 있어요.'}</p><div class="alt"><a href="${BACK.href}">${esc(BACK.label)}</a></div></div>`;
    return;
  }
  MODE === 'paper' ? renderPaper() : start();
}).catch(() => {
  app.innerHTML = QUIZ
    ? `<div class="cover"><h1>쪽지를 열 수 없어요</h1><p>선생님이 아직 열지 않았거나, 이미 닫힌 쪽지예요.</p><div class="alt"><a href="/">케이에듀 홈</a></div></div>`
    : `<div class="cover"><h1>학습지를 찾을 수 없어요</h1><p>주소의 set 값을 확인해 주세요: ${esc(SET)}</p></div>`;
});

function start(){
  Q = DATA.questions.map(prep); const saved = load();
  if (saved && Object.keys(saved.answers || {}).length && Object.keys(saved.answers).length < Q.length){ state.answers = saved.answers; idx = Math.min(saved.idx, Q.length - 1); renderCover(true); }
  else renderCover(false);
}
function renderCover(resume){
  const done = Object.keys(state.answers).length;
  app.innerHTML = `<div class="cover"><div class="badge">${KINDNAME(DATA.kind)}</div>
   <h1>${esc(DATA.title.replace(/ — .*/, ''))}</h1><p>${esc(DATA.header || '1학년 수학')} · ${Q.length}문제</p>
   ${resume ? `<p>${done}번까지 풀었어요. 이어서 할까요?</p><div class="row"><button class="big" data-nav="resume">이어서 풀기</button><button class="big ghost" data-nav="restart">처음부터</button></div>` : `<button class="big" data-nav="resume">시작</button>`}
   <div class="alt">${QUIZ ? (PREVIEW ? '' : `<a href="play.html?quiz=${QUIZ}&mode=paper">종이로 풀기(인쇄)</a><span>·</span>`) : `<a href="play.html?set=${SET}&mode=paper">시험지(A4)로 풀기</a><span>·</span><a href="./">학습지 목록</a><span>·</span>`}<a href="${BACK.href}">${esc(BACK.label)}</a></div></div>`;

}

/* ---------- 문항 화면 ---------- */
function renderQ(){
  const q = Q[idx]; const r = rng(mixSeed(SEED * 97 + idx)); state.started = Date.now();
  app.innerHTML = `<div class="bar"><a class="home" href="${BACK.href}" title="${esc(BACK.label)}" aria-label="${esc(BACK.label)}">🏠</a><button class="back" data-nav="back">← 앞으로</button><div class="dots">${Q.map((_, i) => `<i class="${i === idx ? 'now' : state.answers[i] ? (state.answers[i].ok ? 'done' : (state.answers[i].pending ? 'done' : 'wrong')) : ''}"></i>`).join('')}</div><button class="tts ${TTS.on ? 'on' : ''}" data-nav="tts" aria-label="읽어주기">🔊</button></div>
   <div class="q"><span class="num">${idx + 1}번${q.variant ? ' · 다시' : ''}</span><div class="stem" id="stem">${esc(q.stem)}</div><div class="asset">${drawAsset(q.asset, r)}</div><div id="ans"></div><div id="fb"></div></div>`;

  TTS.speak(q.stem);
  const prev = state.answers[idx];
  const ans = document.getElementById('ans');
  ({mc:widgetMC, error:widgetMC, blank:widgetMC, data:widgetMC, sa:widgetSA, ox:widgetOX, match:widgetMatch, essay:widgetEssay}[q.kind] || widgetMC)(q, ans, r, prev);
}
function grade(q, ok, detail){
  const t = Math.round((Date.now() - state.started) / 1000); state.answers[idx] = Object.assign({ok, t}, detail || {}); save();
  if (!detail?.pending){
    if (QUIZ && window.keduQuiz){
      if (!PREVIEW) try { window.keduQuiz.record({ questionId: q.qcode || `q${q.seq}`, qid: q.qid || null,
                                     ok, sec: t, concept: q.concept, mis: detail?.mis || null,
                                     pending: !!(detail && detail.pending), text: (detail && detail.pending) ? String(detail.val || '') : null,
                                     points: q.points || 1 }); } catch(e){}
    } else if (window.kedu && window.kedu.recordAnswer){
      // 파일 학습지 — 문항 키는 차시와 같은 문법(q{seq}), 개념·오개념 코드 동봉
      try { window.kedu.recordAnswer(`q${q.seq}`, ok, t, q.concept, {mis: (detail && detail.mis) || null}); } catch(e){}
    }
  }
  showFB(q, ok, detail);
}
function showFB(q, ok, detail){
  const fb = document.getElementById('fb'); const pending = detail && detail.pending;
  if (!canReveal()){
    // 마감 후 공개 — 정오도 해설도 색도 없다. 답을 받았다는 사실만.
    // 위젯이 이미 칠한 정답 표시를 전부 걷는다(선택지·OX·단답 상자·연결선). 단답은 「내 답 → 정답」 노출도 지운다.
    document.querySelectorAll('.opt, .ox, .answer-box, .mi, .match svg line').forEach(el => el.classList.remove('ok', 'no'));
    const abox = document.getElementById('box'); if (abox && detail && detail.val != null) abox.textContent = detail.val;
    fb.innerHTML = `<div class="fb wait"><h3>답을 적었어요</h3><p>선생님이 결과를 열면 맞았는지 볼 수 있어요.</p>
     <div class="next"><button class="big" data-nav="next">${idx < Q.length - 1 ? '다음' : '끝내기'}</button></div></div>`;
    TTS.speak('답을 적었어요. 다음 문제로 가요.');
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    return;
  }
  const title = pending ? '선생님이 확인해요' : ok ? '맞았어요' : '다시 생각해 볼까요';
  const exp = q.explanation || [];
  fb.innerHTML = `<div class="fb ${pending ? 'wait' : ok ? 'ok' : 'no'}"><h3>${title}</h3>${exp.slice(0, ok ? 1 : 3).map(s => `<p>${esc(s)}</p>`).join('')}
   <div class="next"><button class="big" data-nav="next">${idx < Q.length - 1 ? '다음' : '끝내기'}</button></div></div>`;
  TTS.speak(title + '. ' + exp.slice(0, ok ? 1 : 2).join(' '));
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* 문항이 오개념 코드를 직접 안 달았을 때(선긋기·OX 의 O/X 자체가 틀림) 쓸 코드 —
   ① q.mis ② 같은 세트·같은 개념의 다른 문항 보기가 단 코드 ③ 없으면 null (옛 'M01' 은 1학기 전용 코드라 다른 단원에선 거짓 태그였다. 2026-09-29) */
function misFor(q){
  if (q.mis) return q.mis;
  for (const x of (Q || [])){ if (x.concept !== q.concept) continue;
    for (const o of ((x.options || []).concat(x.reason_options || []))){ const c = o.mis || o.mis_target; if (c) return c; } }
  return null;
}
/* 객관식 계열 */
function widgetMC(q, el, r, prev){
  const opts = shuffle(q.options.map((o, i) => Object.assign({i}, o)), r); const visual = opts.some(o => typeof o.t === 'object');
  el.innerHTML = `<div class="opts ${visual ? '' : ''}">${opts.map((o, k) => `<button class="opt" data-i="${o.i}"><span class="mark">${['①','②','③','④'][k]}</span><span>${optLabel(o.t)}</span></button>`).join('')}</div>`;
  const btns = [...el.querySelectorAll('.opt')];
  const finish = (chosen) => { btns.forEach(b => { b.disabled = true; const o = q.options[b.dataset.i]; if (o.correct) b.classList.add('ok'); else if (Number(b.dataset.i) === chosen) b.classList.add('no'); }); };
  if (prev){ finish(prev.chosen); showFB(q, prev.ok, prev); return; }
  btns.forEach(b => b.onclick = () => { const o = q.options[b.dataset.i]; finish(Number(b.dataset.i)); grade(q, !!o.correct, {chosen:Number(b.dataset.i), mis:o.mis || null}); });
  if (visual) setTimeout(() => TTS.speak(opts.map((o, k) => `${k+1}번 ${optText(o.t)}`).join(', ')), 1200);
}
/* 단답(숫자판) */
function widgetSA(q, el, r, prev){
  const numeric = q.answer.every(a => /^\d+$/.test(a)); let val = prev ? prev.val : '';
  el.innerHTML = `<div class="pad-wrap"><div class="answer-box" id="box">${esc(val) || '&nbsp;'}</div>${numeric ? `<div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="fn" data-n="del">지우기</button><button class="go" data-n="go">확인</button></div>` : `<textarea id="ta" placeholder="여기에 답을 써요">${esc(val)}</textarea><div class="confirm"><button class="big" id="go">확인</button></div>`}</div>`;
  const box = document.getElementById('box');
  const finish = (ok) => { box.classList.add(ok ? 'ok' : 'no'); box.textContent = val; el.querySelectorAll('button').forEach(b => b.disabled = true); if (!ok) box.textContent = `${val} → ${q.answer[0]}`; };
  if (prev){ finish(prev.ok); showFB(q, prev.ok, prev); return; }
  const check = () => { if (!val.trim()) return; const norm = s => s.replace(/[\s.!?,。]/g, '');   /* 띄어쓰기·마침표는 답에 안 친다 (국어 단답, 2026-09-29) */ const ok = q.answer.some(a => norm(a) === norm(val)); finish(ok); grade(q, ok, {val}); };
  if (numeric) el.querySelectorAll('.pad button').forEach(b => b.onclick = () => { const n = b.dataset.n; if (n === 'del') val = val.slice(0, -1); else if (n === 'go') return check(); else if (val.length < 4) val += n;   /* v3.8 — 네 자리까지(세 자리 곱·덧셈 답, 2026-10-19) */ box.textContent = val || '\u00a0'; });
  else { const ta = document.getElementById('ta'); ta.oninput = () => val = ta.value; document.getElementById('go').onclick = check; }
}
/* OX + 근거 (2단) */
function widgetOX(q, el, r, prev){
  const reasons = shuffle(q.reason_options.map((o, i) => Object.assign({i}, o)), r);
  el.innerHTML = `<div class="oxrow"><button class="ox" data-v="O">O</button><button class="ox" data-v="X">X</button></div><div id="reason" style="display:none"><div class="reason-label">왜 그렇게 생각했나요?</div><div class="opts">${reasons.map((o, k) => `<button class="opt" data-i="${o.i}"><span class="mark">${['①','②'][k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div></div>`;
  const oxb = [...el.querySelectorAll('.ox')], rb = [...el.querySelectorAll('.opt')]; let chosenOX = null;
  const finish = (ox, ri) => { oxb.forEach(b => { b.disabled = true; if (b.dataset.v === q.answer) b.classList.add('ok'); else if (b.dataset.v === ox) b.classList.add('no'); }); document.getElementById('reason').style.display = '';
    rb.forEach(b => { b.disabled = true; const o = q.reason_options[b.dataset.i]; if (o.correct) b.classList.add('ok'); else if (Number(b.dataset.i) === ri) b.classList.add('no'); }); };
  if (prev){ finish(prev.ox, prev.reason); showFB(q, prev.ok, prev); return; }
  oxb.forEach(b => b.onclick = () => { chosenOX = b.dataset.v; oxb.forEach(x => x.classList.toggle('sel', x === b)); document.getElementById('reason').style.display = ''; TTS.speak('왜 그렇게 생각했나요? ' + reasons.map(o => o.t).join(', 아니면 ')); });
  rb.forEach(b => b.onclick = () => { if (!chosenOX) return; const o = q.reason_options[b.dataset.i]; const ok = chosenOX === q.answer && !!o.correct; finish(chosenOX, Number(b.dataset.i)); grade(q, ok, {ox:chosenOX, reason:Number(b.dataset.i), mis:o.mis || (chosenOX !== q.answer ? misFor(q) : null)}); });
}
/* 연결하기 */
function widgetMatch(q, el, r, prev){
  const L = q.pairs.map((p, i) => ({i, v:p.l})), R = shuffle(q.pairs.map((p, i) => ({i, v:p.r})), r);
  el.innerHTML = `<div class="match" id="m"><div class="col">${L.map(x => `<button class="mi l" data-i="${x.i}">${optLabel(x.v)}</button>`).join('')}</div><div></div><div class="col">${R.map(x => `<button class="mi r" data-i="${x.i}">${optLabel(x.v)}</button>`).join('')}</div><svg id="lines"></svg></div><div class="confirm"><button class="big" id="go" disabled>확인</button></div>`;
  const wrap = document.getElementById('m'), svg = document.getElementById('lines'), go = document.getElementById('go'); let selL = null; const links = {};
  const draw = (grading) => { svg.innerHTML = ''; const wb = wrap.getBoundingClientRect();
    Object.entries(links).forEach(([li, ri]) => { const a = wrap.querySelector(`.l[data-i="${li}"]`).getBoundingClientRect(), b = wrap.querySelector(`.r[data-i="${ri}"]`).getBoundingClientRect();
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'); ln.setAttribute('x1', a.right - wb.left); ln.setAttribute('y1', a.top + a.height/2 - wb.top); ln.setAttribute('x2', b.left - wb.left); ln.setAttribute('y2', b.top + b.height/2 - wb.top);
      if (grading) ln.setAttribute('class', li === ri ? 'ok' : 'no'); svg.appendChild(ln); }); };
  const finish = () => { wrap.querySelectorAll('.mi').forEach(b => b.disabled = true); Object.entries(links).forEach(([li, ri]) => { const ok = li === ri; wrap.querySelector(`.l[data-i="${li}"]`).classList.add(ok ? 'ok' : 'no'); wrap.querySelector(`.r[data-i="${ri}"]`).classList.add(ok ? 'ok' : 'no'); }); draw(true); go.disabled = true; };
  if (prev){ Object.assign(links, prev.links); finish(); showFB(q, prev.ok, prev); return; }
  wrap.querySelectorAll('.l').forEach(b => b.onclick = () => { selL = b.dataset.i; wrap.querySelectorAll('.l').forEach(x => x.classList.toggle('sel', x === b)); });
  wrap.querySelectorAll('.r').forEach(b => b.onclick = () => { if (selL === null) return; const ri = b.dataset.i; Object.keys(links).forEach(k => { if (links[k] === ri) delete links[k]; }); links[selL] = ri;
    wrap.querySelectorAll('.l').forEach(x => x.classList.toggle('done', x.dataset.i in links)); wrap.querySelectorAll('.r').forEach(x => x.classList.toggle('done', Object.values(links).includes(x.dataset.i)));
    wrap.querySelectorAll('.l').forEach(x => x.classList.remove('sel')); selL = null; draw(false); go.disabled = Object.keys(links).length < q.pairs.length; });
  go.onclick = () => { const ok = Object.entries(links).every(([a, b]) => a === b); finish(); grade(q, ok, {links:Object.assign({}, links), mis: ok ? null : misFor(q)}); };
  window.addEventListener('resize', () => draw(!!state.answers[idx]));
}
/* 서술형 — 교사 채점 */
function widgetEssay(q, el, r, prev){
  el.innerHTML = `<textarea id="ta" placeholder="여기에 써요. 말로 해도 좋아요.">${prev ? esc(prev.val) : ''}</textarea><div class="confirm"><button class="big" id="go">보내기</button></div>`;
  const ta = document.getElementById('ta'), go = document.getElementById('go');
  if (prev){ ta.disabled = true; go.disabled = true; showFB(q, false, prev); return; }
  go.onclick = () => { if (!ta.value.trim()) return; ta.disabled = true; go.disabled = true; grade(q, false, {pending:true, val:ta.value}); };
}

/* ---------- 마무리: 도장 + 막힌 개념 하나 + 다시 해볼까? ---------- */
/* 케이박스 결과봉투 — 카드에서 들어온 쪽지는 끝낼 때 한 번 제출(어댑터가 이중 제출·밖에서 열림을 알아서 막음) */
function kboxDone(okN, total){
  if (!QUIZ || PREVIEW || !window.KBox || !window.KBox.active) return;
  try { Promise.resolve(window.KBox.submit({ tool: 'quiz', kind: 'auto', score: okN, max: total, detail: { quiz: QUIZ } })).catch(function(){}); } catch(e){}
}
function renderFinish(){
  const all = Q.map((q, i) => ({q, a: state.answers[i] || {}})); const wrong = all.filter(x => !x.a.ok && !x.a.pending); const pend = all.filter(x => x.a.pending).length; const okN = all.filter(x => x.a.ok).length;
  if (!canReveal()){
    // 마감 후 공개: 기록은 그대로 남기되(교사가 본다) 학생에겐 「보냈어요」만. 점수·틀린 문항·다시 해볼까 없음.
    app.innerHTML = `<div class="finish"><div class="stamp">끝까지 했어요<small>${new Date().getMonth()+1}월 ${new Date().getDate()}일</small></div><h2>${esc(DATA.title.replace(/ — .*/, ''))}</h2>
     <p>${Q.length}문제를 모두 적어서 선생님께 보냈어요.<br>선생님이 결과를 열면 맞았는지 볼 수 있어요.</p>
     <div class="alt"><a href="${BACK.href}">${esc(BACK.label)}</a></div></div>`;
    if (QUIZ && window.keduQuiz && !PREVIEW) try { window.keduQuiz.recordEnd(okN, Q.length, null); } catch(e){}
    kboxDone(okN, Q.length);
    TTS.speak(`끝까지 했어요. ${Q.length}문제를 모두 적어서 선생님께 보냈어요.`);
    window.__retryFrom = [];
    return;
  }
  const misCount = {}; wrong.forEach(x => { if (x.a.mis) misCount[x.a.mis] = (misCount[x.a.mis] || 0) + 1; }); const topMis = Object.entries(misCount).sort((a, b) => b[1] - a[1])[0];
  const MISFALLBACK = {M01:'하나씩 짚으며 빠짐없이 세기', M02:'수를 바르게 읽기', M03:'마지막에 센 수가 모두의 수예요', M05:'묻는 줄부터 찾기', M06:'수의 순서 익히기', M10:'크기 말고 개수로 세기'};
  /* 파일 학습지는 _concepts.json 의 practice(아이 말 한 줄) → text 순으로 읽는다 — MISFALLBACK 은 1학기 수학 코드뿐이라 다른 단원에선 「다시 차근차근 세기」가 거짓으로 떴다 (2026-09-29) */
  const MISDIC = (window.__MISDIC && window.__MISDIC.misconceptions) || {};
  const MISNAME = new Proxy({}, { get: (_, k) => (QUIZ && window.keduQuiz && window.keduQuiz.misName(k)) || MISFALLBACK[k] || (MISDIC[k] && (MISDIC[k].practice || MISDIC[k].text)) || null });
  const label = wrong.length === 0 ? '참 잘했어요' : wrong.length <= 2 ? '잘했어요' : '끝까지 했어요';
  app.innerHTML = `<div class="finish"><div class="stamp">${label}<small>${new Date().getMonth()+1}월 ${new Date().getDate()}일</small></div><h2>${esc(DATA.title.replace(/ — .*/, ''))}</h2>
   <p>${Q.length}문제 중 ${okN}문제를 맞혔어요${pend ? ` · ${pend}문제는 선생님이 확인해요` : ''}</p>
   ${topMis ? `<div class="weak">이번에 연습할 것 하나 — <b>${MISNAME[topMis[0]] || (DATA.subject === 'math' ? '다시 차근차근 세기' : '틀린 문제를 다시 읽어 보기')}</b></div>` : ''}
   <div class="row">${wrong.length ? `<button class="big" data-nav="retry">다시 해볼까? (${wrong.length})</button>` : ''}<button class="big ghost" data-nav="again">처음부터</button></div>
   <div class="alt">${QUIZ ? '' : `<a href="play.html?set=${SET}&mode=paper">시험지(A4)로 풀기</a><span>·</span><a href="./">학습지 목록</a><span>·</span>`}<a href="${BACK.href}">${esc(BACK.label)}</a></div></div>`;
  if (QUIZ && window.keduQuiz && !PREVIEW) try { window.keduQuiz.recordEnd(okN, Q.length, null); } catch(e){}
  if (!state.retry) kboxDone(okN, Q.length);
  TTS.speak(`${label}. ${Q.length}문제 중 ${okN}문제를 맞혔어요.` + (topMis ? ` 이번에 연습할 것은 ${MISNAME[topMis[0]] || ''}` : ''));
  // 세트 끝 기록 — 한 판(전체)만 회차로 센다. '다시 해볼까?'(부분 재출제)는 문항 기록만 남는다.
  if (!state.retry && window.kedu && window.kedu.recordLessonEnd) try { window.kedu.recordLessonEnd(okN, Q.length); } catch(e){}
  window.__retryFrom = wrong;
}

/* ---------- 네비게이션: 이벤트 위임 (다시 그려도 핸들러가 사라지지 않는다) ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  const act = b.dataset.nav;
  if (act === 'next'){ if (idx < Q.length - 1){ idx++; save(); renderQ(); } else renderFinish(); }
  else if (act === 'back'){ if (idx > 0){ idx--; save(); renderQ(); } else renderCover(Object.keys(state.answers).length > 0); }
  else if (act === 'tts'){ TTS.on = !TTS.on; b.classList.toggle('on', TTS.on); try { localStorage.setItem('kedu_ws_tts', TTS.on ? '1' : '0'); } catch(e){} if (TTS.on) TTS.speak(Q[idx] && Q[idx].stem); else if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  else if (act === 'resume'){ renderQ(); }
  else if (act === 'restart' || act === 'again'){ Q = DATA.questions.map(prep); state.answers = {}; idx = 0; state.retry = false; save(); renderQ(); }
  else if (act === 'retry'){ const wrong = window.__retryFrom || []; if (!wrong.length) return; const r = rng(Date.now() & 0xffff);
    Q = wrong.map(x => prep(makeVariant(DATA.questions[x.q.seq - 1], r))); state.answers = {}; idx = 0; state.retry = true; save(); renderQ(); }
});

/* ===================== 종이(A4) 모드 ===================== */
function paperAsset(a){
  if (!a) return ''; if (typeof a === 'string') return '';
  switch (a.type){
    case 'count_group': case 'scatter_group': return `<div class="passet">${a.item.repeat(a.n)}</div>`;
    case 'dots': return `<div class="passet small">${'●'.repeat(a.n)}</div>`;
    case 'hidden_group': return `<div class="passet">${a.item.repeat(a.visible)}<span class="pbox">?</span></div>`;
    case 'picto_table': return `<table class="picto-p">${a.rows.map(rw => `<tr><td>${esc(rw.label)}</td><td>${rw.item.repeat(rw.n)}</td></tr>`).join('')}</table>`;
    case 'rule': return `<div class="passet small">${a.cells.map(n => '●'.repeat(n)).join(' → ')} → <span class="pbox">&nbsp;&nbsp;</span></div>`;
    case 'pair_boxes': return `<div class="passet small"><span class="pbox">${'●'.repeat(a.left)}</span> <span class="pbox">${'●'.repeat(a.right)}</span></div>`;
    case 'number_line': return `<div class="pnum">${a.cells.map(c => c === null || c === '?' ? `<span class="blank">&nbsp;</span>` : `<span>${esc(c)}</span>`).join('')}</div>`;
    case 'ordinal_row': return `<div class="pord">${a.items.map((it, i) => `<span class="${a.mark === i + 1 ? 'mk' : ''}">${it}</span>`).join('')}<span style="font-size:12px;letter-spacing:0"> (왼쪽 → 오른쪽)</span></div>`;
    case 'compare_groups': return `<div class="pcmp">${a.rows.map(rw => `<div><b>${esc(rw.label)}</b> ${rw.item.repeat(rw.n)}</div>`).join('')}</div>`;
    case 'bundle_ones': { const t = Math.max(0, Number(a.tens) || 0), o = Math.max(0, Number(a.ones) || 0);
      return `<div class="pbund">${bundleSVG(t, o)}<em>(막대 = 10개씩 묶음, ● = 낱개)</em></div>`; }
    case 'hundred_chart': { const hi = (a.hi || []).map(Number);
      return `<div class="pchart" style="grid-template-columns:repeat(${a.cols || 10},1fr)">${a.cells.map(c => (c === null || c === '?') ? `<span class="blank">&nbsp;</span>` : `<span class="${hi.indexOf(Number(c)) >= 0 ? 'hi' : ''}">${esc(c)}</span>`).join('')}</div>`; }
    case 'vert': { const T = Number(a.top) || 0, Bt = Number(a.bottom) || 0; const op = a.op === '-' ? '−' : '+';
      const dg = n => [Math.floor(n / 10), n % 10];
      const cell = x => (x === null || x === undefined || x === '?') ? '<span class="blank">&nbsp;</span>' : (x === '' ? '<span class="none"></span>' : `<span>${x}</span>`);
      const [t1, o1] = dg(T), [t2, o2] = dg(Bt);
      const ansCells = (a.ans === null || a.ans === undefined) ? [null, null] : (a.ans === 'hide' ? ['', ''] : dg(Number(a.ans)));
      return `<div class="pvert"><span class="none"></span><span class="h none">묶음</span><span class="h none">낱개</span><span class="none"></span>${cell(t1 || '')}${cell(o1)}<span class="none">${op}</span>${cell(t2 || '')}${cell(o2)}<div class="line"></div><span class="none"></span>${cell(ansCells[0] === 0 ? '' : ansCells[0])}${cell(ansCells[1])}</div>`; }
    case 'bundle_pair': { const one = b => bundleSVG(b.tens, b.ones);
      return `<div class="pbpair">${one(a.left || {})}<span class="opch">${a.op === '-' ? '−' : '+'}</span>${one(a.right || {})}<em>(막대 = 10개씩 묶음, ● = 낱개)</em></div>`; }
    case 'pattern_row': { const bl = x => x === null || x === undefined || x === '?';
      return `<div class="ppat">${(a.items || []).map((it, i) => bl(it) ? '<span class="blank">&nbsp;</span>' : `<span class="${a.mark === i + 1 ? 'mk' : ''}">${esc(it)}</span>`).join('')}</div>`; }
    case 'pattern_grid': { const bl = x => x === null || x === undefined || x === '?'; const rows = a.rows || []; const cols = Math.max.apply(null, rows.map(r2 => r2.length));

  const key = `<div class="sheet key-sheet"><div class="ph"><div><h1>${esc(title)} — 교사용</h1><div class="meta">정답 · 개념 · 오답 선택지의 오개념</div></div></div>
   <table class="key"><tr><th>번호</th><th>난이도</th><th>유형</th><th>정답</th><th>개념</th><th>오답 → 오개념</th></tr>${shuffled.map((x, i) => { const q = x.q; let ans = '';
     if (q.kind === 'sa') ans = esc(q.answer.join(' / ')); else if (q.kind === 'essay') ans = esc(typeof q.answer_guide === 'string' ? q.answer_guide : (q.answer_guide.answer + ' (채점: ' + (q.answer_guide.scoring_points || []).join(' · ') + ')')); else if (q.kind === 'match') ans = q.pairs.map(p => `${paperOptText(p.l)}–${paperOptText(p.r)}`).join(', ');
     else if (q.kind === 'ox') ans = q.answer + ' / ' + circ[q.reason_options.findIndex(o => o.correct)]; else ans = circ[x.opts.findIndex(o => o.correct)] + ' ' + paperOptText(x.opts.find(o => o.correct).t);
     const mis = q.options ? x.opts.map((o, k) => o.mis ? `${circ[k]}→${o.mis}` : '').filter(Boolean).join(' ') : (q.reason_options ? q.reason_options.filter(o => o.mis).map(o => o.mis).join(' ') : '');
     return `<tr><td>${i + 1}</td><td>D${q.difficulty}</td><td>${q.kind}</td><td>${ans}</td><td>${q.concept}</td><td>${mis}</td></tr>`; }).join('')}</table>
   <p style="font-size:12px;color:#555;margin-top:14px">오개념 코드의 뜻은 단원마다 다르다 — 정본: handoff/kedu/worksheet/&lt;단원&gt;/개념트리_오개념.md (1학기 1단원 M01~M11 · 2학기부터 M1-2-u1-X01 · 국어 K1-2-u1-X01 꼴)</p></div>`;
  // 학생(배정 세트, 미리보기 아님)은 정답표 없이 문제지만 — 정답·오개념표는 교사용(2026-10-16 준호: 학생도 종이 인쇄 가능하게)
  const STUDENT_PAPER = QUIZ && !PREVIEW;
  const toolbar = `<div class="toolbar"><button onclick="window.print()">인쇄 / PDF 저장</button><button onclick="location.href='${QUIZ ? `play.html?quiz=${QUIZ}${PREVIEW ? '&preview=1' : ''}` : `play.html?set=${SET}`}'">화면으로 풀기</button>${QUIZ ? '' : `<button onclick="location.href='./'">학습지 목록</button>`}<button onclick="location.href='${BACK.href}'">${esc(BACK.label)}</button></div>`;
  // 문항 수를 고정으로 자르지 않고, 실제 높이를 재서 A4 한 장 안에 들어가는 만큼만 싣는다.
  // (문항마다 그림·보기·답란 높이가 달라 고정 개수로는 아래로 넘친다)
  const measure = () => {
    const m = document.createElement('div'); m.className = 'sheet measure';
    m.innerHTML = page(shuffled, 0, 0).replace(/^<div class="sheet">/, '').replace(/<\/div>$/, '');
    document.body.appendChild(m);
    const body = m.querySelector('.pbody'); const cs = getComputedStyle(body);
    const avail = body.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4; // 4px 여유
    const hs = [...m.querySelectorAll('.pq')].map(el => el.getBoundingClientRect().height);
    document.body.removeChild(m); return {avail, hs};
  };
  const layout = () => {
    const {avail, hs} = measure(); const GAP = 34; // 문항 사이 간격(px) = .pbody gap 9mm
    const pages = []; let cur = [], used = 0;
    hs.forEach((h, i) => {
      const need = cur.length ? h + GAP : h;
      if (cur.length && used + need > avail){ pages.push({items: cur, used}); cur = []; used = 0; }
      cur.push(i); used += cur.length === 1 ? h : need;
    });
    if (cur.length) pages.push({items: cur, used});
    return pages.map((pg, n) => page(pg.items.map(i => shuffled[i]), pg.items[0], n + 1, pg.used < avail * 0.6)).join('');
  };
  const draw = () => { app.innerHTML = toolbar + layout() + (STUDENT_PAPER ? '' : key); };
  draw();
  // 웹폰트가 늦게 오면 글자 높이가 바뀌므로, 폰트가 다 오면 한 번 더 잰다.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
}
</script>
</body>

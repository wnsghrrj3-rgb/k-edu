<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>케이학습지</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--paper:#FBF9F5;--card:#FFFFFF;--ink:#2E3338;--ink-soft:#5A6169;--muted:#8B9199;
--rule:#E3DED4;--rule-strong:#CFC8BA;--tint:#F3F0EA;
--accent:#4A6480;--accent-soft:#E9EEF3;
--ok:#5E7F63;--ok-soft:#EDF2ED;--no:#A8695A;--no-soft:#F6EFEC;--wait:#8A7B57;--wait-soft:#F5F1E6;
--shadow:0 1px 2px rgba(46,51,56,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Gowun Dodum',sans-serif;min-height:100%;
 -webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding:14px 16px 48px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}

/* 상단 */
.bar{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.bar .home{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 12px;font-size:15px;text-decoration:none;color:var(--ink-soft);line-height:1}
.bar .home:hover{border-color:var(--rule-strong)}
.bar button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 14px;font-size:15px;color:var(--ink-soft)}
.bar button:hover{border-color:var(--rule-strong)}
.tts.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--rule);display:block}
.dots i.done{background:var(--ok)}.dots i.wrong{background:var(--no)}.dots i.now{background:var(--ink)}

/* 표지 */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:40px 0}
.cover .badge{font-family:'Gowun Batang',serif;font-size:15px;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);padding:9px 26px}
.cover h1{font-family:'Gowun Batang',serif;font-size:31px;margin:2px 0 0;line-height:1.4;font-weight:700}
.cover p{margin:0;color:var(--muted);font-size:17px}
.big{background:var(--ink);color:var(--paper);font-size:18px;padding:14px 34px;border-radius:10px;transition:background .12s}
.big:hover{background:#1F2429}
.big.ghost{background:var(--card);color:var(--ink-soft);border:1px solid var(--rule)}
.big.ghost:hover{background:var(--tint)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.alt{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);margin-top:6px}
.alt a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule-strong);padding-bottom:2px}
.alt a:hover{color:var(--ink);border-color:var(--ink)}

/* 문항 */
.q{background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:26px 24px 22px}
.q .num{display:block;font-size:13px;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
.stem{font-size:22px;line-height:1.6;white-space:pre-line}
.asset{margin:22px 0 4px;display:flex;justify-content:center}
.count{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:400px;font-size:42px;line-height:1}
.scatter{position:relative;width:100%;max-width:400px;height:180px;border:1px solid var(--rule);border-radius:10px;background:var(--tint)}
.scatter span{position:absolute;font-size:36px;line-height:1;transform:translate(-50%,-50%)}
.dotsv{display:inline-flex;gap:8px;font-size:24px;line-height:1;color:var(--ink)}
.hidden{display:flex;align-items:flex-end;gap:12px;font-size:38px;line-height:1}
.hidden .box{width:132px;height:84px;background:var(--tint);border:1px solid var(--rule-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:30px}
.picto{border-collapse:collapse;font-size:16px;background:var(--card);border:1px solid var(--rule-strong)}
.picto td{padding:10px 16px;border:1px solid var(--rule)}
.picto td:first-child{background:var(--tint);color:var(--ink-soft);min-width:82px;text-align:center}
.picto td:last-child{font-size:28px;letter-spacing:8px}
.rule{display:flex;align-items:center;gap:12px;font-size:20px;color:var(--ink-soft)}
.rule .cell{background:var(--card);border:1px solid var(--rule-strong);border-radius:8px;padding:12px 14px;min-width:72px;text-align:center;letter-spacing:4px}
.rule .cell.next{border-style:dashed;color:var(--muted)}
.pair-boxes{display:flex;gap:22px;font-size:24px;align-items:center;letter-spacing:6px}
.pair-boxes .b{background:var(--card);border:1px solid var(--rule-strong);border-radius:8px;padding:16px 20px}
.numline{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.numline .c{min-width:46px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--rule-strong);border-radius:8px;font-size:24px;font-family:'Gowun Batang',serif}
.numline .c.blank{border-style:dashed;color:var(--muted);background:var(--tint)}
.numline .c.mark{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ordrow{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:100%}
.ordrow .items{display:flex;gap:10px;font-size:34px;line-height:1}
.ordrow .items span{width:46px;text-align:center}
.ordrow .items span.mark{background:var(--accent-soft);border-radius:8px;outline:2px solid var(--accent)}
.ordrow .arrow{display:flex;justify-content:space-between;width:100%;font-size:14px;color:var(--muted)}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp .r{display:flex;align-items:center;gap:12px}
.cmp .r em{font-style:normal;font-size:16px;color:var(--ink-soft);min-width:62px;text-align:right}
.cmp .r .g{display:flex;gap:8px;font-size:30px;line-height:1}
.plate{display:flex;flex-direction:column;align-items:center;gap:8px}
.plate .tray{min-width:180px;min-height:86px;border:1px solid var(--rule-strong);border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px;padding:12px 18px}
.plate .tray.empty::after{content:'비어 있어요';font-size:15px;color:var(--muted)}
.plate em{font-style:normal;font-size:15px;color:var(--muted)}

/* 답 */
.opts{display:grid;gap:9px;margin-top:8px}
.opt{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:15px 16px;font-size:20px;text-align:left;display:flex;align-items:center;gap:14px;min-height:60px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--rule-strong);background:var(--tint)}
.opt .mark{width:26px;height:26px;border-radius:50%;border:1px solid var(--rule-strong);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no-soft)}.opt.no .mark{background:var(--no);border-color:var(--no);color:#fff}
.opt:disabled{cursor:default}
.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ox{font-size:34px;padding:16px;border-radius:10px;background:var(--card);border:1px solid var(--rule);color:var(--ink-soft)}
.ox:hover:not(:disabled){background:var(--tint)}
.ox.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ox.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}.ox.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.reason-label{font-size:15px;color:var(--muted);margin:10px 0 6px}
.pad-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.answer-box{min-width:132px;height:64px;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:34px}
.answer-box.ok{border-color:var(--ok);background:var(--ok-soft)}.answer-box.no{border-color:var(--no);background:var(--no-soft)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:380px}
.pad button{font-size:22px;padding:14px 0;border-radius:8px;background:var(--card);border:1px solid var(--rule)}
.pad button:hover:not(:disabled){background:var(--tint)}
.pad button.fn{color:var(--muted);font-size:15px}
.pad button.go{grid-column:span 2;background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:17px}
textarea{width:100%;font-family:inherit;font-size:19px;line-height:1.6;padding:14px;border:1px solid var(--rule);border-radius:10px;resize:vertical;min-height:104px;background:var(--tint);color:var(--ink)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--card)}
.match{display:grid;grid-template-columns:1fr 56px 1fr;gap:9px;position:relative}
.match .col{display:flex;flex-direction:column;gap:9px}
.mi{background:var(--card);border:1px solid var(--rule);border-radius:10px;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:21px}
.mi:hover:not(:disabled){background:var(--tint)}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}.mi.done{border-color:var(--rule-strong);background:var(--tint)}
.mi.ok{border-color:var(--ok);background:var(--ok-soft)}.mi.no{border-color:var(--no);background:var(--no-soft)}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.match svg line{stroke:var(--rule-strong);stroke-width:2}
.match svg line.ok{stroke:var(--ok)}.match svg line.no{stroke:var(--no)}
.confirm{margin-top:14px;display:flex;justify-content:flex-end}

/* 피드백 */
.fb{border-radius:12px;padding:18px 20px;margin-top:20px;border:1px solid var(--rule)}
.fb.ok{background:var(--ok-soft);border-color:#CBDBCC}.fb.no{background:var(--no-soft);border-color:#E4CFC7}.fb.wait{background:var(--wait-soft);border-color:#E0D6BC}
.fb h3{margin:0 0 8px;font-size:19px;font-weight:400}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--no)}.fb.wait h3{color:var(--wait)}
.fb p{margin:5px 0;font-size:17px;line-height:1.6;color:var(--ink-soft)}
.fb .next{margin-top:16px;display:flex;justify-content:flex-end}

/* 마무리 */
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:36px 0}
.stamp{width:132px;height:132px;border-radius:50%;border:1px solid var(--accent);box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--accent);color:var(--accent);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:'Gowun Batang',serif;font-size:19px;line-height:1.3;transform:rotate(-7deg)}
.stamp small{font-size:12px;letter-spacing:.08em}
.finish h2{font-family:'Gowun Batang',serif;font-size:25px;margin:10px 0 0;font-weight:700}
.finish p{margin:0;font-size:17px;color:var(--muted)}
.weak{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:16px 20px;font-size:17px;max-width:440px;text-align:left;color:var(--ink-soft)}
.weak b{color:var(--ink);font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.stem{font-size:20px}.count{font-size:36px}.opt{font-size:18px}.cover h1{font-size:26px}}

/* ===== 종이(A4) 모드 ===== */
body.paper{background:#fff}
.sheet{width:210mm;height:297mm;margin:0 auto;padding:16mm 17mm 16mm;background:#fff;color:#1A1A1A;font-family:'Gowun Dodum',sans-serif;position:relative;display:flex;flex-direction:column;overflow:hidden}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:4mm 0 8mm}
.sheet.key-sheet{display:block;height:auto;min-height:297mm}
.sheet+.sheet{page-break-before:always}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid #1A1A1A;padding-bottom:10px;margin-bottom:0;flex:none}
.ph h1{margin:0;font-size:20px;font-weight:400;font-family:'Gowun Batang',serif}
.ph .meta{font-size:12px;color:#666;margin-top:3px}
.ph .idbox{display:flex;gap:8px;font-size:12px;color:#444}.ph .idbox span{border:1px solid #999;padding:6px 16px;min-width:64px;text-align:center}
.pq{break-inside:avoid;margin:0;font-size:15.5px;line-height:1.75}
.pq .pn{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid #1A1A1A;text-align:center;line-height:20px;font-size:12px;margin-right:8px;vertical-align:middle}
.pq .pstem{white-space:pre-line;display:inline}
.pq .passet{margin:12px 0 10px 30px;font-size:26px;letter-spacing:10px;line-height:1.2}
.pq .passet.small{font-size:17px;letter-spacing:6px}
.pq .passet .pbox{display:inline-block;border:1px solid #1A1A1A;border-radius:4px;padding:5px 18px;font-size:15px;letter-spacing:0;vertical-align:middle;margin-left:8px}
.pq .popts{margin:10px 0 0 30px;display:flex;flex-wrap:wrap;gap:10px 30px;font-size:15.5px}
.pq .popts span::before{content:attr(data-n);display:inline-block;width:18px;height:18px;border:1px solid #666;border-radius:50%;text-align:center;line-height:16px;font-size:11px;margin-right:6px}
.pq .pline{margin:12px 0 2px 30px;height:26px;border-bottom:1px solid #999;width:52%}
.pq .pans{margin-top:10px;text-align:right;font-size:15px;color:#1A1A1A}
.pq .pans em{font-style:normal;color:#666;margin-right:6px}
.pq .pans .paren{display:inline-block;border-bottom:1px solid #1A1A1A;min-width:64px;text-align:center;margin:0 2px}
.pq .pans .paren.wide{min-width:96px}
.pq .pline.long{height:24px;width:100%;border-bottom:1px solid #999;margin-bottom:20px;box-shadow:0 24px 0 -23px #999,0 48px 0 -47px #999}
.pq .pmatch{margin:12px 0 2px 30px;display:grid;grid-template-columns:104px 64px 104px;row-gap:14px;font-size:17px;align-items:center}
.pq .pmatch .lft,.pq .pmatch .rgt{border:1px solid #999;border-radius:6px;text-align:center;padding:7px}
.pq .pmatch .mid{text-align:center;color:#AAA}
.pq .pnum{margin:10px 0 8px 30px;display:flex;gap:5px}
.pq .pnum span{min-width:26px;height:30px;border:1px solid #1A1A1A;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.pq .pnum span.blank{border-style:dashed}
.pq .pord{margin:10px 0 8px 30px;font-size:22px;letter-spacing:8px}
.pq .pord .mk{outline:1px solid #1A1A1A;border-radius:4px}
.pq .pcmp{margin:10px 0 8px 30px;font-size:13px;line-height:1.9}
.pq .pcmp b{font-weight:400;display:inline-block;min-width:52px}
.pq .pplate{margin:10px 0 8px 30px;border:1px solid #1A1A1A;border-radius:8px;display:inline-block;padding:8px 18px;font-size:20px;letter-spacing:8px;min-width:120px;text-align:center}
.pq .picto-p{border-collapse:collapse;margin:12px 0 4px 30px;font-size:14px}.pq .picto-p td{border:1px solid #999;padding:6px 12px}.pq .picto-p td:last-child{font-size:20px;letter-spacing:6px}
.pfoot{position:absolute;bottom:9mm;left:17mm;right:17mm;display:flex;justify-content:space-between;font-size:10px;color:#999}
.key{width:100%;border-collapse:collapse;font-size:12px}.key th,.key td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top}.key th{background:#F2F0EC;font-weight:400}
.toolbar{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:9}
.toolbar button{background:#2E3338;color:#fff;border-radius:8px;padding:9px 15px;font-size:14px}
@media print{.toolbar{display:none}.sheet{margin:0;box-shadow:none}@page{size:A4;margin:0}}
@media screen{body.paper{background:#8C8880;padding:22px 0}.sheet{box-shadow:0 2px 16px rgba(0,0,0,.25);margin-bottom:22px}}
</style>
</head>

<!-- 쪽지 모드(?quiz=)에서만 원장에 붙는다. 파일 학습지는 이 스크립트를 부르지 않는다. -->
<script>

}

<script>
/* ===================== 케이학습지 렌더러 v0.2 =====================
   URL: play.html?set=g1_math_u1_L01_basic[&mode=paper][&seed=123]
   문항 정본 = data/{set}.json (questions 행 형식). 화면·종이는 여기서만 그린다.
   seam: window.kedu.recordAnswer(questionId, isCorrect, timeSpentSec, conceptId) 있으면 호출.
=================================================================== */
const qs = new URLSearchParams(location.search);
const QUIZ = qs.get('quiz') || null;              // 쪽지: 원장에서 조립된 세트 id
const SET = qs.get('set') || 'g1_math_u1_L01_basic';
const MODE = qs.get('mode') || 'screen';
const SEED = Number(qs.get('seed')) || 1;
const NUMWORD = ['영','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
const ORD = ['','첫째','둘째','셋째','넷째','다섯째','여섯째','일곱째','여덟째','아홉째'];
const STORE = 'kws:' + (QUIZ ? 'quiz:' + QUIZ : SET);
const KINDNAME = k => ({lesson_basic:'차시 학습지', lesson_challenge:'도전 학습지', unit_review:'단원 종합', unit_extra:'심화 학습지', wrong_variant:'오답 변형', quiz:'쪽지'}[k] || '학습지');
const FROM_T = !!(window.KEDU_BACK && window.KEDU_BACK.fromTeacher);
const BACK = FROM_T ? {label:'선생님 도구', href:'/?role=teacher'} : {label:'케이에듀 홈', href:'/'};

/* 시드 난수 — 같은 시드면 같은 배치(자동 저장·복원 일관성) */
function rng(seed){ let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(arr, r){ return arr[Math.floor(r() * arr.length)]; }
function rint(lo, hi, r){ return lo + Math.floor(r() * (hi - lo + 1)); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 읽어주기 ---------- */
const TTS = { on: true, speak(text){ if (!this.on || !('speechSynthesis' in window)) return; speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[●○□▷🍎🐤🚗🦋🐟🌼🍬⭐🍓🍌🍉🧁🎈⚽✏️🍪🍩🐞🍁🐘🐜]/g,' ').replace(/\s+/g,' ')); u.lang = 'ko-KR'; u.rate = 0.9; speechSynthesis.speak(u); } };

/* ---------- 에셋 그리기(화면) ---------- */
function drawAsset(a, r){
  if (!a) return '';
  if (typeof a === 'string') return esc(a);
  switch (a.type){
    case 'count_group': return `<div class="count">${Array.from({length:a.n}, () => `<span>${a.item}</span>`).join('')}</div>`;
    case 'scatter_group': { const rr = rng((r ? Math.floor(r()*1e6) : SEED) + a.n); const pts = [];
      for (let i = 0; i < a.n; i++){ let x, y, ok = false, tries = 0;
        while (!ok && tries++ < 40){ x = 12 + rr() * 76; y = 18 + rr() * 64; ok = pts.every(p => Math.hypot(p.x - x, p.y - y) > 18); }
        pts.push({x, y}); }

/* ---------- 문항 전처리: 특수 발문을 에셋으로 ---------- */
function prep(q){
  const v = JSON.parse(JSON.stringify(q));
  if (v.kind === 'sa' && /규칙/.test(v.stem) && !v.asset){ v.asset = {type:'rule', cells:[1,2,3]}; v.stem = '점이 규칙대로 늘어나요. 다음 칸의 점은 몇 개인가요? 숫자로 쓰세요.'; }
  if (v.kind === 'essay' && /왼쪽 상자/.test(v.stem) && !v.asset){ v.asset = {type:'pair_boxes', left:2, right:3}; v.stem = '왼쪽 상자와 오른쪽 상자의 공은 모두 몇 개인가요? 숫자를 쓰고, 어떻게 세었는지 말해 보세요.'; }
  if (v.kind === 'error' && !v.asset){ const m = v.stem.match(/(\p{Emoji_Presentation}|●)\1*/u); if (m){ v.asset = m[0].startsWith('●') ? {type:'dots', n:m[0].length} : {type:'count_group', item:[...m[0]][0], n:[...m[0]].length}; v.stem = v.stem.replace(/\s?(\p{Emoji_Presentation}|●)+\s?(를|을)?/u, ' 그림을 ').replace(/ {2,}/g, ' ').replace(/^ /, ''); } }
  if (v.kind === 'ox' && !v.asset){ const m = v.stem.match(/\p{Emoji_Presentation}+/u); if (m && !/보다/.test(v.stem)){ v.asset = {type:'count_group', item:[...m[0]][0], n:[...m[0]].length}; v.stem = v.stem.replace(m[0], '이 그림'); } }
  return v;
}

    ? `<div class="cover"><h1>쪽지를 열 수 없어요</h1><p>선생님이 아직 열지 않았거나, 이미 닫힌 쪽지예요.</p><div class="alt"><a href="/">케이에듀 홈</a></div></div>`
    : `<div class="cover"><h1>학습지를 찾을 수 없어요</h1><p>주소의 set 값을 확인해 주세요: ${esc(SET)}</p></div>`;
});

function start(){
  Q = DATA.questions.map(prep); const saved = load();
  if (saved && Object.keys(saved.answers || {}).length && Object.keys(saved.answers).length < Q.length){ state.answers = saved.answers; idx = Math.min(saved.idx, Q.length - 1); renderCover(true); }
  else renderCover(false);
}
function renderCover(resume){
  const done = Object.keys(state.answers).length;
  app.innerHTML = `<div class="cover"><div class="badge">${KINDNAME(DATA.kind)}</div>
   <h1>${esc(DATA.title.replace(/ — .*/, ''))}</h1><p>${esc(DATA.header || '1학년 수학')} · ${Q.length}문제</p>
   ${resume ? `<p>${done}번까지 풀었어요. 이어서 할까요?</p><div class="row"><button class="big" data-nav="resume">이어서 풀기</button><button class="big ghost" data-nav="restart">처음부터</button></div>` : `<button class="big" data-nav="resume">시작</button>`}
   <div class="alt">${QUIZ ? '' : `<a href="play.html?set=${SET}&mode=paper">시험지(A4)로 풀기</a><span>·</span><a href="./">학습지 목록</a><span>·</span>`}<a href="${BACK.href}">${esc(BACK.label)}</a></div></div>`;

}

/* ---------- 문항 화면 ---------- */
function renderQ(){
  const q = Q[idx]; const r = rng(SEED * 97 + idx); state.started = Date.now();
  app.innerHTML = `<div class="bar"><a class="home" href="${BACK.href}" title="${esc(BACK.label)}" aria-label="${esc(BACK.label)}">🏠</a><button class="back" data-nav="back">← 앞으로</button><div class="dots">${Q.map((_, i) => `<i class="${i === idx ? 'now' : state.answers[i] ? (state.answers[i].ok ? 'done' : (state.answers[i].pending ? 'done' : 'wrong')) : ''}"></i>`).join('')}</div><button class="tts ${TTS.on ? 'on' : ''}" data-nav="tts" aria-label="읽어주기">🔊</button></div>
   <div class="q"><span class="num">${idx + 1}번${q.variant ? ' · 다시' : ''}</span><div class="stem" id="stem">${esc(q.stem)}</div><div class="asset">${drawAsset(q.asset, r)}</div><div id="ans"></div><div id="fb"></div></div>`;

  TTS.speak(q.stem);
  const prev = state.answers[idx];
  const ans = document.getElementById('ans');
  ({mc:widgetMC, error:widgetMC, blank:widgetMC, data:widgetMC, sa:widgetSA, ox:widgetOX, match:widgetMatch, essay:widgetEssay}[q.kind] || widgetMC)(q, ans, r, prev);
}
function grade(q, ok, detail){
  const t = Math.round((Date.now() - state.started) / 1000); state.answers[idx] = Object.assign({ok, t}, detail || {}); save();
  if (!detail?.pending){
    if (QUIZ && window.keduQuiz){
      try { window.keduQuiz.record({ questionId: q.qcode || `q${q.seq}`, qid: q.qid || null,
                                     ok, sec: t, concept: q.concept, mis: detail?.mis || null }); } catch(e){}
    } else if (window.kedu && window.kedu.recordAnswer){
      try { window.kedu.recordAnswer(`${SET}:q${q.seq}`, ok, t, q.concept); } catch(e){}
    }
  }
  showFB(q, ok, detail);
}
function showFB(q, ok, detail){
  const fb = document.getElementById('fb'); const pending = detail && detail.pending;
  const title = pending ? '선생님이 확인해요' : ok ? '맞았어요' : '다시 생각해 볼까요';
  const exp = q.explanation || [];
  fb.innerHTML = `<div class="fb ${pending ? 'wait' : ok ? 'ok' : 'no'}"><h3>${title}</h3>${exp.slice(0, ok ? 1 : 3).map(s => `<p>${esc(s)}</p>`).join('')}
   <div class="next"><button class="big" data-nav="next">${idx < Q.length - 1 ? '다음' : '끝내기'}</button></div></div>`;
  TTS.speak(title + '. ' + exp.slice(0, ok ? 1 : 2).join(' '));
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* 객관식 계열 */
function widgetMC(q, el, r, prev){
  const opts = shuffle(q.options.map((o, i) => Object.assign({i}, o)), r); const visual = opts.some(o => typeof o.t === 'object');
  el.innerHTML = `<div class="opts ${visual ? '' : ''}">${opts.map((o, k) => `<button class="opt" data-i="${o.i}"><span class="mark">${['①','②','③','④'][k]}</span><span>${optLabel(o.t)}</span></button>`).join('')}</div>`;
  const btns = [...el.querySelectorAll('.opt')];
  const finish = (chosen) => { btns.forEach(b => { b.disabled = true; const o = q.options[b.dataset.i]; if (o.correct) b.classList.add('ok'); else if (Number(b.dataset.i) === chosen) b.classList.add('no'); }); };
  if (prev){ finish(prev.chosen); showFB(q, prev.ok, prev); return; }
  btns.forEach(b => b.onclick = () => { const o = q.options[b.dataset.i]; finish(Number(b.dataset.i)); grade(q, !!o.correct, {chosen:Number(b.dataset.i), mis:o.mis || null}); });
  if (visual) setTimeout(() => TTS.speak(opts.map((o, k) => `${k+1}번 ${optText(o.t)}`).join(', ')), 1200);
}
/* 단답(숫자판) */
function widgetSA(q, el, r, prev){
  const numeric = q.answer.every(a => /^\d+$/.test(a)); let val = prev ? prev.val : '';
  el.innerHTML = `<div class="pad-wrap"><div class="answer-box" id="box">${esc(val) || '&nbsp;'}</div>${numeric ? `<div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="fn" data-n="del">지우기</button><button class="go" data-n="go">확인</button></div>` : `<textarea id="ta" placeholder="여기에 답을 써요">${esc(val)}</textarea><div class="confirm"><button class="big" id="go">확인</button></div>`}</div>`;
  const box = document.getElementById('box');
  const finish = (ok) => { box.classList.add(ok ? 'ok' : 'no'); box.textContent = val; el.querySelectorAll('button').forEach(b => b.disabled = true); if (!ok) box.textContent = `${val} → ${q.answer[0]}`; };
  if (prev){ finish(prev.ok); showFB(q, prev.ok, prev); return; }
  const check = () => { if (!val.trim()) return; const norm = s => s.replace(/\s/g, ''); const ok = q.answer.some(a => norm(a) === norm(val)); finish(ok); grade(q, ok, {val}); };
  if (numeric) el.querySelectorAll('.pad button').forEach(b => b.onclick = () => { const n = b.dataset.n; if (n === 'del') val = val.slice(0, -1); else if (n === 'go') return check(); else if (val.length < 2) val += n; box.textContent = val || '\u00a0'; });
  else { const ta = document.getElementById('ta'); ta.oninput = () => val = ta.value; document.getElementById('go').onclick = check; }
}
/* OX + 근거 (2단) */
function widgetOX(q, el, r, prev){
  const reasons = shuffle(q.reason_options.map((o, i) => Object.assign({i}, o)), r);
  el.innerHTML = `<div class="oxrow"><button class="ox" data-v="O">O</button><button class="ox" data-v="X">X</button></div><div id="reason" style="display:none"><div class="reason-label">왜 그렇게 생각했나요?</div><div class="opts">${reasons.map((o, k) => `<button class="opt" data-i="${o.i}"><span class="mark">${['①','②'][k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div></div>`;
  const oxb = [...el.querySelectorAll('.ox')], rb = [...el.querySelectorAll('.opt')]; let chosenOX = null;
  const finish = (ox, ri) => { oxb.forEach(b => { b.disabled = true; if (b.dataset.v === q.answer) b.classList.add('ok'); else if (b.dataset.v === ox) b.classList.add('no'); }); document.getElementById('reason').style.display = '';
    rb.forEach(b => { b.disabled = true; const o = q.reason_options[b.dataset.i]; if (o.correct) b.classList.add('ok'); else if (Number(b.dataset.i) === ri) b.classList.add('no'); }); };
  if (prev){ finish(prev.ox, prev.reason); showFB(q, prev.ok, prev); return; }
  oxb.forEach(b => b.onclick = () => { chosenOX = b.dataset.v; oxb.forEach(x => x.classList.toggle('sel', x === b)); document.getElementById('reason').style.display = ''; TTS.speak('왜 그렇게 생각했나요? ' + reasons.map(o => o.t).join(', 아니면 ')); });
  rb.forEach(b => b.onclick = () => { if (!chosenOX) return; const o = q.reason_options[b.dataset.i]; const ok = chosenOX === q.answer && !!o.correct; finish(chosenOX, Number(b.dataset.i)); grade(q, ok, {ox:chosenOX, reason:Number(b.dataset.i), mis:o.mis || (chosenOX !== q.answer ? 'M01' : null)}); });
}
/* 연결하기 */
function widgetMatch(q, el, r, prev){
  const L = q.pairs.map((p, i) => ({i, v:p.l})), R = shuffle(q.pairs.map((p, i) => ({i, v:p.r})), r);
  el.innerHTML = `<div class="match" id="m"><div class="col">${L.map(x => `<button class="mi l" data-i="${x.i}">${optLabel(x.v)}</button>`).join('')}</div><div></div><div class="col">${R.map(x => `<button class="mi r" data-i="${x.i}">${optLabel(x.v)}</button>`).join('')}</div><svg id="lines"></svg></div><div class="confirm"><button class="big" id="go" disabled>확인</button></div>`;
  const wrap = document.getElementById('m'), svg = document.getElementById('lines'), go = document.getElementById('go'); let selL = null; const links = {};
  const draw = (grading) => { svg.innerHTML = ''; const wb = wrap.getBoundingClientRect();
    Object.entries(links).forEach(([li, ri]) => { const a = wrap.querySelector(`.l[data-i="${li}"]`).getBoundingClientRect(), b = wrap.querySelector(`.r[data-i="${ri}"]`).getBoundingClientRect();
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'); ln.setAttribute('x1', a.right - wb.left); ln.setAttribute('y1', a.top + a.height/2 - wb.top); ln.setAttribute('x2', b.left - wb.left); ln.setAttribute('y2', b.top + b.height/2 - wb.top);
      if (grading) ln.setAttribute('class', li === ri ? 'ok' : 'no'); svg.appendChild(ln); }); };
  const finish = () => { wrap.querySelectorAll('.mi').forEach(b => b.disabled = true); Object.entries(links).forEach(([li, ri]) => { const ok = li === ri; wrap.querySelector(`.l[data-i="${li}"]`).classList.add(ok ? 'ok' : 'no'); wrap.querySelector(`.r[data-i="${ri}"]`).classList.add(ok ? 'ok' : 'no'); }); draw(true); go.disabled = true; };
  if (prev){ Object.assign(links, prev.links); finish(); showFB(q, prev.ok, prev); return; }
  wrap.querySelectorAll('.l').forEach(b => b.onclick = () => { selL = b.dataset.i; wrap.querySelectorAll('.l').forEach(x => x.classList.toggle('sel', x === b)); });
  wrap.querySelectorAll('.r').forEach(b => b.onclick = () => { if (selL === null) return; const ri = b.dataset.i; Object.keys(links).forEach(k => { if (links[k] === ri) delete links[k]; }); links[selL] = ri;
    wrap.querySelectorAll('.l').forEach(x => x.classList.toggle('done', x.dataset.i in links)); wrap.querySelectorAll('.r').forEach(x => x.classList.toggle('done', Object.values(links).includes(x.dataset.i)));
    wrap.querySelectorAll('.l').forEach(x => x.classList.remove('sel')); selL = null; draw(false); go.disabled = Object.keys(links).length < q.pairs.length; });
  go.onclick = () => { const ok = Object.entries(links).every(([a, b]) => a === b); finish(); grade(q, ok, {links:Object.assign({}, links), mis: ok ? null : 'M01'}); };
  window.addEventListener('resize', () => draw(!!state.answers[idx]));
}
/* 서술형 — 교사 채점 */
function widgetEssay(q, el, r, prev){
  el.innerHTML = `<textarea id="ta" placeholder="여기에 써요. 말로 해도 좋아요.">${prev ? esc(prev.val) : ''}</textarea><div class="confirm"><button class="big" id="go">보내기</button></div>`;
  const ta = document.getElementById('ta'), go = document.getElementById('go');
  if (prev){ ta.disabled = true; go.disabled = true; showFB(q, false, prev); return; }
  go.onclick = () => { if (!ta.value.trim()) return; ta.disabled = true; go.disabled = true; grade(q, false, {pending:true, val:ta.value}); };
}

/* ---------- 마무리: 도장 + 막힌 개념 하나 + 다시 해볼까? ---------- */
function renderFinish(){
  const all = Q.map((q, i) => ({q, a: state.answers[i] || {}})); const wrong = all.filter(x => !x.a.ok && !x.a.pending); const pend = all.filter(x => x.a.pending).length; const okN = all.filter(x => x.a.ok).length;
  const misCount = {}; wrong.forEach(x => { if (x.a.mis) misCount[x.a.mis] = (misCount[x.a.mis] || 0) + 1; }); const topMis = Object.entries(misCount).sort((a, b) => b[1] - a[1])[0];
  const MISFALLBACK = {M01:'하나씩 짚으며 빠짐없이 세기', M02:'수를 바르게 읽기', M03:'마지막에 센 수가 모두의 수예요', M05:'묻는 줄부터 찾기', M06:'수의 순서 익히기', M10:'크기 말고 개수로 세기'};
  const MISNAME = new Proxy({}, { get: (_, k) => (QUIZ && window.keduQuiz && window.keduQuiz.misName(k)) || MISFALLBACK[k] });
  const label = wrong.length === 0 ? '참 잘했어요' : wrong.length <= 2 ? '잘했어요' : '끝까지 했어요';
  app.innerHTML = `<div class="finish"><div class="stamp">${label}<small>${new Date().getMonth()+1}월 ${new Date().getDate()}일</small></div><h2>${esc(DATA.title.replace(/ — .*/, ''))}</h2>
   <p>${Q.length}문제 중 ${okN}문제를 맞혔어요${pend ? ` · ${pend}문제는 선생님이 확인해요` : ''}</p>
   ${topMis ? `<div class="weak">이번에 연습할 것 하나 — <b>${MISNAME[topMis[0]] || '다시 차근차근 세기'}</b></div>` : ''}
   <div class="row">${wrong.length ? `<button class="big" data-nav="retry">다시 해볼까? (${wrong.length})</button>` : ''}<button class="big ghost" data-nav="again">처음부터</button></div>
   <div class="alt">${QUIZ ? '' : `<a href="play.html?set=${SET}&mode=paper">시험지(A4)로 풀기</a><span>·</span><a href="./">학습지 목록</a><span>·</span>`}<a href="${BACK.href}">${esc(BACK.label)}</a></div></div>`;
  if (QUIZ && window.keduQuiz) try { window.keduQuiz.recordEnd(okN, Q.length, null); } catch(e){}
  TTS.speak(`${label}. ${Q.length}문제 중 ${okN}문제를 맞혔어요.` + (topMis ? ` 이번에 연습할 것은 ${MISNAME[topMis[0]] || ''}` : ''));
  window.__retryFrom = wrong;
}

/* ---------- 네비게이션: 이벤트 위임 (다시 그려도 핸들러가 사라지지 않는다) ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  const act = b.dataset.nav;
  if (act === 'next'){ if (idx < Q.length - 1){ idx++; save(); renderQ(); } else renderFinish(); }
  else if (act === 'back'){ if (idx > 0){ idx--; save(); renderQ(); } else renderCover(Object.keys(state.answers).length > 0); }
  else if (act === 'tts'){ TTS.on = !TTS.on; b.classList.toggle('on', TTS.on); if (TTS.on) TTS.speak(Q[idx] && Q[idx].stem); else if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  else if (act === 'resume'){ renderQ(); }
  else if (act === 'restart' || act === 'again'){ Q = DATA.questions.map(prep); state.answers = {}; idx = 0; state.retry = false; save(); renderQ(); }
  else if (act === 'retry'){ const wrong = window.__retryFrom || []; if (!wrong.length) return; const r = rng(Date.now() & 0xffff);
    Q = wrong.map(x => prep(makeVariant(DATA.questions[x.q.seq - 1], r))); state.answers = {}; idx = 0; state.retry = true; save(); renderQ(); }
});

/* ===================== 종이(A4) 모드 ===================== */
function paperAsset(a){
  if (!a) return ''; if (typeof a === 'string') return '';
  switch (a.type){
    case 'count_group': case 'scatter_group': return `<div class="passet">${a.item.repeat(a.n)}</div>`;
    case 'dots': return `<div class="passet small">${'●'.repeat(a.n)}</div>`;
    case 'hidden_group': return `<div class="passet">${a.item.repeat(a.visible)}<span class="pbox">?</span></div>`;
    case 'picto_table': return `<table class="picto-p">${a.rows.map(rw => `<tr><td>${esc(rw.label)}</td><td>${rw.item.repeat(rw.n)}</td></tr>`).join('')}</table>`;
    case 'rule': return `<div class="passet small">${a.cells.map(n => '●'.repeat(n)).join(' → ')} → <span class="pbox">&nbsp;&nbsp;</span></div>`;
    case 'pair_boxes': return `<div class="passet small"><span class="pbox">${'●'.repeat(a.left)}</span> <span class="pbox">${'●'.repeat(a.right)}</span></div>`;
    case 'number_line': return `<div class="pnum">${a.cells.map(c => c === null || c === '?' ? `<span class="blank">&nbsp;</span>` : `<span>${esc(c)}</span>`).join('')}</div>`;
    case 'ordinal_row': return `<div class="pord">${a.items.map((it, i) => `<span class="${a.mark === i + 1 ? 'mk' : ''}">${it}</span>`).join('')}<span style="font-size:12px;letter-spacing:0"> (왼쪽 → 오른쪽)</span></div>`;
    case 'compare_groups': return `<div class="pcmp">${a.rows.map(rw => `<div><b>${esc(rw.label)}</b> ${rw.item.repeat(rw.n)}</div>`).join('')}</div>`;
    case 'plate': return `<div class="pplate">${a.n === 0 ? '(비어 있음)' : a.item.repeat(a.n)}</div>`;
  } return '';
}
function paperOptText(t){ return typeof t === 'object' ? (t.type === 'dots' ? '●'.repeat(t.n) : t.item.repeat(t.n)) : esc(t); }
function renderPaper(){
  document.body.classList.add('paper'); const Qp = DATA.questions.map(prep); const r = rng(SEED); const circ = ['①','②','③','④'];
  const shuffled = Qp.map((q, i) => ({q, opts: q.options ? shuffle(q.options.map((o, k) => Object.assign({k}, o)), rng(SEED * 97 + i)) : null}));
  const title = DATA.title.replace(/ — .*/, ''); const sub = KINDNAME(DATA.kind) + (DATA.form ? ' ' + DATA.form : '');
  const PER = Qp.length <= 12 ? Math.ceil(Qp.length / 2) : 9;
  const qhtml = (x, i) => { const q = x.q; let body = '';
    const paren = (label, cls) => `<div class="pans"><em>${label}</em>(<span class="paren ${cls || ''}"></span>)</div>`;
    if (q.kind === 'sa') body = paren('답', 'wide');
    else if (q.kind === 'essay') body = `<div class="pans" style="text-align:left"><em>답</em>(<span class="paren"></span>)</div><div class="pline long"></div>`;
    else if (q.kind === 'match') body = `<div class="pmatch">${q.pairs.map(p => `<div class="lft">${paperOptText(p.l)}</div><div class="mid">·&nbsp;&nbsp;&nbsp;·</div><div class="rgt">${paperOptText(p.r)}</div>`).join('')}</div>`;
    else if (q.kind === 'ox') body = `<div class="popts"><span data-n="O">맞아요</span><span data-n="X">틀려요</span></div><div class="popts" style="margin-top:8px">${q.reason_options.map((o, k) => `<span data-n="${circ[k]}">${esc(o.t)}</span>`).join('')}</div><div class="pans"><em>답</em>(<span class="paren"></span>)<em style="margin-left:14px">까닭</em>(<span class="paren"></span>)</div>`;
    else body = `<div class="popts">${x.opts.map((o, k) => `<span data-n="${circ[k]}">${paperOptText(o.t)}</span>`).join('')}</div>` + paren('답');
    return `<div class="pq"><span class="pn">${i + 1}</span><span class="pstem">${esc(q.stem.replace(/\n/g, ' '))}</span>${paperAsset(q.asset)}${body}</div>`; };
  const page = (items, off, n) => `<div class="sheet"><div class="ph"><div><h1>${esc(title)}</h1><div class="meta">${esc(DATA.header || '1학년 수학')} · ${sub}</div></div><div class="idbox"><span>반</span><span>번호</span></div></div><div class="pbody">${items.map((x, i) => qhtml(x, off + i)).join('')}</div><div class="pfoot"><span>케이학습지 · keduclass.com</span><span>${n}</span></div></div>`;
  // 교사용 정답표
  const key = `<div class="sheet key-sheet"><div class="ph"><div><h1>${esc(title)} — 교사용</h1><div class="meta">정답 · 개념 · 오답 선택지의 오개념</div></div></div>
   <table class="key"><tr><th>번호</th><th>난이도</th><th>유형</th><th>정답</th><th>개념</th><th>오답 → 오개념</th></tr>${shuffled.map((x, i) => { const q = x.q; let ans = '';
     if (q.kind === 'sa') ans = q.answer.join(' / '); else if (q.kind === 'essay') ans = q.answer_guide.answer + ' (채점: ' + q.answer_guide.scoring_points.join(' · ') + ')'; else if (q.kind === 'match') ans = q.pairs.map(p => `${paperOptText(p.l)}–${paperOptText(p.r)}`).join(', ');
     else if (q.kind === 'ox') ans = q.answer + ' / ' + circ[q.reason_options.findIndex(o => o.correct)]; else ans = circ[x.opts.findIndex(o => o.correct)] + ' ' + paperOptText(x.opts.find(o => o.correct).t);
     const mis = q.options ? x.opts.map((o, k) => o.mis ? `${circ[k]}→${o.mis}` : '').filter(Boolean).join(' ') : (q.reason_options ? q.reason_options.filter(o => o.mis).map(o => o.mis).join(' ') : '');
     return `<tr><td>${i + 1}</td><td>D${q.difficulty}</td><td>${q.kind}</td><td>${ans}</td><td>${q.concept}</td><td>${mis}</td></tr>`; }).join('')}</table>

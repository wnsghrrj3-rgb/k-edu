<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>케이학습지</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9F0;--card:#FFF;--border:#F0E0D0;--primary:#FF8C42;--primary-light:#FFE8D6;--primary-deep:#E5701F;
--text:#333;--subtext:#888;--green:#4CAF50;--green-light:#E8F5E9;--red:#F44336;--red-light:#FFEBEE;--yellow:#FFC107;--yellow-light:#FFF8E1;
--shadow:0 4px 16px rgba(0,0,0,.08);--ink:#2B2B2B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Jua',sans-serif;min-height:100%}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:12px 14px 40px;min-height:100vh;display:flex;flex-direction:column}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.bar .back{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:8px 14px;font-size:18px;color:var(--subtext)}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--border);display:block;transition:transform .2s,background .2s}
.dots i.done{background:var(--green)}.dots i.wrong{background:var(--red)}.dots i.now{background:var(--primary);transform:scale(1.35)}
.tts{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:8px 12px;font-size:20px}
.tts.on{border-color:var(--primary);background:var(--primary-light)}

/* 표지 */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px 0}
.cover .badge{display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;
 background:var(--primary);color:#fff;font-size:64px;line-height:1;box-shadow:0 10px 0 var(--primary-deep);transform:rotate(-6deg)}
.cover h1{font-size:34px;margin:6px 0 0;line-height:1.3;color:var(--ink);font-weight:400}
.cover p{margin:0;color:var(--subtext);font-size:20px}
.big{background:var(--primary);color:#fff;font-size:26px;padding:16px 42px;border-radius:22px;box-shadow:0 6px 0 var(--primary-deep);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--primary-deep)}
.big.ghost{background:var(--card);color:var(--primary-deep);box-shadow:0 6px 0 var(--border)}

/* 문항 카드 */
.q{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px 20px 18px;margin-bottom:14px}
.q .num{display:inline-block;background:var(--primary-light);color:var(--primary-deep);border-radius:12px;padding:4px 12px;font-size:18px;margin-bottom:10px}
.stem{font-size:27px;line-height:1.45;white-space:pre-line;color:var(--ink)}
.asset{margin:18px 0 6px;display:flex;justify-content:center}
.count{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:420px;font-size:52px;line-height:1}
.scatter{position:relative;width:100%;max-width:420px;height:200px;border:2px dashed var(--border);border-radius:18px;background:#FFFDF8}
.scatter span{position:absolute;font-size:44px;line-height:1;transform:translate(-50%,-50%)}
.dotsv{display:inline-flex;gap:6px;font-size:30px;line-height:1;color:var(--ink)}
.hidden{display:flex;align-items:flex-end;gap:10px;font-size:46px;line-height:1}
.hidden .box{width:150px;height:96px;background:#C8A165;border-radius:10px 10px 4px 4px;position:relative;box-shadow:inset 0 -14px 0 #A7833F;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px}
.picto{border-collapse:separate;border-spacing:0;font-size:22px;background:#FFFDF8;border:2px solid var(--border);border-radius:16px;overflow:hidden}
.picto td{padding:10px 16px;border-bottom:2px solid var(--border)}.picto tr:last-child td{border-bottom:0}
.picto td:first-child{background:var(--primary-light);color:var(--primary-deep);min-width:90px;text-align:center}
.picto td:last-child{font-size:38px;letter-spacing:6px}
.rule{display:flex;align-items:center;gap:14px;font-size:30px}.rule .cell{background:#FFFDF8;border:2px solid var(--border);border-radius:14px;padding:10px 14px;min-width:80px;text-align:center}
.rule .cell.next{border-style:dashed;color:var(--subtext)}
.pair-boxes{display:flex;gap:26px;font-size:34px;align-items:center}.pair-boxes .b{background:#FFFDF8;border:3px solid #C8A165;border-radius:12px;padding:14px 18px}

/* 답 영역 */
.opts{display:grid;gap:12px;grid-template-columns:1fr;margin-top:6px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:3px solid var(--border);border-radius:20px;padding:16px 18px;font-size:26px;text-align:left;display:flex;align-items:center;gap:14px;min-height:72px;transition:border-color .12s,background .12s;color:var(--ink)}
.opt .mark{width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary-deep);display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--primary-light)}
.opt.ok{border-color:var(--green);background:var(--green-light)}.opt.ok .mark{background:var(--green);color:#fff}
.opt.no{border-color:var(--red);background:var(--red-light)}.opt.no .mark{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.oxrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.ox{font-size:60px;padding:14px;border-radius:24px;background:var(--card);border:3px solid var(--border)}
.ox.sel{border-color:var(--primary);background:var(--primary-light)}.ox.ok{border-color:var(--green);background:var(--green-light)}.ox.no{border-color:var(--red);background:var(--red-light)}
.reason-label{font-size:20px;color:var(--subtext);margin:6px 0}
/* 숫자판 */
.pad-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.answer-box{min-width:150px;height:76px;border:3px dashed var(--primary);border-radius:18px;background:#FFFDF8;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--ink)}
.answer-box.ok{border-style:solid;border-color:var(--green);background:var(--green-light)}.answer-box.no{border-style:solid;border-color:var(--red);background:var(--red-light)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:420px}
.pad button{font-size:30px;padding:14px 0;border-radius:16px;background:var(--card);border:3px solid var(--border);color:var(--ink)}
.pad button.fn{background:var(--yellow-light);border-color:#F5DD8A;font-size:22px}
.pad button.go{grid-column:span 2;background:var(--primary);color:#fff;border-color:var(--primary)}
textarea{width:100%;font-family:inherit;font-size:24px;padding:14px;border:3px solid var(--border);border-radius:18px;resize:vertical;min-height:110px;background:#FFFDF8}
/* 연결 */
.match{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;position:relative}
.match .col{display:flex;flex-direction:column;gap:12px}
.mi{background:var(--card);border:3px solid var(--border);border-radius:18px;min-height:70px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--ink)}
.mi.sel{border-color:var(--primary);background:var(--primary-light)}.mi.done{border-color:#C8A165;background:#FFF6E5}
.mi.ok{border-color:var(--green);background:var(--green-light)}.mi.no{border-color:var(--red);background:var(--red-light)}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.match svg line{stroke:#C8A165;stroke-width:5;stroke-linecap:round}
.match svg line.ok{stroke:var(--green)}.match svg line.no{stroke:var(--red)}
.confirm{margin-top:14px;display:flex;justify-content:flex-end}
/* 피드백 */
.fb{border-radius:22px;padding:18px 20px;margin-top:6px;animation:pop .25s ease-out}
.fb.ok{background:var(--green-light);border:3px solid var(--green)}.fb.no{background:var(--yellow-light);border:3px solid var(--yellow)}.fb.wait{background:var(--primary-light);border:3px solid var(--primary)}
.fb h3{margin:0 0 8px;font-size:28px;font-weight:400}
.fb p{margin:4px 0;font-size:21px;line-height:1.45;color:var(--ink)}
.fb .next{margin-top:12px;display:flex;justify-content:flex-end}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
/* 마무리 */
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 0}
.stamp{width:170px;height:170px;border-radius:50%;border:8px double var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;line-height:1.15;transform:rotate(-12deg);animation:stampin .5s cubic-bezier(.2,1.4,.4,1)}
.stamp small{font-size:18px}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.finish h2{font-size:32px;margin:6px 0 0;font-weight:400;color:var(--ink)}
.finish p{margin:0;font-size:22px;color:var(--subtext)}
.weak{background:var(--card);border-radius:20px;padding:16px 22px;box-shadow:var(--shadow);font-size:22px;max-width:480px}
.weak b{color:var(--primary-deep);font-weight:400}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.stem{font-size:24px}.count{font-size:44px}.opt{font-size:23px}}

/* ===== 종이(A4) 모드 ===== */
body.paper{background:#fff;font-family:'Nunito','Jua',sans-serif}
.sheet{width:210mm;min-height:297mm;margin:0 auto;padding:16mm 16mm 14mm;background:#fff;color:#111;font-family:'Jua',sans-serif;position:relative}
.sheet+.sheet{page-break-before:always}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:12px}
.ph h1{margin:0;font-size:22px;font-weight:400}.ph .meta{font-size:13px;color:#555}
.ph .idbox{display:flex;gap:10px;font-size:14px}.ph .idbox span{border:1.5px solid #111;padding:6px 14px;min-width:70px;text-align:center}
.pq{break-inside:avoid;margin:0 0 16px;font-size:16px;line-height:1.5}
.pq .pn{display:inline-block;width:26px;height:26px;border-radius:50%;background:#111;color:#fff;text-align:center;line-height:26px;font-size:14px;margin-right:8px;vertical-align:middle}
.pq .pstem{white-space:pre-line;display:inline}
.pq .passet{margin:8px 0 8px 34px;font-size:30px;letter-spacing:6px;line-height:1.2}
.pq .passet.small{font-size:20px;letter-spacing:4px}
.pq .passet .pbox{display:inline-block;border:2px solid #111;border-radius:6px;padding:4px 18px;font-size:18px;letter-spacing:0;vertical-align:middle;margin-left:6px}
.pq .popts{margin:6px 0 0 34px;display:flex;flex-wrap:wrap;gap:8px 26px;font-size:16px}
.pq .popts span::before{content:attr(data-n);display:inline-block;width:20px;height:20px;border:1.5px solid #111;border-radius:50%;text-align:center;line-height:18px;font-size:12px;margin-right:6px}
.pq .pline{margin:8px 0 0 34px;height:34px;border-bottom:2px solid #111;width:60%}
.pq .pline.long{height:70px;width:100%}
.pq .pmatch{margin:8px 0 0 34px;display:grid;grid-template-columns:120px 60px 120px;row-gap:14px;font-size:20px;align-items:center}
.pq .pmatch .lft,.pq .pmatch .rgt{border:1.5px solid #111;border-radius:8px;text-align:center;padding:6px}
.pq .pmatch .mid{text-align:center;color:#999}
.pq .picto-p{border-collapse:collapse;margin:6px 0 0 34px;font-size:16px}.pq .picto-p td{border:1.5px solid #111;padding:6px 12px}.pq .picto-p td:last-child{font-size:24px;letter-spacing:5px}
.pfoot{position:absolute;bottom:8mm;left:16mm;right:16mm;display:flex;justify-content:space-between;font-size:11px;color:#777}
.key{width:100%;border-collapse:collapse;font-size:13px}.key th,.key td{border:1px solid #333;padding:5px 7px;text-align:left;vertical-align:top}.key th{background:#eee}
.toolbar{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:9}
.toolbar button{background:#111;color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;font-family:'Jua',sans-serif}
@media print{.toolbar{display:none}.sheet{margin:0;box-shadow:none}@page{size:A4;margin:0}body.paper{background:#fff}}
@media screen{body.paper{background:#666;padding:20px 0}.sheet{box-shadow:0 4px 24px rgba(0,0,0,.35);margin-bottom:20px}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===================== 케이학습지 렌더러 v0.1 =====================
   URL: play.html?set=g1_math_u1_L01_basic[&mode=paper][&seed=123]
   문항 정본 = data/{set}.json (questions 행 형식). 화면·종이는 여기서만 그린다.
   seam: window.kedu.recordAnswer(questionId, isCorrect, timeSpentSec, conceptId) 있으면 호출.
=================================================================== */
const qs = new URLSearchParams(location.search);
const SET = qs.get('set') || 'g1_math_u1_L01_basic';
const MODE = qs.get('mode') || 'screen';
const SEED = Number(qs.get('seed')) || 1;
const NUMWORD = ['영','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
const STORE = 'kws:' + SET;

/* 시드 난수 — 같은 시드면 같은 배치(자동 저장·복원 일관성) */
function rng(seed){ let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(arr, r){ return arr[Math.floor(r() * arr.length)]; }
function rint(lo, hi, r){ return lo + Math.floor(r() * (hi - lo + 1)); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 읽어주기 ---------- */
const TTS = { on: true, speak(text){ if (!this.on || !('speechSynthesis' in window)) return; speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[●○□▷🍎🐤🚗🦋🐟🌼🍬⭐🍓🍌🍉🧁🎈⚽✏️🍪🍩🐞🍁🐘🐜]/g,' ').replace(/\s+/g,' ')); u.lang = 'ko-KR'; u.rate = 0.9; speechSynthesis.speak(u); } };

/* ---------- 에셋 그리기(화면) ---------- */
function drawAsset(a, r){
  if (!a) return '';
  if (typeof a === 'string') return esc(a);
  switch (a.type){
    case 'count_group': return `<div class="count">${Array.from({length:a.n}, () => `<span>${a.item}</span>`).join('')}</div>`;
    case 'scatter_group': { const rr = rng((r ? Math.floor(r()*1e6) : SEED) + a.n); const pts = [];
      for (let i = 0; i < a.n; i++){ let x, y, ok = false, tries = 0;
        while (!ok && tries++ < 40){ x = 12 + rr() * 76; y = 18 + rr() * 64; ok = pts.every(p => Math.hypot(p.x - x, p.y - y) > 18); }
        pts.push({x, y}); }
      return `<div class="scatter">${pts.map(p => `<span style="left:${p.x}%;top:${p.y}%">${a.item}</span>`).join('')}</div>`; }
    case 'dots': return `<span class="dotsv">${'●'.repeat(a.n).split('').map(d => `<span>${d}</span>`).join('')}</span>`;
    case 'hidden_group': return `<div class="hidden">${Array.from({length:a.visible}, () => `<span>${a.item}</span>`).join('')}<div class="box">?</div></div>`;
    case 'picto_table': return `<table class="picto">${a.rows.map(rw => `<tr><td>${esc(rw.label)}</td><td>${rw.item.repeat(rw.n)}</td></tr>`).join('')}</table>`;
    case 'rule': return `<div class="rule">${a.cells.map(n => `<div class="cell">${'●'.repeat(n)}</div><span>→</span>`).join('')}<div class="cell next">?</div></div>`;
    case 'pair_boxes': return `<div class="pair-boxes"><div class="b">${'●'.repeat(a.left)}</div><div class="b">${'●'.repeat(a.right)}</div></div>`;
  }
  return '';
}
function optLabel(t){ return (typeof t === 'object') ? drawAsset(t) : esc(t); }
function optText(t){ if (typeof t !== 'object') return String(t); if (t.type === 'dots') return `점 ${NUMWORD[t.n]}개`; if (t.type === 'count_group') return `${NUMWORD[t.n]} 개`; return ''; }

/* ---------- 변형 엔진 (오답 「다시 해볼까?」용) — 같은 문제 재탕 금지 ---------- */
function makeVariant(q, r){
  const v = JSON.parse(JSON.stringify(q)); const rule = q.variant_rule; if (!rule) return v; v.variant = true;
  const a = v.asset;
  const numOpts = (n, lo, hi) => { // 정답 n, 오답은 n±1 안에서 (오개념 태그 유지)
    const wrong = [n - 1, n + 1, n - 2, n + 2].filter(x => x >= lo && x <= hi && x !== n);
    const mis = q.options.filter(o => !o.correct).map(o => o.mis || o.mis_target);
    return [{t:String(n), correct:true}].concat(wrong.slice(0, q.options.length - 1).map((w, i) => ({t:String(w), mis: mis[i] || mis[0]}))); };
  if (a && (a.type === 'count_group' || a.type === 'scatter_group')){
    if (rule.item) a.item = pick(rule.item, r); const [lo, hi] = rule.n || [1, 5]; a.n = rint(lo, hi, r);
    if (q.kind === 'sa') v.answer = [String(a.n)];
    else if (q.kind === 'mc' && q.options.every(o => typeof o.t !== 'object')) v.options = numOpts(a.n, 1, 9);
    else if (q.kind === 'mc') { const mis = q.options.filter(o => !o.correct).map(o => o.mis); const ws = [a.n - 1, a.n + 1, a.n + 2].filter(x => x >= 1 && x <= 9).slice(0, 2);
      v.options = [{t:{type:'dots', n:a.n}, correct:true}].concat(ws.map((w, i) => ({t:{type:'dots', n:w}, mis:mis[i] || mis[0]}))); }
    if (rule.item) v.stem = q.stem; // 발문은 그대로(사물 이름은 그림이 말해준다)
    return v;
  }
  if (a && a.type === 'hidden_group'){ a.total = rint(rule.total[0], rule.total[1], r); a.visible = rint(1, a.total - 1, r); const ans = a.total - a.visible;
    v.stem = `병아리 ${a.total}마리가 있었어요. 지금 ${a.visible}마리가 보여요. 상자 뒤에 숨은 병아리는 몇 마리인가요?`;
    v.options = [{t:String(ans), correct:true}, {t:String(a.visible), mis:'M03'}, {t:String(a.total), mis:'M03'}]; return v; }
  if (a && a.type === 'picto_table'){ const items = pick(rule.items, r); a.rows.forEach((rw, i) => { rw.item = items[i]; rw.n = rint(rule.n[0], rule.n[1], r); }); const rw = a.rows[1];
    v.stem = `과일 가게 그림표예요. ${a.rows[0].label} 칸에는 ${a.rows[0].item}가 ${a.rows[0].n}개, ${rw.label} 칸에는 ${rw.item}가 ${rw.n}개 있어요. ${rw.label}는 몇 개인가요?`;
    const other = a.rows[0].n, third = rw.n + (rw.n < 5 ? 1 : -1); v.options = [{t:String(rw.n), correct:true}, {t:String(other === rw.n ? other + 1 : other), mis:'M05'}, {t:String(third), mis:'M01'}]; return v; }
  if (q.kind === 'blank' && rule.blank_pos){ const pos = rint(rule.blank_pos[0], rule.blank_pos[1], r); const words = [1,2,3,4,5].map(n => n === pos ? '□' : NUMWORD[n]);
    v.stem = `수를 세는 말이에요. 빈칸에 알맞은 말을 고르세요.\n${words.join(' — ')}`; const w = [pos + 2, pos - 2, pos + 1, pos - 1].filter(x => x >= 1 && x <= 9 && x !== pos).slice(0, 2);
    v.options = [{t:NUMWORD[pos], correct:true}, {t:NUMWORD[w[0]], mis:'M06'}, {t:NUMWORD[w[1]], mis:'M06'}]; return v; }
  if (q.kind === 'error' && rule.error_type){ const n = rint(rule.n[0], rule.n[1], r); const item = pick(rule.item || ['🍬'], r); const type = pick(rule.error_type, r); const name = pick(['민수','지우','하늘','보라'], r);
    const seq = []; for (let i = 1; i <= n; i++) seq.push(NUMWORD[i]);
    const k = rint(1, n - 1, r);
    // 아이가 실제로 말했을 법한 잘못된 세기: double = k번째 말을 한 번 더, skip = 하나 빠뜨림
    const spoken = type === 'double' ? seq.slice(0, k).concat([NUMWORD[k]], seq.slice(k, n - 1)) : seq.slice(0, n - 1);
    const count = n - 1;
    v.stem = `${name}가 ${item.repeat(n)}를 세었어요.\n"${spoken.join(', ')} — ${count}개야!"\n${name}는 무엇을 잘못했나요?`;
    const ok = type === 'double' ? '같은 것을 두 번 세었어요' : '하나를 빠뜨리고 세었어요'; const other = type === 'double' ? '하나를 빠뜨리고 세었어요' : '같은 것을 두 번 세었어요';
    v.options = [{t:ok, correct:true, mis_target:'M01'}, {t:`정말 ${count}개예요`, mis:'M03'}, {t:other, mis:'M01'}];
    v.explanation = [type === 'double' ? `'${NUMWORD[k]}'을 두 번 말했어요 — 같은 것을 두 번 센 거예요.` : `하나를 빼먹고 세었어요.`, `바르게 세면 ${seq.join(', ')} — ${n}개예요.`, '하나씩 짚으며 한 번씩만 세어 보세요.']; return v; }
  if (q.kind === 'match' && rule.n_pool){ const ns = shuffle([1,2,3,4,5], r).slice(0, q.pairs.length); v.pairs = q.pairs.map((p, i) => { const n = ns[i];
      const left = typeof p.l === 'object' ? {type:'dots', n} : String(n); const right = typeof p.r === 'object' ? {type:'dots', n} : (/^\d$/.test(p.r) ? String(n) : NUMWORD[n]); return {l:left, r:right}; }); return v; }
  if (q.kind === 'sa' && rule.n && !a){ const n = rint(rule.n[0], rule.n[1], r); v.stem = q.stem.replace(/\d/, n); v.answer = [String(n)]; return v; }
  if (q.kind === 'mc' && rule.n && !a && /수수께끼/.test(q.stem)){ const n = rint(rule.n[0], rule.n[1], r); v.stem = `수수께끼예요. "나는 ${NUMWORD[n-1]} 바로 다음 수이고, ${NUMWORD[n+1]} 바로 앞의 수예요." 나는 누구일까요?`;
    v.options = [{t:String(n), correct:true}, {t:String(n-1), mis:'M06'}, {t:String(n+1), mis:'M06'}]; return v; }
  if (q.kind === 'mc' && rule.n && !a){ const n = rint(rule.n[0], rule.n[1], r); v.stem = q.stem.replace(/\d/, n); const ws = shuffle([1,2,3,4,5].filter(x => x !== n), r).slice(0, 2);
    v.options = [{t:NUMWORD[n], correct:true}, {t:NUMWORD[ws[0]], mis:'M02'}, {t:NUMWORD[ws[1]], mis:'M02'}]; return v; }
  if (q.kind === 'ox' && rule.truth){ const n = rint(rule.n[0], rule.n[1], r); const item = pick(rule.item, r); const truth = pick(rule.truth, r); const said = truth === 'O' ? n : (n === 5 ? 4 : n + 1);
    v.stem = `${item.repeat(n)}의 수는 '${NUMWORD[said]}'입니다.`; v.answer = truth; v.reason_options = [{t: truth === 'O' ? `${NUMWORD.slice(1, n+1).join(', ')} — ${n}개라서` : `세어 보면 ${NUMWORD[n]}, ${n}개라서`, correct:true}, {t:'모양이 크니까', mis:'M10'}];
    v.explanation = [`세어 보면 ${n}개, '${NUMWORD[n]}'이에요.`, truth === 'O' ? '맞는 말이에요.' : `'${NUMWORD[said]}'은 틀렸어요.`, '수를 셀 때는 개수만 보세요.']; return v; }
  if (q.kind === 'sa' && rule.start && /규칙/.test(q.stem)){ const s = rint(rule.start[0], rule.start[1], r); v.asset = {type:'rule', cells:[s, s+1, s+2]}; v.answer = [String(s + 3)];
    v.stem = '점이 규칙대로 늘어나요. 다음 칸의 점은 몇 개인가요? 숫자로 쓰세요.'; v.explanation = ['점이 1개씩 늘어나는 규칙이에요.', `${s}, ${s+1}, ${s+2} 다음이니까 ${s+3}이에요.`, '각 칸의 점을 세어 규칙을 먼저 찾아보세요.']; return v; }
  return v;
}

/* ---------- 문항 전처리: 특수 발문을 에셋으로 ---------- */
function prep(q){
  const v = JSON.parse(JSON.stringify(q));
  if (v.kind === 'sa' && /규칙/.test(v.stem) && !v.asset){ v.asset = {type:'rule', cells:[1,2,3]}; v.stem = '점이 규칙대로 늘어나요. 다음 칸의 점은 몇 개인가요? 숫자로 쓰세요.'; }
  if (v.kind === 'essay' && /왼쪽 상자/.test(v.stem) && !v.asset){ v.asset = {type:'pair_boxes', left:2, right:3}; v.stem = '왼쪽 상자와 오른쪽 상자의 공은 모두 몇 개인가요? 숫자를 쓰고, 어떻게 세었는지 말해 보세요.'; }
  if (v.kind === 'error' && !v.asset){ const m = v.stem.match(/(\p{Emoji_Presentation}|●)\1*/u); if (m){ v.asset = m[0].startsWith('●') ? {type:'dots', n:m[0].length} : {type:'count_group', item:[...m[0]][0], n:[...m[0]].length}; v.stem = v.stem.replace(/\s?(\p{Emoji_Presentation}|●)+\s?(를|을)?/u, ' 그림을 ').replace(/ {2,}/g, ' ').replace(/^ /, ''); } }
  if (v.kind === 'ox' && !v.asset){ const m = v.stem.match(/\p{Emoji_Presentation}+/u); if (m && !/보다/.test(v.stem)){ v.asset = {type:'count_group', item:[...m[0]][0], n:[...m[0]].length}; v.stem = v.stem.replace(m[0], '이 그림'); } }
  return v;
}

/* ---------- 상태 ---------- */
let DATA, Q = [], idx = 0, state = { answers: {}, started: 0, retry: false };
function save(){ try { localStorage.setItem(STORE, JSON.stringify({idx, answers: state.answers, retry: state.retry})); } catch(e){} }
function load(){ try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e){ return null; } }

const app = document.getElementById('app');
fetch(`data/${SET}.json`).then(r => r.json()).then(d => { DATA = d; MODE === 'paper' ? renderPaper() : start(); })
  .catch(() => { app.innerHTML = `<div class="cover"><h1>학습지를 찾을 수 없어요</h1><p>주소의 set 값을 확인해 주세요: ${esc(SET)}</p></div>`; });

function start(){
  Q = DATA.questions.map(prep); const saved = load();
  if (saved && Object.keys(saved.answers || {}).length && Object.keys(saved.answers).length < Q.length){ state.answers = saved.answers; idx = Math.min(saved.idx, Q.length - 1); renderCover(true); }
  else renderCover(false);
}
function renderCover(resume){
  const done = Object.keys(state.answers).length;
  app.innerHTML = `<div class="cover"><div class="badge">${DATA.kind === 'lesson_challenge' ? '②' : '①'}</div>
   <h1>${esc(DATA.title.replace(/ — .*/, ''))}</h1><p>${DATA.kind === 'lesson_challenge' ? '도전 학습지' : '차시 학습지'} · ${Q.length}문제</p>
   ${resume ? `<p>${done}번까지 풀었어요. 이어서 할까요?</p><div class="row"><button class="big" id="go">이어서 풀기</button><button class="big ghost" id="restart">처음부터</button></div>` : `<button class="big" id="go">시작</button>`}</div>`;
  document.getElementById('go').onclick = () => { renderQ(); };
  const rs = document.getElementById('restart'); if (rs) rs.onclick = () => { state.answers = {}; idx = 0; save(); renderQ(); };
}

/* ---------- 문항 화면 ---------- */
function renderQ(){
  const q = Q[idx]; const r = rng(SEED * 97 + idx); state.started = Date.now();
  app.innerHTML = `<div class="bar"><button class="back" id="back" ${idx === 0 ? 'disabled' : ''}>← 앞으로</button><div class="dots">${Q.map((_, i) => `<i class="${i === idx ? 'now' : state.answers[i] ? (state.answers[i].ok ? 'done' : (state.answers[i].pending ? 'done' : 'wrong')) : ''}"></i>`).join('')}</div><button class="tts ${TTS.on ? 'on' : ''}" id="tts" aria-label="읽어주기">🔊</button></div>
   <div class="q"><span class="num">${idx + 1}번${q.variant ? ' · 다시' : ''}</span><div class="stem" id="stem">${esc(q.stem)}</div><div class="asset">${drawAsset(q.asset, r)}</div><div id="ans"></div><div id="fb"></div></div>`;
  document.getElementById('back').onclick = () => { if (idx > 0){ idx--; save(); renderQ(); } };
  document.getElementById('tts').onclick = e => { TTS.on = !TTS.on; e.currentTarget.classList.toggle('on', TTS.on); if (TTS.on) TTS.speak(q.stem); else speechSynthesis.cancel(); };
  TTS.speak(q.stem);
  const prev = state.answers[idx];
  const ans = document.getElementById('ans');
  ({mc:widgetMC, error:widgetMC, blank:widgetMC, data:widgetMC, sa:widgetSA, ox:widgetOX, match:widgetMatch, essay:widgetEssay}[q.kind] || widgetMC)(q, ans, r, prev);
}
function grade(q, ok, detail){
  const t = Math.round((Date.now() - state.started) / 1000); state.answers[idx] = Object.assign({ok, t}, detail || {}); save();
  if (window.kedu && window.kedu.recordAnswer && !detail?.pending) try { window.kedu.recordAnswer(`${SET}:q${q.seq}`, ok, t, q.concept); } catch(e){}
  showFB(q, ok, detail);
}
function showFB(q, ok, detail){
  const fb = document.getElementById('fb'); const pending = detail && detail.pending;
  const title = pending ? '선생님이 확인해요' : ok ? pick(['정답이에요!', '맞았어요!', '잘했어요!'], rng(Date.now())) : '다시 생각해 볼까요?';
  const exp = q.explanation || [];
  fb.innerHTML = `<div class="fb ${pending ? 'wait' : ok ? 'ok' : 'no'}"><h3>${ok ? '🎉 ' : pending ? '✉️ ' : '🤔 '}${title}</h3>${exp.slice(0, ok ? 1 : 3).map(s => `<p>${esc(s)}</p>`).join('')}
   <div class="next"><button class="big" id="next">${idx < Q.length - 1 ? '다음' : '끝내기'}</button></div></div>`;
  TTS.speak(title + '. ' + exp.slice(0, ok ? 1 : 2).join(' '));
  document.getElementById('next').onclick = () => { if (idx < Q.length - 1){ idx++; save(); renderQ(); } else renderFinish(); };
  fb.scrollIntoView({behavior:'smooth', block:'end'});
}

/* 객관식 계열 */
function widgetMC(q, el, r, prev){
  const opts = shuffle(q.options.map((o, i) => Object.assign({i}, o)), r); const visual = opts.some(o => typeof o.t === 'object');
  el.innerHTML = `<div class="opts ${visual ? '' : ''}">${opts.map((o, k) => `<button class="opt" data-i="${o.i}"><span class="mark">${['①','②','③','④'][k]}</span><span>${optLabel(o.t)}</span></button>`).join('')}</div>`;
  const btns = [...el.querySelectorAll('.opt')];
  const finish = (chosen) => { btns.forEach(b => { b.disabled = true; const o = q.options[b.dataset.i]; if (o.correct) b.classList.add('ok'); else if (Number(b.dataset.i) === chosen) b.classList.add('no'); }); };
  if (prev){ finish(prev.chosen); showFB(q, prev.ok, prev); return; }
  btns.forEach(b => b.onclick = () => { const o = q.options[b.dataset.i]; finish(Number(b.dataset.i)); grade(q, !!o.correct, {chosen:Number(b.dataset.i), mis:o.mis || null}); });
  if (visual) setTimeout(() => TTS.speak(opts.map((o, k) => `${k+1}번 ${optText(o.t)}`).join(', ')), 1200);
}
/* 단답(숫자판) */
function widgetSA(q, el, r, prev){
  const numeric = q.answer.every(a => /^\d+$/.test(a)); let val = prev ? prev.val : '';
  el.innerHTML = `<div class="pad-wrap"><div class="answer-box" id="box">${esc(val) || '&nbsp;'}</div>${numeric ? `<div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="fn" data-n="del">지우기</button><button class="go" data-n="go">확인</button></div>` : `<textarea id="ta" placeholder="여기에 답을 써요">${esc(val)}</textarea><div class="confirm"><button class="big" id="go">확인</button></div>`}</div>`;
  const box = document.getElementById('box');
  const finish = (ok) => { box.classList.add(ok ? 'ok' : 'no'); box.textContent = val; el.querySelectorAll('button').forEach(b => b.disabled = true); if (!ok) box.textContent = `${val} → ${q.answer[0]}`; };
  if (prev){ finish(prev.ok); showFB(q, prev.ok, prev); return; }
  const check = () => { if (!val.trim()) return; const norm = s => s.replace(/\s/g, ''); const ok = q.answer.some(a => norm(a) === norm(val)); finish(ok); grade(q, ok, {val}); };
  if (numeric) el.querySelectorAll('.pad button').forEach(b => b.onclick = () => { const n = b.dataset.n; if (n === 'del') val = val.slice(0, -1); else if (n === 'go') return check(); else if (val.length < 2) val += n; box.textContent = val || '\u00a0'; });
  else { const ta = document.getElementById('ta'); ta.oninput = () => val = ta.value; document.getElementById('go').onclick = check; }
}
/* OX + 근거 (2단) */
function widgetOX(q, el, r, prev){
  const reasons = shuffle(q.reason_options.map((o, i) => Object.assign({i}, o)), r);
  el.innerHTML = `<div class="oxrow"><button class="ox" data-v="O">O</button><button class="ox" data-v="X">X</button></div><div id="reason" style="display:none"><div class="reason-label">왜 그렇게 생각했나요?</div><div class="opts">${reasons.map((o, k) => `<button class="opt" data-i="${o.i}"><span class="mark">${['①','②'][k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div></div>`;
  const oxb = [...el.querySelectorAll('.ox')], rb = [...el.querySelectorAll('.opt')]; let chosenOX = null;
  const finish = (ox, ri) => { oxb.forEach(b => { b.disabled = true; if (b.dataset.v === q.answer) b.classList.add('ok'); else if (b.dataset.v === ox) b.classList.add('no'); }); document.getElementById('reason').style.display = '';
    rb.forEach(b => { b.disabled = true; const o = q.reason_options[b.dataset.i]; if (o.correct) b.classList.add('ok'); else if (Number(b.dataset.i) === ri) b.classList.add('no'); }); };
  if (prev){ finish(prev.ox, prev.reason); showFB(q, prev.ok, prev); return; }
  oxb.forEach(b => b.onclick = () => { chosenOX = b.dataset.v; oxb.forEach(x => x.classList.toggle('sel', x === b)); document.getElementById('reason').style.display = ''; TTS.speak('왜 그렇게 생각했나요? ' + reasons.map(o => o.t).join(', 아니면 ')); });
  rb.forEach(b => b.onclick = () => { if (!chosenOX) return; const o = q.reason_options[b.dataset.i]; const ok = chosenOX === q.answer && !!o.correct; finish(chosenOX, Number(b.dataset.i)); grade(q, ok, {ox:chosenOX, reason:Number(b.dataset.i), mis:o.mis || (chosenOX !== q.answer ? 'M01' : null)}); });
}
/* 연결하기 */
function widgetMatch(q, el, r, prev){
  const L = q.pairs.map((p, i) => ({i, v:p.l})), R = shuffle(q.pairs.map((p, i) => ({i, v:p.r})), r);
  el.innerHTML = `<div class="match" id="m"><div class="col">${L.map(x => `<button class="mi l" data-i="${x.i}">${optLabel(x.v)}</button>`).join('')}</div><div></div><div class="col">${R.map(x => `<button class="mi r" data-i="${x.i}">${optLabel(x.v)}</button>`).join('')}</div><svg id="lines"></svg></div><div class="confirm"><button class="big" id="go" disabled>확인</button></div>`;
  const wrap = document.getElementById('m'), svg = document.getElementById('lines'), go = document.getElementById('go'); let selL = null; const links = {};
  const draw = (grading) => { svg.innerHTML = ''; const wb = wrap.getBoundingClientRect();
    Object.entries(links).forEach(([li, ri]) => { const a = wrap.querySelector(`.l[data-i="${li}"]`).getBoundingClientRect(), b = wrap.querySelector(`.r[data-i="${ri}"]`).getBoundingClientRect();
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'); ln.setAttribute('x1', a.right - wb.left); ln.setAttribute('y1', a.top + a.height/2 - wb.top); ln.setAttribute('x2', b.left - wb.left); ln.setAttribute('y2', b.top + b.height/2 - wb.top);
      if (grading) ln.setAttribute('class', li === ri ? 'ok' : 'no'); svg.appendChild(ln); }); };
  const finish = () => { wrap.querySelectorAll('.mi').forEach(b => b.disabled = true); Object.entries(links).forEach(([li, ri]) => { const ok = li === ri; wrap.querySelector(`.l[data-i="${li}"]`).classList.add(ok ? 'ok' : 'no'); wrap.querySelector(`.r[data-i="${ri}"]`).classList.add(ok ? 'ok' : 'no'); }); draw(true); go.disabled = true; };
  if (prev){ Object.assign(links, prev.links); finish(); showFB(q, prev.ok, prev); return; }
  wrap.querySelectorAll('.l').forEach(b => b.onclick = () => { selL = b.dataset.i; wrap.querySelectorAll('.l').forEach(x => x.classList.toggle('sel', x === b)); });
  wrap.querySelectorAll('.r').forEach(b => b.onclick = () => { if (selL === null) return; const ri = b.dataset.i; Object.keys(links).forEach(k => { if (links[k] === ri) delete links[k]; }); links[selL] = ri;
    wrap.querySelectorAll('.l').forEach(x => x.classList.toggle('done', x.dataset.i in links)); wrap.querySelectorAll('.r').forEach(x => x.classList.toggle('done', Object.values(links).includes(x.dataset.i)));
    wrap.querySelectorAll('.l').forEach(x => x.classList.remove('sel')); selL = null; draw(false); go.disabled = Object.keys(links).length < q.pairs.length; });
  go.onclick = () => { const ok = Object.entries(links).every(([a, b]) => a === b); finish(); grade(q, ok, {links:Object.assign({}, links), mis: ok ? null : 'M01'}); };
  window.addEventListener('resize', () => draw(!!state.answers[idx]));
}
/* 서술형 — 교사 채점 */
function widgetEssay(q, el, r, prev){
  el.innerHTML = `<textarea id="ta" placeholder="여기에 써요. 말로 해도 좋아요.">${prev ? esc(prev.val) : ''}</textarea><div class="confirm"><button class="big" id="go">보내기</button></div>`;
  const ta = document.getElementById('ta'), go = document.getElementById('go');
  if (prev){ ta.disabled = true; go.disabled = true; showFB(q, false, prev); return; }
  go.onclick = () => { if (!ta.value.trim()) return; ta.disabled = true; go.disabled = true; grade(q, false, {pending:true, val:ta.value}); };
}

/* ---------- 마무리: 도장 + 막힌 개념 하나 + 다시 해볼까? ---------- */
function renderFinish(){
  const all = Q.map((q, i) => ({q, a: state.answers[i] || {}})); const wrong = all.filter(x => !x.a.ok && !x.a.pending); const pend = all.filter(x => x.a.pending).length; const okN = all.filter(x => x.a.ok).length;
  const misCount = {}; wrong.forEach(x => { if (x.a.mis) misCount[x.a.mis] = (misCount[x.a.mis] || 0) + 1; }); const topMis = Object.entries(misCount).sort((a, b) => b[1] - a[1])[0];
  const MISNAME = {M01:'하나씩 짚으며 빠짐없이 세기', M02:'수를 바르게 읽기', M03:'마지막에 센 수가 모두의 수예요', M05:'묻는 줄부터 찾기', M06:'수의 순서 익히기', M10:'크기 말고 개수로 세기'};
  const label = wrong.length === 0 ? '참 잘했어요' : wrong.length <= 2 ? '잘했어요' : '열심히 했어요';
  app.innerHTML = `<div class="finish"><div class="stamp">${label}<small>${new Date().getMonth()+1}월 ${new Date().getDate()}일</small></div><h2>${esc(DATA.title.replace(/ — .*/, ''))}</h2>
   <p>${Q.length}문제 중 ${okN}문제를 맞혔어요${pend ? ` · ${pend}문제는 선생님이 확인해요` : ''}</p>
   ${topMis ? `<div class="weak">이번에 연습할 것 하나 — <b>${MISNAME[topMis[0]] || '다시 차근차근 세기'}</b></div>` : ''}
   <div class="row">${wrong.length ? `<button class="big" id="retry">다시 해볼까? (${wrong.length})</button>` : ''}<button class="big ghost" id="again">처음부터</button></div></div>`;
  TTS.speak(`${label}. ${Q.length}문제 중 ${okN}문제를 맞혔어요.` + (topMis ? ` 이번에 연습할 것은 ${MISNAME[topMis[0]] || ''}` : ''));
  const rt = document.getElementById('retry'); if (rt) rt.onclick = () => { const r = rng(Date.now() & 0xffff); Q = wrong.map(x => prep(makeVariant(DATA.questions[x.q.seq - 1], r))); state.answers = {}; idx = 0; state.retry = true; save(); renderQ(); };
  document.getElementById('again').onclick = () => { Q = DATA.questions.map(prep); state.answers = {}; idx = 0; state.retry = false; save(); renderQ(); };
}

/* ===================== 종이(A4) 모드 ===================== */
function paperAsset(a){
  if (!a) return ''; if (typeof a === 'string') return '';
  switch (a.type){
    case 'count_group': case 'scatter_group': return `<div class="passet">${a.item.repeat(a.n)}</div>`;
    case 'dots': return `<div class="passet small">${'●'.repeat(a.n)}</div>`;
    case 'hidden_group': return `<div class="passet">${a.item.repeat(a.visible)}<span class="pbox">?</span></div>`;
    case 'picto_table': return `<table class="picto-p">${a.rows.map(rw => `<tr><td>${esc(rw.label)}</td><td>${rw.item.repeat(rw.n)}</td></tr>`).join('')}</table>`;
    case 'rule': return `<div class="passet small">${a.cells.map(n => '●'.repeat(n)).join(' → ')} → <span class="pbox">&nbsp;&nbsp;</span></div>`;
    case 'pair_boxes': return `<div class="passet small"><span class="pbox">${'●'.repeat(a.left)}</span> <span class="pbox">${'●'.repeat(a.right)}</span></div>`;
  } return '';
}
function paperOptText(t){ return typeof t === 'object' ? (t.type === 'dots' ? '●'.repeat(t.n) : t.item.repeat(t.n)) : esc(t); }
function renderPaper(){
  document.body.classList.add('paper'); const Qp = DATA.questions.map(prep); const r = rng(SEED); const circ = ['①','②','③','④'];

  const half = Math.ceil(Qp.length / 2);

    if (q.kind === 'sa') body = `<div class="pline"></div>`;
    else if (q.kind === 'essay') body = `<div class="pline long"></div>`;
    else if (q.kind === 'match') body = `<div class="pmatch">${q.pairs.map(p => `<div class="lft">${paperOptText(p.l)}</div><div class="mid">·&nbsp;&nbsp;&nbsp;·</div><div class="rgt">${paperOptText(p.r)}</div>`).join('')}</div>`;
    else if (q.kind === 'ox') body = `<div class="popts"><span data-n="O">맞아요</span><span data-n="X">틀려요</span></div><div class="popts" style="margin-top:6px">${q.reason_options.map((o, k) => `<span data-n="${circ[k]}">${esc(o.t)}</span>`).join('')}</div>`;
    else body = `<div class="popts">${x.opts.map((o, k) => `<span data-n="${circ[k]}">${paperOptText(o.t)}</span>`).join('')}</div>`;
    return `<div class="pq"><span class="pn">${i + 1}</span><span class="pstem">${esc(q.stem.replace(/\n/g, ' '))}</span>${paperAsset(q.asset)}${body}</div>`; };
  const page = (items, off, n) => `<div class="sheet"><div class="ph"><div><h1>${esc(title)}</h1><div class="meta">1학년 수학 · ${sub}</div></div><div class="idbox"><span>반</span><span>번호</span></div></div>${items.map((x, i) => qhtml(x, off + i)).join('')}<div class="pfoot"><span>케이학습지 · keduclass.com</span><span>${n}</span></div></div>`;
  // 교사용 정답표
  const key = `<div class="sheet"><div class="ph"><div><h1>${esc(title)} — 교사용</h1><div class="meta">정답 · 개념 · 오답 선택지의 오개념</div></div></div>
   <table class="key"><tr><th>번호</th><th>난이도</th><th>유형</th><th>정답</th><th>개념</th><th>오답 → 오개념</th></tr>${shuffled.map((x, i) => { const q = x.q; let ans = '';
     if (q.kind === 'sa') ans = q.answer.join(' / '); else if (q.kind === 'essay') ans = q.answer_guide.answer + ' (채점: ' + q.answer_guide.scoring_points.join(' · ') + ')'; else if (q.kind === 'match') ans = q.pairs.map(p => `${paperOptText(p.l)}–${paperOptText(p.r)}`).join(', ');
     else if (q.kind === 'ox') ans = q.answer + ' / ' + circ[q.reason_options.findIndex(o => o.correct)]; else ans = circ[x.opts.findIndex(o => o.correct)] + ' ' + paperOptText(x.opts.find(o => o.correct).t);
     const mis = q.options ? x.opts.map((o, k) => o.mis ? `${circ[k]}→${o.mis}` : '').filter(Boolean).join(' ') : (q.reason_options ? q.reason_options.filter(o => o.mis).map(o => o.mis).join(' ') : '');
     return `<tr><td>${i + 1}</td><td>D${q.difficulty}</td><td>${q.kind}</td><td>${ans}</td><td>${q.concept}</td><td>${mis}</td></tr>`; }).join('')}</table>
   <p style="font-size:12px;color:#555;margin-top:14px">오개념 코드: M01 세기 누락·중복 · M02 수 읽기 혼동 · M03 기수성 · M05 기준 무시 · M06 순서 혼동 · M10 크기로 비교 (정본: handoff/kedu/worksheet/g1_math_u1/개념트리_오개념.md)</p></div>`;

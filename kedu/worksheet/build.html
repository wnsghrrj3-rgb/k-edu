<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이학습지 — 쪽지 만들기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF9F5;--card:#fff;--ink:#2E3338;--soft:#5A6169;--muted:#8B9199;--rule:#D3CABA;--tint:#F3F0EA}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Gowun Dodum',sans-serif;color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:40px 18px 80px}
h1{font-family:'Gowun Batang',serif;font-size:26px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);font-size:15px;margin:0 0 26px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs.top{margin-bottom:14px}
.tabs.top button{font-size:16px;font-weight:600}
.tabs.sub{border-bottom:0;margin-bottom:12px}
.tabs.sub button{font-size:13.5px;padding:6px 12px;border:1px solid var(--rule);border-radius:999px;margin-right:2px}
.tabs.sub button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.soon{padding:26px 22px;border:1px dashed var(--rule);border-radius:12px;color:var(--muted);line-height:1.8;font-size:14.5px}
.soon b{color:var(--ink)}
.ulist li .pt{flex:0 0 auto;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.ulist li .pt input{width:38px;padding:3px 4px;font-size:12px;text-align:center}
.ulist li .mv{flex:0 0 auto;display:flex;gap:2px}
.ulist li .mv button,.ulist li .sw{background:none;border:1px solid var(--rule);border-radius:6px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;padding:1px 6px}
.badge{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);margin-left:6px}
.badge.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
.panel h2{font-family:'Gowun Batang',serif;font-size:16px;font-weight:700;margin:0 0 14px;color:var(--soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
select,input[type=text]{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink)}
.qlist{max-height:560px;overflow:auto;border-top:1px solid var(--rule)}
.q{display:flex;gap:10px;padding:12px 4px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:flex-start}
.q:hover{background:var(--tint)}
.q.sel{background:#F0F4F0}
.q .chk{flex:0 0 20px;height:20px;border:1.5px solid var(--rule);border-radius:5px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.q.sel .chk{background:#4A7A5C;border-color:#4A7A5C}
.q .body{flex:1;min-width:0}
.q .stem{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.tagrow{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:2px 7px;border-radius:99px;background:var(--tint);color:var(--soft)}
.tag.d1{background:#EEF3EE;color:#4A7A5C}.tag.d2{background:#EDF1F5;color:#4A6A8A}
.tag.d3{background:#F5F0E8;color:#8A6A3A}.tag.d4{background:#F5EDED;color:#8A4A4A}
.tag.mis{background:#F7F1F1;color:#9A5A5A}
.cart{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto}
.cart li{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.cart .n{flex:0 0 20px;color:var(--muted)}
.cart .x{flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:15px}
.btn{font:inherit;font-size:15px;padding:10px 18px;border-radius:8px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:#fff;color:var(--soft);border:1px solid var(--rule)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mixbar{display:flex;gap:4px;margin:10px 0 4px}
.mixbar div{height:6px;border-radius:3px}
.hint{font-size:13px;color:var(--muted);line-height:1.7;margin-top:10px}
.setrow{padding:14px 0;border-bottom:1px solid var(--rule)}
.setrow h3{font-size:16px;font-weight:400;margin:0 0 4px}
.setrow .meta{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule)}
th{color:var(--muted);font-weight:400;font-size:12.5px}
.gate{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
<script src="/kedu_teacher_gate.js"></script>
</head>
<body>
<div class="wrap">
  <h1>케이학습지</h1>
  <p class="sub">문항 원장에서 골라 담고, 우리 반에 엽니다. 학생은 링크 없이 자기 화면에서 만납니다.</p>
  <!-- 3종 설계 v2 §5: 차시 쪽지 · 단원 평가 · 수행평가. W1 = 골격 + ① 완성, ②③은 W2·W4 에서 채운다. -->
  <div class="tabs top" id="topTabs">
    <button data-top="quiz" class="on">차시 쪽지</button>
    <button data-top="unit">단원 평가</button>
    <button data-top="perf">수행평가</button>
  </div>
  <div class="tabs sub" id="subTabs">
    <button data-tab="build" class="on">조립</button>
    <button data-tab="mine">내 쪽지</button>
  </div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/kedu_back.js" data-mode="context"></script>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== 케이학습지 쪽지 조립 v1 =====================
   명세: handoff/kedu/평가모듈_설계_v1.md §11 E1
   원칙: 배포는 새 우주를 만들지 않는다 — 기존 「우리 반에 열기」(class_openings)에
         content_key = 'quiz:<set_id>' 한 줄로 나간다.
=================================================================== */
const db = getKeduDb();
const view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DIFFNAME = {1:'D1 기본', 2:'D2 적용', 3:'D3 도전', 4:'D4 심화'};
const KINDNAME = {mc:'선택', sa:'단답', ox:'OX', error:'오류찾기', blank:'빈칸', data:'자료읽기', match:'연결', essay:'서술'};

/* 학생 카드 라벨 — 3종 설계 v2 §2·§3-2. 평가 단어 없이, 종류마다 한 낱말.
   ① 차시 쪽지 = 「오늘 확인 · {이름}」 / ② 단원 평가 = 「단원 정리 · {이름}」. */
const CARD_LABEL = { quiz: '오늘 확인', unit_test: '단원 정리' };
let ME = null, BANK = [], CONCEPTS = [], CLASSES = [], CART = [], TAB = 'build', TOP = 'quiz';
// ?tab=mine — 미리보기에서 「내 쪽지로」 돌아올 때 그 탭으로 연다(2026-09-04)
if (new URLSearchParams(location.search).get('tab') === 'mine'){ TAB = 'mine'; document.querySelectorAll('#subTabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'mine')); }

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------- 입장 ---------- */
(async function boot(){
  view.innerHTML = `<div class="gate">불러오는 중…</div>`;
  const { data:{ session } } = await db.auth.getSession();
  if (!session){ view.innerHTML = `<div class="gate">선생님 로그인이 필요해요.<br><br><a class="btn" href="/auth/?redirect=${encodeURIComponent(location.href)}">로그인</a></div>`; return; }

  const { data: t } = await db.from('teachers').select('id, name').eq('user_id', session.user.id).maybeSingle();
  if (!t){ view.innerHTML = `<div class="gate">교사 계정이 아니에요.</div>`; return; }
  ME = t;

  const [{ data: qs }, { data: cs }, { data: cc }] = await Promise.all([
    db.from('question_bank')
      .select('id, qcode, grade, subject, unit_code, lesson_code, concept_code, difficulty, qkind, stem, misconception_codes, source_kind, source_set')
      .eq('is_active', true).order('grade').order('unit_code').order('lesson_code').order('difficulty').limit(2000),
    db.from('concepts').select('code, name, lesson_no, unit_code, grade').eq('is_active', true).order('ord'),
    db.from('class_codes').select('id, code, is_active').eq('teacher_id', t.id).eq('is_active', true)
  ]);

  // 원장이 비어 있으면 승인 대기이거나 시드 미적용 — 둘을 구분해서 말해 준다.
  if (!qs){ view.innerHTML = `<div class="gate">문항 원장을 읽을 수 없어요.<br>승인된 선생님 계정만 원장을 볼 수 있어요.</div>`; return; }

  BANK = qs; CONCEPTS = cs || []; CLASSES = cc || [];
  render();
})();

document.querySelectorAll('#subTabs button').forEach(b => b.onclick = () => {
  TAB = b.dataset.tab;
  document.querySelectorAll('#subTabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.querySelectorAll('#topTabs button').forEach(b => b.onclick = () => {
  TOP = b.dataset.top;
  document.querySelectorAll('#topTabs button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('subTabs').style.display = TOP === 'perf' ? 'none' : '';
  document.querySelector('#subTabs [data-tab="mine"]').textContent = TOP === 'unit' ? '내 단원 평가' : '내 쪽지';
  render();
});

function render(){
  if (TOP === 'unit') return TAB === 'mine' ? renderMine('unit_test') : renderUnit();
  if (TOP === 'perf') return renderSoon('perf');
  TAB === 'build' ? renderBuild() : renderMine('quiz');
}
/* ②③ 은 아직 없는 화면이다 — 없는 것을 있는 척하지 않고, 무엇이 올지와 지금 대신 쓸 길을 적는다. */
function renderSoon(which){
  const SOON = {
    perf: `<b>수행평가</b>는 준비 중이에요.<br>단원별 과제 카드(영역 · 성취기준 · 산출물 종류) → 우리 반에 열기 → 학생 제출(사진 · 글) → 채점 그리드 → 공개 순서로 이어질 예정입니다.<br><br>1학년 수학 1단원 과제 카드 7건은 핸드오프 <code>kedu/worksheet/g1_math_u1/</code> 에 정본이 있어요.`
  };
  view.innerHTML = `<div class="soon">${SOON[which]}</div>`;
}

/* ---------- 조립 화면 ---------- */
function filtered(){
  const g = f('fGrade'), u = f('fUnit'), l = f('fLesson'), c = f('fConcept'), d = f('fDiff'), k = f('fKind'), qword = (f('fWord') || '').trim();
  return BANK.filter(q =>
    (!g || String(q.grade) === g) && (!u || q.unit_code === u) &&
    (!l || q.lesson_code === l) && (!c || q.concept_code === c) &&
    (!d || String(q.difficulty) === d) && (!k || q.qkind === k) &&
    (!qword || q.stem.includes(qword)));
}
function f(id){ const el = document.getElementById(id); return el ? el.value : ''; }
const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort();

function renderBuild(){
  const grades = uniq(BANK.map(q => q.grade)), units = uniq(BANK.map(q => q.unit_code));
  const lessons = uniq(BANK.map(q => q.lesson_code)), kinds = uniq(BANK.map(q => q.qkind));
  view.innerHTML = `<div class="cols">
    <div class="panel">
      <h2>문항 원장 <span style="color:var(--muted);font-weight:400">${BANK.length}문항</span></h2>
      <div class="filters">
        <select id="fGrade"><option value="">전체 학년</option>${grades.map(g => `<option>${g}</option>`).join('')}</select>
        <select id="fUnit"><option value="">전체 단원</option>${units.map(u => `<option>${u}</option>`).join('')}</select>
        <select id="fLesson"><option value="">전체 차시</option>${lessons.map(l => `<option>${l}</option>`).join('')}</select>
        <select id="fConcept"><option value="">전체 개념</option>${CONCEPTS.map(c => `<option value="${c.code}">${c.lesson_no ? c.lesson_no + '차시 · ' : ''}${esc(c.name)}</option>`).join('')}</select>
        <select id="fDiff"><option value="">전체 난이도</option>${[1,2,3,4].map(d => `<option value="${d}">${DIFFNAME[d]}</option>`).join('')}</select>
        <select id="fKind"><option value="">전체 유형</option>${kinds.map(k => `<option value="${k}">${KINDNAME[k] || k}</option>`).join('')}</select>
        <input type="text" id="fWord" placeholder="발문 검색" style="width:130px">
      </div>
      <div class="qlist" id="qlist"></div>
    </div>

    <div>
      <div class="panel">
        <h2>담은 문항 <span id="cartN" style="color:var(--muted);font-weight:400"></span></h2>
        <div class="mixbar" id="mixbar"></div>
        <div class="hint" id="mixtext"></div>
        <ul class="cart" id="cart"></ul>
        <input type="text" id="title" placeholder="쪽지 이름 (예: 1단원 수 세기 쪽지)" style="width:100%;margin-top:14px">
        <div class="row">
          <button class="btn" id="save" disabled>쪽지 저장</button>
          <button class="btn ghost" id="clear">비우기</button>
        </div>
      </div>

      <div class="panel" style="margin-top:16px">
        <h2>빠른 조립</h2>
        <div class="filters">
          <select id="qaLesson"><option value="">차시 고르기</option>${uniq(CONCEPTS.map(c => c.lesson_no)).sort((a, b) => a - b).map(l => `<option value="${l}">${l}차시</option>`).join('')}</select>
          <select id="qaConcept">${CONCEPTS.map(c => `<option value="${c.code}" data-lesson="${c.lesson_no || ''}">${c.lesson_no ? c.lesson_no + '차시 · ' : ''}${esc(c.name)}</option>`).join('')}</select>
          <select id="qaN">${[5,8,10,15].map(n => `<option value="${n}"${n === 5 ? ' selected' : ''}>${n}문항</option>`).join('')}</select>
          <select id="qaMix"><option value="basic">기본 배합</option><option value="challenge">도전 배합</option></select>
        </div>
        <button class="btn ghost" id="qaGo">배합대로 담기</button>
        <p class="hint">차시를 고르면 그 차시 개념이 자동으로 잡혀요. 기본 = D1·D2 위주, 도전 = D3·D4 위주. 같은 개념 안에서 유형이 겹치지 않도록 골라 담습니다.</p>
      </div>
    </div>
  </div>`;

  ['fGrade','fUnit','fLesson','fConcept','fDiff','fKind'].forEach(id => document.getElementById(id).onchange = drawList);
  document.getElementById('fWord').oninput = drawList;
  document.getElementById('clear').onclick = () => { CART = []; drawList(); drawCart(); };
  document.getElementById('save').onclick = saveSet;
  document.getElementById('qaGo').onclick = quickAssemble;
  // 차시 선택 → 그 차시의 첫 개념이 자동 선택(§2 「차시 선택 → 그 차시의 개념이 자동 체크」)
  document.getElementById('qaLesson').onchange = e => {
    const l = e.target.value, sel = document.getElementById('qaConcept');
    const opt = Array.from(sel.options).find(o => o.dataset.lesson === l);
    if (opt) sel.value = opt.value;
  };
  drawList(); drawCart();
}

function drawList(){
  const list = filtered();
  document.getElementById('qlist').innerHTML = list.length
    ? list.map(q => {
        const on = CART.some(x => x.id === q.id);
        const cname = (CONCEPTS.find(c => c.code === q.concept_code) || {}).name || q.concept_code || '';
        return `<div class="q ${on ? 'sel' : ''}" data-id="${q.id}">
          <div class="chk">${on ? '✓' : ''}</div>
          <div class="body">
            <div class="stem">${esc(q.stem)}</div>
            <div class="tagrow">
              <span class="tag d${q.difficulty}">${DIFFNAME[q.difficulty]}</span>
              <span class="tag">${KINDNAME[q.qkind] || q.qkind}</span>
              ${q.lesson_code ? `<span class="tag">${esc(q.lesson_code)}</span>` : ''}
              <span class="tag">${esc(cname)}</span>
              ${(q.misconception_codes || []).map(m => `<span class="tag mis">${esc(m)}</span>`).join('')}
            </div>
          </div></div>`;
      }).join('')
    : `<div class="hint" style="padding:24px 0;text-align:center">조건에 맞는 문항이 없어요.</div>`;

  document.getElementById('qlist').querySelectorAll('.q').forEach(el => el.onclick = () => {
    const q = BANK.find(x => x.id === el.dataset.id);
    const i = CART.findIndex(x => x.id === q.id);
    i >= 0 ? CART.splice(i, 1) : CART.push(q);
    drawList(); drawCart();
  });
}

function drawCart(){
  document.getElementById('cartN').textContent = CART.length ? `${CART.length}문항` : '';
  document.getElementById('save').disabled = CART.length === 0;
  const mix = [1,2,3,4].map(d => CART.filter(q => q.difficulty === d).length);
  const colors = ['#8FB09A','#8FA6C0','#C7AE84','#C08F8F'];
  document.getElementById('mixbar').innerHTML = CART.length
    ? mix.map((n, i) => n ? `<div style="flex:${n};background:${colors[i]}"></div>` : '').join('') : '';
  document.getElementById('mixtext').textContent = CART.length
    ? mix.map((n, i) => n ? `D${i+1} ${n}` : null).filter(Boolean).join(' · ') : '왼쪽에서 문항을 눌러 담으세요.';
  document.getElementById('cart').innerHTML = CART.map((q, i) =>
    `<li><span class="n">${i+1}</span><span style="flex:1">${esc(q.stem.slice(0, 46))}${q.stem.length > 46 ? '…' : ''}</span><button class="x" data-i="${i}">✕</button></li>`).join('');
  document.getElementById('cart').querySelectorAll('.x').forEach(b => b.onclick = () => { CART.splice(Number(b.dataset.i), 1); drawList(); drawCart(); });
}

/* 빠른 조립 — 개념 하나에서 배합대로. 유형이 한쪽으로 쏠리지 않게 라운드로빈으로 고른다. */
function quickAssemble(){
  const code = f('qaConcept'), n = Number(f('qaN')), mode = f('qaMix');
  const want = mode === 'basic' ? [0.4, 0.4, 0.2, 0] : [0, 0.2, 0.5, 0.3];
  const pool = BANK.filter(q => q.concept_code === code && !CART.some(x => x.id === q.id));
  if (!pool.length) return toast('그 개념에 남은 문항이 없어요.');
  const added = [];
  want.forEach((ratio, di) => {
    const need = Math.round(n * ratio);
    const byKind = {};
    pool.filter(q => q.difficulty === di + 1).forEach(q => (byKind[q.qkind] = byKind[q.qkind] || []).push(q));
    const kinds = Object.keys(byKind);
    for (let i = 0; added.filter(q => q.difficulty === di + 1).length < need && kinds.length; i++){
      const k = kinds[i % kinds.length], q = (byKind[k] || []).shift();
      if (q) added.push(q);
      if (!byKind[k] || !byKind[k].length) kinds.splice(kinds.indexOf(k), 1), i--;
    }
  });
  if (!added.length) return toast('배합에 맞는 문항이 부족해요.');
  CART = CART.concat(added);
  drawList(); drawCart();
  toast(`${added.length}문항 담았어요.`);
}

/* ===================== ② 단원 평가 (W2, 3종 설계 v2 §3) =====================
   추천안이 먼저: 단원 고르기 → 개념 균배 + 난이도 D1:D2:D3:D4 = 8:8:6:3 을 문항 수에 맞춰 배분.
   §8-① 학년별 기본: 1~2학년 15문항·20분 / 3~6학년 25문항·30분.
   「동형 검사지로」 = 원장의 단원 종합 A~D(source_kind='unit_review', source_set) 를 그대로.
   편집 = 교체(같은 개념·난이도의 다른 문항)·삭제·순서·배점. 저장 = kind 'unit_test', show_result 기본 'after_close'(§8-②).
============================================================================ */
const UNIT_DEFAULT = g => (g <= 2 ? { n: 15, min: 20 } : { n: 25, min: 30 });
const UNIT_RATIO = [8, 8, 6, 3];                 // 단원 종합 배합(문항수행 설계 §4)
let UCART = [];                                  // [{q, points}]

/* 문항 수를 난이도 4단에 배분 — 반올림 오차는 D2 → D1 순으로 흡수해 합이 정확히 n 이 되게 */
function unitQuota(n){
  const total = UNIT_RATIO.reduce((a, b) => a + b, 0);
  const q = UNIT_RATIO.map(r => Math.floor(n * r / total));
  let rest = n - q.reduce((a, b) => a + b, 0);
  for (const i of [1, 0, 2, 3]) { while (rest > 0 && i < 4) { q[i]++; rest--; if (rest === 0) break; } if (rest === 0) break; }
  return q;
}
/* 추천안 — 개념별 균배(가장 적게 뽑힌 개념부터), 난이도 할당량 안에서, 유형이 쏠리지 않게 */
function recommend(unit, grade, n){
  const pool = BANK.filter(q => q.unit_code === unit && String(q.grade) === String(grade));
  const quota = unitQuota(n), picked = [], perConcept = {};
  const concepts = uniq(pool.map(q => q.concept_code));
  concepts.forEach(c => perConcept[c] = 0);
  quota.forEach((need, di) => {
    const cand = pool.filter(q => q.difficulty === di + 1);
    const usedKind = {};
    for (let k = 0; k < need; k++){
      // 가장 덜 뽑힌 개념 → 그 개념 안에서 덜 쓴 유형
      const order = concepts.slice().sort((a, b) => perConcept[a] - perConcept[b]);
      let q = null;
      for (const c of order){
        const cs = cand.filter(x => x.concept_code === c && !picked.includes(x)).sort((a, b) => (usedKind[a.qkind] || 0) - (usedKind[b.qkind] || 0));
        if (cs.length){ q = cs[0]; break; }
      }
      if (!q) break;
      picked.push(q); perConcept[q.concept_code]++; usedKind[q.qkind] = (usedKind[q.qkind] || 0) + 1;
    }
  });
  return picked;
}
function equivForms(unit, grade){
  return uniq(BANK.filter(q => q.unit_code === unit && String(q.grade) === String(grade) && q.source_kind === 'unit_review').map(q => q.source_set));
}
function formLabel(ss){ const m = String(ss).match(/review_([a-z])$/i); return m ? m[1].toUpperCase() + '형' : ss; }

function drawUnit(){
  const ul = document.getElementById('ulist'); if (!ul) return;
  const cnt = [0, 0, 0, 0]; UCART.forEach(x => cnt[x.q.difficulty - 1]++);
  const total = UCART.length || 1, pts = UCART.reduce((a, x) => a + x.points, 0);
  const colors = ['#8FB09A','#8FA6C0','#C7AE84','#C08F8F'];
  document.getElementById('uMixbar').innerHTML = UCART.length ? cnt.map((c, i) => c ? `<div style="flex:${c};background:${colors[i]}" title="${DIFFNAME[i + 1]} ${c}"></div>` : '').join('') : '';
  document.getElementById('uMixtext').textContent = UCART.length
    ? `${UCART.length}문항 · ${pts}점 · ` + cnt.map((c, i) => `D${i + 1} ${c}`).join(' · ') + ` · 개념 ${uniq(UCART.map(x => x.q.concept_code)).length}개`
    : '추천안을 만들거나 동형 검사지를 골라 담으세요.';
  ul.innerHTML = UCART.map((x, i) => `<li>
    <span class="n">${i + 1}</span>
    <span style="flex:1">${esc(x.q.stem)} <span class="badge">${DIFFNAME[x.q.difficulty]}</span><span class="badge">${KINDNAME[x.q.qkind] || x.q.qkind}</span></span>
    <span class="pt"><input type="number" min="1" max="10" value="${x.points}" data-pt="${i}"> 점</span>
    <span class="mv"><button data-up="${i}" ${i === 0 ? 'disabled' : ''}>↑</button><button data-dn="${i}" ${i === UCART.length - 1 ? 'disabled' : ''}>↓</button></span>
    <button class="sw" data-sw="${i}">교체</button>
    <button class="x" data-rm="${i}">×</button>
  </li>`).join('');
  ul.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { UCART.splice(Number(b.dataset.rm), 1); drawUnit(); });
  ul.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const i = Number(b.dataset.up); [UCART[i - 1], UCART[i]] = [UCART[i], UCART[i - 1]]; drawUnit(); });
  ul.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { const i = Number(b.dataset.dn); [UCART[i + 1], UCART[i]] = [UCART[i], UCART[i + 1]]; drawUnit(); });
  ul.querySelectorAll('[data-pt]').forEach(inp => inp.onchange = () => { UCART[Number(inp.dataset.pt)].points = Math.max(1, Number(inp.value) || 1); drawUnit(); });
  // 교체 = 같은 개념·같은 난이도의 아직 안 담은 문항으로(없으면 같은 난이도 아무 개념)
  ul.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.sw), cur = UCART[i].q, inUse = UCART.map(x => x.q.id);
    const same = q => q.unit_code === cur.unit_code && q.grade === cur.grade && q.difficulty === cur.difficulty && !inUse.includes(q.id);
    const alt = BANK.find(q => same(q) && q.concept_code === cur.concept_code) || BANK.find(same);
    if (!alt) return toast('바꿀 문항이 남아 있지 않아요.');
    UCART[i] = { q: alt, points: alt.qkind === 'essay' ? 3 : UCART[i].points }; drawUnit();
  });
  const sv = document.getElementById('uSave'); if (sv) sv.disabled = !UCART.length;
}
async function saveUnit(){
  if (!UCART.length) return;
  const first = UCART[0].q;
  const title = (document.getElementById('uTitle').value || '').trim() || (first.unit_code + ' 단원 정리');
  const show = f('uShow') || 'after_close', min = Number(f('uMin')) || null;
  const { data: set, error } = await db.from('quiz_sets').insert({
    teacher_id: ME.id, title, kind: 'unit_test', subject: first.subject, grade: first.grade, unit_code: first.unit_code,
    show_result: show, time_min: min
  }).select('id').single();
  if (error) return toast('저장하지 못했어요. SQL v2(setup_worksheet_v2.sql)가 적용됐는지, 승인된 계정인지 확인해 주세요.');
  const items = UCART.map((x, i) => ({ set_id: set.id, ord: i + 1, question_id: x.q.id, points: x.points }));
  const { error: e2 } = await db.from('quiz_set_items').insert(items);
  if (e2) return toast('문항을 담지 못했어요.');
  UCART = []; TAB = 'mine';
  document.querySelectorAll('#subTabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'mine'));
  render();
  toast('단원 평가를 저장했어요. 우리 반에 열거나 종이로 뽑으세요.');
}

  }).select('id').single();

/* ---------- 내 쪽지 ---------- */
async function renderMine(kind){
  kind = kind || 'quiz';
  view.innerHTML = `<div class="gate">불러오는 중…</div>`;
  // show_result·result_opened_at·closed_at 은 SQL v2 열 — v1 원장이면 이 select 가 죽으므로 기본 열로 한 번 더 읽는다.
  let { data: sets, error } = await db.from('quiz_sets')
    .select('id, title, kind, grade, subject, unit_code, created_at, show_result, result_opened_at, closed_at, time_min, quiz_set_items(count)')
    .eq('teacher_id', ME.id).eq('is_archived', false).eq('kind', kind).order('created_at', { ascending: false });
  if (error){ ({ data: sets } = await db.from('quiz_sets')
    .select('id, title, kind, grade, subject, unit_code, created_at, quiz_set_items(count)')
    .eq('teacher_id', ME.id).eq('is_archived', false).eq('kind', kind).order('created_at', { ascending: false })); }

    return `<div class="setrow">
      <h3>${esc(s.title)}</h3>
      <div class="meta">${n}문항 · ${s.grade}학년 · ${new Date(s.created_at).toLocaleDateString('ko-KR')}
        ${names.length ? ` · <b>열린 반: ${names.map(esc).join(', ')}</b>` : ' · 아직 열지 않음'}
        ${s.kind === 'unit_test' ? ` · ${revealText(s)}${s.closed_at ? ' · <b>마감됨</b>' : ''}` : ''}</div>
      <div class="row">
        <select data-cls="${s.id}">${CLASSES.length ? CLASSES.map(c => `<option value="${c.id}">${esc(c.code)}</option>`).join('') : '<option value="">학급 없음</option>'}</select>

        <button class="btn ghost" data-prev="${s.id}">미리보기</button>
        ${s.kind === 'unit_test' ? `<button class="btn ghost" data-paper="${s.id}">종이 문제지</button>` : ''}

function revealText(s){
  if (!s.show_result || s.show_result === 'immediate') return '결과 바로 공개';

  const { error } = await db.rpc('open_for_class', {
    p_class_code_id: classId,
    p_content_key: 'quiz:' + setId,

  const qname = id => { const q = BANK.find(x => x.id === id); return q ? q.stem.slice(0, 40) : '(문항)'; };
  box.innerHTML = `
    ${mis && mis.length ? `<table><tr><th>막힌 곳</th><th>학생</th><th>횟수</th><th>이렇게 도와주세요</th></tr>
      ${mis.map(m => `<tr><td>${esc(m.misconception_title || m.misconception_code || '기타')}</td>
        <td>${m.students}명</td><td>${m.hits}</td><td style="color:var(--soft)">${esc(m.teacher_hint || '')}</td></tr>`).join('')}</table>` : ''}
    ${items && items.length ? `<table><tr><th>정답률이 낮은 문항</th><th>정답률</th><th>응답</th></tr>
      ${items.slice(0, 5).map(it => `<tr><td>${esc(qname(it.question_bank_id))}…</td><td>${it.pct_correct}%</td><td>${it.n}</td></tr>`).join('')}</table>` : ''}
    <p class="hint">정답률이 20% 아래이거나 100%인 문항은 원장에서 손볼 후보예요.</p>`;
}
</script>
</body>
</html>

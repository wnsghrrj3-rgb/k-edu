<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수행 과제 — 케이에듀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#FBF8F2;--card:#fff;--ink:#2B2620;--soft:#5B534A;--muted:#8B8378;--rule:#E6DFD3;--accent:#5B8EF8;--accent-soft:#EBF4FF;--ok:#3d7a52;--ok-soft:#E4F0E5;--wait:#a08a3a;--wait-soft:#F7F0D9;--radius:18px;--shadow:0 2px 18px rgba(43,38,32,.07)}
body{font-family:'Gowun Dodum',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--rule)}
.bar .brand{font-family:'Gowun Batang',serif;font-weight:700;color:var(--accent)}
.bar a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:14px}
.page{max-width:640px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
.tag{display:inline-block;font-size:12.5px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;margin-bottom:10px}
h1{font-family:'Gowun Batang',serif;font-size:24px;line-height:1.4;margin-bottom:12px}
.task{font-size:20px;line-height:1.75;margin-bottom:10px}
.tts{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.checks{list-style:none;margin-top:14px}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule);font-size:17px;line-height:1.5}
.checks input{width:24px;height:24px;flex:0 0 auto;margin-top:3px}
.checks label{flex:1;cursor:pointer}
.big{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-size:19px;font-weight:700;cursor:pointer;margin-top:14px}
.big:disabled{opacity:.45;cursor:default}
.big.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
textarea{width:100%;min-height:120px;padding:14px;border:1px solid var(--rule);border-radius:14px;font:inherit;font-size:18px;line-height:1.6;resize:vertical}
.photo{margin-top:12px}
.photo img{max-width:100%;border-radius:14px;display:block;margin-top:10px}
.note{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:10px}
.done{text-align:center;padding:30px 10px}
.done .stamp{display:inline-block;background:var(--ok-soft);color:var(--ok);font-family:'Gowun Batang',serif;font-size:22px;font-weight:700;padding:14px 26px;border-radius:999px;margin-bottom:14px}
.done p{font-size:17px;line-height:1.7}
.wait{background:var(--wait-soft);color:var(--wait);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:12px}
.result{margin-top:12px}
.result .lv{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--rule);font-size:16px}
.result .lv b{color:var(--ok)}
.msg{color:var(--muted);text-align:center;padding:30px 0;font-size:15px;line-height:1.7}
.peeknote{background:var(--wait-soft);color:var(--wait);font-size:13.5px;padding:8px 14px;text-align:center}
</style>
</head>
<body>
<div class="bar"><span class="brand">케이에듀</span><span id="ttl">수행 과제</span><a id="back" href="/mylearning/">내 학습</a></div>
<div id="peek" class="peeknote" style="display:none">선생님 미리보기예요. 보내도 기록에 남지 않아요.</div>
<div class="page" id="app"><div class="msg">불러오는 중…</div></div>

<script src="/kedu_back.js" data-mode="context"></script>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== 케이학습지 ③ 수행평가 — 학생 제출 화면 (W4, 설계 v2 §4-3) =====================
   perf.html?run=<performance_runs.id>[&preview=1]
   과제문 큰 글씨 + 읽어주기 · 조건 체크리스트 · 제출 1개(사진 찍기 / 글 쓰기, §8-③) · 저학년 상한(사진 1장·글 3줄)
   공개 뒤: 수준 라벨 + 선생님 한마디(점수 숫자 0). 재료는 get_perf_run() 한 문으로만 받는다.
====================================================================================== */
(function(){
  'use strict';
  var qs = new URLSearchParams(location.search);
  var RUN = qs.get('run') || '', PREVIEW = qs.get('preview') === '1';
  var app = document.getElementById('app'), db = getKeduDb();
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var TTS = { speak: function(t){ if (!('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = .95; speechSynthesis.speak(u); } catch(e){} } };
  var LEVELS = ['잘함', '보통', '노력 요함'];
  var D = null, checks = [], file = null, dataUrl = null;
  if (PREVIEW){ document.getElementById('peek').style.display = ''; document.getElementById('back').href = '/kedu/worksheet/build.html?tab=mine'; document.getElementById('back').textContent = '연 과제로'; }
  else if (window.KEDU_BACK && window.KEDU_BACK.fromTeacher){ document.getElementById('back').href = '/?role=teacher'; document.getElementById('back').textContent = '선생님 도구'; }

  function fail(msg){ app.innerHTML = '<div class="card"><div class="msg">' + msg + '</div></div>'; }
  if (!RUN) { fail('과제 주소가 없어요.'); return; }

  db.rpc('get_perf_run', { p_run_id: RUN }).then(function(res){
    if (!res || res.error || !res.data){ fail('과제를 열 수 없어요.<br>선생님이 아직 열지 않았거나, 우리 반 과제가 아니에요.'); return; }
    D = res.data; render();
  });

  function render(){
    var t = D.task, my = D.my || {};
    document.getElementById('ttl').textContent = t.student_label;
    if (my.submitted_at && !PREVIEW) return renderDone();
    if (D.closed && !PREVIEW) return fail('이 과제는 마감됐어요.<br>선생님께 여쭤보세요.');
    checks = (t.conditions || []).map(function(){ return false; });
    app.innerHTML = '<div class="card"><span class="tag">' + esc(t.area) + '</span>'
      + '<h1>' + esc(t.student_label) + '</h1>'
      + '<div class="task" id="task">' + esc(t.task_text) + '</div>'
      + '<button class="tts" id="tts" type="button">🔊 읽어주기</button>'
      + '<ul class="checks">' + (t.conditions || []).map(function(c, i){ return '<li><input type="checkbox" id="c' + i + '" data-i="' + i + '"><label for="c' + i + '">' + esc(c) + '</label></li>'; }).join('') + '</ul>'
      + '</div>'
      + '<div class="card" id="submit">' + (t.product_kind === 'photo' ? photoBox() : textBox()) + '</div>';
    document.getElementById('tts').onclick = function(){ TTS.speak(t.student_label + '. ' + t.task_text + '. ' + (t.conditions || []).join('. ')); };
    app.querySelectorAll('input[type=checkbox]').forEach(function(cb){ cb.onchange = function(){ checks[+cb.dataset.i] = cb.checked; }; });
    wire();
    TTS.speak(t.task_text);
  }
  function photoBox(){
    return '<div class="task">사진을 한 장 찍어서 보내요.</div>'
      + '<div class="note">얼굴이 나오지 않게, 찾은 것만 찍어요.</div>'
      + '<input type="file" id="file" accept="image/*" capture="environment" style="display:none">'
      + '<button class="big ghost" id="pick" type="button">📷 사진 찍기</button>'
      + '<div class="photo" id="preview"></div>'
      + '<button class="big" id="send" type="button" disabled>선생님께 보내기</button>';
  }
  function textBox(){
    return '<div class="task">여기에 써요. 세 줄이면 돼요.</div>'
      + '<textarea id="ta" rows="3" maxlength="300" placeholder="첫 줄부터 써 보세요."></textarea>'
      + '<div class="note" id="cnt">0 / 300</div>'
      + '<button class="big" id="send" type="button" disabled>선생님께 보내기</button>';
  }
  function wire(){
    var send = document.getElementById('send');
    if (D.task.product_kind === 'photo'){
      var inp = document.getElementById('file');
      document.getElementById('pick').onclick = function(){ inp.click(); };
      inp.onchange = function(){
        file = inp.files && inp.files[0]; if (!file) return;
        var r = new FileReader(); r.onload = function(){ dataUrl = r.result; document.getElementById('preview').innerHTML = '<img src="' + dataUrl + '" alt="내가 찍은 사진">'; send.disabled = false; }; r.readAsDataURL(file);
      };
    } else {
      var ta = document.getElementById('ta');
      ta.oninput = function(){
        // 저학년 상한: 3줄 — 넷째 줄로 넘어가면 자른다
        var lines = ta.value.split('\n'); if (lines.length > 3) ta.value = lines.slice(0, 3).join('\n');
        document.getElementById('cnt').textContent = ta.value.length + ' / 300';
        send.disabled = !ta.value.trim();
      };
    }
    send.onclick = submit;
  }
  function submit(){
    var send = document.getElementById('send'); send.disabled = true; send.textContent = '보내는 중…';
    if (PREVIEW || !D.student_id){ renderDone(true); return; }         // 미리보기: 기록 없음
    var t = D.task;
    var p = t.product_kind === 'photo' ? uploadPhoto() : Promise.resolve({ kind: 'text', payload: { text: document.getElementById('ta').value.trim() } });
    p.then(function(sub){
      return db.from('performance_submissions').upsert({ run_id: RUN, student_id: D.student_id, kind: sub.kind, payload: sub.payload, checks: checks, submitted_at: new Date().toISOString() }, { onConflict: 'run_id,student_id' });
    }).then(function(r){
      if (r && r.error) throw r.error;
      D.my = { submitted_at: new Date().toISOString() }; renderDone();
    }).catch(function(){ send.disabled = false; send.textContent = '선생님께 보내기'; alert('보내지 못했어요. 한 번 더 눌러 보세요.'); });
  }
  function uploadPhoto(){
    var ext = (file.type === 'image/png') ? 'png' : (file.type === 'image/webp') ? 'webp' : 'jpg';
    var path = D.class_code_id + '/' + RUN + '/' + D.student_id + '.' + ext;    // 버킷 정책의 경로 규약
    return db.storage.from('perf').upload(path, file, { upsert: true, contentType: file.type || 'image/jpeg' })
      .then(function(r){ if (r.error) throw r.error; return { kind: 'photo', payload: { path: path } }; });
  }
  function renderDone(preview){
    var res = D.result, t = D.task;
    var html = '<div class="card done"><div class="stamp">선생님께 보냈어요</div>'
      + '<p>' + esc(t.student_label) + '<br>' + (preview ? '미리보기라 기록에 남지 않았어요.' : '잘 받았어요. 선생님이 보고 나면 여기서 볼 수 있어요.') + '</p>';
    if (res && res.levels && t.rubric && t.rubric.criteria){
      html += '<div class="result">' + t.rubric.criteria.map(function(c, i){ var li = res.levels[String(i)]; return '<div class="lv"><span>' + esc(c.name) + '</span><b>' + esc(li == null ? '' : LEVELS[li]) + '</b></div>'; }).join('')
        + (res.memo ? '<div class="wait">선생님 한마디 — ' + esc(res.memo) + '</div>' : '') + '</div>';
    } else if (!preview) html += '<div class="wait">선생님이 확인 중이에요.</div>';
    html += '<a class="big ghost" style="text-decoration:none;text-align:center" href="' + document.getElementById('back').href + '">' + esc(document.getElementById('back').textContent) + '</a></div>';
    app.innerHTML = html;
  }
})();
</script>
</body>
</html>

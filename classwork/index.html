<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이박스 | K-edu 선생님</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8EF8;--primary-light:#EBF4FF;--primary-dark:#3B6FD8;--pink:#FF85A1;
  --bg:#F4F6FB;--card:#fff;--ink:#1A202C;--sub:#718096;--faint:#A0AEC0;--border:#E7ECF3;
  --radius:20px;--shadow:0 2px 18px rgba(33,52,94,.07);--shadow-lg:0 18px 50px rgba(33,52,94,.16);
  /* 케이에듀 콘텐츠 색 (도구별 정체성) */
  --c-kteacher:#FF85A1;--c-selfstudy:#7E57C2;--c-klab:#3BAB72;--c-kple:#FFB347;--c-kmake:#5B8EF8;--c-english:#B7791F;--c-link:#94A3B8;
}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* NAV */
.nav{background:var(--card);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:50}
.nav-logo{font-family:'Jua',sans-serif;font-size:22px;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.nav-logo .kk{background:linear-gradient(135deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-badge{font-family:'Jua',sans-serif;font-size:13px;background:var(--primary-light);color:var(--primary);padding:3px 12px;border-radius:50px}
.nav-back{font-size:13px;color:var(--sub);text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:1.5px solid var(--border);border-radius:50px;transition:all .15s;font-weight:500}
.nav-back:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

/* SHELL */
.wrap{max-width:1080px;margin:0 auto;padding:40px 26px 80px}

/* HERO */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.hero-left{max-width:560px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-light);padding:5px 13px;border-radius:50px;margin-bottom:14px}
.hero-title{font-family:'Jua',sans-serif;font-size:40px;line-height:1.15;letter-spacing:-1px;margin-bottom:10px}
.hero-title .pop{background:linear-gradient(120deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-desc{font-size:15px;color:var(--sub);line-height:1.65}
.btn-new{flex-shrink:0;height:54px;padding:0 26px;background:linear-gradient(120deg,var(--primary),#7AA6FF);color:#fff;border:none;border-radius:16px;font-family:'Jua',sans-serif;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;box-shadow:0 8px 22px rgba(91,142,248,.34);transition:transform .15s,box-shadow .15s}
.btn-new:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(91,142,248,.42)}
.btn-new:active{transform:translateY(0)}

/* STAT STRIP */
.stats{display:flex;gap:14px;margin-bottom:30px;flex-wrap:wrap}
.stat{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.stat-num{font-family:'Jua',sans-serif;font-size:30px;line-height:1;color:var(--ink)}
.stat-num.sent{color:#22A06B}
.stat-num.draft{color:var(--faint)}
.stat-label{font-size:12.5px;color:var(--sub);margin-top:7px;font-weight:500}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}

/* BUNDLE CARD */
.bcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;display:flex;flex-direction:column;gap:16px;min-height:188px}
.bcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:#D6E0F5}
.bcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.bcard-title{font-family:'Jua',sans-serif;font-size:21px;line-height:1.3;letter-spacing:-.3px}
.bcard-status{flex-shrink:0;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:50px;white-space:nowrap}
.st-sent{background:#E4F7EE;color:#1B8A5A}
.st-draft{background:#EEF1F6;color:#8A95A5}
.bcard-desc{font-size:13.5px;color:var(--sub);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
/* 담긴 콘텐츠 색 스택 (시그니처) */
.stack{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#fff;padding:4px 10px 4px 8px;border-radius:50px;line-height:1}
.chip .ico{font-size:13px}
.chip-more{font-size:12px;font-weight:700;color:var(--sub);background:var(--bg);padding:4px 9px;border-radius:50px}
.bcard-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:13px;font-size:12.5px;color:var(--faint)}
.bcard-class{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--sub)}
/* new card */
.bcard-new{border:2px dashed #CBD6EA;background:#FAFBFE;align-items:center;justify-content:center;text-align:center;color:var(--primary);box-shadow:none;gap:8px}
.bcard-new:hover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-5px);box-shadow:var(--shadow)}
.bcard-new .plus{width:48px;height:48px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--primary)}
.bcard-new:hover .plus{background:#fff}
.bcard-new .nl{font-family:'Jua',sans-serif;font-size:17px}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;background:var(--card);border:1.5px dashed var(--border);border-radius:24px}
.empty-emoji{font-size:60px;margin-bottom:18px}
.empty-title{font-family:'Jua',sans-serif;font-size:23px;margin-bottom:8px}
.empty-desc{font-size:14.5px;color:var(--sub);line-height:1.6;max-width:420px;margin:0 auto 24px}

/* ===== BUILDER (전체화면 슬라이드) ===== */
.scrim{position:fixed;inset:0;background:rgba(26,32,44,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.builder{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);box-shadow:-20px 0 60px rgba(33,52,94,.22);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.1,1);z-index:61;display:flex;flex-direction:column}
.builder.on{transform:translateX(0)}
.bd-head{background:var(--card);border-bottom:1px solid var(--border);padding:20px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.bd-head h2{font-family:'Jua',sans-serif;font-size:21px}
.bd-close{width:38px;height:38px;border-radius:50%;border:none;background:var(--bg);color:var(--sub);font-size:20px;cursor:pointer;transition:all .15s}
.bd-close:hover{background:#E7ECF3;color:var(--ink)}
.bd-body{flex:1;overflow-y:auto;padding:26px}
.field{margin-bottom:24px}
.field-label{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.field-label .req{color:var(--pink)}
.field-hint{font-size:12.5px;color:var(--faint);font-weight:400;margin-left:auto}
.inp{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:13px;font-family:'Noto Sans KR',sans-serif;font-size:15px;background:var(--card);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--primary)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.5}

/* 콘텐츠 종류 타일 */
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kind{border:1.5px solid var(--border);background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:7px}
.kind:hover{border-color:var(--kc);transform:translateY(-2px);box-shadow:var(--shadow)}
.kind .ke{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--kcl)}
.kind .kn{font-size:12.5px;font-weight:600;color:var(--ink)}
@media(max-width:560px){.kinds{grid-template-columns:repeat(3,1fr)}}

/* 담긴 항목 리스트 */
.items{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px}
.item .dot{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.item-body{flex:1;min-width:0}
.item-name{font-size:14.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:18px;padding:4px;border-radius:8px;transition:all .15s;flex-shrink:0}
.item-del:hover{color:#E53E3E;background:#FFF5F5}
.items-empty{text-align:center;padding:26px;color:var(--faint);font-size:13.5px;background:var(--card);border:1.5px dashed var(--border);border-radius:13px}

/* 빌더 푸터 */
.bd-foot{background:var(--card);border-top:1px solid var(--border);padding:16px 26px;display:flex;gap:10px;flex-shrink:0}
.bd-foot button{height:50px;border-radius:13px;font-family:'Jua',sans-serif;font-size:16px;cursor:pointer;transition:all .15s;border:none}
.btn-save{flex:1;background:var(--card);color:var(--sub);border:1.5px solid var(--border)}
.btn-save:hover{border-color:var(--sub);color:var(--ink)}
.btn-send{flex:1.4;background:linear-gradient(120deg,#22A06B,#2BB97C);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(34,160,107,.3)}
.btn-send:hover{transform:translateY(-1px)}
.btn-send:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* 항목 추가 미니 입력 */
.additem{background:var(--card);border:1.5px solid var(--primary);border-radius:13px;padding:14px;margin-top:10px;display:none}
.additem.on{display:block;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.additem .ai-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:10px}
.additem .ai-head .tag{color:#fff;padding:2px 10px;border-radius:50px;font-size:12px}
.additem .inp{margin-bottom:8px}
.ai-btns{display:flex;gap:8px}
.ai-btns button{flex:1;height:42px;border-radius:11px;font-size:14px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;border:none}
.ai-add{background:var(--primary);color:#fff}
.ai-cancel{background:var(--bg);color:var(--sub)}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:14px 26px;border-radius:50px;font-size:14px;font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:all .3s;display:flex;align-items:center;gap:9px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  .hero-title{font-size:32px}
  .wrap{padding:28px 18px 70px}
  .btn-new{width:100%;justify-content:center}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/"><span class="kk">K-edu</span> <span class="nav-badge">케이박스</span></a>
  <a class="nav-back" href="/teacher/">← 선생님 도구</a>
</nav>

<div class="wrap">

  <div class="hero">
    <div class="hero-left">
      <span class="hero-eyebrow">📦 선생님 본부</span>
      <h1 class="hero-title">케이에듀를 <span class="pop">한 박스</span>에 담아 보내요</h1>
      <p class="hero-desc">차시·교구·게임·작품을 골라 담아 우리 반에 보내고, 돌아온 결과를 한자리에서 보고 채점·피드백까지 — 흩어진 케이에듀를 하나로 잇는 곳이에요.</p>
    </div>
    <button class="btn-new" onclick="openBuilder()">＋ 새 박스</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="grid" id="grid"></div>

</div>

<!-- BUILDER -->
<div class="scrim" id="scrim" onclick="closeBuilder()"></div>
<aside class="builder" id="builder" aria-hidden="true">
  <div class="bd-head">
    <h2 id="bd-title">새 박스</h2>
    <button class="bd-close" onclick="closeBuilder()" aria-label="닫기">×</button>
  </div>
  <div class="bd-body">
    <div class="field">
      <label class="field-label">박스 이름 <span class="req">*</span></label>
      <input class="inp" id="f-title" type="text" placeholder="예: 6월 4주차 과학 탐구 활동" maxlength="40">
    </div>
    <div class="field">
      <label class="field-label">학생에게 보낼 안내 <span class="field-hint">학생이 받을 때 보여요</span></label>
      <textarea class="inp" id="f-desc" placeholder="예: 오늘은 별자리 교구로 탐구하고, 마무리 퀴즈까지 풀어볼 거예요!" maxlength="160"></textarea>
    </div>

    <div class="field">
      <label class="field-label">무엇을 담을까요? <span class="field-hint">눌러서 추가</span></label>
      <div class="kinds" id="kinds"></div>
      <div class="additem" id="additem"></div>
    </div>

    <div class="field">
      <label class="field-label">담은 콘텐츠 <span class="field-hint" id="item-count">0개</span></label>
      <div class="items" id="items"></div>
    </div>

    <div class="field">
      <label class="field-label">어느 반에 보낼까요? <span class="field-hint">보내기에 필요해요</span></label>
      <input class="inp" id="f-class" type="text" placeholder="예: 3학년 2반 (학급코드 연동은 곧 추가돼요)" maxlength="30">
    </div>
  </div>
  <div class="bd-foot">
    <button class="btn-save" onclick="saveBundle('draft')">임시 저장</button>
    <button class="btn-send" id="btn-send" onclick="saveBundle('sent')">📨 우리 반에 보내기</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
// ============ 콘텐츠 종류 정의 ============
const KINDS = {
  kteacher: {n:'케이티처', i:'📚', c:'var(--c-kteacher)', cl:'#FFE9EF', hex:'#FF85A1', hint:'교사 주도 차시'},
  selfstudy:{n:'자기주도', i:'🎒', c:'var(--c-selfstudy)',cl:'#EEE8F8', hex:'#7E57C2', hint:'학년·과목 차시'},
  klab:     {n:'케이랩',   i:'🧊', c:'var(--c-klab)',     cl:'#E3F4EB', hex:'#3BAB72', hint:'조작 교구'},
  kple:     {n:'케이플',   i:'🎮', c:'var(--c-kple)',     cl:'#FFF1DC', hex:'#FFB347', hint:'멀티 게임'},
  kmake:    {n:'케이메이커',i:'🎨', c:'var(--c-kmake)',    cl:'#E3EDFF', hex:'#5B8EF8', hint:'디자인 작품'},
  english:  {n:'영어',     i:'🔤', c:'var(--c-english)',  cl:'#F5ECD8', hex:'#B7791F', hint:'영어 활동'},
  link:     {n:'링크',     i:'🔗', c:'var(--c-link)',     cl:'#EEF1F6', hex:'#94A3B8', hint:'외부 자료'},
};

// ============ 상태 ============
const LS_KEY = 'cw_bundles_v1';
let bundles = load();
let draft = null;        // 편집 중 박스
let pendingKind = null;  // 추가 입력창에 떠 있는 종류

function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }
function persist(){ localStorage.setItem(LS_KEY, JSON.stringify(bundles)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ============ 목록 렌더 ============
function render(){
  const sent = bundles.filter(b=>b.status==='sent').length;
  const drafts = bundles.filter(b=>b.status==='draft').length;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><div class="stat-num">${bundles.length}</div><div class="stat-label">전체 박스</div></div>
     <div class="stat"><div class="stat-num sent">${sent}</div><div class="stat-label">우리 반에 보냄</div></div>
     <div class="stat"><div class="stat-num draft">${drafts}</div><div class="stat-label">작성 중</div></div>`;

  const grid = document.getElementById('grid');
  if(bundles.length === 0){
    grid.innerHTML = `<div class="empty">
      <div class="empty-emoji">📦</div>
      <div class="empty-title">아직 만든 박스가 없어요</div>
      <div class="empty-desc">케이에듀의 차시·교구·게임·작품을 골라 한 박스에 담으면, 우리 반에 한 번에 보낼 수 있어요.</div>
      <button class="btn-new" onclick="openBuilder()">＋ 첫 박스 만들기</button>
    </div>`;
    return;
  }
  const cards = bundles.map(bundleCard).join('');
  grid.innerHTML = cards + `<div class="bcard bcard-new" onclick="openBuilder()">
      <div class="plus">＋</div><div class="nl">새 박스</div></div>`;
}

function bundleCard(b){
  const items = b.items || [];
  const shown = items.slice(0,4).map(it=>{
    const k = KINDS[it.kind];
    return `<span class="chip" style="background:${k.hex}"><span class="ico">${k.i}</span>${k.n}</span>`;
  }).join('');
  const more = items.length>4 ? `<span class="chip-more">+${items.length-4}</span>` : '';
  const stat = b.status==='sent'
    ? `<span class="bcard-status st-sent">보냄</span>`
    : `<span class="bcard-status st-draft">작성 중</span>`;
  const cls = b.className ? `<span class="bcard-class">🏫 ${esc(b.className)}</span>` : `<span class="bcard-class" style="color:var(--faint)">미지정</span>`;
  return `<div class="bcard" onclick="openBuilder('${b.id}')">
    <div class="bcard-top"><div class="bcard-title">${esc(b.title)}</div>${stat}</div>
    <div class="bcard-desc">${b.desc? esc(b.desc) : '<span style=\"color:var(--faint)\">안내 문구가 없어요</span>'}</div>
    <div class="stack">${shown || '<span class="chip-more">콘텐츠 없음</span>'}${more}</div>
    <div class="bcard-foot">${cls}<span>${items.length}개 콘텐츠</span></div>
  </div>`;
}

// ============ 빌더 ============
function openBuilder(id){
  if(id){
    const b = bundles.find(x=>x.id===id);
    draft = JSON.parse(JSON.stringify(b));
    document.getElementById('bd-title').textContent = '박스 편집';
  } else {
    draft = { id:uid(), title:'', desc:'', className:'', items:[], status:'draft' };
    document.getElementById('bd-title').textContent = '새 박스';
  }
  document.getElementById('f-title').value = draft.title || '';
  document.getElementById('f-desc').value = draft.desc || '';
  document.getElementById('f-class').value = draft.className || '';
  renderKinds(); renderItems(); cancelAdd();
  document.getElementById('scrim').classList.add('on');
  document.getElementById('builder').classList.add('on');
  document.getElementById('builder').setAttribute('aria-hidden','false');
  setTimeout(()=>document.getElementById('f-title').focus(), 320);
}
function closeBuilder(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('builder').classList.remove('on');
  document.getElementById('builder').setAttribute('aria-hidden','true');
  draft = null;
}

function renderKinds(){
  document.getElementById('kinds').innerHTML = Object.entries(KINDS).map(([key,k])=>
    `<div class="kind" style="--kc:${k.hex};--kcl:${k.cl}" onclick="pickKind('${key}')">
      <div class="ke">${k.i}</div><div class="kn">${k.n}</div></div>`).join('');
}

function pickKind(key){
  pendingKind = key;
  const k = KINDS[key];
  const box = document.getElementById('additem');
  box.style.setProperty('--c', k.hex);
  box.innerHTML = `
    <div class="ai-head"><span class="tag" style="background:${k.hex}">${k.i} ${k.n}</span><span style="color:var(--sub);font-weight:500">무엇을 담을까요?</span></div>
    <input class="inp" id="ai-name" type="text" placeholder="콘텐츠 이름 (예: ${k.hint})" maxlength="50">
    <input class="inp" id="ai-url" type="text" placeholder="바로 열 링크 (선택) — 예: /kedu/teacher/">
    <div class="ai-btns">
      <button class="ai-cancel" onclick="cancelAdd()">취소</button>
      <button class="ai-add" onclick="confirmAdd()">담기</button>
    </div>`;
  box.classList.add('on');
  setTimeout(()=>document.getElementById('ai-name').focus(), 50);
}
function cancelAdd(){ pendingKind=null; document.getElementById('additem').classList.remove('on'); document.getElementById('additem').innerHTML=''; }
function confirmAdd(){
  const name = document.getElementById('ai-name').value.trim();
  const url  = document.getElementById('ai-url').value.trim();
  if(!name){ toast('콘텐츠 이름을 적어주세요'); document.getElementById('ai-name').focus(); return; }
  draft.items.push({ id:uid(), kind:pendingKind, name, url });
  cancelAdd(); renderItems();
}
function renderItems(){
  const wrap = document.getElementById('items');
  document.getElementById('item-count').textContent = (draft.items.length) + '개';
  if(draft.items.length===0){ wrap.innerHTML = `<div class="items-empty">위에서 콘텐츠 종류를 눌러 하나씩 담아보세요 📥</div>`; return; }
  wrap.innerHTML = draft.items.map(it=>{
    const k = KINDS[it.kind];
    const meta = it.url ? it.url : k.hint;
    return `<div class="item">
      <div class="dot" style="background:${k.hex}">${k.i}</div>
      <div class="item-body"><div class="item-name">${esc(it.name)}</div><div class="item-meta">${k.n} · ${esc(meta)}</div></div>
      <button class="item-del" onclick="delItem('${it.id}')" aria-label="삭제">🗑️</button>
    </div>`;
  }).join('');
}
function delItem(id){ draft.items = draft.items.filter(x=>x.id!==id); renderItems(); }

function saveBundle(mode){
  draft.title = document.getElementById('f-title').value.trim();
  draft.desc = document.getElementById('f-desc').value.trim();
  draft.className = document.getElementById('f-class').value.trim();
  if(!draft.title){ toast('박스 이름을 적어주세요'); document.getElementById('f-title').focus(); return; }
  if(mode==='sent'){
    if(draft.items.length===0){ toast('콘텐츠를 하나 이상 담아주세요'); return; }
    if(!draft.className){ toast('보낼 반을 적어주세요'); document.getElementById('f-class').focus(); return; }
    draft.status = 'sent'; draft.sentAt = Date.now();
  }
  const idx = bundles.findIndex(b=>b.id===draft.id);
  if(idx>=0) bundles[idx] = draft; else bundles.unshift(draft);
  persist(); render(); closeBuilder();
  toast(mode==='sent' ? '📨 우리 반에 보냈어요!' : '임시 저장했어요');
}

// ============ 유틸 ============
function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2600);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && draft) closeBuilder(); });

render();
</script>
</body>
</html>

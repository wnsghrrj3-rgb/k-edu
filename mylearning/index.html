<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 학습 | K-edu</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../kedu_config.js"></script>
<script src="../kedu_report_lib.js"></script>
<style id="kedu-title-font">
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
</style>
<style>
/* =============================================
   학생용 「내 학습」 v2 — 설계 §4
   · 점수 숫자·등수·비교 없음
   · 금지어: 부족·미달·하위·시험·점수 → "한 번 더!"
   · 미동의 학생은 입구 자체가 없으므로 이 화면은 프로필 보유자 전용
   · v2: 차시 이름을 지도 정본으로, 「내 지도」(단원별 차시 칸), 연속 학습일, 다음 걸음은 항상 있음
   ============================================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gc:#5B8EF8;
  --bg:#FDF9F3;--card:#fff;--text:#2D3142;--sub:#8B93A7;--border:#EFE8DC;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
body.lower{font-size:17px}       /* 1·2학년 — 큰 글씨 */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:10}
.back{text-decoration:none;color:var(--sub);font-size:14px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.top h1{font-family:var(--kedu-title);font-size:20px;color:var(--gc)}
.tts{margin-left:auto;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding:6px 16px 70px}
.hello{font-family:var(--kedu-title);font-size:22px;margin:10px 2px 16px}
.hello b{color:var(--gc)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.card h2{font-family:var(--kedu-title);font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
body.lower .card h2{font-size:19px}
.card h2 .ico{font-size:20px}
/* ① 내가 한 것 — 요일 점 */
.days{display:flex;justify-content:space-between;gap:6px}
.day{flex:1;text-align:center}
.day .c{width:38px;height:38px;border-radius:50%;background:var(--bg);border:2px solid var(--border);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:17px}
.day.on .c{background:var(--gc);border-color:var(--gc);color:#fff}
.day.today .c{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gc)}
.day .l{font-size:12px;color:var(--sub);margin-top:5px;font-weight:600}
.day.today .l{color:var(--gc)}
.streak{margin-top:12px;font-size:14.5px;text-align:center;color:var(--text);line-height:1.6}
body.lower .streak{font-size:16.5px}
.streak b{color:var(--gc)}
/* ② 탄탄한 것 — 뱃지 v3
   · 특별 뱃지(.tro) = 단원 완주 · 연속 학습 · 아침 지킴이 — 큰 카드, 데이터 있을 때만
   · 차시 뱃지(.badge) = 탄탄해진 차시 — 과목별 색·심볼로 구분(전에는 전부 같은 초록 🏅) */
.tros{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
.tro{display:flex;align-items:center;gap:10px;border-radius:16px;padding:11px 14px 11px 11px;border:1.5px solid;line-height:1.35;flex:1 1 190px;min-width:0}
.tro .m{width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:#fff}
.tro .t{font-family:var(--kedu-title);font-size:14.5px;display:block}
.tro .d{font-size:12.5px;opacity:.8;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.lower .tro .t{font-size:16.5px}
body.lower .tro .d{font-size:14px}
body.lower .tro .m{width:44px;height:44px;font-size:25px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:7px;background:#F7F8FA;border:1.5px solid #E2E8F0;color:#2D3142;border-radius:999px;padding:8px 14px 8px 9px;font-size:13.5px;font-weight:700;line-height:1.3}
body.lower .badge{font-size:15.5px;padding:10px 16px 10px 11px}
.badge .s{width:26px;height:26px;flex:none;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid rgba(0,0,0,.06)}
body.lower .badge .s{width:30px;height:30px;font-size:16px}
.badge small{font-weight:500;opacity:.7;font-size:.85em}
/* ③ 다시 해볼 것 · ④ 다음 걸음 */
.go-card{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;text-decoration:none;color:inherit;background:#fff}
.go-card:active{transform:scale(.99)}
.go-card .k{font-size:24px;flex:none}
.go-card .t{font-weight:700;font-size:15px;line-height:1.35}
body.lower .go-card .t{font-size:17px}
.go-card .t small{font-weight:500;color:var(--sub);font-size:.8em;display:block}
.go-card .w{font-size:12.5px;color:var(--sub);margin-top:2px}
body.lower .go-card .w{font-size:14px}
.go-card .go{margin-left:auto;flex:none;background:var(--gc);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
/* ⑤ 내 지도 — 단원별 차시 칸 */
.unit{margin-bottom:12px}
.unit:last-child{margin-bottom:0}
.unit .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:700}
body.lower .unit .t{font-size:16px}
.unit .t span{font-size:12px;color:var(--sub);font-weight:500;white-space:nowrap}
.unit .cells{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.unit .cells a,.unit .cells i{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-decoration:none;color:var(--sub);background:#fff;border:1.5px dashed var(--border)}
body.lower .unit .cells a,body.lower .unit .cells i{width:36px;height:36px;font-size:14px;border-radius:11px}
.unit .cells .solid{background:#68D391;border-style:solid;border-color:#68D391;color:#fff}
.unit .cells .edge{background:#F6E05E;border-style:solid;border-color:#F6E05E;color:#5F4B00}
.unit .cells .weak,.unit .cells .retry{background:#FFE8CC;border-style:solid;border-color:#F6AD55;color:#7B341E}
.unit .cells .watching,.unit .cells .touched{background:#EDF2F7;border-style:solid;border-color:#E2E8F0;color:#4A5568}
.unit .cells .next{border-style:solid;border-color:var(--gc);color:var(--gc);box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 20%,transparent)}
.map-legend{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.9}
.map-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:3px}
.empty{color:var(--sub);font-size:14px;padding:6px 2px}
body.lower .empty{font-size:16px}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.center{text-align:center;padding:70px 20px;color:var(--sub)}
.center .big{font-size:40px;margin-bottom:10px}
.center a{display:inline-block;margin-top:14px;background:var(--gc);color:#fff;border-radius:12px;padding:10px 18px;text-decoration:none;font-weight:700}
.spin{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/">← 처음으로</a>
  <h1>내 학습</h1>
  <button class="tts" id="tts-btn" onclick="speakPage()" title="읽어 주기">🔊 읽어 줘</button>
</div>
<div class="wrap" id="app">
  <div class="center"><div class="big"><span class="spin"></span></div>내 기록을 가져오는 중…</div>
</div>
<script>
const db = getKeduDb();
const KR = window.KeduReport;
const GRADE_COLOR = {1:'#FF85A1',2:'#FFB347',3:'#3BAB72',4:'#FF7043',5:'#3D90F0',6:'#7E57C2'};
// 과목별 뱃지 얼굴 — 뱃지가 8개 붙어도 무엇을 해냈는지 한눈에 갈리도록 색·심볼을 나눈다
const SUBJ_BADGE = {
  국어:{ico:'📗',bg:'#F0FAF4',bd:'#BEE3CE'},
  수학:{ico:'📘',bg:'#EEF4FF',bd:'#C3D4F7'},
  과학:{ico:'🔬',bg:'#F3F0FD',bd:'#D3C8F2'},
  사회:{ico:'🏛️',bg:'#FFF6E8',bd:'#F5D9AE'},
  영어:{ico:'🅰️',bg:'#FFF0F3',bd:'#F7C6D0'}
};
const SUBJ_FALLBACK = {ico:'⭐',bg:'#F7F8FA',bd:'#E2E8F0'};
// 연속 학습 단계 — 아래에서부터 처음 걸리는 것 하나만 준다
const STREAK_TIERS = [
  {n:20,t:'스무 밤 연속',ico:'🌟'}, {n:14,t:'두 주 연속',ico:'💎'},
  {n:7, t:'일주일 개근',ico:'🔥'}, {n:5, t:'닷새 연속',ico:'🔥'}, {n:3, t:'사흘 연속',ico:'✨'}
];
let _speakText = '';
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shortTitle(i){ return i.title || i.label; }

async function init(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ location.href = '/auth/?redirect=' + encodeURIComponent('/mylearning/'); return; }
  const { data: p } = await db.from('student_profiles')
    .select('id, nickname, grade, class_code_id')
    .eq('user_id', session.user.id).maybeSingle();
  if(!p || !p.class_code_id){
    document.getElementById('app').innerHTML =
      `<div class="center"><div class="big">🌱</div>학급에 들어가면 내 학습을 볼 수 있어요.<br><a href="/">처음으로 가기</a></div>`;
    return;
  }
  const gc = GRADE_COLOR[p.grade] || '#5B8EF8';
  document.documentElement.style.setProperty('--gc', gc);
  if(p.grade && p.grade <= 2) document.body.classList.add('lower');
  const from = KR.addDays(KR.mondayOf(KR.today()), -120);
  const [{ data: mastery }, { data: scores }, { data: wrongs }, { data: morning }] = await Promise.all([
    db.from('report_lesson_mastery').select('*').eq('student_id', p.id),
    db.from('scores').select('lesson_id,unit_id,question_id,is_correct,earned_at').eq('student_id', p.id).order('earned_at',{ascending:false}).limit(3000),
    db.from('wrong_answers').select('*').eq('student_id', p.id).is('resolved_at', null),
    db.from('report_morning_daily').select('student_id,run_date,subject').eq('student_id', p.id).gte('run_date', from)
  ]);
  await KR.loadCatalog((mastery||[]).map(m=>m.lesson_id).concat((scores||[]).map(r=>r.lesson_id), (wrongs||[]).map(w=>w.lesson_id)));
  const cls = KR.classify(mastery||[], wrongs||[]);
  const wk = KR.buildWeeks(scores||[], morning||[], 1)[0];
  const units = KR.unitProgress(scores||[], mastery||[]);
  const steps = KR.nextSteps(cls, mastery||[], scores||[], units, 3);
  const streak = KR.streak(scores||[], morning||[]);
  render(p, wk, cls, steps, units, streak);
}

function render(p, wk, cls, steps, units, streak){
  const todayStr = KR.today();
  const DAY_KO = ['월','화','수','목','금','토','일'];
  const daysHtml = Object.keys(wk.days).map((d,i) => {
    const day = wk.days[d];
    const on = day.selfQ>0 || day.lessons.size>0 || day.done.size>0 || day.morning;
    return `<div class="day ${on?'on':''} ${d===todayStr?'today':''}">
      <div class="c">${on?'⭐':''}</div><div class="l">${DAY_KO[i]}</div></div>`;
  }).join('');
  const nDays = wk.activeDays.size;
  const streakMsg = nDays >= 5 ? '이번 주 <b>'+nDays+'일</b>이나 했어요. 정말 꾸준해요!'
                  : nDays >= 3 ? '이번 주 <b>'+nDays+'일</b> 했어요. 좋은 흐름이에요!'
                  : nDays >= 1 ? '이번 주 <b>'+nDays+'일</b> 했어요. 오늘도 한 걸음!'
                  : '이번 주의 첫 별을 만들어 볼까요?';
  const streakLine = streak >= 2 ? `<br>🔥 <b>${streak}일</b> 연속으로 하고 있어요!` : '';
  const doneLine = wk.lessonsDone.size ? `<br>이번 주에 끝까지 한 차시 <b>${wk.lessonsDone.size}개</b>${wk.morningCount?`, 아침활동 <b>${wk.morningCount}번</b>`:''}` : (wk.morningCount?`<br>아침활동도 <b>${wk.morningCount}번</b>!`:'');

  // ── 특별 뱃지 — 차시 하나보다 큰 성취. 이미 계산해 둔 값만 쓴다(새 질의 없음)
  const tros = [];
  const doneUnits = (units||[]).filter(u => (u.total ?? u.lessons.length) > 0 && u.done === (u.total ?? u.lessons.length));
  doneUnits.slice(0,2).forEach(u => {
    const f = SUBJ_BADGE[u.subjectKo] || SUBJ_FALLBACK;
    tros.push({ico:'🏆', bg:f.bg, bd:f.bd, t:'단원을 끝까지!',
      d:`${u.subjectKo}${u.unitNum?' '+u.unitNum+'단원':''}${u.unitName?' · '+u.unitName:''}`});
  });
  const tier = STREAK_TIERS.find(t => streak >= t.n);
  if(tier) tros.push({ico:tier.ico, bg:'#FFF4EC', bd:'#F8CFAE', t:tier.t, d:`${streak}일째 이어 가는 중이에요`});
  if(wk.morningCount >= 3) tros.push({ico:'🌅', bg:'#FFFBEB', bd:'#F2E2A8', t:'아침 지킴이', d:`이번 주 아침활동 ${wk.morningCount}번`});
  const trosHtml = tros.slice(0,4).map(b =>
    `<div class="tro" style="background:${b.bg};border-color:${b.bd}"><span class="m">${b.ico}</span><span><b class="t">${esc(b.t)}</b><span class="d">${esc(b.d)}</span></span></div>`).join('');

  // 탄탄 뱃지 — 지도 정본 이름 (과목별 색·심볼)
  const solidBadges = cls.solid.slice(0,8).map(r => {
    const i = KR.lesson(r.lesson_id);
    const f = SUBJ_BADGE[i.subjectKo] || SUBJ_FALLBACK;
    return `<span class="badge" style="background:${f.bg};border-color:${f.bd}"><span class="s">${f.ico}</span><span>${esc(shortTitle(i))}<br><small>${esc(i.subjectKo)}${i.unitNum?' '+i.unitNum+'단원':''}</small></span></span>`;
  }).join('');

  // 다시 해볼 것 — "한 번 더!" (반복 오답·취약, 부정 표현 없음)
  const retrySet = new Set(); const retry = [];
  (cls.repeatWrongLessons||[]).forEach(g => { if(!retrySet.has(g.lesson_id)){ retrySet.add(g.lesson_id); retry.push({lessonId:g.lesson_id, why:'헷갈렸던 문제, 다시 만나면 이길 수 있어요'}); } });
  (cls.weak||[]).forEach(r => { if(!retrySet.has(r.lesson_id)){ retrySet.add(r.lesson_id); retry.push({lessonId:r.lesson_id, unitId:r.unit_id, why:'한 번 더 하면 탄탄해져요'}); } });

  const goCard = (item, icon, cta) => {
    const i = KR.lesson(item.lessonId);
    const url = KR.lessonUrl(item.lessonId, item.unitId);
    const inner = `<span class="k">${icon}</span><div><div class="t">${esc(shortTitle(i))}<small>${esc(i.subjectKo)}${i.unitNum?' '+i.unitNum+'단원':''}${i.unitName?' · '+esc(i.unitName):''}</small></div><div class="w">${esc(item.why)}</div></div>${url?`<span class="go">${cta}</span>`:''}`;
    return url ? `<a class="go-card" href="${esc(url)}">${inner}</a>` : `<div class="go-card">${inner}</div>`;
  };
  const stepIcon = { review:'🔁', lesson:'📖', continue:'▶️', new:'✨' };
  const stepCta = { review:'한 번 더!', lesson:'한 번 더!', continue:'이어서', new:'가 보기' };

  // 내 지도 — 손댄 단원의 차시 칸 (숫자 = 차시 번호, 색 = 상태). 취약은 '한 번 더' 색으로만.
  const nextIds = new Set(steps.filter(s=>s.kind==='new').map(s=>s.lessonId));
  const unitsHtml = units.map(u => {
    const total = u.total ?? u.lessons.length;
    const cells = u.lessons.map(l => {
      const st = l.status === 'weak' ? 'retry' : l.status;
      const cls2 = st + (nextIds.has(l.info.lessonId)?' next':'');
      const label = (l.info.n || '·');
      const tip = shortTitle(l.info) + (l.done ? ' · 끝까지 했어요' : l.status==='none' ? ' · 아직 안 열어봤어요' : '');
      return l.info.url ? `<a class="${cls2}" href="${esc(l.info.url)}" title="${esc(tip)}">${esc(label)}</a>` : `<i class="${cls2}" title="${esc(tip)}">${esc(label)}</i>`;
    }).join('');
    return `<div class="unit"><div class="t">${esc(u.subjectKo)}${u.unitNum?' '+u.unitNum+'단원':''}${u.unitName?' · '+esc(u.unitName):''}<span>${u.done}/${total} 끝까지</span></div><div class="cells">${cells}</div></div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="hello"><b>${esc(p.nickname||'친구')}</b>의 학습 이야기</div>
    <div class="card"><h2><span class="ico">⭐</span>내가 한 것</h2>
      <div class="days">${daysHtml}</div>
      <div class="streak">${streakMsg}${streakLine}${doneLine}</div>
    </div>
    <div class="card"><h2><span class="ico">🏅</span>탄탄한 것</h2>
      ${trosHtml ? `<div class="tros">${trosHtml}</div>` : ''}
      ${solidBadges ? `<div class="badges">${solidBadges}</div>` : (trosHtml ? '' : '<div class="empty">뱃지가 곧 생길 거예요. 지금처럼만 하면 돼요!</div>')}
      ${cls.solid.length>8?`<div class="note">그리고 ${cls.solid.length-8}개 더! 아래 내 지도의 초록 칸이에요.</div>`:''}
      ${cls.watching.length?`<div class="note">몇 개는 아직 지켜보는 중이에요 — 기록이 쌓이면 알려 줄게요.</div>`:''}
    </div>
    <div class="card"><h2><span class="ico">💪</span>다시 해볼 것</h2>
      ${retry.length ? retry.slice(0,3).map(it=>goCard(it,'💪','한 번 더!')).join('') : '<div class="empty">지금은 없어요. 멋져요!</div>'}
    </div>
    <div class="card"><h2><span class="ico">👟</span>다음 걸음</h2>
      ${steps.length ? steps.map(st=>goCard(st, stepIcon[st.kind]||'👉', stepCta[st.kind]||'가 보기')).join('') : '<div class="empty">첫 차시를 열어 보면 여기에 다음 걸음이 생겨요!</div>'}
    </div>
    ${units.length ? `<div class="card"><h2><span class="ico">🗺️</span>내 지도</h2>
      ${unitsHtml}
      <div class="map-legend"><i style="background:#68D391"></i>탄탄 <i style="background:#F6E05E"></i>거의 다 왔어요 <i style="background:#FFE8CC;border:1px solid #F6AD55"></i>한 번 더 <i style="background:#EDF2F7"></i>해봤어요 <i style="border:1.5px dashed var(--border);background:#fff"></i>아직 · 칸을 누르면 그 차시로 가요</div>
    </div>` : ''}`;

  const solidNames = cls.solid.slice(0,3).map(r=>shortTitle(KR.lesson(r.lesson_id)));
  const retryNames = retry.slice(0,2).map(r=>shortTitle(KR.lesson(r.lessonId)));
  _speakText = `${p.nickname||'친구'}의 학습 이야기. ` + streakMsg.replace(/<[^>]+>/g,'') + ' '
    + (streak >= 2 ? `${streak}일 연속으로 하고 있어요! ` : '')
    + (tros.length ? `새로 받은 뱃지는 ${tros.slice(0,2).map(b=>b.t).join(', ')} 이에요. ` : '')
    + (solidNames.length ? `탄탄한 것은 ${solidNames.join(', ')} 이에요. ` : '')
    + (retryNames.length ? `다시 해볼 것은 ${retryNames.join(', ')} 이에요. 한 번 더 하면 탄탄해져요. ` : '지금 다시 해볼 것은 없어요. 멋져요! ')
    + (steps.length ? `다음 걸음은 ${shortTitle(KR.lesson(steps[0].lessonId))} 이에요.` : '');
}
function speakPage(){
  if(!('speechSynthesis' in window) || !_speakText) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(_speakText);
  u.lang = 'ko-KR'; u.rate = 0.95;
  speechSynthesis.speak(u);
}
init();
</script>
</body>
</html>

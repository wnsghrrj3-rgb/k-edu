<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 학습 | K-edu</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../kedu_config.js"></script>
<script src="../kedu_report_lib.js"></script>
<style id="kedu-title-font">
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
</style>
<style>
/* =============================================
   학생용 「내 학습」 — 설계 §4
   · 점수 숫자·등수·비교 없음
   · 금지어: 부족·미달·하위·시험·점수 → "한 번 더!"
   · 미동의 학생은 입구 자체가 없으므로 이 화면은 프로필 보유자 전용
   ============================================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gc:#5B8EF8;
  --bg:#FDF9F3;--card:#fff;--text:#2D3142;--sub:#8B93A7;--border:#EFE8DC;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
body.lower{font-size:17px}       /* 1·2학년 — 큰 글씨 */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:10}
.back{text-decoration:none;color:var(--sub);font-size:14px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.top h1{font-family:var(--kedu-title);font-size:20px;color:var(--gc)}
.tts{margin-left:auto;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding:6px 16px 70px}
.hello{font-family:var(--kedu-title);font-size:22px;margin:10px 2px 16px}
.hello b{color:var(--gc)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.card h2{font-family:var(--kedu-title);font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
body.lower .card h2{font-size:19px}
.card h2 .ico{font-size:20px}

/* ① 내가 한 것 — 요일 점 */
.days{display:flex;justify-content:space-between;gap:6px}
.day{flex:1;text-align:center}
.day .c{width:38px;height:38px;border-radius:50%;background:var(--bg);border:2px solid var(--border);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:17px}
.day.on .c{background:var(--gc);border-color:var(--gc);color:#fff}
.day .l{font-size:12px;color:var(--sub);margin-top:5px;font-weight:600}
.day.today .l{color:var(--gc)}
.streak{margin-top:12px;font-size:14.5px;text-align:center;color:var(--text)}
body.lower .streak{font-size:16.5px}

/* ② 탄탄한 것 — 뱃지 */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#F0FAF4;border:1.5px solid #BEE3CE;color:#276749;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700}
body.lower .badge{font-size:15.5px;padding:10px 16px}
.badge .s{font-size:15px}

/* ③ 다시 해볼 것 · ④ 다음 걸음 */
.go-card{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;text-decoration:none;color:inherit;background:#fff}
.go-card:active{transform:scale(.99)}
.go-card .k{font-size:24px;flex:none}
.go-card .t{font-weight:700;font-size:15px}
body.lower .go-card .t{font-size:17px}
.go-card .w{font-size:12.5px;color:var(--sub);margin-top:2px}
body.lower .go-card .w{font-size:14px}
.go-card .go{margin-left:auto;flex:none;background:var(--gc);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.empty{color:var(--sub);font-size:14px;padding:6px 2px}
body.lower .empty{font-size:16px}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.center{text-align:center;padding:70px 20px;color:var(--sub)}
.center .big{font-size:40px;margin-bottom:10px}
.center a{display:inline-block;margin-top:14px;background:var(--gc);color:#fff;border-radius:12px;padding:10px 18px;text-decoration:none;font-weight:700}
.spin{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="/">← 처음으로</a>
  <h1>내 학습</h1>
  <button class="tts" id="tts-btn" onclick="speakPage()" title="읽어 주기">🔊 읽어 줘</button>
</div>

<div class="wrap" id="app">
  <div class="center"><div class="big"><span class="spin"></span></div>내 기록을 가져오는 중…</div>
</div>

<script>
const db = getKeduDb();
const KR = window.KeduReport;
const GRADE_COLOR = {1:'#FF85A1',2:'#FFB347',3:'#3BAB72',4:'#FF7043',5:'#3D90F0',6:'#7E57C2'};
let _speakText = '';

function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ location.href = '/auth/?redirect=' + encodeURIComponent('/mylearning/'); return; }
  const { data: p } = await db.from('student_profiles')
    .select('id, nickname, grade, class_code_id')
    .eq('user_id', session.user.id).maybeSingle();
  if(!p || !p.class_code_id){
    document.getElementById('app').innerHTML =
      `<div class="center"><div class="big">🌱</div>학급에 들어가면 내 학습을 볼 수 있어요.<br><a href="/">처음으로 가기</a></div>`;
    return;
  }

  const gc = GRADE_COLOR[p.grade] || '#5B8EF8';
  document.documentElement.style.setProperty('--gc', gc);
  if(p.grade && p.grade <= 2) document.body.classList.add('lower');

  const monday3 = KR.addDays(KR.mondayOf(KR.kstDateStr(new Date())), -14);
  const [{ data: mastery }, { data: scores }, { data: wrongs }, { data: morning }] = await Promise.all([
    db.from('report_lesson_mastery').select('*').eq('student_id', p.id),
    db.from('scores').select('lesson_id,unit_id,question_id,is_correct,earned_at').eq('student_id', p.id).order('earned_at',{ascending:false}).limit(2000),
    db.from('wrong_answers').select('*').eq('student_id', p.id).is('resolved_at', null),
    db.from('report_morning_daily').select('student_id,run_date,subject').eq('student_id', p.id).gte('run_date', monday3)
  ]);

  const cls = KR.classify(mastery||[], wrongs||[]);
  const weeks = KR.buildWeeks(scores||[], morning||[], 1);
  const wk = weeks[0];
  const steps = KR.nextSteps(cls, mastery||[], scores||[]);
  render(p, wk, cls, steps);
}

function render(p, wk, cls, steps){
  const todayStr = KR.kstDateStr(new Date());
  const DAY_KO = ['월','화','수','목','금','토','일'];
  const dayKeys = Object.keys(wk.days);
  const daysHtml = dayKeys.map((d,i) => {
    const day = wk.days[d];
    const on = day.selfQ>0 || day.lessons.size>0 || day.morning;
    return `<div class="day ${on?'on':''} ${d===todayStr?'today':''}">
      <div class="c">${on?'⭐':''}</div><div class="l">${DAY_KO[i]}</div></div>`;
  }).join('');

  const nDays = wk.activeDays.size;
  const streakMsg = nDays >= 5 ? '이번 주 '+nDays+'일이나 했어요. 정말 꾸준해요!'
                  : nDays >= 3 ? '이번 주 '+nDays+'일 했어요. 좋은 흐름이에요!'
                  : nDays >= 1 ? '이번 주 '+nDays+'일 했어요. 오늘도 한 걸음!'
                  : '이번 주의 첫 별을 만들어 볼까요?';

  // 탄탄 뱃지 — 과목별로 묶어서
  const solidBadges = cls.solid.slice(0,8).map(r => {
    const pl = KR.prettyLesson(r.lesson_id);
    return `<span class="badge"><span class="s">🏅</span>${esc(pl.label)}</span>`;
  }).join('');

  // 다시 해볼 것 — "한 번 더!" (취약·반복 오답, 부정 표현 없음)
  const retrySet = new Set();
  const retry = [];
  (cls.repeatWrong||[]).forEach(w => { if(!retrySet.has(w.lesson_id)){ retrySet.add(w.lesson_id); retry.push({lessonId:w.lesson_id, unitId:null, why:'헷갈렸던 문제, 다시 만나면 이길 수 있어요'}); } });
  (cls.weak||[]).forEach(r => { if(!retrySet.has(r.lesson_id)){ retrySet.add(r.lesson_id); retry.push({lessonId:r.lesson_id, unitId:r.unit_id, why:'한 번 더 하면 탄탄해져요'}); } });
  const unitOf = {}; (cls.solid.concat(cls.edge, cls.weak, cls.watching)).forEach(r => { if(r.unit_id) unitOf[r.lesson_id]=r.unit_id; });

  const goCard = (item, icon, cta) => {
    const pl = KR.prettyLesson(item.lessonId);
    const url = item.unitId || unitOf[item.lessonId];
    const inner = `<span class="k">${icon}</span><div><div class="t">${esc(pl.label)}</div><div class="w">${esc(item.why)}</div></div>${url?`<span class="go">${cta}</span>`:''}`;
    return url ? `<a class="go-card" href="${esc(url)}">${inner}</a>` : `<div class="go-card">${inner}</div>`;
  };

  const stepIcon = { review:'🔁', lesson:'📖', continue:'▶️' };

  document.getElementById('app').innerHTML = `
    <div class="hello"><b>${esc(p.nickname||'친구')}</b>의 학습 이야기</div>

    <div class="card"><h2><span class="ico">⭐</span>내가 한 것</h2>
      <div class="days">${daysHtml}</div>
      <div class="streak">${streakMsg}${wk.morningCount?` 아침활동도 ${wk.morningCount}번!`:''}</div>
    </div>

    <div class="card"><h2><span class="ico">🏅</span>탄탄한 것</h2>
      ${solidBadges || '<div class="empty">뱃지가 곧 생길 거예요. 지금처럼만 하면 돼요!</div>'}
      ${cls.watching.length?`<div class="note">몇 개는 아직 지켜보는 중이에요 — 기록이 쌓이면 알려 줄게요.</div>`:''}
    </div>

    <div class="card"><h2><span class="ico">💪</span>다시 해볼 것</h2>
      ${retry.length ? retry.slice(0,3).map(it=>goCard(it,'💪','한 번 더!')).join('') : '<div class="empty">지금은 없어요. 멋져요!</div>'}
    </div>

    <div class="card"><h2><span class="ico">👟</span>다음 걸음</h2>
      ${steps.length ? steps.map(st=>goCard(st, stepIcon[st.kind]||'👉', '가 보기')).join('') : '<div class="empty">새로운 차시로 나아가면 돼요!</div>'}
    </div>`;

  _speakText = `${p.nickname||'친구'}의 학습 이야기. ${streakMsg} `
    + (cls.solid.length ? `탄탄한 것은 ${cls.solid.slice(0,3).map(r=>KR.prettyLesson(r.lesson_id).label).join(', ')} 이에요. ` : '')
    + (retry.length ? `다시 해볼 것은 ${retry.slice(0,2).map(r=>KR.prettyLesson(r.lessonId).label).join(', ')} 이에요. 한 번 더 하면 탄탄해져요.` : '지금 다시 해볼 것은 없어요. 멋져요!');
}

function speakPage(){
  if(!('speechSynthesis' in window) || !_speakText) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(_speakText);
  u.lang = 'ko-KR'; u.rate = 0.95;
  speechSynthesis.speak(u);
}

init();
</script>
</body>
</html>

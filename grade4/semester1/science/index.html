<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#F5F7FA;min-height:100vh;color:#1A202C}

.top-bar{background:#fff;border-bottom:1px solid #E2E8F0;height:52px;display:flex;align-items:center;padding:0 24px;gap:12px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#718096;text-decoration:none;font-weight:500;transition:color .15s}
.back-link:hover{color:#1A202C}
.top-title{font-family:'Jua',sans-serif;font-size:16px;color:#1A202C}

main{max-width:800px;margin:0 auto;padding:28px 20px 60px}

.page-header{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.subject-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:50px;font-family:'Jua',sans-serif;font-size:18px;color:#fff;background:#15803D}
.page-title{font-family:'Jua',sans-serif;font-size:26px}

.unit-section{margin-bottom:30px}
.unit-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #E2E8F0}
.unit-num{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:16px;color:#fff}
.unit-name{font-family:'Jua',sans-serif;font-size:18px;color:#1A202C}
.unit-count{font-size:13px;color:#A0AEC0;margin-left:auto}

.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 8px rgba(0,0,0,.05);cursor:pointer;text-decoration:none;color:#1A202C;border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s}
.lesson-card:hover{transform:translateY(-2px);border-color:var(--uc);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.lesson-num{min-width:32px;height:32px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:14px;color:#fff;background:var(--uc);flex-shrink:0}
.lesson-title{font-size:14px;font-weight:500;flex:1}
.lesson-arrow{color:#CBD5E0;font-size:16px}
.lesson-badge{font-size:11px;padding:2px 8px;border-radius:50px;font-weight:500;flex-shrink:0}
.badge-tb{background:#EBF8FF;color:#2B6CB0}
.badge-soon{background:#EDF2F7;color:#A0AEC0}

.lesson-card-soon{background:#FAFAFA;box-shadow:none;border:1px dashed #E2E8F0;cursor:default;opacity:.7}
.lesson-card-soon:hover{transform:none;border-color:#E2E8F0;box-shadow:none}
.lesson-card-soon .lesson-num{background:#CBD5E0!important}
.lesson-card-soon .lesson-title{color:#A0AEC0}

footer{text-align:center;padding:18px 24px;border-top:1px solid #E2E8F0;background:#fff}
.footer-text{font-size:12px;color:#A0AEC0}
.footer-text strong{color:#718096;font-weight:500}
.footer-text a{color:#5B8EF8;text-decoration:none;margin-left:10px}
.footer-text a:hover{text-decoration:underline}

@media(max-width:600px){
  .page-header{flex-direction:column;align-items:flex-start;gap:8px}
  .page-title{font-size:22px}
  .lesson-card{padding:12px 14px}
}
</style>

<script>
const U1 = "1단원_자석의이용/";
const U2 = "2단원_물의상태변화/";
const U3 = "3단원_땅의변화/";
const U4 = "4단원_다양한생물과우리생활/";

const UNITS = [
  {
    num: 1, name: "자석의 이용", emoji: "🧲", color: "#15803D",
    lessons: [
      {n:"1",    file:U1+"g4_sci_u1_l01_활짝과학열기.html",          title:"활짝! 과학 열기 — 자석 다트 놀이", track:"tb"},
      {n:"2",    file:U1+"g4_sci_u1_l02_자석에붙는물체.html",         title:"자석에 붙는 물체", track:"tb"},
      {n:"3",    file:U1+"g4_sci_u1_l03_자석과붙는물체사이의힘.html", title:"자석과 자석에 붙는 물체 사이의 힘", track:"tb"},
      {n:"4~5",  file:U1+"g4_sci_u1_l04_자석과자석사이의힘.html",     title:"자석과 자석 사이의 힘 (자석의 극)", track:"tb"},
      {n:"6",    file:U1+"g4_sci_u1_l05_나침반과자석.html",           title:"나침반과 자석", track:"tb"},
      {n:"7",    file:U1+"g4_sci_u1_l06_자석의이용.html",             title:"자석의 이용 — 생활용품 속 자석", track:"tb"},
      {n:"8~9",  file:U1+"g4_sci_u1_l07_자석장치설계.html",           title:"창의가 반짝! 자석을 이용한 장치 설계 / 팡팡! 과학 놀이터", track:"tb"},
      {n:"10",   file:U1+"g4_sci_u1_l08_첨단과학기술.html",           title:"톡톡! 과학 — 자석의 성질을 이용한 첨단 과학 기술", track:"tb"},
      {n:"11",   file:U1+"g4_sci_u1_l09_단원마무리.html",             title:"단원 마무리", track:"tb"}
    ]
  },
  {
    num: 2, name: "물의 상태 변화", emoji: "💧", color: "#0D9488",
    lessons: [
      {n:"1",    file:U2+"g4_sci_u2_l01_활짝과학열기.html",           title:"활짝! 과학 열기 — 다양한 상태의 물 찾기", track:"tb"},
      {n:"2",    file:U2+"g4_sci_u2_l02_세가지상태와상태변화.html",     title:"물의 세 가지 상태와 상태 변화", track:"tb"},
      {n:"3",    file:U2+"g4_sci_u2_l03_생활속물의상태변화.html",       title:"생활 속 물의 상태 변화", track:"tb"},
      {n:"4~5",  file:U2+"g4_sci_u2_l04_물이얼때와얼음이녹을때.html",   title:"물이 얼 때와 얼음이 녹을 때의 변화", track:"tb"},
      {n:"6",    file:U2+"g4_sci_u2_l05_물이증발할때와끓을때.html",     title:"물이 증발할 때와 끓을 때의 변화", track:"tb"},
      {n:"7",    file:U2+"g4_sci_u2_l06_수증기가응결할때.html",         title:"수증기가 응결할 때의 변화", track:"tb"},
      {n:"8~9",  file:U2+"g4_sci_u2_l07_물을얻을수있는장치.html",       title:"창의가 반짝! 물을 얻을 수 있는 장치 / 팡팡! 과학 놀이터", track:"tb"},
      {n:"10",   file:U2+"g4_sci_u2_l08_세계물의날.html",               title:"톡톡! 과학 — 세계 물의 날", track:"tb"},
      {n:"11",   file:U2+"g4_sci_u2_l09_단원마무리.html",               title:"단원 마무리", track:"tb"}
    ]
  },
  {
    num: 3, name: "땅의 변화", emoji: "🌋", color: "#B45309",
    lessons: [
      {n:"1",        file:U3+"g4_sci_u3_l01_활짝과학열기.html",                    title:"활짝! 과학 열기 — 깃발 쓰러뜨리기", track:"tb"},
      {n:"2",        file:U3+"g4_sci_u3_l02_흐르는물의작용.html",                   title:"흐르는 물의 작용 — 침식·운반·퇴적", track:"tb"},
      {n:"3",        file:U3+"g4_sci_u3_l03_강주변의모습.html",                    title:"강 주변의 모습 — 강 상류와 강 하류", track:"tb"},
      {n:"4~5",      file:U3+"g4_sci_u3_l04_화산의특징.html",                     title:"화산의 특징과 화산 분출물", track:"tb"},
      {n:"6",        file:U3+"g4_sci_u3_l05_현무암과화강암.html",                   title:"현무암과 화강암", track:"tb"},
      {n:"7",        file:U3+"g4_sci_u3_l06_화산활동의영향.html",                   title:"화산 활동이 우리 생활에 미치는 영향", track:"tb"},
      {n:"8~9",      file:U3+"g4_sci_u3_l07_지진의피해와대처.html",                  title:"지진의 피해와 대처 방법", track:"tb"},
      {n:"10~12",    file:U3+"g4_sci_u3_l08_재난대비안내자료.html",                  title:"창의가 반짝! 재난 대비 안내 자료 / 톡톡! 제주 세계자연유산", track:"tb"},
      {n:"13",       file:U3+"g4_sci_u3_l09_단원마무리.html",                     title:"단원 마무리", track:"tb"}
    ]
  },
  {
    num: 4, name: "다양한 생물과 우리 생활", emoji: "🦠", color: "#7C3AED",
    lessons: [
      {n:"1",        file:U4+"g4_sci_u4_l01_활짝과학열기.html",                          title:"활짝! 과학 열기 — 생물 놀이 카드", track:"tb"},
      {n:"2~3",      file:U4+"g4_sci_u4_l02_버섯과곰팡이의특징.html",                       title:"버섯과 곰팡이의 특징 — 균류", track:"tb"},
      {n:"4~5",      file:U4+"g4_sci_u4_l03_해캄과짚신벌레의특징.html",                      title:"해캄과 짚신벌레의 특징 — 원생생물", track:"tb"},
      {n:"6",        file:U4+"g4_sci_u4_l04_세균의특징.html",                           title:"세균의 특징", track:"tb"},
      {n:"7",        file:U4+"g4_sci_u4_l05_다양한생물의영향.html",                        title:"다양한 생물이 우리 생활에 미치는 영향", track:"tb"},
      {n:"8",        file:U4+"g4_sci_u4_l06_생명과학과우리생활.html",                       title:"생명과학과 우리 생활", track:"tb"},
      {n:"9~10",     file:U4+"g4_sci_u4_l07_생명과학홍보하기.html",                        title:"팡팡! 과학 놀이터 — 생활 속의 생명과학 홍보하기", track:"tb"},
      {n:"11",       file:U4+"g4_sci_u4_l08_생명과학연구원.html",                         title:"톡톡! 과학 — 생명과학 연구원", track:"tb"},
      {n:"12",       file:U4+"g4_sci_u4_l09_단원마무리.html",                           title:"단원 마무리", track:"tb"}
    ]
  }
];

const content = document.getElementById('content');
UNITS.forEach((unit) => {
  const tbCount = unit.lessons.filter(l => l.track === 'tb').length;
  const soonCount = unit.lessons.filter(l => l.track === 'soon').length;

  const section = document.createElement('div');
  section.className = 'unit-section';

  let html = `
    <div class="unit-header">
      <div class="unit-num" style="background:${unit.color}">${unit.num}</div>
      <div class="unit-name">${unit.emoji} ${unit.num}단원: ${unit.name}</div>
      <div class="unit-count">라이브 ${tbCount}차시${soonCount ? ' · 준비 중 ' + soonCount : ''}</div>
    </div>
    <div class="lesson-list">
  `;

  html += unit.lessons.map(l => l.track === 'tb' ? `
    <a class="lesson-card" href="${l.file}" style="--uc:${unit.color}">
      <div class="lesson-num">${l.n}</div>
      <div class="lesson-title">${l.title}</div>
      <span class="lesson-badge badge-tb">교과서</span>
      <div class="lesson-arrow">›</div>
    </a>
  ` : `
    <div class="lesson-card lesson-card-soon">
      <div class="lesson-num">${l.n}</div>
      <div class="lesson-title">${l.title}</div>
      <span class="lesson-badge badge-soon">준비 중</span>
    </div>
  `).join('');

  html += `</div>`;
  section.innerHTML = html;
  content.appendChild(section);
});
</script>

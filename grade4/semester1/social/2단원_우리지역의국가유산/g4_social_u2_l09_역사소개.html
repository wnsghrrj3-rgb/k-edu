<!DOCTYPE html>
<!--
K-edu 사회 4-1 · 2단원 우리 지역의 국가유산 · ② 살아 숨 쉬는 우리 지역의 역사 · 11~12차시(l09)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [4사06-02] · 교과서 p.86~89 · 지도서(대단원2 주제② 11~12차시) 근거
직접조작: 우리 지역 역사 박물관 열기(소개 자료 5종 클릭 → 전시대에 놓이며 만드는 방법·좋은 점 리빌, 5/5 시 개관) + 효과음. l07/l08 엔진 복제.
지도서 근거: 소개 자료 제작 3선택(동영상[촬영→편집도구→편집→소개] / 안내 책자[내용 정하기→그림·사진→특징 쓰기] / 신문[신문 제목→기사 제목→그림·사진·글, 퀴즈·인터뷰]) + 88쪽 '우리 지역 역사 박물관'(사진전·인물 소개 신문·조사 보고서·소개 동영상·안내 책자 전시) + 소개 태도(듣는 사람이 이해하기 쉽게·다른 모둠 관심 갖고 관람) + 출처 표시 + [스스로 활동] 자기평가 3항목 + [별별 직업] 큐레이터(학예사: 자료 수집·조사·연구·보존·전시 기획·설명).
⚠️ 용어 = 국가유산(2024 국가유산기본법). 정직 원칙: 큐레이터 서술은 지도서 근거, 소개 자료는 유형 대표(특정 실물 비귀속).
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 지역의 역사를 소개해 볼까요 · 사회 4-1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#15803D; --green-d:#0F6B33; --cyan:#0891B2;
  --bg:#F0FDF4; --bub:#DCFCE7; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 4px 14px rgba(21,128,61,.32)}50%{transform:scale(1.04);box-shadow:0 6px 20px rgba(21,128,61,.5)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#DCFCE7;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.village{width:min(560px,92%);border:2px solid var(--line);border-radius:16px;background:#F8FFFB;padding:10px}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:620px}

/* 딥링크 버튼(미사용 유지) */
.lab-link{display:inline-flex;align-items:center;gap:8px;background:#166534;color:#fff;text-decoration:none;
  font-weight:700;padding:12px 22px;border-radius:14px;font-size:clamp(14px,2.3vw,17px);
  box-shadow:0 4px 14px rgba(21,128,61,.3);animation:pulse 2.4s ease-in-out infinite}
.lab-link:hover{background:#15803D}
.lab-link svg{width:18px;height:18px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#DCFCE7;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FFFB;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(21,128,61,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}
</style>
</head>
<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="goHub()">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>
      <span>차시 목록</span>
    </button>
    <div class="ka-bar"><div id="bar"></div></div>
    <div class="ka-pg" id="pg">1 / 18</div>
    <div class="ka-sc">
      <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#F57F17"/></svg>
      <span class="ka-sc-n" id="score">0</span><span class="ka-sc-u">점</span>
    </div>
  </div>

  <div class="ka-m" id="main"></div>

  <div class="ka-f">
    <button class="ka-nav ka-nav-prev" id="prev" onclick="prev()">← 이전</button>
    <button class="ka-nav mob-hide" id="listen" disabled title="음성은 준비 중이에요">
      <svg viewBox="0 0 16 16"><path d="M 3 6 L 3 10 L 6 10 L 10 13 L 10 3 L 6 6 Z" fill="currentColor"/><path d="M 12 5 Q 14 8 12 11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      다시 듣기
    </button>
    <button class="ka-nav" id="hint" onclick="useHint()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="4" fill="currentColor"/><rect x="6" y="9.5" width="4" height="2.5" fill="currentColor"/><rect x="6.5" y="12.5" width="3" height="1" fill="currentColor"/></svg>
      힌트
    </button>
    <button class="ka-nav ka-nav-next" id="next" onclick="next()">다음 →</button>
  </div>
</div>

function classifyInteractive(st){ return termInteractive(st); } // 호환
function compareInteractive(st){ return termInteractive(st); }  // 호환
function pixelInteractive(st){ return termInteractive(st); }    // 호환
function termInteractive(st){
  const filled = st.filled || {};
  const cnt = Object.keys(filled).length;
  const done = cnt>=TERMS.length;
  const shelf = TERMS.map(t=>{
    const on = !!filled[t.k];
    return on
      ? `<div style="flex:1;min-width:96px;background:#fff;border:2px solid #9333EA;border-radius:11px;padding:8px 7px;text-align:center">
           <div style="font-size:1.35em">${t.emoji}</div>
           <div style="font-weight:800;color:#6B21A8;font-size:.8em;line-height:1.3">${t.name}</div>
         </div>`
      : `<div style="flex:1;min-width:96px;background:#FAF5FF;border:2px dashed #D8B4FE;border-radius:11px;padding:8px 7px;text-align:center;color:#C4B5FD;font-size:.8em;font-weight:700">빈 전시대</div>`;
  }).join('');
  const board = `<div style="max-width:640px;margin:0 auto;width:100%;background:#FDF4FF;border:2px solid #9333EA;border-radius:14px;padding:11px 10px">
    <div style="font-weight:800;color:#7E22CE;text-align:center;margin-bottom:8px">🏛 우리 지역 역사 박물관</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">${shelf}</div></div>`;
  const detail = st._lastBand && filled[st._lastBand]
    ? (()=>{ const t=TERMS.find(x=>x.k===st._lastBand);
        return `<div style="max-width:640px;margin:10px auto 0;background:#fff;border:2px solid #E2E8F0;border-radius:12px;padding:10px 12px;text-align:left">
          <b style="color:#6B21A8">${t.emoji} ${t.name}</b>
          <div style="font-size:.9em;color:#334155;margin-top:4px"><b>만드는 방법</b> · ${t.how}</div>
          <div style="font-size:.9em;color:#15803D;margin-top:3px"><b>좋은 점</b> · ${t.good}</div>
        </div>`; })()
    : '';
  const chips = TERMS.filter(t=>!filled[t.k]).map(t=>
    `<button onclick="paintBand('${t.k}')" style="cursor:pointer;font-family:inherit;font-weight:700;border:2px solid #CBD5E1;background:#fff;border-radius:12px;padding:9px 13px;font-size:.95em;color:#334155">${t.emoji} ${t.name}</button>`
  ).join('');
  const counter = `<div class="note" style="font-weight:700;color:#15803D;margin-top:8px">전시한 자료 ${cnt} / ${TERMS.length}</div>`;
  const info = done
    ? `<div class="ka-bub" style="text-align:center;border-left-color:#F57F17;background:#FFF8E1;max-width:640px">전시대가 다 찼어요! 모둠이 만든 자료를 모아 <b style="color:#7E22CE">우리 지역 역사 박물관</b>이 열렸어요. 소개할 때는 <b>듣는 사람이 이해하기 쉽게</b> 말하고, 다른 모둠 자료도 <b>관심을 가지고 관람</b>해요. <span class="ka-emph">우리 지역의 역사가 자랑스러워져요.</span></div>`
    : `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:640px;margin:12px auto 0">${chips}</div>
       <div class="note" style="margin-top:8px">자료를 눌러 <b style="color:#7E22CE">전시대</b>에 하나씩 놓아 봐요.</div>`;
  return `${board}${detail}${counter}${info}`;
}

  ${st.revealed?`<div class="answer-box"><b>큐레이터</b>(학예사)예요. 박물관·미술관에서 <b>자료를 모으고 조사·연구·보존</b>하며, <b>전시를 기획</b>하고 관람객에게 자료를 설명해요. 큐레이터가 되려면 역사와 문화에 관심을 갖고 <span class="ka-emph">꾸준히 공부</span>해야 해요.</div>`
    :`<div class="note">박물관에서 자료를 모으고 전시를 기획하는 직업은 무엇일까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 8~15 문제 (확인 4 + 적용 4)
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 오늘 배운 것
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 정리한 것</h2>
  <div class="ka-grp"><div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>우리 지역의 역사는 <b>동영상·안내 책자·신문·사진전·보고서</b> 등 여러 방법으로 소개할 수 있어요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>모둠 자료를 모아 <b style="color:#7E22CE">우리 지역 역사 박물관</b>을 열고, 듣는 사람이 이해하기 쉽게 소개해요.</div></div>
    <div class="sum-item"><span class="n">3</span><div>수집한 사진은 <b>출처를 표시</b>하고, 소개하며 우리 지역의 역사에 <b>자긍심</b>을 가져요.</div></div>
  </div></div>`});
// 17 정리: 자기 평가 (지도서 [스스로 활동] 3항목)
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"우리 지역의 역사를 잘 이해했어요",st)}
    ${selfCheck(1,"우리 지역의 역사가 잘 드러나는 소개 자료를 만들 수 있어요",st)}
    ${selfCheck(2,"우리 지역의 역사를 아끼고 보존하려는 마음이 생겼어요",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">우리 지역의 역사를 소개했어요</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 우리 지역의 역사를 어떻게 <b style="color:#B45309">보존</b>할지 알아봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_social_u2_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  filled:{}, _lastBand:null,
  startTs: Date.now(),
  attempt: 1
};
// 재방문 처리
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false; // 슬라이드별 reveal 초기화
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  // 버튼 상태
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }
/* 우리 지역 역사 박물관 열기(자료 전시) + 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }
function paintBand(k){
  if(!TERMS.some(b=>b.k===k)) return;
  if(!state.filled) state.filled={};
  const wasNew = !state.filled[k];
  state.filled[k]=true; state._lastBand=k;
  const total=TERMS.length, cnt=Object.keys(state.filled).length;
  if(wasNew){ (cnt>=total) ? playChime() : playBlip(); }
  main.innerHTML=slides[state.idx].render(state);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g4_social_u2_l10_보존.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

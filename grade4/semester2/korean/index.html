<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#F5F7FA;min-height:100vh;color:#1A202C}

/* TOP BAR */
.top-bar{background:#fff;border-bottom:1px solid #E2E8F0;height:52px;display:flex;align-items:center;padding:0 24px;gap:12px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#718096;text-decoration:none;font-weight:500;transition:color .15s}
.back-link:hover{color:#1A202C}
.top-title{font-family:'Jua',sans-serif;font-size:16px;color:#1A202C}

/* MAIN */
main{max-width:800px;margin:0 auto;padding:28px 20px 60px}

/* HEADER */
.page-header{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.subject-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:50px;font-family:'Jua',sans-serif;font-size:18px;color:#fff;background:#FF85A1}
.page-title{font-family:'Jua',sans-serif;font-size:26px}

/* UNIT SECTION */
.unit-section{margin-bottom:28px}
.unit-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #E2E8F0}
.unit-num{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:16px;color:#fff}
.unit-name{font-family:'Jua',sans-serif;font-size:18px;color:#1A202C}
.unit-count{font-size:13px;color:#A0AEC0;margin-left:auto}

/* LESSON LIST */
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 8px rgba(0,0,0,.05);cursor:pointer;text-decoration:none;color:#1A202C;border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s}
.lesson-card:hover{transform:translateY(-2px);border-color:var(--uc);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.lesson-num{min-width:38px;height:30px;padding:0 9px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:13px;color:#fff;background:var(--uc);flex-shrink:0;white-space:nowrap}
.lesson-num small{font-size:10px;font-weight:400;margin-left:2px}
.lesson-title{font-size:14px;font-weight:500;flex:1}
.lesson-arrow{color:#CBD5E0;font-size:16px}

/* FOOTER */
footer{text-align:center;padding:18px 24px;border-top:1px solid #E2E8F0;background:#fff}
.footer-text{font-size:12px;color:#A0AEC0}
.footer-text strong{color:#718096;font-weight:500}
.footer-text a{color:#5B8EF8;text-decoration:none;margin-left:10px}
.footer-text a:hover{text-decoration:underline}

@media(max-width:600px){
  .page-header{flex-direction:column;align-items:flex-start;gap:8px}
  .page-title{font-size:22px}
  .lesson-card{padding:12px 14px}
}
</style>
  <script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>

<div class="top-bar">
  <a class="back-link" href="/?view=subject">← 홈</a>

</div>

<main>
  <div class="page-header">
    <div class="subject-badge">🍁 4학년 · 2학기</div>
    <div class="page-title">📖 국어</div>
  </div>

    <a class="kwrite-door" href="/kedu/write/?grade=4" style="display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:14px 18px;background:#fff;border:1.5px solid #E6DFD3;border-radius:16px;text-decoration:none;color:#2B2620;box-shadow:0 2px 12px rgba(43,38,32,.06)">
    <span style="font-size:26px">✏️</span>
    <span style="flex:1"><b style="display:block;font-size:17px">케이글쓰기</b><span style="font-size:13.5px;color:#8B8378">글감 고르고 써 보면, 내 글의 틀이 어디까지 채워졌는지 색으로 보여요</span></span>
    <span style="color:#8B8378">→</span>
  </a>
  <div id="content"></div>
</main>

<script>
// 4학년 2학기 국어 — 교과서 단원 차시 순서대로 구성 (1단원, 2026-09-11 개통)
const UNITS = [
  {
    num: 1, name: "비교하며 읽어요", color: "#3D7CC9",
    lessons: [
      {n:"1", file:"1단원_비교하며읽어요/g4_kor_u1_l01.html", title:"단원 시작 — 배울 내용 살펴보기"},
      {n:"2·3", file:"1단원_비교하며읽어요/g4_kor_u1_l02_03.html", title:"작품에서 현실 세계를 어떻게 나타내고 있는지 알기 (반응 중심)"},
      {n:"4~6", file:"1단원_비교하며읽어요/g4_kor_u1_l04_06.html", title:"이야기의 세계와 현실 세계를 비교하며 이야기 감상하기"},
      {n:"7", file:"1단원_비교하며읽어요/g4_kor_u1_l07.html", title:"글쓴이의 의견을 비교하며 글을 읽으면 좋은 점 알기"},
      {n:"8·9", file:"1단원_비교하며읽어요/g4_kor_u1_l08_09.html", title:"서로 다른 글쓴이의 의견 파악하기"},
      {n:"10·11", file:"1단원_비교하며읽어요/g4_kor_u1_l10_11.html", title:"글쓴이의 의견을 비교하고 평가하며 글 읽기"},
      {n:"12·13", file:"1단원_비교하며읽어요/g4_kor_u1_l12_13.html", title:"배운 내용 실천하기 (작품 소개·댓글 쓰기)"},
      {n:"14", file:"1단원_비교하며읽어요/g4_kor_u1_l14.html", title:"단원 마무리하기 (-려고 · -(으)ㅁ · 글씨 쓰기)"}
    ]
  }
];const content = document.getElementById('content');
UNITS.forEach((unit) => {
  const first = unit.lessons[0].n.replace(/[·~].*/,'');
  const last = unit.lessons[unit.lessons.length-1].n.replace(/.*[·~]/,'');
  const section = document.createElement('div');
  section.className = 'unit-section';
  section.innerHTML = `
    <div class="unit-header">
      <div class="unit-num" style="background:${unit.color}">${unit.num}</div>
      <div class="unit-name">${unit.name}</div>
      <div class="unit-count">${first}~${last}차시</div>
    </div>
    <div class="lesson-list">
      ${unit.lessons.map(l => `
        <a class="lesson-card" href="${l.file}" style="--uc:${unit.color}">
          <div class="lesson-num" style="background:${unit.color}">${l.n}<small>차시</small></div>
          <div class="lesson-title">${l.title}</div>
          <div class="lesson-arrow">›</div>
        </a>
      `).join('')}
    </div>
  `;
  content.appendChild(section);
});
</script>

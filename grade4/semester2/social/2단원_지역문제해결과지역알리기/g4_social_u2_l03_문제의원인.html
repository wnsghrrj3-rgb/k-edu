<!--
K-edu 사회 4-2 · 2단원 지역문제를 해결하고 지역을 알리는 노력 · 주제① 지역문제의 해결 · 4차시(l03)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [4사09-01] · 교과서 p.66~68 · 지도서(대단원2 4차시 p.128~134) 근거
2단원 색 #B45309 (중학년 ka- 엔진 승계 · 변수명 유지 · 엔진 무수정)

직접조작: 접으면 사라지는 판 — 자료를 겹쳐야 비로소 서는 원인
  ⭐ l01의 판은 학생이 놓아 둔 것을 판이 대신 옮겼고, l02의 판은 세어 주고도 그 자리를 비워 두었다.
     두 판 모두 되돌리는 자리가 0이었다. 이번 판은 정반대다 — 이 판에는 접는 자리가 있다.
  ⭐ 자료를 펼칠 때마다 「자료에서 찾은 정보」가 한 줄씩 늘어난다. 그런데 「원인」 줄은 자료 한 장으로는 서지 않는다.
     원인 한 줄마다 그것을 받쳐 주는 자료가 둘씩 있고, 둘이 다 펼쳐져야 비로소 그 줄이 선다.
  ⭐ 넷을 다 펼쳐 원인 둘이 선 뒤 자료를 하나 접으면, 그 자료가 받치고 있던 원인 줄이 함께 사라진다.
     다시 펼치면 돌아온다. 어느 자료를 접어도 똑같이 한 줄이 사라진다(네 갈래 모두).
  ⭐ 원인이 서 있는지를 담는 상태가 코드에 아예 없다 — dgStands 한 줄이 그때그때 정하고,
     DG_NEED 를 읽는 자리는 dgStands 단 하나다. 그래서 접을 때 원인을 지우는 자리가 0이다.
     근거 = 지도서 「정보를 종합하여 원인 파악하기」 + 교과서 「자료를 종합해 보면 … 볼 수 있겠어」.

지도서 근거: [학습 목표] 우리 지역의 문제와 관련 있는 자료를 수집하고 분석하여 원인을 찾을 수 있다 /
  [자료 수집 방법] 장소 답사·시·도청 누리집·지역 신문이나 뉴스·주민 면담과 설문 조사 /
  [자료의 종류] 통계 자료(그래프·표)·신문 기사·공익 광고·설문 조사 결과 /
  [시원이네 모둠] 자료 넷에서 찾은 정보 넷 → 종합 → 원인 둘 / [4차시 주요 내용 정리] / [차시 예고]

정직 원칙: ㉠ 자료 넷은 판이 정해 둔 값이다 — 우리 지역에서 실제로 모은 것이 아니다(캡션 상시).
  ㉡ 자료의 문면은 교과서 수업에서 다루는 예를 옮겼다 — 판이 지어낸 일이 없다.
  ㉢ 우리 지역의 문제와 관련 있는 자료를 실제로 모으고 분석하는 활동은 교실 몫이다(완료 카드 명시).
  ㉣ 실제 지역 이름·누리집 주소·신문사·날짜는 옮기지 않는다. 자료 그림에 숫자를 적지 않는다.
설계 원칙: 5차시 이후 침범 0(해결 방안은 차시 예고 한 자리 · 실천·제안서·홍보 0) / 주제② 침범 0 /
  3단원 침범 0 / 1단원 재현 0 / 교사용 참고 자료 0(지역 이기주의·님비·핌피·바나나·참고 도서 0) /
  실제 지역 이름 0 · 네 자리 연도 0 · 비율 0 · 금액 0 / 정서 — 겁주는 어휘 0.
⚠️ 체인: l02 → l03 재배선 완료. l03 → l04 재배선 완료.
-->

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 칸과 말풍선 ===== */
const SVG = {
  // [동기 유발] 좁은 길과 자전거
  bike:`<svg viewBox="0 0 160 96"><rect width="160" height="96" fill="#FFF7ED"/>

function dgHas(st,i){ return (st.dgOpen & (1 << i)) !== 0; }
function dgStands(st,k){ return DG_NEED[k].every(i => dgHas(st,i)); }   // ⭐ DG_NEED 를 읽는 자리는 코드에 여기 단 하나 · 원인 전용 상태 0
function dgFound(st){ let n = 0; for(let i=0;i<DG_DOCS;i++){ if(dgHas(st,i)) n++; } return n; }
function dgStage(st){
  if(st.dgOpen !== DG_ALL && !st.dgShut) return "open";
  if(!st.dgShut) return "shut";
  if(st.dgOpen !== DG_ALL) return "reopen";
  if(st.dgRead == null) return "read";
  if(st.dgFin == null) return "fin";
  return "end";
}

function dgDocs(st){
  const stage = dgStage(st);
  let b = '';
  for(let i=0;i<DG_DOCS;i++){
    const on = dgHas(st,i);
    const body = on
      ? `<div class="dg-pic">${DG_PIC[i]}</div><div class="dg-info"><span class="dg-lead">자료에서 찾은 정보</span>${DG_INFO[i]}</div>`
      : `<div class="dg-shut">접혀 있어요</div>`;
    let btn = '';
    if(!on) btn = `<button class="dg-btn" data-act="open" data-doc="${i}" onclick="dgOpenDoc(${i})">펼치기</button>`;
    else if(stage === "shut") btn = `<button class="dg-btn shut" data-act="shut" data-doc="${i}" onclick="dgShutDoc(${i})">접어 보기</button>`;
    b += `<div class="dg-doc" data-doc="${i}" data-open="${on?1:0}">
      <span class="dg-kind">${DG_KIND[i]}</span><span class="dg-title">${DG_TITLE[i]}</span>${body}${btn}</div>`;
  }
  return `<div class="dg-docs">${b}</div>`;
}
function dgCauses(st){
  let b = '';
  for(let k=0;k<DG_CAUSES;k++){
    const stand = dgStands(st,k);
    b += `<div class="dg-cause" data-cause="${k}" data-stand="${stand?1:0}"><span class="dg-lead">지역문제가 일어난 원인</span>${stand ? DG_CAUSE[k] : DG_BLANK}</div>`;
  }
  return `<div class="dg-causes">${b}</div>`;
}

function dgPanel(st){
  const stage = dgStage(st);
  let ask = '';
  if(stage === "open"){
    ask = `<div class="dg-ask" data-step="open"><b>자료를 눌러 하나씩 펼쳐 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">어느 자료부터 펼쳐도 괜찮아요. 아래 원인 줄이 언제 서는지 살펴봐요.</div></div>`;
  } else if(stage === "shut"){
    ask = `<div class="dg-ask" data-step="shut"><b>자료 넷이 모두 펼쳐지자 원인 줄 둘이 섰어요. 이제 자료를 하나 접어 봐요.</b>

  } else if(stage === "reopen"){

    <div class="sum-item"><span class="n">3</span><div><b>원인 찾기</b> — 자료를 분석해서 정보를 찾고, 그 정보가 지닌 뜻을 해석하여 지역문제의 원인을 파악해요. 정보 하나만으로는 알기 어려워요.</div></div>
  </div>
  <div class="note">다음 시간에는 우리 지역에서 일어나는 문제의 <b style="color:#B45309">해결 방안</b>을 찾아봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"지역문제와 관련 있는 자료를 모으는 방법을 말할 수 있어요",st)}
    ${selfCheck(1,"자료에서 정보를 찾고 그 뜻을 해석할 수 있어요",st)}
    ${selfCheck(2,"정보를 종합하여 지역문제의 원인을 찾을 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">「우리 지역에서 일어나는 문제의 원인을 알아볼까요」를 마쳤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">원인은 자료 한 장이 아니라 <b style="color:#B45309">여러 자료를 겹칠 때</b> 보이기 시작해요.</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_2_social_u2_l03";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  dgOpen:0, dgShut:false, dgRead:null, dgFin:null, dgMsg:"", dgTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function dgDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 펼치기 — 자료 한 장이 열리고 찾은 정보가 한 줄 늘어난다 */
function dgOpenDoc(i){
  if(state.dgFin!=null) return;                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(i) || i<0 || i>=DG_DOCS) return;                // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(dgHas(state,i)){ state.dgMsg = DG_SAY_OPENED; playThud(); dgDraw(); return; }           // 가드③: 이미 펼친 자료 — 판 불변
  state.dgOpen |= (1 << i);                                            // ⭐ 펼치는 자리는 코드에 여기 단 하나
  state.dgMsg = ""; state.dgTell = DG_TELL_OPEN; playBlip(); dgDraw();
}
/* 접기 — 그 자료가 받치던 원인 줄이 함께 사라진다(지우는 자리 0) */
function dgShutDoc(i){
  if(state.dgFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DG_DOCS) return;                // 가드②
  if(state.dgOpen !== DG_ALL){ state.dgMsg = DG_SAY_ORDER_S; playThud(); dgDraw(); return; } // 가드④: 넷을 다 펼치기 전 — 판 불변
  if(state.dgRead!=null){ state.dgMsg = DG_SAY_LOCK_S; playThud(); dgDraw(); return; }       // 가드⑤: 판을 읽은 뒤 — 판 불변
  state.dgOpen &= ~(1 << i);                                           // ⭐ 접는 자리는 코드에 여기 단 하나 · 원인을 지우는 자리 0
  state.dgShut = true;
  state.dgMsg = ""; state.dgTell = DG_TELL_SHUT; playThud(); dgDraw();
}
/* 판 읽기 */
function dgRead(i){
  if(state.dgFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DG_READQ.length) return;        // 가드②
  if(!state.dgShut || state.dgOpen !== DG_ALL){ state.dgMsg = DG_SAY_ORDER_R; playThud(); dgDraw(); return; } // 가드⑥: 접어 보고 다시 펼치기 전 — 판 불변
  if(state.dgRead!=null){ state.dgMsg = DG_SAY_READDONE; dgDraw(); return; }                 // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==DG_READ_OK){ state.dgMsg = DG_READ_BAD; playThud(); dgDraw(); return; }             // 가드⑦: 어긋난 답 — 판 불변
  state.dgRead = i; state.dgMsg = ""; playBlip(); dgDraw();
}
/* 마무리 */
function dgFin(i){
  if(state.dgFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DG_FINQ.length) return;         // 가드②
  if(state.dgRead==null){ state.dgMsg = DG_SAY_ORDER_F; playThud(); dgDraw(); return; }      // 가드⑧: 판을 읽기 전 — 판 불변
  if(i!==DG_FIN_OK){ state.dgMsg = DG_FIN_BAD; playThud(); dgDraw(); return; }               // 가드⑧: 어긋난 답 — 판 불변
  state.dgFin = i; state.dgMsg = ""; playChime(); dgDraw();
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g4_social_u2_l04_해결방안찾기.html'; } // l04 체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

<!--
K-edu 사회 4-2 · 2단원 지역문제를 해결하고 지역을 알리는 노력 · 주제① 지역문제의 해결 · 2차시(l01)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [4사09-01] · 교과서 p.60~62 · 지도서(대단원2 2차시 p.116~120) 근거 · 1차시 단원 도입은 흡수
2단원 색 #B45309 (중학년 ka- 엔진 승계 · 변수명 유지 · 엔진 무수정)

직접조작: 선반에 놓아 둔 카드가 판에 의해 다른 선반으로 옮겨 가는 판 — 닿는 집이 늘면 갈래가 저절로 바뀌는 형
  ⭐ 1단원 열한 차시의 판에서 학생이 놓아 둔 것은 학생이 손대지 않는 한 놓인 자리에 그대로 있었다.
     이번 판에서는 「개인의 일」 선반에 놓아 둔 독감 카드가, 독감이 이웃 집으로 옮는 순간 학생이 옮기지 않았는데
     「지역문제」 선반으로 옮겨 간다. 근거는 지도서 발문 원문 「내가 독감에 걸린 것은 지역문제인가요? → 아닙니다」 /
     「만약 독감에 걸린 지역 주민이 예방 수칙을 지키지 않아 다른 주민들에게 전염된다면 이것은 지역문제인가요? → 지역문제입니다」와
     지도 유의점 「개인의 문제가 지역의 문제로 확장될 수 있다는 사실을 제시」.
  ⭐ 카드가 어느 선반에 서는지를 담는 상태가 코드에 아예 없다 — 닿는 집을 세는 lpKind 한 줄이 정한다.
     그래서 옮는 순간 선반 자리를 고쳐 쓰는 자리도 0이고, state.lpSpread = true 한 자리가 판 전체를 다시 그리게 한다.
  ⭐ 선반에 놓는 자리 state.lpDone |= 는 코드에 단 하나이고 덜어 내는 자리는 0이다. 옮는 자리도 단 하나이고 되돌리는 자리는 0이다.

지도서 근거: [학습 목표] 지역문제가 무엇인지 설명할 수 있다 / [생각을 열어요] 시원이네 도서관 이야기 · 공통점 예시 답안 /
  [핵심 질문] 명칭 · 특징 / [친구와 활동] 그림에서 지역문제 찾기 예시 답 / [지역문제 속성 분석하기] 쓰레기 불법 투기 · 독감 · 전염 /
  [미디어 활동] 두 기사 예시 답안 / [지역문제 해결의 필요성] / [2차시 주요 내용 정리] / [차시 예고]

정직 원칙: ㉠ 판의 집 여섯과 카드가 닿는 집은 판이 정해 둔 그림이다(실제 마을이 아니다 · 캡션 상시).
  ㉡ 카드의 이야기는 교과서·지도서에 나오는 예를 옮겼다 — 판이 지어낸 일이 없다.
  ㉢ 교과서 그림에서 지역문제를 찾아 ○표 하고 까닭을 이야기하는 활동은 교실 몫이다(완료 카드 명시).
  ㉣ 신문 기사의 지역 이름·신문사·날짜는 옮기지 않는다.
설계 원칙: 3차시 이후 침범 0(조사 방법·원인·해결 방안 0 · 차시 예고 한 자리) / 주제② 침범 0 / 3단원 침범 0 / 1단원 재현 0 /
  교사용 참고 자료 0(미디어 자료 해설의 문제 갈래 이름 0) / 실제 지역 이름 0 · 네 자리 연도 0 · 비율 0 · 금액 0 / 정서 — 겁주는 어휘 0.
⚠️ 체인: l11 → l01 재배선 완료. l01의 goNextLesson = 허브(l02 미양산).

*{margin:0;padding:0;box-sizing:border-box}
:root{

html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);

.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}

.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}

  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}

.check.on{border-color:var(--green);background:var(--bub)}

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 칸과 말풍선 ===== */
const SVG = {
  // [생각을 열어요] 집에서 멀리 떨어진 도서관

/* ===== 직접 조작: 선반에 놓아 둔 카드가 판에 의해 다른 선반으로 옮겨 가는 판 =====
   집 여섯과 카드 넷(교과서 수업의 예). 카드마다 닿는 집이 정해져 있고,
   카드가 서는 선반은 「닿는 집의 수」로 정해진다 — 그 자리를 담는 상태는 없다(lpKind 한 줄).
   네 카드를 선반에 놓은 뒤 「독감이 옮는다면?」을 누르면 독감 카드가 닿는 집이 늘어
   학생이 옮기지 않았는데 선반이 바뀐다. 난수 0 · 조작에 점수 0.
*/
const LP_HOUSES = 6;                               // 판의 집 여섯
const LP_HMARK = ["㉮","㉯","㉰","㉱","㉲","㉳"];
const LP_CARDS = 4;                                // 카드 넷
const LP_CARD = [
  "내가 독감에 걸렸어요",
  "공사장에서 참기 힘든 소음이 나요",
  "쓰레기를 아무 데나 버려요",
  "층간 소음으로 위아래 집 사이에 갈등이 생겼어요"
];
const LP_REACH = [0b000001, 0b110110, 0b111100, 0b010010];   // 카드가 처음 닿는 집 — 판이 정해 둔 그림
const LP_SPREAD = [0b011010, 0, 0, 0];                     // 옮았을 때 더해지는 집 — 판이 정해 둔 그림
const LP_MANY = 2;                                         // 여러 집 = 둘 이상
const LP_SHELF = ["개인의 일","지역문제"];
const LP_ALL = (1 << LP_CARDS) - 1;
const LP_SPREAD_Q = "만약 독감에 걸린 내가 예방 수칙을 지키지 않아 다른 주민들에게 옮는다면?";
const LP_SAY_NOSEL = "먼저 카드를 골라 봐요.";
const LP_SAY_DONE = "이미 선반에 놓은 카드예요. 판은 그대로예요.";
const LP_SAY_WRONG = "이 카드가 닿는 집을 다시 세어 봐요. 판은 그대로예요.";
const LP_SAY_ORDER_S = "먼저 네 카드를 모두 선반에 놓아 봐요.";
const LP_SAY_SPREADDONE = "이미 옮은 뒤예요. 판은 그대로예요.";
const LP_SAY_ORDER_R = "먼저 「옮는다면?」을 눌러 봐요.";
const LP_SAY_ORDER_F = "먼저 판을 읽어 봐요.";
const LP_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const LP_TELL_PUT = "선반에 놓았어요.";
const LP_TELL_SPREAD = "독감이 이웃 집으로 옮았어요. 닿는 집이 늘었어요 — 카드는 내가 옮기지 않았어요.";
const LP_READQ = [
  "내가 카드를 다시 옮겨 놓았기 때문이에요",
  "독감이 다른 주민들에게 옮아 여러 집의 생활을 불편하게 하게 되었기 때문이에요",
  "독감은 처음부터 지역문제이기 때문이에요"
];
const LP_READ_OK = 1;
const LP_READ_BAD = "독감 카드가 닿는 집이 몇 곳으로 바뀌었는지 살펴봐요.";
const LP_FINQ = [
  "지역 주민의 생활을 불편하게 하거나 지역 주민들 사이에 갈등을 일으키는 문제예요",
  "한 사람에게만 생긴 일이에요",
  "어느 지역에서나 똑같이 나타나는 문제예요"
];
const LP_FIN_OK = 0;
const LP_FIN_BAD = "여러 주민의 생활과 주민들 사이의 일을 떠올려 봐요.";

function lpReach(st,c){ return LP_REACH[c] | (st.lpSpread ? LP_SPREAD[c] : 0); }     // ⭐ LP_REACH·LP_SPREAD 를 읽는 자리는 코드에 여기 단 하나
function lpCount(m){ let n = 0; for(let h=0;h<LP_HOUSES;h++){ if(m & (1 << h)) n++; } return n; }
function lpKind(st,c){ return lpCount(lpReach(st,c)) >= LP_MANY ? 1 : 0; }             // ⭐ 카드가 서는 선반 — 이 한 줄
function lpHas(st,c){ return (st.lpDone & (1 << c)) !== 0; }

function lpHouses(st){
  const m = st.lpSel >= 0 ? lpReach(st, st.lpSel) : 0;
  let hs = '';
  for(let h=0;h<LP_HOUSES;h++) hs += `<div class="lp-house" data-house="${h}" data-hit="${(m & (1 << h)) ? 1 : 0}">${LP_HMARK[h]}<span style="font-size:.75em;font-weight:600">집</span></div>`;
  const cnt = st.lpSel >= 0 ? `<div class="lp-count" data-count="${lpCount(m)}">「${LP_CARD[st.lpSel]}」 카드가 닿는 집 ${lpCount(m)}곳</div>`
    : `<div class="lp-count" data-count="-1">카드를 고르면 그 일이 닿는 집이 칠해져요</div>`;
  return `<div class="lp-town"><div class="lp-houses">${hs}</div>${cnt}</div>`;
}
function lpPool(st){
  let b = '';
  for(let c=0;c<LP_CARDS;c++){ if(!lpHas(st,c)) b += `<button class="lp-card" data-card="${c}" data-sel="${st.lpSel === c ? 1 : 0}" onclick="lpPick(${c})">${LP_CARD[c]}</button>`; }
  if(!b) b = `<div class="note" style="text-align:left">네 카드를 모두 선반에 놓았어요.</div>`;
  return `<div class="lp-pool">${b}</div>`;
}
function lpShelf(st,s){
  let chips = '';
  for(let c=0;c<LP_CARDS;c++){
    if(lpHas(st,c) && lpKind(st,c) === s) chips += `<div class="lp-chip" data-chip="${c}" data-on="${s}"><span>${LP_CARD[c]}</span><span class="lp-reach" data-reach="${lpCount(lpReach(st,c))}">닿는 집 ${lpCount(lpReach(st,c))}곳</span></div>`;
  }
  return `<div class="lp-shelf" data-shelf="${s}"><button class="lp-sbtn" onclick="lpPut(${s})">${LP_SHELF[s]}</button>${chips}</div>`;
}

function lpPanel(st){
  const top = `<div class="lp-top">${lpHouses(st)}${lpPool(st)}</div>`;
  const shelves = `<div class="lp-shelves">${lpShelf(st,0)}${lpShelf(st,1)}</div>`;
  let ask = '';
  if(st.lpDone !== LP_ALL){
    ask = `<div class="lp-ask" data-step="sort"><b>카드를 골라 닿는 집을 세어 보고, 알맞은 선반을 눌러 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">어느 카드부터 골라도 괜찮아요. 한 집에만 닿는 일일까요, 여러 집에 닿는 일일까요?</div></div>`;
  } else if(!st.lpSpread){
    ask = `<div class="lp-ask" data-step="spread"><b>네 카드를 모두 놓았어요. 이번에는 독감 카드를 다시 생각해 봐요.</b>
      <button class="lp-go" onclick="lpSpreadGo()">🤧 ${LP_SPREAD_Q}</button></div>`;
  } else if(st.lpRead == null){
    ask = `<div class="lp-ask" data-step="read"><b>독감 카드가 내가 옮기지 않았는데 「지역문제」 선반으로 옮겨 갔어요. 왜 그랬을까요?</b>
      <div class="lp-opts">${LP_READQ.map((t,i)=>`<button class="lp-opt" onclick="lpRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(st.lpFin == null){
    ask = `<div class="lp-ask" data-step="fin"><b>그렇다면 지역문제란 무엇일까요?</b>
      <div class="lp-opts">${LP_FINQ.map((t,i)=>`<button class="lp-opt" onclick="lpFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="lp-ask" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">지역문제는 지역 주민의 생활을 불편하게 하거나 지역 주민들 사이에 갈등을 일으키는 문제예요.</b> 한 사람의 일도 여러 주민에게 닿으면 지역의 문제가 될 수 있어요.
      <div class="note" style="text-align:left;margin-top:5px">※ 교과서 그림에서 지역문제라고 생각하는 모습을 찾아 ○표 하고 까닭을 이야기하는 활동은 교실에서 친구들과 <b>직접</b> 해요.</div></div>`;
  }
  const tell = st.lpTell ? `<div class="lp-tell">${st.lpTell}</div>` : '';
  const warn = st.lpMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.lpMsg}</div>` : '';
  return `<div class="lp-wrap">
    <div class="lp-head">개인의 일일까요, 지역문제일까요? · 카드가 닿는 집을 세어 봐요</div>${top}${shelves}${tell}${ask}${warn}
    <div class="note" style="margin-top:8px">※ 집 여섯과 카드가 닿는 집은 <b>판이 정해 둔 그림</b>이에요. 실제 마을이 아니에요. 카드의 이야기는 교과서 수업에서 다루는 예를 옮긴 것이에요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function lpDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 카드 고르기 */
function lpPick(c){
  if(state.lpFin!=null) return;                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(c) || c<0 || c>=LP_CARDS) return;               // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(lpHas(state,c)){ state.lpMsg = LP_SAY_DONE; playThud(); lpDraw(); return; }            // 가드④: 이미 놓은 카드 — 판 불변
  state.lpSel = c;                                                     // ⭐ 카드를 고르는 자리는 코드에 여기 단 하나
  state.lpMsg = ""; state.lpTell = ""; playBlip(); lpDraw();
}
/* 선반에 놓기 — 닿는 집의 수에 맞는 선반만 받는다 */
function lpPut(s){
  if(state.lpFin!=null) return;                                        // 가드①
  if(!Number.isInteger(s) || s<0 || s>=LP_SHELF.length) return;        // 가드②
  if(state.lpSel < 0){ state.lpMsg = LP_SAY_NOSEL; playThud(); lpDraw(); return; }          // 가드③: 카드를 고르기 전 — 판 불변
  if(s !== lpKind(state, state.lpSel)){ state.lpMsg = LP_SAY_WRONG; playThud(); lpDraw(); return; }   // 가드⑤: 어긋난 선반 — 판 불변(알맞은 선반 이름 0)
  state.lpDone |= (1 << state.lpSel);                                  // ⭐ 선반에 놓는 자리는 코드에 여기 단 하나 · 덜어 내는 자리 0
  state.lpSel = -1; state.lpMsg = ""; state.lpTell = LP_TELL_PUT; playBlip(); lpDraw();
}
/* 옮는다면? — 닿는 집이 늘어 선반이 저절로 바뀐다 */
function lpSpreadGo(){
  if(state.lpFin!=null) return;                                        // 가드①
  if(state.lpDone !== LP_ALL){ state.lpMsg = LP_SAY_ORDER_S; playThud(); lpDraw(); return; } // 가드⑥: 네 카드를 다 놓기 전 — 판 불변
  if(state.lpSpread){ state.lpMsg = LP_SAY_SPREADDONE; playThud(); lpDraw(); return; }       // 가드⑦: 이미 옮은 뒤 — 판 불변
  state.lpSpread = true;                                               // ⭐ 옮는 자리는 코드에 여기 단 하나 · 되돌리는 자리 0
  state.lpMsg = ""; state.lpTell = LP_TELL_SPREAD; playBlip(); lpDraw();
}
/* 판 읽기 */
function lpRead(i){
  if(state.lpFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=LP_READQ.length) return;        // 가드②
  if(state.lpRead!=null){ state.lpMsg = LP_SAY_READDONE; lpDraw(); return; }                 // 가드⑧: 이미 정한 자리 — 판 불변
  if(!state.lpSpread){ state.lpMsg = LP_SAY_ORDER_R; playThud(); lpDraw(); return; }         // 가드⑧: 옮기 전 — 판 불변
  if(i!==LP_READ_OK){ state.lpMsg = LP_READ_BAD; playThud(); lpDraw(); return; }             // 가드⑧: 어긋난 답 — 판 불변
  state.lpRead = i; state.lpMsg = ""; playBlip(); lpDraw();
}
/* 마무리 */
function lpFin(i){
  if(state.lpFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=LP_FINQ.length) return;         // 가드②
  if(state.lpRead==null){ state.lpMsg = LP_SAY_ORDER_F; playThud(); lpDraw(); return; }      // 가드⑧: 판을 읽기 전 — 판 불변
  if(i!==LP_FIN_OK){ state.lpMsg = LP_FIN_BAD; playThud(); lpDraw(); return; }               // 가드⑧: 어긋난 답 — 판 불변
  state.lpFin = i; state.lpMsg = ""; playChime(); lpDraw();
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l02 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

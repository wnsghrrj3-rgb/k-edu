<!DOCTYPE html>
<!--
=========================================================================
  사회 4-2 · 2단원 지역문제를 해결하고 지역을 알리는 노력
  주제② 지역을 알리는 노력 · l08
  「우리 지역의 자랑거리를 알리는 다양한 노력을 알아볼까요」
  교과서 p.84~89 · 지도서 10~11차시(p.162~167) · [4사09-02]
  수업 기법 = 모둠 토의 · 돌아가며 말하기
=========================================================================

  ■ 직접조작 = 놓은 것을 옮길 수 있고, 옮겨도 판이 무너지지 않는 판
  ⭐ 2단원 앞 일곱 판에서 학생이 놓은 것은 놓은 그 자리에 굳었다.
     l01은 판이 대신 옮겼고(학생이 옮긴 것이 아니다), l02는 세어 주고도 정해 주지 않았고,
     l03은 접으면 원인이 사라졌고, l04는 가장 낮은 자리가 갈랐고, l05는 종이 한 장이 갈랐고,
     l06은 판이 판정하지 않고 자리가 대신 말했고, l07은 놓은 것이 사라지고 줄만 남았다.
     ★ 일곱 판 모두 「거두는 자리」와 「옮기는 자리」가 코드에 0이었다.
  ⭐ 이번 판은 거기가 다르다 — 다 놓은 뒤에 한 방법을 골라 다른 갈래로 옮길 수 있다.
     그리고 ★★ 옮겨도 네 갈래가 그대로 다 차 있다.
     갈래마다 그 갈래에만 쓰이는 방법이 따로 있어서, 옮겨 간 자리도 옮겨 온 자리도 비지 않는다.
  ⭐ 옮길 수 있는 방법은 둘뿐이다 — 「축제를 열어요」(네 갈래)와 「체험 프로그램을 운영해요」(두 갈래).
     나머지 다섯은 설 수 있는 갈래가 하나뿐이라 옮길 곳이 없다.
     ★ 옮길 수 있는지를 담는 상태도 상수도 코드에 없다 — alMoveCount 한 줄이 그때그때 센다.
  ⭐ 그래서 ★ 완주 판이 하나가 아니다(축제 4 × 체험 프로그램 2 = 여덟 갈래)
     — 여덟 모두 네 갈래가 다 차고, 어느 것도 틀리지 않았다.
     근거 = 지도서 10~11차시 학습 내용 정리 원문 네 줄이 네 갈래 모두에서 「축제」를 든다.
  ⭐ 「네 갈래가 다 찼는지」를 담는 상태가 코드에 아예 없다 — alFull 한 줄이 그때그때 센다.
     AL_FIT 를 대괄호로 읽는 자리도 alFitOf 단 하나다.
  ⭐ 어긋난 갈래에 놓으면 판이 그대로다. 안내는 「그 갈래에는 설 수 없어요」까지만이고
     알맞은 갈래의 이름을 흘리지 않는다.

  ■ 4단계
   ① 알리는 방법 일곱을 네 갈래에 놓기(순서 자유 · 판정 있음 · 어긋나면 판 불변)
   ② 옮겨 보기(일곱을 다 세워야 열린다 · 무판정 · 한 번 옮기면 다음 자리가 열린다 · ★ 옮겨도 네 갈래가 그대로 찬다)
   ③ 판 읽기 3택(정답 자리 2)
   ④ 마무리 3택(정답 자리 0 = 지도서 학습 내용 정리 원문)

  ■ 가드 8종
   ① 마무리 확정 후 네 처리기 전체 잠금  ② 무효 번호(Number.isInteger·범위)
   ③ 이미 놓은 방법 다시 고르기 — 판 불변   ④ 고르기 전 놓기·옮기기 — 판 불변
   ⑤ 설 수 없는 갈래 — 판 불변(알맞은 갈래 이름 0)
   ⑥ 일곱을 다 놓기 전 옮기기·판 읽기 — 판 불변
   ⑦ 옮길 곳이 하나뿐인 방법 고르기 · 이미 서 있는 갈래로 옮기기 — 판 불변
   ⑧ 한 번도 옮겨 보기 전 판 읽기 · 판을 읽기 전 마무리 · 어긋난 답 — 판 불변

  ■ 정직 4곳
   ㉠ 판의 방법 일곱과 갈래별 사례는 교과서 84~87쪽·지도서 정리 원문에서 옮긴 자리다.
   ㉡ 판은 어느 방법이 더 좋은지 가리지 않는다(순위 0).
   ㉢ 우리 지역이 자랑거리를 알리려고 하는 노력을 실제로 조사해 정리하는 일은 교실 몫이다.
   ㉣ 실제 누리집 주소·신문사·날짜·금액 0.

  ■ 설계 원칙
   · 12~13차시 침범 0(「알리는 활동」==1 차시 예고 · 홍보 포스터·안내 책자·가위·풀·색칠 도구 0)
   · 14~16차시 침범 0(생각을 펼쳐요·생각 그물·교실 놀이·단원 평가 0)
   · 주제① 재현 0(해결 방안·제안서·공익 광고·실천 결과 0 · 「지역문제」는 META 한 자리)
   · 1단원 재현 0 · 3단원 침범 0(인문환경·「도시의 특징」 0 — 「자연환경」은 이 차시의 갈래 이름)
   · 교사용 참고 자료 0(세병관·삼도 수군통제영·유네스코·한국민족문화대백과사전·합죽선 제작
     공정·머드 성분·지도 꿀·학습 안내·활동지·평가 관점·평가 방법 전수)
   · 네 자리 연도 0 · 비율 0 · 금액 0 · 실제 누리집 주소 0
   · 정서 — 임진왜란·전쟁·일본군·무찌른·싸움·다쳤·사망·무서·죽었·목숨·위험 0
     (통영의 자랑거리는 지도안 원문 「이순신 장군의 나라 사랑 정신」까지만 쓴다)
   · 「틀렸」 0
-->

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#B45309; --green-d:#92400E; --cyan:#0891B2;
  --bg:#FFF7ED; --bub:#FFEDD5; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;

html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#FFEDD5;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#FFEDD5;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(180,83,9,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 조작 판 — 옮겨도 네 갈래가 그대로 차 있는 판 */
.al-wrap{max-width:760px;width:100%;margin:0 auto}
.al-head{background:#FFEDD5;color:#9A3412;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.al-board{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.al-cell{border:2px solid #E2E8F0;border-radius:12px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.al-cell[data-open="1"]{border-color:#FDBA74;background:#FFFBF5}
.al-kn{border:none;border-radius:9px;background:#F1F5F9;color:#475569;font-family:inherit;font-weight:800;
  padding:6px 8px;cursor:pointer;font-size:clamp(12px,2vw,15px);word-break:keep-all}
.al-cell[data-open="1"] .al-kn{background:#EA580C;color:#fff}
.al-kn:hover{background:#FED7AA;color:#7C2D12}
.al-ways{display:flex;flex-direction:column;gap:4px}
.al-way{background:#FFF7ED;border-left:3px solid #EA580C;border-radius:7px;padding:5px 7px;
  font-size:clamp(11px,1.95vw,14px);line-height:1.45;color:#7C2D12;font-weight:600;word-break:keep-all;animation:pop .3s ease both}
.al-none{color:#94A3B8;font-size:clamp(11px,1.9vw,13px);padding:3px 2px;word-break:keep-all}
.al-hold{margin-top:8px;border-radius:10px;padding:7px 11px;font-size:clamp(12px,2.05vw,15px);
  background:#F1F5F9;color:#475569;font-weight:700;text-align:center;word-break:keep-all}
.al-hold[data-hold="1"]{background:#E0F2FE;color:#0369A1}
.al-pool{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.al-item{border:1.5px solid #CBD5E1;background:#F8FAFC;color:#334155;font-family:inherit;font-weight:600;
  border-radius:10px;padding:8px 9px;cursor:pointer;text-align:left;line-height:1.45;
  font-size:clamp(11px,1.95vw,14px);word-break:keep-all}
.al-item:hover{border-color:#EA580C;background:#FFF7ED}
.al-item[data-sel="1"]{border-color:#EA580C;background:#FFEDD5;color:#7C2D12}
.al-item[data-put="1"]{background:#F1F5F9;color:#94A3B8;border-style:dashed}
.al-tell{margin-top:8px;border-radius:12px;padding:9px 13px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;background:#F0F9FF;border-left:4px solid var(--cyan)}
.al-ask{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#FFFBF5;margin-top:9px;font-size:clamp(13px,2.2vw,16px);line-height:1.6}
.al-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.al-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;
  font-size:clamp(13px,2.2vw,16px);cursor:pointer;text-align:left;line-height:1.5;word-break:keep-all}
.al-opt:hover{border-color:var(--green);background:var(--bub)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
  .al-board{grid-template-columns:1fr}
  .al-pool{grid-template-columns:1fr}
}

/* ===== 직접 조작: 놓은 것을 옮길 수 있고, 옮겨도 판이 무너지지 않는 판 =====
   ⭐ 2단원 앞 일곱 판에서 학생이 놓은 것은 놓은 그 자리에 굳었다(거두는 자리·옮기는 자리 0).
   ⭐ 이번 판은 거기가 다르다 — 일곱을 다 놓은 뒤 한 방법을 골라 다른 갈래로 옮길 수 있다.
      그리고 ★ 옮겨도 네 갈래가 그대로 다 차 있다. 갈래마다 그 갈래에만 쓰이는 방법이 따로 있기 때문이다.
   ⭐ 옮길 수 있는 방법은 둘뿐이다 — 설 수 있는 갈래가 둘 이상인 방법(축제 · 체험 프로그램).
      옮길 수 있는지를 담는 상태도 상수도 없다. alFitCount 한 줄이 그때그때 센다.
   ⭐ 「네 갈래가 다 찼는지」를 담는 상태도 없다. alFull 한 줄이 그때그때 센다.
   ⭐ AL_FIT 를 대괄호로 읽는 자리는 alFitOf 단 하나다(판·패널·처리기가 직접 읽지 않는다).
   ⭐ 완주 판은 하나가 아니다 — 축제 4 × 체험 프로그램 2 = 여덟 갈래이고 여덟 모두 네 갈래가 찬다. */
const AL_N = 7;
const AL_KINDS = ["자연환경", "역사", "문화", "생산물"];
const AL_WAY = [
  "축제를 열어요",
  "자연환경을 이용한 관광 상품으로 개발해요",
  "전시회를 열어요",
  "체험 프로그램을 운영해요",
  "민속놀이와 체육 행사를 함께 열어요",
  "박람회를 열어요",
  "직거래 장터를 열어요"
];
const AL_SHORT = ["축제", "관광 상품 개발", "전시회", "체험 프로그램", "민속놀이·체육 행사", "박람회", "직거래 장터"];
/* 설 수 있는 갈래 — 자연환경 1 · 역사 2 · 문화 4 · 생산물 8 */
const AL_FIT = [15, 1, 2, 10, 4, 8, 8];
/* 갈래마다의 교과서 사례 한 줄 — AL_CASE[방법][갈래], 설 수 없는 자리는 빈 칸 */
const AL_CASE = [
  ["갯벌에서 얻은 머드로 머드 축제를 열어요", "전해 내려오는 역사를 알리려고 축제를 열어요", "기지시 줄다리기 민속 축제를 열어요", "생산물을 알리려고 축제를 열기도 해요"],
  ["갯벌에서 얻은 머드로 다양한 상품을 만들어요", "", "", ""],
  ["", "전해 내려오는 역사를 보존하고 알리려고 전시회를 열어요", "", ""],
  ["", "유적지를 견학하고 퀴즈를 풀며 거북선을 그려 봐요", "", "부채를 알리려고 부채 만들기 체험 행사를 해요"],
  ["", "", "줄다리기 대회에 민속놀이와 체육 행사를 함께 열어요", ""],
  ["", "", "", "박람회를 열어 김제시의 쌀을 알려요"],
  ["", "", "", "직거래 장터를 열어 진안군의 인삼을 알리거나 팔아요"]
];
const AL_EMPTY = "아직 아무것도 세우지 않았어요";
const AL_SAY_PUTDONE = "이미 세운 방법이에요. 판은 그대로예요.";
const AL_SAY_NOSEL = "먼저 아래에서 방법을 하나 골라요.";
const AL_SAY_MISS = "이 방법은 그 갈래에는 설 수 없어요. 판은 그대로예요.";
const AL_SAY_CLOSED = "일곱을 모두 세웠어요. 이제 옮겨 보는 자리예요. 판은 그대로예요.";
const AL_SAY_ORDER_M = "먼저 방법 일곱을 모두 세워 봐요.";
const AL_SAY_ONEFIT = "이 방법이 설 수 있는 갈래는 하나뿐이라 옮길 곳이 없어요. 판은 그대로예요.";
const AL_SAY_SAME = "이미 그 갈래에 서 있어요. 판은 그대로예요.";
const AL_SAY_ORDER_R = "먼저 한 방법을 다른 갈래로 옮겨 봐요.";
const AL_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const AL_SAY_ORDER_FIN = "먼저 판을 읽어 봐요.";
const AL_TELL_PICK = "방법을 골랐어요. 어느 갈래에 세워 볼까요?";
const AL_TELL_PUT = "그 갈래에 세웠어요.";
const AL_TELL_MOVE = "옮겼어요. 네 갈래를 다시 살펴봐요.";
const AL_READQ = [
  "판이 빈 갈래를 몰래 채워 주었기 때문이에요",
  "옮긴 방법이 원래 자리에도 그대로 남아 있기 때문이에요",
  "갈래마다 그 갈래에만 쓰이는 방법이 따로 있기 때문이에요"
];
const AL_READ_OK = 2;
const AL_READ_BAD = "옮겨 간 갈래와 옮겨 온 갈래에 무엇이 남아 있는지 다시 살펴봐요.";
const AL_FINQ = [
  "지역 사람들은 자연환경, 역사, 문화, 생산물 등의 자랑거리를 알리려고 다양한 노력을 해요",
  "지역 사람들은 자랑거리를 한 가지 방법으로만 알려요",
  "지역 사람들은 생산물과 관련 있는 자랑거리만 알려요"
];
const AL_FIN_OK = 0;
const AL_FIN_BAD = "판의 네 갈래에 저마다 다른 방법이 서 있던 것을 떠올려 봐요.";

function alCaseOf(i, k){ return AL_CASE[i][k]; }                            // ⭐ AL_CASE 를 대괄호로 읽는 자리도 코드에 여기 단 하나
function alFitOf(i){ return AL_FIT[i]; }                                    // ⭐ AL_FIT 를 대괄호로 읽는 자리는 코드에 여기 단 하나
function alFits(i, k){ return (alFitOf(i) & (1 << k)) !== 0; }
function alFitCount(i){ let n = 0; for(let k=0;k<AL_KINDS.length;k++){ if(alFits(i,k)) n++; } return n; }  // ⭐ 옮길 수 있는지를 담는 상태 0
function alWays(st, k){ const out = []; for(let i=0;i<AL_N;i++){ if(st.alAt[i] === k) out.push(AL_SHORT[i]); } return out; }
function alPutN(st){ let n = 0; for(let i=0;i<AL_N;i++){ if(st.alAt[i] != null) n++; } return n; }
function alAllPut(st){ return alPutN(st) === AL_N; }
function alFull(st){ for(let k=0;k<AL_KINDS.length;k++){ if(alWays(st,k).length === 0) return false; } return true; }  // ⭐ 다 찼는지를 담는 상태 0
function alFullN(st){ let n = 0; for(let k=0;k<AL_KINDS.length;k++){ if(alWays(st,k).length > 0) n++; } return n; }
function alStage(st){
  if(!alAllPut(st)) return "put";
  if(st.alMoved < 1) return "move";
  if(st.alRead == null) return "read";
  if(st.alFin == null) return "fin";
  return "end";
}

/* 갈래 칸 — 그 갈래에 선 방법이 쌓인다 */
function alBoard(st){
  let cells = '';
  for(let k=0;k<AL_KINDS.length;k++){
    const ws = alWays(st, k);
    const body = ws.length
      ? ws.map(t=>`<div class="al-way" data-way="1">${t}</div>`).join('')
      : `<div class="al-none" data-way="0">${AL_EMPTY}</div>`;
    const stage = alStage(st);
    const on = ((stage === "put" || stage === "move") && st.alSel != null) ? 1 : 0;
    const fn = (stage === "move") ? `alMove(${k})` : `alPlace(${k})`;
    cells += `<div class="al-cell" data-kind="${k}" data-ways="${ws.length}" data-open="${on}">
      <button class="al-kn" data-kn="${k}" onclick="${fn}">${AL_KINDS[k]}</button>
      <div class="al-ways">${body}</div></div>`;
  }
  return `<div class="al-board" data-put="${alPutN(st)}" data-full="${alFullN(st)}">${cells}</div>`;
}

/* 고를 목록 — 세운 방법도 목록에 그대로 남아 어디에 세웠는지 보인다 */
function alPool(st){
  let rows = '';
  for(let i=0;i<AL_N;i++){
    const done = st.alAt[i] != null;
    const sel = (st.alSel === i) ? 1 : 0;
    const tail = done ? ` <span style="color:#94A3B8">— ${AL_KINDS[st.alAt[i]]}</span>` : '';
    rows += `<button class="al-item" data-item="${i}" data-sel="${sel}" data-put="${done?1:0}" onclick="alPick(${i})">${AL_WAY[i]}${tail}</button>`;
  }
  return `<div class="al-pool" data-left="${AL_N - alPutN(st)}">${rows}</div>`;
}

function alPanel(st){
  const stage = alStage(st);
  let ask = '';
  if(stage === "put"){
    ask = `<div class="al-ask" data-step="put"><b>알리는 방법을 하나 골라 설 수 있는 갈래에 세워 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">어느 것부터 세워도 괜찮아요. 한 방법이 <b>여러 갈래</b>에 설 수도 있어요.</div></div>`;
  } else if(stage === "move"){

    <div class="sum-item"><span class="n">1</span><div><b>자연환경</b> — 자연환경을 이용한 관광 상품을 지역의 자랑거리로 개발하여 여러 가지 방법으로 알려요.</div></div>
    <div class="sum-item"><span class="n">2</span><div><b>역사</b> — 전해 내려오는 역사를 보존하고 알리려고 축제나 전시회 등 다양한 행사를 해요.</div></div>
    <div class="sum-item"><span class="n">3</span><div><b>문화</b> — 지역의 문화를 알리려고 축제를 여는 등 다양한 노력을 해요.</div></div>
    <div class="sum-item"><span class="n">4</span><div><b>생산물</b> — 생산물을 알리려고 박람회, 직거래 장터, 축제 등을 열기도 해요.</div></div>
  </div>
  <div class="note">다음 시간에는 우리 지역의 자랑거리를 <b style="color:#B45309">알리는 활동</b>을 해 봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"네 갈래마다 자랑거리를 알리는 노력을 말할 수 있어요",st)}
    ${selfCheck(1,"같은 방법이 여러 갈래에 쓰이기도 한다는 것을 설명할 수 있어요",st)}
    ${selfCheck(2,"우리 지역의 노력을 조사하는 방법을 말할 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">알리는 다양한 노력을 알아봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">우리 지역의 노력은 교실에서 <b style="color:#B45309">직접</b> 조사해 봐요.</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_2_social_u2_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  alAt:[null,null,null,null,null,null,null], alSel:null, alMoved:0, alRead:null, alFin:null, alMsg:"", alTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function alDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 방법 고르기 — 세우는 단계에서는 이미 세운 것을 다시 고를 수 없고,
   옮기는 단계에서는 설 수 있는 갈래가 하나뿐인 방법을 고를 수 없다 */
function alPick(i){
  if(state.alFin!=null) return;                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(i) || i<0 || i>=AL_N) return;                   // 가드②: 무효 번호 — 안내조차 띄우지 않음
  const stage = alStage(state);
  if(stage === "put" && state.alAt[i] != null){ state.alMsg = AL_SAY_PUTDONE; playThud(); alDraw(); return; }   // 가드③
  if(stage === "move" && alFitCount(i) < 2){ state.alMsg = AL_SAY_ONEFIT; playThud(); alDraw(); return; }       // 가드⑦: 옮길 곳이 하나뿐 — 판 불변
  state.alSel = i;
  state.alMsg = ""; state.alTell = AL_TELL_PICK; playBlip(); alDraw();
}
/* 갈래에 세우기 — 설 수 있는 갈래에만 선다 */
function alPlace(k){
  if(state.alFin!=null) return;                                        // 가드①
  if(!Number.isInteger(k) || k<0 || k>=AL_KINDS.length) return;         // 가드②
  if(alAllPut(state)){ state.alMsg = AL_SAY_CLOSED; playThud(); alDraw(); return; }   // 가드⑥: 일곱을 다 세운 뒤엔 세우는 자리가 닫힌다 — 판 불변
  if(state.alSel==null){ state.alMsg = AL_SAY_NOSEL; playThud(); alDraw(); return; }    // 가드④: 고르기 전 — 판 불변
  if(!alFits(state.alSel, k)){ state.alMsg = AL_SAY_MISS; playThud(); alDraw(); return; } // 가드⑤: 설 수 없는 갈래 — 판 불변 · 알맞은 갈래 이름 0
  const put = state.alSel;
  state.alAt[state.alSel] = k;                                         // ⭐ 세우는 자리는 코드에 여기 단 하나
  state.alSel = null;
  state.alMsg = ""; state.alTell = AL_TELL_PUT + " " + alCaseOf(put, k); playBlip(); alDraw();
}
/* 다른 갈래로 옮기기 — 옮겨도 네 갈래가 그대로 차 있다 */
function alMove(k){
  if(state.alFin!=null) return;                                        // 가드①
  if(!Number.isInteger(k) || k<0 || k>=AL_KINDS.length) return;         // 가드②
  if(!alAllPut(state)){ state.alMsg = AL_SAY_ORDER_M; playThud(); alDraw(); return; }   // 가드⑥: 일곱을 다 세우기 전 — 판 불변
  if(state.alSel==null){ state.alMsg = AL_SAY_NOSEL; playThud(); alDraw(); return; }    // 가드④
  if(!alFits(state.alSel, k)){ state.alMsg = AL_SAY_MISS; playThud(); alDraw(); return; } // 가드⑤
  if(state.alAt[state.alSel] === k){ state.alMsg = AL_SAY_SAME; playThud(); alDraw(); return; } // 가드⑦: 이미 서 있는 갈래 — 판 불변
  const mv = state.alSel;
  state.alAt[state.alSel] = k;                                         // ⭐ 옮기는 자리는 코드에 여기 단 하나
  state.alMoved += 1;                                                  // ⭐ 옮긴 횟수는 늘기만 한다(덜어 내는 자리 0)
  state.alSel = null;
  state.alMsg = ""; state.alTell = AL_TELL_MOVE + " " + alCaseOf(mv, k); playBlip(); alDraw();
}
/* 판 읽기 */
function alRead(i){
  if(state.alFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=AL_READQ.length) return;         // 가드②
  if(!alAllPut(state)){ state.alMsg = AL_SAY_ORDER_M; playThud(); alDraw(); return; }   // 가드⑥
  if(state.alMoved < 1){ state.alMsg = AL_SAY_ORDER_R; playThud(); alDraw(); return; }  // 가드⑧: 한 번도 옮겨 보기 전 — 판 불변
  if(state.alRead!=null){ state.alMsg = AL_SAY_READDONE; alDraw(); return; }            // 가드⑧: 이미 정한 자리 — 판 불변
  if(i!==AL_READ_OK){ state.alMsg = AL_READ_BAD; playThud(); alDraw(); return; }        // 가드⑧: 어긋난 답 — 판 불변
  state.alRead = i; state.alMsg = ""; playBlip(); alDraw();
}
/* 마무리 */
function alFin(i){
  if(state.alFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=AL_FINQ.length) return;          // 가드②
  if(state.alRead==null){ state.alMsg = AL_SAY_ORDER_FIN; playThud(); alDraw(); return; } // 가드⑧: 판을 읽기 전 — 판 불변
  if(i!==AL_FIN_OK){ state.alMsg = AL_FIN_BAD; playThud(); alDraw(); return; }          // 가드⑧: 어긋난 답 — 판 불변
  state.alFin = i; state.alMsg = ""; playChime(); alDraw();
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g4_social_u2_l09_첫칸은같아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

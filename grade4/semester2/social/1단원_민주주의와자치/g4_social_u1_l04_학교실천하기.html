영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100

직접조작: 실천 판 — 한 줄기가 둘로 갈렸다가 다시 한 자리로 모이는 형
  ⭐ 앞 세 차시에서 판의 줄기는 언제나 하나였다. l01의 의견함 판도 l02의 회의 판도 판이 하나였고,
     l03에서는 세 줄이 나란히 섰지만 그 세 줄은 끝까지 서로 만나지 않았다.
     이번만 한 줄기가 둘로 갈렸다가 다시 하나로 모인다 — 셋째 걸음(민주적인 방법으로 결정하기)에서
     판이 설문조사와 학급 회의 두 갈래로 갈리고, 넷째 걸음(해결 방안 실천하기)에서 두 갈래가
     다시 한 자리로 모인다.
     근거: 교과서 23~24쪽 — 놀이기구와 바닥 소재는 「설문조사를 해서 학교 구성원들이 원하는
     놀이기구와 놀이터 바닥 소재에 관해 의견을 받아 보기로」 했고, 이용 규칙은 「규칙을 세우는 것을
     주제로 각 학급에서 회의를 열기로」 했으며, 그 뒤 「학생, 교사, 학부모가 모이는 회의가 열렸다」.
  ⭐ 어느 갈래도 비어 있으면 모이지 않는다 — lvMeet(st) = lvDone(st) === LV_N 한 줄이 그것을 다 정한다.
     그래서 「한 갈래만으로도 모이는 판」은 만들어질 수 없다.
  ⭐ 어느 방안도 버려지지 않는다 — 셋 다 실린다. 앞 세 판에서 학생이 고른 것은 언제나 「그 자리의 답」이었고
     고르지 않은 것은 판에서 아무 몫도 하지 않았다. 이번만 고르지 않고 남는 것이 없다.
     판의 방안 칸 수는 어느 시점에도 셋 그대로다.
  ⭐ 어느 갈래에 실을지는 방안 자체가 정한다(LV_WAYOF = [0,0,1] 한 줄 · 읽는 자리는 lvWayOf 단 하나).
     판·패널·다른 처리기는 그 상수를 직접 읽지 않는다.
  ⭐ 갈래 전용 상태가 코드에 아예 없다 — 한 숫자 lvPut 과 LV_WAYOF 한 줄이 두 갈래를 다 그린다.
     state.lvPut |= 이 코드에 단 하나이고 덜어 내는 자리 0.
  ⭐ 방안 순서 자유(6 순열 전수로 완주 판이 글자까지 같음).

지도서 근거: [학습 목표] 학교생활에서 민주주의를 실천할 수 있다 /
  [교과서 22쪽 본문] 학교에서 일어나는 여러 가지 일들은 학교 구성원이 참여하여 민주적인 방법으로
  해결하는 것이 바람직합니다 /
  [교과서 22쪽 문제 확인] 학교의 놀이터가 오래되어 학생들이 사용하기에 불편하고 위험한 놀이기구가 많습니다 ·
  한꺼번에 많은 학생이 이용할 때 더욱 위험해 보입니다 · 놀이터 바닥에 모래가 깔려 있는데 움푹 파인 부분이 많아
  학생들이 이용하다 다칠 것 같습니다 /
  [교과서 23쪽 해결 방안] 놀이기구를 안전한 것들로 바꾸는 방안 · 놀이터 바닥을 넘어져도 다치지 않는 소재로
  바꾸는 방안 · 놀이터 이용 규칙을 세우는 방안 /
  [해결 방안 탐색 시 고려할 점] 해결해야 할 문제의 원인이 무엇인지 생각해 보고 원인에 따른 해결 방안을 찾기 ·
  해결 방안의 장단점을 생각하기 · 최대한 많은 학교 구성원이 만족할 수 있는 해결 방안인지 생각하기 /
  [교과서 23쪽 결정] 모래가 깔린 바닥을 더 좋아하는 학생도 있을 수 있으므로 설문조사를 해서 결정하기로 함 ·
  놀이터를 더욱 안전하게 이용하기 위해 규칙을 세우는 것을 주제로 각 학급에서 회의를 열기로 함 /
  [교과서 24쪽 실천] 학교에서는 전달받은 의견을 바탕으로 설문조사를 하여 학생, 교사, 학부모의 의견을 모아
  놀이터를 바꿨습니다 · 학생 자치회에서는 각 학급 회의에서 나온 의견을 종합하여 놀이터 이용 규칙을 정하고
  이를 잘 지키도록 홍보했습니다 · 그 후 학생, 교사, 학부모가 모이는 회의가 열렸습니다 /
  [교과서 24쪽 결과 확인] 놀이터가 변하니 더 안전하게 이용할 수 있어서 좋다 · 새롭게 정한 이용 규칙은 더 많은
  학생이 만족할 수 있도록 수정해 나가겠다 · 놀이터뿐만 아니라 다른 문제는 없는지 살피고 더 좋은 학교가 될 수
  있도록 계속 관심을 기울이겠다 /
  [결과 확인 시 고려할 점] 문제를 해결하기 전과 후를 비교하여 달라진 부분을 확인하기 ·
  실천 결과에 대한 학교 구성원들의 생각을 확인하기 · 아쉬운 점이 있으면 보완해 나가기 ·
  더 좋은 학교가 되기 위해 민주적으로 해결할 수 있는 다른 일이 있는지 살펴보기 /
  [교과서 25쪽 O/X] 학교에 해결하고 싶은 일이 있을 때는 해결 방안을 먼저 결정해야 합니다 (✕) /
  [교과서 25쪽 예시 답안] 선택한 일 = 화장실 출입문 다시 달기 · 해결 방안 = 커튼 형태의 가림막, 자동문 ·
  회의를 통해 장단점을 토의해 비용도 저렴하고 오염에도 강한 발 형태의 가림막을 설치하기로 함 ·
  우리의 노력으로 학교가 더 좋아진 것 같아서 뿌듯하다 /
  [교과서 26쪽 풍덩] ○○ 초등학교 학생들은 학교 이름을 바꾸고 싶었지만 학부모, 졸업생, 지역 주민의 동의와
  교육청의 허가가 있어야만 가능한 일이었습니다 · 한 학생이 학생 자치회 임원 선거에 출마하며 학교 이름을
  바꾸겠다는 공약을 내세웠고 당선되면서 활동이 시작됐습니다 · 학생들은 도움을 요청하는 편지를 보내고
  서명 운동을 벌였습니다 · 교명 변경 추진 위원회가 만들어졌고 민주적인 절차를 거쳐 학교 이름이 바뀌었습니다 /
  [5~6차시 주요 내용 정리] 학교에서 민주주의를 실천하는 과정 — 해결하고 싶은 일 확인하기 →
  해결 방안 탐색하기 → 민주적인 방법으로 해결 방안 결정하기 → 해결 방안 실천하기 → 실천 결과 확인하기

정직 원칙: ㉠ 판의 놀이터는 교과서 22~24쪽에 실린 사례를 옮긴 자리이고, 우리 학교에서 실제로 있었던 일이

  ㉡ 「우리 학교에서 해결하고 싶은 일을 찾아 민주적으로 해결하기」는 교실 몫(완료 카드·정리 명시).
  ㉢ 판이 두 갈래에 순위를 매기지 않는다 — 어느 방법이 더 낫다고 말하지 않는다(조작 코드에 순위·점수 어휘 0).

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#4F46E5; --green-d:#4338CA; --cyan:#0891B2;
  --bg:#EEF2FF; --bub:#E0E7FF; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);

.ka-sc svg{width:14px;height:14px}

  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(79,70,229,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 조작 판 — 실천 판 */
.lv-wrap{max-width:660px;width:100%;margin:0 auto}
.lv-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lv-step{border:1.6px solid var(--line);background:#F8FAFC;border-radius:9px;padding:6px 3px;text-align:center;
  font-size:.72em;line-height:1.3;font-weight:700;color:#94A3B8}
.lv-step.lit{border-color:#86EFAC;background:#F0FDF4;color:#166534}
.lv-prob{margin-top:9px;border:2px solid #FCD9A5;background:#FFFBEB;border-radius:12px;padding:9px 12px;
  font-size:clamp(13px,2.2vw,16px);line-height:1.6;color:#92400E}
.lv-plans{margin-top:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lv-plan{width:100%;cursor:pointer;font-family:inherit;border:2px solid var(--line);background:#fff;border-radius:11px;
  padding:8px 4px;text-align:center;font-weight:700;font-size:.86em;line-height:1.3}
.lv-plan:hover{border-color:var(--green);background:var(--bub)}
.lv-plan.now{border-color:#F57F17;background:#FFF8E1;color:#92400E}
.lv-plan.full{border-color:var(--green);background:#E0E7FF;cursor:default;color:#4338CA}
.lv-plan .pn{display:block;font-size:.86em;color:var(--muted);font-weight:700}
.lv-fork{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv-way{border:2px solid var(--line);border-radius:12px;padding:8px 9px;background:#F8FAFF;min-height:74px}
.lv-way .wn{font-size:.9em;font-weight:800;color:#4338CA;margin-bottom:5px;text-align:center}
.lv-slot{background:#fff;border:1.6px solid var(--line);border-radius:9px;padding:6px 5px;margin-top:5px;
  font-size:.8em;line-height:1.4;font-weight:700;text-align:center;color:#166534}
.lv-slot.empty{color:#94A3B8}
.lv-meet{margin-top:10px;border:2px solid #86EFAC;background:#F0FDF4;border-radius:12px;padding:10px 13px;
  font-size:clamp(13px,2.2vw,16px);line-height:1.6;color:#166534}
.lv-note{margin-top:9px;border-radius:12px;padding:10px 14px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;
  background:#E0E7FF;border-left:4px solid var(--green)}
.lv-note.big{background:#FFF8E1;border-left-color:#F57F17}
.lv-card{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#F8FAFF;margin-top:9px;
  font-size:clamp(13px,2.2vw,16px);line-height:1.6}
.lv-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.lv-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;
  font-size:clamp(13px,2.2vw,16px);font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
.lv-opt:hover{border-color:var(--green);background:var(--bub)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
  .lv-plans{grid-template-columns:1fr}
  .lv-steps{grid-template-columns:1fr 1fr}
  .lv-fork{grid-template-columns:1fr}
}

  "해결 방안을 먼저 결정하는 일이에요",

const LV_FIN_OK = 0;

function lvWayOf(p){ return LV_WAYOF[p]; }                                  // ⭐ LV_WAYOF 를 읽는 자리는 코드에 여기 단 하나
function lvHas(st,p){ return (st.lvPut >> p) & 1; }
function lvIn(st,w){ return [0,1,2].filter(p=>lvHas(st,p) && lvWayOf(p)===w); }
function lvDone(st){ return [0,1,2].filter(p=>lvHas(st,p)).length; }
function lvMeet(st){ return lvDone(st) === LV_N; }   // ⭐ 두 갈래가 다 차야 모인다 — 이 한 줄이 정한다
function lvLit(st){ return 2 + (lvDone(st)>=1?1:0) + (lvMeet(st)?1:0) + (st.lvRead!=null?1:0); }

function lvWayBox(st,w){
  const inw = lvIn(st,w);
  const slots = inw.length
    ? inw.map(p=>`<div class="lv-slot" data-slot="${w}${p}">${LV_PLAN_S[p]}</div>`).join('')
    : `<div class="lv-slot empty">아직 비었어요</div>`;
  return `<div class="lv-way" data-way="${w}" data-n="${inw.length}">
    <div class="wn">${LV_WAY[w]}</div><div class="note" style="font-size:.78em">${LV_WAY_D[w]}</div>${slots}</div>`;
}

function lvPanel(st){
  const steps = `<div class="lv-steps" data-lit="${lvLit(st)}">${LV_STEP.map((s,i)=>
    `<div class="lv-step ${i<lvLit(st)?'lit':''}" data-step="${i}">${s}</div>`).join('')}</div>`;

  // ⭐ 방안 칸은 어느 시점에도 셋 그대로다 — 실려도 사라지지 않는다.
  const plans = LV_PLAN_S.map((w,p)=>{
    if(lvHas(st,p)) return `<div class="lv-plan full" data-plan="${p}">${w}<span class="pn">실었어요</span></div>`;
    if(st.lvPlan===p) return `<button class="lv-plan now" data-plan="${p}" onclick="lvPick(${p})">${w}<span class="pn">고르는 중</span></button>`;
    return `<button class="lv-plan" data-plan="${p}" onclick="lvPick(${p})">${w}<span class="pn">고르기</span></button>`;
  }).join('');

  const fork = `<div class="lv-fork">${[0,1].map(w=>lvWayBox(st,w)).join('')}</div>`;

  // ⭐ 모임 자리를 그리는 자리는 코드에 여기 단 하나
  const meet = lvMeet(st) ? `<div class="lv-meet" data-meet="1">${LV_ACT[0]}<br>${LV_ACT[1]}<br>${LV_MEET_MSG}</div>` : '';

  let ask = '';
  if(!lvMeet(st)){
    if(st.lvPlan==null){
      ask = `<div class="lv-card"><b>위에서 <span style="color:#4F46E5">해결 방안</span>을 하나 골라 봐요.</b>
        <div class="note" style="text-align:left;margin-top:5px">고른 방안을 <b>어느 방법으로 정하면 좋을지</b> 골라요.</div></div>`;
    } else {
      const p = st.lvPlan;
      ask = `<div class="lv-card" data-ask="${p}"><b><span style="color:#4F46E5">${LV_PLAN[p]}</span> — 어떤 방법으로 정하면 좋을까요?</b>
        <div class="lv-opts">${LV_WAY.map((w,k)=>`<button class="lv-opt" onclick="lvPut(${k})">${w} — ${LV_WAY_D[k]}</button>`).join('')}</div></div>`;
    }
  } else if(st.lvRead==null){
    ask = `<div class="lv-card"><b>갈렸던 두 갈래가 <span style="color:#4F46E5">다시 한 자리로 모인 까닭</span>은 무엇일까요?</b>
      <div class="lv-opts">${LV_READQ.map((s,i)=>`<button class="lv-opt" onclick="lvRead(${i})">${s}</button>`).join('')}</div></div>`;
  } else if(st.lvFin==null){
    ask = `<div class="lv-card"><b>학교에 해결하고 싶은 일이 있을 때 <span style="color:#4F46E5">가장 먼저 할 일</span>은 무엇일까요?</b>
      <div class="lv-opts">${LV_FINQ.map((s,i)=>`<button class="lv-opt" onclick="lvFin(${i})">${s}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="lv-card" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">다섯 걸음을 모두 밟았어요.</b> 정하는 <b>방법은 둘로 갈렸지만</b> 세 방안 가운데
      <b>버려진 것은 하나도 없었고</b>, 실천하고 결과를 확인하는 일은 <b>한 자리에서 함께</b> 했어요.
      <div class="note" style="text-align:left;margin-top:5px">※ <b>우리 학교</b>에서 해결하고 싶은 일은 <b>교실에서 직접</b> 찾아 해결해 봐요.</div></div>`;
  }

  const note = lvDone(st)>0
    ? `<div class="lv-note ${lvDone(st)===LV_N?'big':''}">${LV_NOTE[lvDone(st)]}</div>` : '';

  const warn = st.lvMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.lvMsg}</div>` : '';

  return `<div class="lv-wrap">
    ${steps}
    <div class="lv-prob">${LV_PROB}</div>
    <div class="lv-plans">${plans}</div>
    ${fork}${meet}${note}${ask}${warn}
    <div class="note" style="margin-top:8px">※ 판의 놀이터는 <b>교과서에 실린 사례</b>를 옮긴 자리예요. 우리 학교에서 실제로 있었던 일이 아니에요.</div>
  </div>`;
}

  <div class="ka-grp"><div class="scene-row">${sceneCard('meet','함께 바꾼 우리 놀이터')}</div>
  <div class="note">끝이 아니라 <b>다시 살펴보는 자리</b>예요.</div></div>`});
// 6 살펴보기 — [할 수 있어요] 우리 학교의 일 (reveal)
slides.push({stage:2,badge:"개념",reveal:true,render:(st)=>`

  <h2 class="ka-t">우리 학교의 일도 이렇게 해결해요</h2>
  <div class="ka-bub">우리 학교에서 <b>해결하고 싶은 일</b>을 각자 찾아보고, 모둠 친구들과 하나를 골라 <b>여러 해결 방안</b>을 써 봐요. 그다음 <b>민주적인 방법</b>으로 방안을 정하고, 실천한 뒤 결과를 확인해요.</div>
  <div class="ka-grp"><div class="scene-row">${sceneCard('ours','우리 학교의 일')}</div>
  ${st.revealed?`<div class="answer-box"><b>화장실 출입문 다시 달기</b> — 방안으로 <b>커튼 형태의 가림막</b>과 <b>자동문</b>이 나왔어요. 회의를 통해 장단점을 토의해 보니 커튼은 답답하고 쉽게 더러워질 수 있고, 자동문은 설치하는 데 비용이 많이 들어 모든 화장실에 설치하기 어려웠어요. 그래서 <b>비용도 저렴하고 오염에도 강한 발 형태의 가림막</b>을 설치하기로 했지요. 우리의 노력으로 학교가 더 좋아진 것 같아 <b>뿌듯했어요.</b> ※ 우리 학교의 일은 <b>교실에서 직접</b> 찾아 해결해 봐요.</div>`
    :`<div class="note">모둠이 정한 방안은 어떻게 실천할까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});

slides.push({stage:2,badge:"개념",reveal:true,render:(st)=>`

  <div class="ka-grp"><div class="scene-row">${sceneCard('name','학생이 시작한 일')}</div>
  ${st.revealed?`<div class="answer-box">이런 문제를 알고 있던 한 학생이 학생 자치회 <b>임원 선거</b>에 출마하며 학교 이름을 바꾸겠다는 <b>공약</b>을 내세웠어요. 그 학생이 당선되면서 활동이 시작됐지요. 학생들은 학부모와 졸업생, 지역 주민에게 <b>도움을 요청하는 편지</b>를 보내고 <b>서명 운동</b>을 벌였어요. 그 노력으로 <b>교명 변경 추진 위원회</b>가 만들어졌고, <b>민주적인 절차</b>를 거쳐 학교 이름이 바뀌었어요.</div>`
    :`<div class="note">학생들은 어떻게 학교 이름을 바꿀 수 있었을까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 것을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','다섯 걸음을 밟았어요')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>학교에서 일어나는 일은 <b style="color:#4F46E5">학교 구성원이 참여하여 민주적인 방법으로</b> 해결하는 것이 바람직해요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>학교에서 민주주의를 실천하는 과정 — <b>해결하고 싶은 일 확인하기</b> → <b>해결 방안 탐색하기</b> → <b>민주적인 방법으로 해결 방안 결정하기</b> → <b>해결 방안 실천하기</b> → <b>실천 결과 확인하기</b></div></div>
    <div class="sum-item"><span class="n">3</span><div>정하는 <b>방법은 갈릴 수 있지만</b> 실천하고 결과를 확인하는 일은 <b>함께</b> 해요. ※ 우리 학교의 일은 <b>교실에서 직접</b> 찾아 해결해 봐요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:#4F46E5">학교생활 속 민주주의</b>에서 공부한 내용을 정리할 거예요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"학교의 일을 민주적으로 해결하는 다섯 걸음을 말할 수 있어요",st)}
    ${selfCheck(1,"해결 방안을 탐색할 때 고려할 점을 알아요",st)}
    ${selfCheck(2,"우리 학교에서 해결하고 싶은 일을 찾아볼 수 있어요",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">다섯 걸음을 모두 밟았어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">갈렸던 두 갈래도 <b style="color:#4F46E5">다시 만나요.</b></div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_2_social_u1_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  lvPut:0, lvPlan:null, lvRead:null, lvFin:null, lvMsg:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function lvDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 방안 고르기 — 방안 순서 자유 · 고르기에 점수 0 */
function lvPick(p){
  if(state.lvFin!=null) return;                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(p) || p<0 || p>=LV_N) return;                   // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(lvHas(state,p)){ state.lvMsg = LV_FULL_MSG; playThud(); lvDraw(); return; }           // 가드④: 이미 실은 방안 — 판 불변
  state.lvPlan = p; state.lvMsg = ""; playBlip(); lvDraw();
}
/* 갈래에 싣기 — 어느 갈래인지는 방안이 정한다 */
function lvPut(k){
  if(state.lvFin!=null) return;                                        // 가드①
  if(!Number.isInteger(k) || k<0 || k>=LV_WAY.length) return;          // 가드②
  if(state.lvPlan==null){ state.lvMsg = LV_ORDER_P; playThud(); lvDraw(); return; }        // 가드③: 방안을 고르기 전 — 판 불변
  const p = state.lvPlan;
  if(lvHas(state,p)){ state.lvMsg = LV_FULL_MSG; playThud(); lvDraw(); return; }           // 가드④
  if(lvWayOf(p)!==k){ state.lvMsg = LV_WRONG; playThud(); lvDraw(); return; }              // 가드⑤: 어긋난 갈래 — 판 불변
  state.lvPut |= (1 << p);                                             // ⭐ 판에 싣는 자리는 여기 단 하나
  state.lvPlan = null;
  state.lvMsg = LV_OKMSG; playBlip(); lvDraw();
}
/* 판 읽기 */
function lvRead(i){
  if(state.lvFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=LV_READQ.length) return;        // 가드②
  if(!lvMeet(state)){ state.lvMsg = LV_ORDER_R; playThud(); lvDraw(); return; }            // 가드⑥: 세 방안을 다 싣기 전 — 판 불변
  if(state.lvRead!=null){ state.lvMsg = LV_DONE_MSG; lvDraw(); return; }                   // 가드⑧: 이미 정한 자리 — 판 불변
  if(i!==LV_READ_OK){ state.lvMsg = LV_READ_NO; playThud(); lvDraw(); return; }            // 가드⑤: 어긋난 답 — 판 불변
  state.lvRead = i; state.lvMsg = ""; playBlip(); lvDraw();
}
/* 마무리 */
function lvFin(i){
  if(state.lvFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=LV_FINQ.length) return;         // 가드②
  if(state.lvRead==null){ state.lvMsg = LV_ORDER_F; playThud(); lvDraw(); return; }        // 가드⑦: 판을 읽기 전 — 판 불변
  if(i!==LV_FIN_OK){ state.lvMsg = LV_FIN_NO; playThud(); lvDraw(); return; }              // 가드⑤: 어긋난 답 — 판 불변
  state.lvFin = i; state.lvMsg = ""; playChime(); lvDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l05 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

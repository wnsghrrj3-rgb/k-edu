1단원 색 #4F46E5 (중학년 ka- 엔진 승계 · 변수명 유지 · 엔진 무수정)

직접조작: 두 가지가 함께 자라는 판 — 한 장을 올리면 두 가지에 서는 형
  ⭐ 앞 여섯 차시에서 학생이 놓은 것은 언제나 놓은 그 자리에만 섰다(l03에서 여러 줄에 선 이름도
     같은 글자였다). 이번 판은 카드 한 장을 올리면 두 가지에 선다 — 다른 가지의 같은 층에
     「반대로 달라진 모습」이 함께 선다. 학생이 누르지 않은 칸이 판에 서는 첫 판이다.
  ⭐ 가지는 아래에서 위로 자란다 — 받쳐 줄 아래 층이 서 있어야 올라간다(brCanRise 한 줄).
     맨 아래 층은 주민 참여, 그 위는 문제 해결, 맨 위는 지역의 발전이다.
  ⭐ 어느 가지의 카드로 올려도 판의 글자는 같다 — 달라지는 것은 「내가 올린 칸 / 함께 선 칸」 표시뿐(8경로).
  ⭐ 함께 선 칸은 상태에 없다 — 층마다 올린 가지 하나(brRise)와 선 층의 수만으로 두 가지를 다 그린다.
  ⭐ 카드가 어느 가지·어느 층인지는 BR_WING·BR_STORY 두 줄이 정한다(brWingOf·brStoryOf 단 하나씩).
  ⭐ state.brRise[…] = … 가 코드에 단 하나 · 덜어 내는 자리 0 · 짝·높이 전용 상태 0.

지도서 근거: [학습 목표] 주민 참여가 중요한 까닭을 설명할 수 있다 /
  [본문] 지역에는 주민들이 관심을 갖고 참여해야 할 여러 가지 일이 있다 · 지역에서 일어나는 일들은
  지역 주민들의 생활에 많은 영향을 미친다 /
  [동기 유발] 우리 지역을 예쁘게 꾸미는 일 · 주민들이 편하게 쉴 수 있는 쉼터를 만드는 일 /
  [교과서 33쪽] 혼자 생활하는 노인 · 아이를 키우는 가정 · 돌봄 로봇 · 함께 보살펴요 ·
  [스스로 활동] 예시 답안 = 돌봄 로봇을 지원하고 아이들을 함께 보살폈다 · 건강과 안전 · 아이를 키우기 좋은 지역 /
  [교과서 34쪽 본문] 지역 주민이 지역을 잘 알기 때문에 주민이 직접 참여하는 것이 중요 · 주민 참여가 활발하게
  이루어지면 지역의 일을 민주적으로 해결할 수 있고 더 살기 좋은 지역으로 발전할 수 있다 /
  [미디어 활동] 누리집 게시글 「온 지역이 학교가 되는 교육 공동체」 — '온 마을이 학교다' · '친구야 소풍 가자' ·
  '세대 공감 이야기가 있는 우리 마을 지도 만들기' · 예시 답안 = 세대가 소통 · 주민과 지역이 함께 성장 /
  [주민 참여가 중요한 까닭 파악하기] 활발하지 않으면 = 지역에서 일어나는 문제를 해결하기 어려워진다 ·
  지역이 더 나은 모습으로 발전하기 어려워진다 / 활발하면 = 불편한 문제를 주민들이 직접 해결할 수 있다 ·
  주민들이 원하는 방향으로 지역이 달라질 수 있다 /
  [별별 직업] 관광 두레 · 관광 두레 프로듀서 / [차시 예고] 주민 참여의 방법

정직 원칙: ㉠ 가지의 칸은 주민 참여가 활발할 때와 그렇지 않을 때를 생각해 본 모습이다 — 우리 지역에서
     실제로 일어난 일을 잰 것이 아니다(캡션 상시 노출).
  ㉡ 게시글의 ○○ 주민 자치회는 이름을 옮기지 않은 자리 — 실제 지역 이름·누리집 이름 0.
  ㉢ '온 마을이 학교다' 게시글에서 활동에 밑줄 긋기는 교과서에 직접(정리 명시).
  ㉣ [별별 직업]은 교과서 원문까지만 — 사업 시작 연도·실제 지역·인터뷰 동영상 0.

/* ===== 직접 조작: 두 가지가 함께 자라는 판 =====
   ⭐ 카드 한 장을 올리면 두 가지에 선다 — 다른 가지의 같은 층에 반대로 달라진 모습이 함께 선다.
   ⭐ 가지는 아래에서 위로 자란다 — 받쳐 줄 아래 층이 서 있어야 올라간다(brCanRise 한 줄).
   ⭐ 어느 가지의 카드로 올려도 판의 글자는 같다 — 달라지는 것은 「내가 올린 칸 / 함께 선 칸」 표시뿐.
   ⭐ 함께 선 칸은 상태에 없다 — 층마다 올린 가지 하나(brRise)와 선 층의 수만으로 두 가지를 다 그린다.
   ⭐ 카드의 가지·층은 BR_WING·BR_STORY 두 줄이 정한다(brWingOf·brStoryOf 단 하나씩).
*/
const BR_H = 3;                                   // 층 셋(아래에서 위로)
const BR_C = 6;                                   // 카드 여섯(가지 둘 × 층 셋)
// 지도서 9차시 발문 답 원문 — 주민 참여가 활발할 때와 그렇지 않을 때
const BR_TEXT = [
  "지역에서 발생하는 불편한 문제를 주민들이 직접 해결할 수 있어요",
  "지역이 더 나은 모습으로 발전하기 어려워져요",
  "주민들이 지역의 일에 관심을 갖고 적극적으로 참여해요",
  "지역에서 일어나는 문제를 해결하기 어려워져요",
  "주민들이 원하는 방향으로 지역이 달라질 수 있어요",
  "주민 참여가 활발하게 이루어지지 않아요"];
const BR_TAG = ["문제를 직접 해결","발전하기 어려움","관심을 갖고 참여","문제 해결이 어려움","원하는 방향으로 달라짐","참여가 활발하지 않음"];
// ⭐ 카드의 가지를 정하는 한 줄 — 0 주민 참여가 활발하지 않을 때 · 1 주민 참여가 활발할 때
const BR_WING = [1,0,1,0,1,0];
// ⭐ 카드의 층을 정하는 한 줄 — 0 맨 아래(주민 참여) · 1 문제 해결 · 2 지역의 발전
const BR_STORY = [1,2,0,1,2,0];
const BR_TITLE = ["주민 참여가 활발하지 않을 때","주민 참여가 활발할 때"];
const BR_NOTE = [
  "아직 가지에 선 칸이 없어요.",
  "첫 층이 섰어요.",
  "두 층이 섰어요.",
  "세 층이 모두 섰어요. 두 가지를 <b>나란히</b> 읽어 봐요."];
const BR_STOOD_MSG = "이미 가지에 서 있는 칸이에요. 판은 그대로예요.";
const BR_LOW_MSG = "아직 이 카드를 받쳐 줄 아래 칸이 서 있지 않아요.";
const BR_ORDER_R = "먼저 세 층을 모두 세워 봐요.";
const BR_ORDER_F = "먼저 판을 읽어 봐요.";
const BR_DONE_MSG = "이미 정한 자리예요. 판은 그대로예요.";
// 판 읽기 3택 — 조작 직결
const BR_READQ = [
  "주민이 참여할 때와 참여하지 않을 때, 같은 층의 지역 모습이 <b>서로 반대로</b> 달라져요",
  "두 가지는 서로 같은 이야기를 하고 있어요",
  "주민이 참여하든 참여하지 않든 지역의 모습은 같아요"];
const BR_READ_OK = 0;
const BR_READ_NO = "두 가지의 같은 층을 나란히 놓고 다시 읽어 봐요.";
// 마무리 3택 — 교과서 34쪽 본문 원문
const BR_FINQ = [
  "주민 참여는 지역의 일이 다 끝난 뒤에 해도 되기 때문이에요",
  "지역의 일은 주민과 상관없이 저절로 달라지기 때문이에요",
  "주민 참여가 활발하게 이루어지면 지역의 일을 <b>민주적으로 해결</b>할 수 있고, 더 살기 좋은 지역으로 발전할 수 있기 때문이에요"];
const BR_FIN_OK = 2;
const BR_FIN_NO = "맨 아래 층부터 위로 차례차례 다시 읽어 봐요.";

function brWingOf(c){ return BR_WING[c]; }                                  // ⭐ BR_WING 을 읽는 자리는 코드에 여기 단 하나
function brStoryOf(c){ return BR_STORY[c]; }                                // ⭐ BR_STORY 를 읽는 자리는 코드에 여기 단 하나
function brHeight(st){ return st.brRise.filter(x=>x!==-1).length; }         // ⭐ 선 층의 수 — 이것만으로 두 가지를 다 그린다
function brCanRise(st,c){ return brStoryOf(c) === brHeight(st); }          // ⭐ 받쳐 줄 아래 층이 서 있어야 올라간다 — 이 한 줄이 정한다
function brStood(st,c){ return brStoryOf(c) < brHeight(st); }               // ⭐ 층이 서면 그 층의 두 카드가 함께 선다 — 이 한 줄이 정한다
function brCardAt(w,s){ for(let c=0;c<BR_C;c++){ if(brWingOf(c)===w && brStoryOf(c)===s) return c; } return -1; }

function brCell(st,w,s){
  const c = brCardAt(w,s);
  if(!brStood(st,c)) return `<div class="br-cell" data-cell="${w}${s}" data-up="0"><span class="br-q">?</span></div>`;
  const mine = st.brRise[s]===w;
  // ⭐ 칸을 그리는 자리 — 학생이 누르지 않은 가지의 칸도 층이 섰으면 선다
  return `<div class="br-cell" data-cell="${w}${s}" data-up="${mine?1:2}" data-wing="${w}">${BR_TEXT[c]}<span class="br-mk">${mine?'내가 올린 칸':'함께 선 칸'}</span></div>`;
}

function brPool(st){
  let h = '';
  for(let c=0;c<BR_C;c++){
    const on = brStood(st,c);
    h += `<button class="br-card" data-card="${c}" data-stood="${on?1:0}" onclick="brPut(${c})">${BR_TAG[c]}${on?'<span class="br-mk">섰어요</span>':''}</button>`;
  }
  return `<div class="br-pool">${h}</div>`;
}

function brPanel(st){
  const ht = brHeight(st);
  let cols = '';
  for(let w=0;w<2;w++){
    let cells = '';
    for(let s=BR_H-1;s>=0;s--) cells += brCell(st,w,s);
    cols += `<div class="br-col" data-col="${w}"><div class="br-head">${BR_TITLE[w]}</div>${cells}</div>`;
  }
  // ⭐ 판은 층마다 올린 가지와 선 층의 수만으로 그린다 — 함께 선 칸을 담는 자리가 없다.
  const tree = `<div class="br-tree" data-height="${ht}">${cols}<div class="br-root">우리 지역의 일</div></div>`;

  let ask = '';
  if(st.brRead==null){
    if(ht<BR_H){
      ask = `<div class="br-ask"><b>카드를 눌러 가지를 세워 봐요.</b>
        <div class="note" style="text-align:left;margin-top:5px">카드를 누르면 <b>제 가지의 제 층</b>으로 올라가요. 가지는 <b>아래에서 위로</b> 자라요. 어느 가지의 카드부터 올려도 괜찮아요.</div></div>`;
    } else {
      ask = `<div class="br-ask"><b>한쪽 가지에 올릴 때마다 <span style="color:#4F46E5">다른 가지의 같은 층</span>에도 칸이 섰어요. 두 가지를 나란히 보면 무엇을 알 수 있을까요?</b>
        <div class="br-opts">${BR_READQ.map((s,i)=>`<button class="br-opt" onclick="brRead(${i})">${s}</button>`).join('')}</div></div>`;
    }
  } else if(st.brFin==null){
    ask = `<div class="br-ask"><b>맨 아래 층이 서기 전에는 위층 카드가 올라가지 않았어요. 이 판으로 알 수 있는 <span style="color:#4F46E5">주민 참여가 중요한 까닭</span>은 무엇일까요?</b>
      <div class="br-opts">${BR_FINQ.map((s,i)=>`<button class="br-opt" onclick="brFin(${i})">${s}</button>`).join('')}</div></div>`;
  } else {

  <div class="answer-box">관광 두레 프로듀서는 지역 주민이 관광 사업을 <b>계획</b>할 수 있도록 도와주고, 주민들이 함께 사업을 꾸려 갈 수 있도록 서로 <b>연결</b>해 주는 일을 해요. 색다른 지역 관광 상품을 개발하여 주민들에게 <b>제안</b>하기도 해요.</div>
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 것을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','주민 참여가 중요해요')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>지역에서 일어나는 일들은 지역 주민들의 <b>생활</b>에 많은 영향을 미치기 때문에 주민 참여가 중요해요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>지역 주민이 지역을 <b>잘 알기</b> 때문에 지역의 일에 주민이 직접 참여하는 것이 중요해요.</div></div>
    <div class="sum-item"><span class="n">3</span><div>주민 참여가 활발하게 이루어지면 지역의 일을 <b style="color:#4F46E5">민주적으로 해결</b>할 수 있고, 더 살기 좋은 지역으로 발전할 수 있어요.</div></div>
    <div class="sum-item"><span class="n">4</span><div>※ '온 마을이 학교다' 게시글에서 참여할 수 있는 활동에 <b>밑줄 긋기</b>는 교과서에 <b>직접</b> 해 봐요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:#4F46E5">주민 참여의 방법</b>을 알아볼 거예요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"주민 참여로 주민들의 생활이 어떻게 달라지는지 말할 수 있어요",st)}
    ${selfCheck(1,"주민 참여가 중요한 까닭을 설명할 수 있어요",st)}
    ${selfCheck(2,"우리 지역의 일에 참여하려는 마음이 생겼어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">주민 참여가 중요한 까닭을 알아봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">맨 아래 <b style="color:#4F46E5">주민 참여</b>가 서야 그 위에 <b style="color:#16A34A">문제 해결과 지역의 발전</b>이 설 수 있어요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_2_social_u1_l07";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  brRise:[-1,-1,-1], brRead:null, brFin:null, brMsg:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function brDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 카드 올리기 — 가지 차례 자유 · 층 차례는 아래에서 위로 · 올리기에 점수 0 */
function brPut(c){
  if(state.brFin!=null) return;                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(c) || c<0 || c>=BR_C) return;                   // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(brStood(state,c)){ state.brMsg = BR_STOOD_MSG; playThud(); brDraw(); return; }        // 가드③: 이미 선 카드(내가 올린 칸·함께 선 칸) — 판 불변
  if(!brCanRise(state,c)){ state.brMsg = BR_LOW_MSG; playThud(); brDraw(); return; }       // 가드④: 받쳐 줄 아래 층이 없음 — 판 불변
  state.brRise[brStoryOf(c)] = brWingOf(c);                            // ⭐ 가지를 세우는 자리는 여기 단 하나
  state.brMsg = ""; playBlip(); brDraw();
}
/* 판 읽기 */
function brRead(i){
  if(state.brFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=BR_READQ.length) return;        // 가드②
  if(state.brRead!=null){ state.brMsg = BR_DONE_MSG; brDraw(); return; }                    // 가드⑧: 이미 정한 자리 — 판 불변
  if(brHeight(state)!==BR_H){ state.brMsg = BR_ORDER_R; playThud(); brDraw(); return; }     // 가드⑤: 세 층이 서기 전 — 판 불변
  if(i!==BR_READ_OK){ state.brMsg = BR_READ_NO; playThud(); brDraw(); return; }             // 가드⑦: 어긋난 답 — 판 불변
  state.brRead = i; state.brMsg = ""; playBlip(); brDraw();
}
/* 마무리 */
function brFin(i){
  if(state.brFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=BR_FINQ.length) return;         // 가드②
  if(state.brRead==null){ state.brMsg = BR_ORDER_F; playThud(); brDraw(); return; }         // 가드⑥: 판을 읽기 전 — 판 불변
  if(i!==BR_FIN_OK){ state.brMsg = BR_FIN_NO; playThud(); brDraw(); return; }               // 가드⑦: 어긋난 답 — 판 불변
  state.brFin = i; state.brMsg = ""; playChime(); brDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l08 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

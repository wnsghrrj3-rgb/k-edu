<!DOCTYPE html>
<!--
=========================================================================
  사회 4-2 · 3단원 다양한 환경과 삶의 모습
  주제② 도시의 특징과 생활 모습 · l08
  「도시의 특징을 알아볼까요」
  교과서 p.131~135 · 지도서 10~11차시(p.249~257) · [4사10-02]
  수업 기법 = 사례를 통해 특징 파악하기 · 지도 애플리케이션 활용하기
=========================================================================

  ■ 직접조작 = 창을 옮겨야 보이는 판 (지도 애플리케이션처럼 한 도시를 창으로 살펴보기)
  ⭐ 앞 서른 판은 판 전체를 한눈에 보여 주었다. 이번 판은 판의 한 부분(가로 둘 × 세로 둘)만 창으로 보여 준다 —
     학생은 창을 위·아래·왼쪽·오른쪽으로 옮기고, 창 안에 든 곳을 골라 그곳이 인구·산업·교통 가운데 어떤 특징을 보여 주는지 고른다.
  ⭐ 창의 자리를 담는 상태가 없다 — 옮긴 방향 기록 mvLog 한 줄만 있고, mvPath 한 줄이 기록을 걸어 창이 지나간 자리를 정한다.
     「살펴본 곳」도 상태가 없다 — mvSeen 한 줄이 지나간 자리에서 센다. 그래서 한 번 본 곳이 다시 물음표로 가려지는 일은 만들어질 수 없다.
  ⭐ 처음 창(왼쪽 위)에는 산업의 모습이 하나도 없다 — 창을 옮기지 않고는 도시의 특징을 모두 찾을 수 없다.
  ⭐ 방향을 적는 자리 state.mvLog.push 하나 · 특징을 적는 자리 state.mvTag.push 하나 · 지우는 자리 0 · 정답 칸 차례 상수 0.
     근거 = 교과서 131쪽(인구) · 132쪽(전주시 산업) · 133쪽(부산광역시 교통) · 134쪽(지도 애플리케이션: 확대·이동하며 여러 곳 살펴보기).

  ■ 4단계
   ① 창 옮기기 + 곳 고르기 → 특징 고르기(열두 곳 · 차례 자유) → 모든 곳의 특징을 찾을 때까지
   ② 판 읽기 3택(정답 자리 0 = 「창을 옮겨 여러 곳을 살펴봐야…」)
   ③ 마무리 3택(정답 자리 2 = 교과서 정리: 인구·산업·교통) → 완료 — 실제 지도 애플리케이션 활동은 교실 몫

  ■ 가드 13종
   ① 마무리 확정 후 다섯 처리기 전체 잠금      ② 무효 번호(Number.isInteger·범위)
   ③ 모든 곳을 찾은 뒤 옮기기·고르기 — 판 불변 ④ 판 끝으로 옮기기 — 판 불변
   ⑤ 창 밖의 곳 고르기 — 판 불변              ⑥ 이미 찾은 곳 고르기 — 판 불변
   ⑦ 고른 곳을 다시 누르면 고르기만 풀림       ⑧ 곳을 고르기 전 특징 고르기 — 판 불변
   ⑨ 어긋난 특징 — 고르기 유지 · 판 불변      ⑩ 다 찾기 전 판 읽기 — 판 불변
   ⑪ 이미 읽은 자리 다시 읽기 — 판 불변       ⑫ 판 읽기 어긋난 답 — 판 불변
   ⑬ 판을 읽기 전 마무리 — 판 불변            ⑭ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 판의 도시는 판이 새로 그린 도시 — 교과서의 전주시·부산광역시를 옮긴 것이 아니다(캡션 상시).
   ㉡ 실제 지도 애플리케이션은 판보다 훨씬 넓게 확대·이동할 수 있다 — 실제 도시 살펴보기는 교실 몫.
   ㉢ 사진 그림은 판이 새로 그린 도식이다(교과서 사진이 아님).

  ■ 설계 원칙
   · 12차시 침범 0(생활 모습은 차시 예고 한 자리) · 13차시 좋은 점·문제점 0 · 촌락 0
   · 교사용 참고 자료 0(사진 해설 장소 이름 · 인구 분포 표 · 산업 단지 유형 · 도시가 발달하기 좋은 조건)
   · 실제 지역 이름은 교과서 원문 사례(전주시·부산광역시) 안 · 지도서 예시 답의 도시(강릉·대전·군산) 0 · 연도 0 · 인구 수치는 「10명 중 9명 정도」만
-->

<title>도시의 특징을 알아볼까요 · 사회 4-2</title>
<meta name="kedu-lesson-id" content="g4_social_u3_l08_v1">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#0891B2; --green-d:#0E7490; --cyan:#0D9488;
  --bg:#ECFEFF; --bub:#CFFAFE; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#CFFAFE;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#CFFAFE;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(8,145,178,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}


/* 조작 판 — 창을 옮겨야 보이는 판 (지도 애플리케이션처럼 한 도시를 창으로 살펴보기) */
.mv-wrap{max-width:800px;width:100%;margin:0 auto}
.mv-head{background:#CFFAFE;color:#155E75;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.mv-play{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;align-items:start}
.mv-board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px;border-radius:14px;background:#DCFCE7;border:2px solid #86EFAC}
.mv-cell{border:2px solid #CBD5E1;border-radius:10px;min-height:66px;background:#94A3B8;color:#F8FAFC;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:4px 3px;font-family:inherit;cursor:pointer;text-align:center;word-break:keep-all;line-height:1.25}
.mv-cell b{font-size:clamp(11px,1.8vw,14px)}
.mv-cell[data-look="1"]{background:#F1F5F9;color:#94A3B8;border-color:#E2E8F0}
.mv-cell[data-look="2"]{background:#fff;color:#0F172A;border-color:#0891B2;box-shadow:0 0 0 2px #67E8F9}
.mv-cell[data-sel="1"]{outline:3px solid #F59E0B;border-color:#F59E0B}
.mv-kind{font-size:clamp(10px,1.5vw,12px);font-weight:800;border-radius:6px;padding:1px 5px;white-space:nowrap;color:#fff}
.mv-kind[data-f="0"],.mv-kbtn[data-f="0"]{background:#0891B2}
.mv-kind[data-f="1"],.mv-kbtn[data-f="1"]{background:#B45309}
.mv-kind[data-f="2"],.mv-kbtn[data-f="2"]{background:#6D28D9}
.mv-side{display:flex;flex-direction:column;gap:8px}
.mv-pad{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mv-go{background:#fff;border:2px solid #0891B2;color:#0E7490;border-radius:10px;padding:8px 4px;font-family:inherit;font-weight:800;
  font-size:clamp(12px,2vw,15px);cursor:pointer}
.mv-go[data-can="0"]{border-color:#E2E8F0;color:#CBD5E1}
.mv-tally{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border:2px solid var(--line);border-radius:11px;padding:7px 8px;background:#fff;
  font-size:clamp(12px,2vw,15px)}
.mv-tally span{white-space:nowrap}
.mv-tell{border-radius:12px;padding:9px 13px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;background:#F0FDFA;border-left:4px solid var(--cyan);word-break:keep-all}
.mv-ask{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#F8FEFF;margin-top:9px;font-size:clamp(13px,2.2vw,16px);line-height:1.6}
.mv-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.mv-kbtn{border:none;border-radius:11px;padding:10px 6px;font-family:inherit;font-weight:800;font-size:clamp(14px,2.3vw,17px);color:#fff;cursor:pointer}
.mv-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.mv-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;
  font-size:clamp(13px,2.2vw,16px);cursor:pointer;text-align:left;line-height:1.5;word-break:keep-all}
.mv-opt:hover{border-color:var(--green);background:var(--bub)}
@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
  .mv-play{grid-template-columns:1fr}
  .mv-cell{min-height:58px}
}
</style>

</head>
<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="goHub()">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>
      <span>차시 목록</span>
    </button>
    <div class="ka-bar"><div id="bar"></div></div>
    <div class="ka-pg" id="pg">1 / 18</div>
    <div class="ka-sc">
      <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#F57F17"/></svg>
      <span class="ka-sc-n" id="score">0</span><span class="ka-sc-u">점</span>
    </div>
  </div>

  <div class="ka-m" id="main"></div>

  <div class="ka-f">
    <button class="ka-nav ka-nav-prev" id="prev" onclick="prev()">← 이전</button>
    <button class="ka-nav mob-hide" id="listen" disabled title="음성은 준비 중이에요">
      <svg viewBox="0 0 16 16"><path d="M 3 6 L 3 10 L 6 10 L 10 13 L 10 3 L 6 6 Z" fill="currentColor"/><path d="M 12 5 Q 14 8 12 11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      다시 듣기
    </button>
    <button class="ka-nav" id="hint" onclick="useHint()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="4" fill="currentColor"/><rect x="6" y="9.5" width="4" height="2.5" fill="currentColor"/><rect x="6.5" y="12.5" width="3" height="1" fill="currentColor"/></svg>

/* ===== 직접 조작: 창을 옮겨야 보이는 판 (지도 애플리케이션처럼 한 도시를 창으로 살펴보기) =====
   ⭐ 창의 자리를 담는 상태가 없다 — 옮긴 방향 기록 mvLog 한 줄만 있고, 창이 지나간 자리는 mvPath 한 줄이 기록을 걸어 정한다.
   ⭐ 「살펴본 곳」을 담는 상태도 없다 — mvSeen 한 줄이 지나간 자리에서 곧바로 센다. 그래서 한 번 본 곳이 다시 가려지는 일은 만들어질 수 없다.
   ⭐ 처음 창에는 산업의 모습이 하나도 없다 — 창을 옮기지 않으면 도시의 특징을 모두 찾을 수 없다.
   ⭐ 방향을 적는 자리 state.mvLog.push 단 하나 · 특징을 적는 자리 state.mvTag.push 단 하나 · 지우는 자리 0. */
const MV_COLS = 4;                                     // 판의 가로 칸
const MV_ROWS = 3;                                     // 판의 세로 칸
const MV_WIN = 2;                                      // 창이 한 번에 보여 주는 가로·세로 칸
const MV_START = [0,0];                                // 처음 창의 자리(왼쪽 위)
const MV_DIR = [{name:"위로",dr:-1,dc:0},{name:"아래로",dr:1,dc:0},{name:"왼쪽으로",dr:0,dc:-1},{name:"오른쪽으로",dr:0,dc:1}];
const MV_KIND = ["인구","산업","교통"];
const MV_PLACE = [
  {name:"아파트",kind:0},{name:"연립 주택",kind:0},{name:"공장",kind:1},{name:"은행",kind:1},
  {name:"사람이 많은 거리",kind:0},{name:"지하철역",kind:2},{name:"대형 할인점",kind:1},{name:"기차역",kind:2},
  {name:"버스 터미널",kind:2},{name:"축제가 열리는 곳",kind:1},{name:"공항",kind:2},{name:"항구",kind:2}
];
const MV_SAY_LOCK = "이미 모든 곳의 특징을 찾았어요. 판은 그대로예요. 판을 읽어 봐요.";
const MV_SAY_EDGE = "그쪽으로는 더 옮길 수 없어요. 판은 그대로예요.";
const MV_SAY_OUT = "창 밖에 있는 곳이에요. 창을 옮겨 가까이 살펴봐요. 판은 그대로예요.";
const MV_SAY_TAGGED = "이미 특징을 찾은 곳이에요. 판은 그대로예요.";
const MV_SAY_UNSEL = "고르기를 풀었어요. 판은 그대로예요.";
const MV_SAY_ORDER_K = "먼저 창 안에서 살펴볼 곳을 골라 봐요.";
const MV_SAY_WRONG = "그곳에서 사람들이 무엇을 하는지 떠올려 봐요. 판은 그대로예요.";
const MV_SAY_ORDER_R = "먼저 모든 곳의 특징을 찾아봐요.";
const MV_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const MV_SAY_ORDER_FIN = "먼저 판을 읽어 봐요.";
const MV_READQ = [
  "창을 옮겨 여러 곳을 살펴봐야 인구, 산업, 교통의 모습을 함께 알 수 있어요",
  "처음 창에 보인 곳만 살펴봐도 도시에 어떤 산업이 발달했는지 알 수 있어요",
  "도시의 특징은 한곳에 모두 모여 있어서 창을 옮길 필요가 없어요"
];
const MV_READ_OK = 0;
const MV_READ_BAD = "처음 창에 보였던 네 곳을 떠올려 봐요.";
const MV_FINQ = [
  "도시에는 사람이 적게 살고, 사람과 물건이 오가기 어려워요",
  "도시에는 물건을 만드는 한 가지 일만 발달했어요",
  "도시에는 많은 사람이 모여 살고, 다양한 산업과 교통이 발달했어요"
];
const MV_FIN_OK = 2;
const MV_FIN_BAD = "판에서 찾은 세 가지 특징을 모두 떠올려 봐요.";

function mvPath(st){ const p=[MV_START]; st.mvLog.forEach(d=>{ const q=p[p.length-1]; p.push([q[0]+MV_DIR[d].dr, q[1]+MV_DIR[d].dc]); }); return p; }   // ⭐ 창의 자리는 방향 기록에서만
function mvAt(st){ const p=mvPath(st); return p[p.length-1]; }
function mvIn(pos,k){ const r=Math.floor(k/MV_COLS), c=k%MV_COLS; return r>=pos[0] && r<pos[0]+MV_WIN && c>=pos[1] && c<pos[1]+MV_WIN; }
function mvSeen(st,k){ return mvPath(st).some(pos=>mvIn(pos,k)); }                  // ⭐ 살펴본 곳은 지나간 자리에서만
function mvCanGo(st,d){ const q=mvAt(st), r=q[0]+MV_DIR[d].dr, c=q[1]+MV_DIR[d].dc; return r>=0 && c>=0 && r<=MV_ROWS-MV_WIN && c<=MV_COLS-MV_WIN; }
function mvNameOf(k){ return MV_PLACE[k].name; }
function mvKindOf(k){ return MV_PLACE[k].kind; }
function mvFound(st,f){ return st.mvTag.filter(k=>mvKindOf(k)===f).length; }
function mvAll(f){ return MV_PLACE.filter(p=>p.kind===f).length; }
function mvDone(st){ return st.mvTag.length===MV_PLACE.length; }
function mvJosa(w){ return (w.charCodeAt(w.length-1)-0xAC00)%28 ? "은" : "는"; }
function mvStage(st){
  if(!mvDone(st)) return "run";
  if(st.mvRead == null) return "read";
  if(st.mvFin == null) return "fin";
  return "end";
}

/* 판 — 열두 곳 */
function mvCell(st,k){
  const on = mvIn(mvAt(st),k), seen = mvSeen(st,k), tag = st.mvTag.includes(k);
  const look = on ? 2 : (seen ? 1 : 0);
  const inner = seen
    ? `<b>${mvNameOf(k)}</b>${tag ? `<span class="mv-kind" data-f="${mvKindOf(k)}">${MV_KIND[mvKindOf(k)]}</span>` : ''}`
    : `<b>?</b>`;
  return `<button class="mv-cell" data-k="${k}" data-look="${look}" data-tag="${tag?1:0}" data-sel="${st.mvSel===k?1:0}" onclick="mvPick(${k})">${inner}</button>`;
}
function mvBoard(st){
  let s=''; for(let k=0;k<MV_PLACE.length;k++) s += mvCell(st,k);
  return `<div class="mv-board">${s}</div>`;
}
function mvPad(st){
  const b = MV_DIR.map((d,i)=>`<button class="mv-go" data-d="${i}" data-can="${mvCanGo(st,i)?1:0}" onclick="mvGo(${i})">${d.name}</button>`).join('');
  return `<div class="mv-pad">${b}</div>`;
}
function mvTally(st){
  return `<div class="mv-tally">${MV_KIND.map((t,f)=>`<span data-f="${f}">${t} <b>${mvFound(st,f)}</b>/${mvAll(f)}</span>`).join('')}</div>`;
}

function mvPanel(st){
  const stage = mvStage(st);
  let ask = '';
  if(stage === "run"){
    ask = `<div class="mv-ask" data-step="run"><b>창 안의 곳을 하나 고르고, 어떤 특징을 보여 주는 곳인지 골라 봐요.</b>
      <div class="mv-kinds">${MV_KIND.map((t,f)=>`<button class="mv-kbtn" data-f="${f}" onclick="mvKind(${f})">${t}</button>`).join('')}</div>
      <div class="note" style="text-align:left;margin-top:5px">창 밖의 곳은 창을 옮겨야 살펴볼 수 있어요. 어느 쪽으로 먼저 옮겨도 괜찮아요.</div></div>`;
  } else if(stage === "read"){
    ask = `<div class="mv-ask" data-step="read"><b>창을 옮기며 판을 살펴보니, 무엇을 알 수 있을까요?</b>
      <div class="mv-opts">${MV_READQ.map((t,i)=>`<button class="mv-opt" onclick="mvRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "fin"){
    ask = `<div class="mv-ask" data-step="fin"><b>그렇다면 도시의 특징은 무엇일까요?</b>
      <div class="mv-opts">${MV_FINQ.map((t,i)=>`<button class="mv-opt" onclick="mvFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="mv-ask" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">도시에는 많은 사람이 모여 살고, 다양한 산업이 발달했으며, 많은 사람과 물건이 빠르고 편리하게 이동할 수 있는 교통이 발달했어요.</b>
      판에서도 창을 여러 번 옮겨 살펴본 뒤에야 세 가지 모습을 모두 찾았지요.
      <div class="note" style="text-align:left;margin-top:5px">※ 지도 애플리케이션으로 실제 도시를 확대하고 이동하며 살펴보는 일은 <b>교실 몫</b>이에요. 판은 실제 도시를 대신 보여 주지 않아요.</div></div>`;
  }
  const seenN = MV_PLACE.filter((_,k)=>mvSeen(st,k)).length;
  const tell = st.mvTell ? `<div class="mv-tell">${st.mvTell}</div>` : '';
  const warn = st.mvMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.mvMsg}</div>` : '';
  return `<div class="mv-wrap">
    <div class="mv-head">살펴본 곳 <b>${seenN}</b>/${MV_PLACE.length} · 창을 옮긴 횟수 <b>${st.mvLog.length}</b></div>
    <div class="mv-play">${mvBoard(st)}<div class="mv-side">${mvPad(st)}${mvTally(st)}${tell}</div></div>${ask}${warn}

function mvMoveTell(st,d,before){                                              // 알림도 지나간 자리에서만
  const now = MV_PLACE.filter((_,k)=>mvSeen(st,k)).length;
  return `창을 ${MV_DIR[d].name} 옮겼어요.` + (now>before ? ` 새로 보인 곳이 ${now-before}곳 있어요.` : ` 새로 보인 곳은 없어요.`);
}
function mvTagTell(k){
  return `${mvNameOf(k)}${mvJosa(mvNameOf(k))} 도시의 ${MV_KIND[mvKindOf(k)]} 모습을 보여 주는 곳이에요.`;
}

    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">교실에서 지도 애플리케이션으로 도시를 <b style="color:#0891B2">직접</b> 살펴봐요.</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_2_social_u3_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  mvLog:[], mvSel:null, mvTag:[], mvRead:null, mvFin:null, mvMsg:"", mvTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function mvDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 창 옮기기 */
function mvGo(d){
  if(state.mvFin!=null) return;                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(d) || d<0 || d>=MV_DIR.length) return;           // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(mvDone(state)){ state.mvMsg = MV_SAY_LOCK; playThud(); mvDraw(); return; }               // 가드③: 다 찾은 뒤 — 판 불변
  if(!mvCanGo(state,d)){ state.mvMsg = MV_SAY_EDGE; playThud(); mvDraw(); return; }           // 가드④: 판 끝 — 판 불변
  const before = MV_PLACE.filter((_,k)=>mvSeen(state,k)).length;
  state.mvLog.push(d);                                                 // ⭐ 방향을 적는 자리는 코드에 여기 단 하나 · 지우는 자리 0
  state.mvSel = null; state.mvMsg = ""; state.mvTell = mvMoveTell(state,d,before); playBlip(); mvDraw();
}
/* 곳 고르기 */
function mvPick(k){
  if(state.mvFin!=null) return;                                        // 가드①
  if(!Number.isInteger(k) || k<0 || k>=MV_PLACE.length) return;         // 가드②
  if(mvDone(state)){ state.mvMsg = MV_SAY_LOCK; playThud(); mvDraw(); return; }               // 가드③
  if(!mvIn(mvAt(state),k)){ state.mvMsg = MV_SAY_OUT; playThud(); mvDraw(); return; }         // 가드⑤: 창 밖 — 판 불변
  if(state.mvTag.includes(k)){ state.mvMsg = MV_SAY_TAGGED; mvDraw(); return; }               // 가드⑥: 이미 찾은 곳 — 판 불변
  if(state.mvSel===k){ state.mvSel = null; state.mvMsg = MV_SAY_UNSEL; mvDraw(); return; }    // 가드⑦: 같은 곳 — 고르기만 풀림
  state.mvSel = k; state.mvMsg = ""; state.mvTell = ""; playBlip(); mvDraw();
}
/* 특징 고르기 */
function mvKind(f){
  if(state.mvFin!=null) return;                                        // 가드①
  if(!Number.isInteger(f) || f<0 || f>=MV_KIND.length) return;         // 가드②
  if(mvDone(state)){ state.mvMsg = MV_SAY_LOCK; playThud(); mvDraw(); return; }               // 가드③
  if(state.mvSel==null){ state.mvMsg = MV_SAY_ORDER_K; playThud(); mvDraw(); return; }        // 가드⑧: 곳을 고르기 전 — 판 불변
  if(f!==mvKindOf(state.mvSel)){ state.mvMsg = MV_SAY_WRONG; playThud(); mvDraw(); return; }  // 가드⑨: 어긋난 특징 — 고르기 유지 · 판 불변 · 감점 0
  const k = state.mvSel;
  state.mvTag.push(k);                                                 // ⭐ 특징을 적는 자리는 코드에 여기 단 하나 · 지우는 자리 0
  state.mvSel = null; state.mvMsg = ""; state.mvTell = mvTagTell(k); playBlip(); mvDraw();
}
/* 판 읽기 */
function mvRead(i){
  if(state.mvFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=MV_READQ.length) return;         // 가드②
  if(!mvDone(state)){ state.mvMsg = MV_SAY_ORDER_R; playThud(); mvDraw(); return; }           // 가드⑩: 다 찾기 전 — 판 불변
  if(state.mvRead!=null){ state.mvMsg = MV_SAY_READDONE; mvDraw(); return; }                   // 가드⑪: 이미 정한 자리 — 판 불변
  if(i!==MV_READ_OK){ state.mvMsg = MV_READ_BAD; playThud(); mvDraw(); return; }               // 가드⑫: 어긋난 답 — 판 불변
  state.mvRead = i; state.mvMsg = ""; state.mvTell = ""; playBlip(); mvDraw();
}
/* 마무리 */
function mvFin(i){
  if(state.mvFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=MV_FINQ.length) return;          // 가드②
  if(state.mvRead==null){ state.mvMsg = MV_SAY_ORDER_FIN; playThud(); mvDraw(); return; }      // 가드⑬: 판을 읽기 전 — 판 불변
  if(i!==MV_FIN_OK){ state.mvMsg = MV_FIN_BAD; playThud(); mvDraw(); return; }                 // 가드⑭: 어긋난 답 — 판 불변
  state.mvFin = i; state.mvMsg = ""; playChime(); mvDraw();
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

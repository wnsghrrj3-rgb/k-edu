<!DOCTYPE html>
<!--
=========================================================================
  사회 4-2 · 3단원 다양한 환경과 삶의 모습
  주제② 도시의 특징과 생활 모습 · l09
  「도시에 사는 사람들의 생활 모습을 알아볼까요」
  교과서 p.136~138 · 지도서 12차시(p.258~261) · [4사10-02]
  수업 기법 = 돌아가며 말하기 · 역할 놀이하기
=========================================================================

  ■ 직접조작 = 내가 짠 것이 그대로 문제가 되는 판 (무언극 판)
  ⭐ 앞 서른한 판에서 판이 낸 문제의 답은 언제나 판이 미리 쥐고 있었다 —
     맞는 짝, 맞는 칸, 맞는 갈래, 맞는 차례는 모두 상수로 적혀 있었고 학생이 무엇을 하든 달라지지 않았다.
     이번 판에는 맞히기의 정답을 정해 둔 상수가 코드에 아예 없다(MM_ANS 부재).
     mmAnswer 한 줄이 「학생이 무언극에 넣기로 고른 카드」를 그대로 답으로 돌려준다.
     그래서 같은 물음인데도 내가 무엇을 골랐느냐에 따라 정답이 달라진다.
  ⭐ 말을 빼도 몸짓은 하나도 달라지지 않는다 — 발표하면 판에서 카드의 글자만 사라지고
     몸짓 도형 세 자리는 글자까지 그대로다. 근거 = 지도서 「무언극: 대사 없이 몸짓과 표정만으로 내용을 전달하는 연극」.
  ⭐ 고른 카드를 적는 자리 state.mmPick[g] = c 단 하나 · 맞힌 갈래를 적는 자리 단 하나 · 지우는 자리 0 · 난수 0.
  ⭐ MM_CARD[ · MM_MIME[ · MM_KIND[ 를 읽는 자리는 각각 단 하나(mmCardOf · mmMimeOf · mmKindOf).

  ■ 5단계
   ① 무언극 짜기(세 갈래에서 하나씩 · 차례 자유 · 판정 0)
   ② 말을 빼고 발표하기(셋을 다 골라야 열린다 · ★ 판에서 카드의 글자만 사라진다)
   ③ 몸짓 보고 맞히기(세 갈래 · 차례 자유 · ★ 정답은 내가 고른 카드)
   ④ 판 읽기 3택(정답 자리 1) → ⑤ 마무리 3택(정답 자리 2) → 완료
      — 모둠 친구들과 실제로 무언극을 짜고 발표하는 일은 교실 몫

  ■ 가드 10종
   ① 마무리 확정 후 다섯 처리기 전체 잠금   ② 무효 번호·갈래 어긋난 카드(안내조차 0)
   ③ 이미 정한 갈래 다시 고르기 — 판 불변   ④ 셋을 다 고르기 전 발표 — 판 불변
   ⑤ 발표한 뒤 고치기·다시 발표 — 판 불변   ⑥ 발표하기 전 맞히기 — 판 불변
   ⑦ 이미 맞힌 갈래 다시 맞히기 — 판 불변   ⑧ 맞히기 어긋난 답 — 판 불변(안내에 카드 이름·갈래 이름 0)
   ⑨ 세 갈래를 다 맞히기 전 판 읽기 · 이미 읽은 자리 · 판 읽기 어긋난 답 — 판 불변
   ⑩ 판을 읽기 전 마무리 · 마무리 어긋난 답 — 판 불변

  ■ 정직 4곳
   ㉠ 판의 아홉 장은 교과서 136~137쪽 그림과 지도서 발문의 답을 옮긴 자리이고,
      도시에 사는 사람들의 생활 모습은 이보다 훨씬 다양하다(캡션 상시).
   ㉡ 판의 몸짓은 도형으로 나타낸 표시이고, 실제 무언극은 표정과 몸짓으로 한다.
   ㉢ 모둠 친구들과 무언극을 짜고 발표하고 감상하는 일은 교실 몫(완료 카드 명시).
   ㉣ 판은 어느 생활 모습이 더 좋은지 가리지 않는다.

  ■ 설계 원칙
   · 13차시 이후 침범 0(좋은 점·문제점·교통 체증·환경 오염·쓰레기 문제 0 — 차시 예고 한 자리까지)
   · 주제① 재현 0(자연환경·인문환경·산이 많은·들이 펼쳐진·바다가 있는·간척·개발 0)
   · l07·l08 재현 최소(인구·산업·촌락 0 · 실제 지역 이름 0)
   · 교사용 참고 자료 0(학습 안내·지도 꿀·활동 의도·평가 관점·누리집 주소·에코델타·스마트 시티 포털)
   · 네 자리 연도 0 · 비율 0 · 금액 0 · 「틀렸」 0 · 사람 형상 0 · 학생 이름 0
-->

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#0891B2; --green-d:#0E7490; --cyan:#0D9488;
  --bg:#ECFEFF; --bub:#CFFAFE; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#CFFAFE;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#CFFAFE;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(8,145,178,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}


/* 조작 판 — 내가 짠 것이 그대로 문제가 되는 판 (무언극 판) */
.mm-wrap{max-width:780px;width:100%;margin:0 auto}
.mm-head{background:#CFFAFE;color:#155E75;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.mm-play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:start}
.mm-board{padding:9px;border-radius:14px;background:#F0F9FF;border:2px solid #BAE6FD;display:flex;flex-direction:column;gap:8px}
.mm-board[data-shown="1"]{background:#FFF8E1;border-color:#FCD34D}
.mm-seat{border:2px solid #7DD3FC;border-radius:12px;background:#fff;padding:7px 6px;display:flex;flex-direction:column;
  align-items:center;gap:3px;text-align:center;word-break:keep-all;min-height:84px;justify-content:center}
.mm-seat[data-set="0"]{border-style:dashed;background:#F8FAFC}
.mm-seat[data-got="1"]{border-color:#16A34A;background:#F0FDF4}
.mm-gn{font-size:clamp(10px,1.5vw,12px);font-weight:800;color:#0E7490;background:#CFFAFE;border-radius:999px;padding:1px 9px}
.mm-pic{display:block;line-height:0}
.mm-pic svg{width:56px;height:39px}
.mm-line{font-size:clamp(11px,1.8vw,14px);font-weight:700;color:#0C4A6E;line-height:1.4}
.mm-seat[data-set="0"] .mm-line{color:#94A3B8;font-weight:500}
.mm-side{display:flex;flex-direction:column;gap:8px}
.mm-tell{border-radius:12px;padding:9px 13px;font-size:clamp(12px,2vw,15px);line-height:1.6;background:#F0FDFA;border-left:4px solid var(--cyan)}
.mm-ask{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#F8FEFF;margin-top:9px;font-size:clamp(13px,2.2vw,16px);line-height:1.6}
.mm-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.mm-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:9px 11px;font-family:inherit;
  font-size:clamp(12px,2.1vw,15px);cursor:pointer;text-align:left;line-height:1.5;word-break:keep-all;
  display:flex;align-items:center;gap:8px}
.mm-opt:hover{border-color:var(--green);background:var(--bub)}
.mm-opt svg{width:40px;height:28px;flex:0 0 auto}
.mm-row{border:2px solid var(--line);border-radius:11px;padding:7px 9px;background:#fff;margin-top:8px}
.mm-row[data-fixed="1"]{border-color:#86EFAC;background:#F0FDF4}
.mm-rg{display:inline-block;font-size:clamp(11px,1.7vw,13px);color:#0E7490}
.mm-cards{display:grid;grid-template-columns:1fr;gap:6px;margin-top:5px}
.mm-fix{font-size:clamp(12px,2vw,15px);font-weight:700;color:#166534;padding:3px 2px}
.mm-key{border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;font-size:clamp(11px,1.9vw,14px);line-height:1.6}
.mm-key b{color:#0E7490}
@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
  .mm-play{grid-template-columns:1fr}
  .mm-seat{min-height:74px}
}
</style>

</head>

<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="goHub()">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>

    </button>

/* ===== 직접 조작: 내가 짠 것이 그대로 문제가 되는 판 (무언극 판) =====

   고른 카드를 적는 자리 단 하나 · 맞힌 갈래를 적는 자리 단 하나 · 지우는 자리 0 · 난수 0. */

const MM_G = 3;                                           // 갈래 셋
const MM_KIND = [0,0,0,1,1,1,2,2,2];                      // 카드가 어느 갈래인지

const MM_MOVE  = ["집에서 나서는 몸짓","일하는 몸짓","여가를 즐기는 몸짓"];
const MM_CARD = [
  "아파트에서 살아요",
  "단독 주택에서 살아요",
  "상점과 아파트가 함께 있는 건물에서 살아요",

];
const MM_MIME = [                                          // 몸짓 — 도형으로만(사람 형상 0)
  `<rect x="6" y="6" width="12" height="18" fill="#7DD3FC"/><rect x="22" y="3" width="12" height="21" fill="#38BDF8"/><g fill="#fff"><rect x="9" y="10" width="3" height="3"/><rect x="13" y="10" width="3" height="3"/><rect x="25" y="7" width="3" height="3"/><rect x="29" y="7" width="3" height="3"/></g>`,
  `<path d="M 8 13 L 20 5 L 32 13 Z" fill="#38BDF8"/><rect x="11" y="13" width="18" height="11" fill="#7DD3FC"/><rect x="17" y="17" width="6" height="7" fill="#fff"/>`,
  `<rect x="7" y="4" width="26" height="10" fill="#38BDF8"/><rect x="7" y="16" width="26" height="8" fill="#FDBA74"/><g fill="#fff"><rect x="10" y="7" width="4" height="4"/><rect x="18" y="7" width="4" height="4"/><rect x="26" y="7" width="4" height="4"/></g>`,
  `<ellipse cx="20" cy="15" rx="13" ry="7" fill="#FDE68A"/><g fill="#92400E"><rect x="8" y="4" width="6" height="5"/><rect x="26" y="4" width="6" height="5"/><rect x="17" y="22" width="6" height="4"/></g>`,
  `<circle cx="14" cy="14" r="8" fill="none" stroke="#F59E0B" stroke-width="4"/><circle cx="28" cy="18" r="5" fill="none" stroke="#F59E0B" stroke-width="3"/>`,
  `<rect x="6" y="9" width="28" height="11" fill="#A7F3D0"/><rect x="6" y="14" width="28" height="2" fill="#047857"/><path d="M 12 6 L 20 6 L 20 2" stroke="#047857" stroke-width="2" fill="none"/><path d="M 28 23 L 20 23 L 20 26" stroke="#047857" stroke-width="2" fill="none"/>`,
  `<rect x="8" y="4" width="24" height="20" fill="#fff" stroke="#A78BFA" stroke-width="3"/><circle cx="16" cy="11" r="3" fill="#C4B5FD"/><path d="M 11 21 L 19 12 L 29 21 Z" fill="#DDD6FE"/>`,
  `<circle cx="11" cy="19" r="6" fill="none" stroke="#0E7490" stroke-width="2.5"/><circle cx="29" cy="19" r="6" fill="none" stroke="#0E7490" stroke-width="2.5"/><path d="M 11 19 L 19 8 L 29 19" stroke="#0E7490" stroke-width="2.5" fill="none"/>`,

];
const MM_SAY_HAVE = "그 갈래는 이미 정했어요. 판은 그대로예요.";
const MM_SAY_ORDER_SHOW = "먼저 세 갈래를 하나씩 정해 봐요.";
const MM_SAY_SHOWN = "이미 말을 빼고 발표했어요. 판은 그대로예요.";
const MM_SAY_ORDER_GUESS = "먼저 말을 빼고 발표해 봐요.";
const MM_SAY_GOTDONE = "그 갈래는 이미 알아맞혔어요. 판은 그대로예요.";

const MM_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const MM_SAY_ORDER_FIN = "먼저 판을 읽어 봐요.";
const MM_READQ = [
  "몸짓은 아무것도 알려 주지 않지만 운이 좋아서 알아맞혔어요",
  "무언극은 대사 없이 몸짓과 표정만으로 내용을 전달하기 때문이에요",
  "판이 답을 미리 알려 주었기 때문이에요"
];
const MM_READ_OK = 1;
const MM_READ_BAD = "말을 빼기 전과 뺀 뒤에 판에 무엇이 남았는지 떠올려 봐요.";
const MM_FINQ = [
  "도시에 사는 사람들의 생활 모습은 모두 같아요",
  "도시에는 여가 생활을 즐길 만한 시설이 부족해요",

];
const MM_FIN_OK = 2;
const MM_FIN_BAD = "교과서 136쪽부터 138쪽까지 다시 살펴봐요.";

function mmKindOf(c){ return MM_KIND[c]; }                                        // MM_KIND 를 읽는 자리는 여기 단 하나
function mmCardOf(c){ return MM_CARD[c]; }                                        // MM_CARD 를 읽는 자리는 여기 단 하나
function mmMimeOf(c){ return MM_MIME[c]; }                                        // MM_MIME 를 읽는 자리는 여기 단 하나
function mmSetN(st){ let n=0; for(let g=0;g<MM_G;g++) if(st.mmPick[g]!=null) n++; return n; }
function mmReady(st){ return mmSetN(st) === MM_G; }
function mmAnswer(st,g){ return st.mmPick[g]; }                                   // ★ 정답 상수 0 — 답은 내가 고른 카드
function mmGotN(st){ let n=0; for(let g=0;g<MM_G;g++) if(st.mmGot[g]!=null) n++; return n; }
function mmAllGot(st){ return mmGotN(st) === MM_G; }
function mmStage(st){
  if(!mmReady(st)) return "make";
  if(!st.mmShown) return "show";
  if(!mmAllGot(st)) return "guess";
  if(st.mmRead == null) return "read";
  if(st.mmFin == null) return "fin";
  return "end";
}

/* 판 — 세 자리. 말을 빼면 카드의 글자만 사라지고 몸짓 도형은 그대로 */
function mmSeat(st,g){
  const c = st.mmPick[g];
  const pic = c==null ? '' : `<svg viewBox="0 0 40 28" data-mime="${c}">${mmMimeOf(c)}</svg>`;
  const line = c==null ? '아직 정하지 않았어요' : (st.mmShown ? MM_MOVE[g] : mmCardOf(c));
  return `<div class="mm-seat" data-g="${g}" data-set="${c==null?0:1}" data-got="${st.mmGot[g]==null?0:1}">`
    + `<span class="mm-gn">${MM_GNAME[g]}</span><span class="mm-pic">${pic}</span><span class="mm-line">${line}</span></div>`;
}
function mmBoard(st){
  let s=''; for(let g=0;g<MM_G;g++) s += mmSeat(st,g);
  return `<div class="mm-board" data-shown="${st.mmShown?1:0}">${s}</div>`;
}
/* 고르는 줄 — 짜기(put)와 맞히기(guess)가 같은 모양 */
function mmRows(st,mode){
  let s='';
  for(let g=0;g<MM_G;g++){
    const fixed = mode==='put' ? st.mmPick[g] : st.mmGot[g];
    let inner='';
    if(fixed!=null){ inner = `<div class="mm-fix">✓ ${mmCardOf(fixed)}</div>`; }
    else for(let c=0;c<MM_N;c++){ if(mmKindOf(c)!==g) continue;
      inner += `<button class="mm-opt mm-card" data-pick="${c}" onclick="${mode==='put'?'mmPut':'mmGuess'}(${g},${c})">`
        + `<svg viewBox="0 0 40 28">${mmMimeOf(c)}</svg><span>${mmCardOf(c)}</span></button>`; }
    s += `<div class="mm-row" data-row="${g}" data-mode="${mode}" data-fixed="${fixed==null?0:1}">`
      + `<b class="mm-rg">${MM_GNAME[g]}</b><div class="mm-cards">${inner}</div></div>`;
  }
  return s;
}
function mmKey(st){
  return `<div class="mm-key"><b>세 갈래</b><br>${MM_GNAME.join(' · ')}<br>
    갈래마다 하나씩 골라 무언극을 짜요.</div>`;
}
function mmPanel(st){
  const stage = mmStage(st);
  let ask = '';
  if(stage === "make"){
    ask = `<div class="mm-ask" data-step="make"><b>세 갈래에서 몸짓 카드를 하나씩 골라 무언극을 짜 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">어느 갈래부터 골라도 괜찮아요. 무엇을 골라도 판은 그대로 받아요.</div>
      ${mmRows(st,'put')}</div>`;
  } else if(stage === "show"){
    ask = `<div class="mm-ask" data-step="show"><b>무언극은 말을 하지 않아요. 말을 빼고 발표해 볼까요?</b>
      <div class="mm-opts"><button class="mm-opt" onclick="mmShow()">말을 빼고 발표해요</button></div></div>`;
  } else if(stage === "guess"){
    ask = `<div class="mm-ask" data-step="guess"><b>친구가 무엇을 표현했는지 몸짓을 보고 알아맞혀 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">판에 남은 몸짓과 아래 보기의 몸짓을 견주어 봐요.</div>
      ${mmRows(st,'guess')}</div>`;
  } else if(stage === "read"){
    ask = `<div class="mm-ask" data-step="read"><b>말을 한마디도 하지 않았는데 무엇을 표현했는지 알 수 있었어요. 왜 그럴까요?</b>
      <div class="mm-opts">${MM_READQ.map((t,i)=>`<button class="mm-opt" onclick="mmRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "fin"){
    ask = `<div class="mm-ask" data-step="fin"><b>그렇다면 도시에 사는 사람들의 생활 모습은 어떨까요?</b>
      <div class="mm-opts">${MM_FINQ.map((t,i)=>`<button class="mm-opt" onclick="mmFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="mm-ask" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">도시에 사는 사람들의 생활 모습은 사는 곳, 하는 일, 여가 생활 등에 따라 다양하게 나타나요.</b>
      판에서도 세 갈래에 무엇을 넣느냐에 따라 무언극이 저마다 달라졌지요.
      <div class="note" style="text-align:left;margin-top:5px">※ 모둠 친구들과 무언극을 짜고 발표하고 감상하는 일은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.mmTell ? `<div class="mm-tell">${st.mmTell}</div>` : '';
  const warn = st.mmMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.mmMsg}</div>` : '';
  return `<div class="mm-wrap">
    <div class="mm-head">정한 갈래 <b>${mmSetN(st)}</b> / 3 · 알아맞힌 갈래 <b>${mmGotN(st)}</b> / 3 · 판에 남은 것 <b>${st.mmShown ? '몸짓만' : '말과 몸짓'}</b></div>

function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_2_social_u3_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  mmPick:[null,null,null], mmGot:[null,null,null], mmShown:false, mmRead:null, mmFin:null, mmMsg:"", mmTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function mmDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 몸짓 카드 고르기 — 갈래마다 하나 · 판정 0 */
function mmPut(g,c){
  if(state.mmFin!=null) return;                                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(g) || g<0 || g>=MM_G) return;                                    // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(!Number.isInteger(c) || c<0 || c>=MM_N) return;                                    // 가드②
  if(mmKindOf(c)!==g) return;                                                           // 가드②: 갈래가 어긋난 카드
  if(state.mmShown){ state.mmMsg = MM_SAY_SHOWN; playThud(); mmDraw(); return; }        // 가드⑤: 발표한 뒤 고치기 — 판 불변
  if(state.mmPick[g]!=null){ state.mmMsg = MM_SAY_HAVE; playThud(); mmDraw(); return; } // 가드③: 이미 정한 갈래 — 판 불변
  state.mmPick[g] = c;                                                                  // ⭐ 고른 카드를 적는 자리는 코드에 여기 단 하나 · 지우는 자리 0
  state.mmMsg = ""; state.mmTell = MM_GNAME[g] + " 자리에 몸짓을 넣었어요."; playBlip(); mmDraw();
}
/* 말을 빼고 발표하기 — 판에서 카드의 글자만 사라진다 */
function mmShow(){
  if(state.mmFin!=null) return;                                                        // 가드①
  if(!mmReady(state)){ state.mmMsg = MM_SAY_ORDER_SHOW; playThud(); mmDraw(); return; } // 가드④: 셋을 다 고르기 전 — 판 불변
  if(state.mmShown){ state.mmMsg = MM_SAY_SHOWN; playThud(); mmDraw(); return; }        // 가드⑤: 이미 발표 — 판 불변
  state.mmShown = true;                                                                 // ⭐ 발표하는 자리 단 하나 · 되돌리는 자리 0
  state.mmMsg = ""; state.mmTell = "말을 뺐어요. 판에는 몸짓만 남았어요."; playBlip(); mmDraw();
}
/* 몸짓 보고 알아맞히기 — ★ 정답은 내가 고른 카드 */
function mmGuess(g,c){
  if(state.mmFin!=null) return;                                                        // 가드①
  if(!Number.isInteger(g) || g<0 || g>=MM_G) return;                                    // 가드②
  if(!Number.isInteger(c) || c<0 || c>=MM_N) return;                                    // 가드②
  if(mmKindOf(c)!==g) return;                                                           // 가드②
  if(!state.mmShown){ state.mmMsg = MM_SAY_ORDER_GUESS; playThud(); mmDraw(); return; } // 가드⑥: 발표하기 전 — 판 불변
  if(state.mmGot[g]!=null){ state.mmMsg = MM_SAY_GOTDONE; playThud(); mmDraw(); return; } // 가드⑦: 이미 맞힌 갈래 — 판 불변
  if(c !== mmAnswer(state,g)){ state.mmMsg = MM_SAY_MISS; playThud(); mmDraw(); return; } // 가드⑧: 어긋난 답 — 판 불변
  state.mmGot[g] = c;                                                                   // ⭐ 맞힌 갈래를 적는 자리는 코드에 여기 단 하나 · 지우는 자리 0
  state.mmMsg = ""; state.mmTell = MM_GNAME[g] + " 몸짓을 알아맞혔어요."; playBlip(); mmDraw();
}
/* 판 읽기 */
function mmRead(i){
  if(state.mmFin!=null) return;                                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=MM_READQ.length) return;                          // 가드②
  if(!mmAllGot(state)){ state.mmMsg = MM_SAY_ORDER_R; playThud(); mmDraw(); return; }   // 가드⑨: 다 맞히기 전 — 판 불변
  if(state.mmRead!=null){ state.mmMsg = MM_SAY_READDONE; mmDraw(); return; }            // 가드⑨: 이미 정한 자리 — 판 불변
  if(i!==MM_READ_OK){ state.mmMsg = MM_READ_BAD; playThud(); mmDraw(); return; }        // 가드⑨: 어긋난 답 — 판 불변
  state.mmRead = i; state.mmMsg = ""; state.mmTell = ""; playBlip(); mmDraw();
}
/* 마무리 */
function mmFin(i){
  if(state.mmFin!=null) return;                                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=MM_FINQ.length) return;                           // 가드②
  if(state.mmRead==null){ state.mmMsg = MM_SAY_ORDER_FIN; playThud(); mmDraw(); return; } // 가드⑩: 판을 읽기 전 — 판 불변
  if(i!==MM_FIN_OK){ state.mmMsg = MM_FIN_BAD; playThud(); mmDraw(); return; }          // 가드⑩: 어긋난 답 — 판 불변
  state.mmFin = i; state.mmMsg = ""; playChime(); mmDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

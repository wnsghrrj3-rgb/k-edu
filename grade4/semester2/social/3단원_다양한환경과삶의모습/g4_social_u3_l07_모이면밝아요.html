<!DOCTYPE html>
<!--
=========================================================================
  사회 4-2 · 3단원 다양한 환경과 삶의 모습
  주제② 도시의 특징과 생활 모습 · l07
  「도시가 무엇인지 알아볼까요」
  교과서 p.128~130 · 지도서 9차시(p.242~248) · [4사10-02]
  수업 기법 = 돌아가며 말하기
=========================================================================

  ■ 직접조작 = 모이면 밝아지는 판 (밤에 본 땅 아홉 칸에 사람 옮기기)
  ⭐ 앞 스물아홉 판은 놓고·자르고·덮고·누르고·끼웠다. 이번 판에서 학생이 바꾸는 것은 「사람이 어느 칸에 사는가」 하나뿐이다 —
     칸을 하나 고르고(떠날 칸) 다른 칸을 누르면(갈 칸) 한 사람이 옮겨 간다.
  ⭐ 칸의 사람 수·불빛·시설을 담는 상태가 코드에 없다 — 옮김 기록 ctLog 한 줄만 있고,
     칸의 사람 수는 ctN 한 줄이 기록을 세어 정하고, 불빛(ctLight)과 시설(ctFacOf)은 그 수에서 곧바로 나온다.
     그래서 「사람이 떠난 칸에 병원이 남는 일」이나 「사람이 적은 칸이 가장 밝은 일」은 만들어질 수 없다.
  ⭐ 사람은 늘지도 줄지도 않는다(모두 아홉) — 한 칸에서 빠진 만큼 다른 칸에 더해진다.
  ⭐ 기록을 적는 자리 state.ctLog.push 단 하나 · 지우는 자리 0 · 한 칸에 다섯이 모이면(공공 기관이 서면) 판은 멈추고 판 읽기로 간다.
     근거 = 교과서 129쪽 도시의 뜻(많은 인구 · 공공 기관 · 병원·상점 등 편의 시설) + 128쪽 밤하늘 사진(밝게 빛나는 곳).

  ■ 4단계
   ① 사람 옮기기(떠날 칸 → 갈 칸, 차례 자유 · 판정 0) → 한 칸에 다섯이 모일 때까지
   ② 판 읽기 3택(정답 자리 2 = 「사람이 많이 모인 칸일수록…」)
   ③ 마무리 3택(정답 자리 1 = 교과서 도시의 뜻) → 완료 — 방문했던 도시 이야기 나누기는 교실 몫

  ■ 가드 10종
   ① 마무리 확정 후 세 처리기 전체 잠금      ② 무효 번호(Number.isInteger·범위)
   ③ 도시가 선 뒤 옮기기 — 판 불변           ④ 사람이 없는 칸을 떠날 칸으로 — 판 불변
   ⑤ 고른 칸을 다시 누르면 고르기만 풀림 — 판 불변
   ⑥ 도시가 서기 전 판 읽기 — 판 불변        ⑦ 이미 읽은 자리 다시 읽기 — 판 불변
   ⑧ 판 읽기 어긋난 답 — 판 불변             ⑨ 판을 읽기 전 마무리 — 판 불변
   ⑩ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 판은 사람 수로 불빛과 시설을 정했지만, 실제로는 편의 시설과 일자리가 사람을 도시로 모으기도 한다 — 칸·사람 수는 판이 줄여 옮김(캡션 상시).
   ㉡ 밤하늘 그림은 판이 새로 그린 도식이다(교과서 사진이 아님).
   ㉢ 방문했던 도시의 경험을 친구와 이야기하는 일은 교실 몫.

  ■ 설계 원칙
   · 10~11차시 침범 0(인구 그래프·교통·산업은 차시 예고 한 자리 · 촌락 0 · 5만 명 기준 0)
   · 주제① 재현 0(산이 많은·들이 펼쳐진·바다가 있는 지역 0) · 교사용 참고 자료 0(도읍·시장 어원 · 도시화 단계)
   · 실제 지역 이름은 교과서 130쪽 지도·경험 예시 안 · 연도 0 · 「틀렸」 0
-->

/* ===== 직접 조작: 모이면 밝아지는 판 (밤에 본 땅 아홉 칸에 사람 옮기기) =====
   ⭐ 칸의 사람 수·불빛·시설을 담는 상태가 없다 — 옮김 기록 ctLog 한 줄만 있고,
      사람 수는 ctN 한 줄이 기록을 세어 정하고, 불빛과 시설은 그 수에서 곧바로 나온다.
   ⭐ 사람은 늘지도 줄지도 않는다 — 한 번 옮기면 떠난 칸에서 하나 빠지고 간 칸에 하나 더해진다.
   ⭐ 기록을 적는 자리 state.ctLog.push 단 하나 · 지우는 자리 0 · 한 칸에 다섯이 모이면 판은 멈춘다. */
const CT_N = 9;                                        // 칸의 수
const CT_START = [1,1,1,1,1,1,1,1,1];                  // 처음 칸마다 사는 사람
const CT_CITY = 5;                                     // 공공 기관이 서는 사람 수
const CT_NAME = ["가","나","다","라","마","바","사","아","자"];
const CT_FAC = [{name:"상점",need:3},{name:"병원",need:4},{name:"공공 기관",need:5}];
const CT_SAY_LOCK = "이미 공공 기관까지 선 칸이 생겼어요. 판은 그대로예요. 판을 읽어 봐요.";
const CT_SAY_EMPTY = "그 칸에는 떠날 사람이 없어요. 판은 그대로예요.";
const CT_SAY_UNSEL = "고르기를 풀었어요. 판은 그대로예요.";
const CT_SAY_ORDER_R = "먼저 한 칸에 다섯 사람을 모아 봐요.";
const CT_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const CT_SAY_ORDER_FIN = "먼저 판을 읽어 봐요.";
const CT_READQ = [
  "불빛과 시설은 사람 수와 상관없이 아무 칸에나 생겨요",
  "사람이 적게 사는 칸일수록 밤에 더 밝게 빛나요",
  "사람이 많이 모인 칸일수록 밤에도 밝고, 상점·병원·공공 기관이 모여 있어요"
];
const CT_READ_OK = 2;
const CT_READ_BAD = "판에서 가장 밝게 빛난 칸에 몇 사람이 살았는지 떠올려 봐요.";
const CT_FINQ = [
  "도시는 사람이 거의 살지 않아 밤이면 불빛이 모두 꺼지는 곳이에요",
  "도시는 많은 인구가 모여 살면서 정치, 경제, 사회 활동의 중심이 되는 곳이에요",
  "도시에는 공공 기관이나 병원, 상점 같은 편의 시설이 없어요"
];
const CT_FIN_OK = 1;
const CT_FIN_BAD = "교과서 129쪽에서 도시가 어떤 곳인지 다시 떠올려 봐요.";

function ctN(st,k){ return CT_START[k] - st.ctLog.filter(m=>m[0]===k).length + st.ctLog.filter(m=>m[1]===k).length; }   // ⭐ 사람 수를 세는 자리는 여기 단 하나
function ctLight(n){ return n===0 ? 0 : (n<=2 ? 1 : (n<CT_CITY ? 2 : 3)); }       // 불빛은 사람 수에서만
function ctFacOf(n){ return CT_FAC.filter(f=>n>=f.need); }                       // 시설도 사람 수에서만
function ctCity(st){ for(let k=0;k<CT_N;k++){ if(ctN(st,k)>=CT_CITY) return k; } return -1; }
function ctStage(st){
  if(ctCity(st) < 0) return "run";
  if(st.ctRead == null) return "read";
  if(st.ctFin == null) return "fin";
  return "end";
}

/* 판 — 아홉 칸 */
function ctCell(st,k){
  const n = ctN(st,k);
  let folk=''; for(let j=0;j<n;j++) folk += '<span class="ct-man"></span>';
  const fac = ctFacOf(n).map(f=>`<span class="ct-tag">${f.name}</span>`).join('');
  return `<button class="ct-cell" data-k="${k}" data-n="${n}" data-light="${ctLight(n)}" data-sel="${st.ctSel===k?1:0}" onclick="ctPick(${k})"><b>${CT_NAME[k]} 칸</b><span class="ct-folk">${folk}</span><span class="ct-fac">${fac}</span></button>`;
}
function ctBoard(st){
  let s=''; for(let k=0;k<CT_N;k++) s += ctCell(st,k);
  return `<div class="ct-board">${s}</div>`;
}
function ctKey(st){
  const c = ctCity(st);
  const top = Math.max(...CT_START.map((_,k)=>ctN(st,k)));
  return `<div class="ct-key"><b>사람이 모이면</b><br>세 사람 — 상점이 생겨요<br>네 사람 — 병원이 생겨요<br>다섯 사람 — 공공 기관이 서요<br>
    가장 많이 모인 칸: <b>${top}</b>사람${c>=0 ? ` · <b>${CT_NAME[c]} 칸</b>이 가장 밝아요` : ''}</div>`;
}

function ctPanel(st){
  const stage = ctStage(st);
  let ask = '';
  if(stage === "run"){
    ask = `<div class="ct-ask" data-step="run"><b>떠날 칸을 누르고, 갈 칸을 눌러 한 사람씩 옮겨 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">어느 칸으로 모아도 괜찮아요. 한 칸에 다섯 사람이 모이면 판을 읽을 수 있어요.</div></div>`;
  } else if(stage === "read"){
    ask = `<div class="ct-ask" data-step="read"><b>밤에 본 판을 살펴보니, 무엇을 알 수 있을까요?</b>
      <div class="ct-opts">${CT_READQ.map((t,i)=>`<button class="ct-opt" onclick="ctRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "fin"){
    ask = `<div class="ct-ask" data-step="fin"><b>그렇다면 도시는 어떤 곳일까요?</b>
      <div class="ct-opts">${CT_FINQ.map((t,i)=>`<button class="ct-opt" onclick="ctFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="ct-ask" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">많은 인구가 모여 살면서 정치, 경제, 사회 활동의 중심이 되는 곳을 도시라고 해요.</b>
      판에서도 사람이 많이 모인 칸이 가장 밝았고, 공공 기관과 편의 시설이 그곳에 모였지요.
      <div class="note" style="text-align:left;margin-top:5px">※ 내가 가 본 도시가 어떤 모습이었는지 친구와 이야기 나누는 일은 <b>교실 몫</b>이에요. 판은 대신 떠올려 주지 않아요.</div></div>`;
  }
  const tell = st.ctTell ? `<div class="ct-tell">${st.ctTell}</div>` : '';
  const warn = st.ctMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.ctMsg}</div>` : '';
  return `<div class="ct-wrap">
    <div class="ct-head">밤에 본 땅 아홉 칸 · 옮긴 횟수 <b>${st.ctLog.length}</b> · 모두 ${CT_N}사람</div>
    <div class="ct-play">${ctBoard(st)}<div class="ct-side">${ctKey(st)}${tell}</div></div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 이 판은 도시의 뜻을 <b>판이 칸 아홉과 사람 아홉으로 줄여 옮긴 것</b>이에요. 판에서는 사람 수로 불빛과 시설을 정했지만, 실제로는 편의 시설과 일자리가 사람을 도시로 모으기도 해요.</div>
  </div>`;
}
function ctTellOf(st,f,t){                                                       // 알림도 사람 수에서만
  const got = CT_FAC.find(x=>x.need===ctN(st,t));
  const lost = CT_FAC.find(x=>x.need===ctN(st,f)+1);
  return `${CT_NAME[f]} 칸에서 ${CT_NAME[t]} 칸으로 한 사람이 옮겨 갔어요.`
    + (got ? ` ${CT_NAME[t]} 칸에 ${got.name}이 생겼어요.` : '')
    + (lost ? ` ${CT_NAME[f]} 칸의 ${lost.name}은 문을 닫았어요.` : '');
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g4_2_social_u3_l07";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  ctLog:[], ctSel:null, ctRead:null, ctFin:null, ctMsg:"", ctTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function ctDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 칸 누르기 — 떠날 칸 고르기 · 갈 칸으로 옮기기 */
function ctPick(k){
  if(state.ctFin!=null) return;                                        // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(k) || k<0 || k>=CT_N) return;                    // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(ctCity(state)>=0){ state.ctMsg = CT_SAY_LOCK; playThud(); ctDraw(); return; }             // 가드③: 도시가 선 뒤 — 판 불변
  if(state.ctSel==null){
    if(ctN(state,k)===0){ state.ctMsg = CT_SAY_EMPTY; playThud(); ctDraw(); return; }          // 가드④: 떠날 사람 0 — 판 불변
    state.ctSel = k; state.ctMsg = ""; state.ctTell = ""; playBlip(); ctDraw(); return;
  }
  if(state.ctSel===k){ state.ctSel = null; state.ctMsg = CT_SAY_UNSEL; ctDraw(); return; }       // 가드⑤: 같은 칸 — 고르기만 풀림 · 판 불변
  const f = state.ctSel;
  state.ctLog.push([f,k]);                                             // ⭐ 기록을 적는 자리는 코드에 여기 단 하나 · 지우는 자리 0
  state.ctSel = null; state.ctMsg = ""; state.ctTell = ctTellOf(state,f,k); playBlip(); ctDraw();
}
/* 판 읽기 */
function ctRead(i){
  if(state.ctFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=CT_READQ.length) return;         // 가드②
  if(ctCity(state)<0){ state.ctMsg = CT_SAY_ORDER_R; playThud(); ctDraw(); return; }            // 가드⑥: 도시가 서기 전 — 판 불변
  if(state.ctRead!=null){ state.ctMsg = CT_SAY_READDONE; ctDraw(); return; }                   // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==CT_READ_OK){ state.ctMsg = CT_READ_BAD; playThud(); ctDraw(); return; }               // 가드⑧: 어긋난 답 — 판 불변
  state.ctRead = i; state.ctMsg = ""; state.ctTell = ""; playBlip(); ctDraw();
}
/* 마무리 */
function ctFin(i){
  if(state.ctFin!=null) return;                                        // 가드①
  if(!Number.isInteger(i) || i<0 || i>=CT_FINQ.length) return;          // 가드②
  if(state.ctRead==null){ state.ctMsg = CT_SAY_ORDER_FIN; playThud(); ctDraw(); return; }      // 가드⑨: 판을 읽기 전 — 판 불변
  if(i!==CT_FIN_OK){ state.ctMsg = CT_FIN_BAD; playThud(); ctDraw(); return; }                 // 가드⑩: 어긋난 답 — 판 불변
  state.ctFin = i; state.ctMsg = ""; playChime(); ctDraw();
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';

    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

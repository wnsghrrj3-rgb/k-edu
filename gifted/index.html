<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이영재 | K-edu</title>
<meta name="description" content="스스로 찾아내는 수학 — 케이영재 탐구 차시">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 낮의 표준 v1 — 부품·원칙은 루트 허브와 동일 (이모지 0 · 말 덜기 · 상자 통일 · 색은 점·띠로만) */
:root{
  --nh-paper:#F4F2EC; --nh-paper2:#E9E6DC;
  --nh-ink:#17161C; --nh-ink-soft:#5A5762;
  --nh-line:#17161C;
  --nh-board:#7B4DFF; --nh-board-deep:#5B2EE0; --nh-mark:#D6F94C;
  --nh-disp:'Black Han Sans',sans-serif;
  --nh-ease:cubic-bezier(.22,.61,.36,1);
  /* 연구소 색 — 띠·점으로만 쓰인다 */
  --lab-pat:#00A85A; --lab-num:#E08600; --lab-log:#0B7BE8; --lab-geo:#7B4DFF;
  --lab-com:#00A0A0; --lab-pro:#E0356F; --lab-dat:#4A5A70; --lab-str:#FF5714;
  --lab-mod:#5E9B00; --lab-res:#9B5BD6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--nh-paper);min-height:100vh;color:var(--nh-ink);display:flex;flex-direction:column}
.top-bar{background:#fff;border-bottom:3px solid var(--nh-ink);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.tb-brand{font-family:var(--nh-disp);font-weight:700;font-size:15px;color:var(--nh-ink);text-decoration:none}
.tb-brand em{font-style:normal;color:var(--nh-board)}
.tb-right{font-size:12.5px;color:var(--nh-ink-soft)}
main{flex:1;max-width:900px;margin:0 auto;padding:34px 24px 56px;width:100%}

.bc{font-size:13px;color:var(--nh-ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bc a{color:var(--nh-ink-soft);text-decoration:none}
.bc a:hover{color:var(--nh-ink)}
.bc-sep{color:rgba(23,22,28,.35)}

.ns-head{margin-bottom:14px}
.ns-k{font-size:11.5px;letter-spacing:.26em;color:var(--nh-board);margin-bottom:8px}
.ns-h{font-family:var(--nh-disp);font-weight:700;font-size:clamp(23px,3vw,27px);line-height:1.3;letter-spacing:.02em}
.ns-h em{font-style:normal;color:var(--nh-board)}
.lede{max-width:620px;font-size:14px;line-height:1.75;color:var(--nh-ink-soft);margin-bottom:22px}

/* 진척 막대 */
.prog{max-width:620px;margin-bottom:30px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--nh-ink-soft);margin-bottom:7px}
.prog-top b{font-family:var(--nh-disp);font-size:15px;color:var(--nh-ink)}
.prog-bar{height:7px;border-radius:999px;background:var(--nh-paper2);overflow:hidden}
.prog-fill{height:100%;background:var(--nh-board);border-radius:999px;transition:width .6s var(--nh-ease)}

/* 레벨 띠 */
.lv-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px}
.lv-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--nh-line);font-size:13px;color:var(--nh-ink-soft);text-decoration:none}
.lv-chip.on{border-color:var(--nh-board);color:var(--nh-ink)}
.lv-chip b{font-family:var(--nh-disp);font-weight:700;font-size:13.5px;color:var(--nh-ink)}
.lv-chip i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--nh-line);display:inline-block}
.lv-chip.on i{background:var(--nh-board)}

.sec-h{font-family:var(--nh-disp);font-weight:700;font-size:16.5px;margin:0 0 4px;scroll-margin-top:18px}
.sec-sub{font-size:12.5px;color:var(--nh-ink-soft);margin-bottom:16px}

.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:38px}
@media(max-width:640px){.lesson-grid{grid-template-columns:1fr}}

.ns-card{position:relative;display:flex;gap:15px;align-items:flex-start;background:#fff;border:1px solid var(--nh-line);border-radius:16px;padding:17px 19px 16px 24px;overflow:hidden;text-decoration:none;cursor:pointer;color:var(--nh-ink);transition:transform .35s var(--nh-ease),box-shadow .35s var(--nh-ease),border-color .3s}
.ns-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gc,var(--nh-board));transition:width .35s var(--nh-ease)}
.ns-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(23,22,28,.9);border-color:var(--nh-ink)}
.ns-card:hover::before{width:9px}
.ns-card.soon{cursor:default;opacity:.45}
.ns-card.soon:hover{transform:none;box-shadow:none;border-color:var(--nh-line)}
.ns-card.soon:hover::before{width:5px}
.ns-num{font-family:var(--nh-disp);font-weight:700;font-size:26px;line-height:1.1;color:var(--nh-ink);min-width:32px;padding-top:1px}
.ns-body{flex:1;min-width:0}
.ns-name{font-family:var(--nh-disp);font-weight:700;font-size:17px;line-height:1.35}
.ns-sub{margin-top:4px;font-size:12.5px;color:var(--nh-ink-soft);line-height:1.55}
.ns-meta{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--nh-ink-soft)}
.lab-tag i{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--gc);display:inline-block}
.ns-soon{font-size:11.5px;color:var(--nh-ink-soft);background:var(--nh-paper2);border-radius:999px;padding:3px 10px}
.ns-saved{font-size:11.5px;color:var(--nh-board)}
.ns-saved::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--nh-board);margin-right:5px;vertical-align:1px}
.ns-saved.part{color:var(--nh-ink-soft)}
.ns-saved.part::before{background:var(--nh-board)}

.lab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
@media(max-width:640px){.lab-grid{grid-template-columns:1fr}}

.foot-note{max-width:620px;margin-top:34px;padding:13px 16px;background:#fff;border:1px solid var(--nh-line);border-radius:12px;font-size:12.5px;color:var(--nh-ink-soft);line-height:1.7}
.reset{background:none;border:none;font-family:'Noto Sans KR',sans-serif;font-size:12.5px;color:var(--nh-ink-soft);text-decoration:underline;cursor:pointer;padding:0}
.reset:hover{color:var(--nh-ink)}

/* ═══ 케이영재 허브 스킨 v2 「신호기」 — 굵은 먹선 + 오프셋 통그림자 (skin_v2_hub.py 가 단일 원본)
       색·서체·테두리만 바꾼다. 그리드·간격·카드 구조는 위 규칙 그대로 유지 ═══ */
.ns-card{border:2px solid var(--nh-ink);box-shadow:5px 5px 0 var(--nh-ink)}
.ns-card:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--nh-ink)}
.ns-card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--nh-ink)}
.ns-card.soon{box-shadow:3px 3px 0 rgba(23,22,28,.35);border-color:rgba(23,22,28,.35)}
.ns-card.soon:hover{transform:none;box-shadow:3px 3px 0 rgba(23,22,28,.35)}
.ns-card::before{width:7px}
.ns-card:hover::before{width:12px}
.ns-num{-webkit-text-stroke:0;color:var(--nh-board)}
.ns-soon{border:1.5px solid rgba(23,22,28,.35)}
.prog-bar{border:2px solid var(--nh-ink);height:13px;background:#fff;padding:0}
.prog-fill{border-radius:0}
.lv-chip{border:2px solid var(--nh-ink);box-shadow:2px 2px 0 var(--nh-ink)}
.lv-chip.on{background:var(--nh-mark)}
.lv-chip i{background:rgba(23,22,28,.3)}
.foot-note{border:2px solid var(--nh-ink);box-shadow:4px 4px 0 var(--nh-ink)}
.ns-k{color:var(--nh-board);font-weight:700}
.sec-h{letter-spacing:.01em}
</style>
</head>
<body>

<div class="top-bar">
  <a class="tb-brand" href="/">K-<em>edu</em></a>
  <span class="tb-right">케이영재</span>
</div>

<main>
  <div class="bc"><a href="/">처음으로</a><span class="bc-sep">·</span><span>케이영재</span></div>

  <div class="ns-head">
    <div class="ns-k">K-GIFTED</div>
    <h1 class="ns-h">스스로 찾아내는 <em>수학</em></h1>
  </div>
  <p class="lede">
    답을 알려 주지 않는 수학입니다. 직접 만지고, 추측을 적고, 틀려 보고, 규칙을 찾아냅니다.
    빨리 맞히는 것이 아니라 스스로 찾아내는 것이 점수입니다. 한 차시는 18장, 100점입니다.
  </p>

  <div class="lv-row" id="lv-row"></div>

  <div id="levels"></div>

  <h2 class="sec-h">실험실</h2>
  <p class="sec-sub">차시 밖에서 마음껏 돌려 보는 곳</p>
  <div class="lab-grid" id="lab-grid"></div>

  <div class="foot-note">
    푼 기록은 이 기기에만 저장됩니다. 다른 기기에서는 이어지지 않습니다.
    <button class="reset" id="btn-reset">기록 지우기</button>
  </div>
</main>

<script>

  { n:18, id:'str01', lab:'STR', name:'필승전략 게임',        sub:'끝에서 거꾸로 오면 자리마다 답이 하나로 정해진다',      file:'math/l3/kg_math_l3_str01_필승전략게임.html' },
  { n:19, id:'str02', lab:'STR', name:'경우 나누기 작전',     sub:'갈래를 빠짐없이 막아야 증명이 된다',                  file:'math/l3/kg_math_l3_str02_경우나누기작전.html' },
  { n:20, id:'mod01', lab:'MOD', name:'학교 이동거리 설계단', sub:'멀리 있는 한 사람은 모임 장소를 끌어당기지 못한다',      file:'math/l3/kg_math_l3_mod01_학교이동거리설계단.html' }
];

/* 레벨 표 — 차시가 하나라도 있는 레벨만 카드를 편다.
   준비 중 레벨은 띠에만 남긴다 (100장을 한 화면에 늘어놓지 않는다). */
const LEVELS = [
  { key:'l1', code:'L1', name:'스파크',         who:'초1~2', sub:'준비 중', lessons:[] },
  { key:'l2', code:'L2', name:'익스플로러',     who:'초2~3', sub:'처음 만나는 연구 — 놓아 보고, 세어 보고, 규칙을 찾는다', lessons:L2_LESSONS },
  { key:'l3', code:'L3', name:'챌린저',         who:'초3~4', sub:'연구소 10종 · 차시마다 탐험 → 발견 → 도전 → 창조', lessons:LESSONS },
  { key:'l4', code:'L4', name:'인베스티게이터', who:'초4~5', sub:'준비 중', lessons:[] },
  { key:'l5', code:'L5', name:'크리에이터',     who:'초5~6', sub:'준비 중', lessons:[] }
];
const openLevels = () => LEVELS.filter(v => v.lessons.some(l => l.file));

const LABS = [
  { name:'님 게임 실험실', sub:'돌을 가져가는 게임을 마음껏 돌려 보는 곳', file:'_lab/nim_lab.html', lab:'STR' }
];

const labColor = lab => 'var(--lab-' + lab.toLowerCase() + ')';
const LAB_NAME = { PAT:'패턴', NUM:'수', LOG:'논리', GEO:'기하', COM:'경우의 수', PRO:'확률', DAT:'자료', STR:'전략', MOD:'모델링', RES:'연구' };

/* 이 기기에 남은 진행 기록 — 차시가 쓰는 키를 그대로 읽는다 */
const progKey = (lv, id) => 'kedu_progress_kg_math_' + lv + '_' + id;
function readProgress(lv, id) {
  try {
    const raw = localStorage.getItem(progKey(lv, id));
    if (!raw) return null;
    const p = JSON.parse(raw);
    return { done: !!p.done, score: p.score || 0 };
  } catch (e) { return null; }
}

function cardHTML(item, isLab, lv) {
  const open = !!item.file;
  const gc = labColor(item.lab);
  const p = open && !isLab ? readProgress(lv, item.id) : null;
  let meta = '<span class="lab-tag"><i></i>' + (LAB_NAME[item.lab] || item.lab) + '</span>';
  if (!open) meta += '<span class="ns-soon">준비 중</span>';
  else if (p && p.done) meta += '<span class="ns-saved">마침 · ' + p.score + '점</span>';
  else if (p) meta += '<span class="ns-saved part">풀던 중 · ' + p.score + '점</span>';
  const num = isLab ? '' : '<div class="ns-num">' + item.n + '</div>';
  const inner = num + '<div class="ns-body"><div class="ns-name">' + item.name + '</div>'
    + '<div class="ns-sub">' + item.sub + '</div>'
    + '<div class="ns-meta">' + meta + '</div></div>';
  if (!open) return '<div class="ns-card soon" style="--gc:' + gc + '">' + inner + '</div>';
  return '<a class="ns-card" style="--gc:' + gc + '" href="' + item.file + '">' + inner + '</a>';
}

function levelSection(v) {
  const n = v.lessons.filter(l => l.file).length;
  return '<h2 class="sec-h" id="lv-' + v.key + '">' + v.code + ' ' + v.name + ' · 수학</h2>'
    + '<p class="sec-sub">' + v.who + ' · ' + v.sub + '</p>'
    + '<div class="prog"><div class="prog-top"><span>이 레벨 진척</span>'
    + '<span><b id="prog-n-' + v.key + '">' + n + '</b> / ' + v.lessons.length + '</span></div>'
    + '<div class="prog-bar"><div class="prog-fill" id="prog-fill-' + v.key + '"'
    + ' style="width:' + (n / v.lessons.length * 100) + '%"></div></div></div>'
    + '<div class="lesson-grid" id="lesson-grid-' + v.key + '">'
    + v.lessons.map(l => cardHTML(l, false, v.key)).join('') + '</div>';
}

function levelChip(v) {
  const on = v.lessons.some(l => l.file);
  const inner = '<i></i>' + v.code + ' <b>' + v.name + '</b> ' + (on ? '열림' : '준비 중');
  return on ? '<a class="lv-chip on" href="#lv-' + v.key + '">' + inner + '</a>'
            : '<span class="lv-chip">' + inner + '</span>';
}

function render() {
  document.getElementById('lv-row').innerHTML = LEVELS.map(levelChip).join('');
  document.getElementById('levels').innerHTML = openLevels().map(levelSection).join('');
  document.getElementById('lab-grid').innerHTML = LABS.map(l => cardHTML(l, true)).join('');
}
render();

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('이 기기에 남은 케이영재 기록을 모두 지웁니다. 계속할까요?')) return;
  LEVELS.forEach(v => v.lessons.forEach(l => {
    try { localStorage.removeItem(progKey(v.key, l.id)); } catch (e) {}
  }));
  render();
});
</script>
</body>
</html>

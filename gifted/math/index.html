<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이영재 수학 · K-edu</title>
<!--
  gifted/math/index.html — 트랙 허브로 넘기는 다리 (2026-08-15 · 사이클 18)

  까닭: 차시는 `gifted/math/l{n}/` 에 있고, 계승한 엔진의 goHub()가
        `../index.html` 로 되어 있어 `gifted/math/index.html` 을 찾는다.
        이 파일이 없으면 13차시 전부 뒤로가기가 404였다.
        레벨 폴더가 늘어나도(l1~l5) 이 한 장이 계속 받아 준다.

  ⚠ 다음에 차시 빌더를 손댈 일이 있으면 엔진의 goHub 경로를
     `../../index.html` 로 바로잡을 것. 그때 이 파일은 「직접 주소를 친 사람」
     만 받는 예비 다리로 남는다 (지워도 되지만 두는 편이 안전하다).
-->
<meta http-equiv="refresh" content="0; url=/gifted/">
<link rel="canonical" href="/gifted/">
<script>location.replace('/gifted/');</script>
<style>
  :root{ --paper:#F6FBF7; --ink:#1F3830; --ink-soft:#5C7A6E; --line:#DCEAE0; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:var(--paper); color:var(--ink);
        font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif; padding:24px; }
  .b{ text-align:center; }
  .k{ font-size:14px; letter-spacing:.14em; color:var(--ink-soft); margin-bottom:10px; }
  h1{ font-size:22px; font-weight:400; margin:0 0 18px; }
  a{ display:inline-block; padding:11px 26px; border:2px solid var(--line); border-radius:999px;
     background:#fff; color:var(--ink); text-decoration:none; font-size:16px; }
</style>
</head>
<body>
  <div class="b">
    <div class="k">K-GIFTED</div>
    <h1>케이영재로 이동하고 있어요</h1>
    <a href="/gifted/">바로 가기</a>
  </div>
</body>
</html>

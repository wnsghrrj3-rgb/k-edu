<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케이모션 · 내 움직임에 화면이 반응해요</title>
<link rel="stylesheet" href="./kmotion.css">
<style>
/* ★ 허브 디자인은 여기서 수정(GPT 자리). 카드 데이터는 contents.json 에서 옴 — 마크업 구조(data-* 속성·id)는 유지 */
.intro{max-width:820px;text-align:center;color:var(--dim);line-height:1.6;margin-top:6px}
.cat{width:100%;max-width:820px;margin-top:22px}
.cat h2{font-size:1rem;color:var(--dim);font-weight:800;margin:0 0 10px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px;transition:transform .18s,border-color .18s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card b{font-size:1.15rem}.card i{font-style:normal;font-size:2rem}.card small{color:var(--dim);line-height:1.45}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:.72rem;color:var(--accent);background:rgba(77,225,255,.08);border-radius:999px;padding:3px 8px}
.tag.grade{color:var(--gold);background:rgba(255,211,92,.08)}
.tag.untested{color:var(--dim);background:rgba(143,155,199,.12)}
.tools{display:flex;gap:10px;align-items:center;font-size:.85rem}
.tools a{color:var(--dim)}
</style>
</head>
<body>
<header><a href="/">← 케이에듀</a><h1>🎥 케이모션</h1><span class="tools"><a href="?mouse=1" id="mouseLink" title="카메라 없이 마우스로 시연">마우스 모드</a></span></header>
<p class="intro">카메라 앞에서 손을 흔들고, 뛰고, 기울이면 화면이 따라 반응해요.<br>영상은 이 기기 안에서만 처리되고 어디에도 보내지 않아요.</p>
<div id="hub"></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search), mouse = q.has('mouse');
  if (mouse) document.getElementById('mouseLink').replaceWith(Object.assign(document.createElement('span'), { textContent: '🖱 마우스 모드 — 카드 열면 카메라 없이 실행', style: 'color:var(--gold)' }));
  const reg = await (await fetch('./contents.json', { cache: 'no-store' })).json();
  const hub = document.getElementById('hub');
  for (const [ck, cname] of Object.entries(reg.categories)) {
    const items = reg.contents.filter(c => c.category === ck); if (!items.length) continue;
    const sec = document.createElement('section'); sec.className = 'cat'; sec.dataset.category = ck; sec.innerHTML = `<h2>${cname}</h2><div class="grid"></div>`;
    for (const c of items) {
      const a = document.createElement('a'); a.className = 'card'; a.dataset.id = c.id; a.href = (c.href || `./${c.id}.html`) + (mouse && c.engineModes.length ? '?mouse=1' : '');
      const grade = c.gradeLevels.length ? (c.gradeLevels.length === 6 ? '전학년' : c.gradeLevels[0] + '~' + c.gradeLevels[c.gradeLevels.length - 1] + '학년') : '';
      a.innerHTML = `<i>${c.icon}</i><b>${c.title}</b><small>${c.desc}</small><span class="meta">${grade ? `<span class="tag grade">${grade}</span>` : ''}${c.durationMinutes ? `<span class="tag">${c.durationMinutes}분</span>` : ''}${c.engineModes.map(m => `<span class="tag">${{ motion: '움직임', hands: '손', pose: '몸' }[m]}</span>`).join('')}${c.status === 'untested' ? '<span class="tag untested">실기기 전</span>' : ''}</span>`;
      sec.querySelector('.grid').appendChild(a);
    }
    hub.appendChild(sec);
  }
})();
</script>
</body>
</html>

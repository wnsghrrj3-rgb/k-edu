<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-MOTION 풍선 터뜨리기 · 십몇 빼기 몇</title>
<link rel="stylesheet" href="../kmotion-theme.css">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1430;color:var(--text);font-family:var(--font);overflow:hidden}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1b3a7a,#0a1430)}
#stage{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;padding:12px 16px;justify-content:center;pointer-events:none}
.stat{background:rgba(5,8,16,.6);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 16px;min-width:110px;text-align:center;backdrop-filter:blur(6px)}
.stat .t{display:block;font-size:.7rem;color:var(--dim)}.stat b{font-size:1.4rem;color:#ffd35c}
.cam{position:absolute;right:14px;bottom:14px;width:min(22vw,260px);aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.cam video{display:none}.cam canvas{width:100%;height:100%;display:block}
.cam .st{position:absolute;left:8px;bottom:6px;font-size:.72rem;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:999px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,16,.72);backdrop-filter:blur(3px);text-align:center;padding:24px}
.ov.hidden{display:none}
.ov .k{font-size:.9rem;letter-spacing:.35em;color:#4de1ff;font-weight:800}
.ov h1{font-size:3rem;font-weight:900;color:#fff;text-shadow:0 0 18px rgba(77,225,255,.5)}
.ov p{color:var(--dim);line-height:1.7;max-width:600px;font-size:1.05rem}
.ov p b{color:#fff}
.btn{background:#ffd35c;color:#2a1a00;border:0;border-radius:999px;padding:16px 46px;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(255,211,92,.3)}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.opts button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 18px;font-size:1rem;cursor:pointer;font-family:inherit}
.opts button.on{background:#4de1ff;color:#06121f;border-color:#4de1ff;font-weight:900}
a.back{position:absolute;left:16px;top:16px;color:var(--dim);text-decoration:none;z-index:5}
.quit{position:absolute;left:16px;bottom:16px;background:rgba(5,8,16,.7);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:10px 20px;font-weight:800;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="hud" id="hud"><div class="stat"><span class="t">남은 시간</span><b id="hTime">30</b></div><div class="stat"><span class="t">맞힌 문제</span><b id="hScore">0</b></div><div class="stat"><span class="t">문제</span><b id="hNo">1</b></div></div>
  <div class="cam"><video id="v" autoplay playsinline muted></video><canvas id="c" width="480" height="360"></canvas><div class="st" id="camSt">카메라 준비</div></div>
  <button class="quit" id="btnQuit">그만</button>
  <section class="ov" id="ov">
    <span class="k">K-MOTION · 1학년 수학</span><h1>🎈 풍선 터뜨리기</h1>
    <p>풍선 <b>묶음 10개</b>와 <b>낱개 풍선</b>이 떠 있어요. 손가락 끝으로 풍선을 <b>시키는 만큼</b> 터뜨린 뒤, 남은 풍선 수를 <b>답 풍선</b>에서 눌러요.<br>
    낱개를 먼저 터뜨려도 되고, 묶음 끈을 잡아 <b>10을 풀어서</b> 터뜨려도 돼요. 시간 안에 최대한 많이!</p>
    <div class="opts" id="optN"><button data-n="30" class="on">30초</button><button data-n="60">60초</button><button data-n="90">90초</button></div>
    <button class="btn" id="btnStart">시작</button>
    <p id="msg"></p>
  </section>
  <a class="back" href="../">← 케이모션</a>
</div>
<script src="../kmotion.js"></script>
<script type="module" src="./balloon.js?v=2"></script>
</body>
</html>

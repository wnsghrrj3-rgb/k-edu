<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케이모션 · 손으로 비눗방울 터뜨리기</title>
<link rel="stylesheet" href="./kmotion.css">
</head>
<body>
<header><a href="./">← 케이모션</a><h1>🫧 비눗방울 터뜨리기</h1><span></span></header>
<div class="hud"><span id="score">점수 0</span><span id="time">30초</span></div>
<div class="stage">
  <video id="v" autoplay playsinline muted></video>
  <canvas id="c" width="640" height="480"></canvas>
  <div class="overlay" id="ov"><h2>손을 흔들어 방울을 터뜨려요</h2><p>카메라 앞에 서서 올라오는 방울을 손으로 쳐 보세요. 30초 동안 몇 개나 터뜨릴까요?</p><button class="btn" id="start">시작</button></div>
</div>
<p class="note">카메라 영상은 이 기기 안에서만 처리되고 어디에도 보내지 않아요. 화면은 거울처럼 보여요.</p>
<script src="./kmotion.js"></script>
<script>
const km = KMotion.create({ video: document.getElementById('v'), canvas: document.getElementById('c'), modes: ['motion'] });
const ov = document.getElementById('ov'), sc = document.getElementById('score'), tm = document.getElementById('time');
const { ctx, W, H } = km;
let bubbles = [], pops = [], score = 0, timeLeft = 30, timer = null, playing = false;
const colors = ['#7dd3fc', '#f9a8d4', '#a7f3d0', '#fde68a', '#c4b5fd'];
function show(h, p, btn){ ov.innerHTML = `<h2>${h}</h2><p>${p}</p>` + (btn ? `<button class="btn" id="start">${btn}</button>` : ''); ov.classList.remove('hidden'); if (btn) document.getElementById('start').onclick = begin; }
async function begin(){
  if (!km.running) { show('카메라 준비 중…', '잠깐만요'); try { await km.start(); } catch (e) { show('카메라를 열 수 없어요', e.message, '다시 시도'); return; } }
  ov.classList.add('hidden'); score = 0; timeLeft = 30; bubbles = []; pops = []; playing = true;
  sc.textContent = '점수 0'; tm.textContent = '30초';
  clearInterval(timer); timer = setInterval(() => { timeLeft--; tm.textContent = timeLeft + '초'; if (timeLeft <= 0) end(); }, 1000);
}
function end(){ playing = false; clearInterval(timer); show(`끝! ${score}개 터뜨렸어요`, score >= 20 ? '대단해요! 손이 정말 빨라요' : score >= 10 ? '잘했어요! 한 번 더 해 볼까요?' : '손을 더 크게 흔들어 보세요', '다시 하기'); }
document.getElementById('start').onclick = begin;
km.onFrame = (f) => {
  km.drawCamera();
  if (!playing) return;
  if (Math.random() < 0.04 && bubbles.length < 8) bubbles.push({ x: 40 + Math.random() * (W - 80), y: H + 30, r: 28 + Math.random() * 22, vy: 1.2 + Math.random() * 1.5, col: colors[Math.random() * colors.length | 0] });
  for (const b of bubbles) {
    b.y -= b.vy;
    if (f.motion && f.motion.at(b.x, b.y, b.r) > 0.25) { b.dead = true; score++; sc.textContent = '점수 ' + score; pops.push({ x: b.x, y: b.y, r: b.r, t: 1 }); }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = b.col + '99'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x - b.r * .3, b.y - b.r * .3, b.r * .2, 0, Math.PI * 2); ctx.fillStyle = '#fffc'; ctx.fill();
  }
  bubbles = bubbles.filter(b => !b.dead && b.y > -40);
  for (const p of pops) { p.t -= 0.08; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.8 - p.t * .8), 0, Math.PI * 2); ctx.strokeStyle = `rgba(255,255,255,${p.t})`; ctx.lineWidth = 4; ctx.stroke(); }
  pops = pops.filter(p => p.t > 0);
};
</script>
</body>
</html>

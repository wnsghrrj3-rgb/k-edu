<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-MOTION 거인 나라 탈출 · 맛보기</title>
<link rel="stylesheet" href="./giant.css?v=2">
<script type="importmap">
{ "imports": {
    "three": "/labs/vendor/three185/three.module.min.js",
    "three/addons/": "/labs/vendor/three185/addons/"
} }
</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <!-- 시작 -->
  <section class="screen" id="scr-start">
    <div class="logo"><span class="k">K-MOTION</span><b>거인 나라 탈출</b><small>거인의 식탁에서 빠져나가요</small></div>
    <div class="panel">
      <div class="how">
        <div class="h"><span class="ic">↔️</span><b>몸을 옆으로</b><i>그림자·큰 과일 피하기</i></div>
        <div class="h"><span class="ic">🙌</span><b>두 손 번쩍</b><i>작은 것 뛰어넘기</i></div>
      </div>
      <div class="seg" id="modeSeg"><button data-v="camera" class="on">📷 카메라</button><button data-v="keyboard">⌨️ 키보드</button></div>
      <button class="big" id="btnStart">탈출 시작!</button>
    </div>
    <a class="back" href="../">← 케이모션</a>
  </section>

  <!-- 보정 -->
  <section class="screen hidden" id="scr-calib">
    <h2>카메라 앞에 앉아요</h2>
    <div class="calib-wrap">
      <div class="calib-cam"><canvas id="calibView"></canvas></div>
      <div class="calib-side">
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg><b id="calibNum">3</b></div>
        <p id="calibMsg">머리와 어깨가 보이게 가운데에</p>
        <button class="big ghost" id="btnCalibCancel">돌아가기</button>
      </div>
    </div>
  </section>

  <!-- 게임 HUD -->
  <section class="hud hidden" id="hud">
    <div class="top">
      <div class="stat"><span class="t">단계</span><b id="hLevel">1</b></div>
      <div class="trip"><div class="bar"><i id="hProg"></i><span id="hKid">🧒</span></div><span class="goal">🚪</span></div>
      <div class="stat"><span class="t">하트</span><b id="hLife">❤❤❤</b></div>
    </div>
    <div class="vig" id="vig"></div>
    <div class="chase hidden" id="chaseBox"><span>🍉</span><div class="cbar"><i id="chaseFill"></i></div><span>🧒</span><b>수박과의 거리</b></div>
    <div class="banner hidden" id="banner"></div>
    <div class="pop-layer" id="pops"></div>
    <div class="flash" id="flash"></div>
    <div class="cam" id="camBox"><video id="v" autoplay playsinline muted></video><canvas id="c" width="480" height="360"></canvas><div class="st" id="camSt">카메라 준비</div></div>
    <div class="pause hidden" id="pause"><h3 id="pauseTitle">잠깐 멈춤</h3><p id="pauseMsg">계속하기를 누르면 이어서 해요</p><button class="big" id="btnResume">계속하기</button><button class="big ghost" id="btnQuit">그만하기</button></div>
    <div class="dev hidden" id="dev"></div>
  </section>

  <!-- 결과 -->
  <section class="screen hidden" id="scr-result">
    <h2 id="resTitle">탈출 성공!</h2>
    <div class="stars" id="resStars">⭐⭐⭐</div>
    <div class="res-grid">
      <div><span>피한 것</span><b id="rDodge">0</b></div>
      <div><span>부딪힌 것</span><b id="rHit">0</b></div>
      <div><span>최고 연속</span><b id="rCombo">0</b></div>
    </div>
    <div class="btns"><button class="big" id="btnRetry">다시 하기</button><button class="big ghost" id="btnHome">처음 화면</button></div>
  </section>

  <div class="loading" id="loading"><div class="bar"><i id="loadBar"></i></div><span id="loadTxt">거인의 부엌으로 가는 중…</span></div>
</div>
<script src="../kmotion.js"></script>
<script type="module" src="./giant.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-MOTION 자석 핀볼 · 맛보기</title>
<link rel="stylesheet" href="../kmotion-theme.css">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070a12;color:var(--text);font-family:var(--font);overflow:hidden}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#101a2e,#070a12 70%)}
#stage{width:100%;height:100%;object-fit:contain;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;padding:12px 16px;justify-content:center;pointer-events:none}
.stat{background:rgba(5,8,16,.72);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 16px;min-width:110px;text-align:center;backdrop-filter:blur(6px)}
.stat .t{display:block;font-size:.7rem;color:var(--dim)}.stat b{font-size:1.4rem;color:#ffd35c}
.cam{position:absolute;right:14px;bottom:14px;width:min(24vw,280px);aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.cam video{display:none}.cam canvas{width:100%;height:100%;display:block}
.cam .st{position:absolute;left:8px;bottom:6px;font-size:.72rem;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:999px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,8,16,.7);backdrop-filter:blur(3px);text-align:center;padding:24px}
.ov.hidden{display:none}
.ov .k{font-size:.9rem;letter-spacing:.35em;color:#4de1ff;font-weight:800}
.ov h1{font-size:3rem;font-weight:900;color:#fff;text-shadow:0 0 18px rgba(77,225,255,.5)}
.ov p{color:var(--dim);line-height:1.7;max-width:560px}
.ov .legend{display:flex;gap:18px;margin:6px 0}
.ov .legend span{display:flex;align-items:center;gap:8px;font-weight:800}
.ov .legend i{display:inline-block;width:30px;height:30px;border-radius:50%;font-style:normal;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.n{background:#ff4d5a}.s{background:#3b7bff}
.btn{background:#4de1ff;color:#06121f;border:0;border-radius:999px;padding:16px 46px;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(77,225,255,.3)}
a.back{position:absolute;left:16px;top:16px;color:var(--dim);text-decoration:none}
.quit{position:absolute;left:16px;bottom:16px;background:rgba(5,8,16,.7);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:10px 20px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="hud" id="hud"><div class="stat"><span class="t">넣은 구슬</span><b id="hScore">0</b></div><div class="stat"><span class="t">남은 시간</span><b id="hTime">60</b></div><div class="stat"><span class="t">최고 속도</span><b id="hSpd">0</b></div></div>
  <div class="cam"><video id="v" autoplay playsinline muted></video><canvas id="c" width="480" height="360"></canvas><div class="st" id="camSt">카메라 준비</div></div>
  <button class="quit" id="btnQuit">그만</button>
  <section class="ov" id="ov">
    <span class="k">K-MOTION · 맛보기</span><h1>자석 핀볼</h1>
    <div class="legend"><span><i class="n">N</i>손바닥 = N극</span><span><i class="s">S</i>주먹·손등 = S극</span></div>
    <p>두 손이 자석이에요. 회색 <b>쇠구슬</b>은 어느 극에나 끌려오고, 빨간 머리의 <b>자석구슬</b>은 S극엔 끌려오고 N극엔 튕겨 나가요.<br>구슬을 빛나는 구멍에 넣어 봐요. 가까이 댈수록 세게 당겨요.</p>
    <button class="btn" id="btnStart">시작</button>
    <p id="msg"></p>
  </section>
  <a class="back" href="../">← 케이모션</a>
</div>
<script src="../kmotion.js"></script>
<script type="module" src="./magnet.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케이모션 과학실 · 효과 살펴보기</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1012; color: #e9edf1; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #app canvas { width: 100%; height: 100%; display: block; }
  #panel { position: fixed; left: 12px; top: 12px; width: 236px; padding: 12px 14px; border-radius: 14px; background: rgba(18, 21, 25, .78); backdrop-filter: blur(6px); font-size: 13px; line-height: 1.5; user-select: none; max-height: calc(100% - 48px); overflow: auto; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; font-weight: 700; }
  #panel h2 { font-size: 12px; margin: 10px 0 4px; font-weight: 600; color: #9fb0c2; }
  #panel label { display: flex; align-items: center; gap: 6px; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  #panel .sl { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 6px; }
  #panel input[type=range] { width: 100%; }
  #panel button, #panel select { font: inherit; color: inherit; background: #2a3038; border: 1px solid #3b434d; border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  #panel button:hover { background: #353d47; }
  #panel .btns { display: flex; flex-wrap: wrap; gap: 5px; }
  #panel .key { color: #7f8c99; font-size: 11px; margin-top: 8px; }
  #stat { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: #aab6c2; background: rgba(18, 21, 25, .6); padding: 4px 9px; border-radius: 8px; }
  .hide { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1>효과 살펴보기</h1>
  <div class="row" id="shows"></div>
  <h2>그릇</h2>
  <div class="sl"><span>끓는 세기</span><input type="range" id="sBoil" min="0" max="1" step="0.01"><span id="vBoil"></span></div>
  <div class="sl"><span>액체 높이</span><input type="range" id="sFill" min="0" max="1" step="0.01"><span id="vFill"></span></div>
  <div class="sl"><span>붓는 양</span><input type="range" id="sFlow" min="0" max="1" step="0.01"><span id="vFlow"></span></div>
  <div class="row"><label><input type="checkbox" id="cWater">따뜻한 물로 붓기</label><label><input type="checkbox" id="cShake">그릇 흔들기</label></div>
  <div class="btns" style="margin-top:6px"><button id="bBurst">구름 터뜨리기</button><button id="bDip">담그기</button></div>
  <h2>물체</h2>
  <div class="sl"><span>서리</span><input type="range" id="sFrost" min="0" max="1" step="0.01"><span id="vFrost"></span></div>
  <div class="row"><label><input type="checkbox" id="cCarry">찬 물체 들고 가기</label></div>
  <div class="btns" style="margin-top:6px"><button id="bHit1">톡</button><button id="bHit2">탁</button><button id="bHit3">쾅!</button><button id="bReset">다시 놓기</button><button id="bObj">공으로</button></div>
  <div class="row"><label><input type="checkbox" id="cSlow" checked>깨질 때 느린 동작</label></div>
  <h2>화면</h2>
  <div class="row"><select id="selCam"></select><select id="selTier"></select></div>
  <div class="key">글쇠: 1~7 효과 켜고 끄기 · Z X C = 톡 · 탁 · 쾅 · R = 다시 붙이기 · B = 구름</div>
</div>
<div id="stat"></div>
<pre id="err" class="hide" style="position:fixed;right:12px;top:12px;max-width:60%;white-space:pre-wrap;font-size:12px;color:#ffb4a8;background:rgba(40,10,10,.85);padding:8px 10px;border-radius:8px;margin:0"></pre>
<script>
  // 사람 없이 찍을 때도 오류가 화면에 보이게(헤드리스에서는 콘솔을 볼 수 없다)
  (function(){ var box = document.getElementById('err'); function show(m){ box.classList.remove('hide'); box.textContent += m + '\n'; }
    addEventListener('error', function(e){ show('오류: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
    addEventListener('unhandledrejection', function(e){ show('오류(약속): ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    var ce = console.error; console.error = function(){ show(Array.prototype.join.call(arguments, ' ').slice(0, 600)); ce.apply(console, arguments); }; })();
</script>
<script type="module" src="./fx_demo.js?v=2"></script>
</body>
</html>

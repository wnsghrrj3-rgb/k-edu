<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케이모션 과학실 · 못 해 본 실험</title>
<link rel="stylesheet" href="../kmotion-theme.css">
<link rel="stylesheet" href="./lab.css?v=18">
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }
</script>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="goggle" id="goggle"></div>
    <div class="note" id="note" style="display:none"></div>
    <div class="body-spot" id="bodySpot">내 몸</div>
    <div class="cam off" id="camBox"><video id="v" autoplay playsinline muted></video><canvas id="c" width="480" height="360"></canvas><div class="st" id="camSt">카메라 준비</div><div class="ask">손을 보여 주세요</div></div>
    <div class="tools" id="tools" style="display:none"><button id="bCam" style="display:none">📷 카메라</button><button id="bSnd">🔊 소리</button><button id="bFs">⛶ 전체 화면</button></div>
    <div class="campick" id="camPick" style="display:none">
      <div class="card">
        <div class="hd"><b>📷 카메라 설정</b><button id="camClose">다 됐어요</button></div>
        <div class="cs-body">
          <div class="cs-view"><canvas id="camPrev" width="480" height="360"></canvas><div class="cs-hand" id="camHand">카메라를 켜는 중…</div></div>
          <div class="cs-side">
            <div class="cs-h">① 카메라</div>
            <div class="list" id="camList"></div>
            <div class="cs-h">② 카메라와의 거리</div>
            <div class="cs-dist" id="camDist"></div>
            <button class="range" id="camRange">↔ 직접 맞추기</button>
          </div>
        </div>
        <p class="msg" id="camMsg"></p>
      </div>
    </div>
    <div class="dbg" id="labDbg" style="display:none"></div>
  </div>
  <section class="ov" id="ov">
    <span class="k">K-MOTION · 과학실</span>
    <h1>못 해 본 실험</h1>
    <p>진짜 과학실 실험대 앞에 서서, 선반의 기구를 손으로 집어 와 실험해요.</p>
    <div class="row">
      <button class="pick" data-mode="cam">🖐 카메라 손<small>웹캠 앞에서 손으로 집고 붓기</small></button>
      <button class="pick" data-mode="touch">👆 화면 터치<small>전자칠판 · 태블릿 · 마우스</small></button>
    </div>
    <p class="err" id="err"></p>
  </section>
  <a class="back" id="back" href="../">← 케이모션</a>
</div>
<script src="../kmotion.js"></script>
<script type="module" src="./lab.js?v=19"></script>
</body>
</html>

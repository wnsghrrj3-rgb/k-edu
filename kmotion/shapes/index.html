<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-MOTION 모양 친구가 살아나요</title>
<link rel="stylesheet" href="../kmotion-theme.css">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#bfe8ff;color:#1d2a44;font-family:var(--font, 'Pretendard','Noto Sans KR',sans-serif);overflow:hidden}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#bfe8ff}
#stage{width:100%;height:100%;object-fit:contain;display:block;touch-action:none;cursor:crosshair}
.hud{position:absolute;left:0;right:0;top:10px;display:flex;gap:10px;justify-content:center;pointer-events:none}
.stat{background:rgba(255,255,255,.85);border:3px solid #fff;border-radius:18px;padding:4px 16px;min-width:96px;text-align:center;box-shadow:0 6px 16px rgba(30,60,120,.18)}
.stat .t{display:block;font-size:.72rem;color:#6b7a99;font-weight:800}.stat b{font-size:1.5rem}
.cam{position:absolute;right:14px;bottom:14px;width:min(20vw,230px);aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cam.off{display:none}
.cam video{display:none}.cam canvas{width:100%;height:100%;display:block}
.cam .st{position:absolute;left:8px;bottom:6px;font-size:.72rem;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:999px}
.tools{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;max-width:60vw}
.tools button{background:#fff;color:#1d2a44;border:3px solid #ffd35c;border-radius:999px;padding:9px 16px;font-size:1rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 6px 14px rgba(30,60,120,.18)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(191,232,255,.92);text-align:center;padding:24px}
.ov.hidden{display:none}
.ov .k{font-size:.9rem;letter-spacing:.3em;color:#3a7bd5;font-weight:900}
.ov h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:900;color:#1d2a44}
.ov h1 span{display:inline-block;animation:bob 1.2s ease-in-out infinite}
.ov h1 span:nth-child(2){animation-delay:.2s}.ov h1 span:nth-child(3){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.ov p{color:#3b4a66;line-height:1.75;max-width:640px;font-size:1.1rem}
.ov p b{color:#e8475f}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{background:#ffd35c;color:#2a1a00;border:0;border-radius:999px;padding:16px 34px;font-size:1.25rem;font-weight:900;cursor:pointer;box-shadow:0 10px 26px rgba(255,170,40,.35);font-family:inherit}
.big.alt{background:#fff;border:3px solid #ffd35c}
a.back{position:absolute;left:16px;top:16px;color:#3b4a66;text-decoration:none;font-weight:800;z-index:5}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="hud"><div class="stat"><span class="t">동글이</span><b id="nC" style="color:#ff6b8b">0</b></div><div class="stat"><span class="t">뾰족이</span><b id="nT" style="color:#2bb673">0</b></div><div class="stat"><span class="t">네모네모</span><b id="nS" style="color:#3a7bd5">0</b></div></div>
  <div class="cam off" id="camBox"><video id="v" autoplay playsinline muted></video><canvas id="c" width="480" height="360"></canvas><div class="st" id="camSt">카메라 준비</div></div>
  <div class="tools" id="tools" style="display:none"><button id="bDance">💃 다 같이 춤춰!</button><button id="bHome">🏠 집 찾아 주기</button><button id="bClear">🧹 새 마을</button><button id="bMenu">처음으로</button></div>
  <section class="ov" id="ov">
    <span class="k">K-MOTION · 1학년 수학 · 여러 가지 모양</span>
    <h1><span>●</span><span>▲</span><span>■</span> 모양 친구가 살아나요!</h1>
    <p>허공에 <b>동그라미, 세모, 네모</b>를 그려 보세요.<br>다 그리면 모양에 눈과 팔다리가 생겨서 <b>살아나요!</b><br>
    동그라미는 데굴데굴, 세모는 콕콕, 네모는 차곡차곡 — 친구마다 노는 법이 달라요.</p>
    <div class="opts">
      <button class="big" id="bCam">📷 손가락으로 허공에 그리기</button>
      <button class="big alt" id="bTouch">👆 화면에 직접 그리기 (전자칠판)</button>
    </div>
    <p id="msg" style="font-size:.95rem">카메라: 검지 하나만 펴면 연필이 나와요. 손바닥을 쫙 펴면 그리기 끝!</p>
  </section>
  <a class="back" href="../">← 케이모션</a>
</div>
<script src="../kmotion.js"></script>
<script src="./recog.js?v=1"></script>
<script src="./shapes.js?v=1"></script>
</body>
</html>

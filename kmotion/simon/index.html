<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-MOTION 가라사대 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../upside/upside.css?v=3">
<link rel="stylesheet" href="./simon.css?v=1">
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <video id="v" autoplay playsinline muted></video>
  <canvas id="c" width="480" height="360"></canvas>

  <section class="screen" id="scr-title">
    <div class="logo"><span class="k">K-MOTION</span><h1>🧙 가라사대!</h1><small>SIMON SAYS</small></div>
    <div class="rules2">
      <div class="r ok"><b>「가라사대」가 붙으면</b><span>➜ 따라 해요 🙆</span></div>
      <div class="r no"><b>「가라사대」가 없으면</b><span>➜ 꼼짝 마! 🙅</span></div>
    </div>
    <div class="pick">
      <div class="seg big2" id="pSeg"><button data-v="1">👤 혼자</button><button data-v="2">👥 둘이</button></div>
      <div class="seg big2" id="dSeg"><button data-v="easy">🌱 쉬움</button><button data-v="normal">⭐ 보통</button><button data-v="hard">🔥 어려움</button></div>
    </div>
    <button class="big" id="btnStart">시작! ▶</button>
    <p class="best" id="bestT"></p>
    <div class="titlebar">
      <div class="seg" id="inputSeg"><button data-v="camera">📷 카메라</button><button data-v="keyboard">⌨️ 키보드</button></div>
      <span class="chip" id="camChip">카메라 준비 중…</span>
      <button class="ghostbtn" id="btnCam">📷 범위</button>
      <div class="seg" id="sMirror"><button data-v="true">🪞 거울</button><button data-v="false">↔️ 그대로</button></div>
      <div class="seg" id="sVoice"><button data-v="true">🔊 음성</button><button data-v="false">🔇</button></div>
      <div class="seg" id="sBgm"><button data-v="true">🎵 음악</button><button data-v="false">🔇</button></div>
      <button class="ghostbtn" id="btnFull">⛶</button>
      <a class="ghostbtn" href="../">← 케이모션</a>
    </div>
    <div class="sense title" id="titleSense"><div class="camwrap" id="titleCam"><div class="camst" id="camStT"></div></div></div>
    <p class="tip2">둘이 할 때는 <b>1P는 화면 왼쪽</b>, <b>2P는 오른쪽</b>에 서요</p>
  </section>

  <section class="hud hidden" id="hud">
    <div class="topbar"><span class="round" id="round">0 / 16</span><div class="cmdwrap"><div class="cmdbox2" id="cmdBox"></div><div class="tbar"><i id="timeFill"></i></div></div></div>
    <div class="mark" id="mark0"></div><div class="mark" id="mark1"></div>
    <div class="pp left" id="pp0"></div><div class="pp right" id="pp1"></div>
    <div class="sense mid" id="sense"><div class="camwrap" id="camWrap"><div class="camst" id="camSt"></div></div></div>
    <div class="keys" id="kbHelp"><b>⌨️ 1P</b> Q 왼손 · E 오른손 · Q+E 만세 · ↑ 팔 벌려 · ↓ 앉아 · H 머리 · F 박수</div>
    <div class="keys k2" id="kbHelp2"><b>⌨️ 2P</b> U 왼손 · O 오른손 · U+O 만세 · I 팔 벌려 · K 앉아 · Y 머리 · P 박수</div>
    <button class="pausebtn" id="btnPause">⏸</button>
    <div class="away hidden" id="away"><div><b>🙋 카메라 앞으로!</b><p id="awayTx"></p></div></div>
  </section>

  <section class="screen hidden" id="scr-over">
    <div class="result-card">
      <h2 id="ovTitle">끝!</h2>
      <div id="ovBody"></div>
      <div class="think"><span>💬 생각 나누기</span><p id="ovQ"></p></div>
      <div class="btns"><button class="big" id="btnAgain">한 번 더! ▶</button><button class="big ghost" id="btnHome">처음 화면</button></div>
    </div>
  </section>

  <div class="overlay hidden" id="pause"><div class="pcard"><h3>⏸ 잠깐 멈춤</h3><button class="big" id="btnResume">계속하기</button><button class="big ghost" id="btnQuit">처음 화면</button></div></div>
  <div class="loading" id="loading"><div class="lgem">🧙</div><span>마법사를 부르는 중…</span></div>
</div>
<script src="../kmotion.js"></script>
<script type="module" src="./simon.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케이모션 · 영어 동작 게임 (Robot Says)</title>
<link rel="stylesheet" href="./kmotion.css">
<style>
.stage{max-width:1000px;aspect-ratio:16/9;background:#0a0f2a}
#three{position:absolute;inset:0;width:100%;height:100%}
#pip{position:absolute;right:12px;bottom:12px;width:224px;height:168px;border-radius:12px;border:3px solid var(--line);background:#000;z-index:2}
#pip canvas{width:100%;height:100%;border-radius:10px;display:block}
#pip.ok{border-color:var(--ok)}#pip.bad{border-color:var(--danger)}
.cmd{position:absolute;left:0;right:0;top:14px;text-align:center;z-index:2;pointer-events:none}
.cmd b{display:inline-block;background:rgba(10,15,42,.75);color:#fff;font-size:2rem;padding:10px 26px;border-radius:16px;border:1px solid rgba(255,255,255,.2)}
.cmd small{display:block;margin-top:6px;color:#9fd8ff;font-size:1.1rem;font-weight:700}
.teach{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;width:100%;max-width:1000px}
.teach button,.teach label{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.9rem;cursor:pointer;font-weight:700;display:flex;gap:6px;align-items:center}
.status{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:50%;background:#888}.dot.on{background:var(--ok)}.dot.bad{background:var(--danger)}
.result{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:1rem}.result b{color:var(--gold)}
</style>
</head>
<body>
<header><a href="./">← 케이모션</a><h1>🤖 Robot Says — 영어 동작 게임</h1><span id="hdr"></span></header>
<div class="hud"><span class="big" id="score">0점</span><span id="q">0 / 10</span><span class="status"><i class="dot" id="camdot"></i><span id="camtxt">카메라 대기</span></span><span class="status"><i class="dot" id="posedot"></i><span id="posetxt">인식 대기</span></span></div>
<div class="stage" id="stage">
  <canvas id="three"></canvas>
  <div class="cmd" id="cmd"></div>
  <div id="pip"><video id="v" autoplay playsinline muted style="display:none"></video><canvas id="c" width="640" height="480"></canvas></div>
  <div class="dev hidden" id="dev"></div>
  <div class="overlay" id="ov"></div>
</div>
<div class="teach">
  <button id="repeat">🔊 다시 듣기</button><button id="pass">✅ 정답 처리(교사)</button><button id="skip">⏭ 건너뛰기</button><button id="restart">↻ 다시 시작</button><button id="fs">⛶ 전체 화면</button>
  <label><input type="checkbox" id="ko" checked> 한국어 뜻 보이기</label><label><input type="checkbox" id="pipon" checked> 카메라 창</label>
</div>
<p class="note">로봇이 영어로 말하면 그 동작을 해요. 머리부터 무릎까지 보이게 두세 걸음 떨어져 서요. 영상은 기기 안에서만 처리돼요. 카메라가 없으면 주소 뒤에 ?mouse=1 (Q/E/W/O/S 키).</p>
<script src="/kedu/teacher/vendor/three.min.js"></script>
<script src="./kmotion.js"></script>
<script src="./kmotion-data.js"></script>
<script>
const $ = id => document.getElementById(id), now = () => performance.now(), rnd = (a, b) => a + Math.random() * (b - a);
const km = KMotion.create({ video: $('v'), canvas: $('c'), modes: ['pose'], activity: 'english' });
KMotionData.attach(km, $('hdr'));
const ov = $('ov'), dev = $('dev'); if (new URLSearchParams(location.search).has('dev')) dev.classList.remove('hidden');

// ───── 명령 (영어 · 한국어 · 판정 · 로봇 시범)
const CMDS = [
  { en: 'Raise your right hand', ko: '오른손을 들어요', check: b => b.raiseR, demo: 'right' },
  { en: 'Raise your left hand', ko: '왼손을 들어요', check: b => b.raiseL, demo: 'left' },
  { en: 'Raise both hands', ko: '양손을 들어요', check: b => b.armsUp, demo: 'both' },
  { en: 'Open your arms', ko: '양팔을 벌려요', check: b => b.openArms, demo: 'open' },
  { en: 'Sit down', ko: '앉아요', check: b => b.squat, demo: 'sit' },
  { en: 'Stand up', ko: '일어서요', check: (b, ctx) => ctx.wasSquat && !b.squat, demo: 'stand', needsSit: true },
];
const TOTAL = 10;
let quiz = [], qi = -1, cur = null, holdSince = 0, qStart = 0, hinted = false, score = 0, state = 'setup', wasSquat = false, lastB = null, stats = { ok: 0, teacher: 0, skip: 0, hints: 0 };
function makeQuiz(){ const out = []; let prev = null; while (out.length < TOTAL) { let c = CMDS[Math.random() * CMDS.length | 0]; if (c.needsSit) continue; if (c === prev) continue; out.push(c); prev = c; if (c.demo === 'sit' && out.length < TOTAL) { out.push(CMDS[5]); prev = CMDS[5]; } } return out.slice(0, TOTAL); }

// ───── 음성(TTS)
const synth = window.speechSynthesis; let voiceEn = null;
function pickVoice(){ const vs = synth ? synth.getVoices() : []; voiceEn = vs.find(v => /en-US/i.test(v.lang) && /Google|Samantha|Zira|Aria/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
function say(text, lang, rate){ if (!synth) return; synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang || 'en-US'; u.rate = rate || .9; if (lang !== 'ko-KR' && voiceEn) u.voice = voiceEn; synth.speak(u); }
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(f, dur, type, g0, slide){ const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur); g.gain.setValueAtTime(g0 || .18, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02); }
const sfx = { ok: () => { tone(660, .12); setTimeout(() => tone(880, .12), 100); setTimeout(() => tone(1320, .25), 200); }, launch: () => tone(60, 2.5, 'sawtooth', .25, 400) };

// ───── Three.js 우주 훈련장 + 로봇
const renderer = new THREE.WebGLRenderer({ canvas: $('three'), antialias: true, alpha: false }); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0f2a); scene.fog = new THREE.Fog(0x0a0f2a, 18, 60);
const camera = new THREE.PerspectiveCamera(42, 16 / 9, .1, 200); camera.position.set(0, 2.4, 9); camera.lookAt(0, 1.4, 0);
scene.add(new THREE.HemisphereLight(0x9fd8ff, 0x1a1040, .9)); const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(4, 8, 6); scene.add(key); const rim = new THREE.PointLight(0x37c9e8, 1.2, 30); rim.position.set(-5, 3, -4); scene.add(rim);
// 바닥: 격자 + 발광 링
const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshStandardMaterial({ color: 0x141c3e, roughness: .9 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(28, 28, 0x37c9e8, 0x24305c); grid.position.y = .01; grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);
const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.45, 64), new THREE.MeshBasicMaterial({ color: 0x4de1ff, side: THREE.DoubleSide, transparent: true, opacity: .8 })); ring.rotation.x = -Math.PI / 2; ring.position.y = .02; scene.add(ring);
// 별
const starGeo = new THREE.BufferGeometry(); const sp = []; for (let i = 0; i < 1200; i++) { const r = 60 + Math.random() * 40, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 2 - 1); sp.push(r * Math.sin(ph) * Math.cos(th), Math.abs(r * Math.cos(ph)) * .6 + 2, r * Math.sin(ph) * Math.sin(th)); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3)); scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: .35, sizeAttenuation: true })));
// 행성
const planet = new THREE.Mesh(new THREE.SphereGeometry(6, 32, 32), new THREE.MeshStandardMaterial({ color: 0x8466f5, roughness: .7, emissive: 0x2a1a5e })); planet.position.set(-18, 12, -40); scene.add(planet);
const planetRing = new THREE.Mesh(new THREE.RingGeometry(8, 11, 64), new THREE.MeshBasicMaterial({ color: 0xc9a7ff, side: THREE.DoubleSide, transparent: true, opacity: .5 })); planetRing.position.copy(planet.position); planetRing.rotation.x = 1.2; scene.add(planetRing);
// 로봇
const M = (c, e) => new THREE.MeshStandardMaterial({ color: c, roughness: .35, metalness: .5, emissive: e || 0x000000 });
const robot = new THREE.Group(); scene.add(robot);
const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, .7), M(0xe8ecf5)); torso.position.y = 1.6; robot.add(torso);
const chest = new THREE.Mesh(new THREE.CircleGeometry(.22, 32), new THREE.MeshBasicMaterial({ color: 0x4de1ff })); chest.position.set(0, 1.75, .36); robot.add(chest);
const head = new THREE.Mesh(new THREE.SphereGeometry(.48, 32, 32), M(0xf4f6fb)); head.position.y = 2.72; robot.add(head);
const visor = new THREE.Mesh(new THREE.SphereGeometry(.3, 32, 16, 0, Math.PI * 2, 0, Math.PI * .55), M(0x171b2e, 0x0b2a3a)); visor.rotation.x = -Math.PI / 2 + .3; visor.position.set(0, 2.72, .25); robot.add(visor);
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(.06, 12, 12), new THREE.MeshBasicMaterial({ color: 0x4de1ff })); eyeL.position.set(-.1, 2.76, .5); robot.add(eyeL); const eyeR = eyeL.clone(); eyeR.position.x = .1; robot.add(eyeR);
const antenna = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .4), M(0x9ba3b5)); antenna.position.y = 3.35; robot.add(antenna); const bulb = new THREE.Mesh(new THREE.SphereGeometry(.09, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffae45 })); bulb.position.y = 3.58; robot.add(bulb);
function arm(side){ const g = new THREE.Group(); g.position.set(side * .78, 2.2, 0); const up = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .75), M(0xc9d2e3)); up.position.y = -.38; g.add(up); const low = new THREE.Group(); low.position.y = -.75; const lo = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .7), M(0xe8ecf5)); lo.position.y = -.35; low.add(lo); const hand = new THREE.Mesh(new THREE.SphereGeometry(.16, 16, 16), M(0x4865f5)); hand.position.y = -.74; low.add(hand); g.add(low); g.userData.low = low; robot.add(g); return g; }
const armL = arm(-1), armR = arm(1);
function leg(side){ const g = new THREE.Group(); g.position.set(side * .32, .9, 0); const th = new THREE.Mesh(new THREE.CylinderGeometry(.16, .14, .5), M(0xc9d2e3)); th.position.y = -.25; g.add(th); const sh = new THREE.Group(); sh.position.y = -.5; const s = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, .45), M(0xe8ecf5)); s.position.y = -.22; sh.add(s); const ft = new THREE.Mesh(new THREE.BoxGeometry(.3, .14, .5), M(0x4865f5)); ft.position.set(0, -.5, .1); sh.add(ft); g.add(sh); g.userData.sh = sh; robot.add(g); return g; }
const legL = leg(-1), legR = leg(1);
// 우주선
const rocket = new THREE.Group(); rocket.position.set(5.5, 0, -3); scene.add(rocket);
const body = new THREE.Mesh(new THREE.CylinderGeometry(.6, .7, 3.2, 24), M(0xf4f6fb)); body.position.y = 2.2; rocket.add(body);
const nose = new THREE.Mesh(new THREE.ConeGeometry(.6, 1.2, 24), M(0xf1646c)); nose.position.y = 4.4; rocket.add(nose);
for (let i = 0; i < 3; i++) { const fin = new THREE.Mesh(new THREE.BoxGeometry(.1, 1, .8), M(0xf1646c)); const a = i * Math.PI * 2 / 3; fin.position.set(Math.cos(a) * .75, .9, Math.sin(a) * .75); fin.rotation.y = -a; rocket.add(fin); }
const win = new THREE.Mesh(new THREE.CircleGeometry(.22, 24), new THREE.MeshBasicMaterial({ color: 0x37c9e8 })); win.position.set(0, 2.9, .71); rocket.add(win);
const flame = new THREE.Mesh(new THREE.ConeGeometry(.5, 1.6, 20), new THREE.MeshBasicMaterial({ color: 0xffae45, transparent: true, opacity: .9 })); flame.rotation.x = Math.PI; flame.position.y = -.2; flame.visible = false; rocket.add(flame);
const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.6, .3, 24), M(0x24305c)); pad.position.set(5.5, .15, -3); scene.add(pad);
// 성공 입자
const pGeo = new THREE.BufferGeometry(); const pPos = new Float32Array(300 * 3); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); const parts = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xffd35c, size: .14, transparent: true })); parts.visible = false; scene.add(parts); let pVel = [], pLife = 0;
function confetti(){ for (let i = 0; i < 300; i++) { pPos[i * 3] = 0; pPos[i * 3 + 1] = 2; pPos[i * 3 + 2] = 0; const a = rnd(0, Math.PI * 2), s = rnd(.04, .16); pVel[i] = [Math.cos(a) * s, rnd(.08, .22), Math.sin(a) * s]; } pLife = 1; parts.visible = true; }

// 로봇 자세(목표값으로 부드럽게)
const pose = { armL: 0, armR: 0, spreadL: 0, spreadR: 0, squat: 0, cheer: 0 }, target = Object.assign({}, pose);
function setDemo(d){ Object.assign(target, { armL: 0, armR: 0, spreadL: 0, spreadR: 0, squat: 0 }); if (d === 'right') target.armR = 1; if (d === 'left') target.armL = 1; if (d === 'both') { target.armL = target.armR = 1; } if (d === 'open') { target.spreadL = target.spreadR = 1; } if (d === 'sit') target.squat = 1; }
function animate(dt, t){ for (const k in target) pose[k] += (target[k] - pose[k]) * Math.min(1, dt * 6);
  const bob = Math.sin(t / 600) * .04; robot.position.y = bob - pose.squat * .55; robot.rotation.y = Math.sin(t / 2600) * .08;
  armR.rotation.z = -pose.armR * 2.9 - pose.spreadR * 1.5; armL.rotation.z = pose.armL * 2.9 + pose.spreadL * 1.5; armR.userData.low.rotation.z = -pose.armR * .2; armL.userData.low.rotation.z = pose.armL * .2;
  if (pose.cheer > .01) { const w = Math.sin(t / 90) * .5 * pose.cheer; armR.rotation.z = -2.9 + w; armL.rotation.z = 2.9 - w; pose.cheer *= .97; }
  legL.rotation.x = legR.rotation.x = -pose.squat * 1.1; legL.userData.sh.rotation.x = legR.userData.sh.rotation.x = pose.squat * 1.6; torso.scale.y = 1 - pose.squat * .1;
  bulb.material.color.setHex(state === 'play' && cur && holdSince ? 0x5cf2a4 : 0xffae45);
  if (pLife > 0) { pLife -= dt * .6; for (let i = 0; i < 300; i++) { pPos[i * 3] += pVel[i][0]; pPos[i * 3 + 1] += pVel[i][1]; pPos[i * 3 + 2] += pVel[i][2]; pVel[i][1] -= .006; } pGeo.attributes.position.needsUpdate = true; parts.material.opacity = Math.max(0, pLife); if (pLife <= 0) parts.visible = false; }
  if (state === 'launch') { launchT += dt; flame.visible = true; flame.scale.set(1 + Math.random() * .3, 1 + Math.random() * .5, 1); rocket.position.y = Math.pow(Math.max(0, launchT - .8), 2) * 2.2; rocket.rotation.z = Math.sin(launchT * 7) * .02; camera.position.y = 2.4 + rocket.position.y * .35; camera.lookAt(rocket.position.x * .6, 1.4 + rocket.position.y * .6, -1); if (launchT > 5 && state === 'launch') finish(); }
  renderer.render(scene, camera); }
let launchT = 0;
function resize(){ const r = $('stage').getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); } addEventListener('resize', resize); resize();

// ───── 문제 진행
function nextQ(){ qi++; if (qi >= TOTAL) return launch(); cur = quiz[qi]; holdSince = 0; hinted = false; qStart = now(); setDemo(null); $('q').textContent = `${qi + 1} / ${TOTAL}`; showCmd(); say(cur.en); km.emit('english:ask', { cmd: cur.en, index: qi }); }
function showCmd(){ $('cmd').innerHTML = `<b>${cur.en}</b>${$('ko').checked || hinted ? `<small>${cur.ko}</small>` : ''}`; }
function correct(how){ if (state !== 'play' || !cur) return; score += how === 'teacher' ? 5 : hinted ? 7 : 10; stats[how === 'teacher' ? 'teacher' : 'ok']++; $('score').textContent = score + '점'; sfx.ok(); confetti(); pose.cheer = 1; target.armL = target.armR = 1; setTimeout(() => { if (state === 'play') Object.assign(target, { armL: 0, armR: 0 }); }, 700);
  $('cmd').innerHTML = `<b style="background:rgba(39,185,133,.85)">Great job! 🎉</b>`; say(['Great job!', 'Perfect!', 'Excellent!', 'Well done!'][Math.random() * 4 | 0], 'en-US', 1); km.emit('english:correct', { cmd: cur.en, how, ms: Math.round(now() - qStart), score: how === 'teacher' ? .5 : 1 });
  cur = null; setTimeout(nextQ, 1500); }
function launch(){ state = 'launch'; launchT = 0; cur = null; $('cmd').innerHTML = `<b>Mission complete! 🚀 Lift off!</b>`; say('Mission complete. Three, two, one, lift off!', 'en-US', 1); sfx.launch(); km.emit('english:complete', { points: score, ...stats }); }
function finish(){ state = 'end'; ov.innerHTML = `<h2>🚀 임무 완료! ${score}점</h2><div class="result"><span>스스로 맞힘 <b>${stats.ok}</b></span><span>교사 처리 <b>${stats.teacher}</b></span><span>건너뜀 <b>${stats.skip}</b></span><span>힌트 <b>${stats.hints}</b></span></div><button class="btn gold" id="again">다시 하기</button>`; ov.classList.remove('hidden'); $('again').onclick = setup; }

// ───── 판정(프레임)
let last = 0;
km.onFrame = f => { const t = now(), dt = Math.min(.05, (t - last) / 1000 || .016); last = t;
  // PIP: 카메라 + 뼈대
  km.drawCamera(); if (f.pose) km.drawSkeleton(f.pose, km.POSE_BONES, 'rgba(92,242,164,.9)', 5);
  const b = f.actions.body, ok = !!(f.pose && b && b.ok); lastB = b;
  $('pip').className = km.running ? (ok ? 'ok' : 'bad') : ''; $('posedot').className = 'dot ' + (ok ? 'on' : km.running ? 'bad' : ''); $('posetxt').textContent = !km.running ? '인식 대기' : ok ? (b.feet < .4 ? '인식 중 (무릎까지 보이면 더 좋아요)' : '인식 중') : '몸이 안 보여요';
  if (state === 'play' && cur && ok) { if (b.squat) wasSquat = true;
    const pass = cur.check(b, { wasSquat }); if (pass) { if (!holdSince) holdSince = t; if (t - holdSince > 450) { if (cur.demo === 'stand') wasSquat = false; correct('self'); } } else holdSince = 0;
    if (!hinted && t - qStart > 7000) { hinted = true; stats.hints++; setDemo(cur.demo); showCmd(); say(cur.en); km.emit('english:hint', { cmd: cur.en }); } }
  animate(dt, t);
  if (!dev.classList.contains('hidden')) dev.textContent = `fps ${km.fps} state ${state} q ${qi} ` + (b ? `raiseL ${b.raiseL} raiseR ${b.raiseR} armsUp ${b.armsUp} open ${b.openArms} squat ${b.squat} knee ${b.knee}` : 'no body'); };

// ───── 교사 버튼·공통
$('repeat').onclick = () => cur && say(cur.en); $('pass').onclick = () => correct('teacher'); $('skip').onclick = () => { if (state === 'play' && cur) { stats.skip++; km.emit('english:skip', { cmd: cur.en, score: 0 }); cur = null; nextQ(); } };
$('restart').onclick = () => setup(); $('fs').onclick = () => { const el = $('stage'); document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); setTimeout(resize, 300); }; document.addEventListener('fullscreenchange', () => setTimeout(resize, 200));
$('ko').onchange = () => cur && showCmd(); $('pipon').onchange = e => $('pip').style.display = e.target.checked ? '' : 'none';
addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'P') $('pass').click(); if (e.key === 'n' || e.key === 'N') $('skip').click(); if (e.key === 'r' || e.key === 'R') $('repeat').click(); });
function setup(){ state = 'setup'; score = 0; qi = -1; cur = null; wasSquat = false; stats = { ok: 0, teacher: 0, skip: 0, hints: 0 }; rocket.position.set(5.5, 0, -3); flame.visible = false; camera.position.set(0, 2.4, 9); camera.lookAt(0, 1.4, 0); setDemo(null); $('score').textContent = '0점'; $('q').textContent = `0 / ${TOTAL}`; $('cmd').innerHTML = '';
  ov.innerHTML = `<h2>🤖 Robot Says</h2><p>로봇이 영어로 말하는 동작을 몸으로 해요. 10개를 해내면 우주선이 발사돼요!<br><span style="color:var(--dim)">Raise your right hand · left hand · both hands · Open your arms · Sit down · Stand up</span></p><button class="btn" id="start">훈련 시작</button>`; ov.classList.remove('hidden'); $('start').onclick = begin; }
async function begin(){ await AC.resume(); if (synth) synth.resume(); if (!km.running) { ov.innerHTML = '<h2>카메라 준비 중…</h2>'; $('camtxt').textContent = '연결 중'; try { await km.start(); $('camdot').className = 'dot on'; $('camtxt').textContent = km.mouse ? '마우스 모드' : '카메라 연결됨'; } catch (e) { $('camdot').className = 'dot bad'; $('camtxt').textContent = '카메라 실패'; ov.innerHTML = `<h2>시작할 수 없어요</h2><p>${e.message}</p><p style="color:var(--dim)">카메라 없이 해 보려면 주소 뒤에 ?mouse=1</p><button class="btn" id="b">다시</button>`; $('b').onclick = setup; return; } }
  quiz = makeQuiz(); ov.classList.add('hidden'); state = 'play'; km.emit('english:start'); say('Welcome to space training! Listen and move.', 'en-US', 1); setTimeout(nextQ, 2600); }
setup();

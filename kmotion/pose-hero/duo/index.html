<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포즈 히어로 · 둘이 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./duo.css">
</head>
<body>
<div id="app">
  <canvas id="c" width="960" height="540"></canvas>
  <video id="v" autoplay playsinline muted></video>

  <!-- 점수판 -->
  <header class="board hidden" id="board">
    <div class="team blue"><span class="tn">청팀</span><b id="sB">0</b></div>
    <div class="mid">
      <div class="round" id="round">1판</div>
      <div class="card" id="card"><span class="em" id="cEm">🙌</span><span class="nm" id="cNm">준비</span></div>
      <div class="timer"><i id="tFill"></i></div>
    </div>
    <div class="team red"><b id="sR">0</b><span class="tn">홍팀</span></div>
  </header>

  <div class="meters hidden" id="meters">
    <div class="meter blue"><span id="mBt">청팀</span><div class="bar"><i id="mB"></i></div></div>
    <div class="meter red"><div class="bar"><i id="mR"></i></div><span id="mRt">홍팀</span></div>
  </div>

  <div class="banner hidden" id="banner"></div>

  <!-- 시작 -->
  <section class="screen" id="scrMenu">
    <h1>포즈 히어로<small>둘이 대결</small></h1>
    <p class="lead">왼쪽은 청팀, 오른쪽은 홍팀. 카메라 앞에 나란히 서요.</p>
    <div class="modes">
      <button class="mode on" data-m="race"><b>먼저 하기</b><span>같은 포즈가 나오면 누가 먼저 맞추나</span></button>
      <button class="mode" data-m="copy"><b>따라 하기</b><span>한 명이 포즈를 내면, 다른 한 명이 제한 시간 안에 따라 해요</span></button>
    </div>
    <div class="row">
      <div class="seg" id="diff"><button data-v="easy">쉬움</button><button data-v="normal" class="on">보통</button><button data-v="hard">어려움</button></div>
      <div class="seg" id="len"><button data-v="short">짧게</button><button data-v="mid" class="on">보통</button><button data-v="long">길게</button></div>
    </div>
    <button class="go" id="btnGo">대결 시작</button>
    <p class="note">둘 다 상반신과 양팔이 화면에 들어오게 2m쯤 물러서요 · 바닥에 자리 표시를 해 두면 좋아요 · 영상은 저장되지 않아요</p>
    <a class="back" href="../">← 포즈 히어로</a>
  </section>

  <!-- 결과 -->
  <section class="screen hidden" id="scrEnd">
    <div class="win" id="wTeam">청팀 승리</div>
    <div class="final"><span class="blue" id="fB">0</span><i>:</i><span class="red" id="fR">0</span></div>
    <p class="lead" id="wNote"></p>
    <div class="row"><button class="go" id="btnAgain">한 판 더</button><button class="go ghost" id="btnMenu">처음으로</button></div>
  </section>
</div>
<script src="../../kmotion.js"></script>
<script type="module" src="./duo.js"></script>
</body>
</html>

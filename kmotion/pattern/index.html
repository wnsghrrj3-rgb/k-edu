<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>규칙 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../pose-hero/duo/duo.css">
<link rel="stylesheet" href="./pattern.css">
</head>
<body>
<div id="app">
  <canvas id="c" width="960" height="540"></canvas>
  <video id="v" autoplay playsinline muted></video>

  <!-- 점수판 -->
  <header class="board pt hidden" id="board">
    <div class="team blue"><span class="tn" id="tn0">청팀<em class="hearts" id="hB">❤❤❤</em></span><b id="sB">0</b></div>
    <div class="mid">
      <div class="round" id="round">1단계</div>
      <div class="timer"><i id="tFill"></i></div>
    </div>
    <div class="team red"><b id="sR">0</b><span class="tn">홍팀<em class="hearts" id="hR">❤❤❤</em></span></div>
  </header>

  <!-- 규칙 줄 -->
  <div class="strip hidden" id="strip">
    <div class="cells" id="cells"></div>
    <div class="rule" id="rule"></div>
  </div>

  <div class="banner hidden" id="banner"></div>

  <!-- 시작 -->
  <section class="screen" id="scrMenu">
    <h1>규칙 찾기<small>몸으로 대결</small></h1>
    <p class="lead">둘이면 왼쪽 청팀·오른쪽 홍팀으로 나란히, 혼자면 가운데에 서요.</p>
    <div class="modes">
      <button class="mode on" data-m="next"><b>다음은 뭘까?</b><span>규칙을 보고 빈칸에 올 것을 손으로 콕. 먼저 맞히면 2점. 갈수록 어려워져요</span></button>
      <button class="mode" data-m="body"><b>몸으로 규칙</b><span>동작 규칙을 차례대로 따라 해요. 갈수록 뒤가 가려져서 규칙을 찾아 이어 가요</span></button>
    </div>
    <p class="rule2">한 판 90초 · 하트 3개, 세 번 틀리면 탈락</p>
    <div class="row">
      <div class="seg" id="who"><button data-v="duo" class="on">둘이</button><button data-v="solo">혼자</button></div>
      <div class="seg" id="start"><button data-v="1" class="on">1단계부터</button><button data-v="3">3단계부터</button><button data-v="5">5단계부터</button></div>
    </div>
    <button class="go" id="btnGo">대결 시작</button>
    <p class="note">멀리 서도, 가까이 앉아도 돼요(어깨까지 보이게). 손을 내렸다가 풍선에 대면 눌려요 · 영상은 저장되지 않아요 · 손이 안 잡히면 글쇠로: 청팀 A·S·D / 홍팀 J·K·L</p>
    <a class="back" href="../">← 케이모션</a>
  </section>

  <!-- 결과 -->
  <section class="screen hidden" id="scrEnd">
    <div class="win" id="wTeam">청팀 승리</div>
    <div class="final"><span class="blue" id="fB">0</span><i>:</i><span class="red" id="fR">0</span></div>
    <p class="lead" id="wNote"></p>
    <div class="row"><button class="go" id="btnAgain">한 판 더</button><button class="go ghost" id="btnMenu">처음으로</button></div>
  </section>
</div>
<script src="../kmotion.js"></script>
<script type="module" src="./pattern.js"></script>
</body>
</html>

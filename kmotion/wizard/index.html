<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-MOTION : MATH WIZARD</title>
<style>
  html,body{margin:0;height:100%;background:#0e1424;overflow:hidden;touch-action:none}
  #root{position:fixed;inset:0}
  /* 엔진 캔버스: 보이지 않지만 화면 전체를 덮는 크기(마우스 모드 좌표용) — 클릭은 통과 */
  #kmc{position:fixed;inset:0;width:100vw;height:100vh;opacity:0;pointer-events:none;z-index:-1}
  #kmv{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
  #sys{position:fixed;right:1.2vw;bottom:1.2vh;z-index:20;display:flex;gap:6px;font:600 13px system-ui,sans-serif}
  #sys button{border:0;border-radius:10px;padding:.5em .8em;background:rgba(20,26,50,.8);color:#cfd6f5;cursor:pointer}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#b9c2e4;font:700 20px system-ui,sans-serif;z-index:30;background:#0e1424}
  #dev{position:fixed;left:0;right:0;bottom:0;z-index:25;font:12px ui-monospace,monospace;color:#9ff;background:rgba(0,0,0,.6);padding:3px 8px;white-space:nowrap;overflow:hidden;pointer-events:none}
</style>
<script type="importmap">
{ "imports": {
    "three": "/labs/vendor/three185/three.module.min.js",
    "three/addons/": "/labs/vendor/three185/addons/"
} }
</script>
</head>
<body>
<div id="root"></div>
<video id="kmv" playsinline muted></video>
<canvas id="kmc" width="640" height="480"></canvas>
<div id="sys"><button id="btnRange" hidden>📷 범위</button></div>
<div id="boot">마법 숲을 준비하는 중…</div>
<script src="../kmotion.js"></script>
<script type="module" src="./boot.js"></script>
</body>
</html>

<svg viewBox="0 0 1240 1754" xmlns="http://www.w3.org/2000/svg">
<rect width="1240" height="1754" fill="#FFFFFF"/>
<rect x="0" y="0" width="1240" height="24" fill="#1F2E4D"/>
<text x="100" y="120" font-family="Arial" font-size="22" font-weight="500" letter-spacing="4" fill="#1F2E4D">금성초등학교</text>
<text x="1140" y="120" text-anchor="end" font-family="Arial" font-size="22" font-weight="400" fill="#6B7686">가정통신문  제 2026 - 00 호</text>
<line x1="100" y1="150" x2="1140" y2="150" stroke="#1F2E4D" stroke-width="3"/>
<text x="620" y="300" text-anchor="middle" font-family="Arial" font-size="56" font-weight="900" letter-spacing="2" fill="#1F2733">제목을 여기에 씁니다</text>
<text x="100" y="440" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">학부모님, 안녕하십니까. 늘 학교 교육에 관심을 가져 주셔서 감사합니다.</text>
<text x="100" y="520" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">본문 첫 문단입니다. 무엇을 알리는지 한두 문장으로 먼저 쓰고,</text>
<text x="100" y="565" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">그다음 문단에 자세한 내용을 적습니다. 문장은 짧게, 한 문단에 한 가지만.</text>
<rect x="100" y="660" width="1040" height="300" rx="16" fill="#F4F6FA"/>
<text x="140" y="720" font-family="Arial" font-size="28" font-weight="800" fill="#1F2E4D">무엇을</text>
<text x="300" y="720" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">알릴 내용을 한 줄로</text>
<text x="140" y="782" font-family="Arial" font-size="28" font-weight="800" fill="#1F2E4D">언제</text>
<text x="300" y="782" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">2026년 00월 00일</text>
<text x="140" y="844" font-family="Arial" font-size="28" font-weight="800" fill="#1F2E4D">어떻게</text>
<text x="300" y="844" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">가정에서 도와주실 일</text>
<text x="140" y="906" font-family="Arial" font-size="28" font-weight="800" fill="#1F2E4D">문의</text>
<text x="300" y="906" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">담임 교사 · 교무실 000-0000</text>
<text x="100" y="1040" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">가정에서도 자녀와 함께 이야기 나누어 주시길 부탁드립니다.</text>
<text x="100" y="1085" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">감사합니다.</text>
<text x="620" y="1300" text-anchor="middle" font-family="Arial" font-size="30" font-weight="400" fill="#1F2733">2026년 00월 00일</text>
<text x="620" y="1420" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" letter-spacing="8" fill="#1F2E4D">금성초등학교장</text>
<rect x="0" y="1730" width="1240" height="24" fill="#1F2E4D"/>

</svg>

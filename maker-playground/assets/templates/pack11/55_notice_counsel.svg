<svg viewBox="0 0 1240 1754" xmlns="http://www.w3.org/2000/svg">
<rect width="1240" height="1754" fill="#FFFFFF"/>
<rect x="80" y="80" width="1080" height="120" fill="none" stroke="#4A54A8" stroke-width="3"/>
<text x="620" y="158" text-anchor="middle" font-family="Arial" font-size="44" font-weight="900" letter-spacing="6" fill="#4A54A8">학부모 상담 주간 안내</text>
<text x="100" y="290" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">학부모님, 안녕하십니까. 자녀의 학교생활을 함께 이야기 나누는 상담 주간을 아래와 같이</text>
<text x="100" y="335" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">운영합니다. 원하시는 방법과 시간을 골라 회신해 주시면 감사하겠습니다.</text>
<text x="100" y="420" font-family="Arial" font-size="28" font-weight="800" fill="#4A54A8">기간</text>
<text x="250" y="420" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">2026년 00월 00일 ~ 00월 00일</text>
<line x1="100" y1="440" x2="1140" y2="440" stroke="#E8EAF6" stroke-width="2"/>
<text x="100" y="500" font-family="Arial" font-size="28" font-weight="800" fill="#4A54A8">방법</text>
<text x="250" y="500" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">방문 상담 · 전화 상담 · 온라인 상담 가운데 선택</text>
<line x1="100" y1="520" x2="1140" y2="520" stroke="#E8EAF6" stroke-width="2"/>
<text x="100" y="580" font-family="Arial" font-size="28" font-weight="800" fill="#4A54A8">시간</text>
<text x="250" y="580" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">14:30 ~ 16:30 (20분 단위)</text>
<line x1="100" y1="600" x2="1140" y2="600" stroke="#E8EAF6" stroke-width="2"/>
<text x="100" y="660" font-family="Arial" font-size="28" font-weight="800" fill="#4A54A8">회신</text>
<text x="250" y="660" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">아래 회신표를 00월 00일까지 담임 교사에게</text>
<line x1="100" y1="680" x2="1140" y2="680" stroke="#E8EAF6" stroke-width="2"/>
<text x="100" y="860" font-family="Arial" font-size="26" font-weight="400" fill="#6B7686">상담 전에 궁금한 점을 미리 적어 오시면 더 알찬 시간이 됩니다.</text>
<text x="1140" y="960" text-anchor="end" font-family="Arial" font-size="30" font-weight="700" letter-spacing="4" fill="#1F2733">○○초등학교장</text>
<line x1="80" y1="1060" x2="1160" y2="1060" stroke="#999999" stroke-width="2"/>
<text x="620" y="1050" text-anchor="middle" font-family="Arial" font-size="22" font-weight="400" fill="#999999">✂ - - - - - - - - - - - - - - - - - - - - - 절취선 - - - - - - - - - - - - - - - - - - - - -</text>
<text x="620" y="1140" text-anchor="middle" font-family="Arial" font-size="36" font-weight="900" letter-spacing="4" fill="#1F2733">상담 신청 회신표</text>
<rect x="100" y="1190" width="1040" height="380" fill="none" stroke="#1F2733" stroke-width="2"/>
<line x1="100" y1="1266" x2="1140" y2="1266" stroke="#1F2733" stroke-width="1"/>
<rect x="100" y="1190" width="360" height="76" fill="#F4F5FA"/>
<text x="130" y="1240" font-family="Arial" font-size="26" font-weight="700" fill="#1F2733">학년 · 반 · 번호</text>
<line x1="100" y1="1342" x2="1140" y2="1342" stroke="#1F2733" stroke-width="1"/>
<rect x="100" y="1266" width="360" height="76" fill="#F4F5FA"/>
<text x="130" y="1316" font-family="Arial" font-size="26" font-weight="700" fill="#1F2733">학생 이름</text>
<line x1="100" y1="1418" x2="1140" y2="1418" stroke="#1F2733" stroke-width="1"/>
<rect x="100" y="1342" width="360" height="76" fill="#F4F5FA"/>
<text x="130" y="1392" font-family="Arial" font-size="26" font-weight="700" fill="#1F2733">상담 방법(방문 / 전화 / 온라인)</text>
<line x1="100" y1="1494" x2="1140" y2="1494" stroke="#1F2733" stroke-width="1"/>
<rect x="100" y="1418" width="360" height="76" fill="#F4F5FA"/>
<text x="130" y="1468" font-family="Arial" font-size="26" font-weight="700" fill="#1F2733">희망 날짜와 시간</text>
<line x1="100" y1="1570" x2="1140" y2="1570" stroke="#1F2733" stroke-width="1"/>
<rect x="100" y="1494" width="360" height="76" fill="#F4F5FA"/>
<text x="130" y="1544" font-family="Arial" font-size="26" font-weight="700" fill="#1F2733">학부모 이름 · 서명</text>
<line x1="460" y1="1190" x2="460" y2="1570" stroke="#1F2733" stroke-width="1"/>

</svg>

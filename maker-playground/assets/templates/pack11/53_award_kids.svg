<text x="620" y="608" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" letter-spacing="4" fill="#B8963E">책읽기왕</text>
<text x="620" y="760" text-anchor="middle" font-family="Arial" font-size="28" font-weight="400" fill="#777777">0학년 0반</text>
<text x="620" y="860" text-anchor="middle" font-family="Arial" font-size="70" font-weight="900" letter-spacing="6" fill="#3D3D3D">이 름</text>
<text x="620" y="1010" text-anchor="middle" font-family="Arial" font-size="32" font-weight="400" fill="#3D3D3D">날마다 책을 펼치고, 읽은 이야기를 친구들에게</text>

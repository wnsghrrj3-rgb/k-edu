<svg viewBox="0 0 1240 1754" xmlns="http://www.w3.org/2000/svg">
<rect width="1240" height="1754" fill="#FFFFFF"/>
<rect x="0" y="0" width="1240" height="220" fill="#2E8C7F"/>
<text x="100" y="100" font-family="Arial" font-size="24" font-weight="500" letter-spacing="2" fill="#D9F0EC">○○초등학교 · 학교 행사 안내</text>
<text x="100" y="175" font-family="Arial" font-size="52" font-weight="900" fill="#FFFFFF">2026 가을 학예회에 초대합니다</text>
<text x="100" y="330" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">학부모님, 안녕하십니까. 아이들이 한 학기 동안 준비한 무대를 함께 보아 주시길 바라며</text>
<text x="100" y="375" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">아래와 같이 학예회를 열게 되어 안내드립니다.</text>
<rect x="100" y="470" width="1040" height="84" rx="12" fill="#F1F7F6"/>
<text x="140" y="524" font-family="Arial" font-size="28" font-weight="800" fill="#2E8C7F">일시</text>
<text x="280" y="524" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">2026년 00월 00일 (0요일) 오전 10시</text>
<rect x="100" y="570" width="1040" height="84" rx="12" fill="#F1F7F6"/>
<text x="140" y="624" font-family="Arial" font-size="28" font-weight="800" fill="#2E8C7F">장소</text>
<text x="280" y="624" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">○○초등학교 강당</text>
<rect x="100" y="670" width="1040" height="84" rx="12" fill="#F1F7F6"/>
<text x="140" y="724" font-family="Arial" font-size="28" font-weight="800" fill="#2E8C7F">대상</text>
<text x="280" y="724" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">전교생 및 학부모님</text>
<rect x="100" y="770" width="1040" height="84" rx="12" fill="#F1F7F6"/>
<text x="140" y="824" font-family="Arial" font-size="28" font-weight="800" fill="#2E8C7F">준비</text>
<text x="280" y="824" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">편한 옷차림 · 실내화</text>
<text x="100" y="940" font-family="Arial" font-size="30" font-weight="800" fill="#1F2733">프로그램</text>
<line x1="100" y1="960" x2="1140" y2="960" stroke="#2E8C7F" stroke-width="3"/>
<circle cx="130" cy="1010" r="20" fill="#2E8C7F"/>
<text x="130" y="1020" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<text x="180" y="1020" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">1학년 · 동요 합창</text>
<line x1="100" y1="1050" x2="1140" y2="1050" stroke="#DDE5EF" stroke-width="1"/>
<circle cx="130" cy="1082" r="20" fill="#2E8C7F"/>
<text x="130" y="1092" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<text x="180" y="1092" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">2학년 · 리듬 악기 연주</text>
<line x1="100" y1="1122" x2="1140" y2="1122" stroke="#DDE5EF" stroke-width="1"/>
<circle cx="130" cy="1154" r="20" fill="#2E8C7F"/>
<text x="130" y="1164" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">3</text>
<text x="180" y="1164" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">3학년 · 동극 「해와 바람」</text>
<line x1="100" y1="1194" x2="1140" y2="1194" stroke="#DDE5EF" stroke-width="1"/>
<circle cx="130" cy="1226" r="20" fill="#2E8C7F"/>
<text x="130" y="1236" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">4</text>
<text x="180" y="1236" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">4학년 · 무용</text>
<line x1="100" y1="1266" x2="1140" y2="1266" stroke="#DDE5EF" stroke-width="1"/>
<circle cx="130" cy="1298" r="20" fill="#2E8C7F"/>
<text x="130" y="1308" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">5</text>
<text x="180" y="1308" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">5학년 · 합주</text>
<line x1="100" y1="1338" x2="1140" y2="1338" stroke="#DDE5EF" stroke-width="1"/>
<circle cx="130" cy="1370" r="20" fill="#2E8C7F"/>
<text x="130" y="1380" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">6</text>
<text x="180" y="1380" font-family="Arial" font-size="28" font-weight="400" fill="#1F2733">6학년 · 뮤지컬</text>
<line x1="100" y1="1410" x2="1140" y2="1410" stroke="#DDE5EF" stroke-width="1"/>
<text x="100" y="1560" font-family="Arial" font-size="26" font-weight="400" fill="#6B7686">※ 주차 공간이 부족하니 대중교통을 이용해 주세요.</text>
<text x="1140" y="1660" text-anchor="end" font-family="Arial" font-size="30" font-weight="700" letter-spacing="4" fill="#1F2733">○○초등학교장</text>

</svg>

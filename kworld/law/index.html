<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>여덟 가지 법 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#241d18}
#ov{background:rgba(26,20,16,.88)}
.pill{background:rgba(58,44,34,.88)}
#todo div{background:rgba(58,44,34,.78)}
#todo div.main{background:rgba(58,44,34,.92)}
#drum{color:#ffe7c2}
#drum i{background:linear-gradient(90deg,#ffe08a 0,#ffe08a 33%,#ff9a3c 33.3%,#ff9a3c 66%,#c2384a 66.6%,#c2384a 100%)}
#drum b{position:relative}
#drum b:before,#drum b:after{content:'';position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff6dc;z-index:2}
#drum b:before{left:33.3%}#drum b:after{left:66.6%}
#ev{position:fixed;left:50%;transform:translateX(-50%);top:52px;display:flex;gap:8px;pointer-events:none}
#ev span{border-radius:14px;padding:7px 12px;font-weight:900;font-size:18px;background:rgba(58,44,34,.82);opacity:.55;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:all .3s}
#ev span.on{opacity:1;background:#ffcf4d;color:#3a2a00;transform:scale(1.08)}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(255,250,236,.95);color:#2a1e12;border-radius:16px;padding:6px 10px;font-size:22px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none;line-height:1.15;text-align:center}
.tag:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:rgba(255,250,236,.95);border-bottom:0}
.tag .ok{color:#1e8a3a}.tag .no{color:#c0392b}.tag small{font-size:15px}
.btn{background:rgba(58,44,34,.82)}
#bAct{display:none!important}.touch #bAct.show{display:flex!important}
@media (max-width:640px){#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%}#ov h1{font-size:34px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#ev{top:96px}#ev span{font-size:15px;padding:5px 9px}#top{top:138px}#todo{top:180px}#right{gap:4px}.rb{margin-right:2px}.tag{font-size:18px}#say{white-space:normal;text-align:center;width:86vw;bottom:24%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hWho" style="display:none"></span></div>
<div id="ev"><span id="e0">👣 ?</span><span id="e1">🌾 ?</span><span id="e2">🪢 ?</span></div>
<div id="todo">
  <div class="main" id="tGoal">🥁 훔친 사람을 재판 마당 북 앞으로</div>
  <div id="tWhy">🏠 훔친 까닭 알아보기</div>
  <div id="tHurt">🤝 장터에서 다친 사람 일</div>
</div>
<div id="drum" class="band">재판 북이 세 번 울리기 전에<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="tags"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">데려가기</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>여덟 가지 법</h1>
  <p>고조선, 흙성 안 마을. 간밤에 <b>곳간 곡식</b>이 없어졌다.<br>재판 북이 세 번 울리기 전에 <b>훔친 사람을 찾아 북 앞에</b> 세운다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 빛나는 발자국·낟알을 따라간다 · 가만히 서면 살핀다<br>사람 곁에서 스페이스 = 데려가기 · V 시점 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">곳간으로</button>
</div></div>
<script type="module" src="./law.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>몰이 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#2a1c14}
#ov{background:rgba(28,18,10,.86)}
.pill{background:rgba(58,40,24,.86)}
#todo div{background:rgba(58,40,24,.78)}
#todo div.main{background:rgba(58,40,24,.92)}
#sun{color:#ffe7c2}
#sun i{background:linear-gradient(90deg,#ffe08a,#ff9a3c 55%,#c2384a 82%,#2b2450)}
#wind{pointer-events:none;display:flex;align-items:center;gap:6px}
#wind b{display:inline-block;transition:transform .6s}
#deer.got{background:#ffcf4d;color:#3a2a00}
#knap{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;display:none}
#knap i,#knap s{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
#knap s{width:26px;height:26px;border:4px solid #ffcf4d;box-sizing:border-box}
#knap i{border:4px solid #fff;box-sizing:border-box}
.btn{background:rgba(58,40,24,.82)}
@media (max-width:640px){#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#top{top:92px}#todo{top:134px}#right{gap:4px}.rb{margin-right:2px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="deer">🦌 0 / 6</span><span class="pill" id="hStone">🪨 0</span><span class="pill" id="hStick">🪵 0</span></div>
<div id="todo">
  <div class="main" id="tGoal">🔥 골짜기 횃불 사이로 사슴 떼를</div>
  <div id="tAxe">🪨 강가 돌로 주먹도끼</div>
  <div id="tFire">🔥 야영지 불씨 지키기</div>
  <div id="tFood">🫐 열매·뿌리 줍기 0/3</div>
</div>
<div id="sun" class="band">해 질 때까지<b><i></i></b></div>
<div id="right"><span class="pill" id="wind">바람 <b>➜</b></span><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="knap"><s></s><i></i></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">소리</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>몰이</h1>
  <p>구석기, 강가에 머무는 무리.<br>발자국을 따라 숲 가장자리에서 떼를 찾고, 넓은 들을 건너<br>해가 지기 전에 <b>사슴 떼를 골짜기의 횃불 사이로</b> 몬다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 땅을 누르면 동료가 그 자리에 선다 · 스페이스 소리치기<br>V 시점 바꾸기 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">나선다</button>
</div></div>
<script type="module" src="./hunt.js?v=5"></script>
</body>
</html>

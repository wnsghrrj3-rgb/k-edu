<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>케이히스토리 — 시간을 걸어서 배우기</title>
<script type="importmap">
{ "imports": {
    "three": "/labs/vendor/three185/three.module.min.js",
    "three/addons/": "/labs/vendor/three185/addons/"
} }
</script>
<style>
  :root{--ink:#1d2430;--panel:rgba(20,28,40,.78);--accent:#e8a53a;--paper:#fff8ea}
  html,body{margin:0;height:100%;overflow:hidden;background:#9ec8ef;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
  #c{position:fixed;inset:0;display:block}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#243;font-size:16px;background:#cfe3f5;z-index:20}
  #hud{position:fixed;top:12px;left:12px;background:var(--panel);padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;max-width:300px;backdrop-filter:blur(6px)}
  #hud .tag{display:inline-block;font-size:11px;background:var(--accent);color:#1b1b1b;border-radius:6px;padding:1px 7px;margin-bottom:4px;font-weight:700}
  #title{font-size:15px;font-weight:700;display:block}
  #question{opacity:.85;display:block;margin-bottom:6px}
  #goal{border-top:1px solid rgba(255,255,255,.2);padding-top:6px;color:#ffe2a8}
  #hunger{position:fixed;top:12px;right:12px;width:160px;background:var(--panel);padding:8px 10px;border-radius:10px;font-size:12px}
  #hungerwrap{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin-top:4px}
  #hungerbar{height:100%;background:#7ed37e;width:50%;transition:width .3s}
  #hungerbar.low{background:#e86a4a}
  #crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 4px #000;pointer-events:none}
  #prompt{position:fixed;left:50%;top:56%;transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:10px;font-size:14px;display:none;white-space:nowrap}
  #prompt kbd{background:#fff;color:#000;border-radius:4px;padding:0 6px;font-family:inherit;font-weight:700;margin-left:4px}
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:10px 16px;border-radius:12px;font-size:15px;display:none;max-width:80vw;text-align:center;line-height:1.5}
  #inv{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:var(--panel);padding:8px;border-radius:14px;max-width:92vw;overflow-x:auto}
  .slot{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;flex:none}
  .slot .ic{font-size:24px}.slot .ct{position:absolute;top:2px;right:5px;font-weight:700;color:var(--accent)}
  .empty{padding:14px 20px;opacity:.7;font-size:13px}
  #btns{position:fixed;right:16px;bottom:100px;display:flex;flex-direction:column;gap:10px}
  #btns button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:var(--panel);color:#fff;font-size:12px;font-weight:700;line-height:1.2}
  #actbtn{background:var(--accent)!important;color:#1b1b1b!important;font-size:14px!important}
  #stick{position:fixed;left:24px;bottom:100px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
  #hint{position:fixed;right:12px;top:72px;color:#fff;font-size:12px;background:var(--panel);padding:6px 10px;border-radius:8px;line-height:1.5}
  @media (pointer:coarse){#stick{display:block}#hint{display:none}#btns button{width:72px;height:72px}}
  #panel{display:none}
  #panel.open{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:84vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);z-index:10}
  #panel h3{margin:6px 0 10px;font-size:19px}
  #panel p{margin:6px 0;line-height:1.6;font-size:15px}
  #panel .sub{font-size:13px;opacity:.7}
  #panel .tag{display:inline-block;font-size:12px;background:var(--accent);border-radius:6px;padding:2px 8px;font-weight:700}
  .pbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .pbtns button{border:1px solid #c9bda4;background:#fff;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer}
  .pbtns button.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
  .recipes{display:flex;flex-direction:column;gap:8px}
  .recipe{text-align:left;border:1px dashed #c9bda4;background:#fff;border-radius:12px;padding:10px 14px;font-size:16px;cursor:pointer;opacity:.55}
  .recipe.ok{opacity:1;border-style:solid;border-color:var(--accent)}
  .recipe small{display:block;font-size:12px;opacity:.7;margin-top:2px}
  .why .facts{margin-top:12px;border-top:1px solid #e2d8c2;padding-top:10px;font-size:13px;line-height:1.7;opacity:.85}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .opt{text-align:left;border:1px solid #c9bda4;background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  textarea{width:100%;box-sizing:border-box;border:1px solid #c9bda4;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;margin-top:8px}
  .npc b{display:block;color:#8a5a12;margin-bottom:4px}
  #back{position:fixed;left:12px;bottom:14px;color:#fff;text-decoration:none;font-size:12px;opacity:.7}
  @media (pointer:coarse){#back{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">시간을 거슬러 가는 중…</div>
<div id="hud"><span class="tag">케이히스토리 · WORLD 01</span><span id="title"></span><span id="question"></span><div id="goal"></div></div>
<div id="hunger"><span id="hungerlabel">배부름</span><div id="hungerwrap"><div id="hungerbar"></div></div></div>
<div id="hint">이동 W A S D · 둘러보기 드래그<br>행동 <b>E</b> · 만들기 <b>C</b> · 시점 <b>V</b></div>
<div id="crosshair"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="btns"><button id="actbtn">행동</button><button id="craftbtn">만들기</button><button id="viewbtn">시점</button></div>
<div id="stick"><div id="knob"></div></div>
<div id="inv"></div>
<div id="panel"></div>
<a id="back" href="/">← 케이에듀</a>
<script type="module">
import { Game } from './core/game.js';
const era = new URLSearchParams(location.search).get('era') || 'paleo';
new Game(`./eras/${era}/`).start().catch((e) => { document.getElementById('load').textContent = '불러오지 못했어: ' + e; console.error(e); });
</script>
</body>
</html>

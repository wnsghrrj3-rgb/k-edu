<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<title>케이히스토리 — 시간을 걸어서 배우기</title>
<script type="importmap">
{ "imports": {
    "three": "/labs/vendor/three185/three.module.min.js",
    "three/addons/": "/labs/vendor/three185/addons/"
} }
</script>
<style>
  :root{--ink:#1d2430;--panel:rgba(22,27,30,.72);--panel2:rgba(22,27,30,.86);--line:rgba(236,208,150,.22);--accent:#e9b65b;--accent2:#f5d68a;--paper:#f7f1e3;--serif:"Gowun Batang","Nanum Myeongjo",serif;--sans:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1214;font-family:var(--sans);touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
  #c{position:fixed;inset:0;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(10,14,16,.28) 100%)}
  /* 로딩 */
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#efe3c7;font-family:var(--serif);font-size:17px;letter-spacing:.5px;background:radial-gradient(ellipse at 50% 40%,#2a3a3f 0%,#121a1d 60%,#0b0f11 100%);z-index:30}
  #load::before{content:"";width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(233,182,91,.25);border-top-color:var(--accent);animation:spin 1.1s linear infinite}
  #load::after{content:"KEDU WORLD · HISTORY";font-family:var(--sans);font-size:10px;letter-spacing:4px;color:rgba(233,182,91,.7)}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 시대 진입 자막 */
  #intro{position:fixed;inset:0;z-index:25;pointer-events:none;display:none;background:linear-gradient(rgba(6,9,11,.85),rgba(6,9,11,0) 26%,rgba(6,9,11,0) 74%,rgba(6,9,11,.85))}
  #intro.on{display:flex;align-items:center;justify-content:center;flex-direction:column;animation:introFade 3.6s ease forwards}
  #intro .k{font-size:11px;letter-spacing:5px;color:var(--accent);margin-bottom:14px;animation:rise 1.2s ease both}
  #intro .t{font-family:var(--serif);font-weight:700;font-size:clamp(34px,6vw,64px);letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.6);animation:rise 1.4s .15s ease both}
  #intro .q{font-family:var(--serif);font-size:clamp(14px,2vw,19px);color:#e9dfc7;margin-top:14px;opacity:.9;animation:rise 1.6s .35s ease both}
  #intro .rule{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-top:18px;animation:rise 1.6s .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes introFade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
  /* 왼쪽 여정 카드 */
  #journey{position:fixed;left:20px;top:20px;width:290px;display:grid;gap:10px}
  #hud,#mission{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.5;backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06)}
  #hud .tag,#mission .tag{display:inline-block;font-size:10px;letter-spacing:2.4px;color:var(--accent);margin-bottom:8px;font-weight:400}
  #title{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.5px;display:block;margin-bottom:4px}
  #question{display:block;font-size:12px;color:#d9dfd6;margin-bottom:8px;font-family:var(--serif)}
  #goal{border-top:1px solid rgba(255,255,255,.1);padding-top:8px;color:#f2dfb2;font-size:12px;line-height:1.65}
  #mission{cursor:pointer;transition:box-shadow .3s,border-color .3s}
  #mission.flash{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,182,91,.35),0 10px 30px rgba(0,0,0,.25)}
  #mission .tag{color:#cbe3ad}
  #mission b{display:block;font-size:15px;font-family:var(--serif)}
  #compass{display:none;align-items:center;gap:8px;margin-top:8px;font-size:12px;opacity:.9}
  #carrow{display:inline-block;font-size:18px;color:var(--accent);transition:transform .2s}
  /* 오른쪽 */
  #minimap{position:fixed;right:22px;top:18px;width:168px;height:168px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));pointer-events:none}
  #hunger{position:fixed;top:199px;right:22px;width:140px;background:var(--panel);border:1px solid var(--line);padding:11px 14px;border-radius:14px;font-size:12px;backdrop-filter:blur(10px)}
  #hungerwrap{height:6px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;margin-top:6px}
  #hungerbar{height:100%;background:linear-gradient(90deg,#8fd08a,#d6e68a);width:50%;transition:width .3s}
  #hungerbar.low{background:linear-gradient(90deg,#e86a4a,#f3a05a)}
  #hint{position:fixed;right:22px;top:264px;color:#dde4dc;font-size:11px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:12px;line-height:1.8;backdrop-filter:blur(10px)}
  #hint b{color:var(--accent2)}
  /* 가운데 */
  #crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.5);pointer-events:none}
  #prompt{position:fixed;left:50%;top:57%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:14px;font-size:14px;display:none;max-width:80vw;text-align:center;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #prompt:has(.act){border-color:var(--accent);box-shadow:0 0 0 1px rgba(233,182,91,.35),0 10px 30px rgba(0,0,0,.35)}
  #prompt .what{display:block;font-size:14px}#prompt .near{display:block;font-size:11px;opacity:.7;margin-top:3px}
  #prompt .act{font-size:16px;font-family:var(--serif)}#prompt .how{font-size:12px;opacity:.85;margin-top:4px}
  #prompt kbd{background:var(--accent);color:#1b1b1b;border-radius:5px;padding:0 7px;font-family:inherit;font-weight:700;margin-left:4px}
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-size:15px;display:none;max-width:80vw;text-align:center;line-height:1.55;font-family:var(--serif);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  /* 주머니 */
  #inv{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:8px;border-radius:18px;max-width:92vw;overflow-x:auto;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .slot{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);border-radius:12px;color:#fff;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;flex:none;transition:transform .15s,border-color .15s;font-family:inherit}
  .slot:hover{transform:translateY(-2px);border-color:var(--accent)}
  .slot .ic{font-size:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}.slot .ct{position:absolute;top:2px;right:6px;font-weight:700;color:var(--accent)}
  .empty{padding:14px 20px;opacity:.6;font-size:13px;font-family:var(--serif)}
  /* 버튼·조이스틱 */
  #btns{position:fixed;right:20px;bottom:100px;display:flex;flex-direction:column;gap:8px}
  #btns button{width:58px;height:58px;border-radius:50%;border:1px solid rgba(236,208,150,.4);background:var(--panel2);color:#fff;font-size:12px;font-weight:700;line-height:1.2;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);backdrop-filter:blur(8px);font-family:inherit;transition:transform .12s,border-color .2s}
  #btns button:hover{border-color:var(--accent);transform:scale(1.05)}
  #btns button:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #actbtn{background:linear-gradient(180deg,#f3cd7a,#dfa53f)!important;color:#1b1b1b!important;font-size:14px!important;border-color:#f7dfa8!important;box-shadow:0 6px 20px rgba(233,182,91,.35)!important}
  #hintbtn.pulse{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,182,91,.9)}50%{box-shadow:0 0 0 12px rgba(233,182,91,0)}}
  #stick{position:fixed;left:24px;bottom:100px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);display:none;backdrop-filter:blur(4px)}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #back{position:fixed;left:20px;bottom:24px;color:#fff;text-decoration:none;font-size:12px;opacity:.6;letter-spacing:.3px}
  #back:hover{opacity:1}
  /* 종이 패널(왜·확인·만들기·대화) */
  #panel{display:none}
  #panel.open{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:84vh;overflow:auto;background:linear-gradient(180deg,#fbf6ea,#f3ecdb);color:var(--ink);border-radius:20px;padding:24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(150,120,70,.18);z-index:10;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  #panel h3{margin:8px 0 12px;font-size:21px;font-family:var(--serif);letter-spacing:-.3px}
  #panel p{margin:6px 0;line-height:1.7;font-size:15px}
  #panel .sub{font-size:13px;opacity:.7}
  #panel .tag{display:inline-block;font-size:11px;letter-spacing:2px;color:#9a6a1c;font-weight:700}
  .pbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .pbtns button{border:1px solid #cbbf9f;background:#fff;border-radius:12px;padding:10px 18px;font-size:14px;cursor:pointer;font-family:inherit}
  .pbtns button.primary{background:linear-gradient(180deg,#f3cd7a,#dfa53f);border-color:#dfa53f;font-weight:700}
  .recipes{display:flex;flex-direction:column;gap:8px}
  .recipe{text-align:left;border:1px dashed #cbbf9f;background:#fff;border-radius:14px;padding:11px 14px;font-size:16px;cursor:pointer;opacity:.55;font-family:inherit}
  .recipe.ok{opacity:1;border-style:solid;border-color:var(--accent);box-shadow:0 2px 10px rgba(233,182,91,.25)}
  .recipe small{display:block;font-size:12px;opacity:.7;margin-top:2px}
  .why .facts{margin-top:14px;border-top:1px solid #e2d8c2;padding-top:10px;font-size:13px;line-height:1.7;opacity:.85}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .opt{text-align:left;border:1px solid #cbbf9f;background:#fff;border-radius:14px;padding:12px 14px;font-size:15px;cursor:pointer;font-family:inherit;transition:border-color .15s,transform .1s}
  .opt:hover{border-color:var(--accent);transform:translateX(2px)}
  textarea{width:100%;box-sizing:border-box;border:1px solid #cbbf9f;border-radius:12px;padding:10px;font-size:15px;font-family:inherit;margin-top:8px;background:#fff}
  .npc b{display:block;color:#8a5a12;margin-bottom:4px;font-family:var(--serif);font-size:17px}
  .mlist{padding-left:18px;line-height:1.9;font-size:15px}.mlist .done{opacity:.55}.mlist .now{font-weight:700}.mhint{font-weight:400;font-size:13px;background:#fff;border-radius:8px;padding:6px 10px;margin:2px 0 6px;line-height:1.5}
  @media (pointer:coarse){#stick{display:block}#hint{display:none}#back{display:none}#btns button{width:72px;height:72px}}
  @media(max-width:700px){
    #journey{top:10px;left:10px;width:min(255px,calc(100vw - 145px));gap:6px}
    #hud,#mission{padding:9px 11px;border-radius:12px}
    #title{font-size:16px}#question{font-size:11px}#goal{font-size:11px}
    #minimap{display:none}#hunger{right:10px;top:10px;width:95px;padding:8px}
    #hint{display:none}#btns{right:10px}
  }
  @media(max-height:540px){#question,#goal{display:none}#journey{gap:6px}#hud,#mission{padding:8px 12px}#btns{bottom:86px;gap:5px}#btns button{width:48px;height:48px}#minimap{width:115px;height:115px}#hunger{top:140px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="load">시간을 거슬러 가는 중…</div>
<div id="intro"><div class="k">KEDU WORLD · HISTORY</div><div class="t"></div><div class="q"></div><div class="rule"></div></div>
<div id="journey"><div id="hud"><span class="tag" id="eratag">KEDU WORLD</span><span id="title"></span><span id="question"></span><div id="goal"></div></div>
<div id="mission" title="할 일 목록 (M)"><span class="tag">할 일 <span id="mcount"></span></span><b id="mtitle"></b><div id="compass"><span id="carrow">➤</span><span id="cname"></span><span id="cdist"></span></div></div>
</div>
<canvas id="minimap" aria-label="야영지와 현재 위치 지도"></canvas>
<div id="hunger"><span id="hungerlabel">배부름</span><div id="hungerwrap"><div id="hungerbar"></div></div></div>
<div id="hint">이동 W A S D · 둘러보기 드래그<br>행동 <b>E</b> · 만들기 <b>C</b> · 힌트 <b>H</b> · 할 일 <b>M</b> · 시점 <b>V</b></div>
<div id="crosshair"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="btns"><button id="actbtn">행동</button><button id="craftbtn">만들기</button><button id="viewbtn">시점</button><button id="hintbtn">힌트</button></div>
<div id="stick"><div id="knob"></div></div>
<div id="inv"></div>
<div id="panel"></div>
<a id="back" href="/">← 케이에듀</a>
<script type="module">
import { Game } from './core/game.js';
const era = new URLSearchParams(location.search).get('era') || 'paleo';
new Game(`./eras/${era}/`).start().catch((e) => { document.getElementById('load').textContent = '불러오지 못했어: ' + e; console.error(e); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>벽란도 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#16242c}
#ov{background:rgba(12,22,30,.88)}
.pill{background:rgba(24,52,66,.88)}
#todo div{background:rgba(24,52,66,.78)}
#todo div.main{background:rgba(24,52,66,.92)}
#tide{color:#d8f0ff}
#tide i{background:linear-gradient(90deg,#3a9ad8,#5ab8e8 50%,#e8c87a 85%,#c2384a)}
#slots{position:fixed;left:50%;transform:translateX(-50%);top:52px;display:flex;gap:6px;pointer-events:none}
#slots span{width:42px;height:42px;border-radius:10px;background:rgba(24,52,66,.8);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 3px 0 rgba(0,0,0,.25);border:2px dashed rgba(255,255,255,.3)}
#slots span.on{background:#ffcf4d;border:2px solid #fff;transform:scale(1.05)}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(255,250,236,.95);color:#2a1e12;border-radius:16px;padding:5px 10px 7px;font-size:22px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none;line-height:1.15;text-align:center}
.tag:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:rgba(255,250,236,.95);border-bottom:0}
.tag .wait{display:block;width:70px;height:7px;border-radius:4px;background:rgba(0,0,0,.15);overflow:hidden;margin:4px auto 0}
.tag .wait i{display:block;height:100%;background:#3aa860}
.tag .ok{color:#1e8a3a}.tag .no{color:#c0392b}.tag small{font-size:14px;color:#6a5a4a}
.btn{background:rgba(24,52,66,.82)}
#bAct{display:none!important}.touch #bAct.show{display:flex!important}
@media (max-width:900px){body #mis{top:104px}}
@media (max-width:640px){#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%;white-space:normal;text-align:center;width:86vw}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#slots{top:96px}#slots span{width:34px;height:34px;font-size:19px}#top{top:140px}#todo{top:182px}body #mis{top:184px}#right{gap:4px}.rb{margin-right:2px}.tag{font-size:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hSilver">🪙 2</span><span class="pill" id="hCarry">손 비었음</span></div>
<div id="slots"><span></span><span></span><span></span><span></span><span></span></div>
<div id="todo">
  <div class="main" id="tGoal">⛵ 물이 빠지기 전에 내 배 다섯 칸</div>
  <div id="tCel">🏺 언덕 가마의 청자를 깨지 않고</div>
  <div id="tName">🌏 아라비아 상인에게 「고려」</div>
  <div id="tBottle">⚱ 은병으로 큰 거래</div>
</div>
<div id="tide" class="band">물때 — 배가 떠날 때까지<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="tags"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">은 올리기</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>벽란도</h1>
  <p>고려, 예성강 나루. 송·왜·아라비아 배가 들어왔다.<br>물이 빠져 배가 떠나기 전에 <b>내 배 다섯 칸</b>을 바깥 물건으로 채운다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기(청자를 들고 뛰면 깨진다) · 가만히 서면 집고·건넨다<br>저울 앞에서 스페이스 = 은 한 닢 올리기, 가만히 서면 셈 · V 시점 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">나루로</button>
</div></div>
<script type="module" src="./port.js?v=3"></script>
</body>
</html>

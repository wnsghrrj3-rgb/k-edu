<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>그믐밤 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
#moon{transition:background .3s,color .3s;pointer-events:none}
#moon.out{background:#eef3ff;color:#1a2a4a}
#moon.soon{background:#6c7bb0}
#dawn{position:fixed;left:50%;transform:translateX(-50%);top:14px;width:min(38vw,360px);pointer-events:none;text-align:center;font-size:12px;font-weight:700;color:#cfe0ff}
#dawn b{display:block;height:10px;border-radius:6px;background:rgba(10,20,40,.7);overflow:hidden;margin-top:3px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#dawn i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5a78d8,#ffb45a 78%,#fff0b8)}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(255,250,236,.95);color:#2a1e12;border-radius:14px;padding:5px 10px 7px;font-size:16px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none}
.tag:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:rgba(255,250,236,.95);border-bottom:0}
#mpop{z-index:5}
@media (max-width:640px){.tag{font-size:13px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hStone">🪨 3</span><span class="pill" id="hLimp" style="display:none"></span></div>
<div id="todo">
  <div class="main" id="tLamp">🏮 강 건너 나루의 등불까지</div>
  <div id="tDoc">📜 안채의 노비 문서 태우기</div>
  <div id="tCloth">👘 빨랫줄의 상민 옷 입기</div>
  <div id="tRice">🍙 부엌의 주먹밥(뱃삯)</div>
</div>
<div id="dawn">새벽 종(파루)까지<b><i></i></b></div>
<div id="right"><span class="pill" id="moon">☁️ 구름</span><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="eye"><i></i></div>
<div class="bar" id="work"><i></i></div>
<div id="say"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>그믐밤</h1>
  <p>조선, 어느 양반집 행랑채.<br>오늘 밤 달아난다. <b>강 건너 나루의 등불</b>까지.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기(소리 남) · 땅을 누르면 돌 던지기<br>V 시점 바꾸기 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">달아난다</button>
</div></div>
<script type="module" src="./night.js?v=9"></script>
</body>
</html>

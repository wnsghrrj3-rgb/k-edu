<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>그믐밤 — 케이월드</title>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<style>
html{background:#0b1730}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 60px rgba(190,20,20,0);transition:box-shadow .12s linear}
.pill{background:rgba(22,44,78,.88);border-radius:999px;padding:8px 14px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#top{position:fixed;left:14px;top:14px;display:flex;gap:8px;align-items:center;pointer-events:none}
#todo{position:fixed;left:14px;top:60px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#todo div{background:rgba(22,44,78,.78);border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px;opacity:.72;transition:all .3s}
#todo div.on{background:#ffcf4d;color:#3a2a00;opacity:1}
#todo div.main{opacity:1;background:rgba(22,44,78,.92)}
#right{position:fixed;right:14px;top:14px;display:flex;gap:8px;align-items:center}
#moon{transition:background .3s,color .3s;pointer-events:none}
#moon.out{background:#eef3ff;color:#1a2a4a}
#moon.soon{background:#6c7bb0}
#bView,.rb{border:0;color:#fff;font-family:inherit;cursor:pointer}
.rb{margin-right:6px;padding:8px 12px}
#dawn{position:fixed;left:50%;transform:translateX(-50%);top:14px;width:min(38vw,360px);pointer-events:none;text-align:center;font-size:12px;font-weight:700;color:#cfe0ff}
#dawn b{display:block;height:10px;border-radius:6px;background:rgba(10,20,40,.7);overflow:hidden;margin-top:3px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#dawn i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5a78d8,#ffb45a 78%,#fff0b8)}
#say{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);background:rgba(14,24,44,.86);border-radius:16px;padding:11px 20px;font-size:19px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#goal{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff6c4 0,#ffb53a 45%,rgba(255,160,40,0) 72%);pointer-events:none;display:none;animation:pul 1.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.5)}}
.bar{position:fixed;width:60px;height:10px;margin:-5px 0 0 -30px;border-radius:6px;background:rgba(0,0,0,.6);overflow:hidden;pointer-events:none;display:none}
#eye i{display:block;height:100%;width:0;background:#ff5a3c}
#work i{display:block;height:100%;width:0;background:#ffcf4d}
.btn{position:fixed;bottom:26px;width:86px;height:86px;border-radius:50%;border:0;background:rgba(22,44,78,.82);color:#fff;font-weight:800;font-size:18px;font-family:inherit;display:none;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#bRun{right:22px}
#stick{position:fixed;left:26px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(22,44,78,.5);display:none}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.7)}
.touch .btn{display:flex}.touch #stick{display:block}
#ov{position:fixed;inset:0;background:rgba(6,12,28,.88);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:auto}
#ov .box{max-width:560px}
#ov h1{font-size:46px;margin:0 0 10px;letter-spacing:.04em}
#ov p{font-size:19px;line-height:1.6;margin:8px 0;color:#dfe8fb}
#ov .marks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
#ov .marks span{border-radius:12px;padding:8px 12px;font-size:15px;font-weight:800;background:rgba(255,255,255,.1)}
#ov .marks span.ok{background:#ffcf4d;color:#3a2a00}
#ov .fact{font-size:15px;line-height:1.65;color:#ffdf9a;border-top:1px solid rgba(255,255,255,.18);padding-top:12px;margin-top:14px;text-align:left}
#ov .keys{font-size:15px;color:#a9b9dc;margin-top:12px}
#ov button{margin-top:20px;font-weight:800;font-size:21px;font-family:inherit;color:#3a2a00;background:#ffcf4d;border:0;border-radius:16px;padding:14px 38px;box-shadow:0 5px 0 #c9962a;cursor:pointer}
#back{position:fixed;left:14px;bottom:12px;font-size:13px;color:#a9b9dc;text-decoration:none}
.touch #back{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hStone">🪨 3</span><span class="pill" id="hLimp" style="display:none"></span></div>
<div id="todo">
  <div class="main" id="tLamp">🏮 강 건너 나루의 등불까지</div>
  <div id="tDoc">📜 안채의 노비 문서 태우기</div>
  <div id="tCloth">👘 빨랫줄의 상민 옷 입기</div>
  <div id="tRice">🍙 부엌의 주먹밥(뱃삯)</div>
</div>
<div id="dawn">새벽 종(파루)까지<b><i></i></b></div>
<div id="right"><span class="pill" id="moon">☁️ 구름</span><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="eye"><i></i></div>
<div class="bar" id="work"><i></i></div>
<div id="say"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>그믐밤</h1>
  <p>조선, 어느 양반집 행랑채.<br>오늘 밤 달아난다. <b>강 건너 나루의 등불</b>까지.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기(소리 남) · 땅을 누르면 돌 던지기<br>V 시점 바꾸기 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">달아난다</button>
</div></div>
<script type="module" src="./night.js?v=4"></script>
</body>
</html>

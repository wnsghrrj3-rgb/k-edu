<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>첫 겨울 — 케이월드</title>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#2a2016}
#ov{background:rgba(30,22,14,.86)}
.pill{background:rgba(64,46,26,.86)}
#todo div{background:rgba(64,46,26,.78)}
#todo div.main{background:rgba(64,46,26,.92)}
#season{color:#ffe9c8}
#season i{background:linear-gradient(90deg,#9ed36a,#f0c24a 40%,#d8742e 70%,#9a8a7a 88%,#f4f8ff)}
#hPot.got{background:#ffcf4d;color:#3a2a00}
#hCover.on{background:#7fb0e0;color:#10223a}
#knap{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;display:none}
#knap i,#knap s{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
#knap s{width:26px;height:26px;border:4px solid #ffcf4d;box-sizing:border-box}
#knap i{border:4px solid #fff;box-sizing:border-box}
#rain{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;background:repeating-linear-gradient(105deg,rgba(200,220,255,0) 0 22px,rgba(200,220,255,.16) 22px 23px);background-size:120px 120px;animation:rn .35s linear infinite}
@keyframes rn{to{background-position:-30px 120px}}
.btn{background:rgba(64,46,26,.82)}
@media (max-width:640px){#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#top{top:92px}#todo{top:134px}#right{gap:4px}.rb{margin-right:2px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rain"></div>
<div id="vig"></div>
<div id="top"><span class="pill" id="hPot">🏺 0 / 3</span><span class="pill" id="hCarry">손 비었음</span><span class="pill" id="hCover" style="display:none">🟫 거적 덮음</span></div>
<div id="todo">
  <div class="main" id="tGoal">🏺 움집 앞 토기 셋을 곡식으로</div>
  <div id="tPot">🏺 빗살무늬토기 굽기</div>
  <div id="tDog">🐕 개 길들이기</div>
  <div id="tNet">🐟 강에 그물 치기</div>
</div>
<div id="season" class="band">첫눈까지<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="knap"><s></s><i></i></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">소리</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>첫 겨울</h1>
  <p>신석기, 강가의 움집 마을.<br>첫눈이 오기 전에 <b>움집 앞 토기 셋</b>을 곡식으로 채운다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 가만히 서면 베고·캐고·덮는다 · 스페이스 소리치기(갈판 곁에서는 갈기)<br>V 시점 바꾸기 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">나선다</button>
</div></div>
<script type="module" src="./winter.js?v=1"></script>
</body>
</html>

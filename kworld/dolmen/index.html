<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>고인돌 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#26201a}
#ov{background:rgba(28,22,16,.86)}
.pill{background:rgba(60,48,34,.86)}
#todo div{background:rgba(60,48,34,.78)}
#todo div.main{background:rgba(60,48,34,.92)}
#sun{color:#ffe7c2}
#sun i{background:linear-gradient(90deg,#ffe08a,#ff9a3c 55%,#c2384a 82%,#2b2450)}
#hCrew.hurt{background:#c24a3a}
#hRoll.low{background:#c27a2a}
#beat{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);display:none;align-items:center;gap:14px;pointer-events:none}
#beat .lane{position:relative;width:min(70vw,420px);height:22px;border-radius:12px;background:rgba(20,14,8,.7);box-shadow:0 3px 0 rgba(0,0,0,.3);overflow:hidden}
#beat .win{position:absolute;top:0;bottom:0;right:0;background:rgba(255,207,77,.55)}
#beat .dot{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff}
#beat b{font-size:24px;font-weight:900;min-width:96px;text-align:center;color:#ffe9b0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#beat b.hit{color:#ffcf4d;transform:scale(1.2)}
#beat .win.in{background:rgba(255,220,90,.95);box-shadow:0 0 14px #ffcf4d}
#tut{position:fixed;left:50%;bottom:calc(24% + 34px);transform:translateX(-50%);display:none;pointer-events:none;background:rgba(255,207,77,.95);color:#3a2a00;font-weight:900;font-size:17px;border-radius:12px;padding:6px 14px;white-space:nowrap}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(255,250,236,.95);color:#2a1e12;border-radius:14px;padding:5px 10px 7px;font-size:17px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none}
.tag:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:rgba(255,250,236,.95);border-bottom:0}
.btn{background:rgba(60,48,34,.82)}
@media (max-width:640px){#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:34%}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#top{top:92px}#todo{top:134px}#right{gap:4px}.rb{margin-right:2px}#beat{bottom:30%;gap:8px}#beat .lane{width:56vw}#beat b{font-size:20px;min-width:64px}#tut{font-size:13px;bottom:calc(30% + 30px)}.tag{font-size:14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hCrew">🙋 끄는 사람 8</span><span class="pill" id="hRoll">🪵 굴림대 3</span><span class="pill" id="hCarry" style="display:none"></span></div>
<div id="todo">
  <div class="main" id="tGoal">🪨 언덕 위 받침돌 둘 위로 덮개돌을</div>
  <div id="tRamp">⛰ 받침돌 사이 흙 비탈 0/4</div>
  <div id="tMeal">🍚 마을에서 새참 나르기</div>
  <div id="tGoods">🗡 청동 검·거울을 무덤방에</div>
</div>
<div id="sun" class="band">해 질 때까지<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="beat"><div class="lane"><div class="win"></div><div class="dot"></div></div><b id="chant">영—</b></div>
<div id="tut"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">당기기</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>고인돌</h1>
  <p>청동기, 언덕 아래 목책 마을.<br>해가 지기 전에 <b>큰 돌을 언덕 위 받침돌 둘 위에</b> 올린다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 줄 곁에 서서 「차!」에 맞춰 스페이스 · 지나온 굴림대는 주워서 돌 앞에 · 가만히 서면 담고 나른다<br>V 시점 바꾸기 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">줄을 잡는다</button>
</div></div>
<script type="module" src="./dolmen.js?v=2"></script>
</body>
</html>

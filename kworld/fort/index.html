<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>성을 지켜라 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#10162a}
#ov{background:rgba(10,14,28,.88)}
#night{color:#cfe0ff}
#night i{background:linear-gradient(90deg,#2a3a7a,#5a6aa8 60%,#ffb45a 88%,#fff0b8)}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(14,22,44,.9);color:#fff;border-radius:14px;padding:6px 10px 8px;font-size:20px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3);text-align:center;line-height:1.1;display:none}
.tag .fill{display:block;width:84px;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:5px auto 0}
.tag .fill i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf4d,#ff5a3c)}
.tag.lost{background:rgba(60,20,20,.9)}
.tag .need{animation:pul 0.9s ease-in-out infinite;display:inline-block}
.btn{background:rgba(22,44,78,.82)}
@media (max-width:640px){body #mis{top:134px}#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%;white-space:normal;text-align:center;width:86vw}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#top{top:92px}#todo{top:134px}#right{gap:4px}.rb{margin-right:2px}.tag{font-size:16px}.tag .fill{width:64px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hCarry">손 비었음</span><span class="pill" id="hHelp">🙋 도울 사람 1</span></div>
<div id="todo">
  <div class="main" id="tGoal">🚩 새벽까지 성벽 위 깃발을</div>
  <div id="tBeacon">🔥 봉수대에 불 올리기</div>
  <div id="tForge">⚒ 대장간 풀무질</div>
  <div id="tPeople">🏠 들에 남은 사람 들이기 0/4</div>
</div>
<div id="night" class="band">새벽까지<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="knap" style="position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;display:none"><s style="position:absolute;left:50%;top:50%;width:26px;height:26px;border:4px solid #ffcf4d;border-radius:50%;transform:translate(-50%,-50%);box-sizing:border-box"></s><i style="position:absolute;left:50%;top:50%;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-sizing:border-box"></i></div>
<div id="tags"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">밟기</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>성을 지켜라</h1>
  <p>고구려, 어느 산성의 밤. 적이 성벽에 붙었다.<br><b>새벽까지 성벽 위 깃발</b>을 하나라도 지킨다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 가만히 서면 집고·쌓는다 · 깃발 아래로 가져가면 놓는다<br>땅을 누르면 도울 사람을 그 구간으로 · V 시점 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">성벽으로</button>
</div></div>
<script type="module" src="./fort.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>안시성 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#8a93a4}
#ov{background:rgba(24,28,38,.86)}
#night{color:#fff}
#night i{background:linear-gradient(90deg,#b02a22,#d8703a 60%,#e8c860)}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(14,22,44,.9);color:#fff;border-radius:14px;padding:6px 10px 8px;font-size:20px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3);text-align:center;line-height:1.1;display:none}
.tag .fill{display:block;width:84px;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:5px auto 0}
.tag .fill i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf4d,#ff5a3c)}
.tag.hot{background:rgba(150,30,20,.92);animation:pul .8s ease-in-out infinite}
.tag .need{animation:pul 0.9s ease-in-out infinite;display:inline-block}
.btn{background:rgba(22,44,78,.82)}
@media (max-width:640px){body #mis{top:134px}#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%;white-space:normal;text-align:center;width:86vw}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#top{top:92px}#todo{top:134px}#right{gap:4px}.rb{margin-right:2px}.tag{font-size:16px}.tag .fill{width:64px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hHp">🛡 버팀</span><span class="pill" id="hCarry">손 비었음</span></div>
<div id="todo">
  <div class="main" id="tGoal">🌾 대군이 닿기 전에 들을 비운다</div>
  <div id="tField">🌾 들 비우기 0/8</div>
  <div id="tFix">🪵 무너진 성벽을 울짱으로 메우기</div>
  <div id="tFlag">🚩 흙산 꼭대기에 깃발</div>
</div>
<div id="night" class="band">적의 군량 — 다 떨어지면 이긴다<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="tags"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">밀기</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>안시성</h1>
  <p>645년 가을, 고구려 안시성. 당나라 대군이 지평선을 덮으며 온다.<br><b>적의 군량이 떨어질 때까지 버티면 이긴다.</b> 그 전에 우리 버팀(🛡)이 다하면 진다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 가만히 서면 집고·쌓는다 · <b>스페이스</b>: 태우기 · 사다리 밀기 · 불화살 쏘기<br>V 시점 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">성문 밖 들로</button>
</div></div>
<script type="module" src="./ansi.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>다섯 해 — 시간 탐험대</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#cfe4c0}
#ov{background:rgba(24,28,38,.86)}
#night{color:#fff}
#night i{background:linear-gradient(90deg,#e8603a,#e8c860 50%,#7ac85a)}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(14,22,44,.9);color:#fff;border-radius:14px;padding:6px 10px 8px;font-size:20px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3);text-align:center;line-height:1.1;display:none}
.tag .fill{display:block;width:84px;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:5px auto 0}
.tag .fill i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf4d,#ff5a3c)}
.tag.hot{background:rgba(150,30,20,.92);animation:pul .8s ease-in-out infinite}
.tag .need{animation:pul 0.9s ease-in-out infinite;display:inline-block}
#nb{position:fixed;right:12px;top:108px;display:flex;flex-direction:column;gap:4px;z-index:1;pointer-events:none}#nb span{background:rgba(14,22,44,.78);color:#fff;font-size:13px;font-weight:800;padding:4px 9px;border-radius:8px}
#jobl{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(14,22,44,.88);color:#ffe9a8;font-size:18px;font-weight:900;padding:7px 14px;border-radius:14px;display:none;z-index:6;pointer-events:none}
#todo div{font-size:13.5px;padding:5px 10px;max-width:min(330px,calc(100vw - 28px));box-sizing:border-box}#todo div.on{background:rgba(22,44,78,.6);color:#fff;opacity:.5}#todo div.now{background:#ffcf4d;color:#2a2410;opacity:1}#todo .sub{background:none;box-shadow:none;color:#fff;font-size:12px;padding:3px 4px 0;text-shadow:0 1px 3px rgba(0,0,0,.7)}#todo .main{white-space:normal;line-height:1.3}
.fact{text-align:left;font-size:13px;line-height:1.55;background:rgba(255,235,170,.12);border-radius:10px;padding:8px 12px;margin-top:8px}
#ov .box{max-height:92vh;overflow:auto}
.btn{background:rgba(22,44,78,.82)}
@media (max-width:640px){body #mis{top:134px}#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%;white-space:normal;text-align:center;width:86vw}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#top{top:92px}#todo{top:134px}#todo div{font-size:11.5px;padding:3px 8px}#todo{gap:3px}#right{gap:4px}.rb{margin-right:2px}.tag{font-size:16px}.tag .fill{width:64px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="hRice">🌾 곳간</span><span class="pill" id="hCoin">🪙</span><span class="pill" id="hLand">🚩</span><span class="pill" id="hCarry">빈손</span></div>
<div id="todo"></div>
<div id="night" class="band">첫 번째 해 · 봄 <b><i></i></b></div>
<div id="nb"></div>
<div id="jobl"></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div id="tags"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>다섯 해</h1>
  <p>조선 후기, 어느 고을. 우리 집은 논 두 배미를 짓는다.<br><b>다섯 해 뒤, 우리 집은 어떤 집이 되어 있을까.</b><br>부농 · 제 땅 짓는 집 · 남의 땅 짓는 집 · 고을을 떠난 집</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 노란 고리나 논 <b>안에 가만히 서면</b> 그 일을 한다<br>V 시점(위에서 온 고을 보기) · Q/E 돌려 보기 · 휠 당겨 보기<br>철이 바뀔 때마다 저장된다(로그인한 자리) — 다음에 「이어서 하기」</p>
  <button id="go">첫 번째 해 봄으로</button>
</div></div>
<script type="module" src="./farm.js?v=4"></script>
</body>
</html>

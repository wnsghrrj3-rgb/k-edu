<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>골품의 문 — 케이월드</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#20181c}
#ov{background:rgba(24,16,20,.88)}
.pill{background:rgba(60,36,40,.88)}
#todo div{background:rgba(60,36,40,.78)}
#todo div.main{background:rgba(60,36,40,.92)}
#bell{color:#ffe7c2}
#bell i{background:linear-gradient(90deg,#ffe08a,#ff9a3c 55%,#c2384a 80%,#4a2a50)}
#bell b{position:relative}
#bell b:before,#bell b:after{content:'';position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff6dc;z-index:2}
#bell b:before{left:55%}#bell b:after{left:80%}
#robe{display:flex;align-items:center;gap:6px}
#robe b{display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid #fff}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(255,250,236,.95);color:#2a1e12;border-radius:16px;padding:6px 10px;font-size:22px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none;line-height:1.15;text-align:center}
.tag:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:rgba(255,250,236,.95);border-bottom:0}
.tag .ok{color:#1e8a3a}.tag .no{color:#c0392b}
.btn{background:rgba(60,36,40,.82)}
@media (max-width:640px){#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%;white-space:normal;text-align:center;width:86vw}#ov h1{font-size:36px}#ov p{font-size:17px}
.band{top:60px;width:calc(100% - 28px)}#top{top:92px}#todo{top:134px}body #mis{top:134px}#right{gap:4px}.rb{margin-right:2px}.tag{font-size:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="top"><span class="pill" id="robe">옷 <b></b> <span>붉은빛</span></span><span class="pill" id="hBook">📜 글 다듬기 0/3</span></div>
<div id="todo">
  <div class="main" id="tGoal">🏮 가장 안쪽 전각의 등불까지 글을</div>
  <div id="tBook">📚 서고에서 책 셋</div>
  <div id="tExam">🎓 시험 보기</div>
  <div id="tBalhae">🤝 객관의 발해 사신</div>
</div>
<div id="bell" class="band">문 닫는 종까지<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 위에서</button></div>
<div id="goal"></div>
<div class="bar" id="eye"><i></i></div>
<div class="bar" id="work"><i></i></div>
<div id="tags"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>골품의 문</h1>
  <p>통일신라, 서라벌 관청 거리. 나는 재주 있는 <b>6두품</b> 젊은이.<br>문 닫는 종이 울리기 전에 <b>가장 안쪽 전각의 등불</b>까지 이 글을 올린다.</p>
  <p class="keys" id="keys">방향키 걷기 · Shift 뛰기 · 문 앞에 서면 문지기가 옷 빛깔을 본다 · 가만히 서면 읽고·건넨다<br>순시하는 관리의 불빛 안에서 서성이면 쫓겨난다 · V 시점 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">관청 거리로</button>
</div></div>
<script type="module" src="./gate.js?v=3"></script>
</body>
</html>

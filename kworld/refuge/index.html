<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>피란길 — 케이월드</title>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }
</script>
<link rel="stylesheet" href="../scene/kit.css?v=1">
<style>
html{background:#1d2a4c}
#ov{background:rgba(14,20,38,.86)}
.pill{background:rgba(30,40,66,.88)}
#todo div{background:rgba(30,40,66,.78)}
#todo div.main{background:rgba(30,40,66,.92)}
#gap{color:#ffd8c8}
#gap i{background:linear-gradient(90deg,#d8402a,#ff9a5a 40%,#ffe0a0)}
#fam{position:fixed;left:50%;transform:translateX(-50%);top:52px;display:flex;gap:6px;pointer-events:none}
#fam span{min-width:34px;height:34px;padding:0 4px;border-radius:9px;background:rgba(30,40,66,.85);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);box-sizing:border-box}
#fam span.with{background:#ffcf4d}
#fam span.lost{background:#c0392b;animation:blink .6s steps(2) infinite}
#fam span.gone{filter:grayscale(1);opacity:.35}
#fam span.class{background:#7fd0a0}
@keyframes blink{50%{opacity:.45}}
#hPack{white-space:nowrap;display:flex;gap:6px;align-items:center;pointer-events:auto}
#pack{pointer-events:auto;display:flex;gap:4px}
#pack span{cursor:pointer;background:rgba(255,255,255,.14);border-radius:8px;padding:0 5px}
#pack span:hover{background:rgba(255,120,90,.5)}
#hCold b{display:inline-block;width:46px;height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;vertical-align:middle;margin-left:4px}
#hCold b i{display:block;height:100%;width:0;background:#9fd8ff}
#frost{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px 50px rgba(220,240,255,.9);background:radial-gradient(ellipse at center,rgba(255,255,255,0) 55%,rgba(210,232,255,.55) 100%)}
#redge{position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none;opacity:0;background:linear-gradient(0deg,rgba(220,50,20,.62),rgba(220,60,20,0))}
.tag{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(250,248,240,.95);color:#1e2436;border-radius:14px;padding:4px 9px 6px;font-size:17px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);display:none;line-height:1.2;text-align:center}
.tag:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:rgba(250,248,240,.95);border-bottom:0}
.tag small{font-size:12px;color:#5a6278;display:block}
.tag.warn{background:#ffdcd4}.tag.warn:after{border-top-color:#ffdcd4}
.tag.lost{background:#c0392b;color:#fff}.tag.lost:after{border-top-color:#c0392b}
.btn{background:rgba(30,40,66,.82)}
@media (max-width:640px){#todo div{font-size:12px;padding:5px 9px}.pill{font-size:14px;padding:7px 10px}#say{font-size:16px;bottom:30%;white-space:normal;text-align:center;width:86vw}#ov h1{font-size:36px}#ov p{font-size:17px}
#gap{top:60px;width:calc(100% - 28px)}#fam{top:96px}#fam span{min-width:30px;height:30px;font-size:17px}#top{top:140px;flex-wrap:wrap;right:14px}#todo{top:186px}#right{gap:4px}.rb{margin-right:2px}.tag{font-size:14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="redge"></div>
<div id="frost"></div>
<div id="vig"></div>
<div id="top"><span class="pill" id="hPack">짐 <span id="pack"></span></span><span class="pill" id="hCold">❄<b><i></i></b></span></div>
<div id="fam"></div>
<div id="todo">
  <div class="main" id="tGoal">🏕 지평선 불빛까지 — 식구와 함께</div>
  <div id="tKid">🧒 길 잃은 아이 데려가기</div>
  <div id="tNote">📝 담벼락에 쪽지 붙이기</div>
  <div id="tClass">🎒 동생을 천막 교실로</div>
</div>
<div id="gap" class="band">뒤쪽 붉은 하늘과 나 사이<b><i></i></b></div>
<div id="right"><span id="rot"><button class="pill rb" id="bL">⟲</button><button class="pill rb" id="bR">⟳</button></span><button class="pill" id="bView">👁 길 따라</button></div>
<div id="goal"></div>
<div class="bar" id="work"><i></i></div>
<div class="bar" id="eye"><i></i></div>
<div id="tags"></div>
<div id="say"></div>
<div id="fade"></div>
<div id="stick"><i></i></div>
<button class="btn" id="bAct">부르기</button>
<button class="btn" id="bRun">뛰기</button>
<a id="back" href="/kworld/">← 케이월드</a>
<div id="ov"><div class="box">
  <h1>피란길</h1>
  <p>1950년 겨울. 뒤쪽 하늘이 붉다.<br><b>식구를 하나도 잃지 않고</b> 강을 건너, 지평선의 천막촌 불빛까지 간다.</p>
  <p class="keys" id="keys">먼저 집 앞에서 가져갈 짐을 골라 그 위에 선다(다 들 수는 없다) · 방향키 걷기 · Shift 뛰기(할머니가 처진다)<br>스페이스 부르기(식구가 모인다) · X 또는 짐 그림 누르기 = 내려놓기 · V 시점 · Q/E 돌려 보기 · 휠 당겨 보기</p>
  <button id="go">떠나기</button>
</div></div>
<script type="module" src="./refuge.js?v=1"></script>
</body>
</html>

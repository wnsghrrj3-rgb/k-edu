<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 | K-edu 케이에듀</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Gowun Dodum',sans-serif;background:#F5F7FA;min-height:100vh;color:#1A202C;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:28px;box-shadow:0 8px 40px rgba(0,0,0,.08);padding:56px 40px;text-align:center;max-width:440px;width:100%}
.emoji{font-size:64px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-family:var(--kedu-title);font-size:2rem;margin:20px 0 10px;color:#2B6CB0}
p{color:#718096;font-size:.98rem;line-height:1.7}
.code{display:inline-block;margin-top:14px;font-size:.75rem;font-weight:700;color:#8a8f98;background:#f0f1f4;border-radius:999px;padding:3px 12px;letter-spacing:.08em}
a.home{display:inline-block;margin-top:28px;background:#5B8EF8;color:#fff;text-decoration:none;font-weight:700;border-radius:50px;padding:14px 34px;font-size:1rem;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(91,142,248,.35)}
a.home:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(91,142,248,.45)}
.foot{margin-top:26px;font-size:.72rem;color:#B8BFC9}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🧭</div>
  <h1>길을 잃었어요!</h1>
  <p>찾으시는 페이지가 아직 없거나,<br>주소가 살짝 바뀌었을 수 있어요.<br>케이에듀 첫 화면에서 다시 출발해 볼까요?</p>
  <div class="code">404 NOT FOUND</div>
  <br>
  <a class="home" href="/">🏠 케이에듀 홈으로</a>
  <div class="foot">K-edu · keduclass.com</div>
</div>
<script src="/kedu_back.js"></script>
</body>
</html>

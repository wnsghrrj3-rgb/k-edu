<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제② 교통의 변화로 달라진 생활 모습 · l09
  「옛날 사람들이 교통수단을 이용했던 모습을 알아볼까요」
  교과서 p.97~99 · 지도서 13차시(p.190~195) · [4사04-02]
  수업 기법 = 사진 자료 살펴보기 · 돌아가며 말하기
=========================================================================

  ■ 직접조작 = 힘 바늘을 맞춰요 판 (사회 3-2 스물한째 판 · 2단원 아홉째 판)
  ⭐ 씨앗은 교과서 97~98쪽 스스로 활동 「옛날 교통수단을 움직이는 힘」과 99쪽 기계의 힘.
     교통수단 카드마다 힘 바늘이 있다. 사람 · 동물 · 바람 · 기계 가운데 그 교통수단을 움직인 힘을 눌러 바늘을 맞춘다.
     옛날 교통수단 여섯을 먼저, 과학 기술이 발달하면서 생겨난 교통수단 넷을 뒤에.
  ⭐ 교통수단마다 자기를 움직인 힘 k 를 품는다(GG_CAR[v]) — 정답표 0.
  ⭐ 바늘 자리 · 자연의 힘 수 · 기계의 힘 수 · 단계는 저장 0 — 판(ggOn)에서 셈으로 나온다(ggNeedle · ggNatN · ggMachN · ggStage).
  ⭐ 판을 바꾸는 자리 ggSet 단 하나(state.ggOn |= 1 << v) · 되돌리는 자리 0 · 난수 0.

  ■ 이 차시의 뼈대
   옛날 사람들은 주로 걸어서 이동했지만 말, 달구지, 가마, 뗏목, 나룻배, 돛단배 같은 교통수단도 이용했다.
   옛날 교통수단은 자연에서 쉽게 얻을 수 있는 재료로 만들었고 사람이나 동물, 자연의 힘을 이용해 움직였다.
   과학 기술이 발달하면서 기계의 힘으로 움직이는 교통수단이 생겼다.

  ■ 5단계
   ① 옛날 교통수단 여섯의 힘 바늘 → 새로 생긴 교통수단 넷의 힘 바늘 → ② 판 읽기 3택(정답 자리 2)
   ③ 타 보고 싶은 옛날 교통수단 가·나·다·라 고르기(정답 없음 · 교과서 99쪽 친구와 활동)
   ④ 마무리 3택(정답 자리 1) → 완료
      — 타 보고 싶은 까닭을 쓰고 친구들과 이야기하기는 교실 몫

  ■ 가드 12종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 이미 맞춘 바늘 — 판 불변                 ④ 옛날 교통수단을 다 맞추기 전 새 교통수단 — 판 불변
   ⑤ 그 교통수단을 움직인 힘이 아님 — 판 불변  ⑥ 다 맞추기 전 판 읽기 — 판 불변
   ⑦ 이미 읽은 자리 — 판 불변                 ⑧ 판 읽기 어긋난 답 — 판 불변
   ⑨ 판을 읽기 전 고르기 — 판 불변            ⑩ 이미 고른 자리 — 판 불변
   ⑪ 고르기 전 마무리 — 판 불변               ⑫ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 교통수단과 설명은 교과서 97~99쪽을 판이 옮긴 것(캡션 상시).
   ㉡ 타 보고 싶은 옛날 교통수단은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 타 보고 싶은 까닭을 쓰고 친구들과 이야기하기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 내용은 차시 예고 한 자리뿐 — 오늘날 교통수단 이용 모습은 예고 문장에만
   · 새 사실 0 — 교과서 97~99쪽 · 지도서 190~195쪽에 있는 사실만
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 누리집 주소 0 · 네 자리 연도 0 · 지역 이름 0
-->

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */

function ggCarOf(v){ return GG_CAR[v]; }                                       // GG_CAR 를 읽는 자리는 여기 단 하나
function ggPowOf(p){ return GG_POW[p]; }                                       // GG_POW 를 읽는 자리는 여기 단 하나
function ggPickOf(p){ return GG_PICK[p]; }                                     // GG_PICK 을 읽는 자리는 여기 단 하나
function ggCars(){ return [...Array(GG_CAR.length).keys()]; }
function ggIsOn(st,v){ return (st.ggOn >> v & 1) === 1; }                                        // ★ 맞춘 바늘인지 — 판의 비트에서
function ggNeedle(st,v){ return ggIsOn(st,v) ? ggCarOf(v).k : -1; }                                // ★ 바늘 자리 — 맞추기 전은 쉼(-1)
function ggEraN(e){ return ggCars().filter(v => ggCarOf(v).era === e).length; }
function ggNatN(st){ return ggCars().filter(v => ggIsOn(st,v) && ggCarOf(v).k < 3).length; }      // ★ 자연의 힘 — 셈으로
function ggMachN(st){ return ggCars().filter(v => ggIsOn(st,v) && ggCarOf(v).k === 3).length; }   // ★ 기계의 힘 — 셈으로
function ggOldAll(st){ return ggCars().filter(v => ggCarOf(v).era === 0).every(v => ggIsOn(st,v)); }
function ggAll(st){ return ggCars().every(v => ggIsOn(st,v)); }                                  // ★ 끝 기준 = 바늘 모두
function ggSet(v){ state.ggOn |= 1 << v; }                                     // ⭐ 판을 바꾸는 자리 단 하나
function ggStage(st){
  if(!ggOldAll(st)) return "old";
  if(!ggAll(st)) return "new";
  if(st.ggRead == null) return "read";
  if(st.ggPick == null) return "pick";
  if(st.ggFin == null) return "fin";
  return "end";
}

/* 판 — 카드마다 힘 바늘 */
function ggDial(st,v){
  const n = ggNeedle(st,v), a = (n < 0 ? -90 : GG_ANG[n]) * Math.PI / 180;
  const x = (37 + 26 * Math.sin(a)).toFixed(1), y = (36 - 26 * Math.cos(a)).toFixed(1);
  return `<svg class="gg-dial" viewBox="0 0 74 40"><path d="M 7 36 A 30 30 0 0 1 67 36" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
    <path d="M 37 36 L 37 8 M 37 36 L 16 15 M 37 36 L 58 15" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="37" y1="36" x2="${x}" y2="${y}" stroke="${n < 0 ? '#94A3B8' : '#16A34A'}" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="37" cy="36" r="3" fill="#334155"/></svg>`;
}
function ggCard(st,v){
  const wait = ggCarOf(v).era === 1 && !ggOldAll(st);
  return `<div class="gg-card" data-v="${v}" data-on="${ggIsOn(st,v) ? 1 : 0}" data-wait="${wait ? 1 : 0}">
    <div class="gg-name">${ggCarOf(v).name}</div><div class="gg-hint">${ggCarOf(v).hint}</div>${ggDial(st,v)}
    <div class="gg-pws">${[0,1,2,3].map(p => `<button class="gg-pw" data-p="${p}" data-at="${ggNeedle(st,v) === p ? 1 : 0}" onclick="ggTurn(${v},${p})"><i>${ggPowOf(p).icon}</i>${ggPowOf(p).name}</button>`).join('')}</div></div>`;
}
function ggBoard(st){
  const era = e => ggCars().filter(v => ggCarOf(v).era === e).map(v => ggCard(st,v)).join('');
  return `<div class="gg-board" data-on="${st.ggOn}" data-nat="${ggNatN(st)}" data-mach="${ggMachN(st)}" data-all="${ggAll(st) ? 1 : 0}">
    <div class="gg-title">교통수단을 움직인 힘을 눌러 바늘을 맞춰요</div>
    <div class="gg-era" data-era="0">옛날 교통수단</div><div class="gg-cards" data-era="0">${era(0)}</div>
    <div class="gg-era" data-era="1">과학 기술이 발달하면서 생겨난 교통수단</div><div class="gg-cards" data-era="1">${era(1)}</div></div>`;
}
function ggPicks(st){
  return `<div class="gg-picks">${[0,1,2,3].map(p=>`<button class="gg-pk" data-p="${p}" onclick="ggPick(${p})"><b>${ggPickOf(p).mark}</b> ${ggPickOf(p).text}</button>`).join('')}</div>`;
}
function ggHelp(st){
  return `<div class="gg-help">① <b>옛날 교통수단</b> 여섯의 힘 바늘을 먼저 맞춰요.<br>
    ② 과학 기술이 발달하면서 생겨난 <b>교통수단</b> 넷의 바늘을 맞춰요.<br>
    바늘을 모두 맞추면 <b>판을 읽어요</b>.</div>`;
}
function ggPanel(st){
  const stage = ggStage(st);
  let ask = '';
  if(stage === "old"){
    ask = `<div class="gg-ask" data-step="old"><b>옛날 교통수단은 무엇의 힘으로 움직였을까요? 카드의 설명을 읽고 바늘을 맞춰 봐요.</b></div>`;
  } else if(stage === "new"){
    ask = `<div class="gg-ask" data-step="new"><b>과학 기술이 발달하면서 생겨난 교통수단은 무엇의 힘으로 움직일까요?</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="gg-ask" data-step="read"><b>바늘을 모두 맞췄어요. 판에서 무엇을 알 수 있나요?</b>
      <div class="gg-opts">${GG_READQ.map((t,i)=>`<button class="gg-opt" onclick="ggRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="gg-ask" data-step="pick"><b>옛날 교통수단 가운데 타 보고 싶은 것을 하나 골라 봐요.</b>${ggPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="gg-ask" data-step="fin"><b>기계의 힘으로 움직이는 교통수단이 생기면서 사람들의 생활은 어떻게 달라졌을까요?</b>
      <div class="gg-opts">${GG_FINQ.map((t,i)=>`<button class="gg-opt" onclick="ggFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="gg-ask" data-fin="1" style="border-color:#F9A8D4;background:#FDF2F8">
      <b style="color:#9D174D">힘 바늘을 모두 맞췄어요. 옛날 교통수단은 자연의 힘으로, 새로 생긴 교통수단은 기계의 힘으로 움직였어요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>타 보고 싶은 옛날 교통수단과 그 까닭을 쓰고 친구들과 이야기하기</b>는 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.ggTell ? `<div class="gg-tell">${st.ggTell}</div>` : '';
  const warn = st.ggMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.ggMsg}</div>` : '';
  return `<div class="gg-wrap">
    <div class="gg-head">자연의 힘 <b>${ggNatN(st)}</b> / ${ggEraN(0)} · 기계의 힘 <b>${ggMachN(st)}</b> / ${ggEraN(1)}</div>
    ${ggBoard(st)}<div class="gg-side">${ggHelp(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 교통수단과 설명은 <b>교과서 97~99쪽</b>을 판이 옮긴 것이에요. 타 보고 싶은 옛날 교통수단은 <b>사람마다 달라서</b> 판은 정답을 정하지 않아요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const LS_KEY = "kedu_progress_g3_2_social_u2_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  ggOn:0, ggRead:null, ggPick:null, ggFin:null, ggMsg:"", ggTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function ggDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 힘 바늘 맞추기 */
function ggTurn(v,p){
  if(state.ggFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(v) || v<0 || v>=GG_CAR.length) return;                              // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(!Number.isInteger(p) || p<0 || p>=GG_POW.length) return;                              // 가드②
  if(ggIsOn(state,v)){ state.ggMsg = GG_SAY_ON; playThud(); ggDraw(); return; }             // 가드③: 이미 맞춘 바늘 — 판 불변
  if(ggCarOf(v).era === 1 && !ggOldAll(state)){ state.ggMsg = GG_SAY_OLDFIRST; playThud(); ggDraw(); return; }   // 가드④: 옛날 먼저 — 판 불변
  if(p !== ggCarOf(v).k){ state.ggMsg = GG_SAY_WRONG; playThud(); ggDraw(); return; }       // 가드⑤: 그 힘이 아님 — 판 불변
  ggSet(v);
  state.ggMsg = ""; state.ggTell = `${ggCarOf(v).name}의 바늘이 ${ggPowOf(p).name}에 멈췄어요. ${ggCarOf(v).say}`
    + (ggAll(state) ? ` 바늘을 모두 맞췄어요.` : (ggCarOf(v).era === 0 && ggOldAll(state) ? ` 이제 새로 생긴 교통수단의 바늘을 맞춰 봐요.` : ''));
  if(ggAll(state)) playChime(); else playBlip(); ggDraw();
}
/* 판 읽기 */
function ggRead(i){
  if(state.ggFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=GG_READQ.length) return;                           // 가드②
  if(!ggAll(state)){ state.ggMsg = GG_SAY_ORDER_R; playThud(); ggDraw(); return; }         // 가드⑥: 다 맞추기 전 — 판 불변
  if(state.ggRead!=null){ state.ggMsg = GG_SAY_READDONE; ggDraw(); return; }               // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==GG_READ_OK){ state.ggMsg = GG_READ_BAD; playThud(); ggDraw(); return; }           // 가드⑧: 어긋난 답 — 판 불변
  state.ggRead = i; state.ggMsg = ""; state.ggTell = `자연의 힘 ${ggNatN(state)}가지 · 기계의 힘 ${ggMachN(state)}가지. 옛날 교통수단은 사람이나 동물, 자연의 힘을 이용해 움직였고, 과학 기술이 발달하면서 기계의 힘으로 움직이는 교통수단이 생겼어요.`; playBlip(); ggDraw();
}
/* 타 보고 싶은 옛날 교통수단 고르기 — 정답 없음 */
function ggPick(p){
  if(state.ggFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=GG_PICK.length) return;                             // 가드②
  if(state.ggRead==null){ state.ggMsg = GG_SAY_ORDER_P; playThud(); ggDraw(); return; }    // 가드⑨: 판을 읽기 전 — 판 불변
  if(state.ggPick!=null){ state.ggMsg = GG_SAY_PICKDONE; ggDraw(); return; }               // 가드⑩: 이미 고른 자리 — 판 불변
  state.ggPick = p; state.ggMsg = ""; state.ggTell = `${ggPickOf(p).mark}를 골랐어요. 나는 ${ggPickOf(p).text}를 타 보고 싶어요. 왜냐하면 ${ggPickOf(p).why}`; playBlip(); ggDraw();
}
/* 마무리 */
function ggFin(i){
  if(state.ggFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=GG_FINQ.length) return;                             // 가드②
  if(state.ggPick==null){ state.ggMsg = GG_SAY_ORDER_FIN; playThud(); ggDraw(); return; }  // 가드⑪: 고르기 전 — 판 불변
  if(i!==GG_FIN_OK){ state.ggMsg = GG_FIN_BAD; playThud(); ggDraw(); return; }             // 가드⑫: 어긋난 답 — 판 불변
  state.ggFin = i; state.ggMsg = ""; playChime(); ggDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u2_l10_돋보기로찾아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

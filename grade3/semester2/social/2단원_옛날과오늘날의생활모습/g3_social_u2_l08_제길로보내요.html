<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제② 교통의 변화로 달라진 생활 모습 · l08 (주제 첫 차시)
  「교통이 무엇인지 알아볼까요」
  교과서 p.94~96 · 지도서 12차시(p.184~186) · [4사04-02]
  수업 기법 = 개념 파악하기 · 사진 자료 살펴보기
=========================================================================

  ■ 직접조작 = 제 길로 보내요 판 (사회 3-2 스무째 판 · 2단원 여덟째 판)
  ⭐ 씨앗은 교과서 94쪽 「생각을 열어요」 — 그림 속 교통수단이 실제로는 다니지 않는 길에 있다.
     교통수단을 골라 실제로 다니는 길(교통로)로 보낸다.
  ⭐ 교통수단마다 지금 있는 길 at 과 자기가 다니는 길 k 를 품는다(RO_CAR[v]) — 정답표 0.
  ⭐ 지금 있는 길 · 제 길을 다니는 수 · 단계는 저장 0 — 판(roHome)에서 셈으로 나온다(roLaneOf · roRightN · roStage).
  ⭐ 판을 바꾸는 자리 roSet 단 하나(state.roHome |= 1 << v) · 되돌리는 자리 0 · 난수 0.
     고른 교통수단(roAt)은 손에 든 것일 뿐 판이 아니다.

  ■ 이 차시의 뼈대
   어떤 장소에서 다른 장소로 사람이 이동하거나 물건을 옮기는 것을 교통이라고 한다.
   교통은 주로 교통로를 따라 움직이는 교통수단에 의해 이루어진다.
   사람들은 생활하면서 필요에 따라 다양한 교통수단을 이용한다.

  ■ 5단계
   ① 교통수단 고르기 → 제 길로 보내기(다섯 대) → ② 판 읽기 3택(정답 자리 1)
   ③ 최근에 이용한 교통수단 가·나·다·라 고르기(정답 없음 · 교과서 96쪽 친구와 활동)
   ④ 마무리 3택(정답 자리 2) → 완료
      — 교통수단을 이용한 경험을 친구들과 이야기하기는 교실 몫

  ■ 가드 12종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 이미 제 길을 다니는 교통수단 — 판 불변    ④ 교통수단을 고르기 전 길 누르기 — 판 불변
   ⑤ 실제로 다니지 않는 길 — 판 불변          ⑥ 다 보내기 전 판 읽기 — 판 불변
   ⑦ 이미 읽은 자리 — 판 불변                 ⑧ 판 읽기 어긋난 답 — 판 불변
   ⑨ 판을 읽기 전 고르기 — 판 불변            ⑩ 이미 고른 자리 — 판 불변
   ⑪ 고르기 전 마무리 — 판 불변               ⑫ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 교통수단과 길은 교과서 94쪽 「생각을 열어요」 그림을 판이 옮긴 것(캡션 상시).
   ㉡ 최근에 이용한 교통수단은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 교통수단을 이용한 경험을 친구들과 이야기하기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 내용은 차시 예고 한 자리뿐 — 옛날 교통수단은 예고 문장에만
   · 새 사실 0 — 교과서 94~96쪽 · 지도서 184~186쪽에 있는 사실만
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 누리집 주소 0 · 네 자리 연도 0 · 지역 이름 0
-->

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {
  // 생각을 열어요 — 길이 뒤섞인 그림(교과서 94쪽)
  mix:`<svg viewBox="0 0 160 96"><rect width="160" height="96" fill="#DBEAFE"/>
    <rect x="0" y="40" width="160" height="16" fill="#E7E5E4"/><path d="M 0 48 L 160 48" stroke="#A8A29E" stroke-width="1" stroke-dasharray="4 3"/>

function roCarOf(v){ return RO_CAR[v]; }                                       // RO_CAR 를 읽는 자리는 여기 단 하나
function roLaneName(l){ return RO_LANE[l]; }                                   // RO_LANE 을 읽는 자리는 여기 단 하나
function roPickOf(p){ return RO_PICK[p]; }                                     // RO_PICK 을 읽는 자리는 여기 단 하나
function roCars(){ return [...Array(RO_CAR.length).keys()]; }
function roLaneOf(st,v){ return (st.roHome >> v & 1) === 1 ? roCarOf(v).k : roCarOf(v).at; }   // ★ 지금 있는 길 — 판의 비트에서
function roRight(st,v){ return roLaneOf(st,v) === roCarOf(v).k; }                              // ★ 제 길인지 — 교통수단이 품은 길에서
function roRightN(st){ return roCars().filter(v => roRight(st,v)).length; }                    // ★ 제 길을 다니는 수 — 셈으로
function roAll(st){ return roRightN(st) === RO_CAR.length; }                                   // ★ 끝 기준 = 모두 제 길
function roSet(v){ state.roHome |= 1 << v; }                                   // ⭐ 판을 바꾸는 자리 단 하나
function roStage(st){
  if(!roAll(st)) return "move";
  if(st.roRead == null) return "read";
  if(st.roPick == null) return "pick";
  if(st.roFin == null) return "fin";
  return "end";
}

/* 판 — 길 넷 */
function roLanes(st){
  return [0,1,2,3].map(l => {
    const cars = roCars().filter(v => roLaneOf(st,v) === l);
    return `<div class="ro-lane" data-l="${l}">
      <button class="ro-go" data-l="${l}" data-ready="${st.roAt >= 0 ? 1 : 0}" onclick="roGo(${l})">${roLaneName(l).name}${roLaneName(l).road === roLaneName(l).name ? '' : '<br>' + roLaneName(l).road}</button>
      <div class="ro-cars">${cars.map(v => `<button class="ro-car" data-v="${v}" data-hold="${st.roAt === v ? 1 : 0}" data-ok="${(st.roHome >> v & 1) === 1 ? 1 : 0}" onclick="roHold(${v})"><i>${roCarOf(v).icon}</i>${roCarOf(v).name}</button>`).join('')}</div></div>`;
  }).join('');
}
function roBoard(st){
  return `<div class="ro-board" data-home="${st.roHome}" data-right="${roRightN(st)}" data-all="${roAll(st) ? 1 : 0}">
    <div class="ro-title">교통수단을 골라 실제로 다니는 길로 보내요</div>
    ${roLanes(st)}</div>`;
}
function roPicks(st){
  return `<div class="ro-picks">${[0,1,2,3].map(p=>`<button class="ro-pk" data-p="${p}" onclick="roPick(${p})"><b>${roPickOf(p).mark}</b> ${roPickOf(p).text}</button>`).join('')}</div>`;
}

  return `<div class="ro-help">① 길이 이상한 <b>교통수단</b>을 눌러 골라요.<br>

    교통수단이 모두 <b>제 길</b>을 다니면 판을 읽어요.</div>`;
}
function roPanel(st){
  const stage = roStage(st);
  let ask = '';
  if(stage === "move"){
    ask = `<div class="ro-ask" data-step="move"><b>그림에서 실제로 보기 어려운 모습을 찾아 교통수단을 제 길로 보내 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="ro-ask" data-step="read"><b>교통수단을 모두 제 길로 보냈어요. 판에서 무엇을 알 수 있나요?</b>
      <div class="ro-opts">${RO_READQ.map((t,i)=>`<button class="ro-opt" onclick="roRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="ro-ask" data-step="pick"><b>최근에 이용한 교통수단을 하나 골라 봐요.</b>${roPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="ro-ask" data-step="fin"><b>‘교통이 무엇인지’ 공부한 내용을 정리해 보니 무엇을 알 수 있을까요?</b>
      <div class="ro-opts">${RO_FINQ.map((t,i)=>`<button class="ro-opt" onclick="roFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="ro-ask" data-fin="1" style="border-color:#F9A8D4;background:#FDF2F8">
      <b style="color:#9D174D">교통수단이 모두 제 길을 다녀요. 내가 이용해 본 교통수단과 그 교통수단이 다니는 교통로를 친구들과 이야기해 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>최근에 이용한 교통수단과 이용한 까닭을 쓰고 친구들과 이야기하기</b>는 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.roTell ? `<div class="ro-tell">${st.roTell}</div>` : '';
  const warn = st.roMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.roMsg}</div>` : '';
  return `<div class="ro-wrap">
    <div class="ro-head">제 길을 다니는 교통수단 <b>${roRightN(st)}</b> / ${RO_CAR.length}</div>

  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const LS_KEY = "kedu_progress_g3_2_social_u2_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],

try{

  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function roDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 교통수단 고르기 — 손에 들 뿐 판은 그대로 */
function roHold(v){
  if(state.roFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(v) || v<0 || v>=RO_CAR.length) return;                              // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(roRight(state,v)){ state.roMsg = RO_SAY_RIGHT; playThud(); roDraw(); return; }         // 가드③: 이미 제 길 — 판 불변
  state.roAt = state.roAt === v ? -1 : v;
  state.roMsg = ""; state.roTell = state.roAt === v ? `${roCarOf(v).name}를 골랐어요. 실제로 다니는 길의 단추를 눌러 봐요.` : `${roCarOf(v).name}를 내려놓았어요.`;
  playBlip(); roDraw();
}
/* 길로 보내기 */
function roGo(l){
  if(state.roFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(l) || l<0 || l>=RO_LANE.length) return;                             // 가드②
  if(state.roAt < 0){ state.roMsg = RO_SAY_HOLD; playThud(); roDraw(); return; }            // 가드④: 고르기 전 — 판 불변
  const v = state.roAt;
  if(l !== roCarOf(v).k){ state.roMsg = RO_SAY_WRONG; playThud(); roDraw(); return; }       // 가드⑤: 실제로 다니지 않는 길 — 판 불변
  roSet(v); state.roAt = -1;
  state.roMsg = ""; state.roTell = `${roCarOf(v).name}가 ${roLaneName(l).road}로 갔어요. ${roCarOf(v).why}`
    + (roAll(state) ? ` 교통수단이 모두 제 길을 다녀요.` : '');
  if(roAll(state)) playChime(); else playBlip(); roDraw();
}
/* 판 읽기 */
function roRead(i){
  if(state.roFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=RO_READQ.length) return;                           // 가드②
  if(!roAll(state)){ state.roMsg = RO_SAY_ORDER_R; playThud(); roDraw(); return; }         // 가드⑥: 다 보내기 전 — 판 불변
  if(state.roRead!=null){ state.roMsg = RO_SAY_READDONE; roDraw(); return; }               // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==RO_READ_OK){ state.roMsg = RO_READ_BAD; playThud(); roDraw(); return; }           // 가드⑧: 어긋난 답 — 판 불변
  state.roRead = i; state.roMsg = ""; state.roTell = `교통수단 ${roRightN(state)}개가 모두 제 길을 다녀요. 교통은 주로 교통로를 따라 움직이는 교통수단에 의해 이루어져요.`; playBlip(); roDraw();
}
/* 최근에 이용한 교통수단 고르기 — 정답 없음 */
function roPick(p){
  if(state.roFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=RO_PICK.length) return;                             // 가드②
  if(state.roRead==null){ state.roMsg = RO_SAY_ORDER_P; playThud(); roDraw(); return; }    // 가드⑨: 판을 읽기 전 — 판 불변
  if(state.roPick!=null){ state.roMsg = RO_SAY_PICKDONE; roDraw(); return; }               // 가드⑩: 이미 고른 자리 — 판 불변
  state.roPick = p; state.roMsg = ""; state.roTell = `${roPickOf(p).mark}를 골랐어요. ${roPickOf(p).text} — ${roPickOf(p).why}`; playBlip(); roDraw();
}
/* 마무리 */
function roFin(i){
  if(state.roFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=RO_FINQ.length) return;                             // 가드②
  if(state.roPick==null){ state.roMsg = RO_SAY_ORDER_FIN; playThud(); roDraw(); return; }  // 가드⑪: 고르기 전 — 판 불변
  if(i!==RO_FIN_OK){ state.roMsg = RO_FIN_BAD; playThud(); roDraw(); return; }             // 가드⑫: 어긋난 답 — 판 불변
  state.roFin = i; state.roMsg = ""; playChime(); roDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u2_l09_바늘을맞춰요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

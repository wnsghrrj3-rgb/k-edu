<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제① 옛날과 오늘날의 풍습 · l07 (주제 마무리)
  「[생각을 펼쳐요] 옛날과 오늘날의 풍습 정리」
  교과서 p.91~93 · 지도서 11차시(p.180~181) · [4사04-01]
  수업 기법 = 돌아가며 말하기
=========================================================================

  ■ 직접조작 = 전광판에 불을 켜요 판 (사회 3-2 열아홉째 판 · 2단원 일곱째 판)
  ⭐ 씨앗은 교과서 93쪽 「재미있게 확인해요」 — 낱말 마흔 칸 가운데 ① 옛날에 먹었던 세시 음식,
     ② 옛날 명절이나 절기에 하던 일을 색칠하면 숨은 수가 나타난다.
  ⭐ 칸 마흔(8 × 5)의 낱말과 자리는 교과서 93쪽 그대로. 칸마다 자기 갈래 k 를 품는다(BJ_CELL[c].k · 0 음식 · 1 하던 일 · 2 아님) — 정답표 0.
  ⭐ 켠 불 수 · 음식 불 수 · 하던 일 불 수 · 단계는 저장 0 — 판(bjRow)에서 셈으로 나온다(bjFoodN · bjWorkN · bjStage).
  ⭐ 판을 바꾸는 자리 bjSet 단 하나(state.bjRow[c >> 3] |= 1 << (c & 7) · 줄 다섯 × 여덟 칸) · 지우는 자리 0 · 난수 0.

  ■ 이 차시의 뼈대
   옛날 명절이나 절기마다 먹던 음식과 하던 일이 있었다(세시 풍속).
   불을 켠 스물한 칸이 모여 24가 나타난다.
   오늘날 풍습 가운데 미래에 전해 주고 싶은 풍습을 찾아 풍습 설명과 담긴 뜻을 말할 수 있다.

  ■ 5단계
   ① 세시 음식 칸에 불 켜기 → ② 명절·절기에 하던 일 칸에 불 켜기 → ③ 판 읽기 3택(나타난 수 · 정답 자리 1)
   ④ 미래에 전해 주고 싶은 오늘날 풍습 가·나·다·라 고르기(정답 없음 · 교과서 91쪽 선택 활동 1)
   ⑤ 마무리 3택(정답 자리 0) → 완료
      — 만화로 표현하기 · 새로운 놀이 만들기 · 돌아가며 말하기는 교실 몫

  ■ 가드 12종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 이미 켠 칸 — 판 불변                     ④ 세시 음식도 하던 일도 아닌 칸 — 판 불변
   ⑤ 음식 불을 다 켜기 전 하던 일 칸 — 판 불변 ⑥ 불을 다 켜기 전 판 읽기 — 판 불변
   ⑦ 이미 읽은 자리 — 판 불변                 ⑧ 판 읽기 어긋난 답 — 판 불변
   ⑨ 판을 읽기 전 고르기 — 판 불변            ⑩ 이미 고른 자리 — 판 불변
   ⑪ 고르기 전 마무리 — 판 불변               ⑫ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 낱말 마흔 칸과 색칠할 칸은 교과서 93쪽을 옮긴 것(캡션 상시).
   ㉡ 미래에 전해 주고 싶은 풍습은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 만화로 표현하기, 새로운 놀이 만들기, 친구들과 돌아가며 말하기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 주제 용어는 차시 예고 한 자리뿐 — 주제②의 낱말은 예고 문장에만 한 번 쓴다
   · 새 사실 0 — 교과서 91~93쪽 · 지도서 180~181쪽 · 앞 여섯 차시에서 공부한 사실만
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 누리집 주소 0 · 네 자리 연도 0 · 지역 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}
:root{

html,body{height:100%}

.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;

.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}

.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#FCE7F3;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}

.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {
  // 들어가기 — 주제①에서 공부한 풍습
  topic:`<svg viewBox="0 0 160 96"><rect width="160" height="96" fill="#FDF2F8"/>

function bjCellOf(c){ return BJ_CELL[c]; }                                     // BJ_CELL 을 읽는 자리는 여기 단 하나
function bjPickOf(p){ return BJ_PICK[p]; }                                     // BJ_PICK 을 읽는 자리는 여기 단 하나
function bjCells(){ return [...Array(BJ_CELL.length).keys()]; }
function bjIsOn(st,c){ return (st.bjRow[c >> 3] >> (c & 7) & 1) === 1; }        // ★ 켠 칸 — 판의 비트에서
function bjKindN(k){ return bjCells().filter(c => bjCellOf(c).k === k).length; }            // ★ 갈래별 칸 수 — 칸이 품은 갈래에서
function bjOnN(st,k){ return bjCells().filter(c => bjIsOn(st,c) && bjCellOf(c).k === k).length; }
function bjFoodN(st){ return bjOnN(st,0); }                                                   // ★ 음식 불 수 — 셈으로
function bjWorkN(st){ return bjOnN(st,1); }                                                   // ★ 하던 일 불 수 — 셈으로
function bjLitN(st){ return bjCells().filter(c => bjIsOn(st,c)).length; }
function bjFoodAll(st){ return bjFoodN(st) === bjKindN(0); }
function bjAll(st){ return bjFoodAll(st) && bjWorkN(st) === bjKindN(1); }                    // ★ 끝 기준 = 두 갈래 모두
function bjSet(c){ state.bjRow[c >> 3] |= 1 << (c & 7); }                    // ⭐ 판을 바꾸는 자리 단 하나
function bjStage(st){
  if(!bjFoodAll(st)) return "food";
  if(!bjAll(st)) return "work";
  if(st.bjRead == null) return "read";
  if(st.bjPick == null) return "pick";
  if(st.bjFin == null) return "fin";
  return "end";
}

/* 판 — 전광판 칸 마흔 */
function bjGrid(st){
  return `<div class="bj-grid">${bjCells().map(c => {
    const on = bjIsOn(st,c);
    return `<button class="bj-cell" data-c="${c}" data-on="${on ? 1 : 0}" data-k="${on ? bjCellOf(c).k : ''}" onclick="bjLight(${c})">${bjCellOf(c).name}</button>`;
  }).join('')}</div>`;
}
function bjBoard(st){
  return `<div class="bj-board" data-row="${st.bjRow.join(',')}" data-lit="${bjLitN(st)}" data-all="${bjAll(st) ? 1 : 0}">
    <div class="bj-title">전광판에 불을 켜면 숨은 수가 나타나요</div>
    ${bjGrid(st)}
    <div class="bj-legend"><span><i style="background:#FDE68A"></i>${BJ_KIND[0]}</span><span><i style="background:#F9A8D4"></i>${BJ_KIND[1]}</span></div></div>`;
}
function bjPicks(st){
  return `<div class="bj-picks">${[0,1,2,3].map(p=>`<button class="bj-pk" data-p="${p}" onclick="bjPick(${p})"><b>${bjPickOf(p).mark}</b> ${bjPickOf(p).text}</button>`).join('')}</div>`;
}
function bjHelp(st){
  return `<div class="bj-help">① 옛날에 먹었던 <b>세시 음식</b> 칸에 불을 켜요.<br>
    ② 옛날 명절이나 절기에 <b>하던 일</b> 칸에 불을 켜요.<br>
    불이 켜진 칸들이 모여 <b>숨은 수</b>가 나타나요.</div>`;
}
function bjPanel(st){
  const stage = bjStage(st);
  let ask = '';
  if(stage === "food"){
    ask = `<div class="bj-ask" data-step="food"><b>① 옛날에 먹었던 세시 음식 칸을 찾아 불을 켜 봐요.</b></div>`;
  } else if(stage === "work"){
    ask = `<div class="bj-ask" data-step="work"><b>② 옛날 명절이나 절기에 하던 일 칸을 찾아 불을 켜 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="bj-ask" data-step="read"><b>전광판에 나타난 수는 무엇인가요?</b>
      <div class="bj-opts">${BJ_READQ.map((t,i)=>`<button class="bj-opt" onclick="bjRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="bj-ask" data-step="pick"><b>오늘날 풍습 가운데 미래에 전해 주고 싶은 풍습을 하나 골라 봐요.</b>${bjPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="bj-ask" data-step="fin"><b>‘옛날과 오늘날의 풍습’에서 공부한 내용을 정리해 보니 무엇을 알 수 있을까요?</b>
      <div class="bj-opts">${BJ_FINQ.map((t,i)=>`<button class="bj-opt" onclick="bjFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="bj-ask" data-fin="1" style="border-color:#F9A8D4;background:#FDF2F8">
      <b style="color:#9D174D">전광판에 숨은 수를 찾았어요. 옛날 풍습에 담긴 생활과 생각을 떠올리며 미래에 전해 주고 싶은 풍습을 친구들과 이야기해 봐요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>미래에 전해 주고 싶은 풍습을 만화로 표현하기</b>, <b>전통 놀이로 새로운 놀이 만들기</b>, <b>친구들과 돌아가며 말하기</b>는 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.bjTell ? `<div class="bj-tell">${st.bjTell}</div>` : '';
  const warn = st.bjMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.bjMsg}</div>` : '';
  return `<div class="bj-wrap">
    <div class="bj-head">세시 음식 <b>${bjFoodN(st)}</b> / ${bjKindN(0)} · 하던 일 <b>${bjWorkN(st)}</b> / ${bjKindN(1)}</div>
    ${bjBoard(st)}<div class="bj-side">${bjHelp(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 낱말 마흔 칸과 불을 켤 칸은 <b>교과서 93쪽</b>을 판이 옮긴 것이에요. 미래에 전해 주고 싶은 풍습은 <b>사람마다 달라서</b> 판은 정답을 정하지 않아요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const LS_KEY = "kedu_progress_g3_2_social_u2_l07";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  bjRow:[0,0,0,0,0], bjRead:null, bjPick:null, bjFin:null, bjMsg:"", bjTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function bjDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 칸에 불 켜기 */
function bjLight(c){
  if(state.bjFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(c) || c<0 || c>=BJ_CELL.length) return;                             // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(bjIsOn(state,c)){ state.bjMsg = BJ_SAY_ON; playThud(); bjDraw(); return; }             // 가드③: 이미 켠 칸 — 판 불변
  if(bjCellOf(c).k === 2){ state.bjMsg = BJ_SAY_NOT; playThud(); bjDraw(); return; }        // 가드④: 세시 음식도 하던 일도 아닌 칸 — 판 불변
  if(bjCellOf(c).k === 1 && !bjFoodAll(state)){ state.bjMsg = BJ_SAY_FOODFIRST; playThud(); bjDraw(); return; }  // 가드⑤: 음식 불을 다 켜기 전 하던 일 — 판 불변
  bjSet(c);
  const nm = bjCellOf(c).name;
  state.bjMsg = ""; state.bjTell = `${nm}에 불을 켰어요. ${BJ_KIND[bjCellOf(c).k]}이에요.`
    + (bjAll(state) ? ` 불을 모두 켰어요. 전광판에 숨은 수가 나타났어요.` : (bjCellOf(c).k === 0 && bjFoodAll(state)) ? ` 세시 음식 칸에 불을 모두 켰어요. 이제 하던 일 칸을 찾아요.` : '');
  if(bjAll(state) || (bjCellOf(c).k === 0 && bjFoodAll(state))) playChime(); else playBlip(); bjDraw();
}
/* 판 읽기 */
function bjRead(i){
  if(state.bjFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=BJ_READQ.length) return;                           // 가드②
  if(!bjAll(state)){ state.bjMsg = BJ_SAY_ORDER_R; playThud(); bjDraw(); return; }         // 가드⑥: 불을 다 켜기 전 — 판 불변
  if(state.bjRead!=null){ state.bjMsg = BJ_SAY_READDONE; bjDraw(); return; }               // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==BJ_READ_OK){ state.bjMsg = BJ_READ_BAD; playThud(); bjDraw(); return; }           // 가드⑧: 어긋난 답 — 판 불변
  state.bjRead = i; state.bjMsg = ""; state.bjTell = `세시 음식 ${bjFoodN(state)}칸과 하던 일 ${bjWorkN(state)}칸, 불을 켠 ${bjLitN(state)}칸이 모여 ${BJ_READQ[BJ_READ_OK]}가 나타났어요. 옛날 명절이나 절기마다 먹던 음식과 하던 일이 있었어요.`; playBlip(); bjDraw();
}
/* 미래에 전해 주고 싶은 풍습 고르기 — 정답 없음 */
function bjPick(p){
  if(state.bjFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=BJ_PICK.length) return;                             // 가드②
  if(state.bjRead==null){ state.bjMsg = BJ_SAY_ORDER_P; playThud(); bjDraw(); return; }    // 가드⑨: 판을 읽기 전 — 판 불변
  if(state.bjPick!=null){ state.bjMsg = BJ_SAY_PICKDONE; bjDraw(); return; }               // 가드⑩: 이미 고른 자리 — 판 불변
  state.bjPick = p; state.bjMsg = ""; state.bjTell = `${bjPickOf(p).mark}를 골랐어요. ${bjPickOf(p).text} — ${bjPickOf(p).why}`; playBlip(); bjDraw();
}
/* 마무리 */
function bjFin(i){
  if(state.bjFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=BJ_FINQ.length) return;                             // 가드②
  if(state.bjPick==null){ state.bjMsg = BJ_SAY_ORDER_FIN; playThud(); bjDraw(); return; }  // 가드⑪: 고르기 전 — 판 불변
  if(i!==BJ_FIN_OK){ state.bjMsg = BJ_FIN_BAD; playThud(); bjDraw(); return; }             // 가드⑫: 어긋난 답 — 판 불변
  state.bjFin = i; state.bjMsg = ""; playChime(); bjDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u2_l08_제길로보내요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

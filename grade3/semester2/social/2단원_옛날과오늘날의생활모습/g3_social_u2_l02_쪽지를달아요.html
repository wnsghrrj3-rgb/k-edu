<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제① 옛날과 오늘날의 풍습 · l02
  「옛날의 일상생활 속 풍습을 알아볼까요」
  교과서 p.69~71 · 지도서 3차시(p.132~136) · [4사04-01]
  수업 기법 = 의견 나누기
=========================================================================

  ■ 직접조작 = 일생 길에 쪽지를 달아요 판 (사회 3-2 열넷째 판 · 2단원 둘째 판)
  ⭐ 씨앗은 교과서 70~71쪽 — 출생, 백일, 첫돌, 관례, 혼례, 회갑, 장례.
  ⭐ 일생 길에 자리 일곱이 차례대로 놓여 있다. 지금 선 자리는 하나뿐이고, 한 걸음씩만 나아간다.
  ⭐ 마음 쪽지 일곱(교과서 70~71쪽 풍습에 담긴 바람과 마음)을 하나 골라 지금 선 자리에 단다.
  ⭐ 짝표가 코드에 따로 없다. 쪽지가 자기 자리 번호와 등 색을 품고 있다(GW_SLIP[s].at · .k).
     GW_SLIP 을 읽는 자리 gwSlipOf · GW_STOP 은 gwStopOf · GW_TALK 은 gwTalkOf 단 하나씩.
  ⭐ 단 쪽지·켜진 등 수는 저장 0 — 지금 선 자리(gwAt)에서 셈으로 나온다(gwHung · gwLampN).
  ⭐ 판을 바꾸는 자리 gwStep 단 하나(state.gwAt += 1) · 되돌리는 자리 0 · 난수 0.

  ■ 이 차시의 뼈대
   옛날 사람들은 살아가는 동안 중요한 일이 있을 때 서로 축하하거나 위로하며 마음을 나눴다.

  ■ 5단계
   ① 쪽지 고르기 → ② 지금 선 자리에 달기(일곱 자리 · 한 걸음씩) → ③ 판 읽기 3택(정답 자리 2)
   ④ 친구와 이야기하고 싶은 옛날 풍습 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다 · 교과서 71쪽 친구와 활동)
   ⑤ 마무리 3택(정답 자리 0) → 완료
      — 고른 풍습에 담긴 생활 모습과 생각을 쓰는 일 · 친구들과 이야기하는 일은 교실 몫

  ■ 가드 12종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호 · 지금 선 자리가 아닌 곳(안내조차 0)
   ③ 이미 단 쪽지 고르기 — 판 불변           ④ 쪽지를 고르기 전 달기 — 판 불변
   ⑤ 지금 선 자리에 맞지 않는 쪽지 — 판 불변  ⑥ 다 달기 전 판 읽기 — 판 불변
   ⑦ 이미 읽은 자리 — 판 불변                ⑧ 판 읽기 어긋난 답 — 판 불변
   ⑨ 판을 읽기 전 고르기 — 판 불변           ⑩ 이미 고른 자리 — 판 불변
   ⑪ 고르기 전 마무리 — 판 불변              ⑫ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 자리 일곱과 쪽지 일곱의 말은 교과서 70~71쪽의 풍습을 판이 줄여 적은 것이고, 등 색은 판이 정한 것(캡션 상시).
   ㉡ 친구와 이야기하고 싶은 풍습은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 고른 풍습에 담긴 생활 모습과 생각을 쓰는 일, 친구들과 이야기하는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐 · 교통·통신수단 용어 0
   · 새 사실 0 — 교과서 69~71쪽 · 지도서 132~136쪽에 있는 사실만 · 누리집 주소 0 · 농요 원문 0
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 네 자리 연도 0 · 지역 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#DB2777; --green-d:#BE185D; --cyan:#C026D3;
  --bg:#FDF2F8; --bub:#FCE7F3; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#FCE7F3;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#FCE7F3;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(219,39,119,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 조작 판 — 일생 길에 쪽지를 달아요 판 */
.gw-wrap{max-width:780px;width:100%;margin:0 auto}
.gw-head{background:#FCE7F3;color:#9D174D;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.gw-board{padding:9px;border-radius:14px;background:#FDF2F8;border:2px solid #FBCFE8;display:grid;grid-template-columns:1fr;gap:9px}
.gw-title{text-align:center;font-weight:800;color:#9D174D;font-size:clamp(12px,2vw,14px);word-break:keep-all}
.gw-lab{font-size:clamp(11px,1.8vw,13px);font-weight:800;color:#BE185D;margin-bottom:4px}
.gw-path{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;position:relative}
.gw-stop{border-radius:12px;border:2px dashed #F9A8D4;background:#fff;padding:6px 4px;text-align:center;min-height:118px;
  display:flex;flex-direction:column;gap:4px;align-items:stretch}
.gw-stop[data-st="now"]{border:3px solid #DB2777;background:#FFF7FB}
.gw-stop[data-st="done"]{border-style:solid;border-color:#F472B6}
.gw-no{font-size:clamp(9px,1.4vw,11px);font-weight:800;color:#BE185D}
.gw-name{font-weight:800;font-size:clamp(12px,2vw,15px);color:#9D174D}
.gw-look{font-size:clamp(9px,1.5vw,11px);color:#475569;line-height:1.35;word-break:keep-all}
.gw-here{font-size:clamp(9px,1.4vw,11px);font-weight:800;color:#fff;background:#DB2777;border-radius:999px;padding:1px 6px;align-self:center}
.gw-note{font-size:clamp(9px,1.5vw,11px);font-weight:700;color:#831843;background:#FCE7F3;border-radius:7px;padding:3px 4px;line-height:1.35;word-break:keep-all}
.gw-lamp{font-size:clamp(9px,1.4vw,11px);font-weight:800;border-radius:999px;padding:1px 6px;align-self:center}
.gw-lamp[data-k="0"]{background:#FDE68A;color:#92400E}
.gw-lamp[data-k="1"]{background:#BFDBFE;color:#1E40AF}
.gw-hang{border:none;border-radius:999px;background:#DB2777;color:#fff;font-family:inherit;font-weight:800;
  font-size:clamp(10px,1.6vw,12px);padding:4px 6px;cursor:pointer}
.gw-hang[data-on="0"]{background:#FBCFE8;color:#9D174D}
.gw-pile{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gw-s{border-radius:10px;border:2px solid #F472B6;background:#fff;padding:7px 5px;font-family:inherit;min-height:46px;
  font-size:clamp(10px,1.7vw,12px);font-weight:700;color:#0F172A;line-height:1.35;word-break:keep-all;cursor:pointer;text-align:center}
.gw-s[data-sel="1"]{background:#DB2777;border-color:#9D174D;color:#fff}
.gw-help{border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;font-size:clamp(11px,1.9vw,14px);line-height:1.6}
.gw-help b{color:#BE185D}
.gw-side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gw-tell{border-radius:11px;padding:8px 12px;font-size:clamp(12px,2vw,15px);line-height:1.6;background:#FDF2F8;border-left:4px solid var(--cyan)}
.gw-talks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.gw-tk{border:2px solid #FBCFE8;border-radius:10px;background:#fff;padding:8px 7px;font-family:inherit;
  font-size:clamp(11px,1.8vw,13px);font-weight:700;color:#0F172A;text-align:left;cursor:pointer;line-height:1.4;word-break:keep-all}

.gw-ask{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#FFFAFD;margin-top:9px;
  font-size:clamp(12px,2vw,15px);line-height:1.6;word-break:keep-all}
.gw-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.gw-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:9px 11px;font-family:inherit;

.gw-opt:hover{border-color:var(--green);background:var(--bub)}
@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}

}

/* ===== 직접 조작: 일생 길에 쪽지를 달아요 판 =====
   마음 쪽지 하나를 고르고, 지금 선 자리의 「여기에 달기」를 누른다.
   ⭐ 판을 바꾸는 자리 gwStep 단 하나 — 한 걸음 나아가는 곳은 여기뿐 · 되돌리는 자리 0.
   ⭐ 짝표 0 — 쪽지가 자기 자리 번호와 등 색을 품는다(GW_SLIP[s].at · .k).
   ⭐ 단 쪽지·켜진 등 수는 저장 0 — 지금 선 자리(gwAt)에서 센다(gwHung · gwLampN).
   ⭐ 일생 길은 한 걸음씩 — 지금 선 자리 앞의 자리에는 달 수 없다.
   ================================================================= */
const GW_STOP = [                                                   // 교과서 70~71쪽 — 일생 동안의 풍습 일곱 · 모습은 판이 줄여 적음

  {name:"관례", look:"결혼하기 전에 성인식을 했어요"},
  {name:"혼례", look:"부부가 되는 예식을 올렸어요"},
  {name:"회갑", look:"자식들이 생신상을 크게 차렸어요"},
  {name:"장례", look:"땅에 묻는 등의 예식을 치렀어요"}
];
const GW_SLIP = [                                                   // 교과서 70~71쪽 풍습에 담긴 바람과 마음 · at 은 달 자리 · k 는 등 색(판이 정함)
  {text:"아기가 아프지 않고 오래 살기를 바라요", at:2, k:0},
  {text:"부모님이 건강하게 오래 사시기를 빌어요", at:5, k:0},
  {text:"산모와 아기가 건강하기를 바라며 나쁜 기운을 막아요", at:0, k:0},
  {text:"남은 가족을 위로하고 죽은 사람의 복을 빌어요", at:6, k:1},
  {text:"이제부터 어른으로 대해 줘요", at:3, k:0},
  {text:"아기가 태어난 지 100일이 된 것을 축하해요", at:1, k:0},
  {text:"성인이 된 두 사람이 부부가 된 것을 축하해요", at:4, k:0}
];
const GW_LAMP = ["축하", "위로"];
const GW_TALK = [                                                   // 교과서 69~71쪽 옛날 풍습 · 지도서 135쪽 친구와 활동
  {mark:"가", text:"두레", why:"여럿이 힘을 합해 농사일을 함께하며 서로 돕고 정을 나눈 모습과 생각을 친구와 이야기할 수 있어요."},
  {mark:"나", text:"첫돌", why:"돌잔치를 하며 아기가 아프지 않고 오래 살기를 바란 마음을 친구와 이야기할 수 있어요."},
  {mark:"다", text:"회갑", why:"부모님이 건강하게 오래 사시기를 빈 자식들의 마음을 친구와 이야기할 수 있어요."}
];
const GW_SAY_HUNG = "이미 단 쪽지예요. 남은 쪽지를 골라요.";
const GW_SAY_PICKFIRST = "먼저 쪽지를 하나 골라요.";
const GW_SAY_OUT = "지금 선 자리의 풍습을 다시 읽어 봐요. 이 쪽지를 달 자리는 따로 있어요.";
const GW_SAY_ORDER_R = "먼저 일곱 자리에 쪽지를 모두 달아 봐요.";
const GW_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const GW_SAY_ORDER_T = "먼저 판을 읽어 봐요.";
const GW_SAY_TALKDONE = "이미 골랐어요. 친구가 고른 것과 견주어 봐요.";
const GW_SAY_ORDER_FIN = "먼저 친구와 이야기하고 싶은 풍습을 골라 봐요.";
const GW_READQ = [
  "일생 동안의 풍습은 모두 슬픔을 나누는 일이에요",
  "중요한 일이 있어도 옛날 사람들은 이웃과 마음을 나누지 않았어요",
  "옛날 사람들은 살아가는 동안 중요한 일이 있을 때 서로 축하하거나 위로하며 마음을 나눴어요"
];
const GW_READ_OK = 2;
const GW_READ_BAD = "켜진 등을 다시 살펴봐요.";
const GW_FINQ = [
  "옛날의 일상생활 속 풍습에는 기쁨과 슬픔을 나누며 서로 돕고 사는 우리 조상들의 마음이 담겨 있어요",
  "옛날 사람들은 힘든 일을 언제나 혼자서만 했어요",
  "옛날의 일상생활 속 풍습을 보아도 당시 사람들의 생각은 알 수 없어요"
];
const GW_FIN_OK = 0;
const GW_FIN_BAD = "일생 길에 단 쪽지를 다시 떠올려 봐요.";

function gwStopOf(i){ return GW_STOP[i]; }                                    // GW_STOP 을 읽는 자리는 여기 단 하나
function gwSlipOf(s){ return GW_SLIP[s]; }                                    // GW_SLIP 을 읽는 자리는 여기 단 하나
function gwTalkOf(p){ return GW_TALK[p]; }                                    // GW_TALK 을 읽는 자리는 여기 단 하나
function gwSlips(){ return [...Array(GW_SLIP.length).keys()]; }
function gwIsHung(st,s){ return gwSlipOf(s).at < st.gwAt; }                   // ★ 단 쪽지 — 지나온 자리의 쪽지
function gwLeft(st){ return gwSlips().filter(s => !gwIsHung(st,s)); }         // ★ 남은 쪽지 — 아직 달지 않은 쪽지
function gwSlipAt(i){ return gwSlips().find(s => gwSlipOf(s).at === i); }     // 자리 i 에 달리는 쪽지 — 쪽지가 품은 at 에서
function gwLampN(st,k){ return gwSlips().filter(s => gwIsHung(st,s) && gwSlipOf(s).k === k).length; }   // ★ 켜진 등 — 셈으로
function gwAll(st){ return st.gwAt === GW_STOP.length; }                      // ★ 끝 기준 = 일곱 자리를 모두 지남
function gwStep(){ state.gwAt += 1; }                                         // ⭐ 판을 바꾸는 자리 단 하나
function gwStage(st){
  if(!gwAll(st)) return "play";
  if(st.gwRead == null) return "read";
  if(st.gwTalk == null) return "talk";
  if(st.gwFin == null) return "fin";
  return "end";
}

/* 판 — 일생 길 일곱 자리 · 남은 쪽지 */
function gwStopHTML(st,i){
  const sd = i < st.gwAt ? "done" : i === st.gwAt ? "now" : "next";
  let low = '';
  if(sd === "done"){ const s = gwSlipAt(i); low = `<div class="gw-note" data-s="${s}">${gwSlipOf(s).text}</div><div class="gw-lamp" data-k="${gwSlipOf(s).k}">${GW_LAMP[gwSlipOf(s).k]} 등</div>`; }
  else if(sd === "now"){ low = `<div class="gw-here">지금 선 자리</div><button class="gw-hang" data-i="${i}" data-on="${st.gwSel == null ? 0 : 1}" onclick="gwHang(${i})">여기에 달기</button>`; }
  return `<div class="gw-stop" data-i="${i}" data-st="${sd}"><div class="gw-no">${i+1}</div><div class="gw-name">${gwStopOf(i).name}</div><div class="gw-look">${gwStopOf(i).look}</div>${low}</div>`;
}
function gwPath(st){
  return `<div><div class="gw-lab">일생 길 — 한 걸음씩 나아가요</div><div class="gw-path">${GW_STOP.map((_,i) => gwStopHTML(st,i)).join('')}</div></div>`;
}
function gwPile(st){
  const left = gwLeft(st);
  return `<div><div class="gw-lab">남은 마음 쪽지 — 누르면 골라요</div><div class="gw-pile">${left.length ? left.map(s =>
    `<button class="gw-s" data-s="${s}" data-sel="${st.gwSel === s ? 1 : 0}" onclick="gwChoose(${s})">${gwSlipOf(s).text}</button>`).join('')
    : `<div class="gw-look" style="grid-column:1/-1;text-align:center">쪽지를 모두 달았어요.</div>`}</div></div>`;
}
function gwBoard(st){
  return `<div class="gw-board" data-at="${st.gwAt}" data-joy="${gwLampN(st,0)}" data-sad="${gwLampN(st,1)}" data-left="${gwLeft(st).length}">
    <div class="gw-title">마음 쪽지를 골라 일생 길에 달아요</div>
    ${gwPath(st)}${gwPile(st)}</div>`;
}
function gwTalks(st){
  return `<div class="gw-talks">${[0,1,2].map(p=>`<button class="gw-tk" data-p="${p}" onclick="gwTalk(${p})"><b>${gwTalkOf(p).mark}</b> ${gwTalkOf(p).text}</button>`).join('')}</div>`;
}
function gwHelp(st){
  return `<div class="gw-help">남은 마음 쪽지 하나를 눌러 <b>골라요</b>. <b>지금 선 자리</b>의 <b>여기에 달기</b>를 눌러요.<br>
    쪽지를 달면 <b>한 걸음</b> 나아가요.<br>
    그 자리의 풍습에 어떤 마음이 담겼는지 생각해요.</div>`;
}
function gwPanel(st){
  const stage = gwStage(st);
  let ask = '';
  if(stage === "play"){
    ask = `<div class="gw-ask" data-step="play"><b>지금 선 자리의 풍습에 어떤 바람과 마음이 담겼는지 생각하며 쪽지를 달아 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="gw-ask" data-step="read"><b>일생 길 끝까지 쪽지를 단 판을 보니 무엇을 알 수 있을까요?</b>
      <div class="gw-opts">${GW_READQ.map((t,i)=>`<button class="gw-opt" onclick="gwRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "talk"){
    ask = `<div class="gw-ask" data-step="talk"><b>옛날 풍습 가운데 친구와 이야기하고 싶은 것을 하나 골라 봐요.</b>${gwTalks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="gw-ask" data-step="fin"><b>옛날의 일상생활 속 풍습을 보면 무엇을 알 수 있을까요?</b>
      <div class="gw-opts">${GW_FINQ.map((t,i)=>`<button class="gw-opt" onclick="gwFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="gw-ask" data-fin="1" style="border-color:#F9A8D4;background:#FDF2F8">
      <b style="color:#9D174D">일생 길 일곱 자리에 쪽지를 모두 달았어요. 옛날 사람들은 중요한 일이 있을 때 서로 축하하거나 위로하며 마음을 나눴어요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>고른 풍습에 담긴 생활 모습과 생각을 쓰는 일</b>, <b>친구들과 이야기하는 일</b>은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.gwTell ? `<div class="gw-tell">${st.gwTell}</div>` : '';
  const warn = st.gwMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.gwMsg}</div>` : '';
  return `<div class="gw-wrap">
    <div class="gw-head">일생 길 <b>${st.gwAt}</b> / ${GW_STOP.length} 자리 · 축하 등 <b>${gwLampN(st,0)}</b> · 위로 등 <b>${gwLampN(st,1)}</b> · 남은 쪽지 <b>${gwLeft(st).length}</b>장</div>
    ${gwBoard(st)}<div class="gw-side">${gwHelp(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 자리 일곱과 쪽지 일곱의 말은 <b>교과서 70~71쪽</b>의 풍습을 판이 줄여 적은 것이고, 등 색은 판이 정한 것이에요. 친구와 이야기하고 싶은 풍습은 <b>사람마다 달라서</b> 판은 정답을 정하지 않아요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  attempt: 1

  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;

  state.revealed = false;

  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;

  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function gwDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 고르기 — 남은 쪽지 하나 */
function gwChoose(s){
  if(state.gwFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(s) || s<0 || s>=GW_SLIP.length) return;                             // 가드②: 무효 쪽지 — 안내조차 띄우지 않음
  if(gwIsHung(state,s)){ state.gwMsg = GW_SAY_HUNG; playThud(); gwDraw(); return; }        // 가드③: 이미 단 쪽지 — 판 불변
  state.gwSel = s;
  state.gwMsg = ""; state.gwTell = `「${gwSlipOf(s).text}」 쪽지를 골랐어요. 지금 선 자리에 맞는지 살펴봐요.`; playBlip(); gwDraw();
}
/* 달기 — 고른 쪽지를 지금 선 자리에 */
function gwHang(i){
  if(state.gwFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i!==state.gwAt || gwAll(state)) return;                        // 가드②: 무효 자리 · 지금 선 자리가 아닌 곳
  if(state.gwSel==null){ state.gwMsg = GW_SAY_PICKFIRST; playThud(); gwDraw(); return; }   // 가드④: 고르기 전 달기 — 판 불변
  const s = state.gwSel;
  if(gwSlipOf(s).at !== i){ state.gwMsg = GW_SAY_OUT; playThud(); gwDraw(); return; }      // 가드⑤: 맞지 않는 쪽지 — 판 불변
  gwStep(); state.gwSel = null;
  state.gwMsg = ""; state.gwTell = `${gwStopOf(i).name} 자리에 「${gwSlipOf(s).text}」 쪽지를 달았어요. ${GW_LAMP[gwSlipOf(s).k]} 등이 켜졌어요.`;
  if(gwAll(state)){ playChime(); } else { playBlip(); } gwDraw();
}
/* 판 읽기 */
function gwRead(i){
  if(state.gwFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=GW_READQ.length) return;                           // 가드②
  if(!gwAll(state)){ state.gwMsg = GW_SAY_ORDER_R; playThud(); gwDraw(); return; }         // 가드⑥: 다 달기 전 — 판 불변
  if(state.gwRead!=null){ state.gwMsg = GW_SAY_READDONE; gwDraw(); return; }               // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==GW_READ_OK){ state.gwMsg = GW_READ_BAD; playThud(); gwDraw(); return; }           // 가드⑧: 어긋난 답 — 판 불변
  state.gwRead = i; state.gwMsg = ""; state.gwTell = `일곱 자리 가운데 축하 등이 ${gwLampN(state,0)}개, 위로 등이 ${gwLampN(state,1)}개 켜졌어요. 옛날 사람들은 기쁜 일은 함께 축하하고, 슬픈 일은 함께 위로했어요.`; playBlip(); gwDraw();
}
/* 친구와 이야기하고 싶은 풍습 고르기 — 정답 없음 */
function gwTalk(p){
  if(state.gwFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=GW_TALK.length) return;                             // 가드②
  if(state.gwRead==null){ state.gwMsg = GW_SAY_ORDER_T; playThud(); gwDraw(); return; }    // 가드⑨: 판을 읽기 전 — 판 불변
  if(state.gwTalk!=null){ state.gwMsg = GW_SAY_TALKDONE; gwDraw(); return; }               // 가드⑩: 이미 고른 자리 — 판 불변
  state.gwTalk = p; state.gwMsg = ""; state.gwTell = `${gwTalkOf(p).mark}를 골랐어요. ${gwTalkOf(p).why}`; playBlip(); gwDraw();
}
/* 마무리 */
function gwFin(i){
  if(state.gwFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=GW_FINQ.length) return;                             // 가드②
  if(state.gwTalk==null){ state.gwMsg = GW_SAY_ORDER_FIN; playThud(); gwDraw(); return; }  // 가드⑪: 고르기 전 — 판 불변
  if(i!==GW_FIN_OK){ state.gwMsg = GW_FIN_BAD; playThud(); gwDraw(); return; }             // 가드⑫: 어긋난 답 — 판 불변
  state.gwFin = i; state.gwMsg = ""; playChime(); gwDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u2_l03_도장을찍어요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제③ 통신수단의 변화로 달라진 생활 모습 · l18 (주제 넷째 시간)
  「통신수단의 변화로 달라진 사람들의 생활 모습을 살펴볼까요」
  교과서 p.131~135 · 지도서 25~26차시(p.259~263 · 두 시간 한 파일) · [4사04-02]
  수업 기법 = 사진 자료 살펴보기 · 의견 나누기
=========================================================================

  ■ 직접조작 = 부품을 끼워요 판 (사회 3-2 서른째 판 · 2단원 열여덟째 판)
  ⭐ 씨앗은 교과서 133쪽 할 수 있어요(전화기의 변화 과정 — 초기의 전화기 · 유선 전화 · 휴대 전화)와
     지도서 261쪽 전화기마다의 특징·사람들의 생활 모습.
     부품 상자에서 부품 하나를 들고 전화기에 끼운다 — 초기의 전화기가 한 단계씩 오늘날 휴대 전화가 된다.
  ⭐ 전화기 단계마다 자기 다음 부품 need 를 품는다(JK_STAGE[k].need) — 정답 자리표 0.
     맞는지는 든 부품 = 지금 단계가 품은 need, 한 자리 견주기(jkFit).
  ⭐ 끼운 부품 수가 판 — jkAt 한 숫자 · 단계는 저장 0(jkAll · jkStage).
  ⭐ 판을 바꾸는 자리 jkNext 단 하나(state.jkAt += 1) · 되돌리는 자리 0 · 난수 0.
     든 부품(jkHand)은 판이 아닌 손 위치 — 끼우면 비운다.

  ■ 이 차시의 뼈대
   휴대 전화와 인터넷 같은 새로운 통신수단이 발달하면서 사람들은 언제 어디서나 다양한 정보를
   쉽고 빠르게 주고받을 수 있게 됐고, 어떤 장소에 직접 가지 않아도 할 수 있는 일이 많아져 생활이 편리해졌다.
   통신수단이 발달하면서 새로운 시설과 직업이 생겨났고, 사라진 통신수단과 직업도 있다.

  ■ 5단계
   ① 부품 들기 → 전화기에 끼우기 (부품 셋 · 되돌리는 부품 둘은 끼워지지 않음) → ② 판 읽기 3택(정답 자리 0)
   ③ 통신수단과 관련 있는 직업 중 갖고 싶은 직업 가·나·다 고르기(정답 없음 · 교과서 132쪽)
   ④ 마무리 3택(정답 자리 1) → 완료
      — 우리 가족 통신수단 조사 · 갖고 싶은 직업 까닭 쓰기 · 알려 드리고 싶은 기능 쓰기는 교실 몫

  ■ 가드 14종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 세 부품을 다 끼운 뒤 들기·끼우기 — 판 불변
   ④ 이미 끼운 부품 들기 — 판 불변            ⑤ 빈손으로 끼우기 — 판 불변
   ⑥ 아직 차례가 아닌 부품 — 판·손 불변       ⑦ 전화기를 옛날로 되돌리는 부품 — 판·손 불변
   ⑧ 다 끼우기 전 판 읽기 — 판 불변           ⑨ 이미 읽은 자리 — 판 불변
   ⑩ 판 읽기 어긋난 답 — 판 불변              ⑪ 판을 읽기 전 고르기 — 판 불변
   ⑫ 이미 고른 자리 — 판 불변                 ⑬ 고르기 전 마무리 — 판 불변
   ⑭ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 전화기 셋의 특징과 생활 모습은 교과서 133쪽·지도서 261쪽을 따랐고, 부품의 이름과 끼우는 차례는 판이 꾸민 것(캡션 상시).
   ㉡ 갖고 싶은 직업은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 가족 통신수단 조사, 직업 까닭 쓰기, 알려 드리고 싶은 기능 쓰기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 신문 기사 출처의 지명·날짜는 넣지 않는다 — 배움터에서 배우는 것과 마음가짐만
   · 뒤 차시 용어는 차시 예고 한 자리뿐
   · 새 사실 0 — 교과서 131~135쪽 · 지도서 259~263쪽에서만
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 누리집 주소 0 · 네 자리 연도 0 · 지역·나라 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%}

  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* ===== 직접 조작: 부품을 끼워요 판 =====
   교과서 133쪽 할 수 있어요(전화기의 변화 과정) · 지도서 261쪽(전화기마다의 특징·생활 모습)
   — 부품 상자에서 부품을 하나 들고 전화기에 끼운다. 초기의 전화기가 한 단계씩 오늘날 휴대 전화가 된다.
   ⭐ 판을 바꾸는 자리 jkNext 단 하나 — state.jkAt += 1 · 되돌리는 자리 0. jkAt = 끼운 부품 수.
   ⭐ 정답 자리표 0 — 전화기 단계마다 자기 다음 부품 need 를 품는다(JK_STAGE[k].need).
   ⭐ 단계는 저장 0 — 판(jkAt)에서 센다(jkAll · jkStage). 든 부품 jkHand 는 손 위치.
   ================================================================= */
const JK_PART = [                                                     // 부품 상자 다섯 — 이름과 차례는 판이 꾸민 것(특징은 교과서 133쪽)
  {mark:"\u{1F50B}", name:"들고 다니는 작은 몸체", back:0},
  {mark:"\u{1FA9D}", name:"벽에 거는 고리", back:1},
  {mark:"\u{1F522}", name:"숫자 번호판", back:0},
  {mark:"\u{1F3A7}", name:"교환원 연결선", back:1},
  {mark:"\u{1F4F7}", name:"사진·쇼핑·은행 기능", back:0}
];
const JK_STAGE = [                                                    // 전화기 네 단계 — 교과서 133쪽 · 지도서 261쪽
  {mark:"\u260E\uFE0F", name:"초기의 전화기", need:2,
   look:"벽에 걸려 있고 숫자 번호판이 없어요. 전화선으로 연결돼요.",
   life:"전화를 걸면 교환원이 중간에서 연결해 줘요. 받는 사람에게 직접 전화할 수 없어요."},
  {mark:"\u{1F4DE}", name:"유선 전화", need:0,
   look:"숫자 번호판이 있어요. 전화선으로 연결돼요.",
   life:"통화하려면 전화기가 있는 곳으로 가야 해요. 자리를 비우면 걸려 오는 전화를 받을 수 없어요."},
  {mark:"\u{1F4F1}", name:"휴대 전화", need:4,
   look:"크기가 작아서 들고 다닐 수 있어요.",
   life:"이동하면서 전화할 수 있어요."},
  {mark:"\u{1F4F1}", name:"오늘날의 휴대 전화", need:null,
   look:"크기가 작아서 들고 다닐 수 있고, 통화 외에 다양한 기능이 있어요.",
   life:"통화, 사진 촬영, 온라인 쇼핑, 은행 거래 등 다양한 기능을 이용할 수 있어요."}
];
const JK_N = 3;                                                       // 끼우는 부품 셋
const JK_PICK = [                                                     // 교과서 132쪽 스스로 활동 — 통신수단과 관련 있는 직업
  {mark:"가", text:"촬영 기사", why:"영상을 촬영하고, 텔레비전 방송 시간에 맞춰 내보내요."},
  {mark:"나", text:"통신 설비 기술자", why:"휴대 전화나 컴퓨터의 통신을 원활하게 해 주는 기지국을 설치해요."},
  {mark:"다", text:"인공위성 개발자", why:"다양한 정보를 수집할 수 있는 인공위성을 만들어요."}
];
const JK_SAY_ALL = "부품 세 개를 모두 끼웠어요. 판을 읽어 봐요.";
const JK_SAY_USED = "이미 끼운 부품이에요. 남은 부품을 들어 봐요.";
const JK_SAY_EMPTY = "먼저 부품 상자에서 부품을 하나 들어 봐요.";
const JK_SAY_EARLY = "아직 차례가 아니에요. 지금 전화기에 무엇이 없는지 먼저 살펴봐요.";
const JK_SAY_BACK = "그 부품은 전화기를 옛날로 되돌려요. 오늘날 쪽으로 바꿔 줄 부품을 찾아봐요.";
const JK_SAY_ORDER_R = "먼저 부품 세 개를 모두 끼워 봐요.";
const JK_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const JK_SAY_ORDER_P = "먼저 판을 읽어 봐요.";
const JK_SAY_PICKDONE = "이미 골랐어요. 친구가 고른 직업과 견주어 봐요.";
const JK_SAY_ORDER_FIN = "먼저 갖고 싶은 직업을 골라 봐요.";
const JK_READQ = [
  "전화기가 바뀌면서 교환원 없이 직접 전화를 걸고, 들고 다니며 통화하고, 사진 촬영이나 은행 거래까지 할 수 있게 됐어요",
  "전화기는 모양만 바뀌었을 뿐 사람들이 이용하는 모습은 달라지지 않았어요",
  "오늘날 휴대 전화도 통화하려면 전화기가 있는 곳으로 가야 해요"
];
const JK_READ_OK = 0;
const JK_READ_BAD = "판에서 부품을 하나씩 끼울 때마다 무엇이 달라졌는지 다시 떠올려 봐요.";
const JK_FINQ = [
  "통신수단이 발달해도 사람들의 생활 모습은 옛날과 똑같아요",
  "통신수단의 발달로 사람들은 언제 어디서나 다양한 정보를 쉽고 빠르게 주고받고, 새로운 시설과 직업도 생겨났어요",
  "통신수단이 발달하면서 새로운 직업은 하나도 생기지 않았어요"
];
const JK_FIN_OK = 1;
const JK_FIN_BAD = "오늘 살펴본 달라진 생활 모습과 새로 생긴 시설·직업을 다시 떠올려 봐요.";

function jkPartOf(p){ return JK_PART[p]; }                                     // JK_PART 를 읽는 자리는 여기 단 하나
function jkStageOf(k){ return JK_STAGE[k]; }                                   // JK_STAGE 를 읽는 자리는 여기 단 하나
function jkPickOf(p){ return JK_PICK[p]; }                                     // JK_PICK 을 읽는 자리는 여기 단 하나
function jkAll(st){ return st.jkAt >= JK_N; }                                  // ★ 세 부품 모두 끼움
function jkNext(){ state.jkAt += 1; }                                          // ⭐ 판을 바꾸는 자리 단 하나
function jkUsed(st,p){ for(let k=0;k<st.jkAt;k++) if(jkStageOf(k).need===p) return true; return false; }   // 이미 끼운 부품인가
function jkStage(st){
  if(!jkAll(st)) return "fit";
  if(st.jkRead == null) return "read";
  if(st.jkPick == null) return "pick";
  if(st.jkFin == null) return "fin";
  return "end";
}

/* 판 — 전화기 · 끼운 자리 · 부품 상자 */
function jkPhone(st){
  const G = jkStageOf(st.jkAt);
  const slots = [...Array(JK_N).keys()].map(i => i < st.jkAt
    ? `<div class="jk-slot" data-i="${i}" data-in="1">${jkPartOf(jkStageOf(i).need).mark} ${jkPartOf(jkStageOf(i).need).name}</div>`
    : `<div class="jk-slot" data-i="${i}" data-in="0">빈 자리 ${i+1}</div>`).join('');
  return `<div class="jk-phone" data-at="${st.jkAt}"><div class="jk-pname">${G.name}</div><div class="jk-pmark">${G.mark}</div>
    <div class="jk-look"><b>생김새</b> ${G.look}</div><div class="jk-life"><b>생활 모습</b> ${G.life}</div>
    <div class="jk-slots">${slots}</div></div>`;
}
function jkPartBtn(st,p){
  const P = jkPartOf(p), up = st.jkHand === p, used = jkUsed(st,p);
  return `<button class="jk-part" data-p="${p}" data-up="${up ? 1 : 0}" data-used="${used ? 1 : 0}" onclick="jkTake(${p})"><span>${P.mark}</span>${P.name}</button>`;
}
function jkTray(st){
  const hand = st.jkHand == null ? '\u2014 빈손' : `${jkPartOf(st.jkHand).mark} ${jkPartOf(st.jkHand).name}`;
  return `<div class="jk-tray"><div class="jk-tray-t">\u{1F9F0} 부품 상자</div>
    <div class="jk-parts">${JK_PART.map((P,p) => jkPartBtn(st,p)).join('')}</div></div>
    <div class="jk-ctl"><div class="jk-hand">든 부품: ${hand}</div><button class="jk-fit" onclick="jkFit()">\u{1F527} 전화기에 끼우기</button></div>`;
}
function jkBoard(st){
  return `<div class="jk-board" data-at="${st.jkAt}" data-hand="${st.jkHand == null ? '' : st.jkHand}">
    <div class="jk-title">부품을 끼워 초기의 전화기를 오늘날의 휴대 전화로 바꿔요</div>
    ${jkPhone(st)}${jkAll(st) ? '' : jkTray(st)}</div>`;
}
function jkPicks(st){
  return `<div class="jk-picks">${[0,1,2].map(p=>`<button class="jk-pk" data-p="${p}" onclick="jkPick(${p})"><b>${jkPickOf(p).mark}</b> ${jkPickOf(p).text}</button>`).join('')}</div>`;
}
function jkHelp(st){
  return `<div class="jk-help">① 전화기의 <b>생김새</b>와 <b>생활 모습</b>을 읽고 무엇이 없는지 살펴봐요.<br>
    ② 부품 상자에서 <b>부품</b>을 하나 들어요.<br>
    ③ <b>전화기에 끼우기</b>를 눌러요. 전화기가 한 단계 달라져요.</div>`;
}
function jkPanel(st){
  const stage = jkStage(st);
  let ask = '';
  if(stage === "fit"){
    ask = `<div class="jk-ask2" data-step="fit"><b>전화기는 어떻게 달라져 왔을까요? 부품을 하나씩 끼우며 생활 모습이 어떻게 바뀌는지 살펴봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="jk-ask2" data-step="read"><b>부품 세 개를 모두 끼웠어요. 전화기가 바뀌면서 사람들의 생활 모습은 어떻게 달라졌나요?</b>
      <div class="jk-opts">${JK_READQ.map((t,i)=>`<button class="jk-opt" onclick="jkRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="jk-ask2" data-step="pick"><b>통신수단과 관련 있는 직업 중 내가 갖고 싶은 직업은 무엇인가요?</b>${jkPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="jk-ask2" data-step="fin"><b>통신수단의 변화로 사람들의 생활 모습은 어떻게 달라졌나요?</b>
      <div class="jk-opts">${JK_FINQ.map((t,i)=>`<button class="jk-opt" onclick="jkFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="jk-ask2" data-fin="1" style="border-color:#F9A8D4;background:#FDF2F8">
      <b style="color:#9D174D">부품 세 개를 모두 끼워 초기의 전화기를 오늘날의 휴대 전화로 바꿨어요. 통신수단의 발달로 사람들은 언제 어디서나 다양한 정보를 쉽고 빠르게 주고받을 수 있게 됐고, 새로운 시설과 직업도 생겨났어요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ 우리 가족이 즐겨 쓰는 <b>통신수단 조사하기</b>, 갖고 싶은 직업의 <b>까닭 쓰기</b>, 디지털 배움터의 자원봉사자가 되어 <b>알려 드리고 싶은 기능 쓰기</b>는 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.jkTell ? `<div class="jk-tell">${st.jkTell}</div>` : '';
  const warn = st.jkMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.jkMsg}</div>` : '';
  return `<div class="jk-wrap">

  <h2 class="ka-t">통신수단의 변화로 달라진 생활 모습을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','통신수단의 변화로 달라진 생활 모습')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>통신수단의 발달로 사람들은 <b>언제 어디서나</b> 다양한 정보를 쉽고 빠르게 주고받을 수 있게 됐어요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>어떤 장소에 <b>직접 가지 않아도</b> 할 수 있는 일이 많아지면서 생활이 편리해졌어요. 모바일 메신저, 인터넷 쇼핑과 은행 거래, 집에서 받는 진료, 화상 회의가 그 예예요.</div></div>
    <div class="sum-item"><span class="n">3</span><div>통신수단이 발달하면서 휴대 전화 기지국, 스마트 시티 상황실, 방송국, 우주 센터 같은 <b>새로운 시설</b>과 통신 설비 기술자, 폐회로 텔레비전 통합 관제 요원, 촬영 기사, 방송 프로듀서, 인공위성 개발자 같은 <b>새로운 직업</b>이 생겨났어요.</div></div>
  </div>
  <div class="note">다음 시간에는 통신수단을 <b style="color:#DB2777">올바르게 이용하는 방법</b>을 알아봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"통신수단의 발달로 달라진 생활 모습을 말할 수 있어요",st)}
    ${selfCheck(1,"통신수단의 발달로 생겨난 시설과 직업을 말할 수 있어요",st)}
    ${selfCheck(2,"전화기의 변화로 달라진 생활 모습을 설명할 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">통신수단의 변화로 달라진 생활 모습을 살펴봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">우리 가족이 즐겨 쓰는 <b style="color:#DB2777">통신수단과 이용 목적</b>을 조사하고, 통신수단과 관련 있는 직업 중 갖고 싶은 직업과 그 까닭을 써 봐요. 이건 교실 몫이에요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u2_l18";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  jkAt:0, jkHand:null, jkRead:null, jkPick:null, jkFin:null, jkMsg:"", jkTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function jkDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 부품 들기 — 손 위치일 뿐 판은 그대로(든 부품을 다시 누르면 내려놓음) */
function jkTake(p){
  if(state.jkFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(p) || p<0 || p>=JK_PART.length) return;                             // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(jkAll(state)){ state.jkMsg = JK_SAY_ALL; jkDraw(); return; }                          // 가드③: 다 끼운 뒤 — 판·손 불변
  if(jkUsed(state,p)){ state.jkMsg = JK_SAY_USED; playThud(); jkDraw(); return; }          // 가드④: 이미 끼운 부품 — 판·손 불변
  state.jkHand = (state.jkHand === p) ? null : p; state.jkMsg = ""; playBlip(); jkDraw();
}
/* 끼우면 — 판 한 칸 · 손 비움 · 알림 */
function jkDone(){
  const k = state.jkAt, P = jkPartOf(jkStageOf(k).need);
  jkNext();
  const G = jkStageOf(state.jkAt);
  state.jkHand = null; state.jkMsg = "";
  state.jkTell = `${P.name}, 끼웠어요. 이제 전화기는 ${G.name} — ${G.life}` + (jkAll(state) ? ` 부품 세 개를 모두 끼웠어요.` : '');
  if(jkAll(state)) playChime(); else playBlip(); jkDraw();
}
/* 전화기에 끼우기 */
function jkFit(){
  if(state.jkFin!=null) return;                                                            // 가드①
  if(jkAll(state)){ state.jkMsg = JK_SAY_ALL; jkDraw(); return; }                          // 가드③: 다 끼운 뒤 — 판 불변
  if(state.jkHand == null){ state.jkMsg = JK_SAY_EMPTY; playThud(); jkDraw(); return; }    // 가드⑤: 빈손 — 판 불변
  if(state.jkHand !== jkStageOf(state.jkAt).need){                                         // ★ 맞음 판정 한 자리(든 부품 = 지금 단계가 품은 need)
    state.jkMsg = jkPartOf(state.jkHand).back ? JK_SAY_BACK : JK_SAY_EARLY;                // 가드⑦: 되돌리는 부품 · 가드⑥: 아직 차례 아님 — 판·손 불변
    playThud(); jkDraw(); return; }
  jkDone();
}
/* 판 읽기 */
function jkRead(i){
  if(state.jkFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=JK_READQ.length) return;                           // 가드②
  if(!jkAll(state)){ state.jkMsg = JK_SAY_ORDER_R; playThud(); jkDraw(); return; }         // 가드⑧: 다 끼우기 전 — 판 불변
  if(state.jkRead!=null){ state.jkMsg = JK_SAY_READDONE; jkDraw(); return; }               // 가드⑨: 이미 정한 자리 — 판 불변
  if(i!==JK_READ_OK){ state.jkMsg = JK_READ_BAD; playThud(); jkDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.jkRead = i; state.jkMsg = ""; state.jkTell = `통신수단의 발달로 언제 어디서나 필요한 정보를 얻을 수 있고 자유롭게 의사소통을 할 수 있게 되어 사람들의 생활이 편리해졌어요. 어떤 장소에 직접 가지 않아도 할 수 있는 일이 많아졌어요.`; playBlip(); jkDraw();
}
/* 갖고 싶은 직업 고르기 — 정답 없음 */
function jkPick(p){
  if(state.jkFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=JK_PICK.length) return;                             // 가드②
  if(state.jkRead==null){ state.jkMsg = JK_SAY_ORDER_P; playThud(); jkDraw(); return; }    // 가드⑪: 판을 읽기 전 — 판 불변
  if(state.jkPick!=null){ state.jkMsg = JK_SAY_PICKDONE; jkDraw(); return; }               // 가드⑫: 이미 고른 자리 — 판 불변
  state.jkPick = p; state.jkMsg = ""; state.jkTell = `${jkPickOf(p).mark}를 골랐어요. ${jkPickOf(p).text} — ${jkPickOf(p).why}`; playBlip(); jkDraw();
}
/* 마무리 */
function jkFin(i){
  if(state.jkFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=JK_FINQ.length) return;                             // 가드②
  if(state.jkPick==null){ state.jkMsg = JK_SAY_ORDER_FIN; playThud(); jkDraw(); return; }  // 가드⑬: 고르기 전 — 판 불변
  if(i!==JK_FIN_OK){ state.jkMsg = JK_FIN_BAD; playThud(); jkDraw(); return; }             // 가드⑭: 어긋난 답 — 판 불변
  state.jkFin = i; state.jkMsg = ""; playChime(); jkDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제① 옛날과 오늘날의 풍습 · l03
  「옛날과 오늘날의 일상생활 속 풍습을 비교해 볼까요」
  교과서 p.72~76 · 지도서 4~5차시(p.142~151) · 두 시간 한 파일 · [4사04-01]
  수업 기법 = 조사하기, 비교하기
=========================================================================

  ■ 직접조작 = 두 장면을 견주어 도장을 찍어요 판 (사회 3-2 열다섯째 판 · 2단원 셋째 판)
  ⭐ 씨앗은 교과서 72~73쪽 결혼 풍습 그림과 지도서 143쪽 비교표 — 장소, 입는 옷, 주고받는 물건,
     결혼식을 마친 뒤 하는 일, 비슷한 점(축복 · 알림).
  ⭐ 비교표에 줄 여섯이 있다. 처음엔 줄 이름만 보이고 칸은 가려져 있다.
     돋보기로 한 줄을 고르면 옛날 칸과 오늘날 칸이 함께 열린다.
  ⭐ 두 칸을 견주어 「달라요」나 「같아요」 도장을 찍는다. 맞는 도장이어야 찍힌다.
  ⭐ 짝표가 코드에 따로 없다. 줄이 자기 도장 번호를 품고 있다(DJ_ROW[i].k).
     DJ_ROW 를 읽는 자리 djRowOf · DJ_PICK 은 djPickOf 단 하나씩.
  ⭐ 다른 줄·같은 줄 수는 저장 0 — 찍힌 도장(djMark)에서 셈으로 나온다(djDiffN · djSameN).
  ⭐ 판을 바꾸는 자리 djSet 단 하나(state.djMark |= 1 << i) · 지우는 자리 0 · 난수 0.

  ■ 이 차시의 뼈대
   옛날과 오늘날의 결혼 풍습은 다르지만, 부부가 된 것을 알리고 신랑 신부의 미래를 축복해 주는 마음은 변함없다.
   옛날 풍습 중에는 변화하면서 이어져 내려오는 풍습도 있고, 사라져 가는 풍습도 있다.

  ■ 5단계
   ① 돋보기로 줄 고르기 → ② 도장 찍기(줄 여섯) → ③ 판 읽기 3택(정답 자리 1)
   ④ 인터넷으로 조사하고 싶은 풍습 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다 · 교과서 76쪽 할 수 있어요)
   ⑤ 마무리 3택(정답 자리 2) → 완료
      — 인터넷으로 조사해 표에 정리하는 일 · 친구들과 나누는 일은 교실 몫

  ■ 가드 12종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 이미 도장을 찍은 줄 고르기 — 판 불변      ④ 줄을 고르기 전 도장 — 판 불변
   ⑤ 두 칸과 맞지 않는 도장 — 판 불변          ⑥ 다 찍기 전 판 읽기 — 판 불변
   ⑦ 이미 읽은 자리 — 판 불변                ⑧ 판 읽기 어긋난 답 — 판 불변
   ⑨ 판을 읽기 전 고르기 — 판 불변           ⑩ 이미 고른 자리 — 판 불변
   ⑪ 고르기 전 마무리 — 판 불변              ⑫ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 줄 여섯의 말은 교과서 72~73쪽의 결혼 풍습을 판이 줄여 적은 것(캡션 상시).
   ㉡ 조사하고 싶은 풍습은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 인터넷으로 조사해 표에 정리하는 일, 친구들과 나누는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐 · 교통·통신수단 용어 0
   · 새 사실 0 — 교과서 72~76쪽 · 지도서 142~151쪽에 있는 사실만 · 누리집 주소 0 · 신문 이름 0
   · 폐백은 「드리기도 해요」 — 모든 결혼식에서 드린다는 오개념을 만들지 않음(지도서 144쪽)
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 네 자리 연도 0 · 지역 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#DB2777; --green-d:#BE185D; --cyan:#C026D3;
  --bg:#FDF2F8; --bub:#FCE7F3; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#FCE7F3;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#FCE7F3;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(219,39,119,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 조작 판 — 두 장면을 견주어 도장을 찍어요 판 */
.dj-wrap{max-width:780px;width:100%;margin:0 auto}
.dj-head{background:#FCE7F3;color:#9D174D;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.dj-board{padding:9px;border-radius:14px;background:#FDF2F8;border:2px solid #FBCFE8;display:grid;grid-template-columns:1fr;gap:6px}
.dj-title{text-align:center;font-weight:800;color:#9D174D;font-size:clamp(12px,2vw,14px);word-break:keep-all}
.dj-lab{font-size:clamp(11px,1.8vw,13px);font-weight:800;color:#BE185D;margin-bottom:2px}
.dj-row,.dj-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) minmax(0,2fr) minmax(0,1.3fr);gap:5px;align-items:stretch}
.dj-top div{font-size:clamp(10px,1.6vw,12px);font-weight:800;color:#9D174D;text-align:center}
.dj-row{border-radius:11px;border:2px dashed #F9A8D4;background:#fff;padding:5px}
.dj-row[data-st="look"]{border:3px solid #DB2777;background:#FFF7FB}
.dj-row[data-st="done"]{border-style:solid;border-color:#F472B6}
.dj-name{font-weight:800;font-size:clamp(11px,1.8vw,13px);color:#9D174D;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all}
.dj-cell{font-size:clamp(10px,1.6vw,12px);color:#0F172A;background:#FDF2F8;border-radius:7px;padding:4px 5px;line-height:1.35;word-break:keep-all;
  display:flex;align-items:center;justify-content:center;text-align:center;min-height:34px}
.dj-cell[data-open="0"]{color:#F9A8D4;font-weight:800}
.dj-cell[data-side="1"]{background:#FCE7F3}
.dj-mark{display:flex;align-items:center;justify-content:center}
.dj-lens{border:2px solid #F472B6;border-radius:999px;background:#fff;color:#BE185D;font-family:inherit;font-weight:800;
  font-size:clamp(10px,1.6vw,12px);padding:4px 8px;cursor:pointer}
.dj-lens[data-on="1"]{background:#DB2777;color:#fff;border-color:#9D174D}
.dj-seal{font-weight:800;font-size:clamp(10px,1.6vw,12px);border-radius:999px;padding:3px 8px;border:2px solid}
.dj-seal[data-k="0"]{color:#BE185D;border-color:#DB2777;background:#FFF1F2}
.dj-seal[data-k="1"]{color:#1E40AF;border-color:#3B82F6;background:#EFF6FF}
.dj-pads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.dj-pad{border:none;border-radius:11px;font-family:inherit;font-weight:800;font-size:clamp(12px,2vw,15px);padding:9px 8px;cursor:pointer}
.dj-pad[data-k="0"]{background:#DB2777;color:#fff}
.dj-pad[data-k="1"]{background:#3B82F6;color:#fff}

.dj-help{border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;font-size:clamp(11px,1.9vw,14px);line-height:1.6}
.dj-help b{color:#BE185D}
.dj-side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dj-tell{border-radius:11px;padding:8px 12px;font-size:clamp(12px,2vw,15px);line-height:1.6;background:#FDF2F8;border-left:4px solid var(--cyan)}
.dj-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}

  font-size:clamp(11px,1.8vw,13px);font-weight:700;color:#0F172A;text-align:left;cursor:pointer;line-height:1.4;word-break:keep-all}

/* ===== 직접 조작: 두 장면을 견주어 도장을 찍어요 판 =====
   돋보기로 비교표의 한 줄을 고르면 옛날 칸과 오늘날 칸이 함께 열린다. 두 칸을 견주어 도장을 찍는다.
   ⭐ 판을 바꾸는 자리 djSet 단 하나 — 도장이 찍히는 곳은 여기뿐 · 지우는 자리 0.
   ⭐ 짝표 0 — 줄이 자기 도장 번호를 품는다(DJ_ROW[i].k · 0 달라요 · 1 같아요).
   ⭐ 다른 줄·같은 줄 수는 저장 0 — 찍힌 도장(djMark)에서 센다(djDiffN · djSameN).
   ⭐ 줄 순서는 자유 — 어느 줄부터 견주어도 된다.
   ================================================================= */
const DJ_ROW = [                                                    // 교과서 72~73쪽 결혼 풍습 · 지도서 143쪽 비교표 — 말은 판이 줄여 적음
  {name:"장소", old:"신부 집", now:"결혼식장, 공원 등", k:0},
  {name:"축복", old:"가족과 친척들이 신랑 신부를 축복해 줘요", now:"가족과 친척들이 신랑 신부를 축복해 줘요", k:1},
  {name:"입는 옷", old:"혼례복(한복)", now:"턱시도, 웨딩드레스", k:0},
  {name:"주고받는 물건", old:"나무로 만든 기러기", now:"반지", k:0},
  {name:"알림", old:"사람들에게 두 사람이 부부가 된 것을 알려요", now:"사람들에게 두 사람이 부부가 된 것을 알려요", k:1},
  {name:"결혼식을 마친 뒤", old:"신부 집에서 며칠을 보낸 뒤 신랑 집으로 가요", now:"신혼여행을 떠나요", k:0}
];
const DJ_SEAL = ["달라요", "같아요"];
const DJ_PICK = [                                                   // 교과서 76쪽 할 수 있어요 — 인터넷으로 조사할 주제
  {mark:"가", text:"출생", why:"아기가 태어났을 때 옛날과 오늘날 사람들이 어디에서 무엇을 하는지 견주어 조사할 수 있어요."},
  {mark:"나", text:"첫돌", why:"첫 번째 생일에 옛날과 오늘날 사람들이 어떻게 잔치를 하는지 견주어 조사할 수 있어요."},
  {mark:"다", text:"장례", why:"사람이 죽었을 때 옛날과 오늘날 장례를 치르는 모습이 무엇이 달라졌는지 견주어 조사할 수 있어요."}
];
const DJ_SAY_DONE = "이미 도장을 찍은 줄이에요. 남은 줄을 골라요.";
const DJ_SAY_LOOKFIRST = "먼저 돋보기로 견줄 줄을 하나 골라요.";
const DJ_SAY_OUT = "두 칸을 다시 천천히 견줘 봐요.";
const DJ_SAY_ORDER_R = "먼저 여섯 줄에 도장을 모두 찍어 봐요.";
const DJ_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const DJ_SAY_ORDER_P = "먼저 판을 읽어 봐요.";
const DJ_SAY_PICKDONE = "이미 골랐어요. 친구가 고른 것과 견주어 봐요.";
const DJ_SAY_ORDER_FIN = "먼저 조사하고 싶은 풍습을 골라 봐요.";
const DJ_READQ = [
  "옛날과 오늘날의 결혼 풍습은 모든 것이 똑같아요",
  "결혼하는 장소, 입는 옷, 주고받는 물건은 달라졌지만 부부가 된 것을 알리고 축복해 주는 마음은 같아요",
  "오늘날 결혼식에는 축복해 주는 가족과 친척이 없어요"
];
const DJ_READ_OK = 1;
const DJ_READ_BAD = "도장이 찍힌 줄을 다시 살펴봐요.";
const DJ_FINQ = [
  "옛날 풍습은 오늘날 모두 사라졌어요",
  "풍습은 한번 정해지면 조금도 바뀌지 않아요",
  "옛날과 오늘날의 풍습을 비교하면 사람들의 생활이 무엇이 달라졌는지 알 수 있어요"
];
const DJ_FIN_OK = 2;
const DJ_FIN_BAD = "도장을 찍은 비교표를 다시 떠올려 봐요.";

function djRowOf(i){ return DJ_ROW[i]; }                                      // DJ_ROW 를 읽는 자리는 여기 단 하나
function djPickOf(p){ return DJ_PICK[p]; }                                    // DJ_PICK 을 읽는 자리는 여기 단 하나
function djRows(){ return [...Array(DJ_ROW.length).keys()]; }
function djIsDone(st,i){ return (st.djMark >> i & 1) === 1; }                 // ★ 도장이 찍힌 줄 — 찍힌 도장에서
function djLeft(st){ return djRows().filter(i => !djIsDone(st,i)); }          // ★ 남은 줄
function djDiffN(st){ return djRows().filter(i => djIsDone(st,i) && djRowOf(i).k === 0).length; }   // ★ 달라요 줄 — 셈으로
function djSameN(st){ return djRows().filter(i => djIsDone(st,i) && djRowOf(i).k === 1).length; }   // ★ 같아요 줄 — 셈으로
function djAll(st){ return djLeft(st).length === 0; }                         // ★ 끝 기준 = 남은 줄 0
function djSet(i){ state.djMark |= 1 << i; }                                  // ⭐ 판을 바꾸는 자리 단 하나
function djStage(st){
  if(!djAll(st)) return "play";
  if(st.djRead == null) return "read";
  if(st.djPick == null) return "pick";
  if(st.djFin == null) return "fin";
  return "end";
}

/* 판 — 비교표 여섯 줄 · 도장 두 개 */
function djRowHTML(st,i){
  const sd = djIsDone(st,i) ? "done" : st.djAt === i ? "look" : "next";
  const open = sd !== "next";
  const cell = (side,t) => `<div class="dj-cell" data-side="${side}" data-open="${open ? 1 : 0}">${open ? t : '?'}</div>`;
  const mark = sd === "done"
    ? `<span class="dj-seal" data-k="${djRowOf(i).k}">${DJ_SEAL[djRowOf(i).k]}</span>`
    : `<button class="dj-lens" data-i="${i}" data-on="${sd === "look" ? 1 : 0}" onclick="djLook(${i})">돋보기</button>`;
  return `<div class="dj-row" data-i="${i}" data-st="${sd}"><div class="dj-name">${djRowOf(i).name}</div>${cell(0,djRowOf(i).old)}${cell(1,djRowOf(i).now)}<div class="dj-mark">${mark}</div></div>`;
}
function djTable(st){
  return `<div><div class="dj-lab">비교표 — 돋보기로 한 줄씩 열어요</div>
    <div class="dj-top"><div>견줄 것</div><div>옛날 결혼 풍습</div><div>오늘날 결혼 풍습</div><div>도장</div></div>
    ${DJ_ROW.map((_,i) => djRowHTML(st,i)).join('')}</div>`;
}
function djPads(st){
  return `<div class="dj-pads">${[0,1].map(k => `<button class="dj-pad" data-k="${k}" data-on="${st.djAt == null ? 0 : 1}" onclick="djStamp(${k})">${DJ_SEAL[k]} 도장</button>`).join('')}</div>`;
}
function djBoard(st){
  return `<div class="dj-board" data-mark="${st.djMark}" data-diff="${djDiffN(st)}" data-same="${djSameN(st)}" data-left="${djLeft(st).length}">
    <div class="dj-title">옛날과 오늘날의 결혼 풍습을 견주어 도장을 찍어요</div>
    ${djTable(st)}${djAll(st) ? '' : djPads(st)}</div>`;
}
function djPicks(st){
  return `<div class="dj-picks">${[0,1,2].map(p=>`<button class="dj-pk" data-p="${p}" onclick="djPick(${p})"><b>${djPickOf(p).mark}</b> ${djPickOf(p).text}</button>`).join('')}</div>`;
}
function djHelp(st){
  return `<div class="dj-help">견줄 줄의 <b>돋보기</b>를 눌러 두 칸을 <b>열어요</b>.<br>
    옛날 칸과 오늘날 칸을 견주어 <b>달라요</b>나 <b>같아요</b> 도장을 찍어요.<br>
    어느 줄부터 견주어도 좋아요.</div>`;
}
function djPanel(st){
  const stage = djStage(st);
  let ask = '';
  if(stage === "play"){
    ask = `<div class="dj-ask" data-step="play"><b>옛날과 오늘날의 결혼 풍습에서 무엇이 달라졌고 무엇이 같은지 견주며 도장을 찍어 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="dj-ask" data-step="read"><b>여섯 줄에 도장을 모두 찍은 판을 보니 무엇을 알 수 있을까요?</b>
      <div class="dj-opts">${DJ_READQ.map((t,i)=>`<button class="dj-opt" onclick="djRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="dj-ask" data-step="pick"><b>옛날과 오늘날을 견주어 인터넷으로 조사하고 싶은 풍습을 하나 골라 봐요.</b>${djPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="dj-ask" data-step="fin"><b>옛날과 오늘날의 풍습을 비교하면 무엇을 알 수 있을까요?</b>
      <div class="dj-opts">${DJ_FINQ.map((t,i)=>`<button class="dj-opt" onclick="djFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="dj-ask" data-fin="1" style="border-color:#F9A8D4;background:#FDF2F8">
      <b style="color:#9D174D">비교표 여섯 줄에 도장을 모두 찍었어요. 결혼하는 모습은 달라졌지만, 부부가 된 것을 알리고 축복해 주는 마음은 변함없어요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>고른 풍습을 인터넷으로 조사해 표에 정리하는 일</b>, <b>친구들과 나누는 일</b>은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.djTell ? `<div class="dj-tell">${st.djTell}</div>` : '';
  const warn = st.djMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.djMsg}</div>` : '';
  return `<div class="dj-wrap">
    <div class="dj-head">도장 <b>${DJ_ROW.length - djLeft(st).length}</b> / ${DJ_ROW.length} 줄 · 달라요 <b>${djDiffN(st)}</b> · 같아요 <b>${djSameN(st)}</b> · 남은 줄 <b>${djLeft(st).length}</b></div>
    ${djBoard(st)}<div class="dj-side">${djHelp(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 줄 여섯의 말은 <b>교과서 72~73쪽</b>의 결혼 풍습을 판이 줄여 적은 것이에요. 조사하고 싶은 풍습은 <b>사람마다 달라서</b> 판은 정답을 정하지 않아요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function djDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 돋보기 — 견줄 줄 하나 */
function djLook(i){
  if(state.djFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(i) || i<0 || i>=DJ_ROW.length) return;                              // 가드②: 무효 줄 — 안내조차 띄우지 않음
  if(djIsDone(state,i)){ state.djMsg = DJ_SAY_DONE; playThud(); djDraw(); return; }        // 가드③: 이미 찍은 줄 — 판 불변
  state.djAt = i;
  state.djMsg = ""; state.djTell = `「${djRowOf(i).name}」 줄을 열었어요. 옛날 칸과 오늘날 칸을 견줘 봐요.`; playBlip(); djDraw();
}
/* 도장 — 연 줄에 */
function djStamp(k){
  if(state.djFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(k) || k<0 || k>=DJ_SEAL.length || djAll(state)) return;             // 가드②: 무효 도장 · 다 찍은 뒤
  if(state.djAt==null){ state.djMsg = DJ_SAY_LOOKFIRST; playThud(); djDraw(); return; }    // 가드④: 줄을 고르기 전 — 판 불변
  const i = state.djAt;
  if(djRowOf(i).k !== k){ state.djMsg = DJ_SAY_OUT; playThud(); djDraw(); return; }        // 가드⑤: 맞지 않는 도장 — 판 불변
  djSet(i); state.djAt = null;
  state.djMsg = ""; state.djTell = `「${djRowOf(i).name}」 줄에 「${DJ_SEAL[k]}」 도장을 찍었어요.`;
  if(djAll(state)){ playChime(); } else { playBlip(); } djDraw();
}
/* 판 읽기 */
function djRead(i){
  if(state.djFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DJ_READQ.length) return;                           // 가드②
  if(!djAll(state)){ state.djMsg = DJ_SAY_ORDER_R; playThud(); djDraw(); return; }         // 가드⑥: 다 찍기 전 — 판 불변
  if(state.djRead!=null){ state.djMsg = DJ_SAY_READDONE; djDraw(); return; }               // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==DJ_READ_OK){ state.djMsg = DJ_READ_BAD; playThud(); djDraw(); return; }           // 가드⑧: 어긋난 답 — 판 불변
  state.djRead = i; state.djMsg = ""; state.djTell = `여섯 줄 가운데 달라요 도장이 ${djDiffN(state)}개, 같아요 도장이 ${djSameN(state)}개예요. 결혼하는 모습은 달라졌지만, 부부가 된 것을 알리고 축복해 주는 마음은 변함없어요.`; playBlip(); djDraw();
}
/* 조사하고 싶은 풍습 고르기 — 정답 없음 */
function djPick(p){
  if(state.djFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=DJ_PICK.length) return;                             // 가드②
  if(state.djRead==null){ state.djMsg = DJ_SAY_ORDER_P; playThud(); djDraw(); return; }    // 가드⑨: 판을 읽기 전 — 판 불변
  if(state.djPick!=null){ state.djMsg = DJ_SAY_PICKDONE; djDraw(); return; }               // 가드⑩: 이미 고른 자리 — 판 불변
  state.djPick = p; state.djMsg = ""; state.djTell = `${djPickOf(p).mark}를 골랐어요. ${djPickOf(p).why}`; playBlip(); djDraw();
}
/* 마무리 */
function djFin(i){
  if(state.djFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DJ_FINQ.length) return;                             // 가드②
  if(state.djPick==null){ state.djMsg = DJ_SAY_ORDER_FIN; playThud(); djDraw(); return; }  // 가드⑪: 고르기 전 — 판 불변
  if(i!==DJ_FIN_OK){ state.djMsg = DJ_FIN_BAD; playThud(); djDraw(); return; }             // 가드⑫: 어긋난 답 — 판 불변
  state.djFin = i; state.djMsg = ""; playChime(); djDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

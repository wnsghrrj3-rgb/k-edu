<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제① 옛날과 오늘날의 풍습 · l06
  「옛날부터 전해 내려오는 풍습을 체험해 볼까요」
  교과서 p.86~90 · 지도서 9~10차시(p.172~177) · [4사04-01]
  수업 기법 = 자료 제작하기, 협력하여 놀이 하기
=========================================================================

  ■ 직접조작 = 복주머니를 만들어요 판 (사회 3-2 열여덟째 판 · 2단원 여섯째 판)
  ⭐ 씨앗은 교과서 87쪽 스스로 활동 — 준비물(도안·리본이나 끈·가위·풀·색칠 도구)을 챙기고,
     네 순서(활동 자료 뜯어 준비 → 색칠하고 모양으로 뜯기 → 풀 발라 모양 만들기 → 끈으로 손잡이)로 만든다.
  ⭐ 바구니 앞에 물건 여덟(준비물 다섯 · 전통 놀이 도구 셋). 준비물이 아닌 것은 담기지 않는다.
  ⭐ 순서 카드 넷은 뒤섞여 놓여 있고, 카드마다 자기 차례 n 을 품는다(JM_STEP[s].n) — 순서표 0.
     물건은 자기 쓰임 need 를 품는다(JM_GEAR[c].need) — 짝표 0.
  ⭐ 챙긴 수 · 만든 단계 수 · 복주머니 모습은 저장 0 — 판(jmMark)에서 셈으로 나온다(jmGearN · jmStepN).
  ⭐ 판을 바꾸는 자리 jmSet 단 하나(state.jmMark |= 1 << b · 물건 0~7 · 순서 8~11) · 지우는 자리 0 · 난수 0.
     색칠 도구에서 색을 고르는 것(jmColor)은 도구를 드는 자리일 뿐 판을 바꾸지 않는다.

  ■ 이 차시의 뼈대
   옛날에는 복이 들어온다는 좋은 뜻으로 설날 아침에 복주머니를 옷에 차고 다녔다.
   오늘날에도 설날에 복이 들어오기를 바라며 복주머니를 선물하기도 한다.
   윷놀이, 제기차기, 투호, 고누처럼 옛날부터 오늘날까지 전해 내려오는 전통 놀이가 있다.

  ■ 5단계
   ① 준비물 다섯 담기 → ② 색 고르고 네 순서대로 만들기 → ③ 판 읽기 3택(정답 자리 1)
   ④ 체험하고 싶은 전통 놀이 가·나·다·라 고르기(정답 없음 · 교과서 88쪽 친구와 활동)
   ⑤ 마무리 3택(정답 자리 2) → 완료
      — 실제 복주머니 만들기 · 모둠 친구들과 전통 놀이 조사·체험하기 · 전통 놀이 소개하기는 교실 몫

  ■ 가드 16종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 이미 담은 물건 — 판 불변                 ④ 준비물이 아닌 물건 — 판 불변
   ⑤ 준비물을 다 챙기기 전 색·순서 — 판 불변   ⑥ 이미 한 순서 — 판 불변
   ⑦ 차례가 아닌 순서 — 판 불변               ⑧ 색을 고르기 전 색칠 순서 — 판 불변
   ⑨ 색칠한 뒤 색 바꾸기 — 판·색 불변         ⑩ 다 만들기 전 판 읽기 — 판 불변
   ⑪ 이미 읽은 자리 — 판 불변                ⑫ 판 읽기 어긋난 답 — 판 불변
   ⑬ 판을 읽기 전 고르기 — 판 불변           ⑭ 이미 고른 자리 — 판 불변
   ⑮ 고르기 전 마무리 — 판 불변              ⑯ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 준비물과 만드는 순서는 교과서 87쪽을 판이 줄여 적은 것(캡션 상시).
   ㉡ 체험하고 싶은 전통 놀이는 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 실제 복주머니 만들기, 모둠 친구들과 전통 놀이 조사·체험하기, 전통 놀이 소개하기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐 · 교통·통신수단 용어 0
   · 새 사실 0 — 교과서 86~90쪽 · 지도서 172~177쪽에 있는 사실만 · 누리집 주소 0 · 기관 이름 0
   · 윷놀이 결과별 칸 수 0(교과서·지도서에 없음) · 색 이름은 아이가 고르는 꾸밈일 뿐
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 화가·지은이 이름 0 · 네 자리 연도 0 · 지역 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#DB2777; --green-d:#BE185D; --cyan:#C026D3;
  --bg:#FDF2F8; --bub:#FCE7F3; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}

.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}

.ka-bg svg{width:13px;height:13px}

.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;

.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#FCE7F3;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}

.ka-nav svg{width:16px;height:16px}

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */

  // 정리 — 복주머니와 윷

    <g fill="#FEF3C7" stroke="#92400E" stroke-width="1.2"><rect x="94" y="36" width="7" height="38" rx="3.5"/><rect x="106" y="36" width="7" height="38" rx="3.5"/><rect x="118" y="36" width="7" height="38" rx="3.5"/><rect x="130" y="36" width="7" height="38" rx="3.5"/></g>
    <g font-size="6.4" font-weight="800" text-anchor="middle" fill="#334155"><text x="46" y="92">복주머니</text><text x="116" y="88">전통 놀이</text></g>
    <text x="80" y="15" font-size="7.5" fill="#9D174D" text-anchor="middle" font-weight="800">오늘날까지 전해 내려오는 풍습</text></svg>`
};
function sceneCard(key,cap){return `<div class="scene">${SVG[key]}<div class="cap">${cap}</div></div>`;}

/* ===== 직접 조작: 복주머니를 만들어요 판 =====
   바구니에 준비물을 담고, 색칠 도구에서 색을 고른 뒤, 순서 카드를 차례대로 눌러 복주머니를 만든다.
   ⭐ 판을 바꾸는 자리 jmSet 단 하나 — 물건 담기(0~7)와 순서(8~11)가 여기서만 적힌다 · 지우는 자리 0.
   ⭐ 짝표 0 — 물건이 자기 쓰임을 품고(JM_GEAR[c].need), 순서 카드가 자기 차례를 품는다(JM_STEP[s].n).
   ⭐ 챙긴 수 · 만든 단계 수 · 복주머니 모습은 저장 0 — 판(jmMark)에서 센다(jmGearN · jmStepN).
   ⭐ 색을 고르는 것은 도구를 드는 자리일 뿐 판을 바꾸지 않는다.
   ================================================================= */
const JM_GEAR = [                                                   // 교과서 87쪽 준비물 · 지도서 173쪽 — 준비물 다섯 · 88쪽 전통 놀이 도구 셋
  {name:"복주머니 도안", need:1},
  {name:"윷", need:0},
  {name:"풀", need:1},
  {name:"제기", need:0},
  {name:"색칠 도구", need:1},
  {name:"가위", need:1},
  {name:"투호 화살", need:0},
  {name:"리본이나 끈", need:1}
];
const JM_STEP = [                                                   // 교과서 87쪽 만드는 순서 — 카드는 뒤섞여 놓이고 자기 차례 n 을 품음
  {text:"도안에 풀을 발라 복주머니 모양을 만들어요.", n:2},
  {text:"‘복주머니 만들기’ 활동 자료를 뜯어 준비해요.", n:0},
  {text:"리본이나 끈으로 복주머니 손잡이를 만들어 완성해요.", n:3},
  {text:"도안에 색칠하고 복주머니 모양으로 뜯어요.", n:1}
];
const JM_COLOR = [                                                  // 색칠 도구 — 아이가 고르는 꾸밈
  {name:"빨간색", fill:"#FCA5A5", line:"#B91C1C"},
  {name:"노란색", fill:"#FDE68A", line:"#B45309"},
  {name:"초록색", fill:"#BBF7D0", line:"#15803D"},
  {name:"파란색", fill:"#BFDBFE", line:"#1D4ED8"}
];
const JM_PICK = [                                                   // 교과서 88쪽 친구와 활동 · 지도서 176쪽 정리
  {mark:"가", text:"윷놀이", why:"편을 갈라 윷으로 승부를 겨루는 놀이예요. 모둠 친구들과 놀이 방법을 조사해 함께 체험해 봐요."},
  {mark:"나", text:"제기차기", why:"제기가 바닥에 떨어지지 않게 차면서 노는 놀이예요. 모둠 친구들과 놀이 방법을 조사해 함께 체험해 봐요."},
  {mark:"다", text:"투호", why:"투호 병에 화살을 던져 넣는 놀이예요. 모둠 친구들과 놀이 방법을 조사해 함께 체험해 봐요."},
  {mark:"라", text:"고누", why:"고누판에서 말을 옮기면서 상대방의 말을 따거나 길을 막아 가두며 겨루는 놀이예요. 모둠 친구들과 놀이 방법을 조사해 함께 체험해 봐요."}
];
const JM_SAY_IN = "이미 바구니에 담았어요. 다른 준비물을 챙겨요.";
const JM_SAY_NOTNEED = "복주머니를 만들 때 쓰는 것인지 교과서 87쪽을 다시 살펴봐요.";
const JM_SAY_GEARFIRST = "먼저 준비물을 모두 챙겨요.";
const JM_SAY_MADE = "이미 한 순서예요. 남은 순서를 이어 가요.";
const JM_SAY_ORDER = "무엇을 먼저 해야 할지 순서를 다시 떠올려 봐요.";
const JM_SAY_COLORFIRST = "먼저 색칠 도구에서 색을 하나 골라요.";
const JM_SAY_COLORDONE = "이미 색칠했어요. 색은 그대로예요.";
const JM_SAY_ORDER_R = "먼저 복주머니를 끝까지 만들어 봐요.";
const JM_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const JM_SAY_ORDER_P = "먼저 판을 읽어 봐요.";
const JM_SAY_PICKDONE = "이미 골랐어요. 친구가 고른 놀이와 견주어 봐요.";
const JM_SAY_ORDER_FIN = "먼저 체험하고 싶은 전통 놀이를 골라 봐요.";
const JM_READQ = [
  "복주머니는 오늘날에는 볼 수 없는 물건이에요",
  "설날에 복이 들어오기를 바라며 차던 복주머니를 오늘날에도 선물하기도 해요",
  "복주머니는 아무 순서로 만들어도 똑같이 완성돼요"
];
const JM_READ_OK = 1;
const JM_READ_BAD = "만들어 본 복주머니와 교과서 87쪽을 다시 떠올려 봐요.";
const JM_FINQ = [
  "옛날 풍습은 오늘날까지 하나도 전해 내려오지 않아요",
  "전통 놀이는 혼자서만 할 수 있는 놀이예요",
  "복주머니 만들기, 윷놀이, 제기차기처럼 옛날부터 오늘날까지 전해 내려오는 풍습이 있어요"
];
const JM_FIN_OK = 2;
const JM_FIN_BAD = "오늘 체험해 본 풍습과 전통 놀이를 다시 떠올려 봐요.";

function jmGearOf(c){ return JM_GEAR[c]; }                                    // JM_GEAR 를 읽는 자리는 여기 단 하나
function jmStepOf(s){ return JM_STEP[s]; }                                    // JM_STEP 을 읽는 자리는 여기 단 하나
function jmColorOf(c){ return JM_COLOR[c]; }                                  // JM_COLOR 를 읽는 자리는 여기 단 하나
function jmPickOf(p){ return JM_PICK[p]; }                                    // JM_PICK 을 읽는 자리는 여기 단 하나
function jmEul(w){ const c = w.charCodeAt(w.length-1) - 0xAC00; return (c >= 0 && c % 28 !== 0) ? "을" : "를"; }  // 받침에 따라 을/를
function jmGears(){ return [...Array(JM_GEAR.length).keys()]; }
function jmSteps(){ return [...Array(JM_STEP.length).keys()]; }
function jmIsIn(st,c){ return (st.jmMark >> c & 1) === 1; }                   // ★ 담은 물건 — 판의 비트에서
function jmIsMade(st,s){ return (st.jmMark >> (8 + s) & 1) === 1; }           // ★ 한 순서 — 판의 비트에서
function jmNeedN(){ return jmGears().filter(c => jmGearOf(c).need === 1).length; }        // ★ 준비물 수 — 물건이 품은 쓰임에서
function jmGearN(st){ return jmGears().filter(c => jmIsIn(st,c)).length; }                // ★ 챙긴 수 — 셈으로
function jmGearAll(st){ return jmGearN(st) === jmNeedN(); }
function jmStepN(st){ return jmSteps().filter(s => jmIsMade(st,s)).length; }             // ★ 만든 단계 수 — 셈으로
function jmAll(st){ return jmStepN(st) === JM_STEP.length; }                              // ★ 끝 기준 = 네 순서 모두
function jmSet(b){ state.jmMark |= 1 << b; }                                  // ⭐ 판을 바꾸는 자리 단 하나
function jmStage(st){
  if(!jmGearAll(st)) return "gear";
  if(!jmAll(st)) return "make";
  if(st.jmRead == null) return "read";
  if(st.jmPick == null) return "pick";
  if(st.jmFin == null) return "fin";
  return "end";
}

/* 판 — 바구니 · 복주머니 그림 · 색칠 도구 · 순서 카드 · 순서 줄 */
function jmPic(st){
  const n = jmStepN(st), col = st.jmColor == null ? null : jmColorOf(st.jmColor);
  const fill = (n >= 2 && col) ? col.fill : "#fff", line = (n >= 2 && col) ? col.line : "#94A3B8";
  let body = '';
  if(n === 0){
    body = `<rect x="14" y="14" width="92" height="92" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
      <rect x="24" y="22" width="72" height="76" fill="#fff" stroke="#CBD5E1" stroke-width="1.2"/>
      <path d="M 50 40 Q 38 46 38 64 Q 38 86 60 86 Q 82 86 82 64 Q 82 46 70 40 Z" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 2"/>`;
  } else if(n === 1){
    body = `<rect x="24" y="22" width="72" height="76" fill="#fff" stroke="#94A3B8" stroke-width="1.4"/>
      <path d="M 50 40 Q 38 46 38 64 Q 38 86 60 86 Q 82 86 82 64 Q 82 46 70 40 Z" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 2"/>`;
  } else if(n === 2){
    body = `<path d="M 50 40 Q 38 46 38 64 Q 38 86 60 86 Q 82 86 82 64 Q 82 46 70 40 Z" fill="${fill}" stroke="${line}" stroke-width="1.5"/>`;
  } else {
    body = `<path d="M 50 40 Q 34 46 34 66 Q 34 90 60 90 Q 86 90 86 66 Q 86 46 70 40 Z" fill="${fill}" stroke="${line}" stroke-width="1.6"/>
      <path d="M 48 40 Q 60 34 72 40" fill="none" stroke="${line}" stroke-width="2.2"/>`;
    if(n === 4) body += `<path d="M 52 38 Q 60 18 68 38" fill="none" stroke="#CA8A04" stroke-width="2.4"/>`;
  }
  return `<div class="jm-pic" data-n="${n}"><svg viewBox="0 0 120 112"><rect width="120" height="112" fill="#FFF7FB"/>${body}</svg></div>`;
}
function jmGearBox(st){
  const inN = jmGears().filter(c => jmIsIn(st,c));
  return `<div><div class="jm-lab">준비물 바구니에 담아요</div><div class="jm-gears">${jmGears().map(c =>
    `<button class="jm-gear" data-c="${c}" data-in="${jmIsIn(st,c) ? 1 : 0}" onclick="jmPack(${c})">${jmGearOf(c).name}</button>`).join('')}</div>
    <div class="jm-basket" data-n="${jmGearN(st)}"><b>바구니</b> ${inN.map(c => jmGearOf(c).name).join(', ') || '아직 담은 준비물이 없어요.'}</div></div>`;
}
function jmColors(st){
  return `<div><div class="jm-lab">색칠 도구</div><div class="jm-colors">${[0,1,2,3].map(c =>
    `<button class="jm-col" data-c="${c}" data-on="${st.jmColor === c ? 1 : 0}" onclick="jmTint(${c})"><i style="background:${jmColorOf(c).fill}"></i>${jmColorOf(c).name}</button>`).join('')}</div></div>`;
}
function jmStepCards(st){
  return `<div><div class="jm-lab">만드는 순서 카드</div><div class="jm-steps">${jmSteps().map(s => {
    const m = jmIsMade(st,s);
    return `<button class="jm-step" data-s="${s}" data-made="${m ? 1 : 0}" onclick="jmDo(${s})">${m ? `<span class="no">${jmStepOf(s).n + 1}</span>` : ''}${jmStepOf(s).text}</button>`;
  }).join('')}</div></div>`;
}
function jmLine(st){
  return `<div class="jm-line">${[0,1,2,3].map(k => {
    const s = jmSteps().find(x => jmIsMade(st,x) && jmStepOf(x).n === k);
    return `<div class="jm-slot" data-k="${k}" data-filled="${s == null ? 0 : 1}"><b>${k + 1}</b>${s == null ? '' : jmStepOf(s).text}</div>`;
  }).join('')}</div>`;
}
function jmBoard(st){
  const showColor = jmGearAll(st) && !jmAll(st);
  return `<div class="jm-board" data-mark="${st.jmMark}" data-gear="${jmGearN(st)}" data-made="${jmStepN(st)}">
    <div class="jm-title">준비물을 챙기고 순서대로 복주머니를 만들어요</div>
    <div class="jm-top">${jmGearBox(st)}${jmPic(st)}</div>
    ${showColor ? jmColors(st) : ''}${jmStepCards(st)}${jmLine(st)}</div>`;
}
function jmPicks(st){
  return `<div class="jm-picks">${[0,1,2,3].map(p=>`<button class="jm-pk" data-p="${p}" onclick="jmPick(${p})"><b>${jmPickOf(p).mark}</b> ${jmPickOf(p).text}</button>`).join('')}</div>`;
}
function jmHelp(st){
  return `<div class="jm-help">바구니에 <b>준비물</b>을 담아요.<br>
    <b>색칠 도구</b>에서 색을 하나 고른 뒤,<br>
    <b>순서 카드</b>를 차례대로 눌러 복주머니를 만들어요.</div>`;
}
function jmPanel(st){
  const stage = jmStage(st);
  let ask = '';
  if(stage === "gear"){
    ask = `<div class="jm-ask" data-step="gear"><b>복주머니를 만드는 데 필요한 준비물을 바구니에 담아 봐요.</b></div>`;

  }

  const warn = st.jmMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.jmMsg}</div>` : '';

slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">옛날부터 전해 내려오는 풍습을 체험해 봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">실제로 <b style="color:#DB2777">복주머니</b>를 만들고, 모둠 친구들과 <b style="color:#DB2777">전통 놀이</b>를 조사해 체험해 봐요. 이건 교실 몫이에요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u2_l06";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  jmColor:null, jmMark:0, jmRead:null, jmPick:null, jmFin:null, jmMsg:"", jmTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function jmDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 준비물 담기 */
function jmPack(c){
  if(state.jmFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(c) || c<0 || c>=JM_GEAR.length) return;                             // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(jmIsIn(state,c)){ state.jmMsg = JM_SAY_IN; playThud(); jmDraw(); return; }             // 가드③: 이미 담은 물건 — 판 불변
  if(jmGearOf(c).need !== 1){ state.jmMsg = JM_SAY_NOTNEED; playThud(); jmDraw(); return; } // 가드④: 준비물이 아닌 물건 — 판 불변
  jmSet(c);
  const nm = jmGearOf(c).name;
  state.jmMsg = ""; state.jmTell = `${nm}${jmEul(nm)} 바구니에 담았어요.` + (jmGearAll(state) ? ` 준비물을 모두 챙겼어요. 이제 색을 고르고 순서대로 만들어요.` : '');
  if(jmGearAll(state)) playChime(); else playBlip(); jmDraw();
}
/* 색칠 도구에서 색 고르기 — 도구를 드는 자리일 뿐 */
function jmTint(c){
  if(state.jmFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(c) || c<0 || c>=JM_COLOR.length) return;                            // 가드②
  if(!jmGearAll(state)){ state.jmMsg = JM_SAY_GEARFIRST; playThud(); jmDraw(); return; }    // 가드⑤: 준비물을 다 챙기기 전 — 판 불변
  if(jmStepN(state) >= 2){ state.jmMsg = JM_SAY_COLORDONE; playThud(); jmDraw(); return; } // 가드⑨: 색칠한 뒤 — 판·색 불변
  state.jmColor = c;
  state.jmMsg = ""; state.jmTell = `${jmColorOf(c).name}${jmEul(jmColorOf(c).name)} 골랐어요. 도안에 색칠할 때 이 색으로 칠해요.`; playBlip(); jmDraw();
}
/* 순서 카드 누르기 */
function jmDo(s){
  if(state.jmFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(s) || s<0 || s>=JM_STEP.length) return;                             // 가드②
  if(jmIsMade(state,s)){ state.jmMsg = JM_SAY_MADE; playThud(); jmDraw(); return; }         // 가드⑥: 이미 한 순서 — 판 불변
  if(!jmGearAll(state)){ state.jmMsg = JM_SAY_GEARFIRST; playThud(); jmDraw(); return; }    // 가드⑤
  if(jmStepOf(s).n !== jmStepN(state)){ state.jmMsg = JM_SAY_ORDER; playThud(); jmDraw(); return; }  // 가드⑦: 차례가 아닌 순서 — 판 불변
  if(jmStepOf(s).n === 1 && state.jmColor==null){ state.jmMsg = JM_SAY_COLORFIRST; playThud(); jmDraw(); return; }  // 가드⑧: 색 고르기 전 색칠 — 판 불변
  jmSet(8 + s);
  state.jmMsg = ""; state.jmTell = `${["첫째","둘째","셋째","넷째"][jmStepOf(s).n]} 순서 — ${jmStepOf(s).text}` + (jmAll(state) ? ` 복주머니가 완성됐어요.` : '');
  if(jmAll(state)) playChime(); else playBlip(); jmDraw();
}
/* 판 읽기 */
function jmRead(i){
  if(state.jmFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=JM_READQ.length) return;                           // 가드②
  if(!jmAll(state)){ state.jmMsg = JM_SAY_ORDER_R; playThud(); jmDraw(); return; }         // 가드⑩: 다 만들기 전 — 판 불변
  if(state.jmRead!=null){ state.jmMsg = JM_SAY_READDONE; jmDraw(); return; }               // 가드⑪: 이미 정한 자리 — 판 불변
  if(i!==JM_READ_OK){ state.jmMsg = JM_READ_BAD; playThud(); jmDraw(); return; }           // 가드⑫: 어긋난 답 — 판 불변
  state.jmRead = i; state.jmMsg = ""; state.jmTell = `준비물 ${jmGearN(state)}가지를 챙기고 ${jmStepN(state)}가지 순서를 차례대로 지켜 복주머니를 만들었어요. 옛날에는 설날 아침에 옷에 차고 다녔고, 오늘날에는 선물하기도 해요.`; playBlip(); jmDraw();
}
/* 체험하고 싶은 전통 놀이 고르기 — 정답 없음 */
function jmPick(p){
  if(state.jmFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=JM_PICK.length) return;                             // 가드②
  if(state.jmRead==null){ state.jmMsg = JM_SAY_ORDER_P; playThud(); jmDraw(); return; }    // 가드⑬: 판을 읽기 전 — 판 불변
  if(state.jmPick!=null){ state.jmMsg = JM_SAY_PICKDONE; jmDraw(); return; }               // 가드⑭: 이미 고른 자리 — 판 불변
  state.jmPick = p; state.jmMsg = ""; state.jmTell = `${jmPickOf(p).mark}를 골랐어요. ${jmPickOf(p).text}는 ${jmPickOf(p).why}`; playBlip(); jmDraw();
}
/* 마무리 */
function jmFin(i){
  if(state.jmFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=JM_FINQ.length) return;                             // 가드②
  if(state.jmPick==null){ state.jmMsg = JM_SAY_ORDER_FIN; playThud(); jmDraw(); return; }  // 가드⑮: 고르기 전 — 판 불변
  if(i!==JM_FIN_OK){ state.jmMsg = JM_FIN_BAD; playThud(); jmDraw(); return; }             // 가드⑯: 어긋난 답 — 판 불변
  state.jmFin = i; state.jmMsg = ""; playChime(); jmDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u2_l07_불을켜요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

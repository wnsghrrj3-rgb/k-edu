<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제① 옛날과 오늘날의 풍습 · l05
  「옛날과 오늘날의 세시 풍속을 비교해 볼까요」
  교과서 p.83~85 · 지도서 8차시(p.164~169) · [4사04-01]
  수업 기법 = 표로 정리하기, 분석하기
=========================================================================

  ■ 직접조작 = 형광펜을 칠해요 판 (사회 3-2 열일곱째 판 · 2단원 다섯째 판)
  ⭐ 씨앗은 교과서 85쪽 스스로 활동 — 사회 관계망 서비스에 올린 설날 글에서
     옛날과 비슷한 점에 밑줄을 긋고, 옛날과 다른 점을 찾는 활동(지도서 167쪽 예시 답안).
  ⭐ 형광펜 둘 — 노란 형광펜(옛날과 비슷한 점) · 하늘색 형광펜(옛날과 다른 점).
     펜을 잡고 글 조각을 누르면 칠해진다. 알맞지 않은 펜이면 칠해지지 않는다.
  ⭐ 짝표가 코드에 따로 없다. 글 조각이 자기 갈래 k 를 품고 있다(YP_BIT[c].k).
     YP_BIT 를 읽는 자리 ypBitOf · YP_PEN 은 ypPenOf · YP_PICK 은 ypPickOf 단 하나씩.
  ⭐ 칠한 조각 수 · 갈래별 수는 저장 0 — 칠한 조각(ypMark)에서 셈으로 나온다(ypPaintedN · ypCount).
  ⭐ 판을 바꾸는 자리 ypSet 단 하나(state.ypMark |= 1 << c) · 지우는 자리 0 · 난수 0.
     펜을 잡는 것(ypPen)은 도구를 드는 자리일 뿐 판을 바꾸지 않는다.

  ■ 이 차시의 뼈대
   옛날에는 농사와 관련 있는 세시 풍속이 계절마다 다양했다.
   오늘날에는 농사와 관련 있는 세시 풍속보다는 큰 명절을 중심으로 한 세시 풍속이 이어져 오고 있다.
   옛날과 오늘날의 세시 풍속이 달라지고 있지만, 가족이나 이웃과 기쁨을 함께 나누는 것은 변함없다.

  ■ 5단계
   ① 형광펜 잡기 → ② 글 조각 아홉 칠하기(차례 자유) → ③ 판 읽기 3택(정답 자리 2)
   ④ 내가 명절에 주로 하는 일 가·나·다 고르기(정답 없음 · 교과서 84쪽 친구와 활동)
   ⑤ 마무리 3택(정답 자리 0) → 완료
      — 우리 반 친구들이 명절에 하는 일 조사하기 · 지난 설날 이야기 나누기 · 세시 풍속 그림일기는 교실 몫

  ■ 가드 13종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 이미 칠한 조각 — 판 불변                ④ 펜을 잡기 전 칠하기 — 판 불변
   ⑤ 알맞지 않은 펜 — 판 불변                 ⑥ 다 칠하기 전 판 읽기 — 판 불변
   ⑦ 이미 읽은 자리 — 판 불변                ⑧ 판 읽기 어긋난 답 — 판 불변
   ⑨ 판을 읽기 전 고르기 — 판 불변           ⑩ 이미 고른 자리 — 판 불변
   ⑪ 고르기 전 마무리 — 판 불변              ⑫ 마무리 어긋난 답 — 판 불변
   ⑬ 다 칠한 뒤 펜 잡기 — 판 불변

  ■ 정직 3곳
   ㉠ 글 조각은 교과서 85쪽 사회 관계망 서비스 글을 판이 줄여 적은 것(캡션 상시).
   ㉡ 명절에 주로 하는 일은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 친구들이 명절에 하는 일 조사하기, 지난 설날 이야기 나누기, 그림일기 그리기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐 · 교통·통신수단 용어 0
   · 새 사실 0 — 교과서 83~85쪽 · 지도서 164~167쪽에 있는 사실만 · 누리집 주소 0 · 축제·기관 이름 0
   · 교과서 밖 절기·명절 이름 0(교과서 83쪽 그림은 계절로만 말한다)
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 글쓴이 이름 0 · 네 자리 연도 0 · 지역 이름 0
-->

<meta name="kedu-lesson-id" content="g3_social_u2_l05_v1"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#DB2777; --green-d:#BE185D; --cyan:#C026D3;
  --bg:#FDF2F8; --bub:#FCE7F3; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#FCE7F3;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#FCE7F3;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(219,39,119,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 조작 판 — 형광펜을 칠해요 판 */
.yp-wrap{max-width:780px;width:100%;margin:0 auto}
.yp-head{background:#FCE7F3;color:#9D174D;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.yp-board{padding:9px;border-radius:14px;background:#FDF2F8;border:2px solid #FBCFE8;display:grid;grid-template-columns:1fr;gap:8px}
.yp-title{text-align:center;font-weight:800;color:#9D174D;font-size:clamp(12px,2vw,14px);word-break:keep-all}
.yp-lab{font-size:clamp(11px,1.8vw,13px);font-weight:800;color:#BE185D;margin-bottom:3px}
.yp-pens{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.yp-pen{border:2px solid #CBD5E1;border-radius:11px;background:#fff;font-family:inherit;font-weight:800;color:#334155;
  font-size:clamp(11px,1.8vw,14px);padding:7px 6px;cursor:pointer;line-height:1.35;word-break:keep-all;display:flex;gap:6px;align-items:center;justify-content:center}
.yp-pen i{display:inline-block;width:26px;height:12px;border-radius:4px;border:1px solid #94A3B8}
.yp-pen[data-p="0"] i{background:#FEF08A}
.yp-pen[data-p="1"] i{background:#BAE6FD}
.yp-pen[data-on="1"]{border:3px solid #DB2777;background:#FFF7FB;color:#9D174D}
.yp-post{border:2px solid #E2E8F0;border-radius:12px;background:#fff;padding:9px 11px}
.yp-tags{font-size:clamp(10px,1.6vw,12px);font-weight:800;color:#2563EB;margin-bottom:5px}
.yp-text{font-size:clamp(12px,2vw,15px);line-height:1.95;word-break:keep-all}
.yp-bit{border:0;font-family:inherit;font-size:inherit;line-height:1.6;color:#0F172A;background:transparent;padding:1px 3px;margin:0 1px;
  border-radius:5px;cursor:pointer;text-align:left;border-bottom:2px dashed #F9A8D4}
.yp-bit[data-hl="1"]{background:#FEF08A;border-bottom:2px solid #CA8A04;cursor:default}
.yp-bit[data-hl="2"]{background:#BAE6FD;border-bottom:2px solid #0284C7;cursor:default}
.yp-tally{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.yp-box{border-radius:11px;padding:7px 9px;font-size:clamp(11px,1.8vw,13px);line-height:1.5;word-break:keep-all;border:2px solid}
.yp-box[data-k="0"]{background:#FEFCE8;border-color:#FDE047}
.yp-box[data-k="1"]{background:#F0F9FF;border-color:#7DD3FC}
.yp-box b{display:block;color:#334155;margin-bottom:2px}
.yp-help{border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;font-size:clamp(11px,1.9vw,14px);line-height:1.6}
.yp-help b{color:#BE185D}
.yp-side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.yp-tell{border-radius:11px;padding:8px 12px;font-size:clamp(12px,2vw,15px);line-height:1.6;background:#FDF2F8;border-left:4px solid var(--cyan)}
.yp-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.yp-pk{border:2px solid #FBCFE8;border-radius:10px;background:#fff;padding:8px 7px;font-family:inherit;
  font-size:clamp(11px,1.8vw,13px);font-weight:700;color:#0F172A;text-align:left;cursor:pointer;line-height:1.4;word-break:keep-all}
.yp-pk b{color:#BE185D}
.yp-ask{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#FFFAFD;margin-top:9px;
  font-size:clamp(12px,2vw,15px);line-height:1.6;word-break:keep-all}
.yp-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.yp-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:9px 11px;font-family:inherit;
  font-size:clamp(12px,2vw,15px);font-weight:700;color:#0F172A;text-align:left;line-height:1.45;word-break:keep-all;cursor:pointer}
.yp-opt:hover{border-color:var(--green);background:var(--bub)}
@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
  .yp-tally{grid-template-columns:1fr}
  .yp-picks{grid-template-columns:1fr}
  .yp-side{grid-template-columns:1fr}
}
</style>

/* ===== 직접 조작: 형광펜을 칠해요 판 =====
   형광펜을 하나 잡고, 설날 글의 조각을 누르면 칠해진다.
   노란 형광펜 = 옛날과 비슷한 점 · 하늘색 형광펜 = 옛날과 다른 점.
   ⭐ 판을 바꾸는 자리 ypSet 단 하나 — 조각이 칠해지는 곳은 여기뿐 · 지우는 자리 0.
   ⭐ 짝표 0 — 글 조각이 자기 갈래를 품는다(YP_BIT[c].k).
   ⭐ 칠한 조각 수 · 갈래별 수는 저장 0 — 칠한 조각(ypMark)에서 센다(ypPaintedN · ypCount).
   ⭐ 조각 순서는 자유 — 어느 조각부터 칠해도 된다. 펜을 잡는 것은 판을 바꾸지 않는다.
   ================================================================= */
const YP_PEN = [                                                    // 교과서 85쪽 — 비슷한 점 · 다른 점
  {name:"노란 형광펜", say:"옛날과 비슷한 점", box:"옛날부터 이어져 오는 모습"},
  {name:"하늘색 형광펜", say:"옛날과 다른 점", box:"옛날과 달라진 모습"}
];
const YP_BIT = [                                                    // 교과서 85쪽 사회 관계망 서비스 글 · 지도서 167쪽 예시 답안 — 말은 판이 줄여 적음

  {text:"우리 가족은 영화관에 가서 영화를 봤어요.", k:1},
  {text:"사촌 동생네 가족은 남은 연휴 동안 해외여행을 떠난대요.", k:1}
];
const YP_PICK = [                                                   // 교과서 84쪽 친구와 활동 · 지도서 166쪽 예시
  {mark:"가", text:"설날에 세배하기", why:"옛날부터 이어져 오는 모습이에요. 친구들은 명절에 무엇을 하는지 견주어 봐요."},
  {mark:"나", text:"명절에 가족과 여행 가기", why:"옛날과 달라진 모습이에요. 친구들은 명절에 무엇을 하는지 견주어 봐요."},
  {mark:"다", text:"명절에 영화 보기", why:"옛날과 달라진 모습이에요. 친구들은 명절에 무엇을 하는지 견주어 봐요."}

  "오늘날 설날 모습은 옛날과 모두 똑같아요",

];

  "오늘날에는 농사와 관련 있는 세시 풍속보다는 큰 명절을 중심으로 한 세시 풍속이 이어져 오고 있어요",
  "옛날과 오늘날의 생활 모습은 달라졌지만, 세시 풍속은 변함이 없어요",

];

function ypBitOf(c){ return YP_BIT[c]; }                                      // YP_BIT 를 읽는 자리는 여기 단 하나
function ypPenOf(p){ return YP_PEN[p]; }                                      // YP_PEN 을 읽는 자리는 여기 단 하나
function ypPickOf(p){ return YP_PICK[p]; }                                    // YP_PICK 을 읽는 자리는 여기 단 하나
function ypBits(){ return [...Array(YP_BIT.length).keys()]; }
function ypIsDone(st,c){ return (st.ypMark >> c & 1) === 1; }                 // ★ 칠한 조각 — 칠한 자리에서
function ypLeft(st){ return ypBits().filter(c => !ypIsDone(st,c)); }          // ★ 남은 조각
function ypPaintedN(st){ return ypBits().filter(c => ypIsDone(st,c)).length; }  // ★ 칠한 조각 수 — 셈으로
function ypCount(st,k){ return ypBits().filter(c => ypIsDone(st,c) && ypBitOf(c).k === k).length; }  // ★ 갈래별 수 — 셈으로
function ypAll(st){ return ypLeft(st).length === 0; }                         // ★ 끝 기준 = 남은 조각 0
function ypSet(c){ state.ypMark |= 1 << c; }                                  // ⭐ 판을 바꾸는 자리 단 하나
function ypStage(st){
  if(!ypAll(st)) return "play";
  if(st.ypRead == null) return "read";
  if(st.ypPick == null) return "pick";
  if(st.ypFin == null) return "fin";
  return "end";
}

/* 판 — 형광펜 둘 · 설날 글 · 두 칸 */
function ypPens(st){
  return `<div><div class="yp-lab">형광펜</div><div class="yp-pens">${[0,1].map(p =>
    `<button class="yp-pen" data-p="${p}" data-on="${st.ypPen === p ? 1 : 0}" onclick="ypTake(${p})"><i></i>${ypPenOf(p).name} — ${ypPenOf(p).say}</button>`).join('')}</div></div>`;
}
function ypPost(st){
  return `<div class="yp-post"><div class="yp-lab">사회 관계망 서비스에 올린 설날 글</div><div class="yp-tags">#설날 #세배 #해외여행</div>
    <div class="yp-text">${YP_BIT.map((_,c) => {
      const hl = ypIsDone(st,c) ? ypBitOf(c).k + 1 : 0;
      return `<button class="yp-bit" data-c="${c}" data-hl="${hl}" onclick="ypPaint(${c})">${ypBitOf(c).text}</button>`;
    }).join(' ')}</div></div>`;
}
function ypTally(st){
  return `<div class="yp-tally">${[0,1].map(k => `<div class="yp-box" data-k="${k}" data-n="${ypCount(st,k)}"><b>${ypPenOf(k).box} ${ypCount(st,k)}</b>${
    ypBits().filter(c => ypIsDone(st,c) && ypBitOf(c).k === k).map(c => ypBitOf(c).text).join(' ') || '아직 칠한 조각이 없어요.'}</div>`).join('')}</div>`;
}
function ypBoard(st){
  return `<div class="yp-board" data-mark="${st.ypMark}" data-painted="${ypPaintedN(st)}" data-left="${ypLeft(st).length}">
    <div class="yp-title">설날 글에서 옛날과 비슷한 점과 다른 점에 형광펜을 칠해요</div>
    ${ypAll(st) ? '' : ypPens(st)}${ypPost(st)}${ypTally(st)}</div>`;
}
function ypPicks(st){
  return `<div class="yp-picks">${[0,1,2].map(p=>`<button class="yp-pk" data-p="${p}" onclick="ypPick(${p})"><b>${ypPickOf(p).mark}</b> ${ypPickOf(p).text}</button>`).join('')}</div>`;
}
function ypHelp(st){
  return `<div class="yp-help"><b>형광펜</b>을 하나 잡아요.<br>
    설날 글에서 알맞은 <b>조각</b>을 누르면 칠해져요.<br>
    옛날과 비슷하면 <b>노란색</b>, 다르면 <b>하늘색</b>이에요. 어느 조각부터 칠해도 좋아요.</div>`;
}
function ypPanel(st){
  const stage = ypStage(st);
  let ask = '';
  if(stage === "play"){
    ask = `<div class="yp-ask" data-step="play"><b>설날 글을 읽고 옛날과 비슷한 점과 다른 점에 형광펜을 칠해 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="yp-ask" data-step="read"><b>형광펜을 모두 칠한 글을 보니 무엇을 알 수 있을까요?</b>
      <div class="yp-opts">${YP_READQ.map((t,i)=>`<button class="yp-opt" onclick="ypRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="yp-ask" data-step="pick"><b>여러분은 명절에 주로 어떤 일을 하나요? 하나 골라 봐요.</b>${ypPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="yp-ask" data-step="fin"><b>옛날과 오늘날의 세시 풍속을 비교해 보니 무엇을 알 수 있을까요?</b>
      <div class="yp-opts">${YP_FINQ.map((t,i)=>`<button class="yp-opt" onclick="ypFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="yp-ask" data-fin="1" style="border-color:#F9A8D4;background:#FDF2F8">
      <b style="color:#9D174D">아홉 조각을 모두 칠했어요. 옛날부터 이어져 오는 세시 풍속도 있고 달라진 모습도 있지만, 가족이나 이웃과 기쁨을 함께 나누는 것은 변함없어요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>우리 반 친구들이 명절에 하는 일 조사하기</b>, <b>지난 설날 이야기 나누기</b>, <b>세시 풍속 그림일기 그리기</b>는 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.ypTell ? `<div class="yp-tell">${st.ypTell}</div>` : '';
  const warn = st.ypMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.ypMsg}</div>` : '';
  return `<div class="yp-wrap">
    <div class="yp-head">칠한 조각 <b>${ypPaintedN(st)}</b> / ${YP_BIT.length} · 남은 조각 <b>${ypLeft(st).length}</b></div>
    ${ypBoard(st)}<div class="yp-side">${ypHelp(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 글 조각은 <b>교과서 85쪽</b>의 사회 관계망 서비스 글을 판이 줄여 적은 것이에요. 명절에 주로 하는 일은 <b>사람마다 달라서</b> 판은 정답을 정하지 않아요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const LS_KEY = "kedu_progress_g3_2_social_u2_l05";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  ypPen:null, ypMark:0, ypRead:null, ypPick:null, ypFin:null, ypMsg:"", ypTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function ypDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 형광펜 잡기 — 도구를 드는 자리일 뿐 */
function ypTake(p){
  if(state.ypFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(p) || p<0 || p>=YP_PEN.length) return;                              // 가드②: 무효 펜 — 안내조차 띄우지 않음
  if(ypAll(state)){ state.ypMsg = YP_SAY_ALLDONE; playThud(); ypDraw(); return; }          // 가드⑬: 다 칠한 뒤 — 판 불변
  state.ypPen = p;
  state.ypMsg = ""; state.ypTell = `${ypPenOf(p).name}을 잡았어요. ${ypPenOf(p).say}에 칠해요.`; playBlip(); ypDraw();
}
/* 글 조각 칠하기 */
function ypPaint(c){
  if(state.ypFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(c) || c<0 || c>=YP_BIT.length) return;                              // 가드②: 무효 조각
  if(ypIsDone(state,c)){ state.ypMsg = YP_SAY_DONE; playThud(); ypDraw(); return; }        // 가드③: 이미 칠한 조각 — 판 불변
  if(state.ypPen==null){ state.ypMsg = YP_SAY_PENFIRST; playThud(); ypDraw(); return; }    // 가드④: 펜을 잡기 전 — 판 불변
  if(ypBitOf(c).k !== state.ypPen){ state.ypMsg = YP_SAY_OUT; playThud(); ypDraw(); return; }  // 가드⑤: 알맞지 않은 펜 — 판 불변
  ypSet(c);
  state.ypMsg = ""; state.ypTell = `「${ypBitOf(c).text}」에 ${ypPenOf(state.ypPen).name}을 칠했어요. ${ypPenOf(state.ypPen).say}이에요.`;
  if(ypAll(state)){ state.ypPen = null; playChime(); } else { playBlip(); } ypDraw();
}
/* 판 읽기 */
function ypRead(i){
  if(state.ypFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=YP_READQ.length) return;                           // 가드②
  if(!ypAll(state)){ state.ypMsg = YP_SAY_ORDER_R; playThud(); ypDraw(); return; }         // 가드⑥: 다 칠하기 전 — 판 불변
  if(state.ypRead!=null){ state.ypMsg = YP_SAY_READDONE; ypDraw(); return; }               // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==YP_READ_OK){ state.ypMsg = YP_READ_BAD; playThud(); ypDraw(); return; }           // 가드⑧: 어긋난 답 — 판 불변
  state.ypRead = i; state.ypMsg = ""; state.ypTell = `노란 조각 ${ypCount(state,0)}개는 옛날부터 이어져 오는 모습, 하늘색 조각 ${ypCount(state,1)}개는 옛날과 달라진 모습이에요.`; playBlip(); ypDraw();
}
/* 명절에 주로 하는 일 고르기 — 정답 없음 */
function ypPick(p){
  if(state.ypFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=YP_PICK.length) return;                             // 가드②
  if(state.ypRead==null){ state.ypMsg = YP_SAY_ORDER_P; playThud(); ypDraw(); return; }    // 가드⑨: 판을 읽기 전 — 판 불변
  if(state.ypPick!=null){ state.ypMsg = YP_SAY_PICKDONE; ypDraw(); return; }               // 가드⑩: 이미 고른 자리 — 판 불변
  state.ypPick = p; state.ypMsg = ""; state.ypTell = `${ypPickOf(p).mark}를 골랐어요. ${ypPickOf(p).why}`; playBlip(); ypDraw();
}
/* 마무리 */
function ypFin(i){
  if(state.ypFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=YP_FINQ.length) return;                             // 가드②
  if(state.ypPick==null){ state.ypMsg = YP_SAY_ORDER_FIN; playThud(); ypDraw(); return; }  // 가드⑪: 고르기 전 — 판 불변
  if(i!==YP_FIN_OK){ state.ypMsg = YP_FIN_BAD; playThud(); ypDraw(); return; }             // 가드⑫: 어긋난 답 — 판 불변
  state.ypFin = i; state.ypMsg = ""; playChime(); ypDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u2_l06_복주머니를만들어요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

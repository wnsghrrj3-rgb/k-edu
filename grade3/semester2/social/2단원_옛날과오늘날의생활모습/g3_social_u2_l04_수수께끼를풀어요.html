<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 2단원 옛날과 오늘날의 생활 모습
  주제① 옛날과 오늘날의 풍습 · l04
  「옛날의 세시 풍속을 알아볼까요」
  교과서 p.77~82 · 지도서 6~7차시(p.154~161) · 두 시간 한 파일 · [4사04-01]
  수업 기법 = 비교하기, 돌아가며 말하기, 표로 정리하기
=========================================================================

  ■ 직접조작 = 명절 수수께끼를 풀어요 판 (사회 3-2 열여섯째 판 · 2단원 넷째 판)
  ⭐ 씨앗은 교과서 77~81쪽 다섯 명절(설날 · 정월 대보름 · 단오 · 추석 · 동지)과 지도서 161쪽 정리표.
  ⭐ 수수께끼 상자 다섯이 있다. 상자를 열면 단서가 한 장 보이고, 단서를 한 장씩 더 열 수 있다(셋까지).
     단서 = 하는 일이나 놀이 → 먹는 음식 → 그날의 뜻.
  ⭐ 아래 달력 띠에 다섯 명절이 한 해 차례로 놓여 있다. 단서를 읽고 알맞은 명절을 누르면 풀린다.
  ⭐ 짝표가 코드에 따로 없다. 상자가 자기 명절 번호를 품고 있다(SX_BOX[b].k).
     SX_BOX 를 읽는 자리 sxBoxOf · SX_DAY 는 sxDayOf · SX_PICK 은 sxPickOf 단 하나씩.
  ⭐ 푼 상자 수 · 불 켜진 명절은 저장 0 — 푼 상자(sxMark)에서 셈으로 나온다(sxSolvedN · sxLit).
  ⭐ 판을 바꾸는 자리 sxSet 단 하나(state.sxMark |= 1 << b) · 지우는 자리 0 · 난수 0.
     단서를 여는 것(sxSee)은 보는 자리일 뿐 판을 바꾸지 않는다.

  ■ 이 차시의 뼈대
   명절마다 하는 일, 먹는 음식, 놀이가 다르다. 옛날 세시 풍속에는 사람들의 생활과 생각이 담겨 있다.
   차례 지내기, 윷놀이하기, 떡국 먹기, 송편 빚기, 팥죽 먹기 등은 오늘날까지 이어져 내려오고 있다.

  ■ 5단계
   ① 상자 열기 → ② 단서 읽고 명절 누르기(상자 다섯 · 차례 자유) → ③ 판 읽기 3택(정답 자리 0)
   ④ 추석에 하는 풍습 가운데 경험해 보고 싶은 풍습 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다 · 교과서 80쪽 친구와 활동)
   ⑤ 마무리 3택(정답 자리 1) → 완료
      — 새해 덕담 쓰기 · 보름달에 빌고 싶은 소원 쓰기 · 단오 부채 만들기 · 친구들과 이야기하는 일은 교실 몫

  ■ 가드 13종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 이미 푼 상자 열기 — 판 불변              ④ 상자를 열기 전 명절 누르기 — 판 불변
   ⑤ 단서와 맞지 않는 명절 — 판 불변          ⑥ 다 풀기 전 판 읽기 — 판 불변
   ⑦ 이미 읽은 자리 — 판 불변                ⑧ 판 읽기 어긋난 답 — 판 불변
   ⑨ 판을 읽기 전 고르기 — 판 불변           ⑩ 이미 고른 자리 — 판 불변
   ⑪ 고르기 전 마무리 — 판 불변              ⑫ 마무리 어긋난 답 — 판 불변
   ⑬ 상자 없이 단서 넘기기 · 단서 셋을 다 연 뒤 — 판 불변

  ■ 정직 3곳
   ㉠ 단서의 말은 교과서 77~81쪽의 세시 풍속을 판이 줄여 적은 것(캡션 상시).
   ㉡ 경험해 보고 싶은 풍습은 사람마다 달라 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 새해 덕담 · 소원 쓰기, 단오 부채 만들기, 친구들과 이야기하는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐 · 교통·통신수단 용어 0
   · 새 사실 0 — 교과서 77~82쪽 · 지도서 154~161쪽에 있는 사실만 · 누리집 주소 0 · 축제·기관 이름 0
   · 음력·양력은 「옛날부터 명절은 주로 음력 날짜로 쓴다 · 동지는 양력」 정도로만(지도서 156쪽)
   · 세시 풍속을 외우게 하지 않는다 — 단서를 읽고 견주어 푼다(지도서 157쪽)
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 네 자리 연도 0 · 지역 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#DB2777; --green-d:#BE185D; --cyan:#C026D3;

html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}

.opt.correct{border-color:var(--green);background:#FCE7F3;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}

.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}

/* ===== 직접 조작: 명절 수수께끼를 풀어요 판 =====

   아래 달력 띠에서 단서에 맞는 명절을 누르면 상자가 풀린다.
   ⭐ 판을 바꾸는 자리 sxSet 단 하나 — 상자가 풀리는 곳은 여기뿐 · 지우는 자리 0.
   ⭐ 짝표 0 — 상자가 자기 명절 번호를 품는다(SX_BOX[b].k).
   ⭐ 푼 상자 수 · 불 켜진 명절은 저장 0 — 푼 상자(sxMark)에서 센다(sxSolvedN · sxLit).

const SX_DAY = [                                                    // 교과서 77~81쪽 — 한 해 차례 · 동지만 양력

  {mark:"나", k:0, clue:["설빔을 입고 어른들께 세배를 드리고 덕담을 들었어요. 윷놀이, 널뛰기, 연날리기를 즐겼어요.",

  {mark:"다", k:4, clue:["새해 달력을 주고받으며 새해 맞을 준비를 했어요. 오래 살기를 기원하며 버선을 드렸어요.",

  {mark:"마", k:1, clue:["달맞이를 하며 달을 보고 소원을 빌었어요. 쥐불놀이와 다리밟기를 했어요.",

const SX_CLUE_NAME = ["하는 일과 놀이", "먹는 음식", "그날의 뜻"];

  "옛날 세시 풍속은 오늘날 모두 사라졌어요",
  "옛날 세시 풍속에는 사람들의 생활과 생각이 담겨 있어요",

];

const SX_FIN_BAD = "풀어 본 다섯 상자의 단서를 다시 떠올려 봐요.";

function sxBoxOf(b){ return SX_BOX[b]; }                                      // SX_BOX 를 읽는 자리는 여기 단 하나
function sxDayOf(k){ return SX_DAY[k]; }                                      // SX_DAY 를 읽는 자리는 여기 단 하나
function sxPickOf(p){ return SX_PICK[p]; }                                    // SX_PICK 을 읽는 자리는 여기 단 하나
function sxBoxes(){ return [...Array(SX_BOX.length).keys()]; }
function sxIsDone(st,b){ return (st.sxMark >> b & 1) === 1; }                 // ★ 푼 상자 — 푼 자리에서
function sxLeft(st){ return sxBoxes().filter(b => !sxIsDone(st,b)); }         // ★ 남은 상자
function sxSolvedN(st){ return sxBoxes().filter(b => sxIsDone(st,b)).length; }  // ★ 푼 상자 수 — 셈으로
function sxLit(st,k){ return sxBoxes().some(b => sxIsDone(st,b) && sxBoxOf(b).k === k); }  // ★ 불 켜진 명절 — 셈으로
function sxAll(st){ return sxLeft(st).length === 0; }                         // ★ 끝 기준 = 남은 상자 0
function sxSet(b){ state.sxMark |= 1 << b; }                                  // ⭐ 판을 바꾸는 자리 단 하나
function sxStage(st){
  if(!sxAll(st)) return "play";
  if(st.sxRead == null) return "read";
  if(st.sxPick == null) return "pick";
  if(st.sxFin == null) return "fin";
  return "end";
}

/* 판 — 수수께끼 상자 다섯 · 단서 · 달력 띠 */
function sxBoxHTML(st,b){
  const sd = sxIsDone(st,b) ? "done" : st.sxAt === b ? "open" : "next";
  const face = sd === "done" ? sxDayOf(sxBoxOf(b).k).name : sd === "open" ? "열었어요" : "?";
  return `<button class="sx-box" data-b="${b}" data-st="${sd}" onclick="sxOpen(${b})">상자 ${sxBoxOf(b).mark}<br>${face}</button>`;
}
function sxClues(st){
  if(st.sxAt == null) return `<div class="sx-clues" data-see="0"><div class="sx-clue" data-hid="1">수수께끼 상자를 하나 열면 단서가 보여요.</div></div>`;
  const bx = sxBoxOf(st.sxAt);
  const row = c => c < st.sxSee
    ? `<div class="sx-clue" data-c="${c}" data-hid="0"><b>단서 ${c+1} · ${SX_CLUE_NAME[c]}</b> — ${bx.clue[c]}</div>`
    : `<div class="sx-clue" data-c="${c}" data-hid="1">단서 ${c+1} · ${SX_CLUE_NAME[c]} — 아직 닫혀 있어요</div>`;
  return `<div class="sx-clues" data-see="${st.sxSee}"><div class="sx-lab">상자 ${bx.mark}의 단서</div>${[0,1,2].map(row).join('')}
    <button class="sx-peek" data-on="${st.sxSee < 3 ? 1 : 0}" onclick="sxPeek()">단서 한 장 더 보기</button></div>`;
}
function sxStrip(st){
  return `<div><div class="sx-lab">달력 띠 — 한 해 차례로 놓인 다섯 명절</div><div class="sx-strip">${SX_DAY.map((_,k) => {
    const lit = sxLit(st,k);
    return `<button class="sx-day" data-k="${k}" data-lit="${lit ? 1 : 0}" data-on="${st.sxAt == null ? 0 : 1}" onclick="sxGuess(${k})"><b>${sxDayOf(k).name}</b><small>${sxDayOf(k).date}</small>${lit ? `<span class="sx-food">${sxDayOf(k).food}</span>` : ''}</button>`;
  }).join('')}</div></div>`;
}
function sxBoard(st){
  return `<div class="sx-board" data-mark="${st.sxMark}" data-solved="${sxSolvedN(st)}" data-left="${sxLeft(st).length}">
    <div class="sx-title">단서를 읽고 어느 명절인지 수수께끼를 풀어요</div>
    <div><div class="sx-lab">수수께끼 상자</div><div class="sx-boxes">${SX_BOX.map((_,b) => sxBoxHTML(st,b)).join('')}</div></div>
    ${sxAll(st) ? '' : sxClues(st)}${sxStrip(st)}</div>`;
}
function sxPicks(st){
  return `<div class="sx-picks">${[0,1,2].map(p=>`<button class="sx-pk" data-p="${p}" onclick="sxPick(${p})"><b>${sxPickOf(p).mark}</b> ${sxPickOf(p).text}</button>`).join('')}</div>`;
}
function sxHelp(st){
  return `<div class="sx-help"><b>수수께끼 상자</b>를 하나 열어 단서를 읽어요.<br>
    모르겠으면 <b>단서 한 장 더 보기</b>를 눌러요(셋까지).<br>
    <b>달력 띠</b>에서 알맞은 명절을 누르면 상자가 풀려요. 어느 상자부터 풀어도 좋아요.</div>`;
}
function sxPanel(st){
  const stage = sxStage(st);
  let ask = '';
  if(stage === "play"){
    ask = `<div class="sx-ask" data-step="play"><b>명절마다 하는 일, 먹는 음식, 놀이를 단서로 읽고 다섯 수수께끼를 풀어 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="sx-ask" data-step="read"><b>다섯 명절에 모두 불이 켜진 달력 띠를 보니 무엇을 알 수 있을까요?</b>

    ${selfCheck(0,"다섯 명절에 하는 일, 먹는 음식, 놀이를 말할 수 있어요",st)}
    ${selfCheck(1,"세시 음식에 담긴 옛날 사람들의 마음을 말할 수 있어요",st)}
    ${selfCheck(2,"오늘날까지 이어져 내려오는 세시 풍속을 예를 들어 말할 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">옛날의 세시 풍속을 알아봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">친구들과 나누고 싶은 <b style="color:#DB2777">새해 덕담</b>, 보름달에 빌고 싶은 <b style="color:#DB2777">소원</b>을 써 보고, <b style="color:#DB2777">단오 부채</b>를 만들어 봐요. 이건 교실 몫이에요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u2_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  sxAt:null, sxSee:0, sxMark:0, sxRead:null, sxPick:null, sxFin:null, sxMsg:"", sxTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function sxDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 상자 열기 */
function sxOpen(b){
  if(state.sxFin!=null) return;                                                            // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(b) || b<0 || b>=SX_BOX.length) return;                              // 가드②: 무효 상자 — 안내조차 띄우지 않음
  if(sxIsDone(state,b)){ state.sxMsg = SX_SAY_DONE; playThud(); sxDraw(); return; }        // 가드③: 이미 푼 상자 — 판 불변
  if(state.sxAt !== b){ state.sxAt = b; state.sxSee = 1; }
  state.sxMsg = ""; state.sxTell = `상자 ${sxBoxOf(b).mark}를 열었어요. 단서를 읽고 어느 명절인지 떠올려 봐요.`; playBlip(); sxDraw();
}
/* 단서 한 장 더 — 보는 자리일 뿐 */
function sxPeek(){
  if(state.sxFin!=null) return;                                                            // 가드①
  if(state.sxAt==null){ state.sxMsg = SX_SAY_OPENFIRST; playThud(); sxDraw(); return; }    // 가드⑬: 상자 없이 — 판 불변
  if(state.sxSee>=3){ state.sxMsg = SX_SAY_ALLSEEN; playThud(); sxDraw(); return; }        // 가드⑬: 단서 셋 뒤 — 판 불변
  state.sxSee += 1;
  state.sxMsg = ""; state.sxTell = `단서를 한 장 더 열었어요. 지금 ${state.sxSee}장이 보여요.`; playBlip(); sxDraw();
}
/* 달력 띠 — 명절 누르기 */
function sxGuess(k){
  if(state.sxFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(k) || k<0 || k>=SX_DAY.length || sxAll(state)) return;              // 가드②: 무효 명절 · 다 푼 뒤
  if(state.sxAt==null){ state.sxMsg = SX_SAY_OPENFIRST; playThud(); sxDraw(); return; }    // 가드④: 상자를 열기 전 — 판 불변
  const b = state.sxAt;
  if(sxBoxOf(b).k !== k){ state.sxMsg = SX_SAY_OUT; playThud(); sxDraw(); return; }        // 가드⑤: 맞지 않는 명절 — 판 불변
  sxSet(b); state.sxAt = null; state.sxSee = 0;
  state.sxMsg = ""; state.sxTell = `상자 ${sxBoxOf(b).mark}의 수수께끼가 풀렸어요. 답은 「${sxDayOf(k).name}」! ${sxDayOf(k).name}에는 ${sxDayOf(k).food}을 먹었어요.`;
  if(sxAll(state)){ playChime(); } else { playBlip(); } sxDraw();
}
/* 판 읽기 */
function sxRead(i){
  if(state.sxFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=SX_READQ.length) return;                           // 가드②
  if(!sxAll(state)){ state.sxMsg = SX_SAY_ORDER_R; playThud(); sxDraw(); return; }         // 가드⑥: 다 풀기 전 — 판 불변
  if(state.sxRead!=null){ state.sxMsg = SX_SAY_READDONE; sxDraw(); return; }               // 가드⑦: 이미 정한 자리 — 판 불변
  if(i!==SX_READ_OK){ state.sxMsg = SX_READ_BAD; playThud(); sxDraw(); return; }           // 가드⑧: 어긋난 답 — 판 불변
  state.sxRead = i; state.sxMsg = ""; state.sxTell = `다섯 명절 가운데 ${SX_DAY.length - 1}개는 음력 날짜로, 동지는 양력 날짜로 쇠요. 명절마다 하는 일, 먹는 음식, 놀이가 달라요.`; playBlip(); sxDraw();
}
/* 경험해 보고 싶은 풍습 고르기 — 정답 없음 */
function sxPick(p){
  if(state.sxFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(p) || p<0 || p>=SX_PICK.length) return;                             // 가드②
  if(state.sxRead==null){ state.sxMsg = SX_SAY_ORDER_P; playThud(); sxDraw(); return; }    // 가드⑨: 판을 읽기 전 — 판 불변
  if(state.sxPick!=null){ state.sxMsg = SX_SAY_PICKDONE; sxDraw(); return; }               // 가드⑩: 이미 고른 자리 — 판 불변
  state.sxPick = p; state.sxMsg = ""; state.sxTell = `${sxPickOf(p).mark}를 골랐어요. ${sxPickOf(p).why}`; playBlip(); sxDraw();
}
/* 마무리 */
function sxFin(i){
  if(state.sxFin!=null) return;                                                            // 가드①
  if(!Number.isInteger(i) || i<0 || i>=SX_FINQ.length) return;                             // 가드②
  if(state.sxPick==null){ state.sxMsg = SX_SAY_ORDER_FIN; playThud(); sxDraw(); return; }  // 가드⑪: 고르기 전 — 판 불변
  if(i!==SX_FIN_OK){ state.sxMsg = SX_FIN_BAD; playThud(); sxDraw(); return; }             // 가드⑫: 어긋난 답 — 판 불변
  state.sxFin = i; state.sxMsg = ""; playChime(); sxDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u2_l05_형광펜을칠해요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

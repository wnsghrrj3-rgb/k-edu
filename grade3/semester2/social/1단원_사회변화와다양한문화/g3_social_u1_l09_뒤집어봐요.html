<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제② 다양한 문화에 대한 이해와 존중 · l09 (주제 셋째 차시)
  「다양한 문화의 확산이 우리 사회에 미친 영향을 알아볼까요」
  교과서 p.43~47 · 지도서 12~13차시(p.89~95 · 두 시간 한 파일) · [4사03-02]
  수업 기법 = 추론하기 · 생활 속 경험 공유하기
=========================================================================

  ■ 직접조작 = 두 면을 뒤집어 봐요 판 (사회 3-2 아홉째 판)
  ⭐ 씨앗은 교과서 47쪽 「꼭 기억해요」 두 줄 — 다양한 문화를 누리며 살 수 있게 되었지만, 편견을 갖고 차별하는 문제가 생기기도 한다.
  ⭐ 카드는 셋 — 외국인 이주민 · 1인 가구 · 반려동물과 함께 사는 사람. 카드마다 밝은 면(좋아진 점 · 교과서 43~45쪽)과 그늘 면(생긴 문제 · 교과서 46~47쪽)이 있다.
  ⭐ 덮인 카드는 뒤집으면 밝은 면부터 · 그다음부터는 두 면을 오간다 — 면을 바꾸는 자리는 tnTurn 단 하나.
  ⭐ 본 면 기록은 state.tnSeen |= 단 하나(줄지 않음) · 두 면을 다 본 카드 수는 저장 0 — 기록에서 센다(tnBothN).
  ⭐ 끝 기준도 상수가 아니라 tnBothN === TN_N · TN_CARD 를 읽는 자리는 tnCardOf 단 하나 · TN_PICK 은 tnPickOf · 난수 0.

  ■ 이 차시의 뼈대
   어느 카드도 한 면만 있지 않다 — 세 카드 모두 밝은 면과 그늘 면이 함께 있다.
   → 다양한 문화가 확산되면서 우리 사회에는 좋은 영향과 함께 문제도 나타난다(교과서 47쪽 「꼭 기억해요」).

  ■ 5단계
   ① 세 카드를 뒤집어 두 면 모두 보기 → ② 판 읽기 3택(정답 자리 2)
   ③ 1인 가구에 인기 있을 것 같은 제품 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다)
   ④ 마무리 3택(정답 자리 0) → 완료
      — 반려동물로 다른 사람과 갈등을 겪은 경험 나누기 · 문화 소개 교육 프로그램 경험 나누기는 교실 몫

  ■ 가드 10종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 세 카드의 두 면을 다 본 뒤 뒤집기 — 판 불변 ④ 다 보기 전 판 읽기 — 판 불변
   ⑤ 이미 읽은 자리 — 판 불변                 ⑥ 판 읽기 어긋난 답 — 판 불변
   ⑦ 판을 읽기 전 제품 고르기 — 판 불변        ⑧ 이미 고른 제품 — 판 불변
   ⑨ 제품을 고르기 전 마무리 — 판 불변         ⑩ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 카드 여섯 면의 말은 교과서 43~47쪽 글과 그림 말을 줄여 옮긴 것(캡션 상시).
   ㉡ 제품 세 가지는 어느 것이 더 낫다고 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 갈등을 겪은 경험 이야기, 문화 소개 교육 프로그램 경험 나누기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐 — 해결을 위한 노력·제도·누리집 0
   · 새 사실 0 — 교과서 43~47쪽 · 지도서 89~95쪽에 있는 사실만 · 교사용 참고 자료(수용성 점수·산업 규모·%) 0
   · 「틀렸」 0 · 사람 형상 0 · 학생 이름 0 · 신문 이름 0 · 네 자리 연도 0
   · 편견은 생각, 차별은 편견을 가지고 다르게 대우하는 것 — 생각과 행동을 나누어 적는다(지도 꿀 Tip)
-->

<script>

/* ===== 직접 조작: 두 면을 뒤집어 봐요 판 =====
   카드 셋(외국인 이주민 · 1인 가구 · 반려동물과 함께 사는 사람)을 뒤집어 밝은 면과 그늘 면을 모두 본다.
   ⭐ 덮인 카드는 뒤집으면 밝은 면부터 · 그다음부터는 두 면을 오간다 — 면을 바꾸는 자리는 tnTurn 단 하나.
   ⭐ 본 면 기록은 state.tnSeen |= 단 하나(줄지 않음) · 두 면을 다 본 카드 수는 저장 0 — 기록에서 센다(tnBothN).
   ⭐ 세 카드 모두 두 면을 보면 — 어느 카드도 한 면만 있지 않다.
   ================================================================= */
const TN_CARD = [                                           // 교과서 43~47쪽 — bright 는 좋아진 점(43~45쪽), shade 는 생긴 문제(46~47쪽)
  {name:"외국인 이주민", ic:"🌏",
   bright:{head:"좋아진 점", text:"외국인 이주민이 학생들에게 자신이 태어나고 자란 나라의 문화를 생생하게 알려 주는 교육 프로그램에 참여해요. 세계 여러 나라의 문화를 경험할 기회가 늘어났어요."},
   shade:{head:"생긴 문제", text:"종교, 언어, 피부색 등이 다르다는 까닭으로 부당한 대우를 받는 사람들이 있어요. 낯선 문화에 대한 편견과 차별이 생기기도 해요."}},
  {name:"1인 가구", ic:"🏠",
   bright:{head:"좋아진 점", text:"크기가 작은 가전제품이 인기를 끌고, 상점에서 적은 양을 포장한 상품이 많아지고 있어요. 장보기, 세탁, 청소를 대신 해 주는 활동도 늘어나고 있어요."},
   shade:{head:"생긴 문제", text:"혼자 사는 사람들은 외로움이나 불안함을 느끼기도 해요. 건강이나 안전에 문제가 생겼을 때 주변에 도움을 청할 사람이 없어 어려움을 겪기도 해요."}},
  {name:"반려동물과 함께 사는 사람", ic:"🐾",
   bright:{head:"좋아진 점", text:"반려동물과 함께 지내며 마음의 안정을 찾고 화목하게 생활해요. 반려동물 미용사, 수의사, 반려동물 훈련사처럼 관련 있는 직업도 늘어나고 있어요."},
   shade:{head:"생긴 문제", text:"짖는 소리나 발소리, 배설물, 냄새 때문에 이웃 간에 갈등이 생기기도 해요. 버려지는 동물이 생기는 문제도 있어요."}}
];
const TN_N = 3;                                             // 카드 셋
const TN_COVER = -1;                                        // 아직 뒤집지 않은 카드
const TN_BRIGHT = 0;                                        // 밝은 면 — 좋아진 점
const TN_SHADE = 1;                                         // 그늘 면 — 생긴 문제
const TN_FACE_NAME = ["밝은 면", "그늘 면"];
const TN_PICK = [
  {mark:"가", text:"혼자서 이용할 수 있는 운동 기구",   why:"집에서 혼자 운동하고 싶은 사람에게 알맞을 수 있어요."},
  {mark:"나", text:"아침에 잠을 깨워 주는 시계",       why:"아침에 깨워 줄 사람이 없는 사람에게 알맞을 수 있어요."},
  {mark:"다", text:"집안일을 도와주는 로봇",           why:"혼자서 집안일을 모두 해야 하는 사람에게 알맞을 수 있어요."}
];
const TN_SAY_ALL = "세 카드의 두 면을 모두 봤어요. 이제 판을 읽어 봐요.";

const TN_SAY_ORDER_FIN = "먼저 1인 가구에 인기 있을 것 같은 제품을 골라 봐요.";
const TN_READQ = [
  "밝은 면만 있는 카드도 있어요. 다양한 문화가 확산되면 좋은 점만 생겨요",
  "그늘 면이 있는 카드는 나쁜 문화예요. 그늘 면이 있는 문화는 없애야 해요",

];
const TN_READ_OK = 2;
const TN_READ_BAD = "카드마다 밝은 면과 그늘 면을 몇 개 보았는지 다시 읽어 봐요.";
const TN_FINQ = [
  "다양한 문화가 확산되면서 사람들은 원하는 문화를 누리며 살 수 있게 되었지만, 낯선 문화에 편견을 갖고 차별하는 문제가 생기기도 해요",
  "다양한 문화가 확산되면서 우리 사회에는 아무 문제도 생기지 않았어요",
  "다양한 문화가 확산되면서 사람들이 누릴 수 있는 문화가 줄어들었어요"
];
const TN_FIN_OK = 0;
const TN_FIN_BAD = "세 카드의 밝은 면과 그늘 면을 다시 떠올려 봐요.";

function tnCardOf(k){ return TN_CARD[k]; }                                    // TN_CARD 를 읽는 자리는 여기 단 하나
function tnPickOf(p){ return TN_PICK[p]; }                                    // TN_PICK 을 읽는 자리는 여기 단 하나
function tnCards(){ return [...Array(TN_N).keys()]; }
function tnBit(k,f){ return 1 << (k*2 + f); }
function tnSaw(st,k,f){ return (st.tnSeen & tnBit(k,f)) !== 0; }
function tnTurn(st,k){ const face = st.tnFace[k]; st.tnFace[k] = face===TN_BRIGHT?TN_SHADE:TN_BRIGHT; }   // ⭐ 면을 바꾸는 자리 단 하나
function tnBoth(st,k){ return tnSaw(st,k,TN_BRIGHT) && tnSaw(st,k,TN_SHADE); }  // ★ 두 면을 다 본 카드인지 — 한 줄로
function tnBothN(st){ return tnCards().filter(k => tnBoth(st,k)).length; }
function tnAll(st){ return tnBothN(st) === TN_N; }
function tnSeenN(st){ let n = 0; for(const k of tnCards()) for(const f of [TN_BRIGHT,TN_SHADE]) if(tnSaw(st,k,f)) n++; return n; }
function tnFaceText(st,k){ const C = tnCardOf(k), f = st.tnFace[k]; return f===TN_BRIGHT ? C.bright : C.shade; }
function tnLine(st,k){
  const C = tnCardOf(k), F = tnFaceText(st,k), N = tnBothN(st);
  const tail = tnAll(st) ? ` — 세 카드 모두 두 면을 봤어요. 판을 읽어 봐요.` : ``;
  return `「${C.name}」 카드의 ${TN_FACE_NAME[st.tnFace[k]]} — ${F.head}: ${F.text} 두 면을 다 본 카드 ${N} / ${TN_N}${tail}`;
}
function tnStage(st){
  if(!tnAll(st)) return "turn";
  if(st.tnRead == null) return "read";
  if(st.tnPick == null) return "pick";
  if(st.tnFin == null) return "fin";
  return "end";
}

/* 판 — 카드 셋 · 본 면 표시 */
function tnCardHTML(st,k){
  const C = tnCardOf(k), f = st.tnFace[k];
  const face = f===TN_COVER ? `<div class="tn-face">아직 뒤집지 않았어요. 뒤집어 봐요.</div>`
    : `<div class="tn-face"><b>${TN_FACE_NAME[f]} · ${tnFaceText(st,k).head}</b>${tnFaceText(st,k).text}</div>`;
  const seen = `<div class="tn-seen">${[TN_BRIGHT,TN_SHADE].map(s => `<span data-s="${s}" data-on="${tnSaw(st,k,s) ? 1 : 0}">${TN_FACE_NAME[s]}</span>`).join('')}</div>`;
  return `<div class="tn-card" data-k="${k}" data-face="${f}" data-both="${tnBoth(st,k) ? 1 : 0}"><div class="tn-name">${C.ic} ${C.name}</div>${face}${seen}
    <button class="tn-btn" data-k="${k}" onclick="tnFlip(${k})">카드 뒤집기</button></div>`;
}
function tnBoard(st){
  return `<div class="tn-board" data-both="${tnBothN(st)}" data-seen="${tnSeenN(st)}">
    <div class="tn-title">세 카드를 뒤집어 밝은 면과 그늘 면을 모두 살펴봐요</div>
    <div class="tn-cards">${tnCards().map(k => tnCardHTML(st,k)).join('')}</div></div>`;
}
function tnPicks(st){
  return `<div class="tn-picks">${[0,1,2].map(p=>`<button class="tn-pk" data-p="${p}" onclick="tnChoose(${p})"><b>${tnPickOf(p).mark}</b> ${tnPickOf(p).text}</button>`).join('')}</div>`;
}
function tnHelp(st){
  return `<div class="tn-help"><b>카드 뒤집기</b>를 누르면 <b>밝은 면</b>(좋아진 점)이 먼저 보여요.<br>
    한 번 더 누르면 <b>그늘 면</b>(생긴 문제)이 보여요.<br>
    세 카드의 <b>두 면을 모두</b> 본 뒤 <b>판을 읽어</b> 봐요.</div>`;
}
function tnPanel(st){
  const stage = tnStage(st);
  let ask = '';
  if(stage === "turn"){
    ask = `<div class="tn-ask" data-step="turn"><b>다양한 문화가 확산되면서 우리 사회에는 어떤 영향이 나타났을까요? 세 카드를 뒤집어 두 면을 모두 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="tn-ask" data-step="read"><b>세 카드의 두 면을 모두 보니 무엇을 알 수 있을까요?</b>
      <div class="tn-opts">${TN_READQ.map((t,i)=>`<button class="tn-opt" onclick="tnRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="tn-ask" data-step="pick"><b>1인 가구에 인기 있을 것 같은 제품을 하나 골라 봐요.</b>${tnPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="tn-ask" data-step="fin"><b>오늘 살펴본 다양한 문화의 확산이 우리 사회에 미친 영향은 어떻게 정리할 수 있을까요?</b>
      <div class="tn-opts">${TN_FINQ.map((t,i)=>`<button class="tn-opt" onclick="tnFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="tn-ask" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">세 카드 모두 밝은 면과 그늘 면이 있었어요. 다양한 문화가 확산되면서 우리 사회에는 좋은 영향과 함께 여러 가지 문제도 나타나요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>반려동물로 다른 사람과 갈등을 겪은 경험을 이야기하는 일</b>, <b>다른 나라의 문화를 소개하는 교육 프로그램에 참여한 경험을 나누는 일</b>은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.tnTell ? `<div class="tn-tell">${st.tnTell}</div>` : '';

  <h2 class="ka-t">다양한 문화의 확산이 우리 사회에 미친 영향을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','두 면이 있는 세 카드')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>다양한 문화와 관련 있는 <b>활동이나 직업</b>이 늘어났어요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>사람들은 자신이 원하는 <b>다양한 문화를 누리며</b> 살아갈 수 있게 되었어요.</div></div>
    <div class="sum-item"><span class="n">3</span><div>낯선 문화에 대한 <b>편견과 차별</b>, 1인 가구의 건강과 안전 문제, 반려동물로 생기는 문제가 나타나기도 해요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:#4F46E5">다양한 문화의 확산으로 나타난 문제를 해결하기 위한 노력</b>을 알아봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"다양한 문화가 확산되면서 나타난 좋은 영향을 말할 수 있어요",st)}
    ${selfCheck(1,"편견과 차별의 뜻을 구분하여 말할 수 있어요",st)}
    ${selfCheck(2,"다양한 문화가 확산되면서 나타난 문제를 설명할 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">다양한 문화의 확산이 우리 사회에 미친 영향을 알아봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">반려동물로 <b style="color:#4F46E5">다른 사람과 갈등을 겪은 경험</b>과 다른 나라의 문화를 소개하는 <b style="color:#4F46E5">교육 프로그램에 참여한 경험</b> 나누기는 교실 몫이에요. 친구들과 이야기해 봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u1_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  tnFace:Array(TN_N).fill(TN_COVER), tnSeen:0, tnRead:null, tnPick:null, tnFin:null, tnMsg:"", tnTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function tnDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 카드 뒤집기 */
function tnFlip(k){
  if(state.tnFin!=null) return;                                                         // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(k) || k<0 || k>=TN_N) return;                                     // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(tnAll(state)){ state.tnMsg = TN_SAY_ALL; playThud(); tnDraw(); return; }            // 가드③: 두 면을 다 본 뒤 — 판 불변
  tnTurn(state,k);
  state.tnSeen |= tnBit(k,state.tnFace[k]);                                              // ⭐ 본 면 기록 — 쌓는 자리 단 하나
  state.tnMsg = ""; state.tnTell = tnLine(state,k); playBlip(); tnDraw();
}
/* 판 읽기 */
function tnRead(i){
  if(state.tnFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=TN_READQ.length) return;                          // 가드②
  if(!tnAll(state)){ state.tnMsg = TN_SAY_ORDER_R; playThud(); tnDraw(); return; }       // 가드④: 다 보기 전 — 판 불변
  if(state.tnRead!=null){ state.tnMsg = TN_SAY_READDONE; tnDraw(); return; }             // 가드⑤: 이미 정한 자리 — 판 불변
  if(i!==TN_READ_OK){ state.tnMsg = TN_READ_BAD; playThud(); tnDraw(); return; }         // 가드⑥: 어긋난 답 — 판 불변
  state.tnRead = i; state.tnMsg = ""; state.tnTell = `두 면을 다 본 카드 ${tnBothN(state)} / ${TN_N} — 어느 카드도 한 면만 있지 않았어요. 좋은 영향과 함께 문제도 나타나요.`; playBlip(); tnDraw();
}
/* 1인 가구에 인기 있을 것 같은 제품 고르기 — 정답 없음 */
function tnChoose(p){
  if(state.tnFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(p) || p<0 || p>=TN_PICK.length) return;                           // 가드②
  if(state.tnRead==null){ state.tnMsg = TN_SAY_ORDER_P; playThud(); tnDraw(); return; }  // 가드⑦: 판을 읽기 전 — 판 불변
  if(state.tnPick!=null){ state.tnMsg = TN_SAY_PICKDONE; tnDraw(); return; }             // 가드⑧: 이미 고른 제품 — 판 불변
  state.tnPick = p; state.tnMsg = ""; state.tnTell = `${tnPickOf(p).mark}를 골랐어요. ${tnPickOf(p).why}`; playBlip(); tnDraw();
}
/* 마무리 */
function tnFin(i){
  if(state.tnFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=TN_FINQ.length) return;                           // 가드②
  if(state.tnPick==null){ state.tnMsg = TN_SAY_ORDER_FIN; playThud(); tnDraw(); return; } // 가드⑨: 제품을 고르기 전 — 판 불변
  if(i!==TN_FIN_OK){ state.tnMsg = TN_FIN_BAD; playThud(); tnDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.tnFin = i; state.tnMsg = ""; playChime(); tnDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

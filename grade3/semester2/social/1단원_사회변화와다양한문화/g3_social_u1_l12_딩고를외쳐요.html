<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  단원 마무리 · l12
  「사회 변화와 다양한 문화 정리」
  교과서 p.56~59 · 지도서 17~18차시(p.112~113 · 두 시간 한 파일) · [4사03-01] [4사03-02]
  수업 기법 = 돌아가며 말하기
=========================================================================

  ■ 직접조작 = 딩고를 외쳐요 판 (사회 3-2 열두째 판)
  ⭐ 씨앗은 교과서 58~59쪽 「교실 놀이를 함께해요」 딩고 놀이 — 카드 4장을 한 주제로 모은다.
  ⭐ 카드 열여섯은 교과서 56쪽 생각 그물의 말(사회 변화 넷 × 네 장). 카드에는 주제가 적혀 있지 않다 — 어느 사회 변화의 카드인지는 학생이 가린다.
  ⭐ 손에 든 카드를 누르면 버려(가운데로) · 가운데 카드를 누르면 집어(빈자리로) · 네 장이 한 주제면 「딩고!」.
  ⭐ 가운데 카드는 저장 0 — 손에 없는 카드를 센다(dgTable). 손을 바꾸는 자리 dgPut 단 하나 · DG_CARD 를 읽는 자리 dgCardOf · DG_TOPIC 은 dgTopicOf · DG_PICK 은 dgPickOf 단 하나씩 · 난수 0.
  ⭐ 끝 기준도 상수가 아니라 dgSame(네 장 모두 한 주제) — 어느 주제로 모아도 된다(정답 주제 없음).

  ■ 이 차시의 뼈대
   한 주제의 카드 네 장에는 그 사회 변화로 달라진 생활 모습(또는 문제)과 해결 노력이 함께 있다 — 사회 변화마다 달라진 모습과 해결 노력을 알아야 카드를 모을 수 있다(단원 정리).

  ■ 5단계
   ① 버리고 집어 네 장 모으기 · 「딩고!」 → ② 판 읽기 3택(정답 자리 1)
   ③ 친구에게 먼저 이야기하고 싶은 것 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다 · 교과서 57쪽)
   ④ 마무리 3택(정답 자리 2) → 완료
      — 생각 그물 쓰기 · 모둠 딩고 놀이 · 돌아가며 말하기는 교실 몫

  ■ 가드 13종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 딩고 뒤 버리기·집기·다시 딩고 — 판 불변   ④ 버린 뒤 또 버리기 — 판 불변
   ⑤ 네 장일 때 집기 — 판 불변                 ⑥ 한 주제가 아닌데 딩고 — 판 불변
   ⑦ 딩고 전 판 읽기 — 판 불변                 ⑧ 이미 읽은 자리 — 판 불변
   ⑨ 판 읽기 어긋난 답 — 판 불변               ⑩ 판을 읽기 전 고르기 — 판 불변
   ⑪ 이미 고른 자리 — 판 불변                  ⑫ 고르기 전 마무리 — 판 불변
   ⑬ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 카드 열여섯의 말은 교과서 56쪽 생각 그물에서 옮긴 것 · 처음 손에 든 카드와 가운데 카드의 자리는 판이 정한 것(캡션 상시).
   ㉡ 어느 주제로 모아도 딩고 · 친구에게 먼저 이야기하고 싶은 것은 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 생각 그물 쓰기, 모둠 딩고 놀이, 돌아가며 말하기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐
   · 새 사실 0 — 교과서 56~59쪽 · 지도서 112~113쪽과 앞 차시에 있는 사실만 · 누리집 주소 0
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 네 자리 연도 0 · 지역 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}

.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;

.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}

.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#E0E7FF;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {
  // 생각 그물 — 가운데 단원 이름, 가지 넷
  net:`<svg viewBox="0 0 160 96"><rect width="160" height="96" fill="#EEF2FF"/>

function dgCardOf(c){ return DG_CARD[c]; }                                    // DG_CARD 를 읽는 자리는 여기 단 하나
function dgTopicOf(t){ return DG_TOPIC[t]; }                                  // DG_TOPIC 을 읽는 자리는 여기 단 하나
function dgPickOf(p){ return DG_PICK[p]; }                                    // DG_PICK 을 읽는 자리는 여기 단 하나
function dgCards(){ return [...Array(DG_CARD.length).keys()]; }
function dgHandN(st){ return st.dgHand.filter(c => c !== null).length; }
function dgGap(st){ return st.dgHand.indexOf(null); }
function dgTable(st){ return dgCards().filter(c => !st.dgHand.includes(c)); }  // ★ 가운데 카드 — 손에 없는 카드
function dgSame(st){ return dgHandN(st) === DG_N && st.dgHand.every(c => dgCardOf(c).t === dgCardOf(st.dgHand[0]).t); }   // ★ 네 장이 한 주제인지 — 한 줄로
function dgPut(k,c){ state.dgHand[k] = c; }                                    // ⭐ 손을 바꾸는 자리 단 하나
function dgStage(st){
  if(!st.dgCall) return "play";
  if(st.dgRead == null) return "read";
  if(st.dgPick == null) return "pick";
  if(st.dgFin == null) return "fin";
  return "end";
}

/* 판 — 손에 든 카드 넷 · 가운데 카드 */
function dgHandBox(st){
  return `<div><div class="dg-lab">손에 든 카드 — 누르면 버려요</div><div class="dg-hand">${st.dgHand.map((c,k) => c === null
    ? `<button class="dg-c" data-k="${k}" data-gap="1">빈자리</button>`
    : `<button class="dg-c" data-k="${k}" data-c="${c}" data-gap="0" onclick="dgDrop(${k})">${dgCardOf(c).text}</button>`).join('')}</div></div>`;
}
function dgTableBox(st){
  return `<div><div class="dg-lab">가운데 카드 — 누르면 집어요</div><div class="dg-table">${dgTable(st).map(c =>
    `<button class="dg-c" data-c="${c}" onclick="dgTake(${c})">${dgCardOf(c).text}</button>`).join('')}</div></div>`;
}
function dgBoard(st){
  return `<div class="dg-board" data-hand="${dgHandN(st)}" data-table="${dgTable(st).length}" data-call="${st.dgCall ? 1 : 0}">
    <div class="dg-title">카드 4장을 한 주제로 모아 「딩고!」를 외쳐요</div>
    ${dgHandBox(st)}${dgTableBox(st)}
    <button class="dg-shout" data-on="${dgHandN(st) === DG_N ? 1 : 0}" onclick="dgShout()">딩고!</button></div>`;
}
function dgPicks(st){
  return `<div class="dg-picks">${[0,1,2].map(p=>`<button class="dg-pk" data-p="${p}" onclick="dgChoose(${p})"><b>${dgPickOf(p).mark}</b> ${dgPickOf(p).text}</button>`).join('')}</div>`;
}
function dgHelp(st){
  return `<div class="dg-help">필요 없는 카드를 눌러 <b>버려요</b>. 가운데에서 카드 하나를 눌러 <b>집어요</b>.<br>
    카드에는 주제가 적혀 있지 않아요. <b>어느 사회 변화의 카드인지</b> 생각해요.<br>
    네 장이 한 주제로 모이면 <b>딩고!</b>를 눌러요.</div>`;
}
function dgPanel(st){
  const stage = dgStage(st);
  let ask = '';
  if(stage === "play"){
    ask = `<div class="dg-ask" data-step="play"><b>저출산, 고령화, 지능정보화, 세계화 가운데 어떤 주제로 카드를 모을지 잘 생각해요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="dg-ask" data-step="read"><b>한 주제로 모은 카드 네 장을 보니 무엇을 알 수 있을까요?</b>
      <div class="dg-opts">${DG_READQ.map((t,i)=>`<button class="dg-opt" onclick="dgRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="dg-ask" data-step="pick"><b>이 단원에서 공부한 내용 가운데 친구에게 가장 먼저 이야기하고 싶은 것을 하나 골라 봐요.</b>${dgPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="dg-ask" data-step="fin"><b>사회 변화와 다양한 문화에서 공부한 내용으로 알맞은 것은 무엇일까요?</b>
      <div class="dg-opts">${DG_FINQ.map((t,i)=>`<button class="dg-opt" onclick="dgFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="dg-ask" data-fin="1" style="border-color:#A5B4FC;background:#EEF2FF">
      <b style="color:#3730A3">카드 네 장을 한 주제로 모았어요. 사회 변화마다 달라진 생활 모습과 해결 노력을 알면 카드를 모을 수 있어요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>생각 그물을 글이나 그림으로 채우는 일</b>, <b>모둠 친구들과 딩고 놀이를 하는 일</b>, <b>친구들과 돌아가며 말하는 일</b>은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.dgTell ? `<div class="dg-tell">${st.dgTell}</div>` : '';
  const warn = st.dgMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.dgMsg}</div>` : '';
  return `<div class="dg-wrap">
    <div class="dg-head">손에 든 카드 <b>${dgHandN(st)}</b> / ${DG_N} · 가운데 카드 <b>${dgTable(st).length}</b>장</div>
    ${dgBoard(st)}<div class="dg-side">${dgHelp(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 카드 열여섯의 말은 <b>교과서 56쪽 생각 그물</b>에서 옮긴 것이고, 처음 손에 든 카드와 가운데 카드의 자리는 판이 정한 것이에요. 어느 주제로 모아도 딩고이고, 친구에게 먼저 이야기하고 싶은 것은 <b>가리기 어려워서</b> 판은 정답을 정하지 않아요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  dgHand:DG_START.slice(), dgCall:false, dgRead:null, dgPick:null, dgFin:null, dgMsg:"", dgTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function dgDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 버려 — 손에 든 카드 하나를 가운데로 */
function dgDrop(k){
  if(state.dgFin!=null) return;                                                          // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(k) || k<0 || k>=DG_N) return;                                     // 가드②: 무효 자리 — 안내조차 띄우지 않음
  if(state.dgCall){ state.dgMsg = DG_SAY_ALL; playThud(); dgDraw(); return; }            // 가드③: 딩고 뒤 — 판 불변
  if(dgHandN(state) < DG_N){ state.dgMsg = DG_SAY_TAKE; playThud(); dgDraw(); return; }  // 가드④: 버린 뒤 또 버리기 — 판 불변
  const c = state.dgHand[k];
  dgPut(k, null);
  state.dgMsg = ""; state.dgTell = `「${dgCardOf(c).text}」 카드를 버렸어요. 이제 가운데에서 카드 1장을 집어요.`; playBlip(); dgDraw();
}
/* 집어 — 가운데 카드 하나를 빈자리로 */
function dgTake(c){
  if(state.dgFin!=null) return;                                                          // 가드①
  if(!Number.isInteger(c) || c<0 || c>=DG_CARD.length || !dgTable(state).includes(c)) return;   // 가드②: 무효 카드·손에 든 카드
  if(state.dgCall){ state.dgMsg = DG_SAY_ALL; playThud(); dgDraw(); return; }            // 가드③
  if(dgHandN(state) === DG_N){ state.dgMsg = DG_SAY_DROP; playThud(); dgDraw(); return; } // 가드⑤: 네 장일 때 집기 — 판 불변
  dgPut(dgGap(state), c);
  state.dgMsg = ""; state.dgTell = `「${dgCardOf(c).text}」 카드를 집었어요. 네 장이 한 주제로 모였으면 딩고를 외치고, 아니면 다시 버려요.`; playBlip(); dgDraw();
}
/* 딩고! */
function dgShout(){
  if(state.dgFin!=null) return;                                                          // 가드①
  if(state.dgCall){ state.dgMsg = DG_SAY_ALL; playThud(); dgDraw(); return; }            // 가드③
  if(!dgSame(state)){ state.dgMsg = DG_SAY_NOT; playThud(); dgDraw(); return; }          // 가드⑥: 한 주제가 아닌데 — 판 불변
  state.dgCall = true;
  state.dgMsg = ""; state.dgTell = `딩고! ${dgTopicOf(dgCardOf(state.dgHand[0]).t)} 카드 네 장을 모았어요. 판을 읽어 봐요.`; playChime(); dgDraw();
}
/* 판 읽기 */
function dgRead(i){
  if(state.dgFin!=null) return;                                                          // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DG_READQ.length) return;                          // 가드②
  if(!state.dgCall){ state.dgMsg = DG_SAY_ORDER_R; playThud(); dgDraw(); return; }       // 가드⑦: 딩고 전 — 판 불변
  if(state.dgRead!=null){ state.dgMsg = DG_SAY_READDONE; dgDraw(); return; }             // 가드⑧: 이미 정한 자리 — 판 불변
  if(i!==DG_READ_OK){ state.dgMsg = DG_READ_BAD; playThud(); dgDraw(); return; }         // 가드⑨: 어긋난 답 — 판 불변
  state.dgRead = i; state.dgMsg = ""; state.dgTell = `${dgTopicOf(dgCardOf(state.dgHand[0]).t)} 카드 네 장에는 달라진 생활 모습과 해결 노력이 함께 있어요. 사회 변화마다 달라진 모습과 해결 노력을 알아야 카드를 모을 수 있어요.`; playBlip(); dgDraw();
}
/* 친구에게 이야기하고 싶은 것 고르기 — 정답 없음 */
function dgChoose(p){
  if(state.dgFin!=null) return;                                                          // 가드①
  if(!Number.isInteger(p) || p<0 || p>=DG_PICK.length) return;                           // 가드②
  if(state.dgRead==null){ state.dgMsg = DG_SAY_ORDER_P; playThud(); dgDraw(); return; }  // 가드⑩: 판을 읽기 전 — 판 불변
  if(state.dgPick!=null){ state.dgMsg = DG_SAY_PICKDONE; dgDraw(); return; }             // 가드⑪: 이미 고른 자리 — 판 불변
  state.dgPick = p; state.dgMsg = ""; state.dgTell = `${dgPickOf(p).mark}를 골랐어요. ${dgPickOf(p).why}`; playBlip(); dgDraw();
}
/* 마무리 */
function dgFin(i){
  if(state.dgFin!=null) return;                                                          // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DG_FINQ.length) return;                           // 가드②
  if(state.dgPick==null){ state.dgMsg = DG_SAY_ORDER_FIN; playThud(); dgDraw(); return; } // 가드⑫: 고르기 전 — 판 불변
  if(i!==DG_FIN_OK){ state.dgMsg = DG_FIN_BAD; playThud(); dgDraw(); return; }           // 가드⑬: 어긋난 답 — 판 불변
  state.dgFin = i; state.dgMsg = ""; playChime(); dgDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../2단원_옛날과오늘날의생활모습/g3_social_u2_l01_동그라미에놓아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

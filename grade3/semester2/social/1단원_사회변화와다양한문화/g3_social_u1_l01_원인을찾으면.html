<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제① 사회 변화로 달라진 생활 모습 · l01
  「우리 사회의 변화 모습을 살펴볼까요」
  교과서 p.12~14 · 지도서 2차시(p.26~32) · [4사03-01]
  수업 기법 = 자료(일기, 신문 기사, 그림) 분석하기
=========================================================================

  ■ 직접조작 = 원인을 찾으면 달라져요 판 (사회 3-2 첫 판)
  ⭐ 씨앗은 교과서 14쪽 스스로 활동과 지도 꿀 Tip 한 줄 —
     「용어를 소개하는 것은 지양하고, 그 원인을 추론해 볼 수 있는 정도만 질문」.
  ⭐ 옛 거리 네 자리를 하나 고르고, 그 자리를 바꾼 원인을 다섯 가운데 골라 붙인다.
     맞는 원인을 붙이면 그 자리가 오늘 모습으로 달라진다.
  ⭐ 짝표가 코드에 따로 없다. 자리가 자기를 바꾼 원인 번호를 품고 있다(CH_SPOT[k].by).
     CH_SPOT 을 읽는 자리는 chSpotOf 단 하나 · CH_CAUSE 를 읽는 자리는 chCauseOf 단 하나.
  ⭐ 쓰인 원인은 저장하지 않는다. 달라진 자리에서 셈으로 나온다(chUsed).
  ⭐ 달라지는 자리 state.chNow[k] = true 단 하나 · 되돌리는 자리 0 · 난수 0.

  ■ 이 차시의 뼈대
   네 자리를 다 바꾸어도 원인 하나(사람들의 생각 변화)는 끝까지 남는다.
   판의 그림에 바로 보이지 않을 뿐 그것도 사회를 바꾸는 원인이다 — 판 읽기가 그것을 묻는다.

  ■ 5단계
   ① 자리 고르기 → ② 원인 붙이기(네 자리 · 차례 자유) → ③ 네 자리가 다 달라짐
   ④ 판 읽기 3택(정답 자리 1) → ⑤ 마무리 3택(정답 자리 2) → 완료
      — 주변 어른께 달라진 사회 모습을 여쭈어 보는 일은 교실 몫

  ■ 가드 10종
   ① 마무리 확정 후 네 처리기 전체 잠금      ② 무효 번호(안내조차 0)
   ③ 이미 달라진 자리 고르기 — 판 불변       ④ 자리를 고르기 전 원인 붙이기 — 판 불변
   ⑤ 맞지 않는 원인 — 판 불변               ⑥ 네 자리가 다 달라진 뒤 자리 고르기 — 판 불변
   ⑦ 네 자리가 다 달라지기 전 판 읽기 — 판 불변 ⑧ 이미 읽은 자리 — 판 불변
   ⑨ 판 읽기 어긋난 답 — 판 불변             ⑩ 판을 읽기 전 마무리 · 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 옛 모습 칸은 오늘 모습과 견주어 보라고 판이 그린 자리다(캡션 상시).
   ㉡ 자리와 원인의 짝은 교과서 그림을 판이 줄여 묶은 것이고, 실제 사회 변화는
      여러 원인이 함께 얽혀 일어난다(캡션 상시).
   ㉢ 주변 어른께 달라진 모습을 여쭈어 보는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 지도서 지도 꿀 Tip — 이 차시에서는 저출산·고령화·지능정보화·세계화 용어를 쓰지 않는다(개수 0)
   · 새 사실 0 — 교과서 12~14쪽 · 지도서 26~28쪽 안의 사실만
   · 교사용 참고 자료 0(학습 안내·지도 꿀·활동 의도·평가 관점 0) · 「틀렸」 0 · 사람 형상 0 · 학생 이름 0
   · 네 자리 연도는 교과서 원문(1991년 일기 · 1980년 신문 기사) 두 곳만
-->

*{margin:0;padding:0;box-sizing:border-box}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}

.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}

  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */

.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}

.ch-wrap{max-width:780px;width:100%;margin:0 auto}

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {

/* ===== 직접 조작: 원인을 찾으면 달라져요 판 =====
   옛 거리 네 자리 가운데 하나를 고르고, 그 자리를 바꾼 원인을 다섯 가운데 골라 붙인다.
   ⭐ 짝표 0 — 자리가 자기를 바꾼 원인 번호를 품고 있다(CH_SPOT[k].by).
   ⭐ 쓰인 원인은 저장하지 않는다 — 달라진 자리에서 셈으로 나온다(chUsed).
   ⭐ 네 자리를 다 바꾸어도 원인 하나는 끝까지 남는다.
   ================================================================= */
const CH_N = 4;                                            // 옛 거리 네 자리
const CH_CN = 5;                                           // 원인 다섯
const CH_CAUSE = ["사람 수의 변화", "평균 수명의 증가", "사람들의 생각 변화", "과학 기술의 발달", "다른 나라와의 교류"];

function chSpotOf(k){ return CH_SPOT[k]; }                                  // CH_SPOT 을 읽는 자리는 여기 단 하나
function chCauseOf(c){ return CH_CAUSE[c]; }                               // CH_CAUSE 를 읽는 자리는 여기 단 하나
function chNowN(st){ let n=0; for(let k=0;k<CH_N;k++) if(st.chNow[k]) n++; return n; }
function chAllNow(st){ return chNowN(st) === CH_N; }
function chUsed(st,c){ for(let k=0;k<CH_N;k++) if(st.chNow[k] && chSpotOf(k).by === c) return true; return false; } // ★ 쓰인 원인은 셈으로
function chUsedN(st){ let n=0; for(let c=0;c<CH_CN;c++) if(chUsed(st,c)) n++; return n; }
function chStage(st){
  if(!chAllNow(st)) return st.chSel == null ? "pick" : "cause";
  if(st.chRead == null) return "read";
  if(st.chFin == null) return "fin";
  return "end";
}

/* 판 — 옛 거리 네 자리와 원인 다섯 */
function chSpotBox(st,k){
  const s = chSpotOf(k), on = st.chNow[k];
  return `<button class="ch-spot" data-k="${k}" data-now="${on?1:0}" data-sel="${st.chSel===k?1:0}" onclick="chPick(${k})">`
    + `<span class="ch-sname">${s.name}</span><span class="ch-look">${on?s.now:s.old}</span>`
    + `<span class="ch-tag">${on?'오늘 모습':'옛 모습'}</span></button>`;
}
function chCauseBtn(st,c){
  return `<button class="ch-cause" data-c="${c}" data-used="${chUsed(st,c)?1:0}" onclick="chCause(${c})">${chCauseOf(c)}</button>`;
}
function chBoard(st){
  let a=''; for(let k=0;k<CH_N;k++) a += chSpotBox(st,k);
  let b=''; for(let c=0;c<CH_CN;c++) b += chCauseBtn(st,c);
  return `<div class="ch-board" data-now="${chNowN(st)}" data-used="${chUsedN(st)}"><div class="ch-street">${a}</div><div class="ch-causes">${b}</div></div>`;
}
function chKey(st){
  return `<div class="ch-key"><b>판을 보는 법</b><br>
    거리에서 <b>자리</b>를 하나 골라요.<br>
    그 자리를 바꾼 <b>원인</b>을 골라 붙여요.<br>
    알맞은 원인이면 <b>오늘 모습</b>으로 달라져요.</div>`;
}
function chPanel(st){
  const stage = chStage(st);
  let ask = '';
  if(stage === "pick"){
    ask = `<div class="ch-ask" data-step="pick"><b>거리에서 달라질 자리를 하나 골라 봐요.</b></div>`;
  } else if(stage === "cause"){
    ask = `<div class="ch-ask" data-step="cause"><b>「${chSpotOf(st.chSel).name}」 자리를 바꾼 원인은 무엇일까요? 아래 원인 가운데 하나를 골라요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="ch-ask" data-step="read"><b>네 자리가 모두 달라졌는데도 쓰이지 않은 원인 하나가 남았어요. 이 원인을 어떻게 생각하면 좋을까요?</b>
      <div class="ch-opts">${CH_READQ.map((t,i)=>`<button class="ch-opt" onclick="chRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "fin"){
    ask = `<div class="ch-ask" data-step="fin"><b>그렇다면 우리 사회의 변화는 어떻게 정리할 수 있을까요?</b>
      <div class="ch-opts">${CH_FINQ.map((t,i)=>`<button class="ch-opt" onclick="chFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="ch-ask" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">여러 원인으로 사회가 변하고, 사회가 변하면서 사람들의 생활 모습도 달라져요.</b>
      판에 바로 보이지 않는 원인도 사회를 바꾸고 있어요.
      <div class="note" style="text-align:left;margin-top:5px">※ 주변 어른께 옛날과 달라진 사회 모습을 여쭈어 보는 일은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.chTell ? `<div class="ch-tell">${st.chTell}</div>` : '';
  const warn = st.chMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.chMsg}</div>` : '';
  return `<div class="ch-wrap">
    <div class="ch-head">달라진 자리 <b>${chNowN(st)}</b> / 4 · 쓰인 원인 <b>${chUsedN(st)}</b> / 5</div>
    ${chBoard(st)}<div class="ch-side">${chKey(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ <b>옛 모습 칸은 오늘 모습과 견주어 보라고 판이 그린 자리</b>예요. 자리와 원인의 짝은 교과서 그림을 <b>판이 줄여 묶은 것</b>이고, 실제 사회 변화는 <b>여러 원인이 함께 얽혀</b> 일어나요.</div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),

  chNow:[false,false,false,false], chSel:null, chRead:null, chFin:null, chMsg:"", chTell:"",

};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function chDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 거리에서 자리 고르기 */
function chPick(k){
  if(state.chFin!=null) return;                                                         // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(k) || k<0 || k>=CH_N) return;                                     // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(chAllNow(state)){ state.chMsg = CH_SAY_ALL; playThud(); chDraw(); return; }          // 가드⑥: 네 자리가 다 달라진 뒤 — 판 불변
  if(state.chNow[k]){ state.chMsg = CH_SAY_NOWDONE; playThud(); chDraw(); return; }       // 가드③: 이미 달라진 자리 — 판 불변
  state.chSel = (state.chSel === k) ? null : k;                                          // 같은 자리를 다시 누르면 고르기를 푼다
  state.chMsg = ""; state.chTell = ""; playBlip(); chDraw();
}
/* 원인 붙이기 */
function chCause(c){
  if(state.chFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(c) || c<0 || c>=CH_CN) return;                                    // 가드②
  if(chAllNow(state)){ state.chMsg = CH_SAY_ALL; playThud(); chDraw(); return; }          // 가드⑥
  if(state.chSel == null){ state.chMsg = CH_SAY_PICK; playThud(); chDraw(); return; }    // 가드④: 자리를 고르기 전 — 판 불변
  const k = state.chSel;
  if(chSpotOf(k).by !== c){ state.chMsg = CH_SAY_NOT; playThud(); chDraw(); return; }    // 가드⑤: 맞지 않는 원인 — 판 불변
  state.chNow[k] = true;                                                                 // ⭐ 자리가 달라지는 자리는 코드에 여기 단 하나 · 되돌리는 자리 0
  state.chSel = null;
  state.chMsg = ""; state.chTell = chSpotOf(k).why; playBlip(); chDraw();
}
/* 판 읽기 */
function chRead(i){
  if(state.chFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=CH_READQ.length) return;                          // 가드②
  if(!chAllNow(state)){ state.chMsg = CH_SAY_ORDER_R; playThud(); chDraw(); return; }     // 가드⑦: 네 자리가 다 달라지기 전 — 판 불변
  if(state.chRead!=null){ state.chMsg = CH_SAY_READDONE; chDraw(); return; }             // 가드⑧: 이미 정한 자리 — 판 불변
  if(i!==CH_READ_OK){ state.chMsg = CH_READ_BAD; playThud(); chDraw(); return; }         // 가드⑨: 어긋난 답 — 판 불변
  state.chRead = i; state.chMsg = ""; state.chTell = ""; playBlip(); chDraw();
}
/* 마무리 */
function chFin(i){
  if(state.chFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=CH_FINQ.length) return;                           // 가드②
  if(state.chRead==null){ state.chMsg = CH_SAY_ORDER_FIN; playThud(); chDraw(); return; }// 가드⑩: 판을 읽기 전 — 판 불변
  if(i!==CH_FIN_OK){ state.chMsg = CH_FIN_BAD; playThud(); chDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.chFin = i; state.chMsg = ""; playChime(); chDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u1_l02_견주면보여요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

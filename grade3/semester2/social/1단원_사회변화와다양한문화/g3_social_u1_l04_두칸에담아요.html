<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제① 사회 변화로 달라진 생활 모습 · l04
  「지능정보화로 달라진 생활 모습을 살펴볼까요」
  교과서 p.21~26 · 지도서 5~6차시(p.47~60) · [4사03-01] · 두 시간 한 파일
  수업 기법 = 자료(신문 기사) 분석 및 추론하기 · 의견 모으기
=========================================================================

  ■ 직접조작 = 두 칸에 나누어 담아요 판 (사회 3-2 넷째 판)
  ⭐ 씨앗은 교과서 25쪽 「꼭 기억해요」 한 줄 —
     「지능정보화의 장점은 누리고, 단점은 보완하려는 태도가 필요합니다.」
  ⭐ 카드 여덟 장(교과서 22~23쪽 생활 모습 넷 · 24쪽 문제 넷)을 「누려요」 칸과 「보완해요」 칸에 나누어 담는다.
     카드는 다시 옮기거나 꺼낼 수 있다.
  ⭐ 결과표 0 — 카드가 알맞은 칸에 있는지는 카드가 품은 쪽(side)과 담긴 칸을 견주어 한 줄로 나온다(dsRight).
  ⭐ 칸마다 담긴 카드 수도 저장하지 않는다 — 담긴 자리를 세어 나온다(dsIn).
  ⭐ 끝 기준도 상수가 아니라 dsRightN === DS_N.
  ⭐ DS_CARD 를 읽는 자리는 dsCardOf 단 하나 · DS_RULE 는 dsRuleOf 단 하나 · 난수 0.

  ■ 이 차시의 뼈대
   두 칸 모두 비지 않는다. 편리해진 모습과 함께 문제도 생겼다.
   그래서 장점은 누리고 단점은 보완하려는 태도가 필요하다.

  ■ 5단계
   ① 카드 여덟 장 나누어 담기 → ② 판 읽기 3택(정답 자리 2)
   ③ 학교에서 지킬 점 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다) → ④ 마무리 3택(정답 자리 0) → 완료
      — 친구들과 지킬 점을 함께 정하는 일은 교실 몫

  ■ 가드 10종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 모두 알맞게 담은 뒤 옮기기 — 판 불변      ④ 다 담기 전 판 읽기 — 판 불변
   ⑤ 이미 읽은 자리 — 판 불변                 ⑥ 판 읽기 어긋난 답 — 판 불변
   ⑦ 판을 읽기 전 지킬 점 고르기 — 판 불변     ⑧ 이미 고른 지킬 점 — 판 불변
   ⑨ 지킬 점을 고르기 전 마무리 — 판 불변      ⑩ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 카드 여덟 장은 교과서 22~24쪽에 나온 모습과 문제를 옮긴 것이고, 이것이 전부는 아니다(캡션 상시).
   ㉡ 지킬 점 세 가지는 어느 것이 더 낫다고 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 친구들과 지킬 점을 함께 정하는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 용어 0 — 다른 나라와 오가는 갈래의 용어를 쓰지 않는다
   · 새 사실 0 — 교과서 21~26쪽 · 지도서 47~52쪽 안의 사실만 · 신문 기사는 풀어 쓰고 신문 이름을 옮기지 않는다
   · 교사용 참고 자료 0 · 「틀렸」 0 · 사람 형상 0 · 학생 이름 0 · 누리집 주소 0
-->

*{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%}

.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}

.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}

.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

.ds-wrap{max-width:780px;width:100%;margin:0 auto}

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {

/* ===== 직접 조작: 두 칸에 나누어 담아요 판 =====
   카드 여덟 장을 「누려요」 칸과 「보완해요」 칸에 나누어 담는다. 카드는 다시 옮기거나 꺼낼 수 있다.
   ⭐ 결과표 0 — 카드가 알맞은 칸에 있는지는 카드가 품은 쪽과 담긴 칸을 견주어 한 줄로 나온다(dsRight).
   ⭐ 칸마다 담긴 카드 수도 셈으로 나온다(dsIn).
   ⭐ 두 칸 모두 비지 않는다 — 장점은 누리고 단점은 보완한다.
   ================================================================= */
const DS_CARD = [                                          // 교과서 22~23쪽 생활 모습 넷 · 24쪽 문제 넷(차례는 섞음)
  {name:"배달 로봇",               text:"애플리케이션으로 음식을 주문하면 로봇이 음식을 배달해 줘요",                    side:0},
  {name:"사이버 범죄",             text:"인터넷에서 다른 사람의 이름이나 전화번호 등을 함부로 사용해요",                  side:1},
  {name:"맞춤 교육",               text:"인공지능을 활용해 학생의 수준과 흥미 등을 고려한 교육 활동을 해요",              side:0},
  {name:"거짓 정보 확산",          text:"인공지능이 만든 그럴듯한 가짜 뉴스가 많은 사람을 속이기도 해요",                side:1},
  {name:"인터넷·스마트폰 과의존",  text:"인터넷이나 스마트폰을 지나치게 이용하여 문제가 돼요",                            side:1},
  {name:"목소리 인식",             text:"사용자의 목소리를 인식하여 기능을 수행하는 인공지능 기기를 활용해요",            side:0},
  {name:"일자리 감소",             text:"사람이 하던 일을 인공지능이 대신 하면서 일자리가 줄어들기도 해요",               side:1},
  {name:"안전 운전",               text:"인공지능이 주변 상황을 실시간으로 파악해 운전자의 안전한 운전을 도와줘요",       side:0}
];
const DS_N = 8;                                            // 카드 여덟 장
const DS_TRAY = ["누려요", "보완해요"];                    // 교과서 25쪽 「장점은 누리고, 단점은 보완하려는 태도」
const DS_OUT = -1;                                         // 아직 담지 않은 자리
const DS_RULE = [
  {mark:"가", text:"자신의 개인 정보를 인터넷에서 함부로 공유하지 않아요",                         why:"다른 사람이 나의 개인 정보를 함부로 사용하는 일을 막는 데 도움이 된다고 생각할 수 있어요."},
  {mark:"나", text:"인터넷에 있는 정보를 비판 없이 무조건 믿지 않아요",                            why:"그럴듯한 거짓 정보에 속지 않는 데 도움이 된다고 생각할 수 있어요."},
  {mark:"다", text:"선생님의 가르침이나 정해진 규칙에 따라 인터넷이나 태블릿 컴퓨터를 사용해요",   why:"인터넷이나 태블릿 컴퓨터를 지나치게 이용하지 않는 데 도움이 된다고 생각할 수 있어요."}
];
const DS_SAY_ALL = "카드를 모두 알맞은 칸에 담았어요. 이제 판을 읽어 봐요.";
const DS_SAY_ORDER_R = "먼저 카드를 모두 알맞은 칸에 담아 봐요.";
const DS_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const DS_SAY_ORDER_T = "먼저 판을 읽어 봐요.";
const DS_SAY_RULEDONE = "이미 지킬 점을 골랐어요. 친구가 고른 지킬 점과 견주어 봐요.";
const DS_SAY_ORDER_FIN = "먼저 지킬 점을 골라 봐요.";
const DS_READQ = [
  "편리해진 모습만 있으니, 지능정보화로 생긴 문제는 걱정하지 않아도 돼요",
  "여러 가지 문제가 생겼으니, 인터넷이나 인공지능 기기는 아예 쓰지 않는 것이 좋아요",
  "두 칸 모두 카드가 담겼어요. 생활이 편리해졌지만 여러 가지 문제도 생겨서, 장점은 누리고 단점은 보완하려는 태도가 필요해요"
];
const DS_READ_OK = 2;
const DS_READ_BAD = "두 칸에 담긴 카드를 하나씩 다시 읽어 봐요. 어느 칸이 비어 있는지 살펴봐요.";
const DS_FINQ = [
  "인공지능을 활용한 다양한 기술이 사회 전반에 폭넓은 영향을 미치는 현상을 지능정보화라고 하고, 지능정보화의 장점은 누리고 단점은 보완하려는 태도가 필요해요",
  "지능정보화의 영향으로 많은 양의 정보를 빠르고 정확하게 처리하는 것이 어려워졌어요",
  "지능정보화로 나타난 문제는 저절로 사라지므로 우리 사회는 해결하려고 노력하지 않아요"
];
const DS_FIN_OK = 0;
const DS_FIN_BAD = "교과서 25쪽 「꼭 기억해요」를 다시 떠올려 봐요.";

function dsCardOf(k){ return DS_CARD[k]; }                                   // DS_CARD 를 읽는 자리는 여기 단 하나
function dsRuleOf(k){ return DS_RULE[k]; }                                   // DS_RULE 을 읽는 자리는 여기 단 하나
function dsTrayOf(t){ return DS_TRAY[t]; }                                   // DS_TRAY 를 읽는 자리는 여기 단 하나
function dsKeys(){ return [...Array(DS_N).keys()]; }
function dsIn(st,t){ return st.dsAt.filter(a => a === t).length; }            // ★ 칸마다 담긴 카드 — 저장 0
function dsRight(st,k){ return st.dsAt[k] === dsCardOf(k).side; }             // ★ 알맞은 칸인지 — 한 줄로
function dsRightN(st){ return dsKeys().filter(k => dsRight(st,k)).length; }
function dsAll(st){ return dsRightN(st) === DS_N; }
function dsLine(st,k){
  const t = st.dsAt[k], nm = dsCardOf(k).name;
  if(t === DS_OUT) return `「${nm}」 카드를 다시 꺼냈어요. 아직 담지 않은 카드 ${dsIn(st,DS_OUT)}장.`;
  const tail = dsAll(st) ? ` — 카드를 모두 알맞은 칸에 담았어요.` : dsIn(st,DS_OUT) === 0 ? ` — 모두 담았어요. 칸을 다시 살펴봐요.` : ``;
  return `「${nm}」 카드를 「${dsTrayOf(t)}」 칸에 담았어요. 누려요 ${dsIn(st,0)}장 · 보완해요 ${dsIn(st,1)}장${tail}`;
}
function dsStage(st){
  if(!dsAll(st)) return "sort";
  if(st.dsRead == null) return "read";
  if(st.dsRule == null) return "rule";
  if(st.dsFin == null) return "fin";
  return "end";
}

/* 판 — 아직 담지 않은 카드 · 두 칸 */
function dsCardHTML(st,k){
  const t = st.dsAt[k], c = dsCardOf(k);
  const to = [DS_OUT,0,1].filter(x => x !== t);
  const btn = to.map(x => `<button class="ds-btn" data-k="${k}" data-to="${x}" onclick="dsPut(${k},${x})">${x === DS_OUT ? '꺼내기' : dsTrayOf(x)+' 칸으로'}</button>`).join('');
  return `<div class="ds-card" data-k="${k}" data-at="${t}"><b>${c.name}</b> — ${c.text}<div class="ds-btns">${btn}</div></div>`;
}
function dsBoard(st){
  const pool = dsKeys().filter(k => st.dsAt[k] === DS_OUT).map(k => dsCardHTML(st,k)).join('');
  const tray = (t) => `<div class="ds-tray" data-t="${t}" data-n="${dsIn(st,t)}"><div class="ds-tname">${dsTrayOf(t)} · ${dsIn(st,t)}장</div>${dsKeys().filter(k => st.dsAt[k] === t).map(k => dsCardHTML(st,k)).join('')}</div>`;
  return `<div class="ds-board" data-ok="${dsRightN(st)}" data-out="${dsIn(st,DS_OUT)}">
    <div class="ds-title">지능정보화로 나타난 모습 카드</div>
    <div class="ds-pool">${pool || '<div class="ds-empty">카드를 모두 칸에 담았어요.</div>'}</div>
    <div class="ds-trays">${tray(0)}${tray(1)}</div></div>`;
}
function dsRules(st){
  return `<div class="ds-rules">${[0,1,2].map(k=>`<button class="ds-rule" data-k="${k}" data-on="${st.dsRule===k?1:0}" onclick="dsPickRule(${k})"><b>${dsRuleOf(k).mark}</b> ${dsRuleOf(k).text}</button>`).join('')}</div>`;
}
function dsKey(st){
  return `<div class="ds-key"><b>누려요</b> 칸 — 지능정보화로 편리해진 점<br>
    <b>보완해요</b> 칸 — 지능정보화로 생겨난 문제<br>
    카드는 다시 <b>옮기거나 꺼낼</b> 수 있어요.</div>`;
}
function dsPanel(st){
  const stage = dsStage(st);
  let ask = '';
  if(stage === "sort"){
    ask = `<div class="ds-ask" data-step="sort"><b>카드를 읽고, 편리해진 점은 「누려요」 칸에, 생겨난 문제는 「보완해요」 칸에 담아 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="ds-ask" data-step="read"><b>두 칸에 담긴 카드를 보고, 무엇을 알 수 있는지 읽어 봐요.</b>
      <div class="ds-opts">${DS_READQ.map((t,i)=>`<button class="ds-opt" onclick="dsRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "rule"){
    ask = `<div class="ds-ask" data-step="rule"><b>학교에서 인터넷이나 태블릿 컴퓨터를 사용할 때 꼭 지키고 싶은 점을 골라 봐요.</b>${dsRules(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="ds-ask" data-step="fin"><b>오늘 공부한 내용은 어떻게 정리할 수 있을까요?</b>
      <div class="ds-opts">${DS_FINQ.map((t,i)=>`<button class="ds-opt" onclick="dsFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="ds-ask" data-fin="1" style="border-color:#86EFAC;background:#F0FDF4">
      <b style="color:#166534">두 칸 모두 비지 않았어요. 생활이 편리해졌지만 여러 가지 문제도 생겨서, 장점은 누리고 단점은 보완하려는 태도가 필요해요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ 학교에서 지킬 점을 친구들과 <b>함께 정하는 일</b>은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.dsTell ? `<div class="ds-tell">${st.dsTell}</div>` : '';
  const warn = st.dsMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.dsMsg}</div>` : '';
  return `<div class="ds-wrap">
    <div class="ds-head">알맞은 칸에 담은 카드 <b>${dsRightN(st)}</b> / ${DS_N} · 아직 담지 않은 카드 ${dsIn(st,DS_OUT)}장</div>
    ${dsBoard(st)}<div class="ds-side">${dsKey(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 카드 여덟 장은 <b>교과서 22~24쪽에 나온 모습과 문제를 옮긴 것</b>이고, 지능정보화의 모습이 <b>이것뿐인 것은 아니에요</b>. 지킬 점 세 가지는 어느 것이 더 낫다고 <b>가리기 어려워서</b> 판은 정답을 정하지 않아요.</div>

  <div class="note">별별 직업 — <b>인공지능 전문가</b>는 컴퓨터 시스템이나 로봇 등이 사람처럼 생각하고 일할 수 있는 기술을 개발해요.</div>
  <div class="note">다음 시간에는 <b style="color:#4F46E5">다른 나라와 서로 오가는 일이 많아지면서</b> 달라진 생활 모습을 살펴봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"지능정보화의 뜻을 말할 수 있어요",st)}
    ${selfCheck(1,"지능정보화로 달라진 생활 모습을 설명할 수 있어요",st)}
    ${selfCheck(2,"지능정보화로 나타난 문제와 해결하려는 노력을 말할 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">지능정보화로 달라진 생활 모습을 살펴봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">학교에서 인터넷이나 태블릿 컴퓨터를 쓸 때 지킬 점을 <b style="color:#4F46E5">친구들과 함께 정하는 일</b>은 교실 몫이에요. 서로의 생각을 들어 봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u1_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  dsAt:Array(DS_N).fill(DS_OUT), dsRead:null, dsRule:null, dsFin:null, dsMsg:"", dsTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function dsDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 카드 담기 — 칸에 담거나(0 누려요 · 1 보완해요) 다시 꺼낸다(-1) */
function dsPut(k,t){
  if(state.dsFin!=null) return;                                                         // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(k) || k<0 || k>=DS_N) return;                                     // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(!Number.isInteger(t) || t<DS_OUT || t>=DS_TRAY.length) return;                      // 가드②: 무효 칸
  if(dsAll(state)){ state.dsMsg = DS_SAY_ALL; playThud(); dsDraw(); return; }            // 가드③: 모두 알맞게 담은 뒤 — 판 불변
  state.dsAt[k] = t;                                                                     // ⭐ 카드 자리를 바꾸는 자리 단 하나
  state.dsMsg = ""; state.dsTell = dsLine(state,k); playBlip(); dsDraw();
}
/* 판 읽기 */
function dsRead(i){
  if(state.dsFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DS_READQ.length) return;                          // 가드②
  if(!dsAll(state)){ state.dsMsg = DS_SAY_ORDER_R; playThud(); dsDraw(); return; }       // 가드④: 다 담기 전 — 판 불변
  if(state.dsRead!=null){ state.dsMsg = DS_SAY_READDONE; dsDraw(); return; }             // 가드⑤: 이미 정한 자리 — 판 불변
  if(i!==DS_READ_OK){ state.dsMsg = DS_READ_BAD; playThud(); dsDraw(); return; }         // 가드⑥: 어긋난 답 — 판 불변
  state.dsRead = i; state.dsMsg = ""; state.dsTell = ""; playBlip(); dsDraw();
}
/* 지킬 점 고르기 — 정답 없음 */
function dsPickRule(k){
  if(state.dsFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(k) || k<0 || k>=DS_RULE.length) return;                           // 가드②
  if(state.dsRead==null){ state.dsMsg = DS_SAY_ORDER_T; playThud(); dsDraw(); return; }  // 가드⑦: 판을 읽기 전 — 판 불변
  if(state.dsRule!=null){ state.dsMsg = DS_SAY_RULEDONE; dsDraw(); return; }             // 가드⑧: 이미 고른 지킬 점 — 판 불변
  state.dsRule = k; state.dsMsg = ""; state.dsTell = `${dsRuleOf(k).mark}를 골랐어요. ${dsRuleOf(k).why}`; playBlip(); dsDraw();
}
/* 마무리 */
function dsFin(i){
  if(state.dsFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=DS_FINQ.length) return;                           // 가드②
  if(state.dsRule==null){ state.dsMsg = DS_SAY_ORDER_FIN; playThud(); dsDraw(); return; } // 가드⑨: 지킬 점을 고르기 전 — 판 불변
  if(i!==DS_FIN_OK){ state.dsMsg = DS_FIN_BAD; playThud(); dsDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.dsFin = i; state.dsMsg = ""; playChime(); dsDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

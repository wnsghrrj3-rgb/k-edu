<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제② 다양한 문화에 대한 이해와 존중 · l11 (주제 마무리)
  「[생각을 펼쳐요] 다양한 문화에 대한 이해와 존중 정리」
  교과서 p.53~55 · 지도서 16차시(p.110~111) · [4사03-02]
  수업 기법 = 자료 제작하기 · 돌아가며 말하기
=========================================================================

  ■ 직접조작 = 버스를 찾아요 판 (사회 3-2 열한째 판)
  ⭐ 씨앗은 교과서 55쪽 「재미있게 확인해요」 — 설명 여섯의 ○·✕를 정하고, 알맞은 설명의 힌트로 반려동물 축제에 가는 버스를 찾는다.
  ⭐ 설명 여섯마다 ○ ✕ 단추 · 버스 아홉(번호 · 색 · 가는 곳). 판은 어느 설명이 알맞은지 미리 알려 주지 않는다.
  ⭐ ○로 정한 설명의 힌트만 버스를 지운다(✕로 정하거나 아직 정하지 않은 설명의 힌트는 버스를 지우지 않는다).
  ⭐ 남은 버스는 저장 0 — 표시에서 센다(bsLeft). 「ㄴ 받침」도 저장 0 — 가는 곳 이름의 글자에서 센다(bsNieun).
  ⭐ 끝 기준도 상수가 아니라 bsDone(bsRightN === BS_N) · 표시를 바꾸는 자리 bsSet 단 하나 · BS_SAY 를 읽는 자리 bsSayOf · BS_BUS 는 bsBusOf · BS_PICK 은 bsPickOf 단 하나씩 · 난수 0.

  ■ 이 차시의 뼈대
   알맞은 설명의 힌트만 따라야 청주행 버스 하나만 남는다 — 하나라도 잘못 정하면 남는 버스가 없거나, 여럿이거나, 엉뚱한 버스 하나가 남는다(청주행 하나만 남는 표시는 알맞은 한 가지뿐).
   → 문화의 뜻과 우리 사회의 다양한 문화, 그 영향과 문제를 바르게 알아야 헷갈리지 않는다(주제② 정리).

  ■ 5단계
   ① ○·✕ 정하기 → ② 판 읽기 3택(정답 자리 2)
   ③ 축제 초대장 주제 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다 · 교과서 54쪽)
   ④ 마무리 3택(정답 자리 0) → 완료
      — 시 짓고 그림 그리기 · 축제 초대장 만들기 · 돌아가며 말하기는 교실 몫

  ■ 가드 11종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호·무효 표시(안내조차 0)
   ③ 다 맞춘 뒤 표시 바꾸기 — 판 불변          ④ 같은 표시 다시 — 판 불변
   ⑤ 다 맞추기 전 판 읽기 — 판 불변            ⑥ 이미 읽은 자리 — 판 불변
   ⑦ 판 읽기 어긋난 답 — 판 불변               ⑧ 판을 읽기 전 고르기 — 판 불변
   ⑨ 이미 고른 자리 — 판 불변                  ⑩ 고르기 전 마무리 — 판 불변
   ⑪ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 설명 여섯과 힌트는 교과서 55쪽 「재미있게 확인해요」를 옮긴 것 · 버스 아홉의 번호와 색은 판이 정한 것(캡션 상시).
   ㉡ 축제 주제 셋은 어느 것이 더 낫다고 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 시 짓고 그림 그리기, 축제 초대장 만들기, 돌아가며 말하기는 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 이름은 차시 예고 한 자리뿐
   · 새 사실 0 — 교과서 53~55쪽 · 지도서 110~111쪽과 앞 차시에 있는 사실만 · 누리집 주소 0 · 교과서 예시 시 원문 0
   · 「틀렸」 0 · 사람 형상 0 · 지어낸 학생 이름 0 · 네 자리 연도 0 · 지역 이름은 판의 버스 행선지(교과서 55쪽)에서만
-->

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#4F46E5; --green-d:#4338CA; --cyan:#7C3AED;
  --bg:#EEF2FF; --bub:#E0E7FF; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#E0E7FF;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#E0E7FF;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(79,70,229,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 조작 판 — 버스를 찾아요 판 */
.bs-wrap{max-width:780px;width:100%;margin:0 auto}
.bs-head{background:#E0E7FF;color:#3730A3;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.bs-board{padding:9px;border-radius:14px;background:#EEF2FF;border:2px solid #C7D2FE;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px}
.bs-title{grid-column:1/-1;text-align:center;font-weight:800;color:#3730A3;font-size:clamp(12px,2vw,14px);word-break:keep-all}
.bs-says{display:grid;grid-template-columns:1fr;gap:6px;align-content:start}
.bs-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;background:#fff;border:2px solid #C7D2FE;border-radius:10px;padding:6px 8px}
.bs-txt{font-size:clamp(11px,1.8vw,13px);line-height:1.45;color:#0F172A;word-break:keep-all}
.bs-txt i{display:block;font-style:normal;font-size:clamp(10px,1.6vw,12px);color:#6366F1;margin-top:2px}
.bs-mk{display:flex;gap:4px}
.bs-o{width:34px;height:34px;border-radius:9px;border:2px solid #C7D2FE;background:#fff;font-family:inherit;font-size:16px;font-weight:800;color:#475569;cursor:pointer}
.bs-o[data-on="1"]{border-color:#4F46E5;background:#4F46E5;color:#fff}
.bs-buses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start}
.bs-bus{border-radius:10px;border:2px solid #334155;padding:6px 4px;text-align:center;font-size:clamp(10px,1.7vw,12px);font-weight:800;color:#0F172A;line-height:1.35;transition:opacity .3s}
.bs-bus b{display:block;font-size:clamp(14px,2.4vw,18px)}
.bs-bus[data-out="1"]{opacity:.22;border-style:dashed}
.bs-help{border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;font-size:clamp(11px,1.9vw,14px);line-height:1.6}
.bs-help b{color:#4338CA}
.bs-side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bs-tell{border-radius:11px;padding:8px 12px;font-size:clamp(12px,2vw,15px);line-height:1.6;background:#F5F3FF;border-left:4px solid var(--cyan)}
.bs-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.bs-pk{border:2px solid #C7D2FE;border-radius:10px;background:#fff;padding:8px 7px;font-family:inherit;
  font-size:clamp(11px,1.8vw,13px);font-weight:700;color:#0F172A;text-align:left;cursor:pointer;line-height:1.4;word-break:keep-all}
.bs-pk b{color:#4338CA}
.bs-ask{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#FAFAFF;margin-top:9px;
  font-size:clamp(12px,2vw,15px);line-height:1.6;word-break:keep-all}
.bs-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.bs-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:9px 11px;font-family:inherit;
  font-size:clamp(12px,2vw,15px);font-weight:700;color:#0F172A;text-align:left;line-height:1.45;word-break:keep-all;cursor:pointer}
.bs-opt:hover{border-color:var(--green);background:var(--bub)}
@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
  .bs-board{grid-template-columns:1fr}

  .bs-side{grid-template-columns:1fr}
}
</style>

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {

/* ===== 직접 조작: 버스를 찾아요 판 =====
   설명 여섯마다 ○ 또는 ✕를 정한다. ○로 정한 설명의 힌트만 버스를 지운다.
   ⭐ 표시를 바꾸는 자리 bsSet 단 하나 — 판을 바꾸는 곳은 여기뿐.
   ⭐ 남은 버스는 저장 0 — 표시에서 센다(bsLeft) · 「ㄴ 받침」도 저장 0 — 글자에서 센다(bsNieun).
   ⭐ 여섯 설명을 모두 알맞게 정하면 — 버스 하나만 남는다.
   ================================================================= */
const BS_SAY = [                                            // 교과서 55쪽 「재미있게 확인해요」 — ok 는 설명이 알맞은지, off 는 힌트가 지우는 버스
  {text:"배가 고파서 음식을 먹는 행동도 문화예요",                                             ok:false, hint:"짝수 번호 버스는 아니에요",               off:"even"},
  {text:"문화는 사람들이 함께 생활하면서 만들어지고 오랫동안 전해져 내려오기도 해요",          ok:true,  hint:"홀수 번호 버스는 아니에요",               off:"odd"},
  {text:"세계화의 영향으로 우리나라에서 사는 외국인 이주민이 늘어났어요",                      ok:true,  hint:"노란 버스는 아니에요",                    off:"노랑"},
  {text:"결혼에 관한 생각 변화, 혼자 사는 노인 증가 등의 영향으로 1인 가구가 줄어들고 있어요", ok:false, hint:"파란 버스는 아니에요",                    off:"파랑"},
  {text:"반려동물과 함께 사는 사람이 많아지면서 반려동물과 관련 있는 문화가 널리 퍼지고 있어요", ok:true, hint:"빨간 버스는 아니에요",                    off:"빨강"},
  {text:"다양한 문화가 확산되면서 낯선 문화에 대한 편견과 차별이 생기기도 해요",               ok:true,  hint:"가려는 곳의 이름에는 ㄴ 받침이 없어요",   off:"nieun"}
];
const BS_BUS = [                                            // 가는 곳은 교과서 55쪽 버스 · 번호와 색은 판이 정함
  {no:1, color:"빨강", city:"부산"}, {no:2, color:"빨강", city:"대구"}, {no:3, color:"초록", city:"서울"},
  {no:4, color:"노랑", city:"광주"}, {no:5, color:"파랑", city:"인천"}, {no:6, color:"파랑", city:"청주"},
  {no:7, color:"노랑", city:"수원"}, {no:8, color:"초록", city:"대전"}, {no:9, color:"초록", city:"춘천"}
];
const BS_PAINT = {"빨강":"#FCA5A5", "노랑":"#FDE68A", "파랑":"#93C5FD", "초록":"#86EFAC"};
const BS_N = 6;                                             // 설명 여섯
const BS_PICK = [
  {mark:"가", text:"외국인 이주민 축제", why:"세계 여러 나라의 문화를 이해하고 체험하는 프로그램을 계획할 수 있어요."},
  {mark:"나", text:"1인 가구 축제",       why:"1인 가구 음식 만들기, 인기 생활용품 체험하기 같은 프로그램을 계획할 수 있어요."},
  {mark:"다", text:"반려동물 축제",       why:"나의 반려동물 소개하기, 반려동물 예절 배우기 같은 프로그램을 계획할 수 있어요."}
];
const BS_SAY_ALL = "여섯 설명을 모두 알맞게 정해서 버스 하나만 남았어요. 이제 판을 읽어 봐요.";
const BS_SAY_SAME = "이미 그렇게 정한 설명이에요. 판은 그대로예요.";
const BS_SAY_ORDER_R = "먼저 여섯 설명을 모두 알맞게 정해 봐요.";
const BS_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const BS_SAY_ORDER_P = "먼저 판을 읽어 봐요.";
const BS_SAY_PICKDONE = "이미 골랐어요. 친구가 고른 것과 견주어 봐요.";
const BS_SAY_ORDER_FIN = "먼저 축제 초대장의 주제를 골라 봐요.";
const BS_READQ = [
  "여섯 설명의 힌트를 모두 따르면 버스 하나만 남아요. 설명이 알맞은지는 따지지 않아도 돼요",
  "힌트를 하나도 따르지 않아도 버스 하나만 남아요. 설명을 읽지 않아도 돼요",
  "알맞은 설명의 힌트만 따라야 가려는 곳에 가는 버스를 찾을 수 있어요. 문화와 우리 사회의 다양한 문화를 바르게 알아야 헷갈리지 않아요"
];
const BS_READ_OK = 2;
const BS_READ_BAD = "○로 정한 설명과 지워진 버스를 다시 읽어 봐요.";
const BS_FINQ = [
  "문화는 한 사회의 사람들이 지닌 공통의 생활 양식이고, 다양한 문화를 대할 때는 서로 다름을 인정하고 존중하는 태도가 필요해요",
  "배가 고파서 음식을 먹는 것처럼 사람이라면 누구나 하는 행동이 모두 문화예요",
  "다양한 문화가 확산되면 좋은 점만 있고 문제는 생기지 않아요"
];
const BS_FIN_OK = 0;
const BS_FIN_BAD = "판에서 ✕로 정한 설명과 주제에서 공부한 내용을 다시 떠올려 봐요.";

function bsSayOf(i){ return BS_SAY[i]; }                                      // BS_SAY 를 읽는 자리는 여기 단 하나
function bsBusOf(b){ return BS_BUS[b]; }                                      // BS_BUS 를 읽는 자리는 여기 단 하나
function bsPickOf(p){ return BS_PICK[p]; }                                    // BS_PICK 을 읽는 자리는 여기 단 하나
function bsSays(){ return [...Array(BS_N).keys()]; }
function bsBuses(){ return [...Array(BS_BUS.length).keys()]; }
function bsNieun(city){ return [...city].some(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 && k % 28 === 4; }); }
function bsOff(h,bus){                                                        // 힌트 하나가 이 버스를 지우는지
  if(h.off === "even") return bus.no % 2 === 0;
  if(h.off === "odd") return bus.no % 2 === 1;
  if(h.off === "nieun") return bsNieun(bus.city);
  return bus.color === h.off;
}
function bsGone(st,b){ return bsSays().some(i => st.bsMark[i] === true && bsOff(bsSayOf(i), bsBusOf(b))); }   // ★ ○로 정한 설명의 힌트만 지운다
function bsLeft(st){ return bsBuses().filter(b => !bsGone(st,b)); }
function bsMarkedN(st){ return st.bsMark.filter(v => v !== null).length; }
function bsRight(st,i){ return st.bsMark[i] === bsSayOf(i).ok; }             // ★ 알맞게 정했는지 — 한 줄로
function bsRightN(st){ return bsSays().filter(i => bsRight(st,i)).length; }
function bsDone(st){ return bsRightN(st) === BS_N; }
function bsMk(v){ return v ? "○" : "✕"; }
function bsLine(st,i){
  const left = bsLeft(st), n = left.length;
  const act = `${i+1}번 설명을 ${bsMk(st.bsMark[i])}로 정했어요. 남은 버스 ${n}대.`;
  if(bsDone(st)) return `${act} 여섯 설명을 모두 알맞게 정했어요 — ${bsBusOf(left[0]).city}행 버스 하나만 남았어요. 판을 읽어 봐요.`;
  if(bsMarkedN(st) === BS_N) return `${act} 여섯 설명을 모두 정했지만 아직 알맞게 정하지 않은 설명이 있어요. ○와 ✕를 다시 살펴봐요.`;
  return act;
}
function bsStage(st){
  if(!bsDone(st)) return "mark";
  if(st.bsRead == null) return "read";
  if(st.bsPick == null) return "pick";
  if(st.bsFin == null) return "fin";
  return "end";
}

/* 판 — 설명 여섯 · 버스 아홉 */
function bsRows(st){
  return `<div class="bs-says">${bsSays().map(i => `<div class="bs-row" data-i="${i}" data-m="${st.bsMark[i] === null ? '' : bsMk(st.bsMark[i])}">
    <div class="bs-txt">${i+1}. ${bsSayOf(i).text}<i>힌트 — ${bsSayOf(i).hint}</i></div>
    <div class="bs-mk"><button class="bs-o" data-v="1" data-on="${st.bsMark[i] === true ? 1 : 0}" onclick="bsSet(${i},true)">○</button><button class="bs-o" data-v="0" data-on="${st.bsMark[i] === false ? 1 : 0}" onclick="bsSet(${i},false)">✕</button></div></div>`).join('')}</div>`;
}
function bsBusBox(st){
  return `<div class="bs-buses">${bsBuses().map(b => { const B = bsBusOf(b);
    return `<div class="bs-bus" data-b="${b}" data-out="${bsGone(st,b) ? 1 : 0}" style="background:${BS_PAINT[B.color]}"><b>${B.no}</b>${B.color} · ${B.city}행</div>`; }).join('')}</div>`;
}
function bsBoard(st){
  return `<div class="bs-board" data-left="${bsLeft(st).length}" data-marked="${bsMarkedN(st)}" data-done="${bsDone(st) ? 1 : 0}">
    <div class="bs-title">설명이 알맞으면 ○, 알맞지 않으면 ✕ — 반려동물 축제에 가는 버스를 찾아요</div>
    ${bsRows(st)}${bsBusBox(st)}</div>`;
}
function bsPicks(st){
  return `<div class="bs-picks">${[0,1,2].map(p=>`<button class="bs-pk" data-p="${p}" onclick="bsChoose(${p})"><b>${bsPickOf(p).mark}</b> ${bsPickOf(p).text}</button>`).join('')}</div>`;
}
function bsHelp(st){
  return `<div class="bs-help">설명마다 <b>○</b> 또는 <b>✕</b>를 눌러요. 다시 누르면 바꿀 수 있어요.<br>
    <b>○로 정한 설명의 힌트</b>만 버스를 지워요.<br>
    버스가 <b>하나만</b> 남으면 판을 읽어 봐요.</div>`;
}
function bsPanel(st){
  const stage = bsStage(st);
  let ask = '';
  if(stage === "mark"){
    ask = `<div class="bs-ask" data-step="mark"><b>반려동물 축제에 가야 하는데 초대장을 두고 왔어요. 알맞은 설명의 힌트를 따라 타야 할 버스를 찾아봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="bs-ask" data-step="read"><b>청주행 버스 하나만 남은 판을 보니 무엇을 알 수 있을까요?</b>
      <div class="bs-opts">${BS_READQ.map((t,i)=>`<button class="bs-opt" onclick="bsRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "pick"){
    ask = `<div class="bs-ask" data-step="pick"><b>우리 사회의 다양한 문화를 알리는 축제 초대장을 만든다면 어떤 축제로 할지 하나 골라 봐요.</b>${bsPicks(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="bs-ask" data-step="fin"><b>다양한 문화에 대한 이해와 존중에서 공부한 내용으로 알맞은 것은 무엇일까요?</b>
      <div class="bs-opts">${BS_FINQ.map((t,i)=>`<button class="bs-opt" onclick="bsFin(${i})">${t}</button>`).join('')}</div></div>`;
  } else {
    ask = `<div class="bs-ask" data-fin="1" style="border-color:#A5B4FC;background:#EEF2FF">
      <b style="color:#3730A3">알맞은 설명의 힌트만 따라서 버스 하나를 찾았어요. 문화의 뜻과 우리 사회의 다양한 문화, 그 영향과 문제를 바르게 알면 헷갈리지 않아요.</b>
      <div class="note" style="text-align:left;margin-top:5px">※ <b>시를 짓고 그림을 그려 꾸미는 일</b>, <b>색칠 도구로 축제 초대장을 만드는 일</b>, <b>친구들과 돌아가며 말하는 일</b>은 <b>교실 몫</b>이에요. 판은 대신 해 주지 않아요.</div></div>`;
  }
  const tell = st.bsTell ? `<div class="bs-tell">${st.bsTell}</div>` : '';
  const warn = st.bsMsg ? `<div class="fb" style="color:#DC2626;font-weight:700">${st.bsMsg}</div>` : '';
  return `<div class="bs-wrap">
    <div class="bs-head">정한 설명 <b>${bsMarkedN(st)}</b> / ${BS_N} · 남은 버스 <b>${bsLeft(st).length}</b>대</div>
    ${bsBoard(st)}<div class="bs-side">${bsHelp(st)}${tell}</div>${ask}${warn}
    <div class="note" style="margin-top:8px">※ 설명 여섯과 힌트는 <b>교과서 55쪽 「재미있게 확인해요」</b>를 옮긴 것이고, 버스 아홉의 번호와 색은 판이 정한 것이에요. 축제 주제 셋은 어느 것이 더 낫다고 <b>가리기 어려워서</b> 판은 정답을 정하지 않아요.</div>
  </div>`;
}

    ${selfCheck(0,"문화의 뜻과 특징을 알고, 다양한 문화의 확산이 가져온 긍정적 영향과 문제를 설명할 수 있어요",st)}
    ${selfCheck(1,"다양한 문화의 확산으로 나타나는 편견과 차별의 문제를 탐구하여 해결 방안을 찾을 수 있어요",st)}
    ${selfCheck(2,"나와 다른 사람이나 집단의 문화를 존중하는 태도를 기르게 됐어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">다양한 문화에 대한 이해와 존중을 정리했어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">색칠 도구로 <b style="color:#4F46E5">시와 그림</b>을 꾸미거나 <b style="color:#4F46E5">축제 초대장</b>을 만드는 일은 교실 몫이에요. 친구들과 돌아가며 이야기해 봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u1_l11";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  bsMark:[null,null,null,null,null,null], bsRead:null, bsPick:null, bsFin:null, bsMsg:"", bsTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function bsDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* ○ · ✕ 정하기 */
function bsSet(i,v){
  if(state.bsFin!=null) return;                                                          // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(i) || i<0 || i>=BS_N || typeof v!=="boolean") return;            // 가드②: 무효 번호·표시 — 안내조차 띄우지 않음
  if(bsDone(state)){ state.bsMsg = BS_SAY_ALL; playThud(); bsDraw(); return; }           // 가드③: 다 맞춘 뒤 — 판 불변
  if(state.bsMark[i]===v){ state.bsMsg = BS_SAY_SAME; playThud(); bsDraw(); return; }    // 가드④: 같은 표시 다시 — 판 불변
  state.bsMark[i] = v;                                                                   // ⭐ 표시를 바꾸는 자리 단 하나
  state.bsMsg = ""; state.bsTell = bsLine(state,i); playBlip(); bsDraw();
}
/* 판 읽기 */
function bsRead(i){
  if(state.bsFin!=null) return;                                                          // 가드①
  if(!Number.isInteger(i) || i<0 || i>=BS_READQ.length) return;                          // 가드②
  if(!bsDone(state)){ state.bsMsg = BS_SAY_ORDER_R; playThud(); bsDraw(); return; }      // 가드⑤: 다 맞추기 전 — 판 불변
  if(state.bsRead!=null){ state.bsMsg = BS_SAY_READDONE; bsDraw(); return; }             // 가드⑥: 이미 정한 자리 — 판 불변
  if(i!==BS_READ_OK){ state.bsMsg = BS_READ_BAD; playThud(); bsDraw(); return; }         // 가드⑦: 어긋난 답 — 판 불변
  const n = bsSays().filter(k => state.bsMark[k] === true).length;
  state.bsRead = i; state.bsMsg = ""; state.bsTell = `○로 정한 설명 ${n}개의 힌트만 따랐더니 버스 ${bsLeft(state).length}대가 남았어요. 알맞은 설명을 가려낼 수 있어야 가려는 곳을 찾을 수 있어요.`; playBlip(); bsDraw();
}
/* 축제 초대장 주제 고르기 — 정답 없음 */
function bsChoose(p){
  if(state.bsFin!=null) return;                                                          // 가드①
  if(!Number.isInteger(p) || p<0 || p>=BS_PICK.length) return;                           // 가드②
  if(state.bsRead==null){ state.bsMsg = BS_SAY_ORDER_P; playThud(); bsDraw(); return; }  // 가드⑧: 판을 읽기 전 — 판 불변
  if(state.bsPick!=null){ state.bsMsg = BS_SAY_PICKDONE; bsDraw(); return; }             // 가드⑨: 이미 고른 자리 — 판 불변
  state.bsPick = p; state.bsMsg = ""; state.bsTell = `${bsPickOf(p).mark}를 골랐어요. ${bsPickOf(p).why}`; playBlip(); bsDraw();
}
/* 마무리 */
function bsFin(i){
  if(state.bsFin!=null) return;                                                          // 가드①
  if(!Number.isInteger(i) || i<0 || i>=BS_FINQ.length) return;                           // 가드②
  if(state.bsPick==null){ state.bsMsg = BS_SAY_ORDER_FIN; playThud(); bsDraw(); return; } // 가드⑩: 고르기 전 — 판 불변
  if(i!==BS_FIN_OK){ state.bsMsg = BS_FIN_BAD; playThud(); bsDraw(); return; }           // 가드⑪: 어긋난 답 — 판 불변
  state.bsFin = i; state.bsMsg = ""; playChime(); bsDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u1_l12_딩고를외쳐요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

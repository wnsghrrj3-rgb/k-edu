<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제① 사회 변화로 달라진 생활 모습 · l03
  「고령화로 달라진 생활 모습을 살펴볼까요」
  교과서 p.18~20 · 지도서 4차시(p.40~46) · [4사03-01]
  수업 기법 = 자료(정보 그림) 분석하기 · 아이디어 생성 및 공유하기
=========================================================================

  ■ 직접조작 = 백 명 마을을 칠해요 판 (사회 3-2 셋째 판)
  ⭐ 씨앗은 교과서 18쪽 정보 그림(우리나라가 100명이 사는 마을이라면)과 지도 꿀 Tip 한 줄 —
     「고령화란 전체 사람 수에서 노인의 수가 차지하는 비율이 높아지는 현상」.
  ⭐ 1980년 · 2020년 · 2050년(예상) 세 마을에 노인을 칠한다. 칸 하나 = 한 사람 · 줄 단추 = 열 사람.
  ⭐ 결과표 0 — 그 해 마을이 그림과 같은지는 칠한 칸 수와 그림의 수를 견주어 한 줄로 나온다(hvMatch).
  ⭐ 노인이 아닌 사람 수도 저장하지 않는다 — HV_ALL - 칠한 칸(hvRest).
  ⭐ 끝 기준도 상수가 아니라 hvMatchN === HV_N.
  ⭐ HV_OLD 를 읽는 자리는 hvOldOf 단 하나 · HV_YEAR 는 hvYearOf 단 하나 · 난수 0.

  ■ 이 차시의 뼈대
   세 마을은 모두 100명이다. 그런데 칠한 칸이 4 → 16 → 40 으로 늘어난다.
   전체가 같으니 노인 수가 늘면 곧 전체에서 노인이 차지하는 비율이 높아진 것이다.

  ■ 5단계
   ① 세 마을 칠하기 → ② 판 읽기 3택(정답 자리 1)
   ③ 노인을 위한 물건의 기능 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다) → ④ 마무리 3택(정답 자리 2) → 완료
      — 친구와 생각을 나누는 일은 교실 몫

  ■ 가드 10종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 세 마을을 다 칠한 뒤 칸·줄 — 판 불변     ④ 다 칠하기 전 판 읽기 — 판 불변
   ⑤ 이미 읽은 자리 — 판 불변                 ⑥ 판 읽기 어긋난 답 — 판 불변
   ⑦ 판을 읽기 전 물건 고르기 — 판 불변       ⑧ 이미 고른 물건 — 판 불변
   ⑨ 물건을 고르기 전 마무리 — 판 불변        ⑩ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 마을의 수는 교과서 18쪽 그림의 수를 그대로 옮긴 것이고 2050년은 예상한 수(캡션 상시).
   ㉡ 물건의 기능 세 가지는 어느 것이 더 낫다고 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 친구와 생각을 나누는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 용어 0 — 정보 기술·다른 나라와의 교류 갈래의 용어를 쓰지 않는다
   · 지도서 유의점 — 고령화의 책임을 노인에게 돌리지 않고, 고령화 자체를 사회 문제로 그리지 않는다
   · 새 사실 0 — 교과서 18~20쪽 · 지도서 40~46쪽 안의 사실만
   · 교사용 참고 자료 0 · 「틀렸」 0 · 사람 형상 0(사람은 동그라미 한 칸) · 학생 이름 0
-->

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#4F46E5; --green-d:#4338CA; --cyan:#7C3AED;

  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;

html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}

.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}

.hv-wrap{max-width:780px;width:100%;margin:0 auto}
.hv-head{background:#E0E7FF;color:#3730A3;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {
  // [동기 유발] 새로 지은 노인 복지관

/* ===== 직접 조작: 백 명 마을을 칠해요 판 =====
   1980년 · 2020년 · 2050년(예상) 세 마을에 노인을 칠한다. 칸 하나 = 한 사람 · 줄 단추 = 열 사람.
   ⭐ 결과표 0 — 그 해 마을이 그림과 같은지는 칠한 칸 수에서 한 줄로 나온다(hvMatch).
   ⭐ 노인이 아닌 사람 수도 셈으로 나온다(hvRest = HV_ALL - 칠한 칸).
   ⭐ 세 마을은 모두 100명 — 전체가 같으니 노인 수가 늘면 비율이 높아진 것이다.
   ================================================================= */
const HV_SIDE = 10;                                        // 마을 한 줄에 열 사람
const HV_ALL = HV_SIDE * HV_SIDE;                          // 마을 사람 100명(교과서 18쪽 「100명이 사는 마을」)
const HV_YEAR = [1980, 2020, 2050];                        // 교과서 18쪽 그림의 세 해(2050년은 예상)
const HV_OLD = [4, 16, 40];                                // 교과서 18쪽 그림 — 100명 가운데 노인(65세 이상)
const HV_N = 3;                                            // 마을 셋
const HV_THING = [
  {mark:"가", text:"노인의 운동을 도와주는 기능",               why:"노인이 건강하게 지내는 데 도움이 된다고 생각할 수 있어요."},
  {mark:"나", text:"위급할 때 도움을 요청할 수 있는 기능",       why:"어려운 일이 생겼을 때 바로 도움을 받을 수 있다고 생각할 수 있어요."},
  {mark:"다", text:"약 먹을 시간을 알려 주는 기능",             why:"약을 제때 챙겨 먹는 데 도움이 된다고 생각할 수 있어요."}
];
const HV_SAY_ALL = "세 마을을 모두 그림과 같이 칠했어요. 이제 판을 읽어 봐요.";
const HV_SAY_ORDER_R = "먼저 세 마을을 모두 그림과 같이 칠해 봐요.";
const HV_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const HV_SAY_ORDER_T = "먼저 판을 읽어 봐요.";
const HV_SAY_THINGDONE = "이미 기능을 골랐어요. 친구가 고른 기능과 견주어 봐요.";
const HV_SAY_ORDER_FIN = "먼저 넣고 싶은 기능을 골라 봐요.";
const HV_READQ = [
  "노인의 수만 늘었을 뿐, 전체 사람 수에서 노인의 수가 차지하는 비율은 그대로예요",
  "세 마을 모두 100명인데 노인이 점점 많아지니, 전체 사람 수에서 노인의 수가 차지하는 비율이 점점 높아지고 있어요",
  "2050년은 예상한 수라서 앞으로 어떻게 변할지 전혀 짐작할 수 없어요"
];
const HV_READ_OK = 1;
const HV_READ_BAD = "세 마을의 사람 수가 모두 몇 명인지, 칠한 칸이 어떻게 변했는지 판을 다시 살펴봐요.";
const HV_FINQ = [
  "고령화는 전체 사람 수에서 노인의 수가 차지하는 비율이 낮아지는 현상이에요",
  "고령화가 되면 노인을 위한 시설과 프로그램이 줄어들어요",
  "전체 사람 수에서 노인의 수가 차지하는 비율이 높아지는 현상을 고령화라고 하고, 우리 사회는 노인이 안정된 생활을 할 수 있도록 여러 가지 노력을 하고 있어요"
];
const HV_FIN_OK = 2;
const HV_FIN_BAD = "교과서 20쪽 「꼭 기억해요」를 다시 떠올려 봐요.";

function hvYearOf(y){ return HV_YEAR[y]; }                                 // HV_YEAR 를 읽는 자리는 여기 단 하나
function hvOldOf(y){ return HV_OLD[y]; }                                   // HV_OLD 를 읽는 자리는 여기 단 하나
function hvThingOf(k){ return HV_THING[k]; }                               // HV_THING 을 읽는 자리는 여기 단 하나
function hvCount(st,y){ return st.hvGrid[y].reduce((s,c) => s + c, 0); }    // 칠한 칸 = 노인
function hvRest(st,y){ return HV_ALL - hvCount(st,y); }                     // ★ 노인이 아닌 사람 — 저장 0
function hvMatch(st,y){ return hvCount(st,y) === hvOldOf(y); }              // ★ 그림과 같은지 — 한 줄로
function hvMatchN(st){ return [0,1,2].filter(y => hvMatch(st,y)).length; }
function hvAll(st){ return hvMatchN(st) === HV_N; }
function hvRowFull(st,r){ return st.hvGrid[st.hvYear].slice(r*HV_SIDE, r*HV_SIDE+HV_SIDE).every(c => c === 1); }
function hvLine(st,y){
  const n = hvCount(st,y), t = hvOldOf(y);
  const tail = n === t ? ` — 교과서 그림과 같아요.` : n > t ? ` — 교과서 그림보다 많이 칠했어요.` : ``;
  return `${hvYearOf(y)}년 마을: 노인 ${n}명 · 노인이 아닌 사람 ${hvRest(st,y)}명${tail}`;
}
function hvStage(st){
  if(!hvAll(st)) return "paint";
  if(st.hvRead == null) return "read";
  if(st.hvThing == null) return "thing";
  if(st.hvFin == null) return "fin";
  return "end";
}

/* 판 — 해 고르기 · 마을 100칸 · 세 마을 나란히 */
function hvLabel(y){ return y === HV_N - 1 ? `${hvYearOf(y)}년(예상)` : `${hvYearOf(y)}년`; }
function hvGridHTML(st){
  const g = st.hvGrid[st.hvYear];
  let s = '';
  for(let r=0;r<HV_SIDE;r++){
    let c = '';
    for(let k=0;k<HV_SIDE;k++){ const i = r*HV_SIDE + k; c += `<button class="hv-cell" data-i="${i}" data-on="${g[i]}" onclick="hvTap(${i})" aria-label="${i+1}번째 사람"></button>`; }
    s += `<div class="hv-line"><button class="hv-row" data-r="${r}" data-full="${hvRowFull(st,r)?1:0}" onclick="hvRow(${r})">줄</button>${c}</div>`;
  }
  return `<div class="hv-grid">${s}</div>`;
}
function hvMini(st,y){
  const g = st.hvGrid[y];
  return `<div class="hv-mini" data-y="${y}"><b>${hvLabel(y)}</b><div class="hv-mgrid">${g.map(c=>`<i data-on="${c}"></i>`).join('')}</div>100명 가운데 노인 <b>${hvCount(st,y)}</b>명</div>`;
}
function hvBoard(st){
  const y = st.hvYear;
  const tabs = [0,1,2].map(k=>`<button class="hv-tab" data-y="${k}" data-on="${k===y?1:0}" data-ok="${hvMatch(st,k)?1:0}" onclick="hvPickYear(${k})">${hvLabel(k)}</button>`).join('');
  const three = hvAll(st) ? `<div class="hv-three">${[0,1,2].map(k=>hvMini(st,k)).join('')}</div>` : '';
  return `<div class="hv-board" data-year="${y}" data-ok="${hvMatchN(st)}" data-old="${hvCount(st,y)}" data-rest="${hvRest(st,y)}">
    <div class="hv-title">우리나라가 100명이 사는 마을이라면</div>
    <div class="hv-tabs">${tabs}</div>
    ${hvGridHTML(st)}
    <div class="hv-count">${hvLabel(y)} 마을 · 노인 <b>${hvCount(st,y)}</b>명 · 노인이 아닌 사람 ${hvRest(st,y)}명 · 모두 ${HV_ALL}명</div>
    ${three}</div>`;
}
function hvThings(st){
  return `<div class="hv-things">${[0,1,2].map(k=>`<button class="hv-thing" data-k="${k}" data-on="${st.hvThing===k?1:0}" onclick="hvPickThing(${k})"><b>${hvThingOf(k).mark}</b> ${hvThingOf(k).text}</button>`).join('')}</div>`;
}
function hvKey(st){
  return `<div class="hv-key"><b>교과서 18쪽 그림</b><br>
    1980년 — 100명 가운데 <b>4명 정도</b>가 노인<br>
    2020년 — 100명 가운데 <b>16명 정도</b>가 노인<br>
    2050년(예상) — 100명 가운데 <b>40명 정도</b>가 노인<br>
    동그라미 하나 = 한 사람 · <b>줄</b> 단추 = 한 줄 열 사람</div>`;
}
function hvPanel(st){
  const stage = hvStage(st);
  let ask = '';
  if(stage === "paint"){
    ask = `<div class="hv-ask" data-step="paint"><b>해를 고르고, 그 해 마을에서 노인인 사람을 그림과 같이 칠해 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="hv-ask" data-step="read"><b>칠한 세 마을을 나란히 보고, 어떻게 변해 왔는지 읽어 봐요.</b>
      <div class="hv-opts">${HV_READQ.map((t,i)=>`<button class="hv-opt" onclick="hvRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "thing"){
    ask = `<div class="hv-ask" data-step="thing"><b>노인을 위한 물건을 만든다면 어떤 기능을 넣고 싶은지 골라 봐요.</b>${hvThings(st)}</div>`;
  } else if(stage === "fin"){
    ask = `<div class="hv-ask" data-step="fin"><b>오늘 공부한 내용은 어떻게 정리할 수 있을까요?</b>
      <div class="hv-opts">${HV_FINQ.map((t,i)=>`<button class="hv-opt" onclick="hvFin(${i})">${t}</button>`).join('')}</div></div>`;

    <div class="note">판에서 고른 기능과 까닭을 <b style="color:#4F46E5">친구들과 이야기하는 일</b>은 교실 몫이에요. 서로의 생각을 들어 봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u1_l03";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  hvYear:0, hvGrid:[0,1,2].map(()=>Array(HV_ALL).fill(0)), hvRead:null, hvThing:null, hvFin:null, hvMsg:"", hvTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function hvDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 해 고르기 — 칠할 마을을 바꾼다(칠한 칸은 그대로) */
function hvPickYear(y){
  if(state.hvFin!=null) return;                                                         // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(y) || y<0 || y>=HV_N) return;                                     // 가드②: 무효 번호 — 안내조차 띄우지 않음
  state.hvYear = y; state.hvMsg = ""; state.hvTell = hvLine(state,y); playBlip(); hvDraw();
}
/* 칸 누르기 — 한 사람을 노인으로 칠하거나 푼다 */
function hvTap(i){
  if(state.hvFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=HV_ALL) return;                                   // 가드②
  if(hvAll(state)){ state.hvMsg = HV_SAY_ALL; playThud(); hvDraw(); return; }            // 가드③: 세 마을을 다 칠한 뒤 — 판 불변
  const g = state.hvGrid[state.hvYear];
  g[i] = 1 - g[i];                                                                       // ⭐ 칸을 바꾸는 자리 ①
  state.hvMsg = ""; state.hvTell = hvLine(state,state.hvYear); playBlip(); hvDraw();
}
/* 줄 단추 — 한 줄 열 사람을 한꺼번에 칠하거나 푼다 */
function hvRow(r){
  if(state.hvFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(r) || r<0 || r>=HV_SIDE) return;                                  // 가드②
  if(hvAll(state)){ state.hvMsg = HV_SAY_ALL; playThud(); hvDraw(); return; }            // 가드③
  const g = state.hvGrid[state.hvYear], v = hvRowFull(state,r) ? 0 : 1;
  for(let k=0;k<HV_SIDE;k++) g[r*HV_SIDE+k] = v;                                         // ⭐ 칸을 바꾸는 자리 ②
  state.hvMsg = ""; state.hvTell = hvLine(state,state.hvYear); playBlip(); hvDraw();
}
/* 판 읽기 */
function hvRead(i){
  if(state.hvFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=HV_READQ.length) return;                          // 가드②
  if(!hvAll(state)){ state.hvMsg = HV_SAY_ORDER_R; playThud(); hvDraw(); return; }       // 가드④: 다 칠하기 전 — 판 불변
  if(state.hvRead!=null){ state.hvMsg = HV_SAY_READDONE; hvDraw(); return; }             // 가드⑤: 이미 정한 자리 — 판 불변
  if(i!==HV_READ_OK){ state.hvMsg = HV_READ_BAD; playThud(); hvDraw(); return; }         // 가드⑥: 어긋난 답 — 판 불변
  state.hvRead = i; state.hvMsg = ""; state.hvTell = ""; playBlip(); hvDraw();
}
/* 물건의 기능 고르기 — 정답 없음 */
function hvPickThing(k){
  if(state.hvFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(k) || k<0 || k>=HV_THING.length) return;                          // 가드②
  if(state.hvRead==null){ state.hvMsg = HV_SAY_ORDER_T; playThud(); hvDraw(); return; }  // 가드⑦: 판을 읽기 전 — 판 불변
  if(state.hvThing!=null){ state.hvMsg = HV_SAY_THINGDONE; hvDraw(); return; }           // 가드⑧: 이미 고른 기능 — 판 불변
  state.hvThing = k; state.hvMsg = ""; state.hvTell = `${hvThingOf(k).mark}를 골랐어요. ${hvThingOf(k).why}`; playBlip(); hvDraw();
}
/* 마무리 */
function hvFin(i){
  if(state.hvFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=HV_FINQ.length) return;                           // 가드②
  if(state.hvThing==null){ state.hvMsg = HV_SAY_ORDER_FIN; playThud(); hvDraw(); return; } // 가드⑨: 기능을 고르기 전 — 판 불변
  if(i!==HV_FIN_OK){ state.hvMsg = HV_FIN_BAD; playThud(); hvDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.hvFin = i; state.hvMsg = ""; playChime(); hvDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u1_l04_두칸에담아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제① 사회 변화로 달라진 생활 모습 · l05
  「세계화로 달라진 생활 모습을 살펴볼까요」
  교과서 p.27~30 · 지도서 7차시(p.61~67) · [4사03-01]
  수업 기법 = 자료(신문 기사) 분석 및 의견 나누기 · 아이디어 생성 및 공유하기
=========================================================================

  ■ 직접조작 = 오가는 실을 이어요 판 (사회 3-2 다섯째 판)
  ⭐ 씨앗은 교과서 28쪽 「세계화로 우리나라도 세계에 영향을 미치고 있을까요?」와
     교과서 30쪽 풍덩 사회 속으로(초코과자 · 라면 공장), 수업 자료의 물건 다섯(초콜릿 · 화장품 · 포도 · 청바지 · 프라이팬).
  ⭐ 물건 카드 일곱 장 가운데 하나를 고른 뒤, 나라 여덟 가운데 하나를 눌러 우리나라와 실로 잇는다.
     실은 다시 잇거나 풀 수 있다. 한 물건이 여러 나라와 이어질 수 있으면 그 가운데 어느 나라든 알맞다.
  ⭐ 결과표 0 — 실이 알맞은지는 물건이 품은 나라 목록에 이은 나라가 들어 있는지로 한 줄에 나온다(slRight).
  ⭐ 들어온 실 · 나간 실의 수도 저장하지 않는다 — 이은 실의 쪽(way)을 세어 나온다(slWay).
  ⭐ 끝 기준도 상수가 아니라 slRightN === SL_N.
  ⭐ SL_THING 을 읽는 자리는 slThingOf 단 하나 · SL_LAND 는 slLandOf · SL_AD 는 slAdOf · 난수 0.

  ■ 이 차시의 뼈대
   들어온 실과 나간 실이 모두 있다. 우리나라는 다른 나라의 물건을 받기만 하지 않고 영향을 주기도 한다.
   세계 여러 나라가 서로 주고받으며 하나로 연결된다 — 이것이 세계화다.

  ■ 5단계
   ① 물건 일곱 가지 실 잇기 → ② 판 읽기 3택(정답 자리 1)
   ③ 광고 문구 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다) → ④ 마무리 3택(정답 자리 2) → 완료
      — 친구들과 광고 문구를 직접 만드는 일은 교실 몫

  ■ 가드 11종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 모두 알맞게 이은 뒤 고르기·잇기 — 판 불변 ④ 다 잇기 전 판 읽기 — 판 불변
   ⑤ 이미 읽은 자리 — 판 불변                 ⑥ 판 읽기 어긋난 답 — 판 불변
   ⑦ 판을 읽기 전 광고 문구 고르기 — 판 불변   ⑧ 이미 고른 광고 문구 — 판 불변
   ⑨ 광고 문구를 고르기 전 마무리 — 판 불변    ⑩ 마무리 어긋난 답 — 판 불변
   ⑪ 물건을 고르지 않은 채 나라 누르기 — 판 불변

  ■ 정직 3곳
   ㉠ 물건 일곱 가지는 교과서 30쪽과 수업 자료에 나온 것을 옮긴 것이고, 이것이 전부는 아니다(캡션 상시).
   ㉡ 광고 문구 세 가지는 어느 것이 더 낫다고 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 친구들과 광고 문구를 직접 만드는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 주제 용어 0 — 주제②의 갈래 낱말을 쓰지 않는다(생활 양식으로 풀어 쓴다)
   · 새 사실 0 — 교과서 27~30쪽 · 지도서 61~67쪽 안의 사실만 · 신문 기사는 풀어 쓰고 신문 이름을 옮기지 않는다
   · 교사용 참고 자료 0 · 「틀렸」 0 · 사람 형상 0 · 학생 이름 0 · 누리집 주소 0 · 네 자리 연도 0
-->

<script>

   ================================================================= */

  {name:"청바지",   text:"미국에서 만든 청바지를 우리나라에서 살 수 있어요",                                             land:[3],     way:0},

];

const SL_WAY = ["들어온 실", "나간 실"];                   // 0 다른 나라 → 우리나라 · 1 우리나라 → 다른 나라

];

function slThingOf(k){ return SL_THING[k]; }                                 // SL_THING 을 읽는 자리는 여기 단 하나
function slLandOf(c){ return SL_LAND[c]; }                                   // SL_LAND 를 읽는 자리는 여기 단 하나
function slWayOf(w){ return SL_WAY[w]; }                                     // SL_WAY 를 읽는 자리는 여기 단 하나
function slAdOf(k){ return SL_AD[k]; }                                       // SL_AD 를 읽는 자리는 여기 단 하나
function slKeys(){ return [...Array(SL_N).keys()]; }
function slTied(st,k){ return st.slAt[k] !== SL_OUT; }
function slOutN(st){ return slKeys().filter(k => !slTied(st,k)).length; }
function slWay(st,w){ return slKeys().filter(k => slTied(st,k) && slThingOf(k).way === w).length; }   // ★ 들어온 실 · 나간 실 — 저장 0
function slRight(st,k){ return slThingOf(k).land.includes(st.slAt[k]); }                              // ★ 알맞은 실인지 — 한 줄로
function slRightN(st){ return slKeys().filter(k => slRight(st,k)).length; }
function slAll(st){ return slRightN(st) === SL_N; }
function slWa(nm){ const c = nm.charCodeAt(nm.length-1) - 0xAC00; return (c >= 0 && c % 28) ? '과' : '와'; }
function slPos(c){ const a = (c*45 - 90) * Math.PI / 180; return [Math.round((100 + 74*Math.cos(a))*10)/10, Math.round((100 + 74*Math.sin(a))*10)/10]; }
function slLine(st,k){
  const c = st.slAt[k], nm = slThingOf(k).name;
  if(c === SL_OUT) return `「${nm}」 실을 풀었어요. 아직 잇지 않은 물건 ${slOutN(st)}가지.`;
  const w = slThingOf(k).way, ln = slLandOf(c);
  const arrow = w === 0 ? `${ln} → 우리나라` : `우리나라 → ${ln}`;
  const tail = slAll(st) ? ` — 실을 모두 알맞게 이었어요.` : slOutN(st) === 0 ? ` — 모두 이었어요. 실을 다시 살펴봐요.` : ``;
  return `「${nm}」 실을 ${ln}${slWa(ln)} 이었어요(${slWayOf(w)} · ${arrow}). 들어온 실 ${slWay(st,0)} · 나간 실 ${slWay(st,1)}${tail}`;
}
function slStage(st){
  if(!slAll(st)) return "tie";
  if(st.slRead == null) return "read";
  if(st.slAd == null) return "ad";
  if(st.slFin == null) return "fin";
  return "end";
}

/* 판 — 둥근 지도 · 나라 단추 · 물건 카드 */
function slMap(st){
  const lines = slKeys().filter(k => slTied(st,k)).map(k => {
    const c = st.slAt[k], w = slThingOf(k).way, [x,y] = slPos(c);
    const dx = x - 100, dy = y - 100, L = Math.hypot(dx,dy), ux = dx/L, uy = dy/L, o = w === 0 ? -3 : 3;
    const ax = Math.round((100 + ux*17 - uy*o)*10)/10, ay = Math.round((100 + uy*17 + ux*o)*10)/10;
    const bx = Math.round((x - ux*10 - uy*o)*10)/10,   by = Math.round((y - uy*10 + ux*o)*10)/10;
    const [x1,y1,x2,y2] = w === 0 ? [bx,by,ax,ay] : [ax,ay,bx,by];
    return `<line class="sl-line" data-k="${k}" data-c="${c}" data-way="${w}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${w===0?'#16A34A':'#D97706'}" stroke-width="2.4" marker-end="url(#slm${w})"/>`;
  }).join('');
  const lands = [...Array(SL_LAND.length).keys()].map(c => { const [x,y] = slPos(c);
    return `<g class="sl-dot" data-c="${c}"><circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="#4F46E5" stroke-width="2"/><text x="${x}" y="${y < 100 ? y-12 : y+18}" font-size="10" font-weight="800" fill="#3730A3" text-anchor="middle">${slLandOf(c)}</text></g>`; }).join('');
  return `<div class="sl-map"><svg viewBox="0 0 200 200">
    <defs><marker id="slm0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16A34A"/></marker>
    <marker id="slm1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/></marker></defs>
    <circle cx="100" cy="100" r="15" fill="#4F46E5"/><text x="100" y="103" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">우리나라</text>
    ${lines}${lands}</svg></div>`;
}
function slThingHTML(st,k){
  const c = st.slAt[k], t = slThingOf(k), sel = st.slSel === k ? 1 : 0;
  const at = c === SL_OUT ? `<div class="sl-at">아직 잇지 않았어요</div>` : `<div class="sl-at" data-way="${t.way}">${slLandOf(c)}${slWa(slLandOf(c))} 이었어요 · ${slWayOf(t.way)}</div>`;
  const btn = (sel ? '' : `<button class="sl-btn" data-act="pick" data-k="${k}" onclick="slChoose(${k})">고르기</button>`)
            + (c === SL_OUT ? '' : `<button class="sl-btn" data-act="cut" data-k="${k}" onclick="slTie(${k},${SL_OUT})">실 풀기</button>`);
  return `<div class="sl-thing" data-k="${k}" data-at="${c}" data-sel="${sel}"><b>${t.name}</b> — ${t.text}${at}${btn ? `<div class="sl-btns">${btn}</div>` : ''}</div>`;
}
function slBoard(st){
  const lands = [...Array(SL_LAND.length).keys()].map(c => `<button class="sl-land" data-c="${c}" onclick="slTie(state.slSel,${c})">${slLandOf(c)}</button>`).join('');

    <div class="sl-title">우리나라와 세계 여러 나라를 잇는 실</div>

    :`<div class="note">우리나라가 세계 여러 나라에 어떤 영향을 미치는지 먼저 짐작해 본 뒤 답을 확인해 봐요.</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 5 살펴보기 — 세계화로 나타난 문제
slides.push({stage:2,badge:"개념",render:()=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">세계화로 어떤 문제가 나타났을까요?</h2>
  <div class="ka-bub">세계화로 사람들의 생활이 풍족하고 편리해졌어요. 그러나 세계화로 <span class="ka-emph">여러 가지 문제</span>가 발생하기도 해요.</div>
  <div class="ka-grp"><div class="scene-row">${sceneCard('two','생긴 문제 둘')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>전 세계 사람들의 생활 양식이 비슷해지면서 각 나라의 <b>전통적인 생활 양식이 약해질</b> 수 있어요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>여러 나라를 이동하는 사람들이 많아지면서 <b>감염병이 전 세계로 빠르게 퍼질</b> 수 있어요.</div></div>
  </div></div>`});
// 6 살펴보기 — 어떤 태도가 필요할까요 (reveal)
slides.push({stage:2,badge:"개념",reveal:true,render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">세계화에 대응하려면 어떤 태도가 필요할까요?</h2>
  <div class="ka-bub">세계화로 나타나는 변화에 대응하려면 우리는 <span class="ka-emph">어떤 태도</span>를 갖춰야 할까요?</div>
  <div class="ka-grp">
  ${st.revealed?`<div class="answer-box">· 다른 나라의 생활 양식을 <b>무조건 따르지 않고, 장단점을 따져</b> 받아들이는 태도가 필요해요.<br>· 세계 여러 나라의 문제에 <b>관심</b>을 갖고 <b>함께 해결</b>하려고 노력하는 자세를 가져야 해요.<br>· 우리나라의 생활 양식을 <b>소중히 여기는</b> 태도도 필요해요.</div>`
    :`<div class="note">전통적인 생활 양식이 약해지는 문제와 감염병이 퍼지는 문제를 떠올리며 먼저 생각해 본 뒤 답을 확인해 봐요.</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 7 살펴보기 — 직접 조작
slides.push({stage:2,badge:"개념",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오가는 실을 이어요</h2>
  <div class="ka-grp" style="align-items:stretch">${slPanel(st)}</div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','들어온 실과 나간 실')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>세계 여러 나라가 다양한 분야에서 교류하면서 전 세계가 하나로 연결되는 현상을 <b>세계화</b>라고 해요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>세계화로 다른 나라에서 온 식품이나 물건을 사고, 우리나라의 생활 양식을 다른 나라에 <b>알리기도</b> 해요.</div></div>
    <div class="sum-item"><span class="n">3</span><div>다른 나라의 생활 양식을 <b>장단점을 따져</b> 받아들이고, 세계 여러 나라의 문제를 <b>함께 해결</b>하려는 자세가 필요해요.</div></div>
  </div>
  <div class="note">풍덩 사회 속으로 — 우리나라 초코과자는 러시아, 중국, 베트남 등에서 큰 인기를 끌어 우리나라 회사가 그곳에 공장을 세웠어요. 한국 영화나 드라마에 나오는 <b>라면</b> 덕분에 한국 라면을 즐기는 사람도 늘었어요.</div>
  <div class="note">다음 시간에는 <b style="color:#4F46E5">「사회 변화로 달라진 생활 모습」에서 공부한 내용</b>을 정리해 봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"세계화의 뜻을 말할 수 있어요",st)}
    ${selfCheck(1,"세계화로 달라진 생활 모습을 설명할 수 있어요",st)}
    ${selfCheck(2,"세계화로 나타난 문제와 필요한 태도를 말할 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">세계화로 달라진 생활 모습을 살펴봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">세계화에 대응하는 태도를 알리는 <b style="color:#4F46E5">광고 문구를 친구들과 함께 만드는 일</b>은 교실 몫이에요. 서로의 문구를 들어 봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u1_l05";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  slAt:Array(SL_N).fill(SL_OUT), slSel:null, slRead:null, slAd:null, slFin:null, slMsg:"", slTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function slDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 물건 카드 고르기 */
function slChoose(k){
  if(state.slFin!=null) return;                                                         // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(k) || k<0 || k>=SL_N) return;                                     // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(slAll(state)){ state.slMsg = SL_SAY_ALL; playThud(); slDraw(); return; }            // 가드③: 모두 알맞게 이은 뒤 — 판 불변
  state.slSel = k; state.slMsg = ""; state.slTell = `「${slThingOf(k).name}」 카드를 골랐어요. 이을 나라를 눌러 봐요.`; playBlip(); slDraw();
}
/* 실 잇기 — 나라(0~7)와 잇거나 실을 푼다(-1) */
function slTie(k,c){
  if(state.slFin!=null) return;                                                         // 가드①
  if(k===null){ state.slMsg = SL_SAY_PICK; playThud(); slDraw(); return; }               // 가드⑪: 물건을 고르지 않은 채 나라 누르기 — 판 불변
  if(!Number.isInteger(k) || k<0 || k>=SL_N) return;                                     // 가드②: 무효 번호
  if(!Number.isInteger(c) || c<SL_OUT || c>=SL_LAND.length) return;                      // 가드②: 무효 나라
  if(slAll(state)){ state.slMsg = SL_SAY_ALL; playThud(); slDraw(); return; }            // 가드③
  state.slAt[k] = c;                                                                     // ⭐ 실을 바꾸는 자리 단 하나
  state.slSel = null; state.slMsg = ""; state.slTell = slLine(state,k); playBlip(); slDraw();
}
/* 판 읽기 */
function slRead(i){
  if(state.slFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=SL_READQ.length) return;                          // 가드②
  if(!slAll(state)){ state.slMsg = SL_SAY_ORDER_R; playThud(); slDraw(); return; }       // 가드④: 다 잇기 전 — 판 불변
  if(state.slRead!=null){ state.slMsg = SL_SAY_READDONE; slDraw(); return; }             // 가드⑤: 이미 정한 자리 — 판 불변
  if(i!==SL_READ_OK){ state.slMsg = SL_READ_BAD; playThud(); slDraw(); return; }         // 가드⑥: 어긋난 답 — 판 불변
  state.slRead = i; state.slMsg = ""; state.slTell = ""; playBlip(); slDraw();
}
/* 광고 문구 고르기 — 정답 없음 */
function slAd(k){
  if(state.slFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(k) || k<0 || k>=SL_AD.length) return;                             // 가드②
  if(state.slRead==null){ state.slMsg = SL_SAY_ORDER_A; playThud(); slDraw(); return; }  // 가드⑦: 판을 읽기 전 — 판 불변
  if(state.slAd!=null){ state.slMsg = SL_SAY_ADDONE; slDraw(); return; }                 // 가드⑧: 이미 고른 문구 — 판 불변
  state.slAd = k; state.slMsg = ""; state.slTell = `${slAdOf(k).mark}를 골랐어요. ${slAdOf(k).why}`; playBlip(); slDraw();
}
/* 마무리 */
function slFin(i){
  if(state.slFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=SL_FINQ.length) return;                           // 가드②
  if(state.slAd==null){ state.slMsg = SL_SAY_ORDER_FIN; playThud(); slDraw(); return; }  // 가드⑨: 광고 문구를 고르기 전 — 판 불변
  if(i!==SL_FIN_OK){ state.slMsg = SL_FIN_BAD; playThud(); slDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.slFin = i; state.slMsg = ""; playChime(); slDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

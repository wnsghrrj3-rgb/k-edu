<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제② 다양한 문화에 대한 이해와 존중 · l07 (주제 첫 차시)
  「문화가 무엇인지 알아볼까요」
  교과서 p.34~37 · 지도서 9차시(p.72~75) · [4사03-02]
  수업 기법 = 비교하기 · 개념 파악하기
=========================================================================

  ■ 직접조작 = 우리 학교 문화로 돌려요 판 (사회 3-2 일곱째 판)
  ⭐ 씨앗은 교과서 36쪽 「스스로활동」 — 다른 나라의 학교 문화 세 줄(가 중국 · 나 미국 · 다 독일)에 해당하는 우리의 학교 문화를 쓴다.
  ⭐ 줄마다 다이얼(◀ ▶)을 돌려 우리 학교 문화를 맞춘다. 다이얼은 끝에서 처음으로 돌아간다.
  ⭐ 결과표 0 — 줄이 맞는지는 다이얼 자리가 그 줄의 우리 학교 답 자리에 들어 있는지로 한 줄에 나온다(cdRight).
  ⭐ 다른 점도 저장하지 않는다 — 다이얼 자리가 다른 나라의 자리와 같은지로 한 줄에 나온다(cdDiff).
  ⭐ 끝 기준도 상수가 아니라 cdRightN === CD_N.
  ⭐ CD_ROW 를 읽는 자리는 cdRowOf 단 하나 · CD_FE 는 cdFeOf · 다이얼을 바꾸는 자리는 cdSet 단 하나 · 난수 0.

  ■ 이 차시의 뼈대
   세 줄을 모두 우리 학교 문화로 맞추면 — 줄마다 하는 일(같은 점)은 비슷하고 하는 방법(다른 점)은 서로 다르다.
   → 각 사회의 문화는 비슷한 점도 있고 다른 점도 있다(교과서 36쪽 「꼭 기억해요」).

  ■ 5단계
   ① 세 줄의 다이얼 돌리기 → ② 판 읽기 3택(정답 자리 2)
   ③ 가 보고 싶은 축제 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다) → ④ 마무리 3택(정답 자리 0) → 완료
      — 우리 가족의 생일 축하 모습과 우리 학교 문화를 더 찾아 이야기하는 일은 교실 몫

  ■ 가드 10종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호·무효 방향(안내조차 0)
   ③ 세 줄을 모두 맞춘 뒤 다이얼 돌리기 — 판 불변  ④ 다 맞추기 전 판 읽기 — 판 불변
   ⑤ 이미 읽은 자리 — 판 불변                 ⑥ 판 읽기 어긋난 답 — 판 불변
   ⑦ 판을 읽기 전 축제 고르기 — 판 불변        ⑧ 이미 고른 축제 — 판 불변
   ⑨ 축제를 고르기 전 마무리 — 판 불변         ⑩ 마무리 어긋난 답 — 판 불변

  ■ 정직 3곳
   ㉠ 세 나라의 학교 문화는 교과서 36쪽을 옮긴 것이고, 우리 학교 줄은 교과서 예시 답을 기준으로 맞춘다 — 학교마다 조금 다를 수 있다(캡션 상시).
   ㉡ 축제 세 가지는 어느 것이 더 낫다고 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 우리 가족의 생일 축하 모습과 우리 학교 문화를 더 찾아 이야기하는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 차시 용어는 차시 예고 한 자리뿐 — 이주민·1인 가구·반려동물·다문화·편견·차별 0
   · 새 사실 0 — 교과서 34~37쪽 · 지도서 72~75쪽에 있는 사실만
   · 교사용 참고 자료 0 · 「틀렸」 0 · 사람 형상 0 · 학생 이름 0 · 누리집 주소 0 · 네 자리 연도 0
-->

<script>
/* ===== 시각 자료(SVG 씬) — 도식, 사람 형상 대신 모양과 기호 ===== */
const SVG = {
  // [동기 유발] 세 가족의 생일상 — 미역국 · 사탕을 뿌린 빵 · 면발이 긴 국수

/* ===== 직접 조작: 우리 학교 문화로 돌려요 판 =====
   줄마다 다이얼(◀ ▶)을 돌려 다른 나라의 학교 문화에 해당하는 우리 학교 문화를 맞춘다.
   ⭐ 결과표 0 — 줄이 맞는지는 다이얼 자리가 그 줄의 우리 학교 답 자리에 들어 있는지로 한 줄에 나온다(cdRight).
   ⭐ 다른 점도 셈으로 나온다(cdDiff) — 다이얼 자리가 다른 나라의 자리와 같지 않은지.
   ⭐ 세 줄을 모두 맞추면 줄마다 같은 점과 다른 점이 함께 보인다 — 비슷한 점도 있고 다른 점도 있다.
   ================================================================= */
const CD_MONTH = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const CD_ROW = [                                            // 교과서 36쪽 「스스로활동」 세 줄 — ok 는 우리 학교 답 자리, there 는 다른 나라 자리

   pre:"우리 학교에서 선생님께 인사할 때는", post:"", opts:["선생님의 이름을 부르며 악수해요","고개를 숙여요","허리를 숙여요"], ok:[1,2], there:0,

   pre:"우리 학교 수업 시간에는", post:"등을 공부해요.", opts:["독일어, 수학, 영어, 종교","국어, 수학, 영어, 사회"], ok:[1], there:0,

const CD_SAY_ALL = "세 줄을 모두 우리 학교 문화로 맞췄어요. 이제 판을 읽어 봐요.";

  "문화는 한 사회의 사람들이 지닌 공통의 생활 양식이에요. 각 사회의 문화는 비슷한 점도 있고 다른 점도 있어요",
  "배가 고파서 음식을 먹는 것처럼 사람들이 하는 행동은 모두 문화예요",
  "문화에는 옷, 음식, 집만 있고, 말과 글이나 규범은 문화가 아니에요"
];
const CD_FIN_OK = 0;
const CD_FIN_BAD = "문화의 뜻과, 문화에 어떤 것들이 있는지 다시 떠올려 봐요.";

function cdRowOf(r){ return CD_ROW[r]; }                                      // CD_ROW 를 읽는 자리는 여기 단 하나
function cdFeOf(k){ return CD_FE[k]; }                                        // CD_FE 를 읽는 자리는 여기 단 하나
function cdRows(){ return [...Array(CD_N).keys()]; }
function cdSet(st,r,v){ st.cdAt[r] = v; }                                     // ⭐ 다이얼을 바꾸는 자리 단 하나
function cdOn(st,r){ return st.cdAt[r] !== CD_OUT; }
function cdOnN(st){ return cdRows().filter(r => cdOn(st,r)).length; }
function cdValOf(st,r){ return cdOn(st,r) ? cdRowOf(r).opts[st.cdAt[r]] : "?"; }
function cdRight(st,r){ return cdOn(st,r) && cdRowOf(r).ok.includes(st.cdAt[r]); }      // ★ 우리 학교 문화로 맞췄는지 — 한 줄로
function cdRightN(st){ return cdRows().filter(r => cdRight(st,r)).length; }
function cdAll(st){ return cdRightN(st) === CD_N; }
function cdDiff(st,r){ return cdOn(st,r) && st.cdAt[r] !== cdRowOf(r).there; }         // ★ 다른 나라와 다른 점이 보이는지 — 저장 0
function cdDiffN(st){ return cdRows().filter(r => cdDiff(st,r)).length; }
function cdNext(st,r,d){ const n = cdRowOf(r).opts.length, c = st.cdAt[r]; return c === CD_OUT ? (d > 0 ? 0 : n - 1) : (c + d + n) % n; }
function cdJong(w){ const c = w.charCodeAt(w.length-1) - 0xAC00; return c >= 0 && c <= 11171 ? c % 28 : 0; }
function cdIga(w){ return cdJong(w) ? '이' : '가'; }
function cdWa(w){ return cdJong(w) ? '과' : '와'; }
function cdRo(w){ const j = cdJong(w); return (j && j !== 8) ? '으로' : '로'; }
function cdHow(st,r){ const R = cdRowOf(r); return `${R.kind}${cdIga(R.kind)} 서로 ${cdDiff(st,r) ? '달라요' : '같아요'}`; }
function cdSays(st,r){ const R = cdRowOf(r); return `${R.land}${cdWa(R.land)} 견주어 보면 ${cdHow(st,r)}`; }
function cdLine(st,r){
  const R = cdRowOf(r), v = cdValOf(st,r), N = cdOnN(st);
  const tail = cdAll(st) ? ` — 세 줄을 모두 우리 학교 문화로 맞췄어요. 판을 읽어 봐요.` : N === CD_N ? ` — 세 줄을 모두 돌렸어요. 우리 학교 문화와 같은지 다시 살펴봐요.` : ``;
  return `${R.mark} 줄 다이얼을 「${v}」${cdRo(v)} 돌렸어요. ${cdSays(st,r)}. 돌린 줄 ${N} / ${CD_N}${tail}`;
}
function cdStage(st){
  if(!cdAll(st)) return "turn";
  if(st.cdRead == null) return "read";
  if(st.cdFe == null) return "fe";
  if(st.cdFin == null) return "fin";
  return "end";
}

/* 판 — 줄마다 다른 나라 문장 · 우리 학교 다이얼 · 견주기 */
function cdRowHTML(st,r){
  const R = cdRowOf(r), on = cdOn(st,r);
  const cmp = on ? `<b>같은 점</b> ${R.same}. <b>견주어 보면</b> ${cdHow(st,r)}.` : `다이얼을 돌려 우리 학교 문화를 맞춰 봐요.`;
  return `<div class="cd-row" data-r="${r}" data-at="${st.cdAt[r]}" data-diff="${cdDiff(st,r) ? 1 : 0}">
    <div class="cd-there"><span class="cd-mark">${R.mark}</span><b>${R.land}</b> — ${R.say}</div>
    <div class="cd-ours">${R.pre} <span class="cd-dial"><button class="cd-btn" data-r="${r}" data-d="-1" onclick="cdTurn(${r},-1)">◀</button><span class="cd-val" data-v="${st.cdAt[r]}">${cdValOf(st,r)}</span><button class="cd-btn" data-r="${r}" data-d="1" onclick="cdTurn(${r},1)">▶</button></span>${R.glue ? '' : ' '}${R.post}</div>
    <div class="cd-cmp">${cmp}</div></div>`;
}
function cdBoard(st){
  return `<div class="cd-board" data-ok="${cdRightN(st)}" data-on="${cdOnN(st)}" data-diff="${cdDiffN(st)}">
    <div class="cd-title">다른 나라의 학교 문화에 해당하는 우리 학교 문화를 맞춰요</div>
    <div class="cd-rows">${cdRows().map(r => cdRowHTML(st,r)).join('')}</div></div>`;
}
function cdFes(st){
  return `<div class="cd-fes">${[0,1,2].map(k=>`<button class="cd-fe" data-k="${k}" onclick="cdFest(${k})"><b>${cdFeOf(k).mark}</b> ${cdFeOf(k).text}</button>`).join('')}</div>`;
}
function cdHelp(st){
  return `<div class="cd-help">줄마다 <b>◀ ▶</b>를 눌러 <b>다이얼</b>을 돌려요.<br>
    다이얼은 <b>끝에서 처음으로</b> 돌아가요.<br>
    다이얼을 돌리면 다른 나라와 <b>견주어 본 모습</b>이 나와요.<br>
    세 줄을 모두 맞춘 뒤 <b>판을 읽어</b> 봐요.</div>`;

function cdPanel(st){
  const stage = cdStage(st);
  let ask = '';
  if(stage === "turn"){
    ask = `<div class="cd-ask" data-step="turn"><b>다른 나라의 학교 문화를 읽고, 다이얼을 돌려 우리 학교 문화를 맞춰 봐요.</b></div>`;

// 7 스스로활동 — 직접 조작
slides.push({stage:2,badge:"개념",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 스스로활동</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">우리 학교 문화로 돌려요</h2>
  <div class="ka-grp" style="align-items:stretch">${cdPanel(st)}</div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">문화가 무엇인지 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','같은 점과 다른 점')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>한 사회의 사람들이 지닌 <b>공통의 생활 양식</b>을 문화라고 해요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>문화에는 <b>의식주</b>뿐만 아니라 <b>말과 글, 음악, 미술, 종교, 규범</b> 등이 있어요.</div></div>
    <div class="sum-item"><span class="n">3</span><div>각 사회의 문화는 서로 <b>비슷한 점도 있고 다른 점도</b> 있어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:#4F46E5">우리 사회의 다양한 문화</b>를 살펴봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"문화의 뜻을 말할 수 있어요",st)}
    ${selfCheck(1,"문화에 어떤 것들이 있는지 말할 수 있어요",st)}
    ${selfCheck(2,"각 사회의 문화는 비슷한 점도 있고 다른 점도 있다는 것을 설명할 수 있어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">문화가 무엇인지 알아봤어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">우리 가족의 <b style="color:#4F46E5">생일 축하 모습과 우리 학교 문화를 더 찾아 이야기하는 일</b>은 교실 몫이에요. 친구들과 견주어 봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u1_l07";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  cdAt:Array(CD_N).fill(CD_OUT), cdRead:null, cdFe:null, cdFin:null, cdMsg:"", cdTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function cdDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 다이얼 돌리기 — d 는 1(▶) 또는 -1(◀) */
function cdTurn(r,d){
  if(state.cdFin!=null) return;                                                         // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(r) || r<0 || r>=CD_N) return;                                     // 가드②: 무효 줄 — 안내조차 띄우지 않음
  if(d!==1 && d!==-1) return;                                                           // 가드②: 무효 방향
  if(cdAll(state)){ state.cdMsg = CD_SAY_ALL; playThud(); cdDraw(); return; }            // 가드③: 모두 맞춘 뒤 — 판 불변
  cdSet(state,r,cdNext(state,r,d));
  state.cdMsg = ""; state.cdTell = cdLine(state,r); playBlip(); cdDraw();
}
/* 판 읽기 */
function cdRead(i){
  if(state.cdFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=CD_READQ.length) return;                          // 가드②
  if(!cdAll(state)){ state.cdMsg = CD_SAY_ORDER_R; playThud(); cdDraw(); return; }       // 가드④: 다 맞추기 전 — 판 불변
  if(state.cdRead!=null){ state.cdMsg = CD_SAY_READDONE; cdDraw(); return; }             // 가드⑤: 이미 정한 자리 — 판 불변
  if(i!==CD_READ_OK){ state.cdMsg = CD_READ_BAD; playThud(); cdDraw(); return; }         // 가드⑥: 어긋난 답 — 판 불변
  state.cdRead = i; state.cdMsg = ""; state.cdTell = `다른 점이 보이는 줄 ${cdDiffN(state)} / ${CD_N} — 세 줄 모두 같은 점과 다른 점이 함께 있어요. 각 사회의 문화는 비슷한 점도 있고 다른 점도 있어요.`; playBlip(); cdDraw();
}
/* 가 보고 싶은 축제 고르기 — 정답 없음 */
function cdFest(k){
  if(state.cdFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(k) || k<0 || k>=CD_FE.length) return;                             // 가드②
  if(state.cdRead==null){ state.cdMsg = CD_SAY_ORDER_F; playThud(); cdDraw(); return; }  // 가드⑦: 판을 읽기 전 — 판 불변
  if(state.cdFe!=null){ state.cdMsg = CD_SAY_FEDONE; cdDraw(); return; }                 // 가드⑧: 이미 고른 축제 — 판 불변
  state.cdFe = k; state.cdMsg = ""; state.cdTell = `${cdFeOf(k).mark}를 골랐어요. ${cdFeOf(k).why}`; playBlip(); cdDraw();
}
/* 마무리 */
function cdFin(i){
  if(state.cdFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=CD_FINQ.length) return;                           // 가드②
  if(state.cdFe==null){ state.cdMsg = CD_SAY_ORDER_FIN; playThud(); cdDraw(); return; }  // 가드⑨: 축제를 고르기 전 — 판 불변
  if(i!==CD_FIN_OK){ state.cdMsg = CD_FIN_BAD; playThud(); cdDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.cdFin = i; state.cdMsg = ""; playChime(); cdDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g3_social_u1_l08_깃발을꽂아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

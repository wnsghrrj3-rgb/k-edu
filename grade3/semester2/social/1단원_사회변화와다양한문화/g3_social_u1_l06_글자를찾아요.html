<!DOCTYPE html>
<!--
=========================================================================
  사회 3-2 · 1단원 사회 변화와 다양한 문화
  주제① 사회 변화로 달라진 생활 모습 · l06 (주제 마무리)
  「[생각을 펼쳐요] 사회 변화로 달라진 생활 모습 정리」
  교과서 p.31~33 · 지도서 8차시(p.68~69) · [4사03-01]
  수업 기법 = 자료 제작하기 · 돌아가며 말하기
=========================================================================

  ■ 직접조작 = 가려진 글자를 찾아요 판 (사회 3-2 여섯째 판)
  ⭐ 씨앗은 교과서 33쪽 「재미있게 확인해요」 — 가려진 글자를 글자판에서 찾고, 남은 글자로 빈칸에 들어갈 말을 만든다.
  ⭐ 열쇠 여섯 가운데 하나를 고른 뒤 글자판의 글자를 누르면, 그 열쇠의 빈칸이 앞에서부터 차례로 채워진다.
     「한 칸 지우기」로 마지막에 채운 빈칸을 비울 수 있다. 글자판의 글자는 여러 번 쓸 수 있다.
  ⭐ 결과표 0 — 빈칸이 알맞은지는 넣은 글자가 열쇠 낱말의 그 자리 글자와 같은지로 한 줄에 나온다(gpRight).
  ⭐ 남은 글자도 저장하지 않는다 — 어느 빈칸에도 쓰이지 않은 글자판 글자를 세어 나온다(gpLeft).
  ⭐ 끝 기준도 상수가 아니라 gpRightN === GP_N.
  ⭐ GP_KEY 를 읽는 자리는 gpKeyOf 단 하나 · GP_BOARD 는 gpBoardOf · GP_PO 는 gpPoOf · 빈칸을 바꾸는 자리는 gpSet 단 하나 · 난수 0.

  ■ 이 차시의 뼈대
   빈칸을 모두 알맞게 채우면 글자판에 세 · 계 · 화 세 글자만 남는다 — 남은 글자로 「세계화」를 만든다.
   판에는 저출산 · 고령화 · 지능정보화 · 세계화, 주제①에서 공부한 네 가지 사회 변화가 모두 들어 있다.

  ■ 5단계
   ① 열쇠 여섯의 빈칸 채우기 → ② 판 읽기 3택(정답 자리 0)
   ③ 포스터 내용 가·나·다 고르기(정답 없음 · 고른 까닭이 뜬다) → ④ 마무리 3택(정답 자리 1) → 완료
      — 카드 뉴스와 포스터를 직접 만드는 일은 교실 몫

  ■ 가드 12종
   ① 마무리 확정 후 처리기 전체 잠금          ② 무효 번호(안내조차 0)
   ③ 모두 알맞게 채운 뒤 고르기·넣기·지우기 — 판 불변 ④ 다 채우기 전 판 읽기 — 판 불변
   ⑤ 이미 읽은 자리 — 판 불변                 ⑥ 판 읽기 어긋난 답 — 판 불변
   ⑦ 판을 읽기 전 포스터 고르기 — 판 불변      ⑧ 이미 고른 포스터 — 판 불변
   ⑨ 포스터를 고르기 전 마무리 — 판 불변       ⑩ 마무리 어긋난 답 — 판 불변
   ⑪ 빈칸이 다 찬 열쇠에 글자 넣기 — 판 불변   ⑫ 채운 빈칸이 없는 열쇠에서 지우기 — 판 불변

  ■ 정직 3곳
   ㉠ 열쇠 여섯은 교과서 33쪽을 옮긴 것이고, 판은 겹친 칸을 낱말마다 한 줄씩 풀어 놓았다(캡션 상시).
   ㉡ 포스터 내용 세 가지는 어느 것이 더 낫다고 가리기 어려워 판은 정답을 정하지 않는다(캡션 상시).
   ㉢ 카드 뉴스와 포스터를 직접 만드는 일은 교실 몫(완료 카드 명시).

  ■ 설계 원칙
   · 뒤 주제 용어는 차시 예고 한 자리뿐 — 주제②의 낱말은 예고 문장에만 한 번 쓴다
   · 새 사실 0 — 교과서 31~33쪽 · 지도서 68~69쪽 · 앞 다섯 차시에서 공부한 사실만
   · 교사용 참고 자료 0 · 「틀렸」 0 · 사람 형상 0 · 학생 이름 0 · 누리집 주소 0 · 네 자리 연도 0
-->

<title>[생각을 펼쳐요] 사회 변화로 달라진 생활 모습 정리 · 사회 3-2</title>
<meta name="kedu-lesson-id" content="g3_social_u1_l06_v1"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#4F46E5; --green-d:#4338CA; --cyan:#7C3AED;
  --bg:#EEF2FF; --bub:#E0E7FF; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#F57F17; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:#E0E7FF;color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:640px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:#E0E7FF;animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:640px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(79,70,229,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 조작 판 — 가려진 글자를 찾아요 판 */
.gp-wrap{max-width:780px;width:100%;margin:0 auto}
.gp-head{background:#E0E7FF;color:#3730A3;font-weight:800;text-align:center;border-radius:10px;padding:7px 10px;
  font-size:clamp(13px,2.1vw,16px);margin-bottom:8px;word-break:keep-all}
.gp-board{padding:9px;border-radius:14px;background:#F5F7FF;border:2px solid #C7D2FE}
.gp-title{text-align:center;font-weight:800;color:#3730A3;font-size:clamp(12px,2vw,14px);margin-bottom:6px;word-break:keep-all}
.gp-keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.gp-key{border:2px solid #A5B4FC;border-radius:9px;background:#EEF2FF;font-family:inherit;font-size:clamp(12px,2vw,15px);font-weight:800;
  color:#3730A3;padding:5px 3px;cursor:pointer}
.gp-key[data-cur="1"]{border-color:#4F46E5;background:#4F46E5;color:#fff}
.gp-clue{margin-top:7px;border-radius:10px;background:#fff;border:2px solid #C7D2FE;padding:7px 10px;font-size:clamp(12px,2vw,14px);
  line-height:1.5;color:#0F172A;word-break:keep-all}
.gp-clue b{color:#4338CA}
.gp-words{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.gp-word{display:flex;align-items:center;gap:4px;border-radius:9px;padding:4px 6px;background:#fff;border:1.5px solid #E0E7FF}
.gp-word[data-cur="1"]{border-color:#4F46E5;box-shadow:0 0 0 2px #C7D2FE}
.gp-no{font-weight:800;color:#4338CA;font-size:13px;min-width:18px}
.gp-c{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-weight:800;font-size:14px;
  border:1.5px solid #CBD5E1;background:#F8FAFC;color:#0F172A}
.gp-c[data-s]{border:2px dashed #818CF8;background:#EEF2FF;color:#3730A3}
.gp-pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.gp-ch{border:2px solid #C7D2FE;border-radius:9px;background:#fff;font-family:inherit;font-size:clamp(14px,2.4vw,18px);font-weight:800;
  color:#1E1B4B;padding:6px 2px;cursor:pointer}
.gp-ch[data-used="1"]{background:#E0E7FF;color:#64748B;border-color:#E0E7FF}
.gp-tools{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
.gp-btn{border:1.5px solid #94A3B8;border-radius:8px;background:#F1F5F9;font-family:inherit;font-size:12px;font-weight:800;color:#475569;padding:4px 10px;cursor:pointer}
.gp-left{font-size:clamp(11px,1.8vw,13px);font-weight:700;color:#475569}
.gp-left b{color:#4338CA}
.gp-pos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.gp-po{border:2px solid #C7D2FE;border-radius:10px;background:#fff;padding:8px 7px;font-family:inherit;
  font-size:clamp(11px,1.8vw,13px);font-weight:700;color:#0F172A;text-align:left;cursor:pointer;line-height:1.4;word-break:keep-all}
.gp-po b{color:#4338CA}
.gp-side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gp-help{border:2px solid var(--line);border-radius:11px;padding:8px 10px;background:#fff;font-size:clamp(11px,1.9vw,14px);line-height:1.6}
.gp-help b{color:#4338CA}
.gp-tell{border-radius:11px;padding:8px 12px;font-size:clamp(12px,2vw,15px);line-height:1.6;background:#F5F3FF;border-left:4px solid var(--cyan)}
.gp-ask{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#FAFAFF;margin-top:9px;
  font-size:clamp(12px,2vw,15px);line-height:1.6;word-break:keep-all}
.gp-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}
.gp-opt{background:#F8FAFC;border:2px solid var(--line);border-radius:11px;padding:9px 11px;font-family:inherit;
  font-size:clamp(12px,2vw,15px);font-weight:700;color:#0F172A;text-align:left;line-height:1.45;word-break:keep-all;cursor:pointer}
.gp-opt:hover{border-color:var(--green);background:var(--bub)}
@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
  .gp-words{grid-template-columns:1fr}
  .gp-pos{grid-template-columns:1fr}
  .gp-side{grid-template-columns:1fr}
  .gp-c{width:24px;height:24px;font-size:13px}
}
</style>

    <g stroke="#4F46E5" stroke-width="2.5" fill="#fff"><rect x="38" y="24" width="14" height="14" rx="3"/><rect x="108" y="24" width="14" height="14" rx="3"/></g>
    <g stroke="#4F46E5" stroke-width="2.5" fill="#4F46E5"><rect x="44" y="56" width="20" height="20" rx="4"/><rect x="70" y="56" width="20" height="20" rx="4"/><rect x="96" y="56" width="20" height="20" rx="4"/></g>

function sceneCard(key,cap){return `<div class="scene">${SVG[key]}<div class="cap">${cap}</div></div>`;}

/* ===== 직접 조작: 가려진 글자를 찾아요 판 =====
   열쇠 하나를 고른 뒤 글자판의 글자를 누르면 그 열쇠의 빈칸이 앞에서부터 차례로 채워진다.
   ⭐ 결과표 0 — 빈칸이 알맞은지는 넣은 글자가 열쇠 낱말의 그 자리 글자와 같은지로 한 줄에 나온다(gpRight).
   ⭐ 남은 글자도 셈으로 나온다(gpLeft) — 어느 빈칸에도 쓰이지 않은 글자판 글자.
   ⭐ 빈칸을 모두 알맞게 채우면 세 · 계 · 화만 남는다 — 남은 글자로 「세계화」를 만든다.
   ================================================================= */
const GP_BOARD = ["출", "세", "지", "화", "산", "능", "정", "령", "복", "계", "보", "통"];   // 교과서 33쪽 글자판 열두 글자(차례 그대로)
const GP_KEY = [                                           // 교과서 33쪽 열쇠 여섯 — word 는 낱말 글자, hide 는 가려진 자리
  {no:"❶", dir:"세로", clue:"사람들이 건강하고 행복하게 살 수 있도록 사회에서 지원하는 제도",                                         word:["복","지","제","도"],          hide:[0,1]},
  {no:"❷", dir:"가로", clue:"인공지능을 활용한 다양한 기술이 사회 전반에 폭넓은 영향을 미치는 현상",                                 word:["지","능","정","보","화"],     hide:[0,1,2,3]},
  {no:"❸", dir:"세로", clue:"전화, 컴퓨터와 같은 기기를 이용해 정보를 주고받는 기술",                                                 word:["정","보","통","신","기","술"], hide:[1,2]},
  {no:"❹", dir:"세로", clue:"전체 사람 수에서 노인의 수가 차지하는 비율이 높아지는 현상",                                             word:["고","령","화"],               hide:[1]},
  {no:"❺", dir:"세로", clue:"오늘날에는 결혼하고 아이를 낳아 기르는 것에 부담을 느끼는 사람이 많아지면서 (  )이/가 나타나고 있어요",   word:["저","출","산"],               hide:[1,2]},
  {no:"❻", dir:"가로", clue:"태어나는 아이의 수가 줄어들어 (  )이/가 감소하는 현상을 저출산이라고 해요",                              word:["출","산","율"],               hide:[0,1]}
];
const GP_K = 6;                                            // 열쇠 여섯
const GP_N = 13;                                           // 빈칸 열세 칸
const GP_OUT = -1;                                         // 아직 채우지 않은 빈칸
const GP_SENT = "에 대응하려면 우리 것을 소중히 여기고, 세계 여러 나라의 문제에 관심을 가져야 해요.";   // 교과서 33쪽 빈칸 문장
const GP_PO = [
  {mark:"가", text:"저출산, 이겨 낼 수 있어요 — 보육 시설을 늘려서 해결해요",            why:"저출산으로 학생 수가 줄어드는 문제를 보육 시설을 늘려 해결하자는 생각을 나타낼 수 있어요."},
  {mark:"나", text:"사이버 범죄를 막기 위해 모두 함께 노력해요",                         why:"지능정보화로 발생하는 사이버 범죄를 막기 위해 모두 함께 노력해야 한다는 생각을 나타낼 수 있어요."},
  {mark:"다", text:"우리의 이웃이 된 세계인들을 친구처럼 여겨요",                        why:"세계화로 우리의 이웃이 된 세계인들을 친구처럼 여기자는 생각을 나타낼 수 있어요."}
];
const GP_SAY_ALL = "빈칸을 모두 알맞게 채웠어요. 이제 판을 읽어 봐요.";
const GP_SAY_FULL = "이 열쇠의 빈칸은 모두 찼어요. 「한 칸 지우기」로 비우거나 다른 열쇠를 골라요.";
const GP_SAY_EMPTY = "이 열쇠에는 지울 글자가 없어요.";
const GP_SAY_ORDER_R = "먼저 열쇠 여섯의 빈칸을 모두 알맞게 채워 봐요.";
const GP_SAY_READDONE = "이미 정한 자리예요. 판은 그대로예요.";
const GP_SAY_ORDER_P = "먼저 판을 읽어 봐요.";
const GP_SAY_PODONE = "이미 포스터 내용을 골랐어요. 친구가 고른 내용과 견주어 봐요.";
const GP_SAY_ORDER_FIN = "먼저 포스터 내용을 골라 봐요.";
const GP_READQ = [
  "남은 글자 세 개로 「세계화」를 만들 수 있어요. 판에는 저출산, 고령화, 지능정보화, 세계화가 모두 들어 있어요",
  "남은 글자 세 개로 「고령화」를 만들 수 있어요. 판에는 고령화만 들어 있어요",
  "글자판의 글자가 모두 쓰여서 남은 글자가 없어요. 판에는 지능정보화만 들어 있어요"
];
const GP_READ_OK = 0;
const GP_READ_BAD = "글자판에서 아직 쓰지 않은 글자를 다시 살펴봐요. 판에 있는 낱말도 하나씩 읽어 봐요.";
const GP_FINQ = [
  "사회 변화는 우리 생활과 관계가 없어서, 달라진 생활 모습을 알아볼 필요가 없어요",
  "우리 사회는 저출산, 고령화, 지능정보화, 세계화 등으로 변화하고 있고, 사회 변화로 나타난 문제를 해결하려면 우리 모두 관심을 갖고 함께 노력해야 해요",
  "사회 변화로 나타난 문제는 나라에서만 해결하면 되고, 우리가 노력할 점은 없어요"
];
const GP_FIN_OK = 1;
const GP_FIN_BAD = "주제에서 공부한 네 가지 사회 변화와 대응 노력을 다시 떠올려 봐요.";

function gpKeyOf(k){ return GP_KEY[k]; }                                     // GP_KEY 를 읽는 자리는 여기 단 하나
function gpBoardOf(c){ return GP_BOARD[c]; }                                 // GP_BOARD 를 읽는 자리는 여기 단 하나
function gpPoOf(k){ return GP_PO[k]; }                                       // GP_PO 를 읽는 자리는 여기 단 하나
function gpSlots(){ return [...Array(GP_N).keys()]; }
function gpFirst(k){ let n = 0; for(let j=0;j<k;j++) n += gpKeyOf(j).hide.length; return n; }
function gpSlotsOf(k){ return gpKeyOf(k).hide.map((p,i) => gpFirst(k) + i); }
function gpSlotOf(s){ for(let k=0;k<GP_K;k++){ const h = gpKeyOf(k).hide, f = gpFirst(k); if(s < f + h.length) return {k, pos:h[s-f], ch:gpKeyOf(k).word[h[s-f]]}; } return null; }
function gpSet(st,s,c){ st.gpAt[s] = c; }                                   // ⭐ 빈칸을 바꾸는 자리 단 하나
function gpFilled(st,s){ return st.gpAt[s] !== GP_OUT; }
function gpFilledN(st){ return gpSlots().filter(s => gpFilled(st,s)).length; }
function gpRight(st,s){ return gpFilled(st,s) && gpBoardOf(st.gpAt[s]) === gpSlotOf(s).ch; }        // ★ 알맞은 빈칸인지 — 한 줄로
function gpRightN(st){ return gpSlots().filter(s => gpRight(st,s)).length; }
function gpAll(st){ return gpRightN(st) === GP_N; }
function gpUsed(st,c){ return gpSlots().some(s => st.gpAt[s] === c); }
function gpLeft(st){ return [...Array(GP_BOARD.length).keys()].filter(c => !gpUsed(st,c)); }       // ★ 남은 글자 — 저장 0
function gpUl(ch){ const c = ch.charCodeAt(ch.length-1) - 0xAC00; return (c >= 0 && c % 28) ? '을' : '를'; }
function gpLine(st,s,act){
  const {k} = gpSlotOf(s), no = gpKeyOf(k).no, F = gpFilledN(st);
  if(act === 'back'){ return `${no} 열쇠 빈칸을 한 칸 비웠어요. 채운 빈칸 ${F} / ${GP_N}.`; }
  const ch = gpBoardOf(st.gpAt[s]);
  const tail = gpAll(st) ? ` — 빈칸을 모두 알맞게 채웠어요. 남은 글자를 살펴봐요.` : F === GP_N ? ` — 빈칸을 모두 채웠어요. 열쇠를 다시 읽어 봐요.` : ``;
  return `${no} 열쇠 빈칸에 「${ch}」${gpUl(ch)} 넣었어요. 채운 빈칸 ${F} / ${GP_N}${tail}`;
}
function gpStage(st){
  if(!gpAll(st)) return "fill";
  if(st.gpRead == null) return "read";
  if(st.gpPo == null) return "po";
  if(st.gpFin == null) return "fin";
  return "end";
}

/* 판 — 열쇠 단추 · 열쇠 글 · 낱말 줄 · 글자판 */
function gpWord(st,k){
  const K = gpKeyOf(k), f = gpFirst(k);
  const cells = K.word.map((ch,p) => { const i = K.hide.indexOf(p);
    if(i < 0) return `<span class="gp-c">${ch}</span>`;
    const s = f + i, c = st.gpAt[s];
    return `<span class="gp-c" data-s="${s}" data-at="${c}">${c === GP_OUT ? '' : gpBoardOf(c)}</span>`; }).join('');
  return `<div class="gp-word" data-k="${k}" data-cur="${st.gpKey === k ? 1 : 0}"><span class="gp-no">${K.no}</span>${cells}</div>`;
}
function gpBoard(st){
  const K = gpKeyOf(st.gpKey);
  const keys = [...Array(GP_K).keys()].map(k => `<button class="gp-key" data-k="${k}" data-cur="${st.gpKey === k ? 1 : 0}" onclick="gpPick(${k})">${gpKeyOf(k).no}</button>`).join('');
  const pad = [...Array(GP_BOARD.length).keys()].map(c => `<button class="gp-ch" data-c="${c}" data-used="${gpUsed(st,c) ? 1 : 0}" onclick="gpPut(${c})">${gpBoardOf(c)}</button>`).join('');
  const left = gpLeft(st).map(c => gpBoardOf(c)).join(' · ');
  return `<div class="gp-board" data-ok="${gpRightN(st)}" data-fill="${gpFilledN(st)}" data-left="${gpLeft(st).length}">
    <div class="gp-title">가려진 글자를 글자판에서 찾아요</div>
    <div class="gp-keys">${keys}</div>
    <div class="gp-clue"><b>${K.no} ${K.dir} 열쇠</b> — ${K.clue}</div>
    <div class="gp-words">${[...Array(GP_K).keys()].map(k => gpWord(st,k)).join('')}</div>
    <div class="gp-pad">${pad}</div>
    <div class="gp-tools"><button class="gp-btn" data-act="back" onclick="gpBack()">한 칸 지우기</button> <span class="gp-left">아직 쓰지 않은 글자 — <b>${left}</b></span></div></div>`;
}
function gpPos(st){
  return `<div class="gp-pos">${[0,1,2].map(k=>`<button class="gp-po" data-k="${k}" onclick="gpPoster(${k})"><b>${gpPoOf(k).mark}</b> ${gpPoOf(k).text}</button>`).join('')}</div>`;
}
function gpHelp(st){
  return `<div class="gp-help"><b>열쇠</b>를 고른 뒤 <b>글자판</b>의 글자를 눌러 빈칸을 채워요.<br>
    빈칸은 <b>앞에서부터 차례로</b> 채워져요.<br>
    글자판의 글자는 <b>여러 번</b> 쓸 수 있어요.<br>
    빈칸을 다 채운 뒤 <b>남은 글자</b>를 살펴봐요.</div>`;
}
function gpPanel(st){
  const stage = gpStage(st);
  let ask = '';
  if(stage === "fill"){
    ask = `<div class="gp-ask" data-step="fill"><b>열쇠를 읽고, 가려진 글자를 글자판에서 찾아 빈칸을 채워 봐요.</b></div>`;
  } else if(stage === "read"){
    ask = `<div class="gp-ask" data-step="read"><b>남은 글자로 빈칸에 들어갈 알맞은 말을 만들어 봐요. 판에서 무엇을 알 수 있을까요?</b>
      <div class="gp-opts">${GP_READQ.map((t,i)=>`<button class="gp-opt" onclick="gpRead(${i})">${t}</button>`).join('')}</div></div>`;
  } else if(stage === "po"){

  ${st.revealed?`<div class="answer-box">· <b>저출산</b> — 우리 사회는 저출산으로 나타나는 문제를 해결하려고 여러 가지 방법을 마련하여 운영하고 있어요.<br>· <b>고령화</b> — 노인의 건강하고 안정적인 생활을 돕는 여러 가지 제도를 운영하고 있어요.<br>· <b>지능정보화</b> — 장점은 누리고, 단점은 보완하려는 태도가 필요해요.<br>· <b>세계화</b> — 다른 나라의 생활 양식을 장단점을 따져 받아들이고, 세계 여러 나라의 문제를 함께 해결하려는 자세가 필요해요.</div>`
    :`<div class="note">앞에서 공부한 네 가지 사회 변화를 하나씩 떠올리며 먼저 생각해 본 뒤 답을 확인해 봐요.</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 7 재미있게 확인해요 — 직접 조작
slides.push({stage:2,badge:"개념",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 재미있게 확인해요</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">가려진 글자를 찾아요</h2>
  <div class="ka-grp" style="align-items:stretch">${gpPanel(st)}</div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">주제에서 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','남은 글자로 만든 말')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">1</span><div>우리 사회는 <b>저출산, 고령화, 지능정보화, 세계화</b> 등으로 변화하고 있고, 사람들의 생활 모습도 달라지고 있어요.</div></div>
    <div class="sum-item"><span class="n">2</span><div>사회 변화로 편리해진 점도 있지만 <b>여러 가지 문제</b>도 나타나요.</div></div>
    <div class="sum-item"><span class="n">3</span><div>사회 변화로 나타난 문제를 해결하려면 우리 모두 <b>관심을 갖고 함께 노력</b>해야 해요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:#4F46E5">문화가 무엇인지</b> 알아봐요.</div></div>`});
// 17 스스로 돌아보기
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"저출산, 고령화, 지능정보화, 세계화로 나타난 생활 모습의 변화를 설명할 수 있어요",st)}
    ${selfCheck(1,"사회 변화로 나타난 문제를 해결하기 위한 방안을 친구들과 이야기할 수 있어요",st)}
    ${selfCheck(2,"다양한 사회 변화에 대응하는 바람직한 태도를 갖게 되었어요",st)}
  </div><div class="note">체크가 잘 안 되는 곳은 <b>다시 살펴봐도</b> 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">사회 변화로 달라진 생활 모습을 정리했어요</h2>
  <div class="ka-grp">
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">사회 변화를 보여 주는 <b style="color:#4F46E5">카드 뉴스와 포스터를 직접 만드는 일</b>은 교실 몫이에요. 친구들과 돌아가며 말해 봐요.</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const optHTML = q.opts.map((o,k)=>{
    let cls='opt';
    if(qs.done && k===q.correct) cls+=' correct';
    if(qs.wrongPick===k) cls+=' wrong';
    return `<button class="${cls}" onclick="pick(${i},${k})" ${qs.done?'disabled':''}>${o}</button>`;
  }).join('');
  const hint = qs.hint>0 ? `<div class="hint">💡 ${qs.hint===1?q.h1:q.h2}</div>` : '';
  const fb = qs.done ? `<div class="fb ok">✓ ${q.reason}</div>` : '';
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용':'확인'} (+${q.pts})</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    <div class="opts" style="margin:0 auto">${optHTML}</div>
    ${hint}${fb}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g3_2_social_u1_l06";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  gpAt:Array(GP_N).fill(GP_OUT), gpKey:0, gpRead:null, gpPo:null, gpFin:null, gpMsg:"", gpTell:"",
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음 (브라우저에서만 · jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function gpDraw(){ main.innerHTML = slides[state.idx].render(state); }

/* 열쇠 고르기 */
function gpPick(k){
  if(state.gpFin!=null) return;                                                         // 가드①: 마무리 확정 후 전체 잠금
  if(!Number.isInteger(k) || k<0 || k>=GP_K) return;                                     // 가드②: 무효 번호 — 안내조차 띄우지 않음
  if(gpAll(state)){ state.gpMsg = GP_SAY_ALL; playThud(); gpDraw(); return; }            // 가드③: 모두 알맞게 채운 뒤 — 판 불변
  state.gpKey = k; state.gpMsg = ""; state.gpTell = `${gpKeyOf(k).no} 열쇠를 골랐어요. 글자판에서 가려진 글자를 찾아 눌러 봐요.`; playBlip(); gpDraw();
}
/* 글자 넣기 — 고른 열쇠의 첫 빈칸에 */
function gpPut(c){
  if(state.gpFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(c) || c<0 || c>=GP_BOARD.length) return;                          // 가드②: 무효 글자
  if(gpAll(state)){ state.gpMsg = GP_SAY_ALL; playThud(); gpDraw(); return; }            // 가드③
  const s = gpSlotsOf(state.gpKey).find(x => !gpFilled(state,x));
  if(s === undefined){ state.gpMsg = GP_SAY_FULL; playThud(); gpDraw(); return; }       // 가드⑪: 다 찬 열쇠 — 판 불변
  gpSet(state,s,c);
  state.gpMsg = ""; state.gpTell = gpLine(state,s,'put'); playBlip(); gpDraw();
}
/* 한 칸 지우기 — 고른 열쇠의 마지막으로 채운 빈칸 */
function gpBack(){
  if(state.gpFin!=null) return;                                                         // 가드①
  if(gpAll(state)){ state.gpMsg = GP_SAY_ALL; playThud(); gpDraw(); return; }            // 가드③
  const s = gpSlotsOf(state.gpKey).filter(x => gpFilled(state,x)).pop();
  if(s === undefined){ state.gpMsg = GP_SAY_EMPTY; playThud(); gpDraw(); return; }      // 가드⑫: 지울 글자 없음 — 판 불변
  gpSet(state,s,GP_OUT);
  state.gpMsg = ""; state.gpTell = gpLine(state,s,'back'); playBlip(); gpDraw();
}
/* 판 읽기 */
function gpRead(i){
  if(state.gpFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=GP_READQ.length) return;                          // 가드②
  if(!gpAll(state)){ state.gpMsg = GP_SAY_ORDER_R; playThud(); gpDraw(); return; }       // 가드④: 다 채우기 전 — 판 불변
  if(state.gpRead!=null){ state.gpMsg = GP_SAY_READDONE; gpDraw(); return; }             // 가드⑤: 이미 정한 자리 — 판 불변
  if(i!==GP_READ_OK){ state.gpMsg = GP_READ_BAD; playThud(); gpDraw(); return; }         // 가드⑥: 어긋난 답 — 판 불변
  state.gpRead = i; state.gpMsg = ""; state.gpTell = `남은 글자 ${gpLeft(state).map(c=>gpBoardOf(c)).join(' · ')}로 「세계화」를 만들었어요. 세계화${GP_SENT}`; playBlip(); gpDraw();
}
/* 포스터 내용 고르기 — 정답 없음 */
function gpPoster(k){
  if(state.gpFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(k) || k<0 || k>=GP_PO.length) return;                             // 가드②
  if(state.gpRead==null){ state.gpMsg = GP_SAY_ORDER_P; playThud(); gpDraw(); return; }  // 가드⑦: 판을 읽기 전 — 판 불변
  if(state.gpPo!=null){ state.gpMsg = GP_SAY_PODONE; gpDraw(); return; }                 // 가드⑧: 이미 고른 내용 — 판 불변
  state.gpPo = k; state.gpMsg = ""; state.gpTell = `${gpPoOf(k).mark}를 골랐어요. ${gpPoOf(k).why}`; playBlip(); gpDraw();
}
/* 마무리 */
function gpFin(i){
  if(state.gpFin!=null) return;                                                         // 가드①
  if(!Number.isInteger(i) || i<0 || i>=GP_FINQ.length) return;                           // 가드②
  if(state.gpPo==null){ state.gpMsg = GP_SAY_ORDER_FIN; playThud(); gpDraw(); return; }  // 가드⑨: 포스터 내용을 고르기 전 — 판 불변
  if(i!==GP_FIN_OK){ state.gpMsg = GP_FIN_BAD; playThud(); gpDraw(); return; }           // 가드⑩: 어긋난 답 — 판 불변
  state.gpFin = i; state.gpMsg = ""; playChime(); gpDraw();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

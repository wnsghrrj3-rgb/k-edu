<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성장 리포트 | K-edu 학부모</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../kedu_config.js"></script>
<script src="../kedu_report_lib.js"></script>
<style id="kedu-title-font">
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
</style>
<style>
/* =============================================
   학부모용 성장 리포트 v2 — 설계 §5
   · 다른 아이와의 비교·석차·백분위 없음 — 자녀의 어제와 오늘만
   · 취약 → "함께 해보면 좋은 것" (가정 활동 제안으로 번역)
   · 열람 = 검증 완료(parent_student_links.verified_at) 자녀만 (RLS) · 열람 로그(report_parent_views)
   · v2: 이번 주 / 이번 달(4주 달력) 전환, 단원 진도를 문장으로, 차시 이름 정본, 인쇄
   ============================================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8EF8;--primary-dark:#3B6FD8;--primary-light:#EBF4FF;
  --green:#38A169;--bg:#F5F7FA;--card:#fff;--text:#1A202C;--sub:#718096;--border:#E2E8F0;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
.topbar{background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10;gap:8px}
.topbar a{font-size:13px;color:var(--sub);text-decoration:none;white-space:nowrap}
.topbar .t{font-family:var(--kedu-title);font-size:16px}
.topbar button{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 70px}
.head-card{background:linear-gradient(135deg,var(--primary),#7BA6FA);color:#fff;border-radius:18px;padding:20px;margin-bottom:16px}
.head-card .k{font-size:12.5px;opacity:.85}
.head-card .n{font-family:var(--kedu-title);font-size:22px;margin-top:2px}
.head-card .p{font-size:13px;margin-top:8px;opacity:.95;line-height:1.6}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.6);border-radius:10px;overflow:hidden;margin-top:12px}
.seg button{border:none;background:transparent;color:#fff;padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;opacity:.8}
.seg button.on{background:#fff;color:var(--primary-dark);opacity:1}
.sec{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.sec h2{font-size:15px;color:var(--primary-dark);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sec .sub{font-size:12.5px;color:var(--sub);margin:-4px 0 12px;line-height:1.6}
.days{display:flex;gap:6px;justify-content:space-between;max-width:420px}
.day{flex:1;text-align:center}
.day .c{width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--border);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:14px}
.day.on .c{background:var(--green);border-color:var(--green);color:#fff}
.day.future .c{opacity:.4}
.day .l{font-size:11px;color:var(--sub);margin-top:4px}
/* 4주 달력 */
.cal{display:grid;grid-template-columns:38px repeat(7,1fr);gap:4px;max-width:480px;font-size:11px;color:var(--sub)}
.cal .h{text-align:center;padding-bottom:2px}
.cal .w{display:flex;align-items:center;justify-content:flex-end;padding-right:6px;white-space:nowrap}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:11px}
.cal .d.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.cal .d.mo{box-shadow:inset 0 0 0 2px #F6AD55}
.cal .d.future{opacity:.35}
.sum-line{font-size:14px;margin-top:12px;line-height:1.8}
.sum-line b{color:var(--primary-dark)}
.chiplist{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#F0FAF4;border:1px solid #BEE3CE;color:#276749;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;line-height:1.3}
.chip small{font-weight:500;opacity:.75}
.unit-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.unit-line:last-child{border-bottom:none}
.unit-line .nm{flex:1;line-height:1.4}
.unit-line .nm small{display:block;color:var(--sub);font-size:12px}
.unit-line .pb{width:110px;height:8px;background:#EDF2F7;border-radius:4px;overflow:hidden;flex:none}
.unit-line .pb i{display:block;height:100%;background:var(--primary)}
.unit-line .pc{font-size:12px;color:var(--sub);width:58px;text-align:right;flex:none}
.home-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.home-card .t{font-size:13.5px;font-weight:700;line-height:1.4}
.home-card .t small{font-weight:500;color:var(--sub);font-size:12px;display:block}
.home-card .d{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.cmt{background:#FFFBEB;border:1px solid #FDE9B8;border-radius:12px;padding:14px;font-size:14px;line-height:1.7}
.cmt .by{font-size:12px;color:var(--sub);margin-top:6px}
.empty{font-size:13.5px;color:var(--sub);line-height:1.6}
.foot-note{font-size:11.5px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.7}
.center{text-align:center;padding:80px 20px;color:var(--sub)}
.center .big{font-size:40px;margin-bottom:10px}
.center a{display:inline-block;margin-top:14px;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;text-decoration:none;font-weight:600;font-size:14px}
.spin{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{@page{size:A4;margin:14mm}.topbar,.seg{display:none}.wrap{padding:0;max-width:none}.sec,.head-card{page-break-inside:avoid}.head-card{color:#000;background:#EBF4FF;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>

<div class="topbar">
  <a href="/parent/">← 학부모 홈</a>
  <span class="t">🌱 성장 리포트</span>
  <button onclick="window.print()">🖨️ 인쇄</button>
</div>

<div class="wrap" id="app">
  <div class="center"><div class="big"><span class="spin"></span></div>자녀의 기록을 정리하는 중…</div>
</div>

<script>
const db = getKeduDb();
const KR = window.KeduReport;
let _D = null;   // 렌더 데이터 (기간 전환용)

function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function q(name){ return new URLSearchParams(location.search).get(name); }

// 가정 활동 제안 문구 풀 (초안 — 설계 §10: 최종 문구는 준호 제정)
// {unit} 자리에 단원명이 들어간다.
const HOME_TIPS = {
  korean: '「{unit}」에서 배운 낱말로 짧은 문장을 하나 같이 만들어 보세요. 아이가 소리 내어 읽으면 더 좋아요.',
  math:   '저녁 식탁에서 「{unit}」에 나온 것을 한 번만 해 보세요 — 물건 개수 세기, 나누기, 비교하기처럼요. 아이가 설명하게 하면 더 좋아요.',
  science:'"「{unit}」에서 뭐가 제일 신기했어?"라고 물어보고, 집에 있는 물건으로 한 번 확인해 보세요.',
  social: '「{unit}」 내용을 우리 동네·우리 집과 연결해 이야기 나눠 보세요. 지도를 함께 펴 보는 것도 좋아요.',
  english:'배운 단어를 하루 한 번, 집 안 물건을 가리키며 함께 말해 보세요.',
  hanja:  '오늘 만난 한자를 손바닥에 한 번 같이 써 보세요.',
  _:      '아이에게 "오늘 뭐가 제일 재미있었어?"라고 물어봐 주세요. 말로 설명하면 기억이 단단해져요.'
};
function tipFor(i){ const t = HOME_TIPS[i.subject] || HOME_TIPS._; return t.replace('{unit}', i.unitName || i.title || '오늘 배운 것'); }

async function init(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ location.href = '/auth/?redirect=' + encodeURIComponent(location.pathname + location.search); return; }

  // 자녀 결정 — student_id 파라미터 또는 검증 완료 첫 자녀
  let studentId = q('student_id');
  if(!studentId){
    const { data: links } = await db.from('parent_student_links')
      .select('student_id').eq('parent_id', session.user.id).not('verified_at','is',null).limit(1);
    if(links && links[0]) studentId = links[0].student_id;
  }
  if(!studentId){
    document.getElementById('app').innerHTML =
      `<div class="center"><div class="big">🔗</div>연결(검증) 완료된 자녀가 없습니다.<br>학부모 홈에서 자녀 연결을 먼저 진행해 주세요.<br><a href="/parent/">학부모 홈으로</a></div>`;
    return;
  }

  const from = KR.addDays(KR.mondayOf(KR.today()), -28);
  const [{ data: profRows }, { data: mastery }, { data: scores }, { data: wrongs }, { data: morning }, { data: cmtRows }] = await Promise.all([
    db.from('student_profiles').select('id, nickname, grade').eq('id', studentId).limit(1),
    db.from('report_lesson_mastery').select('*').eq('student_id', studentId),
    db.from('scores').select('lesson_id,unit_id,question_id,is_correct,earned_at').eq('student_id', studentId).order('earned_at',{ascending:false}).limit(3000),
    db.from('wrong_answers').select('lesson_id,question_id,attempts,resolved_at,last_wrong_at').eq('student_id', studentId).is('resolved_at', null),
    db.from('report_morning_daily').select('student_id,run_date,subject').eq('student_id', studentId).gte('run_date', from),
    db.from('report_teacher_comments').select('comment, updated_at').eq('student_id', studentId).eq('visible_to_parent', true).limit(1)
  ]);
  const prof = profRows && profRows[0];
  if(!prof){
    document.getElementById('app').innerHTML =
      `<div class="center"><div class="big">🔒</div>열람 권한이 없습니다.<br>검증 완료된 자녀만 열람할 수 있습니다.<br><a href="/parent/">학부모 홈으로</a></div>`;
    return;
  }
  await KR.loadCatalog((mastery||[]).map(m=>m.lesson_id).concat((scores||[]).map(r=>r.lesson_id), (wrongs||[]).map(w=>w.lesson_id)));
  _D = { prof, studentId, parentId: session.user.id,
         cls: KR.classify(mastery||[], wrongs||[]),
         weeks: KR.buildWeeks(scores||[], morning||[], 4),
         units: KR.unitProgress(scores||[], mastery||[]),
         morning: morning||[], cmt: (cmtRows&&cmtRows[0])||null, period:'week' };
  render();
  logView('week');
}

// 열람 로그 (설계 §6 — 학부모용만 audit). 테이블이 없거나 막혀도 화면은 정상.
async function logView(period){
  try{ await db.from('report_parent_views').insert({ parent_id:_D.parentId, student_id:_D.studentId, period }); }catch(e){}
}
function setPeriod(p){ if(_D.period===p) return; _D.period = p; render(); logView(p); }

function render(){
  const { prof, cls, weeks, units, morning, cmt } = _D;
  const todayStr = KR.today();
  const DAY_KO = ['월','화','수','목','금','토','일'];
  const isWeek = _D.period === 'week';
  const wk = weeks[3];
  const sel = isWeek ? [wk] : weeks;

  // ---- 기간 집계 ----
  const A = { problems:0, correct:0, morning:0, active:0, lessons:new Set(), done:new Set() };
  sel.forEach(w => { A.problems+=w.problems; A.correct+=w.correct; A.morning+=w.morningCount; A.active+=w.activeDays.size; w.lessonsTouched.forEach(l=>A.lessons.add(l)); w.lessonsDone.forEach(l=>A.done.add(l)); });
  const morningBySubj = {};
  const fromDs = sel[0].weekStart;
  morning.filter(r => (r.run_date||'') >= fromDs).forEach(r => { const k = KR.SUBJECT_KO[r.subject]||r.subject; morningBySubj[k]=(morningBySubj[k]||0)+1; });
  const morningTxt = Object.keys(morningBySubj).length ? ' 아침활동(' + Object.entries(morningBySubj).map(([k,v])=>k+' '+v+'회').join(', ') + ')에도 참여했습니다.' : '';
  const subjTouched = {}; A.lessons.forEach(l => { const i = KR.lesson(l); subjTouched[i.subjectKo||'기타'] = (subjTouched[i.subjectKo||'기타']||0)+1; });
  const subjTxt = Object.keys(subjTouched).length ? ' (' + Object.entries(subjTouched).map(([k,v])=>k+' '+v+'차시').join(', ') + ')' : '';
  const periodWord = isWeek ? '이번 주' : '최근 4주';
  const touched = Math.max(A.lessons.size, A.done.size);
  const doneLine = A.active
    ? `${periodWord} <b>${A.active}일</b> 학습에 참여해 <b>${touched}개 차시</b>${subjTxt}에서 <b>${A.problems}문항</b>을 스스로 풀었고, 그중 <b>${A.done.size}개 차시</b>는 끝까지 마쳤습니다.${morningTxt}`
    : `${periodWord}는 아직 학습 기록이 없습니다. 주말이나 저녁, 편한 시간에 한 차시만 함께 열어 보셔도 좋습니다.`;

  // ---- 요일 점 / 4주 달력 ----
  let flowHtml;
  if(isWeek){
    flowHtml = `<div class="days">${Object.keys(wk.days).map((d,i) => { const day = wk.days[d]; const on = day.selfQ>0||day.lessons.size>0||day.done.size>0||day.morning;
      return `<div class="day ${on?'on':''} ${d>todayStr?'future':''}"><div class="c">${on?'✓':''}</div><div class="l">${DAY_KO[i]}</div></div>`; }).join('')}</div>`;
  } else {
    flowHtml = `<div class="cal"><div></div>${DAY_KO.map(d=>`<div class="h">${d}</div>`).join('')}${weeks.map(w =>
      `<div class="w">${KR.fmtMD(w.weekStart)}</div>` + Object.keys(w.days).map(d => { const day = w.days[d]; const on = day.selfQ>0||day.lessons.size>0||day.done.size>0||day.morning;
        return `<div class="d ${on?'on':''} ${day.morning?'mo':''} ${d>todayStr?'future':''}" title="${d}">${Number(d.slice(8,10))}</div>`; }).join('')).join('')}</div>
      <div class="sub" style="margin-top:8px">초록 = 학습한 날 · 주황 테두리 = 아침활동 포함</div>`;
  }

  // ---- 잘 하고 있는 것 — solid 차시 (정본 이름) ----
  const goodChips = cls.solid.slice(0,8).map(r => { const i = KR.lesson(r.lesson_id);
    return `<span class="chip">🏅 ${esc(i.title||i.label)} <small>· ${esc(i.subjectKo)}${i.unitNum?' '+i.unitNum+'단원':''}</small></span>`; }).join('');

  // ---- 단원 진도 문장 ----
  const unitsHtml = units.map(u => { const total = u.total ?? u.lessons.length; const p = total?Math.round(100*u.done/total):0;
    return `<div class="unit-line"><div class="nm">${esc(u.subjectKo)}${u.unitNum?' '+u.unitNum+'단원':''}${u.unitName?' 「'+esc(u.unitName)+'」':''}<small>${u.solid?`탄탄한 차시 ${u.solid}개`:'기록이 쌓이는 중'}${u.nextNew?` · 다음은 「${esc(u.nextNew.title)}」`:''}</small></div><div class="pb"><i style="width:${p}%"></i></div><div class="pc">${u.done}/${total} 완료</div></div>`; }).join('');

  // ---- 함께 해보면 좋은 것 — 반복 오답·취약 → 가정 활동 ----
  const togetherSet = new Set(); const together = [];
  (cls.repeatWrongLessons||[]).forEach(g => { if(!togetherSet.has(g.lesson_id)){ togetherSet.add(g.lesson_id); together.push(g.lesson_id); } });
  (cls.weak||[]).forEach(r => { if(!togetherSet.has(r.lesson_id)){ togetherSet.add(r.lesson_id); together.push(r.lesson_id); } });
  const togetherHtml = together.slice(0,3).map(lid => { const i = KR.lesson(lid);
    return `<div class="home-card"><div class="t">${esc(i.title||i.label)}<small>${esc(i.subjectKo)}${i.unitNum?' '+i.unitNum+'단원':''}${i.unitName?' · '+esc(i.unitName):''}</small></div><div class="d">${esc(tipFor(i))}</div></div>`; }).join('');

  document.getElementById('app').innerHTML = `
    <div class="head-card">
      <div class="k">우리 아이 성장 리포트 · ${esc(todayStr)}</div>
      <div class="n">🎒 ${esc(prof.nickname||'우리 아이')}</div>
      <div class="p">다른 아이와 비교하지 않습니다 — 아이의 어제와 오늘만 봅니다.</div>
      <div class="seg"><button class="${isWeek?'on':''}" onclick="setPeriod('week')">이번 주</button><button class="${!isWeek?'on':''}" onclick="setPeriod('month')">최근 4주</button></div>
    </div>

    <div class="sec"><h2>📅 ${periodWord} 아이가 한 것</h2>
      ${flowHtml}
      <div class="sum-line">${doneLine}</div>
    </div>

    <div class="sec"><h2>🌟 잘 하고 있는 것</h2>
      ${goodChips ? `<div class="chiplist">${goodChips}</div>` : `<div class="empty">기록이 쌓이는 중입니다. 꾸준히 참여하는 것 자체가 가장 큰 잘함입니다.</div>`}
      ${cls.solid.length>8?`<div class="sub" style="margin-top:10px">외 ${cls.solid.length-8}개 차시도 탄탄합니다.</div>`:''}
      ${cls.watching.length?`<div class="sub" style="margin-top:10px">일부 차시는 아직 기록이 적어 판단을 보류하고 있습니다 — 억지로 결론 내리지 않습니다.</div>`:''}
    </div>

    ${units.length ? `<div class="sec"><h2>📚 단원별 걸음</h2>
      <div class="sub">아이가 손댄 단원만 보입니다. 끝까지 마친 차시 수와 다음 차시입니다.</div>
      ${unitsHtml}
    </div>` : ''}

    <div class="sec"><h2>🤝 함께 해보면 좋은 것</h2>
      <div class="sub">아이가 다시 만나면 좋은 차시를, 집에서 가볍게 해볼 수 있는 활동으로 바꿔 드립니다.</div>
      ${togetherHtml || `<div class="empty">지금은 따로 없습니다. "오늘 뭐 배웠어?" 한 마디면 충분합니다.</div>`}
    </div>

    ${cmt && cmt.comment ? `<div class="sec"><h2>💬 담임 선생님 한마디</h2>
      <div class="cmt">${esc(cmt.comment)}<div class="by">${new Date(cmt.updated_at).toLocaleDateString('ko-KR')} · 담임</div></div>
    </div>` : ''}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>내 공책 | 영어 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="play.css">
<script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>
<body data-palette="forest">
<div class="top"><span class="t" id="title">내 공책</span></div>
<main class="nb">
  <div class="nb-empty" id="empty" style="display:none"><span id="emptyI"></span><span>아직 쓴 글씨가 없어요. 열매 차례가 오면 손가락으로 써서 여기에 모아요.</span></div>
  <div class="nb-book" id="book"></div>
  <div class="nb-nav" id="nav"><button class="btn w" id="prev" type="button">앞 장</button><span class="nb-no" id="pageNo"></span><button class="btn w" id="next" type="button">다음 장</button><button class="btn w" id="flip" type="button">처음 글씨</button></div>
  <div class="nb-print" id="printAll"></div>
  <div class="adultbar">
    <button class="adult-link" id="adultBtn" type="button">어른 메뉴</button>
    <div class="adultbox" id="adultBox" style="display:none">
      <div class="ar"><span>공책 인쇄<small>아이가 쓴 글씨를 A4 한 장씩</small></span><button class="btn w" id="printBtn" type="button">인쇄</button></div>
      <div class="ar"><span>손 쓰기 대신 조각으로<small>손으로 쓰기 어려운 기기에서 — 글자 조각을 놓아 열매를 맺어요</small></span><button class="btn w" id="tilesBtn" type="button">꺼짐</button></div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="../v3/engine/k-tts.js"></script>
<script src="ui/icons.js"></script>
<script src="content/letters.js"></script>
<script src="engine/play-write.js"></script>
<script>
/* #36 내 공책(2D 판 — 설계 v2 §4-36 · W14) : 내가 쓴 낱말·문장이 날짜순으로 모이는 책.
   넘겨 읽기(앞 장·다음 장) · 낱말을 누르면 들려준다 · 처음 글씨 ↔ 요즘 글씨 · 어른 메뉴에서 A4 인쇄.
   글씨는 기기에만 있다(PlayWrite — 'kedu-en-play-ink'. 동의 전에는 이 화면 동안만) — 서버로 가지 않는다. */
(function(){
  var $ = function(id){ return document.getElementById(id); }, I = PlayIcon.html, PER = 6;
  var all = PlayWrite.all(), page = 0, first = false, pages = Math.max(1, Math.ceil(all.length / PER));
  $('title').innerHTML = I('notebook') + ' 내 공책';
  $('emptyI').innerHTML = I('pencil');
  function dayKo(d){ var m = /^(\d+)-(\d+)-(\d+)$/.exec(d || ''); return m ? (+m[2]) + '월 ' + (+m[3]) + '일' : ''; }
  function item(x, old){
    return '<button type="button" class="nb-item" data-w="' + x.key.replace(/"/g, '&quot;') + '"><span class="nb-date">' + dayKo(old && x.again ? x.firstDay : x.day) + '</span>' +
      PlayWrite.svg(x, { lines: true, first: old && x.again }) + '<span class="nb-word">' + x.text + '</span></button>';
  }
  function draw(){
    var list = all.slice(page * PER, page * PER + PER);
    $('book').innerHTML = list.map(function(x){ return item(x, first); }).join('');
    $('pageNo').textContent = (page + 1) + ' / ' + pages;
    $('prev').disabled = page <= 0; $('next').disabled = page >= pages - 1;
    $('flip').textContent = first ? '요즘 글씨' : '처음 글씨'; $('flip').setAttribute('data-show', first ? 'first' : 'last');
    Array.prototype.forEach.call($('book').querySelectorAll('.nb-item'), function(b){
      b.onclick = function(){ var w = b.getAttribute('data-w'); if (window.KTTS) { if (/ /.test(w)) KTTS.sentence(w); else KTTS.word(w); } };
    });
  }
  if (!all.length) { $('empty').style.display = ''; $('book').style.display = 'none'; $('nav').style.display = 'none'; }
  else { draw(); if (!all.some(function(x){ return x.again; })) $('flip').style.display = 'none'; }      /* 다시 쓴 낱말이 있어야 견줄 수 있다 */
  $('prev').onclick = function(){ if (page > 0) { page--; draw(); } };
  $('next').onclick = function(){ if (page < pages - 1) { page++; draw(); } };
  $('flip').onclick = function(){ first = !first; draw(); };
  document.body.addEventListener('pointerdown', function once(){ if (window.KTTS && KTTS.unlock) KTTS.unlock(); }, { once: true });

  /* 어른 메뉴 — 인쇄 · 「손 쓰기 대신 조각으로」(화면 설정 kedu-en-play-pref) */
  function tiles(){ var on = !!PlayWrite.tiles(), b = $('tilesBtn'); b.textContent = on ? '켜짐' : '꺼짐'; b.classList.toggle('on', on); }
  $('adultBtn').onclick = function(){ var bx = $('adultBox'); bx.style.display = bx.style.display === 'none' ? '' : 'none'; };
  $('tilesBtn').onclick = function(){ PlayWrite.setTiles(!PlayWrite.tiles()); tiles(); };
  $('printBtn').onclick = function(){ $('printAll').innerHTML = all.map(function(x){ return item(x, false); }).join(''); if (window.print) window.print(); };
  if (!all.length) $('printBtn').disabled = true;
  if (/[?&]adult=1/.test(location.search)) $('adultBox').style.display = '';
  tiles();
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

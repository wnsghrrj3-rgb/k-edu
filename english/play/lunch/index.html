<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>점심 가게 · 영어 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.pill{position:fixed;z-index:6;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#back{left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#dots{right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:7px;padding:10px 14px}
#dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35)}#dots i.on{background:#ffd34d}#dots i.done{background:#8ee07a}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;pointer-events:none}
/* 손님 말풍선 — 둘레의 고리가 기다려 주는 시간(숫자 없음) */
#bub{position:fixed;z-index:8;width:118px;height:118px;margin:-128px 0 0 -59px;transition:opacity .25s,transform .25s;transform:scale(.4);opacity:0;pointer-events:none}
#bub.on{opacity:1;transform:scale(1);pointer-events:auto}
#bub svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
#bub .in{position:absolute;inset:11px;border-radius:50%;background:#fffaf0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(30,40,60,.18)}
#bub .in::after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-9px;border:9px solid transparent;border-top:14px solid #fffaf0;border-bottom:0}
#bub b{font-family:'Andika','Nunito',sans-serif;font-weight:700;font-size:2.15rem;color:#1f2a37;line-height:1;letter-spacing:.01em}
#bub b u{text-decoration:none;color:#c2410c}
#bub button{border:0;background:#1f6f8b;color:#fff;border-radius:999px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#bub button.small{width:38px;height:38px;background:#e9e2d0;color:#1f2a37}
#bub button.hot{background:#dc2626;animation:mic 1s infinite}@keyframes mic{50%{transform:scale(1.12)}}
#bub .row{display:flex;gap:6px;align-items:center}
#bub.shake{animation:shk .35s}@keyframes shk{25%{margin-left:-67px}75%{margin-left:-51px}}
/* 간판 쓰기: 글자 블록 — sh 는 밧줄로 묶인 한 덩이 */
#tiles{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:flex;gap:16px}
.tile{display:flex;gap:0;align-items:center;background:#f7e2b5;border:4px solid #8a5a2b;border-radius:16px;padding:6px 14px;font-family:'Andika',sans-serif;font-weight:700;font-size:2.6rem;color:#3b2410;box-shadow:0 6px 0 rgba(60,30,5,.35);cursor:grab;touch-action:none;position:relative}
.tile.pair{padding:6px 10px;gap:4px;background:#fde3c8}.tile.pair span{background:#fff4e2;border-radius:10px;padding:0 8px}
.tile.pair::before{content:"";position:absolute;left:22%;right:22%;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,#8a5a2b 0 6px,#c39257 6px 12px);z-index:-1}
.tile.drag{cursor:grabbing;box-shadow:0 12px 0 rgba(60,30,5,.25);z-index:12}
.tile.bad{animation:shk2 .35s}@keyframes shk2{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.star{position:fixed;z-index:10;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;transition:transform .7s cubic-bezier(.3,-.3,.6,1),opacity .7s}
#banner{position:fixed;left:50%;top:18%;transform:translate(-50%,0) scale(.8);z-index:11;background:rgba(10,20,40,.78);color:#fff;font-weight:900;font-size:clamp(1.2rem,3.6vw,2rem);border-radius:22px;padding:14px 28px;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;text-align:center;white-space:nowrap}
#banner.on{opacity:1;transform:translate(-50%,0) scale(1)}
#end{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,15,40,.35)}
#end .card{background:#fff8ea;border:6px solid #b9853b;border-radius:28px;padding:22px 30px;text-align:center;max-width:92vw;box-shadow:0 10px 0 rgba(0,0,0,.2)}
#end h2{font-size:clamp(1.4rem,4vw,2rem);color:#4a2a0c;margin-bottom:10px}
#end .stars{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:420px;margin:0 auto 14px}
#end .stars svg{width:30px;height:30px}
#end .words{font-family:'Andika',sans-serif;font-size:1.5rem;color:#1f2a37;margin-bottom:16px;line-height:1.5}
#end u{text-decoration:none;color:#c2410c}
#end button,#end a{display:inline-block;margin:0 6px;border:0;border-radius:999px;padding:12px 24px;font-weight:900;font-size:1.1rem;font-family:inherit;cursor:pointer;text-decoration:none}
#end button{background:#1f6f8b;color:#fff}#end a{background:#e9e2d0;color:#1f2a37}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" class="pill" href="../index.html">← 놀이터</a>
<div id="dots" class="pill"><i></i><i></i><i></i></div>
<div id="bub"><svg class="ring" viewBox="0 0 118 118"><circle cx="59" cy="59" r="54" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="8"/><circle id="ringArc" cx="59" cy="59" r="54" fill="none" stroke="#3c9a6e" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg><div class="in" id="bubIn"></div></div>
<div id="tiles" hidden></div>
<div id="banner"></div>
<div id="end" hidden><div class="card"><h2>오늘 장사 끝!</h2><div class="stars" id="endStars"></div><div class="words" id="endWords"></div><button id="again">한 번 더</button><a href="../index.html">놀이터로</a></div></div>
<div id="loading">점심 가게 문 여는 중…</div>
<script src="../core/audio.js"></script>
<script src="../engine/play-speech.js"></script>
<script type="module" src="./lunch.js?v=1"></script>
</body>
</html>

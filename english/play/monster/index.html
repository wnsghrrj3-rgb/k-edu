<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>배고픈 몬스터 · 영어 놀이터</title>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#F7EBD5;touch-action:none;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;background:rgba(60,40,20,.45);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#word{position:fixed;z-index:6;left:50%;top:0;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(2.4rem,7vw,4.6rem);color:#fff;-webkit-text-stroke:10px #4a2a0c;paint-order:stroke fill;white-space:nowrap;transition:transform .28s cubic-bezier(.3,1.7,.5,1),opacity .2s}
#word.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../index.html">← 놀이터</a>
<div id="word"></div>
<script type="module" src="./monster.js?v=1"></script>
</body>
</html>

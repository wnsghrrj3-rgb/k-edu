<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>커졌다 작아졌다 · 영어 놀이터</title>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#d6cbee;touch-action:none;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#back,#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;background:rgba(60,40,90,.42);color:#fff;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:900;font-size:1rem;text-decoration:none}
#back{left:calc(14px + env(safe-area-inset-left,0px))}
#snd{right:calc(14px + env(safe-area-inset-right,0px));min-width:46px}
#snd.off{opacity:.5;text-decoration:line-through}
#word{position:fixed;z-index:6;left:50%;top:0;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;font-family:'Nunito',"Arial Rounded MT Bold",sans-serif;font-weight:900;font-size:clamp(2.6rem,8vw,5.4rem);color:#fff;-webkit-text-stroke:11px #4a2a0c;paint-order:stroke fill;white-space:nowrap;transition:transform .28s cubic-bezier(.3,1.7,.5,1),opacity .2s}
#word.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#word.big{color:#ffd9a0}
#word.name{font-size:clamp(2.1rem,6.2vw,4.2rem)}
#word.small{color:#bfe9ff;font-size:clamp(1.9rem,5.6vw,3.8rem)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../index.html">← 놀이터</a>
<button id="snd" aria-label="소리">♪</button>
<div id="word"></div>
<script type="module" src="./play.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고고 모형 보기 · 영어 놀이터 시험판 1단계</title>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#F7EBD5;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#grid{position:fixed;inset:0;display:grid;pointer-events:none}
#grid div{padding:14px 18px;font-weight:800;font-size:clamp(.95rem,1.6vw,1.35rem);color:#5a4326;border:1px solid rgba(90,67,38,.12)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grid"></div>
<!-- 1단계 「그림」 확인용: 고고 모형만 본다. ?view=sheet(기본, 여섯 칸) · front · side · back · idle · wow · joy · dizzy (한 칸) · &ry=도(돌려 보기) -->
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadGogo, FACE, BLINK } from './gogo.js?v=3';

const Q = new URLSearchParams(location.search), VIEW = Q.get('view') || 'sheet', RY = +(Q.get('ry') || 0);
// 칸: 이름표 · 표정 · 몸 돌림(도) · 가까이(얼굴) · 자세
const PANELS = {
  front: { label: '앞', face: 'idle', ry: 0 },
  side:  { label: '옆', face: 'idle', ry: -90 },
  back:  { label: '뒤', face: 'idle', ry: 155 },
  idle:  { label: '평소', face: 'idle', ry: 0, close: true },
  wow:   { label: '놀람', face: 'wow', ry: 0, close: true, pose: g => { g.turn('arm_L', 0, 0, 62); g.turn('arm_R', 0, 0, -62); g.turn('fore_L', 0, 0, 18); g.turn('fore_R', 0, 0, -18); g.turn('ant1_L', 0, 0, -16); g.turn('ant1_R', 0, 0, 16); g.turn('head', -5); } },
  joy:   { label: '기쁨', face: 'joy', ry: 0, close: true, pose: g => { g.turn('arm_L', 0, 0, 100); g.turn('arm_R', 0, 0, -100); g.turn('fore_L', 0, 0, 22); g.turn('fore_R', 0, 0, -22); g.turn('head', -7, 0, 4); g.turn('ant1_L', 0, 0, 10); g.turn('ant1_R', 0, 0, -10); } },
  look:  { label: '눈길', face: 'idle', ry: 0, close: true, look: [0.9, 0.7] },
  blink: { label: '눈 감기', face: 'blink', ry: 0, close: true },
  dizzy: { label: '어지러움', face: 'dizzy', ry: 0, close: true, pose: g => { g.turn('head', 4, 0, 11); g.turn('belly', 0, 0, 5); g.turn('ant1_L', 0, 0, 38); g.turn('ant2_L', 0, 0, 30); g.turn('ant1_R', 0, 0, 12); g.turn('ant2_R', 10, 0, 26); g.turn('arm_L', 0, 0, -8); g.turn('arm_R', 0, 0, 20); } },
};
const LIST = VIEW === 'sheet' ? ['front', 'side', 'idle', 'wow', 'joy', 'dizzy'] : VIEW === 'more' ? ['back', 'look', 'blink'] : [VIEW in PANELS ? VIEW : 'front'], COLS = LIST.length > 1 ? 3 : 1, ROWS = Math.ceil(LIST.length / COLS);

const canvas = document.getElementById('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#F7EBD5');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;
scene.add(new THREE.HemisphereLight('#fff6e6', '#d9b58a', 0.8));
const sun = new THREE.DirectionalLight('#fff1d6', 2.6); sun.position.set(-2.2, 4.2, 3.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1.6, right: 1.6, top: 2.2, bottom: -0.6, near: 0.5, far: 12 }); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; sun.shadow.radius = 5; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#efdcbb', roughness: 1 })); floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 50);

const grid = document.getElementById('grid'); grid.style.gridTemplateColumns = `repeat(${COLS},1fr)`; grid.style.gridTemplateRows = `repeat(${ROWS},1fr)`;
for (const k of LIST) { const d = document.createElement('div'); d.textContent = LIST.length > 1 ? PANELS[k].label : ''; grid.append(d); }

const gogo = await loadGogo(); scene.add(gogo.root);
gogo.root.traverse(o => { if (o.isMesh) o.receiveShadow = !o.name.startsWith('GogoEyes'); });
function draw() {
  const W = innerWidth, H = innerHeight; renderer.setSize(W, H, false); renderer.setScissorTest(true);
  LIST.forEach((k, i) => {
    const p = PANELS[k], w = W / COLS, h = H / ROWS, x = (i % COLS) * w, y = H - (Math.floor(i / COLS) + 1) * h;
    gogo.resetPose(); gogo.setFace({ ...(FACE[p.face] || { ...FACE.idle, ...BLINK, mouth: { smile: 1 } }), look: new THREE.Vector2(...(p.look || [0, 0])), spin: 0 }); if (p.pose) p.pose(gogo);
    gogo.root.rotation.y = (p.ry + RY) * Math.PI / 180;
    const aspect = w / h, tall = p.close ? 1.02 : 1.62, mid = p.close ? 0.78 : 0.63;           // 칸에 담을 높이 · 보는 높이
    const dist = Math.max(tall, (p.close ? 1.25 : 1.3) / aspect) / 2 / Math.tan(camera.fov * Math.PI / 360);
    camera.aspect = aspect; camera.position.set(0, mid + dist * 0.16, dist); camera.lookAt(0, mid, 0); camera.updateProjectionMatrix();
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.render(scene, camera);
  });
}
draw(); addEventListener('resize', draw); document.title = 'READY ' + document.title; window.__gogo = gogo; window.__draw = draw;
</script>
</body>
</html>

<script>
/* 마법 자판기 — Lv2 문법 칸 셋(am·are·is · a·an · 문장 조립). 문법은 「문제」가 아니라 칩 조합 놀이로만 — 맞지 않는 칩은 안 들어간다.
   무대 페이지는 구역과 겉모습만 넘긴다 — 하루 흐름은 core/stage.js, 놀이는 games/, 사건 표는 content/events/ */
var CELL = PlayStage.pick('vending');
PlayStage.cellbar(document.getElementById('cellbar'), 'vending', CELL.id);
PlayStage.start({
  icon: 'vending',
  zone: CELL,
  sign: 'IT IS · I AM', host: 'max', where: '자판기',
  open: { en: 'Good job!', ko: '자판기에 불이 들어왔어!' }, opened: '자판기에 불이 들어왔어요!',
  seedHint: '말로 하면 씨앗이 심겨요.',
  endNote: '내일 다시 와서 말해 주면 새싹이 돼요.<br>3일에 꽃, 7일에 열매 — 열매가 된 문장은 자판기 메뉴판에 오르고<br>자판기 열쇠를 걸 수 있어요.',
  nextNote: '다음 자리의 안개가 걷혔어요 — 놀이터에서 구경해 봐요.'
});
</script>

<style>
/* ============================================================
 * 사과나무 빈터 — 입체 시험판 3 (W15 의 첫 판 · 한 해 길 첫 걸음 A01 「a · b」 · 설계 v2 §7 · 상세판 A01)
 *   준호가 모양과 느낌을 먼저 보려는 판이다 — 하루 흐름(씨앗·증거)에는 아직 잇지 않았다.
 *   잘라 낸 숲속 빈터를 비스듬히 내려다본다. 그 걸음의 낱말 여덟이 전부 빈터 안의 물건이다:
 *     왼쪽(a) 사과 · 개미 줄 · 도끼 · 악어(개울)   /   오른쪽(b) 배낭 · 침대 · 통나무 버스 · 새
 *   들어가면 오늘의 걸음이 한 흐름으로 이어진다(준호 11-11 — 듣기만 하지 않게 · 쓰기까지 한 번에):
 *     글자마다 낱말 넷[챈트 한 줄(듣기 + 낱말이 위에 크게 = 보기) → 따라 말하기] → 그 글자 쓰기(빈터 팻말에 붙는다) … 두 글자를 마치면 듣고 찾기 → 마무리.
 *   낱말은 들릴 때 위에 크게 뜬다(첫 글자는 색으로 · 띠를 누르면 다시 들린다). 따라 말하기는 시험이 아니라 메아리 — 두 번 안에 못 알아들어도 넘어간다.
 *   마친 뒤에는 골라서 다시: 챈트 · 듣고 찾기 · 팻말에 쓰기 · 처음부터. 그때는 물건을 누르면 움직이며 이름이 들린다.
 *   시험판 3(준호 11-12 「이 수준에서 좀 더 정교하게」):
 *     · 눈이 따라간다 — 낱말이 나오면 화면이 그 물건 쪽으로 살며시 다가가고, 물건 아래가 밝아지고, 세 사람이 그쪽을 본다(Max 는 가리킨다)
 *     · 빈터가 살아 있다 — 풀잎이 흔들리고, 꽃·갈대·연잎·물무늬·나비·떨어지는 잎, 사람은 말할 때 입이 움직이고 눈을 깜박인다
 *     · 잘 되면 눈에 보인다 — 따라 말하면 물건에서 빛 알갱이가 튀고 낱말 글자가 뛴다 · 쓴 글씨는 팻말로 날아가 붙는다
 *     · 쓰는 판은 가로 화면에서 옆에 뜬다(빈터와 팻말이 그대로 보인다) · 듣고 찾기에는 「다시 듣기」
 *   자리는 상세판의 빈터 판형에서 서로 가리지 않게 조금 옮겼다(침대 뒤로 · 버스 앞으로 · 개울 오른쪽으로) · 색은 전부 토큰(ui/tokens.css) · 끌면 빈터가 조금 돈다 · ?q=low = 가벼운 판.
 * ============================================================ */
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 116px;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-pill);padding:8px 14px;box-shadow:var(--shadow);font-weight:700;font-size:15px;white-space:nowrap}
.chip .ic{color:var(--stage);font-size:18px}
.chip small{font-weight:600;color:var(--ink-3);font-size:12px}
.sndb{width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);border:0;font-size:20px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.sndb.off{color:var(--ink-4)}
/* Max 의 말풍선 — 챈트의 한 줄(글자 · 글자 · 소리 둘 · 그림) */
.gbub{position:fixed;left:0;top:0;z-index:4;background:var(--surface);border-radius:var(--r-3);padding:10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity 220ms;pointer-events:none;transform-origin:50% 100%}
.gbub.show{opacity:1}
.gbub::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--surface);border-bottom:0}
.gbub .cell{min-width:40px;height:44px;border-radius:var(--r-1);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-read);font-weight:700;font-size:26px;color:var(--ink-3);transition:all 160ms var(--ease)}
.gbub .cell.snd{font-size:17px;padding:0 6px;color:var(--ink-3)}
.gbub .cell.pic{font-size:34px;min-width:52px}
.gbub .cell.on{background:var(--stage);color:var(--on-stage);transform:translateY(-4px) scale(1.08)}
.gbub .cell.pic.on{background:var(--warm-soft)}
.gbub .say{font-family:var(--font-en);font-weight:800;font-size:20px;color:var(--ink);padding:0 6px}
/* 누른 물건 위에 뜨는 첫 글자 */
.tag{position:fixed;left:0;top:0;z-index:4;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-family:var(--font-read);font-weight:700;font-size:28px;color:var(--stage-deep);pointer-events:none;opacity:0}
/* 낱말 띠(위) — 들을 때 낱말이 크게 뜬다. 글자는 하나씩 톡톡 올라온다 · 누르면 다시 들린다 */
.gword{position:fixed;left:50%;top:72px;z-index:5;transform:translate(-50%,-14px) scale(.92);opacity:0;transition:opacity 200ms,transform 240ms var(--ease);display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.gword.show{opacity:1;transform:translate(-50%,0) scale(1)}
.gword .row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-3);padding:8px 24px 10px 16px;box-shadow:var(--shadow);transition:background 240ms}
.gword.show .row{pointer-events:auto}
.gword .p{font-size:clamp(40px,7vw,60px);line-height:1;display:flex}
.gword .p:empty{display:none}
.gword .w{font-family:var(--font-read);font-weight:700;font-size:clamp(44px,8.5vw,76px);line-height:1.05;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.gword .w i{display:inline-block;font-style:normal;animation:gPop 340ms var(--ease) both;animation-delay:calc(var(--i) * 42ms)}
.gword .w i.f{color:var(--stage)}
.gword .w.joy i{animation:gJoy 520ms var(--ease) both;animation-delay:calc(var(--i) * 50ms)}
@keyframes gPop{0%{opacity:0;transform:translateY(16px) scale(.6)}70%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes gJoy{0%{transform:none}40%{transform:translateY(-12px) scale(1.12)}100%{transform:none}}
.gword .ck{display:none;width:40px;height:40px;border-radius:50%;background:var(--ok);color:var(--on-stage);font-size:24px;align-items:center;justify-content:center;animation:gPop 320ms var(--ease) both}
.gword.gok .ck{display:flex}
.gword.gok .row{background:var(--ok-soft)}
.gword.gok .w,.gword.gok .w i.f{color:var(--ok)}
.gword.gsay .row{box-shadow:var(--shadow),0 0 0 4px var(--warm-soft)}
.gword.glisten .row{animation:gListen 900ms ease-in-out infinite}
@keyframes gListen{50%{box-shadow:var(--shadow),0 0 0 10px var(--warm-soft)}}
.gword .dots{display:flex;gap:7px}
.gword .dots:empty{display:none}
.gword .dots span{width:11px;height:11px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:all 240ms var(--ease)}
.gword .dots span.on{background:var(--stage);transform:scale(1.3)}
.gword .dots span.done{background:var(--ok)}
.gword .h{font-weight:700;font-size:14px;color:var(--ink-2);background:var(--surface);border-radius:var(--r-pill);padding:6px 14px;box-shadow:var(--shadow)}
.gword .h:empty{display:none}
.gword .bars{display:none;align-items:center;gap:4px;height:30px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow)}
.gword.glisten .bars{display:flex}
.gword .bars i{width:5px;height:18px;border-radius:3px;background:var(--warm);animation:gBar 700ms ease-in-out infinite;animation-delay:calc(var(--i) * 110ms)}
@keyframes gBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.1)}}
.gword .mic,.gword .said{pointer-events:auto;border:0;border-radius:var(--r-pill);background:var(--stage);color:var(--on-stage);box-shadow:var(--shadow);font:700 16px/1 var(--font);display:flex;align-items:center;justify-content:center}
.gword .mic{width:68px;height:68px;font-size:32px;animation:gListen 1100ms ease-in-out infinite}
.gword .said{height:52px;padding:0 24px}
/* 듣고 찾기 — 다시 듣기 */
.ghear{position:fixed;left:50%;bottom:calc(68px + env(safe-area-inset-bottom));z-index:5;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity 240ms,transform 240ms var(--ease);display:flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 18px;border:0;border-radius:var(--r-pill);background:var(--stage);color:var(--on-stage);box-shadow:var(--shadow);font:700 16px/1 var(--font)}
.ghear .ic{font-size:24px}
.ghear.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
/* 걸음 표시(아래) — 듣고 말하기 · 쓰기 · 듣고 말하기 · 쓰기 · 듣고 찾기 */
.gsteps{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none;transition:opacity 300ms}
.gsteps.hide{opacity:0}
.gsteps span{display:flex;align-items:center;gap:4px;height:38px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow);font-size:18px;color:var(--ink-4);transition:all 240ms var(--ease)}
.gsteps span b{font-family:var(--font-read);font-size:19px}
.gsteps span.on{background:var(--stage);color:var(--on-stage);transform:translateY(-3px) scale(1.08)}
.gsteps span.done{color:var(--ok)}
/* 아래 단추(마친 뒤 — 골라서 다시) */
.gdock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:5;pointer-events:none;transition:opacity 300ms,transform 300ms}
.gdock.hide{opacity:0;transform:translateY(30px)}
.gdock.hide button{pointer-events:none}
.gdock button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px;padding:10px 14px;border:0;border-radius:var(--r-3);background:var(--surface);box-shadow:var(--shadow);font:700 13px/1.2 var(--font);color:var(--ink-2)}
.gdock button .ic{font-size:26px;color:var(--stage)}
.gdock button.on{background:var(--stage);color:var(--on-stage)}
.gdock button.on .ic{color:var(--on-stage)}
.gdock.busy button:not(.on){opacity:.45}
.gtip{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--surface);border-radius:var(--r-pill);padding:9px 16px;box-shadow:var(--shadow);font-weight:600;font-size:14px;color:var(--ink-2);z-index:5;transition:opacity 300ms;opacity:0;pointer-events:none;white-space:nowrap}
.gtip.show{opacity:1}
/* 쓰는 판 — 세로 화면은 아래에서 올라오고, 가로 화면은 왼쪽에 뜬다(빈터와 팻말이 그대로 보이게) */
.gsheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--veil);backdrop-filter:blur(6px);border-radius:var(--r-3) var(--r-3) 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateY(105%);transition:transform 320ms var(--ease);touch-action:auto;box-shadow:var(--shadow)}
.gsheet.show{transform:none}
.gsheet .head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--ink-2)}
.gsheet .lt{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:var(--r-2);background:var(--a-cream);font-family:var(--font-read);font-weight:700;font-size:34px;color:var(--ink)}
.gsheet #pad{width:100%;max-width:300px}
.gsheet .pw-sheet{max-width:none}
.gsheet .x{position:absolute;right:12px;top:10px;height:36px;padding:0 14px;border-radius:var(--r-pill);border:0;background:var(--surface);box-shadow:var(--shadow);font:700 13px/1 var(--font);color:var(--ink-2)}
@media (orientation:landscape) and (min-width:820px){
  .gsheet{left:20px;right:auto;bottom:auto;top:50%;width:min(330px,34vw);border-radius:var(--r-3);padding:52px 16px 18px;transform:translate(-118%,-46%)}
  .gsheet.show{transform:translate(0,-46%)}
  .gsheet #pad{max-width:min(300px,calc((100vh - 250px) * .75))}
}
/* 쓴 글씨가 팻말로 날아간다 */
.gfly{position:fixed;left:0;top:0;z-index:9;pointer-events:none;color:var(--ink);display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
.gfly .pw-face{width:100%;height:100%}
.gcover{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--scrim);transition:opacity 500ms}
.gcover.hide{opacity:0;pointer-events:none}
.gcover .box{background:var(--surface);border-radius:var(--r-3);padding:24px 28px;text-align:center;box-shadow:var(--shadow);min-width:240px}
.gcover .big{font:800 24px/1.2 var(--font);color:var(--stage-deep)}
.gcover .ab{font-family:var(--font-read);font-weight:700;font-size:40px;color:var(--stage);letter-spacing:.2em;margin:6px 0 2px}
.gcover p{color:var(--ink-2);margin:6px 0 18px;font-size:14px}
.gcover .btn{width:100%}
@media (prefers-reduced-motion: reduce){.gword .w i,.gword .w.joy i,.gword .ck,.gword .bars i{animation:none}}
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const $ = id => document.getElementById(id), I = PlayIcon.html, A = window.PlayAudio, T = window.KTTS, PW = window.PlayWrite, SP = window.PlaySpeech;
/* ── 상수는 여기 한 곳 ── */
const CONF = {
  bpm: 104,                         /* 챈트 박자(상세판 처음 값 — 듣기 단) */
  finds: 4,                         /* 듣고 찾기 한 판 */
  sayTries: 2, sayMs: 4500,         /* 따라 말하기 — 듣는 횟수 · 한 번 듣는 길이(ms). 두 번 안에 못 알아들어도 넘어간다 */
  cam: { yaw: 0.2, pitch: 0.6, dist: 30, yawMin: -0.25, yawMax: 0.6, pitchMin: 0.42, pitchMax: 0.82,
    ease: 3.0, drift: 0.016, far: 0.86,                 /* 따라가는 빠르기 · 가만히 있을 때 좌우로 아주 조금 · 들어가기 전의 먼 눈 */
    word: [1.2, 0.5], say: [1.34, 0.75], find: [1.28, 0.65], sign: 1.42 },   /* [다가가는 배율, 그 물건 쪽으로 쏠리는 정도 0~1] */
  /* 빈터 판형의 자리([x, z]. 뒤쪽이 -z) — 상세판 GLADE 에서 서로 가리지 않게 조금 옮긴 것 */
  slot: { Lb: [-3.4, -1.8], Lc: [-5.6, 1.2], Ld: [-3.3, 1], Rc: [6.0, -0.2], Rd: [3.5, 0.8], Re: [4.9, 3.5], treeL: [-5, -3.2], treeR: [5, -3.2], creek: [0.8, -3.7],
    owner: [0, -0.8], me: [-1.5, 1.9], guide: [1.5, 1.9], sign: [7.25, 3.7], path: [0, 4.3] },

    if (any) partM.instanceMatrix.needsUpdate = true; }
  const pa = dust.geometry.attributes.position; for (let i = 0; i < dN; i++) { pa.array[i * 3 + 1] += dt * 0.07; pa.array[i * 3] += Math.sin(t * 0.5 + i) * dt * 0.05; if (pa.array[i * 3 + 1] > 4.6) pa.array[i * 3 + 1] = 0.4; } pa.needsUpdate = true;
  /* 사람 — 몸짓은 부드럽게 이어진다 */
  people.forEach((p, i) => { const u = p.userData, k = Math.min(1, dt * 11), m = u.mood;
    u.stomp = Math.max(0, u.stomp - dt * 4.5);
    let by = Math.sin(t * 2 + i) * 0.02, bsy = 1 + Math.sin(t * 2 + i) * 0.012, hz = 0, eye = ((t + i * 1.3) % 3.7 < 0.12) ? 0.1 : 1, smile = 1, brow = 0, yawTo = Math.sin(t * 0.4 + i * 2) * 0.14, snap = false;
    const ax = [0, 0], ay = [0, 0], az = [-0.15, 0.15];
    if (u.look) { u.look.getWorldPosition(vA); const a = Math.atan2(vA.x - p.position.x, vA.z - p.position.z) - p.rotation.y; yawTo = clampN(Math.atan2(Math.sin(a), Math.cos(a)), 1.7); }
    const bodyYaw = clampN(yawTo * 0.5, 0.85), headYaw = clampN(yawTo - bodyYaw, 0.9);
    if (m === 'happy') { by = Math.abs(Math.sin(t * 7 + i)) * 0.3; az[0] = -2.6 + Math.sin(t * 14) * 0.2; az[1] = 2.6 - Math.sin(t * 14) * 0.2; eye = 0.45; smile = 1.5; brow = 1; snap = true; }
    else if (m === 'ear') { hz = 0.24; az[1] = 2.4; ax[1] = -0.3; brow = 1; smile = 0.85; }                                  /* 귀에 손 — 네 말을 듣는다 */

    else if (m === 'point') { const sd = yawTo >= 0 ? 1 : 0; ax[sd] = -1.3; ay[sd] = yawTo - bodyYaw; az[sd] = 0; by += u.stomp * 0.1; smile = 1.25; brow = 0.6; }   /* 그 물건을 가리킨다 */

/* ============================================================
 * 사과나무 빈터 — 입체 시험판 (W15 의 첫 판 · 한 해 길 첫 걸음 A01 「a · b」 · 설계 v2 §7 · 상세판 A01)
 *   준호가 모양과 느낌을 먼저 보려는 판이다 — 하루 흐름(씨앗·증거·세 날)에는 아직 잇지 않았다.
 *   잘라 낸 숲속 빈터를 비스듬히 내려다본다. 그 걸음의 낱말 여덟이 전부 빈터 안의 물건이다:
 *     왼쪽(a) 사과 · 개미 줄 · 도끼 · 악어(개울)   /   오른쪽(b) 배낭 · 침대 · 통나무 버스 · 새
 *   물건을 누르면 움직이며 이름이 들린다. 아래 세 단추 — 챈트(Max 가 박자를 구르고 낱말 자리에서 물건이 들썩) ·
 *   듣고 찾기(들린 것을 빈터에서 찾아 누른다) · 팻말에 쓰기(손으로 쓴 a·b 가 빈터 팻말에 붙는다).
 *   자리는 상세판의 빈터 판형(GLADE 자리 표) 그대로 · 색은 전부 토큰(ui/tokens.css) · 끌면 빈터가 조금 돈다 · ?q=low = 가벼운 판.
 * ============================================================ */
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block}
.hud{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 116px;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-pill);padding:8px 14px;box-shadow:var(--shadow);font-weight:700;font-size:15px;white-space:nowrap}
.chip .ic{color:var(--stage);font-size:18px}
.chip small{font-weight:600;color:var(--ink-3);font-size:12px}
.sndb{width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);border:0;font-size:20px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.sndb.off{color:var(--ink-4)}
/* Max 의 말풍선 — 챈트의 한 줄(글자 · 글자 · 소리 둘 · 그림) */
.gbub{position:fixed;left:0;top:0;z-index:4;background:var(--surface);border-radius:var(--r-3);padding:10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity 220ms;pointer-events:none;transform-origin:50% 100%}
.gbub.show{opacity:1}
.gbub::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--surface);border-bottom:0}
.gbub .cell{min-width:40px;height:44px;border-radius:var(--r-1);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-read);font-weight:700;font-size:26px;color:var(--ink-3);transition:all 160ms var(--ease)}
.gbub .cell.snd{font-size:17px;padding:0 6px;color:var(--ink-3)}
.gbub .cell.pic{font-size:34px;min-width:52px}
.gbub .cell.on{background:var(--stage);color:var(--on-stage);transform:translateY(-4px) scale(1.08)}
.gbub .cell.pic.on{background:var(--warm-soft)}
.gbub .say{font-family:var(--font-en);font-weight:800;font-size:20px;color:var(--ink);padding:0 6px}
/* 누른 물건 위에 뜨는 첫 글자 */
.tag{position:fixed;left:0;top:0;z-index:4;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-family:var(--font-read);font-weight:700;font-size:28px;color:var(--stage-deep);pointer-events:none;animation:tagUp 1500ms var(--ease) forwards}
@keyframes tagUp{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}15%{opacity:1;transform:translate(var(--x),calc(var(--y) - 14px)) scale(1.1)}80%{opacity:1;transform:translate(var(--x),calc(var(--y) - 30px)) scale(1)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) - 44px)) scale(1)}}
/* 아래 단추 셋 */
.gdock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:5;pointer-events:none;transition:opacity 300ms,transform 300ms}
.gdock.hide{opacity:0;transform:translateY(30px)}
.gdock button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px;padding:10px 14px;border:0;border-radius:var(--r-3);background:var(--surface);box-shadow:var(--shadow);font:700 13px/1.2 var(--font);color:var(--ink-2)}
.gdock button .ic{font-size:26px;color:var(--stage)}
.gdock button.on{background:var(--stage);color:var(--on-stage)}
.gdock button.on .ic{color:var(--on-stage)}
.gdock.busy button:not(.on){opacity:.45}
.gtip{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--surface);border-radius:var(--r-pill);padding:9px 16px;box-shadow:var(--shadow);font-weight:600;font-size:14px;color:var(--ink-2);z-index:5;transition:opacity 300ms;opacity:0;pointer-events:none;white-space:nowrap}
.gtip.show{opacity:1}
/* 쓰는 판(아래에서 올라온다) */
.gsheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--veil);backdrop-filter:blur(6px);border-radius:var(--r-3) var(--r-3) 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateY(105%);transition:transform 320ms var(--ease);touch-action:auto}
.gsheet.show{transform:none}
.gsheet .head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--ink-2)}
.gsheet .lt{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:var(--r-2);background:var(--a-cream);font-family:var(--font-read);font-weight:700;font-size:34px;color:var(--ink)}
.gsheet #pad{width:100%;max-width:300px}
.gsheet .x{position:absolute;right:12px;top:10px;height:36px;padding:0 14px;border-radius:var(--r-pill);border:0;background:var(--surface);box-shadow:var(--shadow);font:700 13px/1 var(--font);color:var(--ink-2)}
.gcover{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--veil);transition:opacity 500ms}
.gcover.hide{opacity:0;pointer-events:none}
.gcover .box{background:var(--surface);border-radius:var(--r-3);padding:24px 28px;text-align:center;box-shadow:var(--shadow);min-width:240px}
.gcover .big{font:800 24px/1.2 var(--font);color:var(--stage-deep)}
.gcover .ab{font-family:var(--font-read);font-weight:700;font-size:40px;color:var(--stage);letter-spacing:.2em;margin:6px 0 2px}
.gcover p{color:var(--ink-2);margin:6px 0 18px;font-size:14px}
.gcover .btn{width:100%}

  return canvasTex(160, 160, (g, w, h) => { g.clearRect(0, 0, w, h); if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    const G = (window.PLAY_LETTERS && PLAY_LETTERS.glyphs[ch]) || []; g.strokeStyle = ink; g.lineWidth = 21; g.lineCap = g.lineJoin = 'round';
    G.forEach(st => { g.beginPath(); st.forEach((p, i) => { const x = w / 2 + (p[0] - 0.5) * w * 0.82, y = h / 2 + (p[1] - 0.55) * h * 1.12; if (i) g.lineTo(x, y); else g.moveTo(x, y); }); g.stroke(); }); });
}

signG.add(mesh(new THREE.CylinderGeometry(0.09, 0.12, 1.5, 10), M('a-wood', { roughness: 0.85 }), 0, 0.75, 0));
{ const bd = rbox(1.9, 1.15, 0.16, 0.16, M(mix('a-cream', 'a-wood', 0.18), { roughness: 0.85 })); bd.position.y = 1.75; signG.add(bd); }
const signCv = document.createElement('canvas'); signCv.width = 512; signCv.height = 300;
const signTex = new THREE.CanvasTexture(signCv); signTex.colorSpace = THREE.SRGBColorSpace; signTex.anisotropy = 8;
{ const f = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.0), new THREE.MeshStandardMaterial({ map: signTex, transparent: true, roughness: 0.9 })); f.position.set(0, 1.75, 0.09); signG.add(f); }
function paintSign(){
  const g = signCv.getContext('2d'), w = signCv.width, h = signCv.height; g.clearRect(0, 0, w, h);
  const got = ['a', 'b'].map(l => PW && PW.ink(l));
  ['a', 'b'].forEach((l, i) => { const bx = { x: 40 + i * 226, y: 22, w: 206, h: 256 };
    if (got[i]) { g.strokeStyle = hex('ink'); PW.draw(got[i], g, bx); }
    else { g.setLineDash([10, 12]); g.strokeStyle = hex('ink-4'); g.lineWidth = 5; g.beginPath(); g.roundRect(bx.x + 20, bx.y + 30, bx.w - 40, bx.h - 60, 24); g.stroke(); g.setLineDash([]); } });
  signTex.needsUpdate = true;
}
paintSign();

/* ── 빛(아침) ── */
S.add(new THREE.HemisphereLight(C('stage-soft'), mix('a-leaf', 'a-wood', 0.5), 0.75));
const sun = new THREE.DirectionalLight(C('warm-soft'), 3.6); sun.position.set(-13, 12, 7); sun.target.position.set(0, 0, 0); S.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 10, bottom: -10, near: 1, far: 50 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 5;
const fill = new THREE.DirectionalLight(C('stage-soft'), 0.55); fill.position.set(9, 8, 10); S.add(fill);
/* 아침 햇살 속 먼지(빛 알갱이) */
const dN = LOW ? 30 : 70, dp = new Float32Array(dN * 3); for (let i = 0; i < dN; i++) { dp[i * 3] = -8 + Math.random() * 16; dp[i * 3 + 1] = 0.5 + Math.random() * 4; dp[i * 3 + 2] = -5 + Math.random() * 10; }
const dustG = new THREE.BufferGeometry(); dustG.setAttribute('position', new THREE.BufferAttribute(dp, 3));
const dust = new THREE.Points(dustG, new THREE.PointsMaterial({ color: C('warm-soft'), size: 0.07, transparent: true, opacity: 0.85, depthWrite: false })); S.add(dust);

/* ── 후처리 ── */
const rt = new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType });
const comp = new EffectComposer(R, rt); comp.addPass(new RenderPass(S, cam));
let ao = null; if (!LOW) try { ao = new GTAOPass(S, cam, 1, 1); ao.blendIntensity = 0.85; comp.addPass(ao); } catch (e) { ao = null; }
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.22, 0.6, 0.94); if (!LOW) comp.addPass(bloom);
comp.addPass(new OutputPass());
function resize(){
  const w = innerWidth, h = innerHeight, a = w / h, half = 9.9;           /* 빈터 가로가 다 보이게 */
  const view = Math.max(6.6, half / a);
  cam.left = -view * a; cam.right = view * a; cam.top = view; cam.bottom = -view; cam.zoom = 1; cam.updateProjectionMatrix();
  target.set(0, a < 1 ? 1.6 : 1.0, a < 1 ? 0.3 : -0.1);
  R.setSize(w, h, false); comp.setSize(w, h); bloom.resolution.set(w, h); if (ao) ao.setSize(w, h); place();
}
addEventListener('resize', resize); resize();

/* ── 소리 ── */
let muted = A ? !A.enabled() : false;
const sfx = n => { if (!muted && A) try { A.play(n); } catch (e) {} };
const soon = (p, ms) => Promise.race([p || Promise.resolve(), new Promise(r => setTimeout(r, ms))]);
const sayWord = (w, rate) => muted || !T ? wait(350) : soon(T.word(w, rate ? { rate } : undefined), 2600);
const saySound = l => muted || !T ? wait(250) : soon(T.sound(l), 1400);
const sayLine = s => muted || !T ? wait(500) : soon(T.sentence(s), 3500);
const wait = ms => new Promise(r => setTimeout(r, ms));
const tweens = [];
function tween(dur, fn, ease = t => 1 - Math.pow(1 - t, 3)){ return new Promise(r => tweens.push({ t0: performance.now(), dur, fn, ease, r })); }
function paintSnd(){ $('snd').innerHTML = I(muted ? 'bell-off' : 'bell'); $('snd').classList.toggle('off', muted); }
$('snd').onclick = () => { muted = !muted; if (A) A.setEnabled(!muted); if (muted && T) T.stop(); paintSnd(); };
$('ic').innerHTML = I('tree'); $('iChant').innerHTML = I('note'); $('iFind').innerHTML = I('ear'); $('iWrite').innerHTML = I('pencil'); paintSnd();

/* ── 화면 자리 ── */
const v3 = new THREE.Vector3();
function screenOf(obj, dy = 0){ obj.getWorldPosition(v3); v3.y += dy; v3.project(cam); return [(v3.x + 1) / 2 * innerWidth, (1 - v3.y) / 2 * innerHeight]; }
function tagAt(g, letter){ const [x, y] = screenOf(g, g.userData.w === 'bird' ? 3.4 : g.userData.w === 'bag' ? 2.6 : 1.9); const d = document.createElement('div'); d.className = 'tag'; d.textContent = letter; d.style.setProperty('--x', x + 'px'); d.style.setProperty('--y', y + 'px'); document.body.appendChild(d); setTimeout(() => d.remove(), 1550); }
function tip(s, ms){ const t = $('tip'); t.textContent = s; t.classList.add('show'); clearTimeout(tip.t); if (ms) tip.t = setTimeout(() => t.classList.remove('show'), ms); }

/* ── 물건 하나가 제 몸짓을 한다 ── */
const letterOf = w => CONF.words.find(x => x.w === w).l;
function act(w, dur = 900){ const g = things[w]; if (g.userData.busy) return Promise.resolve(); g.userData.busy = true; return tween(dur, t => g.userData.act(t), t => t).then(() => { g.userData.act(0); g.userData.busy = false; }); }
function hop(g, h = 0.5, dur = 420){ return tween(dur, t => { g.position.y = (g.userData.home ? g.userData.home.y : 0) + Math.sin(t * Math.PI) * h; }, t => t); }
function mood(p, m, ms){ p.userData.mood = m; if (ms) setTimeout(() => { if (p.userData.mood === m) p.userData.mood = 'idle'; }, ms); }
async function poke(w){ sfx('pop'); tagAt(things[w], letterOf(w)); act(w); await sayWord(w); }

/* ── 챈트(듣기 단) — Max 가 발을 구르고, 낱말 자리에서 그 물건이 들썩인다 ── */
let mode = null, chantHalf = 0;
function bubble(html){ const b = $('bub'); if (html == null) { b.classList.remove('show'); return; } b.innerHTML = html; b.classList.add('show'); }
function stomp(){ max.userData.stomp = 1; sfx('belt'); }
async function chant(){
  if (mode) return; mode = 'chant'; setDock('bChant');
  const letter = chantHalf % 2 ? 'b' : 'a', list = CONF.words.filter(x => x.l === letter), beat = 60000 / CONF.bpm;
  mood(max, 'lead');
  for (const x of list) {
    if (mode !== 'chant') break;
    bubble('<span class="cell">' + letter + '</span><span class="cell">' + letter + '</span><span class="cell snd">/' + letter + '/</span><span class="cell snd">/' + letter + '/</span><span class="cell pic">' + PlayArt.html(x.w) + '</span>');
    const cells = $('bub').children, on = k => Array.prototype.forEach.call(cells, (c, i) => c.classList.toggle('on', i === k));
    on(0); stomp(); await wait(beat); await wait(beat * 0.5); on(1); await wait(beat * 0.5); stomp(); await wait(beat);
    on(2); stomp(); saySound(letter); await wait(beat); on(3); saySound(letter); await wait(beat);
    on(4); stomp(); tagAt(things[x.w], letter); act(x.w, beat * 1.8); await sayWord(x.w); await wait(beat * 0.6);
  }
  if (mode === 'chant') { bubble('<span class="say">' + (letter === 'a' ? 'Hi, ant!' : 'Hi, big bird!') + '</span>'); mood(max, 'happy', 1400); act(letter === 'a' ? 'ant' : 'bird', 1200); await sayLine(letter === 'a' ? 'Hi, ant!' : 'Hi, big bird!'); await wait(500); }
  chantHalf++; bubble(null); mood(max, 'idle'); mode = null; setDock(null);
}
/* ── 듣고 찾기 — 들린 것을 빈터에서 찾아 누른다 ── */
let want = null, found = 0, misses = 0;
async function find(){
  if (mode) return; mode = 'find'; setDock('bFind'); found = 0;
  const order = CONF.words.map(x => x.w).sort(() => Math.random() - 0.5).slice(0, CONF.finds);
  for (const w of order) {
    if (mode !== 'find') break;
    want = w; misses = 0; bubble('<span class="cell pic">' + I('ear') + '</span>'); mood(max, 'lead', 600); await sayWord(w);
    await new Promise(r => { find.next = r; });
    found++; await wait(450);
  }
  want = null; if (mode === 'find') { sfx('done'); mood(max, 'happy', 1600); people.forEach(p => p !== max && mood(p, 'happy', 1600)); bubble('<span class="say">I like it!</span>'); await sayLine('I like it!'); await wait(400); }
  bubble(null); mode = null; setDock(null);
}
async function answer(w){
  if (!want || answer.busy) return; answer.busy = true;
  if (w === want) { sfx('ok'); tagAt(things[w], letterOf(w)); mood(max, 'happy', 900); mood(me, 'happy', 900); await act(w, 800); const r = find.next; find.next = null; want = null; answer.busy = false; if (r) r(); return; }
  misses++; sfx('soft'); mood(max, 'tilt', 900); act(w, 500); await sayWord(w, 0.9); await wait(200);
  if (misses >= 2) hop(things[want], 0.6, 600);                 /* 두 번 다르면 찾는 것이 들썩 */
  await sayWord(want, 0.8); answer.busy = false;
}
/* ── 팻말에 쓰기 — 손으로 쓴 a·b 가 빈터 팻말에 붙는다 ── */
async function writeSign(){
  if (mode || !PW) return; mode = 'write'; setDock('bWrite'); $('dock').classList.add('hide');
  for (const l of ['a', 'b']) {
    if (mode !== 'write') break;
    $('sheetL').textContent = l; $('pad').innerHTML = ''; $('sheet').classList.add('show'); saySound(l);
    const res = await new Promise(r => { writeSign.cancel = () => r(null); PW.write($('pad'), { text: l, mode: 'trace', strict: true, key: l, onLetter: () => sfx('pop'), onMiss: () => { sfx('soft'); saySound(l); } }).then(r); });
    if (!res) break;
    paintSign(); sfx('ok'); hop(signG, 0.35, 500); mood(mina, 'happy', 1000); await wait(700);
  }
  $('sheet').classList.remove('show'); $('pad').innerHTML = ''; $('dock').classList.remove('hide'); mode = null; setDock(null);
}
$('sheetX').onclick = () => { if (writeSign.cancel) writeSign.cancel(); };
function setDock(id){ ['bChant', 'bFind', 'bWrite'].forEach(b => $(b).classList.toggle('on', b === id)); $('dock').classList.toggle('busy', !!id); }
$('bChant').onclick = () => { if (mode === 'chant') { mode = 'stop'; return; } chant(); };
$('bFind').onclick = () => { if (mode === 'find') { mode = 'stop'; if (find.next) find.next(); return; } find(); };
$('bWrite').onclick = () => writeSign();

/* ── 누르기 · 살짝 돌리기 ── */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let drag = null, yaw0 = yaw, pitch0 = pitch;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; yaw0 = yaw; pitch0 = pitch; });
addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 8) drag.moved = true; if (!drag.moved) return;
  yaw = Math.max(CONF.cam.yawMin, Math.min(CONF.cam.yawMax, yaw0 - dx * 0.003)); pitch = Math.max(CONF.cam.pitchMin, Math.min(CONF.cam.pitchMax, pitch0 + dy * 0.0025)); place(); });
addEventListener('pointerup', e => { const d = drag; drag = null; if (d && !d.moved && e.target === cv) tap(e); });
function tap(e){
  if (!entered) return; if (A) A.unlock(); if (T) T.unlock();
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ptr, cam);
  const hit = ray.intersectObjects(Object.values(things).concat([signG, treeA.userData.fruit, treeB.userData.fruit]).concat(people), true)[0]; if (!hit) return;
  let o = hit.object; while (o && !(o.userData && o.userData.w) && o !== signG && o !== treeA.userData.fruit && o !== treeB.userData.fruit && people.indexOf(o) < 0) o = o.parent;
  if (!o) return;
  if (o === signG) { if (!mode) writeSign(); return; }
  if (o === treeA.userData.fruit || o === treeB.userData.fruit) { const l = o === treeA.userData.fruit ? 'a' : 'b'; sfx('pop'); tween(500, t => { o.scale.setScalar(1 + Math.sin(t * Math.PI) * 0.35); }, t => t); saySound(l); return; }
  if (people.indexOf(o) >= 0) { mood(o, 'happy', 900); sfx('pop'); if (o === max && !mode) chant(); return; }
  if (mode === 'find') return answer(o.userData.w);
  if (mode === 'chant' || mode === 'write') return;
  poke(o.userData.w);
}

/* ── 들어가기 — a 열매가 톡 떨어져 Max 발 앞으로 굴러온다(오늘의 사건 「굴러간 열매」) ── */
let entered = false;
async function enter(){
  if (A) A.unlock(); if (T) T.unlock();
  $('cover').classList.add('hide'); entered = true;
  const f = treeA.userData.fruit, from = f.position.clone(), land = new THREE.Vector3(-0.6, 0.5, 2.9), end = new THREE.Vector3(3.9, 0.5, 2.7);   /* 나무 기준 자리 */
  await wait(700); sfx('pop');
  await tween(520, t => { f.position.lerpVectors(from, land, t); f.position.y = from.y + (land.y - from.y) * t * t; }, t => t); sfx('tray');
  await tween(1500, t => { f.position.lerpVectors(land, end, t); f.position.y = 0.5 + Math.abs(Math.sin(t * Math.PI * 3)) * 0.25 * (1 - t); f.rotation.z = -t * Math.PI * 4; });
  mood(max, 'happy', 1200); bubble('<span class="say">Oh! Listen!</span>'); await sayLine('Oh! Listen!'); await wait(300); bubble(null);
  $('dock').classList.remove('hide'); tip('빈터의 물건을 눌러 봐 — 이름이 들려', 5000);
  await chant();
  /* 열매는 나무로 돌아간다 */
  const back = f.position.clone(); tween(900, t => { f.position.lerpVectors(back, from, t); f.position.y += Math.sin(t * Math.PI) * 1.2; f.rotation.z = 0; });
}
$('go').onclick = enter;

/* ── 매 장면 ── */
const clock = new THREE.Clock(); let fpsT = 0, fpsN = 0, lowChecked = LOW;
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();
  for (let i = tweens.length - 1; i >= 0; i--) { const k = tweens[i], p = Math.min(1, (now - k.t0) / k.dur); k.fn(k.ease(p)); if (p >= 1) { tweens.splice(i, 1); k.r(); } }
  /* 살아 있는 것 — 개미 줄 · 악어 눈 · 버스 김 · 새 · 나뭇잎 · 햇살 먼지 */
  things.ant.userData.ants.forEach(a => { const k = (a.userData.k + t * 0.07) % 1, ang = k * Math.PI * 2; a.position.x = Math.cos(ang) * 0.95; a.position.z = Math.sin(ang) * 0.5; a.rotation.y = -ang - Math.PI / 2; if (!things.ant.userData.busy) a.position.y = Math.abs(Math.sin(t * 9 + a.userData.k * 20)) * 0.03; });
  { const al = things.alligator.userData; if (!things.alligator.userData.busy) al.body.position.y = 0.02 + Math.sin(t * 1.1) * 0.05; al.eyes.forEach(e => e.scale.y = (t % 4.2 < 0.14) ? 0.15 : 1); }
  things.bus.userData.steam.forEach(s => { s.t = (s.t + dt * 0.3) % 1; const k = s.t; s.m.position.set(0.9 + Math.sin(k * 7) * 0.12, 2.0 + k * 1.5, Math.cos(k * 5) * 0.08); s.m.scale.setScalar(0.5 + k * 1.3); s.m.material.opacity = Math.sin(k * Math.PI) * 0.6; });
  if (!things.bird.userData.busy) { const b = things.bird.userData.b; b.rotation.y = Math.sin(t * 0.7) * 0.5; b.position.y = 2.42 + (t % 3.1 < 0.25 ? Math.sin((t % 3.1) / 0.25 * Math.PI) * 0.1 : 0); }
  if (!things.bag.userData.busy) things.bag.userData.sw.rotation.z = Math.sin(t * 1.3) * 0.04;
  treeA.userData.crown.rotation.z = Math.sin(t * 0.6) * 0.012; treeB.userData.crown.rotation.z = Math.sin(t * 0.55 + 1) * 0.012;
  const pa = dust.geometry.attributes.position; for (let i = 0; i < dN; i++) { pa.array[i * 3 + 1] += dt * 0.07; pa.array[i * 3] += Math.sin(t * 0.5 + i) * dt * 0.05; if (pa.array[i * 3 + 1] > 4.6) pa.array[i * 3 + 1] = 0.4; } pa.needsUpdate = true;
  people.forEach((p, i) => { const u = p.userData;
    u.stomp = Math.max(0, u.stomp - dt * 4.5);
    if (u.mood === 'happy') { u.body.position.y = Math.abs(Math.sin(t * 7 + i)) * 0.3; u.arms.forEach((a, s) => { a.rotation.z = (s ? 1 : -1) * 2.6; }); u.mouth.scale.set(1.3, 1.6, 1); u.eyes.forEach(e => e.scale.y = 0.5); u.head.rotation.z = 0; }
    else if (u.mood === 'tilt') { u.head.rotation.z += (0.28 - u.head.rotation.z) * 0.15; u.mouth.scale.set(0.6, -0.6, 1); u.arms[1].rotation.z = 2.2; u.body.position.y = 0; }
    else if (u.mood === 'lead') { u.body.position.y = -u.stomp * 0.12 + Math.sin(u.stomp * Math.PI) * 0.16; u.body.scale.y = 1 - u.stomp * 0.08; u.arms.forEach((a, s) => { a.rotation.z = (s ? 1 : -1) * (0.5 + u.stomp * 1.2); }); u.mouth.scale.set(1.2, 1.4, 1); u.eyes.forEach(e => e.scale.y = 1.35); u.head.rotation.z = Math.sin(t * 3) * 0.06; }
    else { u.body.position.y = Math.sin(t * 2 + i) * 0.02; u.body.scale.y = 1; u.head.rotation.z *= 0.85; u.arms.forEach((a, s) => { a.rotation.z = (s ? 1 : -1) * 0.15; }); u.mouth.scale.set(1, 1, 1); u.eyes.forEach(e => e.scale.y = ((t + i * 1.3) % 3.5 < 0.12) ? 0.15 : 1.35); }
    if (p !== max && mode === 'chant') u.body.position.y = max.userData.stomp * 0.1;           /* 둘은 박자에 맞춰 까딱 */
  });
  /* 말풍선은 Max 머리 위 */
  { const b = $('bub'); if (b.classList.contains('show')) { const [x, y] = screenOf(max.userData.head, 0.95); b.style.transform = 'translate(' + (x - b.offsetWidth / 2) + 'px,' + (y - b.offsetHeight) + 'px)'; } }
  comp.render();
  if (!lowChecked) { fpsN++; fpsT += dt; if (fpsT > 2) { lowChecked = true; if (fpsN / fpsT < 40) { if (ao) ao.enabled = false; bloom.enabled = false; R.setPixelRatio(1); resize(); } } }   /* 느린 기기면 가볍게 */
  if (!window.__pause) requestAnimationFrame(frame);
}
frame();
$('ldT').textContent = '숲속 빈터에 아침이 왔어요'; $('go').style.display = '';
window.__glade = { frame, things, people, enter, chant, find, writeSign, poke, answer, paintSign, get mode(){ return mode; }, get want(){ return want; }, cam, CONF };
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>모형 한 장 보기 | 영어 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../play.css">
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }
</script>
<style>
/* ============================================================
 * 모형 한 장 보기 (WG0 · 모형 설계 v1 §4)
 *   숲 둘레에 쓰는 모형(assets/models — Quaternius CC0)을 놀이터의 색 토큰으로 입혀 한 화면에 늘어놓는다. 준호가 고를 때 본다.
 *   모형은 꼴만 쓴다 — 색은 content/models/kit.js 의 표(재질 이름 → 토큰). 「잎 색」 단추로 그 걸음이 정하는 잎 색을 바꿔 본다.
 *   이름(파일 이름)은 어른이 보는 것 — 「이름 보기」 를 눌러야 뜬다.
 * ============================================================ */
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ml-top{position:fixed;left:124px;right:12px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3}
.ml-top h1{margin:0 8px 0 0;font-size:18px;font-weight:700;color:var(--ink)}
.ml-top .btn{min-height:40px;padding:0 14px;font-size:14px}
.ml-top .btn.on{background:var(--stage);color:var(--surface)}
.ml-note{position:fixed;left:16px;bottom:12px;font-size:13px;color:var(--ink-2);z-index:3}
.ml-tag{position:fixed;left:0;top:0;padding:2px 6px;border-radius:var(--r-1);background:var(--surface);color:var(--ink-2);font-size:11px;font-family:var(--font-en);white-space:nowrap;pointer-events:none;transform-origin:0 0;z-index:2;box-shadow:var(--shadow)}
.ml-tags.hide{display:none}
</style>
</head>
<body data-palette="forest">
<canvas id="cv"></canvas>
<div class="ml-top"><h1>모형 한 장 보기</h1><button type="button" class="btn w" id="names">이름 보기</button><span id="leafs"></span></div>
<div class="ml-tags hide" id="tags"></div>
<p class="ml-note" id="note"></p>
<script type="module">
import { createKit, THREE } from '../core/diorama.js';
import { MODELS, MODEL_CONF } from '../content/models/kit.js';
import { loadOne, modelOf } from '../core/models.js';

/* ── 상수는 여기 한 곳 ── cols 한 줄에 몇 개 · gap 칸 사이 · s 세우는 크기(종류마다) · leafs 잎 색 보기(그 걸음이 정하는 색) */
const CONF = { cols: 9, gap: 2.5, view: { yaw: 0.0, pitch: 0.62, dist: 30 },
  s: [[/Tree|Willow/, 2.4], [/Bush|Wheat/, 1.3], [/Stump|Rock/, 1.2], [/Log/, 1.7], [/Lilypad/, 0.9], [/./, 0.9]],      /* 가장 긴 쪽의 길이 */
  leafs: [['풀빛', 'a-leaf'], ['짙은 숲', ['stage-deep', 'a-leaf', 0.5]], ['물빛', ['a-leaf', 'a-fish', 0.3]], ['가을빛', ['a-leaf', 'a-gold', 0.55]]] };
const $ = id => document.getElementById(id), K = createKit({ canvas: $('cv') }), names = Object.keys(MODELS), rows = Math.ceil(names.length / CONF.cols);
K.view = a => Math.max(rows * CONF.gap * 0.62, CONF.cols * CONF.gap * 0.56 / a);
const eye = K.eye({ yaw: CONF.view.yaw, pitch: CONF.view.pitch, dist: CONF.view.dist, drift: 0, ease: 3, far: 1, yawMin: CONF.view.yaw, yawMax: CONF.view.yaw, pitchMin: CONF.view.pitch, pitchMax: CONF.view.pitch, home: h => h.set(0, 0.6, 0) });
K.sky([['a-fish', 'surface', 0.4], ['surface', 'a-fish', 0.15], 'bg']); K.light('day', {});
const ground = K.flat(K.rshape(CONF.cols * CONF.gap + 4, rows * CONF.gap + 4, 0.6), K.M(K.mix('a-leaf', 'stage-deep', 0.25), { roughness: 1 }), 0); K.S.add(ground);
const group = new THREE.Group(); K.S.add(group);
const sOf = n => CONF.s.find(r => r[0].test(n))[1], at = i => [((i % CONF.cols) - (CONF.cols - 1) / 2) * CONF.gap, (Math.floor(i / CONF.cols) - (rows - 1) / 2) * CONF.gap];
let leaf = CONF.leafs[0][1], protos = {}, placed = [];
function build(){ while (group.children.length) group.remove(group.children[0]); placed = [];
  names.forEach((n, i) => { const p = protos[n]; if (!p) return; const [x, z] = at(i), m = modelOf(K, p, { s: sOf(n), tones: { leaf } }); m.position.set(x, 0, z); m.rotation.y = 0.5; group.add(m); placed.push({ n, m }); });
  $('note').textContent = '모형 ' + placed.length + ' / ' + names.length + ' · 세모 ' + Math.round(placed.reduce((a, q) => a + q.m.userData.tris, 0)) + ' · 파일 ' + names.reduce((a, n) => a + MODELS[n].kb, 0) + 'KB'; tags(); }
function tags(){ $('tags').innerHTML = ''; placed.forEach(q => { const t = document.createElement('span'); t.className = 'ml-tag'; t.textContent = q.n; $('tags').appendChild(t); q.tag = t; }); }
CONF.leafs.forEach((l, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn w' + (i ? '' : ' on'); b.textContent = l[0]; b.onclick = () => { leaf = l[1]; [...$('leafs').children].forEach(x => x.classList.toggle('on', x === b)); build(); }; $('leafs').appendChild(b); });
$('names').onclick = () => { const on = $('tags').classList.toggle('hide') === false; $('names').classList.toggle('on', on); };
Promise.all(names.map(n => loadOne(K, n, MODEL_CONF.base).then(p => { if (p) protos[n] = p; }))).then(() => { build(); window.__lab = { K, placed, protos, names, CONF, ready: true }; });
K.resize(); addEventListener('resize', () => K.resize());
let last = performance.now();
function frame(now){ const dt = Math.min(0.05, (now - last) / 1000); last = now; K.runTweens(now); eye.step(dt, now / 1000);
  if (!$('tags').classList.contains('hide')) placed.forEach(q => { const s = K.screenOf(q.m, -0.1); if (q.tag) q.tag.style.transform = 'translate(' + (s[0] - 26) + 'px,' + (s[1] + 4) + 'px)'; });
  K.render(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

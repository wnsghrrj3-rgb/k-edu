<script>
/* 한 해 길의 걸음 — 걸음 하나를 2D 로 돌린다(입체 방은 W15~). 무대 페이지는 걸음과 겉모습만 넘긴다 — 하루 흐름은 core/stage.js,
   세 날(만나는 날·읽는 날·쓰는 날)의 조립은 core/assemble.js 의 day(), 재료는 data/path.js(생성 파일).
   주소 ?step= 이 없거나 아직 안 열린 걸음이면 지금 걸음으로 */
(function(){
  var m = /[?&]step=([A-F]\d\d)/.exec(location.search), cur = PlayPath.current(PlaySeed), manual = /[?&]set=/.test(location.search);
  var id = m && (manual || PlayPath.open(m[1], PlaySeed)) ? m[1] : (cur ? cur.id : PlayPath.steps()[PlayPath.steps().length - 1].id);
  var Z = PlayPath.zone(id);
  document.getElementById('title').textContent = Z.name;
  PlayStage.start({
    icon: Z.icon,
    zone: Z,
    sign: Z.cellName, host: Z.host, wear: Z.wear, where: Z.where,
    open: { en: 'I like it!', ko: '다음 걸음의 길이 열렸어!' }, opened: '다음 걸음의 길이 열렸어요!',
    seedHint: '말로 하면 씨앗이 심겨요.',
    endNote: '내일 다시 와서 말해 주면 새싹이 돼요.<br>며칠 뒤엔 글자를 맞춰 꽃을 피우고, 그다음엔 써서 열매를 맺어요.',
    nextNote: '다음 걸음으로 가는 길이 열렸어요.'
  });
})();
</script>

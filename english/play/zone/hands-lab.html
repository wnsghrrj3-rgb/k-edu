<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>손짓 시험판 | 영어 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../play.css">
<style>
/* ============================================================
 * 손짓 시험판 (WD0 · 다름 설계 v1 ⑨ 손짓)
 *   한 화면에 손짓마다 한 칸 — 흔들기 · 끌어 놓기 · 꾹 눌렀다 놓기 · 던지기 · 문지르기 · (WA2) 당기기 · 이어 긋기 · 돌리기 · 두드리기. 준호가 태블릿에서 아이 손으로 문턱을 본다.
 *   칸마다 손짓 부품(core/hands.js — 2D 판의 한 칸)이 「골랐다 · 놓았다」 를 알리고, 판정 뼈대(core/frames.js)가 맞는지 본다.
 *   고르기 칸(흔들기 · 꾹 · 문지르기 · 당기기 · 돌리기 · 두드리기) = 위에 뜬 그림과 같은 것에 손짓 / 가르기 칸(끌어 놓기 · 던지기 · 이어 긋기) = 그림을 첫 글자 칸으로 옮긴다(긋기는 길을 잇는다).
 *   아래 한 줄은 어른이 보는 것 — 방금 손짓으로 됐는지, 누르기로 도와서 됐는지, 증거에 적히는 손의 갈래.
 *   낱말은 그 손짓을 쓰는 걸음의 입말 낱말(한 해 길 자료). 수 · 점수 · 시간은 없다.
 * ============================================================ */
body{background:var(--bg)}
.hl-top{padding:14px 16px 4px 124px;min-height:44px}
.hl-top h1{margin:0;font-size:20px;font-weight:700;color:var(--ink)}
.hl-tip{padding:0 16px 8px 124px;font-size:14px;color:var(--ink-2)}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:8px 16px 28px}
.hl-card{background:var(--surface);border-radius:var(--r-3);box-shadow:var(--shadow);padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;min-height:330px}
.hl-head{display:flex;align-items:center;gap:10px}
.hl-head b{font-size:17px;color:var(--ink)}
.hl-head .hl-want{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink-2)}
.hl-want .hl-pic{width:44px;height:44px;border-radius:var(--r-2);background:var(--stage-soft);display:flex;align-items:center;justify-content:center}
.hl-want .hl-pic svg,.hl-want .hl-pic .art{width:34px;height:34px}
.hl-how{font-size:14px;color:var(--ink-2);min-height:20px}
.hl-stage{flex:1;border-radius:var(--r-2);background:var(--stage-2-soft);display:flex;align-items:center;justify-content:center}
.hl-log{font-size:13px;color:var(--ink-3);min-height:18px}
.hl-card.ok .hl-stage{background:var(--stage-soft)}
</style>
</head>
<body data-palette="forest">
<div class="hl-top"><h1>손짓 시험판</h1></div>
<p class="hl-tip">칸마다 그 손짓으로 해 보세요. 손짓이 어려우면 그냥 눌러도 됩니다(세 번 누르면 받아 줍니다 · 끌어 놓기와 던지기는 그림을 누르고 칸을 누르기).</p>
<div class="hl-grid" id="grid"></div>

<script src="../ui/icons.js"></script>
<script src="../content/art/art.js"></script>
<script src="../content/art/food.js"></script>
<script src="../content/art/home.js"></script>
<script src="../content/art/farm.js"></script>
<script src="../content/art/forest.js"></script>
<script src="../content/art/school.js"></script>
<script src="../content/art/action.js"></script>
<script src="../content/art/mirror.js"></script>
<script src="../content/art/things.js"></script>
<script src="../content/art/glade.js"></script>
<script src="../core/hands.js"></script>
<script src="../core/frames.js"></script>
<script>
(function(){
  /* ── 상수는 여기 한 곳 ── 칸마다: 손짓 · 뼈대(pick 고르기 | sort 가르기) · 낱말 · 하는 법 한 줄 */
  var CONF = { nextMs: 900, cells: [
    { hand: 'shake', frame: 'pick', words: ['apple', 'ant', 'ax'],          how: '위의 그림과 같은 것을 잡고 좌우로 흔들어요' },
    { hand: 'drag',  frame: 'sort', words: ['cat', 'cup', 'dog', 'desk'],   how: '그림을 첫 글자 칸으로 끌어다 놓아요' },
    { hand: 'hold',  frame: 'pick', words: ['egg', 'elf', 'fox'],           how: '위의 그림과 같은 것을 꾹 누르고 있다가 테가 차면 놓아요' },
    { hand: 'throw', frame: 'sort', words: ['goat', 'gum', 'hat', 'hen'],   how: '그림을 첫 글자 칸 쪽으로 튕겨 던져요' },
    { hand: 'rub',   frame: 'pick', words: ['ink', 'jam', 'jug'],           how: '위의 그림과 같은 것을 이리저리 문질러요' },
    { hand: 'pull',  frame: 'pick', words: ['kite', 'key', 'lamp'],         how: '위의 그림과 같은 것을 잡고 아래로 쭉 당겨요' },
    { hand: 'line',  frame: 'sort', words: ['moon', 'map', 'net', 'nut'],   how: '그림에서 첫 글자 칸까지 손가락으로 이어 그어요' },
    { hand: 'spin',  frame: 'pick', words: ['octopus', 'pot', 'panda'],     how: '위의 그림과 같은 것의 둘레를 빙글 돌려요' },
    { hand: 'knock', frame: 'pick', words: ['queen', 'ring', 'robot'],      how: '위의 그림과 같은 것을 똑똑 두 번 두드려요' }
  ] };
  var $ = function(id){ return document.getElementById(id); }, art = function(w){ return window.PlayArt ? PlayArt.html(w) : w; }, cells = [];
  CONF.cells.forEach(function(c){
    var card = document.createElement('div'); card.className = 'hl-card'; card.setAttribute('data-hand', c.hand);
    card.innerHTML = '<div class="hl-head"><b>' + PlayHands.NAME[c.hand] + '</b><span class="hl-want"><span class="hl-ask"></span><span class="hl-pic"></span></span></div><div class="hl-how">' + c.how + '</div><div class="hl-stage"></div><div class="hl-log"></div>';
    $('grid').appendChild(card);
    var stage = card.querySelector('.hl-stage'), log = card.querySelector('.hl-log'), want = card.querySelector('.hl-pic'), ask = card.querySelector('.hl-ask'), fr = null, cur = null, last = null;
    var letters = c.words.map(function(w){ return w.charAt(0); }).filter(function(l, i, a){ return a.indexOf(l) === i; });
    var cell = PlayHands.cell(stage, c.hand, {
      items: c.frame === 'pick' ? c.words.map(function(w){ return { id: w, html: art(w) }; }) : [{ id: 'it', html: '' }],
      zones: c.frame === 'sort' ? letters.map(function(l){ return { id: l, html: l }; }) : [],
      on: function(e){
        if (e.type !== 'choose' && e.type !== 'put') return; if (!fr || fr.done) return;
        var r = fr.answer(c.frame === 'pick' ? e.id : e.zone, e.by);
        if (r.ok) { last = r; card.classList.add('ok'); log.textContent = (e.by === 'gesture' ? '손짓으로 됐어요' : '누르기로 도와서 됐어요') + ' · 증거: ' + (r.evidence.mode === 'drag' ? '끌기' : '누르기') + (r.evidence.clean ? ' · 한 번에' : ' · 다시 해서');
          if (c.frame === 'pick') cell.lit(e.id); else if (c.hand !== 'line') cell.gone('it'); setTimeout(next, CONF.nextMs); }
        else { log.textContent = '다른 것이에요 — 다시 해 봐요'; if (c.frame === 'sort') cell.home('it'); }
      } });
    function next(){ card.classList.remove('ok'); cell.reset(); var pool = c.words.filter(function(w){ return w !== cur; }); cur = pool[(Math.random() * pool.length) | 0];
      if (c.frame === 'pick') { fr = PlayFrames.pick({ want: cur, hand: c.hand }); ask.textContent = '이것을'; want.innerHTML = art(cur); }
      else { fr = PlayFrames.sort({ item: cur, bin: cur.charAt(0), hand: c.hand }); ask.textContent = '이 그림을'; want.innerHTML = art(cur); cell.items.it.querySelector('.ph-pic').innerHTML = art(cur); } }
    next(); cells.push({ conf: c, cell: cell, card: card, get frame(){ return fr; }, get want(){ return cur; }, get last(){ return last; } });
  });
  window.__lab = { cells: cells, CONF: CONF };
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

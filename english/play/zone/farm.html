/* 동물 농장 — Lv1 동물 칸 · 단어와 그림 칸이 한 무대. 첫 칸은 소리 숲 a 칸(cat 읽기)을 마치면 열린다(사다리 차례 — data/zones.js gates).
   무대 페이지는 구역과 겉모습만 넘긴다 — 하루 흐름은 core/stage.js, 놀이는 games/, 사건 표는 content/events/farm.js */
var CELL = PlayStage.pick('animal-farm');
PlayStage.cellbar(document.getElementById('cellbar'), 'animal-farm', CELL.id);
PlayStage.start({
  icon: 'barn',
  zone: CELL,
  sign: 'CAT · DOG · PIG', host: 'ben', wear: 'scarf', where: '농장',
  open: { en: 'I like it!', ko: '농장 문이 활짝 열렸어!' }, opened: '농장 문이 활짝 열렸어요!',
  seedHint: '말로 하면 씨앗이 심겨요.',
  endNote: '내일 다시 와서 말해 주면 새싹이 돼요.<br>3일에 꽃, 7일에 열매 — 열매가 된 동물은 나를 따라다니고<br>목수건을 두를 수 있어요.',
  nextNote: '다음 자리의 안개가 걷혔어요 — 놀이터에서 구경해 봐요.'
});
</script>

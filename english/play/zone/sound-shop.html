<script>
/* 소리 공방 — 칸 열둘이 한 무대. 무대 페이지는 「어느 칸인가」와 겉모습만 넘긴다(하루 흐름은 core/stage.js).
   열려 있는 칸 = 첫 칸 + 앞 칸이 열림 조건(특별 손님 + 단어 ¾ 이 꽃)을 채운 칸. 그 뒤는 안개. 주소 ?cell= 로 열린 칸을 고를 수 있다 */
(function(){
  var cells = PLAY_ZONES.zones.filter(function(z){ return z.stage === 'sound-shop'; });
  var open = PlayPhonics.openIndex(PlaySeed);
  var m = /[?&]cell=([\w-]+)/.exec(location.search), want = m ? cells.filter(function(z){ return z.id === m[1]; })[0] : null;
  var cur = want && cells.indexOf(want) <= open ? want : cells[open];
  PlayPhonics.machine(document.getElementById('machine'), PlaySeed, cur.id, function(z, locked){
    if (locked) { var t = document.getElementById('toast'); t.textContent = '앞 칸의 씨앗이 꽃이 되면 열려요 — 내일 또 와!'; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 1800); return; }
    if (z.id !== cur.id) location.href = '?cell=' + z.id;
  });
  PlayStage.start({
    icon: 'wrench',
    zone: cur,
    sign: 'SOUND SHOP', host: 'max', where: '공방',
    open: { en: 'Good! Good!', ko: '소리 기계에 불이 들어왔어!' }, opened: '소리 기계에 불이 들어왔어요!',
    seedHint: '소리 내어 읽으면 씨앗이 심겨요.',
    endNote: '내일 다시 와서 읽어 주면 새싹이 돼요.<br>3일에 꽃, 7일에 열매 — 꽃이 많아지면 다음 소리 칸이 열리고<br>열매가 되면 보안경을 쓸 수 있어요.',
    nextNote: '소리 기계의 불이 하나 더 켜졌어요.'
  });
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>소리 공방 | 영어 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../play.css">
<style>
  body{background:#EEF2FF}
  .top{background:rgba(238,242,255,.92)}
  .top .t{color:#3B5BDB}
  .shop{width:100%;max-width:520px;background:#fff;border-radius:26px;padding:14px 14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.08);position:relative}
  .sign{font-family:Jua;font-size:22px;text-align:center;padding:10px;border-radius:16px;background:#E2E8F0;color:#A0AEC0;letter-spacing:2px;transition:all .5s}
  .sign.fx-glow::before{background:linear-gradient(135deg,#4C6EF5,#74C0FC)}
  .sign.on{background:linear-gradient(135deg,#4C6EF5,#74C0FC);color:#fff;box-shadow:0 0 0 4px #DBE4FF,0 0 24px #74C0FC}
  .sam{display:flex;align-items:flex-end;gap:10px;margin:12px 0 6px}
  .sam .f{width:70px;height:76px;flex-shrink:0}
  .bub{background:#F1F3F9;border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:16px;line-height:1.45;flex:1;min-height:46px}
  .bub b{font-family:Jua;font-size:19px;color:#1A202C;display:block}
  .bub small{color:#A0AEC0;font-size:12.5px}
  .endcard{text-align:center}
  .endcard .big{font-size:60px}
  .endcard h2{font-family:Jua;font-size:22px;margin:6px 0}
  .endcard .note{font-size:14.5px;color:#4A5568;line-height:1.6}
  .seedrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .homebtn{margin-top:14px;display:flex;gap:8px;justify-content:center}
  .machinebar{width:100%;max-width:520px;margin:10px auto 0;padding:0 14px}
</style>
<script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>
<body>
<div class="top"><span class="t">🔧 소리 공방</span><span class="tr"><button class="snd" id="snd" type="button" aria-label="효과음">🔔</button><span class="seedbag" id="bag">🌰 0</span></span></div>
<div class="machinebar"><div class="machine" id="machine"></div></div>
<div class="actbar" id="actbar"></div>
<div class="stage" id="stage"></div>
<div class="toast" id="toast"></div>
<div class="fx" id="fx"></div>

<script src="../../v3/data/ladder.js"></script>
<script src="../../v3/engine/k-progress.js"></script>
<script src="../../v3/engine/k-tts.js"></script>
<script src="../../v3/engine/k-collection.js"></script>
<script src="../data/zones.js"></script>
<script src="../content/phonics.js"></script>
<script src="../content/events/sound.js"></script>
<script src="../engine/play-seed.js"></script>
<script src="../engine/play-speech.js"></script>
<script src="../engine/play-cam.js"></script>
<script src="../engine/play-char.js"></script>
<script src="../core/audio.js"></script>
<script src="../core/npc.js"></script>
<script src="../core/fx.js"></script>
<script src="../core/evidence.js"></script>
<script src="../core/scene.js"></script>
<script src="../core/game.js"></script>
<script src="../core/tutor.js"></script>
<script src="../core/event.js"></script>
<script src="../core/assemble.js"></script>
<script src="../core/decode.js"></script>
<script src="../core/stage.js"></script>
<script src="../games/garden.js"></script>
<script src="../games/legacy.js"></script>
<script src="../games/read-aloud.js"></script>
<script src="../games/sound-monster.js"></script>
<script src="../games/sound-jump.js"></script>
<script src="../games/sound-bridge.js"></script>
<script src="../games/sound-train.js"></script>
<script src="../games/sound-swap.js"></script>
<script src="../games/special-guest.js"></script>
<script>
/* 소리 공방 — 칸 열둘이 한 무대. 무대 페이지는 「어느 칸인가」와 겉모습만 넘긴다(하루 흐름은 core/stage.js).
   열려 있는 칸 = 첫 칸 + 앞 칸이 열림 조건(특별 손님 + 단어 ¾ 이 꽃)을 채운 칸. 그 뒤는 안개. 주소 ?cell= 로 열린 칸을 고를 수 있다 */
(function(){
  var cells = PLAY_ZONES.zones.filter(function(z){ return z.stage === 'sound-shop'; });
  var open = PlayPhonics.openIndex(PlaySeed);
  var m = /[?&]cell=([\w-]+)/.exec(location.search), want = m ? cells.filter(function(z){ return z.id === m[1]; })[0] : null;
  var cur = want && cells.indexOf(want) <= open ? want : cells[open];
  PlayPhonics.machine(document.getElementById('machine'), PlaySeed, cur.id, function(z, locked){
    if (locked) { var t = document.getElementById('toast'); t.textContent = '앞 칸의 씨앗이 꽃이 되면 열려요 — 내일 또 와!'; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 1800); return; }
    if (z.id !== cur.id) location.href = '?cell=' + z.id;
  });
  PlayStage.start({
    zone: cur,
    sign: 'SOUND SHOP', host: 'max', where: '공방',
    open: { en: 'Good! Good!', ko: '소리 기계에 불이 들어왔어!' }, opened: '소리 기계에 불이 들어왔어요!',
    seedHint: '🎤 소리 내어 읽으면 씨앗이 심겨요.',
    endNote: '내일 다시 와서 읽어 주면 🌱 새싹이 돼요.<br>3일에 🌸 꽃, 7일에 🍎 열매 — 꽃이 많아지면 다음 소리 칸이 열리고<br>열매가 되면 보안경을 쓸 수 있어요.',
    nextNote: '🔧 소리 기계의 불이 하나 더 켜졌어요.'
  });
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

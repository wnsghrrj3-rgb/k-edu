<script>
/* 변신 거울 — Lv2 몸·얼굴 · 기분 두 칸. 로봇 공장·크기·색 실험실(몸 칸) · 변신 거울 「I am ~.」(기분 칸).
   무대 페이지는 구역과 겉모습만 넘긴다 — 하루 흐름은 core/stage.js, 놀이는 games/, 사건 표는 content/events/ */
var CELL = PlayStage.pick('mirror');
PlayStage.cellbar(document.getElementById('cellbar'), 'mirror', CELL.id);
PlayStage.start({
  icon: 'mirror',
  zone: CELL,
  sign: 'MY FACE', host: 'amy', where: '거울 앞',
  open: { en: 'Good job!', ko: '거울이 반짝 빛났어!' }, opened: '거울이 반짝 빛났어요!',
  seedHint: '말로 하면 씨앗이 심겨요.',
  endNote: '내일 다시 와서 말해 주면 새싹이 돼요.<br>3일에 꽃, 7일에 열매 — 열매가 되면 거울 앞 옷장에 걸리고<br>모자를 쓸 수 있어요.',
  nextNote: '다음 자리의 안개가 걷혔어요 — 놀이터에서 구경해 봐요.'
});
</script>

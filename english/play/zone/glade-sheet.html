<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>글자 숲 한 장 보기 | 영어 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../play.css">
<style>
/* ============================================================
 * 글자 숲 한 장 보기 (WA0 · 무대 설계 v1 R7)
 *   구역의 걸음 첫 화면을 작은 그림으로 나란히 놓는다 — 글씨를 가리고도 어느 걸음인지 가릴 수 있어야 한다. 준호가 태블릿에서 이 한 장부터 본다.
 *   그림은 빈터 화면(glade.html?step=…&still=1)이 제 첫 화면을 한 장 그려 넘긴 것 — 한 번에 하나씩 그린다(기기가 버겁지 않게).
 *   걸음은 방 등록소(content/rooms/index.js)에서 읽는다 — 방을 더하면 여기에도 저절로 는다.
 *   이름은 처음엔 가려 둔다(「이름 보기」를 누르면 방 이름과 글자). 그림을 누르면 그 빈터로 간다.
 *   ㉡ 손 움직임 판(WD1 · 다름 설계 N9) — 걸음마다 그 걸음의 손짓이 되풀이해 보인다. 글씨를 가리고도 어느 걸음인지 가려져야 한다.
 * ============================================================ */
body{background:var(--bg)}
.gs-top{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;flex-wrap:wrap}
.gs-top h1{font-size:20px;font-weight:700;color:var(--ink);margin:0;flex:1 1 auto}
.gs-top button{border:0;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow);padding:10px 16px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);min-height:44px}
.gs-top button[aria-pressed="true"]{background:var(--stage);color:var(--on-stage)}
.gs-tip{padding:0 16px 10px 124px;min-height:34px;font-size:14px;color:var(--ink-2)}      /* 왼쪽은 「나가기」 단추 자리 */
.gs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:6px 16px 28px}
.gs-card{display:block;border:0;padding:0;margin:0;background:var(--surface);border-radius:var(--r-3);box-shadow:var(--shadow);overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer}
.gs-pic{position:relative;width:100%;aspect-ratio:4/3;background:var(--stage-soft);overflow:hidden}
.gs-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gs-pic iframe{position:absolute;left:0;top:0;width:800px;height:600px;border:0;transform-origin:0 0;pointer-events:none}
.gs-pic .gs-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink-2)}
.gs-name{display:flex;align-items:baseline;gap:8px;padding:10px 14px 12px;min-height:44px}
.gs-name b{font-size:16px;color:var(--ink)}
.gs-name span{font-family:var(--font-read);font-weight:700;font-size:16px;color:var(--stage)}
.gs-grid.hide .gs-name > *{visibility:hidden}
.gs-h{padding:10px 16px 0;font-size:16px;font-weight:700;color:var(--ink)}
.gs-move{position:relative;width:100%;aspect-ratio:4/3;background:var(--stage-2-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gs-move .ph-cell{pointer-events:none}
.gs-ghost{position:fixed;left:0;top:0;width:38px;height:38px;margin:-6px 0 0 -12px;color:var(--ink);opacity:.85;pointer-events:none;z-index:6;transition:opacity 200ms var(--ease)}
.gs-ghost svg{width:100%;height:100%}
.gs-ghost.down{color:var(--stage)}
</style>
</head>
<body data-palette="forest">
<div class="gs-top"><h1>글자 숲 한 장 보기</h1><button type="button" id="names" aria-pressed="false">이름 보기</button><button type="button" id="again">다시 그리기</button></div>
<p class="gs-tip" id="tip">빈터의 첫 화면을 하나씩 그리는 중이에요.</p>
<h2 class="gs-h">㉠ 첫 화면</h2>
<div class="gs-grid hide" id="grid"></div>
<h2 class="gs-h">㉡ 손 움직임 — 걸음마다 얼굴 놀이의 손짓</h2>
<div class="gs-grid hide" id="moves"></div>

<script src="../data/path.js"></script>
<script src="../data/path-differ.js"></script>
<script src="../ui/icons.js"></script>
<script src="../content/art/art.js"></script>
<script src="../content/art/food.js"></script>
<script src="../content/art/home.js"></script>
<script src="../content/art/farm.js"></script>
<script src="../content/art/forest.js"></script>
<script src="../content/art/school.js"></script>
<script src="../content/art/action.js"></script>
<script src="../content/art/mirror.js"></script>
<script src="../content/art/things.js"></script>
<script src="../content/art/glade.js"></script>
<script src="../core/hands.js"></script>
<script type="module">
import { ROOMS } from '../content/rooms/index.js';
/* ── 상수는 여기 한 곳 ── */
const CONF = { first: 'A01', w: 800, h: 600, waitMs: 45000 };      /* 기준판 걸음 · 그림 한 장을 그릴 때의 화면 크기 · 한 장을 기다리는 시간 */
const $ = id => document.getElementById(id), grid = $('grid');
const STEPS = [CONF.first].concat(Object.keys(ROOMS)).map(id => PLAY_PATH.steps.find(s => s.id === id)).filter(Boolean);
const cards = STEPS.map(st => { const b = document.createElement('button'); b.type = 'button'; b.className = 'gs-card'; b.setAttribute('aria-label', '빈터 그림');
  b.innerHTML = '<div class="gs-pic"><div class="gs-wait">기다리는 중</div></div><div class="gs-name"><b></b><span></span></div>';
  b.querySelector('b').textContent = st.room; b.querySelector('span').textContent = st.letters.join(' · ');
  b.onclick = () => { location.href = 'glade.html?step=' + st.id; }; grid.appendChild(b); return { st, el: b, pic: b.querySelector('.gs-pic') }; });
/* 이름 보기 · 가리기 */
$('names').onclick = () => { const on = grid.classList.toggle('hide') === false; $('moves').classList.toggle('hide', !on); $('names').setAttribute('aria-pressed', String(on)); $('names').textContent = on ? '이름 가리기' : '이름 보기'; };
/* 한 번에 하나씩 — 그 빈터 화면을 카드 안에서 열어 첫 화면 한 장을 받는다 */
let run = 0;
function draw(card, my){ return new Promise(done => {
  const pic = card.pic; pic.innerHTML = '<div class="gs-wait">그리는 중</div>';
  const f = document.createElement('iframe'); f.setAttribute('title', '빈터 그림'); f.setAttribute('tabindex', '-1'); f.style.transform = 'scale(' + (pic.clientWidth / CONF.w) + ')';
  let over = false; const end = png => { if (over) return; over = true; removeEventListener('message', on); clearTimeout(tm); f.remove(); if (my !== run) return done();
    if (png) { const im = new Image(); im.alt = ''; im.src = png; pic.innerHTML = ''; pic.appendChild(im); } else pic.innerHTML = '<div class="gs-wait">이 기기에서는 그리지 못했어요</div>'; done(); };
  const on = e => { if (e.origin === location.origin && e.data && e.data.gladeStill === card.st.id) end(e.data.png); };
  addEventListener('message', on); const tm = setTimeout(() => end(null), CONF.waitMs);
  f.src = 'glade.html?step=' + card.st.id + '&still=1'; pic.appendChild(f); }); }
async function drawAll(){ const my = ++run; $('tip').textContent = '빈터의 첫 화면을 하나씩 그리는 중이에요.';
  for (const c of cards) { if (my !== run) return; await draw(c, my); }
  if (my === run) $('tip').textContent = '이름을 가린 채로 어느 빈터인지 가려 보세요. 그림을 누르면 그 빈터로 가요.'; }
$('again').onclick = drawAll;
drawAll();
/* ── ㉡ 손 움직임 판(다름 설계 N9) — 걸음마다 그 걸음의 손짓(data/path-differ.js)이 5초쯤 되풀이해 보인다. 손짓 부품의 2D 칸(core/hands.js)에 보이지 않는 손이 진짜 손놀림을 넣는다 ──
   옮기는 손짓(끌어 놓기 · 던지기) = 그림을 첫 글자 칸으로 · 나머지(흔들기 · 꾹 · 문지르기) = 그림 셋 가운데 하나에 손짓 */
const MOVE = { everyMs: 5200, stepMs: 16 };
const art = w => (window.PlayArt ? PlayArt.html(w) : w), sleep = ms => new Promise(r => setTimeout(r, ms));
const moves = STEPS.filter(st => PlayHands.has(PLAY_PATH_DIFFER.steps[st.id].hand)).map(st => { const d = PLAY_PATH_DIFFER.steps[st.id], carry = PlayHands.CARRY[d.hand], words = st.oral.filter((w, i) => i % 3 === 0 || i === 1).slice(0, 3);
  const b = document.createElement('div'); b.className = 'gs-card'; b.innerHTML = '<div class="gs-move"></div><div class="gs-name"><b></b><span></span></div>'; b.querySelector('b').textContent = st.room; b.querySelector('span').textContent = PlayHands.NAME[d.hand] + ' · ' + d.sig; $('moves').appendChild(b);
  const cell = PlayHands.cell(b.querySelector('.gs-move'), d.hand, { items: carry ? [{ id: 'it', html: art(words[0]) }] : words.map(w => ({ id: w, html: art(w) })), zones: carry ? st.letters.map(l => ({ id: l, html: l })) : [],
    on: e => { if (e.type === 'choose') cell.lit(e.id); else if (e.type === 'put') { if (d.hand === 'line') cell.lit('it'); else cell.gone('it'); } } });
  return { st, d, carry, words, cell }; });
const mid = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
/* 카드마다 제 손(보이지 않는 손가락)이 제 박자로 되풀이한다 — 한 바퀴 = MOVE.everyMs 쯤 */
async function play(m){ const h = m.cell.hand, k = m.d.hand, it = m.carry ? m.cell.items.it : m.cell.items[m.words[0]], z = m.carry ? m.cell.zones[m.words[0].charAt(0)] : null, ghost = m.ghost; m.cell.reset(); await sleep(250);
  const [x, y] = mid(it), now = () => performance.now(); if (y < 0 || y > innerHeight) return; let gx = x, gy = y; const at = (ax, ay) => { gx = ax; gy = ay; ghost.style.transform = 'translate(' + ax + 'px,' + ay + 'px)'; };
  ghost.style.opacity = '.85'; at(x, y); await sleep(350); ghost.classList.add('down'); h.down(x, y, now());
  const go = async (tx, ty) => { h.move(tx, ty, now()); at(tx, ty); await sleep(MOVE.stepMs); };
  if (k === 'shake') for (let i = 0; i < 9; i++) for (let j = 1; j <= 4; j++) await go(x + (i % 2 ? -1 : 1) * j * 7, y);
  else if (k === 'rub') for (let i = 0; i < 30; i++) { await go(x + (i % 2 ? -20 : 20), y + (i % 3 - 1) * 6); await sleep(14); }
  else if (k === 'hold') { const t0 = now(); while (now() - t0 < 1050) { h.tick(now()); await sleep(40); } }
  else if (k === 'drag') { const [zx, zy] = mid(z); for (let i = 1; i <= 26; i++) await go(x + (zx - x) * i / 26, y + (zy - y) * i / 26); }
  else if (k === 'throw') { const [zx, zy] = mid(z), dx = zx - x, dy = zy - y, l = Math.hypot(dx, dy); for (let i = 1; i <= 6; i++) await go(x + dx / l * i * 12, y + dy / l * i * 12); }
  else if (k === 'pull') for (let i = 1; i <= 16; i++) await go(x, y + i * 7);
  else if (k === 'spin') { const r = it.getBoundingClientRect().width * 0.42; h.up(x, y, now()); h.down(x + r, y, now()); for (let i = 1; i <= 44; i++) await go(x + Math.cos(i * 0.13) * r, y + Math.sin(i * 0.13) * r); }
  else if (k === 'knock') { h.up(x, y, now()); await sleep(180); ghost.classList.remove('down'); await sleep(120); ghost.classList.add('down'); h.down(x, y, now()); }
  else if (k === 'line') { const [zx, zy] = mid(z); for (let i = 1; i <= 30; i++) await go(x + (zx - x) * i / 30 + Math.sin(i / 30 * Math.PI) * 26, y + (zy - y) * i / 30); }
  h.up(gx, gy, now()); ghost.classList.remove('down'); await sleep(500); ghost.style.opacity = '0'; }
moves.forEach((m, i) => { m.ghost = document.createElement('div'); m.ghost.className = 'gs-ghost'; m.ghost.innerHTML = window.PlayIcon ? PlayIcon.html('finger') : ''; m.ghost.style.opacity = '0'; document.body.appendChild(m.ghost);
  (async () => { await sleep(400 + i * 700); while (true) { const t0 = performance.now(); try { await play(m); } catch (e) {} await sleep(Math.max(900, MOVE.everyMs - (performance.now() - t0))); } })(); });
window.__sheet = { cards, STEPS, CONF, moves };
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

<style>
/* ============================================================
 * 사과 흔들기 — 몸 장면 시험판 (WM1 · 모션 사건 설계 v1 §3 · 한 해 길 A01 사건 ① 「굴러간 열매」의 앞머리)
 *   손을 흔들면 사과나무가 흔들리고, 떨어지는 사과를 손으로 받아 바구니에 넣는다 — 세 번. 바구니가 차면 a 열매가 톡 떨어져 Max 발 앞으로 굴러간다.
 *   마디: 0 입장(그림 단추 둘 — 손 흔드는 몸 / 손가락) → 1 흔들기 → 2 받기 → 3 넣기(챈트 한 줄 + 따라 말하기) ×3 → 4 끝(I like it! · a 열매) → 5 다시 / 빈터로
 *   빈터 장면(나무 · Max · 풀 · 개울 · 빛)은 입체 키트(core/diorama.js · core/diorama-people.js · content/rooms/glade.js) — 빈터 시험판과 같은 부품(W15 키트 분리).
 *   손은 engine/play-motion.js(카메라 손 추적 · 안 되면 손가락) · 놀이 로직은 core/shake-catch.js · 이 파일은 보이는 판만.
 *   화면 글은 낱말 띠뿐(조작 안내 글 0 — Max 의 몸짓 시범과 손 그림으로) · 숫자 · 타이머 · 실패 화면 0 · 모은 수는 바구니의 빈 자리로.
 *   시험판은 저장 0(씨앗 · 증거 · 진도) · 카메라 영상은 기기 안에서만 · 장면이 끝나면 카메라를 끈다.
 *   ?q=low = 가벼운 판 · ?mouse=1 = 카메라 없이 마우스로 손 추적 흉내(KMotion 마우스 모드).
 *   11-16 준호 「조금 속도감 · 사과가 1+1+1=3개라는 것도 같이」:
 *     · 셈 띠(core/sum-strip.js) — 바구니 위에 하나 넣을 때마다 한 칸씩: 1 → 1 + 1 = 2 → 1 + 1 + 1 = 3(더하는 수마다 사과 그림). 끝에는 크게 가운데로.
 *       글은 수와 기호뿐 — 영어 낱말은 늘리지 않았다(one·two·three 는 한 해 길 B09 에서 처음 나온다). 넣을 때마다 한 음씩 올라가는 소리.
 *     · 빠르기 — 흔들기가 덜 걸리고(PlayShakeCatch.CONF) 사과가 더 빨리 떨어지고, 챈트 박자 · 따라 말하기 틈 · 사이사이 기다림을 줄였다(아래 CONF).
 * ============================================================ */
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
.sndb{position:fixed;right:16px;top:12px;z-index:6;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);border:0;font-size:20px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.sndb.off{color:var(--ink-4)}
/* 낱말 띠(위) — 낱말이 들릴 때 그림 + 낱말(첫 글자 색). 누르면 다시 들린다 */
.gword{position:fixed;left:50%;top:14px;z-index:5;transform:translate(-50%,-14px) scale(.92);opacity:0;transition:opacity 200ms,transform 240ms var(--ease);display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.gword.show{opacity:1;transform:translate(-50%,0) scale(1)}
.gword .row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-3);padding:8px 24px 10px 16px;box-shadow:var(--shadow);transition:background 240ms}
.gword.show .row{pointer-events:auto}
.gword .p{font-size:clamp(40px,7vw,60px);line-height:1;display:flex}
.gword .p:empty{display:none}
.gword .w{font-family:var(--font-read);font-weight:700;font-size:clamp(44px,8.5vw,76px);line-height:1.05;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.gword .w i{display:inline-block;font-style:normal;animation:gPop 340ms var(--ease) both;animation-delay:calc(var(--i) * 42ms)}
.gword .w i.f{color:var(--stage)}
.gword .w.joy i{animation:gJoy 520ms var(--ease) both;animation-delay:calc(var(--i) * 50ms)}
@keyframes gPop{0%{opacity:0;transform:translateY(16px) scale(.6)}70%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes gJoy{0%{transform:none}40%{transform:translateY(-12px) scale(1.12)}100%{transform:none}}
.gword .ck{display:none;width:40px;height:40px;border-radius:50%;background:var(--ok);color:var(--on-stage);font-size:24px;align-items:center;justify-content:center;animation:gPop 320ms var(--ease) both}
.gword.gok .ck{display:flex}
.gword.gok .row{background:var(--ok-soft)}
.gword.gok .w,.gword.gok .w i.f{color:var(--ok)}
.gword.gsay .row{box-shadow:var(--shadow),0 0 0 4px var(--warm-soft)}
.gword .bars{display:none;align-items:center;gap:4px;height:30px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow)}
.gword.gsay .bars{display:flex}
.gword .bars i{width:5px;height:18px;border-radius:3px;background:var(--warm);animation:gBar 700ms ease-in-out infinite;animation-delay:calc(var(--i) * 110ms)}
.gword .bars .ic{width:22px;height:22px;color:var(--warm);margin-right:4px}
@keyframes gBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.1)}}
/* Max 의 말풍선 — 챈트의 한 줄(글자 · 글자 · 소리 둘 · 그림) */
.gbub{position:fixed;left:0;top:0;z-index:4;background:var(--surface);border-radius:var(--r-3);padding:10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity 220ms;pointer-events:none;transform-origin:50% 100%}
.gbub.show{opacity:1}
.gbub::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--surface);border-bottom:0}
.gbub .cell{min-width:40px;height:44px;border-radius:var(--r-1);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-read);font-weight:700;font-size:26px;color:var(--ink-3);transition:all 160ms var(--ease)}
.gbub .cell.snd{font-size:17px;padding:0 6px}
.gbub .cell.pic{font-size:34px;min-width:52px}
.gbub .cell.on{background:var(--stage);color:var(--on-stage);transform:translateY(-4px) scale(1.08)}
.gbub .cell.pic.on{background:var(--warm-soft)}
.gbub .say{font-family:var(--font-en);font-weight:800;font-size:20px;color:var(--ink);padding:0 6px}
/* 손 커서 — 내 손(또는 손가락)을 따라온다. 손이 안 보이면 그 자리에서 옅어진다 */
.hcur{position:fixed;left:0;top:0;z-index:6;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;box-shadow:var(--shadow),inset 0 0 0 4px var(--surface);pointer-events:none;opacity:0;transition:opacity 260ms,box-shadow 200ms}
.hcur .hi{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--stage-deep)}   /* 가운데는 비워 둔다 — 든 사과와 바구니가 가려지지 않게. 손 그림은 귀퉁이에 */
.hcur .hi .ic{width:26px;height:26px}
.hcur.on.seen{opacity:1}
.hcur.on.seen.dim{opacity:.32}
.hcur.hold{box-shadow:var(--shadow),inset 0 0 0 5px var(--warm)}
.hcur.hold .hi{background:var(--warm-soft)}
/* 잡힐 듯할 때 사과 둘레의 빛 테 */
.ring{position:fixed;left:0;top:0;z-index:5;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;box-shadow:0 0 0 5px var(--warm),0 0 22px 8px var(--warm-soft);pointer-events:none;opacity:0;transition:opacity 160ms}
.ring.on{opacity:1;animation:ringP 700ms ease-in-out infinite}
@keyframes ringP{50%{box-shadow:0 0 0 8px var(--warm),0 0 30px 12px var(--warm-soft)}}
/* 시범 손 — 나무 위에서 좌우로(손 흔드는 몸) · 손가락이 나무를 문지른다(손가락) */
.hint{position:fixed;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 300ms}
.hint.on{opacity:1}
.hint .hb{width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--stage);animation:hSwing 900ms ease-in-out infinite}
.hint .hb .ic{width:46px;height:46px}
.hint.fg .hb{background:var(--warm-soft);color:var(--stage-deep);animation:hRub 700ms ease-in-out infinite}
@keyframes hSwing{0%,100%{transform:translateX(-46px) rotate(-14deg)}50%{transform:translateX(46px) rotate(14deg)}}
@keyframes hRub{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
/* 작은 거울 — 내 손이 보이게(누르면 접힘) */
.mirror{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;width:150px;height:112px;border-radius:var(--r-2);overflow:hidden;background:var(--ink);box-shadow:var(--shadow),0 0 0 3px var(--surface);display:none;padding:0;border:0;transition:width 240ms var(--ease),height 240ms var(--ease),border-radius 240ms}
.mirror.on{display:block}
.mirror video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.mirror .mf{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--on-stage)}
.mirror .mf .ic{width:24px;height:24px}
.mirror.fold{width:48px;height:48px;border-radius:50%;background:var(--stage)}
.mirror.fold video{visibility:hidden}
.mirror.fold .mf{display:flex}
/* 입장 — 큰 그림 단추 둘(손 흔드는 몸 / 손가락) */
.gcover{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--scrim);transition:opacity 500ms}
.gcover.hide{opacity:0;pointer-events:none}
.gcover .box{display:flex;gap:22px;padding:22px;border-radius:var(--r-3);background:var(--surface);box-shadow:var(--shadow)}
.gcover .pick{width:clamp(120px,22vw,168px);height:clamp(120px,22vw,168px);border:0;border-radius:var(--r-3);background:var(--stage-soft);color:var(--stage-deep);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform 160ms var(--ease),background 160ms;touch-action:manipulation}
.gcover .pick .ic{width:62%;height:62%}
.gcover .pick:active{transform:scale(.95)}
.gcover .pick#bTouch{background:var(--warm-soft)}
.gcover .wait{display:flex;align-items:center;justify-content:center;width:120px;height:120px;color:var(--stage);animation:hSwing 1200ms ease-in-out infinite}
.gcover .wait .ic{width:56px;height:56px}
/* 끝 — 작은 그림 단추 둘(다시 / 빈터로) */
.gdock{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;z-index:7;transition:opacity 300ms,transform 300ms}
.gdock.hide{opacity:0;transform:translateY(30px);pointer-events:none}
.gdock button,.gdock a{width:74px;height:74px;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);color:var(--stage);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.gdock .ic{width:36px;height:36px}
/* 셈 띠 — 바구니 위. 하나 넣을 때마다 한 칸씩 자란다(1 → 1 + 1 = 2 → 1 + 1 + 1 = 3). 끝에는 크게 가운데로 */
.gsum{position:fixed;left:0;top:0;z-index:5;display:flex;align-items:flex-end;gap:6px;padding:8px 14px 10px;border-radius:var(--r-3);background:var(--surface);box-shadow:var(--shadow);font-family:var(--font-read);font-weight:700;color:var(--ink);opacity:0;pointer-events:none;transition:opacity 220ms;transform-origin:50% 100%}
.gsum.show{opacity:1}
.gsum > span{display:flex;flex-direction:column;align-items:center;font-size:34px;line-height:1}
.gsum .sm-pic{font-size:30px;line-height:1;margin-bottom:2px}
.gsum .sm-op{color:var(--ink-3);padding:0 2px}
.gsum .sm-sum{min-width:44px;height:44px;border-radius:var(--r-2);background:var(--warm-soft);color:var(--stage-deep);display:flex;align-items:center;justify-content:center}
.gsum .sm-new{animation:gPop 360ms var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
.gsum.big{left:50% !important;top:96px !important;transform:translateX(-50%) scale(1.5) !important;transform-origin:50% 0;transition:opacity 220ms,transform 420ms var(--ease)}
.gsum.big .sm-sum{background:var(--stage);color:var(--on-stage)}
@media (prefers-reduced-motion: reduce){.gsum .sm-new{animation:none}}
@media (prefers-reduced-motion: reduce){.gword .w i,.gword .w.joy i,.gword .ck,.gword .bars i,.hint .hb,.ring.on,.gcover .wait{animation:none}}
</style>

<script type="module">
import * as THREE from 'three';
import { createKit } from '../core/diorama.js';
import { makePerson, stepPeople, PEOPLE } from '../core/diorama-people.js';
import { buildGlade, fruitTree } from '../content/rooms/glade.js';

const $ = id => document.getElementById(id), I = PlayIcon.html, A = window.PlayAudio, T = window.KTTS, SP = window.PlaySpeech, PM = window.PlayMotion;
/* ── 상수는 여기 한 곳 (손 판정 상수는 PlayMotion.CONF · 놀이 상수는 PlayShakeCatch.CONF) ── */
const CONF = {
  /* 들리는 말 — 전부 A01 자료 안(설계 §3). 화면 글은 낱말 띠의 낱말뿐 */
  say: { hi: 'Hi!', oh: 'Oh!', word: 'apple', like: 'I like it!', listen: 'Oh! Listen!' },
  letter: 'a',
  bpm: 116,                                        /* 챈트 박자 — 한 해 길의 「다 같이」 박자(빈터의 듣기 단 104 보다 한 걸음 빠르게 · 11-16 속도감) */
  apples: 3,                                       /* 바구니의 빈 자리 */
  math: { on: true, ups: ['combo', 'combo2', 'combo3'] },   /* 셈 띠(1 + 1 + 1 = 3) · 넣을 때마다 한 음씩 올라가는 소리 */
  pace: { hiMs: 500, putMs: 300, afterEcho: 300, wordMs: 1800, endMs: 900, fruitFall: 450, fruitRoll: 1300 },   /* 사이사이 기다림(ms) — 11-16 속도감 */
  echo: { ms: 1900, mic: true },                   /* 따라 말하기(메아리) — 듣는 길이(마이크가 바로 안 돼도 이만큼은 기다린다) · 마이크가 되면 한 번 들어 본다(못 알아들어도 넘어간다) */
  ohGap: 3200, ohAt: 0.25,                         /* 흔드는 동안 「Oh!」 — 같은 말이 겹치지 않게 간격 · 세기가 이만큼 넘을 때 */
  rustleMs: 230, leafRate: 16,                     /* 흔들림 소리 간격 · 흔들 때 날리는 잎(세기 1 에서 초당) */
  tree: { lean: 0.9, leanMax: 0.16, wobble: 0.07, tug: 0.4 },/* 나무가 손을 따라 기우는 정도 · 가장 많이 · 흔들기 세기에 따른 떨림 · 곧 떨어질 사과가 달랑거리는 정도 */
  look: 1.0,                                       /* Max 가 고개를 돌리는 끝(라디안) — 얼굴이 늘 보이게 */
  idle: { demo: 6000, finger: 12000 },             /* 손이 이만큼 안 보이면 Max 가 시범을 다시 · 그래도 안 보이면 손가락 그림도 */
  /* 자리 — [x, z]. 사과가 오가는 세로 판은 z = plane */
  slot: { tree: [-2.9, -1.7], max: [3.45, -0.75], basket: [1.35, 0.7], creek: [4.3, -3.7] },
  plane: 0.7,
  crownY: 3.6,
  loose: [[-1.0, -0.25], [0.35, 0.65], [1.25, -0.55]],   /* 떨어질 사과 셋 — 나무 가운데에서 [x, y] */
  appleR: 0.32, ground: 0.32,
  view: { half: 6.2, halfTall: 5.0, min: 4.9, yaw: 0.12, pitch: 0.46, dist: 30, y: 2.25 },
  /* 효과음 — PlayAudio 합성(파일 0). 이 장면에만 쓰는 둘을 더한다 */
  snd: {
    rustle: { wave: 'sine', vol: 0.05, notes: [[1480, 0, 0.05, 980], [1320, 0.045, 0.05, 900], [1560, 0.09, 0.05, 1040]] },   /* 잎이 사락 */
    tok:    { wave: 'sine', vol: 0.2, notes: [[640, 0, 0.07, 380]] }                                                            /* 톡 */
  }
};
if (A && A.CONF) Object.keys(CONF.snd).forEach(k => { if (!A.CONF.sounds[k]) A.CONF.sounds[k] = CONF.snd[k]; });

/* ── 키트(core/diorama.js) — 렌더러 · 장면 · 재질 · 도형 · 글자판 · 트윈 · 후처리 · 품질 3단 ── */
const K = createKit({ canvas: $('cv') });
const { LOW, C, hex, mix, hexOf, M, mesh, ball, fx, cam } = K;
const V = CONF.view;

const v3 = new THREE.Vector3(), ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -PZ);
function screenOf(p){ v3.copy(p).project(cam); return [(v3.x + 1) / 2 * innerWidth, (1 - v3.y) / 2 * innerHeight]; }

/* 챈트 한 줄 「a, a, /a/ /a/ apple!」 — 빈터의 챈트와 같은 모양(Max 가 발을 구르고 말풍선 칸이 하나씩) */

async function chantLine(){

}
/* 따라 말하기 — 메아리: Max 가 귀에 손 · 낱말 띠가 빛난다. 마이크가 되면 한 번 들어 본다 · 못 알아들어도 넘어간다(틀렸다는 말 0) */
let micOff = false, echoing = false;
const micOK = () => CONF.echo.mic && !!SP && !micOff && SP.available();
async function echo(){
  const w = CONF.say.word; echoing = true; bubble(null); mood('ear'); word(w, 'say');
  let ok = false; const t0 = performance.now();
  if (micOK()) { const r = await soon(SP.tryOnce(w, { kind: 'word', others: [], timeout: CONF.echo.ms }), CONF.echo.ms + 600); if (r && r.ok) ok = true; if (r && ['not-allowed', 'service-not-allowed', 'unavailable', 'audio-capture', 'start'].indexOf(r.error) >= 0) { micOff = true; $('wordM').style.display = 'none'; } }
  if (!ok) await wait(Math.max(0, CONF.echo.ms - (performance.now() - t0)));          /* 마이크가 바로 안 돼도 따라 말할 틈은 그대로 둔다 */
  word(w, 'ok'); if (ok) sfx('ok'); mood('happy', 800); burstAt(basket.localToWorld(vA.set(0, 1, 0)), ok ? 14 : 6); await wait(CONF.pace.afterEcho);
  echoing = false;
}

/* ── 마디 0~5 ── */
async function begin(prefer){

  const my = ++run;
  $('cover').classList.add('hide'); effects(true); eye.hold(true);
  listen();
  const m = await PM.start({ video: $('vid'), prefer, shakeZone });
  if (my !== run) return;
  curIcon(m); mirror(true); $('cur').classList.add('on');
  mood('wave'); max.userData.look = null; await sayLine(CONF.say.hi);
  phase = 'shake'; game.pause(false); demoAt = performance.now(); lastSeen = performance.now(); max.userData.look = tree;
  await wait(CONF.pace.hiMs); if (max.userData.mood === 'wave') mood('idle');
}
async function finish(){
  phase = 'end'; const my = run;
  PM.stop(); unlisten(); mirror(false); clearTimeout(wordT); $('cur').classList.remove('on', 'seen', 'dim', 'hold'); $('ring').classList.remove('on'); hint(null);
  mood('happy'); max.userData.hop = 1; petals(44); sfx('done'); max.userData.look = basket; sumBig(); await wait(CONF.pace.endMs);
  if (my !== run) return;
  mood('idle'); max.userData.look = fruit;
  /* a 열매가 톡 떨어져 Max 발 앞으로 굴러간다(빈터의 사건 ① 과 같은 몸짓) */
  glade.attach(fruit); const land = new THREE.Vector3(TS[0] + 0.5, 0.5, -0.8), stop = new THREE.Vector3(MS[0] - 0.85, 0.5, MS[1] + 0.45);   /* 바구니 뒤로 지나 Max 발 앞에 */
  sfx('pop'); { const from = fruit.position.clone(); await tween(CONF.pace.fruitFall, t => { fruit.position.lerpVectors(from, land, t); fruit.position.y = from.y + (land.y - from.y) * t * t; }, t => t); }
  sfx('tok'); await tween(CONF.pace.fruitRoll, t => { fruit.position.lerpVectors(land, stop, t); fruit.position.y = 0.5 + Math.abs(Math.sin(t * Math.PI * 3)) * 0.25 * (1 - t); fruit.rotation.z = -t * Math.PI * 4; }); fruit.rotation.z = 0;
  if (my !== run) return;
  mood('happy', 900); bubble('<span class="say">' + CONF.say.like + '</span>'); await sayLine(CONF.say.like); await wait(250);
  mood('point'); bubble('<span class="say">' + CONF.say.listen + '</span>'); burstAt(fruit.position, 8); await sayLine(CONF.say.listen); await wait(300); bubble(null); mood('idle');
  effects(false); eye.hold(false); phase = 'done'; $('dock').classList.remove('hide');
}
/* 다시 — 처음 상태로(입장 단추 둘) */
function again(){
  run++; PM.stop(); unlisten(); game.reset(); phase = 'cover';
  loose.forEach((a, i) => { glade.attach(a); a.rotation.set(0, 0, 0); a.position.set(game.apples[i].hx, game.apples[i].hy, PZ); a.visible = true; });
  ghosts.forEach(g => { g.visible = true; }); basket.userData.k = 1;
  crown.attach(fruit); fruit.position.copy(fruitHome); fruit.rotation.set(0, 0, 0);
  word(null); bubble(null); hint(null); mood('idle'); max.userData.look = null; ringI = -1;
  clearTimeout(wordT); sumShow(0); $('cur').classList.remove('on', 'seen', 'dim', 'hold'); $('ring').classList.remove('on'); $('dock').classList.add('hide'); $('cover').classList.remove('hide');
}
$('bHands').onclick = () => begin('hands');
$('bTouch').onclick = () => begin('touch');
$('bAgain').onclick = again;

/* 시범 손 — 나무 위에서. 손이 한동안 안 보이면 Max 가 다시 흔들고, 더 지나면 손가락 그림도 */
function hint(kind){ const h = $('hint'); if (!kind) { h.classList.remove('on'); return; } h.classList.add('on'); h.classList.toggle('fg', kind === 'finger'); $('hintB').innerHTML = I(kind === 'finger' ? 'finger' : 'hand'); }

/* ── 매 장면 ── */
const clock = new THREE.Clock(); let ripT = 1;
const clampN = (v, a) => Math.max(-a, Math.min(a, v));
function frame(){
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05), t = clock.elapsedTime, now = performance.now();      /* 몸짓은 dt(끊겨도 튀지 않게) · 놀이는 실제 시간 raw(느린 기기에서도 같은 만큼 흔들면 떨어지게) */
  K.runTweens(now); eye.step(dt, t); G.step(dt, t); lit.step(dt, t);
  /* 놀이 한 걸음 — 손이 가만히 있어도 든 사과·떨어지는 사과는 움직인다 */
  if (phase === 'shake' || phase === 'chant') { handToGame(); game.step(raw); }
  /* 나무 — 손을 따라 기울고, 흔들기 세기만큼 떤다 · 잎이 날리고 사락 소리 */
  { const sx = hand.seen ? hand.x : 0.5; xEma = xEma == null ? sx : xEma + (sx - xEma) * Math.min(1, dt * 2.2);
    const want = phase === 'shake' && hand.seen ? clampN((sx - xEma) * CONF.tree.lean, CONF.tree.leanMax) : 0;
    leanT += (want - leanT) * Math.min(1, dt * 12);
    crown.rotation.z = -leanT + Math.sin(t * 19) * CONF.tree.wobble * level + Math.sin(t * 0.6) * 0.014; trunk.rotation.z = -leanT * 0.18;
    crown.scale.y = 1 + Math.sin(t * 0.9) * 0.008;
    if (level > 0 && phase === 'shake') { leafAcc += level * CONF.leafRate * dt; while (leafAcc >= 1) { leafAcc--; leafFly(level); } if (level > 0.2 && now - lastRustle > CONF.rustleMs) { lastRustle = now; sfx('rustle'); }
      if (level > CONF.ohAt && now - lastOh > CONF.ohGap && !max.userData.talk && game.ready() < 0.6) { lastOh = now; mood('point', 900); sayLine(CONF.say.oh); } } }   /* 곧 떨어질 때는 말하지 않는다 — 떨어지는 순간의 낱말과 겹치지 않게 */
  /* 사과 — 가지의 사과는 나무와 함께 흔들리고, 나머지는 놀이 로직의 자리로 */
  { const cz = crown.rotation.z, cs = Math.cos(cz), sn = Math.sin(cz), nx = game.next(), rd = game.ready();
    game.apples.forEach((g, i) => { const a = loose[i];
      if (g.s === 'tree') { const dx = g.hx - crownC.x, dy = g.hy - crownC.y, tug = i === nx ? rd : 0; a.position.set(crownC.x + dx * cs - dy * sn, crownC.y + dx * sn + dy * cs - tug * 0.1, PZ); a.rotation.z = cz + Math.sin(t * 23 + i) * (0.12 * level + CONF.tree.tug * tug); }
      else if (g.s === 'fall' || g.s === 'ground') { a.position.set(g.x, g.y, PZ); if (g.s === 'fall') a.rotation.z -= dt * 3; }
      else if (g.s === 'held') { a.position.set(g.x, g.y, PZ + 0.35); a.rotation.z += (0 - a.rotation.z) * Math.min(1, dt * 8); } }); }
  /* 바구니 — 사과가 가까우면 살짝 커지고, 들어가면 통 */
  { const u = basket.userData; u.bounce = Math.max(0, u.bounce - dt * 3); const s = basket.scale.x + (u.k - basket.scale.x) * Math.min(1, dt * 10); basket.scale.set(s, s * (1 - Math.sin(u.bounce * Math.PI) * 0.12), s); }
  /* 손 커서 · 빛 테 · 시범 손 */
  if (phase === 'shake' || phase === 'chant') {
    const c = $('cur'); c.style.transform = 'translate(' + (hand.x * innerWidth) + 'px,' + (hand.y * innerHeight) + 'px)'; c.classList.toggle('dim', !hand.seen);
    const r = $('ring'); if (ringI >= 0 && game.apples[ringI] && phase === 'shake') { const [x, y] = screenOf(loose[ringI].position), s = Math.max(0.8, CONF.appleR * 2.6 * ppu / 80); r.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')'; r.classList.add('on'); } else r.classList.remove('on');
    const idle = now - lastSeen, out = game.apples.some(a => a.s === 'fall' || a.s === 'held' || a.s === 'ground');
    if (phase === 'shake' && !out && level === 0 && (now - demoAt < 3500 || idle > CONF.idle.demo)) {
      if (idle > CONF.idle.demo && now - demoAt > CONF.idle.demo) { demoAt = now; mood('wave', 2400); }
      fingerHint = idle > CONF.idle.finger; hint(fingerHint ? 'finger' : 'hand');
      const c2 = crownScreen(); $('hint').style.transform = 'translate(' + c2.x + 'px,' + (c2.y - c2.r * 0.25) + 'px)';
    } else hint(null);
  }
  /* 살아 있는 것 — 물무늬(물 · 갈대 · 덤불 · 햇살 · 먼지는 판형 · 빛 벌이) */
  ripT -= dt; if (ripT <= 0) { ripT = 1.4 + Math.random() * 1.6; ripple(CK[0] + (Math.random() - 0.5) * 3.2, CK[1] + (Math.random() - 0.5) * 1.2, 0.5 + Math.random() * 0.4); }
  PT.step(dt);
  /* Max — 몸짓은 부드럽게 이어진다(고개는 CONF.look 까지 — 얼굴이 늘 보이게 · 볼 것이 없으면 손 쪽) */
  stepPeople(K, [max], dt, t, { look: CONF.look, body: [0.45, 0.6], head: 0.6, idleLook: () => hand.seen && phase === 'shake' ? Math.max(-0.8, Math.min(0.8, (hand.x - 0.5) * 1.4)) : null });
  if ($('bub').classList.contains('show')) placeBub(); placeSum();
  K.render(raw);   /* 느린 기기면 가볍게 */
  if (!window.__pause) requestAnimationFrame(frame);
}
frame();
$('wait').style.display = 'none'; $('bHands').style.display = ''; $('bTouch').style.display = '';
/* 점검용(화면 밖) — 브라우저에서 자리를 재 보는 데만 쓴다 */
window.__shake = { game, CONF, PM, begin, again, get phase(){ return phase; }, appleState,
  appleScreen: i => screenOf(loose[i].getWorldPosition(new THREE.Vector3())), basketScreen: () => screenOf(basket.localToWorld(new THREE.Vector3(0, 0.55, 0))), crownScreen, fruitScreen: () => screenOf(fruit.getWorldPosition(new THREE.Vector3())) };
</script>

<style>
/* ============================================================
 * 사과 흔들기 — 몸 장면 시험판 (WM1 · 모션 사건 설계 v1 §3 · 한 해 길 A01 사건 ① 「굴러간 열매」의 앞머리)
 *   손을 흔들면 사과나무가 흔들리고, 떨어지는 사과를 손으로 받아 바구니에 넣는다 — 세 번. 바구니가 차면 a 열매가 톡 떨어져 Max 발 앞으로 굴러간다.
 *   마디: 0 입장(그림 단추 둘 — 손 흔드는 몸 / 손가락) → 1 흔들기 → 2 받기 → 3 넣기(챈트 한 줄 + 따라 말하기) ×3 → 4 끝(I like it! · a 열매) → 5 다시 / 빈터로
 *   빈터 장면(나무 · Max · 풀 · 개울 · 빛)은 glade.html 에서 가져다 썼다(glade.html 은 그대로 — 같이 쓸 부분을 뽑아내는 일은 W15 본판의 키트 분리에서).
 *   손은 engine/play-motion.js(카메라 손 추적 · 안 되면 손가락) · 놀이 로직은 core/shake-catch.js · 이 파일은 보이는 판만.
 *   화면 글은 낱말 띠뿐(조작 안내 글 0 — Max 의 몸짓 시범과 손 그림으로) · 숫자 · 타이머 · 실패 화면 0 · 모은 수는 바구니의 빈 자리로.
 *   시험판은 저장 0(씨앗 · 증거 · 진도) · 카메라 영상은 기기 안에서만 · 장면이 끝나면 카메라를 끈다.
 *   ?q=low = 가벼운 판 · ?mouse=1 = 카메라 없이 마우스로 손 추적 흉내(KMotion 마우스 모드).
 * ============================================================ */
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
.sndb{position:fixed;right:16px;top:12px;z-index:6;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);border:0;font-size:20px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.sndb.off{color:var(--ink-4)}
/* 낱말 띠(위) — 낱말이 들릴 때 그림 + 낱말(첫 글자 색). 누르면 다시 들린다 */
.gword{position:fixed;left:50%;top:14px;z-index:5;transform:translate(-50%,-14px) scale(.92);opacity:0;transition:opacity 200ms,transform 240ms var(--ease);display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.gword.show{opacity:1;transform:translate(-50%,0) scale(1)}
.gword .row{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-3);padding:8px 24px 10px 16px;box-shadow:var(--shadow);transition:background 240ms}
.gword.show .row{pointer-events:auto}
.gword .p{font-size:clamp(40px,7vw,60px);line-height:1;display:flex}
.gword .p:empty{display:none}
.gword .w{font-family:var(--font-read);font-weight:700;font-size:clamp(44px,8.5vw,76px);line-height:1.05;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.gword .w i{display:inline-block;font-style:normal;animation:gPop 340ms var(--ease) both;animation-delay:calc(var(--i) * 42ms)}
.gword .w i.f{color:var(--stage)}
.gword .w.joy i{animation:gJoy 520ms var(--ease) both;animation-delay:calc(var(--i) * 50ms)}
@keyframes gPop{0%{opacity:0;transform:translateY(16px) scale(.6)}70%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes gJoy{0%{transform:none}40%{transform:translateY(-12px) scale(1.12)}100%{transform:none}}
.gword .ck{display:none;width:40px;height:40px;border-radius:50%;background:var(--ok);color:var(--on-stage);font-size:24px;align-items:center;justify-content:center;animation:gPop 320ms var(--ease) both}
.gword.gok .ck{display:flex}
.gword.gok .row{background:var(--ok-soft)}
.gword.gok .w,.gword.gok .w i.f{color:var(--ok)}
.gword.gsay .row{box-shadow:var(--shadow),0 0 0 4px var(--warm-soft)}
.gword .bars{display:none;align-items:center;gap:4px;height:30px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow)}
.gword.gsay .bars{display:flex}
.gword .bars i{width:5px;height:18px;border-radius:3px;background:var(--warm);animation:gBar 700ms ease-in-out infinite;animation-delay:calc(var(--i) * 110ms)}
.gword .bars .ic{width:22px;height:22px;color:var(--warm);margin-right:4px}
@keyframes gBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1.1)}}
/* Max 의 말풍선 — 챈트의 한 줄(글자 · 글자 · 소리 둘 · 그림) */
.gbub{position:fixed;left:0;top:0;z-index:4;background:var(--surface);border-radius:var(--r-3);padding:10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity 220ms;pointer-events:none;transform-origin:50% 100%}
.gbub.show{opacity:1}
.gbub::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--surface);border-bottom:0}
.gbub .cell{min-width:40px;height:44px;border-radius:var(--r-1);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-read);font-weight:700;font-size:26px;color:var(--ink-3);transition:all 160ms var(--ease)}
.gbub .cell.snd{font-size:17px;padding:0 6px}
.gbub .cell.pic{font-size:34px;min-width:52px}
.gbub .cell.on{background:var(--stage);color:var(--on-stage);transform:translateY(-4px) scale(1.08)}
.gbub .cell.pic.on{background:var(--warm-soft)}
.gbub .say{font-family:var(--font-en);font-weight:800;font-size:20px;color:var(--ink);padding:0 6px}
/* 손 커서 — 내 손(또는 손가락)을 따라온다. 손이 안 보이면 그 자리에서 옅어진다 */
.hcur{position:fixed;left:0;top:0;z-index:6;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;box-shadow:var(--shadow),inset 0 0 0 4px var(--surface);pointer-events:none;opacity:0;transition:opacity 260ms,box-shadow 200ms}
.hcur .hi{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--stage-deep)}   /* 가운데는 비워 둔다 — 든 사과와 바구니가 가려지지 않게. 손 그림은 귀퉁이에 */
.hcur .hi .ic{width:26px;height:26px}
.hcur.on.seen{opacity:1}
.hcur.on.seen.dim{opacity:.32}
.hcur.hold{box-shadow:var(--shadow),inset 0 0 0 5px var(--warm)}
.hcur.hold .hi{background:var(--warm-soft)}
/* 잡힐 듯할 때 사과 둘레의 빛 테 */
.ring{position:fixed;left:0;top:0;z-index:5;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;box-shadow:0 0 0 5px var(--warm),0 0 22px 8px var(--warm-soft);pointer-events:none;opacity:0;transition:opacity 160ms}
.ring.on{opacity:1;animation:ringP 700ms ease-in-out infinite}
@keyframes ringP{50%{box-shadow:0 0 0 8px var(--warm),0 0 30px 12px var(--warm-soft)}}
/* 시범 손 — 나무 위에서 좌우로(손 흔드는 몸) · 손가락이 나무를 문지른다(손가락) */
.hint{position:fixed;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 300ms}
.hint.on{opacity:1}
.hint .hb{width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--stage);animation:hSwing 900ms ease-in-out infinite}
.hint .hb .ic{width:46px;height:46px}
.hint.fg .hb{background:var(--warm-soft);color:var(--stage-deep);animation:hRub 700ms ease-in-out infinite}
@keyframes hSwing{0%,100%{transform:translateX(-46px) rotate(-14deg)}50%{transform:translateX(46px) rotate(14deg)}}
@keyframes hRub{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
/* 작은 거울 — 내 손이 보이게(누르면 접힘) */
.mirror{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;width:150px;height:112px;border-radius:var(--r-2);overflow:hidden;background:var(--ink);box-shadow:var(--shadow),0 0 0 3px var(--surface);display:none;padding:0;border:0;transition:width 240ms var(--ease),height 240ms var(--ease),border-radius 240ms}
.mirror.on{display:block}
.mirror video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.mirror .mf{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--on-stage)}
.mirror .mf .ic{width:24px;height:24px}
.mirror.fold{width:48px;height:48px;border-radius:50%;background:var(--stage)}
.mirror.fold video{visibility:hidden}
.mirror.fold .mf{display:flex}
/* 입장 — 큰 그림 단추 둘(손 흔드는 몸 / 손가락) */
.gcover{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--scrim);transition:opacity 500ms}
.gcover.hide{opacity:0;pointer-events:none}
.gcover .box{display:flex;gap:22px;padding:22px;border-radius:var(--r-3);background:var(--surface);box-shadow:var(--shadow)}
.gcover .pick{width:clamp(120px,22vw,168px);height:clamp(120px,22vw,168px);border:0;border-radius:var(--r-3);background:var(--stage-soft);color:var(--stage-deep);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform 160ms var(--ease),background 160ms;touch-action:manipulation}
.gcover .pick .ic{width:62%;height:62%}
.gcover .pick:active{transform:scale(.95)}
.gcover .pick#bTouch{background:var(--warm-soft)}
.gcover .wait{display:flex;align-items:center;justify-content:center;width:120px;height:120px;color:var(--stage);animation:hSwing 1200ms ease-in-out infinite}
.gcover .wait .ic{width:56px;height:56px}
/* 끝 — 작은 그림 단추 둘(다시 / 빈터로) */
.gdock{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;z-index:7;transition:opacity 300ms,transform 300ms}
.gdock.hide{opacity:0;transform:translateY(30px);pointer-events:none}
.gdock button,.gdock a{width:74px;height:74px;border:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);color:var(--stage);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.gdock .ic{width:36px;height:36px}
@media (prefers-reduced-motion: reduce){.gword .w i,.gword .w.joy i,.gword .ck,.gword .bars i,.hint .hb,.ring.on,.gcover .wait{animation:none}}
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id), I = PlayIcon.html, A = window.PlayAudio, T = window.KTTS, SP = window.PlaySpeech, PM = window.PlayMotion;
/* ── 상수는 여기 한 곳 (손 판정 상수는 PlayMotion.CONF · 놀이 상수는 PlayShakeCatch.CONF) ── */
const CONF = {
  /* 들리는 말 — 전부 A01 자료 안(설계 §3). 화면 글은 낱말 띠의 낱말뿐 */
  say: { hi: 'Hi!', oh: 'Oh!', word: 'apple', like: 'I like it!', listen: 'Oh! Listen!' },
  letter: 'a',
  bpm: 104,                                        /* 챈트 박자(빈터와 같게) */
  apples: 3,                                       /* 바구니의 빈 자리 */
  echo: { ms: 2600, mic: true },                   /* 따라 말하기(메아리) — 듣는 길이(마이크가 바로 안 돼도 이만큼은 기다린다) · 마이크가 되면 한 번 들어 본다(못 알아들어도 넘어간다) */
  ohGap: 3200, ohAt: 0.25,                         /* 흔드는 동안 「Oh!」 — 같은 말이 겹치지 않게 간격 · 세기가 이만큼 넘을 때 */
  rustleMs: 230, leafRate: 16,                     /* 흔들림 소리 간격 · 흔들 때 날리는 잎(세기 1 에서 초당) */
  tree: { lean: 0.9, leanMax: 0.16, wobble: 0.07, tug: 0.4 },/* 나무가 손을 따라 기우는 정도 · 가장 많이 · 흔들기 세기에 따른 떨림 · 곧 떨어질 사과가 달랑거리는 정도 */
  look: 1.0,                                       /* Max 가 고개를 돌리는 끝(라디안) — 얼굴이 늘 보이게 */
  shadowEvery: 2,                                  /* 몸 장면 동안 그림자는 이만큼의 장면마다 한 번 */
  idle: { demo: 6000, finger: 12000 },             /* 손이 이만큼 안 보이면 Max 가 시범을 다시 · 그래도 안 보이면 손가락 그림도 */
  /* 자리 — [x, z]. 사과가 오가는 세로 판은 z = plane */
  slot: { tree: [-2.9, -1.7], max: [3.45, -0.75], basket: [1.35, 0.7], creek: [4.3, -3.7] },
  plane: 0.7,
  crownY: 3.6,
  loose: [[-1.0, -0.25], [0.35, 0.65], [1.25, -0.55]],   /* 떨어질 사과 셋 — 나무 가운데에서 [x, y] */
  appleR: 0.32, ground: 0.32,
  view: { half: 6.2, halfTall: 5.0, min: 4.9, yaw: 0.12, pitch: 0.46, dist: 30, y: 2.25 },
  /* 효과음 — PlayAudio 합성(파일 0). 이 장면에만 쓰는 둘을 더한다 */
  snd: {
    rustle: { wave: 'sine', vol: 0.05, notes: [[1480, 0, 0.05, 980], [1320, 0.045, 0.05, 900], [1560, 0.09, 0.05, 1040]] },   /* 잎이 사락 */
    tok:    { wave: 'sine', vol: 0.2, notes: [[640, 0, 0.07, 380]] }                                                            /* 톡 */
  }
};
const LOW = /[?&]q=low/.test(location.search);
if (A && A.CONF) Object.keys(CONF.snd).forEach(k => { if (!A.CONF.sounds[k]) A.CONF.sounds[k] = CONF.snd[k]; });

/* ── 토큰 → 색 (빈터와 같게) ── */
const CS = getComputedStyle(document.body);
const C = n => new THREE.Color(CS.getPropertyValue('--' + n).trim());
const hex = n => '#' + C(n).getHexString();
const mix = (a, b, t) => (typeof a === 'string' ? C(a) : a.clone()).lerp(typeof b === 'string' ? C(b) : b, t);
const hexOf = c => '#' + c.getHexString();
const RNG = seed => { let k = seed; return () => { k = (k * 16807) % 2147483647; return k / 2147483647; }; };

/* ── 렌더러 · 장면 ── */
const cv = $('cv');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
R.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1 : 2));
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.NeutralToneMapping; R.toneMappingExposure = 1.0;
const S = new THREE.Scene();
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: typeof c === 'string' ? C(c) : c, roughness: 0.7, metalness: 0 }, o));
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function mesh(g, mat, x = 0, y = 0, z = 0){ const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; }
function ball(r, mat, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1){ const m = mesh(new THREE.SphereGeometry(r, 24, 18), mat, x, y, z); m.scale.set(sx, sy, sz); return m; }
function rshape(w, h, r){ const s = new THREE.Shape(), x = -w / 2, y = -h / 2; r = Math.min(r, w / 2, h / 2);
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
function rbox(w, h, d, r, mat){
  const b = Math.min(0.06, d / 4), g = new THREE.ExtrudeGeometry(rshape(w, h, r), { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 });
  g.translate(0, 0, -(d - 2 * b) / 2); const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; return m;
}

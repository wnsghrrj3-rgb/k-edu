<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>점심 가게 | 영어 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../play.css">
<style>
  body{background:#FFF3E0}
  .shop{width:100%;max-width:520px;background:#fff;border-radius:26px;padding:14px 14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.08);position:relative}
  .sign{font-family:Jua;font-size:22px;text-align:center;padding:10px;border-radius:16px;background:#E2E8F0;color:#A0AEC0;letter-spacing:2px;transition:all .5s}
  .sign.on{background:linear-gradient(135deg,#FF8A3D,#FFB454);color:#fff;box-shadow:0 0 0 4px #FFE0B2,0 0 24px #FFB454}
  .sam{display:flex;align-items:flex-end;gap:10px;margin:12px 0 6px}
  .sam .f{width:70px;height:76px;flex-shrink:0}
  .bub{background:#FFF8EC;border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:16px;line-height:1.45;flex:1;min-height:46px}
  .bub b{font-family:Jua;font-size:19px;color:#1A202C;display:block}
  .bub small{color:#A0AEC0;font-size:12.5px}
  .endcard{text-align:center}
  .endcard .big{font-size:60px}
  .endcard h2{font-family:Jua;font-size:22px;margin:6px 0}
  .endcard .note{font-size:14.5px;color:#4A5568;line-height:1.6}
  .seedrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .homebtn{margin-top:14px;display:flex;gap:8px;justify-content:center}
</style>
<script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>
<body>
<div class="top"><span class="t">🏪 점심 가게</span><span class="tr"><button class="snd" id="snd" type="button" aria-label="효과음">🔔</button><span class="seedbag" id="bag">🌰 0</span></span></div>
<div class="actbar" id="actbar"></div>
<div class="stage" id="stage"></div>
<div class="toast" id="toast"></div>
<div class="fx" id="fx"></div>

<script src="../../v3/data/ladder.js"></script>
<script src="../../v3/engine/k-progress.js"></script>
<script src="../../v3/engine/k-tts.js"></script>
<script src="../../v3/engine/k-collection.js"></script>
<script src="../data/zones.js"></script>
<script src="../content/events/food.js"></script>
<script src="../engine/play-seed.js"></script>
<script src="../engine/play-speech.js"></script>
<script src="../engine/play-cam.js"></script>
<script src="../engine/play-char.js"></script>
<script src="../core/audio.js"></script>
<script src="../core/npc.js"></script>
<script src="../core/fx.js"></script>
<script src="../core/evidence.js"></script>
<script src="../core/scene.js"></script>
<script src="../core/game.js"></script>
<script src="../core/tutor.js"></script>
<script src="../core/event.js"></script>
<script src="../core/assemble.js"></script>
<script src="../games/garden.js"></script>
<script src="../games/silly-order.js"></script>
<script src="../games/order-shop.js"></script>
<script src="../games/catch.js"></script>
<script src="../games/pop.js"></script>
<script src="../games/belt.js"></script>
<script src="../games/special-guest.js"></script>
<script src="../games/legacy.js"></script>
<script>
/* 점심 가게 — 무대 페이지는 조립만 한다. 놀이는 games/, 공통 부품은 core/, 사건 표는 content/events/.
   오늘 무엇을 할지는 조립기(core/assemble.js)가 자료에서 정한다:
   (돌볼 씨앗이 있으면) 정원 → 오늘의 사건이 입힌 놀이 → 채널이 겹치지 않는 놀이들 → 특별 손님 → 무대에 장식 하나 */
(function(){
  'use strict';
  var Z = PLAY_ZONES.zone('lv2-02'), WORDS = Z.words, W = WORDS.map(function(w){return w.w;});
  var $ = function(id){ return document.getElementById(id); }, stage = $('stage');
  var byW = {}; WORDS.forEach(function(w){ byW[w.w] = w; });
  var QS = location.search, mode = /mode=care/.test(QS) ? 'care' : 'play';
  var unlocked = PlaySeed.bossDone(Z.id);

  /* ── 공통 ── */
  function h(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function toast(s){ var t = $('toast'); t.textContent = s; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1600); }
  function confetti(){ PlayFx.confetti(); }
  function bag(){ var n = 0, s = PlaySeed.all(); W.forEach(function(w){ if (s[w]) n++; }); $('bag').textContent = '🌰 ' + n + '/' + W.length; }
  function decor(fresh){ var d = $('decor'); if (d) d.innerHTML = PlayAssemble.decor(Z.id, Z).map(function(x){ return '<span title="' + x.name + '"' + (fresh && fresh.id === x.id ? ' class="new"' : '') + '>' + x.pic + '</span>'; }).join(''); }
  function shop(ev){
    var box = h('div','shop');
    box.innerHTML = '<div class="sign fx-glow' + (unlocked ? ' on' : '') + '" id="sign"><span>LUNCH SHOP</span></div><div class="decor" id="decor"></div>' +
      '<div class="sam"><div class="f" id="samf"></div><div class="bub" id="bub"></div></div>' +
      '<div id="body"></div>';
    stage.innerHTML = ''; stage.appendChild(box);
    PlayNpc.render($('samf'), 'sam', { face: 'idle', wear: 'apron' });   /* Sam — 대기=기본 · 성공=웃음+손 번쩍 · 실패=갸웃+손을 턱에 */
    PlayEvent.dress(box, ev || null);
    glow(); decor();
    return $('body');
  }
  function samFace(kind){ var e = $('samf'); if (e) PlayNpc.react(e, kind); }
  function sam(en, ko, speak){ var b = $('bub'); if (b) b.innerHTML = '<b>' + en + '</b>' + (ko ? '<small>' + ko + '</small>' : ''); if (speak !== false && en) return KTTS.sentence(en); return Promise.resolve(); }

  /* 평판 불빛 — 손님이 만족할 때마다(증거 한 건마다) 간판이 조금씩 밝아진다. 특별 손님을 넘으면 완전히 켜진다 */
  var REP = PlayFx.meter(1);
  function glow(){ var s = $('sign'); if (s) PlayFx.glow(s, unlocked ? 1 : REP.value()); }

  /* 놀이 모듈에 넘기는 것 */
  var micOK = PlaySpeech.available(), primed = false;   /* 첫 듣기는 손가락(탭)에서 시작 — 크롬 마이크 허용 창이 확실히 뜨게 */
  var MIC = { ok: function(){ return micOK; }, off: function(){ if (micOK) toast(PlaySpeech.errorKo(PlaySpeech.lastError() || 'unavailable')); micOK = false; }, primed: function(){ return primed; }, prime: function(){ primed = true; } };
  var SV = { tts: KTTS, speech: PlaySpeech, cam: PlayCam, seed: PlaySeed, audio: PlayAudio, npc: PlayNpc, fx: PlayFx, scene: PlayScene, evidence: PlayEvidence, char: PlayChar,
    sam: { say: sam, react: samFace, el: function(){ return $('samf'); } } };

  /* ── 오늘의 세트 — 조립기가 정한다. 주소에 ?set=a,b,c 가 있으면 그 놀이들만(점검·다시 하기), ?event=이름 이면 그 사건으로 */
  function unplanted(){ var s = PlaySeed.all(); return W.filter(function(w){ return !s[w]; }); }
  function review(){ var sm = PlayEvidence.summary(Z.id, W); return W.filter(function(w){ var k = sm[w].skills; return Object.keys(k).some(function(x){ return k[x] !== 'independent'; }); }); }
  function makePlan(){
    var m = /[?&]set=([^&]+)/.exec(QS), e = /[?&]event=([\w-]+)/.exec(QS);
    if (m) return { manual: true, event: null, set: decodeURIComponent(m[1]).split(',').filter(function(id){ return !!PlayGame.get(id); }) };
    if (mode === 'care') return { manual: true, event: null, set: ['garden'] };
    return PlayAssemble.plan({ zone: Z, cell: Z.id, cam: PlayCam.available(), unplanted: unplanted().length, due: PlaySeed.due(Z.id).length, event: e ? e[1] : null });
  }
  var PLAN = makePlan(), SET = PLAN.set, INFO = { unplanted: unplanted(), review: review() };
  var EV = PLAN.event ? (PLAY_EVENTS[Z.stage] || []).filter(function(x){ return x.id === PLAN.event; })[0] : null;
  var TARGETS = SET.map(function(id){
    if (id === 'garden') return PlaySeed.due(Z.id).filter(function(w){ return byW[w]; }).map(function(w){ return byW[w]; });
    return PlayAssemble.targets(id, Z, INFO);
  });
  function optFor(i){ var o = { last: i === SET.length - 1 }, x = EV && SET[i] === PLAN.eventGame ? EV.opt : null; if (x) Object.keys(x).forEach(function(k){ o[k] = x[k]; }); return o; }
  function ctxFor(i, body, intro){
    return { host: body, zone: Z, cell: Z.id, targets: TARGETS[i], pool: WORDS, learner: { mic: MIC }, services: SV, intro: intro, opt: optFor(i), onEvidence: onEvidence };
  }
  REP = PlayFx.meter(SET.reduce(function(n, id, i){ return n + PlayGame.count(id, { zone: Z, targets: TARGETS[i], learner: { mic: MIC }, opt: optFor(i) }); }, 0) || 1);

  function actbar(i){ var b = $('actbar'); b.innerHTML = ''; if (SET.length < 2){ b.style.display = 'none'; return; } SET.forEach(function(id, k){ var d = PlayGame.get(id), s = h('span', k < i ? 'ok' : k === i ? 'on' : '', d.icon); s.title = d.name; b.appendChild(s); }); }

  /* 증거 한 건 — 씨앗 가방·도감·평판·첫 열매 파츠 */
  function onEvidence(v){
    KCollection.add([v.targetId]); bag(); REP.add(); glow();
    if (v.seed && v.seed.stage === 3 && Z.part.when === 'firstFruit' && PlaySeed.givePart(Z.part.id)) { confetti(); toast('🎉 ' + Z.part.name + '을 얻었어요!'); }
  }

  function run(i){
    if (i >= SET.length) return endCard();
    actbar(i);
    var id = SET[i], def = PlayGame.get(id), dressed = !!EV && id === PLAN.eventGame, body = shop(dressed ? EV : null), p;
    if (dressed) {       /* 오늘의 사건 — 등장·한마디 → 그 사건이 입힌 놀이 → 사건 끝 한마디 */
      p = PlayEvent.play(EV, { shop: body.parentNode, host: body, services: SV })
        .then(function(){ return PlayGame.run(id, ctxFor(i, body, Promise.resolve())); })
        .then(function(res){ return PlayEvent.end(EV, { shop: body.parentNode, services: SV }).then(function(){ return res; }); });
    } else p = PlayGame.run(id, ctxFor(i, body, def.intro ? sam(def.intro.en, def.intro.ko) : Promise.resolve()));
    p.then(function(res){
      if (id === 'special-guest' && res.passed) return openShop(res.by);
      setTimeout(function(){ run(i + 1); }, 600);
    });
  }

  /* 특별 손님을 넘었다 — 가게가 열리고(사다리 칸 점등), 옆 무대의 안개가 걷힌다(결정 §0-2: 구경은 바로, 놀이 입장은 꽃 ¾ 뒤) */
  function openShop(by){
    PlaySeed.bossPassed(Z.id, by);
    KProgress.light(Z.id);   /* 사다리와 동기 — lv2-02 점등 */
    unlocked = true; $('sign').classList.add('on'); glow(); PlayAudio.play('done'); confetti();
    sam('The shop is open!', '가게가 열렸어!').then(function(){ endCard(); });
  }

  /* ── 끝 카드 : 심은 씨앗 → 내일 돌보기 · 오늘 무대에 생긴 것 ── */
  function endCard(){
    var body = $('body') || shop();
    if (mode === 'care' || (SET.length === 1 && SET[0] === 'garden')) {
      var hb = h('div', 'homebtn', '<button class="btn" id="home">놀이터로</button>'); body.appendChild(hb);
      $('home').onclick = function(){ location.href = '../index.html'; };
      return;
    }
    var deco = PLAN.manual ? null : PlayAssemble.finish(Z.id, Z);      /* 마무리 — 무대의 작은 변화 하나 */
    decor(deco);
    body.innerHTML = '';
    var s = PlaySeed.all(), card = h('div', 'endcard');
    var nSeed = W.filter(function(w){ return s[w]; }).length;
    card.innerHTML = '<div class="big">🌰</div><h2>' + (nSeed ? '씨앗 ' + nSeed + '개를 심었어요' : unlocked ? '가게가 열렸어요!' : '오늘 놀이 끝!') + '</h2>' +
      '<div class="seedrow">' + W.map(function(w){ var st = s[w] ? s[w].stage : -1; return '<span class="seed s' + st + '" title="' + w + '">' + byW[w].pic + '</span>'; }).join('') + '</div>' +
      (nSeed ? '' : '<div class="note" style="margin-bottom:6px">🎤 말로 주문을 받으면 씨앗이 심겨요.</div>') +
      '<div class="note">내일 다시 와서 말해 주면 🌱 새싹이 돼요.<br>3일에 🌸 꽃, 7일에 🍎 열매 — 열매가 되면 진열대에 올라가고<br>앞치마를 입을 수 있어요.</div>' +
      (deco ? '<div class="note" id="newdeco" style="margin-top:8px">' + deco.pic + ' 가게에 ' + deco.name + '이(가) 생겼어요 — 내일은 또 무엇이 생길까요?</div>' : '') +
      (unlocked ? '<div class="note" style="margin-top:8px">🌤️ 옆 무대의 안개가 걷혔어요 — 놀이터에서 구경해 봐요.</div>' : '') +
      '<div class="homebtn"><button class="btn" id="home">놀이터로</button></div>';
    body.appendChild(card); $('home').onclick = function(){ location.href = '../index.html'; };
  }

  /* ── 시작 — 설명 화면 0, 첫 터치에서 소리 잠금 해제 후 바로 ── */
  document.body.addEventListener('pointerdown', function once(){ KTTS.unlock(); PlayAudio.unlock(); document.body.removeEventListener('pointerdown', once); }, { once: true });
  /* 효과음 끄기 — 화면 설정이라 기기에 남는다(kedu-en-play-pref) */
  function sndBtn(){ var b = $('snd'), on = PlayAudio.enabled(); b.textContent = on ? '🔔' : '🔕'; b.classList.toggle('off', !on); b.title = on ? '효과음 켜짐' : '효과음 꺼짐'; }
  $('snd').onclick = function(){ PlayAudio.setEnabled(!PlayAudio.enabled()); sndBtn(); PlayAudio.play('ok'); };
  sndBtn();
  bag();
  run(0);
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

/* 점심 가게 — 무대 페이지는 구역과 겉모습만 넘긴다. 하루 흐름은 core/stage.js, 놀이는 games/, 사건 표는 content/events/.
   칸 둘(음식 · 음식·놀이)이 이 무대를 같이 쓴다 — 둘째 칸은 첫 칸의 특별 손님 + 단어 ¾ 이 꽃일 때 열린다 */
var CELL = PlayStage.pick('lunch-shop');
PlayStage.cellbar(document.getElementById('cellbar'), 'lunch-shop', CELL.id);
PlayStage.start({
  icon: 'shop',
  zone: CELL,
  sign: 'LUNCH SHOP', host: 'sam', wear: 'apron', where: '가게',
  open: { en: 'The shop is open!', ko: '가게가 열렸어!' }, opened: '가게가 열렸어요!',
  seedHint: '말로 주문을 받으면 씨앗이 심겨요.',
  endNote: '내일 다시 와서 말해 주면 새싹이 돼요.<br>3일에 꽃, 7일에 열매 — 열매가 되면 진열대에 올라가고<br>앞치마를 입을 수 있어요.',
  nextNote: '옆 무대의 안개가 걷혔어요 — 놀이터에서 구경해 봐요.'
});
</script>

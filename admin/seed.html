const row = (u, s, cls) => { let r = document.getElementById('r_' + u); if (!r){ r = document.createElement('div'); r.id = 'r_' + u; r.className = 'row'; log.appendChild(r); } r.innerHTML = `<span class="s ${cls||''}">${s}</span><span>${u}</span>`; };
const J = async p => { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error('읽기 실패 ' + p); return r.json(); };
go.onclick = async () => {
  go.disabled = true; sum.textContent = '';
  const { data: { session } } = await db.auth.getSession();
  if (!session){ sum.innerHTML = '<span class="bad">로그인이 안 돼 있어요. 교사 대시보드에서 로그인한 뒤 다시 열어 주세요.</span>'; go.disabled = false; return; }
  const dic = await J('/kedu/worksheet/data/_concepts.json');
  let totalQ = 0, fail = 0;
  for (const [u, label, sets] of UNITS){
    row(label, '읽는 중…');
    try {
      const docs = await Promise.all(sets.map(s => J('/kedu/worksheet/data/' + s + '.json')));
      const head = docs[0], grade = head.grade, subject = head.subject, unit = head.unit, semester = head.semester || 1;
      const usedC = new Set(), usedM = new Set();
      for (const d of docs) for (const x of d.questions){ if (x.concept) usedC.add(x.concept); for (const o of (x.options || []).concat(x.reason_options || [])) for (const k of ['mis','mis_target']) if (o[k]) usedM.add(o[k]); }

      const mis = [...usedM].filter(m => dic.misconceptions[m]).map(m => { const x = dic.misconceptions[m]; return { code: m, subject, grade, unit_code: unit, concept_codes: x.concepts || [], title: x.text, teacher_hint: x.hint || '' }; });
      const questions = [];
      sets.forEach((name, i) => { const d = docs[i]; for (const x of d.questions){
        const mm = []; for (const o of (x.options || []).concat(x.reason_options || [])) for (const k of ['mis','mis_target']) if (o[k] && !mm.includes(o[k])) mm.push(o[k]);
        questions.push({ qcode: name + '#' + x.seq, subject: d.subject, grade: d.grade, semester: d.semester || 1, unit_code: d.unit, lesson_code: d.lesson || '', source_set: name, source_kind: d.kind, concept_code: x.concept, difficulty: x.difficulty, qkind: x.kind, grading: x.kind === 'essay' ? 'teacher' : 'auto', stem: x.stem, misconception_codes: mm, has_variant: !!x.variant_rule, payload: x });
      } });
      // 개념·오개념 먼저, 문항은 200개씩
      let r = await db.rpc('admin_seed_rows', { p_concepts: concepts, p_mis: mis, p_questions: [] }); if (r.error) throw r.error;
      let n = 0;
      for (let i = 0; i < questions.length; i += 200){ r = await db.rpc('admin_seed_rows', { p_concepts: [], p_mis: [], p_questions: questions.slice(i, i + 200) }); if (r.error) throw r.error; n += r.data.questions; row(label, `${n}/${questions.length}`); }
      totalQ += n; row(label, `${n}문항 ✓`, 'ok');
    } catch (e) { fail++; row(label, '실패', 'bad'); const r = document.getElementById('r_' + label); if (r) r.innerHTML += `<span class="bad" style="flex:1;font-size:12px">${(e && (e.message || e.details || e.hint)) || String(e)}</span>`; console.error(u, e); }
    sum.textContent = `${totalQ}문항 넣음` + (fail ? ` · 실패 ${fail}` : '');
    if (fail) break;
  }
  sum.textContent += fail ? ' — 빨간 글씨를 그대로 보내 주세요.' : ' — 끝났어요. 케이학습지 화면을 새로고침하세요.';
  go.disabled = false;
};

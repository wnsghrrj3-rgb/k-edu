<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>케이학습지 시드 넣기</title>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff;--fg:#1e2430;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--btn:#2563eb;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaee;--muted:#9aa3b2;--line:#2a2f3a}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:22px;margin:0 0 6px} .hint{color:var(--muted);font-size:14px;margin:0 0 16px}
button.big{border:0;border-radius:12px;padding:14px 26px;background:var(--btn);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
#log{margin-top:18px;border-top:1px solid var(--line)} .row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .s{width:90px;color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)}
#sum{font-size:18px;font-weight:700;margin-top:14px}
</style></head><body><main>
<h1>케이학습지 시드 넣기</h1>
<p class="hint">단추 하나면 끝. 지금까지 만든 모든 단원을 스스로 찾아, 원장에 아직 없는 단원만 넣어요. 다시 눌러도 괜찮아요. 관리자 계정으로 로그인돼 있어야 해요.</p>
<button class="big" id="go">전부 넣기</button>
<div id="sum"></div>
<div id="log"></div>
</main><script>
let UNITS = [];
const SUBJ = { kor: '국어', math: '수학', soc: '사회', sci: '과학', eng: '영어' };
async function loadUnits(){
  const lm = (await J('/kedu/worksheet/data/_lesson_map.json')).lessons, U = new Map();
  for (const [k, v] of Object.entries(lm)){ const m = k.match(/^(g(\d)_(\d)_([a-z]+)_u(\d+))_/); if (!m) continue;
    if (!U.has(m[1])) U.set(m[1], [m[1], `${m[2]}학년 ${m[3]}학기 ${SUBJ[m[4]] || m[4]} ${m[5]}단원`, []]);
    const s = U.get(m[1])[2]; for (const x of [v.basic, v.challenge, ...(v.review || [])]) if (x && !s.includes(x)) s.push(x); }
  return [...U.values()].sort((a, b) => a[0].localeCompare(b[0], 'en', { numeric: true }));
}
const db = supabase.createClient(KEDU_SUPABASE_URL, KEDU_SUPABASE_ANON_KEY);
const log = document.getElementById('log'), sum = document.getElementById('sum'), go = document.getElementById('go');
const row = (u, s, cls) => { let r = document.getElementById('r_' + u); if (!r){ r = document.createElement('div'); r.id = 'r_' + u; r.className = 'row'; log.appendChild(r); } r.innerHTML = `<span class="s ${cls||''}">${s}</span><span>${u}</span>`; };
const J = async p => { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error('읽기 실패 ' + p); return r.json(); };
go.onclick = async () => {
  go.disabled = true; sum.textContent = '';
  const { data: { session } } = await db.auth.getSession();
  if (!session){ sum.innerHTML = '<span class="bad">로그인이 안 돼 있어요. 교사 대시보드에서 로그인한 뒤 다시 열어 주세요.</span>'; go.disabled = false; return; }
  const dic = await J('/kedu/worksheet/data/_concepts.json');
  UNITS = await loadUnits(); let skip = 0;
  let totalQ = 0, fail = 0;
  for (const [u, label, sets] of UNITS){
    row(label, '읽는 중…');
    try {
      const docs = await Promise.all(sets.map(s => J('/kedu/worksheet/data/' + s + '.json')));
      const head = docs[0], grade = head.grade, subject = head.subject, unit = head.unit, semester = head.semester || 1;
      const usedC = new Set(), usedM = new Set();
      for (const d of docs) for (const x of d.questions){ if (x.concept) usedC.add(x.concept); for (const o of (x.options || []).concat(x.reason_options || [])) for (const k of ['mis','mis_target']) if (o[k]) usedM.add(o[k]); }
      const concepts = [...usedC].filter(c => dic.concepts[c]).map(c => { const x = dic.concepts[c]; return { code: c, subject: x.subject || subject, grade: x.grade || grade, semester: x.semester || semester, unit_code: x.unit || unit, lesson_no: parseInt(String(x.lesson || '0').replace(/\D/g, '')) || 0, name: x.full || x.name, achievement_codes: x.achievement ? [x.achievement] : [], ord: x.order || 0 }; });
      const mis = [...usedM].filter(m => dic.misconceptions[m]).map(m => { const x = dic.misconceptions[m]; return { code: m, subject, grade, unit_code: unit, concept_codes: x.concepts || [], title: x.text, teacher_hint: x.hint || '' }; });
      const questions = [];
      sets.forEach((name, i) => { const d = docs[i]; for (const x of d.questions){
        const mm = []; for (const o of (x.options || []).concat(x.reason_options || [])) for (const k of ['mis','mis_target']) if (o[k] && !mm.includes(o[k])) mm.push(o[k]);
        questions.push({ qcode: name + '#' + x.seq, subject: d.subject, grade: d.grade, semester: d.semester || 1, unit_code: d.unit, lesson_code: d.lesson || '', source_set: name, source_kind: d.kind, concept_code: x.concept, difficulty: x.difficulty, qkind: x.kind, grading: x.kind === 'essay' ? 'teacher' : 'auto', stem: x.stem, misconception_codes: mm, has_variant: !!x.variant_rule, payload: x });
      } });
      const have = await db.from('question_bank').select('qcode', { count: 'exact', head: true }).like('source_set', u + '\\_%');
      if (!have.error && have.count === questions.length){ skip++; row(label, '이미 있음', 'ok'); continue; }
      // 개념·오개념 먼저, 문항은 200개씩
      let r = await db.rpc('admin_seed_rows', { p_concepts: concepts, p_mis: mis, p_questions: [] }); if (r.error) throw r.error;
      let n = 0;
      for (let i = 0; i < questions.length; i += 200){ r = await db.rpc('admin_seed_rows', { p_concepts: [], p_mis: [], p_questions: questions.slice(i, i + 200) }); if (r.error) throw r.error; n += r.data.questions; row(label, `${n}/${questions.length}`); }
      totalQ += n; row(label, `${n}문항 ✓`, 'ok');
    } catch (e) { fail++; row(label, '실패', 'bad'); const r = document.getElementById('r_' + label); if (r) r.innerHTML += `<span class="bad" style="flex:1;font-size:12px">${(e && (e.message || e.details || e.hint)) || String(e)}</span>`; console.error(u, e); }
    sum.textContent = `${totalQ}문항 넣음 · 이미 있던 단원 ${skip}개 건너뜀` + (fail ? ` · 실패 ${fail}` : '');
    if (fail) break;
  }
  sum.textContent += fail ? ' — 빨간 글씨를 그대로 보내 주세요.' : ' — 끝났어요. 케이학습지 화면을 새로고침하세요.';
  go.disabled = false;
};
</script></body></html>

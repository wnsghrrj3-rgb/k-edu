[package]
name = "kmovie-shell"
version = "0.1.0"
description = "케이무비 데스크톱 껍데기 — keduclass.com/kmovie 에 ffmpeg 프록시·원화질 렌더를 붙인다"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kmovie_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

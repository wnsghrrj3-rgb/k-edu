<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이생기부 | K-edu 교사</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../kedu_config.js"></script>
<script src="record_engine.js"></script>
<style id="kedu-title-font">
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
</style>
<style>
/* =============================================
   케이생기부 v1 (2026-11-12) — 규칙 기반 · API 없음 · 이 기기에만 저장
   · 행동특성 및 종합의견: 세 줄(학습·수업 태도 / 인품·친구 관계 / 예체능 특기), 한 줄 40자 안팎
   · 교과·학기말 종합의견 / 창체: 수행평가 기준을 넣고 학생마다 N가지씩 나누어 넣기
   · 문장 짓기는 record_engine.js
   ============================================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8EF8;--primary-light:#EBF4FF;--primary-dark:#3B6FD8;
  --green:#2F9E6B;--green-light:#E4F7EE;--orange:#D9822B;--orange-light:#FFF1DD;--red:#E53E3E;
  --bg:#F5F7FA;--card:#fff;--text:#1A202C;--sub:#718096;--border:#E2E8F0;
  --radius:16px;--shadow:0 2px 16px rgba(0,0,0,.06);
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;color:inherit}

.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;min-height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar-back{font-size:13px;color:var(--sub);text-decoration:none;padding:6px 10px;border-radius:8px;white-space:nowrap}
.topbar-back:hover{background:var(--primary-light);color:var(--primary)}
.topbar-title{font-family:var(--kedu-title);font-size:16px;white-space:nowrap}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;color:var(--sub)}
select.btn{padding-right:8px}

.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;color:var(--sub)}
.tab.on{background:var(--text);border-color:var(--text);color:#fff}
.lock-note{margin-left:auto;font-size:12px;color:var(--sub)}
.sec{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.center-state{text-align:center;padding:80px 20px;color:var(--sub)}
.center-state .ttl{font-size:17px;font-weight:700;color:var(--text);margin:10px 0 6px}
.spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mini{font-size:12px;color:var(--sub)}

/* ── 행동특성 ── */
.hb{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start}
.stu-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:72px}
.stu{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.stu:hover{background:var(--bg)}
.stu.on{background:var(--primary-light);font-weight:700}
.stu .no{font-variant-numeric:tabular-nums;color:var(--sub);width:22px;text-align:right;font-size:12px}
.stu .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .dots{display:flex;gap:3px}
.stu .dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.stu .dots i.ok{background:var(--green)}
.stu .dots i.dup{background:var(--orange)}
.ed-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.ed-name{font-family:var(--kedu-title);font-size:20px}
.legend{font-size:12px;color:var(--sub);margin-bottom:14px}
.legend b{display:inline-block;border-radius:999px;padding:1px 8px;margin:0 2px;font-weight:700}
.lv-h{background:var(--primary);color:#fff}.lv-m{background:var(--green-light);color:var(--green)}.lv-l{background:var(--orange-light);color:var(--orange)}
.line{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.line-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.line-h .n{width:22px;height:22px;border-radius:50%;background:var(--text);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.line-h .t{font-weight:700;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--primary)}
.chip.h{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.chip.m{background:var(--green-light);border-color:var(--green);color:var(--green);font-weight:700}
.chip.l{background:var(--orange-light);border-color:var(--orange);color:var(--orange);font-weight:700}
.xrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.xrow label{font-size:12.5px;color:var(--sub);font-weight:600}
.xrow input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;width:190px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--sub);font-weight:700}
.band-seg{margin-left:6px}.band-seg button.on{background:var(--primary);color:#fff}
.seg button.on.h{background:var(--primary);color:#fff}.seg button.on.m{background:var(--green-light);color:var(--green)}.seg button.on.l{background:var(--orange-light);color:var(--orange)}
.out{display:flex;gap:8px;align-items:center}
.out textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.5;resize:none;background:#FAFBFD;min-height:42px}
.out textarea:focus{outline:2px solid var(--primary-light);border-color:var(--primary);background:#fff}
.cnt{font-size:12px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right;color:var(--sub);font-weight:700}
.cnt.ok{color:var(--green)}.cnt.far{color:var(--orange)}
.flag{font-size:12px;color:var(--orange);margin-top:6px;font-weight:600}
.result{background:#F8FAFF;border:1px solid #D6E4FF;border-radius:14px;padding:14px}
.result .txt{font-size:14.5px;line-height:1.75;white-space:pre-wrap;min-height:26px}
.result .txt.empty{color:var(--sub);font-size:13px}
.result .bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.result .bar .sp{flex:1}

/* ── 교과 · 창체 ── */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--border);background:#fff;border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pill.add{color:var(--sub);border-style:dashed}
.sj-top{display:grid;grid-template-columns:1fr 250px;gap:14px;margin-bottom:14px}
.sj-top textarea{width:100%;min-height:128px;border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.7;resize:vertical}
.sj-side{display:flex;flex-direction:column;gap:10px}
.sj-side input.nm{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700;width:100%}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:17px;cursor:pointer;font-weight:700}
.stepper b{font-size:18px;min-width:24px;text-align:center}
.crit-list{font-size:12.5px;line-height:1.7;color:var(--sub);margin-bottom:10px}
.crit-list span{display:inline-block;margin-right:12px}
.crit-list b{color:var(--text)}
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table.mx{border-collapse:collapse;width:100%;font-size:13px}
.mx th,.mx td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:center;vertical-align:middle}
.mx th{background:#F8FAFC;font-size:12px;color:var(--sub);position:sticky;top:0;white-space:nowrap}
.mx td.nm{text-align:left;white-space:nowrap;font-weight:600}
.mx td.nm .no{color:var(--sub);font-weight:400;margin-right:6px;font-size:12px}
.mx td.tx{text-align:left;min-width:300px}
.mx td.tx textarea{width:100%;border:1px solid transparent;border-radius:8px;padding:5px 7px;font-size:13px;line-height:1.55;resize:none;background:transparent}
.mx td.tx textarea:hover{border-color:var(--border)}
.mx td.tx textarea:focus{outline:none;border-color:var(--primary);background:#fff}
.cell{width:30px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-weight:700;color:#CBD5E0}
.cell.in.h{background:var(--primary);border-color:var(--primary);color:#fff}
.cell.in.m{background:var(--green-light);border-color:var(--green);color:var(--green)}
.cell.in.l{background:var(--orange-light);border-color:var(--orange);color:var(--orange)}
.empty-box{padding:36px 16px;text-align:center;color:var(--sub);font-size:13.5px;line-height:1.8}

/* ── 창 ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
.modal.wide{max-width:980px}
.modal h3{font-family:var(--kedu-title);font-size:18px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:12px}
.modal textarea{width:100%;min-height:220px;border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.7}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
table.ov{border-collapse:collapse;width:100%;font-size:13.5px}
.ov th,.ov td{border-bottom:1px solid var(--border);padding:9px 8px;text-align:left;vertical-align:top;line-height:1.65}
.ov th{font-size:12px;color:var(--sub)}
.ov td.c{white-space:nowrap;color:var(--sub);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;border-radius:999px;padding:10px 20px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:400}
.toast.on{opacity:1;transform:translateX(-50%)}

@media(max-width:820px){
  .hb{grid-template-columns:1fr}
  .stu-list{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto}
  .stu{width:auto;flex-shrink:0}
  .sj-top{grid-template-columns:1fr}
  .lock-note{margin-left:0;width:100%}
}
</style>
<script src="/kedu_teacher_gate.js"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/teacher/" class="topbar-back">← 교사 대시보드로</a>
    <span class="topbar-title">📝 케이생기부</span>
  </div>
  <div class="topbar-right" id="top-right" style="display:none">
    <select class="btn" id="class-sel" style="display:none"></select>
    <button class="btn" data-act="roster">👥 명단</button>
    <button class="btn" data-act="backup">💾 백업</button>
  </div>
</div>

<div class="wrap" id="app">
  <div class="center-state"><span class="spin"></span><div class="ttl">명단을 불러오는 중…</div></div>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modal-box"></div></div>
<input type="file" id="file-in" accept="application/json,.json" style="display:none">
<div class="toast" id="toast"></div>

<script>
'use strict';
const K = window.KeduRecord;
const LV = ['h', 'm', 'l'];
const LV_MARK = { h: '◎', m: '○', l: '△' };
const LV_SUBJ = { h: '잘', m: '보', l: '노' };
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let db = null, classes = [], classId = null, serverRoster = [];
let S = null;                         // 저장되는 상태
let classGrade = null;                // 학급 학년(class_codes.grade)
const BAND = () => (S && S.band) || K.bandOfGrade(classGrade);
const LINES = () => K.linesFor(BAND());
const PC = text => K.parseCriteria(text, BAND());
let tab = 'hb', curSid = null, curItem = { subj: 0, cc: 0 };

/* ---------- 저장(이 기기 · 이 계정) ---------- */
const keyOf = () => 'kedu_record_v1:' + (classId || 'local');
function newItem(name) { return { id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, crit: '', n: 2, lv: {}, shift: {}, over: {} }; }
function blank() {
  return { v: 1, manualRoster: null, hb: {},
    band: K.bandOfGrade(classGrade), subj: K.subjectsFor(classGrade).map(newItem),
    cc: ['자율·자치활동', '동아리활동', '진로활동'].map(newItem) };
}
function load() {
  try { const j = JSON.parse(localStorage.getItem(keyOf()) || 'null'); if (j && j.v === 1) { S = j; return; } } catch (e) {}
  S = blank();
}
let _saveT = null;
function save() { clearTimeout(_saveT); _saveT = setTimeout(() => { try { localStorage.setItem(keyOf(), JSON.stringify(S)); } catch (e) { toast('저장하지 못했어요 — 백업 파일로 내려받아 두세요'); } }, 150); }

const roster = () => (S.manualRoster && S.manualRoster.length) ? S.manualRoster : serverRoster;
const stuOf = sid => roster().find(s => s.id === sid);
const label = s => (s.no != null ? s.no + '번 ' : '') + (s.name || '');

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
async function copy(text, okMsg) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(okMsg || '복사했어요');
}
const tsv = s => String(s || '').replace(/[\t\n]+/g, ' ');

/* ============================================================
   ① 행동특성 및 종합의견
   ============================================================ */
function hbOf(sid) {
  if (!S.hb[sid]) S.hb[sid] = {};
  LINES().forEach(L => { if (!S.hb[sid][L.id]) S.hb[sid][L.id] = { sel: {}, x: '', xl: 'h', text: '', roll: 0 }; });
  return S.hb[sid];
}
function usedBy(lineId, exceptSid) {
  const u = {}; roster().forEach(s => { if (s.id === exceptSid) return; const t = S.hb[s.id] && S.hb[s.id][lineId] && S.hb[s.id][lineId].text; if (t) u[t] = (u[t] || 0) + 1; });
  return u;
}
function regen(sid, lineId) {
  const d = hbOf(sid)[lineId];
  d.text = K.compose(lineId, d, { seed: sid + ':' + lineId, roll: d.roll, used: usedBy(lineId, sid), band: BAND() });
  save();
}
const hbFull = sid => { const h = S.hb[sid]; return h ? LINES().map(L => (h[L.id].text || '').trim()).filter(Boolean).join(' ') : ''; };
const picked = (d, L) => Object.keys(d.sel).filter(k => !L || L.byId[k]).length + (d.x.trim() ? 1 : 0);

function renderHb() {
  const rs = roster();
  if (!curSid || !stuOf(curSid)) curSid = rs[0] && rs[0].id;
  $('#view').innerHTML = `<div class="hb"><div class="stu-list" id="stu-list"></div><div class="sec" id="editor"></div></div>`;
  renderStuList(); renderEditor();
}
function renderStuList() {
  const el = $('#stu-list'); if (!el) return;
  const used = {}; LINES().forEach(L => { used[L.id] = usedBy(L.id, null); });
  el.innerHTML = roster().map(s => {
    const h = S.hb[s.id];
    const dots = LINES().map(L => { const t = h && h[L.id].text; return `<i class="${!t ? '' : (used[L.id][t] > 1 ? 'dup' : 'ok')}"></i>`; }).join('');
    return `<button class="stu ${s.id === curSid ? 'on' : ''}" data-sid="${esc(s.id)}"><span class="no">${s.no != null ? s.no : ''}</span><span class="nm">${esc(s.name || '')}</span><span class="dots">${dots}</span></button>`;
  }).join('');
}
function cntHtml(t) { const n = (t || '').length; return `<span class="cnt ${!n ? '' : (Math.abs(n - K.TARGET) <= 6 ? 'ok' : 'far')}">${n}자</span>`; }
function renderEditor() {
  const el = $('#editor'); if (!el) return; const s = stuOf(curSid);
  if (!s) { el.innerHTML = `<div class="empty-box">명단이 비어 있어요. 위쪽 「👥 명단」에서 학생을 넣어 주세요.</div>`; return; }
  const h = hbOf(s.id);
  el.innerHTML = `
    <div class="ed-head"><span class="ed-name">${esc(label(s))}</span><span class="mini">한 줄에 두 가지까지 · 한 줄 40자 안팎</span></div>
    <div class="legend">칩을 누를 때마다 <b class="lv-h">◎ 뛰어남</b>→<b class="lv-m">○ 잘함</b>→<b class="lv-l">△ 노력 중</b>→ 꺼짐</div>
    ${LINES().map((L, i) => { const d = h[L.id]; return `
    <div class="line" data-line="${L.id}">
      <div class="line-h"><span class="n">${i + 1}</span><span class="t">${esc(L.label)}</span></div>
      <div class="chips">${L.traits.map(t => `<button class="chip ${d.sel[t.id] || ''}" data-trait="${t.id}">${esc(t.label)}${d.sel[t.id] ? ' ' + LV_MARK[d.sel[t.id]] : ''}</button>`).join('')}</div>
      <div class="xrow"><label>${esc(L.xLabel)}</label><input type="text" data-x maxlength="14" placeholder="${esc(L.xHint)}" value="${esc(d.x)}">
        <span class="seg">${LV.map(v => `<button class="${v} ${d.xl === v ? 'on' : ''}" data-xl="${v}">${LV_MARK[v]}</button>`).join('')}</span></div>
      <div class="out"><textarea rows="1" data-text placeholder="칩을 고르거나 낱말을 적으면 문장이 나와요">${esc(d.text)}</textarea><span data-cnt>${cntHtml(d.text)}</span><button class="btn sm" data-roll title="다른 문장으로">🔄</button></div>
      <div class="flag" data-flag></div>
    </div>`; }).join('')}
    <div class="result"><div class="txt" id="res-txt"></div>
      <div class="bar"><span class="mini" id="res-cnt"></span><span class="sp"></span>
        <button class="btn" data-act="hb-copy">📋 복사</button><button class="btn primary" data-act="hb-next">다음 학생 →</button></div></div>`;
  el.querySelectorAll('textarea[data-text]').forEach(grow);
  refreshResult();
}
function grow(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
function refreshLine(lineId, keepText) {
  const box = $(`.line[data-line="${lineId}"]`); if (!box) return; const d = hbOf(curSid)[lineId];

/* ============================================================
   ② 교과·학기말 종합의견 / 창체 — 기준 넣고 나누어 넣기
   ============================================================ */
const items = () => S[tab];
const item = () => { const a = items(); if (curItem[tab] >= a.length) curItem[tab] = Math.max(0, a.length - 1); return a[curItem[tab]]; };
function picksOf(it, crit, order, sid) { return K.assign(crit.length, Math.min(it.n, crit.length), order, it.shift[sid] || 0, it.id); }
function autoText(it, crit, order, sid) { return K.subjectText(crit, picksOf(it, crit, order, sid), it.lv[sid] || {}); }
function sjText(it, crit, order, sid) { return it.over[sid] != null ? it.over[sid] : autoText(it, crit, order, sid); }

function renderSj() {
  const a = items(), it = item(), isCc = tab === 'cc';
  const pills = a.map((x, i) => `<button class="pill ${i === curItem[tab] ? 'on' : ''}" data-item="${i}">${esc(x.name)}</button>`).join('') + `<button class="pill add" data-act="item-add">＋ ${isCc ? '영역' : '과목'}</button>`;
  if (!it) { $('#view').innerHTML = `<div class="sec"><div class="pills">${pills}</div><div class="empty-box">${isCc ? '영역' : '과목'}을 먼저 추가해 주세요.</div></div>`; return; }
  $('#view').innerHTML = `<div class="sec">
    <div class="pills">${pills}</div>
    <div class="sj-top">
      <div><textarea id="crit" placeholder="${isCc ? '활동 내용·평가 기준' : '수행평가 기준'}을 한 줄에 하나씩 넣어 주세요.&#10;&#10;예) 글자의 짜임을 알고 글자를 바르게 쓴다&#10;예) 글을 소리 내어 읽는다&#10;&#10;수준별 문장이 있으면 한 줄에  잘함 | 보통 | 노력요함  순서로 (한글 표에서 복사해도 돼요)">${esc(it.crit)}</textarea></div>
      <div class="sj-side">
        <input class="nm" id="item-name" value="${esc(it.name)}" maxlength="20">
        <div><div class="mini" style="margin-bottom:5px">학생마다 몇 가지를 넣을까요?</div>
          <div class="stepper"><button data-n="-1">−</button><b id="n-val">${it.n}</b><button data-n="1">＋</button><span class="mini">가지</span></div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="sj-shuffle">🔀 다시 나누기</button><button class="btn sm ghost" data-act="item-del">삭제</button></div>
      </div>
    </div>
    <div id="sj-table"></div></div>`;
  renderSjTable();
}
function renderSjTable() {
  const el = $('#sj-table'); if (!el) return; const it = item(), crit = PC(it.crit), rs = roster();
  $('#n-val').textContent = Math.min(it.n, Math.max(1, crit.length));
  if (!crit.length) { el.innerHTML = `<div class="empty-box">기준을 넣으면 여기에 학생별 표가 생겨요.<br>칸을 눌러 <b>잘함 → 보통 → 노력요함</b>으로 바꾸면 문장이 그 수준에 맞게 바뀝니다.</div>`; return; }
  if (!rs.length) { el.innerHTML = `<div class="empty-box">명단이 비어 있어요. 위쪽 「👥 명단」에서 학생을 넣어 주세요.</div>`; return; }
  const head = crit.map((c, i) => `<th title="${esc(c.h)}">${i + 1}</th>`).join('');
  const rows = rs.map((s, order) => {
    const picks = picksOf(it, crit, order, s.id), lv = it.lv[s.id] || {}, t = sjText(it, crit, order, s.id);
    const cells = crit.map((c, i) => { const v = lv[i] || 'h', inn = picks.indexOf(i) >= 0; return `<td><button class="cell ${inn ? 'in ' + v : ''}" data-ci="${i}" title="${esc(c[v])}">${LV_SUBJ[v]}</button></td>`; }).join('');
    return `<tr data-sid="${esc(s.id)}" data-order="${order}"><td class="nm"><span class="no">${s.no != null ? s.no : ''}</span>${esc(s.name || '')}</td>${cells}
      <td><button class="btn sm ghost" data-row-roll title="이 학생만 다른 조합으로">🔄</button></td>
      <td class="tx"><textarea rows="1" data-over>${esc(t)}</textarea></td><td class="mini" data-len>${t.length}자</td></tr>`;
  }).join('');
  el.innerHTML = `
    <div class="crit-list">${crit.map((c, i) => `<span><b>${i + 1}</b> ${esc(c.h)}</span>`).join('')}</div>
    <div class="tbl-wrap"><table class="mx"><tr><th>학생</th>${head}<th></th><th style="text-align:left">${esc(it.name)} — 색칠된 칸이 들어간 기준</th><th>글자</th></tr>${rows}</table></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
      <button class="btn" data-act="sj-copy-all">📋 전체 ${tab === 'cc' ? '영역' : '과목'} 표 복사</button><button class="btn primary" data-act="sj-copy">📋 ${esc(it.name)} 복사</button></div>`;
  el.querySelectorAll('textarea[data-over]').forEach(grow);
}
function sjCopy(all) {
  const rs = roster(), a = all ? items().filter(x => PC(x.crit).length) : [item()];
  const crits = a.map(x => PC(x.crit));
  const lines = [['번호', '이름'].concat(a.map(x => x.name)).join('\t')];
  rs.forEach((s, order) => lines.push([s.no != null ? s.no : '', s.name || ''].concat(a.map((x, i) => tsv(sjText(x, crits[i], order, s.id)))).join('\t')));
  copy(lines.join('\n'), '표를 복사했어요 — 엑셀·한글에 붙여 넣으세요');

function openModal(html, wide) { $('#modal-box').className = 'modal' + (wide ? ' wide' : ''); $('#modal-box').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }

function rosterModal() {
  const cur = (S.manualRoster || []).map(s => (s.no != null ? s.no + ' ' : '') + (s.name || '')).join('\n');
  openModal(`<h3>👥 명단</h3>
    <p>${serverRoster.length ? `지금은 <b>학급 명단 ${serverRoster.length}명</b>을 쓰고 있어요. 따로 쓰고 싶을 때만 아래에 적어 주세요.` : '학급 명단이 없어요. 아래에 적어 주세요.'}<br>
    한 줄에 한 명 「번호 이름」. 이름 없이 쓰려면 <b>인원수만</b>(예: 24) 적어도 돼요.</p>
    <textarea id="roster-ta" placeholder="1 김하늘&#10;2 박바다&#10;…">${esc(cur)}</textarea>
    <div class="acts">${serverRoster.length && S.manualRoster ? '<button class="btn ghost" data-act="roster-reset">학급 명단으로 되돌리기</button>' : ''}<button class="btn" data-act="close">닫기</button><button class="btn primary" data-act="roster-save">저장</button></div>`);
}
function parseRoster(text) {
  const lines = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (lines.length === 1 && /^\d{1,2}$/.test(lines[0])) return Array.from({ length: +lines[0] }, (_, i) => ({ id: 'm' + (i + 1), no: i + 1, name: '' }));
  return lines.map((ln, i) => { const m = ln.match(/^(\d{1,2})\s*[.)번]?\s*(.*)$/); const no = m ? +m[1] : i + 1, name = (m ? m[2] : ln).trim(); return { id: 'm' + no, no, name }; }).sort((a, b) => a.no - b.no);
}
function backupModal() {
  openModal(`<h3>💾 백업</h3><p>적어 둔 내용은 이 컴퓨터에만 있어요. 다른 컴퓨터에서 이어 쓰려면 파일로 내려받아 그쪽에서 불러오세요.<br>파일에는 학생 이름과 생기부 초안이 들어 있으니 보관에 주의해 주세요.</p>
    <div class="acts" style="justify-content:flex-start"><button class="btn primary" data-act="export">⬇ 파일로 내려받기</button><button class="btn" data-act="import">⬆ 파일 불러오기</button><button class="btn ghost" data-act="wipe">이 학급 내용 모두 지우기</button><button class="btn" data-act="close" style="margin-left:auto">닫기</button></div>`);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-act]'); if (!t) { if (e.target.id === 'modal') closeModal(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; renderTab(); return; }
  if (t.dataset.band) { setBand(t.dataset.band); return; }
  if (t.dataset.sid && t.classList.contains('stu')) { curSid = t.dataset.sid; renderStuList(); renderEditor(); return; }
  const lineBox = t.closest('.line');
  if (lineBox) {
    const lid = lineBox.dataset.line, d = hbOf(curSid)[lid], LL = LINES().find(L => L.id === lid);
    if (t.dataset.trait) {
      const id = t.dataset.trait, cur = d.sel[id];
      if (!cur) { if (picked(d, LL) >= K.MAX_PICK) { toast('한 줄에 두 가지까지예요'); return; } d.sel[id] = 'h'; }
      else if (cur === 'l') delete d.sel[id]; else d.sel[id] = LV[LV.indexOf(cur) + 1];
      d.roll = 0; regen(curSid, lid); refreshLine(lid); return;
    }
    if (t.dataset.xl) { d.xl = t.dataset.xl; d.roll = 0; regen(curSid, lid); refreshLine(lid); return; }
    if (t.hasAttribute('data-roll')) { if (!picked(d, LL)) { toast('먼저 칩을 고르거나 낱말을 적어 주세요'); return; } d.roll++; regen(curSid, lid); refreshLine(lid); return; }
  }
  if (t.dataset.item != null) { curItem[tab] = +t.dataset.item; renderSj(); return; }
  if (t.dataset.n) { const it = item(), k = PC(it.crit).length || 9; it.n = Math.max(1, Math.min(k, Math.min(it.n, k) + (+t.dataset.n))); it.over = {}; save(); renderSjTable(); return; }
  const row = t.closest('tr[data-sid]');
  if (row && tab !== 'hb') {
    const it = item(), sid = row.dataset.sid;
    if (t.dataset.ci != null) { const lv = it.lv[sid] || (it.lv[sid] = {}), i = +t.dataset.ci; lv[i] = LV[(LV.indexOf(lv[i] || 'h') + 1) % 3]; delete it.over[sid]; save(); renderSjTable(); return; }
    if (t.hasAttribute('data-row-roll')) { it.shift[sid] = (it.shift[sid] || 0) + 1; delete it.over[sid]; save(); renderSjTable(); return; }
  }
  switch (t.dataset.act) {
    case 'close': closeModal(); break;
    case 'roster': rosterModal(); break;
    case 'roster-save': { const r = parseRoster($('#roster-ta').value); S.manualRoster = r.length ? r : null; save(); closeModal(); curSid = null; renderTab(); toast(r.length ? `명단 ${r.length}명을 저장했어요` : '학급 명단을 씁니다'); break; }
    case 'roster-reset': S.manualRoster = null; save(); closeModal(); curSid = null; renderTab(); break;
    case 'backup': backupModal(); break;
    case 'export': { const blob = new Blob([JSON.stringify({ app: 'kedu-record', savedAt: new Date().toISOString(), roster: roster(), state: S })], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '케이생기부_백업_' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); break; }
    case 'import': $('#file-in').click(); break;
    case 'wipe': if (confirm('이 학급에 적어 둔 생기부 내용을 모두 지울까요? 되돌릴 수 없어요.')) { S = blank(); save(); closeModal(); curSid = null; renderTab(); toast('모두 지웠어요'); } break;
    case 'hb-copy': { const f = hbFull(curSid); if (!f) { toast('아직 문장이 없어요'); break; } copy(f); break; }
    case 'hb-next': { const rs = roster(), i = rs.findIndex(s => s.id === curSid); if (i < rs.length - 1) { curSid = rs[i + 1].id; renderStuList(); renderEditor(); window.scrollTo({ top: 0 }); const on = $('.stu.on'); if (on) on.scrollIntoView({ block: 'nearest' }); } else toast('마지막 학생이에요'); break; }
    case 'hb-all': hbOverview(); break;
    case 'hb-copy-all': copy(['번호\t이름\t행동특성 및 종합의견'].concat(roster().map(s => [s.no != null ? s.no : '', s.name || '', tsv(hbFull(s.id))].join('\t'))).join('\n'), '표를 복사했어요 — 엑셀·한글에 붙여 넣으세요'); break;
    case 'item-add': items().push(newItem(tab === 'cc' ? '새 영역' : '새 과목')); curItem[tab] = items().length - 1; save(); renderSj(); $('#item-name').select(); break;
    case 'item-del': if (confirm(`「${item().name}」을(를) 지울까요? 넣어 둔 기준과 수준도 함께 지워져요.`)) { items().splice(curItem[tab], 1); curItem[tab] = 0; save(); renderSj(); } break;
    case 'sj-shuffle': { const it = item(); roster().forEach(s => { it.shift[s.id] = (it.shift[s.id] || 0) + 1; }); it.over = {}; save(); renderSjTable(); break; }
    case 'sj-copy': sjCopy(false); break;
    case 'sj-copy-all': sjCopy(true); break;
  }
});
let _critT = null;
document.addEventListener('input', e => {
  const t = e.target, lineBox = t.closest('.line');
  if (lineBox && curSid) {
    const lid = lineBox.dataset.line, d = hbOf(curSid)[lid];
    if (t.hasAttribute('data-x')) { d.x = t.value; d.roll = 0; regen(curSid, lid); refreshLine(lid); if (t.value.trim() && Object.keys(d.sel).length >= K.MAX_PICK) toast('칩을 하나 끄면 이 낱말이 문장에 들어가요'); return; }
    if (t.hasAttribute('data-text')) { d.text = t.value.replace(/\n/g, ' '); save(); refreshLine(lid, true); return; }
  }
  if (t.id === 'crit') { const it = item(); it.crit = t.value; it.over = {}; save(); clearTimeout(_critT); _critT = setTimeout(renderSjTable, 250); return; }
  if (t.id === 'item-name') { item().name = t.value.trim() || '이름 없음'; save(); const p = $('.pill.on'); if (p) p.textContent = item().name; return; }
  if (t.hasAttribute('data-over')) { const row = t.closest('tr'), it = item(), sid = row.dataset.sid, v = t.value.replace(/\n/g, ' '); const auto = autoText(it, PC(it.crit), +row.dataset.order, sid); if (v === auto) delete it.over[sid]; else it.over[sid] = v; save(); grow(t); $('[data-len]', row).textContent = v.length + '자'; }
});
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (!j || j.app !== 'kedu-record' || !j.state || j.state.v !== 1) throw 0;
    if (!confirm('지금 화면의 내용을 불러온 파일로 바꿀까요?')) return;
    S = j.state; if (!S.manualRoster && Array.isArray(j.roster) && !serverRoster.length) S.manualRoster = j.roster;
    save(); closeModal(); curSid = null; renderTab(); toast('불러왔어요');
  } catch (err) { toast('케이생기부 백업 파일이 아니에요'); }
});

/* ---------- 학년 범위(저학년·고학년) ---------- */
function setBand(b) {
  if (b === BAND()) return;
  const made = roster().filter(st => S.hb[st.id] && Object.values(S.hb[st.id]).some(d => d && d.text)).length;
  S.band = b;
  /* 새 범위에 없는 칩은 떼어 낸다 */
  roster().forEach(st => { const h = S.hb[st.id]; if (!h) return; LINES().forEach(L => { const d = h[L.id]; if (d) Object.keys(d.sel).forEach(k => { if (!L.byId[k]) delete d.sel[k]; }); }); });
  if (made && confirm(`이미 문장을 지은 학생이 ${made}명 있어요. ${K.BAND_LABEL[b]} 말씨로 다시 지을까요?\n(손으로 고친 문장도 새로 지어져요)`)) {
    roster().forEach(st => { const h = S.hb[st.id]; if (!h) return; LINES().forEach(L => { const d = h[L.id]; if (!d) return; if (picked(d, L)) { d.roll = 0; regen(st.id, L.id); } else d.text = ''; }); });
  }
  save(); renderShell(); toast(K.BAND_LABEL[b] + ' 말씨로 바꿨어요');
}

/* ---------- 시작 ---------- */
function showError(ttl, desc) { $('#app').innerHTML = `<div class="center-state"><div style="font-size:40px">🔒</div><div class="ttl">${esc(ttl)}</div><div>${esc(desc)}</div></div>`; }
async function loadClass(id) {
  classId = id; serverRoster = []; classGrade = ((classes.find(c => c.id === id) || {}).grade) || null;
  if (id) {
    const { data } = await db.from('student_seats').select('id, nickname, seat_no').eq('class_code_id', id);
    serverRoster = (data || []).map(x => ({ id: 'seat:' + x.id, no: x.seat_no, name: x.nickname || '' }))
      .sort((a, b) => (a.no == null) - (b.no == null) || (a.no - b.no) || String(a.name).localeCompare(String(b.name), 'ko'));
  }
  load(); curSid = null; renderShell();
  if (!roster().length) rosterModal();
}
async function init() {
  db = getKeduDb();
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = '/auth/?redirect=' + encodeURIComponent(location.href); return; }
  const { data: t } = await db.from('teachers').select('id, name').eq('user_id', session.user.id).maybeSingle();
  if (!t) { showError('교사 권한이 없습니다', '케이생기부는 승인된 교사만 쓸 수 있습니다.'); return; }
  const { data: cc } = await db.from('class_codes').select('id, code, label, grade').eq('teacher_id', t.id).eq('is_active', true).order('created_at', { ascending: false });
  classes = cc || [];
  const want = new URLSearchParams(location.search).get('class_code_id');
  const first = (classes.find(c => c.id === want) || classes[0] || {}).id || null;
  const sel = $('#class-sel');
  if (classes.length > 1) { sel.style.display = ''; sel.innerHTML = classes.map(c => `<option value="${esc(c.id)}">${esc(c.label || c.code)}</option>`).join(''); sel.value = first; sel.onchange = () => loadClass(sel.value); }
  $('#top-right').style.display = '';
  await loadClass(first);
}
init().catch(err => showError('불러오지 못했습니다', (err && err.message) || '잠시 뒤 다시 열어 주세요.'));
</script>
</body>
</html>

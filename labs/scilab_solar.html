<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌍 케이랩 · 태양계·달 관측소</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#e7ecf5; --sub:#93a4c4; --panel:rgba(10,14,26,.82); --line:rgba(255,255,255,.12);
         --sun:#ffd466; --earth:#5aa0e0; --moon:#e9edf5; --hi:#ffd166; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#060912;color:var(--ink);overflow:hidden;
    font-family:'Gowun Dodum',system-ui,sans-serif;touch-action:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#060912;color:var(--sub);font-size:15px;z-index:50}
  #loading.hide{display:none}
  #stage{position:fixed;inset:0}
  #brand{position:fixed;top:12px;left:16px;z-index:20;font-family:'Jua';font-size:17px}
  #brand .k{color:var(--earth)}
  #back{position:fixed;top:14px;right:16px;z-index:20;font-size:12.5px;color:var(--sub);
    text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  #note{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:var(--sub);font-size:11px;z-index:18;opacity:.55}
  #hud{position:fixed;top:44px;left:0;right:0;text-align:center;z-index:18;pointer-events:none}
  #hud .row{display:inline-flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:7px 16px;font-size:12.5px;backdrop-filter:blur(8px);flex-wrap:wrap;justify-content:center;max-width:94vw}
  #hud b{font-family:'Jua';font-weight:400;color:#fff}
  #hud .sea b{color:var(--hi)} #hud .alt b{color:var(--sun)} #hud .moon b{color:var(--moon)}
  /* 하늘 궤적 패널 */
  #lens{position:fixed;right:14px;top:86px;z-index:19;width:min(44vw,320px);background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;backdrop-filter:blur(8px)}

  #lensHead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:6px}

  #skyCv{width:100%;height:150px;display:block}
  /* 달 위상 원반 */
  #moonWrap{position:fixed;left:14px;bottom:118px;z-index:19;background:var(--panel);border:1px solid var(--line);

  #moonWrap.hide{display:none}
  #moonWrap .cap{font-size:11px;color:var(--sub);margin-top:3px}
  #moonWrap .cap b{font-family:'Jua';font-weight:400;color:var(--moon)}
  #moonCv{width:96px;height:96px;display:block}
  /* 조작 슬라이더 */
  #ctrl{position:fixed;left:0;right:0;bottom:32px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0 12px}
  #ctrl .sliders{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:10px 16px;backdrop-filter:blur(8px)}
  #ctrl .sld{display:flex;flex-direction:column;gap:3px;min-width:120px}
  #ctrl .sld label{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
  #ctrl .sld label b{font-family:'Jua';font-weight:400;color:var(--ink)}
  #ctrl .sld.hide{display:none}
  #ctrl input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
    background:rgba(255,255,255,.16);outline:none;cursor:pointer}
  #ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--earth);border:2px solid #fff;cursor:pointer}
  #ctrl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--earth);border:2px solid #fff;cursor:pointer}
  #ctrl input#sTilt{accent-color:var(--hi)}
  #ctrl .btns{display:flex;gap:8px}
  #ctrl .btns button{font-family:'Jua';font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:11px;padding:7px 13px;cursor:pointer}
  #ctrl .btns button.on{background:var(--earth);color:#04121f;border-color:var(--earth)}
  #ctrl .btns button:active{transform:scale(.95)}
  /* ── P3 시나리오 UI (우주 톤) ── */
  #sBtn{position:fixed;top:12px;right:112px;z-index:35;padding:9px 15px;border:1px solid var(--line);
    border-radius:14px;background:rgba(90,160,224,.16);color:var(--ink);font-family:'Jua';font-size:13px;cursor:pointer}
  #sBtn:active{transform:scale(.96)}
  #sBanner{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:34;display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 16px;max-width:min(92vw,460px);backdrop-filter:blur(8px)}
  #sBanner.hide{display:none}
  #sBanner.done{border-color:var(--earth);box-shadow:0 0 0 1px var(--earth)}
  #sbIcon{font-size:26px}
  #sbTitle{font-size:14.5px;font-weight:700;color:#fff;font-family:'Jua'}
  #sbHint{font-size:11.5px;color:var(--sub);margin-top:2px}
  #sbClose{margin-left:auto;background:none;border:0;color:var(--sub);font-size:18px;cursor:pointer}
  #sHome,#sPredict{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(4,7,16,.74);backdrop-filter:blur(4px)}

  .scard{background:#0c1322;border:1px solid var(--line);border-radius:20px;padding:22px;max-width:min(92vw,440px);width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .scard h2{margin:0 0 6px;font-size:19px;text-align:center;font-family:'Jua';font-weight:400}
  .scard .sub{text-align:center;color:var(--sub);font-size:12px;margin-bottom:16px}
  .sItem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);transition:.15s}
  .sItem:hover{background:rgba(90,160,224,.14);border-color:var(--earth)}
  .sItem.wow{border-color:rgba(255,209,102,.4)}
  .sItem .si{font-size:26px}
  .sItem b{font-family:'Jua';font-weight:400;font-size:14.5px}
  .sItem small{display:block;color:var(--sub);font-size:11.5px;line-height:1.45;margin-top:2px}
  #sFree{display:block;width:100%;margin-top:6px;padding:11px;border:1px dashed var(--line);border-radius:12px;
    background:none;color:var(--sub);font-family:'Jua';font-size:13px;cursor:pointer}
  #sPredict .scard{text-align:center}
  #spQ{font-size:16px;font-family:'Jua';font-weight:400;margin-bottom:16px;line-height:1.4}
  .spOpt{display:block;width:100%;margin-bottom:10px;padding:13px;border:1px solid var(--line);border-radius:14px;
    background:rgba(255,255,255,.05);color:var(--ink);font-size:13.5px;cursor:pointer;text-align:left;transition:.15s}
  .spOpt:hover{background:rgba(255,255,255,.09)}
  .spOpt.right{background:rgba(90,160,224,.9);border-color:var(--earth);color:#04121f;font-weight:700}
  .spOpt.wrong{background:rgba(200,80,70,.85);border-color:#c85046;color:#fff}
  #spExplain{font-size:12.5px;color:var(--ink);line-height:1.65;text-align:left;margin:14px 2px 4px;
    background:rgba(255,255,255,.04);border-radius:12px;padding:13px 15px}
  #spExplain.hide{display:none}
  #spGo{margin-top:14px;padding:11px 24px;border:0;border-radius:12px;background:var(--earth);color:#04121f;
    font-family:'Jua';font-size:14px;cursor:pointer}
  #spGo.hide{display:none}
  #tiltSld.pulse input{box-shadow:0 0 0 3px rgba(255,209,102,.5);border-radius:4px}
  button.hide{display:none}
</style>

<!--
  ═══════════════════════════════════════════════════════════════════
  순수 로직 (P1 게이트 · 렌더 0줄) — window.KSolar / module.exports
  물리 = 표준 천문 공식 + earthsun_proto.html 승계(창작 아님).
  교과서 앵커: 서울 37°N 남중고도 하지 76.5°·춘추분 53°·동지 29.5°.
  declination(day): 태양 적위 asin(sin(tilt)·−cos(orbAngle))  (day=0 동지)
  noonAltitude: 남중고도 90−|lat−decl|
  sunAltitude: asin(sinφsinδ+cosφcosδcosHA)
  달 위상: illum=(1−cos(frac·2π))/2  (frac 0삭·.25상현·.5망·.75하현)
  ═══════════════════════════════════════════════════════════════════
-->
<script id="solar-pure">
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.KSolar = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var D2R = Math.PI / 180;

  /* ── 확정 상수(§2 — 교과서 정합·earthsun 승계) ── */
  var TILT0 = 23.44;      // 지구 자전축 기울기(기본)
  var LAT0  = 37;         // 서울 위도(교과서 남중고도 정합)
  var YEAR_DAYS  = 365.25;
  var MOON_CYCLE = 29.53; // 삭망월(일)

  function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }
  function mod1(x){ return ((x % 1) + 1) % 1; }

  /* ── 태양·계절 ── */
  function orbAngle(day){ return day / YEAR_DAYS * Math.PI * 2; }               // day=0 동지

  function declination(day, tilt){
    if (tilt == null) tilt = TILT0;
    return Math.asin(Math.sin(tilt * D2R) * (-Math.cos(orbAngle(day)))) / D2R;  // 태양 적위(도)
  }
  function noonAltitude(day, lat, tilt){
    if (lat == null)  lat = LAT0;
    if (tilt == null) tilt = TILT0;
    return 90 - Math.abs(lat - declination(day, tilt));                          // 남중고도(도)
  }
  function sunAltitude(day, hour, lat, tilt){
    if (lat == null)  lat = LAT0;
    if (tilt == null) tilt = TILT0;
    var f = lat * D2R, d = declination(day, tilt) * D2R, HA = (hour - 12) * 15 * D2R;
    return Math.asin(Math.sin(f) * Math.sin(d) + Math.cos(f) * Math.cos(d) * Math.cos(HA)) / D2R;
  }
  function dayLength(day, lat, tilt){
    if (lat == null)  lat = LAT0;
    if (tilt == null) tilt = TILT0;
    var f = lat * D2R, d = declination(day, tilt) * D2R;
    var c = -Math.tan(f) * Math.tan(d);
    if (c <= -1) return 24;   // 백야
    if (c >=  1) return 0;    // 극야
    return 2 * Math.acos(c) / D2R / 15;                                          // 낮 길이(시간)
  }
  function shadowLength(alt, poleH){
    if (poleH == null) poleH = 1;
    return alt > 0 ? poleH / Math.tan(alt * D2R) : Infinity;                     // 막대 그림자 길이
  }
  function season(day, tilt){
    if (tilt == null) tilt = TILT0;
    if (tilt < 1) return 'none';          // ★와우: 기울기 없으면 계절 없음(earthsun 승계)
    var d = declination(day, tilt);       // 북반구 기준
    return d > 1.5 ? 'summer' : d < -1.5 ? 'winter' : 'spring_fall';
  }

  /* ── 달 위상(표준 이각 근사) ── */
  function moonFrac(dayInCycle){ return mod1((dayInCycle % MOON_CYCLE) / MOON_CYCLE); } // 0=삭
  function moonIllum(frac){ return (1 - Math.cos(mod1(frac) * Math.PI * 2)) / 2; }       // 0삭·1망
  function moonWaxing(frac){ return mod1(frac) < 0.5; }                                  // 차오름
  function moonLitSide(frac){ return moonWaxing(frac) ? 'right' : 'left'; }              // 밝은 쪽(북반구)
  function moonPhaseName(frac){
    var f = mod1(frac), e = 0.03;
    if (f < e || f > 1 - e)            return '삭';
    if (Math.abs(f - 0.25) < e)        return '상현달';
    if (Math.abs(f - 0.5)  < e)        return '망';
    if (Math.abs(f - 0.75) < e)        return '하현달';
    if (f < 0.25) return '초승달';
    if (f < 0.5)  return '상현망간';
    if (f < 0.75) return '하현망간';
    return '그믐달';
  }

  /* ── 시나리오 3종(§4) ── */
  var SCENARIOS = [
    { id: 'A-1', icon: '🌗', title: '그림자 시계', grade: 'mid',
      brief: '계절을 바꾸며 정오 태양의 높이와 그림자를 관찰하자.',
      hint: '여름엔 태양이 높고 그림자가 짧아요. 겨울엔 낮고 길어요.' },
    { id: 'A-2', icon: '🌍', title: '계절 만들기', grade: 'mid', wow: true,
      brief: '지구의 기울어진 축을 똑바로 세우면 계절은 어떻게 될까?',
      hint: '자전축 기울기를 0까지 내려 사계절 태양 높이를 비교해 보세요.' },
    { id: 'A-3', icon: '🌕', title: '보름달 만들기', grade: 'low',
      brief: '달을 공전시켜 보름달(망)을 만들어 보자.',
      hint: '삭 → 상현 → 망(보름) → 하현 순서로 모양이 변해요.' },
  ];
  var GRADE_SCENARIOS = { low: ['A-3'], mid: ['A-1', 'A-3'], high: ['A-1', 'A-2', 'A-3'] };
  function scenarioById(id){ for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].id === id) return SCENARIOS[i]; return null; }

  /* ── ★와우(A-2): 계절의 원인 = 자전축 기울기 ── */
  var WOW_SEASON = {
    at: 'A-2',
    q: '지구의 기울어진 축을 똑바로 세우면 계절은 어떻게 될까?',
    opts: [
      '지금처럼 사계절이 그대로 있다',
      '사계절이 사라지고 늘 같은 날씨가 된다',
    ],
    answer: 1,
    explain: '계절이 생기는 까닭은 태양과의 거리가 아니라 지구 자전축이 약 23.4° 기울어져 있기 때문이에요. ' +
      '기울어진 채로 공전하니 어느 때는 햇빛을 비스듬히 받고(겨울), 어느 때는 곧게 받아요(여름). ' +
      '축을 똑바로 세우면 1년 내내 정오 태양 높이가 같아 계절이 사라지죠. ' +
      '「여름은 태양에 가까워서」라는 생각은 흔한 오해예요 — 진짜 원인은 「기울기」랍니다.',
  };

  return {
    D2R: D2R, TILT0: TILT0, LAT0: LAT0, YEAR_DAYS: YEAR_DAYS, MOON_CYCLE: MOON_CYCLE,
    clamp: clamp,
    orbAngle: orbAngle, declination: declination, noonAltitude: noonAltitude,
    sunAltitude: sunAltitude, dayLength: dayLength, shadowLength: shadowLength, season: season,
    moonFrac: moonFrac, moonIllum: moonIllum, moonWaxing: moonWaxing,
    moonLitSide: moonLitSide, moonPhaseName: moonPhaseName,
    SCENARIOS: SCENARIOS, GRADE_SCENARIOS: GRADE_SCENARIOS, scenarioById: scenarioById,
    WOW_SEASON: WOW_SEASON,
  };
});
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     P2 렌더 어댑터 — 우주 무대·자전/공전 지구(earthsun 3그룹 승계)·하늘 궤적·달 위상 원반.
     3층 분리: window.KSolar의 sunAltitude/noonAltitude/season/moonIllum «결과»만 조회(천문 계산 판단 0).
     자전축은 월드 고정(earthPos 위치만 공전) → 계절이 창발. 기울기 슬라이더가 P3 ★와우 기반.
     ═══════════════════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const K = window.KSolar;
const D2R = K.D2R;
const P = new URLSearchParams(location.search);
const grade = P.get('grade') || 'high';

/* ═════════ 렌더 기반 (황금 표준 승계 · 우주 다크) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', function(e){ e.preventDefault();
  if(document.getElementById('ctxlost')) return;
  const o=document.createElement('div'); o.id='ctxlost';
  o.style.cssText='position:fixed;inset:0;background:rgba(6,9,18,.94);color:#e7ecf5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';
  const t=document.createElement('div'); t.textContent='화면이 잠시 멈췄어요'; t.style.cssText='font-size:20px;font-weight:700';
  const b=document.createElement('button'); b.textContent='다시 열기';
  b.style.cssText='padding:10px 26px;border-radius:12px;border:0;background:#5aa0e0;color:#04121f;font-size:16px;cursor:pointer';

const scene = new THREE.Scene();
{

}

/* ═════════ 별 필드 (space_window 승계 문법) ═════════ */
{
  const N=520, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const cA=new THREE.Color(0xffffff), cB=new THREE.Color(0xaecbff), cC=new THREE.Color(0xffe2b8);
  function rnd(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
  const r=rnd(20260709);
  for(let i=0;i<N;i++){
    const rad=40+r()*70, th=r()*6.283, ph=Math.acos(2*r()-1);
    pos[i*3]=rad*Math.sin(ph)*Math.cos(th); pos[i*3+1]=rad*Math.cos(ph); pos[i*3+2]=rad*Math.sin(ph)*Math.sin(th);
    const t=r(), c=t<0.7?cA:t<0.88?cB:cC; col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const gg=new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  gg.setAttribute('color', new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(gg, new THREE.PointsMaterial({ size:0.42, vertexColors:true, transparent:true, opacity:0.9, depthWrite:false })));
}

/* ═════════ 태양 (원점 · 발광구 + PointLight) ═════════ */

/* ═════════ 지구 시스템 (earthsun 3그룹 승계 — 자전축 월드 고정) ═════════ */
const ORBIT_R = 4.2;
const earthPos = new THREE.Group();   // 공전 위치(회전 없음 → 축 월드 고정)
const tiltGrp  = new THREE.Group();   // 자전축 기울기
const spinGrp  = new THREE.Group();   // 자전
scene.add(earthPos); earthPos.add(tiltGrp); tiltGrp.add(spinGrp);

// 지구 텍스처(프로시저럴 바다+대륙)
function earthTex(){
  const c=document.createElement('canvas'); c.width=256; c.height=128; const x=c.getContext('2d');
  x.fillStyle='#12467e'; x.fillRect(0,0,256,128);
  x.fillStyle='#2f7d4f';
  const blobs=[[40,54,26,16],[70,40,20,12],[120,66,30,18],[165,50,24,14],[200,72,22,13],[95,90,18,10],[220,44,16,10]];
  blobs.forEach(b=>{ x.beginPath(); x.ellipse(b[0],b[1],b[2],b[3],0,0,6.283); x.fill(); });
  x.fillStyle='rgba(255,255,255,.5)'; x.fillRect(0,0,256,7); x.fillRect(0,121,256,7); // 극관
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const earth = new THREE.Mesh(new THREE.SphereGeometry(1.0, 40, 30),
  new THREE.MeshStandardMaterial({ map:earthTex(), roughness:0.85, metalness:0.02 }));
earth.castShadow=true; earth.receiveShadow=true; spinGrp.add(earth);

// 자전축(북극-남극) + 화살
{
  const axis=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,2.7,8),
    new THREE.MeshBasicMaterial({ color:0xffd166 }));

  const np=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.2,10), new THREE.MeshBasicMaterial({ color:0xffd166 }));
  np.position.y=1.45; tiltGrp.add(np);
}
// 관측지 핀(서울 위도 37°N)
const pin=new THREE.Mesh(new THREE.SphereGeometry(0.055,12,10), new THREE.MeshBasicMaterial({ color:0xff5a6e }));
{ const lr=K.LAT0*D2R; pin.position.set(Math.cos(lr),Math.sin(lr),0).multiplyScalar(1.03); }
spinGrp.add(pin);

/* ═════════ 달 (지구 공전 궤도) ═════════ */
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.27, 24, 18),
  new THREE.MeshStandardMaterial({ color:0xcfd3da, roughness:1.0 }));
moon.castShadow=true; earthPos.add(moon);
const MOON_ORBIT=2.0;

/* ═════════ 상태 ═════════ */
let day  = parseFloat(P.get('day'))  || 0;
let hour = 12;
let tilt = P.get('tilt')!=null ? parseFloat(P.get('tilt')) : K.TILT0;
let moonF= P.get('moon')!=null ? parseFloat(P.get('moon')) : 0.5;
let playDay=false, playYear=false;

/* ═════════ 위치 갱신 ═════════ */
function placeEarth(){
  const a = K.orbAngle(day);
  earthPos.position.set(Math.cos(a)*ORBIT_R, 0, Math.sin(a)*ORBIT_R);
  tiltGrp.rotation.z = tilt*D2R;                 // 자전축 기울기(월드 고정 — earthPos는 회전 0)
  spinGrp.rotation.y = (hour/24)*Math.PI*2;      // 자전(시각)
  // 달 궤도(위상각)
  const ma = moonF*Math.PI*2;
  moon.position.set(Math.cos(ma)*MOON_ORBIT, 0.25, Math.sin(ma)*MOON_ORBIT);
}

/* ═════════ 하늘 궤적 패널 (Canvas2D — sunAltitude 곡선) ═════════ */
const lensEl=document.getElementById('lens');
const skyCv=document.getElementById('skyCv'), sx=skyCv.getContext('2d');
function drawSky(){
  const W=skyCv.width, H=skyCv.height, padL=6, padR=6, padT=10, padB=18;
  sx.clearRect(0,0,W,H);
  const x0=padL, x1=W-padR, plotW=x1-x0;
  const horizonY = H-padB - (0-(-20))/(95-(-20))*(H-padB-padT); // 고도 -20~95 매핑, 0도 지평선
  const yAt=alt=> (H-padB) - (alt-(-20))/(95-(-20))*(H-padB-padT);
  const xAt=h=> x0 + h/24*plotW;
  // 하늘/땅
  sx.fillStyle='rgba(90,160,224,.10)'; sx.fillRect(x0,padT,plotW,yAt(0)-padT);
  sx.fillStyle='rgba(60,45,30,.22)'; sx.fillRect(x0,yAt(0),plotW,(H-padB)-yAt(0));
  // 지평선
  sx.strokeStyle='rgba(255,255,255,.25)'; sx.lineWidth=1;
  sx.beginPath(); sx.moveTo(x0,yAt(0)); sx.lineTo(x1,yAt(0)); sx.stroke();
  // 태양 일주 곡선
  sx.strokeStyle='#ffd257'; sx.lineWidth=2.4; sx.beginPath();
  for(let h=0;h<=24;h+=0.25){ const a=K.sunAltitude(day,h,K.LAT0,tilt); const X=xAt(h),Y=yAt(a);
    if(h===0)sx.moveTo(X,Y); else sx.lineTo(X,Y); }
  sx.stroke();
  // 남중고도 점선
  const noon=K.noonAltitude(day,K.LAT0,tilt);
  sx.strokeStyle='rgba(255,210,87,.4)'; sx.setLineDash([4,4]); sx.lineWidth=1;
  sx.beginPath(); sx.moveTo(x0,yAt(noon)); sx.lineTo(x1,yAt(noon)); sx.stroke(); sx.setLineDash([]);
  // 현재 시각 태양
  const curA=K.sunAltitude(day,hour,K.LAT0,tilt);
  sx.fillStyle= curA>0?'#ffe27a':'#3a4a66';
  sx.beginPath(); sx.arc(xAt(hour), yAt(curA), 6, 0, 6.283); sx.fill();
  sx.strokeStyle='rgba(255,255,255,.5)'; sx.lineWidth=1; sx.stroke();
}
document.getElementById('lensSub').textContent = `남중 ${Math.round(K.noonAltitude(day,K.LAT0,tilt))}°`;

/* ═════════ 달 위상 원반 (Canvas2D — 터미네이터) ═════════ */
const moonCv=document.getElementById('moonCv'), mx=moonCv.getContext('2d');
function drawMoon(){
  const W=moonCv.width, H=moonCv.height, cx=W/2, cy=H/2, R=W*0.42;
  mx.clearRect(0,0,W,H);
  const illum=K.moonIllum(moonF), waxing=K.moonWaxing(moonF);
  // 어두운 달
  mx.fillStyle='#2b3040'; mx.beginPath(); mx.arc(cx,cy,R,0,6.283); mx.fill();
  // 밝은 부분
  const t=2*illum-1;                       // -1 삭 · 0 반달 · +1 망
  mx.fillStyle='#eef2fa'; mx.beginPath();
  const a0=-Math.PI/2, a1=Math.PI/2;
  mx.arc(cx,cy,R, a0, a1, !waxing);        // 밝은 쪽 반원
  mx.ellipse(cx,cy, R*Math.abs(t), R, 0, a1, a0, (t>0)===waxing); // 터미네이터
  mx.fill();
  // 테두리
  mx.strokeStyle='rgba(255,255,255,.18)'; mx.lineWidth=1.5; mx.beginPath(); mx.arc(cx,cy,R,0,6.283); mx.stroke();
}

/* ═════════ HUD ═════════ */
const SEASON_KO={ summer:'☀️ 여름', winter:'❄️ 겨울', spring_fall:'🍃 봄·가을', none:'⛔ 계절 없음' };

  document.getElementById('hSeason').textContent = SEASON_KO[K.season(day,tilt)];
  document.getElementById('hAlt').textContent = Math.round(K.noonAltitude(day,K.LAT0,tilt))+'°';
  const dl=K.dayLength(day,K.LAT0,tilt); const dh=Math.floor(dl), dm=Math.round((dl-dh)*60);
  document.getElementById('hDay').textContent = dh+'시간 '+dm+'분';
  document.getElementById('hMoon').textContent = K.moonPhaseName(moonF);
  document.getElementById('mName').textContent = K.moonPhaseName(moonF);
  document.getElementById('lensSub').textContent = `남중 ${Math.round(K.noonAltitude(day,K.LAT0,tilt))}°`;
}

/* ═════════ 슬라이더 ═════════ */
const sDay=document.getElementById('sDay'), sHour=document.getElementById('sHour'),
      sTilt=document.getElementById('sTilt'), sMoon=document.getElementById('sMoon');
const MONTHS=['12/22','1/21','2/19','3/21','4/20','5/21','6/21','7/23','8/23','9/23','10/23','11/22'];
function dateLabel(d){ return MONTHS[Math.floor((d/365.25*12))%12]||'12/22'; }
function syncLabels(){
  document.getElementById('lDay').textContent = dateLabel(day);
  document.getElementById('lHour').textContent = (h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;})(hour);
  document.getElementById('lTilt').textContent = tilt.toFixed(1)+'°';
  document.getElementById('lMoon').textContent = K.moonPhaseName(moonF);
}
sDay.value=day; sHour.value=hour; sTilt.value=tilt; sMoon.value=moonF;
sDay.addEventListener('input', ()=>{ day=parseFloat(sDay.value); refresh(); });
sHour.addEventListener('input', ()=>{ hour=parseFloat(sHour.value); playDay=false; setPlayBtn(); refresh(); });
sTilt.addEventListener('input', ()=>{ tilt=parseFloat(sTilt.value); refresh(); });
sMoon.addEventListener('input', ()=>{ moonF=parseFloat(sMoon.value); refresh(); });

function refresh(){ placeEarth(); syncLabels(); syncHud(); if(!lensEl.classList.contains('hide')) drawSky(); drawMoon(); checkScenario(); }

/* ═════════ 재생 ═════════ */
const playBtn=document.getElementById('playBtn'), yearBtn=document.getElementById('yearBtn'), resetBtn=document.getElementById('resetBtn');
function setPlayBtn(){ playBtn.classList.toggle('on',playDay); playBtn.textContent=playDay?'⏸ 멈춤':'▶ 하루 재생';
  yearBtn.classList.toggle('on',playYear); yearBtn.textContent=playYear?'⏸ 멈춤':'⏩ 1년 재생'; }
playBtn.addEventListener('click', ()=>{ playDay=!playDay; if(playDay)playYear=false; setPlayBtn(); });
yearBtn.addEventListener('click', ()=>{ playYear=!playYear; if(playYear)playDay=false; setPlayBtn(); });
resetBtn.addEventListener('click', ()=>{ day=0; hour=12; tilt=K.TILT0; moonF=0.5; playDay=playYear=false;
  sDay.value=day; sHour.value=hour; sTilt.value=tilt; sMoon.value=moonF; setPlayBtn(); refresh(); });

/* ═════════ 학년칸 (§4) ═════════ */
const tiltSld=document.getElementById('tiltSld');
if(grade==='low'){ lensEl.classList.add('hide'); tiltSld.classList.add('hide'); }
else if(grade==='mid'){ tiltSld.classList.add('hide'); }

/* ═════════ 애니메이션 ═════════ */
let t0=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.05,(now-t0)/1000); t0=now;
  if(playDay){ hour=(hour+dt*4)%24; sHour.value=hour; refresh(); }
  if(playYear){ day=(day+dt*30)%365; sDay.value=day; refresh(); }
  // 별빛 살짝 자전(연출)
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

refresh(); setPlayBtn();
document.getElementById('loading').classList.add('hide');
animate();

/* 검증 훅 */
window.__SOLAR_P2__ = {
  K, earthPos, tiltGrp, spinGrp, moon, sun,
  get day(){return day;}, get hour(){return hour;}, get tilt(){return tilt;}, get moonF(){return moonF;},
  setDay(d){ day=d; sDay.value=d; refresh(); },
  setHour(h){ hour=h; sHour.value=h; refresh(); },
  setTilt(v){ tilt=v; sTilt.value=v; refresh(); },
  setMoon(v){ moonF=v; sMoon.value=v; refresh(); },
  drawSky, drawMoon, syncHud, refresh,
  noonNow(){ return K.noonAltitude(day,K.LAT0,tilt); },
  seasonNow(){ return K.season(day,tilt); },
};

/* ═════════ P3 시나리오 UI (§4 — 미션보다 "관측 도구") ═════════ */
const gradeScenarios = K.GRADE_SCENARIOS[grade] || K.GRADE_SCENARIOS.high;
var activeScenario = null, scenarioCleared = false;   // var: 초기 refresh() 전 TDZ 회피

function bannerHint(msg){ document.getElementById('sbHint').textContent = msg; }

function buildScenarioUI(){
  const wrap=document.createElement('div');
  wrap.innerHTML =
    `<button id="sBtn">🔭 시나리오</button>
     <div id="sBanner" class="hide"><span id="sbIcon"></span><div><div id="sbTitle"></div><div id="sbHint"></div></div><button id="sbClose">✕</button></div>
     <div id="sHome" class="hide"><div class="scard"><h2>🌌 관측 시나리오</h2>
       <div class="sub">태양·지구·달이 어떻게 이어져 있는지 살펴봐요</div>
       <div id="sList"></div><button id="sFree">자유 관측</button></div></div>
     <div id="sPredict" class="hide"><div class="scard">
       <div id="spQ"></div><div id="spOpts"></div>
       <div id="spExplain" class="hide"></div><button id="spGo" class="hide">직접 확인하기 →</button></div></div>`;
  document.body.appendChild(wrap);
  document.getElementById('sBtn').onclick = openHome;
  document.getElementById('sbClose').onclick = exitScenario;
  document.getElementById('sFree').onclick = ()=>{ closeAll(); exitScenario(); };
  document.getElementById('spGo').onclick = ()=>{
    document.getElementById('sPredict').classList.add('hide');
    tiltSld.classList.remove('hide'); tiltSld.classList.add('pulse');
    bannerHint('아래 «자전축 기울기»를 0까지 내려 보세요.');
  };
  const list=document.getElementById('sList');
  gradeScenarios.forEach(id=>{
    const s=K.scenarioById(id); if(!s) return;
    const b=document.createElement('button');
    b.className='sItem'+(s.wow?' wow':'');
    b.innerHTML=`<span class="si">${s.icon}</span><span><b>${s.title}</b><small>${s.brief}</small></span>`;
    b.onclick=()=>startScenario(id);
    list.appendChild(b);
  });
}
function openHome(){ closeAll(); document.getElementById('sHome').classList.remove('hide'); }
function closeAll(){ ['sHome','sPredict'].forEach(i=>document.getElementById(i).classList.add('hide')); }

function startScenario(id){
  const s=K.scenarioById(id); if(!s) return;
  activeScenario=id; scenarioCleared=false;
  closeAll();
  tiltSld.classList.remove('pulse');
  const bn=document.getElementById('sBanner'); bn.classList.remove('hide','done');
  document.getElementById('sbIcon').textContent=s.icon;
  document.getElementById('sbTitle').textContent=s.title;
  document.getElementById('sbHint').textContent=s.hint;
  if(id==='A-2'){ tiltSld.classList.remove('hide'); showWow(); }
  refresh();
}
function exitScenario(){
  activeScenario=null; scenarioCleared=false;
  closeAll();
  document.getElementById('sBanner').classList.add('hide');
  tiltSld.classList.remove('pulse');
  if(grade==='mid') tiltSld.classList.add('hide');
}

/* ★와우 예측 (A-2) — WOW_SEASON */
function showWow(){
  const w=K.WOW_SEASON;
  document.getElementById('spQ').textContent=w.q;
  const opts=document.getElementById('spOpts'); opts.innerHTML='';
  const exp=document.getElementById('spExplain'); exp.classList.add('hide');
  const go=document.getElementById('spGo'); go.classList.add('hide');
  w.opts.forEach((txt,i)=>{
    const b=document.createElement('button'); b.className='spOpt'; b.textContent=txt;
    b.onclick=()=>{
      opts.querySelectorAll('.spOpt').forEach(o=>o.style.pointerEvents='none');
      b.classList.add(i===w.answer?'right':'wrong');
      if(i!==w.answer) opts.children[w.answer].classList.add('right');
      exp.textContent=w.explain; exp.classList.remove('hide');
      go.classList.remove('hide');
    };
    opts.appendChild(b);
  });
  document.getElementById('sPredict').classList.remove('hide');
}

/* 미션 도달 판정(§4) — refresh마다 호출(hoisted) */
function checkScenario(){
  if(!activeScenario || scenarioCleared) return;
  let done=false, msg='';
  if(activeScenario==='A-1'){
    if(K.season(day,tilt)==='summer'){ done=true; msg='☀️ 여름! 태양이 가장 높고 그림자가 가장 짧아요.'; }
  } else if(activeScenario==='A-2'){
    if(K.season(day,tilt)==='none'){ done=true; msg='🌍 축을 세우니 계절이 사라졌어요 — 계절의 원인은 기울기!'; }
  } else if(activeScenario==='A-3'){
    if(K.moonIllum(moonF)>=0.98){ done=true; msg='🌕 보름달(망)! 지구·달·태양이 일직선이에요.'; }
  }
  if(done){
    scenarioCleared=true;
    document.getElementById('sBanner').classList.add('done');
    bannerHint(msg);
    tiltSld.classList.remove('pulse');
  }
}

buildScenarioUI();
const qScenario = P.get('scenario');
if(qScenario && K.scenarioById(qScenario)) startScenario(qScenario);
else if(grade==='low') openHome();

// P3 검증 훅 확장 (getter는 defineProperty로 — Object.assign은 getter를 값으로 고정 복사)
window.__SOLAR_P2__.openHome = openHome;
window.__SOLAR_P2__.startScenario = startScenario;
window.__SOLAR_P2__.showWow = showWow;
window.__SOLAR_P2__.exitScenario = exitScenario;
window.__SOLAR_P2__.checkScenario = checkScenario;
window.__SOLAR_P2__.gradeScenarios = gradeScenarios;
Object.defineProperty(window.__SOLAR_P2__, 'activeScenario', { get(){ return activeScenario; }, configurable:true });
Object.defineProperty(window.__SOLAR_P2__, 'scenarioCleared', { get(){ return scenarioCleared; }, configurable:true });
</script>

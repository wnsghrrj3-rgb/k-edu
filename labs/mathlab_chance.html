<!-- P1 = 갈톤 보드 순수 물리 로직만(렌더 0줄, P1 게이트). P2에서 2D canvas 구슬 폭포 렌더 +
     예측 실루엣 UI·분포 렌즈(종 곡선 오버레이) 증축. 순수 로직엔 THREE·DOM·canvas 참조 0.
     이항분포·정규근사는 표준 공식(수치 창작 아님) — μ=n·p, σ²=n·p·q, 정규 pdf. -->
<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<!-- ═══════════════════════════════════════════════════════════════════════
     순수 로직 — KGalton 갈톤 보드 모델 (MATHLAB 설계 §운명의 방). THREE·DOM 참조 0.
     dropOne(rng,rows): 구슬 한 알이 각 행에서 좌/우 튕겨 도달하는 bin(=오른쪽 횟수).
     dropMany(rng,rows,count): 히스토그램(무작위 → 종 모양 창발의 진실).
     binomialPMF/expectedCounts: 이론 분포(표준 공식). bellCurve: 정규근사 곡선(렌즈용).
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="galton-pure">
(function (root, factory) {
  const API = factory();
  if (typeof window !== 'undefined') window.KGalton = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(this, function () {
  'use strict';

  /* ── 확정 상수 (§2) ── */
  const ROWS_DEFAULT = 12;        // 핀 행 수 → bin = ROWS+1개
  const ROWS_MIN = 4, ROWS_MAX = 16;
  const P_RIGHT = 0.5;            // 좌우 대칭(공정한 핀)
  const BIN_CAP = ROWS_MAX + 1;   // 최대 bin 수
  const POUR_SMALL = 20;          // 소량(무작위 체감)
  const POUR_BIG   = 500;         // 대량(종 모양 창발) — ★와우 기준

  /* ── 결정론 rng (mulberry32) ── */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ── 공용 순수 헬퍼 ── */
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  /* ── 이항 계수 C(n,k) (곱셈-나눗셈, 오버플로 최소) ── */
  function binomCoeff(n, k) {
    if (k < 0 || k > n) return 0;
    k = Math.min(k, n - k);
    let c = 1;
    for (let i = 0; i < k; i++) c = c * (n - i) / (i + 1);
    return c;
  }

  /* ── 이론 분포 (표준 공식, 창작 아님) ── */
  function binomialPMF(rows, k) {                 // P(bin=k) = C(n,k)·p^k·q^(n-k)
    if (k < 0 || k > rows) return 0;
    return binomCoeff(rows, k) * Math.pow(P_RIGHT, k) * Math.pow(1 - P_RIGHT, rows - k);
  }
  function expectedCounts(rows, count) {          // 이론 기대 도수 배열(길이 rows+1)
    const arr = [];
    for (let k = 0; k <= rows; k++) arr.push(binomialPMF(rows, k) * count);
    return arr;
  }
  function mean(rows)     { return rows * P_RIGHT; }                 // μ = n·p
  function variance(rows) { return rows * P_RIGHT * (1 - P_RIGHT); } // σ² = n·p·q
  function stddev(rows)   { return Math.sqrt(variance(rows)); }

  /* ── 정규근사 (종 곡선 렌즈용, 표준 정규 pdf) ── */
  function normalPdf(x, mu, sigma) {
    const z = (x - mu) / sigma;
    return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
  }
  // 도수 스케일 종 곡선 표본 (연속 x∈[0,rows], bin폭 1이라 pdf·count ≈ 도수)
  function bellCurve(rows, count, samples) {
    const mu = mean(rows), sg = stddev(rows), pts = [];
    const n = samples || (rows * 8);
    for (let i = 0; i <= n; i++) {
      const x = (i / n) * rows;
      pts.push({ x: x, y: normalPdf(x, mu, sg) * count });
    }
    return pts;
  }

  /* ── 구슬 한 알: 각 행 좌/우 → bin = 오른쪽 횟수 ── */
  function dropOne(rng, rows) {
    let bin = 0; const path = [];
    for (let r = 0; r < rows; r++) {
      const right = rng() < P_RIGHT;
      if (right) bin++;
      path.push(right ? 'R' : 'L');
    }
    return { bin: bin, path: path };
  }

  /* ── 여러 알: 히스토그램(길이 rows+1) ── */
  function dropMany(rng, rows, count) {
    const bins = new Array(rows + 1).fill(0);
    for (let i = 0; i < count; i++) bins[dropOne(rng, rows).bin]++;
    return bins;
  }

  /* ── 히스토그램 통계 (경험적) ── */
  function histStats(bins) {
    let total = 0, mode = 0, sum = 0;
    for (let k = 0; k < bins.length; k++) {
      total += bins[k]; sum += k * bins[k];
      if (bins[k] > bins[mode]) mode = k;
    }
    const eMean = total ? sum / total : 0;
    let vs = 0;
    for (let k = 0; k < bins.length; k++) vs += bins[k] * (k - eMean) * (k - eMean);
    return { total: total, mode: mode, mean: eMean, variance: total ? vs / total : 0 };
  }

  /* ── 곡선 거리 (예측 실루엣 vs 실제, L1 정규화 0~1) ── */
  function curveDistance(a, b) {
    const n = Math.max(a.length, b.length);
    let sa = 0, sb = 0;
    for (let i = 0; i < n; i++) { sa += a[i] || 0; sb += b[i] || 0; }
    if (sa <= 0 || sb <= 0) return 1;
    let d = 0;
    for (let i = 0; i < n; i++) d += Math.abs((a[i] || 0) / sa - (b[i] || 0) / sb);
    return d / 2;   // 0(동일)~1(완전 불일치)
  }

  /* ═══ C-3 핀 기울기(편향) 확장 — 기존 함수 불변, append만. pR=오른쪽 확률(공정핀=0.5). ═══ */
  const TILT = { left: 0.35, center: 0.5, right: 0.65 };   // 기울기 프리셋(3단)
  function meanP(rows, pR)     { return rows * pR; }                  // μ = n·pR
  function varianceP(rows, pR) { return rows * pR * (1 - pR); }       // σ² = n·pR·(1-pR)
  function stddevP(rows, pR)   { return Math.sqrt(varianceP(rows, pR)); }
  function binomialPMFp(rows, k, pR) {                                // 편향 이항 PMF
    if (k < 0 || k > rows) return 0;
    return binomCoeff(rows, k) * Math.pow(pR, k) * Math.pow(1 - pR, rows - k);
  }
  function expectedCountsP(rows, count, pR) {
    const arr = [];
    for (let k = 0; k <= rows; k++) arr.push(binomialPMFp(rows, k, pR) * count);
    return arr;
  }
  function bellCurveP(rows, count, pR, samples) {                     // 편향 종 곡선(정규근사)
    const mu = meanP(rows, pR), sg = stddevP(rows, pR), pts = [];
    const n = samples || (rows * 8);
    for (let i = 0; i <= n; i++) {
      const x = (i / n) * rows;
      pts.push({ x: x, y: normalPdf(x, mu, sg) * count });
    }
    return pts;
  }
  function dropOneBiased(rng, rows, pR) {                             // 편향 한 알(pR=0.5면 dropOne과 동등)
    let bin = 0; const path = [];
    for (let r = 0; r < rows; r++) {
      const right = rng() < pR;
      if (right) bin++;
      path.push(right ? 'R' : 'L');
    }
    return { bin: bin, path: path };
  }
  function dropManyBiased(rng, rows, count, pR) {
    const bins = new Array(rows + 1).fill(0);
    for (let i = 0; i < count; i++) bins[dropOneBiased(rng, rows, pR).bin]++;
    return bins;
  }

  /* ── 방·시나리오 스키마 (P3에서 소비) ── */
  const SCENARIOS = {
    'C-1': { title: '구슬 하나',   desc: '한 알을 떨어뜨려 어디로 갈지 지켜봐요', pour: 1 },
    'C-2': { title: '구슬 폭포',   desc: '많이 부으면 어떤 모양이 될지 먼저 예상해요', pour: POUR_BIG, wow: true },
    'C-3': { title: '핀을 바꾸면', desc: '한 줄을 기울이면 산꼭대기가 어디로 갈까요', pour: POUR_BIG }
  };
  // ★와우: 무작위 속의 질서(종 모양 창발)
  const WOW_BELL = {
    q: '구슬을 아주 많이 부으면 어떤 모양으로 쌓일까요?',
    options: ['가운데가 가장 높은 산 모양', '어디나 고르게 평평하게', '양쪽 끝이 높은 U 모양'],
    answer: 0,
    explain: '구슬 한 알은 어디로 갈지 아무도 몰라요. 그런데 아주 많이 부으면 가운데가 가장 높은 산(종) 모양이 저절로 나타나요 — 무작위 속에 숨어 있던 질서예요.'
  };
  // ★와우(C-3): 핀을 기울이면 산꼭대기가 옮겨간다
  const WOW_TILT = {
    q: '핀을 오른쪽으로 기울이면 산꼭대기는 어디로 갈까요?',
    options: ['왼쪽으로 옮겨가요', '그대로 가운데예요', '오른쪽으로 옮겨가요'],
    answer: 2,
    explain: '핀이 한쪽으로 기울면 구슬이 그쪽으로 더 자주 튕겨요. 그래서 산 모양 전체가 그쪽으로 옮겨가요 — 공정하지 않은 핀은 결과도 한쪽으로 치우쳐요.'
  };

  return {
    // 상수
    ROWS_DEFAULT, ROWS_MIN, ROWS_MAX, P_RIGHT, BIN_CAP, POUR_SMALL, POUR_BIG, TILT,
    // 유틸
    mulberry32, clamp, binomCoeff,
    // 이론 분포
    binomialPMF, expectedCounts, mean, variance, stddev, normalPdf, bellCurve,
    // 편향(C-3) 이론·시뮬
    meanP, varianceP, stddevP, binomialPMFp, expectedCountsP, bellCurveP, dropOneBiased, dropManyBiased,
    // 시뮬 코어
    dropOne, dropMany, histStats, curveDistance,
    // 스키마
    SCENARIOS, WOW_BELL, WOW_TILT
  };
});
</script>
<!-- ═══ P2 렌더 어댑터 — 2D canvas 구슬 폭포. KGalton 조회만(물리 0줄). ═══ -->
<script>
(function(){
  'use strict';
  var K = window.KGalton;
  var C = { ink:'#eef0ff', sub:'#9aa0c8', ball:'#ffd166', ball2:'#f59e2c',
            bell:'#7c8cff', pin:'#565f9c', pred:'#ffd166', line:'rgba(255,255,255,.10)' };

  var stage = document.getElementById('stage');
  var cv = document.createElement('canvas'); cv.id = 'board'; stage.appendChild(cv);
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // ── 상태 ──
  var rows = K.ROWS_DEFAULT;
  var bins = new Array(rows + 1).fill(0);
  var rng = K.mulberry32((Date.now() >>> 0) || 1);
  var active = [], queue = 0, total = 0;
  var lensOn = false, pred = null, predicting = false, soundOn = true, pourDone = false;
  var bias = K.P_RIGHT;   // C-3 핀 기울기(오른쪽 확률, 0.5=공정핀). P3가 setBias로 조정.
  var looping = false, geo = {};
  var STEP_FR = 5, EMIT = 8, CAP = 60;

  // ── 레이아웃 ──
  function layout(){
    var pad = Math.max(18, Math.min(W, H) * 0.055);
    var topBand = 92, botBand = 96;
    geo.left = pad; geo.right = W - pad; geo.cx = W / 2;
    geo.boardTop = topBand;
    geo.binBase = H - botBand;
    geo.stackH = Math.min(H * 0.32, 250);
    geo.binTop = geo.binBase - geo.stackH;
    geo.boardBot = geo.binTop - 14;
    geo.rowGap = (geo.boardBot - geo.boardTop) / (rows + 1);
    geo.binW = (geo.right - geo.left) / (rows + 1);
    geo.pinGap = geo.binW;
    geo.funnelY = topBand - 26;
  }
  function binX(k){ return geo.left + (k + 0.5) * geo.binW; }
  function pinRowY(r){ return geo.boardTop + (r + 0.5) * geo.rowGap; }
  function xToBin(px){ return K.clamp(Math.floor((px - geo.left) / geo.binW), 0, rows); }

  function maxShown(){
    var mb = 0; for (var k = 0; k < bins.length; k++) if (bins[k] > mb) mb = bins[k];
    var peak = total > 0 ? K.normalPdf(K.meanP(rows, bias), K.meanP(rows, bias), K.stddevP(rows, bias)) * total : 0;
    return Math.max(8, mb * 1.08, peak * 1.05);
  }
  function stackPx(k){ return (bins[k] / maxShown()) * geo.stackH; }

  // ── 구슬 방출·낙하(웨이포인트 보간) ──
  function spawn(){
    var d = K.dropOneBiased(rng, rows, bias), wp = [{ x: geo.cx, y: geo.funnelY }], x = geo.cx;
    for (var r = 0; r < rows; r++){ x += (d.path[r] === 'R' ? 1 : -1) * geo.pinGap * 0.5; wp.push({ x: x, y: pinRowY(r) }); }
    wp.push({ x: binX(d.bin), y: geo.binBase - stackPx(d.bin) - 5 });
    active.push({ wp: wp, seg: 0, t: 0, bin: d.bin, x: geo.cx, y: geo.funnelY });
  }
  function advance(b){
    if (b.seg >= b.wp.length - 1) return true;
    b.t += 1 / STEP_FR;
    var a = b.wp[b.seg], c = b.wp[b.seg + 1], e = b.t > 1 ? 1 : b.t, ey = e * e * (3 - 2 * e);
    b.x = a.x + (c.x - a.x) * e; b.y = a.y + (c.y - a.y) * ey;
    if (b.t >= 1){ b.seg++; b.t = 0; if (b.seg < b.wp.length - 1) tick(); }
    return b.seg >= b.wp.length - 1;
  }

  // ── 렌더 ──
  function draw(){
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    drawPins(); drawStacks(); if (lensOn) drawBell(); if (pred) drawPred(); drawActive();
  }
  function drawPins(){
    ctx.fillStyle = C.pin;
    for (var r = 0; r < rows; r++){
      var y = pinRowY(r);
      for (var i = 0; i <= r; i++){
        var x = geo.cx + (i - r / 2) * geo.pinGap;
        ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 6.2832); ctx.fill();
      }
    }
    // 투입구
    ctx.strokeStyle = C.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(geo.cx - 22, geo.funnelY); ctx.lineTo(geo.cx, geo.boardTop - 6);
    ctx.lineTo(geo.cx + 22, geo.funnelY); ctx.stroke();
  }
  function drawStacks(){
    for (var k = 0; k <= rows; k++){
      var h = stackPx(k); if (h < 0.5) continue;
      var x = binX(k) - geo.binW * 0.42, w = geo.binW * 0.84, y = geo.binBase - h;
      var g = ctx.createLinearGradient(0, y, 0, geo.binBase);
      g.addColorStop(0, C.ball); g.addColorStop(1, C.ball2);
      ctx.fillStyle = g;
      roundRect(x, y, w, h, Math.min(6, w / 2)); ctx.fill();
    }
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(geo.left, geo.binBase + 0.5); ctx.lineTo(geo.right, geo.binBase + 0.5); ctx.stroke();
  }
  function drawActive(){
    for (var i = 0; i < active.length; i++){
      var b = active[i], rr = geo.binW * 0.26;
      var g = ctx.createRadialGradient(b.x - rr * 0.3, b.y - rr * 0.3, rr * 0.2, b.x, b.y, rr);
      g.addColorStop(0, '#fff4cf'); g.addColorStop(1, C.ball2);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, 6.2832); ctx.fill();
    }
  }
  function drawBell(){
    if (total < 1) return;
    var pts = K.bellCurveP(rows, total, bias, rows * 12), mx = maxShown();
    ctx.save(); ctx.strokeStyle = C.bell; ctx.lineWidth = 3; ctx.shadowColor = C.bell; ctx.shadowBlur = 12;
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++){
      var X = geo.left + (pts[i].x + 0.5) * geo.binW, Y = geo.binBase - (pts[i].y / mx) * geo.stackH;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.restore();
  }
  function drawPred(){
    ctx.save(); ctx.strokeStyle = C.pred; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
    ctx.beginPath();
    for (var k = 0; k <= rows; k++){
      var X = binX(k), Y = geo.binBase - (pred[k] || 0) * geo.stackH;
      if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }

  // ── 루프 ──
  function frame(){
    looping = true;
    var room = CAP - active.length, emit = Math.max(0, Math.min(queue, room, EMIT));
    for (var e = 0; e < emit; e++){ spawn(); queue--; }
    for (var i = active.length - 1; i >= 0; i--){
      if (advance(active[i])){ var b = active[i]; bins[b.bin]++; total++; active.splice(i, 1); }
    }
    draw(); updHud();
    if (queue > 0 || active.length > 0){ raf(frame); }
    else { looping = false; onIdle(); }
  }
  function raf(fn){ (window.requestAnimationFrame || function(f){ return setTimeout(f, 16); })(fn); }
  function ensureLoop(){ if (!looping) raf(frame); }
  function onIdle(){
    if (total > 0 && !pourDone && queue === 0){ pourDone = true; if (total >= K.POUR_SMALL) chime(); }
    updHud();
  }

  // ── HUD ──
  function updHud(){
    var st = K.histStats(bins);
    setTxt('hTotal', total);
    setTxt('hMode', total ? (st.mode + 1) + '번 칸' : '–');
    var hl = document.getElementById('hLens'); if (hl) hl.style.display = lensOn ? '' : 'none';
  }
  function setTxt(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  function tip(t){ var el = document.getElementById('tip'); if (el){ el.textContent = t; el.classList.remove('hide'); } }

  // ── 사운드(WebAudio 미니 신스) ──
  var actx = null, master = null, lastTick = 0;
  function ensureAudio(){
    if (actx) return;
    try { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC(); master = actx.createGain(); master.gain.value = 0.16; master.connect(actx.destination);
    } catch (e){ actx = null; }
  }
  function tick(){
    if (!soundOn || !actx) return;
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (now - lastTick < 38) return; lastTick = now;
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'triangle'; o.frequency.value = 430 + Math.random() * 200;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.1);
  }
  function chime(){
    if (!soundOn || !actx) return;
    [523, 659, 784, 1047].forEach(function(f, i){
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.07;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.55);
    });
  }

  // ── 조작 API ──
  function reset(){
    bins = new Array(rows + 1).fill(0); active = []; queue = 0; total = 0; pourDone = false;
    rng = K.mulberry32((Date.now() >>> 0) || 1); draw(); updHud();
    tip('구슬을 떨어뜨려 봐요. 한 알은 어디로 갈지 아무도 몰라요.');
  }
  function pourOne(){ ensureAudio(); predicting = false; syncBtns(); queue += 1; ensureLoop(); }
  function pourMany(n, instant){
    ensureAudio(); predicting = false; syncBtns();
    n = n || K.POUR_BIG;
    if (instant){ var add = K.dropManyBiased(rng, rows, n, bias); for (var k = 0; k < add.length; k++) bins[k] += add[k]; total += n; pourDone = true; draw(); updHud(); return; }
    tip('구슬 폭포! 아주 많이 부으면 어떤 모양이 될까요?');
    queue += n; pourDone = false; ensureLoop();
  }
  function toggleLens(){ lensOn = !lensOn; syncBtns(); draw(); updHud(); }
  function togglePredict(){
    predicting = !predicting;
    if (predicting){ if (!pred) pred = new Array(rows + 1).fill(0); tip('칸 위를 쓸어 예상 산 모양을 그려요. 다 그리면 폭포를 부어 확인!'); }
    else tip('예상을 그렸어요. 🌊 구슬 폭포로 확인해 봐요!');
    syncBtns(); draw();
  }
  function setPrediction(arr){ pred = arr ? arr.slice(0, rows + 1) : null; draw(); }
  function setRows(r){ rows = K.clamp(r | 0, K.ROWS_MIN, K.ROWS_MAX); reset(); layout(); draw(); }
  function settleAll(){ if (queue > 0){ var add = K.dropManyBiased(rng, rows, queue, bias); for (var k = 0; k < add.length; k++) bins[k] += add[k]; total += queue; queue = 0; } active = []; draw(); updHud(); }

  // ── 입력(예측 그리기) ──
  function onPointer(ev){
    if (!predicting) return;
    var rect = cv.getBoundingClientRect();
    var px = (ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0].clientX)) - rect.left;
    var py = (ev.clientY != null ? ev.clientY : (ev.touches && ev.touches[0].clientY)) - rect.top;
    if (px == null || py == null) return;
    var k = xToBin(px);
    var hgt = K.clamp((geo.binBase - py) / geo.stackH, 0, 1);
    if (!pred) pred = new Array(rows + 1).fill(0);
    pred[k] = hgt; draw();
  }

  // ── 버튼 배선 ──
  function syncBtns(){
    tog('bLens', lensOn); tog('bPred', predicting);
  }
  function tog(id, on){ var b = document.getElementById(id); if (b) b.classList[on ? 'add' : 'remove']('on'); }
  function bind(){
    on('bOne', function(){ pourOne(); });
    on('bPour', function(){ pourMany(K.POUR_BIG); });
    on('bPred', function(){ ensureAudio(); togglePredict(); });
    on('bLens', function(){ toggleLens(); });
    on('bReset', function(){ reset(); });
    on('sound', function(){ soundOn = !soundOn; var s = document.getElementById('sound'); if (s) s.textContent = soundOn ? '🔊' : '🔇'; });
    var down = false;
    cv.addEventListener('pointerdown', function(e){ down = true; onPointer(e); });
    cv.addEventListener('pointermove', function(e){ if (down) onPointer(e); });
    window.addEventListener('pointerup', function(){ down = false; });
  }
  function on(id, fn){ var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

  // ── 초기화 ──
  function onResize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth || 1024; H = window.innerHeight || 768;
    cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    if (ctx && ctx.setTransform) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout(); draw();
  }
  function init(){
    onResize(); window.addEventListener('resize', onResize); bind(); updHud();
    var l = document.getElementById('loading'); if (l) l.classList.add('hide');
    // 딥링크(P3에서 확장): ?rows=
    try { var q = new URLSearchParams(location.search); if (q.get('rows')) setRows(parseInt(q.get('rows'), 10)); } catch (e){}
    draw();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  // ── 훅(스모크·P3용) ──
  window.__CHANCE_P2__ = {
    get bins(){ return bins.slice(); }, get total(){ return total; }, get rows(){ return rows; },
    get lensOn(){ return lensOn; }, get pred(){ return pred ? pred.slice() : null; }, get predicting(){ return predicting; },
    get bias(){ return bias; }, setBias: function(pR){ bias = K.clamp(pR, 0.05, 0.95); reset(); },
    K: K, reset: reset, pourOne: pourOne, pourMany: pourMany, settleAll: settleAll,
    toggleLens: toggleLens, togglePredict: togglePredict, setPrediction: setPrediction, setRows: setRows
  };
})();
</script>

<!-- ═══ P3 미션 레이어 — 시나리오·★와우 예측카드·종 곡선 창발·학년칸·예측 점수.
     __CHANCE_P2__ 훅만 소비(순수·P2 렌더 0줄 변경). DOM 오버레이만 추가. ═══ -->
<script id="p3-mission">

  var scene = 'C-2';       // 현재 방(C-1 관찰 · C-2 폭포★ · C-3 핀 바꾸기)

  var c3Ready = true;      // 핀 바꾸는 방(C-3) 활성
  var curTilt = 'right';   // C-3 기울기(left/center/right)
  var WOW = { 'C-2': K.WOW_BELL, 'C-3': K.WOW_TILT };   // 방별 예측카드

  function raf(fn){ (window.requestAnimationFrame || function(f){ return setTimeout(f, 16); })(fn); }
  function $(id){ return document.getElementById(id); }

  // ── 스타일 주입 ──

    '.p3-pill:active{transform:scale(.94)}' +

      'max-width:400px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}' +

      'border-radius:15px;padding:13px 18px;font-size:13.5px;line-height:1.55;box-shadow:0 16px 44px rgba(60,72,180,.5);' +

    '#p3-wow b{font-family:\'Jua\'}' +

      'border-radius:14px;padding:9px 14px;font-size:12.5px;color:var(--ink);text-align:center;' +
      'display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}' +
    '#p3-score.show{display:block}' +
    '#p3-score .st{font-family:\'Jua\';font-size:15px;color:var(--ball);letter-spacing:1px}' +
    '#p3-score .sc{color:var(--sub);font-size:11.5px;margin-top:2px}' +
    '#p3-tilt{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:22;display:none;gap:6px;' +
      'background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;backdrop-filter:blur(6px)}' +
    '#p3-tilt.show{display:flex}' +
    '.p3-tilt-b{font-family:\'Jua\';font-size:12.5px;color:var(--sub);background:rgba(255,255,255,.06);' +
      'border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:.14s}' +
    '.p3-tilt-b:active{transform:scale(.94)}' +
    '.p3-tilt-b.on{background:var(--ball);color:#3a2c00;border-color:var(--ball)}';
  document.head.appendChild(css);

  // ── 시나리오 배너 ──
  var SCN = [
    { id:'C-1', label:'💧 구슬 하나' },
    { id:'C-2', label:'🌊 구슬 폭포 ★' },
    { id:'C-3', label:'🎯 핀을 바꾸면 ★' }
  ];
  var scene_el = el('div'); scene_el.id = 'p3-scene';
  SCN.forEach(function(s){
    var p = el('button', 'p3-pill', s.label);
    p.setAttribute('data-scn', s.id);
    p.addEventListener('click', function(){ setScene(s.id); });
    scene_el.appendChild(p);
  });
  document.body.appendChild(scene_el);

  // ── 기울기 컨트롤(C-3) ──
  var tiltEl = el('div'); tiltEl.id = 'p3-tilt';
  var TILTS = [ { d:'left', t:'⬅️ 왼쪽' }, { d:'center', t:'⚖️ 가운데' }, { d:'right', t:'➡️ 오른쪽' } ];
  TILTS.forEach(function(o){
    var b = el('button', 'p3-tilt-b', o.t);
    b.setAttribute('data-tilt', o.d);
    b.addEventListener('click', function(){ setTilt(o.d); });

  });
  document.body.appendChild(tiltEl);

  // ── 예측카드 모달(방별 동적) ──
  var modal = el('div'); modal.id = 'p3-modal';
  var card = el('div', 'p3-card');
  var q = el('div', 'p3-q', '');
  var optBox = el('div');
  card.appendChild(q); card.appendChild(optBox);
  modal.appendChild(card);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeCard(); });
  document.body.appendChild(modal);

  // ── 창발 배너 + 점수 배지 ──
  var wow = el('div'); wow.id = 'p3-wow'; document.body.appendChild(wow);
  var wowTimer = null;
  var score = el('div'); score.id = 'p3-score'; document.body.appendChild(score);

  // ── 시나리오 전환 ──
  function setScene(s){
    scene = s;
    var pills = scene_el.querySelectorAll('.p3-pill');
    for (var i = 0; i < pills.length; i++)
      pills[i].classList.toggle('on', pills[i].getAttribute('data-scn') === s);
    hideWow(); hideScore();
    tiltEl.classList.toggle('show', s === 'C-3');
    if (s === 'C-3'){
      setTilt(curTilt);                                  // 진입 시 현재 기울기 적용
    } else if (H.bias !== K.P_RIGHT){
      H.setBias(K.P_RIGHT);                              // 공정핀 복귀(reset 포함)
    }
    if (s === 'C-1') tip('💧 구슬 하나를 떨어뜨려 어디로 갈지 지켜봐요. 한 알은 아무도 몰라요.');
    else if (s === 'C-2') tip(grade === 'high'
      ? '✏️ 예상 산 모양을 먼저 그린 뒤 🌊 폭포로 확인해 봐요!'
      : '🌊 많이 부으면 어떤 모양이 될지 먼저 예상해 봐요!');
    else if (s === 'C-3') tip('핀을 한쪽으로 기울여 보고 🌊 폭포로 산꼭대기가 어디로 가는지 확인해요!');
  }
  function setTilt(dir){

    H.setBias(pR);                                       // reset 포함(bins 비움)
    hideWow(); hideScore();
    var tb = tiltEl.querySelectorAll('.p3-tilt-b');
    for (var i = 0; i < tb.length; i++)
      tb[i].classList.toggle('on', tb[i].getAttribute('data-tilt') === dir);

      : '⬅️ 왼쪽으로 기울였어요. 산꼭대기가 어디로 갈까요? 🌊로 확인!');
  }
  function tip(t){ var e = $('tip'); if (e){ e.textContent = t; e.classList.remove('hide'); } }

  // ── 예측카드 흐름(방별 동적) ──
  function openCard(){

    q.innerHTML = w.q;
    optBox.innerHTML = '';
    w.options.forEach(function(opt, i){
      var b = el('button', 'p3-opt', opt);
      b.addEventListener('click', function(){ pick(i); });

  function closeCard(){ modal.classList.remove('show'); }
  function pick(i, instant){
    lastPick = i; seen[scene] = true; closeCard();

  }

  // ── 폭포 실행 + 완료 감지 ──
  function pourIntent(){
    if (busy) return;
    if (scene === 'C-1') setScene('C-2');                // 관찰방에서 폭포 = 예측방으로
    if (!seen[scene]){ openCard(); return; }             // 첫 폭포 = 예측카드 먼저

  function runPour(instant){

    if (instant){ H.pourMany(K.POUR_BIG, true); busy = false; onComplete(); return; }
    var target = H.total + K.POUR_BIG, guard = 0;
    H.pourMany(K.POUR_BIG);
    (function poll(){

      raf(poll);
    })();
  }
  function onComplete(){
    if (!H.lensOn) H.toggleLens();   // 종 곡선 렌즈 자동 on = 창발 가시화

  // ── ★와우: 방별 창발 연출 ──
  function showWow(){

      var st = K.histStats(H.bins), mode = st.mode, mid = H.rows / 2;
      var dir = mode > mid + 0.5 ? '오른쪽' : mode < mid - 0.5 ? '왼쪽' : '가운데';
      var hit = (lastPick === K.WOW_TILT.answer && curTilt === 'right') ||
                (curTilt === 'left' && lastPick === 0) || (curTilt === 'center' && lastPick === 1);
      var head = (hit ? '🎯 맞혔어요! ' : '🎯 ') + '산꼭대기가 ' + dir + '으로 옮겨갔어요';
      var body = (grade === 'low')
        ? '핀을 기울인 쪽으로 산이 <b>' + dir + '</b>으로 옮겨갔어요!'
        : K.WOW_TILT.explain;
      flashWow('<b>' + head + '</b><br>' + body, 6500);
      return;
    }
    var correct = (lastPick === K.WOW_BELL.answer);
    var head2 = correct ? '🔔 맞혔어요! 무작위 속에 숨어 있던 질서' : '🔔 무작위 속에 숨어 있던 질서';
    var body2 = (grade === 'low')
      ? '가운데가 가장 높은 <b>산 모양</b>이 저절로 나타났어요!'
      : K.WOW_BELL.explain;
    flashWow('<b>' + head2 + '</b><br>' + body2, 6500);
  }
  function flashWow(html, ms){
    wow.innerHTML = html; wow.classList.add('show');
    if (wowTimer) clearTimeout(wowTimer);
    wowTimer = setTimeout(function(){ wow.classList.remove('show'); }, ms || 5000);
  }
  function hideWow(){ wow.classList.remove('show'); if (wowTimer) clearTimeout(wowTimer); }

  // ── 예측 실루엣 점수(curveDistance) — 예측 그렸을 때만, 저학년 생략 ──
  function showScore(){
    if (grade === 'low') return;
    var pred = H.pred, bins = H.bins;
    if (!pred) return;
    var drawn = false; for (var i = 0; i < pred.length; i++) if (pred[i] > 0){ drawn = true; break; }
    if (!drawn) return;
    var dist = K.curveDistance(pred, bins);
    var pct = Math.round((1 - dist) * 100); if (pct < 0) pct = 0;
    lastScore = pct;
    var n = pct >= 85 ? 5 : pct >= 70 ? 4 : pct >= 50 ? 3 : pct >= 30 ? 2 : 1;
    var stars = ''; for (var s = 0; s < 5; s++) stars += (s < n ? '★' : '☆');
    var msg = pct >= 70 ? '예상이 실제와 꼭 닮았어요!'
            : pct >= 40 ? '꽤 비슷하게 예상했어요!'
            : '다시 예상해서 더 가깝게 맞혀봐요!';
    score.innerHTML = '<div class="st">' + stars + '</div><div class="sc">예상 적중 ' + pct + '% · ' + msg + '</div>';
    score.classList.add('show');
  }
  function hideScore(){ score.classList.remove('show'); }

  // ── bPour 인터셉트(캡처) → 미션 흐름(C-1/C-2/C-3 모두) ──
  var bp = $('bPour');
  if (bp) bp.addEventListener('click', function(e){
    e.stopImmediatePropagation();
    if (e.preventDefault) e.preventDefault();
    pourIntent();
  }, true);

  // ── 초기 진입 ──
  function boot(){
    try{
      var qs = new URLSearchParams(location.search);
      var sc = (qs.get('scene') || '').toUpperCase();
      if (sc === 'C-1' || sc === 'C-2' || sc === 'C-3'){ setScene(sc); return; }
    }catch(e){}
    setScene(grade === 'low' ? 'C-1' : 'C-2');
  }
  boot();

  // ── 훅(P3 스모크) ──
  window.__CHANCE_P3__ = {
    get scene(){ return scene; }, get grade(){ return grade; },
    get cardSeen(){ return !!seen[scene]; }, get lastPick(){ return lastPick; },
    get tilt(){ return curTilt; }, get bias(){ return H.bias; },
    get lastScore(){ return lastScore; }, get wowShown(){ return wow.classList.contains('show'); },
    get scoreShown(){ return score.classList.contains('show'); },
    setScene: setScene, setTilt: setTilt, openCard: openCard, closeCard: closeCard, pick: pick,
    pourIntent: pourIntent, runPour: runPour
  };
})();
</script>

<title>케이랩 과학실 — 열의 이동(전도) 미션</title>
<!--
  케이랩 과학실(SciLab) E-7 열의 이동 · 전도 파트 — 황금 샘플(scilab.html 물 끓이기 v0.2) 복사→스왑.
  흡수: v2 heat.js(전도 파트만). SPEC_E7.md 기반. 대류(잉크 소용돌이 3D)는 페이블 증축 대기(2단 출시).
    · 미션: 스탠드 → 막대 3종(구리·철·유리) → 버터 3조각. 램프로 한쪽 끝 가열
    · 현상: 열이 이웃 입자를 차례로 깨우며(전도) 퍼짐 → 버터 낙하 순서 = 구리 → 철 ≫ 유리
    · ★와우(중/고): 불을 세게 해도 순서는 그대로 — 빠르기는 불이, 순서는 재질이 정한다
    · 관측 = 버터 낙하 순서·막대 발광띠 (HUD 수치 없음 — 이 실험의 '측정'은 순서)
  렌더 표준(데모 1호 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft · 유리=블렌딩 · 품질 자동
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style>

    --blue:#5B9BF0; --orange:#FF8A3D; --green:#12B886; --purple:#9B7BF5;
    --ink:#1d2733; --hud:rgba(20,25,32,.74); --hudline:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;

  #topbar .badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}

  /* 온도 패널 */
  #panel{position:fixed;top:50px;left:14px;z-index:20;background:var(--hud);

  .eq .nm{font-size:11.5px;margin-top:4px;line-height:1.25}
  .eq.placed{opacity:.42}
  .eq.placed .nm::after{content:' ✓';color:#7CF0C9}

  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 예측 카드 · 성공 패널 */
  .card{position:fixed;left:50%;transform:translateX(-50%);z-index:26;
    background:rgba(255,255,255,.97);border-radius:18px;padding:16px 18px;max-width:350px;width:92vw;
    box-shadow:0 12px 40px rgba(0,0,0,.5);color:var(--ink);transition:opacity .3s,transform .3s}
  .card.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
  #predict{bottom:120px}
  #predict2{bottom:120px}

  #predict .opts,#predict2 .opts{display:flex;flex-direction:column;gap:8px}
  #predict button,#predict2 button,#success button{font-family:'Gowun Dodum';font-size:14px;border:2px solid #dbe4ee;

  #success{bottom:50%;transform:translate(-50%,50%);text-align:center}
  #success.hide{transform:translate(-50%,50%) translateY(12px)}
  #success .big{font-size:38px}
  #success h3{font-size:18px;color:#0d7a5c;margin:6px 0 4px}

  #toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(255,255,255,.97);color:var(--ink);font-size:13.5px;padding:11px 17px;
    border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:88vw;text-align:center;
    line-height:1.55;transition:opacity .35s;border-left:5px solid var(--green)}

  #loading{position:fixed;inset:0;z-index:50;background:#171b21;display:flex;

    #mission .mp{display:none}

</style>

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 전도 시뮬 (SPEC_E7 A-2 — 열이 이웃 입자를 차례로 깨우며 퍼짐. RODK는 v2 heat 원본값) ──
     냉각항 없음: 짧은 관찰 실험이라 단열 가정(의도된 단순화 — 순서 비교가 목적). */
  function createHeatSim(){
    var S = { hf:[0,0,0], drop:[false,false,false], order:[], heatK:0, allDone:false };
    var HEAT_R=0.24;
    var RODK=[1.0, 0.42, 0.05];    // 구리·철·유리 (v2 heat.js RODS k 원본 — 변경 금지)
    var CONDUCT_RATE=0.11;         // k=1 기준: 구리 ≈9.1s · 철 ≈21.6s · 유리 ≈182s(사실상 안 떨어짐 = 대조군)
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      var k=0;
      if(inp.lit && inp.ready){
        k = 1 - inp.dist/HEAT_R;
        if(k<0)k=0; if(k>1)k=1;
      }
      S.heatK=k;
      for(var i=0;i<3;i++){
        if(!S.drop[i]){
          S.hf[i] += RODK[i]*CONDUCT_RATE*k*dt;
          if(S.hf[i]>=1){ S.hf[i]=1; S.drop[i]=true; S.order.push(i); }
        }
      }
      // ★유리(2)는 성공 조건에서 제외 — "유리는 아직 그대로"가 곧 교육
      S.allDone = S.drop[0] && S.drop[1];
      return S;
    }
    return { state:S, step:step, HEAT_R:HEAT_R, RODK:RODK };
  }

  /* ── 미션 정의 (SPEC_E7 A-1 — 미션 = 데이터) ── */
  var MISSION_HEAT = {
    id:'heat_conduct',
    title:'열의 이동 — 어느 막대가 빠를까?',
    required:['stand','rods','butter','lamp'],
    // 절차 규칙: 이 기구를 놓으려면 먼저 있어야 하는 것
    needs:{
      rods:   { pre:['stand'], msg:'막대 3개를 나란히 걸치려면 <b>스탠드가 먼저</b> 필요해요!' },
      butter: { pre:['rods'],  msg:'버터는 막대 끝에 올려요 — <b>막대가 먼저</b>!' }
    },
    // 오답 기구: 왜 아닌지가 곧 학습
    wrong:{
      magnet:'🧲 자석은 철을 끌어당기는 도구예요 — 열이 퍼지는 <b>빠르기</b>를 비교하는 실험에는 필요 없어요.',
      magnifier:'🔍 돋보기는 작은 것을 크게 볼 때! 버터가 떨어지는 건 맨눈으로도 잘 보여요.',
      tube:'⚗️ 시험관은 액체를 다룰 때 — 오늘은 <b>고체 막대</b>로 열이 옮아가는 걸 볼 거예요.',
      beaker_w:'💧 물 비커는 <b>대류</b> 실험에서 만나요! 오늘은 고체 <b>전도</b>만 볼 거예요.'
    }
  };

  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      // 위에 얹힌 것부터 함께 회수 (의존 역순)
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  var API = { createHeatSim:createHeatSim, MISSION_HEAT:MISSION_HEAT, createMissionRun:createMissionRun };
  if(typeof window!=='undefined'){ window.SciLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════ 렌더 기반 (데모 1호 확정 표준) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
// ⚠️ WebGL 컨텍스트 유실 가드(강건성표준 R4, 2026-07-08 페이블): 전자칠판·태블릿 장시간 사용 후 검은 화면 방지
renderer.domElement.addEventListener('webglcontextlost',function(e){ e.preventDefault();
  if(document.getElementById('ctxlost'))return;
  var o=document.createElement('div'); o.id='ctxlost';
  o.style.cssText='position:fixed;inset:0;background:rgba(10,12,16,.93);color:#e8ecf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';
  var t=document.createElement('div'); t.textContent='화면이 잠시 멈췄어요'; t.style.cssText='font-size:20px;font-weight:700';
  var b=document.createElement('button'); b.textContent='다시 열기';
  b.style.cssText='padding:10px 26px;border-radius:12px;border:0;background:#5B9BF0;color:#fff;font-size:16px;cursor:pointer';
  b.addEventListener('click',function(){ location.reload(); });
  o.appendChild(t); o.appendChild(b); document.body.appendChild(o);
});


const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2b3340'); gr.addColorStop(.55,'#1b2129'); gr.addColorStop(1,'#12161c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}
scene.fog = new THREE.Fog(0x161b22, 4.2, 9.5);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 30);
camera.position.set(0.95, 0.9, 1.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.32, -0.02);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=0.65; controls.maxDistance=3.4;
controls.maxPolarAngle=1.46; controls.enablePan=false;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(1.8,3.4,1.6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-1.8; sun.shadow.camera.right=1.8;
sun.shadow.camera.top=2.2; sun.shadow.camera.bottom=-0.6;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=9;
sun.shadow.bias=-0.0004; sun.shadow.radius=5;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x2b241c, 0.35));

/* 재질 — 유리=블렌딩, 액체=굴절(데모 1호 확정) */
const GLASS = new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.03,
  transparent:true, opacity:0.18, depthWrite:false,
  clearcoat:1, clearcoatRoughness:0.06, side:THREE.DoubleSide, envMapIntensity:1.6
});
const METAL = new THREE.MeshStandardMaterial({ color:0xb8bec6, metalness:0.92, roughness:0.32, envMapIntensity:1.1 });
const DARKMETAL = new THREE.MeshStandardMaterial({ color:0x555b63, metalness:0.85, roughness:0.45 });
const WOOD = new THREE.MeshStandardMaterial({ color:0xC49A6C, roughness:0.8 });
function waterMat(hex){
  return new THREE.MeshPhysicalMaterial({
    color:0xffffff, metalness:0, roughness:0.05,
    transmission:1, thickness:0.15, ior:1.33,
    attenuationColor:new THREE.Color(hex), attenuationDistance:0.16, envMapIntensity:1.0
  });
}

/* ═════════ 실험대 ═════════ */
const BENCH_Y = 0.0;
{

let toastTimer=null;
function toast(msg, warn, ms){
  toastEl.innerHTML=msg;

  toastEl.classList.remove('hide');
  clearTimeout(toastTimer);

function renderProg(){

  o.visible=true;

function onPick(id, cardEl){
  if(succeeded && !freeMode) return;
  if(run.placed[id]){
    // 재탭 = 회수 (의존물 함께)
    run.remove(id);
    Object.keys(EQ_OBJ).forEach(k=>{
      if(!run.placed[k] && k!=='lamp') EQ_OBJ[k].visible=false;
      if(k==='lamp' && !run.placed.lamp){ EQ_OBJ.lamp.visible=false; setFire(false); }
    });
    syncTray(); renderProg(); updateFireBtn();
    return;
  }
  const r=run.pick(id, freeMode);
  if(r.act==='wrong'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, 4200);
    return;
  }
  if(r.act==='blocked'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, 3800);
    return;
  }
  if(r.act==='placed'){
    const o=EQ_OBJ[id];
    if(o.userData.free){ const [x,z]=nextSpot(); o.position.x=x; o.position.z=z; }
    if(id==='lamp'){ LAMP.position.copy(LAMP_HOME); }
    dropIn(id);
    syncTray(); renderProg(); updateFireBtn();
    if(r.ready && !freeMode && !predictShown){
      predictShown=true;
      setTimeout(()=>{ predictEl.classList.remove('hide');
        toast('✅ 준비 끝! 예측을 골라 봐요'); }, 500);
    } else if(r.ready && freeMode){
      toast('준비 완료 — 불을 붙이고 램프를 가열점에 대 봐요 🔥');
    }
  }
}
function syncTray(){
  EQUIP.forEach(e=>{
    $('eq_'+e.id).classList.toggle('placed', !!run.placed[e.id]);
  });
}

  fireBtn.disabled = !run.placed.lamp;

  b.addEventListener('click',()=>{
    prediction=b.dataset.pick;
    predictEl.classList.add('hide');
    toast('좋아요! 불을 붙이고 램프를 막대 가열점(왼쪽 끝)에 대 봐요 🔬');
  });
});
predict2El.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    prediction2=b.dataset.pick;
    predict2El.classList.add('hide');
    const hit=(prediction2==='keep');
    toast(hit ? '🎯 예측 접수! 순서가 그대로인지 끝까지 지켜봐요'
              : '🤔 정말 뒤바뀔까요? 남은 순서를 지켜봐요!', false, 4200);
  });
});

function setFire(on){
  if(on && !run.placed.lamp) return;
  lit=on;
  flameOuter.visible=flameInner.visible=on;
  fireBtn.textContent=on?'🧯 불 끄기':'🔥 불 켜기';
  fireBtn.classList.toggle('off',!on);
}
fireBtn.addEventListener('click',()=>setFire(!lit));

modeBtn.addEventListener('click',()=>{
  freeMode=!freeMode;
  modeBtn.textContent=freeMode?'🎯 미션 모드':'🧪 자유 실험';
  missionEl.style.display=freeMode?'none':'';
  document.querySelector('#topbar .badge').textContent=freeMode?'자유 실험':'미션 · 열의 이동';
  toast(freeMode?'자유 실험 — 무엇이든 꺼내 놓아 봐요':'미션 모드 — 필요한 기구만!');
});

function resetAll(keepMode){
  sim=createHeatSim(); run=createMissionRun(MISSION_HEAT);
  Object.keys(EQ_OBJ).forEach(k=>{ EQ_OBJ[k].visible=false; });
  LAMP.position.copy(LAMP_HOME);
  setFire(false); lit=false;
  prediction=null; predictShown=false; succeeded=false; successAt=0;
  prediction2=null; predict2Shown=false; copperShown=false;
  spotIdx=0;
  // 막대 발광·버터 리셋
  rodGlow.forEach(g=>{ g.scale.y=0.001; g.material.opacity=0; });
  butterMesh.forEach(b=>{ b.position.y=b.userData.homeY; b.scale.setScalar(1); b.userData.fell=false; });
  stateEl.textContent='막대를 준비하고 한쪽 끝을 가열해 봐요';
  predictEl.classList.add('hide'); predict2El.classList.add('hide'); successEl.classList.add('hide');
  syncTray(); renderProg(); updateFireBtn();
  if(!keepMode && freeMode){ modeBtn.click(); }
}
resetBtn.addEventListener('click',()=>resetAll(true));
$('sucAgain').addEventListener('click',()=>resetAll(true));
$('sucFree').addEventListener('click',()=>{
  successEl.classList.add('hide');
  if(!freeMode) modeBtn.click();
});

function lampDist(){
  // 가열점 = 막대 왼끝(RIG 로컬 HEAT_PT). 램프와의 수평 거리
  const hx=RIG.position.x+HEAT_PT.x, hz=RIG.position.z+HEAT_PT.z;
  const dx=LAMP.position.x-hx;
  const dz=LAMP.position.z-hz;
  return Math.hypot(dx,dz);
}

/* ═════════ 드래그 (램프) ═════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0), -BENCH_Y);
const hitPt=new THREE.Vector3();
let dragging=false, downPos=null, moved=false;
function toNDC(e){
  ndc.x=(e.clientX/innerWidth)*2-1;
  ndc.y=-(e.clientY/innerHeight)*2+1;
}
renderer.domElement.addEventListener('pointerdown', e=>{
  if(!LAMP.visible) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  if(ray.intersectObject(dragProxy,false).length){
    dragging=true; moved=false; downPos={x:e.clientX,y:e.clientY};
    controls.enabled=false;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(!dragging){
    if(!LAMP.visible) return;
    toNDC(e); ray.setFromCamera(ndc,camera);
    renderer.domElement.style.cursor=
      ray.intersectObject(dragProxy,false).length?'grab':'';
    return;
  }
  if(downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6) moved=true;
  toNDC(e); ray.setFromCamera(ndc,camera);
  if(ray.ray.intersectPlane(dragPlane,hitPt)){
    LAMP.position.x=THREE.MathUtils.clamp(hitPt.x,-1.35,1.35);
    LAMP.position.z=THREE.MathUtils.clamp(hitPt.z,-0.6,0.6);
  }
});
function endDrag(){
  if(!dragging) return;
  dragging=false; controls.enabled=true;
  if(!moved) setFire(!lit);
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ═════════ 품질 자동 ═════════ */
let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++;
  if(qualityChecked) return;
  if(now-fpsStart>4000){
    qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){
      renderer.setPixelRatio(1);
      sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
      sun.shadow.radius=3;
    }
  }
}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  const ready = !!(run.placed.stand && run.placed.rods && run.placed.butter);
  const S=sim.step(dt,{lit, dist:lampDist(), ready});

  // 막대 발광띠 (가열점→끝으로 번지는 열) + 버터 낙하
  if(run.placed.rods){
    for(let i=0;i<3;i++){
      rodGlow[i].scale.y=Math.max(S.hf[i],0.001);
      rodGlow[i].material.opacity=0.4*S.hf[i];
    }
  }
  if(run.placed.butter){
    for(let i=0;i<3;i++){
      const b=butterMesh[i];
      if(S.drop[i] && !b.userData.fell){
        b.userData.fell=true; b.userData.fallT=0;
        KLabSnd('pop');
      }
      if(b.userData.fell){
        b.userData.fallT=(b.userData.fallT||0)+dt;
        const k=Math.min(b.userData.fallT/0.5,1), e=k*k;   // 가속 낙하
        b.position.y=b.userData.homeY - e*(ROD_Y+0.05);
        if(k>=1) b.scale.y=0.6;   // 착지 후 살짝 퍼짐
      }
    }
  }

  // 상태줄
  let st='';
  if(succeeded) st='🏅 미션 성공!';
  else if(!ready && lit) st='막대와 버터까지 준비해야 가열돼요';
  else if(S.order.length===0 && S.heatK>0) st='🔥 가열점이 뜨거워지는 중… 열이 막대를 타고 번져요';
  else if(S.order.length===1) st='🧈 구리가 1등! 다음은 어느 막대일까요?';
  else if(S.allDone) st='유리 막대 버터는 아직 그대로 — 왜일까요?';
  else if(lit && !ready) st='램프를 막대 가열점(왼쪽 끝)에 대 봐요';
  stateEl.textContent=st;

  // ★와우 2차 — 구리 낙하 순간(중/고), 불 세기→순서 예측
  if(!copperShown && S.drop[0]){
    copperShown=true;
    if(showWow && !predict2Shown && !freeMode){
      predict2Shown=true;
      predict2El.classList.remove('hide');
    }
  }

  // 성공 판정 — 구리+철 둘 다 낙하 2초 지속
  if(S.allDone){
    if(!successAt) successAt=t;
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='열은 <b>이웃 입자를 차례로 흔들어 깨우며</b>(전도) 퍼져요. 빠르기는 재질이 정해요 — <b>구리 → 철 ≫ 유리</b>.';
      if(prediction) msg=(prediction==='order'?'🎯 <b>1차 예측 적중!</b> ':'🤔 1차 예측과 달랐죠? ')+msg;
      if(prediction2) msg+= (prediction2==='keep')
        ? '<br>🎯 <b>2차도 적중</b> — 불을 세게 해도 순서는 그대로! <b>빠르기는 불이, 순서는 재질이</b> 정해요.'
        : '<br>🤔 2차는 달랐죠? 불을 세게 해도 순서는 그대로예요 — 순서를 정하는 건 재질(전도율)이거든요.';
      msg+= '<br>유리는 이제 겨우 '+Math.round(S.hf[2]*100)+'% — 그래서 냄비 손잡이는 유리·나무로 만들어요!';
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' :
                    `<br>기구 고르기 다시 생각해 본 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      if(!freeMode) successEl.classList.remove('hide');
      else toast('🧈 구리 → 철 순서로 떨어졌어요! 유리는 아직 그대로',false,5200);
    }
  } else successAt=0;

  if(lit){
    const f=1+0.10*Math.sin(t*23)+0.06*Math.sin(t*57+1.7);
    flameOuter.scale.set(0.058*f, 0.115*f*(1+0.05*Math.sin(t*31)), 1);
    flameInner.scale.set(0.034*f, 0.06*f, 1);
    flameLight.intensity=2.3+0.6*Math.sin(t*19)*Math.sin(t*7);
  } else flameLight.intensity=0;

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').classList.add('hide');
toast('🎯 미션: 선반에서 <b>필요한 기구만</b> 골라 실험을 준비해 봐요!', false, 5200);
animate();
</script>

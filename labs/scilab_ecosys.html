<!-- ═══════════════════════════════════════════════════════════════════════
     순수 로직 — KEcosys 개체군 동역학 (SPEC_ECOSYS §2). THREE·DOM 참조 0.
     tick(state,dt): 풀·토끼·여우 한 스텝 진행(단순화 록카-볼테라, 이산 오일러).
     equilibrium(): 파라미터의 공존 평형점(안정 고정점). removeSpecies(): 종 제거.
     ⚠️ §2 확정 파라미터 변경 금지 — 창발이 성립하는 파라미터 창을 SPEC이 고정한다.
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="ecosys-pure">
(function (root, factory) {
  const API = factory();
  if (typeof window !== 'undefined') window.KEcosys = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(this, function () {
  'use strict';

  /* ── 확정 파라미터 (SPEC_ECOSYS §2 · 재튜닝판 2026-07-09 · 붕괴 성립 창) ──
     준호 (B) 결정: 여우 제거 시 "토끼 폭증→풀 멸종→토끼 대붕괴"가 실제로 성립하도록 재튜닝.
     이 값의 성질: 여우 있으면 공존 평형(풀36·토끼20·여우11)에 감쇠 수렴 /
     여우 없으면 토끼 20→~74 폭증→풀을 바닥(멸종)까지 갉음→먹이 잃은 토끼 전멸.
     ⚠️ 이 창을 벗어나면 붕괴가 깨짐 — 변경은 SPEC_ECOSYS §2 표 동반 갱신 필요. */
  const PARAMS = {
    rG: 0.8,    // 풀 성장률
    Kg: 120,    // 풀 수용력
    aGR: 0.028, // 토끼가 풀 먹는 율(↑ — 오버슈트가 풀을 멸종까지 갉음)
    bRG: 0.9,   // 풀→토끼 변환효율
    dR: 0.25,   // 토끼 자연사
    aRF: 0.06,  // 여우가 토끼 먹는 율(↑ — 소수 여우로 강한 하향 조절=핵심종)
    bFR: 0.35,  // 토끼→여우 변환효율
    dF: 0.42,   // 여우 자연사
  };
  const DT = 0.1;            // 이산 스텝(고정 · §2)
  const DT_MAX = 0.2;        // 오일러 발산 방지 클램프(§7)
  const EXTINCT_FLOOR = 0.5; // 개체수 <0.5 → 0 (멸종·불가역)
  const CAPS = { grass: 100, rabbit: 40, fox: 20 }; // 군집 인스턴스 상한(§3)
  const INIT = { G: 60, R: 20, F: 8 };              // 표준 초기값(§2)
  const SPKEY = { grass: 'G', rabbit: 'R', fox: 'F' };

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function floorExtinct(v) { return v < EXTINCT_FLOOR ? 0 : v; }

  /* 한 스텝 진행 (순수 — 입력 불변). dt는 DT_MAX로 클램프. */
  function tick(s, dt) {
    const h = clamp(dt == null ? DT : dt, 0, DT_MAX);
    const G = s.G, R = s.R, F = s.F;
    const G2 = G + h * (PARAMS.rG * G * (1 - G / PARAMS.Kg) - PARAMS.aGR * G * R);
    const R2 = R + h * (PARAMS.bRG * PARAMS.aGR * G * R - PARAMS.dR * R - PARAMS.aRF * R * F);
    const F2 = F + h * (PARAMS.bFR * PARAMS.aRF * R * F - PARAMS.dF * F);
    return {
      G: floorExtinct(Math.max(0, G2)),
      R: floorExtinct(Math.max(0, R2)),
      F: floorExtinct(Math.max(0, F2)),
    };
  }

  /* 공존 평형점(주어진 파라미터의 안정 고정점). 오버라이드 가능(파라미터 실험). */
  function eqWith(p) {
    const P = p ? Object.assign({}, PARAMS, p) : PARAMS;
    const R = P.dF / (P.bFR * P.aRF);
    const G = P.Kg * (1 - P.aGR * R / P.rG);
    const F = (P.bRG * P.aGR * G - P.dR) / P.aRF;
    return { G: G, R: R, F: F };
  }
  function equilibrium() { return eqWith(null); }

  /* 여우 없는 세계의 '수학적' 평형(풀+토끼만) — 참고용.
     ⚠️ 재튜닝판에서는 (60,20,8)→여우제거 시 이 평형에 도달하지 못하고
     토끼 오버슈트가 풀을 멸종 바닥까지 갉아 전면 붕괴함(불안정 평형). */
  function foxFreeEquilibrium() {
    const G = PARAMS.dR / (PARAMS.bRG * PARAMS.aGR);
    const R = PARAMS.rG * (1 - G / PARAMS.Kg) / PARAMS.aGR;
    return { G: G, R: R, F: 0 };
  }

  function removeSpecies(s, species) {
    const k = SPKEY[species];
    const out = { G: s.G, R: s.R, F: s.F };
    if (k) out[k] = 0;
    return out;
  }

  /* 결정론 궤적. mutate(state,i)는 각 tick 전에 상태를 조정(여우 제거·남획). */
  function trajectory(s0, steps, mutate) {
    let s = { G: s0.G, R: s0.R, F: s0.F };
    const out = [s];
    for (let i = 0; i < steps; i++) {
      if (mutate) { const m = mutate(s, i); if (m) s = m; }
      s = tick(s, DT);
      out.push(s);
    }
    return out;
  }

  /* 개체수 → 군집 인스턴스 수(반올림·상한 클램프, §3·§5⑰) */
  function instanceCount(species, pop) {
    const cap = CAPS[species] != null ? CAPS[species] : 999;
    return clamp(Math.round(pop), 0, cap);
  }

  /* 진동 안정 판정(E-1) — 구간 진폭 */
  function amplitude(states, key, from) {
    let lo = Infinity, hi = -Infinity;
    for (let i = from; i < states.length; i++) {
      const v = states[i][key];
      if (v < lo) lo = v; if (v > hi) hi = v;
    }
    return hi - lo;
  }
  function isStable(states, thresh) {
    const from = Math.floor(states.length * 0.6);
    const t = thresh == null ? 6 : thresh;
    return amplitude(states, 'R', from) <= t && amplitude(states, 'G', from) <= t * 2;
  }

  /* ── 시나리오 3종 (§4 — 미션보다 탐구 도구) ── */
  const SCENARIOS = [
    { id: 'E-1', icon: '⚖️', title: '균형 찾기', grade: 'mid',
      brief: '세 생물이 함께 오래 사는 균형을 관찰하자.',
      hint: '개체수는 계절처럼 오르내려요 — 크게 요동치지 않으면 안정!' },
    { id: 'E-2', icon: '🦊', title: '천적을 없애면', grade: 'mid', wow: true,
      brief: '여우(천적)를 모두 없애고 무슨 일이 벌어지는지 보자.',
      hint: '여우가 사라지면 토끼와 풀은 어떻게 될까요?' },
    { id: 'E-3', icon: '🎣', title: '너무 많이 잡으면', grade: 'high',
      brief: '토끼를 갑자기 많이 잡으면 여우에게 무슨 일이?',
      hint: '먹이가 줄면 포식자도 뒤따라 줄어요 — 사슬은 이어져 있어요.' },
  ];
  const GRADE_SCENARIOS = {
    low:  ['E-2'],            // 관찰 데모만(개념 부하 — §4)
    mid:  ['E-1', 'E-2'],
    high: ['E-1', 'E-2', 'E-3'],
  };
  function scenarioById(id) { return SCENARIOS.find(function (s) { return s.id === id; }); }

  /* ── ★와우 예측 (E-2 · §4) — 재튜닝판에서 붕괴 서사가 실제 성립 ──
     여우 제거 → 토끼 20→~74 폭증 → 늘어난 토끼가 풀을 멸종 바닥까지 갉음 →
     먹이 잃은 토끼 전멸. "천적을 없애면 좋을 것 같지만 결국 다 무너진다"가
     스크립트 이벤트가 아니라 파라미터에서 자동 발생(테스트 ⑤가 궤적으로 단언). */
  const WOW_ECOSYS = {
    at: 'E-2',
    q: '여우(천적)를 모두 없애면 토끼는 어떻게 될까?',
    opts: [
      '천적이 없으니 행복하게 계속 늘어난다',
      '크게 늘었다가 먹이가 사라져 결국 무너진다',
    ],
    answer: 1,
    explain: '천적이 사라지자 토끼가 폭발적으로 늘어요. 하지만 너무 많아진 토끼가 ' +
             '풀을 다 먹어 치우자 풀이 사라지고, 먹이를 잃은 토끼도 굶어 무너지죠. ' +
             '천적을 없애면 토끼에게 좋을 것 같지만 결국 모두 무너집니다. ' +
             '옐로스톤에서 늑대를 없앴더니 사슴이 불어나 강가 나무가 사라지고, ' +
             '늑대를 되살리자 나무·비버·강의 흐름까지 되돌아온 것처럼 — ' +
             '하나를 건드리면 사슬 전체가 흔들려요.',
  };

  return {
    PARAMS: PARAMS, DT: DT, DT_MAX: DT_MAX, EXTINCT_FLOOR: EXTINCT_FLOOR,
    CAPS: CAPS, INIT: INIT, SPKEY: SPKEY,
    clamp: clamp, tick: tick, equilibrium: equilibrium, eqWith: eqWith,
    foxFreeEquilibrium: foxFreeEquilibrium, removeSpecies: removeSpecies,
    trajectory: trajectory, instanceCount: instanceCount,
    amplitude: amplitude, isStable: isStable,
    SCENARIOS: SCENARIOS, GRADE_SCENARIOS: GRADE_SCENARIOS, scenarioById: scenarioById,
    WOW_ECOSYS: WOW_ECOSYS,
  };
});
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     P2 렌더 어댑터 — 초원 무대·3층 군집(InstancedMesh)·개체수 렌즈·시간/여우제거 조작.
     3층 분리: window.KEcosys의 tick/equilibrium/instanceCount «결과»만 조회(동역학 판단 0).
     개체수 = 군집 인스턴스 수(결정론 산포 — 진동해도 위치 안 튐). 여우제거=붕괴 연쇄 관찰.
     ═══════════════════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const K = window.KEcosys;
const P = new URLSearchParams(location.search);
const grade = P.get('grade') || 'high';

/* ═════════ 렌더 기반 (황금 표준 승계 · 초원 톤) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', function(e){ e.preventDefault();
  if(document.getElementById('ctxlost')) return;
  const o=document.createElement('div'); o.id='ctxlost';
  o.style.cssText='position:fixed;inset:0;background:rgba(10,18,12,.93);color:#e9f2e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';
  const t=document.createElement('div'); t.textContent='화면이 잠시 멈췄어요'; t.style.cssText='font-size:20px;font-weight:700';
  const b=document.createElement('button'); b.textContent='다시 열기';
  b.style.cssText='padding:10px 26px;border-radius:12px;border:0;background:#6fcf5f;color:#04120c;font-size:16px;cursor:pointer';
  b.addEventListener('click', ()=>location.reload());
  o.appendChild(t); o.appendChild(b); document.body.appendChild(o);
});

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#213a2a'); gr.addColorStop(.5,'#16281c'); gr.addColorStop(1,'#0a120c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}
scene.fog = new THREE.Fog(0x101c14, 3.2, 9.5);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 40);
camera.position.set(0.0, 1.15, 2.35);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.12, 0);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=1.0; controls.maxDistance=4.2;
controls.maxPolarAngle=1.44; controls.enablePan=false;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff2d8, 2.5);
sun.position.set(1.8,3.4,1.4); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-2.2; sun.shadow.camera.right=2.2;
sun.shadow.camera.top=2.2; sun.shadow.camera.bottom=-1.2;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=9;
sun.shadow.bias=-0.0004; sun.shadow.radius=5;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9fe0b0, 0x1a2018, 0.42));

/* ── 초원 바닥 ── */
const MEADOW_R = 1.35;
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 56),
  new THREE.MeshStandardMaterial({ color:0x2c4632, roughness:0.98 }));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const patch = new THREE.Mesh(
  new THREE.CircleGeometry(MEADOW_R+0.12, 48),
  new THREE.MeshStandardMaterial({ color:0x35543b, roughness:0.95 }));
patch.rotation.x=-Math.PI/2; patch.position.y=0.001; patch.receiveShadow=true; scene.add(patch);

/* ═════════ 결정론 산포 (mulberry32 — 진동해도 위치 안 튐) ═════════ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function scatter(n, seed, rMax, rMin){
  const rnd=mulberry32(seed); const out=[];
  for(let i=0;i<n;i++){
    const a=rnd()*Math.PI*2; const r=(rMin||0)+Math.sqrt(rnd())*(rMax-(rMin||0));
    out.push({ x:Math.cos(a)*r, z:Math.sin(a)*r, rot:rnd()*Math.PI*2, ph:rnd()*Math.PI*2, sc:0.8+rnd()*0.5 });
  }
  return out;
}

/* ═════════ 3층 군집 (InstancedMesh · cap = SPEC §3) ═════════ */
const CAPS = K.CAPS;               // grass100 rabbit40 fox20
const dummy = new THREE.Object3D();

// 풀 — 녹색 블레이드(가는 원뿔 3겹 느낌은 비용↑ → 단일 콘)
const grassGeo = new THREE.ConeGeometry(0.018, 0.16, 5);
grassGeo.translate(0, 0.08, 0);
const grassMat = new THREE.MeshStandardMaterial({ color:0x6fcf5f, roughness:0.8 });
const grassMesh = new THREE.InstancedMesh(grassGeo, grassMat, CAPS.grass);
grassMesh.castShadow=true; grassMesh.receiveShadow=true;
// 토끼 — 흰 몸통(구) + 귀 대신 살짝 길쭉
const rabGeo = new THREE.SphereGeometry(0.05, 14, 12); rabGeo.scale(1,0.9,1.25); rabGeo.translate(0,0.05,0);
const rabMat = new THREE.MeshStandardMaterial({ color:0xf2f4ef, roughness:0.6 });
const rabMesh = new THREE.InstancedMesh(rabGeo, rabMat, CAPS.rabbit);
rabMesh.castShadow=true;
// 여우 — 주황 몸통(원뿔, 뾰족·조금 큼)
const foxGeo = new THREE.ConeGeometry(0.055, 0.13, 8); foxGeo.translate(0,0.065,0);
const foxMat = new THREE.MeshStandardMaterial({ color:0xf0913c, roughness:0.5, metalness:0.05 });
const foxMesh = new THREE.InstancedMesh(foxGeo, foxMat, CAPS.fox);
foxMesh.castShadow=true;
scene.add(grassMesh, rabMesh, foxMesh);

const POS = {
  grass: scatter(CAPS.grass, 1337, MEADOW_R),
  rabbit: scatter(CAPS.rabbit, 7331, MEADOW_R*0.86),
  fox:   scatter(CAPS.fox, 9091, MEADOW_R*0.7),
};
const MESH = { grass:grassMesh, rabbit:rabMesh, fox:foxMesh };
const aliveScale = { grass:new Float32Array(CAPS.grass), rabbit:new Float32Array(CAPS.rabbit), fox:new Float32Array(CAPS.fox) };

function paintLayer(species, count, now){
  const mesh=MESH[species], pos=POS[species], al=aliveScale[species];
  for(let i=0;i<pos.length;i++){
    const target = i<count ? 1 : 0;
    al[i] += (target-al[i])*0.14;              // 등장 0→1 / 소멸 1→0 트윈
    const s = al[i]*pos[i].sc;
    const p = pos[i];
    const bob = species==='grass' ? Math.sin(now*1.4+p.ph)*0.012*al[i]
              : Math.abs(Math.sin(now*2.2+p.ph))*0.02*al[i];  // 토끼/여우 통통
    dummy.position.set(p.x, bob, p.z);
    dummy.rotation.set(0, p.rot, species==='grass'?Math.sin(now*1.1+p.ph)*0.12:0);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ═════════ 시뮬레이션 상태 ═════════ */
const TIME_SCALE = 5;      // 실 1초 = 5 tick (§2)
let sim = { ...K.INIT };
let playing = true, speed = 1, foxRemoved = false;
let acc = 0, simStep = 0, foxRemovedStep = -1;
const SPEEDS = [1,2,4];

// 개체수 렌즈 히스토리(링 — 최근 320 샘플)
const HIST_MAX = 320;
const hist = [];
function recordHist(){ hist.push({ G:sim.G, R:sim.R, F:sim.F, rm:foxRemoved, step:simStep }); if(hist.length>HIST_MAX) hist.shift(); }
recordHist();

function stepSim(){
  if(foxRemoved) sim.F = 0;
  sim = K.tick(sim);
  simStep++;
  recordHist();
}

/* ═════════ 개체수 렌즈 (Canvas 2D) ═════════ */
const lensEl = document.getElementById('lens');
const cv = document.getElementById('popCv'), cx = cv.getContext('2d');
const LCOL = { G:'#6fcf5f', R:'#f2f4ef', F:'#f0913c' };
const Y_MAX = 110;   // 풀 수용력 100 + 여유(토끼 붕괴 피크 ~74 포함)
function drawLens(){
  const W=cv.width, H=cv.height, pad=6;
  cx.clearRect(0,0,W,H);
  // 축선
  cx.strokeStyle='rgba(255,255,255,.10)'; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(0,H-pad); cx.lineTo(W,H-pad); cx.stroke();
  if(hist.length<2){ return; }
  const n=hist.length;
  const xAt=i=> i/(HIST_MAX-1)*W;
  const yAt=v=> (H-pad) - Math.min(v,Y_MAX)/Y_MAX*(H-pad*2);
  // 여우 제거 마커
  const rmIdx = hist.findIndex(h=>h.rm);
  if(rmIdx>=0){ const x=xAt(rmIdx); cx.strokeStyle='rgba(240,145,60,.55)'; cx.setLineDash([4,4]); cx.lineWidth=1.4;
    cx.beginPath(); cx.moveTo(x,pad); cx.lineTo(x,H-pad); cx.stroke(); cx.setLineDash([]); }
  const drawCurve=(key,col)=>{
    cx.strokeStyle=col; cx.lineWidth=2; cx.beginPath();
    for(let i=0;i<n;i++){ const x=xAt(i), y=yAt(hist[i][key]); if(i===0)cx.moveTo(x,y); else cx.lineTo(x,y); }
    cx.stroke();
  };
  drawCurve('G',LCOL.G); drawCurve('R',LCOL.R); drawCurve('F',LCOL.F);
}
document.getElementById('lensLegend').innerHTML =
  `<span><i style="background:${LCOL.G}"></i>풀</span><span><i style="background:${LCOL.R}"></i>토끼</span><span><i style="background:${LCOL.F}"></i>여우</span>`;

/* ═════════ HUD ═════════ */
function syncHud(){
  document.getElementById('hudG').textContent = Math.round(sim.G);
  document.getElementById('hudR').textContent = Math.round(sim.R);
  document.getElementById('hudF').textContent = Math.round(sim.F);
}

/* ═════════ 조작 ═════════ */
let hintTimer=null;
function showHint(msg){ const h=document.getElementById('hint'); h.textContent=msg; h.classList.add('show');
  clearTimeout(hintTimer); hintTimer=setTimeout(()=>h.classList.remove('show'), 3200); }

const playBtn=document.getElementById('playBtn');
playBtn.addEventListener('click', ()=>{ playing=!playing;
  playBtn.textContent = playing?'⏸ 멈춤':'▶ 재생'; playBtn.classList.toggle('on', playing); });
const speedBtn=document.getElementById('speedBtn');
speedBtn.addEventListener('click', ()=>{ const i=(SPEEDS.indexOf(speed)+1)%SPEEDS.length; speed=SPEEDS[i]; speedBtn.textContent='⏩ '+speed+'×'; });
const foxBtn=document.getElementById('foxBtn');
foxBtn.addEventListener('click', ()=>{
  if(!foxRemoved){ foxRemoved=true; foxRemovedStep=simStep;
    foxBtn.classList.add('gone'); foxBtn.textContent='🦊 없앴음';
    showHint('여우를 없앴어요. 토끼가 어떻게 되는지 지켜보세요…'); }
  else { foxRemoved=false; foxBtn.classList.remove('gone'); foxBtn.textContent='🦊 여우 없애기';
    showHint('여우를 다시 데려왔어요. (이미 무너졌다면 처음부터로 되돌려요)'); }
});
const resetBtn=document.getElementById('resetBtn');
resetBtn.addEventListener('click', ()=>{
  sim={...K.INIT}; foxRemoved=false; foxRemovedStep=-1; simStep=0; acc=0;
  hist.length=0; recordHist();
  foxBtn.classList.remove('gone'); foxBtn.textContent='🦊 여우 없애기';
  showHint('처음 상태로 되돌렸어요.');
});

/* 🎣 토끼 남획 (E-3) — R 강제 급감 → 여우 후속 감소 연쇄(§5 ⑨) */
const harvestBtn=document.getElementById('harvestBtn');
function harvestRabbits(){
  sim.R = Math.max(4, sim.R*0.18);   // 갑작스러운 대량 포획
  showHint('토끼를 한꺼번에 많이 잡았어요. 여우 먹이가 줄면 여우는 어떻게 될까요?');
}
harvestBtn.addEventListener('click', harvestRabbits);


/* ═════════ 학년칸 (§4) — 저=렌즈 숨김(관찰 데모) ═════════ */
if(grade==='low'){ lensEl.classList.add('hide'); }

/* ═════════ P3 시나리오 UI (§4 — 미션보다 "탐구 도구") ═════════ */
const gradeList = K.GRADE_SCENARIOS[grade] || K.GRADE_SCENARIOS.high;
let activeScenario = null;

function buildScenarioUI(){
  const wrap=document.createElement('div');
  wrap.innerHTML =
    `<button id="sBtn">🔬 시나리오</button>
     <div id="sBanner" class="hide"><span id="sbIcon"></span><div><div id="sbTitle"></div><div id="sbHint"></div></div><button id="sbClose">✕</button></div>
     <div id="sHome" class="hide"><div class="scard"><h2>🌱 생태계 시나리오</h2>
       <div class="sub">세 생물이 어떻게 서로 이어져 있는지 살펴봐요</div>
       <div id="sList"></div><button id="sFree">자유 관찰</button></div></div>
     <div id="sPredict" class="hide"><div class="scard">
       <div id="spQ"></div><div id="spOpts"></div>
       <div id="spExplain" class="hide"></div><button id="spGo" class="hide">지켜보기 →</button></div></div>`;
  document.body.appendChild(wrap);

  document.getElementById('sBtn').onclick = openHome;
  document.getElementById('sbClose').onclick = exitScenario;
  document.getElementById('sFree').onclick = ()=>{ closeAll(); exitScenario(); };
  document.getElementById('spGo').onclick = ()=>{
    document.getElementById('sPredict').classList.add('hide');
    foxBtn.classList.add('pulse');
    showHint('아래 «여우 없애기»를 눌러 직접 확인해 보세요.');
  };

  // 학년별 시나리오 리스트
  const list=document.getElementById('sList');
  gradeList.forEach(id=>{
    const s=K.scenarioById(id); if(!s) return;
    const b=document.createElement('button');
    b.className='sItem'+(s.wow?' wow':'');
    b.innerHTML=`<span class="si">${s.icon}</span><span><b>${s.title}</b><small>${s.brief}</small></span>`;
    b.onclick=()=>startScenario(id);
    list.appendChild(b);
  });
}
function openHome(){ closeAll(); document.getElementById('sHome').classList.remove('hide'); }
function closeAll(){ ['sHome','sPredict'].forEach(i=>document.getElementById(i).classList.add('hide')); }

function resetSim(){
  sim={...K.INIT}; foxRemoved=false; foxRemovedStep=-1; simStep=0; acc=0;
  hist.length=0; recordHist();
  foxBtn.classList.remove('gone'); foxBtn.textContent='🦊 여우 없애기';
}

function startScenario(id){
  const s=K.scenarioById(id); if(!s) return;
  activeScenario=id;
  closeAll();
  resetSim();
  foxBtn.classList.remove('pulse');
  // 배너
  document.getElementById('sbIcon').textContent=s.icon;
  document.getElementById('sbTitle').textContent=s.title;
  document.getElementById('sbHint').textContent=s.hint;
  document.getElementById('sBanner').classList.remove('hide');
  // 시나리오별 조작 노출
  const harvest=(id==='E-3');
  harvestBtn.classList.toggle('hide', !harvest);
  foxBtn.classList.toggle('hide', harvest);   // 남획 시나리오에선 여우버튼 감춤
  playing=true; playBtn.textContent='⏸ 멈춤'; playBtn.classList.add('on');
  if(id==='E-2') showWow();
  else if(id==='E-3') showHint('세 생물이 균형을 이룬 뒤, «토끼 많이 잡기»를 눌러 보세요.');
  else showHint('개체수가 크게 요동치지 않고 안정되는지 지켜보세요.');
}

function exitScenario(){
  activeScenario=null;
  closeAll();
  document.getElementById('sBanner').classList.add('hide');
  foxBtn.classList.remove('hide','pulse');
  harvestBtn.classList.add('hide');
}

/* ★와우 예측 (E-2) — WOW_ECOSYS */
function showWow(){
  const w=K.WOW_ECOSYS;
  document.getElementById('spQ').textContent=w.q;
  const opts=document.getElementById('spOpts'); opts.innerHTML='';
  const exp=document.getElementById('spExplain'); exp.classList.add('hide');
  const go=document.getElementById('spGo'); go.classList.add('hide');
  w.opts.forEach((txt,i)=>{
    const b=document.createElement('button'); b.className='spOpt'; b.textContent=txt;
    b.onclick=()=>{
      opts.querySelectorAll('.spOpt').forEach(o=>o.style.pointerEvents='none');
      b.classList.add(i===w.answer?'right':'wrong');
      if(i!==w.answer) opts.children[w.answer].classList.add('right');
      exp.textContent=w.explain; exp.classList.remove('hide');
      go.classList.remove('hide');
    };
    opts.appendChild(b);
  });
  document.getElementById('sPredict').classList.remove('hide');
}

buildScenarioUI();

// 딥링크 ?scenario= / 저학년 부팅 시 홈 자동
const qScenario=P.get('scenario');
if(qScenario && K.scenarioById(qScenario)) startScenario(qScenario);
else if(grade==='low') openHome();

/* ═════════ 애니메이션 ═════════ */
let t0=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.05,(now-t0)/1000); t0=now;
  const tsec=now/1000;
  if(playing){
    acc += dt*TIME_SCALE*speed;
    let guard=0;
    while(acc>=1 && guard<40){ stepSim(); acc-=1; guard++; }
  }
  paintLayer('grass', K.instanceCount('grass', sim.G), tsec);
  paintLayer('rabbit', K.instanceCount('rabbit', sim.R), tsec);
  paintLayer('fox', K.instanceCount('fox', sim.F), tsec);
  syncHud();
  if(!lensEl.classList.contains('hide')) drawLens();
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('loading').classList.add('hide');
animate();

// 검증 훅
window.__ECOSYS_P2__ = {
  K, MESH, POS, CAPS,
  get sim(){ return sim; },
  get simStep(){ return simStep; },
  get foxRemoved(){ return foxRemoved; },
  get histLen(){ return hist.length; },
  stepSim, drawLens, paintLayer,
  removeFox(){ foxRemoved=true; foxRemovedStep=simStep; },
  reset(){ sim={...K.INIT}; foxRemoved=false; simStep=0; acc=0; hist.length=0; recordHist(); },
  countOf(sp){ return K.instanceCount(sp, sp==='grass'?sim.G:sp==='rabbit'?sim.R:sim.F); },
  // P3
  openHome, startScenario, showWow, exitScenario, harvestRabbits,
  get activeScenario(){ return activeScenario; },
  gradeList,
};
</script>

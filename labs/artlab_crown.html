<!--
  케이아트 미술실(ArtLab) 양산 1호 — 왕관 만들기 (황금 샘플 복사→스왑, 신기술 0).
  검증 기법(설계서 §2 카탈로그 조합):
    · 절취선 자르기 = 톱니 절취선(가위가 윗변 톱니선만 스닙)
    · 스냅 조인트 = 보석 붙이기·테이프로 양 끝 잇기(attach)
    · 작동 와우 = 왕관을 머리에 씌우기(안착 지속=성공)
  + 재료 트레이(고르기=학습·평가, 오답 재료는 "왜 아닌지" 피드백)
  + 예측→확인(평평한 띠도 왕관이 될까?) + 씌우기 성공 연출
  기반: klab3 코어(engine3) · three r185 벤더 · 스튜디오 표준 v3 (§1 토큰·§2-A 재질)
-->

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script id="artlab-logic">
(function(){
  'use strict';

  /* ── 미션 정의 (미션 = 데이터. 다음 만들기는 이 형식의 객체만 추가) ── */
  var MISSION_CROWN = {
    id:'crown',
    title:'왕관 만들기',
    required:['paper','scissors','gem','tape'],
    // 절차 규칙: 이 재료를 꺼내려면 먼저 있어야 하는 것
    needs:{
      scissors:{ pre:['paper'], msg:'자를 띠 종이가 먼저 있어야죠 — <b>색종이 띠부터</b> 꺼내요!' },
      gem:     { pre:['paper'], msg:'보석을 붙일 왕관이 먼저 필요해요 — <b>색종이 띠</b>를 꺼내요!' },
      tape:    { pre:['paper'], msg:'이을 왕관이 먼저 있어야죠 — <b>색종이 띠</b>를 꺼내요!' }
    },
    // 오답 재료: 왜 아닌지가 곧 학습
    wrong:{
      glue:'🧴 풀은 마를 때까지 잡고 있어야 해요 — 왕관은 <b>테이프</b>로 이으면 바로 붙어요!',
      ruler:'📏 자로 재지 않아도 돼요 — 왕관 띠는 <b>머리 둘레</b>에 맞춰 두르면 돼요!',
      pin:'📌 압정은 뾰족해서 머리에 쓰면 위험해요! 왕관은 <b>테이프</b>로 안전하게 이어요.',
      crayon:'🖍️ 크레파스로 색칠은 좋지만 — 왕관을 <b>완성</b>하는 데 꼭 필요하진 않아요.'
    }
  };

  /* ── 재료 고르기 러너 (과학실 검증본과 동일 계약) ── */
  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  /* ── 만들기 단계 러너 (미술실 고유 — 정의된 절차만 진행, 어기면 안내) ── */
  var CRAFT_GUIDE = {
    cut:'✂️ 가위를 눌러 <b>톱니 선을 따라</b> 왕관 끝을 뾰족뾰족 잘라요',
    gem:'💎 보석을 눌러 왕관에 <b>한 개씩</b> 붙여 꾸며요',
    roll:'색종이 띠를 눌러 <b>둥글게</b> 말아요 — 머리에 씌울 고리로!',
    tape:'📎 테이프를 눌러 왕관 <b>양 끝을 이어요</b>',
    wear:'왕관을 눌러 <b>머리에 써</b> 봐요! 👑'
  };
  function createCraftRun(){
    var ORDER=['cut','gem','roll','tape','wear'];
    var idx=0, gems=0, done=false;
    function stage(){ return done?'done':ORDER[idx]; }
    function act(a){
      if(done) return {act:'already'};
      var cur=ORDER[idx];
      if(a!==cur) return {act:'blocked', msg:CRAFT_GUIDE[cur]};
      if(cur==='gem'){
        gems++;
        if(gems>=3) idx++;
        return {act:'ok', step:'gem', gems:gems};
      }
      idx++;
      if(idx>=ORDER.length) done=true;
      return {act:'ok', step:cur, done:done};
    }
    return { act:act, stage:stage, gems:function(){return gems;},
             isDone:function(){return done;}, GUIDE:CRAFT_GUIDE };
  }

  /* ── 씌우기 시뮬 (머리에 쓰기 → 안착 지속=성공) ── */
  function createWearSim(){
    var S={ h:0, sustain:0, worn:false };   // h: 씌워진 정도 0→1
    var RATE=2.4, HTH=0.92, HOLD=1.2;
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      var target=(inp.wearing && inp.taped)?1:0;
      S.h += (target-S.h)*Math.min(RATE*dt,1);
      if(S.h<0.001 && target===0) S.h=0;
      if(inp.taped && S.h>=HTH){ S.sustain+=dt; if(S.sustain>=HOLD) S.worn=true; }
      else S.sustain=0;
      return S;
    }
    return { state:S, step:step, HTH:HTH };
  }

  var API = { MISSION_CROWN:MISSION_CROWN, createMissionRun:createMissionRun,
              createCraftRun:createCraftRun, createWearSim:createWearSim };
  if(typeof window!=='undefined'){ window.ArtLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import { THREE, initScene, makeMaterials, makeStage, canvasTexture } from '/kedu/teacher/engine3/klab3-core.js';
import { makeGrab } from '/kedu/teacher/engine3/klab3-grab.js';
import { makeToast, makeCards } from '/kedu/teacher/engine3/klab3-ui.js';
import { makeDropper } from '/kedu/teacher/engine3/klab3-fx.js';

/* ═════════ 씬 부트 (코어) ═════════ */
const stageEl = document.getElementById('stage');
const { renderer, scene, camera, controls, tickQuality, onLowQuality } =
  initScene(stageEl, { camPos:[0.72,0.86,1.34], target:[0,0.18,0], fov:41 });
const MAT = makeMaterials();
makeStage(scene, { deskStyle:'wood' });     // 미술실 = 원목 책상
const dropper = makeDropper();
const toast = makeToast();
const cards = makeCards();

/* ═════════ 사운드 (임시 로컬 — 코어 사운드 §2-C 확정 전) ═════════ */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function env(g,t0,a,d,v){ g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); }
function tone(f,dur,type,vol,slide){ const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,c.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+dur);
  env(g,c.currentTime,0.005,dur,vol||0.12);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+0.06); }
function noiseS(dur,vol,fc){ const c=ac(); if(!c)return;
  const n=c.sampleRate*dur|0, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc||1400;
  const g=c.createGain(); env(g,c.currentTime,0.012,dur,vol||0.1);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(); }
const snd = {
  tap(){ tone(520,0.07,'triangle',0.10); },
  snip(){ noiseS(0.05,0.16,2600); tone(1900,0.04,'square',0.05); },
  fold(){ noiseS(0.18,0.07,900); },
  pop(){ tone(300,0.09,'sine',0.12,540); },
  whoosh(){ noiseS(0.55,0.10,700); },
  chime(){ tone(660,0.35,'sine',0.10); setTimeout(()=>tone(880,0.4,'sine',0.10),120);
           setTimeout(()=>tone(1320,0.5,'sine',0.08),260); },
  nope(){ tone(220,0.12,'triangle',0.08,175); }
};
addEventListener('pointerdown',()=>{ const c=ac(); if(c && c.state==='suspended') c.resume(); });

/* ═════════ 만들기 매트 (셀프힐링 커팅매트 — 미술실의 무대) ═════════ */
const matTex = canvasTexture(512,352,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,w,h);
  gr.addColorStop(0,'#2f6b54'); gr.addColorStop(1,'#27573f');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(255,255,255,.13)'; g.lineWidth=1;
  for(let x=16;x<w;x+=32){ g.beginPath(); g.moveTo(x,10); g.lineTo(x,h-10); g.stroke(); }
  for(let y=16;y<h;y+=32){ g.beginPath(); g.moveTo(10,y); g.lineTo(w-10,y); g.stroke(); }
  g.strokeStyle='rgba(255,255,255,.24)'; g.lineWidth=1.6;
  for(let x=16;x<w;x+=160){ g.beginPath(); g.moveTo(x,10); g.lineTo(x,h-10); g.stroke(); }
  g.beginPath(); g.moveTo(16,16); g.lineTo(w-16,h-16); g.moveTo(w-16,16); g.lineTo(16,h-16);
  g.strokeStyle='rgba(255,255,255,.10)'; g.stroke();
  g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=2;
  g.strokeRect(10,10,w-20,h-20);
  g.fillStyle='rgba(255,255,255,.5)';
  for(let x=16;x<w-16;x+=16) g.fillRect(x,10,1.2,x%160===16?9:5);
});
const mat = new THREE.Mesh(
  new THREE.BoxGeometry(1.18,0.008,0.80),
  new THREE.MeshStandardMaterial({ map:matTex, roughness:0.62, metalness:0.02 })
);
mat.position.set(0,0.008,0.03);
mat.receiveShadow=true; mat.castShadow=true; scene.add(mat);

/* ═════════ 색종이 띠 (양면 · 톱니 윗변 — 절취선 자르기 + 링 말기) ═════════ */
const BAND_W=0.62, BAND_H=0.15;        // 띠 가로/세로 (펼친 상태)
const TEETH=5;                          // 톱니 개수
const PAPER_Y=0.016, PAPER_Z=0.03;
const COL_FRONT=0xFFCA3A, COL_BACK=0xF08A24;   // 양면 색종이(앞 금빛 · 뒤 주황)
function paperTex(hex){
  return canvasTexture(256,96,(g,w,h)=>{
    g.fillStyle='#'+hex.toString(16).padStart(6,'0'); g.fillRect(0,0,w,h);
    for(let i=0;i<600;i++){ const v=Math.random()*0.09;
      g.fillStyle=`rgba(255,255,255,${v})`;
      g.fillRect(Math.random()*w,Math.random()*h,1.3,1.3); }
  });
}
const pmFront=new THREE.MeshStandardMaterial({ map:paperTex(COL_FRONT), roughness:0.82, side:THREE.FrontSide });
const pmBack =new THREE.MeshStandardMaterial({ map:paperTex(COL_BACK ), roughness:0.82, side:THREE.BackSide  });
function twoSided(shape){                       // 같은 지오메트리 2메시(앞/뒤 색) = z파이팅 없음
  const geo=new THREE.ShapeGeometry(shape), grp=new THREE.Group();
  const a=new THREE.Mesh(geo,pmFront), b=new THREE.Mesh(geo,pmBack);
  a.castShadow=b.castShadow=true;
  grp.add(a,b); return grp;
}
/* 왕관 띠 셰이프: 아래는 직선, 위는 톱니(뾰족뾰족). 자르기 전=밋밋한 직사각, 자른 뒤=톱니 */
function bandShape(toothed){
  const s=new THREE.Shape();
  const x0=-BAND_W/2, x1=BAND_W/2, y0=-BAND_H/2, y1=BAND_H/2;
  s.moveTo(x0,y0); s.lineTo(x1,y0);              // 아랫변
  if(toothed){
    const seg=BAND_W/TEETH;
    for(let i=0;i<TEETH;i++){
      const xa=x1-i*seg, xb=xa-seg;
      s.lineTo(xa-seg*0.5, y1);                  // 톱니 꼭짓점
      s.lineTo(xb, y0+BAND_H*0.34);              // 톱니 골
    }
  } else {
    s.lineTo(x1,y1); s.lineTo(x0,y1);            // 밋밋한 윗변
  }
  s.closePath(); return s;
}
/* 세그먼트 분할 띠 = 둥글게 말기용(N등분 각 조각을 원호로 배치) */
const ROLL_SEG=24;
const PAPER=new THREE.Group();
PAPER.position.set(0,PAPER_Y,PAPER_Z);
PAPER.rotation.x=-Math.PI/2;                     // 셰이프 XY → 책상 평면, z=위
PAPER.visible=false; scene.add(PAPER);

/* 톱니 절취선(윗변 지그재그) — 점선 세그먼트 */
const CREASE=(function(){
  const g=new THREE.Group();
  const m=new THREE.MeshBasicMaterial({ color:0x8a4a2a, transparent:true, opacity:0.5 });
  const seg=BAND_W/TEETH, x1=BAND_W/2;
  for(let i=0;i<TEETH;i++){
    const xa=x1-i*seg;
    for(let k=0;k<6;k++){
      const t=k/6;
      const px=xa - seg*0.5*t, py=BAND_H*0.5*t + (-BAND_H*0.16);
      const s2=new THREE.Mesh(new THREE.PlaneGeometry(0.016,0.0035), m);
      s2.position.set(px,py,0.0016); s2.rotation.z=Math.atan2(BAND_H*0.5,-seg*0.5);
      g.add(s2);
    }
  }
  g.visible=false; PAPER.add(g); return g;
})();

/* 왕관 본체 그룹 (자르기 전 = 밋밋한 띠 1장) */
let bandMesh=twoSided(bandShape(false));
PAPER.add(bandMesh);
function reshapeBand(toothed){
  PAPER.remove(bandMesh);
  bandMesh=twoSided(bandShape(toothed));
  PAPER.add(bandMesh);
  return bandMesh;
}

/* ═════════ 재료 3D 오브젝트 ═════════ */
function grp(...ms){ const g=new THREE.Group(); ms.forEach(m=>{ m.castShadow=true; g.add(m); }); return g; }

/* 가위 */
function buildScissors(){
  const blade=()=>new THREE.Mesh(new THREE.BoxGeometry(0.135,0.004,0.016), MAT.METAL);
  const ring =()=>new THREE.Mesh(new THREE.TorusGeometry(0.022,0.006,10,20),
    new THREE.MeshStandardMaterial({ color:0xE53935, roughness:0.45 }));
  const b1=blade(), b2=blade(), r1=ring(), r2=ring();
  b1.position.x=0.055; b2.position.x=0.055;
  const a1=new THREE.Group(), a2=new THREE.Group();
  a1.add(b1); a2.add(b2);

const tweens=[];
function tw(dur,fn){ return new Promise(res=>tweens.push({ t:0, dur, fn, res })); }

async function animCut(){
  busy=true; setHint('');

  const home={ p:SCIS.position.clone(), r:SCIS.rotation.y };
  const arms=SCIS.userData.arms;
  const y1=BAND_H/2, x1=BAND_W/2, seg=BAND_W/TEETH;
  /* 톱니 윗변 지그재그를 왼→오 스닙 (설계된 절취선에서만) */
  const startX=-x1, endX=x1;
  const worldZ=y=> PAPER_Z - y;                         // 셰이프 y → 월드 z
  let from=SCIS.position.clone();
  await tw(0.32,q=>{ SCIS.position.lerpVectors(from,
    new THREE.Vector3(startX,0.03,worldZ(y1*0.2)), eo3(q)); });
  for(let i=0;i<TEETH;i++){
    const xa=-x1+i*seg;
    const path=[ [xa, y1*0.2], [xa+seg*0.5, y1], [xa+seg, y1*0.2] ]; // 골→봉우리→골
    for(let s=0;s<path.length-1;s++){
      const [ax,ay]=path[s], [bx,by]=path[s+1];
      snd.snip();
      await tw(0.13,q=>{
        const open=Math.sin(q*Math.PI)*0.24;
        arms[0].rotation.y=0.10+open; arms[1].rotation.y=-0.10-open;
        SCIS.position.x=ax+(bx-ax)*q;
        SCIS.position.z=worldZ(ay+(by-ay)*q);
      });
      SCIS.rotation.y=Math.atan2(worldZ(by)-worldZ(ay), bx-ax);
    }
  }
  reshapeBand(true);                                     // 밋밋한 띠 → 톱니 띠
  CREASE.visible=false;
  const back=SCIS.position.clone();
  await tw(0.35,q=>{ SCIS.position.lerpVectors(back, home.p, eo3(q)); });
  SCIS.rotation.y=home.r;
  snd.pop();
  toast('왕관 끝이 <b>뾰족뾰족</b>해졌어요! 이제 보석으로 꾸며요 💎');
  busy=false;

}

async function animGem(idx, gemObj){

/* 평평한 띠 → 원통(고리)로 굽히기: 세그먼트 지오메트리를 원호로 재배치 */
let ringMode=false;
const RING_R=BAND_W/(2*Math.PI);                         // 둘레=BAND_W인 원의 반지름
function bendBand(t){
  // t: 0=평평, 1=완전한 고리. 각 정점 x를 원호로 매핑
  const geoA=bandMesh.children[0].geometry;
  const geoB=bandMesh.children[1].geometry;
  [geoA,geoB].forEach(geo=>{
    const pos=geo.attributes.position;
    if(!geo.userData.flat){                              // 원본 평면 좌표 백업
      geo.userData.flat=pos.array.slice();
    }
    const flat=geo.userData.flat;
    for(let i=0;i<pos.count;i++){
      const fx=flat[i*3], fy=flat[i*3+1];
      const ang=(fx/BAND_W)*Math.PI*2*t;                 // 둘레를 각도로
      const r=RING_R;
      const bx=t>0.001 ? Math.sin(ang)*r : fx;
      const bz=t>0.001 ? (Math.cos(ang)*r - r) : 0;      // 앞으로 볼록
      pos.setXYZ(i, bx, fy, bz);
    }
    pos.needsUpdate=true; geo.computeVertexNormals();
  });
  // 붙은 보석도 함께 휘게
  placedGems.forEach(g=>{
    const fx=g.lx;
    const ang=(fx/BAND_W)*Math.PI*2*t;
    const r=RING_R+0.006;
    g.obj.position.set(t>0.001?Math.sin(ang)*r:fx, g.ly, t>0.001?(Math.cos(ang)*r-RING_R):0.002);
    if(t>0.001) g.obj.rotation.y=ang;
  });
}

  snd.chime();
  const guess = prediction==='ring'
    ? '🔮 <b>예측 적중!</b> 평평한 띠를 <b>둥글게 말아 이어야</b> 머리에 씌울 수 있어요.'
    : (prediction==='flat'
        ? '🔮 예측과 달랐죠? 평평한 띠는 머리를 <b>감싸지 못해요</b> — 둥글게 말아 이어야 왕관이 돼요.'
        : '평평한 띠를 <b>둥글게 말아 이어야</b> 머리에 씌울 수 있어요.');
  const wrongN=run.wrongCount();
  const matMsg = wrongN===0
    ? '재료도 <b>한 번에 딱</b> 맞게 골랐어요! 💎'
    : `아니었던 재료를 ${wrongN}번 골랐어요 — 다음엔 한 번에!`;
  const v=await cards.showCard(
    `<div style="font-size:38px;text-align:center">👑</div>
     <h3 style="text-align:center">미션 성공 — 왕관!</h3>
     <p style="font-size:13px;line-height:1.65">${guess}<br>${matMsg}</p>`,
    [ { label:'🎨 자유 만들기', cls:'pri', value:'free' },
      { label:'↺ 다시 하기', value:'again' } ], true);
  if(v==='free' && !freeMode) modeBtn.click();
  if(v==='again') resetAll(true);
}

/* ═════════ 모드 · 리셋 ═════════ */
modeBtn.addEventListener('click',()=>{
  freeMode=!freeMode;
  modeBtn.textContent=freeMode?'🎯 미션 모드':'🎨 자유 만들기';
  missionEl.style.display=freeMode?'none':'';
  document.querySelector('.k3-topbar .badge').textContent=freeMode?'자유 만들기':'미션 · 왕관';
  toast(freeMode?'자유 만들기 — 무엇이든 꺼내 놓아 봐요':'미션 모드 — 필요한 재료만!');
});
function resetAll(keepMode){
  run=createMissionRun(MISSION_CROWN);
  craft=createCraftRun(); wsim=createWearSim();
  wearOn=false; taped=false; rolled=false; ringMode=false;
  succeeded=false; busy=false;
  prediction=null; predictShown=false; spotIdx=0;
  gemPlaced[0]=gemPlaced[1]=gemPlaced[2]=false;
  /* 왕관 원복: 붙은 보석·테이프 회수 + 밋밋한 띠로 재생성 */
  placedGems.forEach(g=>{ scene.attach(g.obj); g.obj.visible=false; });
  placedGems.length=0;
  reshapeBand(false);
  bendBand(0);
  PAPER.position.set(0,PAPER_Y,PAPER_Z); PAPER.rotation.set(-Math.PI/2,0,0);
  SCIS.position.set(0.43,0.018,0.30); SCIS.rotation.set(0,-2.1,0);
  TAPE.position.set(-0.44,0.012,0.27); TAPE.rotation.set(0,0,0);
  GEMS.forEach((g,i)=>{ g.position.set(-0.40+i*0.06,0.012,-0.30); g.rotation.set(0,0,0); });
  HEAD.visible=false;
  Object.keys(EQ_OBJ).forEach(k=>EQ_OBJ[k].visible=false);
  GEMS.forEach(g=>g.visible=false);
  wearBtn.disabled=true; wearBtn.textContent='👑 머리에 쓰기'; wearBtn.classList.remove('on');
  camTargetY=0.20;
  cards.hide(); setHint('');
  syncTray(); renderProg(); renderSteps();
  if(!keepMode && freeMode) modeBtn.click();
}
resetBtn.addEventListener('click',()=>resetAll(true));

/* ═════════ 루프 ═════════ */
let camTargetY=0.20;
let last=null;
function loop(ts){
  requestAnimationFrame(loop);
  if(last===null) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt<0) dt=0; if(dt>0.05) dt=0.05;

  /* 트윈 */
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i]; w.t+=dt;
    const k=Math.min(w.t/w.dur,1);
    w.fn(k);
    if(k>=1){ tweens.splice(i,1); w.res(); }
  }
  dropper.tick(dt);

  /* 씌우기 */
  const S=wsim.step(dt,{ wearing:wearOn, taped });
  if(taped && !busy) applyWear(S.h);
  if(wearOn && taped) camTargetY=0.30; else if(!succeeded) camTargetY=0.20;
  if(S.worn && !succeeded){ succeeded=true;
    setHint(''); setTimeout(showSuccess, 350); }

  controls.target.y += (camTargetY-controls.target.y)*Math.min(dt*3,1);
  controls.update();
  tickQuality();
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
setTimeout(()=>document.getElementById('loading').classList.add('hide'), 600);
setHint('재료함에서 <b>필요한 재료</b>를 골라 꺼내요');
</script>

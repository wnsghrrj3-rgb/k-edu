<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우주 창문 — 케이랩 시제품 | K-edu</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;font-family:'Jua',sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block}

  /* 시작 화면 */
  #start{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%, #0b1d3a 0%, #02060f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;text-align:center;padding:24px}
  #start h1{font-size:34px;letter-spacing:1px}
  #start p{font-size:16px;color:#9fb6d8;line-height:1.6}
  #startBtn{font-family:'Jua';font-size:24px;color:#fff;background:#1565C0;border:none;border-radius:18px;padding:16px 44px;box-shadow:0 6px 0 #0b3d75;cursor:pointer}
  #startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #0b3d75}

  /* 상단 칩 */
  .chip{position:fixed;top:12px;background:rgba(10,20,40,.72);border:1px solid rgba(120,160,220,.35);border-radius:14px;padding:8px 14px;font-size:14px;z-index:20;backdrop-filter:blur(4px)}
  #titleChip{left:12px}
  #stampChip{right:12px}
  #stampChip b{color:#FFC53D}

  /* 하단 힌트 */
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(10,20,40,.72);border:1px solid rgba(120,160,220,.35);border-radius:14px;padding:9px 16px;font-size:14px;z-index:20;white-space:nowrap;backdrop-filter:blur(4px)}

  /* 행성 정보 카드 */
  #card{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(20px);background:rgba(8,16,34,.88);border:2px solid #1565C0;border-radius:18px;padding:14px 20px;min-width:240px;max-width:86vw;text-align:center;z-index:30;opacity:0;pointer-events:none;transition:opacity .3s, transform .3s;backdrop-filter:blur(6px)}
  #card.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  #card .nm{font-size:24px;margin-bottom:4px}
  #card .fact{font-size:15px;color:#bcd2f0;line-height:1.5}
  #backBtn{margin-top:10px;font-family:'Jua';font-size:16px;color:#fff;background:#FF8A3D;border:none;border-radius:12px;padding:9px 22px;box-shadow:0 4px 0 #b85a1a;cursor:pointer}
  #backBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b85a1a}

  /* 화면 가장자리 화살표(타깃 안내) */
  #arrow{position:fixed;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid #FFC53D;z-index:25;display:none;filter:drop-shadow(0 0 6px rgba(255,197,61,.8))}

  /* 순간이동 페이드 */
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}

  /* 완료 축하 */
  #fin{position:fixed;inset:0;background:rgba(2,6,15,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;text-align:center;padding:24px}
  #fin h2{font-size:32px;color:#FFC53D}
  #fin p{font-size:17px;color:#bcd2f0;line-height:1.6}
</style>
</head>
<body>
<div id="wrap"></div>

<div id="start">
  <h1>🪐 우주 창문</h1>
  <p>지금부터 이 태블릿은 <b>우주로 뚫린 창문</b>이에요.<br>기기를 들고 천천히 한 바퀴 돌아 보세요.<br>행성을 만나면 <b>톡!</b> 눌러서 가까이 가 볼 수 있어요.</p>
  <button id="startBtn">우주로 나가기</button>
  <p style="font-size:12.5px;color:#5f769a">케이랩 시제품 · 자이로가 없으면 손가락으로 둘러볼 수 있어요</p>
</div>

<div class="chip" id="titleChip">우주 창문 <span style="color:#5f769a;font-size:12px">시제품</span></div>
<div class="chip" id="stampChip">행성 도장 <b id="stampN">0</b>/8</div>
<div id="hint">기기를 돌려 우주를 둘러보세요</div>
<div id="arrow"></div>
<div id="fade"></div>

<div id="card">
  <div class="nm" id="cardNm">지구</div>
  <div class="fact" id="cardFact"></div>
  <button id="backBtn">제자리로 돌아가기</button>
</div>

<div id="fin">
  <h2>🏆 태양계 탐험 완료!</h2>
  <p>여덟 행성을 모두 만났어요.<br>태양에서 가까운 순서를 기억하나요?<br><b style="color:#fff">수성 → 금성 → 지구 → 화성 → 목성 → 토성 → 천왕성 → 해왕성</b></p>
  <button id="finBtn" style="font-family:'Jua';font-size:18px;color:#fff;background:#1565C0;border:none;border-radius:14px;padding:12px 30px;box-shadow:0 5px 0 #0b3d75;cursor:pointer">우주로 돌아가기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ---------- 장면 ---------- */
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 3000);
var HOME = new THREE.Vector3(0, 10, 100);   /* 지구 궤도 바깥, 우주에 떠 있는 자리 */
camera.position.copy(HOME);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
$('wrap').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x223244, 1.1));
var sunLight = new THREE.PointLight(0xffeecc, 1.6, 0, 2);
scene.add(sunLight);

/* ---------- 별하늘 (360° 둘러싸기) ---------- */
(function makeStars(){
  var N = 6000, pos = new Float32Array(N*3), col = new Float32Array(N*3);
  var c1 = new THREE.Color(0xffffff), c2 = new THREE.Color(0xaecbff), c3 = new THREE.Color(0xffe2b8);
  for (var i=0;i<N;i++){
    /* 구 표면 균일 분포 + 은하수 띠(적도 부근 밀집) */
    var band = Math.random() < 0.45;
    var u = Math.random()*2-1;
    if (band) u = (Math.random()*2-1)*0.25;
    var th = Math.random()*Math.PI*2, r = 1400, s = Math.sqrt(1-u*u);
    pos[i*3]   = r*s*Math.cos(th);
    pos[i*3+1] = r*u;
    pos[i*3+2] = r*s*Math.sin(th);
    var c = Math.random()<0.75?c1:(Math.random()<0.5?c2:c3);
    var dim = band ? (0.45+Math.random()*0.55) : (0.55+Math.random()*0.45);
    col[i*3]=c.r*dim; col[i*3+1]=c.g*dim; col[i*3+2]=c.b*dim;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:2.2, sizeAttenuation:false, vertexColors:true})));
})();

/* ---------- 태양 ---------- */
var sun = new THREE.Mesh(new THREE.SphereGeometry(14, 32, 20),
  new THREE.MeshBasicMaterial({color:0xFFD27A}));
scene.add(sun);
(function sunGlow(){
  var cv = document.createElement('canvas'); cv.width = cv.height = 256;
  var ctx = cv.getContext('2d');
  var gr = ctx.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0,'rgba(255,225,160,0.9)'); gr.addColorStop(0.4,'rgba(255,190,90,0.35)'); gr.addColorStop(1,'rgba(255,170,60,0)');
  ctx.fillStyle = gr; ctx.fillRect(0,0,256,256);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  sp.scale.set(95,95,1); scene.add(sp);
})();

/* ---------- 행성 데이터 (크기·거리 = 체감용 압축 스케일) ---------- */
var PLANETS = [
 {key:'mercury', nm:'수성', r:1.6, d:34,  speed:1.60, ang:0.6, col:0x9c8f84, fact:'태양에서 가장 가까운 행성이에요.<br>낮은 아주 뜨겁고 밤은 아주 추워요!'},
 {key:'venus',   nm:'금성', r:2.6, d:48,  speed:1.18, ang:2.1, col:0xE8C07A, fact:'저녁 하늘에서 제일 밝게 빛나요.<br>두꺼운 구름이 덮여 가장 뜨거운 행성!'},
 {key:'earth',   nm:'지구', r:2.8, d:64,  speed:1.00, ang:4.6, col:0x3D7BE8, fact:'우리가 사는 푸른 행성!<br>물과 공기가 있어 생명이 살아요. 🌍'},
 {key:'mars',    nm:'화성', r:2.1, d:80,  speed:0.81, ang:5.6, col:0xD96B4A, fact:'붉은 흙으로 덮인 빨간 행성.<br>사람이 다음에 가 보고 싶어 하는 곳!'},
 {key:'jupiter', nm:'목성', r:7.5, d:122, speed:0.44, ang:1.3, col:0xD9A56B, fact:'태양계에서 가장 큰 행성!<br>지구가 1,300개나 들어가요. 😲'},
 {key:'saturn',  nm:'토성', r:6.4, d:160, speed:0.33, ang:3.4, col:0xE3CC8F, fact:'아름다운 고리를 가진 행성.<br>고리는 얼음과 돌 조각들이에요!'},
 {key:'uranus',  nm:'천왕성', r:4.4, d:198, speed:0.23, ang:0.2, col:0x8FD4E3, fact:'옆으로 누워서 도는 특이한 행성!<br>청록색 얼음 행성이에요.'},
 {key:'neptune', nm:'해왕성', r:4.3, d:236, speed:0.18, ang:2.8, col:0x4A6BD9, fact:'태양에서 가장 먼 여덟 번째 행성.<br>태양계에서 바람이 가장 세요! 💨'}
];
var planetMeshes = [];
PLANETS.forEach(function(p){
  var m = new THREE.Mesh(new THREE.SphereGeometry(p.r, 26, 18),
    new THREE.MeshStandardMaterial({color:p.col, roughness:0.85, metalness:0.05}));
  m.userData = p;
  scene.add(m); planetMeshes.push(m);
  /* 궤도 선 (아주 옅게) */
  var seg = 128, pts = [];
  for (var i=0;i<=seg;i++){ var a=i/seg*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*p.d, 0, Math.sin(a)*p.d)); }
  var line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x2a4a78, transparent:true, opacity:0.35}));
  scene.add(line);
  if (p.key==='saturn'){
    var ring = new THREE.Mesh(new THREE.RingGeometry(p.r*1.5, p.r*2.4, 48),
      new THREE.MeshBasicMaterial({color:0xCBB585, side:THREE.DoubleSide, transparent:true, opacity:0.75}));
    ring.rotation.x = Math.PI/2 - 0.35;
    m.add(ring);
  }
  if (p.key==='earth'){
    var moon = new THREE.Mesh(new THREE.SphereGeometry(0.8, 14, 10),
      new THREE.MeshStandardMaterial({color:0xBFC4CC, roughness:1}));
    moon.userData.isMoon = true;
    m.add(moon); m.userData.moon = moon;
  }
});

/* ---------- 시선 컨트롤: 자이로(있으면) + 드래그(항상) ---------- */
var lookQuat = new THREE.Quaternion();
var gyroOn = false, gyro = {alpha:0, beta:0, gamma:0};
var dragLon = -90, dragLat = 4;     /* 시작 시 태양 방향 */
var zee = new THREE.Vector3(0,0,1), eul = new THREE.Euler(),
    q0 = new THREE.Quaternion(), qX = new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5));
function screenAngle(){
  var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  return THREE.MathUtils.degToRad(a);
}
function updateLook(){
  if (gyroOn){
    eul.set(THREE.MathUtils.degToRad(gyro.beta), THREE.MathUtils.degToRad(gyro.alpha), -THREE.MathUtils.degToRad(gyro.gamma), 'YXZ');
    lookQuat.setFromEuler(eul);
    lookQuat.multiply(qX);
    lookQuat.multiply(q0.setFromAxisAngle(zee, -screenAngle()));
  } else {
    eul.set(THREE.MathUtils.degToRad(dragLat), THREE.MathUtils.degToRad(dragLon), 0, 'YXZ');
    lookQuat.setFromEuler(eul);
  }
  camera.quaternion.copy(lookQuat);
}
window.addEventListener('deviceorientation', function(e){
  if (e.alpha === null && e.beta === null) return;
  gyroOn = true;
  gyro.alpha = e.alpha||0; gyro.beta = e.beta||0; gyro.gamma = e.gamma||0;
});
/* 드래그(자이로 없을 때 / 전자칠판) */
var dragging=false, px=0, py=0, moved=0;
function pDown(x,y){ dragging=true; px=x; py=y; moved=0; }
function pMove(x,y){
  if(!dragging) return;
  var dx=x-px, dy=y-py; px=x; py=y; moved+=Math.abs(dx)+Math.abs(dy);
  if (!gyroOn){ dragLon -= dx*0.18; dragLat = Math.max(-85, Math.min(85, dragLat + dy*0.18)); }
}
renderer.domElement.addEventListener('mousedown', function(e){ pDown(e.clientX,e.clientY); });
window.addEventListener('mousemove', function(e){ pMove(e.clientX,e.clientY); });
window.addEventListener('mouseup', function(){ dragging=false; });
renderer.domElement.addEventListener('touchstart', function(e){ if(e.touches.length){ pDown(e.touches[0].clientX, e.touches[0].clientY); } }, {passive:true});
renderer.domElement.addEventListener('touchmove', function(e){ if(e.touches.length){ pMove(e.touches[0].clientX, e.touches[0].clientY); } }, {passive:true});
renderer.domElement.addEventListener('touchend', function(){ dragging=false; });

/* ---------- 행성 탭 → 순간이동 관찰 ---------- */
var ray = new THREE.Raycaster(); ray.params.Points = {threshold: 4};
var ndc = new THREE.Vector2();
var mode = 'free';            /* free | observe */
var target = null;            /* 관찰 중 행성 */
var visited = {};
function tapAt(x, y){
  if (moved > 12) return;                      /* 드래그였으면 무시 */
  ndc.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  /* 히트 판정 넉넉히: 행성 중심까지 화면 거리로 */
  var best=null, bestPx=64;                    /* 64px 이내면 명중 */
  planetMeshes.forEach(function(m){
    var v = m.position.clone().project(camera);
    if (v.z > 1) return;
    var sx=(v.x+1)/2*innerWidth, sy=(-v.y+1)/2*innerHeight;
    var dpx=Math.hypot(sx-x, sy-y);
    if (dpx < bestPx){ bestPx=dpx; best=m; }
  });
  if (best) goObserve(best);
  else if (mode==='observe') {/* 빈 곳 탭은 무시(돌아가기 버튼으로) */}
}
renderer.domElement.addEventListener('click', function(e){ tapAt(e.clientX, e.clientY); });

function fade(cb){
  var f=$('fade'); f.style.opacity=1;
  setTimeout(function(){ cb(); f.style.opacity=0; }, 280);
}
function goObserve(mesh){
  var p = mesh.userData;
  fade(function(){
    mode='observe'; target=mesh;
    /* 행성 옆자리로 순간이동 (행성↔태양 사이에서 행성을 바라보는 자리) */
    var toSun = mesh.position.clone().negate().normalize();
    camera.position.copy(mesh.position).add(toSun.multiplyScalar(p.r*5+6)).add(new THREE.Vector3(0,p.r*1.2,0));
    if (!gyroOn){ faceTarget(); }
    $('cardNm').textContent = p.nm;
    $('cardFact').innerHTML = p.fact;
    $('card').classList.add('on');
    $('hint').textContent = gyroOn ? '기기를 움직여 ' + p.nm + '을(를) 찾아보세요' : '드래그해서 ' + p.nm + '을(를) 둘러보세요';
    if (!visited[p.key]){ visited[p.key]=true; var n=Object.keys(visited).length; $('stampN').textContent=n;
      if (n===8) setTimeout(function(){ $('fin').style.display='flex'; }, 900); }
  });
}
function faceTarget(){
  if (!target) return;
  var dir = target.position.clone().sub(camera.position).normalize();
  dragLon = THREE.MathUtils.radToDeg(Math.atan2(-dir.x, -dir.z));
  dragLat = THREE.MathUtils.radToDeg(Math.asin(dir.y));
}
$('backBtn').addEventListener('click', function(){
  fade(function(){
    mode='free'; target=null;
    camera.position.copy(HOME);
    $('card').classList.remove('on');
    $('hint').textContent = gyroOn ? '기기를 돌려 우주를 둘러보세요' : '드래그해서 우주를 둘러보세요';
  });
});
$('finBtn').addEventListener('click', function(){ $('fin').style.display='none'; });

/* ---------- 가장자리 화살표 (관찰 중 행성이 화면 밖이면 방향 안내) ---------- */
function updateArrow(){
  var ar = $('arrow');
  if (mode!=='observe' || !target){ ar.style.display='none'; return; }
  var v = target.position.clone().project(camera);
  var behind = v.z > 1;
  var sx=(v.x+1)/2*innerWidth, sy=(-v.y+1)/2*innerHeight;
  var onScreen = !behind && sx>40 && sx<innerWidth-40 && sy>40 && sy<innerHeight-40;
  if (onScreen){ ar.style.display='none'; return; }
  var cx=innerWidth/2, cy=innerHeight/2;
  var dx=sx-cx, dy=sy-cy;
  if (behind){ dx=-dx; dy=-dy; }
  var ang=Math.atan2(dy,dx);
  var rx=cx + Math.cos(ang)*(cx-46), ry=cy + Math.sin(ang)*(cy-46);
  ar.style.display='block';
  ar.style.left=(rx-14)+'px'; ar.style.top=(ry-12)+'px';
  ar.style.transform='rotate('+(ang+Math.PI/2)+'rad)';
}

/* ---------- 루프 ---------- */
var lastTs = null;
function loop(ts){
  requestAnimationFrame(loop);
  if (lastTs===null) lastTs=ts;
  var dt = Math.max(0, (ts-lastTs)/1000); lastTs=ts;
  /* 공전 (느긋하게 — 보고 있어도 어지럽지 않게) */
  planetMeshes.forEach(function(m){
    var p=m.userData;
    p.ang += dt * 0.05 * p.speed;
    m.position.set(Math.cos(p.ang)*p.d, 0, Math.sin(p.ang)*p.d);
    m.rotation.y += dt*0.4;
    if (p.moon){ p.moonAng=(p.moonAng||0)+dt*0.9; p.moon.position.set(Math.cos(p.moonAng)*5.2, 0.6, Math.sin(p.moonAng)*5.2); }
  });
  /* 관찰 중이면 카메라가 행성을 따라감 */
  if (mode==='observe' && target){
    var p=target.userData;
    var toSun = target.position.clone().negate().normalize();
    camera.position.copy(target.position).add(toSun.multiplyScalar(p.r*5+6)).add(new THREE.Vector3(0,p.r*1.2,0));
  }
  updateLook();
  updateArrow();
  renderer.render(scene, camera);
}

/* ---------- 시작 (iOS 자이로 권한은 사용자 제스처에서) ---------- */
$('startBtn').addEventListener('click', function(){
  function begin(){
    $('start').style.display='none';
    if (!gyroOn) $('hint').textContent='드래그해서 우주를 둘러보세요';
    requestAnimationFrame(loop);
  }
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(function(res){ begin(); }).catch(function(){ begin(); });
  } else begin();
});

window.addEventListener('resize', function(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>
</body>
</html>

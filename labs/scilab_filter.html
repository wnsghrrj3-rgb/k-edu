<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이랩 과학실 — 물 끓이기 미션</title>
<!--
  케이랩 과학실(SciLab) v0.2 — 데모 1호(scilab_proto) 검수 통과 렌더 표준 위에
  "과학실 본체" 구조를 얹은 첫 판:
    · 기구 트레이(선반): 필요한 기구를 직접 골라 꺼냄 — 고르기 자체가 학습·평가
    · 스냅 배치 + 절차 규칙: 삼발이 → 그물 → 비커 → 온도계 (순서 어기면 교육 피드백)
    · 미션 시스템: 미션 = 데이터(MISSION 객체). 오답 기구 = 즉시 피드백(왜 아닌지)
    · 온도계: 설치해야 온도가 보임 (측정 도구의 의미)
    · 자유 실험 모드: 제한 없이 꺼내 놓기
  렌더 표준(데모 1호 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft ·
    유리=블렌딩 / 액체=transmission 굴절(attenuation 깊이색) · GPU 김 · CPU 기포 · 품질 자동
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5B9BF0; --orange:#FF8A3D; --green:#12B886; --purple:#9B7BF5;
    --ink:#1d2733; --hud:rgba(20,25,32,.74); --hudline:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:10px 16px;pointer-events:none;z-index:20}
  #topbar .title{color:#fff;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  #topbar .badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}

  /* 온도 패널 */
  #panel{position:fixed;top:50px;left:14px;z-index:20;background:var(--hud);
    backdrop-filter:blur(8px);border:1px solid var(--hudline);border-radius:16px;
    padding:13px 17px;color:#fff;min-width:166px}
  #temp{font-size:32px;line-height:1.05}
  #temp small{font-size:15px;color:#9fb3c8}
  #temp.na{font-size:14px;color:#9fb3c8;line-height:1.5;padding:4px 0}
  #stateline{font-size:12.5px;margin-top:6px;color:#ffd9a3;min-height:17px}

  /* 미션 패널 */
  #mission{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:21;
    background:var(--hud);backdrop-filter:blur(8px);border:1px solid var(--hudline);
    border-radius:16px;padding:11px 16px;color:#fff;max-width:min(420px,92vw);text-align:center}
  #mission .mt{font-size:14.5px;color:#ffe3b8}
  #mission .mp{font-size:12.5px;color:#c6d6e5;margin-top:4px;line-height:1.5}
  #mission .prog{margin-top:7px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  #mission .chip{font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid var(--hudline);color:#9fb3c8}
  #mission .chip.on{background:rgba(18,184,134,.22);border-color:#12B886;color:#7CF0C9}

  /* 버튼 */
  #ctrls{position:fixed;top:50px;right:14px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .btn{font-family:'Gowun Dodum';font-size:14px;border:none;border-radius:13px;padding:10px 15px;
    cursor:pointer;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s}
  .btn:active{transform:scale(.95)}
  #fireBtn{background:linear-gradient(135deg,#FF8A3D,#F4511E)}
  #fireBtn.off{background:linear-gradient(135deg,#455A64,#37474F)}
  #fireBtn:disabled{opacity:.35;cursor:default}
  #modeBtn{background:rgba(155,123,245,.25);border:1px solid rgba(155,123,245,.5)}
  #resetBtn{background:rgba(255,255,255,.14);border:1px solid var(--hudline);font-size:12.5px}

  /* 기구 트레이 */
  #tray{position:fixed;bottom:0;left:0;right:0;z-index:22;padding:10px 12px 12px;
    display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(transparent, rgba(10,13,17,.85) 40%)}
  #tray::-webkit-scrollbar{display:none}
  .eq{flex:0 0 auto;width:86px;background:rgba(255,255,255,.06);border:1px solid var(--hudline);
    border-radius:15px;padding:9px 6px 8px;text-align:center;color:#dbe7f2;cursor:pointer;
    backdrop-filter:blur(6px);transition:transform .13s,border-color .2s;user-select:none}
  .eq:active{transform:scale(.93)}
  .eq .ic{font-size:26px;line-height:1.15}
  .eq .nm{font-size:11.5px;margin-top:4px;line-height:1.25}
  .eq.placed{opacity:.42}
  .eq.placed .nm::after{content:' ✓';color:#7CF0C9}
  .eq.shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 예측 카드 · 성공 패널 */
  .card{position:fixed;left:50%;transform:translateX(-50%);z-index:26;
    background:rgba(255,255,255,.97);border-radius:18px;padding:16px 18px;max-width:350px;width:92vw;
    box-shadow:0 12px 40px rgba(0,0,0,.5);color:var(--ink);transition:opacity .3s,transform .3s}
  .card.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
  #predict{bottom:120px}
  #predict h3{font-size:14.5px;margin-bottom:10px;color:#1565C0}
  #predict .opts{display:flex;flex-direction:column;gap:8px}
  #predict button,#success button{font-family:'Gowun Dodum';font-size:14px;border:2px solid #dbe4ee;
    background:#fff;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink)}
  #predict button:hover{border-color:#1565C0;background:#f0f7ff}
  #success{bottom:50%;transform:translate(-50%,50%);text-align:center}
  #success.hide{transform:translate(-50%,50%) translateY(12px)}
  #success .big{font-size:38px}
  #success h3{font-size:18px;color:#0d7a5c;margin:6px 0 4px}
  #success p{font-size:13px;line-height:1.65;color:#41546a}
  #success .row{display:flex;gap:8px;margin-top:13px}
  #success button{flex:1}
  #success button.pri{background:#12B886;border-color:#12B886;color:#fff}

  #toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(255,255,255,.97);color:var(--ink);font-size:13.5px;padding:11px 17px;
    border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:88vw;text-align:center;
    line-height:1.55;transition:opacity .35s;border-left:5px solid var(--green)}
  #toast.warn{border-left-color:var(--orange)}
  #toast.hide{opacity:0;pointer-events:none}

  #loading{position:fixed;inset:0;z-index:50;background:#171b21;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cfe3f5;
    transition:opacity .5s}
  #loading .flask{font-size:44px;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #loading.hide{opacity:0;pointer-events:none}

  @media (max-width:560px){
    #panel{top:auto;bottom:118px;padding:9px 12px;min-width:0}
    #temp{font-size:24px}
    #mission{max-width:86vw;padding:9px 12px}
    #mission .mp{display:none}
    .eq{width:76px} .eq .ic{font-size:23px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <span class="title">🧪 케이랩 과학실</span>
  <span class="badge">미션 · 혼합물의 분리</span>
</div>

<div id="panel">
  <div id="stateline">거름 장치를 조립해 볼까요?</div>
</div>

<div id="mission">
  <div class="mt">🎯 미션: 흙탕물(모래+소금물)에서 소금을 골라내기</div>
  <div class="mp">아래 선반에서 <b>필요한 기구만</b> 골라 <b>거름 장치</b>부터 세워요. 무엇이 필요할까요?</div>
  <div class="prog" id="prog"></div>
</div>

<div id="ctrls">
  <button class="btn off" id="fireBtn" disabled>🔥 불 켜기</button>
  <button class="btn" id="modeBtn">🧪 자유 실험</button>
  <button class="btn" id="resetBtn">↺ 처음부터</button>
</div>

<div id="tray"></div>

<div class="card hide" id="predict">
  <h3>🔮 예측 — 흙탕물(모래+소금물)을 부으면, 거름종이를 통과하는 것은?</h3>
  <div class="opts">
    <button data-pick="sand">① 모래만</button>
    <button data-pick="salt">② 소금물만</button>
    <button data-pick="both">③ 둘 다</button>
  </div>
</div>

<div class="card hide" id="predict2" style="bottom:120px">
  <h3 style="color:#1565C0;font-size:14.5px;margin-bottom:10px">🔮 이 <b>맑은 물</b>, 소금이 들어 있을까요?</h3>
  <div class="opts" style="display:flex;flex-direction:column;gap:8px">
    <button data-pick2="none">① 없다 — 맑으니까</button>
    <button data-pick2="in">② 있다 — 녹아서 안 보일 뿐</button>
  </div>
</div>

<div class="card hide" id="success">
  <div class="big">🏅</div>
  <h3>미션 성공 — 소금을 골라냈어요!</h3>
  <p id="sucMsg"></p>
  <div class="row">
    <button id="sucFree" class="pri">🧪 자유 실험 하기</button>
    <button id="sucAgain">↺ 다시 하기</button>
  </div>
</div>

<div id="toast" class="hide"></div>
<div id="loading"><div class="flask">⚗️</div><div>과학실 준비 중…</div></div>

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 혼합물 분리 시뮬 (SPEC_E8 A-2 · 수치 확정 · 창작 금지) ──
     검증 조각 3종 조합: 따르기(물줄기 B-1) + 증발(황금 샘플 계열) + 소금 결정(E-4 석출).
     phase 전이(C-1 전수): mix → filtering → filtered → dishing → dishing_done
                         → evaporating → salt
     ★보존: 임의 시점 물 총량 mixVol+filteredVol+dishVol+evaporated === 1.0 (소금·모래는 별도 추적) */
  function createFilterSim(){
    var S = { phase:'mix', mixVol:1.0, filteredVol:0, sandLeft:0,
              dishVol:0, dishVol0:0, evaporated:0, saltOut:0,
              pouring:false, rate:0, evapK:0 };
    var POUR_RATE=0.22, TILT_ON=-0.55, SAND_RATIO=0.3;
    var HEAT_R=0.24, EVAP_RATE=0.05, SALT_TOTAL=1.0;

    function _rate(tilt){ return POUR_RATE * Math.min((TILT_ON - tilt)/0.35, 1); }

    // 구간 1: 흙탕물 → 깔때기. 물은 filteredVol로 통과, 모래는 거름종이에 잔류.
    function pourToFunnel(dt, tilt){
      if(dt>0.05) dt=0.05;
      S.pouring = (tilt < TILT_ON) && (S.mixVol > 0.02);
      S.rate = S.pouring ? _rate(tilt) : 0;
      if(S.pouring){
        var d = Math.min(S.rate*dt, S.mixVol - 0.02);
        S.mixVol -= d; S.filteredVol += d;      // ★물 보존
        S.sandLeft += d * SAND_RATIO;           // 모래는 통과 못 함(입자 크기)
        S.phase = 'filtering';
      }
      if(S.mixVol <= 0.0201){ S.mixVol = 0.02; S.phase = 'filtered'; S.pouring=false; }
      return S;
    }

    // 구간 2: 거른 물 → 증발접시.
    function pourToDish(dt, tilt){
      if(dt>0.05) dt=0.05;
      S.pouring = (tilt < TILT_ON) && (S.filteredVol > 0.02);
      S.rate = S.pouring ? _rate(tilt) : 0;
      if(S.pouring){
        var d = Math.min(S.rate*dt, S.filteredVol - 0.02);
        S.filteredVol -= d; S.dishVol += d;     // ★물 보존
        S.phase = 'dishing';
      }
      if(S.filteredVol <= 0.0201){ S.filteredVol = 0.02; S.phase = 'dishing_done'; S.pouring=false; }
      return S;
    }

    // 증발 구간: 접시에 물이 있고 가열 중이면 물이 날아가며 소금 결정 등장.
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      var k = 0;
      if(inp.lit){ k = 1 - inp.dist/HEAT_R; if(k<0)k=0; if(k>1)k=1; }
      S.evapK = k;
      if(S.dishVol > 0.02 && k > 0){
        S.phase = 'evaporating';
        if(S.dishVol0 === 0) S.dishVol0 = S.dishVol;   // 증발 시작 시점 기준량 기록
        var d = Math.min(EVAP_RATE*k*dt, S.dishVol);
        S.dishVol -= d; S.evaporated += d;
        S.saltOut = SALT_TOTAL * (1 - S.dishVol/S.dishVol0);   // 물이 줄수록 소금 등장
      }
      if(S.dishVol <= 0.02 && S.saltOut > 0.9){ S.evaporated += S.dishVol; S.dishVol = 0; S.saltOut = 1; S.phase = 'salt'; }
      return S;
    }

    return { state:S, pourToFunnel:pourToFunnel, pourToDish:pourToDish, step:step,
             POUR_RATE:POUR_RATE, TILT_ON:TILT_ON, SAND_RATIO:SAND_RATIO,
             HEAT_R:HEAT_R, EVAP_RATE:EVAP_RATE, SALT_TOTAL:SALT_TOTAL };
  }

  /* ── 미션 정의 (SPEC_E8 A-1) ── */
  var MISSION_FILTER = {
    id:'filter_evaporate',
    title:'혼합물의 분리 — 거르고, 증발시키고',
    required:['stand','funnel','paper','beaker_r','dish','lamp'],
    // 절차 규칙: 이 기구를 놓으려면 먼저 있어야 하는 것
    needs:{
      funnel:  { pre:['stand'],   msg:'깔때기는 스탠드 링에 걸어요 — <b>스탠드가 먼저</b>!' },
      paper:   { pre:['funnel'],  msg:'거름종이는 깔때기 안에 접어 넣어요 — <b>깔때기가 먼저</b>!' },
      beaker_r:{ pre:['funnel'],  msg:'거른 물을 받으려면 <b>깔때기 아래</b>가 먼저 준비돼야죠!' },
      dish:    { pre:['beaker_r'],msg:'증발접시는 <b>거른 물(비커)</b>이 있어야 쓸 수 있어요!' }
    },
    // 오답 기구: 왜 아닌지가 곧 학습
    wrong:{
      magnet:'🧲 자석은 <b>철가루</b> 섞인 혼합물에서! 모래와 소금은 자석에 안 붙어요.',
      magnifier:'🔍 돋보기는 관찰용 — 오늘은 <b>골라내는</b> 실험이에요.',
      rod:'🥢 유리막대는 저을 때 — 오늘은 젓지 않고 <b>거르고 증발</b>시켜요.',
      thermo:'🌡️ 온도계는 온도 실험에서! 오늘 지켜볼 것은 <b>무엇이 남는가</b>예요.'
    }
  };

  /* ── 미션 러너 (황금 샘플 그대로 재사용) ── */
  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  var API = { createFilterSim:createFilterSim, MISSION_FILTER:MISSION_FILTER, createMissionRun:createMissionRun };
  if(typeof window!=='undefined'){ window.SciLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════ 렌더 기반 (데모 1호 확정 표준) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
// ⚠️ WebGL 컨텍스트 유실 가드(강건성표준 R4, 2026-07-08 페이블): 전자칠판·태블릿 장시간 사용 후 검은 화면 방지
renderer.domElement.addEventListener('webglcontextlost',function(e){ e.preventDefault();
  if(document.getElementById('ctxlost'))return;
  var o=document.createElement('div'); o.id='ctxlost';
  o.style.cssText='position:fixed;inset:0;background:rgba(10,12,16,.93);color:#e8ecf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';
  var t=document.createElement('div'); t.textContent='화면이 잠시 멈췄어요'; t.style.cssText='font-size:20px;font-weight:700';
  var b=document.createElement('button'); b.textContent='다시 열기';
  b.style.cssText='padding:10px 26px;border-radius:12px;border:0;background:#5B9BF0;color:#fff;font-size:16px;cursor:pointer';
  b.addEventListener('click',function(){ location.reload(); });
  o.appendChild(t); o.appendChild(b); document.body.appendChild(o);
});


const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2b3340'); gr.addColorStop(.55,'#1b2129'); gr.addColorStop(1,'#12161c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}
scene.fog = new THREE.Fog(0x161b22, 4.2, 9.5);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 30);
camera.position.set(0.95, 0.9, 1.6);
const controls = new OrbitControls(camera, renderer.domElement);

/* ── 액체 헬퍼 (비커/접시 공용 — 실린더 + scale.y 수위 + 착수 리플) ── */
function makeLiquid(rTop, rBot, h0, hex, atten){
  const geo=new THREE.CylinderGeometry(rTop, rBot, h0, 40, 1, false);
  const base=geo.attributes.position.array.slice();
  const mat=waterMat(hex); if(atten!=null) mat.attenuationDistance=atten;
  const mesh=new THREE.Mesh(geo, mat); mesh.renderOrder=1;
  function layout(vol){
    const h=h0*Math.max(vol,0);
    mesh.scale.y=Math.max(vol,0.0001);
    mesh.position.y=0.004+h/2;
    mesh.visible = vol>0.001;
    return 0.004+h;
  }
  function ripple(t,amp){
    const pos=geo.attributes.position, arr=pos.array, topHalf=h0/2-0.0001;
    for(let i=0;i<arr.length;i+=3){
      if(base[i+1]>=topHalf){
        const x=base[i], z=base[i+2];
        arr[i+1]=base[i+1]+amp*Math.sin(t*4.2+x*55+z*47)+amp*0.6*Math.sin(t*6.8+x*90-z*60);
      }
    }
    pos.needsUpdate=true; geo.computeVertexNormals();
  }
  return { mesh, geo, layout, ripple };
}

/* ── 석출 InstancedMesh 팩토리 (E-4 §3-B 검증분 재사용 — 불투명 필수) ── */
function makePrecip(count, per, colorHex, radius, spreadR, y0, layerN){
  const dummy=new THREE.Object3D();
  const target=new Float32Array(count), cur=new Float32Array(count);
  const geo=new THREE.OctahedronGeometry(radius, 0);
  const mat=new THREE.MeshStandardMaterial({color:colorHex, roughness:0.35, metalness:0});
  const mesh=new THREE.InstancedMesh(geo, mat, count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const pos=[];
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*spreadR;
    const layer=Math.floor(i/layerN);
    pos.push({ x:Math.cos(a)*r, z:Math.sin(a)*r, y:y0+layer*radius*1.4+Math.random()*radius,
               rx:Math.random()*Math.PI, ry:Math.random()*Math.PI });
    dummy.position.set(0,-1,0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate=true; mesh.visible=false;
  // ratio 0~1 → visible 수 = ratio*per 로 성장
  function update(ratio, dt){
    const showN=Math.min(count, Math.floor(ratio*per));
    mesh.visible = showN>0;
    for(let i=0;i<count;i++){
      target[i]=(i<showN)?1:0;
      cur[i]+=(target[i]-cur[i])*Math.min(dt*5,1);
      if(cur[i]<0.001 && target[i]===0) cur[i]=0;
      const p=pos[i];
      dummy.position.set(p.x,p.y,p.z); dummy.rotation.set(p.rx,p.ry,0);
      dummy.scale.setScalar(cur[i]<0.001?0.001:cur[i]); dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate=true;
    return showN;
  }
  function reset(){ for(let i=0;i<count;i++){ target[i]=0; cur[i]=0; } mesh.visible=false; }
  return { mesh, update, reset };
}

function toast(msg, warn, ms){
  toastEl.innerHTML=msg; toastEl.classList.toggle('warn', !!warn);
  toastEl.classList.remove('hide');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.add('hide'), ms||3400);
}
function renderProg(){
  const n=run.count(), total=MISSION_FILTER.required.length;
  let html=`<span class="chip ${n?'on':''}">준비물 ${n} / ${total}</span>`;
  MISSION_FILTER.required.forEach(id=>{
    if(run.placed[id]){ const e=EQUIP.find(x=>x.id===id); html+=`<span class="chip on">${e.ic} ${e.nm}</span>`; }
  });
  progEl.innerHTML=html;
}
renderProg();

function dropIn(id){
  const o=EQ_OBJ[id]; if(!o) return;
  o.visible=true; drops.push({o, t:0});
}
function onPick(id, el){
  const r=run.pick(id, freeMode);
  if(r.act==='already') return;
  if(r.act==='wrong'){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),420); toast(r.msg, true); return; }
  if(r.act==='blocked'){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),420); toast(r.msg, true); return; }
  // placed
  el.classList.add('placed');
  dropIn(id);
  if(id==='lamp'){ fireBtn.disabled=false; }
  renderProg();
  // 거름 장치 4종 완성 → 1차 예측 + 흙탕물 따르기 안내
  if(!predictShown && run.placed.stand && run.placed.funnel && run.placed.paper && run.placed.beaker_r){
    predictShown=true; predictEl.classList.remove('hide');
  }
  updateState();
}

/* 예측 버튼 */
predictEl.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{ prediction=b.dataset.pick; predictEl.classList.add('hide');
    toast('좋아요! 이제 <b>왼쪽 흙탕물 비커</b>를 탭해서 깔때기에 부어 봐요.', false, 4200); });
});
predict2El.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{ prediction2=b.dataset.pick2; predict2El.classList.add('hide');
    toast('이제 <b>받는 비커</b>를 탭해 증발접시에 붓고, 램프로 가열해요.', false, 4600); });
});

/* 버튼 */
function setFire(on){
  if(!run.placed.lamp) return;
  lit=on; flameOuter.visible=flameInner.visible=on;
  fireBtn.textContent=on?'🧯 불 끄기':'🔥 불 켜기';
  fireBtn.classList.toggle('off',!on);
}
fireBtn.addEventListener('click',()=>setFire(!lit));

function resetAll(){
  sim=createFilterSim(); run=createMissionRun(MISSION_FILTER);
  freeMode=false; lit=false; predictShown=false; prediction=null; predict2Shown=false; prediction2=null;
  successAt=0; succeeded=false; spotIdx=0;
  tilt1=0; tilt2=0; phase1='idle'; phase2='idle';
  mixBeaker.rotation.z=0; recvBeaker.rotation.z=0;
  Object.keys(EQ_OBJ).forEach(id=>{ if(id!=='lamp'){ EQ_OBJ[id].visible=false; } });
  EQ_OBJ.lamp.visible=false; EQ_OBJ.lamp.position.copy(LAMP_HOME);
  flameOuter.visible=flameInner.visible=false; flameLight.intensity=0;
  fireBtn.disabled=true; fireBtn.textContent='🔥 불 켜기'; fireBtn.classList.add('off');
  modeBtn.textContent='🧪 자유 실험';
  mixLiquid.layout(1.0); mixSand.update(1.0,1); recvLiquid.layout(0); dishLiquid.layout(0);
  filterSand.reset(); dishSalt.reset();
  document.querySelectorAll('.eq').forEach(e=>e.classList.remove('placed'));
  predictEl.classList.add('hide'); predict2El.classList.add('hide'); successEl.classList.add('hide');
  drops.length=0; renderProg(); updateState();
}
resetBtn.addEventListener('click', resetAll);
modeBtn.addEventListener('click',()=>{
  freeMode=!freeMode;
  modeBtn.textContent=freeMode?'🎯 미션으로':'🧪 자유 실험';
  toast(freeMode?'자유 실험 — 아무 기구나 놓아 볼 수 있어요':'미션 모드로 돌아왔어요');
});
$('sucFree').addEventListener('click',()=>{ successEl.classList.add('hide'); freeMode=true; modeBtn.textContent='🎯 미션으로'; });
$('sucAgain').addEventListener('click', resetAll);

function updateState(){
  let s='';
  const ph=sim.state.phase;
  if(succeeded) s='🏅 미션 성공 — 천일염이 이렇게 만들어져요!';
  else if(ph==='salt') s='✨ 하얀 소금이 나타났어요!';
  else if(ph==='evaporating') s='💨 물이 날아가는 중… 접시를 봐요';
  else if(ph==='dishing'||ph==='dishing_done') s='접시에 물을 담았어요 — 램프로 가열해요';
  else if(ph==='filtered') s='맑은 물이 모였어요 — 소금은 어디 갔을까요?';
  else if(ph==='filtering') s='💧 모래는 걸리고, 물만 빠져나가요';
  else if(run.placed.beaker_r) s='왼쪽 흙탕물 비커를 탭해 부어 봐요';
  else if(run.placed.stand) s='스탠드에 깔때기·거름종이·받는 비커를 마저 걸어요';
  else s='스탠드부터 세워요 — 거름 장치의 기둥이에요';
  stateEl.textContent=s;
}

/* ═════════ 물줄기 3안 (SPEC 기법 B-2 · ?stream 전환) ═════════ */
const STREAM = (new URLSearchParams(location.search).get('stream')) || 'tube';
const streamMat_tube = (()=>{ const m=waterMat(0x9FD4F2); m.attenuationDistance=0.03; return m; })();
const streamMat_tube_brown = (()=>{ const m=waterMat(0x8a6f4d); m.attenuationDistance=0.03; return m; })();
const streamMat_glassy = new THREE.MeshPhysicalMaterial({
  color:0xBFE3F5, metalness:0, roughness:0.08, transparent:true, opacity:0.55, envMapIntensity:1.4, depthWrite:false });
const streamMat_glassy_brown = new THREE.MeshPhysicalMaterial({
  color:0xC8A87C, metalness:0, roughness:0.12, transparent:true, opacity:0.6, envMapIntensity:1.2, depthWrite:false });
const dropMatClear = waterMat(0xBFE3F5), dropMatBrown = waterMat(0x8a6f4d);

// 스트림 메쉬(튜브/글래시) — 구간별 1개씩 재사용
function makeStreamMesh(brown){
  if(STREAM==='drops') return null;
  const mat = STREAM==='tube' ? (brown?streamMat_tube_brown:streamMat_tube)
                              : (brown?streamMat_glassy_brown:streamMat_glassy);
  const m=new THREE.Mesh(new THREE.BufferGeometry(), mat);
  m.renderOrder=3; m.visible=false; m.frustumCulled=false; scene.add(m); return m;
}
const streamMesh1=makeStreamMesh(true), streamMesh2=makeStreamMesh(false);
// 방울 사슬(drops 티어)
const CHAIN_N=14;
function makeChain(brown){
  if(STREAM!=='drops') return [];
  const geo=new THREE.SphereGeometry(0.005,10,8), arr=[];
  for(let i=0;i<CHAIN_N;i++){ const d=new THREE.Mesh(geo, brown?dropMatBrown:dropMatClear);
    d.renderOrder=3; d.visible=false; d.frustumCulled=false; scene.add(d); arr.push(d); }
  return arr;
}
const chain1=makeChain(true), chain2=makeChain(false);

// 따르기 트윈 상태 (구간별)
let tilt1=0, tilt2=0, phase1='idle', phase2='idle';
const TILT_MAX=-0.9, TILT_SPEED=1.2;
const lip=new THREE.Vector3(), hitV=new THREE.Vector3(), ctrl=new THREE.Vector3();

function funnelMouthWorld(v){   // 깔때기 콘 상단 중심
  EQ_OBJ.funnel.updateMatrixWorld(true);
  v.set(0.02, STAND_RING_Y-0.01+0.06, 0);   // funnel 로컬 콘 위쪽
  RIG.localToWorld(v); return v;
}
function renderStream(cv, mesh, chain, brown, rateRatio, t){
  const radius=0.0015+0.0027*rateRatio;
  if(mesh){
    if(cv){ mesh.geometry.dispose(); mesh.geometry=new THREE.TubeGeometry(cv,24,radius,8,false); mesh.visible=true; }
    else mesh.visible=false;
  }
  if(chain.length){
    if(cv){ const sc=0.7+0.5*rateRatio;
      for(let i=0;i<CHAIN_N;i++){ const u=(t*1.6+i/CHAIN_N)%1; cv.getPoint(u, chain[i].position); chain[i].scale.setScalar(sc); chain[i].visible=true; }
    } else chain.forEach(d=>d.visible=false);
  }
}

/* ═════════ 조작 (램프 드래그 + 비커 탭 따르기) ═════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0), -BENCH_Y);
const hitPt=new THREE.Vector3();
let dragging=false, downPos=null, moved=false;
function toNDC(e){ ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1; }

renderer.domElement.addEventListener('pointerdown', e=>{
  downPos={x:e.clientX,y:e.clientY}; moved=false;
  if(LAMP.visible){
    toNDC(e); ray.setFromCamera(ndc,camera);
    if(ray.intersectObject(dragProxy,false).length){
      dragging=true; controls.enabled=false; renderer.domElement.setPointerCapture(e.pointerId);
    }
  }
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(dragging){
    if(downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6) moved=true;
    toNDC(e); ray.setFromCamera(ndc,camera);
    if(ray.ray.intersectPlane(dragPlane,hitPt)){
      LAMP.position.x=THREE.MathUtils.clamp(hitPt.x,-1.35,1.35);
      LAMP.position.z=THREE.MathUtils.clamp(hitPt.z,-0.6,0.6);
    }
    return;
  }
  if(downPos) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  let hot=false;
  if(LAMP.visible && ray.intersectObject(dragProxy,false).length) hot=true;
  if(ray.intersectObject(mixBeaker,true).length && canPourMix()) hot=true;
  if(run.placed.beaker_r && ray.intersectObject(recvBeaker,true).length && canPourRecv()) hot=true;
  renderer.domElement.style.cursor=hot?'pointer':'';
});
function endPointer(e){
  const wasDrag=dragging;
  if(dragging){ dragging=false; controls.enabled=true; if(!moved) setFire(!lit); downPos=null; return; }
  const mv = downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6;
  downPos=null;
  if(mv) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  // 흙탕물 비커 탭 → 구간1 따르기 토글
  if(canPourMix() && ray.intersectObject(mixBeaker,true).length){ togglePour1(); return; }
  // 받는 비커 탭 → 구간2 따르기 토글
  if(run.placed.beaker_r && canPourRecv() && ray.intersectObject(recvBeaker,true).length){ togglePour2(); return; }
}
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', ()=>{ if(dragging){dragging=false;controls.enabled=true;} downPos=null; });

function canPourMix(){ return run.placed.beaker_r && (sim.state.phase==='mix'||sim.state.phase==='filtering') && sim.state.mixVol>0.021; }
function canPourRecv(){ return (sim.state.phase==='filtered'||sim.state.phase==='dishing') && run.placed.dish && sim.state.filteredVol>0.021; }
function togglePour1(){ phase1 = (phase1==='pouring')?'returning':'pouring'; }
function togglePour2(){ phase2 = (phase2==='pouring')?'returning':'pouring'; }

/* ═════════ 품질 자동 ═════════ */
let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++; if(qualityChecked) return;
  if(now-fpsStart>4000){ qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){ renderer.setPixelRatio(1); sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } sun.shadow.radius=3; }
  }
}

function lampDishDist(){
  EQ_OBJ.dish.getWorldPosition(hitPt);   // 접시 월드 위치
  const dx=LAMP.position.x-hitPt.x, dz=LAMP.position.z-hitPt.z;
  return Math.hypot(dx,dz);
}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  // ── 구간1: 흙탕물 → 깔때기 ──
  if(phase1==='pouring'||phase1==='returning'){
    const tgt = phase1==='pouring'? TILT_MAX:0;
    tilt1 += (tilt1>tgt?-1:1)*TILT_SPEED*dt;
    if((tilt1<=tgt&&phase1==='pouring')||(tilt1>=tgt&&phase1==='returning')) tilt1=tgt;
    mixBeaker.rotation.z=tilt1;
    if(phase1==='returning'&&tilt1>=-1e-4){ phase1='idle'; tilt1=0; mixBeaker.rotation.z=0; }
  }
  sim.pourToFunnel(dt, tilt1);
  mixLiquid.layout(sim.state.mixVol);
  filterSand.update(Math.min(sim.state.sandLeft/(0.98*sim.SAND_RATIO),1), dt);   // 잔류 모래 성장
  // 거름종이 젖음
  if(sim.state.filteredVol>0.05){ paperMat.color.lerp(new THREE.Color(0xEDE7DC), Math.min(dt*1.2,1)); }

  // 구간1 물줄기 렌더
  let cv1=null, rr1=0;
  if(sim.state.pouring && (sim.state.phase==='filtering'||sim.state.phase==='mix')){
    mixBeaker.updateMatrixWorld(true);
    lip.copy(LIP_LOCAL); mixBeaker.localToWorld(lip);
    funnelMouthWorld(hitV);
    ctrl.copy(lip).lerp(hitV,0.5); ctrl.y-=0.015; ctrl.x+=Math.sin(t*7)*0.002;
    cv1=new THREE.QuadraticBezierCurve3(lip.clone(), ctrl.clone(), hitV.clone());
    rr1=sim.state.rate/sim.POUR_RATE;
  }
  renderStream(cv1, streamMesh1, chain1, true, rr1, t);

  // 구간1 종료 & filtered 진입 → 2차 예측
  if(sim.state.phase==='filtered' && !predict2Shown){
    predict2Shown=true;
    if(GRADE!=='low') predict2El.classList.remove('hide');
    if(phase1!=='idle'){ phase1='returning'; }
  }

  // ── 구간2: 받는 비커 → 증발접시 ──
  if(phase2==='pouring'||phase2==='returning'){
    const tgt = phase2==='pouring'? TILT_MAX:0;
    tilt2 += (tilt2>tgt?-1:1)*TILT_SPEED*dt;
    if((tilt2<=tgt&&phase2==='pouring')||(tilt2>=tgt&&phase2==='returning')) tilt2=tgt;
    recvBeaker.rotation.z=tilt2;
    if(phase2==='returning'&&tilt2>=-1e-4){ phase2='idle'; tilt2=0; recvBeaker.rotation.z=0; }
  }
  if(sim.state.phase==='filtered'||sim.state.phase==='dishing'||sim.state.phase==='dishing_done'){
    sim.pourToDish(dt, tilt2);
  }
  recvLiquid.layout(sim.state.filteredVol);
  const dTop=dishLiquid.layout(sim.state.dishVol);

  let cv2=null, rr2=0;
  if(sim.state.pouring && (sim.state.phase==='dishing'||sim.state.phase==='filtered')){
    recvBeaker.updateMatrixWorld(true);
    lip.copy(LIP_LOCAL); recvBeaker.localToWorld(lip);
    EQ_OBJ.dish.updateMatrixWorld(true);
    hitV.set(0, dTop, 0); EQ_OBJ.dish.localToWorld(hitV);
    ctrl.copy(lip).lerp(hitV,0.5); ctrl.y-=0.015; ctrl.x+=Math.sin(t*7)*0.002;
    cv2=new THREE.QuadraticBezierCurve3(lip.clone(), ctrl.clone(), hitV.clone());
    rr2=sim.state.rate/sim.POUR_RATE;
    dishLiquid.ripple(t, 0.0016+0.003*rr2);
  }
  renderStream(cv2, streamMesh2, chain2, false, rr2, t);

  // ── 증발 (접시에 물 + 램프 가열) ──
  if(sim.state.phase==='dishing_done'||sim.state.phase==='evaporating'){
    sim.step(dt, { lit, dist:lampDishDist() });
  }
  dishSalt.update(sim.state.saltOut, dt);   // 소금 결정 성장

  // 램프 불꽃
  if(lit){
    const f=1+0.10*Math.sin(t*23)+0.06*Math.sin(t*57+1.7);
    flameOuter.scale.set(0.058*f, 0.115*f*(1+0.05*Math.sin(t*31)), 1);
    flameInner.scale.set(0.034*f, 0.06*f, 1);
    flameLight.intensity=2.3+0.6*Math.sin(t*19)*Math.sin(t*7);
  } else flameLight.intensity=0;

  // 성공 판정 (salt 2초)
  if(sim.state.phase==='salt'){
    if(!successAt) successAt=t;
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='알갱이가 큰 <b>모래는 거름종이</b>에서 걸리고, <b>녹은 소금</b>은 물과 함께 통과해요. 그 물을 끓여 날리면 소금만 남죠 — <b>천일염</b>이 이렇게 만들어져요!';
      if(prediction) msg=(prediction==='salt'?'🎯 <b>1차 예측 적중!</b> ':'🤔 1차 예측과 달랐죠? ')+msg;
      if(prediction2) msg+=(prediction2==='in'?'<br>🎯 <b>맑은 물에도 소금이 있었죠!</b>':'<br>맑아도 소금은 녹아 있었어요 — <b>안 보임 ≠ 없음</b>!');
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' : `<br>기구 다시 생각한 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      if(!freeMode) successEl.classList.remove('hide');
    }
  } else successAt=0;

  updateState();
  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').classList.add('hide');
toast('🎯 미션: 선반에서 <b>거름 장치</b>부터 골라 세워 봐요!', false, 5200);
updateState();
animate();
</script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이랩 과학실 — 대류(잉크 소용돌이) 미션</title>
<!--
  케이랩 과학실(SciLab) v0.2 — 데모 1호(scilab_proto) 검수 통과 렌더 표준 위에
  "과학실 본체" 구조를 얹은 첫 판:
    · 기구 트레이(선반): 필요한 기구를 직접 골라 꺼냄 — 고르기 자체가 학습·평가
    · 스냅 배치 + 절차 규칙: 삼발이 → 그물 → 비커 → 온도계 (순서 어기면 교육 피드백)
    · 미션 시스템: 미션 = 데이터(MISSION 객체). 오답 기구 = 즉시 피드백(왜 아닌지)
    · 온도계: 설치해야 온도가 보임 (측정 도구의 의미)
    · 자유 실험 모드: 제한 없이 꺼내 놓기
  렌더 표준(데모 1호 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft ·
    유리=블렌딩 / 액체=transmission 굴절(attenuation 깊이색) · GPU 김 · CPU 기포 · 품질 자동
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5B9BF0; --orange:#FF8A3D; --green:#12B886; --purple:#9B7BF5;
    --ink:#1d2733; --hud:rgba(20,25,32,.74); --hudline:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:10px 16px;pointer-events:none;z-index:20}
  #topbar .title{color:#fff;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  #topbar .badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}

  /* 온도 패널 */
  #panel{position:fixed;top:50px;left:14px;z-index:20;background:var(--hud);
    backdrop-filter:blur(8px);border:1px solid var(--hudline);border-radius:16px;
    padding:13px 17px;color:#fff;min-width:166px}
  #temp{font-size:32px;line-height:1.05}
  #temp small{font-size:15px;color:#9fb3c8}
  #temp.na{font-size:14px;color:#9fb3c8;line-height:1.5;padding:4px 0}
  #stateline{font-size:12.5px;margin-top:6px;color:#ffd9a3;min-height:17px}
  .volwrap{margin-top:9px}
  .volwrap .lab{font-size:11px;color:#9fb3c8;margin-bottom:4px}
  .volbar{width:136px;height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .volbar i{display:block;height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#4FC3F7,#81D4FA);transition:width .3s}

  /* 미션 패널 */
  #mission{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:21;
    background:var(--hud);backdrop-filter:blur(8px);border:1px solid var(--hudline);
    border-radius:16px;padding:11px 16px;color:#fff;max-width:min(420px,92vw);text-align:center}
  #mission .mt{font-size:14.5px;color:#ffe3b8}
  #mission .mp{font-size:12.5px;color:#c6d6e5;margin-top:4px;line-height:1.5}
  #mission .prog{margin-top:7px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  #mission .chip{font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid var(--hudline);color:#9fb3c8}
  #mission .chip.on{background:rgba(18,184,134,.22);border-color:#12B886;color:#7CF0C9}

  /* 버튼 */
  #ctrls{position:fixed;top:50px;right:14px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .btn{font-family:'Gowun Dodum';font-size:14px;border:none;border-radius:13px;padding:10px 15px;
    cursor:pointer;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s}
  .btn:active{transform:scale(.95)}
  #fireBtn{background:linear-gradient(135deg,#FF8A3D,#F4511E)}
  #fireBtn.off{background:linear-gradient(135deg,#455A64,#37474F)}
  #fireBtn:disabled{opacity:.35;cursor:default}
  #modeBtn{background:rgba(155,123,245,.25);border:1px solid rgba(155,123,245,.5)}
  #resetBtn{background:rgba(255,255,255,.14);border:1px solid var(--hudline);font-size:12.5px}

  /* 기구 트레이 */
  #tray{position:fixed;bottom:0;left:0;right:0;z-index:22;padding:10px 12px 12px;
    display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(transparent, rgba(10,13,17,.85) 40%)}
  #tray::-webkit-scrollbar{display:none}
  .eq{flex:0 0 auto;width:86px;background:rgba(255,255,255,.06);border:1px solid var(--hudline);
    border-radius:15px;padding:9px 6px 8px;text-align:center;color:#dbe7f2;cursor:pointer;
    backdrop-filter:blur(6px);transition:transform .13s,border-color .2s;user-select:none}
  .eq:active{transform:scale(.93)}
  .eq .ic{font-size:26px;line-height:1.15}
  .eq .nm{font-size:11.5px;margin-top:4px;line-height:1.25}
  .eq.placed{opacity:.42}
  .eq.placed .nm::after{content:' ✓';color:#7CF0C9}
  .eq.shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 예측 카드 · 성공 패널 */
  .card{position:fixed;left:50%;transform:translateX(-50%);z-index:26;
    background:rgba(255,255,255,.97);border-radius:18px;padding:16px 18px;max-width:350px;width:92vw;
    box-shadow:0 12px 40px rgba(0,0,0,.5);color:var(--ink);transition:opacity .3s,transform .3s}
  .card.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
  #predict{bottom:120px}
  #predict h3{font-size:14.5px;margin-bottom:10px;color:#1565C0}
  #predict .opts{display:flex;flex-direction:column;gap:8px}
  #predict button,#success button{font-family:'Gowun Dodum';font-size:14px;border:2px solid #dbe4ee;
    background:#fff;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink)}
  #predict button:hover{border-color:#1565C0;background:#f0f7ff}
  #success{bottom:50%;transform:translate(-50%,50%);text-align:center}
  #success.hide{transform:translate(-50%,50%) translateY(12px)}
  #success .big{font-size:38px}
  #success h3{font-size:18px;color:#0d7a5c;margin:6px 0 4px}
  #success p{font-size:13px;line-height:1.65;color:#41546a}
  #success .row{display:flex;gap:8px;margin-top:13px}
  #success button{flex:1}
  #success button.pri{background:#12B886;border-color:#12B886;color:#fff}

  #toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(255,255,255,.97);color:var(--ink);font-size:13.5px;padding:11px 17px;
    border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:88vw;text-align:center;
    line-height:1.55;transition:opacity .35s;border-left:5px solid var(--green)}
  #toast.warn{border-left-color:var(--orange)}
  #toast.hide{opacity:0;pointer-events:none}

  #loading{position:fixed;inset:0;z-index:50;background:#171b21;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cfe3f5;
    transition:opacity .5s}
  #loading .flask{font-size:44px;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #loading.hide{opacity:0;pointer-events:none}

  @media (max-width:560px){
    #panel{top:auto;bottom:118px;padding:9px 12px;min-width:0}
    #temp{font-size:24px}
    #mission{max-width:86vw;padding:9px 12px}
    #mission .mp{display:none}
    .eq{width:76px} .eq .ic{font-size:23px}
  }
</style>
</head>

<div id="stage"></div>

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 열·증발 시뮬 (데모 1호 검증본 + ready 게이트) ── */
  function createConvectionSim(){
    // 대류: 아래 가열점에서 데워진 물이 상승·순환 → 잉크 소용돌이. flow=순환 강도(0~1).
    var S = { flow:0, heatK:0, allDone:false };
    // SPEC_E7 A-8 갭 보충(방법론 §1-④ 역반영): HEAT_R 승계 · CONV_RATE·DECAY 확정.
    var HEAT_R=0.24, CONV_RATE=0.14, DECAY=0.09;   // k=1: flow 0→0.9 ≈6.4s / 정지 시 0.9→0 ≈10s
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      var k=0;
      if(inp.lit && inp.ready){
        k = 1 - inp.dist/HEAT_R;
        if(k<0)k=0; if(k>1)k=1;
      }
      S.heatK=k;
      if(k>0) S.flow = Math.min(1, S.flow + CONV_RATE*k*dt);   // 가열 → 순환 강화
      else    S.flow = Math.max(0, S.flow - DECAY*dt);          // 불 끄면 → 서서히 잦아듦(감쇠)
      S.allDone = S.flow>=0.9;                                  // 순환 관찰(2초 지속 게이트는 App)
      return S;
    }
    return { state:S, step:step, HEAT_R:HEAT_R };
  }

  /* ── 미션 정의 (미션 = 데이터. 다음 미션은 이 형식의 객체만 추가) ── */
  var MISSION_CONVECTION = {
    id:'heat_convection',
    title:'열의 이동 — 물속 잉크는 어디로?',
    required:['tripod','gauze','beaker_conv','lamp'],
    // 절차 규칙: 이 기구를 놓으려면 먼저 있어야 하는 것
    needs:{
      gauze:       { pre:['tripod'], msg:'그물은 삼발이 위에 올려요 — <b>삼발이가 먼저</b> 필요해요!' },
      beaker_conv: { pre:['tripod','gauze'], msg:'잉크 물 비커를 안전하게 받치려면 <b>삼발이와 그물이 먼저</b>!' }
    },
    // 오답 기구: 왜 아닌지가 곧 학습 (대류는 관측=잉크 순환 → 온도계도 불필요)
    wrong:{
      magnet:'🧲 자석은 철을 끌어당기는 도구 — 물이 도는 걸 보는 실험엔 필요 없어요.',
      magnifier:'🔍 돋보기는 작은 걸 크게 볼 때! 잉크가 도는 건 맨눈으로도 잘 보여요.',
      thermo:'🌡️ 온도계는 온도를 잴 때 — 오늘은 <b>잉크가 도는 길</b>을 눈으로 봐요!',
      rod:'🥢 유리막대로 저으면 억지로 섞여요 — 젓지 말고 <b>가열만</b> 해서 스스로 도는 걸 봐요!'
    }
  };

  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      // 위에 얹힌 것부터 함께 회수 (의존 역순)
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  /* ── 잉크 확산 스테이지 (SPEC_E7 v2 §3-1) — flow → 뭉침→상승→확산→균일 가중치.
        셰이더는 이 가중치를 uniform으로 받기만 함(계산 없음) → 시각 인과가 여기서 테스트됨 ── */
  function smoothstepJS(a,b,x){
    var t=Math.min(1,Math.max(0,(x-a)/(b-a)));
    return t*t*(3-2*t);
  }
  function inkStageWeights(flow){
    var f=(typeof flow==='number' && isFinite(flow)) ? Math.min(1,Math.max(0,flow)) : 0;
    return {
      puddle:  1 - smoothstepJS(0.10,0.45,f),    // ① 바닥 뭉침 1→0
      plumeH:  smoothstepJS(0.05,0.50,f),        // ② 상승 도달 높이 0→1
      spread:  smoothstepJS(0.35,0.75,f),        // ③ 상단 퍼짐+벽면 하강
      uniform: smoothstepJS(0.70,1.00,f)*0.55    // ④ 균일 틴트(상한 0.55="옅게 섞임")
    };
  }

  var API = { createConvectionSim:createConvectionSim, MISSION_CONVECTION:MISSION_CONVECTION, createMissionRun:createMissionRun, inkStageWeights:inkStageWeights };
  if(typeof window!=='undefined'){ window.SciLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════ 렌더 기반 (데모 1호 확정 표준) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
// ⚠️ WebGL 컨텍스트 유실 가드(강건성표준 R4, 2026-07-08 페이블): 전자칠판·태블릿 장시간 사용 후 검은 화면 방지
renderer.domElement.addEventListener('webglcontextlost',function(e){ e.preventDefault();
  if(document.getElementById('ctxlost'))return;
  var o=document.createElement('div'); o.id='ctxlost';
  o.style.cssText='position:fixed;inset:0;background:rgba(10,12,16,.93);color:#e8ecf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';
  var t=document.createElement('div'); t.textContent='화면이 잠시 멈췄어요'; t.style.cssText='font-size:20px;font-weight:700';
  var b=document.createElement('button'); b.textContent='다시 열기';
  b.style.cssText='padding:10px 26px;border-radius:12px;border:0;background:#5B9BF0;color:#fff;font-size:16px;cursor:pointer';
  b.addEventListener('click',function(){ location.reload(); });
  o.appendChild(t); o.appendChild(b); document.body.appendChild(o);
});


const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2b3340'); gr.addColorStop(.55,'#1b2129'); gr.addColorStop(1,'#12161c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}
scene.fog = new THREE.Fog(0x161b22, 4.2, 9.5);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 30);
camera.position.set(0.95, 0.9, 1.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.32, -0.02);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=0.65; controls.maxDistance=3.4;
controls.maxPolarAngle=1.46; controls.enablePan=false;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(1.8,3.4,1.6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-1.8; sun.shadow.camera.right=1.8;
sun.shadow.camera.top=2.2; sun.shadow.camera.bottom=-0.6;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=9;
sun.shadow.bias=-0.0004; sun.shadow.radius=5;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x2b241c, 0.35));

/* 재질 — 유리=블렌딩, 액체=굴절(데모 1호 확정) */
const GLASS = new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.03,
  transparent:true, opacity:0.18, depthWrite:false,
  clearcoat:1, clearcoatRoughness:0.06, side:THREE.DoubleSide, envMapIntensity:1.6
});
const METAL = new THREE.MeshStandardMaterial({ color:0xb8bec6, metalness:0.92, roughness:0.32, envMapIntensity:1.1 });
const DARKMETAL = new THREE.MeshStandardMaterial({ color:0x555b63, metalness:0.85, roughness:0.45 });
const WOOD = new THREE.MeshStandardMaterial({ color:0xC49A6C, roughness:0.8 });
function waterMat(hex){
  return new THREE.MeshPhysicalMaterial({

  const sTex=new THREE.CanvasTexture(c); sTex.colorSpace=THREE.SRGBColorSpace;
  const sc=new THREE.Mesh(new THREE.CylinderGeometry(BK_R+0.0015,BK_R+0.0015,BK_H-0.03,48,1,true),

  waterGeo=new THREE.CylinderGeometry(BK_R-0.012, BK_R-0.014, WATER_H0, 48, 1, false);
  waterBase=waterGeo.attributes.position.array.slice();
  // SPEC_E7 v2 §1-4·§4: transmission 물 금지 — 굴절 패스가 내부 '투명' 잉크를 통째로 소거함.
  // 관측 대상이 물 '안'이면 순수 투명(opacity) 물. 색도 거의 무색(#dff3ff) — 잉크 대비 확보.

  /* ── 잉크 플룸 — 십자 평면 ×2 + 농도장 셰이더 (SPEC_E7 v2 §3-2)
        파티클 폐기: 확산은 위치가 아니라 '농도'의 변화 → fbm 셰이더로 실처럼 피어오르는 연속체.
        십자 배치라 궤도 카메라 전 각도에서 최소 1장 정면 노출(빌보드 불필요). ── */
  steamUni={ uTime:{value:0}, uPuddle:{value:1}, uPlumeH:{value:0}, uSpread:{value:0},
             uUniform:{value:0}, uInkColor:{value:INK_E7.clone()}, uScale:{value:innerHeight*0.5} };
  const plumeMat=new THREE.ShaderMaterial({
    uniforms:steamUni, transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:`
      varying vec2 vUv;
      void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform float uTime,uPuddle,uPlumeH,uSpread,uUniform;
      uniform vec3 uInkColor; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                   mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
      float fbm(vec2 p){ float v=0.0,a=0.5;
        for(int i=0;i<3;i++){ v+=a*noise(p); p*=2.1; a*=0.5; } return v; }
      void main(){
        vec2 uv=vUv; float cx=abs(uv.x-0.5)*2.0; float t=uTime;
        float wob=fbm(vec2(uv.x*6.0, uv.y*3.0 - t*0.45));
        float threads=fbm(vec2(uv.x*14.0 + wob*2.0, uv.y*5.0 - t*0.7));
        // ① 바닥 뭉침
        float puddle=uPuddle*smoothstep(0.16,0.0,uv.y)*smoothstep(0.55,0.1,cx);
        // ② 상승 플룸: 중심 기둥 + 부드러운 머리 + 실 가닥 텍스처
        float head=smoothstep(uPlumeH+0.06, uPlumeH-0.18, uv.y);
        float column=smoothstep(0.30+wob*0.18, 0.02, cx);
        float plume=column*head*step(0.001,uPlumeH);
        plume*=0.55+0.45*smoothstep(0.35,0.75,threads);
        // ③ 상단 퍼짐 + 벽면 하강(순환)
        float top=uSpread*smoothstep(0.55,0.92,uv.y)*(0.5+0.5*wob);
        float wall=uSpread*smoothstep(0.62,0.95,cx)*smoothstep(0.95,0.25,uv.y)*0.6;
        // ④ 균일화: 구조가 옅은 균일 틴트로 수렴 (섞임 완료)
        float C=clamp(puddle+plume+top+wall,0.0,1.0);
        C=max(C*(1.0-uUniform*0.8), uUniform);
        // 평면 테두리 페이드 — "평면 티" 제거
        float edge=smoothstep(0.0,0.06,uv.y)*smoothstep(1.0,0.94,uv.y)*smoothstep(1.0,0.9,cx);
        gl_FragColor=vec4(uInkColor, C*0.9*edge);
      }`
  });
  const plumeGeo=new THREE.PlaneGeometry((BK_R-0.012)*1.88, WATER_H0*0.985);
  steam=new THREE.Group();
  [0, Math.PI/2].forEach(ry=>{
    const p=new THREE.Mesh(plumeGeo, plumeMat);

}

[['magnet',makeMagnet],['magnifier',makeMagnifier],['tube',makeTubes],['rod',makeRod]]
.forEach(([id,fn])=>{
  const gp=fn();
  gp.position.set(0, BENCH_Y, 0); gp.visible=false;
  gp.userData.baseY=BENCH_Y; gp.userData.free=true;
  scene.add(gp); EQ_OBJ[id]=gp;
});

{

/* ═════════ 기구 사전 · 트레이 UI ═════════ */
const EQUIP=[
  {id:'tripod',    ic:'🔺', nm:'삼발이'},
  {id:'gauze',     ic:'🕸️', nm:'그물'},
  {id:'beaker_conv',ic:'🔵', nm:'잉크 물 비커'},
  {id:'lamp',      ic:'🔥', nm:'알코올램프'},
  {id:'magnet',    ic:'🧲', nm:'막대자석'},
  {id:'magnifier', ic:'🔍', nm:'돋보기'},
  {id:'thermo',    ic:'🌡️', nm:'온도계'},
  {id:'rod',       ic:'🥢', nm:'유리막대'}
];
// 카드 순서는 매번 섞어서 정답 위치 고정 방지
for(let i=EQUIP.length-1;i>0;i--){
  const j=Math.random()*(i+1)|0; [EQUIP[i],EQUIP[j]]=[EQUIP[j],EQUIP[i]];
}

const trayEl=document.getElementById('tray');
EQUIP.forEach(e=>{
  const d=document.createElement('div');
  d.className='eq'; d.id='eq_'+e.id;
  d.innerHTML=`<div class="ic">${e.ic}</div><div class="nm">${e.nm}</div>`;
  d.addEventListener('click',()=>onPick(e.id,d));
  trayEl.appendChild(d);
});

/* ═════════ 게임 상태 ═════════ */
const { createConvectionSim, MISSION_CONVECTION, createMissionRun, inkStageWeights } = window.SciLab;
let sim = createConvectionSim();
let inkLatch = 0;   // 균일 틴트 래치 — 섞인 잉크는 불을 꺼도 되돌아가지 않음
let run = createMissionRun(MISSION_CONVECTION);
let freeMode=false, lit=false, predictShown=false, prediction=null;
let successAt=0, succeeded=false;
const drops=[];   // 등장 연출 목록

const $=id=>document.getElementById(id);
const stateEl=$('stateline');
const fireBtn=$('fireBtn'), resetBtn=$('resetBtn'), modeBtn=$('modeBtn');
const toastEl=$('toast'), missionEl=$('mission'), progEl=$('prog');
const predictEl=$('predict'), successEl=$('success');

let toastTimer=null;
function toast(msg, warn, ms){
  toastEl.innerHTML=msg;
  toastEl.classList.toggle('warn', !!warn);
  toastEl.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.add('hide'), ms||3400);
}

function renderProg(){
  const n=run.count(), total=MISSION_CONVECTION.required.length;
  let html=`<span class="chip ${n?'on':''}">준비물 ${n} / ${total}</span>`;
  MISSION_CONVECTION.required.forEach(id=>{
    if(run.placed[id]){
      const e=EQUIP.find(x=>x.id===id);
      html+=`<span class="chip on">${e.ic} ${e.nm}</span>`;
    }
  });
  progEl.innerHTML=html;
}
renderProg();

function dropIn(id){
  const o=EQ_OBJ[id];
  o.visible=true;
  o.position.y=o.userData.baseY+0.28;
  drops.push({o, t:0});
}

function onPick(id, cardEl){
  if(succeeded && !freeMode) return;
  if(run.placed[id]){
    // 재탭 = 회수 (의존물 함께)
    run.remove(id);
    Object.keys(EQ_OBJ).forEach(k=>{
      if(!run.placed[k] && k!=='lamp') EQ_OBJ[k].visible=false;
      if(k==='lamp' && !run.placed.lamp){ EQ_OBJ.lamp.visible=false; setFire(false); }
    });
    syncTray(); renderProg(); updateFireBtn();
    return;
  }
  const r=run.pick(id, freeMode);
  if(r.act==='wrong'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, 4200);
    return;
  }
  if(r.act==='blocked'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, 3800);
    return;
  }
  if(r.act==='placed'){
    const o=EQ_OBJ[id];
    if(o.userData.free){ const [x,z]=nextSpot(); o.position.x=x; o.position.z=z; }
    if(id==='lamp'){ LAMP.position.copy(LAMP_HOME); }
    dropIn(id);
    syncTray(); renderProg(); updateFireBtn();
    if(r.ready && !freeMode && !predictShown){
      predictShown=true;
      setTimeout(()=>{ predictEl.classList.remove('hide');
        toast('✅ 준비 끝! 예측을 골라 봐요'); }, 500);
    } else if(r.ready && freeMode){
      toast('준비 완료 — 불을 붙여 봐요 🔥');
    }
  }
}
function syncTray(){
  EQUIP.forEach(e=>{
    $('eq_'+e.id).classList.toggle('placed', !!run.placed[e.id]);
  });
}
function updateFireBtn(){
  fireBtn.disabled = !run.placed.lamp;
}

predictEl.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    prediction=b.dataset.pick;
    predictEl.classList.add('hide');
    toast('좋아요! 이제 불을 붙이고, 램프를 비커 아래로 🔬');
  });
});

function setFire(on){
  if(on && !run.placed.lamp) return;
  lit=on;
  flameOuter.visible=flameInner.visible=on;
  fireBtn.textContent=on?'🧯 불 끄기':'🔥 불 켜기';
  fireBtn.classList.toggle('off',!on);
}
fireBtn.addEventListener('click',()=>setFire(!lit));

modeBtn.addEventListener('click',()=>{
  freeMode=!freeMode;
  modeBtn.textContent=freeMode?'🎯 미션 모드':'🧪 자유 실험';
  missionEl.style.display=freeMode?'none':'';
  document.querySelector('#topbar .badge').textContent=freeMode?'자유 실험':'미션 · 대류(잉크)';
  toast(freeMode?'자유 실험 — 무엇이든 꺼내 놓아 봐요':'미션 모드 — 필요한 기구만!');
});

function resetAll(keepMode){
  sim=createConvectionSim(); run=createMissionRun(MISSION_CONVECTION);
  Object.keys(EQ_OBJ).forEach(k=>{ EQ_OBJ[k].visible=false; });
  LAMP.position.copy(LAMP_HOME);
  setFire(false); lit=false;
  prediction=null; predictShown=false; succeeded=false; successAt=0;
  spotIdx=0;
  layoutWater(1);
  inkLatch=0;
  if(inkDrop){ inkDrop.position.set(0,0.02,0); inkDrop.scale.set(1,0.55,1); inkDrop.material.opacity=0.95; }
  if(steamUni){
    steamUni.uPuddle.value=1; steamUni.uPlumeH.value=0;
    steamUni.uSpread.value=0; steamUni.uUniform.value=0;
  }
  if(water){ water.material.color.copy(WATER_E7); water.material.opacity=0.07; }
  predictEl.classList.add('hide'); successEl.classList.add('hide');
  syncTray(); renderProg(); updateFireBtn();
  if(!keepMode && freeMode){ modeBtn.click(); }
}
resetBtn.addEventListener('click',()=>resetAll(true));
$('sucAgain').addEventListener('click',()=>resetAll(true));
$('sucFree').addEventListener('click',()=>{
  successEl.classList.add('hide');
  if(!freeMode) modeBtn.click();
});


function lampDist(){
  const dx=LAMP.position.x-RIG.position.x;
  const dz=LAMP.position.z-RIG.position.z;
  return Math.hypot(dx,dz);
}

/* ═════════ 드래그 (램프) ═════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0), -BENCH_Y);
const hitPt=new THREE.Vector3();
let dragging=false, downPos=null, moved=false;
function toNDC(e){
  ndc.x=(e.clientX/innerWidth)*2-1;
  ndc.y=-(e.clientY/innerHeight)*2+1;
}
renderer.domElement.addEventListener('pointerdown', e=>{
  if(!LAMP.visible) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  if(ray.intersectObject(dragProxy,false).length){
    dragging=true; moved=false; downPos={x:e.clientX,y:e.clientY};
    controls.enabled=false;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(!dragging){
    if(!LAMP.visible) return;
    toNDC(e); ray.setFromCamera(ndc,camera);
    renderer.domElement.style.cursor=
      ray.intersectObject(dragProxy,false).length?'grab':'';
    return;
  }
  if(downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6) moved=true;
  toNDC(e); ray.setFromCamera(ndc,camera);
  if(ray.ray.intersectPlane(dragPlane,hitPt)){
    LAMP.position.x=THREE.MathUtils.clamp(hitPt.x,-1.35,1.35);
    LAMP.position.z=THREE.MathUtils.clamp(hitPt.z,-0.6,0.6);
  }
});
function endDrag(){
  if(!dragging) return;
  dragging=false; controls.enabled=true;
  if(!moved) setFire(!lit);
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ═════════ 물 출렁임 ═════════ */
function rippleWater(t,amp){
  const pos=waterGeo.attributes.position, arr=pos.array;
  const topHalf=WATER_H0/2-0.0001;
  for(let i=0;i<arr.length;i+=3){
    if(waterBase[i+1]>=topHalf){
      const x=waterBase[i], z=waterBase[i+2];
      arr[i+1]=waterBase[i+1]+
        amp*Math.sin(t*4.2+x*55+z*47)+
        amp*0.6*Math.sin(t*6.8+x*90-z*60);
    }
  }
  pos.needsUpdate=true;
  waterGeo.computeVertexNormals();
}

/* ═════════ 품질 자동 ═════════ */
let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++;
  if(qualityChecked) return;
  if(now-fpsStart>4000){
    qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){
      renderer.setPixelRatio(1);
      sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
      bubbleMax=Math.floor(B_N/2);
      sun.shadow.radius=3;
    }
  }
}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  const ready = !!(run.placed.tripod && run.placed.gauze && run.placed.beaker_conv);
  const S=sim.step(dt,{lit, dist:lampDist(), ready});

  // ── 상태줄 (대류 · SPEC_E7 A-8) ──
  let st='';
  if(succeeded) st='🏅 미션 성공!';
  else if(S.flow>=0.9) st='🌀 잉크가 위로 올라 돌며 섞여요 — 대류!';
  else if(S.flow>0.3) st='🔵 데워진 물이 위로 오르기 시작해요…';
  else if(S.heatK>0 && lit) st='🔥 비커 바닥이 데워지는 중…';
  else if(lit && !ready) st='램프를 잉크 비커 아래로 옮겨요';
  else if(ready) st='🔵 잉크가 바닥에 가라앉아 있어요 — 불을 붙여 아래를 가열해 봐요!';
  else st='삼발이·그물·잉크 비커를 준비하고 불을 붙여요';
  stateEl.textContent=st;

  // ── 성공 판정 (flow≥0.9 = 순환 관찰 2초 지속) ──
  if(S.allDone){
    if(!successAt) successAt=t;
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='아래에서 데워진 물은 <b>가벼워져 위로 오르고</b>, 위의 찬 물은 내려와요 — 이렇게 물이 <b>스스로 돌며</b> 열을 나르는 게 <b>대류</b>예요. 고체는 제자리서 이웃에 전달(전도), 액체·기체는 직접 돌며 나르죠!';
      if(prediction) msg=(prediction==='rise'?'🎯 <b>예측 적중!</b> ':'🤔 예측과 달랐죠? ')+msg;
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' :
                    `<br>기구 고르기 다시 생각해 본 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      if(!freeMode) successEl.classList.remove('hide');
      else toast('🌀 잉크가 대류로 돌아요!',false,5200);
    }
  } else successAt=0;

  // ── 잉크 확산 (SPEC_E7 v2): 뭉침→상승→확산→균일. 섞인 잉크는 되돌아가지 않음(래치) ──
  if(run.placed.beaker_conv){
    layoutWater(1);                  // 물 가득 (증발 없음)
    rippleWater(t, 0.0016);
    var w=inkStageWeights(S.flow);
    inkLatch=Math.max(inkLatch, w.uniform);            // 불 꺼도 균일 틴트 유지 (과학적 비가역)
    steamUni.uTime.value=t;
    steamUni.uPuddle.value=w.puddle;
    steamUni.uPlumeH.value=w.plumeH;
    steamUni.uSpread.value=w.spread;
    steamUni.uUniform.value=inkLatch;
    // 물 전체 옅은 분홍 틴트 — "다 섞였다"의 최종 표식
    water.material.color.copy(WATER_E7).lerp(INK_E7, inkLatch*0.35);
    water.material.opacity=0.07+inkLatch*0.13;
    // 잉크 방울: 뭉침 가중치 추종 — 플룸이 클수록 방울은 작아짐 (질량 보존의 인상)
    if(inkDrop){
      var pw=0.35+0.65*w.puddle;
      inkDrop.position.y=0.02;
      inkDrop.scale.set(pw, pw*0.55, pw);
      inkDrop.material.opacity=0.95*w.puddle;
    }
  }

  if(lit){
    const f=1+0.10*Math.sin(t*23)+0.06*Math.sin(t*57+1.7);
    flameOuter.scale.set(0.058*f, 0.115*f*(1+0.05*Math.sin(t*31)), 1);
    flameInner.scale.set(0.034*f, 0.06*f, 1);
    flameLight.intensity=2.3+0.6*Math.sin(t*19)*Math.sin(t*7);
  } else flameLight.intensity=0;

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  steamUni.uScale.value=innerHeight*0.5;
});

document.getElementById('loading').classList.add('hide');
toast('🎯 미션: 선반에서 <b>필요한 기구만</b> 골라 실험을 준비해 봐요!', false, 5200);
animate();
</script>

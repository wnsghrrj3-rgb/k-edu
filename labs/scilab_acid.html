<!--
  케이랩 과학실(SciLab) E-6 산·염기 중화 — 황금 샘플(scilab.html 물 끓이기 v0.2) 복사→스왑.
  흡수: v2 acid.js ★와우(중화점 급반전). SPEC_E6.md 기반. 가열 없음(램프=오답 기구로만 출연).
    · 미션: 스탠드 → 삼각플라스크(산+지시약) → 스포이트 → 유리막대
    · 현상: 스포이트 탭 1회 = 염기 한 방울. 8방울까지 새빨강 → 9번째(중화점)에 확 파랑 (급반전)
    · ★와우(중/고): "조금씩 변할까 확 뒤집힐까?" — 선형 오개념 직격, 결정적 한 방울
    · 방울 = 작은 Sphere 낙하 트윈(§3-C 액체 옮기기 우회로 — 물줄기 셰이더 불필요)
  렌더 표준(데모 1호 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft · 유리=블렌딩 · 액체=굴절 · 품질 자동
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5B9BF0; --orange:#FF8A3D; --green:#12B886; --purple:#9B7BF5;
    --ink:#1d2733; --hud:rgba(20,25,32,.74); --hudline:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  #stateline{font-size:13.5px;margin-top:7px;color:#ffe3b8;min-height:18px;line-height:1.45}
  .volwrap{margin-top:9px}

  .volbar{width:136px;height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}

  /* 버튼 */

  .btn{font-family:'Gowun Dodum';font-size:14px;border:none;border-radius:13px;padding:10px 15px;

    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 예측 카드 · 성공 패널 */
  .card{position:fixed;left:50%;transform:translateX(-50%);z-index:26;
    background:rgba(255,255,255,.97);border-radius:18px;padding:16px 18px;max-width:350px;width:92vw;

  .card.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
  #predict{bottom:120px}

  #predict button,#predict2 button,#success button{font-family:'Gowun Dodum';font-size:14px;border:2px solid #dbe4ee;
    background:#fff;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink)}

  #success{bottom:50%;transform:translate(-50%,50%);text-align:center}

  #success .row{display:flex;gap:8px;margin-top:13px}

  #toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:30;

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 중화 시뮬 (SPEC_E6 A-2 — 이벤트 구동: addDrop 호출당 방울 1. 중간 보라 없음 = 급반전) ── */
  function createNeutralSim(){
    var S = { drops:0, flipped:false, col:'#E03131', stirred:false, over:false, phase:'acid' };
    var NEUT_POINT=9;    // v2 acid wowDrops=9 승계 — 9번째 방울 = 중화점
    var MAX_DROPS=14;
    function addDrop(){
      if(S.drops>=MAX_DROPS) return {act:'over'};
      S.drops++;
      if(S.drops < NEUT_POINT){ S.col='#E03131'; S.phase='acid'; return {act:'drop', n:S.drops}; }   // 끝까지 빨강
      if(S.drops === NEUT_POINT){ S.flipped=true; S.col='#1971C2'; S.phase='base'; return {act:'flip'}; }  // ★딱 한 방울에 확
      S.over=(S.drops>NEUT_POINT+2); S.col='#1971C2'; return {act:'more'};
    }
    function stir(){ S.stirred=true; return {act:'stir'}; }   // 젓기 연출 트리거 — 색 판정 무관(절차 습관)
    function step(dt, inp){ if(dt>0.05) dt=0.05; return S; }   // 시간 경과 현상 없음(계약 형태 유지)
    return { state:S, step:step, addDrop:addDrop, stir:stir, NEUT_POINT:NEUT_POINT, MAX_DROPS:MAX_DROPS };
  }

  /* ── 미션 정의 (SPEC_E6 A-1) ── */
  var MISSION_ACID = {
    id:'acid_neutral',
    title:'산과 염기 — 결정적 한 방울',
    required:['stand','flask','dropper','rod'],
    needs:{
      flask:   { pre:['stand'], msg:'플라스크는 스탠드에 고정해요 — <b>스탠드가 먼저</b>!' },
      dropper: { pre:['flask'], msg:'염기를 떨어뜨릴 <b>플라스크(산성 용액)가 먼저</b> 있어야죠!' },
      rod:     { pre:['flask'], msg:'유리막대로 저으려면 <b>저을 용액(플라스크)이 먼저</b>!' }
    },
    wrong:{
      magnet:'🧲 자석은 철을 끌어당기는 도구 — 용액의 성질을 바꾸는 실험에는 필요 없어요.',
      magnifier:'🔍 돋보기는 작은 것을 관찰할 때! 색 변화는 맨눈에 확 보여요.',
      lamp:'🔥 알코올램프는 가열 실험에서! 중화는 <b>섞기만으로</b> 일어나요 — 데우지 않아요.',
      thermo:'🌡️ 온도계는 온도를 잴 때 — 오늘 지켜볼 것은 <b>색</b>이에요!'
    }
  };

  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  var API = { createNeutralSim:createNeutralSim, MISSION_ACID:MISSION_ACID, createMissionRun:createMissionRun };
  if(typeof window!=='undefined'){ window.SciLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════ 렌더 기반 (데모 1호 확정 표준) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2b3340'); gr.addColorStop(.55,'#1b2129'); gr.addColorStop(1,'#12161c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}
scene.fog = new THREE.Fog(0x161b22, 4.2, 9.5);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 30);
camera.position.set(0.95, 0.9, 1.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.32, -0.02);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=0.65; controls.maxDistance=3.4;
controls.maxPolarAngle=1.46; controls.enablePan=false;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(1.8,3.4,1.6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-1.8; sun.shadow.camera.right=1.8;
sun.shadow.camera.top=2.2; sun.shadow.camera.bottom=-0.6;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=9;
sun.shadow.bias=-0.0004; sun.shadow.radius=5;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x2b241c, 0.35));

/* 재질 — 유리=블렌딩, 액체=굴절(데모 1호 확정) */
const GLASS = new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.03,
  transparent:true, opacity:0.18, depthWrite:false,
  clearcoat:1, clearcoatRoughness:0.06, side:THREE.DoubleSide, envMapIntensity:1.6
});
const METAL = new THREE.MeshStandardMaterial({ color:0xb8bec6, metalness:0.92, roughness:0.32, envMapIntensity:1.1 });
const DARKMETAL = new THREE.MeshStandardMaterial({ color:0x555b63, metalness:0.85, roughness:0.45 });
const WOOD = new THREE.MeshStandardMaterial({ color:0xC49A6C, roughness:0.8 });
function waterMat(hex){
  return new THREE.MeshPhysicalMaterial({
    color:0xffffff, metalness:0, roughness:0.05,
    transmission:1, thickness:0.15, ior:1.33,
    attenuationColor:new THREE.Color(hex), attenuationDistance:0.16, envMapIntensity:1.0
  });
}

/* ═════════ 실험대 ═════════ */
const BENCH_Y = 0.0;
{
  const floor=new THREE.Mesh(new THREE.CircleGeometry(7,48),
    new THREE.MeshStandardMaterial({color:0x6e747d, roughness:0.95}));
  floor.rotation.x=-Math.PI/2; floor.position.y=-0.86; floor.receiveShadow=true; scene.add(floor);

  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#22262c'; g.fillRect(0,0,256,256);
  for(let i=0;i<2600;i++){
    const v=30+Math.random()*26|0;
    g.fillStyle=`rgba(${v},${v+3},${v+7},${0.16+Math.random()*0.2})`;
    g.fillRect(Math.random()*256, Math.random()*256, 1.4, 1.4);
  }
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(3,2);
  const top=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.09,1.7),
    new THREE.MeshStandardMaterial({map:tex, roughness:0.34, metalness:0.05, envMapIntensity:0.7}));
  top.position.y=BENCH_Y-0.045; top.receiveShadow=true; top.castShadow=true; scene.add(top);
  const body=new THREE.Mesh(new THREE.BoxGeometry(3.15,0.76,1.5),
    new THREE.MeshStandardMaterial({color:0xE8E2D6, roughness:0.8}));
  body.position.y=BENCH_Y-0.09-0.38; body.receiveShadow=true; body.castShadow=true; scene.add(body);
}

/* ═════════ 기구 빌더 (전부 스냅 좌표에 미리 생성 → 배치=등장 연출) ═════════ */
const yAxis = new THREE.Vector3(0,1,0);

const RIG = new THREE.Group(); RIG.position.set(0, BENCH_Y, -0.05); scene.add(RIG);

function makeMagnet(){
  const gp=new THREE.Group();
  const red=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.028,0.04),
    new THREE.MeshStandardMaterial({color:0xE04545, roughness:0.5}));

  red.castShadow=blue.castShadow=true;
  gp.add(red,blue);
  const c=document.createElement('canvas'); c.width=128; c.height=64;

  g.fillStyle='#fff'; g.font='bold 40px sans-serif'; g.textAlign='center';
  g.fillText('N',32,46); g.fillText('S',96,46);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;

    new THREE.MeshBasicMaterial({map:t, transparent:true}));
  lab.rotation.x=-Math.PI/2; lab.position.y=0.0285; gp.add(lab);

}
function makeMagnifier(){
  const gp=new THREE.Group();

  handle.position.set(0.095,0.012,0.04);
  rim.castShadow=handle.castShadow=true;

/* ═════════ 게임 상태 ═════════ */
const { createNeutralSim, MISSION_ACID, createMissionRun } = window.SciLab;
let sim = createNeutralSim();
let run = createMissionRun(MISSION_ACID);
let freeMode=false, predictShown=false, prediction=null;
let predict2Shown=false, prediction2=null, wowArmed=false;
let succeeded=false, successAt=0;
const drops=[];         // 기구 등장 연출 목록
const dropAnims=[];      // 염기 방울 낙하 연출 목록
function KLabSnd(n){ try{ if(window.KLab&&window.KLab.sound&&window.KLab.sound.play) window.KLab.sound.play(n); }catch(e){} }

// URL config — grade (기본 mid). low = ★와우 2차(급반전 예측) 숨김 (v2 acid GRADES 승계)
const GRADE = (new URLSearchParams(location.search).get('grade')||'mid');
const showWow = (GRADE!=='low');

const $=id=>document.getElementById(id);
const dropCountEl=$('dropcount'), stateEl=$('stateline');
const resetBtn=$('resetBtn'), modeBtn=$('modeBtn');
const toastEl=$('toast'), missionEl=$('mission'), progEl=$('prog');
const predictEl=$('predict'), predict2El=$('predict2'), successEl=$('success');

// 액체 색 급반전 목표 (렌더 루프에서 lerp)
const targetCol=new THREE.Color(ACID_HEX);
let colorSpeed=0.8;

let toastTimer=null;
function toast(msg, warn, ms){
  toastEl.innerHTML=msg;
  toastEl.classList.toggle('warn', !!warn);
  toastEl.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.add('hide'), ms||3400);
}

function renderProg(){
  const n=run.count(), total=MISSION_ACID.required.length;
  let html=`<span class="chip ${n?'on':''}">준비물 ${n} / ${total}</span>`;
  MISSION_ACID.required.forEach(id=>{
    if(run.placed[id]){
      const e=EQUIP.find(x=>x.id===id);
      html+=`<span class="chip on">${e.ic} ${e.nm}</span>`;
    }
  });
  progEl.innerHTML=html;
}
renderProg();

function dropIn(id){
  const o=EQ_OBJ[id];
  o.visible=true;
  o.position.y=o.userData.baseY+0.28;
  drops.push({o, t:0});
}

function updateDropCount(){
  if(run.placed.dropper){
    dropCountEl.classList.remove('na');
    dropCountEl.innerHTML=sim.state.drops+'<small style="font-size:15px;color:#9fb3c8"> 방울</small>';
  } else {
    dropCountEl.classList.add('na');
    dropCountEl.innerHTML='스포이트를 설치하면<br>방울을 셀 수 있어요';
  }
}

function onPick(id, cardEl){
  if(succeeded && !freeMode) return;
  if(run.placed[id]){
    // 재탭 = 회수 (의존물 함께)
    run.remove(id);
    Object.keys(EQ_OBJ).forEach(k=>{
      if(!run.placed[k]) EQ_OBJ[k].visible=false;
    });
    syncTray(); renderProg(); updateDropCount();
    return;
  }
  const r=run.pick(id, freeMode);
  if(r.act==='wrong' || r.act==='blocked'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, r.act==='wrong'?4200:3800);
    return;
  }
  if(r.act==='placed'){
    const o=EQ_OBJ[id];
    if(o.userData.free){ const [x,z]=nextSpot(); o.position.x=x; o.position.z=z; }
    if(id==='lamp'){ LAMP.position.copy(LAMP_HOME); }
    dropIn(id);
    syncTray(); renderProg(); updateDropCount();
    if(r.ready && !freeMode && !predictShown){
      predictShown=true;
      setTimeout(()=>{ predictEl.classList.remove('hide');
        toast('✅ 준비 끝! 예측을 골라 봐요'); }, 500);
    } else if(r.ready && freeMode){
      toast('준비 완료 — 💉 스포이트를 탭해 염기를 한 방울씩 넣어 봐요');
    }
  }
}
function syncTray(){
  EQUIP.forEach(e=>{
    $('eq_'+e.id).classList.toggle('placed', !!run.placed[e.id]);
  });
}

predictEl.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    prediction=b.dataset.pick;
    predictEl.classList.add('hide');
    toast('좋아요! 💉 스포이트를 탭해 염기를 한 방울씩 넣어 봐요');
  });
});
predict2El.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    prediction2=b.dataset.pick;
    predict2El.classList.add('hide');
    toast(prediction2==='flip' ? '🎯 예측 접수! 다음 한 방울을 넣어 봐요'
                               : '🤔 정말요? 다음 한 방울을 넣어 확인해 봐요!', false, 4200);
  });
});

/* 스포이트 탭 = 염기 한 방울 */
function doDrop(){
  if(!run.placed.dropper || !run.placed.flask) return;
  if(succeeded && !freeMode) return;
  // ★와우 2차: 8방울 시점(중화점 직전)에서 예측 카드 (중/고, 미션 모드)
  if(!freeMode && showWow && !predict2Shown && !wowArmed && sim.state.drops===8){
    predict2Shown=true; wowArmed=true;
    predict2El.classList.remove('hide');
    return;   // 예측 먼저 — 이 탭은 소비하지 않음
  }
  const r=sim.addDrop();
  if(r.act==='over'){ toast('염기를 더 넣으면 이제 염기성이 강해져요 — 중화점은 지났어요', false, 4000); updateDropCount(); return; }
  // 방울 낙하 연출
  spawnDropAnim();
  updateDropCount();
  if(r.act==='flip'){
    targetCol.set(BASE_HEX); colorSpeed=6.0;   // 급반전
    KLabSnd('whoosh'); KLabSnd('success');
    rippleFlask();
  } else {
    targetCol.set(sim.state.col==='#1971C2'?BASE_HEX:ACID_HEX); colorSpeed=0.8;
    KLabSnd('tap');
  }
}
function doStir(){
  if(!run.placed.rod || !run.placed.flask) return;
  sim.stir();
  stirAnim();
  KLabSnd('select');
}

function spawnDropAnim(){
  const d=new THREE.Mesh(new THREE.SphereGeometry(0.006,12,10), waterMat(0x8FC7EE));
  d.position.set(FLASK_POS.x, BENCH_Y+0.19, FLASK_POS.z);
  RIG.add(d);
  dropAnims.push({o:d, t:0, y0:0.19, y1:0.088});
}
let flaskRipple=0;
function rippleFlask(){ flaskRipple=1; }
let stirT=-1;
function stirAnim(){ stirT=0; }

modeBtn.addEventListener('click',()=>{
  freeMode=!freeMode;
  modeBtn.textContent=freeMode?'🎯 미션 모드':'🧪 자유 실험';
  missionEl.style.display=freeMode?'none':'';
  document.querySelector('#topbar .badge').textContent=freeMode?'자유 실험':'미션 · 산과 염기';
  toast(freeMode?'자유 실험 — 무엇이든 꺼내 놓아 봐요':'미션 모드 — 필요한 기구만!');
});

function resetAll(keepMode){
  sim=createNeutralSim(); run=createMissionRun(MISSION_ACID);
  Object.keys(EQ_OBJ).forEach(k=>{ EQ_OBJ[k].visible=false; });
  LAMP.position.copy(LAMP_HOME);
  prediction=null; predictShown=false; succeeded=false; successAt=0;
  prediction2=null; predict2Shown=false; wowArmed=false;
  spotIdx=0;
  // 액체 색 리셋
  targetCol.set(ACID_HEX); colorSpeed=0.8;
  flaskLiquidMat.attenuationColor.set(ACID_HEX);
  // 방울 연출 정리
  dropAnims.forEach(d=>RIG.remove(d.o)); dropAnims.length=0;
  flaskRipple=0; stirT=-1;
  stateEl.textContent='산성 용액에 염기를 한 방울씩 — 색 변화를 지켜봐요';
  updateDropCount();
  predictEl.classList.add('hide'); predict2El.classList.add('hide'); successEl.classList.add('hide');
  syncTray(); renderProg();
  if(!keepMode && freeMode){ modeBtn.click(); }
}
resetBtn.addEventListener('click',()=>resetAll(true));
$('sucAgain').addEventListener('click',()=>resetAll(true));
$('sucFree').addEventListener('click',()=>{
  successEl.classList.add('hide');
  if(!freeMode) modeBtn.click();
});


/* ═════════ 탭 상호작용 (스포이트 = 방울 / 유리막대 = 젓기) ═════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let downPos=null;
function toNDC(e){
  ndc.x=(e.clientX/innerWidth)*2-1;
  ndc.y=-(e.clientY/innerHeight)*2+1;
}
renderer.domElement.addEventListener('pointerdown', e=>{
  downPos={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('pointermove', e=>{
  // 호버 커서: 스포이트/막대 위
  if(downPos) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  let hot=false;
  if(run.placed.dropper && ray.intersectObject(dropperProxy,false).length) hot=true;
  if(run.placed.rod && ray.intersectObject(rodProxy,false).length) hot=true;
  renderer.domElement.style.cursor=hot?'pointer':'';
});
renderer.domElement.addEventListener('pointerup', e=>{
  const moved = downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6;
  downPos=null;
  if(moved) return;   // 카메라 회전 제스처는 무시
  toNDC(e); ray.setFromCamera(ndc,camera);
  if(run.placed.dropper && ray.intersectObject(dropperProxy,false).length){ doDrop(); return; }
  if(run.placed.rod && ray.intersectObject(rodProxy,false).length){ doStir(); return; }
});


/* ═════════ 품질 자동 ═════════ */
let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++;
  if(qualityChecked) return;
  if(now-fpsStart>4000){
    qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){
      renderer.setPixelRatio(1);
      sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
      sun.shadow.radius=3;
    }
  }
}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  // 액체 색 급반전 lerp
  if(run.placed.flask){
    flaskLiquidMat.attenuationColor.lerp(targetCol, Math.min(dt*colorSpeed,1));
  }
  // 방울 낙하 연출
  for(let i=dropAnims.length-1;i>=0;i--){
    const d=dropAnims[i]; d.t+=dt*2.6;
    const k=Math.min(d.t,1), e=k*k;   // 가속 낙하
    d.o.position.y = d.y0 + (d.y1-d.y0)*e;
    if(k>=1){ RIG.remove(d.o); dropAnims.splice(i,1); flaskRipple=1; }
  }
  // 플라스크 수면 리플(방울 착수·급반전 순간) — 액체 살짝 출렁 스케일
  if(flaskRipple>0){
    flaskRipple=Math.max(0, flaskRipple-dt*2.5);
    const liq = EQ_OBJ.flask && EQ_OBJ.flask.children[1];
    if(liq) liq.scale.set(1+0.04*flaskRipple, 1-0.03*flaskRipple, 1+0.04*flaskRipple);
  }
  // 유리막대 젓기 애니메이션
  if(stirT>=0){
    stirT+=dt;
    if(EQ_OBJ.rod){ EQ_OBJ.rod.rotation.y=Math.sin(stirT*10)*0.5; }
    if(stirT>1.2){ stirT=-1; if(EQ_OBJ.rod) EQ_OBJ.rod.rotation.y=0; }
  }

  // 상태줄
  const d0=sim.state.drops;
  let st='';
  if(succeeded) st='🔵 확 뒤집혔어요 — 중화점!';
  else if(sim.state.flipped) st='🔵 파랑으로 뒤집혔어요!';
  else if(d0===0 && run.placed.dropper) st='💉 스포이트를 탭해 염기를 한 방울씩 넣어 봐요';
  else if(d0>=1 && d0<=5) st='💧 '+d0+'방울 — 아직 새빨간 산성이에요';
  else if(d0>=6 && d0<=8) st='거의 그대로… 언제 변할까요?';
  else if(!run.placed.dropper && run.isReady && run.isReady()) st='💉 스포이트를 탭해 봐요';
  stateEl.textContent=st;

  // 성공 판정 — flip 2초 지속
  if(sim.state.flipped){
    if(!successAt) successAt=t;
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='여태 거의 빨강 그대로였는데 <b>결정적 한 방울(중화점)</b>에서 단번에 파랑으로 — 산+염기는 비례해 조금씩이 아니라 <b>한 점에서 확</b> 바뀌어요.';
      if(prediction) msg=(prediction==='snap'?'🎯 <b>1차 예측 적중!</b> ':'🤔 1차 예측과 달랐죠? ')+msg;
      if(prediction2) msg+= (prediction2==='flip')
        ? '<br>🎯 <b>2차도 적중</b> — 결정적 한 방울에 단번에 변했죠!'
        : '<br>🤔 2차는 달랐죠? 거의 그대로다가 <b>한 방울에 확</b> 뒤집혔어요!';
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' :
                    `<br>기구 고르기 다시 생각해 본 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      if(!freeMode) successEl.classList.remove('hide');
      else toast('🔵 딱 한 방울에 확 뒤집혔어요 — 중화점!',false,5200);
    }
  } else successAt=0;

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').classList.add('hide');
toast('🎯 미션: 선반에서 <b>필요한 기구만</b> 골라 실험을 준비해 봐요!', false, 5200);
animate();
</script>
</body>

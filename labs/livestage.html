<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>살아나는 무대 | 케이아트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="/kedu_collect.js"></script>
<style id="kedu-title-font">/* 케이에듀 제목 폰트 토큰 (학교안심 모험가) — v3 표준 */
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Gowun Dodum',sans-serif}
</style>

<!-- ═══════════════════════════════════════════════════════════════
     순수 로직 (렌더러 무관 · node 테스트 대상)
     대상 테스트: handoff/draw/tests/test_livestage.js
     4모델: 무대표 · 움직임 물리(헤엄/훨훨/콩콩/둥둥) · 먹이장 · 무대 운영
     ═══════════════════════════════════════════════════════════════ -->
<script id="livestage-logic">
(function(){
  'use strict';

  var MAX_BEINGS = 40;          // 한 무대 정원 (한 반 규모 + 여유)
  var SPRITE_MAX_W = 150;
  var SPRITE_MAX_H = 110;

  /* ── 무대표 ──
     floor = 바닥선 비율(무대 높이 대비 아래에서). def = 무대 기본 움직임.
     "자동"을 고르면 무대의 def를 따른다. */
  var STAGES = [
    { id:'sea',    name:'바다',  emoji:'🌊', def:'swim',  floor:0.040, bubbles:true  },
    { id:'sky',    name:'하늘',  emoji:'☁️', def:'fly',   floor:0.026, bubbles:false },
    { id:'forest', name:'숲',    emoji:'🌲', def:'hop',   floor:0.070, bubbles:false },
    { id:'space',  name:'우주',  emoji:'🚀', def:'float', floor:0.056, bubbles:false },
    { id:'winter', name:'겨울',  emoji:'⛄', def:'hop',   floor:0.100, bubbles:false }
  ];
  function findStage(id){ for(var i=0;i<STAGES.length;i++) if(STAGES[i].id===id) return STAGES[i]; return null; }

  var MOTIONS = [
    { id:'auto',  name:'자동', emoji:'✨' },
    { id:'swim',  name:'헤엄', emoji:'🐟' },
    { id:'fly',   name:'훨훨', emoji:'🦋' },
    { id:'hop',   name:'콩콩', emoji:'🐰' },
    { id:'float', name:'둥둥', emoji:'🎈' }
  ];
  function resolveMotion(sel, stageId){
    if(sel && sel!=='auto') return sel;
    var s = findStage(stageId);
    return s ? s.def : 'swim';
  }
  function floorOf(stageId, H){
    var s = findStage(stageId);
    return H - Math.round(H * (s ? s.floor : 0.04));
  }

  /* ── 그림 잘라내기 ──
     알파 채널만 보고 실제 그려진 영역의 바운딩 박스를 구한다.
     alphaAt(x,y) = 0~255. 캔버스 없이도 테스트 가능하도록 함수를 받는다. */
  function trimBounds(alphaAt, w, h, opts){
    opts = opts || {};
    var step = opts.step || 2, thr = opts.threshold==null ? 10 : opts.threshold, pad = opts.pad==null ? 6 : opts.pad;
    var minX=w, minY=h, maxX=-1, maxY=-1, found=false;
    for(var y=0;y<h;y+=step) for(var x=0;x<w;x+=step){
      if(alphaAt(x,y) > thr){
        found=true;
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
    if(!found) return null;
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
    maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
    return { x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1 };
  }

  /* 무대에 놓일 크기 — 비율 유지, 상한만 적용(작은 그림은 확대하지 않음) */
  function fitSize(w, h, maxW, maxH){
    maxW = maxW || SPRITE_MAX_W; maxH = maxH || SPRITE_MAX_H;
    var s = Math.min(maxW/w, maxH/h, 1);
    return { w:w*s, h:h*s, scale:s };
  }

  /* ── 그림 친구(개체) ── */
  function createBeing(o){
    o = o || {};
    var rnd = o.rnd || Math.random;
    var size = fitSize(o.w||100, o.h||80);
    return {
      id: o.id || 0,
      name: (o.name||'').slice(0,8),
      mode: o.mode || 'swim',
      face: o.face === -1 ? -1 : 1,     // 그림이 향한 방향(그린 사람이 고름)
      w: size.w, h: size.h,
      x: o.x==null ? -80 : o.x,
      y: o.y==null ? 100 : o.y,
      dir: 1,
      speed: o.speed==null ? (0.6 + rnd()*0.8) : o.speed,
      ph: rnd()*6, amp: 10 + rnd()*14, freq: 0.8 + rnd()*0.8,
      vx: (rnd()-0.5)*0.8, vy: 0, rot: 0, rotV: (rnd()-0.5)*0.008,
      restT: 0, target: null, scare: 0, age: 0, eaten: 0
    };
  }

  /* ── 먹이장 ── */
  function createPelletField(){
    var list = [];
    return {
      list: function(){ return list; },
      count: function(){ return list.length; },
      drop: function(x, y){ var p={x:x, y:Math.min(y,40), vy:0.35, wob:Math.random()*6}; list.push(p); return p; },
      remove: function(p){ var i=list.indexOf(p); if(i>=0) list.splice(i,1); return i>=0; },
      step: function(dt, floorY, t){
        for(var i=list.length-1;i>=0;i--){
          var p=list[i];
          p.y += p.vy*dt;
          p.x += Math.sin(t*3 + p.wob)*0.3;
          if(p.y > floorY-6) list.splice(i,1);   // 바닥에 닿으면 사라짐
        }
      },
      clear: function(){ list.length=0; }
    };
  }

  /* 가장 가까운 먹이 — 사거리 밖은 못 본다 */
  function pickTarget(b, pellets, range){
    range = range==null ? 260 : range;
    var best=null, bd=range*range;
    for(var i=0;i<pellets.length;i++){
      var p=pellets[i], d=(p.x-b.x)*(p.x-b.x) + (p.y-b.y)*(p.y-b.y);
      if(d<bd){ bd=d; best=p; }
    }
    return best;
  }

  /* ── 움직임 물리 ──
     env = { t, dt, W, H, floorY, pellets(배열), onEat(p, being) }
     4모드 공통: ①놀람 ②먹이 추적 ③평소 움직임 순으로 우선. */
  function stepBeing(b, env){
    var dt = env.dt, t = env.t, W = env.W, floorY = env.floorY;
    b.age += dt;

    if(b.scare<=0 && env.pellets && env.pellets.length){
      if(!b.target || env.pellets.indexOf(b.target)<0) b.target = pickTarget(b, env.pellets);
    } else if(b.target && (!env.pellets || env.pellets.indexOf(b.target)<0)) {
      b.target = null;
    }

    if(b.scare>0){
      b.scare -= dt*0.03;
      b.target = null;
      b.x += b.dir * b.speed * 5 * dt;
      if(b.mode==='hop'){ if(b.vy>=0) b.vy = -5; }
      else b.y += Math.sin(t*9 + b.ph)*2;

    } else if(b.target){
      var dx = b.target.x - b.x, dy = b.target.y - b.y;
      var d = Math.sqrt(dx*dx + dy*dy) || 1;
      b.dir = dx>=0 ? 1 : -1;
      b.x += dx/d * b.speed * 2.4 * dt;
      if(b.mode==='hop'){
        if(b.restT<=0 && b.y >= floorY - b.h/2 - 1){ b.vy = -5.5; b.restT = 0.2; }
      } else {
        b.y += dy/d * b.speed * 2.4 * dt;
      }
      if(d < 20){
        var p = b.target;
        b.target = null; b.eaten++;
        if(env.onEat) env.onEat(p, b);
      }

    } else {
      switch(b.mode){
        case 'swim':
          b.x += b.dir * b.speed * dt;
          b.y += Math.sin(t*b.freq + b.ph) * b.amp * 0.016 * dt * 16;
          break;
        case 'fly':
          b.x += b.dir * b.speed * 1.3 * dt;
          b.y += (Math.sin(t*b.freq*1.5 + b.ph) * b.amp * 0.03 + Math.sin(t*0.4 + b.ph)*0.6) * dt * 8;
          break;
        case 'float':
          b.x += b.vx * dt;
          b.y += Math.sin(t*0.6 + b.ph) * 0.4 * dt * 4;
          b.rot += b.rotV * dt * 16;
          b.dir = b.vx>=0 ? 1 : -1;
          break;
      }
    }

    /* 콩콩 = 중력 물리 (다른 모드는 중력 없음) */
    if(b.mode==='hop'){
      b.vy += 0.25*dt;
      b.y  += b.vy * dt * 3;
      var gy = floorY - b.h/2;
      if(b.y >= gy){ b.y = gy; b.vy = 0; }
      b.restT -= dt/60;
      var grounded = (b.y >= gy - 1);
      if(grounded && b.restT<=0 && b.scare<=0 && !b.target){
        b.vy = -(3.5 + Math.random()*2);
        b.restT = 0.5 + Math.random()*1.1;
        if(Math.random()<0.25) b.dir *= -1;
      }
      if(!grounded) b.x += b.dir * b.speed * 1.6 * dt;
    }

    /* 벽 — 안쪽으로 되돌린다. 등장 직후(왼쪽 밖)에는 붙잡지 않는다. */
    var m = b.w/2 + 10;
    if(b.x > W - m){ b.dir = -1; if(b.mode==='float') b.vx = -Math.abs(b.vx) || -0.4; }
    if(b.x < m && b.age > 120){ b.dir = 1; if(b.mode==='float') b.vx = Math.abs(b.vx) || 0.4; }

    var topM = b.h/2 + 8;
    var botM = (b.mode==='swim') ? floorY - 24 - b.h/2 : floorY - b.h/2;
    if(botM < topM) botM = topM;
    if(b.y < topM) b.y = topM;
    if(b.y > botM) b.y = botM;
    return b;
  }

  /* ── 무대 운영 ── */
  function createStageRun(opts){
    opts = opts || {};
    var stageId = opts.stage || 'sea';
    var beings = [];
    var seq = 0;
    var pellets = createPelletField();
    return {
      stage: function(){ return stageId; },
      setStage: function(id){ if(findStage(id)){ stageId=id; pellets.clear(); return true; } return false; },
      pellets: pellets,
      beings: function(){ return beings; },
      count: function(){ return beings.length; },
      full: function(){ return beings.length >= MAX_BEINGS; },
      add: function(o){
        if(beings.length >= MAX_BEINGS) beings.shift();     // 정원 초과 = 가장 오래된 친구가 자리를 내준다
        o = o || {};
        o.id = ++seq;
        o.mode = resolveMotion(o.motionSel, stageId);
        var b = createBeing(o);
        beings.push(b);
        return b;
      },
      hitTest: function(x, y){
        for(var i=beings.length-1;i>=0;i--){
          var b=beings[i];
          if(Math.abs(b.x-x) < b.w/2 && Math.abs(b.y-y) < b.h/2) return b;
        }
        return null;
      },
      clear: function(){ beings.length=0; pellets.clear(); },
      totalEaten: function(){ var n=0; for(var i=0;i<beings.length;i++) n+=beings[i].eaten; return n; }
    };
  }

  var API = { MAX_BEINGS:MAX_BEINGS, SPRITE_MAX_W:SPRITE_MAX_W, SPRITE_MAX_H:SPRITE_MAX_H,
              STAGES:STAGES, MOTIONS:MOTIONS, findStage:findStage, resolveMotion:resolveMotion, floorOf:floorOf,
              trimBounds:trimBounds, fitSize:fitSize,
              createBeing:createBeing, stepBeing:stepBeing,
              createPelletField:createPelletField, pickTarget:pickTarget,
              createStageRun:createStageRun };
  if(typeof module!=='undefined' && module.exports){ module.exports = API; }
  if(typeof window!=='undefined'){ window.LiveStage = API; }
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* v3 §1 토큰 상속 */
:root{
  --ink:#E8EEF5; --mut:#8fa3b8;
  --accent:#FF9BC7; --accent2:#B592F5;   /* 케이아트 = 핑크→보라 */
  --glass:rgba(255,255,255,.045); --glass-bd:rgba(255,255,255,.09);
  --hud:rgba(20,25,32,.74); --hud-bd:rgba(255,255,255,.10);
  --paper:#FCFAF5;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#2b3340 0%,#1b2129 46%,#12161c 100%);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}

/* TOPBAR */
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;
  background:var(--hud);backdrop-filter:blur(8px);border-bottom:1px solid var(--hud-bd);z-index:30}
.logo{font-family:var(--kedu-title);font-size:19px;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.logo .kk{background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo .badge{font-family:var(--kedu-title);font-size:12px;color:#12161c;
  background:linear-gradient(135deg,var(--accent),var(--accent2));padding:2px 11px;border-radius:50px}
.tb-spacer{flex:1}
.hint{font-size:12.5px;color:var(--mut)}
.tb-btn{height:36px;padding:0 13px;border-radius:11px;border:1px solid var(--glass-bd);
  background:var(--glass);font-size:13px;display:flex;align-items:center;gap:6px;transition:all .14s}
.tb-btn:hover{background:rgba(255,255,255,.10)}
.tb-btn.go{border-color:transparent;color:#12161c;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2))}

/* MAIN */
.main{flex:1;display:flex;min-height:0}

/* 왼쪽 = 그리기 */
.side{width:330px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:14px;
  background:var(--glass);border-right:1px solid var(--glass-bd);backdrop-filter:blur(8px);overflow-y:auto}
.side::-webkit-scrollbar{width:0}
.sec{font-family:var(--kedu-title);font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
#padWrap{position:relative;border-radius:14px;overflow:hidden;background:var(--paper);
  box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.06)}
#pad{display:block;width:100%;touch-action:none;cursor:crosshair}
#padHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  color:#B9AE9A;font-size:13.5px;line-height:1.6;pointer-events:none}

.pal{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);
  box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .12s,border-color .12s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:#fff;transform:scale(1.16)}

.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{height:34px;padding:0 11px;border-radius:11px;border:2px solid transparent;
  background:rgba(255,255,255,.05);font-size:12.5px;display:flex;align-items:center;gap:5px;transition:all .14s}
.chip:hover{background:rgba(255,255,255,.10)}
.chip.on{background:linear-gradient(135deg,rgba(255,155,199,.22),rgba(181,146,245,.22));border-color:var(--accent);color:var(--accent)}
.sz{border-radius:50%;background:var(--ink);border:3px solid transparent;flex-shrink:0}
.sz.on{border-color:var(--accent)}

#who{flex:1;min-width:90px;height:38px;border-radius:11px;border:1px solid var(--glass-bd);
  background:rgba(255,255,255,.05);padding:0 12px;font-size:13px}
#who::placeholder{color:var(--mut)}
#send{width:100%;height:46px;border-radius:13px;border:none;font-size:15px;font-weight:700;color:#12161c;
  font-family:var(--kedu-title);letter-spacing:.3px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 5px 0 rgba(150,90,180,.55);transition:transform .07s,box-shadow .07s}
#send:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(150,90,180,.55)}

/* 오른쪽 = 무대 */
.stagePane{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px;gap:10px}
.stagebar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.stbtn{height:36px;padding:0 14px;border-radius:50px;border:2px solid transparent;
  background:rgba(255,255,255,.05);font-size:13px;transition:all .14s}
.stbtn:hover{background:rgba(255,255,255,.10)}
.stbtn.on{background:linear-gradient(135deg,rgba(255,155,199,.22),rgba(181,146,245,.22));border-color:var(--accent);color:var(--accent)}
#stageWrap{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.07)}
#stage{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.footbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
#tally{font-size:13px;color:var(--mut)}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%) translateY(-70px);
  background:var(--hud);backdrop-filter:blur(8px);border:1px solid var(--hud-bd);
  color:var(--ink);padding:9px 18px;border-radius:50px;font-size:13px;pointer-events:none;z-index:5;
  transition:transform .34s cubic-bezier(.2,1.4,.4,1)}
#toast.on{transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .main{flex-direction:column;overflow-y:auto}
  .side{width:100%;border-right:none;border-bottom:1px solid var(--glass-bd)}
  #stageWrap{min-height:420px}
  html,body{overflow:auto}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="logo" href="/draw/"><span class="kk">K-edu</span> <span class="badge">살아나는 무대</span></a>
  <div class="hint" id="topHint">그린 그림이 무대에서 살아 움직여요</div>
  <div class="tb-spacer"></div>
  <button class="tb-btn" id="clearStage">🧹 무대 비우기</button>
  <button class="tb-btn go" id="toBox">📦 케이박스</button>
</div>

<div class="main">
  <!-- 그리기 -->
  <section class="side">
    <div class="sec">✏️ 그림 그리기</div>
    <div id="padWrap">
      <canvas id="pad" width="660" height="500"></canvas>
      <div id="padHint">여기에 그려 보세요<br>물고기 · 새 · 토끼 · 로켓 · 눈사람</div>
    </div>

    <div class="pal" id="pal"></div>

    <div class="row">
      <span id="sizes" class="row" style="gap:6px"></span>
      <button class="chip" id="eraser">🧽 지우개</button>
      <button class="chip" id="wipe">↺ 다시</button>
    </div>

    <div class="sec">🕹️ 어떻게 움직일까요?</div>
    <div class="row" id="motions"></div>

    <div class="sec">👀 어느 쪽을 보고 있나요?</div>
    <div class="row">
      <button class="chip" id="fL">◀ 왼쪽</button>
      <button class="chip on" id="fR">오른쪽 ▶</button>
      <input id="who" maxlength="8" placeholder="이름 (예: 지우)">
    </div>

    <button id="send">무대로 보내기 ✨</button>
  </section>

  <!-- 무대 -->
  <section class="stagePane">
    <div class="stagebar" id="stagebar"></div>
    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="toast"></div>
    </div>
    <div class="footbar">
      <span id="tally">무대가 비어 있어요</span>
      <span class="hint">무대를 누르면 먹이가 떨어져요 · 그림을 누르면 깜짝 놀라요</span>
    </div>
  </section>
</div>

<script>
(function(){
  'use strict';
  var LS = window.LiveStage;
  var rnd = Math.random;

  /* ══ 그리기 패드 ══ */
  var pad = document.getElementById('pad'), pctx = pad.getContext('2d', {willReadFrequently:true});
  var padHint = document.getElementById('padHint');
  pctx.lineCap = pctx.lineJoin = 'round';

  var COLORS = ['#2B3A4A','#FF5C5C','#FF9D3C','#FFD23C','#5CC85C','#3CBCD8','#4C6CF0','#B06CF0','#F07CC0','#8A5A3C','#FFFFFF'];
  var color = COLORS[1], size = 14, erasing = false, drew = false;

  var pal = document.getElementById('pal');
  COLORS.forEach(function(c,i){
    var b = document.createElement('button');
    b.className = 'sw' + (i===1?' on':''); b.style.background = c;
    b.setAttribute('aria-label','색');
    b.onclick = function(){
      color = c; erasing = false;
      Array.prototype.forEach.call(pal.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      document.getElementById('eraser').classList.remove('on');
    };
    pal.appendChild(b);
  });

  var sizes = document.getElementById('sizes');
  [8,14,24].forEach(function(s,i){
    var b = document.createElement('button');
    b.className = 'sz' + (i===1?' on':'');
    b.style.width = b.style.height = (13 + i*7) + 'px';
    b.setAttribute('aria-label','굵기');
    b.onclick = function(){
      size = s;
      Array.prototype.forEach.call(sizes.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
    };
    sizes.appendChild(b);
  });

  document.getElementById('eraser').onclick = function(){
    erasing = true;
    Array.prototype.forEach.call(pal.children, function(x){ x.classList.remove('on'); });
    this.classList.add('on');
  };
  document.getElementById('wipe').onclick = function(){
    pctx.clearRect(0,0,pad.width,pad.height); drew = false; padHint.style.display = 'flex';
  };

  var down = false, lx = 0, ly = 0;
  function at(e){
    var r = pad.getBoundingClientRect();
    return [(e.clientX-r.left)*pad.width/r.width, (e.clientY-r.top)*pad.height/r.height];
  }
  function seg(x,y){
    pctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    pctx.strokeStyle = color;
    pctx.lineWidth = erasing ? size*2.2 : size;
    pctx.beginPath(); pctx.moveTo(lx,ly); pctx.lineTo(x+0.01, y+0.01); pctx.stroke();
  }
  pad.addEventListener('pointerdown', function(e){
    e.preventDefault(); down = true;
    var p = at(e); lx = p[0]; ly = p[1]; seg(lx,ly);
    padHint.style.display = 'none'; drew = true;
    if(pad.setPointerCapture) try{ pad.setPointerCapture(e.pointerId); }catch(_){}
  });
  pad.addEventListener('pointermove', function(e){
    if(!down) return; e.preventDefault();
    var p = at(e); seg(p[0], p[1]); lx = p[0]; ly = p[1];
  });
  window.addEventListener('pointerup', function(){ down = false; });

  /* 움직임 · 방향 */
  var motionSel = 'auto';
  var mrow = document.getElementById('motions');
  LS.MOTIONS.forEach(function(m,i){
    var b = document.createElement('button');
    b.className = 'chip' + (i===0?' on':'');
    b.textContent = m.emoji + ' ' + m.name;
    b.onclick = function(){
      motionSel = m.id;
      Array.prototype.forEach.call(mrow.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
    };
    mrow.appendChild(b);
  });

  var face = 1, fL = document.getElementById('fL'), fR = document.getElementById('fR');
  fL.onclick = function(){ face = -1; fL.classList.add('on'); fR.classList.remove('on'); };
  fR.onclick = function(){ face =  1; fR.classList.add('on'); fL.classList.remove('on'); };

  /* ══ 무대 ══ */
  var cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  var wrap = document.getElementById('stageWrap');
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = wrap.clientWidth; H = wrap.clientHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  new ResizeObserver(resize).observe(wrap); resize();

  var run = LS.createStageRun({ stage:'sea' });
  var bubbles = [], pops = [], shots = [];

  var stagebar = document.getElementById('stagebar');
  LS.STAGES.forEach(function(s){
    var b = document.createElement('button');
    b.className = 'stbtn' + (s.id===run.stage()?' on':'');
    b.textContent = s.emoji + ' ' + s.name;
    b.onclick = function(){
      run.setStage(s.id);
      Array.prototype.forEach.call(stagebar.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      bubbles.length = 0;
      toast(s.emoji + ' ' + s.name + ' 무대로 바뀌었어요');
    };
    stagebar.appendChild(b);
  });

  var toastEl = document.getElementById('toast'), toastT = null;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 1900);
  }
  function tally(){
    var n = run.count();
    document.getElementById('tally').textContent = n ? ('그림 친구 ' + n + '명이 놀고 있어요') : '무대가 비어 있어요';
  }

  /* 그림 → 무대 */
  document.getElementById('send').onclick = function(){
    if(!drew){ toast('먼저 그림을 그려 주세요 ✏️'); return; }
    var img = pctx.getImageData(0,0,pad.width,pad.height).data;
    var box = LS.trimBounds(function(x,y){ return img[(y*pad.width + x)*4 + 3]; }, pad.width, pad.height);
    if(!box){ toast('먼저 그림을 그려 주세요 ✏️'); return; }

    var off = document.createElement('canvas');
    off.width = box.w; off.height = box.h;
    off.getContext('2d').drawImage(pad, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);

    var sprite = new Image();
    sprite.onload = function(){
      var b = run.add({
        w: box.w, h: box.h, face: face, motionSel: motionSel,
        name: document.getElementById('who').value.trim(),
        rnd: rnd,
        y: 60 + rnd()*Math.max(80, H-200)
      });
      b.sprite = sprite;
      tally();
      toast((b.name ? b.name + '의 ' : '') + '그림이 무대에 나타났어요 ✨');
      pctx.clearRect(0,0,pad.width,pad.height);
      drew = false; padHint.style.display = 'flex';
    };
    sprite.src = off.toDataURL();
  };

  cv.addEventListener('pointerdown', function(e){
    var r = cv.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var hit = run.hitTest(x,y);
    if(hit){ hit.scare = 1; hit.target = null; return; }
    run.pellets.drop(x,y);
  });

  document.getElementById('clearStage').onclick = function(){
    run.clear(); bubbles.length = 0; pops.length = 0; tally(); toast('무대를 비웠어요');
  };

  /* 케이박스 제출 — 무대 한 장면을 그대로 담는다 */
  document.getElementById('toBox').onclick = function(){
    if(!run.count()){ toast('무대에 그림이 없어요'); return; }
    var st = LS.findStage(run.stage());
    var th = document.createElement('canvas'); th.width = 320; th.height = 200;
    th.getContext('2d').drawImage(cv, 0, 0, 320, 200);
    var ok = (window.KEDU && KEDU.collect) && KEDU.collect({
      kind:'artwork', app:'livestage',
      id: 'stage_' + run.stage() + '_' + Date.now(),
      title: st.name + ' 무대',
      meta:{ stage: run.stage(), beings: run.count(), eaten: run.totalEaten() },
      thumb: th.toDataURL('image/png'), at: Date.now()
    });
    toast(ok ? '📦 케이박스에 담았어요' : '케이박스에 담지 못했어요 (저장 공간 확인)');
  };

  /* ══ 무대 그리기 (절차 생성 — 외부 에셋 0) ══ */
  function R(a,b){ return a + rnd()*(b-a); }
  var D = {
    sea:{
      rocks: Array.from({length:5}, function(_,i){ return {x:i*0.22+R(0,0.08), w:R(0.14,0.26), h:R(0.12,0.30)}; }),
      corals: Array.from({length:5}, function(_,i){ return {x:i*0.2+R(0.02,0.1), branch:i%2===1, s:R(0.7,1.25),
                c:['#FF7E67','#FF9E5C','#F06292','#BA68C8','#FFB74D'][i%5], ph:R(0,6)}; }),
      anems: [{x:0.16,c:'#F48FB1',n:9,ph:1},{x:0.62,c:'#CE93D8',n:11,ph:3},{x:0.88,c:'#80DEEA',n:8,ph:5}],
      weeds: Array.from({length:7}, function(_,i){ return {x:0.04+i*0.14+R(0,0.05), h:R(0.18,0.34), ph:R(0,6),
                c: i%2 ? 'rgba(38,150,100,.9)' : 'rgba(28,120,90,.75)'}; }),
      pebbles: Array.from({length:10}, function(){ return {x:rnd(), r:R(3,9), c:'hsl('+R(30,50)+',25%,'+R(45,65)+'%)'}; }),
      stars: [{x:0.30,c:'#FF8A65'},{x:0.74,c:'#FFD54F'}],
      dust: Array.from({length:40}, function(){ return {x:rnd(), y:rnd(), r:R(0.6,1.8), v:R(0.05,0.2), ph:R(0,6)}; }),
      school: Array.from({length:8}, function(){ return {ox:R(-40,40), oy:R(-24,24), s:R(0.6,1)}; }),
      sx:-200, sdir:1, sy:0.3
    },
    sky:{
      clouds: Array.from({length:7}, function(_,i){ return {x:rnd(), y:R(0.08,0.6), s:R(0.6,1.4), v:R(0.1,0.35), far:i<3}; }),
      seeds: Array.from({length:18}, function(){ return {x:rnd(), y:rnd(), ph:R(0,6), v:R(0.1,0.3)}; }),
      birds: Array.from({length:5}, function(){ return {ox:R(-50,50), oy:R(-20,20), s:R(0.5,0.9)}; }),
      bx:-150, bdir:1, by:0.25
    },
    forest:{
      trunks: [{x:0.06,w:0.05},{x:0.90,w:0.06},{x:0.42,w:0.04}],
      bushes: Array.from({length:6}, function(_,i){ return {x:i*0.18+R(0,0.06), r:R(0.05,0.10), c: i%2?'#4C8C46':'#3D7A3A'}; }),
      flowers: Array.from({length:9}, function(){ return {x:rnd(), c:['#FF6B8A','#FFD23C','#B06CF0','#FF9D3C'][Math.floor(R(0,4))], ph:R(0,6)}; }),
      shrooms: [{x:0.24},{x:0.68}],
      leaves: Array.from({length:14}, function(){ return {x:rnd(), y:rnd(), ph:R(0,6), v:R(0.15,0.4), r:R(3,6)}; }),
      rays: [0.25,0.55,0.80]
    },
    space:{
      stars: Array.from({length:80}, function(){ return {x:rnd(), y:rnd()*0.92, r:R(0.5,1.8), ph:R(0,6)}; }),
      craters: Array.from({length:6}, function(){ return {x:rnd(), r:R(8,22)}; })
    },
    winter:{
      snow: Array.from({length:70}, function(){ return {x:rnd(), y:rnd(), r:R(1,3.2), v:R(0.3,0.9), ph:R(0,6)}; }),
      pines: [{x:0.10,s:1},{x:0.22,s:0.7},{x:0.86,s:1.1},{x:0.72,s:0.65}]
    }
  };

  function grad(stops){
    var g = ctx.createLinearGradient(0,0,0,H);
    stops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  function vignette(a){
    if(a<=0) return;
    var vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4, W/2,H/2,Math.max(W,H)*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,10,30,'+a+')');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }
  function ground(y, back, front, amp){
    ctx.fillStyle = back;
    ctx.beginPath(); ctx.moveTo(0,H);
    for(var x=0;x<=W;x+=40) ctx.lineTo(x, y-14-Math.sin(x*0.015)*amp);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = front;
    ctx.beginPath(); ctx.moveTo(0,H);
    for(var x2=0;x2<=W;x2+=40) ctx.lineTo(x2, y-Math.sin(x2*0.02+1)*6);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }

  function bgSea(t, dt, fy){
    grad([[0,'#3DB8DC'],[0.25,'#1A7FB0'],[0.6,'#0C4F7E'],[1,'#03243F']]);
    var d = D.sea;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for(var i=0;i<7;i++){
      var cx = (i/7)*W + Math.sin(t*0.8 + i*1.7)*30, cy = 14 + Math.sin(t*1.3+i)*6;
      var cg = ctx.createRadialGradient(cx,cy,0,cx,cy,60);
      cg.addColorStop(0,'rgba(180,240,255,.14)'); cg.addColorStop(1,'rgba(180,240,255,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(cx,cy,60,16,0,0,7); ctx.fill();
    }
    for(var j=0;j<4;j++){
      var bx = W*(0.12 + j*0.24) + Math.sin(t*0.25 + j*2)*50;
      var lg = ctx.createLinearGradient(bx,0,bx+90,H);
      lg.addColorStop(0,'rgba(200,240,255,.16)'); lg.addColorStop(1,'rgba(200,240,255,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(bx-24,0); ctx.lineTo(bx+24,0); ctx.lineTo(bx+150,H); ctx.lineTo(bx+30,H); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    d.rocks.forEach(function(r){
      ctx.fillStyle = 'rgba(5,30,55,.55)';
      ctx.beginPath(); ctx.ellipse(r.x*W + r.w*W/2, fy, r.w*W/2, r.h*H, 0, Math.PI, 0); ctx.fill();
    });
    d.sx += d.sdir*0.9*dt;
    if(d.sx > W+220){ d.sdir = -1; d.sy = R(0.2,0.5); }
    if(d.sx < -220){ d.sdir = 1;  d.sy = R(0.2,0.5); }
    d.school.forEach(function(f,i){
      var x = d.sx + f.ox*d.sdir, y = d.sy*H + f.oy + Math.sin(t*2+i)*3;
      ctx.save(); ctx.translate(x,y); ctx.scale(d.sdir*f.s, f.s);
      ctx.fillStyle = 'rgba(10,40,70,.5)';
      ctx.beginPath(); ctx.ellipse(0,0,10,4,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(-15,-4); ctx.lineTo(-15,4); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
    d.dust.forEach(function(p){
      var py = (p.y*H - t*p.v*20) % H; if(py<0) py += H;
      ctx.fillStyle = 'rgba(220,245,255,.25)';
      ctx.beginPath(); ctx.arc(p.x*W + Math.sin(t*0.5+p.ph)*8, py, p.r, 0, 7); ctx.fill();
    });
    ground(fy, '#B89A63', '#E8CF8F', 8);
    d.pebbles.forEach(function(p){
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(p.x*W, fy+2, p.r, p.r*0.6, 0, 0, 7); ctx.fill();
    });
    d.corals.forEach(function(c){
      var sway = Math.sin(t*1.2 + c.ph)*0.5, x = c.x*W;
      if(c.branch){
        ctx.strokeStyle = c.c; ctx.lineCap = 'round';
        for(var i=0;i<5;i++){
          var a = -Math.PI/2 + (i-2)*0.42, len = (34 + (i%2)*16)*c.s;
          ctx.lineWidth = 7*c.s;
          var mx = x + Math.cos(a)*len*0.5 + sway*4, my = fy+2 + Math.sin(a)*len*0.5;
          ctx.beginPath(); ctx.moveTo(x, fy+2);
          ctx.quadraticCurveTo(mx, my, x + Math.cos(a)*len + sway*8, fy+2 + Math.sin(a)*len); ctx.stroke();
          ctx.lineWidth = 4.5*c.s;
          ctx.beginPath(); ctx.moveTo(mx,my);
          ctx.lineTo(mx + Math.cos(a-0.7)*13*c.s + sway*4, my + Math.sin(a-0.7)*13*c.s); ctx.stroke();
        }
      } else {
        ctx.fillStyle = c.c;
        ctx.beginPath(); ctx.arc(x, fy+2, 26*c.s, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2*c.s;
        for(var k=1;k<4;k++){ ctx.beginPath(); ctx.arc(x, fy+2, 26*c.s*k/4, Math.PI+0.3, -0.3); ctx.stroke(); }
      }
    });
    d.anems.forEach(function(a){
      var x = a.x*W, sway = Math.sin(t*1.4 + a.ph);
      ctx.strokeStyle = a.c; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for(var i=0;i<a.n;i++){
        var ang = -Math.PI/2 + (i-(a.n-1)/2)*0.28, len = 22 + Math.sin(t*2+i)*3;
        ctx.beginPath(); ctx.moveTo(x, fy);
        ctx.quadraticCurveTo(x + Math.cos(ang)*len*0.5 + sway*3, fy + Math.sin(ang)*len*0.5,
                             x + Math.cos(ang)*len + sway*7,     fy + Math.sin(ang)*len);
        ctx.stroke();
      }
      ctx.fillStyle = a.c; ctx.beginPath(); ctx.ellipse(x, fy+3, 12, 7, 0, 0, 7); ctx.fill();
    });
    d.stars.forEach(function(s){
      ctx.fillStyle = s.c; ctx.save(); ctx.translate(s.x*W, fy+4); ctx.rotate(0.4);
      ctx.beginPath();
      for(var i=0;i<5;i++){
        var a1 = i*2*Math.PI/5 - Math.PI/2, a2 = a1 + Math.PI/5;
        ctx.lineTo(Math.cos(a1)*11, Math.sin(a1)*11);
        ctx.lineTo(Math.cos(a2)*4.5, Math.sin(a2)*4.5);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    });
    d.weeds.forEach(function(w){
      var bx = w.x*W, sway = Math.sin(t*1.1 + w.ph), hh = w.h*H;
      ctx.strokeStyle = w.c; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx, fy);
      ctx.quadraticCurveTo(bx + sway*10, fy - hh*0.55, bx + sway*24, fy - hh); ctx.stroke();
    });
    return 0.35;
  }

  function bgSky(t, dt, fy){
    grad([[0,'#4AA8E8'],[0.5,'#8FD0F4'],[0.85,'#D8F0FB'],[1,'#E8F7D8']]);
    var d = D.sky;
    var sx = W*0.84, sy = H*0.14;
    var sg = ctx.createRadialGradient(sx,sy,0,sx,sy,90);
    sg.addColorStop(0,'rgba(255,236,150,.95)'); sg.addColorStop(0.4,'rgba(255,220,110,.5)'); sg.addColorStop(1,'rgba(255,220,110,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx,sy,90,0,7); ctx.fill();
    ctx.fillStyle = '#FFE082'; ctx.beginPath(); ctx.arc(sx,sy,26,0,7); ctx.fill();

    d.bx += d.bdir*1.1*dt;
    if(d.bx > W+180){ d.bdir = -1; d.by = R(0.12,0.4); }
    if(d.bx < -180){ d.bdir = 1;  d.by = R(0.12,0.4); }
    d.birds.forEach(function(b,i){
      var x = d.bx + b.ox*d.bdir, y = d.by*H + b.oy, flap = Math.sin(t*8+i)*5*b.s;
      ctx.strokeStyle = 'rgba(40,60,80,.55)'; ctx.lineWidth = 2*b.s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x-8*b.s, y-flap);
      ctx.quadraticCurveTo(x, y+3*b.s, x+8*b.s, y-flap); ctx.stroke();
    });
    d.clouds.forEach(function(c){
      c.x += c.v*dt*(c.far?0.4:1)/W*60;
      if(c.x > 1.2) c.x = -0.2;
      var x = c.x*W, y = c.y*H, s = c.s*(c.far?0.7:1);
      ctx.fillStyle = 'rgba(255,255,255,' + (c.far?0.5:0.9) + ')';
      [[0,0,34],[26,6,24],[-26,6,24],[10,-12,22],[-12,-10,20]].forEach(function(p){
        ctx.beginPath(); ctx.arc(x+p[0]*s, y+p[1]*s, p[2]*s, 0, 7); ctx.fill();
      });
    });
    [{c:'#7FB069',h:0.16,ph:0},{c:'#5E9C56',h:0.10,ph:2}].forEach(function(hl){
      ctx.fillStyle = hl.c;
      ctx.beginPath(); ctx.moveTo(0,H);
      for(var x=0;x<=W;x+=30) ctx.lineTo(x, H - hl.h*H - Math.sin(x*0.008 + hl.ph)*14);
      ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    });
    d.seeds.forEach(function(s){
      var y = (s.y*H - t*s.v*26) % H; if(y<0) y += H;
      var x = s.x*W + Math.sin(t*0.7 + s.ph)*22;
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
      for(var i=0;i<5;i++){
        var a = i*Math.PI*2/5 + t*0.3;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x + Math.cos(a)*5, y + Math.sin(a)*5); ctx.stroke();
      }
    });
    return 0.12;
  }

  function bgForest(t, dt, fy){
    grad([[0,'#9CCF6A'],[0.4,'#5EA24E'],[1,'#2C5E30']]);
    var d = D.forest;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    d.rays.forEach(function(r,i){
      var bx = r*W + Math.sin(t*0.2 + i)*20;
      var lg = ctx.createLinearGradient(bx,0,bx+60,H);
      lg.addColorStop(0,'rgba(255,250,190,.2)'); lg.addColorStop(1,'rgba(255,250,190,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(bx-18,0); ctx.lineTo(bx+18,0); ctx.lineTo(bx+110,H); ctx.lineTo(bx+20,H); ctx.closePath(); ctx.fill();
    });
    ctx.restore();
    d.trunks.forEach(function(tr){
      var x = tr.x*W, w = tr.w*W;
      ctx.fillStyle = '#5B4230'; ctx.fillRect(x, 0, w, fy+6);
      ctx.fillStyle = 'rgba(60,40,25,.4)'; ctx.fillRect(x + w*0.65, 0, w*0.35, fy+6);
    });
    ctx.fillStyle = 'rgba(35,90,45,.85)';
    for(var x2=0;x2<=W;x2+=60){
      ctx.beginPath(); ctx.arc(x2, -10 + Math.sin(x2)*8, 55 + Math.sin(x2*0.7)*15, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#3A7A38';
    ctx.beginPath(); ctx.moveTo(0,H);
    for(var x3=0;x3<=W;x3+=30) ctx.lineTo(x3, fy-4-Math.sin(x3*0.03)*5);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    d.bushes.forEach(function(b){
      ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x*W, fy+2, b.r*H, Math.PI, 0); ctx.fill();
    });
    d.flowers.forEach(function(f){
      var x = f.x*W, sway = Math.sin(t*1.3 + f.ph)*2;
      ctx.strokeStyle = '#2F6B35'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, fy+4); ctx.lineTo(x+sway, fy-12); ctx.stroke();
      ctx.fillStyle = f.c;
      for(var i=0;i<5;i++){
        var a = i*Math.PI*2/5;
        ctx.beginPath(); ctx.arc(x + sway + Math.cos(a)*4, fy-14 + Math.sin(a)*4, 3, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#FFF59D'; ctx.beginPath(); ctx.arc(x+sway, fy-14, 2.4, 0, 7); ctx.fill();
    });
    d.shrooms.forEach(function(m){
      var x = m.x*W;
      ctx.fillStyle = '#F3E6C8'; ctx.fillRect(x-3, fy-10, 6, 12);
      ctx.fillStyle = '#E05A4A'; ctx.beginPath(); ctx.arc(x, fy-10, 10, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(x-4, fy-14, 1.8, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x+4, fy-13, 1.6, 0, 7); ctx.fill();
    });
    d.leaves.forEach(function(l){
      var y = (l.y*H + t*l.v*30) % H;
      var x = l.x*W + Math.sin(t*1.2 + l.ph)*26;
      ctx.fillStyle = 'rgba(180,220,90,.85)';
      ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*2 + l.ph));
      ctx.beginPath(); ctx.ellipse(0,0,l.r,l.r*0.5,0,0,7); ctx.fill(); ctx.restore();
    });
    return 0.22;
  }

  function bgSpace(t, dt, fy){
    grad([[0,'#050514'],[0.5,'#0D0D30'],[1,'#1A1040']]);
    var d = D.space;
    d.stars.forEach(function(s){
      var tw = 0.4 + Math.sin(t*2 + s.ph)*0.35;
      ctx.fillStyle = 'rgba(255,255,255,' + tw + ')';
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 7); ctx.fill();
    });
    var gx = W*0.2, gy = H*0.22;
    var gg = ctx.createRadialGradient(gx,gy,0,gx,gy,70);
    gg.addColorStop(0,'rgba(200,150,255,.35)'); gg.addColorStop(0.6,'rgba(120,90,220,.15)'); gg.addColorStop(1,'rgba(120,90,220,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(gx,gy,70,34,0.5,0,7); ctx.fill();

    var px = W*0.78, py = H*0.24;
    ctx.fillStyle = '#E8A25C'; ctx.beginPath(); ctx.arc(px,py,34,0,7); ctx.fill();
    ctx.fillStyle = 'rgba(200,120,60,.5)';
    ctx.beginPath(); ctx.arc(px-10,py-6,10,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(px+12,py+10,7,0,7); ctx.fill();
    ctx.strokeStyle = 'rgba(240,220,170,.8)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(px,py,56,14,-0.3,0,7); ctx.stroke();

    if(rnd() < 0.004) shots.push({x:R(0,W), y:R(0,H*0.4), vx:R(3,5), vy:R(1.4,2.4), a:1});
    for(var i=shots.length-1;i>=0;i--){
      var s2 = shots[i];
      s2.x += s2.vx*dt; s2.y += s2.vy*dt; s2.a -= 0.015*dt;
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.max(s2.a,0) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s2.x, s2.y); ctx.lineTo(s2.x - s2.vx*8, s2.y - s2.vy*8); ctx.stroke();
      if(s2.a <= 0) shots.splice(i,1);
    }
    ctx.fillStyle = '#B9BECE';
    ctx.beginPath(); ctx.moveTo(0,H);
    for(var x=0;x<=W;x+=40) ctx.lineTo(x, fy - Math.sin(x*0.02)*5);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    d.craters.forEach(function(c){
      ctx.fillStyle = 'rgba(90,95,115,.55)';
      ctx.beginPath(); ctx.ellipse(c.x*W, fy+8, c.r, c.r*0.4, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(230,235,250,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(c.x*W, fy+8, c.r, c.r*0.4, 0, Math.PI, 0, true); ctx.stroke();
    });
    return 0;
  }

  function bgWinter(t, dt, fy){
    grad([[0,'#5B6FA8'],[0.45,'#94A8D0'],[0.8,'#D7DEF0'],[1,'#EEF2FA']]);
    var d = D.winter;
    var mx = W*0.16, my = H*0.16;
    var mg = ctx.createRadialGradient(mx,my,0,mx,my,70);
    mg.addColorStop(0,'rgba(255,250,220,.9)'); mg.addColorStop(0.4,'rgba(255,250,220,.3)'); mg.addColorStop(1,'rgba(255,250,220,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx,my,70,0,7); ctx.fill();
    ctx.fillStyle = '#FDF6DC'; ctx.beginPath(); ctx.arc(mx,my,22,0,7); ctx.fill();

    ctx.fillStyle = '#C9D6EE';
    ctx.beginPath(); ctx.moveTo(0,H);
    for(var x=0;x<=W;x+=40) ctx.lineTo(x, fy-26-Math.sin(x*0.008+2)*18);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F4F7FD';
    ctx.beginPath(); ctx.moveTo(0,H);
    for(var x2=0;x2<=W;x2+=40) ctx.lineTo(x2, fy - Math.sin(x2*0.012)*10);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

    d.pines.forEach(function(p){
      var x = p.x*W, base = fy-6, s = p.s;
      ctx.fillStyle = '#5B4230'; ctx.fillRect(x-4*s, base-8*s, 8*s, 10*s);
      for(var i=0;i<3;i++){
        var w = (46-i*11)*s, h = 26*s, y = base - 8*s - i*20*s;
        ctx.fillStyle = '#2F6B46';
        ctx.beginPath(); ctx.moveTo(x, y-h); ctx.lineTo(x-w/2, y); ctx.lineTo(x+w/2, y); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.moveTo(x, y-h); ctx.lineTo(x-w*0.28, y-h*0.45); ctx.lineTo(x+w*0.28, y-h*0.45); ctx.closePath(); ctx.fill();
      }
    });

    var hx = W*0.52, hy = fy-4;
    ctx.fillStyle = '#7A5638'; ctx.fillRect(hx-34, hy-40, 68, 40);
    ctx.fillStyle = '#4E3722';
    ctx.beginPath(); ctx.moveTo(hx-44,hy-40); ctx.lineTo(hx,hy-70); ctx.lineTo(hx+44,hy-40); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.moveTo(hx-44,hy-40); ctx.lineTo(hx,hy-70); ctx.lineTo(hx+44,hy-40);
    ctx.lineTo(hx+38,hy-40); ctx.lineTo(hx,hy-63); ctx.lineTo(hx-38,hy-40); ctx.closePath(); ctx.fill();
    var glow = 0.75 + Math.sin(t*3)*0.15;
    ctx.fillStyle = 'rgba(255,205,90,' + glow + ')'; ctx.fillRect(hx-12, hy-28, 24, 18);
    ctx.strokeStyle = '#4E3722'; ctx.lineWidth = 2;
    ctx.strokeRect(hx-12, hy-28, 24, 18);
    ctx.beginPath(); ctx.moveTo(hx, hy-28); ctx.lineTo(hx, hy-10);
    ctx.moveTo(hx-12, hy-19); ctx.lineTo(hx+12, hy-19); ctx.stroke();
    for(var i2=0;i2<3;i2++){
      var sy2 = hy - 74 - i2*16 - ((t*12) % 16);
      ctx.fillStyle = 'rgba(230,230,240,' + (0.4 - i2*0.1) + ')';
      ctx.beginPath(); ctx.arc(hx + 26 + Math.sin(t+i2)*4, sy2, 6 + i2*2, 0, 7); ctx.fill();
    }
    d.snow.forEach(function(s){
      var y = (s.y*H + t*s.v*36) % H;
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(s.x*W + Math.sin(t*0.8 + s.ph)*14, y, s.r, 0, 7); ctx.fill();
    });
    return 0.10;
  }

  var BG = { sea:bgSea, sky:bgSky, forest:bgForest, space:bgSpace, winter:bgWinter };
  var FOOD = {
    sea:   ['#F4B04C','#C07F28'], sky:   ['#FFD54F','#C9A227'], forest:['#A1701F','#6F4A10'],
    space: ['#E6EE9C','#9AA23C'], winter:['#FFAB91','#C26A4A']
  };

  /* 그림 친구 렌더 — 스쿼시·기울임으로 살아있는 느낌 */
  function drawBeing(b, t){
    var sy = 1, tilt = 0;
    if(b.mode==='swim'){ tilt = Math.sin(t*b.freq*2 + b.ph)*0.07; sy = 1 + Math.sin(t*4 + b.ph)*0.03; }
    else if(b.mode==='fly'){ tilt = Math.sin(t*b.freq + b.ph)*0.06; sy = 1 + Math.sin(t*9 + b.ph)*0.10; }
    else if(b.mode==='hop'){ sy = b.vy < -0.5 ? 1.08 : (Math.abs(b.vy) < 0.01 ? 0.96 : 1); tilt = b.vy*0.02; }
    else if(b.mode==='float'){ tilt = b.rot; sy = 1 + Math.sin(t*2 + b.ph)*0.03; }

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(tilt * (b.scare>0 ? 2 : 1));
    ctx.scale(b.dir * b.face, sy);
    if(b.sprite) ctx.drawImage(b.sprite, -b.w/2, -b.h/2, b.w, b.h);
    ctx.restore();

    if(b.name){
      ctx.font = "600 12px 'Gowun Dodum', sans-serif";
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3;
      ctx.strokeText(b.name, b.x, b.y + b.h/2 + 16);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fillText(b.name, b.x, b.y + b.h/2 + 16);
    }
  }

  /* ══ 루프 ══ */
  var last = performance.now();
  function frame(now){
    var dt = Math.min((now-last)/16.7, 3); last = now;
    var t = now/1000;
    var stageId = run.stage(), st = LS.findStage(stageId);
    var fy = LS.floorOf(stageId, H);

    ctx.clearRect(0,0,W,H);
    var vig = BG[stageId](t, dt, fy);

    var pel = run.pellets;
    pel.step(dt, fy, t);
    var food = FOOD[stageId];
    pel.list().forEach(function(p){
      ctx.fillStyle = food[0]; ctx.strokeStyle = food[1]; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7); ctx.fill(); ctx.stroke();
    });

    var env = { t:t, dt:dt, W:W, H:H, floorY:fy, pellets:pel.list(),
                onEat: function(p, b){ pel.remove(p); pops.push({x:b.x, y:b.y, r:4, a:1}); } };

    run.beings().forEach(function(b){
      LS.stepBeing(b, env);
      drawBeing(b, t);
      if(st.bubbles && rnd() < 0.01) bubbles.push({x:b.x + b.dir*b.w/2, y:b.y, r:2+rnd()*3, v:0.5+rnd()});
    });

    for(var i=pops.length-1;i>=0;i--){
      var p2 = pops[i]; p2.r += 0.8*dt; p2.a -= 0.05*dt;
      ctx.strokeStyle = 'rgba(255,220,120,' + Math.max(p2.a,0) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p2.x, p2.y, p2.r, 0, 7); ctx.stroke();
      if(p2.a <= 0) pops.splice(i,1);
    }

    if(st.bubbles){
      if(rnd() < 0.06) bubbles.push({x:rnd()*W, y:fy-4, r:2+rnd()*4, v:0.4+rnd()*0.8});
      for(var j=bubbles.length-1;j>=0;j--){
        var b2 = bubbles[j];
        b2.y -= b2.v*dt; b2.x += Math.sin(b2.y*0.05)*0.3;
        ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(b2.x, b2.y, b2.r, 0, 7); ctx.stroke();
        if(b2.y < -10) bubbles.splice(j,1);
      }
    }

    vignette(vig);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  tally();
})();
</script>

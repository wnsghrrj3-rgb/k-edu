<!-- P1 = 대칭 변환 + 정다각형/테셀레이션 순수 기하만(렌더 0줄, P1 게이트). P2에서 2D canvas
     낙서-대칭 복제·나비/만다라·바닥 깔기 렌더 증축. 순수 로직엔 THREE·DOM·canvas 참조 0.
     대칭·내각·테셀레이션 판정은 표준 기하(수치 창작 아님) — 내각=(n-2)·180/n 등. -->
<style>
  :root{ --ink:#eef0ff; --sub:#9aa0c8; --panel:rgba(14,16,30,.82); --line:rgba(255,255,255,.1);
         --bell:#7c8cff; --leaf:#5ad1a0; --petal:#ff8fab; --wing:#ffd166; --water:#5ec8ff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0c18;color:var(--ink);
    font-family:'Gowun Dodum',system-ui,sans-serif;touch-action:none}
  #stage{position:fixed;inset:0}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0c18;color:var(--sub);font-size:15px;z-index:50}
  #loading.hide{display:none}
  #brand{position:fixed;top:12px;left:16px;z-index:20;font-family:'Jua';font-size:17px}
  #brand .k{color:var(--bell)}
  #back{position:fixed;top:14px;right:16px;z-index:20;font-size:12.5px;color:var(--sub);

  #hud{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:19;font-size:13px;color:var(--sub);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 15px;backdrop-filter:blur(6px);
    display:flex;gap:12px;align-items:center;white-space:nowrap}
  #hud b{font-family:'Jua';color:var(--ink)}
  #hud .leaf{color:var(--leaf)}
  #tip{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:18;font-size:13.5px;color:var(--ink);
    background:rgba(14,16,30,.78);border:1px solid var(--line);border-radius:12px;padding:8px 15px;
    pointer-events:none;transition:opacity .3s;text-align:center;max-width:88vw}
  #tip.hide{opacity:0}
  #sound{position:fixed;top:14px;right:96px;z-index:20;font-size:15px;background:var(--panel);

  #ctl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:7px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px;backdrop-filter:blur(8px);

  #ctl button{font-family:'Jua';font-size:14px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;transition:.14s}
  #ctl button:active{transform:scale(.93)}

  #poly{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:22;display:none;gap:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;backdrop-filter:blur(6px)}
  #poly.show{display:flex}

    border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;transition:.14s}
  #poly button.on{background:var(--wing);color:#3a2c00;border-color:var(--wing)}
</style>

<body>

<!-- ═══════════════════════════════════════════════════════════════════════
     순수 로직 — KShape 대칭·정다각형·테셀레이션 (MATHLAB 설계 §도형 정원). THREE·DOM 참조 0.
     reflectX/Y: 축 반사(거울 나비). rotate/mandala: 회전 대칭(만다라).
     interiorAngle/canTessellate: 정다각형 내각·바닥 깔기 판정(표준 기하).
       한 정다각형만으로 규칙 테셀레이션 ⟺ (n−2)가 4의 약수 ⟺ n∈{3,4,6}.
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="shape-pure">
(function (root, factory) {
  const API = factory();
  if (typeof window !== 'undefined') window.KShape = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(this, function () {
  'use strict';

  /* ── 확정 상수 (§도형 정원) ── */
  const FULL = 360;                 // 한 꼭짓점 둘레(도)
  const POLYS = [3, 4, 5, 6];       // 정삼각·정사각·정오각·정육각 (바닥 깔기 대상)

  /* ── 결정론 rng (mulberry32) ── */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function deg2rad(d) { return d * Math.PI / 180; }

  /* ── ★대칭 변환 (거울 나비) ── */
  function reflectX(pt, axisX) { return { x: 2 * axisX - pt.x, y: pt.y }; }   // 세로축(x=axisX) 반사
  function reflectY(pt, axisY) { return { x: pt.x, y: 2 * axisY - pt.y }; }   // 가로축(y=axisY) 반사
  function reflectPath(path, axisX) {                                          // 경로 전체를 세로축 반사
    const out = [];
    for (let i = 0; i < path.length; i++) out.push(reflectX(path[i], axisX));
    return out;
  }

  /* ── ★회전 대칭 (만다라) ── */
  function rotate(pt, cx, cy, angleDeg) {
    const a = deg2rad(angleDeg), dx = pt.x - cx, dy = pt.y - cy;
    const c = Math.cos(a), s = Math.sin(a);
    return { x: cx + dx * c - dy * s, y: cy + dx * s + dy * c };
  }
  function mandala(path, cx, cy, n) {                                          // n방향 회전 복제 → n개 경로
    const step = FULL / n, arms = [];
    for (let k = 0; k < n; k++) {
      const arm = [];
      for (let i = 0; i < path.length; i++) arm.push(rotate(path[i], cx, cy, step * k));
      arms.push(arm);
    }
    return arms;
  }

  /* ── 정다각형 기하 (표준 공식) ── */
  function interiorAngle(n) { return (n - 2) * 180 / n; }   // 한 내각
  function exteriorAngle(n) { return FULL / n; }            // 한 외각
  function angleSum(n)      { return (n - 2) * 180; }        // 내각의 합

  /* ── ★바닥 깔기(테셀레이션) 판정 ──
     한 종류 정다각형만으로 한 꼭짓점을 빈틈·겹침 없이 채우려면 내각이 360을 나눠야 함.
     360 / interiorAngle = 2n/(n−2) 가 정수 ⟺ (n−2) | 4 ⟺ n ∈ {3,4,6}. */
  function canTessellate(n) { return n >= 3 && (4 % (n - 2)) === 0; }
  function verticesAround(n) {                               // 한 꼭짓점에 몇 개 붙고 얼마 남나
    const ang = interiorAngle(n);
    const count = Math.floor(FULL / ang + 1e-9);
    const gap = +(FULL - count * ang).toFixed(6);            // 남는 각(틈). 0이면 딱 맞음
    return { count: count, gap: gap, exact: gap === 0 };
  }

  /* ── 정n각형 꼭짓점 좌표 (P2 렌더가 소비) ── */
  function polygonVertices(n, cx, cy, r, rotDeg) {
    const pts = [], base = (rotDeg || 0) - 90;               // -90 = 꼭짓점 하나를 위로
    for (let i = 0; i < n; i++) {
      const a = deg2rad(base + (FULL / n) * i);
      pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
    }
    return pts;
  }

  /* ── 결정론 도형 생성 ── */
  function genPolygon(rng) {                                 // 바닥 깔기용 랜덤 정다각형
    const n = POLYS[Math.floor(rng() * POLYS.length)];
    return { n: n, tess: canTessellate(n), around: verticesAround(n), interior: interiorAngle(n) };
  }
  function genMandalaArms(rng) {                             // 만다라 팔 수(4·5·6·8)
    const opts = [4, 5, 6, 8];
    return opts[Math.floor(rng() * opts.length)];
  }

  /* ── 방·시나리오 스키마 (P3에서 소비) ── */
  const SCENARIOS = {
    'S-1': { title: '거울 나비', desc: '한쪽에 그리면 거울처럼 대칭이 따라 그려져요',   mode: 'mirror' },
    'S-2': { title: '만다라',    desc: '가운데를 중심으로 여러 방향이 함께 돌아요',        mode: 'mandala' },
    'S-3': { title: '바닥 깔기', desc: '어떤 도형이 빈틈 없이 바닥을 채울까요?',           mode: 'tessellate', wow: true }
  };
  // ★와우: 정오각형만 바닥이 안 깔림(내각 108 → 360÷108 정수 아님 → 틈)
  const WOW_TESS = {
    q: '정오각형만 바닥을 빈틈 없이 못 깔아요. 왜 그럴까요?',
    options: ['한 내각(108°)이 360°를 딱 나누지 못해서', '오각형이 너무 커서', '색이 달라서'],
    answer: 0,
    explain: '한 꼭짓점에 도형을 붙이면 내각이 모여 360°가 돼야 빈틈이 없어요. 정삼각형(60°)·정사각형(90°)·정육각형(120°)은 360°를 딱 나누지만, 정오각형은 108°라 세 개면 324°(36° 틈), 네 개면 432°(넘침) — 그래서 틈이 생겨요.'
  };

  return {
    // 상수
    FULL, POLYS,
    // 유틸
    mulberry32, clamp, deg2rad,
    // 대칭
    reflectX, reflectY, reflectPath,
    // 회전
    rotate, mandala,
    // 정다각형·테셀레이션
    interiorAngle, exteriorAngle, angleSum, canTessellate, verticesAround, polygonVertices,
    // 생성
    genPolygon, genMandalaArms,
    // 스키마
    SCENARIOS, WOW_TESS
  };
});
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     P2 렌더 어댑터 — 2D canvas 도형 정원(거울 나비·만다라·바닥 깔기). 순수 KShape 조회만(기하 0줄).
     mirror: 낙서 → reflectPath로 세로축 대칭 실시간 복제. mandala: mandala()로 n방향 회전 복제.
     tessellate: polygonVertices/verticesAround/canTessellate로 한 꼭짓점 둘레 배치 + 틈(물) 표시.
     운명의 방/수 공장 P2 패턴(2D canvas + window.__SHAPE_P2__ 훅 + instant 경로) 승계. ═══ -->
<script>
(function(){
  'use strict';
  var K = window.KShape;
  var C = { ink:'#eef0ff', sub:'#9aa0c8', bell:'#7c8cff', leaf:'#5ad1a0',
            petal:'#ff8fab', wing:'#ffd166', water:'#5ec8ff', line:'rgba(255,255,255,.10)' };

  var stage = document.getElementById('stage');
  var cv = document.createElement('canvas'); cv.id = 'board'; stage.appendChild(cv);
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, geo = {};

  // ── 상태 ──
  var mode = 'mirror';              // mirror | mandala | tessellate
  var arms = 6;                     // 만다라 팔 수
  var polyN = 4;                    // 바닥 깔기 도형(정n각형)
  var strokes = [], cur = null;     // 낙서 경로들 + 진행 중 경로
  var garden = 0;                   // 정원에 심은 작품 수
  var soundOn = true, looping = false, drawing = false;

  // ── 레이아웃 ──
  function layout(){
    geo.cx = W / 2; geo.cy = H * 0.46;
    geo.axisX = geo.cx;                                // 거울 세로선
    geo.unit = K.clamp(Math.min(W, H) * 0.09, 40, 96); // 타일 변 길이
  }

  // ── 렌더 ──
  function draw(){
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    if (mode === 'mirror') drawMirror();
    else if (mode === 'mandala') drawMandala();
    else drawTess();
  }
  function strokePath(pts, color, w){
    if (!pts || pts.length < 1) return;
    ctx.strokeStyle = color; ctx.lineWidth = w || 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++){ if (i === 0) ctx.moveTo(pts[i].x, pts[i].y); else ctx.lineTo(pts[i].x, pts[i].y); }
    if (pts.length === 1){ ctx.arc(pts[0].x, pts[0].y, (w||4)/2, 0, 6.2832); ctx.fill && (ctx.fillStyle = color, ctx.fill()); }
    ctx.stroke();
  }
  function allStrokes(){ var a = strokes.slice(); if (cur && cur.length) a.push(cur); return a; }

  function drawMirror(){
    // 거울선
    ctx.save(); ctx.strokeStyle = 'rgba(124,140,255,.35)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(geo.axisX, 40); ctx.lineTo(geo.axisX, H - 40); ctx.stroke(); ctx.restore();
    var list = allStrokes();
    for (var i = 0; i < list.length; i++){
      strokePath(list[i], C.petal, 5);                             // 원본
      strokePath(K.reflectPath(list[i], geo.axisX), C.bell, 5);     // ★세로축 대칭(조회만)
    }
  }
  function drawMandala(){
    // 중심
    ctx.fillStyle = 'rgba(124,140,255,.5)'; ctx.beginPath(); ctx.arc(geo.cx, geo.cy, 3.5, 0, 6.2832); ctx.fill();
    var list = allStrokes();
    for (var i = 0; i < list.length; i++){
      var petals = K.mandala(list[i], geo.cx, geo.cy, arms);        // ★n방향 회전 복제(조회만)
      for (var k = 0; k < petals.length; k++){
        strokePath(petals[k], k % 2 ? C.wing : C.petal, 4.5);
      }
    }
  }
  function drawTess(){
    var info = K.verticesAround(polyN), can = K.canTessellate(polyN), interior = K.interiorAngle(polyN);
    var vx = geo.cx, vy = geo.cy + geo.unit * 0.3, s = geo.unit;
    // count개 정다각형을 공유 꼭짓점(vx,vy) 둘레에 부채꼴 배치
    for (var kk = 0; kk < info.count; kk++){
      var startDeg = -90 + kk * interior;
      var poly = polyWalk(polyN, vx, vy, s, startDeg);
      fillPoly(poly, can ? 'rgba(124,140,255,.28)' : 'rgba(255,209,102,.26)', can ? C.bell : C.wing);
    }
    // 남는 틈(gap>0) = 물이 새는 곳
    if (info.gap > 0.001){
      var gs = -90 + info.count * interior;
      ctx.save(); ctx.fillStyle = 'rgba(94,200,255,.5)';
      ctx.beginPath(); ctx.moveTo(vx, vy);
      ctx.arc(vx, vy, s * 0.9, K.deg2rad(gs), K.deg2rad(gs + info.gap));
      ctx.closePath(); ctx.fill(); ctx.restore();
      // 물방울
      ctx.fillStyle = C.water; ctx.beginPath();
      var md = K.deg2rad(gs + info.gap / 2);
      ctx.arc(vx + s * 0.6 * Math.cos(md), vy + s * 0.6 * Math.sin(md), 5, 0, 6.2832); ctx.fill();
    }
    // 공유 꼭짓점
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(vx, vy, 4, 0, 6.2832); ctx.fill();
  }
  // 정n각형 turtle 워크 — 첫 꼭짓점=(vx,vy), 변길이 s, 시작 방향 startDeg (렌더용 좌표, K.exteriorAngle 조회)
  function polyWalk(n, vx, vy, s, startDeg){
    var ext = K.exteriorAngle(n), pts = [], x = vx, y = vy, h = startDeg;
    for (var i = 0; i < n; i++){
      pts.push({ x: x, y: y });
      x += s * Math.cos(K.deg2rad(h)); y += s * Math.sin(K.deg2rad(h)); h += ext;
    }
    return pts;
  }
  function fillPoly(pts, fill, stroke){
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++){ if (i === 0) ctx.moveTo(pts[i].x, pts[i].y); else ctx.lineTo(pts[i].x, pts[i].y); }
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();
  }

  // ── 루프 ──
  function raf(fn){ (window.requestAnimationFrame || function(f){ return setTimeout(f, 16); })(fn); }
  function ensureLoop(){ if (!looping){ looping = true; raf(frame); } }
  function frame(){ draw(); looping = false; }   // 이벤트 구동(정적 씬) — 변경 시 draw

  // ── 사운드 ──
  var actx = null, master = null, lastDraw = 0;
  function ensureAudio(){ if (actx) return;
    try { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC(); master = actx.createGain(); master.gain.value = 0.14; master.connect(actx.destination);
    } catch(e){ actx = null; } }
  function blip(){
    if (!soundOn || !actx) return;
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (now - lastDraw < 45) return; lastDraw = now;
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.value = 620 + Math.random() * 260;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.09);
  }
  function chime(){
    if (!soundOn || !actx) return;
    [587, 740, 880, 1175].forEach(function(f, i){
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.06;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.55);
    });
  }

  // ── HUD·팁 ──
  function updHud(){ var e = document.getElementById('hGarden'); if (e) e.textContent = garden; }
  function tip(t){ var e = document.getElementById('tip'); if (e){ e.textContent = t; e.classList.remove('hide'); } }

  // ── 조작 API ──
  function setMode(m){
    mode = (m === 'mandala' || m === 'tessellate') ? m : 'mirror';
    strokes = []; cur = null;
    syncBtns();
    var poly = document.getElementById('poly'); if (poly) poly.classList.toggle('show', mode === 'tessellate');
    tip(mode === 'mirror' ? '한쪽에 그리면 거울처럼 반대쪽이 따라 그려져요. 🌱로 정원에 심어요.'
      : mode === 'mandala' ? '가운데를 중심으로 여러 방향이 함께 돌아요. 팔 수를 바꿔 보세요!'
      : '어떤 도형이 빈틈 없이 바닥을 채울까요? 도형을 눌러 확인해요.');
    if (mode === 'tessellate') tessTip();
    draw(); 
  }
  function tessTip(){
    var info = K.verticesAround(polyN), can = K.canTessellate(polyN);
    tip(can ? ('정' + hangul(polyN) + '각형: 한 꼭짓점에 ' + info.count + '개가 모여 360°를 딱 채워요 — 빈틈 없어요!')
            : ('정' + hangul(polyN) + '각형: ' + info.count + '개 모으면 ' + info.gap + '° 틈이 남아 물이 새요.'));
  }
  function hangul(n){ return ({3:'삼',4:'사',5:'오',6:'육'})[n] || (n+''); }
  function setArms(n){ arms = K.clamp(n | 0, 3, 12); draw(); }
  function setPoly(n){ polyN = (K.POLYS.indexOf(n) >= 0) ? n : polyN; syncPoly(); tessTip(); draw(); }
  function addStroke(pts){ if (pts && pts.length){ strokes.push(pts.slice()); draw(); } }  // 테스트/딥링크용
  function clear(){ strokes = []; cur = null; draw(); tip('깨끗해졌어요. 다시 그려 봐요.'); }
  function plant(){
    if (mode === 'tessellate'){ garden += 1; ensureAudio(); chime(); updHud(); tip('🧩 바닥 무늬를 정원에 심었어요!'); return; }
    if (!strokes.length){ tip('먼저 그림을 그려 주세요!'); return; }
    garden += 1; ensureAudio(); chime(); updHud();
    tip(mode === 'mirror' ? '🦋 대칭 나비를 정원에 심었어요!' : '❄️ 만다라 꽃을 정원에 심었어요!');
    strokes = []; cur = null; draw();
  }

  // ── 입력(낙서) ──
  function pt(ev){
    var rect = cv.getBoundingClientRect();
    var cx = ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0] && ev.touches[0].clientX);
    var cy = ev.clientY != null ? ev.clientY : (ev.touches && ev.touches[0] && ev.touches[0].clientY);
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(ev){ if (mode === 'tessellate') return; ensureAudio(); drawing = true; cur = [pt(ev)]; draw(); }
  function onMove(ev){ if (!drawing || mode === 'tessellate') return; cur.push(pt(ev)); blip(); draw(); }
  function onUp(){ if (drawing && cur && cur.length){ strokes.push(cur); } drawing = false; cur = null; draw(); }

  // ── 버튼 배선 ──
  function syncBtns(){ tog('bMirror', mode==='mirror'); tog('bMandala', mode==='mandala'); tog('bTess', mode==='tessellate'); }
  function tog(id, on){ var b = document.getElementById(id); if (b) b.classList[on?'add':'remove']('on'); }
  function syncPoly(){
    var poly = document.getElementById('poly'); if (!poly) return;
    var bs = poly.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', parseInt(bs[i].getAttribute('data-n'), 10) === polyN);
  }
  function on(id, fn){ var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function bind(){
    on('bMirror', function(){ setMode('mirror'); });
    on('bMandala', function(){ setMode('mandala'); });
    on('bTess', function(){ setMode('tessellate'); });
    on('bClear', function(){ clear(); });
    on('bPlant', function(){ plant(); });
    on('sound', function(){ soundOn = !soundOn; var s = document.getElementById('sound'); if (s) s.textContent = soundOn?'🔊':'🔇'; });
    // 바닥 깔기 도형 선택 바(동적)
    var poly = document.createElement('div'); poly.id = 'poly';
    [3,4,5,6].forEach(function(n){
      var b = document.createElement('button'); b.setAttribute('data-n', n);
      b.textContent = ({3:'△ 삼각',4:'▢ 사각',5:'⬠ 오각',6:'⬡ 육각'})[n];
      b.addEventListener('click', function(){ setPoly(n); });
      poly.appendChild(b);
    });
    document.body.appendChild(poly);
    syncPoly();
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  // ── 초기화·리사이즈 ──
  function onResize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth || 1024; H = window.innerHeight || 768;
    cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px';
    if (ctx && ctx.setTransform) ctx.setTransform(DPR,0,0,DPR,0,0);
    layout(); draw();
  }
  function init(){
    onResize(); window.addEventListener('resize', onResize); bind(); syncBtns();
    var l = document.getElementById('loading'); if (l) l.classList.add('hide');
    // 딥링크 ?mode=&arms=&poly=
    try { var q = new URLSearchParams(location.search);
      if (q.get('arms')) arms = K.clamp(parseInt(q.get('arms'),10), 3, 12);
      if (q.get('poly')) { var pn = parseInt(q.get('poly'),10); if (K.POLYS.indexOf(pn)>=0) polyN = pn; }
      if (q.get('mode')) setMode(q.get('mode'));
    } catch(e){}
    draw();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  // ── 훅(스모크·P3용) ──
  window.__SHAPE_P2__ = {
    get mode(){ return mode; }, get arms(){ return arms; }, get polyN(){ return polyN; },
    get strokeCount(){ return strokes.length; }, get garden(){ return garden; },
    get tessInfo(){ var i = K.verticesAround(polyN); return { n: polyN, can: K.canTessellate(polyN), count: i.count, gap: i.gap, exact: i.exact }; },
    K: K, setMode: setMode, setArms: setArms, setPoly: setPoly, addStroke: addStroke, clear: clear, plant: plant
  };
})();
</script>

<!-- ═══ P3 미션 레이어 — 시나리오(S-1/S-2/S-3)·★바닥 깔기 예측카드·정오각형 틈 창발·정원 누적·학년칸.
     __SHAPE_P2__ 훅만 소비(순수·P2 렌더 0줄 변경). DOM 오버레이만 추가. 수 공장 p3 패턴 승계. ═══ -->
<script id="shape-p3">
(function(){
  'use strict';
  var H = window.__SHAPE_P2__;
  if (!H) return;
  var K = H.K;

  var grade = 'mid';
  try{
    var g = (new URLSearchParams(location.search).get('grade') || '').toLowerCase();
    if (g === 'low' || g === '저' || g === '1') grade = 'low';
    else if (g === 'high' || g === '고' || g === '3') grade = 'high';
  }catch(e){}

  var scene = 'S-1';
  var seen = {}, lastPick = -1, lastAnswer = -1;

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  // ── 스타일(수 공장 p3 톤 승계) ──
  var css = el('style');
  css.textContent =
    '#p3-scene{position:fixed;top:88px;left:50%;transform:translateX(-50%);z-index:21;display:flex;gap:6px;' +
      'flex-wrap:wrap;justify-content:center;max-width:94vw}' +
    '.p3-pill{font-family:\'Jua\';font-size:12.5px;color:var(--sub);background:var(--panel);' +
      'border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;transition:.14s;backdrop-filter:blur(6px)}' +
    '.p3-pill:active{transform:scale(.94)}' +
    '.p3-pill.on{background:var(--bell);color:#0a0c18;border-color:var(--bell)}' +
    '#p3-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;' +
      'background:rgba(6,7,16,.72);backdrop-filter:blur(4px);padding:20px}' +
    '#p3-modal.show{display:flex}' +
    '.p3-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px;' +
      'max-width:400px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}' +
    '.p3-q{font-family:\'Jua\';font-size:17px;color:var(--ink);line-height:1.5;margin-bottom:16px}' +
    '.p3-opt{display:block;width:100%;font-family:\'Gowun Dodum\',sans-serif;font-size:14.5px;color:var(--ink);' +
      'background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:13px;padding:13px 14px;' +
      'margin:8px 0;cursor:pointer;transition:.14s;text-align:left}' +
    '.p3-opt:active{transform:scale(.98)}' +
    '.p3-opt:hover{background:rgba(124,140,255,.16);border-color:var(--bell)}' +
    '#p3-wow{position:fixed;top:120px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:40;' +
      'max-width:90vw;background:linear-gradient(135deg,rgba(124,140,255,.95),rgba(90,104,220,.95));color:#0a0c18;' +
      'border-radius:15px;padding:13px 18px;font-size:13.5px;line-height:1.55;box-shadow:0 16px 44px rgba(60,72,180,.5);' +
      'opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;text-align:center}' +
    '#p3-wow.show{opacity:1;transform:translateX(-50%) translateY(0)}' +
    '#p3-wow b{font-family:\'Jua\'}';
  document.head.appendChild(css);

  // ── 시나리오 배너 ──
  var SCN = [
    { id:'S-1', label:'🦋 거울 나비', mode:'mirror' },
    { id:'S-2', label:'❄️ 만다라', mode:'mandala' },
    { id:'S-3', label:'🧩 바닥 깔기 ★', mode:'tessellate' }
  ];
  var scene_el = el('div'); scene_el.id = 'p3-scene';
  SCN.forEach(function(s){
    var p = el('button', 'p3-pill', s.label);
    p.setAttribute('data-scn', s.id);
    p.addEventListener('click', function(){ setScene(s.id); });
    scene_el.appendChild(p);
  });
  document.body.appendChild(scene_el);

  // ── 예측카드 모달 ──
  var modal = el('div'); modal.id = 'p3-modal';
  var card = el('div', 'p3-card');
  var qEl = el('div', 'p3-q', '');
  var optBox = el('div');
  card.appendChild(qEl); card.appendChild(optBox);
  modal.appendChild(card);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeCard(); });
  document.body.appendChild(modal);

  // ── 창발 배너 ──
  var wow = el('div'); wow.id = 'p3-wow'; document.body.appendChild(wow);
  var wowTimer = null;
  function flashWow(html, ms){
    wow.innerHTML = html; wow.classList.add('show');
    if (wowTimer) clearTimeout(wowTimer);
    wowTimer = setTimeout(function(){ wow.classList.remove('show'); }, ms || 6000);
  }
  function hideWow(){ wow.classList.remove('show'); if (wowTimer) clearTimeout(wowTimer); }

  // ── 예측카드(바닥 깔기 = WOW_TESS) ──
  function openCard(){
    lastAnswer = K.WOW_TESS.answer;
    qEl.innerHTML = K.WOW_TESS.q; optBox.innerHTML = '';
    K.WOW_TESS.options.forEach(function(opt, i){
      var b = el('button', 'p3-opt', opt);
      b.addEventListener('click', function(){ pick(i); });
      optBox.appendChild(b);
    });
    modal.classList.add('show');
  }
  function closeCard(){ modal.classList.remove('show'); }
  function pick(i){
    lastPick = i; seen[scene] = true; closeCard();
    H.setPoly(5);                                     // 오각형으로 이동 → 틈 즉시 보임
    var hit = (i === K.WOW_TESS.answer);
    var head = (hit ? '🧩 맞혔어요! ' : '🧩 ') + '정오각형만 빈틈이 남아요';
    var body = (grade === 'low')
      ? '정오각형은 세 개를 모아도 <b>36°</b> 틈이 남아 물이 새요. 삼각형·사각형·육각형은 딱 맞아요!'
      : K.WOW_TESS.explain;
    flashWow('<b>' + head + '</b><br>' + body, 8000);
  }

  // ── 시나리오 전환 ──
  function setScene(s){
    scene = s; hideWow();
    var pills = scene_el.querySelectorAll('.p3-pill');
    for (var i = 0; i < pills.length; i++)
      pills[i].classList.toggle('on', pills[i].getAttribute('data-scn') === s);
    var sc = SCN.filter(function(x){ return x.id === s; })[0];
    H.setMode(sc.mode);
    if (s === 'S-3' && !seen[s]) openCard();          // 첫 진입 = 예측카드
  }

  // ── 정원 심기 창발(작품 누적 렌즈) ──
  function onPlant(){
    var head = scene === 'S-1' ? '🦋 대칭 나비가 날아올랐어요' : scene === 'S-2' ? '❄️ 만다라 꽃이 피었어요' : '🧩 바닥 무늬를 심었어요';
    flashWow('<b>' + head + '</b><br>정원에 <b>' + H.garden + '번째</b> 작품이 쌓였어요!', 5000);
  }

  // ── 인터셉트: 심기(창발) · 바닥 깔기 도형 선택(틈 재확인) ──
  var bp = $('bPlant');
  if (bp) bp.addEventListener('click', function(){
    // P2 plant 먼저 실행되게(캡처 아님) → 이후 창발
    setTimeout(onPlant, 0);
  }, false);
  var poly = $('poly');
  if (poly) poly.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
    setTimeout(function(){
      var t = H.tessInfo;
      if (!t.can) flashWow('<b>🧩 정' + hangul(t.n) + '각형은 틈이 남아요</b><br>' + t.count + '개를 모아도 <b>' + t.gap + '°</b>가 부족해 물이 새요.', 6000);
      else hideWow();
    }, 0);
  }, false);
  function hangul(n){ return ({3:'삼',4:'사',5:'오',6:'육'})[n] || (n+''); }

  // ── 초기 진입 ──
  function boot(){
    try{
      var qs = new URLSearchParams(location.search);
      var sc = (qs.get('scenario') || qs.get('scene') || '').toUpperCase();
      if (sc === 'S-1' || sc === 'S-2' || sc === 'S-3'){ setScene(sc); return; }
    }catch(e){}
    setScene(grade === 'low' ? 'S-1' : grade === 'high' ? 'S-3' : 'S-2');
  }
  boot();

  // ── 훅(P3 스모크) ──
  window.__SHAPE_P3__ = {
    get scene(){ return scene; }, get grade(){ return grade; },
    get cardSeen(){ return !!seen[scene]; }, get lastPick(){ return lastPick; }, get lastAnswer(){ return lastAnswer; },
    get wowShown(){ return wow.classList.contains('show'); }, get garden(){ return H.garden; }, H: H,
    setScene: setScene, openCard: openCard, closeCard: closeCard, pick: pick, onPlant: onPlant
  };
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>케이랩 · 빛 실험실 «꺾이고, 모이고, 갈라진다»</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:'Gowun Dodum',system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{display:block}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#8b949e;z-index:50}
  #loading.hide{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">빛 실험실 준비 중…</div>

<!-- 하단 트레이 + HUD(P2 · runreal이 잡도록 순수로직 앞에 배치) -->
<div id="tray"></div>
<div id="hud"></div>
<div id="hint">소자를 골라 광학대에 놓아 봐요. 놓인 소자를 탭하면 15°씩 돌아가요.</div>
<style>
  :root{--blue:#5B9BF0;--hudline:rgba(255,255,255,.12)}
  #tray{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(10,13,18,.92),rgba(10,13,18,0));z-index:30}
  #tray button{min-width:64px;padding:9px 10px;border:1px solid var(--hudline);border-radius:14px;
    background:rgba(28,34,44,.82);color:#e6edf3;font-family:inherit;font-size:12px;line-height:1.35;cursor:pointer;text-align:center;transition:transform .1s,background .15s}
  #tray button .ic{font-size:20px;display:block;margin-bottom:2px}
  #tray button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  #tray button.reset{background:rgba(60,30,30,.7)}
  #hud{position:fixed;top:12px;left:0;right:0;text-align:center;color:#cdd6e0;font-size:13px;z-index:25;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #hint{position:fixed;top:38px;left:0;right:0;text-align:center;color:#9fb0c2;font-size:12px;z-index:25;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .hide{display:none!important}
  #mBtn{position:fixed;top:12px;right:12px;z-index:35;padding:9px 15px;border:1px solid var(--hudline);border-radius:14px;
    background:rgba(28,34,44,.9);color:#e6edf3;font-family:inherit;font-size:14px;cursor:pointer}
  #mBanner{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:34;display:flex;align-items:center;gap:12px;
    max-width:min(92vw,520px);padding:11px 14px;border-radius:16px;background:rgba(20,26,36,.94);border:1px solid var(--blue);
    box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #mBanner #mbIcon{font-size:26px}
  #mBanner #mbTitle{font-size:15px;font-weight:700;color:#fff}
  #mBanner #mbHint{font-size:12px;color:#9fb0c2;margin-top:2px}
  #mBanner #mbClose{margin-left:auto;background:none;border:0;color:#8b949e;font-size:18px;cursor:pointer}
  #mHome,#mPredict,#mClear{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(8,11,16,.72);padding:20px}
  .mcard{background:#161c26;border:1px solid var(--hudline);border-radius:20px;padding:22px;max-width:min(92vw,440px);width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.6)}
  .mcard h2{margin:0 0 14px;font-size:19px;text-align:center}
  .mItem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px;
    border:1px solid var(--hudline);border-radius:14px;background:rgba(30,37,48,.7);color:#e6edf3;font-family:inherit;cursor:pointer}
  .mItem .mi{font-size:26px}
  .mItem small{color:#9fb0c2;font-size:12px;line-height:1.4}
  #mFree{width:100%;margin-top:6px;padding:11px;border:1px dashed var(--hudline);border-radius:14px;background:none;color:#9fb0c2;font-family:inherit;cursor:pointer}
  #mpQ{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center}
  .mpOpt{display:block;width:100%;margin-bottom:10px;padding:13px;border:1px solid var(--hudline);border-radius:14px;
    background:rgba(30,37,48,.8);color:#e6edf3;font-family:inherit;font-size:15px;cursor:pointer}
  .mpOpt.right{background:rgba(46,160,90,.9);border-color:#2ea05a;color:#fff}
  .mpOpt.wrong{background:rgba(180,60,60,.85);border-color:#b04d4d;color:#fff}
  #mpExplain{margin:8px 0 14px;font-size:13px;line-height:1.6;color:#cdd6e0}
  #mpGo,#mcNext,#mcStay{padding:11px 18px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-family:inherit;font-size:14px;cursor:pointer;margin:4px}
  #mcStay{background:rgba(60,70,84,.8)}
  .mcIcon{font-size:44px;text-align:center;margin-bottom:8px}
  #mcMsg{font-size:18px;font-weight:700;text-align:center;margin-bottom:16px}
  #mClear .mcard,#mPredict .mcard{text-align:center}
</style>

<!-- ═══════════════════════════════════════════════════════════
     순수 로직 (P1 게이트: 렌더 0줄 · window.KLight / module.exports)
     — 광선 추적 엔진. 렌더 어댑터(P2)는 별도 module script.
     ═══════════════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════
   빛 실험실 P1 «광선 추적 엔진» — 순수 로직 (렌더 0줄)
   근거: SPEC_LIGHT.md §2 광학 모델(수치 확정) · §5 테스트 계약
   좌표: 2D 광학대 평면 (x=진행 주축, z=횡). 방향은 정규화 벡터.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // ── §2 굴절률 확정 (창작 금지) ──
  var IOR = { air: 1.00, glass: 1.50, water: 1.33 };
  // 프리즘 7색 굴절률 (빨→보 단조 증가)
  var PRISM_N = [
    { key: 'red',    ko: '빨', n: 1.485 },
    { key: 'orange', ko: '주', n: 1.490 },
    { key: 'yellow', ko: '노', n: 1.495 },
    { key: 'green',  ko: '초', n: 1.500 },
    { key: 'blue',   ko: '파', n: 1.505 },
    { key: 'indigo', ko: '남', n: 1.510 },
    { key: 'violet', ko: '보', n: 1.515 }
  ];
  // 얇은 렌즈 초점 (볼록 +, 오목 −) · h 상한 클램프(§7)
  var LENS_F = { convex: 0.12, concave: -0.12 };
  var LENS_H_MAX = 0.06;
  var MAX_BOUNCE = 4;       // §2 최대 반사/굴절 4회
  var FAR = 2.0;            // 무한대 대체 세그먼트 길이
  var EPS = 1e-6;
  var HIT_EPS = 1e-4;       // 재교차 방지 오프셋
  var DEFAULT_BOUNDS = { xmin: -0.5, xmax: 0.5, zmin: -0.4, zmax: 0.4 };

  // ── 벡터 유틸 (2D: x,z) ──
  function v(x, z) { return { x: x, z: z }; }
  function add(a, b) { return v(a.x + b.x, a.z + b.z); }
  function sub(a, b) { return v(a.x - b.x, a.z - b.z); }
  function mul(a, s) { return v(a.x * s, a.z * s); }
  function dot(a, b) { return a.x * b.x + a.z * b.z; }
  function len(a) { return Math.sqrt(a.x * a.x + a.z * a.z); }
  function norm(a) { var L = len(a); return L < EPS ? v(0, 0) : v(a.x / L, a.z / L); }
  function perp(a) { return v(-a.z, a.x); }           // 반시계 90°
  function rot(a, ang) {
    var c = Math.cos(ang), s = Math.sin(ang);
    return v(a.x * c - a.z * s, a.x * s + a.z * c);
  }
  function deg(rad) { return rad * 180 / Math.PI; }
  function rad(d) { return d * Math.PI / 180; }

  // ── 각도 헬퍼 (테스트/UI 공용) ──
  // 방향 dir 이 법선 normal 과 이루는 입사각(0~90°, 도 단위)
  function angleFromNormal(dir, normal) {
    var d = norm(dir), n = norm(normal);
    var c = Math.abs(dot(d, n));
    if (c > 1) c = 1;
    return deg(Math.acos(c));
  }
  // +x축 기준 방향 각(도, −180~180)
  function angleOf(dir) { return deg(Math.atan2(dir.z, dir.x)); }

  // ── 반사 (입사각 = 반사각) ──
  function reflect(dir, normal) {
    var d = norm(dir), n = norm(normal);
    var k = dot(d, n);
    return norm(v(d.x - 2 * k * n.x, d.z - 2 * k * n.z));
  }

  // ── 스넬 굴절 (전반사 처리) ──
  // dir: 입사 진행방향, normal: 경계 법선(어느쪽이든 — 내부에서 입사면 정렬), n1→n2
  // return { dir, tir } — tir(전반사)면 dir 은 반사방향
  function snell(dir, normal, n1, n2) {
    var d = norm(dir), n = norm(normal);
    var cosI = -dot(d, n);
    if (cosI < 0) { n = mul(n, -1); cosI = -cosI; } // 법선을 입사쪽으로
    var r = n1 / n2;
    var sinT2 = r * r * (1 - cosI * cosI);
    if (sinT2 > 1) { return { dir: reflect(d, n), tir: true }; } // 전반사
    var cosT = Math.sqrt(1 - sinT2);
    var t = v(r * d.x + (r * cosI - cosT) * n.x, r * d.z + (r * cosI - cosT) * n.z);
    return { dir: norm(t), tir: false };
  }

  // 임계각(도) — n1 > n2 일 때만 유효
  function criticalAngle(n1, n2) {
    if (n1 <= n2) return null;
    return deg(Math.asin(n2 / n1));
  }

  // ── 얇은 렌즈 (§2 근사식 θ_out = θ_in − h/f) ──
  // dir: 입사방향, hit: 렌즈면 통과점, lens:{center, axis(광축 단위벡터), f}
  function thinLens(dir, hit, lens) {
    var axis = norm(lens.axis);
    var pp = perp(axis);
    var rel = sub(hit, lens.center);
    var h = dot(rel, pp);
    if (h > LENS_H_MAX) h = LENS_H_MAX;          // §7 근축 클램프
    if (h < -LENS_H_MAX) h = -LENS_H_MAX;
    var d = norm(dir);
    // 광축 대비 입사각(부호 포함)
    var thIn = Math.atan2(dot(d, pp), dot(d, axis));
    var thOut = thIn - h / lens.f;
    return norm(add(mul(axis, Math.cos(thOut)), mul(pp, Math.sin(thOut))));
  }

  // ── 소자 → 면(face) 컴파일 ──
  // element 공통: { type, x, z, angle?, size?, kind?('convex'|'concave'), n? }
  // face: { a, b, type, ...상호작용 파라미터, ref }
  function faceSeg(cx, cz, angle, half) {
    // 중심(cx,cz)에서 angle 방향으로 ±half 뻗은 선분
    var dir = rot(v(1, 0), angle);
    var a = v(cx - dir.x * half, cz - dir.z * half);
    var b = v(cx + dir.x * half, cz + dir.z * half);
    return { a: a, b: b, mid: v(cx, cz), tangent: dir, normal: perp(dir) };
  }

  function compileFaces(elements) {
    var faces = [];
    for (var i = 0; i < elements.length; i++) {
      var e = elements[i];
      var ang = e.angle || 0;
      var half = e.size != null ? e.size : 0.08;
      if (e.type === 'mirror') {
        var s = faceSeg(e.x, e.z, ang, half);
        faces.push({ a: s.a, b: s.b, normal: s.normal, type: 'mirror', ref: e });
      } else if (e.type === 'screen') {
        var s2 = faceSeg(e.x, e.z, ang + Math.PI / 2, half); // 광축에 수직으로 세움
        faces.push({ a: s2.a, b: s2.b, normal: s2.normal, type: 'screen', ref: e });
      } else if (e.type === 'lens') {
        // 렌즈 평면: angle=0 이면 z축 평행(세로), 광축 = +x
        var axis = rot(v(1, 0), ang);
        var plane = faceSeg(e.x, e.z, ang + Math.PI / 2, half);
        var f = e.f != null ? e.f : LENS_F[e.kind || 'convex'];
        faces.push({
          a: plane.a, b: plane.b, normal: axis, type: 'lens',
          lens: { center: v(e.x, e.z), axis: axis, f: f }, ref: e
        });
      } else if (e.type === 'glassface') {
        // 단일 굴절 경계(스넬 테스트용). normal +쪽 = nPlus, −쪽 = nMinus
        var g = faceSeg(e.x, e.z, ang, half);
        faces.push({
          a: g.a, b: g.b, normal: g.normal, type: 'refract',
          nPlus: e.nPlus != null ? e.nPlus : IOR.air,
          nMinus: e.nMinus != null ? e.nMinus : IOR.glass, ref: e
        });
      } else if (e.type === 'prism' || e.type === 'water_tri' || e.type === 'glass_tri') {
        // 정삼각형 3변 = 굴절면 3개 (안=유리/물, 밖=공기)
        var R = e.size != null ? e.size : 0.09;      // 외접원 반지름
        var nIn = e.n != null ? e.n : (e.type === 'water_tri' ? IOR.water : IOR.glass);
        var verts = [];
        for (var k = 0; k < 3; k++) {
          var a0 = ang + Math.PI / 2 + k * (2 * Math.PI / 3); // 꼭지 위 기본
          verts.push(v(e.x + R * Math.cos(a0), e.z + R * Math.sin(a0)));
        }
        var cen = v(e.x, e.z);
        for (var k2 = 0; k2 < 3; k2++) {
          var p0 = verts[k2], p1 = verts[(k2 + 1) % 3];
          var mid = v((p0.x + p1.x) / 2, (p0.z + p1.z) / 2);
          var outward = norm(sub(mid, cen));  // 바깥 법선
          faces.push({
            a: p0, b: p1, normal: outward, type: 'refract',
            nPlus: IOR.air, nMinus: nIn, ref: e, prism: true
          });
        }
      }
    }
    return faces;
  }

  // ── 반직선 vs 선분 교차 (t>eps 최근접) ──
  function raySegHit(o, d, a, b) {
    var e1 = sub(b, a);          // 선분 방향
    var denom = d.x * e1.z - d.z * e1.x;
    if (Math.abs(denom) < EPS) return null; // 평행
    var diff = sub(a, o);
    var t = (diff.x * e1.z - diff.z * e1.x) / denom;  // 광선 파라미터
    var u = (diff.x * d.z - diff.z * d.x) / denom;    // 선분 파라미터
    if (t > HIT_EPS && u >= -1e-9 && u <= 1 + 1e-9) {
      return { t: t, point: v(o.x + d.x * t, o.z + d.z * t) };
    }
    return null;
  }

  function inBounds(p, bd) {
    return p.x >= bd.xmin - 1e-6 && p.x <= bd.xmax + 1e-6 &&
           p.z >= bd.zmin - 1e-6 && p.z <= bd.zmax + 1e-6;
  }

  // ── 핵심: traceRay ──
  // origin, dir, elements[], opts{ maxBounce, bounds, dispersionN }
  // → { segments:[{from,to,kind}], hit:{screen 도달점|null}, bounces }
  function traceRay(origin, dir, elements, opts) {
    opts = opts || {};
    var maxB = opts.maxBounce != null ? opts.maxBounce : MAX_BOUNCE;
    var bd = opts.bounds || DEFAULT_BOUNDS;
    var faces = compileFaces(elements || []);
    var segments = [];
    var o = v(origin.x, origin.z);
    var d = norm(dir);
    var hitScreen = null;
    var bounces = 0;

    for (var b = 0; b <= maxB; b++) {
      // 최근접 면
      var best = null, bestFace = null;
      for (var i = 0; i < faces.length; i++) {
        var h = raySegHit(o, d, faces[i].a, faces[i].b);
        if (h && (!best || h.t < best.t)) { best = h; bestFace = faces[i]; }
      }
      if (!best) {
        // 면 없음 → 경계까지(또는 FAR)
        segments.push({ from: o, to: v(o.x + d.x * FAR, o.z + d.z * FAR), kind: 'exit' });
        break;
      }
      var kind = 'ray';
      if (bestFace.type === 'screen') kind = 'screen';
      segments.push({ from: o, to: best.point, kind: kind });

      if (bestFace.type === 'screen') { hitScreen = best.point; break; }

      // 상호작용
      if (bestFace.type === 'mirror') {
        d = reflect(d, bestFace.normal);
      } else if (bestFace.type === 'lens') {
        d = thinLens(d, best.point, bestFace.lens);
      } else if (bestFace.type === 'refract') {
        // 진행방향과 법선 부호로 n1→n2 결정
        var facing = dot(d, bestFace.normal);
        var n1, n2, nrm;
        if (facing < 0) { // +쪽에서 진입
          n1 = bestFace.nPlus; n2 = bestFace.nMinus; nrm = bestFace.normal;
        } else {          // −쪽(안)에서 진출
          n1 = bestFace.nMinus; n2 = bestFace.nPlus; nrm = mul(bestFace.normal, -1);
        }
        if (bestFace.prism && opts.dispersionN != null) {
          // 프리즘 색 분산: 유리쪽 굴절률 오버라이드
          if (facing < 0) n2 = opts.dispersionN; else n1 = opts.dispersionN;
        }
        var r = snell(d, nrm, n1, n2);
        d = r.dir;
      }
      bounces++;
      o = add(best.point, mul(d, HIT_EPS * 2)); // 재교차 방지 전진
      if (!inBounds(o, bd)) {
        segments.push({ from: o, to: v(o.x + d.x * FAR, o.z + d.z * FAR), kind: 'exit' });
        break;
      }
    }
    return { segments: segments, hit: hitScreen, bounces: bounces };
  }

  // ── 프리즘 분산: 백색광 → 7색 traceRay ──
  function prismSpectrum(origin, dir, elements, opts) {
    opts = opts || {};
    var out = [];
    for (var i = 0; i < PRISM_N.length; i++) {
      var res = traceRay(origin, dir, elements,
        Object.assign({}, opts, { dispersionN: PRISM_N[i].n }));
      var last = res.segments[res.segments.length - 1];
      var outDir = norm(sub(last.to, last.from));
      out.push({ color: PRISM_N[i].key, ko: PRISM_N[i].ko, n: PRISM_N[i].n,
                 result: res, exitDir: outDir, exitAngle: angleOf(outDir) });
    }
    return out;
  }

  // ── P3 미션 판정 (순수 — traceRay/prismSpectrum 조합, node 단독 테스트) ──
  var LIGHT_SRC = { x: -0.44, z: 0 };     // 광원 위치(UI와 동일)
  var LIGHT_DIR = { x: 1, z: 0 };         // +x 발사
  var BEAM_H = [-0.05, 0, 0.05];          // 평행광 다발 높이(광축 수직 offset)

  // 평행광 다발: src에서 각 h의 나란한 광선 → traceRay 결과 배열
  function traceBeam(elements, opts, hs, src, dir) {
    hs = hs || BEAM_H; src = src || LIGHT_SRC; dir = dir || LIGHT_DIR;
    var d = norm(dir), p = perp(d), out = [];
    for (var i = 0; i < hs.length; i++) {
      out.push(traceRay(add(src, mul(p, hs[i])), dir, elements, opts));
    }
    return out;
  }
  function hasType(els, pred) { for (var i = 0; i < els.length; i++) if (pred(els[i])) return true; return false; }
  function screenZs(results) {
    var zs = []; for (var i = 0; i < results.length; i++) if (results[i].hit) zs.push(results[i].hit.z);
    return zs;
  }

  // L-1 거울 과녁: 반사(bounces≥1) 경유 + 스크린 도달
  function missionMirror(elements, opts) {
    var res = traceRay(LIGHT_SRC, LIGHT_DIR, elements, opts);
    var mir = hasType(elements, function (e) { return e.type === 'mirror'; });
    var scr = hasType(elements, function (e) { return e.type === 'screen'; });
    return { done: mir && scr && res.bounces >= 1 && !!res.hit, bounces: res.bounces, hit: res.hit };
  }
  // L-2 볼록 초점: 평행광 다발이 스크린에서 수렴(도달점 z 퍼짐 < 임계)
  function missionFocus(elements, opts) {
    var cvx = hasType(elements, function (e) { return e.type === 'lens' && e.kind === 'convex'; });
    var scr = hasType(elements, function (e) { return e.type === 'screen'; });
    var beam = traceBeam(elements, opts);
    var zs = screenZs(beam), spread = null, done = false;
    if (cvx && scr && zs.length >= 2) {
      spread = Math.max.apply(null, zs) - Math.min.apply(null, zs);
      done = spread < 0.04;   // 초점 근처 슬롯이면 수렴(0.15 성공·0.30 실패)
    }
    return { done: done, spread: spread, hitCount: zs.length };
  }
  // L-3 프리즘 무지개: 프리즘 경유 7색이 스크린에 분리 도달(색별 도달점 퍼짐 > 임계)
  function missionRainbow(elements, opts) {
    var pri = hasType(elements, function (e) { return e.type === 'prism'; });
    var scr = hasType(elements, function (e) { return e.type === 'screen'; });
    var done = false, spread = null, colorsHit = 0;
    if (pri && scr) {
      var spec = prismSpectrum(LIGHT_SRC, LIGHT_DIR, elements, opts);
      var zs = [];
      for (var i = 0; i < spec.length; i++) if (spec[i].result.hit) { zs.push(spec[i].result.hit.z); colorsHit++; }
      if (zs.length >= 2) { spread = Math.max.apply(null, zs) - Math.min.apply(null, zs); done = colorsHit >= 5 && spread > 0.015; }
    }
    return { done: done, spread: spread, colorsHit: colorsHit };
  }
  // ★와우: 볼록렌즈 초점(=lens.x+|f|) 위치에 종이가 놓이면 발화 — "빛이 모이면 뜨겁다"
  function paperIgnites(elements) {
    var paper = null, lens = null;
    for (var i = 0; i < elements.length; i++) {
      if (elements[i].type === 'paper') paper = elements[i];
      if (elements[i].type === 'lens' && elements[i].kind === 'convex') lens = elements[i];
    }
    if (!paper || !lens) return { ignite: false, focusX: null };
    var focusX = lens.x + Math.abs(LENS_F.convex);   // 볼록 초점 거리
    return { ignite: Math.abs(paper.x - focusX) < 0.04, focusX: focusX, paperX: paper.x };
  }

  var API = {
    IOR: IOR, PRISM_N: PRISM_N, LENS_F: LENS_F, LENS_H_MAX: LENS_H_MAX,
    MAX_BOUNCE: MAX_BOUNCE,
    v: v, add: add, sub: sub, mul: mul, dot: dot, len: len, norm: norm,
    perp: perp, rot: rot, deg: deg, rad: rad,
    angleFromNormal: angleFromNormal, angleOf: angleOf,
    reflect: reflect, snell: snell, criticalAngle: criticalAngle,
    thinLens: thinLens, compileFaces: compileFaces, raySegHit: raySegHit,
    traceRay: traceRay, prismSpectrum: prismSpectrum,
    LIGHT_SRC: LIGHT_SRC, LIGHT_DIR: LIGHT_DIR, BEAM_H: BEAM_H, traceBeam: traceBeam,
    missionMirror: missionMirror, missionFocus: missionFocus,
    missionRainbow: missionRainbow, paperIgnites: paperIgnites
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  if (typeof window !== 'undefined') window.KLight = API;
})();
</script>

import * as THREE from 'three';

const GRADE = (['low','mid','high'].includes(P.get('grade')) ? P.get('grade') : 'high');

/* ═════════ 렌더 기반(황금 표준 승계) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);

  o.style.cssText='position:fixed;inset:0;background:rgba(10,12,16,.93);color:#e8ecf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d'); const gr=g.createLinearGradient(0,0,0,256);

  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace; scene.background=bg;
}
scene.fog = new THREE.Fog(0x11151b, 3.4, 8.5);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.03, 30);
camera.position.set(0.16, 1.02, 0.86);

controls.target.set(0, 0.09, 0);

const sun = new THREE.DirectionalLight(0xfff2e0, 2.2);

scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x2b241c, 0.32));

/* ═════════ 광학대(테이블 + 보드) ═════════ */
const BENCH_Y = 0.0;           // 상판
const RAY_Y   = BENCH_Y + 0.10; // §2 광선 평면
const BOUNDS  = { xmin:-0.5, xmax:0.5, zmin:-0.4, zmax:0.4 };
const SLOTS_X = [-0.30,-0.15,0,0.15,0.30]; // §4 C-2 고정 슬롯
const SRC = { x:-0.44, z:0 };  // 광원 위치(광축 z=0)
const DIR = { x:1, z:0 };      // +x 발사

// 상판(짙은 무광) — 광선/발광이 살아나도록 다크 스튜디오 톤
{
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(1.3, 0.05, 0.95),

  top.position.set(0, BENCH_Y-0.025, 0); top.receiveShadow=true; scene.add(top);
  // 광학대 보드(밝은 눈금 판) — 슬롯 라인
  const board = new THREE.Mesh(
    new THREE.BoxGeometry(0.98, 0.012, 0.34),
    new THREE.MeshStandardMaterial({ color:0x323a45, roughness:0.55, metalness:0.15 }));
  board.position.set(0, BENCH_Y+0.006, 0); board.receiveShadow=true; board.name='board'; scene.add(board);
  // 광축 홈 라인
  const axis = new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.002, 0.006),
    new THREE.MeshStandardMaterial({ color:0x1b2028, roughness:0.9 }));
  axis.position.set(0, BENCH_Y+0.013, 0); scene.add(axis);
  // 슬롯 마커
  SLOTS_X.forEach(sx=>{
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.003,16),
      new THREE.MeshStandardMaterial({ color:0x4a5666, roughness:0.6 }));
    m.position.set(sx, BENCH_Y+0.014, 0); scene.add(m);

}

/* ═════════ 소자 3D 빌더 ═════════ */
const GLASS = () => new THREE.MeshPhysicalMaterial({ // §7 굴절 없는 블렌딩 유리(광선이 유일한 진실)
  color:0xbfe0ff, roughness:0.06, metalness:0, transparent:true, opacity:0.20,
  clearcoat:1, clearcoatRoughness:0.05, side:THREE.DoubleSide, depthWrite:false });
const MIRROR_MAT = () => new THREE.MeshStandardMaterial({ color:0xdfe8f0, roughness:0.06, metalness:1.0 });
const FRAME_MAT = () => new THREE.MeshStandardMaterial({ color:0x3b434f, roughness:0.5, metalness:0.4 });

function buildFlashlight(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.032,0.11,20),
    new THREE.MeshStandardMaterial({ color:0x4a5260, roughness:0.35, metalness:0.7 }));
  body.rotation.z=Math.PI/2; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.03,0.03,20),
    new THREE.MeshStandardMaterial({ color:0x2f3540, roughness:0.4, metalness:0.6 }));
  head.rotation.z=Math.PI/2; head.position.x=0.066; g.add(head);
  const lens=new THREE.Mesh(new THREE.CircleGeometry(0.03,20),
    new THREE.MeshStandardMaterial({ color:0xfff4d6, emissive:0xfff0c8, emissiveIntensity:1.6 }));
  lens.rotation.y=Math.PI/2; lens.position.x=0.081; g.add(lens);
  g.position.set(SRC.x, RAY_Y, SRC.z);
  return g;
}
function buildMirror(){
  const g=new THREE.Group();
  // P1 mirror 규약: angle=0 → 면이 x축 방향(광축 평행)·법선 ±z. 3D도 동일하게(폭 x·높이 y·두께 z).
  const face=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,0.006), MIRROR_MAT());
  face.castShadow=true; g.add(face);
  const frame=new THREE.Mesh(new THREE.BoxGeometry(0.185,0.185,0.014), FRAME_MAT());
  frame.position.z=-0.007; g.add(frame);
  return g; // 거울면 = 로컬 xy평면(법선 ±z). P1 mirror half=0.08(=0.16/2). rotation.y=−angle로 P1 angle과 정합.
}
function buildLens(kind){
  const g=new THREE.Group();
  // 얇은 볼록/오목 실루엣(블렌딩) — 광축 = 로컬 +x, 렌즈면 = yz평면
  const prof=[];
  const H=0.09, T=(kind==='convex')?0.03:0.012;
  for(let i=0;i<=10;i++){ const t=i/10, y=(-1+2*t)*H;
    const bulge=(kind==='convex')? Math.cos(t*Math.PI-Math.PI/2) : (1-Math.cos(t*Math.PI-Math.PI/2));
    prof.push(new THREE.Vector2(0.004+T*bulge, y)); }
  const geo=new THREE.LatheGeometry(prof, 24); // 회전체(광축 중심) → 원형 렌즈
  geo.rotateZ(Math.PI/2); // 회전축 y→x(광축)
  const lens=new THREE.Mesh(geo, GLASS()); lens.castShadow=true; g.add(lens);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(H,0.008,10,28), FRAME_MAT());
  ring.rotation.y=Math.PI/2; g.add(ring);
  return g;
}
function buildPrism(){
  const g=new THREE.Group();
  // 정삼각 기둥(축=세로 y) — P1 prism 3변과 정합(꼭지 위)
  const R=0.09, shape=new THREE.Shape();
  for(let k=0;k<3;k++){ const a=Math.PI/2 + k*(2*Math.PI/3);
    const x=R*Math.cos(a), z=R*Math.sin(a);
    if(k===0) shape.moveTo(x,z); else shape.lineTo(x,z); }
  shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{ depth:0.14, bevelEnabled:false });
  geo.rotateX(-Math.PI/2); geo.translate(0,0.07,0); // 기둥 세로로 세움(광선 평면 관통)
  const pr=new THREE.Mesh(geo, GLASS()); pr.castShadow=true; pr.position.y=-0.02; g.add(pr);
  return g;
}
function buildScreen(){
  const g=new THREE.Group();
  const panel=new THREE.Mesh(new THREE.BoxGeometry(0.006,0.18,0.20),
    new THREE.MeshStandardMaterial({ color:0xe9edf2, roughness:0.9, transparent:true, opacity:0.55 }));
  panel.castShadow=true; g.add(panel);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.02,0.09), FRAME_MAT());
  foot.position.y=-0.10; g.add(foot);
  // 도달점 밝은 점(스프라이트) — 다발 최대 3줄 → dot 3개, rebuildRays에서 위치·표시 갱신
  const dots=[];
  for(let i=0;i<3;i++){
    const dotTex=makeDotTexture('#fff6d8');
    const dot=new THREE.Sprite(new THREE.SpriteMaterial({ map:dotTex, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false }));
    dot.scale.set(0.05,0.05,1); dot.visible=false; dot.name='hitDot'+i; g.add(dot); dots.push(dot);
  }
  g.userData.dots=dots;
  return g;
}
function makeFlameTexture(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d'); const gr=x.createRadialGradient(32,40,2,32,38,30);
  gr.addColorStop(0,'#fff7d6'); gr.addColorStop(0.35,'#ffd166'); gr.addColorStop(0.7,'#ff7b2e'); gr.addColorStop(1,'rgba(200,40,0,0)');
  x.fillStyle=gr; x.beginPath(); x.ellipse(32,38,18,26,0,0,7); x.fill();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function buildPaper(){
  const g=new THREE.Group();
  const paper=new THREE.Mesh(new THREE.BoxGeometry(0.003,0.13,0.11),
    new THREE.MeshStandardMaterial({ color:0xf3ead6, roughness:0.95, side:THREE.DoubleSide }));
  paper.castShadow=true; g.add(paper);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.02,0.07), FRAME_MAT());
  foot.position.y=-0.075; g.add(foot);
  // 발화 연출(초기 숨김): 그을림·연기·불꽃
  const scorch=new THREE.Mesh(new THREE.CircleGeometry(0.014,16),
    new THREE.MeshBasicMaterial({ color:0x140d04, transparent:true, opacity:0 }));
  scorch.position.set(0.002,0,0); scorch.rotation.y=Math.PI/2; g.add(scorch);
  const flame=new THREE.Sprite(new THREE.SpriteMaterial({ map:makeFlameTexture(), transparent:true,
    blending:THREE.AdditiveBlending, depthWrite:false, opacity:0 }));
  flame.scale.set(0.06,0.10,1); flame.position.set(0.006,0.03,0); g.add(flame);
  const smoke=new THREE.Sprite(new THREE.SpriteMaterial({ map:makeDotTexture('#c8ccd2'), transparent:true,
    depthWrite:false, opacity:0 }));
  smoke.scale.set(0.05,0.07,1); smoke.position.set(0.006,0.08,0); g.add(smoke);
  g.userData={ scorch, flame, smoke, igniteT:-1, lit:false };
  return g;
}
function makeDotTexture(col){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d'); const gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,col); gr.addColorStop(0.4,col); gr.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gr; x.beginPath(); x.arc(32,32,32,0,7); x.fill();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

// 소자 카탈로그(트레이) — 광원은 상시(제거 대상 아님)
const CATALOG = {
  mirror:       { ic:'🪞', label:'평면거울',   build:()=>buildMirror(),        el:(o)=>({type:'mirror', x:o.x, z:o.z, angle:o.angle, size:0.08}) },
  lens_convex:  { ic:'🔎', label:'볼록렌즈',   build:()=>buildLens('convex'),  el:(o)=>({type:'lens', kind:'convex', x:o.x, z:o.z, angle:o.angle, size:0.09}) },
  lens_concave: { ic:'🥃', label:'오목렌즈',   build:()=>buildLens('concave'), el:(o)=>({type:'lens', kind:'concave', x:o.x, z:o.z, angle:o.angle, size:0.09}) },
  prism:        { ic:'🔺', label:'프리즘',     build:()=>buildPrism(),         el:(o)=>({type:'prism', x:o.x, z:o.z, angle:o.angle, size:0.09}) },
  screen:       { ic:'🎯', label:'스크린',     build:()=>buildScreen(),        el:(o)=>({type:'screen', x:o.x, z:o.z, angle:o.angle, size:0.09}) },
  paper:        { ic:'📄', label:'종이',       build:()=>buildPaper(),         el:(o)=>({type:'paper', x:o.x, z:o.z, angle:o.angle, size:0.06}) },
};
// 학년칸(§4): 저=거울만 / 중=거울·볼록·스크린·종이 / 고=전체(종이 포함)
const TOOLS_BY_GRADE = {
  low:  ['mirror','screen'],
  mid:  ['mirror','lens_convex','screen','paper'],
  high: ['mirror','lens_convex','lens_concave','prism','screen','paper'],
};

/* ═════════ 배치 상태 + 트레이 UI ═════════ */
const placed = [];         // { key, x, z, angle, group, catalog }
let activeTool = null;     // 선택된 트레이 소자 key
const flashlight = buildFlashlight(); scene.add(flashlight);

function buildTray(){
  const tray=document.getElementById('tray'); tray.innerHTML='';
  TOOLS_BY_GRADE[GRADE].forEach(key=>{
    const c=CATALOG[key]; const b=document.createElement('button');
    b.dataset.key=key; b.innerHTML=`<span class="ic">${c.ic}</span>${c.label}`;
    b.onclick=()=>{ activeTool=(activeTool===key?null:key); syncTray(); };
    tray.appendChild(b);
  });
  const r=document.createElement('button'); r.className='reset'; r.innerHTML='<span class="ic">↺</span>비우기';
  r.onclick=resetAll; tray.appendChild(r);
}
function syncTray(){
  document.querySelectorAll('#tray button[data-key]').forEach(b=>{
    b.classList.toggle('on', b.dataset.key===activeTool);
  });
  document.getElementById('hud').textContent = activeTool
    ? `${CATALOG[activeTool].label} 선택됨 — 광학대 빈 자리를 탭해 놓아요`
    : `광선 모드: ${RAY_TIER}`;
}
function nextFreeSlot(){
  for(const sx of SLOTS_X){ if(!placed.some(p=>Math.abs(p.x-sx)<1e-6)) return sx; }
  return null;
}
function placeAt(key, x){
  const c=CATALOG[key]; const grp=c.build();
  grp.position.set(x, RAY_Y, 0); scene.add(grp);
  const item={ key, x, z:0, angle:0, group:grp, catalog:c };
  placed.push(item); rebuildRays();
  return item;
}
function rotateItem(item){
  item.angle += 15*Math.PI/180;                 // §4 탭 = 15° 회전
  item.group.rotation.y = -item.angle;          // P1 angle(x-z 반시계) ↔ mesh y = −angle
  rebuildRays();
}
function resetAll(){
  placed.forEach(p=>scene.remove(p.group)); placed.length=0;
  activeTool=null; syncTray(); rebuildRays();
}

/* ═════════ 광선 렌더 3안(§3) ═════════ */
const rayGroup = new THREE.Group(); scene.add(rayGroup);
const WHITE = 0xFFF4D6;
const COLOR_HEX = { red:0xff3b30, orange:0xff9500, yellow:0xffe000, green:0x34c759,
                    blue:0x2a9bff, indigo:0x5a54ff, violet:0xb04dff };
let dotSprites = []; // dots 티어 흐름 애니용

function clearRayGroup(){
  while(rayGroup.children.length){ const c=rayGroup.children.pop();
    if(c.geometry) c.geometry.dispose(); if(c.material) c.material.dispose(); rayGroup.remove(c); }
  dotSprites = [];
}
const W = (p)=> new THREE.Vector3(p.x, RAY_Y, p.z); // (x,z) → 3D

function drawSegment(from, to, hex){
  const A=W(from), B=W(to);
  if(RAY_TIER==='line'){
    const geo=new THREE.BufferGeometry().setFromPoints([A,B]);
    const mat=new THREE.LineBasicMaterial({ color:hex, transparent:true, opacity:0.92, blending:THREE.AdditiveBlending, depthWrite:false });
    rayGroup.add(new THREE.Line(geo, mat));
  } else if(RAY_TIER==='dots'){
    const L=A.distanceTo(B), n=Math.max(1, Math.floor(L/0.012));
    const tex=makeDotTexture('#fff'); 
    for(let i=0;i<n;i++){
      const t=i/n, p=A.clone().lerp(B,t);
      const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, color:hex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
      s.scale.set(0.02,0.02,1); s.position.copy(p);
      s.userData={ A:A.clone(), B:B.clone(), base:t }; rayGroup.add(s); dotSprites.push(s);
    }
  } else { // glow(기본): 얇은 TubeGeometry 발광 + additive
    const path=new THREE.LineCurve3(A,B);
    const geo=new THREE.TubeGeometry(path, 1, 0.0022, 6, false);
    const mat=new THREE.MeshBasicMaterial({ color:hex, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false });
    rayGroup.add(new THREE.Mesh(geo, mat));
  }
}

function markHits(reset){
  placed.forEach(p=>{ if(p.key==='screen' && p.group.userData.dots){ p.group.userData.dots.forEach(d=>d.visible=false); } });
}
function showHitDot(hit){
  // 가장 가까운 스크린에 밝은 점(다발 여러 도달점 → 빈 dot 슬롯 순차 사용)
  let best=null, bd=Infinity;
  placed.forEach(p=>{ if(p.key!=='screen')return;
    const d=Math.hypot(p.x-hit.x, p.z-hit.z); if(d<bd){bd=d;best=p;} });
  if(best && best.group.userData.dots){
    best.group.updateWorldMatrix(true,false);
    const slot=best.group.userData.dots.find(d=>!d.visible);
    if(slot){ slot.position.copy(best.group.worldToLocal(W(hit))); slot.visible=true; }
  }
}

function toElements(){ return placed.map(p=>p.catalog.el(p)); }

const PERP = (d)=>({x:-d.z, z:d.x});
function rebuildRays(){
  clearRayGroup(); markHits();
  const els=toElements();
  const hasPrism=els.some(e=>e.type==='prism');
  if(hasPrism){
    // 프리즘 7색 — 무지개는 물리에서(prismSpectrum). 중앙 축 광선 1줄(다발은 겹쳐 지저분).
    const spec=K.prismSpectrum(SRC, DIR, els, { bounds:BOUNDS });
    spec.forEach(s=>{
      const hex=COLOR_HEX[s.color]||WHITE;
      s.result.segments.forEach(seg=>drawSegment(seg.from, seg.to, hex));
      if(s.result.hit) showHitDot(s.result.hit);
    });
  } else {
    // 평행광 다발 3줄(§5 — 볼록 초점 수렴 시각화). 광축 수직으로 ±h 나란히.
    const p=PERP(DIR);
    K.BEAM_H.forEach(h=>{
      const o={ x:SRC.x+p.x*h, z:SRC.z+p.z*h };
      const res=K.traceRay(o, DIR, els, { bounds:BOUNDS });
      res.segments.forEach(seg=>drawSegment(seg.from, seg.to, WHITE));
      if(res.hit) showHitDot(res.hit);
    });
  }
  if(typeof onRaysRebuilt==='function') onRaysRebuilt(els);
}

/* ═════════ 입력(탭: 배치 / 회전) ═════════ */
const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2();
let downXY=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downXY={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downXY) return;
  const moved=Math.hypot(e.clientX-downXY.x, e.clientY-downXY.y); downXY=null;
  if(moved>6) return; // 드래그(궤도 회전)와 탭 구분
  ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ndc, camera);
  // 1) 이미 놓인 소자 히트 → 회전
  const meshes=[]; placed.forEach(p=>p.group.traverse(o=>{ if(o.isMesh){ o.userData._owner=p; meshes.push(o); } }));
  const hitObj=ray.intersectObjects(meshes,false)[0];
  if(hitObj){ rotateItem(hitObj.object.userData._owner); return; }
  // 2) 트레이 소자 선택 상태면 보드 탭 → 다음 빈 슬롯 배치
  if(activeTool){
    const board=scene.getObjectByName('board');
    const bHit=ray.intersectObject(board,false)[0];
    if(bHit){
      // 탭한 x에 가장 가까운 빈 슬롯(없으면 다음 빈 슬롯)
      let sx=null, bd=Infinity;
      SLOTS_X.forEach(s=>{ if(placed.some(p=>Math.abs(p.x-s)<1e-6))return;
        const d=Math.abs(bHit.point.x-s); if(d<bd){bd=d;sx=s;} });
      if(sx===null) sx=nextFreeSlot();
      if(sx!==null){ placeAt(activeTool, sx); activeTool=null; syncTray(); }
    }
  }
});

/* ═════════ P3 미션 3종 + ★와우(종이 발화) ═════════ */
const MISSIONS = {
  'L-1': { icon:'🪞', title:'빛을 과녁에 맞혀라',
    brief:'평면거울을 돌려 빛을 스크린(과녁)에 맞혀 보세요.',
    hint:'거울을 탭하면 15°씩 돌아가요 — 입사각과 반사각은 같아요!',
    need:['mirror','screen'], evalFn:(els)=>K.missionMirror(els,{bounds:BOUNDS}) },
  'L-2': { icon:'🔎', title:'빛을 한 점에 모아라',
    brief:'볼록렌즈로 나란한 빛을 한 점에 모으고, 스크린을 그 자리에 놓아 보세요.',
    hint:'스크린을 옮겨 점이 가장 작아지는 자리가 초점이에요.',
    need:['lens_convex','screen'], evalFn:(els)=>K.missionFocus(els,{bounds:BOUNDS}), wow:true,
    predict:{ q:'초점에 종이를 놓으면 종이는 어떻게 될까요?', opts:['아무 일 없다','탄다'], answer:1,
      explain:'빛이 한 점에 모이면 그 자리가 뜨거워져요. 초점에 모인 빛은 종이를 태울 만큼 뜨겁답니다. (연소 3조건: 탈 물질·산소·발화점 — E-5와 연결!) 실제로 돋보기로 불을 붙이는 건 위험하니 꼭 어른과 함께 해요.' } },
  'L-3': { icon:'🔺', title:'무지개를 꺼내라',
    brief:'프리즘에 빛을 통과시켜 무지개(7색)를 스크린에 펼쳐 보세요.',
    hint:'프리즘을 돌려 빛이 여러 색으로 갈라지는 각도를 찾아요.',
    need:['prism','screen'], evalFn:(els)=>K.missionRainbow(els,{bounds:BOUNDS}) },
};
const GRADE_MISSIONS = { low:['L-1'], mid:['L-1','L-2'], high:['L-1','L-2','L-3'] };
let activeMission=null, missionCleared=false, predictAnswered=false;

// ── 미션 UI(오버레이·배너·예측·성공) DOM 생성 ──
function buildMissionUI(){
  const wrap=document.createElement('div'); wrap.id='mwrap'; document.body.appendChild(wrap);
  wrap.innerHTML=`
    <button id="mBtn">🎯 미션</button>
    <div id="mBanner" class="hide"><span id="mbIcon"></span><div><div id="mbTitle"></div><div id="mbHint"></div></div><button id="mbClose">✕</button></div>
    <div id="mHome" class="hide"><div class="mcard"><h2>🔦 빛 미션</h2><div id="mList"></div><button id="mFree">자유 실험</button></div></div>
    <div id="mPredict" class="hide"><div class="mcard"><div id="mpQ"></div><div id="mpOpts"></div><div id="mpExplain" class="hide"></div><button id="mpGo" class="hide">계속 실험하기</button></div></div>
    <div id="mClear" class="hide"><div class="mcard"><div class="mcIcon">🎉</div><div id="mcMsg">미션 성공!</div><button id="mcNext">다른 미션</button><button id="mcStay">계속 실험</button></div></div>`;
  document.getElementById('mBtn').onclick=openHome;
  document.getElementById('mbClose').onclick=()=>{ setMission(null); };
  document.getElementById('mFree').onclick=()=>{ setMission(null); closeAll(); };
  document.getElementById('mpGo').onclick=()=>document.getElementById('mPredict').classList.add('hide');
  document.getElementById('mcNext').onclick=openHome;
  document.getElementById('mcStay').onclick=closeAll;
  renderList();
}
function renderList(){
  const list=document.getElementById('mList'); list.innerHTML='';
  GRADE_MISSIONS[GRADE].forEach(id=>{
    const m=MISSIONS[id]; const b=document.createElement('button'); b.className='mItem';
    b.innerHTML=`<span class="mi">${m.icon}</span><span><b>${m.title}</b><br><small>${m.brief}</small></span>`;
    b.onclick=()=>{ setMission(id); closeAll(); }; list.appendChild(b);
  });
}
function openHome(){ closeAll(); document.getElementById('mHome').classList.remove('hide'); }
function closeAll(){ ['mHome','mPredict','mClear'].forEach(i=>document.getElementById(i).classList.add('hide')); }
function setMission(id){
  activeMission=id; missionCleared=false; predictAnswered=false;
  const bn=document.getElementById('mBanner');
  if(id){ const m=MISSIONS[id];
    document.getElementById('mbIcon').textContent=m.icon;
    document.getElementById('mbTitle').textContent=m.title;
    document.getElementById('mbHint').textContent=m.hint;
    bn.classList.remove('hide');
  } else bn.classList.add('hide');
  rebuildRays();
}
function showPredict(){
  const m=MISSIONS[activeMission]; if(!m||!m.predict) return;
  const box=document.getElementById('mPredict'); box.classList.remove('hide');
  document.getElementById('mpQ').textContent=m.predict.q;
  const opts=document.getElementById('mpOpts'); opts.innerHTML='';
  const ex=document.getElementById('mpExplain'), go=document.getElementById('mpGo');
  ex.classList.add('hide'); go.classList.add('hide');
  m.predict.opts.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='mpOpt'; b.textContent=o;
    b.onclick=()=>{
      predictAnswered=true;
      opts.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.classList.add(i===m.predict.answer?'right':'wrong');
      if(i!==m.predict.answer) opts.children[m.predict.answer].classList.add('right');
      ex.textContent=m.predict.explain; ex.classList.remove('hide'); go.classList.remove('hide');
    };
    opts.appendChild(b);
  });
}
function showCleared(){
  const m=MISSIONS[activeMission];
  document.getElementById('mcMsg').textContent=`${m.icon} ${m.title} — 성공!`;
  document.getElementById('mClear').classList.remove('hide');
}
// rebuildRays 끝 훅: 미션 진행 + ★와우 발화 판정
function onRaysRebuilt(els){
  // ★와우: 볼록 초점에 종이 → 발화 시작(예측 카드는 L-2 미션 중 첫 발화)
  const ig=K.paperIgnites(els);
  placed.forEach(p=>{ if(p.key!=='paper')return; const u=p.group.userData;
    if(ig.ignite && !u.lit){ u.lit=true; u.igniteT=0;
      if(activeMission==='L-2' && !predictAnswered) showPredict();
    } else if(!ig.ignite && u.lit){ u.lit=false; u.igniteT=-1;
      u.flame.material.opacity=0; u.smoke.material.opacity=0; u.scorch.material.opacity=0; }
  });
  // 미션 성공 판정
  if(activeMission && !missionCleared){
    const r=MISSIONS[activeMission].evalFn(els);
    if(r.done){ missionCleared=true; showCleared(); }
  }
}
// animate에서 매 프레임 호출 — 종이 발화 애니(연기 즉시 → 3초 후 불꽃)
function stepPaperFire(now, dt){
  placed.forEach(p=>{ if(p.key!=='paper')return; const u=p.group.userData;
    if(!u.lit || u.igniteT<0) return;
    u.igniteT+=dt;
    const smokeA=Math.min(0.55, u.igniteT*0.5);
    u.smoke.material.opacity=smokeA*(0.7+0.3*Math.sin(now/220));
    u.smoke.position.y=0.08+Math.min(0.06,u.igniteT*0.012);
    if(u.igniteT>3){
      const f=Math.min(1,(u.igniteT-3)*1.4);
      u.flame.material.opacity=f*(0.82+0.18*Math.sin(now/80));
      u.scorch.material.opacity=Math.min(0.9,f);
      u.flame.scale.set(0.06,0.10+0.02*Math.sin(now/110),1);
    }
  });
}


let t0=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.05,(now-t0)/1000); t0=now;
  stepPaperFire(now, dt);
  // dots 흐름 애니(§3: 광원→진행 방향 흐름)
  if(RAY_TIER==='dots' && dotSprites.length){
    const flow=(now/1000*0.35)%1;
    dotSprites.forEach(s=>{ const u=(s.userData.base+flow)%1; s.position.copy(s.userData.A.clone().lerp(s.userData.B,u)); });
  }
  controls.update();
  renderer.render(scene, camera);
}

/* ═════════ 부팅 ═════════ */
buildTray(); syncTray(); buildMissionUI();
// ?demo= 초기 배치(데모 링크 겸 검증) — 슬롯 순서대로 자동 배치
{
  const DEMO=P.get('demo');
  const PLAN={ mirror:['mirror','screen'], lens:['lens_convex','screen'],
    concave:['lens_concave','screen'], prism:['prism','screen'],
    all:['mirror','lens_convex','prism','screen'] }[DEMO];
  if(PLAN){ let si=0; PLAN.forEach(k=>{ const sx=SLOTS_X[si++]; if(sx!==undefined && CATALOG[k]) placeAt(k,sx); }); }
}
// ?mission= 직접 진입 / 저학년(?grade=low)은 미션 홈 자동 오픈
{
  const mq=P.get('mission');
  if(mq && MISSIONS[mq]) setMission(mq);
  else if(GRADE==='low') openHome();
}
rebuildRays(); animate();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
{ const l=document.getElementById('loading'); if(l) l.classList.add('hide'); }
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이랩 과학실 — 물의 세 가지 상태 미션</title>
<!--
  케이랩 과학실(SciLab) E-3 상태 변화 — 황금 샘플(scilab.html 물 끓이기 v0.2) 복사→스왑.
  설계도: handoff/klab/scilab/양산설계_과학실.md 부록 A (수치·문구 전부 그대로 이식).
  흡수 대상: v2 engine/tools/states.js — 질량 보존 와우·잠열·학년칸 문구 보존 계약(부록 A-6).
    · 기구 트레이: 삼발이·그물·비커(얼음)·램프·온도계·저울 (고르기 = 학습·평가)
    · 절차: 삼발이 → 그물 → 비커 → (온도계·저울) / 오답 4종 = 즉시 피드백
    · 현상: 얼음 승온 → 융해 0℃ 고정 → 물 승온 → 100℃ 고정 → (뚜껑 열면)증발
    · ★와우: 밀폐 뚜껑 + 저울 = 질량 보존(상태가 바뀌어도 무게 그대로) 2단 예측(중·고)
    · 뚜껑 안전: 밀폐한 채 오래 끓이면 자동 개방 (실험 안전 = 교육)
  렌더 표준(황금 샘플 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft ·
    유리=블렌딩 / 액체=transmission 굴절 / 얼음=불투명(투명인간 함정 회피) · GPU 김 · CPU 기포 · 품질 자동
  URL config: ?grade=low|mid|high (기본 mid). low = ★와우 2차 예측 숨김(v2 GRADES 승계).
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5B9BF0; --orange:#FF8A3D; --green:#12B886; --purple:#9B7BF5;
    --ink:#1d2733; --hud:rgba(20,25,32,.74); --hudline:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:10px 16px;pointer-events:none;z-index:20}
  #topbar .title{color:#fff;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  #topbar .badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}

  /* 온도 패널 */
  #panel{position:fixed;top:50px;left:14px;z-index:20;background:var(--hud);
    backdrop-filter:blur(8px);border:1px solid var(--hudline);border-radius:16px;
    padding:13px 17px;color:#fff;min-width:166px}
  #temp{font-size:32px;line-height:1.05}
  #temp small{font-size:15px;color:#9fb3c8}
  #temp.na{font-size:14px;color:#9fb3c8;line-height:1.5;padding:4px 0}
  #stateline{font-size:12.5px;margin-top:6px;color:#ffd9a3;min-height:17px}
  .volwrap{margin-top:9px}
  .volwrap .lab{font-size:11px;color:#9fb3c8;margin-bottom:4px}
  .volbar{width:136px;height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .volbar i{display:block;height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#4FC3F7,#81D4FA);transition:width .3s}
  .massread{font-size:22px;color:#ffe3b8;font-weight:700;line-height:1.1}

  /* 미션 패널 */
  #mission{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:21;
    background:var(--hud);backdrop-filter:blur(8px);border:1px solid var(--hudline);
    border-radius:16px;padding:11px 16px;color:#fff;max-width:min(420px,92vw);text-align:center}
  #mission .mt{font-size:14.5px;color:#ffe3b8}
  #mission .mp{font-size:12.5px;color:#c6d6e5;margin-top:4px;line-height:1.5}
  #mission .prog{margin-top:7px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  #mission .chip{font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid var(--hudline);color:#9fb3c8}
  #mission .chip.on{background:rgba(18,184,134,.22);border-color:#12B886;color:#7CF0C9}

  /* 버튼 */
  #ctrls{position:fixed;top:50px;right:14px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .btn{font-family:'Gowun Dodum';font-size:14px;border:none;border-radius:13px;padding:10px 15px;
    cursor:pointer;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s}
  .btn:active{transform:scale(.95)}
  #fireBtn{background:linear-gradient(135deg,#FF8A3D,#F4511E)}
  #fireBtn.off{background:linear-gradient(135deg,#455A64,#37474F)}
  #fireBtn:disabled{opacity:.35;cursor:default}
  #modeBtn{background:rgba(155,123,245,.25);border:1px solid rgba(155,123,245,.5)}
  #resetBtn{background:rgba(255,255,255,.14);border:1px solid var(--hudline);font-size:12.5px}

  /* 기구 트레이 */
  #tray{position:fixed;bottom:0;left:0;right:0;z-index:22;padding:10px 12px 12px;
    display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(transparent, rgba(10,13,17,.85) 40%)}
  #tray::-webkit-scrollbar{display:none}
  .eq{flex:0 0 auto;width:86px;background:rgba(255,255,255,.06);border:1px solid var(--hudline);
    border-radius:15px;padding:9px 6px 8px;text-align:center;color:#dbe7f2;cursor:pointer;
    backdrop-filter:blur(6px);transition:transform .13s,border-color .2s;user-select:none}
  .eq:active{transform:scale(.93)}
  .eq .ic{font-size:26px;line-height:1.15}
  .eq .nm{font-size:11.5px;margin-top:4px;line-height:1.25}
  .eq.placed{opacity:.42}
  .eq.placed .nm::after{content:' ✓';color:#7CF0C9}
  .eq.shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 예측 카드 · 성공 패널 */
  .card{position:fixed;left:50%;transform:translateX(-50%);z-index:26;
    background:rgba(255,255,255,.97);border-radius:18px;padding:16px 18px;max-width:350px;width:92vw;
    box-shadow:0 12px 40px rgba(0,0,0,.5);color:var(--ink);transition:opacity .3s,transform .3s}
  .card.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
  #predict{bottom:120px}
  #predict2{bottom:120px}
  #predict2 h3{font-size:14.5px;margin-bottom:10px;color:#1565C0}
  #predict2 .opts{display:flex;flex-direction:column;gap:8px}
  #predict2 button{font-family:'Gowun Dodum';font-size:14px;border:2px solid #dbe4ee;
    background:#fff;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink)}
  #predict2 button:hover{border-color:#1565C0;background:#f0f7ff}
  #predict h3{font-size:14.5px;margin-bottom:10px;color:#1565C0}
  #predict .opts{display:flex;flex-direction:column;gap:8px}
  #predict button,#success button{font-family:'Gowun Dodum';font-size:14px;border:2px solid #dbe4ee;
    background:#fff;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink)}
  #predict button:hover{border-color:#1565C0;background:#f0f7ff}
  #success{bottom:50%;transform:translate(-50%,50%);text-align:center}
  #success.hide{transform:translate(-50%,50%) translateY(12px)}
  #success .big{font-size:38px}
  #success h3{font-size:18px;color:#0d7a5c;margin:6px 0 4px}
  #success p{font-size:13px;line-height:1.65;color:#41546a}
  #success .row{display:flex;gap:8px;margin-top:13px}
  #success button{flex:1}
  #success button.pri{background:#12B886;border-color:#12B886;color:#fff}

  #toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(255,255,255,.97);color:var(--ink);font-size:13.5px;padding:11px 17px;
    border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:88vw;text-align:center;
    line-height:1.55;transition:opacity .35s;border-left:5px solid var(--green)}
  #toast.warn{border-left-color:var(--orange)}
  #toast.hide{opacity:0;pointer-events:none}

  #loading{position:fixed;inset:0;z-index:50;background:#171b21;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cfe3f5;
    transition:opacity .5s}
  #loading .flask{font-size:44px;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #loading.hide{opacity:0;pointer-events:none}

  @media (max-width:560px){
    #panel{top:auto;bottom:118px;padding:9px 12px;min-width:0}
    #temp{font-size:24px}
    #mission{max-width:86vw;padding:9px 12px}
    #mission .mp{display:none}
    .eq{width:76px} .eq .ic{font-size:23px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <span class="title">🧪 케이랩 과학실</span>
  <span class="badge">미션 · 물의 세 가지 상태</span>
</div>

<div id="panel">
  <div id="temp" class="na">🌡️ 온도계를 설치하면<br>온도가 보여요</div>
  <div id="stateline"></div>
  <div class="volwrap" id="masswrap" style="display:none">
    <div class="lab">저울 — 밀폐 통 전체 무게</div>
    <div class="massread" id="massread">— g</div>
  </div>
  <div class="volwrap" id="volwrap" style="display:none">
    <div class="lab">비커 속 물의 양</div>
    <div class="volbar"><i id="volfill"></i></div>
  </div>
</div>

<div id="mission">
  <div class="mt">🎯 미션: 얼음을 녹이고 물을 끓여, 세 가지 상태를 만들어 보세요</div>
  <div class="mp">아래 선반에서 <b>필요한 기구만</b> 골라 실험대에 준비하세요. 무엇이 필요할까요?</div>
  <div class="prog" id="prog"></div>
</div>

<div id="ctrls">
  <button class="btn off" id="fireBtn" disabled>🔥 불 켜기</button>
  <button class="btn" id="lidBtn" style="display:none">🫙 뚜껑 열기</button>
  <button class="btn" id="modeBtn">🧪 자유 실험</button>
  <button class="btn" id="resetBtn">↺ 처음부터</button>
</div>

<div id="tray"></div>

<div class="card hide" id="predict">
  <h3 id="predictQ">🔮 준비 끝! 예측 — 얼음이 녹기 시작하면, 다 녹을 때까지 온도는?</h3>
  <div class="opts" id="predictOpts">
    <button data-pick="up">① 계속 올라간다</button>
    <button data-pick="stay">② 0℃에 머문다</button>
  </div>
</div>

<div class="card hide" id="predict2">
  <h3>🔮 얼음이 몽땅 물로 변했어요 — 밀폐 통 전체 무게는?</h3>
  <div class="opts">
    <button data-pick="less">① 가벼워졌다</button>
    <button data-pick="same">② 그대로다</button>
  </div>
</div>

<div class="card hide" id="success">
  <div class="big">🏅</div>
  <h3>미션 성공 — 물의 세 가지 상태!</h3>
  <p id="sucMsg"></p>
  <div class="row">
    <button id="sucFree" class="pri">🧪 자유 실험 하기</button>
    <button id="sucAgain">↺ 다시 하기</button>
  </div>
</div>

<div id="toast" class="hide"></div>
<div id="loading"><div class="flask">⚗️</div><div>과학실 준비 중…</div></div>

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 상태 변화 시뮬 (부록 A-2 — 얼음 승온 → 융해 0℃ 고정 → 물 승온 → 100℃ 고정 → 증발) ──
     황금 샘플 createSciSim의 물 승온·끓음·증발 구간을 그대로 품고, 앞에 얼음·융해 2구간을 얹음.
     ★ 질량 보존: 밀폐(lid) 상태면 증발해도 무게 불변(입자 개수 보존). 개방이면 잃은 물만큼 감소. */
  function createStateSim(){
    var S = { temp:-8, ice:1.0, vol:0.35, minVol:0.12, lid:true, mass:200,
              phase:'solid', boiling:false, bubble:0, steam:0, heatK:0 };
    var HEAT_R=0.24, HEAT_RATE=3.4, COOL_RATE=0.018, MELT_RATE=0.05, EVAP_RATE=0.011;
    var REST=-8, VOL_FULL=0.60;           // REST=가열 없을 때 수렴 온도(냉동고). VOL_FULL=얼음 다 녹은 뒤 물 부피(질량 기준)
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      if(typeof inp.lid==='boolean') S.lid=inp.lid;
      var k=0;
      if(inp.lit && inp.ready){
        k = 1 - inp.dist/HEAT_R;
        if(k<0)k=0; if(k>1)k=1;
      }
      S.heatK=k;
      var rest = (S.ice>0) ? REST : 0;    // 얼음 남으면 냉동고(-8)로, 물이면 실온 하한 0(얼지 않음)

      if(S.ice>=1 && S.temp<0){
        // 구간 1 — 얼음 승온 (0℃ 상한)
        S.temp += (HEAT_RATE*k - (S.temp-rest)*COOL_RATE)*dt;
        if(S.temp>0) S.temp=0;
        if(S.temp<-20) S.temp=-20;
        S.boiling=false;
      } else if(S.ice>0 && S.temp>=0){
        // 구간 2 — 융해 잠열: 온도 0℃ 고정, 열은 얼음 녹이는 데
        S.temp=0;
        S.ice -= MELT_RATE*k*dt;
        if(S.ice<0) S.ice=0;
        S.vol += 0.25*(MELT_RATE*k*dt);   // 얼음→물 수위 소폭 상승
        S.boiling=false;
      } else {
        // 구간 3·4 — 물 승온·끓음·증발 (황금 샘플 물 끓이기 로직)
        if(S.temp>=99.9 && k>0 && S.vol>S.minVol){
          S.temp=100; S.boiling=true;
          if(!S.lid){                     // 밀폐면 증발 없음(김이 뚜껑 안에서 맺힘)
            S.vol -= EVAP_RATE*k*dt;
            if(S.vol<S.minVol) S.vol=S.minVol;
          }
        } else {
          S.temp += (HEAT_RATE*k - (S.temp-rest)*COOL_RATE)*dt;
          if(S.temp>100)S.temp=100; if(S.temp<0)S.temp=0;
          S.boiling = (S.temp>=99.9 && k>0 && S.vol>S.minVol);
        }
        if(k<=0 && S.temp<99) S.boiling=false;
      }

      // ★ 질량 보존 — 밀폐면 항상 200g. 개방이면 끓어 증발해 잃은 물만큼만 감소(융해로 는 부피는 무관)
      S.mass = S.lid ? 200 : Math.round(200 - Math.max(VOL_FULL - S.vol, 0)*160);

      // phase 매핑
      if(S.ice>0 && S.temp<0)        S.phase='solid';
      else if(S.ice>0)               S.phase='melt';
      else if(S.boiling)             S.phase='boil';
      else                           S.phase='liquid';

      // 기포·김 게이트 (물 구간에서만 — 황금 샘플 승계)
      var liquidPhase = (S.ice<=0);
      S.bubble = (liquidPhase && S.boiling)?1:(liquidPhase && S.temp>60?(S.temp-60)/40*0.45:0);
      // 밀폐면 김이 뚜껑 안에 갇힘 → 상한 0.4
      var steamRaw = (liquidPhase && S.boiling)?1:(liquidPhase && S.temp>85?(S.temp-85)/15*0.35:0);
      S.steam = S.lid ? Math.min(steamRaw,0.4) : steamRaw;
      return S;
    }
    return { state:S, step:step, HEAT_R:HEAT_R };
  }

  /* ── 미션 정의 (부록 A-1 — 미션 = 데이터) ── */
  var MISSION_STATES = {
    id:'states_change',
    title:'물의 세 가지 상태',
    required:['tripod','gauze','beaker_ice','lamp','thermo','scale'],
    // 절차 규칙: 이 기구를 놓으려면 먼저 있어야 하는 것
    needs:{
      gauze:      { pre:['tripod'], msg:'그물은 삼발이 위에 올려요 — <b>삼발이가 먼저</b> 필요해요!' },
      beaker_ice: { pre:['tripod','gauze'], msg:'뜨거워질 비커를 안전하게 받치려면 <b>삼발이와 그물이 먼저</b>!' },
      thermo:     { pre:['beaker_ice'], msg:'온도계는 얼음물에 꽂아 재요 — <b>비커가 먼저</b>!' },
      scale:      { pre:['beaker_ice'], msg:'무게를 재려면 <b>잴 것(비커)이 먼저</b> 있어야죠!' }
    },
    // 오답 기구: 왜 아닌지가 곧 학습
    wrong:{
      magnet:'🧲 자석은 철을 끌어당기는 도구예요 — 상태 변화 실험에는 필요 없어요.',
      magnifier:'🔍 돋보기는 작은 것을 크게 관찰할 때! 온도와 무게를 재는 이 실험에는 필요 없어요.',
      rod:'🥢 유리막대는 녹이거나 섞을 때 젓는 기구예요. 얼음은 젓지 않아도 열로 녹아요!',
      tube:'⚗️ 시험관은 적은 양을 다룰 때 좋아요. 얼음을 녹여 끓이기에는 <b>비커</b>가 알맞아요.'
    }
  };

  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      // 위에 얹힌 것부터 함께 회수 (의존 역순)
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  var API = { createStateSim:createStateSim, MISSION_STATES:MISSION_STATES, createMissionRun:createMissionRun };
  if(typeof window!=='undefined'){ window.SciLab=API; }

function rippleWater(t,amp){
  const pos=waterGeo.attributes.position, arr=pos.array;
  const topHalf=WATER_H0/2-0.0001;
  for(let i=0;i<arr.length;i+=3){
    if(waterBase[i+1]>=topHalf){
      const x=waterBase[i], z=waterBase[i+2];
      arr[i+1]=waterBase[i+1]+
        amp*Math.sin(t*4.2+x*55+z*47)+
        amp*0.6*Math.sin(t*6.8+x*90-z*60);
    }
  }
  pos.needsUpdate=true;
  waterGeo.computeVertexNormals();
}
function stepBubbles(dt,intensity,topLocal){
  const active=Math.floor(Math.min(bubbleMax,B_N)*intensity);
  const bottom=0.012, span=Math.max(topLocal-bottom-0.008,0.01);
  for(let i=0;i<B_N;i++){
    if(i>=active){ bPos[i*3+1]=-999; continue; }
    const m=bMeta[i];
    m.y+=(0.16+0.45*intensity)*m.sp*dt/span;
    if(m.y>1){ m.y=0;
      const a=Math.random()*Math.PI*2, r=Math.random()*(BK_R-0.03);
      m.x=Math.cos(a)*r; m.z=Math.sin(a)*r;
    }
    bPos[i*3]  =m.x+Math.sin(m.y*22+i)*0.004;
    bPos[i*3+1]=bottom+m.y*span;
    bPos[i*3+2]=m.z+Math.cos(m.y*19+i)*0.004;
  }
  bGeo.attributes.position.needsUpdate=true;
}

  if(now-fpsStart>4000){

}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  const ready = !!(run.placed.tripod && run.placed.gauze && run.placed.beaker_ice);
  const S=sim.step(dt,{lit, dist:lampDist(), ready, lid:!lidOpen});

  // HUD — 온도는 온도계가 있어야 보임
  if(run.placed.thermo){
    tempEl.className='';
    tempEl.innerHTML=S.temp.toFixed(1)+'<small> ℃</small>';
    thermoCol.scale.y=0.02+(S.temp+10)/120*0.155;   // 부록 A-5: −10~110℃ 매핑
    volEl.style.width=(S.vol*100).toFixed(0)+'%';
  }
  if(run.placed.scale) massEl.textContent=S.mass+' g';

  // ★와우 — 융해 완료 순간, 밀폐 상태면 질량 보존 2차 예측 (중/고학년)
  if(!meltDone && S.ice<=0){
    meltDone=true;
    if(showWow && !lidOpen && !predict2Shown && !freeMode){
      predict2Shown=true;
      predict2El.classList.remove('hide');
    }
  }

  let st='';
  if(succeeded) st='🏅 미션 성공!';
  else if(S.phase==='melt') st='🧊 녹는 중 — 0℃에 머물러요!';
  else if(S.boiling) st='💨 끓는 중 — 100℃에 머물러요!';
  else if(S.heatK>0 && lit) st=(S.phase==='solid')?'🔥 얼음이 데워지는 중…':'🔥 가열 중…';
  else if(lit && !ready) st='가열하려면 비커까지 준비!';
  else if(lit) st='램프를 비커 아래로 옮겨요';
  else if(S.temp>35) st='식는 중…';
  stateEl.textContent=st;

  if(!flags.warm && S.temp>60 && S.temp<99){
    flags.warm=true;
    toast('🫧 60℃가 넘으니 바닥에서 작은 기포가 생기기 시작해요');
  }
  if(S.boiling){
    if(!successAt) successAt=t;
    if(!boilStart) boilStart=t;
    // (안전) 밀폐한 채 30초 이상 끓이면 자동으로 뚜껑을 살짝 열어줌 — 부록 A-2
    if(!lidOpen && t-boilStart>30){
      lidOpen=true; lidBtn.textContent='🫙 뚜껑 닫기';
      toast('⚠️ 밀폐한 채 오래 끓이면 위험해요 — 안전을 위해 뚜껑을 살짝 열었어요!', true, 5200);
    }
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='온도가 <b>멈추는 곳이 두 군데</b> 있었죠 — 녹는 동안 <b>0℃</b>, 끓는 동안 <b>100℃</b>. 남는 열은 온도를 올리는 대신 <b>상태를 바꾸는 데</b> 쓰이거든요.';
      if(prediction) msg=(prediction==='stay'?'🎯 <b>1차 예측 적중!</b> ':'🤔 1차 예측과 달랐죠? ')+msg;
      if(prediction2) msg+= (prediction2==='same')
        ? '<br>🎯 <b>2차도 적중</b> — 밀폐하면 상태가 바뀌어도 <b>무게는 그대로</b>(물 알갱이 개수 보존)!'
        : '<br>🤔 2차 예측은 달랐죠? 밀폐하면 수증기도 통 안에 있어서 <b>무게는 그대로</b>예요!';
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' :
                    `<br>기구 고르기 다시 생각해 본 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      if(!freeMode) successEl.classList.remove('hide');
      else toast('💨 끓기 시작 — 온도는 100℃ 고정!',false,5200);
    }
  } else { successAt=0; boilStart=0; }
  if(!flags.low && S.vol<=sim.state.minVol+0.001){
    flags.low=true;
    toast('⚠️ 물이 거의 다 줄었어요! 실제 실험에서는 다 마르기 전에 불을 꺼야 안전해요', true, 5200);
  }

  // 물·기포·김·얼음·뚜껑 (비커가 있을 때만)
  if(run.placed.beaker_ice){
    const topLocal=layoutWater(S.vol);
    rippleWater(t, 0.0012+0.0055*S.bubble);
    stepBubbles(dt, S.bubble, topLocal);
    steam.position.y=topLocal+0.005;
    steamUni.uTime.value=t;
    steamUni.uIntensity.value+=(S.steam-steamUni.uIntensity.value)*Math.min(dt*2.5,1);
    updateIce(S.ice, topLocal);
    // 뚜껑 개폐 트윈 — 옆으로 미끄러지며 살짝 뜸
    const tgt = lidOpen?1:0;
    lidMesh.userData.open += (tgt-lidMesh.userData.open)*Math.min(dt*4,1);
    const op=lidMesh.userData.open;
    lidMesh.position.x = op*0.16;
    lidMesh.position.y = BK_H+0.006 + op*0.05;
  }

  if(lit){
    const f=1+0.10*Math.sin(t*23)+0.06*Math.sin(t*57+1.7);
    flameOuter.scale.set(0.058*f, 0.115*f*(1+0.05*Math.sin(t*31)), 1);
    flameInner.scale.set(0.034*f, 0.06*f, 1);
    flameLight.intensity=2.3+0.6*Math.sin(t*19)*Math.sin(t*7);
  } else flameLight.intensity=0;

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  steamUni.uScale.value=innerHeight*0.5;
});

document.getElementById('loading').classList.add('hide');
toast('🎯 미션: 선반에서 <b>필요한 기구만</b> 골라 실험을 준비해 봐요!', false, 5200);
animate();
</script>
</body>
</html>

  #ctrl .effortTags{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:1px}
  #ctrl .btns{display:flex;gap:8px}
  #ctrl .btns button{font-family:'Jua';font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.06);

    align-items:center;justify-content:center;gap:16px;z-index:9999}

<!--
  ═══════════════════════════════════════════════════════════════════
  순수 로직 (P1 게이트 · 렌더 0줄) — window.KBody / module.exports
  생리 = 표준 운동생리 근사 + 교과서값(창작 아님). effort 하나가 순환·호흡 함께 구동.
  앵커: 안정 심박 70bpm·호흡 15/분·심박출량 ~4.9L/분 / 최대 190·45·19.0.
  ★와우: effort↑ → 심박·호흡 동시↑ (몸은 하나로 이어진 시스템).
  ═══════════════════════════════════════════════════════════════════
-->
<script id="body-pure">
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.KBody = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ── 확정 상수(§2 · 표준 운동생리 근사·교과서값) ── */
  var HR_REST=70,  HR_MAX=190;    // 심박수(bpm)
  var SV_REST=70,  SV_MAX=100;    // 1회 박출량(mL)
  var RR_REST=15,  RR_MAX=45;     // 호흡수(회/분)
  var TV_REST=0.5, TV_MAX=2.0;    // 1회 호흡량(L)
  var VO2_REST=0.25, VO2_MAX=3.5; // 산소 소비(L/분)
  var SPO2_NORMAL=98, SPO2_FLOOR=70;
  var HOLD_DROP=1.6, RECOVER=4.0; // 숨참기 하강율·재개 회복율(%/초)

  function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }
  function lerp(a, b, e){ return a + clamp(e, 0, 1) * (b - a); }

  /* ── 순환 ── */
  function heartRate(effort){ return lerp(HR_REST, HR_MAX, effort); }            // bpm
  function strokeVolume(effort){ return lerp(SV_REST, SV_MAX, effort); }         // mL
  function cardiacOutput(effort){ return heartRate(effort) * strokeVolume(effort) / 1000; } // L/분

  /* ── 호흡 ── */
  function respRate(effort){ return lerp(RR_REST, RR_MAX, effort); }             // 회/분
  function tidalVolume(effort){ return lerp(TV_REST, TV_MAX, effort); }          // L
  function ventilation(effort){ return respRate(effort) * tidalVolume(effort); } // L/분

  /* ── 산소 ── */
  function o2Demand(effort){ return lerp(VO2_REST, VO2_MAX, effort); }           // L/분
  function spo2(held, breathing){
    if (breathing == null) breathing = (held <= 0);
    if (breathing) return SPO2_NORMAL;
    return clamp(SPO2_NORMAL - held * HOLD_DROP, SPO2_FLOOR, SPO2_NORMAL);        // 숨참기 하강
  }
  function o2Delivery(effort, sp){                                                // 산소 운반(순환×포화)
    if (sp == null) sp = SPO2_NORMAL;
    return cardiacOutput(effort) * (sp / 100);
  }

  /* ── 혈류 경로(렌더 파티클용 · bodysys 승계) ── */
  function circPath(){ return ['heart', 'artery', 'body', 'vein', 'lungs', 'heart']; }

  /* ── 기관 역할(bodysys job 텍스트 승계) ── */
  var ORGANS = {
    heart:  { nm: '심장', emo: '❤️', job: '쉬지 않고 뛰며 온몸으로 피를 보내는 펌프예요.' },
    lungs:  { nm: '폐',   emo: '💨', job: '공기 속 산소를 받아 피로 보내요.' },
    vessel: { nm: '혈관', emo: '🩸', job: '산소와 영양분을 실어 온몸으로 나르는 길이에요.' },
  };

  /* ── 시나리오 3종(§4) ── */
  var SCENARIOS = [
    { id: 'B-1', icon: '❤️', title: '심장을 뛰게', grade: 'low',
      brief: '쉬는 상태에서 심장이 뛰고 피가 온몸을 도는 걸 관찰하자.',
      hint: '심장은 쉬지 않고 뛰며 피를 온몸으로 보내요.' },
    { id: 'B-2', icon: '🏃', title: '달리기', grade: 'mid', wow: true,
      brief: '활동을 세게 하면 심장과 숨이 어떻게 변하는지 보자.',
      hint: '활동 강도를 올려 심장과 호흡을 함께 지켜보세요.' },
    { id: 'B-3', icon: '💨', title: '숨을 참으면', grade: 'high',
      brief: '숨을 참으면 몸속 산소가 어떻게 되는지 관찰하자.',
      hint: '실험은 화면에서만! 숨 참기 버튼으로 산소가 주는 걸 지켜보세요.' },
  ];
  var GRADE_SCENARIOS = { low: ['B-1'], mid: ['B-1', 'B-2'], high: ['B-1', 'B-2', 'B-3'] };
  function scenarioById(id){ for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].id === id) return SCENARIOS[i]; return null; }

  /* ── ★와우(B-2): 몸은 하나로 이어진 시스템 ── */
  var WOW_EXERCISE = {
    at: 'B-2',
    q: '달리기를 하면 심장은 빨라져요. 그럼 숨은 어떻게 될까?',
    opts: [
      '숨은 평소처럼 그대로다',
      '숨도 함께 가빠진다',
    ],
    answer: 1,
    explain: '달릴 때는 근육이 산소를 훨씬 많이 써요. 그래서 심장은 더 빨리 뛰어 산소 실은 피를 나르고, ' +
      '폐도 더 빨리 숨 쉬어 산소를 많이 들이마셔요. 심장만 빨라지는 게 아니라 심장과 폐가 함께 빨라지죠 — ' +
      '우리 몸은 따로 노는 부품이 아니라 하나로 이어진 시스템이에요.',
  };

  return {
    HR_REST: HR_REST, HR_MAX: HR_MAX, RR_REST: RR_REST, RR_MAX: RR_MAX,
    SPO2_NORMAL: SPO2_NORMAL, SPO2_FLOOR: SPO2_FLOOR, HOLD_DROP: HOLD_DROP, RECOVER: RECOVER,
    clamp: clamp, lerp: lerp,
    heartRate: heartRate, strokeVolume: strokeVolume, cardiacOutput: cardiacOutput,
    respRate: respRate, tidalVolume: tidalVolume, ventilation: ventilation,
    o2Demand: o2Demand, spo2: spo2, o2Delivery: o2Delivery, circPath: circPath,
    ORGANS: ORGANS, SCENARIOS: SCENARIOS, GRADE_SCENARIOS: GRADE_SCENARIOS,
    scenarioById: scenarioById, WOW_EXERCISE: WOW_EXERCISE,
  };
});
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const K = window.KBody;
const P = new URLSearchParams(location.search);
const grade = P.get('grade') || 'high';

/* ═════════ 렌더 기반 (황금 표준 · 해부 톤) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', function(e){ e.preventDefault();
  const o=document.getElementById('ctxlost'); if(o){ o.style.display='flex'; } });

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d'); const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2a1016'); gr.addColorStop(.6,'#180a0e'); gr.addColorStop(1,'#0c0508');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace; scene.background=bg;
}
scene.fog = new THREE.Fog(0x140a0e, 3.4, 8.5);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0, 0.15, 3.15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.12, 0);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=1.8; controls.maxDistance=6; controls.maxPolarAngle=Math.PI*0.9;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.add(new THREE.AmbientLight(0x40282e, 0.5));
{
  const key=new THREE.DirectionalLight(0xfff0f2, 1.1); key.position.set(2,3,4); scene.add(key);
  const rim=new THREE.DirectionalLight(0x6a90c0, 0.5); rim.position.set(-3,1,-2); scene.add(rim);
}

/* ═════════ 몸 실루엣 (반투명 상체) ═════════ */
{
  let bodyGeo;
  try { bodyGeo = new THREE.CapsuleGeometry(0.62, 0.85, 8, 24); }
  catch(e){ bodyGeo = new THREE.CylinderGeometry(0.6, 0.55, 1.5, 24); }  // 하위 폴백
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshPhysicalMaterial({
    color:0xffd5cf, transparent:true, opacity:0.09, roughness:0.55, metalness:0, transmission:0.35, thickness:0.5 }));
  body.position.y=0.1; scene.add(body);
}

/* ═════════ 심장 (박동) ═════════ */
const heart = new THREE.Group();
const heartMat = new THREE.MeshStandardMaterial({ color:0xe8546b, roughness:0.42, emissive:0x3a0a12, emissiveIntensity:0.45 });
{
  const lobe = new THREE.SphereGeometry(0.13, 20, 16);
  const lobeL = new THREE.Mesh(lobe, heartMat); lobeL.position.set(-0.075, 0.05, 0);
  const lobeR = new THREE.Mesh(lobe, heartMat); lobeR.position.set(0.075, 0.05, 0);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.165, 0.26, 20), heartMat);
  tip.position.set(0, -0.12, 0); tip.rotation.z = Math.PI;
  heart.add(lobeL, lobeR, tip);
}
heart.position.set(-0.05, 0.2, 0.14);
scene.add(heart);
const heartLight = new THREE.PointLight(0xff5064, 0.5, 2.4); heart.add(heartLight);

/* ═════════ 폐 (팽창/수축) ═════════ */
const lungMat = new THREE.MeshPhysicalMaterial({ color:0x5ab4e0, transparent:true, opacity:0.55, roughness:0.4, transmission:0.15 });
const LUNG_BASE = [0.7, 1.15, 0.55];
function makeLung(sx){
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 16), lungMat);
  m.scale.set(LUNG_BASE[0], LUNG_BASE[1], LUNG_BASE[2]);
  m.position.set(sx, 0.36, 0.0); return m;
}
const lungL = makeLung(-0.33), lungR = makeLung(0.33);
scene.add(lungL, lungR);

/* ═════════ 혈류 (circPath 순환 파티클) ═════════ */
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.05, 0.18, 0.22),  // heart
  new THREE.Vector3( 0.02, 0.66, 0.16),  // artery (위)
  new THREE.Vector3( 0.06,-0.52, 0.16),  // body (아래)
  new THREE.Vector3( 0.30, 0.06, 0.16),  // vein
  new THREE.Vector3( 0.33, 0.36, 0.18),  // lungs
  new THREE.Vector3(-0.05, 0.18, 0.22),  // → heart
], true, 'catmullrom', 0.2);
const BN = 26;
const dummy = new THREE.Object3D();
const bloodMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.022, 8, 8),
  new THREE.MeshStandardMaterial({ color:0xd63a54, emissive:0x5a0a16, emissiveIntensity:0.7 }), BN);
scene.add(bloodMesh);

/* ═════════ 상태 ═════════ */
let effort = 0, breathing = true, held = 0, curSpo2 = K.SPO2_NORMAL;
let heartPhase = 0, lungPhase = 0, bloodU = 0;

/* ═════════ 산소 게이지 렌즈 (Canvas2D) ═════════ */
const lensEl = document.getElementById('lens');
const cv = document.getElementById('gaugeCv'), cx = cv.getContext('2d');
const HIST_MAX = 220; const hist = [];
function drawGauge(){
  const W=cv.width, H=cv.height, pad=8;
  cx.clearRect(0,0,W,H);
  // SpO2 곡선 (상단 2/3)
  const gh = H*0.62;
  cx.strokeStyle='rgba(255,255,255,.10)'; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(0,gh); cx.lineTo(W,gh); cx.stroke();
  // 70~100% 범위
  const yAt=v=> pad + (100-v)/(100-65)*(gh-pad*2);
  cx.fillStyle='rgba(111,207,159,.7)'; cx.font='700 13px Jua, sans-serif';
  cx.fillText('산소포화도 '+Math.round(curSpo2)+'%', 6, 16);
  if(hist.length>1){
    cx.strokeStyle='#6fcf9f'; cx.lineWidth=2.4; cx.beginPath();
    for(let i=0;i<hist.length;i++){ const x=i/(HIST_MAX-1)*W, y=yAt(hist[i].spo2);
      if(i===0)cx.moveTo(x,y); else cx.lineTo(x,y); }
    cx.stroke();
    // 위험선 90%
    cx.strokeStyle='rgba(230,84,107,.4)'; cx.setLineDash([4,4]); cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(0,yAt(90)); cx.lineTo(W,yAt(90)); cx.stroke(); cx.setLineDash([]);
  }
  // 심박·호흡 막대 (하단)
  const hr=K.heartRate(effort), rr=K.respRate(effort);
  const by=gh+18, bw=W-16;
  const bar=(y,label,val,max,col)=>{
    cx.fillStyle='rgba(255,255,255,.5)'; cx.font='11px Gowun Dodum, sans-serif';
    cx.fillText(label, 6, y-4);
    cx.fillStyle='rgba(255,255,255,.08)'; cx.fillRect(8, y, bw, 12);
    cx.fillStyle=col; cx.fillRect(8, y, bw*Math.min(1,val/max), 12);
  };
  bar(by, '심박 '+Math.round(hr)+' bpm', hr, 200, '#e8546b');
  bar(by+34, '호흡 '+Math.round(rr)+' 회/분', rr, 50, '#5ab4e0');
}

/* ═════════ HUD ═════════ */
function syncHud(){
  const hr=K.heartRate(effort), rr=K.respRate(effort), co=K.cardiacOutput(effort);
  document.getElementById('hHr').textContent=Math.round(hr)+' bpm';
  document.getElementById('hRr').textContent=Math.round(rr)+'/분';
  document.getElementById('hCo').textContent=co.toFixed(1)+' L/분';
  document.getElementById('hO2').textContent=Math.round(curSpo2)+'%';
  document.getElementById('lEffort').textContent = effort<0.15?'휴식':effort<0.6?'걷기':'달리기';
  document.getElementById('lensSub').textContent = '산소 '+Math.round(curSpo2)+'%';
}

/* ═════════ 조작 ═════════ */
let hintTimer=null;
function showHint(msg){ const h=document.getElementById('hint'); h.textContent=msg; h.classList.add('show');
  clearTimeout(hintTimer); hintTimer=setTimeout(()=>h.classList.remove('show'), 3400); }

const sEffort=document.getElementById('sEffort');
sEffort.addEventListener('input', ()=>{ effort=parseFloat(sEffort.value); syncHud(); });
const holdBtn=document.getElementById('holdBtn');
holdBtn.addEventListener('click', ()=>{
  breathing=!breathing; if(!breathing) held=0;
  holdBtn.classList.toggle('on', !breathing);
  holdBtn.textContent = breathing ? '💨 숨 참기' : '💨 숨 참는 중…';
  showHint(breathing ? '다시 숨을 쉬어요 — 산소가 회복돼요.' : '실험은 화면에서만! 산소가 어떻게 되는지 지켜보세요.');
});
const resetBtn=document.getElementById('resetBtn');
resetBtn.addEventListener('click', ()=>{
  effort=0; breathing=true; held=0; curSpo2=K.SPO2_NORMAL; sEffort.value=0;
  holdBtn.classList.remove('on'); holdBtn.textContent='💨 숨 참기'; hist.length=0; syncHud();
  showHint('처음 상태로 되돌렸어요.');
});

/* ═════════ 학년칸 (§4) — 저=게이지 숨김(관찰) ═════════ */
if(grade==='low'){ lensEl.classList.add('hide'); }

/* ═════════ 애니메이션 ═════════ */
let t0=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.05,(now-t0)/1000); t0=now;
  const hr=K.heartRate(effort), rr=K.respRate(effort), co=K.cardiacOutput(effort);
  // 심박 펄스 (주기 60/hr 초)
  heartPhase += dt / (60/hr); if(heartPhase>=1) heartPhase-=1;
  const hs = 1 + 0.14*Math.max(0, Math.sin(heartPhase*Math.PI)*Math.exp(-heartPhase*2.6));
  heart.scale.setScalar(hs);
  heartLight.intensity = 0.35 + 3.5*(hs-1);
  // 폐 호흡 (주기 60/rr 초)
  lungPhase += dt / (60/rr);
  const br = 1 + 0.16*Math.sin(lungPhase*Math.PI*2);
  lungL.scale.set(LUNG_BASE[0]*br, LUNG_BASE[1]*br, LUNG_BASE[2]*br);
  lungR.scale.set(LUNG_BASE[0]*br, LUNG_BASE[1]*br, LUNG_BASE[2]*br);
  // 혈류 흐름 (CO 비례 속도)
  bloodU += dt * (0.05 + co/19*0.22);
  for(let i=0;i<BN;i++){
    const u=(bloodU + i/BN)%1; const p=curve.getPoint(u);
    dummy.position.copy(p); dummy.scale.setScalar(1); dummy.updateMatrix();
    bloodMesh.setMatrixAt(i, dummy.matrix);
  }
  bloodMesh.instanceMatrix.needsUpdate=true;
  // 산소 (숨참기 하강 / 재개 회복)
  if(breathing){ curSpo2 = Math.min(K.SPO2_NORMAL, curSpo2 + K.RECOVER*dt); }
  else { held += dt; curSpo2 = K.spo2(held, false); }
  hist.push({ spo2:curSpo2, hr, rr }); if(hist.length>HIST_MAX) hist.shift();
  syncHud();
  if(!lensEl.classList.contains('hide')) drawGauge();
  controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

syncHud();
document.getElementById('loading').classList.add('hide');
animate();

/* 검증 훅 */
window.__BODY_P2__ = {
  K, heart, lungL, lungR, bloodMesh, BN,
  get effort(){ return effort; },
  get spo2(){ return curSpo2; },
  get breathing(){ return breathing; },
  setEffort(v){ effort=v; sEffort.value=v; syncHud(); },
  toggleHold(){ holdBtn.click(); },
  holdFor(sec){ if(!breathing){ held+=sec; curSpo2=K.spo2(held,false); syncHud(); } },
  reset(){ effort=0; breathing=true; held=0; curSpo2=K.SPO2_NORMAL; sEffort.value=0; hist.length=0; syncHud(); },
  drawGauge, syncHud,
};
</script>

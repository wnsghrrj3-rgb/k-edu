<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>애니메이션 공방 | 케이아트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="/kedu_collect.js"></script>
<style id="kedu-title-font">/* 케이에듀 제목 폰트 토큰 (학교안심 모험가) — v3 표준 */
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Gowun Dodum',sans-serif}

<!-- ═══════════════════════════════════════════════════════════════
     순수 로직 (렌더러 무관 · node 테스트 대상)
     대상 테스트: handoff/draw/tests/test_animlab.js
     3모델: 프레임 스토어 · 어니언 스킨 규칙 · 재생 컨트롤러
     ═══════════════════════════════════════════════════════════════ -->
<script id="animlab-logic">
(function(){
  'use strict';

  var MAX_FRAMES = 24, MIN_FRAMES = 1;

  function clampFps(f){ return Math.max(2, Math.min(12, Math.round(f))); }

  /* ── 프레임 스토어 ──
     순수 데이터 모델. 렌더러가 각 프레임 객체에 .canvas(오프스크린)를 부착한다.
     로직 계층은 프레임 배열의 순서·개수·현재 인덱스만 책임진다.
     장 전환은 프레임 객체를 파괴하지 않는다 → 왕복 무결의 로직 근거. */
  function createFrameStore(opts){
    opts = opts || {};
    var max = opts.max || MAX_FRAMES;
    var seq = 0;
    function mkFrame(){ return { id: ++seq }; }
    var frames = [];
    var startN = opts.start || 1;
    for(var i=0;i<startN;i++) frames.push(mkFrame());
    var cur = 0;

    function count(){ return frames.length; }
    function current(){ return cur; }
    function frameAt(i){ return frames[i]; }
    function get(){ return frames[cur]; }

    function setCurrent(i){
      if(i<0 || i>=frames.length) return false;
      cur = i; return true;
    }
    function add(){                      // 맨 끝에 빈 프레임 + 그 자리로 이동
      if(frames.length>=max) return {ok:false, reason:'max'};
      var f = mkFrame(); frames.push(f); cur = frames.length-1;
      return {ok:true, index:cur, frame:f};
    }
    function insertAfter(i){              // i 다음에 빈 프레임
      if(frames.length>=max) return {ok:false, reason:'max'};
      var f = mkFrame(); frames.splice(i+1,0,f); cur = i+1;
      return {ok:true, index:cur, frame:f};
    }
    function duplicate(i){               // i 복제(렌더러가 픽셀 복사) — 로직은 srcId 표기
      if(frames.length>=max) return {ok:false, reason:'max'};
      var f = mkFrame(); f.srcId = frames[i].id;
      frames.splice(i+1,0,f); cur = i+1;
      return {ok:true, index:cur, frame:f, src:frames[i]};
    }
    function remove(i){
      if(frames.length<=MIN_FRAMES) return {ok:false, reason:'min'};
      if(i<0 || i>=frames.length) return {ok:false, reason:'range'};
      frames.splice(i,1);
      if(cur>=frames.length) cur = frames.length-1;
      return {ok:true, index:cur};
    }
    function move(from,to){
      if(from<0||from>=frames.length||to<0||to>=frames.length) return {ok:false, reason:'range'};
      var f = frames.splice(from,1)[0];
      frames.splice(to,0,f);
      cur = to;
      return {ok:true, from:from, to:to};
    }
    function ids(){ return frames.map(function(f){return f.id;}); }

    return { count:count, current:current, setCurrent:setCurrent, get:get,
             frameAt:frameAt, add:add, insertAfter:insertAfter, duplicate:duplicate,
             remove:remove, move:move, ids:ids, max:max, _frames:frames };
  }

  /* ── 어니언 스킨 규칙 ──
     현재 인덱스 기준으로 반투명 겹쳐 보일 이웃 프레임 목록을 계산한다.
     지난 장 = 빨강 틴트(직전 30%·전전 15%), 다음 장 = 파랑 틴트(30%).
     렌더러는 이 목록대로 오프스크린 캔버스에 합성한다(순수 2D). */
  function onionLayers(count, cur, opts){
    opts = opts || {};
    if(!opts.on || count<=1) return [];
    var prevTint = opts.prevTint || '#EF4444';
    var nextTint = opts.nextTint || '#3B82F6';
    var L = [];
    if(cur-1>=0)      L.push({ index:cur-1, opacity:0.30, tint:prevTint });
    if(cur-2>=0)      L.push({ index:cur-2, opacity:0.15, tint:prevTint });
    if(cur+1<count)   L.push({ index:cur+1, opacity:0.30, tint:nextTint });
    return L;
  }

  /* ── 재생 컨트롤러 ──
     fps 2~12 클램프, 모드 loop/pingpong/once. tick(dt)로 시간을 누적해
     정확히 1/fps 마다 다음 프레임으로 진행한다(프레임 드롭 없이 누적 소비). */
  function createPlayback(opts){
    opts = opts || {};
    var fps = clampFps(opts.fps || 8);
    var mode = opts.mode || 'loop';   // 'loop' | 'pingpong' | 'once'
    var idx = opts.start || 0;
    var dir = 1, acc = 0, playing = false;

    function advance(count){
      if(count<=1){ idx=0; return {index:0, wrapped:false}; }
      var wrapped = false;
      if(mode==='loop'){
        idx++; if(idx>=count){ idx=0; wrapped=true; }
      } else if(mode==='pingpong'){
        idx += dir;
        if(idx>=count){ idx=count-2; dir=-1; wrapped=true; }
        else if(idx<0){ idx=1; dir=1; wrapped=true; }
      } else {                          // once
        if(idx<count-1){ idx++; }
        else { wrapped=true; playing=false; }
      }
      return {index:idx, wrapped:wrapped};
    }
    function tick(dt, count){
      if(!playing) return {index:idx, advanced:false};
      acc += dt;
      var spf = 1/fps, advanced=false, guard=0;
      while(acc >= spf && guard++ < 240){
        acc -= spf; advance(count); advanced=true;
        if(!playing) break;
      }
      return {index:idx, advanced:advanced};
    }
    function play(){ playing=true; acc=0; }
    function pause(){ playing=false; }
    function stop(){ playing=false; idx=0; dir=1; acc=0; }
    function seek(i){ idx=i; }
    function setFps(f){ fps=clampFps(f); }
    function setMode(m){ if(m==='loop'||m==='pingpong'||m==='once'){ mode=m; dir=1; } }

    return { advance:advance, tick:tick, play:play, pause:pause, stop:stop,
             seek:seek, setFps:setFps, setMode:setMode,
             index:function(){return idx;}, isPlaying:function(){return playing;},
             fps:function(){return fps;}, mode:function(){return mode;} };
  }

  /* ── 미션 9종 (데이터 = 학년칸 3×3) ──
     미션 = 권장 장수 + 각 장 안내. 완성 = 권장 장수만큼 각 장에 그림이 있음.
     needGuide: 겹쳐보기 참조가 특히 중요한 미션(걷기) 표시. */
  var MISSIONS = [
    { id:'ball',   grade:'1-2', title:'공 튀기기', frames:3, fps:6,
      hint:'3장이면 공이 통통 튑니다!',
      guides:['화면 위쪽에 동그란 공','바닥에 닿아 납작해진 공','다시 위로 튀어오른 공'] },
    { id:'blink',  grade:'1-2', title:'깜빡이는 별', frames:3, fps:5,
      hint:'커졌다 작아지면 반짝여요',
      guides:['활짝 빛나는 별','조금 작고 흐린 별','다시 활짝 빛나는 별'] },
    { id:'frog',   grade:'1-2', title:'폴짝 개구리', frames:3, fps:6,
      hint:'웅크리고 → 점프 → 착지',
      guides:['웅크린 개구리','공중으로 뛰어오른 개구리','바닥에 착지한 개구리'] },
    { id:'flower', grade:'3-4', title:'꽃 피어나기', frames:6, fps:5,
      hint:'6장에 걸쳐 조금씩 자라게 그려요',
      guides:['땅속 씨앗','뾰족 올라온 새싹','줄기와 잎','꽃봉오리','반쯤 핀 꽃','활짝 핀 꽃'] },
    { id:'cloud',  grade:'3-4', title:'흘러가는 구름', frames:4, fps:4,
      hint:'구름이 해를 지나 천천히 흘러가요',
      guides:['왼쪽에 구름, 오른쪽에 해','조금 오른쪽으로 온 구름','해에 가까워진 구름','해를 지나는 구름'] },
    { id:'candle', grade:'3-4', title:'흔들리는 촛불', frames:4, fps:6,
      hint:'불꽃이 살랑살랑 흔들려요',
      guides:['똑바로 선 불꽃','왼쪽으로 기운 불꽃','다시 똑바로 선 불꽃','오른쪽으로 기운 불꽃'] },
    { id:'walk',   grade:'5-6', title:'걷기 사이클', frames:8, fps:8, needGuide:true,
      hint:'겹쳐보기로 앞 장을 따라 그리면 자연스러워요',
      guides:['오른발 앞으로(바닥 딛기)','몸이 가장 높이 뜬 순간','왼발이 지나가며','왼발 바닥 딛기',
              '왼발 앞으로(바닥 딛기)','몸이 가장 높이 뜬 순간','오른발이 지나가며','오른발 바닥 딛기'] },
    { id:'arc',    grade:'5-6', title:'포물선 튀는 공', frames:6, fps:8,
      hint:'포물선을 그리며 점점 낮게 튀어요',
      guides:['왼쪽 위에서 출발','내려오며 오른쪽으로','바닥에 닿아 눌림','튀어오르며','정점(조금 낮게)','다시 내려오기'] },
    { id:'face',   grade:'5-6', title:'표정 바꾸기', frames:6, fps:5,
      hint:'얼굴 윤곽은 그대로, 눈·입만 조금씩 바꿔요',
      guides:['무표정한 얼굴','눈이 조금 커지고','입꼬리가 올라가며','미소','활짝 웃음','눈웃음까지'] }
  ];
  function findMission(id){ for(var i=0;i<MISSIONS.length;i++) if(MISSIONS[i].id===id) return MISSIONS[i]; return null; }
  function missionsByGrade(g){ return MISSIONS.filter(function(m){return m.grade===g;}); }

  function createMissionRun(M){
    // filledArr[i] = i번 장에 그림이 있는가(렌더러가 픽셀 검사로 채움)
    function status(filledArr){
      filledArr = filledArr || [];
      var have = 0;
      for(var i=0;i<M.frames;i++) if(filledArr[i]) have++;
      return { need:M.frames, have:have, done:have>=M.frames };
    }
    return { mission:M, status:status };
  }

  /* ── CRC32 + 무압축(store) zip 빌더 (라이브러리 0) ──
     PNG 시퀀스 내보내기용. files=[{name, data:Uint8Array}] → zip Uint8Array. */
  function crc32(bytes){
    var T = crc32._t;
    if(!T){ T=crc32._t=new Array(256);
      for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); T[n]=c>>>0; } }
    var crc=0xFFFFFFFF;
    for(var i=0;i<bytes.length;i++) crc=(crc>>>8)^T[(crc^bytes[i])&0xFF];
    return (crc^0xFFFFFFFF)>>>0;
  }
  function buildStoreZip(files){
    var enc = (typeof TextEncoder!=='undefined') ? new TextEncoder()
              : { encode:function(s){ var a=[]; for(var i=0;i<s.length;i++) a.push(s.charCodeAt(i)&0xFF); return new Uint8Array(a); } };
    var chunks=[], central=[], offset=0;
    function u16(n){ return [n&0xFF,(n>>8)&0xFF]; }
    function u32(n){ return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>>24)&0xFF]; }
    files.forEach(function(f){
      var name=enc.encode(f.name), data=f.data, crc=crc32(data);
      var lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),
        u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
      chunks.push(new Uint8Array(lh)); chunks.push(name); chunks.push(data);
      var ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
        u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),
        u32(0),u32(offset));
      central.push(new Uint8Array(ch)); central.push(name);
      offset += lh.length+name.length+data.length;
    });
    var cstart=offset, csize=0;
    central.forEach(function(c){ csize+=c.length; });
    var eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),
      u16(files.length),u16(files.length),u32(csize),u32(cstart),u16(0)));
    var all=chunks.concat(central,[eocd]), total=0;
    all.forEach(function(a){ total+=a.length; });
    var out=new Uint8Array(total), p=0;
    all.forEach(function(a){ out.set(a,p); p+=a.length; });
    return out;
  }

  var API = { MAX_FRAMES:MAX_FRAMES, MIN_FRAMES:MIN_FRAMES, clampFps:clampFps,
              createFrameStore:createFrameStore, onionLayers:onionLayers,
              createPlayback:createPlayback, MISSIONS:MISSIONS, findMission:findMission,
              missionsByGrade:missionsByGrade, createMissionRun:createMissionRun,
              crc32:crc32, buildStoreZip:buildStoreZip };
  if(typeof module!=='undefined' && module.exports){ module.exports = API; }
  if(typeof window!=='undefined'){ window.AnimLab = API; }
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* v3 §1 토큰 상속 */
:root{
  --ink:#E8EEF5; --mut:#8fa3b8;
  --accent:#FF9BC7; --accent2:#B592F5;   /* 케이아트 = 핑크→보라 (로고 그라데이션 계승) */
  --prev:#EF4444; --next:#3B82F6;
  --glass:rgba(255,255,255,.045); --glass-bd:rgba(255,255,255,.09);
  --hud:rgba(20,25,32,.74); --hud-bd:rgba(255,255,255,.10);
  --paper:#FCFAF5;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#2b3340 0%,#1b2129 46%,#12161c 100%);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
button{font-family:inherit;cursor:pointer;color:inherit}

/* TOPBAR */
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;
  background:var(--hud);backdrop-filter:blur(8px);border-bottom:1px solid var(--hud-bd);z-index:30}
.logo{font-family:var(--kedu-title);font-size:19px;display:flex;align-items:center;gap:8px}
.logo .kk{background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo .badge{font-family:var(--kedu-title);font-size:12px;color:#12161c;
  background:linear-gradient(135deg,var(--accent),var(--accent2));padding:2px 11px;border-radius:50px}
.tb-spacer{flex:1}
.hint{font-size:12.5px;color:var(--mut)}

/* MAIN */
.main{flex:1;display:flex;min-height:0}

/* 왼쪽 도구 dock */
.dock{width:74px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 0;background:var(--glass);border-right:1px solid var(--glass-bd);
  backdrop-filter:blur(8px);overflow-y:auto}
.dock::-webkit-scrollbar{width:0}
.tool{width:50px;height:50px;border-radius:13px;border:2px solid transparent;
  background:rgba(255,255,255,.05);font-size:21px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;transition:all .14s;color:var(--ink)}
.tool .tn{font-size:8.5px;color:var(--mut);font-weight:600;line-height:1}
.tool:hover{background:rgba(255,255,255,.10)}
.tool.on{background:linear-gradient(135deg,rgba(255,155,199,.22),rgba(181,146,245,.22));
  border-color:var(--accent)}
.tool.on .tn{color:var(--accent)}
.dock-div{width:38px;height:1px;background:var(--glass-bd);margin:4px 0;flex-shrink:0}
.size-col{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
.size-dot{border-radius:50%;background:var(--ink);transition:all .1s}
.size-range{writing-mode:vertical-lr;direction:rtl;width:22px;height:96px;accent-color:var(--accent)}

/* 팔레트 */
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:2px 0}
.sw{width:24px;height:24px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);
  box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 3px var(--accent);transform:scale(1.12)}

/* STAGE (캔버스 무대) */
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;padding:18px}
.canvas-wrap{position:relative;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
  max-width:100%;max-height:100%}
.canvas-wrap canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#bg{background:var(--paper)}      /* 종이는 밝게 — 다크 무대 위 밝은 재료(v3 의도된 예외). 배경 레이어 v2에서 onion→bg 이관 */
#onion{background:transparent}
#draw{background:transparent}
/* ── 도장 서랍 v2 ── */
.stamp-drawer{display:none;position:fixed;left:78px;top:64px;z-index:60;width:342px;max-height:74vh;overflow:hidden;
  flex-direction:column;background:var(--hud);border:1px solid var(--hud-bd);border-radius:16px;backdrop-filter:blur(10px)}
.stamp-drawer.show{display:flex}
.sd-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.sd-head h4{font-family:var(--kedu-title);font-size:15px;color:var(--ink);font-weight:400;flex:1;margin:0}
.sd-close{border:none;background:var(--glass);color:var(--mut);border-radius:9px;width:26px;height:26px;font-size:13px}
.sd-tabs{display:flex;gap:5px;padding:0 12px 9px;flex-wrap:wrap}
.sd-tab{border:1.5px solid var(--glass-bd);background:var(--glass);color:var(--mut);border-radius:20px;
  padding:5px 11px;font-size:12px;font-family:inherit;transition:all .13s}
.sd-tab.on{border-color:var(--accent);color:var(--ink)}
.sd-body{overflow:auto;padding:2px 12px 12px}
.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stamp-card{border:2px solid transparent;border-radius:12px;background:rgba(255,255,255,.9);padding:6px 3px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .13s;color:#3a4a5c}
.stamp-card img{width:46px;height:46px;object-fit:contain}
.stamp-card span{font-size:9.5px}
.stamp-card:hover{transform:translateY(-2px)}
.stamp-card.on{border-color:var(--accent)}
.sd-foot{padding:9px 12px 12px;border-top:1px solid var(--glass-bd)}
.sd-import{width:100%;border:1.5px dashed var(--glass-bd);background:transparent;color:var(--mut);
  border-radius:11px;padding:9px;font-size:12.5px;font-family:inherit}
.sd-import:hover{color:var(--ink);border-color:var(--accent)}
/* ── 붙이기 전 도장(선택 상태) ── */
.pend{position:absolute;z-index:8;transform:translate(-50%,-50%);touch-action:none}
.pend img{display:block;width:100%;pointer-events:none;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
.pend .pbox{position:absolute;inset:-6px;border:2px dashed var(--accent);border-radius:8px;pointer-events:none}
.ph{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--hud);border:1.5px solid var(--accent);
  color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;touch-action:none;cursor:grab}
.ph-rot{left:50%;top:-46px;transform:translateX(-50%)}
.ph-size{right:-20px;bottom:-20px;cursor:nwse-resize}
.pend-bar{display:none;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;gap:6px;
  background:var(--hud);border:1px solid var(--hud-bd);border-radius:14px;padding:6px;
  box-shadow:0 8px 26px rgba(0,0,0,.4)}
.pend-bar.show{display:flex}
.pend-bar button{border:none;border-radius:8px;background:var(--glass);color:var(--ink);font-family:inherit;
  font-size:13px;padding:6px 10px;white-space:nowrap}
.pend-bar .pok{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#26141f;font-weight:700}
/* ── 배경 편집 리본 ── */
.bg-ribbon{display:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;
  background:var(--hud);border:1px solid var(--accent2);color:var(--ink);font-size:12px;
  padding:5px 14px;border-radius:20px;pointer-events:none}
body.bgmode .bg-ribbon{display:block}
body.bgmode #draw{opacity:.45}
body.bgmode #onion{opacity:0}
.canvas-wrap .frame-badge{position:absolute;top:10px;left:12px;font-size:12px;color:var(--mut);
  background:var(--hud);padding:3px 10px;border-radius:20px;pointer-events:none;z-index:5}

/* 오른쪽 정보 */
.side{width:0}

/* 필름 스트립 (하단) */
.strip{flex-shrink:0;background:var(--hud);backdrop-filter:blur(8px);
  border-top:1px solid var(--hud-bd);padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px}
.strip-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbtn{height:38px;min-width:38px;padding:0 13px;border-radius:11px;border:1px solid var(--hud-bd);
  background:rgba(255,255,255,.05);color:var(--ink);font-size:14px;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;transition:all .13s}
.pbtn:hover{background:rgba(255,255,255,.11);border-color:var(--accent)}
.pbtn.play{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#12161c;
  border:none;font-family:var(--kedu-title);padding:0 20px}
.pbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(255,155,199,.14)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--hud-bd);border-radius:11px;overflow:hidden}
.seg .pbtn{border:none;border-radius:0;min-width:52px}
.seg .pbtn+.pbtn{border-left:1px solid var(--hud-bd)}
.fps{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.fps input{width:120px;accent-color:var(--accent)}
.fps b{color:var(--ink);font-family:var(--kedu-title);min-width:56px}
.ctrl-spacer{flex:1}

.frames{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;align-items:center}
.frames::-webkit-scrollbar{height:7px}
.frames::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:10px}
.thumb{position:relative;flex-shrink:0;width:76px;height:58px;border-radius:9px;overflow:hidden;
  border:2px solid transparent;background:var(--paper);transition:all .13s;cursor:pointer}
.thumb canvas{width:100%;height:100%;display:block}
.thumb .num{position:absolute;top:2px;left:4px;font-size:10px;color:#7a8391;font-weight:700}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,155,199,.30)}
.thumb.drag-over{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(181,146,245,.4)}
.thumb .tactions{position:absolute;bottom:0;left:0;right:0;height:0;overflow:hidden;
  display:flex;justify-content:center;gap:3px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);
  transition:height .13s;padding-bottom:2px;align-items:flex-end}
.thumb:hover .tactions{height:22px}
.thumb .ta{width:20px;height:18px;border:none;border-radius:5px;background:rgba(255,255,255,.85);
  color:#1b2129;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.thumb .ta:hover{background:#fff}
.addf{flex-shrink:0;width:52px;height:58px;border-radius:9px;border:2px dashed var(--hud-bd);
  background:transparent;color:var(--mut);font-size:26px;transition:all .13s}
.addf:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.addf:disabled{opacity:.35;cursor:not-allowed}

/* 토스트 */
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;
  background:#fff;color:#1b2129;padding:11px 18px;border-radius:12px;font-size:13.5px;
  box-shadow:0 12px 34px rgba(0,0,0,.4);border-left:5px solid var(--accent);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}

/* 미션 가이드 밴드 */
.guide-band{position:absolute;left:0;right:0;bottom:0;z-index:6;display:none;
  background:linear-gradient(0deg,rgba(20,25,32,.90),rgba(20,25,32,.72) 70%,transparent);
  color:#fff;padding:20px 16px 12px;font-size:14px;line-height:1.4;text-align:center;pointer-events:none}
.guide-band.show{display:block}
.guide-band .gstep{color:var(--accent);font-family:var(--kedu-title);margin-right:7px}
.guide-band .gprog{display:block;margin-top:5px;font-size:12px;color:var(--mut)}

/* 슬라이드 패널 공통 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,13,18,.5);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:40}
.sheet-bg.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:340px;max-width:88vw;z-index:50;
  background:linear-gradient(180deg,#232a34,#191e26);border-left:1px solid var(--hud-bd);
  box-shadow:-16px 0 50px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding:18px 18px 20px;overflow-y:auto}
.panel.show{transform:translateX(0)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel-head b{font-family:var(--kedu-title);font-size:18px}
.xbtn{width:34px;height:34px;border:none;border-radius:10px;background:rgba(255,255,255,.06);
  color:var(--mut);font-size:15px}
.xbtn:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.panel-sub{font-size:12.5px;color:var(--mut);line-height:1.5;margin-bottom:14px}

/* 학년 탭 */
.grade-tabs{display:flex;gap:6px;margin-bottom:14px}
.gt{flex:1;height:36px;border:1px solid var(--hud-bd);background:rgba(255,255,255,.04);
  color:var(--mut);border-radius:10px;font-size:13px;transition:all .13s}
.gt.on{border-color:var(--accent);color:var(--accent);background:rgba(255,155,199,.14)}
.mlist{display:flex;flex-direction:column;gap:9px;flex:1}
.mcard{text-align:left;border:1px solid var(--hud-bd);background:rgba(255,255,255,.04);
  border-radius:13px;padding:12px 14px;transition:all .14s;position:relative}
.mcard:hover{border-color:var(--accent);background:rgba(255,155,199,.09);transform:translateY(-1px)}
.mcard.active{border-color:var(--accent);background:rgba(255,155,199,.14)}
.mcard .mt{font-family:var(--kedu-title);font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.mcard .mf{font-size:11px;color:var(--accent);background:rgba(255,155,199,.15);padding:1px 8px;border-radius:20px}
.mcard .mh{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.45}
.mcard .mdone{position:absolute;top:12px;right:12px;font-size:13px;color:#12B886;display:none}
.mcard.completed .mdone{display:block}
.mfree{margin-top:14px}
.mfree .pbtn{width:100%}

/* 내보내기 항목 */
.exp-item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  border:1px solid var(--hud-bd);background:rgba(255,255,255,.04);border-radius:13px;
  padding:14px;margin-bottom:10px;transition:all .14s}
.exp-item:hover{border-color:var(--accent);background:rgba(255,155,199,.09)}
.exp-item:disabled{opacity:.45;cursor:not-allowed}
.ei-ico{font-size:24px;flex-shrink:0}
.ei-txt{display:flex;flex-direction:column;gap:2px}
.ei-txt b{font-family:var(--kedu-title);font-size:14.5px}
.ei-txt small{font-size:11.5px;color:var(--mut)}
.exp-note{font-size:12px;color:var(--mut);line-height:1.5;margin-top:6px;min-height:18px}

@media(max-width:640px){
  .dock{width:60px}
  .tool{width:44px;height:44px;font-size:18px}
  .fps input{width:80px}
  .hint{display:none}
}

<div class="strip">

<script>
(function(){
  'use strict';
  var L = window.AnimLab;
  var COLORS = ['#1A202C','#6B7280','#FFFFFF','#EF4444','#F97316','#FBBF24',
                '#FDE047','#22C55E','#14B8A6','#3B82F6','#6366F1','#A855F7',
                '#EC4899','#F9A8D4','#8B5E3C','#FBCFE8'];
  var W = 900, H = 620;               // 논리 해상도 (프레임 저장 단위)

  var store = L.createFrameStore({ start:1 });
  var play  = L.createPlayback({ fps:8, mode:'loop' });
  var onionOn = false;

  // 각 프레임 = 오프스크린 캔버스(픽셀 저장소). 프레임 id → canvas
  var pixMap = {};
  function frameCanvas(f){
    if(!pixMap[f.id]){
      var c = document.createElement('canvas'); c.width=W; c.height=H;
      pixMap[f.id]=c;
    }
    return pixMap[f.id];
  }

  // ── DOM
  var drawCv = document.getElementById('draw'), drawCtx = drawCv.getContext('2d');
  var onionCv = document.getElementById('onion'), onCtx = onionCv.getContext('2d');
  drawCv.width=W; drawCv.height=H; onionCv.width=W; onionCv.height=H;
  var wrap = document.getElementById('wrap');
  function fit(){
    var pad=36, availW=window.innerWidth-74-pad, availH=window.innerHeight-56-190;
    var s=Math.min(availW/W, availH/H, 1.15);
    wrap.style.width=(W*s)+'px'; wrap.style.height=(H*s)+'px';
    if(typeof layoutPend==='function') layoutPend();
  }
  window.addEventListener('resize', fit); fit();

  var badge=document.getElementById('badge'), memHint=document.getElementById('memHint');
  var framesEl=document.getElementById('frames'), toastEl=document.getElementById('toast');

  // ── 도구 상태
  var tool='brush', color=COLORS[0], size=8;
  var palEl=document.getElementById('pal');
  palEl.innerHTML = COLORS.map(function(c,i){
    return '<button class="sw '+(i===0?'on':'')+'" data-c="'+c+'" style="background:'+c+'"></button>';
  }).join('');
  palEl.addEventListener('click', function(e){
    var b=e.target.closest('.sw'); if(!b) return;
    color=b.dataset.c;
    [].forEach.call(palEl.children, function(s){ s.classList.toggle('on', s.dataset.c===color); });
    if(tool==='eraser'){ setTool('brush'); }
  });
  var sizeDot=document.getElementById('sizeDot');
  document.getElementById('size').addEventListener('input', function(e){
    size=+e.target.value; var d=Math.max(8,Math.min(30,size)); sizeDot.style.width=d+'px'; sizeDot.style.height=d+'px';
  });
  function setTool(t){
    if(t==='clear'){ clearCurrent(); return; }
    if(t==='bg'){ toggleBgMode(); return; }
    if(t==='again'){ placeAgain(); return; }
    if(t==='stamp'){ openDrawer(); }
    tool=t;
    ['brush','eraser','stamp'].forEach(function(k){
      var el=document.getElementById('t-'+k); if(el) el.classList.toggle('on', k===t);
    });
  }
  document.querySelector('.dock').addEventListener('click', function(e){
    var b=e.target.closest('.tool'); if(!b||b.disabled) return; setTool(b.dataset.tool);
  });
  function targetCtx(){ return bgMode? bgCtx : drawCtx; }  // 배경 모드면 붓·지우개·도장이 무대에

  // ══════════════════════════════════════════════════════════════════
  // 배경 무대 레이어 + 도장 2.0 (2026-07-12 v2 — 준호 "제대로" 재설계)
  //  · 무대(bg) = 스토어 밖 단일 캔버스, 모든 장 뒤에 깔림. 내보내기·썸네일 합성.
  //  · 도장 = 찍기 전 "선택 상태"(옮기기·크기·돌리기·반전) → ✓ 붙이기로 확정.
  //  · 에셋 = 케이아트 빌더 재사용(동물 16 + _meta.json 파츠) — 신규 이미지 제작 0.
  // ══════════════════════════════════════════════════════════════════
  var bgMode=false;
  var bgCv=document.getElementById('bg'), bgCtx=bgCv.getContext('2d');
  bgCv.width=W; bgCv.height=H;
  function toggleBgMode(){
    bgMode=!bgMode;
    document.body.classList.toggle('bgmode', bgMode);
    document.getElementById('t-bg').classList.toggle('on', bgMode);
    toast(bgMode? '🏞️ 무대(배경)를 꾸며요 — 모든 장 뒤에 깔려요' : '다시 장을 그려요');
  }
  function bgFilled(){
    var sCv=document.createElement('canvas'); sCv.width=48; sCv.height=32;
    var g=sCv.getContext('2d'); g.drawImage(bgCv,0,0,48,32);
    var d=g.getImageData(0,0,48,32).data;
    for(var i=3;i<d.length;i+=4) if(d[i]>8) return true;
    return false;
  }
  function refreshBgViews(){ buildStrip(); }     // 무대가 바뀌면 썸네일 전 장 갱신

  // ── 도장 서랍 (탭 = 동물 + 빌더 파츠) ──
  var ANIMALS=[['dog','강아지'],['cat','고양이'],['rabbit','토끼'],['bear','곰'],

  var BUILDER='/draw/assets/builder/';

  var stampDrawer=document.getElementById('stampDrawer');

  // 내 그림·사진 불러오기 → 도장으로 (케이아트 저장 PNG·사진 모두)

  // ── 붙이기 전 도장(선택 상태) ──
  var pendEl=document.getElementById('pend'), pendImg=document.getElementById('pendImg');
  var pend={ on:false, src:null, im:null, x:W/2, y:H/2, w:200, rot:0, flip:false };
  var lastStamp=null;
  var againBtn=document.getElementById('t-again');
  function newPend(src, w0){
    confirmPend();                              // 이전 대기 도장은 먼저 붙임 (작업 유실 0)
    var im=new Image();
    im.onload=function(){
      pend.on=true; pend.src=src; pend.im=im;
      pend.x=W/2; pend.y=H/2; pend.w=Math.max(50,w0||200); pend.rot=0; pend.flip=false;
      setTool('stamp'); renderPend();
      toast('끌어서 옮기고 🔄로 돌려요 — ✓ 붙이기로 확정!');
    };
    im.onerror=function(){ toast('도장을 불러오지 못했어요'); };
    im.src=src;
  }
  function pendH(){ return pend.im? pend.w*(pend.im.height/pend.im.width) : pend.w; }
  function cssScale(){ return wrap.clientWidth/W; }
  function layoutPend(){
    if(!pendEl) return;                        // 초기 fit()이 서브시스템 할당 전에 불릴 수 있음
    var bar=document.getElementById('pendBar');
    if(bar) bar.classList.toggle('show', !!pend.on);
    if(!pend.on){ pendEl.style.display='none'; return; }
    var sc=cssScale();
    pendEl.style.display='block';
    pendEl.style.width=(pend.w*sc)+'px';
    pendEl.style.left=(pend.x*sc)+'px';
    pendEl.style.top=(pend.y*sc)+'px';
    pendEl.style.transform='translate(-50%,-50%) rotate('+pend.rot+'rad)';
    pendImg.style.transform=pend.flip? 'scaleX(-1)':'none';
  }
  function renderPend(){ if(pend.on){ pendImg.src=pend.src; } layoutPend(); }
  function pendTo(x,y){
    pend.x=Math.max(30, Math.min(W-30, x));
    pend.y=Math.max(56, Math.min(H-30, y));    // 위 여백 = 🔄 핸들 자리
    layoutPend();
  }

  // 본체 드래그 = 옮기기
  var pdrag=null;
  pendEl.addEventListener('pointerdown', function(ev){
    if(ev.target.closest('.ph')||ev.target.closest('.pend-bar')) return;
    ev.preventDefault(); ev.stopPropagation();
    var q=toLocal(ev);
    pdrag={ dx:pend.x-q.x, dy:pend.y-q.y };
    pendEl.setPointerCapture(ev.pointerId);
  });
  pendEl.addEventListener('pointermove', function(ev){
    if(!pdrag) return; ev.preventDefault();
    var q=toLocal(ev); pendTo(q.x+pdrag.dx, q.y+pdrag.dy);
  
  });
  pendEl.addEventListener('pointerup', function(){ pdrag=null; });

  // 🔄 돌리기 핸들
  var phRot=document.getElementById('phRot'), rdrag=false;
  phRot.addEventListener('pointerdown', function(ev){
    ev.preventDefault(); ev.stopPropagation(); rdrag=true; phRot.setPointerCapture(ev.pointerId);
  });
  phRot.addEventListener('pointermove', function(ev){
    if(!rdrag) return; ev.preventDefault();
    var q=toLocal(ev);
    pend.rot=Math.atan2(q.y-pend.y, q.x-pend.x)+Math.PI/2;
    var snap=Math.round(pend.rot/(Math.PI/12))*(Math.PI/12);   // 15° 자석
    if(Math.abs(snap-pend.rot)<0.06) pend.rot=snap;
    layoutPend();
  });
  phRot.addEventListener('pointerup', function(){ rdrag=false; });

  // ↘ 크기 핸들
  var phSize=document.getElementById('phSize'), sdrag=false;
  phSize.addEventListener('pointerdown', function(ev){
    ev.preventDefault(); ev.stopPropagation(); sdrag=true; phSize.setPointerCapture(ev.pointerId);
  });
  phSize.addEventListener('pointermove', function(ev){
    if(!sdrag) return; ev.preventDefault();
    var q=toLocal(ev);
    var d=Math.hypot(q.x-pend.x, q.y-pend.y);
    pend.w=Math.max(50, Math.min(700, d*1.55));
    layoutPend();
  });
  phSize.addEventListener('pointerup', function(){ sdrag=false; });

  document.getElementById('pFlip').addEventListener('click', function(){ pend.flip=!pend.flip; layoutPend(); });
  document.getElementById('pCancel').addEventListener('click', cancelPend);
  document.getElementById('pOk').addEventListener('click', confirmPend);
  window.addEventListener('keydown', function(e){
    if(!pend.on) return;
    if(e.key==='Enter'){ confirmPend(); }
    else if(e.key==='Escape'){ cancelPend(); }
  });

  function cancelPend(){ pend.on=false; layoutPend(); }
  function confirmPend(){                        // 도장 확정 → 프레임(또는 무대)에 굽기
    if(!pend.on || !pend.im) return;
    var c=targetCtx();
    c.save();
    c.globalCompositeOperation='source-over';
    c.translate(pend.x, pend.y); c.rotate(pend.rot);
    if(pend.flip) c.scale(-1,1);
    c.drawImage(pend.im, -pend.w/2, -pendH()/2, pend.w, pendH());
    c.restore();
    lastStamp={ src:pend.src, x:pend.x, y:pend.y, w:pend.w, rot:pend.rot, flip:pend.flip };
    againBtn.disabled=false; againBtn.style.opacity='';
    pend.on=false; layoutPend();
    if(bgMode){ refreshBgViews(); } else { commitToFrame(); }
    refreshMission();
  }
  function placeAgain(){                         // 👣 지난 도장, 지난 자리 그대로 — 살짝 밀고 붙이면 움직임!
    if(!lastStamp) return;
    confirmPend();
    var im=new Image();
    im.onload=function(){
      pend.on=true; pend.src=lastStamp.src; pend.im=im;
      pend.x=lastStamp.x; pend.y=lastStamp.y; pend.w=lastStamp.w;
      pend.rot=lastStamp.rot; pend.flip=lastStamp.flip;
      setTool('stamp'); renderPend();
      toast('👣 지난 자리 그대로 — 조금만 옮기고 ✓ 붙이면 움직여요');
    };
    im.src=lastStamp.src;
  }


  // ── 그리기 (dab: 두 점 사이를 촘촘히 스탬프)
  var drawing=false, lastX=0, lastY=0;
  function toLocal(ev){
    var r=drawCv.getBoundingClientRect();
    var p = ev.touches? ev.touches[0]: ev;
    return { x:(p.clientX-r.left)/r.width*W, y:(p.clientY-r.top)/r.height*H };
  }
  function stamp(ctx,x,y){
    ctx.beginPath(); ctx.arc(x,y,size/2,0,Math.PI*2); ctx.fill();
  }
  function line(ctx,x0,y0,x1,y1){
    var dx=x1-x0, dy=y1-y0, dist=Math.hypot(dx,dy), step=Math.max(1,size*0.35);
    var n=Math.ceil(dist/step);
    for(var i=0;i<=n;i++){ stamp(ctx, x0+dx*i/n, y0+dy*i/n); }
  }
  function startDraw(ev){
    if(play.isPlaying()) return;
    ev.preventDefault();
    if(tool==='stamp'){                       // 도장 = 대기 중인 도장을 그 자리로
      var q=toLocal(ev);
      if(pend.on){ pendTo(q.x,q.y); } else { openDrawer(); }
      return;
    }
    drawing=true;
    var p=toLocal(ev); lastX=p.x; lastY=p.y;
    applyBrush(); stamp(targetCtx(),p.x,p.y);
  }
  function moveDraw(ev){
    if(!drawing) return; ev.preventDefault();
    var p=toLocal(ev); line(targetCtx(),lastX,lastY,p.x,p.y); lastX=p.x; lastY=p.y;
  }
  function endDraw(){
    if(!drawing) return; drawing=false;
    targetCtx().globalCompositeOperation='source-over';
    if(bgMode){ refreshBgViews(); }           // 무대는 스토어 밖 — 썸네일만 다시
    else { commitToFrame(); }                 // 현재 프레임 픽셀 저장 + 썸네일 갱신
    refreshMission();
  }
  function applyBrush(){
    var c=targetCtx();
    if(tool==='eraser'){ c.globalCompositeOperation='destination-out'; c.fillStyle='#000'; }
    else { c.globalCompositeOperation='source-over'; c.fillStyle=color; }
  }
  drawCv.addEventListener('pointerdown', startDraw);
  drawCv.addEventListener('pointermove', moveDraw);
  window.addEventListener('pointerup', endDraw);

  // ── 프레임 <-> 캔버스 동기화 (왕복 무결의 렌더러 구현)
  function loadFrame(){                // 스토어 현재 프레임 픽셀을 그리기 캔버스로
    var f=store.get(); var c=frameCanvas(f);
    drawCtx.clearRect(0,0,W,H); drawCtx.drawImage(c,0,0);
    renderOnion(); renderBadge(); renderGuide();
  }
  function commitToFrame(){            // 그리기 캔버스 → 현재 프레임 픽셀 저장
    var f=store.get(); var c=frameCanvas(f); var cx=c.getContext('2d');
    cx.clearRect(0,0,W,H); cx.drawImage(drawCv,0,0);
    updateThumb(store.current());
  }
  function clearCurrent(){
    if(bgMode){ bgCtx.clearRect(0,0,W,H); refreshBgViews(); toast('무대를 비웠어요'); return; }
    drawCtx.clearRect(0,0,W,H); commitToFrame();
    toast('이 장을 비웠어요');
  }

  // ── 어니언 스킨 합성 (규칙은 로직, 합성은 여기)
  var tintCv=document.createElement('canvas'); tintCv.width=W; tintCv.height=H;
  var tintCtx=tintCv.getContext('2d');
  function renderOnion(){
    onCtx.clearRect(0,0,W,H);
    if(play.isPlaying()) return;
    var layers=L.onionLayers(store.count(), store.current(), {on:onionOn});
    layers.forEach(function(ly){
      var src=frameCanvas(store.frameAt(ly.index));
      tintCtx.clearRect(0,0,W,H);
      tintCtx.globalCompositeOperation='source-over';
      tintCtx.drawImage(src,0,0);
      tintCtx.globalCompositeOperation='source-atop';   // 그려진 획에만 색 입힘
      tintCtx.fillStyle=ly.tint; tintCtx.fillRect(0,0,W,H);
      tintCtx.globalCompositeOperation='source-over';
      onCtx.globalAlpha=ly.opacity; onCtx.drawImage(tintCv,0,0); onCtx.globalAlpha=1;
    });
  }

  function renderBadge(){
    badge.textContent=(store.current()+1)+' / '+store.count();
    memHint.textContent=store.count()+' / '+store.max+' 장';
  }

  // ── 필름 스트립
  function buildStrip(){
    framesEl.innerHTML='';
    for(var i=0;i<store.count();i++){
      framesEl.appendChild(makeThumb(i));
    }
    var add=document.createElement('button');
    add.className='addf'; add.id='addf'; add.textContent='＋';
    add.disabled = store.count()>=store.max;
    add.title='새 장 추가';
    add.addEventListener('click', function(){ doAdd(); });
    framesEl.appendChild(add);
  }
  function makeThumb(i){
    var f=store.frameAt(i);
    var el=document.createElement('div');
    el.className='thumb'+(i===store.current()?' on':'');
    el.dataset.i=i; el.draggable=true;
    var tc=document.createElement('canvas'); tc.width=76; tc.height=58;
    el.appendChild(tc);
    var num=document.createElement('div'); num.className='num'; num.textContent=(i+1); el.appendChild(num);
    var ta=document.createElement('div'); ta.className='tactions';
    ta.innerHTML='<button class="ta" data-a="dup" title="복제">⧉</button>'+
                 '<button class="ta" data-a="left" title="앞으로">‹</button>'+
                 '<button class="ta" data-a="right" title="뒤로">›</button>'+
                 '<button class="ta" data-a="del" title="삭제">✕</button>';
    el.appendChild(ta);
    // 썸네일 픽셀
    var g=tc.getContext('2d'); g.fillStyle='#FCFAF5'; g.fillRect(0,0,76,58);
    g.drawImage(bgCv,0,0,76,58);
    g.drawImage(frameCanvas(f),0,0,76,58);
    // 이벤트
    el.addEventListener('click', function(e){
      if(e.target.closest('.ta')) return;
      gotoFrame(+el.dataset.i);
    });
    ta.addEventListener('click', function(e){
      var b=e.target.closest('.ta'); if(!b) return; e.stopPropagation();
      var idx=+el.dataset.i, a=b.dataset.a;
      if(a==='dup') doDup(idx);
      else if(a==='del') doDel(idx);
      else if(a==='left') doMove(idx, idx-1);
      else if(a==='right') doMove(idx, idx+1);
    });
    // 드래그 순서 변경 (데스크톱)
    el.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', el.dataset.i); });
    el.addEventListener('dragover', function(e){ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', function(){ el.classList.remove('drag-over'); });
    el.addEventListener('drop', function(e){
      e.preventDefault(); el.classList.remove('drag-over');
      var from=+e.dataTransfer.getData('text/plain'), to=+el.dataset.i;
      if(from!==to) doMove(from,to);
    });
    return el;
  }
  function updateThumb(i){
    var el=framesEl.children[i]; if(!el||!el.classList.contains('thumb')) { buildStrip(); return; }
    var tc=el.querySelector('canvas'), g=tc.getContext('2d');

    loadFrame(); buildStrip();

  function doDup(i){
    confirmPend(); commitToFrame();

    // 픽셀 복사
    var nc=frameCanvas(store.get()), g=nc.getContext('2d');
    g.clearRect(0,0,W,H); g.drawImage(frameCanvas(r.src),0,0);

  }
  function doDel(i){
    var r=store.remove(i);
    if(!r.ok){ toast('마지막 한 장은 지울 수 없어요'); return; }
    loadFrame(); buildStrip();
  }
  function doMove(from,to){
    confirmPend(); commitToFrame();
    var r=store.move(from, Math.max(0,Math.min(store.count()-1,to)));
    if(!r.ok) return;
    loadFrame(); buildStrip();
  }

  // ── 재생
  var playBtn=document.getElementById('playBtn');
  var rafId=null, lastT=0;
  function setPlaying(on){
    if(on){
      confirmPend(); if(bgMode) toggleBgMode();
      commitToFrame();
      play.seek(store.current()); play.play();
      playBtn.textContent='⏸ 멈춤'; onCtx.clearRect(0,0,W,H);
      lastT=performance.now(); loop();
    } else {
      play.pause(); if(rafId) cancelAnimationFrame(rafId); rafId=null;
      playBtn.textContent='▶ 재생';
      store.setCurrent(play.index()); loadFrame(); markCurrent();
    }
  }
  function loop(){
    var now=performance.now(), dt=(now-lastT)/1000; lastT=now;
    var r=play.tick(Math.min(dt,0.1), store.count());
    if(r.advanced){ showFrameOnly(play.index()); }
    if(!play.isPlaying()){ setPlaying(false); return; }   // once 종료
    rafId=requestAnimationFrame(loop);
  }
  function showFrameOnly(i){
    drawCtx.clearRect(0,0,W,H); drawCtx.drawImage(frameCanvas(store.frameAt(i)),0,0);
    badge.textContent=(i+1)+' / '+store.count();
  }
  playBtn.addEventListener('click', function(){ setPlaying(!play.isPlaying()); });

  document.getElementById('onionBtn').addEventListener('click', function(){
    onionOn=!onionOn; this.classList.toggle('on', onionOn); renderOnion();
  });
  document.getElementById('modeSeg').addEventListener('click', function(e){
    var b=e.target.closest('.pbtn'); if(!b) return;
    play.setMode(b.dataset.mode);
    [].forEach.call(this.children, function(c){ c.classList.toggle('on', c===b); });
  });
  var fpsLbl=document.getElementById('fpsLbl');
  document.getElementById('fps').addEventListener('input', function(e){
    play.setFps(+e.target.value); fpsLbl.textContent=play.fps()+' fps';
  });

  function toast(msg){

    clearTimeout(toast._t); toast._t=setTimeout(function(){ toastEl.classList.remove('show'); },2000);
  }

  // ══ 미션 ══════════════════════════════════════════
  var activeMission=null, missionRun=null, curGrade='1-2';
  var guideBand=document.getElementById('guideBand');
  var completedIds={};

  function frameFilled(f){             // 프레임에 그림이 있는지(축소 스캔)
    if(!pixMap[f.id]) return false;
    var s=document.createElement('canvas'); s.width=48; s.height=32;
    var g=s.getContext('2d'); g.drawImage(pixMap[f.id],0,0,48,32);
    var d=g.getImageData(0,0,48,32).data;
    for(var i=3;i<d.length;i+=4) if(d[i]>8) return true;
    return false;
  }
  function missionStatus(){
    if(!missionRun) return null;
    var filled=[]; for(var i=0;i<store.count();i++) filled[i]=frameFilled(store.frameAt(i));
    return missionRun.status(filled);
  }
  function renderGuide(){
    if(!activeMission || play.isPlaying()){ guideBand.classList.remove('show'); return; }
    var st=missionStatus(), cur=store.current(), M=activeMission;
    var g = M.guides[cur] || '자유롭게 더 그려도 좋아요';
    guideBand.innerHTML='<span class="gstep">'+(cur+1)+'장</span>'+g+
      '<span class="gprog">'+st.have+' / '+st.need+' 장 완성'+
      (st.done?' — 다 채웠어요! ▶ 재생해보세요':'')+'</span>';
    guideBand.classList.add('show');
  }
  function refreshMission(){
    if(!activeMission) return;
    var st=missionStatus();
    if(st.done && !completedIds[activeMission.id]){
      completedIds[activeMission.id]=true;
      toast('🎉 '+activeMission.title+' 완성! ▶ 재생하거나 내보내기 하세요');
    }
    renderGuide();
  }
  function selectMission(id){
    var M=L.findMission(id); if(!M) return;
    confirmPend(); commitToFrame();
    activeMission=M; missionRun=L.createMissionRun(M);
    while(store.count()<M.frames){ if(!store.add().ok) break; }
    store.setCurrent(0); loadFrame(); buildStrip();
    play.setFps(M.fps); document.getElementById('fps').value=M.fps;
    document.getElementById('fpsLbl').textContent=M.fps+' fps';
    if(M.needGuide){ onionOn=true; document.getElementById('onionBtn').classList.add('on'); renderOnion(); }
    refreshMission(); closeMission();
    toast('미션: '+M.title+' — '+M.hint);
  }
  function clearMission(){
    activeMission=null; missionRun=null; guideBand.classList.remove('show');
    closeMission(); toast('자유 그리기로 바꿨어요');
  }

  var missionBg=document.getElementById('missionBg'), missionPanel=document.getElementById('missionPanel');
  function buildMissionList(){
    var box=document.getElementById('mlist'); box.innerHTML='';
    L.missionsByGrade(curGrade).forEach(function(M){
      var el=document.createElement('button');
      el.className='mcard'+(activeMission&&activeMission.id===M.id?' active':'')+(completedIds[M.id]?' completed':'');
      el.innerHTML='<div class="mt">'+M.title+' <span class="mf">'+M.frames+'장</span></div>'+
        '<div class="mh">'+M.hint+'</div><span class="mdone">✓ 완성</span>';
      el.addEventListener('click', function(){ selectMission(M.id); });
      box.appendChild(el);
    });
  }
  function openMission(){ buildMissionList(); missionBg.classList.add('show'); missionPanel.classList.add('show'); }
  function closeMission(){ missionBg.classList.remove('show'); missionPanel.classList.remove('show'); }
  document.getElementById('missionBtn').addEventListener('click', openMission);
  document.getElementById('missionClose').addEventListener('click', closeMission);
  missionBg.addEventListener('click', closeMission);
  document.getElementById('freeBtn').addEventListener('click', clearMission);
  document.getElementById('gradeTabs').addEventListener('click', function(e){
    var b=e.target.closest('.gt'); if(!b) return;
    curGrade=b.dataset.g;
    [].forEach.call(this.children, function(c){ c.classList.toggle('on', c===b); });
    buildMissionList();
  });

  // ══ 내보내기 ══════════════════════════════════════
  var exportBg=document.getElementById('exportBg'), exportPanel=document.getElementById('exportPanel');
  var expNote=document.getElementById('expNote');
  function openExport(){
    confirmPend(); commitToFrame();
    var n=store.count();
    expNote.textContent = n+'장 · '+play.fps()+'fps 애니메이션을 내보냅니다.';
    if(!supportsWebm()){ document.getElementById('expWebm').disabled=true; }
    exportBg.classList.add('show'); exportPanel.classList.add('show');
  }
  function closeExport(){ exportBg.classList.remove('show'); exportPanel.classList.remove('show'); }
  document.getElementById('exportBtn').addEventListener('click', openExport);
  document.getElementById('exportClose').addEventListener('click', closeExport);
  exportBg.addEventListener('click', closeExport);

  function download(blob, name){
    var u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(u); }, 3000);
  }
  function flatFrame(i){               // 종이 배경 합성한 한 장 (내보내기·썸네일용)
    var ec=document.createElement('canvas'); ec.width=W; ec.height=H;
    var g=ec.getContext('2d'); g.fillStyle='#FCFAF5'; g.fillRect(0,0,W,H);
    g.drawImage(bgCv,0,0);
    g.drawImage(frameCanvas(store.frameAt(i)),0,0);
    return ec;
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  function supportsWebm(){
    return typeof MediaRecorder!=='undefined' &&
      (MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ||
       MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ||
       MediaRecorder.isTypeSupported('video/webm'));
  }
  function webmMime(){
    var t=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    for(var i=0;i<t.length;i++) if(MediaRecorder.isTypeSupported(t[i])) return t[i];
    return 'video/webm';
  }
  async function exportWebm(){
    closeExport(); toast('🎬 영상 만드는 중…');
    var ec=document.createElement('canvas'); ec.width=W; ec.height=H;
    var g=ec.getContext('2d'); var stream=ec.captureStream();
    var chunks=[], rec=new MediaRecorder(stream,{mimeType:webmMime()});
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    var done=new Promise(function(res){ rec.onstop=res; });
    rec.start();
    var spf=1000/play.fps(), n=store.count(), loops=3;
    for(var l=0;l<loops;l++){
      for(var i=0;i<n;i++){
        g.fillStyle='#FCFAF5'; g.fillRect(0,0,W,H);
        g.drawImage(bgCv,0,0);
        g.drawImage(frameCanvas(store.frameAt(i)),0,0);
        await sleep(spf);
      }
    }
    rec.stop(); await done;
    download(new Blob(chunks,{type:'video/webm'}), animName()+'.webm');
    toast('🎬 영상을 저장했어요');
  }
  async function exportZip(){
    closeExport(); toast('🖼️ 그림 묶는 중…');
    var files=[], n=store.count();
    for(var i=0;i<n;i++){
      var ec=flatFrame(i);
      var blob=await new Promise(function(r){ ec.toBlob(r,'image/png'); });
      var buf=new Uint8Array(await blob.arrayBuffer());
      files.push({ name:'frame_'+String(i+1).padStart(2,'0')+'.png', data:buf });
    }
    var zip=L.buildStoreZip(files);
    download(new Blob([zip],{type:'application/zip'}), animName()+'_frames.zip');
    toast('🖼️ 그림 묶음을 저장했어요 ('+n+'장)');
  }
  function bestThumb(){                // 그림이 있는 첫 장의 썸네일
    for(var i=0;i<store.count();i++) if(frameFilled(store.frameAt(i))){
      var ec=flatFrame(i), t=document.createElement('canvas'); t.width=160; t.height=110;
      t.getContext('2d').drawImage(ec,0,0,160,110); return t.toDataURL('image/png');
    }
    return flatFrame(0).toDataURL('image/png');
  }
  function animName(){ return activeMission? ('animlab_'+activeMission.id) : 'animlab_free'; }
  function exportBox(){
    closeExport();
    var ok = (window.KEDU && KEDU.collect) && KEDU.collect({
      kind:'artwork', app:'animlab',
      id: activeMission? activeMission.id : ('free_'+Date.now()),
      title: activeMission? activeMission.title : '자유 애니메이션',
      meta:{ frames:store.count(), fps:play.fps(), mode:play.mode(),
             grade: activeMission? activeMission.grade : null, hasBg: bgFilled() },
      thumb: bestThumb(), at:Date.now()
    });
    toast(ok ? '📦 케이박스에 담았어요' : '케이박스에 담지 못했어요 (저장 공간 확인)');
  }
  document.getElementById('expWebm').addEventListener('click', function(){ if(!this.disabled) exportWebm(); });
  document.getElementById('expZip').addEventListener('click', exportZip);
  document.getElementById('expBox').addEventListener('click', exportBox);

  // ── init
  buildStrip(); loadFrame(); renderBadge();
})();
</script>

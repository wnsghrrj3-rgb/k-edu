<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>씨앗의 한살이 · 케이랩</title>
<!-- P1 = 생장 순수 로직만(렌더 0줄). P2에서 황금 샘플 head(importmap·three185)·module 렌더 증축. -->
<style>
  :root{ --ink:#eaf1e4; --sub:#9fb090; --panel:rgba(16,22,16,.82); --line:rgba(255,255,255,.1);
         --leaf:#5fbf6a; --water:#5aa9e0; --sun:#f5c542; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d130c;color:var(--ink);
    font-family:'Gowun Dodum',system-ui,sans-serif;touch-action:none}
  #stage{position:fixed;inset:0}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0d130c;color:var(--sub);font-size:15px;z-index:50}
  #loading.hide{display:none}

  /* 시간 압축 배지(상시·정직성) */
  #timeBadge{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 15px;
    font-size:13px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px}
  #timeBadge b{font-family:'Jua';color:var(--sun)}
  #dayCount{font-family:'Jua';color:var(--leaf)}

  /* 상단 타이틀 */
  #brand{position:fixed;top:12px;left:16px;z-index:20;font-family:'Jua';font-size:17px}
  #brand .k{color:var(--leaf)}
  #back{position:fixed;top:14px;right:16px;z-index:20;font-size:12.5px;color:var(--sub);
    text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}

  /* 시간 컨트롤 */
  #timeCtl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;
    display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:6px;backdrop-filter:blur(6px)}
  #timeCtl button{font-family:'Jua';font-size:15px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;width:42px;height:38px;cursor:pointer;transition:.15s}
  #timeCtl button.on{background:var(--leaf);color:#0d130c;border-color:var(--leaf)}

  /* 화분 조건 패널 (선택 시) */
  #panel{position:fixed;right:16px;top:64px;z-index:20;width:210px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(8px);
    box-shadow:0 16px 40px rgba(0,0,0,.4);display:none}
  #panel.show{display:block}
  #panel h3{margin:0 0 4px;font-family:'Jua';font-size:15px}
  #panel .stat{font-size:12px;color:var(--sub);margin-bottom:12px}
  #panel .stat b{color:var(--ink);font-family:'Jua'}
  .row{margin:11px 0}
  .row label{font-size:12.5px;display:flex;justify-content:space-between;margin-bottom:5px}
  .row label b{font-family:'Jua'}
  .waterBtn{width:100%;font-family:'Jua';font-size:14px;color:#fff;background:var(--water);
    border:0;border-radius:11px;padding:10px;cursor:pointer}
  .lightSeg{display:flex;gap:6px}
  .lightSeg button{flex:1;font-family:'Gowun Dodum';font-size:12.5px;color:var(--sub);
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:8px;cursor:pointer}
  .lightSeg button.on{background:var(--sun);color:#3a2c00;border-color:var(--sun)}
  input[type=range]{width:100%;accent-color:var(--leaf)}

  /* 하단 힌트 */
  #hint{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:19;
    font-size:12.5px;color:var(--sub);background:rgba(13,19,12,.6);border-radius:999px;
    padding:5px 14px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
  #hint.show{opacity:1}

  /* ── P3 미션 UI ── */
  #mBtn{position:fixed;left:16px;bottom:16px;z-index:21;font-family:'Jua';font-size:14px;
    color:#0d130c;background:var(--leaf);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;
    box-shadow:0 6px 18px rgba(95,191,106,.35)}
  #mBanner{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:21;max-width:88vw;
    display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--leaf);
    border-radius:14px;padding:9px 13px;backdrop-filter:blur(6px)}
  #mBanner.hide,#mHome.hide,#mPredict.hide,#mClear.hide,#diag.hide,#lensPanel.hide{display:none}
  #mbIcon{font-size:20px} #mbTitle{font-family:'Jua';font-size:14px} #mbHint{font-size:11.5px;color:var(--sub)}
  #mbClose{margin-left:6px;background:none;border:0;color:var(--sub);font-size:15px;cursor:pointer}
  .movl{position:fixed;inset:0;z-index:45;background:rgba(8,12,8,.72);display:flex;align-items:center;justify-content:center;padding:20px}
  .mcard{background:#141d13;border:1px solid var(--line);border-radius:20px;padding:22px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .mcard h2{font-family:'Jua';margin:0 0 14px;font-size:19px}
  .mItem{width:100%;display:flex;gap:11px;align-items:center;text-align:left;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer;color:var(--ink)}
  .mItem .mi{font-size:22px} .mItem b{font-family:'Jua';font-size:14px} .mItem small{color:var(--sub);font-size:11.5px}
  .mFree{width:100%;background:none;border:1px dashed var(--line);border-radius:11px;padding:9px;color:var(--sub);cursor:pointer;font-family:'Gowun Dodum'}
  #mpQ,#dgQ{font-family:'Jua';font-size:16px;margin-bottom:14px;line-height:1.5}
  .mpOpt,.dgOpt{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-size:14px;font-family:'Gowun Dodum';text-align:left}
  .mpOpt.right,.dgOpt.right{background:rgba(95,191,106,.25);border-color:var(--leaf)}
  .mpOpt.wrong,.dgOpt.wrong{background:rgba(224,90,90,.2);border-color:#e05a5a}
  #mpExplain,#dgExplain{font-size:13px;line-height:1.6;color:var(--sub);margin:12px 0;padding:12px;
    background:rgba(255,255,255,.04);border-radius:11px}
  .mcBtn{font-family:'Jua';font-size:14px;color:#0d130c;background:var(--leaf);border:0;border-radius:11px;padding:11px 16px;cursor:pointer;margin-right:8px}
  .mcBtn.sub{background:rgba(255,255,255,.08);color:var(--ink)}
  .mcIcon{font-size:40px;text-align:center;margin-bottom:10px}
  #mcMsg{font-family:'Jua';font-size:17px;text-align:center;margin-bottom:16px}

  /* 데이터 렌즈(키-시간 곡선) */
  #lensBtn{position:fixed;right:16px;bottom:16px;z-index:21;font-family:'Jua';font-size:13px;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
  #lensPanel{position:fixed;right:16px;bottom:58px;z-index:21;width:280px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(8px)}
  #lensPanel h4{margin:0 0 8px;font-family:'Jua';font-size:13px}
  #lensCanvas{width:100%;height:150px;display:block;border-radius:8px;background:rgba(0,0,0,.25)}
  #lensLegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--sub)}
  #lensLegend span{display:flex;align-items:center;gap:4px}
  #lensLegend i{width:10px;height:3px;border-radius:2px;display:inline-block}


</style>

<!-- ═══════════════════════════════════════════════════════════════════════
     순수 로직 — KSeed 생장 모델 (SPEC_SEED §2). THREE·DOM 참조 0. node 단독 테스트.
     grow(pot,dt): 상태 갱신 / plantShape(pot): 렌더가 읽을 형태 파라미터.
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="seed-pure">
(function (root, factory) {
  const API = factory();
  if (typeof window !== 'undefined') window.KSeed = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(this, function () {
  'use strict';

  /* ── 확정 상수 (§2) ── */
  const DAY_SEC = 3;          // 실 3초 = 식물 1일
  const HMAX    = 0.28;       // 최대 키(m)
  const G0      = 1.0;        // 표준 하루 성장
  const DT_CLAMP = 0.1;       // dt 상한(§5-⑱)
  const WATER_DECAY = 0.06;   // 일당 자연 감소
  const WATER_ADD   = 0.35;   // 물주기 1회
  const DRY_THRESH  = 0.15;   // 가뭄 임계(변인값)
  const WILT_DAYS   = 2;      // 가뭄 지속 → 시듦
  const NODE_MAX    = 8;
  const NODE_STEP   = 1.3;    // 마디 1개당 progress
  const ETIO_LIGHT  = 0.25;   // 웃자람(황화) 빛 임계 — 미만에서 발동
  const LEAF_HEALTHY = 0x4CAF50;
  const LEAF_ETIO    = 0xBEC46A;
  const STEM_HEX     = 0x6B8E4E;
  const POT_X = [-0.36, -0.12, 0.12, 0.36]; // C-2 4화분 좌표

  /* ── 공용 순수 헬퍼 ── */
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(e0, e1, x) {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }
  // 정수 RGB 두 색 사이 보간 → 정수 RGB
  function lerpHex(a, b, t) {
    t = clamp(t, 0, 1);
    const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    return (Math.round(lerp(ar, br, t)) << 16) |
           (Math.round(lerp(ag, bg, t)) << 8) |
            Math.round(lerp(ab, bb, t));
  }

  /* ── 조건 함수 f (0~1 게이트, §2) ──
     ⚠ 역반영(§1-④): §5-② "물 0 → 정지" vs §2 표 "가뭄<0.15 → 0.3" 충돌.
        가뭄 구간을 0.3·(w/0.15) 로 확정 → water=0에서 f=0(완전 정지),
        water=0.15에서 0.3(표 경계). 리비히 지배(⑬)·정지(②) 동시 성립. */
  function fWater(w) {
    if (w < 0.15) return 0.3 * (w / 0.15);          // 0→0, 0.15→0.3 (정지 성립)
    if (w < 0.4)  return lerp(0.3, 1.0, (w - 0.15) / (0.4 - 0.15));
    if (w <= 0.8) return 1.0;                         // 최적대
    if (w <= 0.9) return lerp(1.0, 0.3, (w - 0.8) / (0.9 - 0.8));
    return 0.3;                                       // 과습
  }
  function fTemp(T) {
    if (T < 8)  return 0.15;
    if (T < 20) return lerp(0.15, 1.0, (T - 8) / (20 - 8));
    if (T <= 28) return 1.0;                          // 최적대
    if (T <= 34) return lerp(1.0, 0.15, (T - 28) / (34 - 28));
    return 0.15;
  }
  // 빛은 g에 min(1, light+0.1) 로 들어감(§2 생장률식)
  function lightGate(light) { return Math.min(1, light + 0.1); }
  function isEtiolated(light) { return light < ETIO_LIGHT; }

  /* ── 화분 생성 ── */
  function createPot(opts) {
    opts = opts || {};
    return {
      water: opts.water != null ? opts.water : 0.6,
      light: opts.light != null ? opts.light : 0.9,   // 0.15 그늘 / 0.9 창가
      temp:  opts.temp  != null ? opts.temp  : 22,
      progress: opts.progress || 0,   // 누적 성장일
      stage: 'seed',
      dryDays: 0,                     // 가뭄 지속(일)
      wilted: false
    };
  }

  /* ── 상태 전이 (§2 결정론 표) ── */
  function stageOf(progress) {
    if (progress < 3)  return 'seed';
    if (progress < 5)  return 'sprout';
    if (progress < 15) return 'grow';
    if (progress < 17) return 'bud';
    return 'bloom';
  }

  /* ── 물주기(1회 +0.35) ── */
  function waterPlant(pot) { pot.water = clamp(pot.water + WATER_ADD, 0, 1); return pot; }

  /* ── 생장 1스텝(순수: pot 갱신) ──
     곱셈 게이트 g = G0·f_water·f_temp·lightGate — 가장 부족한 것이 성장을 정한다(리비히). */
  function grow(pot, dt) {
    dt = Math.min(Math.max(dt, 0), DT_CLAMP);
    const days = dt / DAY_SEC;
    // 물 자연 감소(하루가 지나며)
    pot.water = clamp(pot.water - WATER_DECAY * days, 0, 1);
    // 생장률
    const g = G0 * fWater(pot.water) * fTemp(pot.temp) * lightGate(pot.light);
    pot.progress += g * days;
    // 가뭄 지속 추적 → 시듦
    if (pot.water < DRY_THRESH) pot.dryDays += days; else pot.dryDays = 0;
    if (pot.dryDays >= WILT_DAYS) pot.wilted = true;
    pot.stage = pot.wilted ? 'wilt' : stageOf(pot.progress);
    return pot;
  }

  /* ── 렌더가 읽을 형태 파라미터 (§2·§3, THREE 참조 0) ── */
  function plantShape(pot) {
    const p = pot.progress;
    const etio = isEtiolated(pot.light);
    let height = HMAX * smoothstep(3, 18, p);
    if (etio) height *= 1.4;                          // 웃자람: 길게
    const nodeCount = clamp(Math.floor((p - 3) / NODE_STEP), 0, NODE_MAX);
    const nodeGap = height / Math.max(1, nodeCount);
    let leafScale = 1;
    if (etio) leafScale *= 0.7;                       // 웃자람: 잎 작게
    // 잎 색: 조건이 색으로(진단 가능). 웃자람이면 황화쪽 강제.
    let colorT = fWater(pot.water) * fTemp(pot.temp);
    if (etio) colorT *= 0.35;
    if (pot.wilted) colorT = Math.min(colorT, 0.15);  // 시듦 = 황변
    const leafHex = lerpHex(LEAF_ETIO, LEAF_HEALTHY, colorT);
    const flowerT = smoothstep(17, 20, p);            // 개화 진행 0→1
    return {
      stage: pot.wilted ? 'wilt' : stageOf(p),   // progress 기준 자체 계산(pot.stage 미의존 — 데모/렌더 정합)
      height: height,
      nodeCount: nodeCount,
      nodeGap: nodeGap,
      leafScale: leafScale,
      leafHex: leafHex,
      stemHex: STEM_HEX,
      flowerT: flowerT,
      etiolated: etio,
      wilted: pot.wilted,
      droop: pot.wilted                                // 렌더: 잎 처짐 플래그
    };
  }

  /* ── 미션 판정 (§4·§5-⑲⑳) ── */
  // S-2: 4화분 중 가장 큰 것 index(키 동률 시 낮은 index)
  function tallestPot(pots) {
    let best = -1, bh = -1;
    for (let i = 0; i < pots.length; i++) {
      const h = plantShape(pots[i]).height;
      if (h > bh + 1e-9) { bh = h; best = i; }
    }
    return best;
  }
  // S-3: 시든 원인 분류
  function diagnose(pot) {
    if (pot.water < DRY_THRESH) return 'drought';    // 가뭄
    if (pot.water > 0.9)        return 'overwater';  // 과습
    if (pot.temp  < 8)          return 'cold';       // 저온
    return 'healthy';
  }

  return {
    // 상수
    DAY_SEC, HMAX, G0, DT_CLAMP, WATER_DECAY, WATER_ADD, DRY_THRESH, WILT_DAYS,
    NODE_MAX, NODE_STEP, ETIO_LIGHT, LEAF_HEALTHY, LEAF_ETIO, STEM_HEX, POT_X,
    // 헬퍼
    clamp, lerp, smoothstep, lerpHex, fWater, fTemp, lightGate, isEtiolated,
    // 코어
    createPot, stageOf, waterPlant, grow, plantShape,
    // 미션
    tallestPot, diagnose
  };
});
</script>

<script type="module">

const K = window.KSeed;
const P = new URLSearchParams(location.search);
const GRADE = (['low','mid','high'].includes(P.get('grade')) ? P.get('grade') : 'high');

/* ═════════ 렌더 기반(황금 표준 승계) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', (e)=>{ e.preventDefault();
  if(document.getElementById('ctxlost'))return;
  const o=document.createElement('div'); o.id='ctxlost';
  o.style.cssText='position:fixed;inset:0;background:rgba(10,14,10,.93);color:#eaf1e4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';
  o.innerHTML='<div style="font-size:20px;font-weight:700">화면이 잠시 멈췄어요</div>';
  const b=document.createElement('button'); b.textContent='다시 열기';
  b.style.cssText='padding:10px 26px;border-radius:12px;border:0;background:#5fbf6a;color:#fff;font-size:16px;cursor:pointer';
  b.onclick=()=>location.reload(); o.appendChild(b); document.body.appendChild(o);
});

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d'); const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#1a241a'); gr.addColorStop(.55,'#121a12'); gr.addColorStop(1,'#0c110c');

/* ═════════ 프로시저럴 텍스처(꽃·흙) ═════════ */
function flowerTex(){
  const s=128, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'); g.clearRect(0,0,s,s);
  const cx=s/2, cy=s/2;
  for(let k=0;k<5;k++){                       // 꽃잎 5장 방사
    const a=k/5*Math.PI*2 - Math.PI/2;
    g.save(); g.translate(cx,cy); g.rotate(a);
    const grd=g.createRadialGradient(0,-30,4,0,-30,30);
    grd.addColorStop(0,'#ffe27a'); grd.addColorStop(1,'#f7a53d');
    g.fillStyle=grd; g.beginPath(); g.ellipse(0,-30,15,26,0,0,Math.PI*2); g.fill(); g.restore();
  }
  g.fillStyle='#8a5a1e'; g.beginPath(); g.arc(cx,cy,15,0,Math.PI*2); g.fill();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const FLOWER_TEX = flowerTex();

/* ═════════ 화분 + 프로시저럴 식물(마디 스택) ═════════ */
const POT_X = K.POT_X;                          // §2 [-0.36,-0.12,0.12,0.36]
const STEM_UNIT = 0.04;                         // 마디 기본 지오 높이(scale.y로 gap 맞춤)
const ZIG = [0.06,-0.05,0.07,-0.06,0.05,-0.07,0.05,-0.04]; // 마디 지그재그(자연스러움)
const stations = [];

const stemGeo = new THREE.CylinderGeometry(0.6, 1.0, 1, 6); // r 테이퍼는 scale로, 단위 h=1
const leafGeo = new THREE.PlaneGeometry(0.03, 0.052);
const cotGeo  = new THREE.CircleGeometry(0.016, 12);

function makeStation(x, idx){
  const group = new THREE.Group(); group.position.set(x, 0, 0); scene.add(group);

  // 화분(LatheGeometry 원뿔대 테라코타)
  const pts=[]; for(let i=0;i<=6;i++){ const t=i/6; pts.push(new THREE.Vector2(0.055-0.014*t, t*0.075)); }
  const pot = new THREE.Mesh(new THREE.LatheGeometry(pts, 20),
    new THREE.MeshStandardMaterial({ color:0xA0522D, roughness:0.9 }));
  pot.castShadow=true; pot.receiveShadow=true; group.add(pot);
  // 흙
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.02,20),
    new THREE.MeshStandardMaterial({ color:0x3E2B22, roughness:1 }));
  soil.position.y=0.072; soil.receiveShadow=true; group.add(soil);

  // 식물 그룹(흙 위)
  const plant = new THREE.Group(); plant.position.y=0.082; group.add(plant);
  const segs=[], leaves=[];
  for(let i=0;i<K.NODE_MAX;i++){
    const seg=new THREE.Mesh(stemGeo, new THREE.MeshStandardMaterial({ color:K.STEM_HEX, roughness:0.7 }));
    seg.castShadow=true; seg.visible=false; plant.add(seg); segs.push(seg);
    for(let s=0;s<2;s++){
      const lf=new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({
        color:K.LEAF_HEALTHY, roughness:0.6, side:THREE.DoubleSide }));
      lf.castShadow=true; lf.visible=false; plant.add(lf); leaves.push(lf);
    }
  }
  // 떡잎 2장(새싹)
  const cots=[]; for(let s=0;s<2;s++){
    const ct=new THREE.Mesh(cotGeo, new THREE.MeshStandardMaterial({
      color:0x8FCf7a, roughness:0.6, side:THREE.DoubleSide }));
    ct.visible=false; plant.add(ct); cots.push(ct);
  }
  // 꽃(스프라이트)
  const flower=new THREE.Sprite(new THREE.SpriteMaterial({ map:FLOWER_TEX, transparent:true }));
  flower.scale.setScalar(0.001); flower.visible=false; plant.add(flower);

  // 선택 하이라이트 링
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.06,0.072,24),
    new THREE.MeshBasicMaterial({ color:0x5fbf6a, transparent:true, opacity:0.85, side:THREE.DoubleSide }));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.001; ring.visible=false; group.add(ring);

  const st = { idx, pot:K.createPot({}), group, potMesh:pot, soil, plant, segs, leaves, cots, flower, ring,
               drops:[] };
  stations.push(st);
  return st;
}
POT_X.forEach((x,i)=> makeStation(x,i));

/* ═════════ 식물 갱신(plantShape 파라미터만 매핑) ═════════ */
function updatePlant(st){
  const sh = K.plantShape(st.pot);
  // 흙 부풀음(씨앗 단계 미세 피드백 — "기다림도 관찰")
  st.soil.scale.y = (sh.stage==='seed') ? 1 + 0.18*Math.min(1, st.pot.progress/3) : 1;

  if (sh.stage==='seed'){                        // 흙 속(안 보임)
    st.segs.forEach(s=>s.visible=false); st.leaves.forEach(l=>l.visible=false);
    st.cots.forEach(c=>c.visible=false); st.flower.visible=false; return;
  }

  const gap = sh.nodeGap, droop = sh.droop ? 0.5 : 0;
  let y = 0;
  const bend = st.pot.light < 0.5 ? 0.12 : 0.04;  // phototropism: 어두우면 더 굽음(빛 찾기)
  for (let i=0;i<K.NODE_MAX;i++){
    const on = i < sh.nodeCount;
    const seg = st.segs[i], l0=st.leaves[i*2], l1=st.leaves[i*2+1];
    seg.visible = on;
    if (on){
      const rt = 0.008 * (1 - i*0.06);           // 상단 테이퍼
      seg.scale.set(rt/1, gap/STEM_UNIT, rt/1);
      seg.position.set(i*0.002*bend, y + gap/2, 0);
      seg.rotation.z = ZIG[i] + bend*i*0.02;
      seg.material.color.setHex(sh.stemHex);
      // 잎 2쌍(양쪽 ±60°, 위 20°)
      const ly = y + gap*0.72, sc = sh.leafScale * K.smoothstep(0,0.3,(st.pot.progress-3-i*1.3));
      [l0,l1].forEach((lf,s)=>{
        lf.visible = sc>0.02;
        const dir = s===0?1:-1;
        lf.position.set(dir*0.014, ly, 0.002);
        lf.rotation.set(-0.35+droop, 0, dir*(1.05) - droop*dir);
        lf.scale.setScalar(Math.max(0.02, sc));
        lf.material.color.setHex(sh.leafHex);
      });
      y += gap;
    } else { l0.visible=l1.visible=false; }
  }
  // 새싹 떡잎(마디 0~1, grow 진입 후 탈락)
  const showCot = (sh.stage==='sprout');
  st.cots.forEach((ct,s)=>{
    ct.visible=showCot;
    if(showCot){ const dir=s===0?1:-1;
      ct.position.set(dir*0.012, sh.height*0.6+0.006, 0);
      ct.rotation.set(-0.6, 0, dir*0.5);
      ct.material.color.setHex(sh.leafHex);
    }
  });
  // 꽃
  st.flower.visible = sh.flowerT>0.01;
  if (st.flower.visible){
    st.flower.scale.setScalar(0.02 + 0.05*sh.flowerT);
    st.flower.position.y = Math.max(y, sh.height) + 0.012;
  }
}

/* ═════════ 물방울 트윈(물주기 피드백) ═════════ */
const dropGeo=new THREE.SphereGeometry(0.006,8,8);
const dropMat=new THREE.MeshStandardMaterial({ color:0x5aa9e0, transparent:true, opacity:0.85,
  roughness:0.2, metalness:0.1 });
function splash(st){
  for(let k=0;k<5;k++){
    const d=new THREE.Mesh(dropGeo, dropMat.clone());
    d.position.set((Math.random()-0.5)*0.05, 0.22+Math.random()*0.05, (Math.random()-0.5)*0.03);
    d.userData.vy = -0.3-Math.random()*0.2; st.group.add(d); st.drops.push(d);
  }
  st.soil.material.color.lerp(new THREE.Color(0x2a1c14), 0.4); // 젖음
}
function stepDrops(st, dt){
  for(let i=st.drops.length-1;i>=0;i--){
    const d=st.drops[i]; d.userData.vy -= 1.2*dt; d.position.y += d.userData.vy*dt;
    if(d.position.y<0.078){ st.group.remove(d); st.drops.splice(i,1); }
  }
}

// S-3: 4화분을 서로 다른 스트레스로 세팅(가뭄·과습·저온·건강)
function setupDiagnose(){
  const setups=[ {water:0.04,progress:11}, {water:0.98,progress:11}, {temp:4,progress:11}, {water:0.6,temp:22,light:0.9,progress:14} ];
  stations.forEach((st,i)=>{ const s=setups[i]||setups[3];
    st.pot=K.createPot(s);
    for(let t=0;t<8;t+=0.1) K.grow(st.pot,0.1);  // 시든 상태 성숙(가뭄 화분 wilted 누적)
    // grow가 바꾼 조건값 복원 → 진단 원인 유지(과습·저온이 물 감소로 사라지지 않게)
    if(s.water!=null) st.pot.water=s.water;
    if(s.temp!=null) st.pot.temp=s.temp;
    st.diagOK=false; updatePlant(st); });
  setPlay(false,false);
}
function showDiag(st){
  const box=document.getElementById('diag'); box.classList.remove('hide');
  const truth=K.diagnose(st.pot);
  document.getElementById('dgQ').textContent=(st.idx+1)+'번 화분이 힘든 이유는?';
  const opts=document.getElementById('dgOpts'); opts.innerHTML='';
  const ex=document.getElementById('dgExplain'), go=document.getElementById('dgGo');
  ex.classList.add('hide'); go.classList.add('hide');
  const choices=['drought','overwater','cold','healthy'];
  choices.forEach(c=>{ const b=document.createElement('button'); b.className='dgOpt'; b.textContent=DIAG_LABEL[c];
    b.onclick=()=>{ opts.querySelectorAll('button').forEach(x=>x.disabled=true);
      const right=(c===truth);
      b.classList.add(right?'right':'wrong');
      if(!right) [...opts.children].find(x=>x.textContent===DIAG_LABEL[truth]).classList.add('right');
      ex.textContent = right ? '맞았어요! 잎 색과 상태가 그 증거였죠.' : '아쉬워요 — 정답은 「'+DIAG_LABEL[truth]+'」예요.';
      ex.classList.remove('hide'); go.classList.remove('hide');
      if(right && !st.diagOK){ st.diagOK=true; diagDone++;
        const need=stations.filter(s=>K.diagnose(s.pot)!=='healthy').length;
        if(diagDone>=need){ setTimeout(()=>{ document.getElementById('diag').classList.add('hide'); showCleared(); },700); } }
    };
    opts.appendChild(b); });
}
function showPredict(){
  const m=MISSIONS[activeMission]; if(!m.predict) return;
  const box=document.getElementById('mPredict'); box.classList.remove('hide');
  document.getElementById('mpQ').textContent=m.predict.q;
  const opts=document.getElementById('mpOpts'); opts.innerHTML='';
  const ex=document.getElementById('mpExplain'), go=document.getElementById('mpGo');
  ex.classList.add('hide'); go.classList.add('hide');
  m.predict.opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='mpOpt'; b.textContent=o;
    b.onclick=()=>{ predictAnswered=true; opts.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.classList.add(i===m.predict.answer?'right':'wrong');
      if(i!==m.predict.answer) opts.children[m.predict.answer].classList.add('right');
      ex.textContent=m.predict.explain; ex.classList.remove('hide'); go.classList.remove('hide'); };
    opts.appendChild(b); });
}
function showCleared(){ const m=MISSIONS[activeMission];
  document.getElementById('mcMsg').textContent=m.icon+' '+m.title+' — 성공!';
  document.getElementById('mClear').classList.remove('hide'); }
function onGrown(){
  if(!activeMission||missionCleared||MISSIONS[activeMission].diagnose) return;
  if(MISSIONS[activeMission].evalFn(stations)){ missionCleared=true; showCleared(); }
}
// S-3 진단 탭(기존 선택 리스너와 공존 — S-3일 때만 진단 카드)
renderer.domElement.addEventListener('pointerdown',(e)=>{
  if(activeMission!=='S-3') return;
  const p=new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  const r=new THREE.Raycaster(); r.setFromCamera(p,camera);
  const hits=r.intersectObjects(stations.map(s=>s.group),true);
  if(hits.length){ let g=hits[0].object; while(g.parent&&!stations.find(s=>s.group===g)) g=g.parent;
    const st=stations.find(s=>s.group===g); if(st) showDiag(st); }
});

/* ── 데이터 렌즈(4화분 키-시간 곡선 — 대류/분기 렌즈 문법) ── */
const LENS_COL=['#5fbf6a','#5aa9e0','#f5c542','#e0715a'];
let lensOpen=false;
function buildLensUI(){
  const b=document.createElement('button'); b.id='lensBtn'; b.textContent='📈 성장 곡선';
  document.body.appendChild(b);
  const p=document.createElement('div'); p.id='lensPanel'; p.className='hide';
  p.innerHTML=`<h4>키 – 시간 곡선</h4><canvas id="lensCanvas" width="256" height="150"></canvas>
    <div id="lensLegend"></div>`; document.body.appendChild(p);
  const lg=document.getElementById('lensLegend');
  stations.forEach((s,i)=> lg.innerHTML+=`<span><i style="background:${LENS_COL[i]}"></i>${i+1}번</span>`);
  b.onclick=()=>{ lensOpen=!lensOpen; p.classList.toggle('hide',!lensOpen); if(lensOpen) drawLens(); };
}
function drawLens(){
  const cv=document.getElementById('lensCanvas'); if(!cv) return;
  const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  const maxDay=20, maxH=K.HMAX*1.4;
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
  for(let d=0;d<=20;d+=5){ const x=d/maxDay*W; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  stations.forEach((st,i)=>{ if(!st.group.visible||!st.hist||st.hist.length<2) return;
    ctx.strokeStyle=LENS_COL[i]; ctx.lineWidth=2.2; ctx.beginPath();
    st.hist.forEach((pt,j)=>{ const x=Math.min(1,pt.day/maxDay)*W, y=H-(pt.h/maxH)*H*0.92-4;
      j?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); });
}


const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  let dt=Math.min(clock.getDelta(),0.05);
  if(playing){
    const sdt=dt*speed;
    elapsedDays += sdt/K.DAY_SEC;
    stations.forEach(st=>{ K.grow(st.pot, sdt); updatePlant(st); stepDrops(st,sdt);
      if(!st.hist) st.hist=[];
      const last=st.hist[st.hist.length-1];
      if(!last || elapsedDays-last.day>=0.25) st.hist.push({ day:elapsedDays, h:K.plantShape(st.pot).height });
    });
    document.getElementById('dayCount').textContent=Math.floor(elapsedDays)+'일째';
    if(selected) syncPanel();
    onGrown();
    if(lensOpen) drawLens();
  } else {
    stations.forEach(st=> stepDrops(st,dt));
  }
  if(hintT>0){ hintT-=dt; if(hintT<=0) document.getElementById('hint').classList.remove('show'); }
  controls.update(); renderer.render(scene,camera);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

// 초기 1회 갱신 + 로딩 해제
stations.forEach(st=>{ st.hist=[]; updatePlant(st); });
document.getElementById('loading').classList.add('hide');
buildMissionUI(); buildLensUI();
animate();

// 데모: ?t=<progress> 로 특정 성장 단계 미리보기
if(P.get('t')!=null){ const t=parseFloat(P.get('t')); stations.forEach((st,i)=>{ st.pot.progress=t+i*3; updatePlant(st); }); }
// ?mission= 직접 진입 / 저학년은 미션 홈 자동 오픈
{ const mq=P.get('mission');
  if(mq && MISSIONS[mq]) setMission(mq);
  else if(GRADE==='low') openHome(); }

window.__SEED_P2__ = { stations, updatePlant, K,
  MISSIONS, setMission, showDiag, drawLens, onGrown,
  get activeMission(){ return activeMission; } };  // 검증 훅(P2+P3)
</script>

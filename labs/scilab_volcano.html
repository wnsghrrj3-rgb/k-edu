<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이랩 과학실 — 화산 모형실험 미션</title>
<!--
  케이랩 과학실(SciLab) v0.2 — 데모 1호(scilab_proto) 검수 통과 렌더 표준 위에
  "과학실 본체" 구조를 얹은 첫 판:
    · 기구 트레이(선반): 필요한 기구를 직접 골라 꺼냄 — 고르기 자체가 학습·평가
    · 스냅 배치 + 절차 규칙: 삼발이 → 그물 → 비커 → 온도계 (순서 어기면 교육 피드백)
    · 미션 시스템: 미션 = 데이터(MISSION 객체). 오답 기구 = 즉시 피드백(왜 아닌지)
    · 온도계: 설치해야 온도가 보임 (측정 도구의 의미)
    · 자유 실험 모드: 제한 없이 꺼내 놓기
  렌더 표준(데모 1호 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft ·
    유리=블렌딩 / 액체=transmission 굴절(attenuation 깊이색) · GPU 김 · CPU 기포 · 품질 자동
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5B9BF0; --orange:#FF8A3D; --green:#12B886; --purple:#9B7BF5;
    --ink:#1d2733; --hud:rgba(20,25,32,.74); --hudline:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:10px 16px;pointer-events:none;z-index:20}
  #topbar .title{color:#fff;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  #topbar .badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}

  /* 온도 패널 */
  #panel{position:fixed;top:50px;left:14px;z-index:20;background:var(--hud);
    backdrop-filter:blur(8px);border:1px solid var(--hudline);border-radius:16px;
    padding:13px 17px;color:#fff;min-width:166px}
  #temp{font-size:32px;line-height:1.05}
  #temp small{font-size:15px;color:#9fb3c8}
  #temp.na{font-size:14px;color:#9fb3c8;line-height:1.5;padding:4px 0}
  #stateline{font-size:12.5px;margin-top:6px;color:#ffd9a3;min-height:17px}
  .volwrap{margin-top:9px}
  .volwrap .lab{font-size:11px;color:#9fb3c8;margin-bottom:4px}
  .volbar{width:136px;height:8px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .volbar i{display:block;height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#4FC3F7,#81D4FA);transition:width .3s}

  /* 미션 패널 */
  #mission{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:21;
    background:var(--hud);backdrop-filter:blur(8px);border:1px solid var(--hudline);
    border-radius:16px;padding:11px 16px;color:#fff;max-width:min(420px,92vw);text-align:center}
  #mission .mt{font-size:14.5px;color:#ffe3b8}
  #mission .mp{font-size:12.5px;color:#c6d6e5;margin-top:4px;line-height:1.5}
  #mission .prog{margin-top:7px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  #mission .chip{font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid var(--hudline);color:#9fb3c8}
  #mission .chip.on{background:rgba(18,184,134,.22);border-color:#12B886;color:#7CF0C9}

  /* 버튼 */
  #ctrls{position:fixed;top:50px;right:14px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .btn{font-family:'Gowun Dodum';font-size:14px;border:none;border-radius:13px;padding:10px 15px;
    cursor:pointer;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s}
  .btn:active{transform:scale(.95)}
  #fireBtn{background:linear-gradient(135deg,#FF8A3D,#F4511E)}
  #fireBtn.off{background:linear-gradient(135deg,#455A64,#37474F)}
  #fireBtn:disabled{opacity:.35;cursor:default}
  #modeBtn{background:rgba(155,123,245,.25);border:1px solid rgba(155,123,245,.5)}
  #resetBtn{background:rgba(255,255,255,.14);border:1px solid var(--hudline);font-size:12.5px}

  /* 기구 트레이 */
  #tray{position:fixed;bottom:0;left:0;right:0;z-index:22;padding:10px 12px 12px;
    display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(transparent, rgba(10,13,17,.85) 40%)}
  #tray::-webkit-scrollbar{display:none}
  .eq{flex:0 0 auto;width:86px;background:rgba(255,255,255,.06);border:1px solid var(--hudline);
    border-radius:15px;padding:9px 6px 8px;text-align:center;color:#dbe7f2;cursor:pointer;
    backdrop-filter:blur(6px);transition:transform .13s,border-color .2s;user-select:none}
  .eq:active{transform:scale(.93)}
  .eq .ic{font-size:26px;line-height:1.15}
  .eq .nm{font-size:11.5px;margin-top:4px;line-height:1.25}
  .eq.placed{opacity:.42}
  .eq.placed .nm::after{content:' ✓';color:#7CF0C9}
  .eq.shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* 예측 카드 · 성공 패널 */
  .card{position:fixed;left:50%;transform:translateX(-50%);z-index:26;
    background:rgba(255,255,255,.97);border-radius:18px;padding:16px 18px;max-width:350px;width:92vw;
    box-shadow:0 12px 40px rgba(0,0,0,.5);color:var(--ink);transition:opacity .3s,transform .3s}
  .card.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}
  #predict{bottom:120px}
  #predict2{bottom:120px}
  #predict h3,#predict2 h3{font-size:14.5px;margin-bottom:10px;color:#1565C0}
  #predict .opts,#predict2 .opts{display:flex;flex-direction:column;gap:8px}
  #predict button,#predict2 button,#success button{font-family:'Gowun Dodum';font-size:14px;border:2px solid #dbe4ee;
    background:#fff;border-radius:12px;padding:10px;cursor:pointer;color:var(--ink)}
  #predict button:hover,#predict2 button:hover{border-color:#1565C0;background:#f0f7ff}
  #success{bottom:50%;transform:translate(-50%,50%);text-align:center}
  #success.hide{transform:translate(-50%,50%) translateY(12px)}
  #success .big{font-size:38px}
  #success h3{font-size:18px;color:#0d7a5c;margin:6px 0 4px}
  #success p{font-size:13px;line-height:1.65;color:#41546a}
  #success .row{display:flex;gap:8px;margin-top:13px}
  #success button{flex:1}
  #success button.pri{background:#12B886;border-color:#12B886;color:#fff}

  #toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(255,255,255,.97);color:var(--ink);font-size:13.5px;padding:11px 17px;
    border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:88vw;text-align:center;
    line-height:1.55;transition:opacity .35s;border-left:5px solid var(--green)}
  #toast.warn{border-left-color:var(--orange)}
  #toast.hide{opacity:0;pointer-events:none}

  #loading{position:fixed;inset:0;z-index:50;background:#171b21;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cfe3f5;
    transition:opacity .5s}
  #loading .flask{font-size:44px;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #loading.hide{opacity:0;pointer-events:none}

  @media (max-width:560px){
    #panel{top:auto;bottom:118px;padding:9px 12px;min-width:0}
    #temp{font-size:24px}
    #mission{max-width:86vw;padding:9px 12px}
    #mission .mp{display:none}
    .eq{width:76px} .eq .ic{font-size:23px}
  }
</style>

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 화산 시뮬 (SPEC_E2 A-2 — 가열→압력→분출→흐름, 불 끄면 굳음. 수치 확정·창작 금지) ──
     pressure = 가열로 쌓인 압력 0~1 · flow = 용암 흐름 진행 0~1(분화구→기슭) · cooled = 굳음 진행 0~1 */
  function createVolcanoSim(){
    var S = { heatK:0, pressure:0, erupting:false, flow:0, cooled:0, phase:'cold' };
    var HEAT_R=0.24, PRESS_RATE=0.10, ERUPT_AT=1.0, FLOW_RATE=0.28, COOL_RATE=0.22;
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      var k=0;
      if(inp.lit && inp.ready){
        k = 1 - inp.dist/HEAT_R;
        if(k<0)k=0; if(k>1)k=1;
      }
      S.heatK=k;
      if(!S.erupting){
        S.pressure += PRESS_RATE*k*dt;
        if(S.pressure>=ERUPT_AT){ S.erupting=true; S.pressure=1; }   // 분출 시작
      } else if(k>0){
        S.flow = Math.min(1, S.flow + FLOW_RATE*dt);   // 가열 지속 = 용암이 기슭으로 흐름
        S.cooled = 0;                                  // 재가열 시 굳음 리셋
      } else {
        // ★불 끄면 = 굳음 (화성암)
        S.cooled = Math.min(1, S.cooled + COOL_RATE*dt);
      }
      S.phase = S.cooled>=1 ? 'rock' : (S.erupting ? (k>0?'flowing':'cooling') : (k>0?'heating':'cold'));
      return S;
    }
    return { state:S, step:step, HEAT_R:HEAT_R };
  }

  /* ── 미션 정의 (미션 = 데이터. SPEC_E2 A-1) ── */
  var MISSION_VOLCANO = {
    id:'volcano_model',
    title:'화산 모형실험 — 분출과 굳음',
    required:['volcano','marshmallow','stand','lamp'],
    // 절차 규칙: 이 기구를 놓으려면 먼저 있어야 하는 것
    needs:{
      marshmallow:{ pre:['volcano'], msg:'마그마(마시멜로)를 담을 <b>화산 모형이 먼저</b>!' },
      stand:{ pre:['volcano'], msg:'화산을 올릴 <b>받침(스탠드)</b> — 화산이 먼저 있어야죠!' },
      lamp:{ pre:['volcano','stand'], msg:'가열하려면 <b>화산과 받침이 먼저</b> 준비돼야 해요!' }
    },
    // 오답 기구: 왜 아닌지가 곧 학습
    wrong:{
      magnet:'🧲 자석은 철을 끌어당기는 도구 — 화산 분출과는 상관없어요.',
      thermo:'🌡️ 온도계는 온도를 잴 때 — 오늘 지켜볼 것은 <b>분출과 굳음</b>이에요!',
      rod:'🥢 유리막대는 저을 때 — 화산은 젓지 않아요!',
      beaker_w:'💧 물 비커는 다른 실험에서! 오늘은 <b>가열해 분출</b>시켜요.'
    }
  };

  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      // 위에 얹힌 것부터 함께 회수 (의존 역순)
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  var API = { createVolcanoSim:createVolcanoSim, MISSION_VOLCANO:MISSION_VOLCANO, createMissionRun:createMissionRun };
  if(typeof window!=='undefined'){ window.SciLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════ 렌더 기반 (데모 1호 확정 표준) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2b3340'); gr.addColorStop(.55,'#1b2129'); gr.addColorStop(1,'#12161c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}
scene.fog = new THREE.Fog(0x161b22, 4.2, 9.5);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 30);
camera.position.set(0.95, 0.9, 1.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.32, -0.02);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=0.65; controls.maxDistance=3.4;
controls.maxPolarAngle=1.46; controls.enablePan=false;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(1.8,3.4,1.6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-1.8; sun.shadow.camera.right=1.8;
sun.shadow.camera.top=2.2; sun.shadow.camera.bottom=-0.6;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=9;
sun.shadow.bias=-0.0004; sun.shadow.radius=5;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x2b241c, 0.35));

/* 재질 — 유리=블렌딩, 액체=굴절(데모 1호 확정) */
const GLASS = new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.03,
  transparent:true, opacity:0.18, depthWrite:false,
  clearcoat:1, clearcoatRoughness:0.06, side:THREE.DoubleSide, envMapIntensity:1.6
});
const METAL = new THREE.MeshStandardMaterial({ color:0xb8bec6, metalness:0.92, roughness:0.32, envMapIntensity:1.1 });
const DARKMETAL = new THREE.MeshStandardMaterial({ color:0x555b63, metalness:0.85, roughness:0.45 });
const WOOD = new THREE.MeshStandardMaterial({ color:0xC49A6C, roughness:0.8 });
function waterMat(hex){
  return new THREE.MeshPhysicalMaterial({
    color:0xffffff, metalness:0, roughness:0.05,
    transmission:1, thickness:0.15, ior:1.33,
    attenuationColor:new THREE.Color(hex), attenuationDistance:0.16, envMapIntensity:1.0
  });
}

/* ═════════ 실험대 ═════════ */
const BENCH_Y = 0.0;
{
  const floor=new THREE.Mesh(new THREE.CircleGeometry(7,48),
    new THREE.MeshStandardMaterial({color:0x6e747d, roughness:0.95}));
  floor.rotation.x=-Math.PI/2; floor.position.y=-0.86; floor.receiveShadow=true; scene.add(floor);

  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#22262c'; g.fillRect(0,0,256,256);
  for(let i=0;i<2600;i++){
    const v=30+Math.random()*26|0;
    g.fillStyle=`rgba(${v},${v+3},${v+7},${0.16+Math.random()*0.2})`;
    g.fillRect(Math.random()*256, Math.random()*256, 1.4, 1.4);
  }
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(3,2);
  const top=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.09,1.7),
    new THREE.MeshStandardMaterial({map:tex, roughness:0.34, metalness:0.05, envMapIntensity:0.7}));
  top.position.y=BENCH_Y-0.045; top.receiveShadow=true; top.castShadow=true; scene.add(top);
  const body=new THREE.Mesh(new THREE.BoxGeometry(3.15,0.76,1.5),

const LAVA_HOT = new THREE.Color(0xFF6B2B), LAVA_ROCK = new THREE.Color(0x3a3632);
{
  const gp = new THREE.Group();

  const vTex=new THREE.CanvasTexture(vc); vTex.colorSpace=THREE.SRGBColorSpace;
  const cone=new THREE.Mesh(new THREE.ConeGeometry(VOLC_R, VOLC_H, 40, 1, true),
    new THREE.MeshStandardMaterial({map:vTex, color:0x6b5d4f, roughness:0.9, side:THREE.DoubleSide}));
  cone.position.y=VOLC_H/2; cone.castShadow=cone.receiveShadow=true; gp.add(cone);
  // 분화구 구멍 (어두운 안쪽)
  const crater=new THREE.Mesh(new THREE.CylinderGeometry(CRATER_R, CRATER_R*0.7, 0.03, 20, 1, true),

  // ★용암 발광띠 — 분화구→기슭 곡선(rodGlow 패턴 = setDrawRange 성장 + §3-B 색 lerp 굳음)
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(CRATER_R*0.6, CRATER_Y-0.004, 0),
    new THREE.Vector3(0.07, VOLC_H*0.78, 0.03),
    new THREE.Vector3(0.105, VOLC_H*0.54, -0.05),
    new THREE.Vector3(0.14, VOLC_H*0.30, 0.045),
    new THREE.Vector3(VOLC_R*0.96, 0.02, -0.02)
  ]);
  const tubeGeo=new THREE.TubeGeometry(curve, 40, 0.008, 8, false);
  lavaGeoIdx=tubeGeo.index.count;                 // 총 인덱스(발광 성장 기준)
  lavaMat=new THREE.MeshBasicMaterial({color:LAVA_HOT.clone()});
  lavaTube=new THREE.Mesh(tubeGeo, lavaMat);
  lavaTube.geometry.setDrawRange(0,0);            // flow=0 → 아무것도 안 그림
  gp.add(lavaTube);

  // 발광 라이트 (분출 중 분화구)
  lavaLight=new THREE.PointLight(0xFF6B2B, 0, 0.9, 2);
  lavaLight.position.set(0, CRATER_Y+0.02, 0); gp.add(lavaLight);

  // 분출 스프라이트 (황금샘플 김 셰이더 재사용 — 색만 붉게, uIntensity=압력/흐름)
  const S_N=110;
  const sGeo=new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(S_N*3),3));
  const seeds=new Float32Array(S_N);
  for(let i=0;i<S_N;i++) seeds[i]=Math.random();
  sGeo.setAttribute('aSeed', new THREE.BufferAttribute(seeds,1));
  steamUni={ uTime:{value:0}, uIntensity:{value:0}, uScale:{value:innerHeight*0.5} };
  steam=new THREE.Points(sGeo, new THREE.ShaderMaterial({
    uniforms:steamUni, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      attribute float aSeed;
      uniform float uTime,uIntensity,uScale;
      varying float vA;
      float h(float n){return fract(sin(n)*43758.5453);}
      void main(){
        float sp=mix(0.55,1.0,h(aSeed*7.13));
        float life=fract(uTime*0.30*sp+aSeed);
        float ang=h(aSeed*3.31)*6.28318;
        float r0=h(aSeed*9.71)*0.03;
        vec3 p=vec3(cos(ang)*r0,0.0,sin(ang)*r0);
        p.y+=life*0.34;
        p.x+=sin(uTime*1.4+aSeed*21.0)*(0.012+0.05*life);
        p.z+=cos(uTime*1.1+aSeed*13.0)*(0.012+0.045*life);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        vA=smoothstep(0.0,0.15,life)*(1.0-life)*uIntensity;
        gl_PointSize=mix(0.06,0.26,life)*uScale/max(-mv.z,0.1);
      }`,
    fragmentShader:`
      varying float vA;
      void main(){
        float d=length(gl_PointCoord-0.5);
        gl_FragColor=vec4(1.0,0.42,0.17, smoothstep(0.5,0.06,d)*vA*0.5);
      }`
  }));
  steam.frustumCulled=false; steam.position.y=CRATER_Y; gp.add(steam);

  gp.position.set(0, STAND_TOP, 0);
  RIG.add(gp); registerEq('volcano', gp);
}

function onPick(id, cardEl){
  if(succeeded && !freeMode) return;
  if(run.placed[id]){
    // 재탭 = 회수 (의존물 함께)
    run.remove(id);
    Object.keys(EQ_OBJ).forEach(k=>{
      if(!run.placed[k] && k!=='lamp') EQ_OBJ[k].visible=false;
      if(k==='lamp' && !run.placed.lamp){ EQ_OBJ.lamp.visible=false; setFire(false); }
    });
    syncTray(); renderProg(); updateFireBtn();
    return;
  }
  const r=run.pick(id, freeMode);
  if(r.act==='wrong'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, 4200);
    return;
  }
  if(r.act==='blocked'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, 3800);
    return;
  }
  if(r.act==='placed'){
    const o=EQ_OBJ[id];
    if(o.userData.free){ const [x,z]=nextSpot(); o.position.x=x; o.position.z=z; }
    if(id==='lamp'){ LAMP.position.copy(LAMP_HOME); }
    dropIn(id);
    syncTray(); renderProg(); updateFireBtn();
    if(r.ready && !freeMode && !predictShown){
      predictShown=true;
      setTimeout(()=>{ predictEl.classList.remove('hide');
        toast('✅ 준비 끝! 예측을 골라 봐요'); }, 500);
    } else if(r.ready && freeMode){
      toast('준비 완료 — 불을 붙여 봐요 🔥');
    }
  }
}
function syncTray(){
  EQUIP.forEach(e=>{
    $('eq_'+e.id).classList.toggle('placed', !!run.placed[e.id]);
  });
}
function updateFireBtn(){
  fireBtn.disabled = !run.placed.lamp;
}

predictEl.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    prediction=b.dataset.pick;
    predictEl.classList.add('hide');
    toast('좋아요! 이제 불을 붙이고, 램프를 화산 아래로 🌋');
  });
});
predict2El.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    prediction2=b.dataset.pick;
    predict2El.classList.add('hide');
    toast('좋아요 — 이제 <b>불을 꺼서</b> 확인해 봐요!');
  });
});

function setFire(on){
  if(on && !run.placed.lamp) return;
  lit=on;
  flameOuter.visible=flameInner.visible=on;
  fireBtn.textContent=on?'🧯 불 끄기':'🔥 불 켜기';
  fireBtn.classList.toggle('off',!on);
}
fireBtn.addEventListener('click',()=>setFire(!lit));

modeBtn.addEventListener('click',()=>{
  freeMode=!freeMode;
  modeBtn.textContent=freeMode?'🎯 미션 모드':'🧪 자유 실험';
  missionEl.style.display=freeMode?'none':'';
  document.querySelector('#topbar .badge').textContent=freeMode?'자유 실험':'미션 · 화산 모형실험';
  toast(freeMode?'자유 실험 — 무엇이든 꺼내 놓아 봐요':'미션 모드 — 필요한 기구만!');
});

function resetAll(keepMode){
  sim=createVolcanoSim(); run=createMissionRun(MISSION_VOLCANO);
  Object.keys(EQ_OBJ).forEach(k=>{ EQ_OBJ[k].visible=false; });
  LAMP.position.copy(LAMP_HOME);
  setFire(false); lit=false;
  prediction=null; predictShown=false; succeeded=false; successAt=0;
  prediction2=null; predict2Shown=false; eruptShown=false;
  flags.warm=flags.low=false;
  spotIdx=0;
  // 용암·마시멜로·분출 리셋
  lavaTube.geometry.setDrawRange(0,0);
  lavaMat.color.copy(LAVA_HOT); lavaLight.intensity=0;
  if(steamUni) steamUni.uIntensity.value=0;
  if(marshMesh) marshMesh.scale.setScalar(1);
  preswrap.style.display='none'; presEl.style.width='0%';
  stateEl.textContent='화산과 받침을 준비하고, 아래를 가열해 봐요';
  predictEl.classList.add('hide'); predict2El.classList.add('hide'); successEl.classList.add('hide');
  syncTray(); renderProg(); updateFireBtn();
  if(!keepMode && freeMode){ modeBtn.click(); }
}
resetBtn.addEventListener('click',()=>resetAll(true));
$('sucAgain').addEventListener('click',()=>resetAll(true));
$('sucFree').addEventListener('click',()=>{
  successEl.classList.add('hide');
  if(!freeMode) modeBtn.click();
});

const flags={warm:false, low:false};

function lampDist(){
  const dx=LAMP.position.x-RIG.position.x;
  const dz=LAMP.position.z-RIG.position.z;
  return Math.hypot(dx,dz);
}

/* ═════════ 드래그 (램프) ═════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0), -BENCH_Y);
const hitPt=new THREE.Vector3();
let dragging=false, downPos=null, moved=false;
function toNDC(e){
  ndc.x=(e.clientX/innerWidth)*2-1;
  ndc.y=-(e.clientY/innerHeight)*2+1;
}
renderer.domElement.addEventListener('pointerdown', e=>{
  if(!LAMP.visible) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  if(ray.intersectObject(dragProxy,false).length){
    dragging=true; moved=false; downPos={x:e.clientX,y:e.clientY};
    controls.enabled=false;
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(!dragging){
    if(!LAMP.visible) return;
    toNDC(e); ray.setFromCamera(ndc,camera);
    renderer.domElement.style.cursor=
      ray.intersectObject(dragProxy,false).length?'grab':'';
    return;
  }
  if(downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6) moved=true;
  toNDC(e); ray.setFromCamera(ndc,camera);
  if(ray.ray.intersectPlane(dragPlane,hitPt)){
    LAMP.position.x=THREE.MathUtils.clamp(hitPt.x,-1.35,1.35);
    LAMP.position.z=THREE.MathUtils.clamp(hitPt.z,-0.6,0.6);
  }
});
function endDrag(){
  if(!dragging) return;
  dragging=false; controls.enabled=true;
  if(!moved) setFire(!lit);
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ═════════ 품질 자동 ═════════ */
let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++;
  if(qualityChecked) return;
  if(now-fpsStart>4000){
    qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){
      renderer.setPixelRatio(1);
      sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
      sun.shadow.radius=3;
    }
  }
}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  // C-9 조작 문법: 램프 드래그로 화산 아래를 가열. C-3: 화산이 모든 것의 선행.
  const ready = !!(run.placed.volcano && run.placed.stand && run.placed.marshmallow);
  const S=sim.step(dt,{lit, dist:lampDist(), ready});

  // ── 압력 바 HUD (분출 전만 표시) ──
  if(ready){ preswrap.style.display=''; presEl.style.width=(S.pressure*100).toFixed(0)+'%'; }
  else preswrap.style.display='none';

  // ── 용암 발광띠 (flow=성장 / cooled=굳음 색 lerp) ──
  lavaTube.geometry.setDrawRange(0, Math.floor(lavaGeoIdx * S.flow));
  lavaMat.color.copy(LAVA_HOT).lerp(LAVA_ROCK, S.cooled);   // 굳으면 화성암색
  lavaLight.intensity = 1.4 * S.flow * (1 - S.cooled);
  lavaLight.color.copy(lavaMat.color);

  // ── 마시멜로(마그마) 흡수 — 분출 시작하면 용암에 삼켜짐 ──
  if(marshMesh && run.placed.marshmallow){
    const target = S.erupting ? 0.001 : 1;
    marshMesh.scale.x += (target-marshMesh.scale.x)*Math.min(dt*4,1);
    marshMesh.scale.y=marshMesh.scale.z=marshMesh.scale.x;
  }

  // ── 분출 스프라이트 (uIntensity: 압력 쌓임→분출, 굳으면 0) ──
  if(steamUni){ steamUni.uTime.value=t;
    const eInt = S.erupting ? (1-S.cooled) : S.pressure*0.5;   // 분출 전 예열 김 살짝
    steamUni.uIntensity.value += (eInt - steamUni.uIntensity.value)*Math.min(dt*2.5,1);
  }

  // ── 상태줄 (SPEC A-3) ──
  let st='';
  if(succeeded) st='🏅 미션 성공!';
  else if(S.phase==='rock') st='🪨 굳어서 화성암이 됐어요!';
  else if(S.phase==='cooling') st='불을 껐어요 — 용암이 식는 중…';
  else if(S.phase==='flowing') st='🌋 분출! 용암이 흘러내려요';
  else if(S.phase==='heating') st='🔥 마그마가 데워지는 중… 압력이 쌓여요';
  else if(lit && !ready) st='램프를 화산 아래로 옮겨요';
  else st='화산과 받침을 준비하고, 아래를 가열해 봐요';
  stateEl.textContent=st;

  // ── ★와우 2차 (분출 시작 순간·중고 · 불 끄면 굳음?) ──
  if(!eruptShown && S.erupting){
    eruptShown=true;
    if(showWow && !predict2Shown && !freeMode){ predict2Shown=true; predict2El.classList.remove('hide'); }
  }

  // ── 성공 판정 (cooled>=0.95 2초 지속 = 분출→굳음 관찰) ──
  if(S.cooled>=0.95){
    if(!successAt) successAt=t;
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='땅속 <b>마그마</b>가 압력으로 분출해 <b>용암</b>이 되고, <b>식으면 굳어 화성암</b>이 돼요. 제주 현무암·한탄강 주상절리가 이렇게 생겼어요!';
      if(prediction) msg=(prediction==='erupt'?'🎯 <b>1차 예측 적중!</b> ':'🤔 1차 예측과 달랐죠? ')+msg;
      if(prediction2) msg+= (prediction2==='harden')
        ? '<br>🎯 <b>2차도 적중</b> — 불을 끄니 용암이 식어 굳었죠(화성암).'
        : '<br>🤔 2차는 달랐죠? 불을 끄면(열이 식으면) 용암이 굳어 <b>화성암</b>이 돼요.';
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' :
                    `<br>기구 고르기 다시 생각해 본 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      if(!freeMode) successEl.classList.remove('hide');
      else toast('🪨 용암이 굳어 화성암이 됐어요!',false,5200);
    }
  } else successAt=0;

  if(lit){
    const f=1+0.10*Math.sin(t*23)+0.06*Math.sin(t*57+1.7);
    flameOuter.scale.set(0.058*f, 0.115*f*(1+0.05*Math.sin(t*31)), 1);
    flameInner.scale.set(0.034*f, 0.06*f, 1);
    flameLight.intensity=2.3+0.6*Math.sin(t*19)*Math.sin(t*7);
  } else flameLight.intensity=0;

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  steamUni.uScale.value=innerHeight*0.5;
});

document.getElementById('loading').classList.add('hide');
toast('🎯 미션: 선반에서 <b>필요한 기구만</b> 골라 실험을 준비해 봐요!', false, 5200);
animate();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수 공장 · 케이랩 수학실</title>
<!-- P1 = 10의 자석 순수 로직만(렌더 0줄, P1 게이트). P2에서 2D canvas 수 블록 렌더 +
     자석 붙기/갈라짐 애니 증축. 순수 로직엔 THREE·DOM·canvas 참조 0.
     십진 보수·받아올림·받아내림은 표준 산술(수치 창작 아님) — 10의 보수 = 10−n. -->
<style>
  :root{ --ink:#eef0ff; --sub:#9aa0c8; --panel:rgba(14,16,30,.82); --line:rgba(255,255,255,.1);
         --block:#ffd166; --block2:#f59e2c; --bell:#7c8cff; --ten:#5ad1a0; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0c18;color:var(--ink);
    font-family:'Gowun Dodum',system-ui,sans-serif;touch-action:none}
  #stage{position:fixed;inset:0}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0c18;color:var(--sub);font-size:15px;z-index:50}
  #loading.hide{display:none}
  #brand{position:fixed;top:12px;left:16px;z-index:20;font-family:'Jua';font-size:17px}
  #brand .k{color:var(--bell)}
  #back{position:fixed;top:14px;right:16px;z-index:20;font-size:12.5px;color:var(--sub);
    text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  #hud{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:19;font-size:13px;color:var(--sub);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 15px;backdrop-filter:blur(6px);
    display:flex;gap:12px;align-items:center;white-space:nowrap}
  #hud b{font-family:'Jua';color:var(--ink)}
  #tip{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:18;font-size:13.5px;color:var(--ink);
    background:rgba(14,16,30,.78);border:1px solid var(--line);border-radius:12px;padding:8px 15px;
    pointer-events:none;transition:opacity .3s;text-align:center;max-width:88vw}
  #tip.hide{opacity:0}
  #sound{position:fixed;top:14px;right:96px;z-index:20;font-size:15px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;width:38px;height:33px;cursor:pointer;color:var(--ink);line-height:1}
  #ctl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:7px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px;backdrop-filter:blur(8px);
    box-shadow:0 14px 40px rgba(0,0,0,.45);max-width:94vw;flex-wrap:wrap;justify-content:center}
  #ctl button{font-family:'Jua';font-size:14px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;transition:.14s}
  #ctl button:active{transform:scale(.93)}
  #ctl button.go{background:var(--block);color:#3a2c00;border-color:var(--block)}
  #ctl button.on{background:var(--bell);color:#0a0c18;border-color:var(--bell)}
  #hud .ten{color:var(--ten)}
</style>
</head>
<body>
<div id="loading">수 공장 준비 중…</div>
<div id="stage"></div>
<div id="brand"><span class="k">케이</span>랩 수학실 · 수 공장</div>

<button id="sound" title="소리">🔊</button>

  <button id="bNew">🎲 새 블록</button>
  <button id="bGo" class="go">🧲 만나게 하기</button>

  <button id="bReset">↺</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     순수 로직 — KNumber "10의 자석" 모델 (MATHLAB 설계 §수 공장). THREE·DOM 참조 0.
     magnetAdd(a,b): a를 10으로 채우는 데 필요한 만큼(보수)을 b에서 뜯어 붙임 → 받아올림.
     magnetSub(a,b): 일의 자리가 부족하면 10 덩어리를 갈라서 뺌 → 받아내림.
     complement/partnerToTen: 10의 보수(표준 산술). pairsOfTen: 10 가르기 짝.
     ═══════════════════════════════════════════════════════════════════════ -->
<script id="number-pure">
(function (root, factory) {
  const API = factory();
  if (typeof window !== 'undefined') window.KNumber = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(this, function () {
  'use strict';

  /* ── 확정 상수 (§수 공장) ── */
  const BASE = 10;              // 십진 = 10의 자석
  const N_MIN = 0, N_MAX = 18;  // 1학년 받아올림/받아내림 범위(한 자리+한 자리 ~ 십몇−한자리)

  /* ── 결정론 rng (mulberry32) ── */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  /* ── 10의 보수 (표준 산술) ── */
  function complement(n)    { return BASE - n; }   // 10을 채우는 나머지
  function partnerToTen(n)  { return BASE - n; }   // "n과 얼마를 만나면 10?"

  /* ── 십진 분해 ── */
  function toTensOnes(n) { return { tens: Math.floor(n / BASE), ones: n % BASE }; }

  /* ── 10 가르기 짝 (모으기/가르기) ── */
  function pairsOfTen(withEdges) {
    const out = [], lo = withEdges ? 0 : 1, hi = withEdges ? BASE : BASE - 1;
    for (let i = lo; i <= hi; i++) out.push([i, BASE - i]);
    return out;                                    // false: [1,9]…[9,1] · true: [0,10]…[10,0]
  }

  /* ── ★자석 덧셈(받아올림) — a를 10으로 채우는 만큼 b에서 뜯어 붙임 ── */
  function magnetAdd(a, b) {
    a = a | 0; b = b | 0;
    const sum = a + b;
    const carried = sum >= BASE && a < BASE;
    const t = Math.floor(sum / BASE), o = sum % BASE;
    let need = 0, fromB = 0, left = b;
    if (carried) {
      need = BASE - a;                 // a를 10으로 채우는 데 필요한 양(=complement)
      fromB = Math.min(need, b);       // b에서 자석처럼 뜯기는 양
      left = b - fromB;                // 남은 일의 자리
    }
    return { a: a, b: b, sum: sum, carried: carried, tens: t, ones: o, need: need, fromB: fromB, left: left };
  }

  /* ── ★자석 뺄셈(받아내림) — 일의 자리 부족하면 10 덩어리를 갈라서 뺌 ── */
  function magnetSub(a, b) {
    a = a | 0; b = b | 0;
    const diff = a - b;
    const ones = a % BASE;
    const borrowed = a >= BASE && ones < b && a >= b;
    let fromTen = 0, keep = 0;
    if (borrowed) {
      fromTen = BASE - b;              // 갈라진 10에서 b를 뺀 나머지
      keep = ones;                     // 원래 일의 자리
      // diff = fromTen + keep
    }
    return { a: a, b: b, diff: diff, borrowed: borrowed, ones: ones, fromTen: fromTen, keep: keep };
  }

  /* ── 결정론 문제 생성 (표준 범위 보장) ── */
  function genAddCarry(rng) {          // a,b 한 자리, a+b ∈ [11..18], 받아올림 보장
    const a = 2 + Math.floor(rng() * 8);                 // 2..9
    const bMin = Math.max(2, BASE + 1 - a);              // a+b>=11
    const b = bMin + Math.floor(rng() * (9 - bMin + 1)); // bMin..9
    return { a: a, b: b, answer: a + b };
  }
  function genSubBorrow(rng) {         // a ∈ [11..18], b 한 자리, a%10<b (받아내림 보장)
    const ones = 1 + Math.floor(rng() * 8);              // 1..8
    const a = BASE + ones;                               // 11..18
    const b = (ones + 1) + Math.floor(rng() * (9 - (ones + 1) + 1)); // ones+1..9
    return { a: a, b: b, answer: a - b };
  }
  function genMakeTen(rng) {           // 10 만들기 짝(한 조각 가리기)
    const a = 1 + Math.floor(rng() * 9);                 // 1..9
    return { a: a, partner: BASE - a, answer: BASE };
  }

  /* ── 방·시나리오 스키마 (P3에서 소비) ── */
  const SCENARIOS = {
    'N-1': { title: '10 만들기', desc: '두 수를 만나게 해서 딱 10을 만들어요',       mode: 'make10' },
    'N-2': { title: '받아올림',  desc: '10을 넘는 더하기 — 10의 자석으로 채워요',    mode: 'addcarry', wow: true },
    'N-3': { title: '받아내림',  desc: '10 덩어리를 갈라서 빼요',                      mode: 'subborrow' }
  };
  // ★와우: 10의 자석(보수만큼 뜯겨 붙어 받아올림)
  const WOW_MAGNET = {
    q: '7 옆에 5를 가져가면 어떻게 될까요?',
    options: ['5에서 3이 뜯겨 7에 붙어 10이 돼요', '그냥 나란히 놓여요', '5가 7을 밀어내요'],
    answer: 0,
    explain: '한 수를 10으로 채우려면 부족한 만큼(10의 보수)이 옆 수에서 자석처럼 뜯겨 붙어요. 그래서 10 하나와 나머지가 남아요 — 이게 받아올림이에요.'
  };

  return {
    // 상수
    BASE, N_MIN, N_MAX,
    // 유틸
    mulberry32, clamp,
    // 보수·분해·짝
    complement, partnerToTen, toTensOnes, pairsOfTen,
    // 자석 연산
    magnetAdd, magnetSub,
    // 문제 생성
    genAddCarry, genSubBorrow, genMakeTen,
    // 스키마
    SCENARIOS, WOW_MAGNET
  };
});
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     P2 렌더 어댑터 — 2D canvas 수 블록(텐프레임 자석). 순수 KNumber 조회만(연산 0줄).
     블록 = 조각(unit) 묶음을 텐프레임(2×5)에 담은 물리 덩어리. 잡으면 출렁.
     더하기: magnetAdd.need만큼 B에서 fromB 조각이 뜯겨 A 빈 칸으로 날아가 철컥 → 10 완성(쨍) + left 남음.
     빼기: magnetSub — 십몇의 10 막대가 fromTen으로 와그작 갈라져 빠짐(받아내림).
     운명의 방 P2 패턴(2D canvas + window.__NUMBER_P2__ 훅 + instant 경로) 승계. ═══ -->
<script>
(function(){
  'use strict';
  var K = window.KNumber;
  var C = { ink:'#eef0ff', sub:'#9aa0c8', block:'#ffd166', block2:'#f59e2c',
            bell:'#7c8cff', ten:'#5ad1a0', ten2:'#39a97e', slot:'rgba(255,255,255,.14)',
            line:'rgba(255,255,255,.10)' };

  var stage = document.getElementById('stage');
  var cv = document.createElement('canvas'); cv.id = 'board'; stage.appendChild(cv);
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, geo = {};

  // ── 상태 ──
  var mode = 'add';                 // 'add' | 'sub'
  var curA = 7, curB = 5;           // 현재 두 수
  var madeTens = 0, recipe = [];    // 만든 10 개수 · 레시피 노트(조합 기록)
  var lastResult = null;            // 마지막 magnetAdd/Sub 반환
  var soundOn = true;
  var busy = false, looping = false;

  // 렌더 모델: A(왼쪽 텐프레임) · B(오른쪽 무리) · flyer(이동 조각) · phase
  var A = { tens:0, ones:0 };       // A 블록: 십의 자리 막대 수 + 일의 자리 조각
  var B = 0;                        // B 블록 남은 조각
  var flyers = [];                  // {x,y, tx,ty, seg, t, kind:'unit'|'gone', slot}
  var phase = 'idle';               // idle|approach|magnet|split|complete|done
  var phT = 0, approach = 0, flash = 0, bob = 0, grabbed = false;

  // ── 레이아웃 ──
  function layout(){
    var cx = W/2, cy = H*0.46;
    var unit = K.clamp(Math.min(W,H)*0.052, 20, 46);   // 조각 한 칸 크기
    geo.unit = unit; geo.gap = unit*0.16;
    geo.cellW = unit + geo.gap;
    geo.cy = cy;
    geo.frameW = geo.cellW*5;                          // 텐프레임 5열
    geo.frameH = geo.cellW*2;                          // 2행
    geo.aX = cx - geo.frameW - unit*1.4;               // A 프레임 좌상단 x
    geo.aY = cy - geo.frameH/2;
    geo.bX = cx + unit*1.4;                            // B 무리 좌상단 x
    geo.bY = cy - geo.frameH/2;
  }
  // 텐프레임 슬롯 중심 (idx 0..9 → 2행5열)
  function slotXY(idx){
    var r = Math.floor(idx/5), c = idx%5;
    return { x: geo.aX + (c+0.5)*geo.cellW, y: geo.aY + (r+0.5)*geo.cellW };
  }
  // B 무리 조각 중심 (idx 0..)
  function bXY(idx){
    var r = Math.floor(idx/5), c = idx%5;
    return { x: geo.bX + (c+0.5)*geo.cellW, y: geo.bY + (r+0.5)*geo.cellW };
  }

  // ── 렌더 ──
  function draw(){
    if (!ctx) return;
    ctx.clearRect(0,0,W,H);
    drawSign();
    drawTenBars();       // A의 십의 자리(완성 10 막대)
    drawFrame();         // A 텐프레임 + 일의 조각
    drawB();             // B 무리
    drawFlyers();        // 이동 중 조각
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
  }
  function unitTile(x,y,c1,c2){
    var u = geo.unit, s = u*0.82, o = -s/2;
    var g = ctx.createLinearGradient(0, y+o, 0, y+o+s);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; rr(x+o, y+o, s, s, s*0.28); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x+o+s*0.16, y+o+s*0.12, s*0.5, s*0.22, s*0.11); ctx.fill();
  }
  function drawFrame(){
    // 텐프레임 슬롯 10칸(점선 느낌)
    ctx.strokeStyle = C.slot; ctx.lineWidth = 1.5;
    for (var i=0;i<10;i++){ var p = slotXY(i), u=geo.unit*0.82;
      rr(p.x-u/2, p.y-u/2, u, u, u*0.28); ctx.stroke(); }
    // 프레임 외곽
    ctx.strokeStyle = C.line; ctx.lineWidth = 2;
    rr(geo.aX+2, geo.aY+2, geo.frameW-4, geo.frameH-4, 12); ctx.stroke();
    // 일의 자리 조각(A.ones개) 채움 + 완성 플래시
    var bobY = grabbed ? Math.sin(bob)*3 : 0;
    for (var k=0;k<A.ones;k++){ var q = slotXY(k); unitTile(q.x, q.y+bobY, C.block, C.block2); }
    if (flash > 0){
      ctx.save(); ctx.globalAlpha = flash*0.5; ctx.fillStyle = C.ten;
      rr(geo.aX, geo.aY, geo.frameW, geo.frameH, 12); ctx.fill(); ctx.restore();
    }
  }
  function drawTenBars(){
    // 완성한 10 = 초록 꽉 찬 텐프레임을 A 위쪽에 막대로 적재
    for (var t=0;t<A.tens;t++){
      var bx = geo.aX, by = geo.aY - (t+1)*(geo.cellW*0.62) - 10;
      var g = ctx.createLinearGradient(0, by, 0, by+geo.cellW*0.5);
      g.addColorStop(0, C.ten); g.addColorStop(1, C.ten2);
      ctx.save(); ctx.shadowColor = C.ten; ctx.shadowBlur = 12; ctx.fillStyle = g;
      rr(bx, by, geo.frameW, geo.cellW*0.5, 9); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#0a1a12'; ctx.font = "700 "+Math.round(geo.unit*0.62)+"px 'Jua',sans-serif";
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('10', bx+geo.frameW/2, by+geo.cellW*0.25);
    }
  }
  function drawB(){
    var ax = phase==='approach' ? -approach*(geo.bX-(geo.aX+geo.frameW+geo.unit)) : 0;
    var bobY = 0;
    for (var k=0;k<B;k++){ var p = bXY(k); unitTile(p.x-ax, p.y+bobY, C.block, C.block2); }
  }
  function drawFlyers(){
    for (var i=0;i<flyers.length;i++){ var f = flyers[i];
      if (f.kind==='gone'){ ctx.save(); ctx.globalAlpha = 1-f.t; unitTile(f.x, f.y, '#c9ccea', '#8f93c0'); ctx.restore(); }
      else unitTile(f.x, f.y, '#fff4cf', C.block2);
    }
  }
  function drawSign(){
    ctx.fillStyle = C.sub; ctx.font = "700 "+Math.round(geo.unit*0.9)+"px 'Jua',sans-serif";
    ctx.textAlign='center'; ctx.textBaseline='middle';
    var op = mode==='add' ? '＋' : '－';
    ctx.fillText(op, W/2, geo.cy);
    // 식 라벨(하단)
    ctx.fillStyle = C.ink; ctx.font = "700 "+Math.round(geo.unit*0.72)+"px 'Jua',sans-serif";
    var eq = mode==='add' ? (curA+' + '+curB) : (curA+' − '+curB);
    if (phase==='done' && lastResult){ eq += ' = ' + (mode==='add'? lastResult.sum : lastResult.diff); }
    ctx.fillText(eq, W/2, geo.aY + geo.frameH + geo.unit*1.1);
  }

  // ── 루프 ──
  function raf(fn){ (window.requestAnimationFrame || function(f){ return setTimeout(f,16); })(fn); }
  function ensureLoop(){ if (!looping){ looping = true; raf(frame); } }
  function frame(){
    var alive = step();
    if (grabbed) bob += 0.25;
    if (flash > 0) flash = Math.max(0, flash - 0.06);
    draw();
    if (alive || flash > 0 || grabbed){ raf(frame); } else { looping = false; }
  }

  // ── 결합 애니 상태 머신 ──
  var plan = null;   // {order:[{slot, srcIdx}], leftAfter, tensAfter, onesAfter, splitGone}
  function step(){
    if (phase==='idle' || phase==='done') return false;
    phT += 0.045;
    if (phase==='approach'){
      approach = ease(phT);
      if (phT >= 1){ phT = 0; approach = 1;
        if (mode==='add') beginMagnet(); else beginSub();
      }
      return true;
    }
    if (phase==='magnet' || phase==='split'){
      var allDone = true;
      for (var i=0;i<flyers.length;i++){ var f = flyers[i];
        if (f.arrived) continue;
        f.t += 0.09;
        var e = f.t>1?1:f.t, ey = e*e*(3-2*e);
        var lift = Math.sin(e*Math.PI) * geo.unit * 0.9;
        f.x = f.sx + (f.tx-f.sx)*e;
        f.y = f.sy + (f.ty-f.sy)*ey - (f.kind==='unit'?lift:0);
        if (f.t >= 1){ f.arrived = true; f.x=f.tx; f.y=f.ty;
          if (f.kind==='unit'){ A.ones++; clack(); } else { clack(); }
        } else allDone = false;
      }
      if (allDone){ finishCombine(); }
      return true;
    }
    return false;
  }
  function ease(t){ return t<0?0:t>1?1:(t*t*(3-2*t)); }

  function beginMagnet(){
    phase = 'magnet'; phT = 0; flyers = [];
    var r = lastResult;                         // magnetAdd 결과(조회만)
    // 받아올림이면 need(=fromB)개, 무올림이면 b개 전부가 A 빈 슬롯으로 날아감
    var movers = r.carried ? r.fromB : curB;
    for (var i=0;i<movers;i++){
      var src = bXY(B-1-i), dst = slotXY(A.ones + i);
      flyers.push({ kind:'unit', sx:src.x, sy:src.y, x:src.x, y:src.y, tx:dst.x, ty:dst.y, t:0, arrived:false });
    }
    B -= movers;                                // B 무리에서 빠짐(받아올림=left 남음, 무올림=0)
    if (movers === 0){ finishCombine(); }
  }
  function beginSub(){
    var r = lastResult;                         // magnetSub 결과(조회만)
    if (!r.borrowed){
      // 무빌림: 일의 자리에서 b개가 그냥 빠져 아래로 사라짐
      phase = 'split'; phT = 0; flyers = [];
      for (var i=0;i<curB;i++){ var s = slotXY(A.ones-1-i);
        flyers.push({ kind:'gone', sx:s.x, sy:s.y, x:s.x, y:s.y, tx:s.x, ty:s.y+geo.unit*2.4, t:0, arrived:false }); }
      A.ones -= curB;   // 빠지는 조각은 flyer 잔상으로만
      return;
    }
    // 받아내림: 10 막대 하나가 와그작 갈라져 조각 10개로 펼쳐짐 → b개 아래로 사라짐(fromTen 남음)
    phase = 'split'; phT = 0; flyers = []; flash = 0.75;
    A.tens -= 1;                                 // 막대 하나 소모(갈라짐)
    A.ones = K.BASE;                             // 갈라진 10을 프레임에 펼침(원래 keep은 finish에서 재구성)
    for (var j=0;j<curB;j++){ var g = slotXY(K.BASE-1-j);
      flyers.push({ kind:'gone', sx:g.x, sy:g.y, x:g.x, y:g.y, tx:g.x, ty:g.y+geo.unit*2.4, t:0, arrived:false }); }
  }
  function finishCombine(){
    var r = lastResult;
    if (mode==='add'){
      if (r.carried){ A.tens = r.tens; A.ones = 0; /* B=left 이미 반영 */ madeTens += 1; flash = 1; complete(); }
      else { A.tens = 0; A.ones = r.ones; B = 0; }
    } else {
      var d = K.toTensOnes(r.diff);              // 조회만 — 남은 diff 재구성
      A.tens = d.tens; A.ones = d.ones; B = 0;
      chime();
    }
    recipe.push({ mode:mode, a:curA, b:curB, result:(mode==='add'?r.sum:r.diff), carried:!!r.carried, borrowed:!!r.borrowed });
    phase = 'done'; flyers = []; busy = false; updHud();
    tip(mode==='add'
      ? (r.carried ? '철컥! '+curA+'을(를) 10으로 채우려고 '+curB+'에서 '+r.fromB+'이 뜯겨 붙었어요. 10 하나와 '+r.left+'이 남아요.'
                   : curA+'과 '+curB+'을 모아도 아직 10이 안 됐어요. 프레임이 다 안 찼죠?')
      : (r.borrowed ? '10 덩어리가 갈라졌어요! 거기서 '+curB+'을 빼고 '+r.fromTen+'이 남아 '+r.diff+'이 됐어요.'
                    : '일의 자리에서 바로 '+curB+'을 뺐어요. '+r.diff+'이 남아요.'));
  }

  // ── 조작 API ──
  function newProblem(){
    if (mode==='add'){ curA = 1 + irnd(9); curB = 1 + irnd(9); }
    else { curA = K.BASE + 1 + irnd(7); curB = 1 + irnd(9); if (curB > (curA-K.BASE)) {} }
    setupBlocks();
  }
  function irnd(n){ return Math.floor(Math.random()*n); }   // [0..n-1]
  function setupBlocks(){
    lastResult = null; flyers = []; phase='idle'; phT=0; approach=0; flash=0; busy=false;
    if (mode==='add'){ A.tens = 0; A.ones = curA; B = curB; }
    else { var d = K.toTensOnes(curA); A.tens = d.tens; A.ones = d.ones; B = 0; }  // 빼기: A만 십몇, B는 빼는 수(무리 아님)
    draw(); updHud();
    tip(mode==='add' ? '두 블록을 만나게 해서 10을 만들어 봐요.' : curA+'에서 '+curB+'을 빼 볼까요? 일의 자리가 모자라면?');
  }
  function spawn(a, b, m){
    if (m) mode = (m==='sub'?'sub':'add');
    curA = a|0; curB = b|0; setupBlocks(); syncBtns();
  }
  function combine(instant){
    if (busy || phase==='approach' || phase==='magnet' || phase==='split') return;
    // 순수 로직 조회 — 물리 규칙은 여기서만(P2는 산술 0줄)
    lastResult = (mode==='add') ? K.magnetAdd(curA, curB) : K.magnetSub(curA, curB);
    busy = true;
    if (instant){
      // 애니 스킵 즉시 정산 (finishCombine과 동일 규칙)
      if (mode==='add'){
        if (lastResult.carried){ A.tens = lastResult.tens; A.ones = 0; B = lastResult.left; madeTens += 1; }
        else { A.tens = 0; A.ones = lastResult.ones; B = 0; }
      } else {
        var d = K.toTensOnes(lastResult.diff); A.tens = d.tens; A.ones = d.ones; B = 0;
      }
      recipe.push({ mode:mode, a:curA, b:curB, result:(mode==='add'?lastResult.sum:lastResult.diff), carried:!!lastResult.carried, borrowed:!!lastResult.borrowed });
      phase='done'; busy=false; draw(); updHud(); return;
    }
    ensureAudio(); phase='approach'; phT=0; approach=0; ensureLoop();
  }
  function reset(){
    madeTens = 0; recipe = []; lastResult = null;
    setupBlocks();
  }
  function setMode(m){ mode = (m==='sub'?'sub':'add'); syncBtns(); newProblem(); }

  // ── HUD·팁 ──
  function updHud(){ setTxt('hTen', madeTens); setTxt('hRecipe', recipe.length); }
  function setTxt(id,v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  function tip(t){ var el = document.getElementById('tip'); if (el){ el.textContent = t; el.classList.remove('hide'); } }

  // ── 사운드(WebAudio 미니 신스 — 와우 표준 재사용) ──
  var actx=null, master=null, lastClack=0;
  function ensureAudio(){ if (actx) return;
    try { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC(); master = actx.createGain(); master.gain.value = 0.16; master.connect(actx.destination);
    } catch(e){ actx=null; } }
  function clack(){    // 철컥(짧은 클릭)
    if (!soundOn || !actx) return;
    var now = (window.performance&&performance.now)?performance.now():Date.now();
    if (now - lastClack < 32) return; lastClack = now;
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type='square'; o.frequency.value = 320 + Math.random()*120;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.08);
  }
  function complete(){ chime(); }
  function chime(){    // 완성 쨍(아르페지오)
    if (!soundOn || !actx) return;
    [523,659,784,1047].forEach(function(f,i){
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i*0.06;
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.55);
    });
  }

  // ── 버튼 배선 ──
  function syncBtns(){ tog('bAdd', mode==='add'); tog('bSub', mode==='sub'); }
  function tog(id,on){ var b = document.getElementById(id); if (b) b.classList[on?'add':'remove']('on'); }
  function on(id,fn){ var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function bind(){
    on('bNew', function(){ ensureAudio(); newProblem(); });
    on('bGo',  function(){ ensureAudio(); combine(false); });
    on('bAdd', function(){ setMode('add'); });
    on('bSub', function(){ setMode('sub'); });
    on('bReset', function(){ reset(); });
    on('sound', function(){ soundOn = !soundOn; var s = document.getElementById('sound'); if (s) s.textContent = soundOn?'🔊':'🔇'; });
    // 블록 잡기(출렁) — B 무리 근처 누르면 살짝 흔들림
    cv.addEventListener('pointerdown', function(){ grabbed = true; ensureLoop(); });
    window.addEventListener('pointerup', function(){ grabbed = false; });
  }

  // ── 초기화·리사이즈 ──
  function onResize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth || 1024; H = window.innerHeight || 768;
    cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px';
    if (ctx && ctx.setTransform) ctx.setTransform(DPR,0,0,DPR,0,0);
    layout(); draw();
  }
  function init(){
    onResize(); window.addEventListener('resize', onResize); bind(); syncBtns();
    var l = document.getElementById('loading'); if (l) l.classList.add('hide');
    // 딥링크 ?a=&b=&mode=
    try { var q = new URLSearchParams(location.search);
      if (q.get('mode')) mode = (q.get('mode')==='sub'?'sub':'add');
      if (q.get('a') || q.get('b')){ curA = parseInt(q.get('a')||curA,10); curB = parseInt(q.get('b')||curB,10); }
    } catch(e){}
    setupBlocks();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  // ── 훅(스모크·P3용) ──
  window.__NUMBER_P2__ = {
    get mode(){ return mode; }, get a(){ return curA; }, get b(){ return curB; },
    get madeTens(){ return madeTens; }, get recipeCount(){ return recipe.length; },
    get recipe(){ return recipe.slice(); }, get result(){ return lastResult; }, get busy(){ return busy; },
    get blocks(){ return { A:{ tens:A.tens, ones:A.ones, value:A.tens*K.BASE+A.ones }, B:B, mode:mode }; },
    get phase(){ return phase; },
    K: K, spawn: spawn, combine: combine, reset: reset, setMode: setMode
  };
})();
</script>

<!-- ═══ P3 미션 레이어 — 시나리오(N-1/N-2/N-3)·★와우 예측카드·10의 자석 창발·레시피 노트 렌즈·학년칸.
     __NUMBER_P2__ 훅만 소비(순수·P2 렌더 0줄 변경). DOM 오버레이만 추가. 운명의 방 p3-mission 패턴 승계. ═══ -->
<script id="number-p3">
(function(){
  'use strict';
  var H = window.__NUMBER_P2__;
  if (!H) return;
  var K = H.K;

  // ── 학년(?grade=low|mid|high, 저/중/고·1/2/3 허용) ──
  var grade = 'mid';
  try{
    var g = (new URLSearchParams(location.search).get('grade') || '').toLowerCase();
    if (g === 'low' || g === '저' || g === '1') grade = 'low';
    else if (g === 'high' || g === '고' || g === '3') grade = 'high';
  }catch(e){}

  var scene = 'N-2';          // N-1 10만들기 · N-2 받아올림★ · N-3 받아내림
  var seen = {};              // 방별 예측카드 시청 여부
  var lastPick = -1, lastAnswer = -1;
  var busy = false;
  var rng = K.mulberry32((Date.now() >>> 0) || 1);

  function raf(fn){ (window.requestAnimationFrame || function(f){ return setTimeout(f, 16); })(fn); }
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  // ── 스타일 주입(운명의 방 톤 승계) ──
  var css = el('style');
  css.textContent =
    '#p3-scene{position:fixed;top:88px;left:50%;transform:translateX(-50%);z-index:21;display:flex;gap:6px;' +
      'flex-wrap:wrap;justify-content:center;max-width:94vw}' +
    '.p3-pill{font-family:\'Jua\';font-size:12.5px;color:var(--sub);background:var(--panel);' +
      'border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;transition:.14s;backdrop-filter:blur(6px)}' +
    '.p3-pill:active{transform:scale(.94)}' +
    '.p3-pill.on{background:var(--bell);color:#0a0c18;border-color:var(--bell)}' +
    '#p3-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;' +
      'background:rgba(6,7,16,.72);backdrop-filter:blur(4px);padding:20px}' +
    '#p3-modal.show{display:flex}' +
    '.p3-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px;' +
      'max-width:400px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}' +
    '.p3-q{font-family:\'Jua\';font-size:17px;color:var(--ink);line-height:1.5;margin-bottom:16px}' +
    '.p3-opt{display:block;width:100%;font-family:\'Gowun Dodum\',sans-serif;font-size:14.5px;color:var(--ink);' +
      'background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:13px;padding:13px 14px;' +
      'margin:8px 0;cursor:pointer;transition:.14s;text-align:left}' +
    '.p3-opt:active{transform:scale(.98)}' +
    '.p3-opt:hover{background:rgba(124,140,255,.16);border-color:var(--bell)}' +
    '#p3-wow{position:fixed;top:120px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:40;' +
      'max-width:90vw;background:linear-gradient(135deg,rgba(124,140,255,.95),rgba(90,104,220,.95));color:#0a0c18;' +
      'border-radius:15px;padding:13px 18px;font-size:13.5px;line-height:1.55;box-shadow:0 16px 44px rgba(60,72,180,.5);' +
      'opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;text-align:center}' +
    '#p3-wow.show{opacity:1;transform:translateX(-50%) translateY(0)}' +
    '#p3-wow b{font-family:\'Jua\'}' +
    '#p3-recipe{position:fixed;top:120px;right:14px;z-index:22;background:var(--panel);border:1px solid var(--line);' +
      'border-radius:14px;padding:10px 13px;min-width:118px;max-width:40vw;box-shadow:0 10px 30px rgba(0,0,0,.4);' +
      'display:none}' +
    '#p3-recipe.show{display:block}' +
    '#p3-recipe .rt{font-family:\'Jua\';font-size:12px;color:var(--sub);margin-bottom:6px}' +
    '#p3-recipe .rl{font-family:\'Jua\';font-size:13.5px;color:var(--ink);line-height:1.65;max-height:38vh;overflow:auto}' +
    '#p3-recipe .rl .ok{color:var(--ten)}';
  document.head.appendChild(css);

  // ── 시나리오 배너 ──
  var SCN = [
    { id:'N-1', label:'🧲 10 만들기', mode:'add' },
    { id:'N-2', label:'➕ 받아올림 ★', mode:'add' },
    { id:'N-3', label:'➖ 받아내림', mode:'sub' }
  ];
  var scene_el = el('div'); scene_el.id = 'p3-scene';
  SCN.forEach(function(s){
    var p = el('button', 'p3-pill', s.label);
    p.setAttribute('data-scn', s.id);
    p.addEventListener('click', function(){ setScene(s.id); });
    scene_el.appendChild(p);
  });
  document.body.appendChild(scene_el);

  // ── 예측카드 모달 ──
  var modal = el('div'); modal.id = 'p3-modal';
  var card = el('div', 'p3-card');
  var qEl = el('div', 'p3-q', '');
  var optBox = el('div');
  card.appendChild(qEl); card.appendChild(optBox);
  modal.appendChild(card);
  modal.addEventListener('click', function(e){ if (e.target === modal) closeCard(); });
  document.body.appendChild(modal);

  // ── 창발 배너 + 레시피 노트 ──
  var wow = el('div'); wow.id = 'p3-wow'; document.body.appendChild(wow);
  var wowTimer = null;
  var recipeEl = el('div'); recipeEl.id = 'p3-recipe';
  recipeEl.innerHTML = '<div class="rt">📒 레시피 노트</div><div class="rl" id="p3-rl"></div>';
  document.body.appendChild(recipeEl);

  // ── 방별 문제 생성(결정론 rng) ──
  function newSceneProblem(){
    var q;
    if (scene === 'N-1'){ q = K.genMakeTen(rng); H.spawn(q.a, q.partner, 'add'); }
    else if (scene === 'N-2'){ q = K.genAddCarry(rng); H.spawn(q.a, q.b, 'add'); }
    else { q = K.genSubBorrow(rng); H.spawn(q.a, q.b, 'sub'); }
  }

  // ── 예측카드 데이터(방별 동적) ──
  function cardFor(){
    if (scene === 'N-2') return { q: K.WOW_MAGNET.q, options: K.WOW_MAGNET.options.slice(), answer: K.WOW_MAGNET.answer };
    if (scene === 'N-1'){
      var a = H.a, partner = K.partnerToTen(a);                 // 조회만
      var opts = [partner, K.clamp(partner + 1, 0, 10), K.clamp(partner - 1, 0, 10)];
      // 중복 제거 후 셔플
      var uniq = []; opts.forEach(function(v){ if (uniq.indexOf(v) < 0) uniq.push(v); });
      while (uniq.length < 3){ var c = 1 + Math.floor(rng() * 9); if (uniq.indexOf(c) < 0) uniq.push(c); }
      for (var i = uniq.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = uniq[i]; uniq[i] = uniq[j]; uniq[j] = t; }
      return { q: a + '과(와) 얼마를 만나야 딱 10이 될까요?', options: uniq.map(function(v){ return v + ''; }), answer: uniq.indexOf(partner) };
    }
    // N-3
    return { q: H.a + '에서 ' + H.b + '을(를) 빼려는데 일의 자리가 모자라요. 어떻게 할까요?',
      options: ['10 덩어리를 갈라서 거기서 빼요', '그냥 뺄 수 없어요', '더 큰 수로 바꿔요'], answer: 0 };
  }
  function openCard(){
    var c = cardFor(); lastAnswer = c.answer;
    qEl.innerHTML = c.q; optBox.innerHTML = '';
    c.options.forEach(function(opt, i){
      var b = el('button', 'p3-opt', opt);
      b.addEventListener('click', function(){ pick(i); });
      optBox.appendChild(b);
    });
    modal.classList.add('show');
  }
  function closeCard(){ modal.classList.remove('show'); }
  function pick(i, instant){ lastPick = i; seen[scene] = true; closeCard(); runCombine(!!instant); }

  // ── 결합 실행 + 완료 감지 ──
  function combineIntent(){
    if (busy) return;
    if (!seen[scene]){ openCard(); return; }     // 첫 만남 = 예측카드 먼저
    runCombine(false);
  }
  function runCombine(instant){
    if (busy) return; busy = true; hideWow();
    if (instant){ H.combine(true); busy = false; onComplete(); return; }
    H.combine(false);
    var guard = 0;
    (function poll(){
      guard++;
      if ((!H.busy && H.phase === 'done') || guard > 3000){ busy = false; onComplete(); return; }
      raf(poll);
    })();
  }
  function onComplete(){ showWow(); renderRecipe(); }

  // ── ★와우: 방별 창발 연출(H.result 조회) ──
  function showWow(){
    var r = H.result; if (!r) return;
    var head, body;
    if (scene === 'N-3'){
      if (r.borrowed){
        head = (lastPick === 0 ? '🎯 맞혔어요! ' : '🎯 ') + '10 덩어리가 갈라졌어요';
        body = (grade === 'low')
          ? '10을 열 개로 갈라서 거기서 <b>' + H.b + '</b>을 뺐어요!'
          : '일의 자리가 모자라면 10 덩어리 하나를 갈라(' + r.fromTen + ' 남김) 거기서 빼요 — 이게 <b>받아내림</b>이에요.';
      } else { head = '➖ 일의 자리에서 바로 뺐어요'; body = H.a + ' − ' + H.b + ' = <b>' + r.diff + '</b>. 10을 가를 필요가 없었죠.'; }
      flashWow('<b>' + head + '</b><br>' + body, 6500); return;
    }
    // N-1 · N-2 (더하기)
    if (r.carried){
      var hit = (scene === 'N-2' ? lastPick === K.WOW_MAGNET.answer : lastPick === lastAnswer);
      head = (hit ? '🧲 맞혔어요! ' : '🧲 ') + (r.sum === 10 ? '딱 10을 만들었어요' : '10 하나를 만들었어요');
      body = (grade === 'low')
        ? '부족한 만큼이 자석처럼 뜯겨 붙어 <b>10</b>이 됐어요' + (r.left ? '. 그리고 ' + r.left + '이 남았어요!' : '!')
        : (scene === 'N-2' ? K.WOW_MAGNET.explain
           : H.a + '과 ' + K.partnerToTen(H.a) + '은 10의 단짝이에요 — 자석처럼 붙어 딱 10!');
    } else {
      head = '➕ 아직 10이 안 됐어요';
      body = H.a + '과 ' + H.b + '을 모아도 프레임이 다 안 찼어요. 두 수의 합이 10보다 작으면 자석이 안 생겨요.';
    }
    flashWow('<b>' + head + '</b><br>' + body, 6500);
  }
  function flashWow(html, ms){
    wow.innerHTML = html; wow.classList.add('show');
    if (wowTimer) clearTimeout(wowTimer);
    wowTimer = setTimeout(function(){ wow.classList.remove('show'); }, ms || 5000);
  }
  function hideWow(){ wow.classList.remove('show'); if (wowTimer) clearTimeout(wowTimer); }

  // ── 레시피 노트(데이터 렌즈) — recipe 배열 누적. 서열·비교 노출 없음(헌법). ──
  function renderRecipe(){
    var rec = H.recipe; if (!rec || !rec.length){ recipeEl.classList.remove('show'); return; }
    var rl = $('p3-rl'); if (!rl) return;
    var html = '';
    var start = Math.max(0, rec.length - 8);          // 최근 8개
    for (var i = start; i < rec.length; i++){
      var e = rec[i], op = e.mode === 'add' ? '+' : '−';
      var made10 = (e.mode === 'add' && e.carried);
      html += '<div' + (made10 ? ' class="ok"' : '') + '>' + e.a + ' ' + op + ' ' + e.b + ' = ' + e.result + (made10 ? ' ✓' : '') + '</div>';
    }
    rl.innerHTML = html; recipeEl.classList.add('show');
  }

  // ── 시나리오 전환 ──
  function setScene(s){
    scene = s; hideWow();
    var pills = scene_el.querySelectorAll('.p3-pill');
    for (var i = 0; i < pills.length; i++)
      pills[i].classList.toggle('on', pills[i].getAttribute('data-scn') === s);
    newSceneProblem();
    var e = $('tip');
    if (e){
      e.textContent = s === 'N-1' ? '🧲 두 블록을 만나게 해서 딱 10을 만들어 봐요. 얼마를 만나야 할까요?'
        : s === 'N-2' ? (grade === 'high' ? '➕ 옆에 가져가면 어떻게 될지 먼저 예상하고 🧲로 확인해요!' : '➕ 두 수를 만나게 하면 10이 어떻게 만들어질까요? 🧲!')
        : '➖ 일의 자리가 모자라면 10을 어떻게 할까요? 먼저 예상하고 🧲로 확인해요!';
      e.classList.remove('hide');
    }
  }

  // ── bGo/bNew 인터셉트(캡처) ──
  var bgo = $('bGo');
  if (bgo) bgo.addEventListener('click', function(e){
    e.stopImmediatePropagation(); if (e.preventDefault) e.preventDefault();
    combineIntent();
  }, true);
  var bnew = $('bNew');
  if (bnew) bnew.addEventListener('click', function(e){
    e.stopImmediatePropagation(); if (e.preventDefault) e.preventDefault();
    hideWow(); newSceneProblem();
  }, true);

  // ── 초기 진입 ──
  function boot(){
    try{
      var qs = new URLSearchParams(location.search);
      var sc = (qs.get('scenario') || qs.get('scene') || '').toUpperCase();
      if (sc === 'N-1' || sc === 'N-2' || sc === 'N-3'){ setScene(sc); return; }
    }catch(e){}
    setScene(grade === 'low' ? 'N-1' : grade === 'high' ? 'N-3' : 'N-2');
  }
  boot();

  // ── 훅(P3 스모크) ──
  window.__NUMBER_P3__ = {
    get scene(){ return scene; }, get grade(){ return grade; },
    get cardSeen(){ return !!seen[scene]; }, get lastPick(){ return lastPick; }, get lastAnswer(){ return lastAnswer; },
    get wowShown(){ return wow.classList.contains('show'); }, get recipeShown(){ return recipeEl.classList.contains('show'); },
    get recipeCount(){ return H.recipe.length; }, H: H,
    setScene: setScene, openCard: openCard, closeCard: closeCard, cardFor: cardFor,
    pick: pick, combineIntent: combineIntent, runCombine: runCombine, newSceneProblem: newSceneProblem
  };
})();
</script>

  흡수: v2 burn.js(컵 덮기 = 연소의 조건). SPEC_E5.md 기반. 유류 화재 ★와우는 페이블 증축 대기(2단 출시).
    · 미션: 초 2자루(작은 컵용·큰 컵용) → 촛불 켜기 → 컵 대·소 덮기
    · 현상: 컵 속 산소가 줄어 촛불이 꺼짐 — 작은 컵이 먼저(산소 적음), 큰 컵은 오래 탐
    · ★와우(중/고): 큰 컵이 왜 오래 탈까? — 산소가 더 많아서 (연소의 조건 = 탈물질·산소·발화점)
    · 관측 = 촛불 크기(산소 비례)·산소 게이지 (o2meter 설치 시)
  렌더 표준(데모 1호 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft · 유리=블렌딩 · 품질 자동

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 연소 시뮬 (SPEC_E5 A-2 — 컵 속 산소 소진. 작은 컵 먼저 꺼짐) ── */
  function createBurnSim(){
    // 인덱스 0 = 작은 컵 쪽 초, 1 = 큰 컵 쪽 초
    var S = { lit:false, o2:[100,100], covered:[false,false], out:[false,false], bothOut:false, flame:[0,0] };
    var RATE=[12.5, 5];    // %/s — 작은 컵 ≈8s · 큰 컵 ≈20s (v2 비율 2.5:1 유지)
    var OUT_FLICKER=15;    // o2 15% 아래 = 꺼지기 직전 흔들림 신호
    function ignite(){ S.lit=true; S.flame=[1,1]; S.out=[false,false]; }
    function cover(i){ if(!S.lit||S.out[i]) return false; S.covered[i]=true; return true; }
    function uncover(i){ S.covered[i]=false; }
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      if(!inp.ready || !S.lit) return S;   // ready 게이트 — 준비 전 진행 없음
      for(var i=0;i<2;i++){
        if(S.covered[i] && !S.out[i]){
          S.o2[i] -= RATE[i]*dt;
          if(S.o2[i]<=0){ S.o2[i]=0; S.out[i]=true; S.flame[i]=0; }
        }
        S.flame[i] = S.out[i] ? 0 : (S.covered[i] ? Math.max(0.25, S.o2[i]/100) : 1);
      }
      S.bothOut = S.out[0] && S.out[1];
      return S;
    }
    return { state:S, step:step, ignite:ignite, cover:cover, uncover:uncover, RATE:RATE, OUT_FLICKER:OUT_FLICKER };
  }

  /* ── 미션 정의 (SPEC_E5 A-1) ── */
  var MISSION_BURN = {
    id:'burn_cups',
    title:'연소의 조건 — 어느 컵이 먼저 꺼질까?',
    required:['candle','cup_s','cup_l','o2meter'],
    needs:{
      cup_s:  { pre:['candle'], msg:'컵으로 덮을 <b>촛불이 먼저</b> 있어야죠!' },
      cup_l:  { pre:['candle'], msg:'컵으로 덮을 <b>촛불이 먼저</b> 있어야죠!' },
      o2meter:{ pre:['candle'], msg:'산소 측정기는 <b>잴 대상(촛불)이 먼저</b>!' }
    },
    wrong:{
      magnet:'🧲 자석은 철을 끌어당기는 도구 — 불과 산소 실험에는 필요 없어요.',
      thermo:'🌡️ 온도계는 온도를 잴 때 — 오늘 지켜볼 것은 <b>산소</b>예요!',
      rod:'🥢 유리막대는 저을 때 쓰는 기구 — 촛불은 젓지 않아요!',
      beaker_w:'💧 물 비커는 <b>소화</b> 실험에서 만나요! 오늘은 산소가 줄어드는 걸 관찰해요.'
    }
  };

  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  /* ── 유류 화염 시뮬 (SPEC_E5 A-8 — 2막 ★와우: 물→확산, 덮기/모래/소화기→소화) ── */
  /* 안전 프레임: 물은 위험 시연(확 번짐), 올바른 소화(덮기·모래·소화기)로만 out. */
  function createOilFireSim(){
    // spread 0~1 = 불꽃 확산 정도. wateredFirst = 물을 먼저 뿌린 위험 시연 여부.
    var S = { lit:false, flareUp:false, doused:false, out:false, spread:0, method:null, wateredFirst:false };
    var SPREAD_RATE=2.4;   // 물 투입 순간 확산 (spread 0→1 ≈0.42s = 확 번짐)
    var DOUSE_RATE=1.6;    // 올바른 소화 시 잦아듦 (spread 1→0 ≈0.63s)
    function ignite(){ S.lit=true; S.out=false; S.spread=0; S.flareUp=false; S.doused=false; S.method=null; S.wateredFirst=false; }
    function apply(method){
      if(!S.lit || S.out) return { ok:false };
      if(method==='water'){
        if(S.doused) return { ok:false };          // 이미 소화 진행 중이면 물 무시
        if(!S.flareUp) S.wateredFirst=true;         // 처음 뿌린 물 = 위험 시연
        S.flareUp=true; S.method='water';
        return { ok:true, effect:'flare' };
      }
      // lid | sand | extinguisher = 올바른 소화
      S.doused=true; S.method=method;
      return { ok:true, effect:'douse' };
    }
    function step(dt){
      if(dt>0.05) dt=0.05;
      if(!S.lit || S.out) return S;
      if(S.doused){
        S.spread -= DOUSE_RATE*dt;
        if(S.spread<=0){ S.spread=0; S.out=true; }
      } else if(S.flareUp){
        S.spread += SPREAD_RATE*dt;
        if(S.spread>1) S.spread=1;
      }
      return S;
    }
    return { state:S, step:step, ignite:ignite, apply:apply, SPREAD_RATE:SPREAD_RATE, DOUSE_RATE:DOUSE_RATE };
  }

  /* ── 유류 화재 미션 (SPEC_E5 A-8) — pan_oil만 필수 배치, 소화 도구는 '행동' ── */
  var MISSION_OILFIRE = {
    id:'burn_oilfire',
    title:'유류 화재 — 기름 불엔 물을 쓰면 안 돼요',
    required:['pan_oil'],
    needs:{},
    wrong:{}
  };

  var API = { createBurnSim:createBurnSim, MISSION_BURN:MISSION_BURN, createMissionRun:createMissionRun,
              createOilFireSim:createOilFireSim, MISSION_OILFIRE:MISSION_OILFIRE };
  if(typeof window!=='undefined'){ window.SciLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════ 렌더 기반 (데모 1호 확정 표준) ═════════ */
const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2b3340'); gr.addColorStop(.55,'#1b2129'); gr.addColorStop(1,'#12161c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}

function flameTexture(inner,outer){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,78,4,64,64,60);
  gr.addColorStop(0,inner); gr.addColorStop(.45,outer); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const FLAME_OUT_TEX=flameTexture('rgba(255,244,200,1)','rgba(255,150,40,0.85)');
const FLAME_IN_TEX =flameTexture('rgba(190,230,255,1)','rgba(70,140,255,0.7)');

let candleFlame=[];   // [{outer, inner, light, baseY}]
{
  const gp = new THREE.Group();
  for(let i=0;i<2;i++){
    const x=CANDLE_X[i];
    const wax=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.013,CANDLE_H,20),
      new THREE.MeshStandardMaterial({color:0xF3EDE0, roughness:0.75}));
    wax.position.set(x, CANDLE_H/2, 0); wax.castShadow=true; gp.add(wax);
    const wick=new THREE.Mesh(new THREE.CylinderGeometry(0.0013,0.0013,0.012,8),
      new THREE.MeshStandardMaterial({color:0x222222, roughness:1}));
    wick.position.set(x, CANDLE_H+0.005, 0); gp.add(wick);
    // 불꽃
    const fy=CANDLE_H+0.022;
    const outer=new THREE.Sprite(new THREE.SpriteMaterial({map:FLAME_OUT_TEX,
      blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
    const inner=new THREE.Sprite(new THREE.SpriteMaterial({map:FLAME_IN_TEX,
      blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
    outer.position.set(x, fy+0.006, 0); inner.position.set(x, fy-0.004, 0);
    outer.visible=inner.visible=false;
    gp.add(outer, inner);
    const light=new THREE.PointLight(0xFFA640, 0, 0.9, 2);
    light.position.set(x, fy, 0); gp.add(light);
    candleFlame.push({outer, inner, light, x, fy});

  gp.position.set(0, BENCH_Y, -0.02);
  RIG.add(gp); registerEq('candle', gp);
}

function onPick(id, cardEl){

    if(id==='cup_s'){ sim.uncover(0); EQ_OBJ.cup_s.userData.covered=false; }
    if(id==='cup_l'){ sim.uncover(1); EQ_OBJ.cup_l.userData.covered=false; }
    run.remove(id);
    Object.keys(EQ_OBJ).forEach(k=>{ if(!run.placed[k]) EQ_OBJ[k].visible=false; });
    syncTray(); renderProg(); updateFireBtn(); updateO2HUD();
    return;
  }
  const r=run.pick(id, freeMode);
  if(r.act==='wrong' || r.act==='blocked'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, r.act==='wrong'?4200:3800);
    return;
  }
  if(r.act==='placed'){
    const o=EQ_OBJ[id];
    if(o.userData.free){ const [x,z]=nextSpot(); o.position.x=x; o.position.z=z; }
    dropIn(id);

const predictOilEl=$('predictOil');

function onPickOil(id, cardEl){
  if(oilSucceeded) return;

    if(oilRun.placed.pan_oil) return;

      setTimeout(()=>{ predictOilEl.classList.remove('hide');
        toast('🔥 기름에 불이 붙었어요! 어떻게 꺼야 할까요?'); }, 500);

  // 소화 도구·물 = 행동 (냄비 선행 필수, C-3)

    return;

  } else {
    if(id==='lid' && oilLidGroup){ oilLidGroup.visible=true; oilLidGroup.userData.covering=true; }

let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++;
  if(qualityChecked) return;
  if(now-fpsStart>4000){
    qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){
      renderer.setPixelRatio(1);
      sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
      sun.shadow.radius=3;
    }
  }
}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  // ═══ 유류 화재편(2막) 렌더 — SPEC_E5 A-8 ═══
  if(stage==='oil'){
    if(oilSim){
      const S=oilSim.step(dt);
      const pulse=1+0.12*Math.sin(t*24)+0.07*Math.sin(t*53+1.4);
      // 중앙 불꽃 (확산되면 살짝 작아짐)
      if(oilCenterFlame){
        const on=S.lit && !S.out;
        oilCenterFlame.visible=on;
        if(on){
          const cs=(1-S.spread*0.25)*pulse;
          oilCenterFlame.scale.set(0.06*cs, 0.11*cs, 1);
        }
      }
      // 확산 불꽃 배열 (물 투입 → 방사)
      oilFlames.forEach(f=>{
        const vis=S.spread>0.02 && !S.out;
        f.sprite.visible=vis;
        if(vis){
          const r=0.115*S.spread;
          const jit=1+0.15*Math.sin(t*30+f.angle*3);
          f.sprite.position.set(PAN_X+Math.cos(f.angle)*r, BENCH_Y+0.045+0.02*jit, PAN_Z+Math.sin(f.angle)*r);
          const sc=(0.6+1.9*S.spread)*pulse*jit;
          f.sprite.scale.set(0.045*sc, 0.08*sc, 1);
          f.sprite.material.opacity=Math.min(1, S.spread*1.6);
        }
      });
      // 붉은 화염 라이트
      if(oilLight) oilLight.intensity=(S.lit && !S.out) ? (1.3+2.6*S.spread)*pulse : 0;
      // 뚜껑 하강 트윈 (덮기)
      if(oilLidGroup && oilLidGroup.userData.covering){
        const tgt=oilLidGroup.userData.coverY;
        oilLidGroup.position.y += (tgt-oilLidGroup.position.y)*Math.min(dt*5,1);
      }
      // 연기 (소화 진행 = doused 시 위로 페이드)
      const smoking=S.doused && S.lit;
      oilSmoke.forEach(s=>{
        if(smoking){
          s.sprite.visible=true;
          const life=(t*0.5+s.off)%1;
          s.sprite.position.set(PAN_X+0.03*Math.sin(s.off+t), BENCH_Y+0.09+life*0.34, PAN_Z+0.03*Math.cos(s.off+t*1.1));
          const sc=0.06+life*0.14; s.sprite.scale.set(sc,sc,1);
          s.sprite.material.opacity=Math.max(0,1-life)*0.55;
        } else if(!smoking && s.sprite.visible && S.out){
          s.sprite.material.opacity*=0.94;
          if(s.sprite.material.opacity<0.02) s.sprite.visible=false;
        }
      });
      // 상태줄
      let st='';
      if(oilSucceeded) st='🏅 안전하게 껐어요!';
      else if(S.out) st='🧯 불이 꺼졌어요 — 안전하게 마무리!';
      else if(S.doused) st='🌫️ 불이 잦아드는 중…';
      else if(S.flareUp) st='💥 불이 확 번졌어요! 덮거나 소화기로!';
      else if(S.lit) st='🔥 기름에 불이 붙었어요 — 어떻게 끌까요?';
      else st='🍳 기름 냄비를 꺼내 실험을 시작해요';
      stateEl.textContent=st;
      // 성공 판정 — 올바른 소화로 out 1.5초 지속
      if(S.out){
        if(!oilSuccessAt) oilSuccessAt=t;
        if(!oilSucceeded && t-oilSuccessAt>1.5){
          oilSucceeded=true;
          let msg='';
          if(oilPrediction) msg+=(oilPrediction==='flare' ? '🎯 <b>예측 적중!</b> ' : '🤔 예측과 달랐죠? ');
          if(S.wateredFirst){
            msg+='물을 뿌렸더니 불이 <b>확 커졌어요!</b> 기름은 물보다 가벼워 물 위로 떠서 타고, 가라앉은 물이 갑자기 끓어 기름을 사방으로 튀겨요 — <b>기름 불엔 물을 쓰면 안 돼요!</b> 대신 <b>덮거나 모래·소화기</b>로 산소를 끊어야 안전해요.';
          } else {
            msg+='기름 불을 <b>덮어(모래·소화기)</b> 산소를 끊어 안전하게 껐어요! 만약 <b>물을 뿌렸다면 불이 확 커졌을 거예요</b> — 기름은 물 위로 떠서 타고, 끓은 물이 기름을 튀기거든요. 기름 불엔 물 대신 <b>덮개·소화기</b>!';
          }
          $('sucMsg').innerHTML=msg;
          document.querySelector('#success h3').textContent='미션 성공 — 유류 화재 안전!';
          $('sucOil').style.display='none'; $('sucFree').style.display='none';
          successEl.classList.remove('hide');
        }
      } else oilSuccessAt=0;
    }
    controls.update();
    renderer.render(scene,camera);
    checkQuality(performance.now());
    return;
  }

  const ready = run.isReady();
  const S=sim.step(dt,{ready});

  // 컵 하강/상승 트윈 (덮기 연출)
  cupMesh.forEach((c,i)=>{
    if(!run.placed[i===0?'cup_s':'cup_l']) return;
    const tgt = c.userData.covered ? c.userData.coverY : c.userData.upY;
    c.position.y += (tgt - c.position.y)*Math.min(dt*4,1);
  });

  // 촛불 불꽃 = 산소 비례 (꺼지면 0)
  if(sim.state.lit){
    for(let i=0;i<2;i++){
      const cf=candleFlame[i], fl=S.flame[i];
      const flick = (S.o2[i]<sim.OUT_FLICKER && S.covered[i] && !S.out[i]) ? 2 : 1;
      const f=1+0.10*Math.sin(t*23*flick)+0.06*Math.sin(t*57*flick+1.7);
      cf.outer.scale.set(0.03*fl*f, 0.058*fl*f, 1);
      cf.inner.scale.set(0.017*fl*f, 0.03*fl*f, 1);
      cf.outer.visible=cf.inner.visible = fl>0;
      cf.light.intensity = fl>0 ? (1.1+0.4*Math.sin(t*19)*Math.sin(t*7))*fl : 0;
      // 소등 순간 연기 한 줄 (flame 0 전이) — light 잔광 페이드는 위에서 처리
    }
  }

  // 산소 HUD
  if(run.placed.o2meter){
    for(let i=0;i<2;i++){
      o2fill[i].style.width=(S.covered[i]?S.o2[i]:100).toFixed(0)+'%';
      o2fill[i].style.opacity = S.covered[i]?1:0.35;
    }
  }

  // ★와우 2차 — 작은 컵 소등 순간(중/고), "큰 컵은 왜 아직?"
  if(!smallOutShown && S.out[0]){
    smallOutShown=true;
    if(showWow && !predict2Shown && !freeMode && !S.out[1]){
      predict2Shown=true;
      predict2El.classList.remove('hide');
    }
  }

  // 상태줄
  let st='';
  if(succeeded) st='🏅 미션 성공!';
  else if(!sim.state.lit && ready) st='🕯️ 촛불을 켜고 컵으로 덮어 봐요';
  else if(sim.state.lit && !S.covered[0] && !S.covered[1]) st='컵을 덮어 봐요 — 안의 산소가 줄기 시작해요';
  else if(S.bothOut) st='두 촛불 다 꺼졌어요 — 산소를 다 썼거든요!';
  else if(S.out[0] && !S.out[1]) st='🥛 작은 컵 먼저! 큰 컵은 아직 타요';
  else if((S.covered[0]&&S.o2[0]<sim.OUT_FLICKER&&!S.out[0]) || (S.covered[1]&&S.o2[1]<sim.OUT_FLICKER&&!S.out[1])) st='촛불이 가물가물…';
  else if(S.covered[0]||S.covered[1]) st='💨 컵 속 산소가 줄어드는 중…';
  stateEl.textContent=st;

  // 성공 판정 — 두 촛불 다 소등 2초 지속
  if(S.bothOut){
    if(!successAt) successAt=t;
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='불이 타려면 <b>탈 물질 · 산소 · 발화점 이상의 온도</b> 세 가지가 필요해요(연소의 조건). 컵을 덮어 <b>산소</b>를 끊으니 꺼졌죠 — 큰 컵이 오래 탄 건 <b>산소가 더 많아서</b>예요.';
      if(prediction) msg=(prediction==='small'?'🎯 <b>1차 예측 적중!</b> ':'🤔 1차 예측과 달랐죠? ')+msg;
      if(prediction2) msg+= (prediction2==='o2')
        ? '<br>🎯 <b>2차도 적중</b> — 큰 컵은 산소가 더 많아 오래 탔어요!'
        : '<br>🤔 2차는 달랐죠? 초는 같아요 — 큰 컵은 <b>산소가 더 많아서</b> 오래 탄 거예요!';
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' :
                    `<br>기구 고르기 다시 생각해 본 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      document.querySelector('#success h3').textContent='미션 성공 — 연소와 소화!';
      if(!freeMode){
        $('sucOil').style.display=''; $('sucFree').style.display='';
        successEl.classList.remove('hide');
      }
      else toast('🥛 작은 컵 먼저, 큰 컵은 오래 — 산소량 차이!',false,5200);
    }
  } else successAt=0;

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').classList.add('hide');
if(stage==='oil'){
  goStage('oil');
  toast('🔥 유류 화재편 — 🍳 기름 냄비를 꺼내 실험을 시작해요!', false, 5200);
} else {
  toast('🎯 미션: 선반에서 <b>필요한 기구만</b> 골라 실험을 준비해 봐요!', false, 5200);
}
animate();
</script>
</body>
</html>

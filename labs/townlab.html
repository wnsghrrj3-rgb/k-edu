<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>케이랩 · 마을 계획실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --acc:#9B7BF5; --acc2:#7856d6; --ink:#25303c;
    --hud:rgba(24,30,40,.82); --hudline:rgba(255,255,255,.12);
    --ok:#12B886; --info:#5B9BF0; --ink-light:#eef3fa; --warn:#e8a13a; --bad:#e8503a;
    --road:#c9cdd4; --house:#c99b6e; --water:#7fbde8; --bridge:#a98b62; --empty:#cfe6b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;
    background:linear-gradient(180deg,#afd3f2,#d8ecc8);font-family:'Gowun Dodum',sans-serif}
  canvas{display:block;touch-action:none}
  #board{position:fixed;inset:0;margin:auto}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:linear-gradient(180deg,rgba(20,26,34,.55),rgba(20,26,34,0));color:#fff}
  .topbar .title{font-family:'Jua';font-size:20px;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  .topbar .title b{color:#ffe27a}
  .topbar .spacer{flex:1}
  .btn{border:0;border-radius:12px;padding:9px 14px;font-family:'Gowun Dodum';font-size:14px;
    cursor:pointer;background:rgba(255,255,255,.9);color:var(--ink);border:1px solid rgba(0,0,0,.06);
    box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .btn:hover{background:#fff}
  .btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.acc:hover{background:var(--acc2)}
  .btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .btn[disabled]{opacity:.45;pointer-events:none}

  /* 상단 모드 탭 */
  .tabs{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:6px;
    background:var(--hud);padding:6px;border-radius:14px;border:1px solid var(--hudline);backdrop-filter:blur(8px)}
  .tabs button{border:0;background:transparent;color:#d6def0;font-family:'Jua';font-size:14px;
    padding:7px 15px;border-radius:10px;cursor:pointer}
  .tabs button.on{background:var(--acc);color:#fff}

  /* 시설 팔레트(하단) */
  .palette{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:12;
    display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:94vw;padding:9px 11px;
    background:var(--hud);border:1px solid var(--hudline);border-radius:16px;backdrop-filter:blur(8px)}
  .fac{border:0;background:rgba(255,255,255,.10);color:#fff;font-family:'Gowun Dodum';
    width:60px;height:58px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;border:2px solid transparent}
  .fac .em{font-size:22px;line-height:1}
  .fac .nm{font-size:11px;color:#cfd6e6}
  .fac .ct{font-size:10px;color:#ffe27a}
  .fac.on{border-color:#fff;background:rgba(255,255,255,.22)}
  .fac[disabled]{opacity:.35;pointer-events:none}

  /* 히트맵 대상 선택(우상단) */
  .lens{position:fixed;top:54px;right:14px;z-index:12;display:flex;flex-direction:column;gap:6px;
    background:var(--hud);border:1px solid var(--hudline);border-radius:14px;padding:9px;backdrop-filter:blur(8px);
    color:#dce4f2;font-size:12px;max-width:150px}
  .lens .row{display:flex;gap:5px;flex-wrap:wrap}
  .lens .lb{font-family:'Jua';color:#fff;font-size:12px;margin-bottom:1px}
  .lens .chip{border:0;background:rgba(255,255,255,.10);color:#dce4f2;border-radius:9px;
    padding:5px 8px;font-size:12px;cursor:pointer;font-family:'Gowun Dodum'}
  .lens .chip.on{background:var(--acc);color:#fff}

  /* 미션 카드(좌하단) */
  .mission{position:fixed;left:14px;bottom:88px;z-index:12;max-width:270px;
    background:var(--hud);border:1px solid var(--hudline);border-radius:14px;padding:13px 15px;
    color:#eaf0fa;backdrop-filter:blur(8px);display:none}
  .mission.show{display:block}
  .mission h3{margin:0 0 6px;font-family:'Jua';font-size:16px;color:#fff}
  .mission .goal{display:flex;align-items:flex-start;gap:7px;font-size:13px;margin:5px 0;line-height:1.4}
  .mission .goal .mk{flex:0 0 auto;width:18px}
  .mission .hint{font-size:12px;color:#aeb9cc;margin-top:8px}
  .mission .done{margin-top:9px;font-family:'Jua';color:#ffe27a;display:none}
  .mission.win .done{display:block}

  /* 골든타임 배너 */
  #golden{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:20;
    background:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 8px 28px rgba(0,0,0,.28);
    font-family:'Jua';font-size:15px;color:var(--ink);display:none;text-align:center;max-width:300px}
  #golden.show{display:block}
  #golden .big{font-size:24px;margin:2px 0}
  #golden .ok{color:var(--ok)} #golden .no{color:var(--bad)}

  #toast{position:fixed;left:50%;top:150px;transform:translateX(-50%) translateY(-8px);z-index:40;
    background:rgba(24,30,40,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;
    opacity:0;transition:.25s;pointer-events:none;max-width:82vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .legend{position:fixed;left:14px;top:100px;z-index:11;background:var(--hud);border:1px solid var(--hudline);
    border-radius:12px;padding:9px 11px;color:#dce4f2;font-size:11px;display:none}
  .legend.show{display:block}
  .legend .lr{display:flex;align-items:center;gap:6px;margin:3px 0}
  .legend .sw{width:16px;height:12px;border-radius:3px}
</style>
</head>
<body>
<canvas id="board"></canvas>

<div class="topbar">
  <div class="title">🏘 케이랩 <b>마을 계획실</b></div>
  <div class="spacer"></div>
  <button class="btn" id="mapBtn">🗺 마을 바꾸기</button>
  <button class="btn" id="fireBtn">🔥 불이 났어요</button>
  <button class="btn" id="medBtn">🚑 응급 환자</button>
  <button class="btn" id="policeBtn">🚨 신고 출동</button>
  <button class="btn" id="clearBtn">↺ 비우기</button>
</div>

<div class="tabs">
  <button data-mode="free" class="on">자유 배치</button>
  <button data-mode="mission">미션</button>
</div>

<div class="lens">
  <div class="lb">🎨 가까움 보기</div>
  <div class="row" id="lensFacs"></div>
  <div class="lb" style="margin-top:6px">이동 방법</div>
  <div class="row">
    <button class="chip on" data-lm="walk">🚶 걸어서</button>
    <button class="chip" data-lm="fire">🚒 소방차</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button class="chip" id="lensOff">끄기</button>
  </div>
</div>

<div class="legend" id="legend">
  <div class="lr"><span class="sw" style="background:#2fa84f"></span>아주 가까움</div>
  <div class="lr"><span class="sw" style="background:#9bcf3c"></span>가까움</div>
  <div class="lr"><span class="sw" style="background:#f4d03f"></span>보통</div>
  <div class="lr"><span class="sw" style="background:#e8843a"></span>멂</div>
  <div class="lr"><span class="sw" style="background:#e8503a"></span>아주 멂</div>
  <div class="lr"><span class="sw" style="background:#8a94a3"></span>닿지 않음</div>
</div>

<div class="palette" id="palette"></div>

<div class="mission" id="missionCard">
  <h3 id="mTitle"></h3>
  <div id="mGoals"></div>
  <div class="hint" id="mHint"></div>
  <div class="done" id="mDone">🎉 미션 완료! 마을을 잘 계획했어요.</div>
</div>

<div id="golden"></div>
<div id="toast"></div>

<script id="townlab-logic">
/* ── 마을 계획실 순수 로직(THREE·DOM 무관 · 검산 대상) ──
   window.TownLab. 격자 BFS: 시설(소스) → 집(도착) 최단 홉. 시간 = 홉 × cost(walk 1·fire 0.25). */
(function (root) {
  var COST = { walk: 1, fire: 0.25 };
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function parse(mapDef) {
    var rows = mapDef.rows, H = rows.length, W = rows[0].length;
    var grid = rows.map(function (r) { return r.split(''); });
    return { W: W, H: H, grid: grid, name: mapDef.name };
  }
  function inb(m, x, y) { return x >= 0 && y >= 0 && x < m.W && y < m.H; }
  function baseAt(m, x, y) { return inb(m, x, y) ? m.grid[y][x] : null; }
  function passable(ch) { return ch === 'R' || ch === 'B'; }          // 이동 통과 = 길·다리
  function placeable(ch) { return ch === '.'; }                       // 시설 배치 = 빈터만

  // state = { map, placed:{ "x,y": facType } }
  function makeState(m) { return { map: m, placed: {} }; }
  function key(x, y) { return x + ',' + y; }
  function facAt(st, x, y) { return st.placed[key(x, y)] || null; }
  // 이동 통과 = 길·다리·빈 공터(시설 건물이 놓인 칸은 막힘). 집·강은 통과 불가(집은 도착지).
  function passableCell(st, x, y) {
    var t = baseAt(st.map, x, y);
    if (t === 'R' || t === 'B') return true;
    if (t === '.' && !facAt(st, x, y)) return true;
    return false;
  }
  function canPlace(st, x, y) { return placeable(baseAt(st.map, x, y)) && !facAt(st, x, y); }
  function place(st, x, y, type) { if (!canPlace(st, x, y)) return false; st.placed[key(x, y)] = type; return true; }
  function remove(st, x, y) { var k = key(x, y); if (st.placed[k]) { delete st.placed[k]; return true; } return false; }

  function facilityCells(st, type) {
    var out = [];
    for (var k in st.placed) if (st.placed[k] === type) { var p = k.split(','); out.push({ x: +p[0], y: +p[1] }); }
    return out;
  }
  function houseCells(m) {
    var out = [];
    for (var y = 0; y < m.H; y++) for (var x = 0; x < m.W; x++) if (m.grid[y][x] === 'H') out.push({ x: x, y: y });
    return out;
  }

  /* 멀티소스 BFS — sources(시설 셀들) dist 0에서 길·다리로 확산, 집·도착지엔 홉 기록(통과 안 함).
     반환 { dist:{key:홉}, par:{key:parentKey} }. 결정론(고정 큐 순서). */
  function bfs(st, sources) {
    var m = st.map, dist = {}, par = {}, q = [], head = 0;
    sources.forEach(function (s) { var k = key(s.x, s.y); if (dist[k] === undefined) { dist[k] = 0; par[k] = null; q.push(s); } });
    while (head < q.length) {
      var c = q[head++], d = dist[key(c.x, c.y)];
      for (var i = 0; i < DIRS.length; i++) {
        var nx = c.x + DIRS[i][0], ny = c.y + DIRS[i][1];
        if (!inb(m, nx, ny)) continue;
        var nk = key(nx, ny);
        if (dist[nk] !== undefined) continue;
        var t = baseAt(m, nx, ny);
        if (passableCell(st, nx, ny)) { dist[nk] = d + 1; par[nk] = key(c.x, c.y); q.push({ x: nx, y: ny }); }   // 길·다리·공터: 통과+확장
        else if (t === 'H') { dist[nk] = d + 1; par[nk] = key(c.x, c.y); }                                        // 집: 도착만
        // W(강)·시설 건물 = 확산/도착 없음
      }
    }
    return { dist: dist, par: par };
  }

  /* 접근성 — 특정 시설까지 전 집의 시간. { reached,total,max,ok,times:[{x,y,t}] } */
  function coverage(st, type, mode, limit) {
    var srcs = facilityCells(st, type), houses = houseCells(st.map), cost = COST[mode] || 1;
    if (!srcs.length) return { reached: 0, total: houses.length, max: Infinity, ok: false, times: houses.map(function (h) { return { x: h.x, y: h.y, t: Infinity }; }) };
    var b = bfs(st, srcs), times = [], reached = 0, max = 0, ok = true;
    houses.forEach(function (h) {
      var d = b.dist[key(h.x, h.y)];
      if (d === undefined) { times.push({ x: h.x, y: h.y, t: Infinity }); ok = false; }
      else { var t = d * cost; times.push({ x: h.x, y: h.y, t: t }); reached++; if (t > max) max = t; if (limit !== undefined && t > limit) ok = false; }
    });
    if (reached < houses.length) ok = false;
    return { reached: reached, total: houses.length, max: max, ok: ok, times: times };
  }

  /* 사건 — target(불난 집)까지 가장 가까운 소방서 최단 경로·시간. 없으면 null. */
  function fireResponse(st, target, type) {
    type = type || 'fire';
    var srcs = facilityCells(st, type);
    if (!srcs.length) return null;
    var b = bfs(st, srcs), tk = key(target.x, target.y);
    if (b.dist[tk] === undefined) return { reached: false, minutes: Infinity, path: null };
    var path = [], cur = tk;
    while (cur !== null && cur !== undefined) { var p = cur.split(','); path.push({ x: +p[0], y: +p[1] }); cur = b.par[cur]; }
    path.reverse();
    return { reached: true, minutes: b.dist[tk] * COST.fire, path: path };
  }

  /* 히트 등급 0(가까움)~5(닿지않음) — 시간과 이동방법 기준 상대 구간. */
  function heatBucket(t, mode) {
    if (!isFinite(t)) return 5;
    var u = (mode === 'fire') ? t / 0.25 : t;   // 홉 수로 환산
    if (u <= 4) return 0; if (u <= 8) return 1; if (u <= 13) return 2; if (u <= 19) return 3; return 4;
  }

  function evalMission(st, mission) {
    var results = (mission.goals || []).map(function (g) {
      var cov = coverage(st, g.fac, g.mode, g.limit);
      return { goal: g, ok: cov.ok, cov: cov };
    });
    return { passed: results.length > 0 && results.every(function (r) { return r.ok; }), results: results };
  }

  root.TownLab = {
    COST: COST, parse: parse, inb: inb, baseAt: baseAt, passable: passable, placeable: placeable,
    makeState: makeState, key: key, facAt: facAt, passableCell: passableCell, canPlace: canPlace, place: place, remove: remove,
    facilityCells: facilityCells, houseCells: houseCells, bfs: bfs, coverage: coverage,
    fireResponse: fireResponse, heatBucket: heatBucket, evalMission: evalMission
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.TownLab;
})(typeof window !== 'undefined' ? window : this);
</script>

<script src="./town_maps.js"></script>
<script>
/* ══════════ 마을 계획실 UI (2D canvas) ══════════ */
const TL = window.TownLab, MAPS = window.TOWN_MAPS, FAC = window.TOWN_FAC, MISSIONS = window.TOWN_MISSIONS;
const params = new URLSearchParams(location.search);
const HEAT = ['#2fa84f', '#9bcf3c', '#f4d03f', '#e8843a', '#e8503a', '#8a94a3'];

const cv = document.getElementById('board'), g = cv.getContext('2d');
let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

/* 상태 */
let mapIds = Object.keys(MAPS);
let mapIdx = Math.max(0, mapIds.indexOf(params.get('map')));
let state, cell = 24, ox = 0, oy = 0;
let mode = params.get('mode') === 'mission' ? 'mission' : 'free';
let selFac = null;             // 팔레트 선택 시설
let lensFac = null, lensMode = 'walk';   // 히트맵 대상
let mission = null, missionGive = null;   // 미션 시 시설 예산(잔여)
let evAnim = null;   // 진행 중인 사건 애니(소방/구급/순찰 공용)

/* ── 사운드(간단 Web Audio) ── */
const Snd = (function () {
  let ac = null;
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
  function tone(f, d, type, vol) { const a = ctx(); if (!a) return; const o = a.createOscillator(), gg = a.createGain();
    o.type = type || 'sine'; o.frequency.value = f; gg.gain.value = vol || 0.14; o.connect(gg); gg.connect(a.destination);
    const t = a.currentTime; o.start(t); gg.gain.setValueAtTime(gg.gain.value, t); gg.gain.exponentialRampToValueAtTime(0.001, t + (d || 0.15)); o.stop(t + (d || 0.15)); }
  return {
    place: () => tone(560, 0.1, 'triangle', 0.12),
    remove: () => tone(240, 0.09, 'sine', 0.1),
    win: () => { tone(660, 0.12, 'triangle', 0.14); setTimeout(() => tone(880, 0.18, 'triangle', 0.14), 120); },
    siren: () => { tone(720, 0.25, 'sawtooth', 0.08); setTimeout(() => tone(540, 0.25, 'sawtooth', 0.08), 200); },
    ok: () => tone(820, 0.16, 'triangle', 0.13), no: () => tone(180, 0.28, 'square', 0.12)
  };
})();
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ── 레이아웃 ── */
function layout() {
  const m = state.map;
  const vw = window.innerWidth, vh = window.innerHeight;
  const padX = 24, padTop = 96, padBot = 96;
  cell = Math.floor(Math.min((vw - padX * 2) / m.W, (vh - padTop - padBot) / m.H));
  cell = Math.max(12, cell);
  const bw = cell * m.W, bh = cell * m.H;
  ox = Math.floor((vw - bw) / 2); oy = Math.floor(padTop + (vh - padTop - padBot - bh) / 2);
  cv.width = vw * dpr; cv.height = vh * dpr; cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ── 렌더 ── */
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function draw() {
  const m = state.map; g.clearRect(0, 0, cv.width, cv.height);
  // 히트맵(집 셀 색)
  let heat = null;
  if (lensFac) { const cov = TL.coverage(state, lensFac, lensMode); heat = {}; cov.times.forEach(t => heat[TL.key(t.x, t.y)] = t.t); }
  for (let y = 0; y < m.H; y++) for (let x = 0; x < m.W; x++) {
    const px = ox + x * cell, py = oy + y * cell, ch = m.grid[y][x];
    let col = '#e6efd8';
    if (ch === 'R') col = 'var';               // 길
    else if (ch === 'H') col = getCSS('--house');
    else if (ch === 'W') col = getCSS('--water');
    else if (ch === 'B') col = getCSS('--bridge');
    else col = getCSS('--empty');
    if (ch === 'R') col = getCSS('--road');
    g.fillStyle = col; g.fillRect(px, py, cell, cell);
    // 집 히트 색 오버레이
    if (ch === 'H' && heat) { const b = TL.heatBucket(heat[TL.key(x, y)], lensMode); g.fillStyle = HEAT[b]; g.globalAlpha = 0.72; g.fillRect(px + 1, py + 1, cell - 2, cell - 2); g.globalAlpha = 1; }
    // 격자선
    g.strokeStyle = 'rgba(0,0,0,.05)'; g.lineWidth = 1; g.strokeRect(px + .5, py + .5, cell, cell);
    // 강 물결
    if (ch === 'W') { g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(px + 3, py + cell * .5); g.quadraticCurveTo(px + cell * .5, py + cell * .3, px + cell - 3, py + cell * .5); g.stroke(); }
    // 다리 판자
    if (ch === 'B') { g.strokeStyle = 'rgba(80,55,30,.5)'; g.lineWidth = 1.2; for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(px + cell * k / 4, py + 2); g.lineTo(px + cell * k / 4, py + cell - 2); g.stroke(); } }
    // 집 지붕
    if (ch === 'H') { g.fillStyle = 'rgba(120,70,40,.55)'; g.beginPath(); g.moveTo(px + 3, py + cell * .42); g.lineTo(px + cell * .5, py + 3); g.lineTo(px + cell - 3, py + cell * .42); g.closePath(); g.fill(); }
    // 배치 가능 표시(빈터, 자유/선택 시)
    if (ch === '.' && selFac && TL.canPlace(state, x, y)) { g.strokeStyle = 'rgba(120,90,220,.55)'; g.setLineDash([3, 3]); g.lineWidth = 1.6; g.strokeRect(px + 3, py + 3, cell - 6, cell - 6); g.setLineDash([]); }
  }
  // 시설 마커
  for (const k in state.placed) { const p = k.split(','), x = +p[0], y = +p[1], f = FAC[state.placed[k]];
    const px = ox + x * cell, py = oy + y * cell; g.fillStyle = f.color; roundRect(px + 2, py + 2, cell - 4, cell - 4, Math.max(4, cell * .18)); g.fill();
    g.fillStyle = '#fff'; g.font = Math.floor(cell * .62) + 'px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(f.emoji, px + cell / 2, py + cell / 2 + 1);
  }
  // 사건(소방차·구급차·순찰차 공용)
  if (evAnim) {
    const p = evAnim.path, prog = evAnim.prog, cfg = evAnim.cfg;
    // 지나온 경로 강조
    g.strokeStyle = cfg.color; g.lineWidth = Math.max(3, cell * .18); g.lineCap = 'round'; g.beginPath();
    const upto = Math.floor(prog);
    for (let i = 0; i <= Math.min(upto, p.length - 1); i++) { const cx = ox + p[i].x * cell + cell / 2, cy = oy + p[i].y * cell + cell / 2; if (i === 0) g.moveTo(cx, cy); else g.lineTo(cx, cy); }
    g.stroke();
    // 사건 발생 집
    const tgt = evAnim.target, tx = ox + tgt.x * cell + cell / 2, ty = oy + tgt.y * cell + cell / 2;
    g.font = Math.floor(cell * .7) + 'px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(cfg.tgtEmoji, tx, ty);
    // 출동 차량 현재 위치
    const i = Math.min(upto, p.length - 1), j = Math.min(i + 1, p.length - 1), f = prog - upto;
    const cx = (ox + p[i].x * cell + cell / 2) + ((p[j].x - p[i].x) * cell) * f;
    const cy = (oy + p[i].y * cell + cell / 2) + ((p[j].y - p[i].y) * cell) * f;
    g.font = Math.floor(cell * .8) + 'px serif'; g.fillText(cfg.vehEmoji, cx, cy);
  }
}
function getCSS(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#ccc'; }

/* ── 팔레트 ── */
function buildPalette() {
  const pal = document.getElementById('palette'); pal.innerHTML = '';
  const types = (mode === 'mission' && missionGive) ? Object.keys(missionGive) : Object.keys(FAC);
  types.forEach(type => {
    const f = FAC[type], b = document.createElement('button'); b.className = 'fac' + (selFac === type ? ' on' : ''); b.dataset.type = type;
    let ctHtml = '';
    if (mode === 'mission' && missionGive) { const left = remaining(type); ctHtml = `<span class="ct">${left}개 남음</span>`; if (left <= 0 && selFac !== type) b.disabled = true; }
    b.innerHTML = `<span class="em">${f.emoji}</span><span class="nm">${f.name}</span>${ctHtml}`;
    b.onclick = () => { selFac = (selFac === type ? null : type); buildPalette(); draw(); };
    pal.appendChild(b);
  });
}
function remaining(type) { if (!missionGive) return Infinity; const used = TL.facilityCells(state, type).length; return (missionGive[type] || 0) - used; }

/* ── 히트맵 렌즈 ── */
function buildLens() {
  const wrap = document.getElementById('lensFacs'); wrap.innerHTML = '';
  Object.keys(FAC).forEach(type => {
    const b = document.createElement('button'); b.className = 'chip' + (lensFac === type ? ' on' : '');
    b.textContent = FAC[type].emoji; b.title = FAC[type].name;
    b.onclick = () => { lensFac = (lensFac === type ? null : type); document.getElementById('legend').classList.toggle('show', !!lensFac); buildLens(); draw(); };
    wrap.appendChild(b);
  });
}
document.querySelectorAll('.lens .chip[data-lm]').forEach(c => c.onclick = () => {
  lensMode = c.dataset.lm; document.querySelectorAll('.lens .chip[data-lm]').forEach(x => x.classList.toggle('on', x === c)); draw();
});
document.getElementById('lensOff').onclick = () => { lensFac = null; document.getElementById('legend').classList.remove('show'); buildLens(); draw(); };

/* ── 미션 ── */
function loadMission(mid) {
  mission = MISSIONS.find(m => m.id === mid) || MISSIONS.find(m => m.map === mapIds[mapIdx]) || MISSIONS[0];
  if (!mission) return;
  mapIdx = mapIds.indexOf(mission.map); if (mapIdx < 0) mapIdx = 0;
  missionGive = Object.assign({}, mission.give);
  state = TL.makeState(TL.parse(MAPS[mapIds[mapIdx]]));
  document.getElementById('mTitle').textContent = '🎯 ' + mission.title;
  document.getElementById('mHint').textContent = '💡 ' + mission.hint;
  document.getElementById('missionCard').classList.add('show');
  layout(); buildPalette(); scoreMission(); draw();
}
function scoreMission() {
  if (!mission) return;
  const ev = TL.evalMission(state, mission), box = document.getElementById('mGoals'); box.innerHTML = '';
  ev.results.forEach(r => {
    const d = document.createElement('div'); d.className = 'goal';
    const mk = r.ok ? '✅' : '⬜';
    let detail = '';
    if (!r.ok && r.cov.reached < r.cov.total) detail = ` (닿지 않는 집 ${r.cov.total - r.cov.reached}채)`;
    else if (!r.ok && isFinite(r.cov.max)) detail = ` (가장 먼 집 ${fmt(r.cov.max)}분)`;
    else if (r.ok) detail = ` (가장 먼 집 ${fmt(r.cov.max)}분)`;
    d.innerHTML = `<span class="mk">${mk}</span><span>${r.goal.label}<span style="color:#aeb9cc">${detail}</span></span>`;
    box.appendChild(d);
  });
  const card = document.getElementById('missionCard');
  if (ev.passed && !card.classList.contains('win')) { card.classList.add('win'); Snd.win(); toast('🎉 미션 완료!'); collect('town_' + mission.id); }
  else if (!ev.passed) card.classList.remove('win');
}
function fmt(v) { return (Math.round(v * 10) / 10).toString(); }
function collect(id) { try { if (window.parent && parent !== window && parent.KEDU_COLLECT) parent.KEDU_COLLECT(id); } catch (e) {} }

/* ── 사건(소방·구급·순찰 공용) — fireResponse(type)로 최근접 시설 경로·시간 판정 ── */
const EVENTS = {
  fire:   { fac: 'fire',     vehEmoji: '🚒', tgtEmoji: '🔥', color: 'rgba(232,80,58,.85)',  limit: 5,
            goMsg: '🔥 불이 났어요!',        vehName: '소방차', reachName: '소방서',
            okMsg: '골든타임(5분) 안에 도착했어요 👍', noMsg: '5분을 넘겼어요. 소방서 자리를 다시 볼까요?',
            noReach: '소방서가 없거나 강 건너라 길이 막혔어요.' },
  med:    { fac: 'hospital', vehEmoji: '🚑', tgtEmoji: '🤕', color: 'rgba(232,67,147,.85)', limit: 5,
            goMsg: '🚑 응급 환자가 생겼어요!', vehName: '구급차', reachName: '병원',
            okMsg: '5분 안에 병원 구급차가 닿았어요 👍', noMsg: '5분을 넘겼어요. 병원 자리를 다시 볼까요?',
            noReach: '병원이 없거나 강 건너라 길이 막혔어요.' },
  crime:  { fac: 'police',   vehEmoji: '🚓', tgtEmoji: '🚨', color: 'rgba(59,125,216,.85)', limit: 5,
            goMsg: '🚨 신고가 들어왔어요!',   vehName: '순찰차', reachName: '경찰서',
            okMsg: '5분 안에 순찰차가 출동했어요 👍', noMsg: '5분을 넘겼어요. 경찰서 자리를 다시 볼까요?',
            noReach: '경찰서가 없어 출동하지 못했어요.' }
};
function runEvent(type) {
  const cfg = EVENTS[type] || EVENTS.fire;
  if (evAnim) return;
  const houses = TL.houseCells(state.map); if (!houses.length) return;
  const tgt = houses[Math.floor(Math.random() * houses.length)];
  const res = TL.fireResponse(state, tgt, cfg.fac);
  const gb = document.getElementById('golden');
  if (!res || !res.reached) {
    gb.innerHTML = `<div>${cfg.goMsg}</div><div class="big no">${cfg.vehName}가 닿지 못했어요</div><div>${cfg.noReach}</div>`;
    gb.classList.add('show'); Snd.no(); setTimeout(() => gb.classList.remove('show'), 4200);
    lensFac = cfg.fac; lensMode = 'fire'; document.getElementById('legend').classList.add('show'); buildLens(); draw();
    return;
  }
  Snd.siren();
  evAnim = { path: res.path, target: tgt, prog: 0, cfg: cfg, t0: performance.now(), dur: 200 + res.path.length * 130 };
  (function anim(now) {
    const u = Math.min(1, (now - evAnim.t0) / evAnim.dur);
    evAnim.prog = u * (evAnim.path.length - 1); draw();
    if (u < 1) requestAnimationFrame(anim);
    else {
      const ok = res.minutes <= cfg.limit;
      gb.innerHTML = `<div>${cfg.vehEmoji} ${cfg.vehName} 도착!</div><div class="big ${ok ? 'ok' : 'no'}">${fmt(res.minutes)}분</div>` +
        `<div>${ok ? cfg.okMsg : cfg.noMsg}</div>`;
      gb.classList.add('show'); ok ? Snd.ok() : Snd.no();
      setTimeout(() => { gb.classList.remove('show'); evAnim = null; draw(); }, 4200);
    }
  })(performance.now());
}

/* ── 입력 ── */
function cellFromEvent(e) {
  const r = cv.getBoundingClientRect(), cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left, cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  const x = Math.floor((cx - ox) / cell), y = Math.floor((cy - oy) / cell);
  return TL.inb(state.map, x, y) ? { x, y } : null;
}
function onTap(e) {
  if (evAnim) return;
  const c = cellFromEvent(e); if (!c) return;
  const existing = TL.facAt(state, c.x, c.y);
  if (existing) { TL.remove(state, c.x, c.y); Snd.remove(); afterEdit(); return; }   // 재탭 = 제거
  if (!selFac) { toast('아래에서 지을 시설을 먼저 골라요 🏗'); return; }
  if (mode === 'mission' && remaining(selFac) <= 0) { toast(FAC[selFac].name + '은(는) 다 썼어요'); Snd.no(); return; }
  if (!TL.canPlace(state, c.x, c.y)) { toast('여기엔 지을 수 없어요 (빈터에만)'); return; }
  TL.place(state, c.x, c.y, selFac); Snd.place(); afterEdit();
}
function afterEdit() { if (mode === 'mission') { buildPalette(); scoreMission(); } draw(); }
cv.addEventListener('click', onTap);

/* ── 상단 버튼 ── */
document.getElementById('mapBtn').onclick = () => {
  if (mode === 'mission') { toast('미션 중에는 마을이 고정돼요'); return; }
  mapIdx = (mapIdx + 1) % mapIds.length; state = TL.makeState(TL.parse(MAPS[mapIds[mapIdx]]));
  layout(); draw(); toast('🗺 ' + state.map.name);
};
document.getElementById('fireBtn').onclick = () => runEvent('fire');
document.getElementById('medBtn').onclick = () => runEvent('med');
document.getElementById('policeBtn').onclick = () => runEvent('crime');
document.getElementById('clearBtn').onclick = () => { state.placed = {}; afterEdit(); draw(); toast('시설을 모두 비웠어요'); };

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  selFac = null; lensFac = null; document.getElementById('legend').classList.remove('show');
  if (mode === 'mission') { loadMission(params.get('mission')); }
  else { document.getElementById('missionCard').classList.remove('show'); missionGive = null; state = TL.makeState(TL.parse(MAPS[mapIds[mapIdx]])); layout(); buildPalette(); buildLens(); draw(); }
});

/* ── 시작 ── */
function boot() {
  state = TL.makeState(TL.parse(MAPS[mapIds[mapIdx]]));
  buildLens(); layout();
  if (mode === 'mission') { document.querySelector('.tabs button[data-mode="mission"]').click(); }
  else { buildPalette(); draw(); }
}
window.addEventListener('resize', () => { dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1)); layout(); draw(); });
boot();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>케이아트 · 물감 엔진 W0 · CPU 참조 랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0d0f13; --panel:#14171d; --panel2:#1b1f27; --line:#2a2f39;
    --muted:#7f8794; --text:#e7ebf2; --dim:#aab2c0;
    --wet:#4ea3ff; --stain:#e86a4c; --ok:#57c98a; --accent:#c9a24b;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, #191d25 0%, transparent 60%),
      var(--ink);
    color:var(--text); font-family:"Gowun Dodum",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; min-height:100%;
    align-items:center; justify-content:center; padding:28px;
  }
  .lab{
    width:min(940px,100%); display:grid; grid-template-columns:auto 300px; gap:22px;
  }
  @media (max-width:820px){ .lab{grid-template-columns:1fr} }

  .stage{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:18px; display:flex; flex-direction:column; gap:14px;
  }
  .eyebrow{
    font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--muted);
  }
  h1{margin:2px 0 0; font-size:19px; font-weight:400; letter-spacing:.01em}
  h1 b{color:var(--accent); font-weight:400}

  .canvas-wrap{ position:relative; align-self:center; }
  canvas#view{
    width:512px; height:512px; max-width:100%; aspect-ratio:1;
    image-rendering:pixelated; border-radius:10px; cursor:crosshair;
    background:#fff; box-shadow:0 18px 40px -22px #000, inset 0 0 0 1px #0006;
    touch-action:none;
  }
  .hud{
    position:absolute; left:12px; bottom:12px; display:flex; gap:8px;
    font-family:"Space Mono",monospace; font-size:11px; color:#0d0f13;
    background:#ffffffcc; backdrop-filter:blur(3px); padding:5px 9px;
    border-radius:8px; letter-spacing:.02em;
  }
  .hud b{color:var(--stain)}

  .side{display:flex; flex-direction:column; gap:14px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:16px;
  }
  .card h2{
    margin:0 0 12px; font-size:12px; font-weight:400; color:var(--dim);
    letter-spacing:.02em; display:flex; align-items:center; gap:8px;
  }
  .card h2 span{ flex:1; height:1px; background:var(--line) }

  .tools{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .tool{
    appearance:none; cursor:pointer; border:1px solid var(--line);
    background:var(--panel2); color:var(--dim); border-radius:10px;
    padding:11px 8px; font-family:inherit; font-size:13px; text-align:center;
    transition:.16s; line-height:1.1;
  }
  .tool small{display:block; font-family:"Space Mono",monospace; font-size:10px; color:var(--muted); margin-top:3px}
  .tool:hover{border-color:#3a4150; color:var(--text)}
  .tool.on{ background:#20262f; border-color:var(--accent); color:#fff }
  .tool.on small{color:var(--accent)}

  .swatches{display:grid; grid-template-columns:repeat(6,1fr); gap:7px}
  .sw{
    aspect-ratio:1; border-radius:9px; cursor:pointer; border:2px solid #0000;
    box-shadow:inset 0 0 0 1px #ffffff18; transition:.14s; position:relative;
  }
  .sw.on{ border-color:#fff; transform:scale(1.06) }

  .row{display:flex; align-items:center; gap:10px; margin-top:11px; font-size:12px; color:var(--dim)}
  .row label{width:46px; color:var(--muted); font-family:"Space Mono",monospace; font-size:11px}
  input[type=range]{ -webkit-appearance:none; flex:1; height:3px; border-radius:3px; background:var(--line); outline:none }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px #c9a24b22 }
  .row output{width:34px; text-align:right; font-family:"Space Mono",monospace; font-size:11px; color:var(--text)}

  .paper-sel{display:flex; gap:7px; flex-wrap:wrap}
  .chip{
    cursor:pointer; border:1px solid var(--line); background:var(--panel2);
    color:var(--muted); border-radius:20px; padding:6px 12px; font-size:12px; transition:.14s;
  }
  .chip.on{border-color:var(--accent); color:#fff; background:#20262f}

  .actions{display:flex; gap:8px; margin-top:2px}
  .btn{
    flex:1; cursor:pointer; border:1px solid var(--line); background:var(--panel2);
    color:var(--dim); border-radius:10px; padding:10px; font-family:inherit; font-size:13px; transition:.14s;
  }
  .btn:hover{border-color:#3a4150; color:var(--text)}
  .btn.warm{border-color:#4a3a2a; color:var(--accent)}
  .note{ font-size:11px; color:var(--muted); line-height:1.6; margin-top:12px }
  .note code{ font-family:"Space Mono",monospace; color:var(--dim) }
</style>
</head>
<body>
<div class="lab">
  <section class="stage">
    <div>
      <div class="eyebrow">K-EDU · 케이아트 · PAINT ENGINE</div>
      <h1>물감 엔진 <b>W0</b> — CPU 참조 랩</h1>
    </div>
    <div class="canvas-wrap">
      <canvas id="view" width="256" height="256"></canvas>
      <div class="hud">물 <b id="hudWater">0</b> · 안료 <b id="hudPig">0</b> · <span id="hudFps">–</span></div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <h2>붓 <span></span></h2>
      <div class="tools" id="tools">
        <button class="tool on" data-tool="color">채색<small>물+안료</small></button>
        <button class="tool" data-tool="water">맑은물<small>번짐</small></button>
        <button class="tool" data-tool="dry">갈필<small>마른붓</small></button>
        <button class="tool" data-tool="lift">닦기<small>흡수</small></button>
        <button class="tool" data-tool="salt">소금<small>별무늬</small></button>
        <button class="tool" data-tool="spatter">뿌리기<small>스퍼터</small></button>
        <button class="tool" data-tool="knife">나이프<small>유화</small></button>
        <button class="tool" data-tool="smear">스미어<small>끌기</small></button>
      </div>
      <div class="swatches" id="swatches"></div>
      <div class="row">
        <label>굵기</label>
        <input type="range" id="size" min="4" max="34" value="14">
        <output id="sizeOut">14</output>
      </div>
      <div class="row">
        <label>물량</label>
        <input type="range" id="wet" min="20" max="140" value="100">
        <output id="wetOut">1.0</output>
      </div>
      <div class="paper-sel" id="media" style="margin-top:12px">
        <button class="chip on" data-m="watercolor">수채</button>
        <button class="chip" data-m="ink">수묵</button>
        <button class="chip" data-m="gouache">과슈</button>
        <button class="chip" data-m="oil">유화</button>
        <button class="chip" data-m="acrylic">아크릴</button>
      </div>
    </div>

    <div class="card">
      <h2>종이 <span></span></h2>
      <div class="paper-sel" id="papers">
        <button class="chip on" data-p="watercolor">수채지</button>
        <button class="chip" data-p="hanji">한지</button>
        <button class="chip" data-p="kent">켄트지</button>
      </div>
      <div class="actions" style="margin-top:14px">
        <button class="btn" id="foldBtn">🦋 데칼코마니</button>
      </div>
      <div class="actions" style="margin-top:8px">
        <button class="btn warm" id="dryBtn">싹 말리기</button>
        <button class="btn" id="clearBtn">비우기</button>
      </div>
      <p class="note">
        <code>paint-core.js</code>(CPU) + <code>paint-gl.js</code>(WebGL2). §1 ①확산 ②이류 ②′드리프트 ③증발 ③′소금 ④침착 ⑤클램프.
        번진 뒤 <b style="color:var(--accent)">싹 말리기</b> = 커피링. <b style="color:var(--accent)">소금</b>은 젖었을 때 뿌리면 별무늬. <b style="color:var(--accent)">데칼코마니</b>는 젖은 상태에서.
        <br>URL <code>?cpu=1</code> = CPU·GL 나란히 비교.
      </p>
    </div>
  </aside>
</div>

<script src="./paint-core.js"></script>
<script src="./paint-gl.js"></script>
<script>
(function(){
  const PC = window.PaintCore;
  const GLNS = window.PaintGL;
  const S = 256;
  const params = new URLSearchParams(location.search);
  const wantGL = params.has('gl') || params.has('cpu');
  const compare = params.has('cpu');   // CPU·GL 나란히 비교(P-8)

  let paper = 'watercolor';
  let tool = 'color', color = 'blue', size = 14, wet = 1.0, drying = false;
  let media = 'watercolor', strokeDir = 0;

  // 팔레트 — KM 11색
  const COLORS = [
    ['yellow','#e8c93a'],['orange','#e88a2a'],['red','#d8402e'],
    ['lime','#8fc23a'],['green','#3a9d55'],['teal','#2ba69a'],
    ['blue','#2f6fd8'],['navy','#2b3f8a'],['violet','#7a4bc9'],
    ['brown','#8a5a34'],['black','#20242c']
  ];
  const swWrap = document.getElementById('swatches');
  COLORS.forEach(([k,hex])=>{
    const b=document.createElement('div');
    b.className='sw'+(k===color?' on':''); b.style.background=hex; b.dataset.c=k; b.title=k;
    swWrap.appendChild(b);
  });
  swWrap.addEventListener('click',e=>{ const t=e.target.closest('.sw'); if(!t)return;
    color=t.dataset.c; swWrap.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===t)); });
  document.getElementById('tools').addEventListener('click',e=>{ const t=e.target.closest('.tool'); if(!t)return;
    tool=t.dataset.tool; document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x===t)); });
  document.getElementById('papers').addEventListener('click',e=>{ const t=e.target.closest('.chip'); if(!t)return;
    paper=t.dataset.p; document.querySelectorAll('#papers .chip').forEach(x=>x.classList.toggle('on',x===t)); engines.forEach(en=>en.reset()); });
  document.getElementById('media').addEventListener('click',e=>{ const t=e.target.closest('.chip'); if(!t)return;
    media=t.dataset.m; document.querySelectorAll('#media .chip').forEach(x=>x.classList.toggle('on',x===t)); });
  document.getElementById('foldBtn').onclick=()=>engines.forEach(en=>en.fold&&en.fold());
  const sizeEl=document.getElementById('size'),sizeOut=document.getElementById('sizeOut');
  sizeEl.oninput=()=>{ size=+sizeEl.value; sizeOut.textContent=size; };
  const wetEl=document.getElementById('wet'),wetOut=document.getElementById('wetOut');
  wetEl.oninput=()=>{ wet=+wetEl.value/100; wetOut.textContent=wet.toFixed(1); };
  document.getElementById('clearBtn').onclick=()=>engines.forEach(en=>en.reset());
  const dryBtn=document.getElementById('dryBtn');
  dryBtn.onclick=()=>{ drying=!drying; dryBtn.classList.toggle('warm',drying); dryBtn.textContent=drying?'말리는 중…':'싹 말리기'; };

  // ── 엔진 어댑터
  function makeCPU(canvas){
    const ctx=canvas.getContext('2d'); const img=ctx.createImageData(S,S); const buf=new Uint8ClampedArray(S*S*4);
    let f=new PC.Field(S,S,{paperKind:paper,media:'watercolor',seed:20260708});
    return { kind:'cpu', canvas,
      reset(){ f=new PC.Field(S,S,{paperKind:paper,media:'watercolor',seed:20260708}); },
      stroke(x,y){
        const dcx=Math.cos(strokeDir), dcy=Math.sin(strokeDir), oil=(media==='oil'||media==='acrylic');
        if(tool==='water') f.waterBrush(x,y,size,wet);
        else if(tool==='lift') f.lift(x,y,size);
        else if(tool==='dry') f.colorBrush(x,y,size,1.0,color,media,{dry:true,density:1.2});
        else if(tool==='salt') f.saltBrush(x,y,Math.max(6,size));
        else if(tool==='spatter') f.spatter(x,y,strokeDir,color,media);
        else if(tool==='knife') f.knife(x,y,size,dcx,dcy);
        else if(tool==='smear') f.smear(x,y,size,dcx,dcy,wet);
        else if(oil) f.oilBrush(x,y,size,wet,color,media);
        else f.colorBrush(x,y,size,wet,color,media,{density:1.0});
      },
      fold(){ f.fold(); },
      step(){ f._local.fill(drying?0.005:0); f.step(media,{}); },
      paint(){ f.render(buf); img.data.set(buf); ctx.putImageData(img,0,0); },
      water(){return f.totalWater();}, pig(){return f.totalPigment();} };
  }
  function makeGL(canvas){
    const g=new GLNS.PaintGL(canvas,{paperKind:paper,media:'watercolor',size:S,seed:20260708});
    if(!g.supported) return null;
    return { kind:'gl', canvas, _g:g,
      reset(){ g.reset(paper,20260708); },
      stroke(x,y){
        const dcx=Math.cos(strokeDir), dcy=Math.sin(strokeDir), oil=(media==='oil'||media==='acrylic');
        if(tool==='water') g.brush('water',x,y,size,wet,color);
        else if(tool==='lift') g.brush('lift',x,y,size,1.0,color);
        else if(tool==='dry') g.brush('dry',x,y,size,1.0,color,{density:1.2});
        else if(tool==='salt') g.saltBrush(x,y,Math.max(6,size));
        else if(tool==='spatter') g.spatter(x,y,strokeDir,color);
        else if(tool==='knife') g.knife(x,y,size,dcx,dcy);
        else if(tool==='smear') g.smear(x,y,size,dcx,dcy,wet);
        else if(oil) g.oilBrush(x,y,size,wet,color);
        else g.brush('color',x,y,size,wet,color,{density:1.0});
      },
      fold(){ g.fold(); },
      step(){ g.setMedia(media); g.setDrying(drying); g.step(); },
      paint(){ g.render(); },
      water(){return NaN;}, pig(){return NaN;} };
  }

  // ── 캔버스 배치
  const wrap = document.querySelector('.canvas-wrap');
  const baseView = document.getElementById('view');
  const engines = [];
  function mkCanvas(label){
    const c=document.createElement('canvas'); c.width=S; c.height=S; c.className=baseView.className; c.style.cssText=baseView.style.cssText;
    const box=document.createElement('div'); box.style.cssText='display:flex;flex-direction:column;gap:6px;align-items:center';
    const lab=document.createElement('div'); lab.textContent=label; lab.style.cssText='font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;color:#7f8794';
    box.appendChild(c); box.appendChild(lab); return {c,box};
  }

  let hudSrc=null;
  if(compare){
    baseView.remove();
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:14px;flex-wrap:wrap;justify-content:center';
    const a=mkCanvas('CPU · 참조'); const b=mkCanvas('GL · 셰이더');
    row.appendChild(a.box); row.appendChild(b.box); wrap.appendChild(row);
    const cpu=makeCPU(a.c); engines.push(cpu); hudSrc=cpu;
    const gl=makeGL(b.c);
    if(gl){ engines.push(gl); } else { b.box.querySelector('div').textContent='GL 미지원(폴백)'; const cpu2=makeCPU(b.c); engines.push(cpu2); }
    [a.c,b.c].forEach(c=>bindInput(c));
  } else if(wantGL){
    const gl=makeGL(baseView);
    if(gl){ engines.push(gl); hudSrc=gl; }
    else { const cpu=makeCPU(baseView); engines.push(cpu); hudSrc=cpu;
      const n=document.querySelector('.note'); if(n) n.insertAdjacentHTML('afterbegin','<b style="color:var(--stain)">GL 미지원 기기 — CPU 폴백.</b> '); }
    bindInput(baseView);
  } else {
    const cpu=makeCPU(baseView); engines.push(cpu); hudSrc=cpu; bindInput(baseView);
  }

  // ── 입력 → 좌표(모든 활성 엔진에 동일 적용)
  let painting=false,lastX=0,lastY=0;
  function toField(canvas,e){ const r=canvas.getBoundingClientRect();
    return [ (e.clientX-r.left)/r.width*S, (e.clientY-r.top)/r.height*S ]; }
  function strokeAll(x,y){ engines.forEach(en=>en.stroke(x,y)); }
  function bindInput(canvas){
    canvas.addEventListener('pointerdown',e=>{ painting=true; const [x,y]=toField(canvas,e); lastX=x;lastY=y; strokeAll(x,y); e.preventDefault(); });
    canvas.addEventListener('pointermove',e=>{ if(!painting)return; const [x,y]=toField(canvas,e);
      const d=Math.hypot(x-lastX,y-lastY), n=Math.max(1,Math.floor(d/2));
      if(d>0.5) strokeDir=Math.atan2(y-lastY, x-lastX);
      if(tool!=='spatter'){ for(let s=1;s<=n;s++) strokeAll(lastX+(x-lastX)*s/n, lastY+(y-lastY)*s/n); }
      lastX=x;lastY=y; e.preventDefault(); });
  }
  window.addEventListener('pointerup',()=>painting=false);

  // ── 루프
  const hudW=document.getElementById('hudWater'),hudP=document.getElementById('hudPig'),hudF=document.getElementById('hudFps');
  let fpsT=performance.now(),fpsN=0;
  function loop(){
    engines.forEach(en=>{ en.step(); en.paint(); });
    fpsN++; const now=performance.now();
    if(now-fpsT>500){
      if(hudSrc){ const w=hudSrc.water(),p=hudSrc.pig();
        hudW.textContent=isNaN(w)?'GPU':w.toFixed(0); hudP.textContent=isNaN(p)?'GPU':p.toFixed(0); }
      hudF.textContent=Math.round(fpsN*1000/(now-fpsT))+'fps';
      fpsT=now; fpsN=0;
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

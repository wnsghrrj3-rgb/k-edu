<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이랩 과학실 2.0 — 조합형 현상 엔진</title>
<!--
  scilab_lab2.html — 케이랩 과학실 2.0 «조합형 현상 엔진 + 데이터 렌즈»
  SPEC_LAB2.md 양산. 단계 게이트 §1: [P1] 엔진 코어 ✅(45/45) → [P2] 렌더 어댑터 + 무대(스테이션 2) + 동사 조작 ← 현재.
  · 1층 순수 로직(window.KLab2)은 P1 그대로 — 렌더층은 상태필드 조회만(§2, 판단·물리 금지).
  · 프리미티브 전부 검증 원본 복사(§6): 기포·김=scilab.html / 얼음·뚜껑=states / 석출 InstancedMesh=dissolve /
    지시약 lerp=acid / 불꽃 2겹=burn / 물줄기 3안 ?stream=pour_test / oil 상층 원판=기존 조합.
  · 동시 활성 상한: 김 2 · 불꽃 2 · InstancedMesh 3(석출2+모래1). C-2 좌표: St0 x=−0.30 / St1 x=+0.30.
  ⚠️ 모든 수치는 SPEC_LAB2 확정값 — 창작 금지. 갭은 §1-④로 역반영.
-->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#5B9BF0; --orange:#FF8A3D; --green:#12B886; --purple:#9B7BF5;
    --ink:#1d2733; --hud:rgba(20,25,32,.74); --hudline:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:10px 16px;pointer-events:none;z-index:20}
  #topbar .title{color:#fff;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  #topbar .badge{background:var(--purple);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px}

  /* 관측 패널 (활성 스테이션) */
  #panel{position:fixed;top:50px;left:14px;z-index:20;background:var(--hud);
    backdrop-filter:blur(8px);border:1px solid var(--hudline);border-radius:16px;
    padding:13px 17px;color:#fff;min-width:172px}
  #stname{font-size:12px;color:#B9A7F8;margin-bottom:3px}
  #temp{font-size:30px;line-height:1.05}
  #temp small{font-size:15px;color:#9fb3c8}
  #temp.na{font-size:13px;color:#9fb3c8;line-height:1.5;padding:3px 0}
  #massline{font-size:12.5px;margin-top:5px;color:#FFD43B;min-height:16px}
  #stateline{font-size:12.5px;margin-top:5px;color:#ffd9a3;min-height:17px}

  /* 버튼 */
  #ctrls{position:fixed;top:50px;right:14px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .btn{font-family:'Gowun Dodum';font-size:14px;border:none;border-radius:13px;padding:10px 15px;
    cursor:pointer;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .12s}
  .btn:active{transform:scale(.95)}
  #fireBtn{background:linear-gradient(135deg,#FF8A3D,#F4511E)}
  #fireBtn.off{background:linear-gradient(135deg,#455A64,#37474F)}
  #fireBtn:disabled{opacity:.35;cursor:default}
  #stirBtn{background:rgba(91,155,240,.28);border:1px solid rgba(91,155,240,.55)}
  #stirBtn.on{background:linear-gradient(135deg,#5B9BF0,#1971C2)}
  #lidBtn{background:rgba(255,255,255,.14);border:1px solid var(--hudline);display:none}
  #resetBtn{background:rgba(255,255,255,.14);border:1px solid var(--hudline);font-size:12.5px}

  /* 스테이션 선택 + 물질 선반 + 기구 트레이 */
  #dock{position:fixed;bottom:0;left:0;right:0;z-index:22;
    background:linear-gradient(transparent, rgba(10,13,17,.88) 30%);padding-top:6px}
  #stsel{display:flex;gap:8px;justify-content:center;padding:4px 12px 6px}
  .stbtn{font-family:'Gowun Dodum';font-size:12.5px;border-radius:999px;padding:6px 14px;cursor:pointer;
    color:#9fb3c8;background:rgba(255,255,255,.07);border:1px solid var(--hudline);transition:all .15s}
  .stbtn.on{color:#fff;background:rgba(155,123,245,.30);border-color:#9B7BF5}
  #shelf{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 12px 6px;
    height:56px;align-items:center;justify-content:safe center}
  #shelf::-webkit-scrollbar{display:none}
  .sub{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);
    border:1px solid var(--hudline);border-radius:999px;padding:7px 13px;color:#dbe7f2;
    cursor:pointer;font-size:12.5px;user-select:none;transition:transform .13s}
  .sub:active{transform:scale(.92)}
  .sub .ic{font-size:17px}
  #tray{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:2px 12px 12px}
  #tray::-webkit-scrollbar{display:none}
  .eq{flex:0 0 auto;width:82px;background:rgba(255,255,255,.06);border:1px solid var(--hudline);
    border-radius:15px;padding:8px 6px 7px;text-align:center;color:#dbe7f2;cursor:pointer;
    backdrop-filter:blur(6px);transition:transform .13s,border-color .2s;user-select:none}
  .eq:active{transform:scale(.93)}
  .eq .ic{font-size:24px;line-height:1.15}
  .eq .nm{font-size:11px;margin-top:4px;line-height:1.25}
  .eq.shake,.sub.shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
    50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

  /* ═ 미션 UI (P4) ═ */
  #missionBtn{position:fixed;top:50px;right:14px;z-index:22;background:var(--hud);
    backdrop-filter:blur(8px);border:1px solid var(--hudline);border-radius:14px;
    color:#e9f2fb;font-size:13px;font-weight:700;padding:9px 15px;cursor:pointer;
    box-shadow:0 6px 22px rgba(0,0,0,.4)}
  #missionBtn:hover{background:rgba(255,255,255,.14)}
  #goalBar{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:21;
    display:none;max-width:min(560px,92vw);background:linear-gradient(135deg,rgba(30,40,56,.94),rgba(20,28,40,.94));
    backdrop-filter:blur(10px);border:1px solid rgba(120,180,255,.28);border-radius:16px;
    padding:11px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5);color:#eaf2fb}
  #goalBar.on{display:block}
  #goalBar .gTop{display:flex;align-items:center;gap:9px}
  #goalBar .gIcon{font-size:19px}
  #goalBar .gTitle{font-size:14.5px;font-weight:800;letter-spacing:.2px}
  #goalBar .gClose{margin-left:auto;background:rgba(255,255,255,.12);border:none;color:#cdd9e6;
    border-radius:9px;width:26px;height:26px;cursor:pointer;font-size:14px}
  #goalBar .gHint{font-size:12px;color:#a9c0d8;margin-top:5px;line-height:1.5}
  #goalBar .gProg{margin-top:8px;height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  #goalBar .gProgFill{height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#4fc3f7,#63e6be);transition:width .2s}
  .modalWrap{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(8,12,18,.62);backdrop-filter:blur(3px);padding:18px}
  .modalWrap.on{display:flex}
  #missionHome .mCard{width:min(640px,94vw);max-height:86vh;overflow-y:auto;
    background:linear-gradient(160deg,#141b26,#0e141d);border:1px solid var(--hudline);
    border-radius:22px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #missionHome h2{margin:0 0 4px;font-size:19px;color:#eaf2fb;letter-spacing:.3px}
  #missionHome .mSub{font-size:12.5px;color:#8ea6bf;margin-bottom:16px}
  #missionHome .mGroup{font-size:12px;font-weight:700;color:#6fd0b4;margin:16px 2px 8px;letter-spacing:.5px}
  #missionHome .mItem{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.05);
    border:1px solid var(--hudline);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer;
    transition:all .14s}
  #missionHome .mItem:hover{background:rgba(90,150,220,.16);border-color:rgba(120,180,255,.4);transform:translateY(-1px)}
  #missionHome .mItem .mIc{font-size:24px;line-height:1}
  #missionHome .mItem .mTt{font-size:14.5px;font-weight:800;color:#eef4fb}
  #missionHome .mItem .mBr{font-size:12px;color:#9fb6cd;margin-top:3px;line-height:1.5}
  #missionHome .mFree{margin-top:16px;text-align:center}
  #missionHome .mFree button{background:rgba(255,255,255,.08);border:1px solid var(--hudline);
    color:#cdd9e6;border-radius:12px;padding:10px 20px;cursor:pointer;font-size:13px}
  #predictCard .mCard,#successCard .mCard{width:min(440px,92vw);text-align:center;
    background:linear-gradient(160deg,#17202d,#0f151e);border:1px solid rgba(120,180,255,.3);
    border-radius:22px;padding:24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #predictCard .pQ{font-size:15px;font-weight:800;color:#eef4fb;line-height:1.55;margin-bottom:16px}
  #predictCard .pOpt{display:block;width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--hudline);
    color:#e6eef7;border-radius:14px;padding:13px 15px;margin-bottom:10px;cursor:pointer;font-size:13.5px;
    text-align:left;transition:all .14s}
  #predictCard .pOpt:hover{background:rgba(90,150,220,.18);border-color:rgba(120,180,255,.5)}
  #predictCard .pOpt.right{background:rgba(60,200,140,.22);border-color:#63e6be;color:#eafff5}
  #predictCard .pOpt.wrong{background:rgba(230,90,90,.18);border-color:#ff8a8a;opacity:.75}
  #predictCard .pExplain{display:none;font-size:13px;color:#cfe0ee;line-height:1.62;margin-top:6px;
    background:rgba(120,180,255,.1);border-radius:12px;padding:13px 14px;text-align:left}
  #predictCard .pExplain.on{display:block}
  #predictCard .pNext{display:none;margin-top:14px;background:linear-gradient(135deg,#4f80d8,#5a6de0);
    border:none;color:#fff;border-radius:12px;padding:11px 26px;cursor:pointer;font-size:13.5px;font-weight:700}
  #predictCard .pNext.on{display:inline-block}
  #successCard .sIcon{font-size:52px;margin-bottom:6px}
  #successCard .sTitle{font-size:20px;font-weight:900;color:#ffe08a;letter-spacing:.4px;margin-bottom:6px}
  #successCard .sBody{font-size:13px;color:#cfe0ee;line-height:1.6;margin-bottom:18px}
  #successCard .sBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #successCard .sBtns button{border:none;border-radius:12px;padding:11px 20px;cursor:pointer;font-size:13px;font-weight:700}
  #successCard .sMore{background:linear-gradient(135deg,#4f80d8,#5a6de0);color:#fff}
  #successCard .sFree{background:rgba(255,255,255,.1);color:#cdd9e6;border:1px solid var(--hudline)!important}
  #toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(255,255,255,.97);color:var(--ink);font-size:13.5px;padding:11px 17px;
    border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:88vw;text-align:center;
    line-height:1.55;transition:opacity .35s;border-left:5px solid var(--green)}
  #toast.warn{border-left-color:var(--orange)}
  #toast.hide{opacity:0;pointer-events:none}

  #loading{position:fixed;inset:0;z-index:50;background:#171b21;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cfe3f5;
    transition:opacity .5s}
  #loading .flask{font-size:44px;animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #loading.hide{opacity:0;pointer-events:none}

  /* ── 데이터 렌즈 (§7-2 · Canvas 2D · 좌하단 접이식) ── */
  #lens{position:fixed;left:14px;bottom:150px;z-index:21;width:300px;
    background:var(--hud);backdrop-filter:blur(8px);border:1px solid var(--hudline);
    border-radius:16px;padding:8px 11px;color:#fff}
  #lens.collapsed{width:auto}
  #lens.collapsed #lensBody{display:none}
  #lensHead{display:flex;align-items:center;gap:8px}
  #lensToggle{font-family:'Gowun Dodum';font-size:12.5px;color:#fff;background:none;border:none;
    cursor:pointer;padding:2px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  #lensToggle .chev{transition:transform .25s;font-size:10px;color:#B9A7F8}
  #lens.collapsed #lensToggle .chev{transform:rotate(180deg)}
  #lensSpan{margin-left:auto;font-family:'Gowun Dodum';font-size:10.5px;border-radius:999px;
    padding:3px 8px;cursor:pointer;color:#B9A7F8;background:rgba(155,123,245,.16);
    border:1px solid rgba(155,123,245,.4)}
  #lens.collapsed #lensSpan{display:none}
  #lensChans{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0 6px}
  .lch{flex:0 0 auto;font-family:'Gowun Dodum';font-size:11px;border-radius:999px;
    padding:3px 9px;cursor:pointer;color:#9fb3c8;background:rgba(255,255,255,.07);
    border:1px solid var(--hudline);transition:all .14s}
  .lch.on{color:#fff;border-color:currentColor}
  .lch.temp.on{color:#FF8A5C} .lch.vol.on{color:#4FC3F7} .lch.dissolved.on{color:#B197FC}
  .lch.o2.on{color:#63E6BE} .lch.mass.on{color:#FFD43B}
  #lensCanvas{display:block;width:100%;border-radius:9px;background:rgba(10,14,20,.55);cursor:crosshair}
  #lensTip{position:absolute;pointer-events:none;background:rgba(255,255,255,.97);color:var(--ink);
    font-size:11.5px;padding:6px 10px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);
    max-width:180px;line-height:1.45;transition:opacity .18s;border-left:4px solid var(--purple);z-index:23}
  #lensTip.hide{opacity:0}
  #lensTip .qz{pointer-events:auto}
  #lensTip:not(.hide){pointer-events:auto}
  #lens.hidden{display:none}

  /* ── §BRANCH P2. 타임라인 바(되돌리기·스크럽) — 렌즈 하단, 접힘/low 시 자동 숨김 ── */
  #timebar{margin-top:9px}
  #tbTrack{position:relative;height:26px;border-radius:8px;background:rgba(10,14,20,.55);
    border:1px solid var(--hudline);cursor:pointer;margin-bottom:6px;touch-action:none}
  #tbFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px 0 0 8px;
    background:rgba(155,123,245,.20);pointer-events:none}
  #tbHandle{position:absolute;top:-3px;left:0;width:4px;height:32px;border-radius:3px;
    background:var(--purple);box-shadow:0 0 8px rgba(155,123,245,.85);
    transform:translateX(-2px);pointer-events:none}
  .tbMk{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:12px;
    pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  #tbCtrl{display:flex;align-items:center;gap:7px}
  #tbResume{font-family:'Gowun Dodum';font-size:11.5px;border-radius:999px;padding:4px 12px;
    cursor:pointer;color:#fff;background:rgba(99,230,190,.18);border:1px solid rgba(99,230,190,.5);display:none}
  #tbResume.on{display:inline-block}
  #tbFork{font-family:'Gowun Dodum';font-size:11.5px;border-radius:999px;padding:4px 12px;
    cursor:pointer;color:#fff;background:rgba(255,138,92,.16);border:1px solid rgba(255,138,92,.45);display:none}
  #tbFork.on{display:inline-block}
  #tbTime{font-family:'Gowun Dodum';font-size:10.5px;color:#9fb3c8;margin-left:auto;white-space:nowrap}
  #lens.scrubbing #tbTrack{border-color:rgba(155,123,245,.7);box-shadow:0 0 0 1px rgba(155,123,245,.35)}

  @media (max-width:560px){
    #panel{top:auto;bottom:196px;padding:9px 12px;min-width:0}
    #temp{font-size:22px}
    .eq{width:74px} .eq .ic{font-size:21px}
    #lens{left:8px;right:8px;width:auto;bottom:150px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="topbar">
  <span class="title">🧪 케이랩 과학실 2.0</span>
  <span class="badge">조합형 실험실</span>
</div>

<div id="panel">
  <div id="stname">🅰 왼쪽 실험대</div>
  <div id="temp" class="na">온도계를 설치하면<br>온도가 보여요</div>
  <div id="massline"></div>
  <div id="stateline">먼저 <b>비커</b>를 놓아 봐요 — 모든 실험의 시작!</div>
</div>

<div id="ctrls">
  <button class="btn off" id="fireBtn" disabled>🔥 불 켜기</button>
  <button class="btn" id="stirBtn">🌀 젓기</button>
  <button class="btn" id="lidBtn">🫙 뚜껑 열기</button>
  <button class="btn" id="resetBtn">↺ 처음부터</button>
</div>

<div id="dock">
  <div id="stsel">
    <button class="stbtn on" id="stA">🅰 왼쪽 실험대</button>
    <button class="stbtn" id="stB">🅱 오른쪽 실험대</button>
  </div>
  <div id="shelf"></div>
  <div id="tray"></div>
</div>

<div id="lens" class="collapsed">
  <div id="lensHead">
    <button id="lensToggle"><span class="chev">▲</span>📊 데이터 렌즈</button>
    <button id="lensSpan">최근 60초</button>
  </div>
  <div id="lensBody">
    <div id="lensChans">
      <button class="lch temp on" data-ch="temp">온도</button>
      <button class="lch vol" data-ch="vol">부피</button>
      <button class="lch dissolved" data-ch="dissolvedTotal">녹은양</button>
      <button class="lch o2" data-ch="o2">산소</button>
      <button class="lch mass" data-ch="mass">무게</button>
    </div>
    <canvas id="lensCanvas"></canvas>
    <div id="timebar">
      <div id="tbTrack"><div id="tbFill"></div><div id="tbHandle"></div></div>
      <div id="tbCtrl">
        <button id="tbResume">▶ 지금으로</button>
        <button id="tbFork">🔀 여기서 갈라지기</button>
        <span id="tbTime"></span>
      </div>
    </div>
  </div>
  <div id="lensTip" class="hide"></div>
</div>

<button id="missionBtn">🎯 미션 · 도전</button>
<div id="goalBar">
  <div class="gTop"><span class="gIcon">🎯</span><span class="gTitle"></span>
    <button class="gClose" title="자유 모드로">✕</button></div>
  <div class="gHint"></div>
  <div class="gProg"><div class="gProgFill"></div></div>
</div>

<div id="missionHome" class="modalWrap">
  <div class="mCard">
    <h2>🧪 무엇을 실험해 볼까요?</h2>
    <div class="mSub">미션은 방법을 안내해요. 도전은 스스로 방법을 찾는 문제예요.</div>
    <div class="mGroup">📘 미션</div>
    <div id="mListMission"></div>
    <div class="mGroup">🏆 도전</div>
    <div id="mListChallenge"></div>
    <div class="mFree"><button id="mFreeBtn">✨ 그냥 자유롭게 실험할래요</button></div>
  </div>
</div>

<div id="predictCard" class="modalWrap">
  <div class="mCard">
    <div class="pQ"></div>
    <div class="pOpts"></div>
    <div class="pExplain"></div>
    <button class="pNext">계속 실험하기 →</button>
  </div>
</div>

<div id="successCard" class="modalWrap">
  <div class="mCard">
    <div class="sIcon">🏅</div>
    <div class="sTitle">성공!</div>
    <div class="sBody"></div>
    <div class="sBtns">
      <button class="sMore">다른 미션</button>
      <button class="sFree">자유 실험 계속</button>
    </div>
  </div>
</div>

<div id="loading"><div class="flask">⚗️</div><div>과학실 준비 중…</div></div>

<!-- ═════════ 순수 로직 (1층 엔진 — window.KLab2 · THREE 참조 0 · node 단독 실행) ═════════ -->
<script>
(function(){
  'use strict';

  /* ── §3. SUBSTANCES — 물질 DB (v1 7종, 수치 확정) ── */
  var SUBSTANCES = {
    water: { kind:'solvent', melt:0, boil:100, heatRate:3.4, coolRate:0.018,
             evapRate:0.011, meltRate:0.05, rest:-8, massK:160, col:0xBFE3F5 },
    salt:  { kind:'solute', limit:function(t){return Math.round(35+t*0.02);},
             spoonG:6, crystalCol:0xffffff },
    sugar: { kind:'solute', limit:function(t){return Math.round(18+t*0.6);},
             spoonG:8, crystalCol:0xF7F2E8 },
    sand:  { kind:'insoluble', spoonG:10, grainCol:0xC2A878 },
    oil:   { kind:'liquid', immiscible:true, floats:true, flammable:true, col:0xE8C56A, massK:130 },
    acid:  { kind:'liquid', ph:'acid', units:9, col:0xE03131, massK:160 },
    base:  { kind:'reagent', ph:'base', col:0x8FC7EE }
  };
  var IND_ACID='#E03131', IND_BASE='#1971C2';   // E-6 지시약 색 원본 — 중간색 금지

  /* 상수 (§4 확정) */
  var DT_CLAMP=0.05;
  var HEAT_RATE=3.4, COOL_RATE=0.018, HEAT_R=0.24;   // L-HEAT
  var MELT_RATE=0.05, MELT_VOL_K=0.25, EVAP_RATE=0.011, STEAM_CAP=0.4, LID_AUTO_OPEN=30; // L-PHASE
  var BUBBLE_GATE=60, STEAM_GATE=85;
  var VOL_REF=1.0, STIR_RATE=0.9, STILL_RATE=0.3, PRECIP_RATE=0.6;   // L-DISSOLVE (G-1)
  var ACID_CAP=14;                                                    // L-ACIDBASE
  var BURN_K=250, VREL_SMALL=20, VREL_LARGE=50, FLAME_MIN=0.25;       // L-BURN
  var POUR_RATE=0.22, TILT_ON=-0.55;                                  // L-MIX (기법 SPEC B-1)
  var COLLIG_BP=0.5, COLLIG_FP=2.0;                                   // L-COLLIG (10단위당)
  var VESSEL_TARE={ beaker:100, flask:90, dish:40 };   // ⟨역반영 §1-④⟩ SPEC 미명시 → 구현 확정(질량 불변 테스트는 절대값 무관)

  /* ── §5. Station 초기화 ── */
  function newContents(init){
    var c = { vol:0, temp:20, iceFrac:0, solutes:{}, layers:[], acidUnits:0,
              flame:{on:false, size:0, oilFire:false}, o2:100, evapAcc:0, trappedSteam:0,
              boiling:false, bubble:0, steam:0, colorHex:null, _k:0, _lidBoilT:0, _autoOpened:false };
    if(init) for(var key in init){
      if(key==='solutes'){ for(var s in init.solutes){ c.solutes[s]={ spoons:init.solutes[s].spoons||0, dissolved:init.solutes[s].dissolved||0 }; } }
      else if(key==='layers'){ c.layers = init.layers.map(function(l){return {sub:l.sub, vol:l.vol};}); }
      else c[key]=init[key];
    }
    return c;
  }
  function newStation(init){
    init=init||{};
    return { vessel:init.vessel||null, lid:!!init.lid, thermo:!!init.thermo, scale:!!init.scale,
             contents:newContents(init.contents) };
  }

  /* heatK: 램프가 이 스테이션을 가리키고 점화 중이면 거리 비례(0~1) */
  function heatK(world, idx){
    var L=world.lamp;
    if(L.station!==idx || !L.lit) return 0;
    var k = 1 - L.dist/HEAT_R;
    return k<0?0:(k>1?1:k);
  }

  /* ── §4. LAWS — 고정 순서 파이프라인 ── */

  // L-HEAT: 열 출입 (전이 고정 구간 제외)
  function lHeat(st, dt, world, idx){
    var c=st.contents, k=heatK(world, idx);
    c._k = k;
    var melting = c.iceFrac>0 && c.temp>=0;
    var boiling = c.temp>=99.9 && k>0;
    if(melting || boiling) return;      // 잠열 구간 — L-PHASE가 온도 고정
    var rest = c.iceFrac>0 ? -8 : 20;
    c.temp += (HEAT_RATE*k - (c.temp-rest)*COOL_RATE)*dt;
  }

  // L-PHASE: 상태변화(잠열 고정) + 증발/밀폐
  function lPhase(st, dt, world){
    var c=st.contents, k=c._k;
    // 융해
    if(c.iceFrac>0 && c.temp>=0){
      c.temp=0;
      var dm=MELT_RATE*k*dt; if(dm>c.iceFrac) dm=c.iceFrac;
      c.iceFrac-=dm; c.vol+=MELT_VOL_K*dm;
    }
    // 끓음
    if(c.temp>=99.9 && k>0){
      c.temp=100; c.boiling=true;
      if(!st.lid){
        var dv=EVAP_RATE*k*dt; if(dv>c.vol) dv=c.vol;
        c.vol-=dv; c.evapAcc+=dv;
        c._lidBoilT=0;
      } else {
        // 밀폐: 증발 정지 → 부피·총질량 불변(창발②). steam은 김서림 연출만(질량 무관)
        c.steam = Math.min(STEAM_CAP, c.steam + EVAP_RATE*k*dt*2);
        c._lidBoilT += dt;
        if(c._lidBoilT>=LID_AUTO_OPEN){ st.lid=false; c._autoOpened=true; c._lidBoilT=0; }
      }
    } else {
      c.boiling=false;
      if(!st.lid) c._lidBoilT=0;
    }
    // bubble/steam 게이트 (관측 파생)
    c.bubble = c.temp>=BUBBLE_GATE ? Math.min(1,(c.temp-BUBBLE_GATE)/40) : 0;
    if(!st.lid) c.steam = c.temp>=STEAM_GATE ? Math.min(STEAM_CAP,(c.temp-STEAM_GATE)/15*STEAM_CAP) : 0;
  }

  // L-DISSOLVE: 용해·석출 (G-1 부피 비례 — 창발의 열쇠)
  function lDissolve(st, dt, world){
    var c=st.contents;
    for(var sub in c.solutes){
      var S=SUBSTANCES[sub]; if(!S || S.kind!=='solute') continue;
      var so=c.solutes[sub];
      var totalG = so.spoons*S.spoonG;
      var lim_eff = S.limit(c.temp) * (c.vol / VOL_REF);   // ★G-1
      if(c.vol<=0.0001){ // 물이 없으면 전량 석출
        so.dissolved=0; continue;
      }
      if(so.dissolved < lim_eff && so.dissolved < totalG){
        var room = Math.min(lim_eff, totalG) - so.dissolved;
        var rate = (c.stir?STIR_RATE:STILL_RATE)*dt;
        so.dissolved += Math.min(room, rate);
      } else if(so.dissolved > lim_eff){
        so.dissolved -= PRECIP_RATE*dt;
        if(so.dissolved<lim_eff) so.dissolved=lim_eff;
        if(so.dissolved<0) so.dissolved=0;
      }
    }
  }

  // L-ACIDBASE: 중화 (색 스냅·중간색 금지)
  function lAcidBase(st, dt, world){
    var c=st.contents;
    if(c.acidUnits>0){ c.colorHex=IND_ACID; }
    else if(c._hadAcid){ c.colorHex=IND_BASE; }
  }

  // L-BURN: 연소·산소 (밀폐 반비례 소진)
  function lBurn(st, dt, world){
    var c=st.contents, f=c.flame;
    if(!f.on) return;
    if(st.lid){
      var Vrel = st._cupSize==='large'?VREL_LARGE:VREL_SMALL;
      c.o2 -= (BURN_K/Vrel)*dt;
      if(c.o2<0) c.o2=0;
      if(c.o2<=0){ f.on=false; f.size=0; c._flameOut=true; return; }
    }
    f.size = Math.max(FLAME_MIN, c.o2/100);
  }

  // L-MIX: 옮기기(pour) — world.act(pour)에서 처리. 여기선 층 분리 파생만.
  function lMix(st, dt, world){
    var c=st.contents;
    // oil 층: immiscible → 상층 플래그(렌더용, P2)
    c._hasOilLayer = c.layers.some(function(l){return l.sub==='oil' && l.vol>0;});
  }

  // L-COLLIG: 총괄성 (기본 OFF, world.opts.collig)
  function lCollig(st, dt, world){
    if(!world.opts || !world.opts.collig) return;
    var c=st.contents, units=0;
    for(var sub in c.solutes){ units += c.solutes[sub].spoons; }
    // bp/fp 이동 — L-PHASE 게이트에 반영되도록 파생 저장
    c._bpShift = COLLIG_BP*(units/10);
    c._fpShift = -COLLIG_FP*(units/10);
  }

  // 파생 계산: 질량·용해총량·석출총량
  function derive(st){
    var c=st.contents, S;
    var mass = (c.vessel && VESSEL_TARE[c.vessel]) || (st.vessel && VESSEL_TARE[st.vessel]) || 0;
    var dissolvedTotal=0, precipTotal=0;
    for(var sub in c.solutes){
      S=SUBSTANCES[sub];
      var so=c.solutes[sub], totalG=so.spoons*S.spoonG;
      mass += totalG;
      dissolvedTotal += so.dissolved;
      precipTotal += Math.max(0, totalG - so.dissolved);
    }
    for(var i=0;i<c.layers.length;i++){
      var Ls=SUBSTANCES[c.layers[i].sub];
      mass += c.layers[i].vol * (Ls && Ls.massK || 0);
    }
    mass += c.vol*SUBSTANCES.water.massK;
    mass += c.trappedSteam*SUBSTANCES.water.massK;   // 밀폐 증기 질량 포함 → 총질량 불변
    c.mass = mass; c.dissolvedTotal=dissolvedTotal; c.precipTotal=precipTotal;
    return c;
  }

  var LAWS = [lHeat, lPhase, lDissolve, lAcidBase, lBurn, lMix, lCollig];

  /* ── §7-1. Recorder (순수 로직 1층) ── */
  var SAMPLE_DT=0.25, REC_CAP=480, PLATEAU_WIN=2.0, PLATEAU_EPS=0.15;
  function newRecorder(nStations){
    var chans=[]; for(var i=0;i<nStations;i++) chans.push([]);
    return { chans:chans, markers:[], _acc:0, _plateauBuf:[] };
  }
  function recSample(world){
    var R=world.recorder; if(!R) return;
    for(var i=0;i<world.stations.length;i++){
      var st=world.stations[i]; derive(st); var c=st.contents;
      var buf=R.chans[i];
      buf.push({ t:world.t, temp:c.temp, vol:c.vol, dissolvedTotal:c.dissolvedTotal||0,
                 precipTotal:c.precipTotal||0, o2:c.o2, mass:c.mass||0, tag:phaseTag(st) });
      if(buf.length>REC_CAP){        // 2:1 다운샘플 (짝수 인덱스 유지)
        var ds=[]; for(var j=0;j<buf.length;j+=2) ds.push(buf[j]); R.chans[i]=ds;
      }
    }
  }
  // 이벤트 마커: 전이(상승/하강 엣지)를 결정론적으로 감지 → R.markers (SPEC §7-1)
  function detectMarkers(world){
    var R=world.recorder; if(!R) return;
    if(!world._mkPrev){
      world._mkPrev=[]; for(var a=0;a<world.stations.length;a++)
        world._mkPrev.push({ boiling:false, ice:false, flip:false, flameOn:false, flameOut:false });
      world._mkLamp=false;
    }
    for(var i=0;i<world.stations.length;i++){
      var c=world.stations[i].contents, p=world._mkPrev[i];
      var ice=(c.iceFrac||0)>0.001, flameOn=!!(c.flame&&c.flame.on), flameOut=!!c._flameOut, flip=!!c._flip;
      if(c.boiling && !p.boiling) R.markers.push({ t:world.t, type:'boilStart', station:i });
      if(!ice && p.ice)           R.markers.push({ t:world.t, type:'meltEnd',   station:i });
      if(flip && !p.flip)         R.markers.push({ t:world.t, type:'flip',      station:i });
      if(flameOn && !p.flameOn)   R.markers.push({ t:world.t, type:'ignite',    station:i });
      if(flameOut && !p.flameOut) R.markers.push({ t:world.t, type:'out',       station:i });
      p.boiling=c.boiling; p.ice=ice; p.flip=flip; p.flameOn=flameOn; p.flameOut=flameOut;
    }
    var lampLit=!!(world.lamp&&world.lamp.lit);
    if(lampLit && !world._mkLamp && world.lamp.station>=0)
      R.markers.push({ t:world.t, type:'ignite', station:world.lamp.station });
    world._mkLamp=lampLit;
  }
  // 플래토 감지: heatK>0 && 창 2.0s 내 |Δtemp|<0.15 (station 0 기준 반환, 다채널은 호출측)
  function detectPlateau(buf, k){
    if(k<=0 || buf.length<2) return false;
    var last=buf[buf.length-1], t1=last.t-PLATEAU_WIN, lo=last.temp, hi=last.temp, found=false;
    for(var i=buf.length-1;i>=0;i--){
      if(buf[i].t<t1) break;
      if(buf[i].temp<lo)lo=buf[i].temp; if(buf[i].temp>hi)hi=buf[i].temp; found=true;
    }
    return found && (hi-lo)<PLATEAU_EPS;
  }
  function phaseTag(st){
    var c=st.contents;
    if(c.iceFrac>0 && c.temp<=0.01) return 'melting';
    if(c.boiling) return 'boiling';
    if(c._flameOut) return 'out';
    if((c.precipTotal||0)>0.01) return 'precip';
    if(c.acidUnits===0 && c._hadAcid) return 'neutral';
    if(c._k>0) return 'heating';
    return 'idle';
  }

  /* ── §5/§8. World + 동사(act) + 술어 평가기 ── */
  function createWorld(opts){
    var world = {
      stations:[ newStation(), newStation() ],
      lamp:{ station:-1, lit:false, dist:0 },
      t:0, actionLog:[], opts:opts||{},
      recorder:null, _recAcc:0
    };
    world.recorder = newRecorder(world.stations.length);

    world.step = function(dt){
      if(dt>DT_CLAMP) dt=DT_CLAMP;
      world.t += dt;
      for(var i=0;i<world.stations.length;i++){
        var st=world.stations[i];
        for(var L=0;L<LAWS.length;L++) LAWS[L](st, dt, world, i);
        derive(st);
      }
      // 레코더 샘플링 (SAMPLE_DT 간격) + 이벤트 마커 전이 감지(매 step)
      detectMarkers(world);
      world._recAcc += dt;
      while(world._recAcc >= SAMPLE_DT){ world._recAcc -= SAMPLE_DT; recSample(world); }
      return world;
    };

    // _apply: 순수 상태 적용(로그 없음 — 리플레이 재적용 경로). act = 로그 push + _apply 위임.
    world._apply = function(verb, args){
      args=args||{};
      var st = (args.st!=null) ? world.stations[args.st] : null;
      switch(verb){
        case 'placeVessel': st.vessel=args.type; st.contents.vessel=args.type; break;
        case 'placeLid':    st.lid=true; break;
        case 'removeLid':   st.lid=false; break;
        case 'placeThermo': st.thermo=true; break;
        case 'placeScale':  st.scale=true; break;
        case 'moveLamp':    world.lamp.station=args.st; world.lamp.dist=(args.dist!=null?args.dist:0); break;
        case 'ignite':      world.lamp.lit=!!args.on; break;
        case 'addSpoon': {
          var sub=args.sub; if(!st.contents.solutes[sub]) st.contents.solutes[sub]={spoons:0,dissolved:0};
          st.contents.solutes[sub].spoons += (args.n||1); break;
        }
        case 'addWater':    st.contents.vol += (args.vol||0); break;
        case 'addLiquid': {
          var L2=args.sub;
          if(L2==='acid'){ st.contents.acidUnits=SUBSTANCES.acid.units; st.contents._hadAcid=true; st.contents.vol+=(args.vol||0.3); st.contents.colorHex=IND_ACID; }
          else if(L2==='oil'){ st.contents.layers.push({sub:'oil', vol:(args.vol||0.3)}); }
          else st.contents.vol += (args.vol||0.3);
          break;
        }
        case 'addIce':      st.contents.iceFrac += (args.frac||1); break;
        case 'stir':        st.contents.stir=!!args.on; break;
        case 'dropBase': {
          var n=args.drops||1;
          st.contents.acidUnits = Math.max(0, Math.min(ACID_CAP, st.contents.acidUnits) - n);
          if(st.contents.acidUnits===0 && st.contents._hadAcid){ st.contents.colorHex=IND_BASE; st.contents._flip=true; }
          break;
        }
        case 'coverCup':    st.lid=true; st._cupSize=args.size||'small'; break;
        case 'ignflame':    st.contents.flame.on=true; st.contents.flame.size=1;
                            if(st.contents.layers.some(function(l){return l.sub==='oil'&&l.vol>0;})) st.contents.flame.oilFire=true; break;
        case 'pour': {
          var A=world.stations[args.from], B=world.stations[args.to];
          var layerVol=A.contents.layers.reduce(function(s,l){return s+l.vol;},0);
          var totalLiq=A.contents.vol + layerVol;
          var give=Math.min(args.amount!=null?args.amount:totalLiq, totalLiq);
          var frac = totalLiq>0 ? give/totalLiq : 0;
          // 물(용매) 이동 — 수위 보존
          var giveVol=A.contents.vol*frac;
          A.contents.vol-=giveVol; B.contents.vol+=giveVol;
          // 용질 동반 이동(농도 보존)
          for(var s in A.contents.solutes){
            if(!B.contents.solutes[s]) B.contents.solutes[s]={spoons:0,dissolved:0};
            var mv=A.contents.solutes[s].spoons*frac;
            A.contents.solutes[s].spoons-=mv; B.contents.solutes[s].spoons+=mv;
            var mvd=A.contents.solutes[s].dissolved*frac;
            A.contents.solutes[s].dissolved-=mvd; B.contents.solutes[s].dissolved+=mvd;
          }
          // oil 등 immiscible 층 이동
          for(var li=0;li<A.contents.layers.length;li++){
            var lv=A.contents.layers[li].vol*frac;
            A.contents.layers[li].vol-=lv;
            B.contents.layers.push({sub:A.contents.layers[li].sub, vol:lv});
          }
          break;
        }
      }
      return world;
    };
    world.act = function(verb, args){
      args=args||{};
      world.actionLog.push({ t:world.t, verb:verb, args:JSON.parse(JSON.stringify(args)) });
      return world._apply(verb, args);
    };

    // 술어 평가기 (§8) — op: >= <= == flag
    world.evalGoal = function(goal){
      if(!goal || !goal.all) return false;
      return goal.all.every(function(p){
        var st=world.stations[p.st!=null?p.st:0], c=st.contents; derive(st);
        var val;
        switch(p.ch){
          case 'temp': val=c.temp; break;
          case 'vol': val=c.vol; break;
          case 'dissolvedTotal': val=c.dissolvedTotal||0; break;
          case 'precipTotal': val=c.precipTotal||0; break;
          case 'o2': val=c.o2; break;
          case 'mass': val=c.mass||0; break;
          case 'acidUnits': val=c.acidUnits; break;
          case 'flag': return !!c[p.v];   // flag: contents 필드명 진리값
          case 'lidClosed': return !!st.lid;   // station-level: 뚜껑 닫힘(무게 불변 도전)
          default: val=c[p.ch];
        }
        switch(p.op){
          case '>=': return val>=p.v;
          case '<=': return val<=p.v;
          case '==': return Math.abs(val-p.v)<1e-6;
          case '>':  return val>p.v;
          case '<':  return val<p.v;
          default: return false;
        }
      });
    };

    return world;
  }

  /* ── §BRANCH(P5). 리플레이·포크 코어 (순수 로직 — LAB2 계약 위, 신규 물리 0) ──
     · replayTo(opts, actionLog, τ, dt) = createWorld(opts) 후 t≤τ 액션 재적용하며 고정 dt step 배치
       (틱 인덱스 = round(t/dt)로 매칭 — 부동소수 누적오차 방지, 결정론 재현)
     · fork(actionLog, τ) = {logA: 원본 전체(격리 복제), logB: t≤τ 절단본} — B 조작이 A에 불침투
     · branchCanAct(addedCount, free) = 통제변인 게이트(분기 후 동사 1회만 / free 해제) */
  var REPLAY_DT = 0.05;
  function _cloneLog(log){
    var out=[];
    for(var i=0;i<log.length;i++) out.push({ t:log[i].t, verb:log[i].verb, args:JSON.parse(JSON.stringify(log[i].args)) });
    return out;
  }
  function replayTo(opts, actionLog, tau, dt){
    dt = dt || REPLAY_DT;
    var w = createWorld(opts);
    var tauTick = Math.round(tau/dt);
    var byTick = {};
    for(var j=0;j<actionLog.length;j++){
      var tk = Math.round(actionLog[j].t/dt);
      if(tk>tauTick) continue;
      (byTick[tk] || (byTick[tk]=[])).push(actionLog[j]);
    }
    // 틱 k: [그 틱에 예정된 액션 적용] → step(dt). 마지막 틱(τ 경계)은 액션만 적용(step 없음).
    for(var k=0;k<tauTick;k++){
      var A=byTick[k]; if(A) for(var m=0;m<A.length;m++) w._apply(A[m].verb, A[m].args);
      w.step(dt);
    }
    var last=byTick[tauTick]; if(last) for(var n=0;n<last.length;n++) w._apply(last[n].verb, last[n].args);
    w._replaySteps = tauTick;   // 배치 스텝 수 검산용(§5)
    return w;
  }
  function fork(actionLog, tau, dt){
    dt = dt || REPLAY_DT;
    var tauTick = Math.round(tau/dt);
    var logB=[];
    for(var i=0;i<actionLog.length;i++) if(Math.round(actionLog[i].t/dt)<=tauTick) logB.push(actionLog[i]);
    var b=_cloneLog(logB);
    return { logA:_cloneLog(actionLog), logB:b, forkTick:tauTick, baseLen:b.length };
  }
  // 통제변인 게이트: 분기 후 추가 동사 수(addedCount), free=?free_branch → 다음 동사 허용?
  function branchCanAct(addedCount, free){ return !!free || addedCount < 1; }

  /* ── §8/§9. 미션 = 순수 JSON + 러너 ──
     · 술어 goal.all[*] = {ch,st,op,v,sustain} — evalGoal(단일 시점) 위에 sustain(연속 충족) 판정
     · E-1 물 끓이기 재표현(플랫폼 증명 — 기존 미션이 데이터로 환원됨) + 도전 카드 3종(§8 자유 모드 교육 통제)
     · predictions[*] = {at:이벤트명(마커 타입), q, opts, answer, explain} — 예측→관측→설명 */
  var MISSIONS = [
    // ── E-1 물 끓이기 재표현 (미션 모드 대표) ──
    { id:'boil_water', kind:'mission', icon:'💧', title:'물을 끓여라',

              lamp:{ pre:'beaker', msg:'데울 비커부터 놓아요' } },
      predictions:[ { at:'boilStart',
          q:'물이 팔팔 끓기 시작했어요. 계속 세게 데우면 온도는?',

          explain:'끓는 동안 열은 물을 수증기로 바꾸는 데 다 쓰여요. 그래서 물이 다 끓어 없어질 때까지 온도는 100℃에 멈춰 있어요(끓는점).',
          wowGrade:'mid' } ],
      goal:{ all:[ {ch:'temp', st:0, op:'>=', v:99.9, sustain:2} ] } },

    // ── 도전 카드 3종 (자유 모드의 안내된 발견) ──
    { id:'sea_salt', kind:'challenge', icon:'🧂', title:'바닷물에서 소금을 꺼내라',
      brief:'소금물을 끓이면 소금을 되찾을 수 있을까요? 소금 녹인 물을 끝까지 끓여 보세요.',
      hint:'비커에 물 → 소금을 여러 숟갈 → 램프로 물이 줄도록 계속 끓이기',

  function missionById(id){
    for(var i=0;i<MISSIONS.length;i++) if(MISSIONS[i].id===id) return MISSIONS[i];

  }
  function goalMaxSustain(goal){
    if(!goal || !goal.all) return 0;
    var mx=0; for(var i=0;i<goal.all.length;i++){ var s=goal.all[i].sustain||0; if(s>mx) mx=s; }
    return mx;
  }
  // 미션 러너: world.step은 밖에서 돌리고, 여기선 판정+예측 발화만(순수·결정론)
  function createMissionRun(world, mission){
    return {
      mission:mission, done:false, _hold:0, _need:goalMaxSustain(mission.goal),
      _seenMk:0, fired:{},
      // 목표 충족 연속 시간 누적 → sustain 도달 시 done
      tick:function(dt){
        var okNow = world.evalGoal(mission.goal);
        if(okNow) this._hold += dt; else this._hold = 0;
        if(okNow && this._hold >= this._need) this.done = true;
        return this.done;
      },
      // 새 이벤트 마커 중 predictions.at와 매칭되는 미발화 예측 1개 반환(없으면 null)

        var R=world.recorder, preds=mission.predictions||[];

        for(; this._seenMk<R.markers.length; this._seenMk++){
          var mk=R.markers[this._seenMk];
          for(var p=0;p<preds.length;p++){
            if(preds[p].at===mk.type && !this.fired[p]){ this.fired['p'+p]=true; this.fired[p]=true; return preds[p]; }
          }
        }
        return null;
      },
      progress:function(){ return this._need>0 ? Math.min(1, this._hold/this._need) : (this.done?1:0); }
    };
  }

/* 액체 (filter makeLiquid — 실린더 + scale.y 수위 + 착수 리플) */
function makeLiquid(rTop, rBot, h0, hex, atten){
  const geo=new THREE.CylinderGeometry(rTop, rBot, h0, 48, 1, false);
  const base=geo.attributes.position.array.slice();
  const mat=waterMat(hex); if(atten!=null) mat.attenuationDistance=atten;
  const mesh=new THREE.Mesh(geo, mat); mesh.renderOrder=1;
  function layout(vol){
    const h=h0*Math.max(vol,0);
    mesh.scale.y=Math.max(vol,0.0001);
    mesh.position.y=0.004+h/2;
    mesh.visible = vol>0.001;
    return 0.004+h;
  }
  function ripple(t,amp){
    const pos=geo.attributes.position, arr=pos.array, topHalf=h0/2-0.0001;
    for(let i=0;i<arr.length;i+=3){
      if(base[i+1]>=topHalf){
        const x=base[i], z=base[i+2];
        arr[i+1]=base[i+1]+amp*Math.sin(t*4.2+x*55+z*47)+amp*0.6*Math.sin(t*6.8+x*90-z*60);
      }
    }
    pos.needsUpdate=true; geo.computeVertexNormals();
  }
  return { mesh, geo, mat, layout, ripple, h0 };
}

/* 석출 InstancedMesh (E-4 검증 — 불투명 필수·transmission 금지) */
function makePrecip(count, per, colorHex, radius, spreadR, y0, layerN){
  const dummy=new THREE.Object3D();
  const target=new Float32Array(count), cur=new Float32Array(count);
  const geo=new THREE.OctahedronGeometry(radius, 0);
  const mat=new THREE.MeshStandardMaterial({color:colorHex, roughness:0.35, metalness:0});
  const mesh=new THREE.InstancedMesh(geo, mat, count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const pos=[];
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*spreadR;
    const layer=Math.floor(i/layerN);
    pos.push({ x:Math.cos(a)*r, z:Math.sin(a)*r, y:y0+layer*radius*1.4+Math.random()*radius,
               rx:Math.random()*Math.PI, ry:Math.random()*Math.PI });
    dummy.position.set(0,-1,0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate=true; mesh.visible=false;
  function update(ratio, dt){
    const showN=Math.min(count, Math.floor(ratio*per));
    mesh.visible = showN>0;
    for(let i=0;i<count;i++){
      target[i]=(i<showN)?1:0;
      cur[i]+=(target[i]-cur[i])*Math.min(dt*5,1);
      if(cur[i]<0.001 && target[i]===0) cur[i]=0;
      const p=pos[i];
      dummy.position.set(p.x,p.y,p.z); dummy.rotation.set(p.rx,p.ry,0);
      dummy.scale.setScalar(cur[i]<0.001?0.001:cur[i]); dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate=true;
    return showN;
  }
  function reset(){ for(let i=0;i<count;i++){ target[i]=0; cur[i]=0; } mesh.visible=false; }
  return { mesh, update, reset };
}

  // 스테이션 표시 패드 (탭 = 스테이션 선택)
  const pad=new THREE.Mesh(new THREE.CircleGeometry(0.15,40),
    new THREE.MeshStandardMaterial({color:0x1e242c, roughness:0.85, transparent:true, opacity:0.85}));
  pad.rotation.x=-Math.PI/2; pad.position.y=0.001; pad.receiveShadow=true; grp.add(pad);
  const padRing=new THREE.Mesh(new THREE.RingGeometry(0.145,0.155,48),
    new THREE.MeshBasicMaterial({color:0x9B7BF5, transparent:true, opacity:0.0, side:THREE.DoubleSide}));
  padRing.rotation.x=-Math.PI/2; padRing.position.y=0.0015; grp.add(padRing);

  // 용기 3종 미리 생성(숨김) + 용기별 액체
  const vg={}, liq={};
  for(const type in VESSELS){
    const V=VESSELS[type];
    const g=V.build(); g.visible=false; g.position.y=0.005; grp.add(g);
    vg[type]=g;
    const L=makeLiquid(V.liq[0],V.liq[1],V.liq[2], 0x5FB9E8, GLASS_ATT); // 황금 물색
    L.layout(0); g.add(L.mesh); liq[type]=L;
  }

  /* ── 페노메나 킷 (스테이션당 1세트 — 활성 용기에 재부모화) ── */
  const kit=new THREE.Group(); kit.visible=false;

  // 기포 (황금 샘플 CPU Points)
  const bGeo=new THREE.BufferGeometry();
  const bPos=new Float32Array(B_N*3), bMeta=[];
  for(let i=0;i<B_N;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*(BK_R-0.03);
    bMeta.push({x:Math.cos(a)*r, z:Math.sin(a)*r, sp:0.6+Math.random()*0.8, y:Math.random()});
    bPos[i*3+1]=-999;
  }
  bGeo.setAttribute('position', new THREE.BufferAttribute(bPos,3));
  const bubbles=new THREE.Points(bGeo, new THREE.PointsMaterial({
    color:0xeaf7ff, size:0.0105, transparent:true, opacity:0.85,
    depthWrite:false, depthTest:false, sizeAttenuation:true
  }));
  bubbles.frustumCulled=false; bubbles.renderOrder=10; kit.add(bubbles);

  // 김 (황금 샘플 GPU 셰이더 Points)
  const sGeo=new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(S_N*3),3));
  const seeds=new Float32Array(S_N);
  for(let i=0;i<S_N;i++) seeds[i]=Math.random();
  sGeo.setAttribute('aSeed', new THREE.BufferAttribute(seeds,1));
  const steamUni={ uTime:{value:0}, uIntensity:{value:0}, uScale:{value:innerHeight*0.5} };
  const steam=new THREE.Points(sGeo, new THREE.ShaderMaterial({
    uniforms:steamUni, transparent:true, depthWrite:false,
    vertexShader:`
      attribute float aSeed;
      uniform float uTime,uIntensity,uScale;
      varying float vA;
      float h(float n){return fract(sin(n)*43758.5453);}
      void main(){
        float sp=mix(0.55,1.0,h(aSeed*7.13));
        float life=fract(uTime*0.26*sp+aSeed);
        float ang=h(aSeed*3.31)*6.28318;
        float r0=h(aSeed*9.71)*0.05;
        vec3 p=vec3(cos(ang)*r0,0.0,sin(ang)*r0);
        p.y+=life*0.52;
        p.x+=sin(uTime*1.25+aSeed*21.0)*(0.015+0.09*life)+life*life*0.04;
        p.z+=cos(uTime*1.05+aSeed*13.0)*(0.015+0.07*life);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        vA=smoothstep(0.0,0.15,life)*(1.0-life)*uIntensity;
        gl_PointSize=mix(0.05,0.30,life)*uScale/max(-mv.z,0.1);
      }`,
    fragmentShader:`
      varying float vA;
      void main(){
        float d=length(gl_PointCoord-0.5);
        gl_FragColor=vec4(0.93,0.95,0.98, smoothstep(0.5,0.06,d)*vA*0.34);
      }`
  }));
  steam.frustumCulled=false; kit.add(steam);

  // 얼음 3조각 (states — 불투명·투명인간 함정 회피)
  const iceMat=new THREE.MeshPhysicalMaterial({
    color:0xEAF6FF, roughness:0.25, clearcoat:0.6, clearcoatRoughness:0.2,
    metalness:0, envMapIntensity:1.2 });
  const icePos=[[-0.025,0.015],[0.028,-0.016],[0.0,0.032]];
  const iceCubes=[];
  for(let i=0;i<3;i++){
    const sz=0.042+Math.random()*0.01;
    const cube=new THREE.Mesh(new THREE.BoxGeometry(sz,sz*0.8,sz), iceMat);
    cube.position.set(icePos[i][0], 0.03, icePos[i][1]);
    cube.rotation.set(Math.random()*0.5, Math.random()*Math.PI, Math.random()*0.5);
    cube.castShadow=true; cube.userData.sz=sz; cube.visible=false;
    kit.add(cube); iceCubes.push(cube);
  }

  // 석출 결정 (E-4 원본 매핑: OctahedronGeometry r0.004 · showN = precip×12)
  const precip=makePrecip(300, 300, 0xffffff, 0.004, BK_R-0.035, 0.008, 40);
  kit.add(precip.mesh);

  // 기름 상층 원판 (§6 신규 조합 — 프리미티브는 기존 실린더+waterMat)
  const oilMat=waterMat(0xE8C56A); oilMat.attenuationDistance=0.05;
  const oilDisc=new THREE.Mesh(new THREE.CylinderGeometry(BK_R-0.014, BK_R-0.014, WATER_H0, 36), oilMat);
  oilDisc.renderOrder=2; oilDisc.visible=false; kit.add(oilDisc);

  // 뚜껑 (states — 열면 옆으로 미끄러지며 살짝 뜸)
  const lidMesh=new THREE.Mesh(new THREE.CylinderGeometry(BK_R+0.004, BK_R+0.004, 0.012, 48), GLASS.clone());
  const knob=new THREE.Mesh(new THREE.SphereGeometry(0.011,16,12), GLASS.clone());
  knob.position.y=0.012; lidMesh.add(knob);
  lidMesh.position.y=BK_H+0.006; lidMesh.userData.open=1; lidMesh.visible=false;
  kit.add(lidMesh);

  // 온도계 (황금 샘플 — 빨간 기둥 = 실제 온도, −10~110℃ 재매핑)
  const thermoGrp=new THREE.Group(); thermoGrp.visible=false;
  {
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.011,20,16),
      new THREE.MeshStandardMaterial({color:0xD64545, roughness:0.35}));
    thermoGrp.add(bulb);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.0052,0.0052,0.2,14), GLASS.clone());
    stem.position.y=0.1; thermoGrp.add(stem);
    const colGeo=new THREE.CylinderGeometry(0.0024,0.0024,1,10);
    colGeo.translate(0,0.5,0);
    const col=new THREE.Mesh(colGeo, new THREE.MeshBasicMaterial({color:0xE53935}));
    col.position.y=0.006; col.scale.y=0.02; thermoGrp.add(col);
    thermoGrp.userData.col=col;
    thermoGrp.position.set(BK_R*0.5, 0.02, 0); thermoGrp.rotation.z=-0.14;
  }
  kit.add(thermoGrp);
  grp.add(kit);

  // 저울 (스테이션 앞 — 기울임과 무관하게 실험대 고정)
  const scaleGrp=new THREE.Group(); scaleGrp.visible=false;
  {
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.055,0.014,32),
      new THREE.MeshStandardMaterial({color:0x3b424c, metalness:0.6, roughness:0.4}));
    body.position.y=0.007; body.castShadow=true; scaleGrp.add(body);
    const disp=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.008,0.02),
      new THREE.MeshStandardMaterial({color:0x9FE8C9, emissive:0x2a5a44, roughness:0.3}));
    disp.position.set(0,0.014,0.032); scaleGrp.add(disp);
    scaleGrp.position.set(0.16, 0.005, 0.14);
  }
  grp.add(scaleGrp);

  // 촛불 (burn 계열 — 왁스+심지+불꽃 2겹+PointLight, 스테이션당 1)
  const candleGrp=new THREE.Group(); candleGrp.visible=false;
  candleGrp.position.set(0, 0.005, 0.15);
  {
    const wax=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.018,0.07,24),
      new THREE.MeshStandardMaterial({color:0xF6EEDA, roughness:0.6}));
    wax.position.y=0.035; wax.castShadow=true; candleGrp.add(wax);
    const wick=new THREE.Mesh(new THREE.CylinderGeometry(0.0022,0.0022,0.016,8),
      new THREE.MeshStandardMaterial({color:0x3a3025, roughness:1}));
    wick.position.y=0.078; candleGrp.add(wick);
  }
  const flameOuter=new THREE.Sprite(new THREE.SpriteMaterial({
    map:flameTexture('rgba(255,244,200,1)','rgba(255,150,40,0.85)'),
    blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
  const flameInner=new THREE.Sprite(new THREE.SpriteMaterial({
    map:flameTexture('rgba(190,230,255,1)','rgba(70,140,255,0.7)'),
    blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
  flameOuter.visible=flameInner.visible=false;
  const flameLight=new THREE.PointLight(0xFFA640, 0, 1.4, 2);
  grp.add(flameOuter, flameInner, flameLight);
  const candleProxy=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.14,10),
    new THREE.MeshBasicMaterial({visible:false}));
  candleProxy.position.set(0,0.07,0.15); grp.add(candleProxy);
  grp.add(candleGrp);

  // 컵 (burn — 뒤집힌 유리컵, 촛불 덮기. small/large)
  const cups={};
  [['small',0.038,0.10],['large',0.052,0.145]].forEach(([sz,r,h])=>{
    const g=new THREE.Group();
    const wall=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.94,h,32,1,true), GLASS.clone());
    wall.position.y=h/2; g.add(wall);
    const cap=new THREE.Mesh(new THREE.CircleGeometry(r,32), GLASS.clone());
    cap.rotation.x=-Math.PI/2; cap.position.y=h; g.add(cap);
    g.visible=false; g.position.set(0, 0.005, 0.15); g.userData.h=h; g.userData.lift=1;
    grp.add(g); cups[sz]=g;
  });

  return { grp, pad, padRing, vg, liq, kit,
           bubbles:{geo:bGeo,pos:bPos,meta:bMeta}, steam, steamUni,
           iceCubes, precip, oilDisc, lidMesh, thermoGrp, scaleGrp,
           candleGrp, flameOuter, flameInner, flameLight, candleProxy, cups,
           vesselType:null, tilt:0, colorSpeed:0.8, lastColorHex:null,
           candlePlaced:false, cupSize:null, warnedAutoOpen:false, flipToasted:false };
}

function flameTexture(inner,outer){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,78,4,64,64,60);
  gr.addColorStop(0,inner); gr.addColorStop(.45,outer); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace; return tx;
}

let toastTimer=null;
function toast(msg, warn, ms){
  toastEl.innerHTML=msg; toastEl.classList.toggle('warn', !!warn);
  toastEl.classList.remove('hide');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.add('hide'), ms||3400);
}

/* 낙하 트윈 (E-6 방울·E-4 각설탕 계열) */
const fallAnims=[];
function spawnFall(stIdx, colorHex, isDrop){
  const S=ST3D[stIdx];
  const V=S.vesselType?VESSELS[S.vesselType]:null;
  const topY = V ? 0.02 + V.liq[2]*Math.min(1, world.stations[stIdx].contents.vol) : 0.05;
  const o = isDrop
    ? new THREE.Mesh(new THREE.SphereGeometry(0.006,10,8), waterMat(colorHex||0x8FC7EE))
    : new THREE.Mesh(new THREE.BoxGeometry(0.014,0.012,0.014),
        new THREE.MeshStandardMaterial({color:colorHex||0xffffff, roughness:0.5}));
  o.position.set(0, 0.3, 0); S.grp.add(o);
  fallAnims.push({o, grp:S.grp, t:0, y0:0.3, y1:topY});
}

function activeSt(){ return world.stations[ACTIVE]; }
function needVessel(el){
  if(activeSt().vessel) return true;
  shake(el); toast('먼저 <b>비커</b>를 놓아 봐요 — 모든 실험의 시작!', true);
  return false;
}

function onShelf(s, el){
  if(!canInteract()) return;
  if(!needVessel(el)) return;
  const c=activeSt().contents;
  if(s.id==='salt'||s.id==='sugar'||s.id==='sand'){
    if(c.vol<=0.001 && s.id!=='sand'){ toast('물이 없어요 — 녹일 물부터!', true); shake(el); return; }
    world.act('addSpoon',{st:ACTIVE, sub:s.id, n:1});
    spawnFall(ACTIVE, s.col, false);
    const so=c.solutes[s.id];
    toast(`${s.ic} ${s.nm} 한 숟갈 (${so.spoons}숟갈째) — 어떻게 될까요?`);
  } else if(s.id==='oil'){
    world.act('addLiquid',{st:ACTIVE, sub:'oil', vol:0.3});
    toast('🫒 기름을 부었어요 — 물과 섞일까요?');
  } else if(s.id==='acid'){
    if(c.acidUnits>0){ toast('이미 산성 용액이 들어 있어요', true); shake(el); return; }
    world.act('addLiquid',{st:ACTIVE, sub:'acid', vol:0.3});
    toast('🔴 산성 용액 + 지시약 — 새빨갛죠? 염기를 넣으면?');
  } else if(s.id==='base'){
    if(!c._hadAcid){ toast('염기는 <b>산성 용액</b>에 떨어뜨려요 — 산부터!', true); shake(el); return; }
    world.act('dropBase',{st:ACTIVE, drops:1});
    spawnFall(ACTIVE, 0x8FC7EE, true);
    const left=c.acidUnits;
    if(left>0) toast(`💧 한 방울… 아직 빨강 (남은 산 ${left})`);
  }
  syncBtns();
}

function onEquip(e, el){
  if(!canInteract()) return;
  const st=activeSt(), c=st.contents, S=ST3D[ACTIVE];
  switch(e.id){
    case 'beaker': case 'flask': case 'dish': {
      if(st.vessel){ toast('이 실험대에는 이미 용기가 있어요 — 다른 실험대를 선택!', true); shake(el); return; }
      world.act('placeVessel',{st:ACTIVE, type:e.id});
      if(e.id==='beaker') world.act('addWater',{st:ACTIVE, vol:1.0});   // E-1 원본: 비커(물)
      mountVessel(ACTIVE, e.id);
      toast(e.id==='beaker' ? '🥛 물이 든 비커 — 이제 뭐든 실험할 수 있어요!'
           : e.id==='flask' ? '⚗️ 삼각플라스크 — 산·염기 실험에 딱!'
           : '🍽️ 증발접시 — 액체를 부어 증발시켜 봐요');
      break;
    }
    case 'ice':
      if(!needVessel(el)) return;
      if(c.iceFrac>0){ toast('얼음이 이미 들어 있어요', true); shake(el); return; }
      world.act('addIce',{st:ACTIVE, frac:1});
      toast('🧊 얼음을 넣었어요 — 램프로 데우면?');
      break;
    case 'lid':
      if(!needVessel(el)) return;
      if(st.lid){ toast('이미 덮여 있어요', true); shake(el); return; }
      S.cupSize=null;
      world.act('placeLid',{st:ACTIVE});
      toast('🫙 뚜껑을 덮었어요 — 끓이면 무게가 어떻게 될까요?');
      break;
    case 'thermo':
      if(!needVessel(el)) return;
      if(st.thermo){ shake(el); return; }
      world.act('placeThermo',{st:ACTIVE});
      toast('🌡️ 이제 온도가 보여요');
      break;
    case 'scale':
      if(!needVessel(el)) return;
      if(st.scale){ shake(el); return; }
      world.act('placeScale',{st:ACTIVE});
      toast('⚖️ 저울 — 전체 무게를 지켜봐요');
      break;
    case 'lamp':
      if(lampPlaced){ shake(el); return; }
      lampPlaced=true; LAMP.visible=true; fireBtn.disabled=false;
      toast('🔥 램프를 <b>드래그</b>해 용기 아래로, <b>탭</b>하면 점화!');
      break;
    case 'candle':
      if(S.candlePlaced){ shake(el); return; }
      S.candlePlaced=true; S.candleGrp.visible=true;
      toast('🕯️ 촛불을 <b>탭</b>하면 불이 붙어요');
      break;
    case 'cup_s': case 'cup_l': {
      if(!S.candlePlaced && !c.flame.on){ toast('덮을 <b>촛불</b>이 먼저 필요해요!', true); shake(el); return; }
      if(st.lid){ toast('이미 덮여 있어요', true); shake(el); return; }
      const size = e.id==='cup_l' ? 'large' : 'small';
      S.cupSize=size;
      world.act('coverCup',{st:ACTIVE, size});
      toast(size==='large' ? '🍺 큰 컵으로 덮었어요 — 산소가 얼마나 갈까요?'
                           : '🥃 작은 컵으로 덮었어요 — 산소가 얼마나 갈까요?');
      break;
    }
  }
  syncBtns();
}

/* 용기 장착: 페노메나 킷 재부모화 */
function mountVessel(stIdx, type){
  const S=ST3D[stIdx];
  S.vesselType=type;
  for(const t in S.vg) S.vg[t].visible=(t===type);
  const V=VESSELS[type];
  S.vg[type].add(S.kit); S.kit.visible=true;
  S.lidMesh.geometry.dispose();
  S.lidMesh.geometry=new THREE.CylinderGeometry(V.lidR, V.lidR, 0.012, 48);
  S.lidMesh.position.y=V.lip.y+0.004;
  // 등장 연출
  S.vg[type].position.y=0.005+0.28; S.vg[type].userData.dropT=0;
}

/* ═════════ 물줄기 3안 (SPEC 기법 B-2 · ?stream 전환 — 단독 티어 선택 금지) ═════════ */
const STREAM = (new URLSearchParams(location.search).get('stream')) || 'tube';
const streamMat_tube = (()=>{ const m=waterMat(0x9FD4F2); m.attenuationDistance=0.03; m.emissive=new THREE.Color(0x9FD4F2); m.emissiveIntensity=0.32; return m; })(); // 어두운 무대 적응
const streamMat_glassy = new THREE.MeshPhysicalMaterial({
  color:0xBFE3F5, metalness:0, roughness:0.08, transparent:true, opacity:0.72, envMapIntensity:1.4, depthWrite:false, emissive:0x9FD4F2, emissiveIntensity:0.28 });
const dropMatClear = waterMat(0xBFE3F5);
function makeStreamMesh(){
  if(STREAM==='drops') return null;
  const mat = STREAM==='tube' ? streamMat_tube : streamMat_glassy;
  const m=new THREE.Mesh(new THREE.BufferGeometry(), mat);
  m.renderOrder=3; m.visible=false; m.frustumCulled=false; scene.add(m); return m;
}
const streamMesh=makeStreamMesh();
const CHAIN_N=14;
const chain=(()=>{
  if(STREAM!=='drops') return [];
  const geo=new THREE.SphereGeometry(0.005,10,8), arr=[];
  for(let i=0;i<CHAIN_N;i++){ const d=new THREE.Mesh(geo, dropMatClear);
    d.renderOrder=3; d.visible=false; d.frustumCulled=false; scene.add(d); arr.push(d); }
  return arr;
})();

/* 붓는 동안 물 표현 — 물리 정공법(클리핑 수면):
   물은 용기와 함께 기울고(자식 그대로), 월드 수평 클리핑 평면이 수면을 자른다.
   pouring 중 수면 = 입술 바로 아래(넘침면 — 실제 물리), returning엔 남은 부피 수면으로 하강.
   수면 캡 원판은 기운 원통의 수평 단면 타원(장축 r/cosθ)로 보정. */
const pourClip = new THREE.Plane(new THREE.Vector3(0,-1,0), 0); // y ≤ constant 영역만 렌더
const pourClipArr = [pourClip];
const surfCap = new THREE.Mesh(new THREE.CircleGeometry(1, 40),
  new THREE.MeshPhysicalMaterial({ color:0x8FCBEE, roughness:0.06, metalness:0,
    transparent:true, opacity:0.92, envMapIntensity:1.2, depthWrite:false }));
surfCap.rotation.x = -Math.PI/2; surfCap.renderOrder = 2; surfCap.visible = false;
scene.add(surfCap);
const axisO = new THREE.Vector3(), axisD = new THREE.Vector3(), surfV = new THREE.Vector3();
const capWhite = new THREE.Color(0xEAF6FF);
let pourSurfY = null;

function applyPourWaterPose(dt){
  if(pour.phase === 'idle'){
    if(pourSurfY !== null){ // 클리핑 해제 — layout이 다음 프레임부터 정상 복원
      ST3D.forEach(S => { for(const ty in S.liq) S.liq[ty].mat.clippingPlanes = null; });
      surfCap.visible = false; pourSurfY = null;
    }
    return;
  }
  const S = ST3D[pour.from]; if(!S.vesselType) return;
  const L = S.liq[S.vesselType], V = VESSELS[S.vesselType];
  const vgrp = S.vg[S.vesselType];
  const dir = ST_X[pour.to] > ST_X[pour.from] ? 1 : -1;
  const vol = Math.min(Math.max(world.stations[pour.from].contents.vol, 0), 1.2);

  // 물 = 풀 볼륨으로 용기에 정렬(함께 기움) — 수위는 클리핑이 담당
  L.mesh.rotation.z = 0; L.mesh.position.x = 0;
  L.mesh.scale.y = 1; L.mesh.position.y = 0.004 + L.h0/2;
  L.mesh.visible = vol > 0.001;
  L.mat.clippingPlanes = pourClipArr;

  // 수면 목표 높이(월드): pouring=입술 6mm 아래(넘침면) / returning=남은 부피의 수면
  vgrp.updateMatrixWorld(true);
  lip.set(V.lip.x*dir, V.lip.y, 0); vgrp.localToWorld(lip);
  surfV.set(0, 0.004 + V.liq[2]*Math.min(vol,1), 0); vgrp.localToWorld(surfV);
  const target = (pour.phase === 'pouring') ? (lip.y - 0.006) : surfV.y;
  pourSurfY = (pourSurfY === null) ? target : pourSurfY + (target - pourSurfY) * Math.min(dt*6, 1);
  pourClip.constant = pourSurfY;

  // 수면 캡: 용기 축과 수면 평면의 교점 + 타원 보정(장축=기움 방향)
  axisO.set(0,0,0); vgrp.localToWorld(axisO);
  axisD.set(0,1,0).transformDirection(vgrp.matrixWorld);
  const k = (pourSurfY - axisO.y) / Math.max(axisD.y, 1e-4);
  surfCap.position.copy(axisO).addScaledVector(axisD, k);
  surfCap.position.y = pourSurfY + 0.0004;
  const rIn = V.liq[0] - 0.0015, tiltAbs = Math.min(Math.abs(S.tilt), 1.2);
  surfCap.scale.set(rIn / Math.cos(tiltAbs), rIn, 1);
  surfCap.material.color.copy(L.mat.attenuationColor).lerp(capWhite, 0.4);
  surfCap.visible = L.mesh.visible && k > 0.004 && k < L.h0 + 0.02;
}

function renderStream(cv, rateRatio, t){
  const radius=0.003+0.005*rateRatio; // 무대 거리(카메라 ~1.7m) 가시 두께
  if(streamMesh){
    if(cv){ streamMesh.geometry.dispose(); streamMesh.geometry=new THREE.TubeGeometry(cv,24,radius,8,false); streamMesh.visible=true; }
    else streamMesh.visible=false;
  }
  if(chain.length){
    if(cv){ const sc=0.7+0.5*rateRatio;
      for(let i=0;i<CHAIN_N;i++){ const u=(t*1.6+i/CHAIN_N)%1; cv.getPoint(u, chain[i].position); chain[i].scale.setScalar(sc); chain[i].visible=true; }
    } else chain.forEach(d=>d.visible=false);
  }
}

/* pour 상태 — 한 번에 한 방향. act('pour')는 0.02 단위 양자화(액션로그 폭주 방지·결정론 유지) */
const pour={ from:-1, to:-1, phase:'idle', tilt:0, acc:0 };
function srcLiquid(i){
  const c=world.stations[i].contents;
  return c.vol + c.layers.reduce((s,l)=>s+l.vol,0);
}
function canPour(i){
  const other=1-i;
  return world.stations[i].vessel && world.stations[other].vessel && srcLiquid(i)>0.03 && !world.stations[i].lid;
}
function togglePour(i){
  if(!canInteract()) return;
  if(pour.phase==='idle'){ pour.from=i; pour.to=1-i; pour.phase='pouring'; }
  else if(pour.from===i){ pour.phase = pour.phase==='pouring' ? 'returning' : 'pouring'; }
}
function flushPour(){
  if(pour.acc>0.0005){ world.act('pour',{from:pour.from, to:pour.to, amount:pour.acc}); pour.acc=0; }
}

/* ═════════ 조작 (램프 드래그·탭 + 용기 탭 따르기 + 촛불 탭 + 패드 탭) ═════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0), -BENCH_Y);
const hitPt=new THREE.Vector3(), lip=new THREE.Vector3(), hitV=new THREE.Vector3(), ctrl=new THREE.Vector3();
let dragging=false, downPos=null, moved=false;
function toNDC(e){ ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1; }

renderer.domElement.addEventListener('pointerdown', e=>{
  downPos={x:e.clientX,y:e.clientY}; moved=false;
  if(LAMP.visible){
    toNDC(e); ray.setFromCamera(ndc,camera);
    if(ray.intersectObject(dragProxy,false).length){
      dragging=true; controls.enabled=false; renderer.domElement.setPointerCapture(e.pointerId);
    }
  }
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(dragging){
    if(downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6) moved=true;
    toNDC(e); ray.setFromCamera(ndc,camera);
    if(ray.ray.intersectPlane(dragPlane,hitPt)){
      LAMP.position.x=THREE.MathUtils.clamp(hitPt.x,-1.35,1.35);
      LAMP.position.z=THREE.MathUtils.clamp(hitPt.z,-0.6,0.6);
    }
    return;
  }
  if(downPos) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  let hot=false;
  if(LAMP.visible && ray.intersectObject(dragProxy,false).length) hot=true;
  for(let i=0;i<2;i++){
    const S=ST3D[i];
    if(S.vesselType && canPour(i) && ray.intersectObject(S.vg[S.vesselType],true).length) hot=true;
    if(S.candlePlaced && ray.intersectObject(S.candleProxy,false).length) hot=true;
  }
  renderer.domElement.style.cursor=hot?'pointer':'';
});
function endPointer(e){
  if(dragging){ dragging=false; controls.enabled=true; if(!moved) setFire(!lit); downPos=null; return; }
  const mv = downPos && Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6;
  downPos=null;
  if(mv) return;
  toNDC(e); ray.setFromCamera(ndc,camera);
  for(let i=0;i<2;i++){
    const S=ST3D[i];
    // 촛불 탭 = 점화 (ignflame)
    if(S.candlePlaced && !world.stations[i].contents.flame.on
       && ray.intersectObject(S.candleProxy,false).length){
      world.act('ignflame',{st:i}); setActive(i);
      toast('🕯️ 촛불을 켰어요'+(world.stations[i].contents.flame.oilFire?' — ⚠️ 기름 위 불꽃!':''));
      return;
    }
    // 용기 탭 = 따르기 토글 (pour)
    if(S.vesselType && ray.intersectObject(S.vg[S.vesselType],true).length){
      setActive(i);
      if(pour.phase!=='idle' && pour.from!==i) return;
      if(pour.phase==='idle' && !canPour(i)){
        if(!world.stations[1-i].vessel) toast('부을 <b>상대 용기</b>가 먼저 필요해요!', true);
        return;
      }
      togglePour(i);
      return;
    }
    // 패드 탭 = 스테이션 선택
    if(ray.intersectObject(S.pad,false).length){ setActive(i); return; }
  }
}
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', ()=>{ if(dragging){dragging=false;controls.enabled=true;} downPos=null; });

/* 램프 → 엔진 moveLamp (양자화 — 변화 있을 때만 act) */
let lampQ={st:-2, d:-1};
const stWorld=new THREE.Vector3();
function syncLamp(){
  if(!LAMP.visible) return;
  let best=0, bestD=1e9;
  for(let i=0;i<2;i++){
    ST3D[i].grp.getWorldPosition(stWorld);
    const d=Math.hypot(LAMP.position.x-stWorld.x, LAMP.position.z-stWorld.z);
    if(d<bestD){ bestD=d; best=i; }
  }
  const qd=Math.round(bestD/0.005)*0.005;
  if(best!==lampQ.st || Math.abs(qd-lampQ.d)>1e-9){
    lampQ={st:best, d:qd};
    world.act('moveLamp',{st:best, dist:qd});
  }
}

/* ═════════ 관측 HUD (활성 스테이션) ═════════ */
const PHASE_MSG={
  melting:'🧊 융해 중 — 녹는 동안 0℃ 고정!',
  boiling:'💨 끓는 중 — 100℃ 고정(잠열)',
  precip:'✨ 못 녹은 알갱이가 가라앉아요',
  neutral:'💙 중화! 색이 확 바뀌었어요',
  out:'🕯️ 산소가 다 떨어져 불이 꺼졌어요',
  heating:'🔥 데우는 중…',
  idle:''
};
function updateHUD(){
  const st=activeSt(), c=st.contents;
  if(st.thermo){
    tempEl.className='';
    tempEl.innerHTML=`${c.temp.toFixed(1)}<small> ℃</small>`;
  } else {
    tempEl.className='na';
    tempEl.innerHTML=st.vessel?'온도계를 설치하면<br>온도가 보여요':'용기가 아직 없어요';
  }
  massEl.textContent = st.scale ? `⚖️ ${Math.round(c.mass||0)} g` : '';
  let s='';
  if(!st.vessel){ stateEl.innerHTML='먼저 <b>비커</b>를 놓아 봐요 — 모든 실험의 시작!'; return; }
  const tag=K.phaseTag(st);
  s=PHASE_MSG[tag]||'';
  if(tag==='boiling' && st.lid) s='💨 끓는 중 — 밀폐! 증기가 갇혀 무게 그대로';
  if(tag==='idle'){
    if(c.iceFrac>0) s='🧊 얼음이 떠 있어요 — 데우면?';
    else if(c._hasOilLayer) s='🫒 기름이 위에 떠 있어요 — 안 섞여요(밀도)';
    else if(c.acidUnits>0) s=`🔴 산성 — 염기 ${c.acidUnits}방울이면 중화`;
    else if(c.vol>0.001) s='실험을 이어가 봐요 — 무엇을 조합할까요?';
    else s='액체를 부어 봐요 (따르기·선반)';
  }
  stateEl.innerHTML=s;
}

/* ═════════ 품질 자동 ═════════ */
let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++; if(qualityChecked) return;
  if(now-fpsStart>4000){ qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){ renderer.setPixelRatio(1); sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } sun.shadow.radius=3; }
  }
}

/* ═════════ 스테이션 렌더 바인딩 (엔진 필드 → 프리미티브 §6 — 조회만) ═════════ */
const BASE_COL=new THREE.Color(0x5FB9E8), tmpCol=new THREE.Color(); // 황금 scilab.html 물색
function stepBubblesFor(S, dt, intensity, topLocal, bubR){
  const {pos:bPos, meta:bMeta, geo:bGeo}=S.bubbles;
  const active=Math.floor(B_N*intensity);
  const bottom=0.012, span=Math.max(topLocal-bottom-0.008,0.01);
  for(let i=0;i<B_N;i++){
    if(i>=active){ bPos[i*3+1]=-999; continue; }
    const m=bMeta[i];
    m.y+=(0.16+0.45*intensity)*m.sp*dt/span;
    if(m.y>1){ m.y=0;
      const a=Math.random()*Math.PI*2, r=Math.random()*bubR;
      m.x=Math.cos(a)*r; m.z=Math.sin(a)*r;
    }
    bPos[i*3]  =m.x+Math.sin(m.y*22+i)*0.004;
    bPos[i*3+1]=bottom+m.y*span;
    bPos[i*3+2]=m.z+Math.cos(m.y*19+i)*0.004;
  }
  bGeo.attributes.position.needsUpdate=true;
}

function renderStation(i, dt, t){
  const S=ST3D[i], st=world.stations[i], c=st.contents;
  if(!S.vesselType) return 0;
  const V=VESSELS[S.vesselType], vgrp=S.vg[S.vesselType], L=S.liq[S.vesselType];

  // 등장 낙하 이징
  if(vgrp.userData.dropT!=null){
    vgrp.userData.dropT+=dt*3.2;
    const k=Math.min(vgrp.userData.dropT,1), e=1-Math.pow(1-k,3);
    vgrp.position.y=0.005+0.28*(1-e);
    if(k>=1){ vgrp.position.y=0.005; delete vgrp.userData.dropT; }
  }

  // 액체 수위·리플·색
  const top=L.layout(Math.min(c.vol,1.2));
  L.ripple(t, 0.0012+0.0055*c.bubble);
  tmpCol.set(c.colorHex ? c.colorHex : BASE_COL);
  if(S.lastColorHex!==c.colorHex){ S.colorSpeed = (c.colorHex===IND_BASE)?6.0:0.8; S.lastColorHex=c.colorHex; }
  L.mat.attenuationColor.lerp(tmpCol, Math.min(dt*S.colorSpeed,1));
  if(c._flip && !S.flipToasted){ S.flipToasted=true; toast('💙 <b>확!</b> 빨강 → 파랑 — 중화점이에요'); }

  // 기름 상층 원판
  const oilVol=c.layers.reduce((s,l)=>s+(l.sub==='oil'?l.vol:0),0);
  if(oilVol>0.003){
    S.oilDisc.visible=true;
    S.oilDisc.scale.y=Math.max(oilVol*0.6,0.02);
    S.oilDisc.position.y=top + (WATER_H0*oilVol*0.6)/2 + 0.001;
  } else S.oilDisc.visible=false;

  // 기포·김
  stepBubblesFor(S, dt, c.bubble, top, V.bubR);
  S.steam.position.y=top+0.005;
  S.steamUni.uTime.value=t;
  S.steamUni.uIntensity.value+=(c.steam-S.steamUni.uIntensity.value)*Math.min(dt*2.5,1);

  // 얼음
  S.iceCubes.forEach(cube=>{
    if(c.iceFrac<=0.001){ cube.visible=false; return; }
    cube.visible=true;
    const sc=Math.max(c.iceFrac,0.001);
    cube.scale.setScalar(sc);
    cube.position.y=Math.min(top - cube.userData.sz*sc*0.3, 0.03+top*0.2);
  });

  // 석출 (E-4 매핑: showN = precip그램×12)
  let sandG=0, precipCryst=0;
  for(const sub in c.solutes){
    const so=c.solutes[sub], SS=K.SUBSTANCES[sub];
    const tot=so.spoons*(SS.spoonG||0);
    if(SS.kind==='insoluble') sandG+=tot;
    else if(SS.kind==='solute') precipCryst+=Math.max(0, tot-so.dissolved);
  }
  S.precip.update(Math.min(1, precipCryst*12/300), dt);

  // 뚜껑/컵
  const cupSize=st._cupSize && st.lid ? st._cupSize : (S.cupSize && st.lid ? S.cupSize : null);
  if(cupSize){
    S.lidMesh.visible=false;
    const cup=S.cups[cupSize==='large'?'large':'small'];
    for(const k in S.cups) S.cups[k].visible = S.cups[k]===cup;
    cup.userData.lift += (0-cup.userData.lift)*Math.min(dt*4,1);
    cup.position.y=0.005+cup.userData.lift*0.22;
  } else {
    for(const k in S.cups){
      const cup=S.cups[k];
      if(cup.visible){
        cup.userData.lift += (1-cup.userData.lift)*Math.min(dt*4,1);
        cup.position.y=0.005+cup.userData.lift*0.22;
        if(cup.userData.lift>0.98) cup.visible=false;
      }
    }
    const lidOn = st.lid && !st._cupSize;
    S.lidMesh.visible = lidOn || S.lidMesh.userData.open<0.98;
    const tgt = lidOn?0:1;
    S.lidMesh.userData.open += (tgt-S.lidMesh.userData.open)*Math.min(dt*4,1);
    const op=S.lidMesh.userData.open;
    S.lidMesh.position.x=op*0.14;
    S.lidMesh.position.y=V.lip.y+0.004+op*0.05;
    if(op>0.98 && !lidOn) S.lidMesh.visible=false;
  }
  if(c._autoOpened && !S.warnedAutoOpen){
    S.warnedAutoOpen=true;
    toast('⚠️ 밀폐한 채 오래 끓여서 뚜껑이 <b>저절로 열렸어요</b> — 실험 안전!', true, 4600);
  }

  // 촛불·불꽃 (oilFire면 용기 액면 위로 이동 + 붉은 빛)
  const f=c.flame;
  if(f.on){
    const fl=1+0.10*Math.sin(t*23+i)+0.06*Math.sin(t*57+1.7);
    const base=f.oilFire?1.4:1;
    S.flameOuter.visible=S.flameInner.visible=true;
    S.flameOuter.scale.set(0.058*fl*f.size*base, 0.115*fl*f.size*base*(1+0.05*Math.sin(t*31)), 1);
    S.flameInner.scale.set(0.034*fl*f.size*base, 0.06*fl*f.size*base, 1);
    let fx=0, fy=0, fz=0.15;
    if(f.oilFire){ fx=0; fz=0; fy=top+(S.oilDisc.visible?WATER_H0*oilVol*0.6:0)+0.02; }
    else fy=0.005+0.086;
    S.flameOuter.position.set(fx, fy+0.028, fz);
    S.flameInner.position.set(fx, fy+0.012, fz);
    S.flameLight.position.set(fx, fy+0.05, fz);
    S.flameLight.color.set(f.oilFire?0xFF6A2A:0xFFA640);
    S.flameLight.intensity=(1.4+0.5*Math.sin(t*19+i))*f.size*base;
    if(c.o2<15 && st.lid){ S.flameOuter.material.rotation=Math.sin(t*40)*0.15; }
  } else {
    S.flameOuter.visible=S.flameInner.visible=false;
    S.flameLight.intensity=0;
  }
  if(S.candlePlaced) S.candleGrp.visible=true;

  // 온도계·저울 3D
  S.thermoGrp.visible=st.thermo;
  if(st.thermo){
    const col=S.thermoGrp.userData.col;
    const frac=Math.max(0, Math.min(1, (c.temp+10)/120));   // −10~110℃ 재매핑 (states)
    col.scale.y=0.02+0.16*frac;
  }
  S.scaleGrp.visible=st.scale;

  return top;
}

/* ═════════ §BRANCH P2. 타임라인 스크럽(되돌리기) — replayTo(τ)로 world 스왑, step 정지 ═════════ */
const FREE_BRANCH = new URLSearchParams(location.search).get('free_branch')==='1';
const timebar=document.getElementById('timebar'), tbTrack=document.getElementById('tbTrack'),
      tbFill=document.getElementById('tbFill'), tbHandle=document.getElementById('tbHandle'),
      tbResume=document.getElementById('tbResume'), tbFork=document.getElementById('tbFork'),
      tbTime=document.getElementById('tbTime');
let scrubbing=false, liveWorld=null, scrubTotal=0, scrubTau=0, _tbDrag=false, _tbMkEls=[];
const _fmtT = s => s.toFixed(1)+'s';

// 조작 가드: 되돌리기(스크럽) 중엔 관찰만 — 조작 진입 함수 초입에서 호출
function canInteract(){
  if(scrubbing){ toast('되돌리기 중엔 관찰만 — ▶ 지금으로 눌러 돌아오세요', true); return false; }
  return true;
}

function renderTimebar(){
  const total = scrubbing ? scrubTotal : world.t;
  if(GRADE==='low' || total<0.5){ timebar.style.display='none'; return; }
  timebar.style.display='block';
  const R=(scrubbing?liveWorld:world).recorder, mks=R?R.markers:[];
  if(_tbMkEls.length!==mks.length){                    // 마커 개수 변할 때만 재생성(MK_ICON/MK_MSG 재사용)
    _tbMkEls.forEach(e=>e.remove()); _tbMkEls=[];
    mks.forEach(mk=>{ const e=document.createElement('span'); e.className='tbMk';
      e.textContent=MK_ICON[mk.type]||'•'; e.title=MK_MSG[mk.type]||''; tbTrack.appendChild(e); _tbMkEls.push(e); });
  }
  for(let i=0;i<mks.length;i++){ const p=total>0?Math.min(1,mks[i].t/total):0;
    _tbMkEls[i].style.left=(p*100).toFixed(1)+'%'; }
  const cur = scrubbing ? scrubTau : total;
  const hp = total>0 ? Math.min(1,cur/total) : 1;
  tbHandle.style.left=(hp*100).toFixed(1)+'%';
  tbFill.style.width=(hp*100).toFixed(1)+'%';
  tbTime.textContent = scrubbing ? (_fmtT(scrubTau)+' / '+_fmtT(total)) : _fmtT(total);
}

function enterScrub(){
  if(scrubbing) return true;
  if(typeof pour!=='undefined' && pour.phase!=='idle'){ toast('물을 다 따른 뒤에 되돌릴 수 있어요',true); return false; }
  if(world.t<0.5){ toast('아직 되돌릴 게 없어요',true); return false; }
  liveWorld=world; scrubTotal=world.t; scrubTau=scrubTotal; scrubbing=true;
  lensEl.classList.add('scrubbing');
  tbResume.classList.add('on');
  if(GRADE==='high') tbFork.classList.add('on');        // 분기(🔀)는 고학년만 · P3
  return true;
}
function scrubTo(tau){
  if(!scrubbing && !enterScrub()) return;
  scrubTau=Math.max(0, Math.min(scrubTotal, tau));
  world=K.replayTo(OPTS, liveWorld.actionLog, scrubTau); // 전역 world 스왑 → 렌더가 그 시점 상태를 그림
  renderTimebar();
}
function resumeLive(){
  if(!scrubbing) return;
  world=liveWorld; liveWorld=null; scrubbing=false;
  lensEl.classList.remove('scrubbing');
  tbResume.classList.remove('on'); tbFork.classList.remove('on');
  renderTimebar();
}
function tbTauFromEvent(ev){
  const r=tbTrack.getBoundingClientRect();
  const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
  return Math.max(0, Math.min(1, cx/r.width)) * (scrubbing?scrubTotal:world.t);
}
tbTrack.addEventListener('pointerdown', ev=>{ ev.preventDefault();
  if(!enterScrub()) return; _tbDrag=true;
  try{ tbTrack.setPointerCapture(ev.pointerId); }catch(e){}
  scrubTo(tbTauFromEvent(ev)); });
tbTrack.addEventListener('pointermove', ev=>{ if(_tbDrag) scrubTo(tbTauFromEvent(ev)); });
tbTrack.addEventListener('pointerup',   ()=>{ _tbDrag=false; });
tbTrack.addEventListener('pointercancel',()=>{ _tbDrag=false; });
tbResume.addEventListener('click', resumeLive);
// tbFork(🔀 여기서 갈라지기)는 P3에서 분기 로직 연결 예정

function lensResize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = lensEl.clientWidth - 22; // padding 보정
  lensCv.style.height = LENS_H + 'px';
  lensCv.width  = Math.round(cssW * dpr);
  lensCv.height = Math.round(LENS_H * dpr);
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lensCv._cssW = cssW; lensCv._cssH = LENS_H;
}

// tag(문자열) → 한국어 회상 문구 (§7-3)
const TAG_RECALL = {
  melting:'🧊 융해 중 — 0℃ 고정', boiling:'💨 끓는 중 — 100℃ 고정',
  precip:'✨ 알갱이 석출', neutral:'💙 중화점', out:'🕯️ 소등',
  heating:'🔥 데우는 중', idle:'· 안정 상태'
};

function drawLens(){
  if (GRADE === 'low' || lensEl.classList.contains('collapsed')) return;
  const buf = world.recorder.chans[ACTIVE];
  const W = lensCv._cssW, H = lensCv._cssH, PAD_L = 26, PAD_R = 8, PAD_T = 8, PAD_B = 14;
  lctx.clearRect(0, 0, W, H);
  if (!buf || buf.length < 2){
    lctx.fillStyle = 'rgba(255,255,255,.4)'; lctx.font = '11px Gowun Dodum';
    lctx.fillText('실험을 시작하면 그래프가 자라나요', 10, H/2);
    return;
  }
  const tNow = buf[buf.length-1].t;
  const t0 = lensSpanAll ? buf[0].t : Math.max(buf[0].t, tNow - 60);
  const span = Math.max(0.5, tNow - t0);
  const gx = t => PAD_L + (t - t0) / span * (W - PAD_L - PAD_R);
  const vis = buf.filter(s => s.t >= t0);

  // 채널 목록: temp 항상 + 선택(mid/low는 temp만)
  const chans = ['temp'];
  if (GRADE === 'high' && lensSel && lensSel !== 'temp') chans.push(lensSel);

  // 플래토 밴드 (§7-2): tag ∈ {boiling,melting} 연속 구간 = 잠열(온도 정지) — heatK 필드 회피, 물리 동치
  let bs = null;
  for (let i = 0; i < vis.length; i++){
    const plateau = (vis[i].tag === 'boiling' || vis[i].tag === 'melting');
    if (plateau && bs === null) bs = vis[i].t;
    if ((!plateau || i === vis.length-1) && bs !== null){
      const be = vis[i].t;
      const x1 = gx(bs), x2 = gx(be);
      if (x2 - x1 > 2){
        lctx.fillStyle = 'rgba(255,138,60,.16)';
        lctx.fillRect(x1, PAD_T, x2 - x1, H - PAD_T - PAD_B);
        lctx.fillStyle = 'rgba(255,170,110,.9)'; lctx.font = '9px Gowun Dodum';
        lctx.fillText('여기서 멈춤!', x1 + 2, PAD_T + 9);
      }
      lensEl._plateau = { x1: gx(bs), x2: gx(be) }; // high 퀴즈 히트영역
      bs = null;
    }
  }
  if (bs === null && !vis.some(s => s.tag==='boiling'||s.tag==='melting')) lensEl._plateau = null;

  // 각 채널 선 그리기
  chans.forEach(ch => {
    const def = LENS_CH[ch], mn = def.min(vis), mx = def.max(vis), rng = Math.max(1e-3, mx - mn);
    const gy = v => PAD_T + (1 - (v - mn) / rng) * (H - PAD_T - PAD_B);
    lctx.strokeStyle = def.color; lctx.lineWidth = 1.8; lctx.beginPath();
    vis.forEach((s, k) => { const x = gx(s.t), y = gy(s[ch]); k ? lctx.lineTo(x, y) : lctx.moveTo(x, y); });
    lctx.stroke();
    // 최신값 점 + 라벨
    const last = vis[vis.length-1];
    lctx.fillStyle = def.color; lctx.beginPath();
    lctx.arc(gx(last.t), gy(last[ch]), 2.6, 0, 7); lctx.fill();
  });
  // Y축 라벨 (temp 기준)
  const tdef = LENS_CH.temp;
  lctx.fillStyle = 'rgba(255,255,255,.45)'; lctx.font = '9px Gowun Dodum';
  lctx.fillText('110', 2, PAD_T + 8); lctx.fillText('0', 2, gyTemp(0, H, PAD_T, PAD_B));

  // 이벤트 마커 (§7-2): 활성 스테이션 필터 → 세로 점선 + 아이콘
  const mks = world.recorder.markers.filter(m => m.station === ACTIVE && m.t >= t0);
  mks.forEach(m => {
    const x = gx(m.t);
    lctx.strokeStyle = 'rgba(255,255,255,.28)'; lctx.lineWidth = 1;
    lctx.setLineDash([2,2]); lctx.beginPath();
    lctx.moveTo(x, PAD_T); lctx.lineTo(x, H - PAD_B); lctx.stroke(); lctx.setLineDash([]);
    lctx.font = '10px sans-serif'; lctx.fillText(MK_ICON[m.type] || '•', x - 5, H - PAD_B - 1);
  });

  // 현재 커서 (§7-2)
  const cx = gx(tNow);
  lctx.strokeStyle = 'rgba(255,255,255,.5)'; lctx.lineWidth = 1; lctx.beginPath();
  lctx.moveTo(cx, PAD_T); lctx.lineTo(cx, H - PAD_B); lctx.stroke();

  // X축 라벨 (경과 시간)
  lctx.fillStyle = 'rgba(255,255,255,.4)'; lctx.font = '9px Gowun Dodum';
  lctx.fillText((lensSpanAll ? '전체' : '−60s'), PAD_L, H - 2);
  lctx.fillText(Math.round(tNow) + 's', W - PAD_R - 20, H - 2);
}
function gyTemp(v, H, PT, PB){ return PT + (1 - (v + 10) / 120) * (H - PT - PB); }

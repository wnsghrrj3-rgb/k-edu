/* ── §7-3 양방향: 그래프 탭 → 최근접 샘플 회상 (말풍선 + 용기 scale 펄스) ── */
lensCv.addEventListener('pointerdown', ev => {
  const buf = world.recorder.chans[ACTIVE];
  if (!buf || buf.length < 2) return;
  const rect = lensCv.getBoundingClientRect();
  const px = (ev.clientX - rect.left);
  const W = lensCv._cssW, PAD_L = 26, PAD_R = 8;
  const tNow = buf[buf.length-1].t;
  const t0 = lensSpanAll ? buf[0].t : Math.max(buf[0].t, tNow - 60);
  const span = Math.max(0.5, tNow - t0);
  const tHit = t0 + (px - PAD_L) / (W - PAD_L - PAD_R) * span;

  // high 모드 + 플래토 밴드 안 탭 → 퀴즈 (§7-4)
  if (GRADE === 'high' && lensEl._plateau && px >= lensEl._plateau.x1 && px <= lensEl._plateau.x2){
    showPlateauQuiz(ev.clientX, ev.clientY); return;
  }
  // 최근접 샘플
  let best = buf[0], bd = 1e9;
  for (const s of buf){ const d = Math.abs(s.t - tHit); if (d < bd){ bd = d; best = s; } }
  const recall = TAG_RECALL[best.tag] || '· 실험 진행';
  lensTip.innerHTML = `<b>${Math.round(best.t)}초</b> — ${recall}<br>온도 ${best.temp.toFixed(1)}℃`;
  lensTip.style.left = Math.min(ev.clientX - 40, window.innerWidth - 190) + 'px';
  lensTip.style.top  = (ev.clientY - 60) + 'px';
  lensTip.classList.remove('hide');
  clearTimeout(lensTip._to); lensTip._to = setTimeout(() => lensTip.classList.add('hide'), 2600);
  lensPulse = { st: ACTIVE, t0: performance.now() / 1000 }; // 용기 펄스 트리거
});

function showPlateauQuiz(cx, cy){
  lensTip.innerHTML = `<b>왜 온도가 멈췄을까?</b><br>
    <button class="qz" data-a="1" style="margin:4px 3px 0;padding:3px 7px;border-radius:8px;border:none;background:#B197FC;color:#fff;font-size:11px;cursor:pointer">열이 상태변화에 쓰여서</button>
    <button class="qz" data-a="0" style="margin:4px 3px 0;padding:3px 7px;border-radius:8px;border:1px solid #ccc;background:#fff;font-size:11px;cursor:pointer">온도계가 고장나서</button>`;
  lensTip.style.left = Math.min(cx - 40, window.innerWidth - 200) + 'px';
  lensTip.style.top  = (cy - 80) + 'px';
  lensTip.classList.remove('hide');
  clearTimeout(lensTip._to);
  lensTip.querySelectorAll('.qz').forEach(q => q.addEventListener('click', () => {
    lensTip.innerHTML = q.dataset.a === '1'
      ? '🎉 맞아요! 잠열 — 녹거나 끓는 동안 열은 상태를 바꾸는 데 쓰여 온도가 그대로예요.'
      : '🤔 다시 볼까요? 온도계는 정상! 열이 상태변화(융해·기화)에 쓰이는 중이에요.';
    lensTip._to = setTimeout(() => lensTip.classList.add('hide'), 3400);
  }));
}

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 낙하 트윈 (선반 물질·염기 방울)
  for(let i=fallAnims.length-1;i>=0;i--){
    const d=fallAnims[i]; d.t+=dt*2.6;
    const k=Math.min(d.t,1), e=k*k;
    d.o.position.y=d.y0+(d.y1-d.y0)*e;
    if(k>=1){ d.grp.remove(d.o); fallAnims.splice(i,1); }
  }

  // 램프 → 엔진 (양자화 act)
  syncLamp();

  // pour: 원본 pour_test 연출 승계 — 기울임 트윈 + 들어올림·타겟 쪽 이동 + 물 수평 유지
  let cv=null, rr=0;
  if(!scrubbing && pour.phase!=='idle'){
    const S=ST3D[pour.from], V=VESSELS[S.vesselType];
    const dir = ST_X[pour.to]>ST_X[pour.from] ? 1 : -1;   // 따르는 방향 (+x / −x)
    const vgrp=S.vg[S.vesselType], L=S.liq[S.vesselType];
    const tgt = pour.phase==='pouring'?TILT_MAX:0;
    S.tilt += (S.tilt>tgt?-1:1)*TILT_SPEED*dt;
    if((S.tilt<=tgt&&pour.phase==='pouring')||(S.tilt>=tgt&&pour.phase==='returning')) S.tilt=tgt;
    vgrp.rotation.z=S.tilt*dir;

    // 붓는 자세(원본): 기울임 비례 들어올림 + 받는 스테이션 쪽 이동
    const liftK=S.tilt/TILT_MAX;                            // 0~1
    vgrp.position.y=0.005 + POUR_LIFT*liftK;
    vgrp.position.x=POUR_SHIFT*liftK*dir;
    const pouring = S.tilt<TILT_ON && srcLiquid(pour.from)>0.02;
    if(pouring){
      const rate=POUR_RATE*Math.min((TILT_ON-S.tilt)/(TILT_ON-TILT_MAX),1); // 최대 기울임=유량 100%
      rr=rate/POUR_RATE;
      pour.acc+=rate*dt;
      if(pour.acc>=0.02) flushPour();
      // 물줄기 곡선(원본): 입술에서 수평으로 나가(제어점 y=lip.y) 받는 수면으로 낙하
      vgrp.updateMatrixWorld(true);
      lip.set(V.lip.x*dir, V.lip.y, 0); vgrp.localToWorld(lip);
      const T=ST3D[pour.to], TV=VESSELS[T.vesselType];
      const tTop=0.02+TV.liq[2]*Math.min(world.stations[pour.to].contents.vol,1);
      hitV.set(0, tTop, 0); T.vg[T.vesselType].localToWorld(hitV);
      ctrl.set(lip.x*0.4+hitV.x*0.6, lip.y, (lip.z+hitV.z)*0.5);
      ctrl.x+=Math.sin(t*7)*0.002;
      cv=new THREE.QuadraticBezierCurve3(lip.clone(), ctrl.clone(), hitV.clone());
      ST3D[pour.to].liq[T.vesselType] && ST3D[pour.to].liq[T.vesselType].ripple(t, 0.0016+0.004*rr);
    }
    if(srcLiquid(pour.from)<=0.03 && pour.phase==='pouring'){ pour.phase='returning'; }
    if(pour.phase==='returning' && S.tilt>=-1e-4){
      flushPour();
      S.tilt=0; vgrp.rotation.z=0; vgrp.position.x=0; vgrp.position.y=0.005;
      L.mesh.rotation.z=0; L.mesh.position.x=0;
      pour.phase='idle';
    }
  }
  renderStream(cv, rr, t);

  // 엔진 전진 (1층 — 물리는 전부 여기). 스크럽(되돌리기) 중엔 정지 — replayTo(τ) 스왑 상태를 그대로 표시.
  if(!scrubbing){
    world.step(dt);

    // 미션 판정·예측·성공 (P4 — 순수 러너 위 UI 트리거만)
    if(missionRun){
      let pred; if(!predictOpen && (pred=missionRun.pollPrediction())) showPredict(pred);
      const wasDone=missionRun.done; missionRun.tick(dt);
      const fill=$m('goalBar').querySelector('.gProgFill');
      if(fill) fill.style.width=(missionRun.progress()*100).toFixed(0)+'%';
      if(missionRun.done && !wasDone){ const done=curMission; endMissionKeepBanner(); showSuccess(done); }
    }
  }

  // 스테이션 렌더 바인딩
  renderStation(0, dt, t);
  renderStation(1, dt, t);
  applyPourWaterPose(dt); // layout(y 갱신) 뒤에 적용해야 유효

  // 모래 공용 InstancedMesh — 모래 가장 많은 스테이션에 부착
  let sMax=0, sIdx=-1;
  for(let i=0;i<2;i++){
    const so=world.stations[i].contents.solutes.sand;
    const g=so?so.spoons*K.SUBSTANCES.sand.spoonG:0;
    if(g>sMax){ sMax=g; sIdx=i; }
  }
  if(sIdx!==sandOwner){
    if(sandShared.mesh.parent) sandShared.mesh.parent.remove(sandShared.mesh);
    if(sIdx>=0 && ST3D[sIdx].vesselType) ST3D[sIdx].kit.add(sandShared.mesh);
    sandOwner=sIdx;
  }
  if(sandOwner>=0) sandShared.update(Math.min(1, sMax*12/120), dt);

  // 램프 불꽃
  if(lit){
    const f=1+0.10*Math.sin(t*23)+0.06*Math.sin(t*57+1.7);
    lampFlameO.scale.set(0.058*f, 0.115*f*(1+0.05*Math.sin(t*31)), 1);
    lampFlameI.scale.set(0.034*f, 0.06*f, 1);
    lampLight.intensity=2.3+0.6*Math.sin(t*19)*Math.sin(t*7);
  } else lampLight.intensity=0;

  // 스테이션 선택 링 하이라이트
  for(let i=0;i<2;i++){
    const tgtO=(i===ACTIVE)?0.6:0.0;
    const m=ST3D[i].padRing.material;
    m.opacity += (tgtO-m.opacity)*Math.min(dt*6,1);
  }

  // HUD (8Hz 갱신)
  hudAcc+=dt;
  if(hudAcc>0.12){ hudAcc=0; updateHUD(); syncBtns(); drawLens(); renderTimebar(); }

  // 렌즈 탭 회상 → 용기 scale 펄스 (§7-3, 1→1.04→1 · 0.6s)
  if(lensPulse){
    const el=performance.now()/1000 - lensPulse.t0;
    const S=ST3D[lensPulse.st];
    if(el>=0.6 || !S.vesselType){ if(S.vesselType) S.vg[S.vesselType].scale.setScalar(1); lensPulse=null; }
    else { const p=Math.sin(el/0.6*Math.PI); S.vg[S.vesselType].scale.setScalar(1+0.04*p); }
  }

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  ST3D.forEach(S=>{ S.steamUni.uScale.value=innerHeight*0.5; });
  lensResize();
});

/* ═════════ 미션 컨트롤러 (P4 · §8/§9) ═════════ */
const MISSION_LIST = K.MISSIONS, missionById = K.missionById;
let curMission=null, missionRun=null, predictOpen=false;
const $m = id => document.getElementById(id);
function openModal(id){ $m(id).classList.add('on'); }
function closeModal(id){ $m(id).classList.remove('on'); }

function buildMissionHome(){
  const mm=$m('mListMission'), mc=$m('mListChallenge'); mm.innerHTML=''; mc.innerHTML='';
  MISSION_LIST.forEach(ms=>{
    const el=document.createElement('div'); el.className='mItem';
    el.innerHTML=`<div class="mIc">${ms.icon||'🧪'}</div><div><div class="mTt">${ms.title}</div><div class="mBr">${ms.brief}</div></div>`;
    el.addEventListener('click',()=>{ closeModal('missionHome'); startMission(ms); });
    (ms.kind==='challenge'?mc:mm).appendChild(el);
  });
}
function startMission(ms){
  curMission=ms; missionRun=K.createMissionRun(world, ms); predictOpen=false;
  const bar=$m('goalBar');
  bar.querySelector('.gIcon').textContent = ms.kind==='challenge'?'🏆':'🎯';
  bar.querySelector('.gTitle').textContent = ms.title;
  bar.querySelector('.gHint').innerHTML = (ms.kind==='challenge'?'🔍 '+ms.brief:'👉 '+(ms.hint||ms.brief));
  bar.querySelector('.gProgFill').style.width='0%';
  bar.classList.add('on');
  toast((ms.kind==='challenge'?'🏆 도전: ':'🎯 미션: ')+'<b>'+ms.title+'</b> — '+(ms.hint||ms.brief), false, 5400);
}
function endMission(){ curMission=null; missionRun=null; $m('goalBar').classList.remove('on'); }
function endMissionKeepBanner(){ missionRun=null; }  // 성공 판정 후 재발화만 중단(배너는 성공카드 닫을 때 endMission)

function showPredict(pred){
  predictOpen=true;
  const card=$m('predictCard'), q=card.querySelector('.pQ'), opts=card.querySelector('.pOpts'),
        ex=card.querySelector('.pExplain'), next=card.querySelector('.pNext');
  q.textContent=pred.q; opts.innerHTML=''; ex.className='pExplain'; ex.textContent=pred.explain; next.className='pNext';
  pred.opts.forEach(o=>{
    const b=document.createElement('button'); b.className='pOpt'; b.textContent=o.label;
    b.addEventListener('click',()=>{
      opts.querySelectorAll('.pOpt').forEach(x=>x.style.pointerEvents='none');
      pred.opts.forEach((oo,i)=>{ const bb=opts.children[i];
        if(oo.k===pred.answer) bb.classList.add('right'); else if(oo.k===o.k) bb.classList.add('wrong'); });
      ex.classList.add('on'); next.classList.add('on');
    });
    opts.appendChild(b);
  });
  openModal('predictCard');
}
const SUCCESS_LINE={ boil_water:'물을 팔팔 끓였어요 — 온도가 100℃에 멈추는 걸 봤나요?',
  sea_salt:'끓여서 소금을 되찾았어요! 물만 날아가고 소금이 알갱이로 나왔죠(천일염 원리).',
  mass_lock:'뚜껑을 덮으니 수증기가 못 빠져나가 무게가 그대로! 사라진 게 아니라 갇힌 거예요.',
  one_drop:'중화점에서 마지막 한 방울에 색이 확 뒤집혔어요!' };
function showSuccess(ms){
  const card=$m('successCard');
  card.querySelector('.sIcon').textContent = ms.kind==='challenge'?'🏆':'🏅';
  card.querySelector('.sTitle').textContent = ms.kind==='challenge'?'도전 성공!':'미션 성공!';
  card.querySelector('.sBody').innerHTML = '<b>'+ms.title+'</b><br>'+(SUCCESS_LINE[ms.id]||'훌륭해요!');
  openModal('successCard');
}
$m('missionBtn').addEventListener('click',()=>openModal('missionHome'));
$m('mFreeBtn').addEventListener('click',()=>{ closeModal('missionHome'); endMission(); toast('✨ 자유 실험 — 무엇이든 조합해 봐요!'); });
$m('goalBar').querySelector('.gClose').addEventListener('click', endMission);
$m('predictCard').querySelector('.pNext').addEventListener('click',()=>{ closeModal('predictCard'); predictOpen=false; });
$m('successCard').querySelector('.sMore').addEventListener('click',()=>{ closeModal('successCard'); endMission(); openModal('missionHome'); });
$m('successCard').querySelector('.sFree').addEventListener('click',()=>{ closeModal('successCard'); endMission(); });
buildMissionHome();
// URL 진입: ?mission=<id> / ?challenge=<id>
const _qs=new URLSearchParams(location.search);
const qMission=_qs.get('mission')||_qs.get('challenge');

document.getElementById('loading').classList.add('hide');
lensResize();
toast('🧪 <b>과학실 2.0</b> — 실험대 두 곳에 무엇이든 조합해 봐요! 오른쪽 위 <b>🎯 미션·도전</b>도 눌러 보세요.', false, 5600);
updateHUD();
if(qMission){ const ms=missionById(qMission); if(ms) startMission(ms); }
else if(GRADE==='low'){ setTimeout(()=>openModal('missionHome'), 900); }   // 저학년 = 미션 모드 중심(§9)
animate();
</script>

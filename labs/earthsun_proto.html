<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌏 지구와 태양 — 발견의 여정</title>
<script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Jua',sans-serif;background:#0A1030;color:#EAF0FF;min-height:100vh;padding:10px 12px 34px;}
  h1{font-size:21px;text-align:center;margin:2px 0 4px;color:#FFF3BF;}
  .steps{display:flex;gap:8px;justify-content:center;margin:4px 0 8px;}
  .stepdot{width:30px;height:30px;border-radius:50%;border:2.5px solid #24346E;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5a7894;background:#101A44;}
  .stepdot.done{border-color:#12B886;color:#5CE1B9;}
  .stepdot.now{border-color:#FFD43B;color:#FFD43B;box-shadow:0 0 10px rgba(255,212,59,.35);}
  .quest{max-width:760px;margin:0 auto 8px;text-align:center;background:#101A44;border:2.5px solid #24346E;border-radius:16px;padding:9px 14px;}
  .quest .q{font-size:17.5px;color:#FFF3BF;line-height:1.4;}
  .quest .h{font-size:13px;color:#8aa0b6;margin-top:2px;}
  /* 계기판 — 필요한 것만 등장 */
  .dash{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .card{background:#101A44;border:2.5px solid #24346E;border-radius:16px;padding:8px 12px;text-align:center;min-width:112px;display:none;}
  .card.show{display:block;animation:pop .45s;}
  @keyframes pop{0%{transform:scale(.7);opacity:0;}70%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
  .card .t{font-size:12.5px;color:#8aa0b6;}
  .card .v{font-size:19px;color:#FFF3BF;margin-top:2px;line-height:1.15;}
  .card .s{font-size:12px;color:#5CE1B9;margin-top:1px;}
  .card.pulse{border-color:#FFD43B;box-shadow:0 0 12px rgba(255,212,59,.3);}
  /* 무대 */
  .stagewrap{position:relative;max-width:960px;margin:0 auto;}
  #stage{width:100%;height:44vh;min-height:300px;border-radius:22px;overflow:hidden;background:radial-gradient(120% 120% at 70% 25%,#131C4A 0%,#080D26 65%,#04071A 100%);box-shadow:inset 0 0 0 3px rgba(92,124,250,.16);touch-action:none;cursor:grab;display:block;}
  .stagewrap.ground #stage{position:absolute;right:10px;top:10px;width:180px;height:118px;min-height:0;border-radius:14px;z-index:3;}
  #sky{display:none;width:100%;height:44vh;min-height:300px;border-radius:22px;background:linear-gradient(#12224E 0%,#2B3B7E 55%,#3E4C8F 74%,#233314 76%,#1B2810 100%);box-shadow:inset 0 0 0 3px rgba(92,124,250,.16);}
  .stagewrap.ground #sky{display:block;}
  .tag{position:absolute;left:12px;top:12px;font-size:12px;font-weight:800;color:#9fb6e6;background:rgba(8,12,26,.6);padding:4px 9px;border-radius:9px;z-index:4;pointer-events:none;max-width:65%;line-height:1.35;}
  /* 컨트롤 — 단계별로 딱 필요한 것만 */
  #ctrl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0 4px;min-height:52px;}
  button{font-family:inherit;font-size:17px;font-weight:800;padding:11px 18px;border-radius:14px;border:2.5px solid #1565C0;background:#101A44;color:#9CC2FF;cursor:pointer;line-height:1;}
  button.big{font-size:20px;padding:14px 26px;border-color:#FF8A3D;color:#FFB27D;}
  button.big.on{background:#FF8A3D;color:#fff;}
  button.on{background:#1565C0;color:#fff;}
  button.next{border-color:#12B886;color:#5CE1B9;font-size:18px;}
  input[type=range]{-webkit-appearance:none;height:12px;border-radius:7px;background:#1B2A5E;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #1565C0;cursor:pointer;}
  .lbl{font-size:14.5px;color:#8aa0b6;}
  .val{font-size:15px;color:#5CE1B9;min-width:48px;text-align:center;}
  /* 발견 배너 */
  #found{max-width:780px;margin:10px auto;background:#0E2E26;border:3px solid #12B886;border-radius:18px;padding:13px 16px;text-align:center;display:none;animation:pop .5s;}
  #found .f{font-size:18px;color:#5CE1B9;line-height:1.5;}
  #pred{max-width:780px;margin:10px auto;background:#181040;border:2.5px solid #845EF7;border-radius:16px;padding:11px 13px;text-align:center;display:none;}
  #pred .q{font-size:16.5px;color:#CDB8FF;margin-bottom:9px;line-height:1.4;}
  .status{max-width:820px;margin:6px auto 0;text-align:center;font-size:14.5px;color:#8aa0b6;line-height:1.5;min-height:22px;}
  .hl{color:#FFD43B;}
</style>
</head>
<body>
<h1>🌏 지구와 태양 — 발견의 여정</h1>
<div class="steps">
  <div class="stepdot" id="st1">1</div><div class="stepdot" id="st2">2</div>
  <div class="stepdot" id="st3">3</div><div class="stepdot" id="st4">4</div>
  <div class="stepdot" id="st5">🔓</div>
</div>

<div class="quest"><div class="q" id="qTitle"></div><div class="h" id="qHint"></div></div>

<div class="dash">
  <div class="card" id="cClock"><div class="t">🕐 시각</div><div class="v" id="dClock">12:00</div><div class="s" id="dDayNight">☀️ 낮</div></div>
  <div class="card" id="cDate"><div class="t">📅 날짜</div><div class="v" id="dDate">—</div><div class="s" id="dSeason">—</div></div>
  <div class="card" id="cAlt" style="min-width:148px;"><div class="t">📐 정오 태양의 높이 (남중고도)</div>
    <svg viewBox="0 0 120 66" width="128" height="70">
      <path d="M 10 60 A 50 50 0 0 1 110 60" fill="none" stroke="#24346E" stroke-width="7" stroke-linecap="round"/>
      <path id="gArc" d="" fill="none" stroke="#FFD43B" stroke-width="7" stroke-linecap="round"/>
      <line id="gNeedle" x1="60" y1="60" x2="60" y2="16" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <text id="gTxt" x="60" y="56" text-anchor="middle" fill="#FFF3BF" font-size="16" font-weight="800" font-family="inherit">—</text>
    </svg></div>
  <div class="card" id="cLen" style="min-width:186px;"><div class="t">☀️ 낮의 길이</div>
    <svg viewBox="0 0 200 30" width="192" height="32">
      <rect x="4" y="8" width="192" height="14" rx="7" fill="#16204C"/>
      <rect id="bDay" x="4" y="8" width="0" height="14" rx="7" fill="#FFB84D"/>
    </svg><div class="s" id="dLen">—</div></div>
  <div class="card" id="cLat"><div class="t">🧭 관측 위도</div><div class="v" id="dLat">37.5°</div><div class="s" id="dLatNm">서울 근처</div></div>
  <div class="card" id="cSun" style="min-width:158px;"><div class="t">🔦 땅 1칸이 받는 정오 햇빛</div>
    <svg viewBox="0 0 120 56" width="130" height="60">
      <polygon id="rayPoly" points="" fill="#FFD43B" opacity="0.32"/>
      <line id="rayL1" x1="0" y1="0" x2="0" y2="0" stroke="#FFD43B" stroke-width="1.6"/>
      <line id="rayL2" x1="0" y1="0" x2="0" y2="0" stroke="#FFD43B" stroke-width="1.6"/>
      <line x1="4" y1="46" x2="116" y2="46" stroke="#6b8a4a" stroke-width="3"/>
      <rect id="rayFoot" x="0" y="44" width="0" height="5" rx="2" fill="#FF8A3D"/>
    </svg><div class="s" id="dSunPct">—</div></div>
  <div class="card" id="cSpd" style="min-width:158px;"><div class="t">🚀 지금 너의 속도</div>
    <div class="v" id="dSpin" style="font-size:16px;">—</div>
    <div class="s" id="dOrb">공전: 시속 107,000 km</div></div>
</div>

<div class="stagewrap" id="wrap">
  <div class="tag" id="viewTag"></div>
  <canvas id="stage"></canvas>
  <svg id="sky" viewBox="-100 -66 200 100" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div id="ctrl"></div>
<div id="found"><div class="f" id="foundTxt"></div><div style="margin-top:10px;"><button class="next" id="nextBtn">다음 발견으로 →</button></div></div>
<div id="pred"></div>
<div class="status" id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var D2R=Math.PI/180;
  /* ── 상태 ── */
  var simDay=182, simHour=9, lat=37.5, tilt=23.44;
  var playing=false, unit='h', view='earth', stage=1;
  var hoursRun=0, monthsPressed=0, visitedSummer=false, visitedWinter=false;
  var predCh=-1, predDone=false;

  /* ── 과학 코어 (실제 공식 — 시제품 1호에서 실측 일치 검증 완료) ── */
  function orbA(){ return simDay/365.25*Math.PI*2; }
  function decl(){ return Math.asin(Math.sin(tilt*D2R)*-Math.cos(orbA()))/D2R; }
  function noonAlt(){ return 90-Math.abs(lat-decl()); }
  function dayLen(){ var c=-Math.tan(lat*D2R)*Math.tan(decl()*D2R);
    if(c<=-1)return 24; if(c>=1)return 0; return 2*Math.acos(c)/D2R/15; }
  function sunAlt(h){ var HA=(h-12)*15*D2R,d=decl()*D2R,f=lat*D2R;
    return Math.asin(Math.sin(f)*Math.sin(d)+Math.cos(f)*Math.cos(d)*Math.cos(HA))/D2R; }
  function dateStr(){ var d=Math.floor(simDay),m=12,dd=21+d,L={1:31,2:28,3:31,4:30,5:31,6:30,7:31,8:31,9:30,10:31,11:30,12:31};
    while(dd>L[m]){dd-=L[m];m=m%12+1;} return m+'월 '+dd+'일'; }
  function seasonStr(){ if(tilt<1)return '계절 없음!';
    var d=decl(),n=lat>=0;
    if(d>15)return n?'여름':'겨울'; if(d<-15)return n?'겨울':'여름';
    return (orbA()<Math.PI)?(n?'봄':'가을'):(n?'가을':'봄'); }

  /* ── THREE ── */
  var cv=document.getElementById('stage');
  var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  var scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,2,0.1,200);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  function fit(){ var w=cv.clientWidth||900,h=cv.clientHeight||360; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  scene.add(new THREE.AmbientLight(0xffffff,0.16));
  var sunLight=new THREE.PointLight(0xffffff,1.7,0,2); scene.add(sunLight);
  var sc=document.createElement('canvas');sc.width=256;sc.height=256;var sx=sc.getContext('2d');
  var g=sx.createRadialGradient(128,128,20,128,128,124);g.addColorStop(0,'#FFF7D6');g.addColorStop(.35,'#FFD43B');g.addColorStop(1,'rgba(255,180,50,0)');
  sx.fillStyle=g;sx.fillRect(0,0,256,256);
  var sun=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
  sun.scale.set(3.6,3.6,1);scene.add(sun);
  var ORB=7;
  var ring=new THREE.Mesh(new THREE.RingGeometry(ORB-.03,ORB+.03,96),new THREE.MeshBasicMaterial({color:0x3a4a7a,side:THREE.DoubleSide,transparent:true,opacity:.55}));
  ring.rotation.x=Math.PI/2;scene.add(ring);
  (function(){var geo=new THREE.BufferGeometry(),p=[];
    for(var i=0;i<380;i++){var r=60+Math.random()*40,t=Math.random()*6.283,f=Math.acos(2*Math.random()-1);
      p.push(r*Math.sin(f)*Math.cos(t),r*Math.cos(f),r*Math.sin(f)*Math.sin(t));}
    geo.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0x8aa0d6,size:.35})));})();
  var earthPos=new THREE.Group(),tiltGrp=new THREE.Group(),spinGrp=new THREE.Group();
  scene.add(earthPos);earthPos.add(tiltGrp);tiltGrp.add(spinGrp);
  function fbTex(){var c=document.createElement('canvas');c.width=512;c.height=256;var x=c.getContext('2d');
    x.fillStyle='#1565C0';x.fillRect(0,0,512,256);x.fillStyle='#2F9E44';
    [[80,80,70,50],[200,120,80,55],[340,90,70,50],[430,160,50,40],[140,180,55,40]].forEach(function(b){x.beginPath();x.ellipse(b[0],b[1],b[2],b[3],0,0,7);x.fill();});
    return new THREE.CanvasTexture(c);}
  var earth=new THREE.Mesh(new THREE.SphereGeometry(1.1,48,36),new THREE.MeshLambertMaterial({map:fbTex()}));
  spinGrp.add(earth);
  (function(){var im=new Image();
    im.onload=function(){var c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
      c.getContext('2d').drawImage(im,0,0);earth.material.map=new THREE.CanvasTexture(c);earth.material.needsUpdate=true;};
    im.src='/kedu/teacher/engine/tools/assets/textures/earth/earth_day.png';})();
  var axis=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,3.6,8),new THREE.MeshBasicMaterial({color:0xFF8A3D}));
  tiltGrp.add(axis);
  var npole=new THREE.Mesh(new THREE.ConeGeometry(.11,.24,10),new THREE.MeshBasicMaterial({color:0xFF8A3D}));
  npole.position.y=1.86; tiltGrp.add(npole);   // 북극 화살
  var refAxis=new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,3.4,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.32}));
  earthPos.add(refAxis);                        // 궤도면 수직 기준선(흰) — 주황 축과의 벌어짐 = 23.4°
  var pin=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),new THREE.MeshBasicMaterial({color:0xFF5D5D}));
  spinGrp.add(pin);
  function pinPos(){var lr=lat*D2R;pin.position.set(Math.cos(lr),Math.sin(lr),0).multiplyScalar(1.12);}
  pinPos();
  var pin2=new THREE.Mesh(new THREE.SphereGeometry(.06,12,10),new THREE.MeshBasicMaterial({color:0x5CE1B9}));
  (function(){var lr=-33.9*D2R;pin2.position.set(Math.cos(lr),Math.sin(lr),0).multiplyScalar(1.12);})();
  pin2.visible=false; spinGrp.add(pin2);   // 🎄 시드니 핀 — 자유 실험실에서
  /* 4계절 고스트 — 궤도 네 자리에 축이 '평행하게' 기운 반투명 지구 (교과서 그림의 3D판) */
  var ghostGrp=new THREE.Group(); scene.add(ghostGrp);
  var ghostAxes=[];
  function lblSprite(txt,col){
    var c=document.createElement('canvas');c.width=180;c.height=64;var x=c.getContext('2d');
    x.font='800 40px Jua, sans-serif'; x.fillStyle=col; x.textAlign='center'; x.fillText(txt,90,46);
    var s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
    s.scale.set(2.1,.75,1); return s;
  }
  [[0,'동지','#7FA8FF'],[Math.PI/2,'춘분','#5CE1B9'],[Math.PI,'하지','#FF8A3D'],[3*Math.PI/2,'추분','#D8B4FF']].forEach(function(gd){
    var grp=new THREE.Group();
    grp.position.set(Math.cos(gd[0])*ORB,0,Math.sin(gd[0])*ORB);
    var tg=new THREE.Group(); grp.add(tg); ghostAxes.push(tg);
    tg.add(new THREE.Mesh(new THREE.SphereGeometry(.5,20,14),new THREE.MeshLambertMaterial({color:0x9CC2FF,transparent:true,opacity:.34})));
    var ax=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,1.8,8),new THREE.MeshBasicMaterial({color:0xFF8A3D,transparent:true,opacity:.85}));
    tg.add(ax);
    var lb=lblSprite(gd[1],gd[2]); lb.position.y=1.5; grp.add(lb);
    ghostGrp.add(grp);
  });
  var th=0.85,ph=0.95;
  function camUpd(){
    var t=(view==='space')?new THREE.Vector3(0,0,0):earthPos.position.clone();
    var r=(view==='space')?16:3.4;
    camera.position.set(t.x+r*Math.sin(ph)*Math.sin(th),t.y+r*Math.cos(ph),t.z+r*Math.sin(ph)*Math.cos(th));
    camera.lookAt(t);
  }

  /* ── 하늘 돔 ── */
  var sky=document.getElementById('sky');
  function S(t,a){var e=document.createElementNS('http://www.w3.org/2000/svg',t);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function drawSky(){
    if(!document.getElementById('wrap').classList.contains('ground'))return;
    sky.innerHTML='';
    var HOR=22;
    sky.appendChild(S('line',{x1:-96,y1:HOR,x2:96,y2:HOR,stroke:'#6b8a4a','stroke-width':2.4}));
    [['동',-88],['남',0],['서',88]].forEach(function(p){
      var t=S('text',{x:p[1],y:HOR+9,'text-anchor':'middle',fill:'#9fb6e6','font-size':7.5,'font-weight':800,'font-family':'inherit'});
      t.textContent=p[0];sky.appendChild(t);});
    function XY(h){var a=sunAlt(h);return{x:(h-12)*8,y:HOR-a*.72,a:a};}
    var d='',first=true;
    for(var h=0;h<=24;h+=.25){var p=XY(h);if(p.a>-2){d+=(first?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)+' ';first=false;}}
    if(d)sky.appendChild(S('path',{d:d,fill:'none',stroke:'#FFD43B','stroke-width':1.6,'stroke-dasharray':'3 3',opacity:.85}));
    if(stage>=4){ /* 남중 고스트 3점 — 4단계(범인 찾기)에서 등장 */
      [[1,'하짓날','#FF8A3D'],[0,'춘·추분','#5CE1B9'],[-1,'동짓날','#7FA8FF']].forEach(function(gd){
        var dd=Math.asin(Math.sin(tilt*D2R)*gd[0])/D2R,a=90-Math.abs(lat-dd);
        if(a<0)return;var y=HOR-a*.72;
        sky.appendChild(S('circle',{cx:0,cy:y,r:2.6,fill:gd[2],opacity:.9}));
        var t=S('text',{x:5,y:y+2,'font-size':6.4,fill:gd[2],'font-weight':800,'font-family':'inherit'});
        t.textContent=gd[1]+' 남중 '+Math.round(a)+'°';sky.appendChild(t);});
    }
    /* 🌅 일출 방위 마커 (3단계+) — 해 뜨는 자리가 계절따라 움직인다! 정동은 춘·추분뿐 */
    if(stage>=3){
      var dl0=dayLen();
      if(dl0>0.01&&dl0<23.99){
        var rx=(12-dl0/2-12)*8;
        sky.appendChild(S('path',{d:'M '+rx.toFixed(1)+' '+HOR+' l -3.4 6 l 6.8 0 Z',fill:'#FFB84D'}));
        var rt=S('text',{x:rx.toFixed(1),y:HOR+15,'text-anchor':'middle','font-size':6,fill:'#FFB84D','font-weight':800,'font-family':'inherit'});
        rt.textContent='🌅 해 뜨는 곳'; sky.appendChild(rt);
      }
      sky.appendChild(S('line',{x1:-48,y1:HOR-2,x2:-48,y2:HOR+2,stroke:'#5CE1B9','stroke-width':1.4}));
      var et=S('text',{x:-48,y:HOR-4,'text-anchor':'middle','font-size':5.4,fill:'#5CE1B9','font-weight':800,'font-family':'inherit'});
      et.textContent='정동(춘·추분만!)'; sky.appendChild(et);
    }
    /* 🕯️ 그림자 막대 (3단계·자유 실험실) — 여름 정오 그림자가 가장 짧다! */
    if(stage===3||stage===5){
      var stkX=(stage===3)?0:34, stkH=8;
      var aNow=sunAlt(simHour);
      sky.appendChild(S('line',{x1:stkX,y1:HOR,x2:stkX,y2:HOR-stkH,stroke:'#D8C6A8','stroke-width':2.6,'stroke-linecap':'round'}));
      if(aNow>1){
        var cpx=(simHour-12)*8;
        var sdir=(cpx>=stkX)?-1:1;
        var slen=Math.min(stkH/Math.tan(aNow*D2R),78);
        sky.appendChild(S('line',{x1:stkX,y1:HOR,x2:(stkX+sdir*slen).toFixed(1),y2:HOR,stroke:'#2E3A22','stroke-width':2.8,opacity:.85,'stroke-linecap':'round'}));
        var sm=S('text',{x:stkX,y:HOR+15,'text-anchor':'middle','font-size':6,fill:'#D8C6A8','font-weight':800,'font-family':'inherit'});
        sm.textContent='🕯️ 막대 1m → 그림자 '+(1/Math.tan(aNow*D2R)).toFixed(1)+'m';
        sky.appendChild(sm);
      }
    }
    var cp=XY(simHour);
    if(cp.a>0){
      sky.appendChild(S('circle',{cx:cp.x,cy:cp.y,r:5,fill:'#FFD43B'}));

  /* ── 계기판 (등장한 카드만 갱신) ── */
  function E(id){return document.getElementById(id);}

  function fmtH(h){h=((h%24)+24)%24;var hh=Math.floor(h),mm=Math.floor((h-hh)*60);return(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;}
  function dash(){
    E('dClock').textContent=fmtH(simHour);
    var alt=sunAlt(simHour);
    E('dDayNight').textContent=alt>0?'☀️ 낮 (고도 '+Math.round(alt)+'°)':'🌙 밤';
    E('dDate').textContent=dateStr();
    E('dSeason').textContent=seasonStr()+' · 태양 적위 '+decl().toFixed(1)+'°';
    var na=Math.max(0,noonAlt()),frac=Math.min(na,90)/90,endA=Math.PI*(1-frac);
    E('gArc').setAttribute('d','M 10 60 A 50 50 0 0 1 '+(60+50*Math.cos(endA)).toFixed(1)+' '+(60-50*Math.sin(endA)).toFixed(1));
    E('gNeedle').setAttribute('x2',(60+44*Math.cos(endA)).toFixed(1));
    E('gNeedle').setAttribute('y2',(60-44*Math.sin(endA)).toFixed(1));
    E('gTxt').textContent=(noonAlt()<0)?'극야':Math.round(na)+'°';
    var dl=dayLen(),rise=12-dl/2;
    E('bDay').setAttribute('x',(4+rise/24*192).toFixed(1));
    E('bDay').setAttribute('width',(dl/24*192).toFixed(1));
    E('dLen').textContent=(dl>=23.99)?'백야 — 24시간 낮!':(dl<=0.01)?'극야 — 해가 안 떠요':'낮 '+dl.toFixed(1)+'시간';
    E('dLat').textContent=lat.toFixed(1)+'°';
    /* 🔦 햇빛 다발 — 같은 굵기의 빛이 비스듬하면 넓게 퍼져 1칸 에너지가 준다 (겨울이 추운 진짜 이유) */
    var aa=Math.max(3,Math.min(90,noonAlt())), ar=aa*D2R, GY=46, BW=15;
    var f=Math.min(BW/Math.sin(ar),100), x1=60-f/2, x2=60+f/2, L=36;
    var dx=Math.cos(ar), dy=Math.sin(ar);
    var s1x=x1+dx*L, s1y=GY-dy*L, s2x=x2+dx*L, s2y=GY-dy*L;
    E('rayPoly').setAttribute('points',s1x.toFixed(1)+','+s1y.toFixed(1)+' '+s2x.toFixed(1)+','+s2y.toFixed(1)+' '+x2.toFixed(1)+','+GY+' '+x1.toFixed(1)+','+GY);
    E('rayL1').setAttribute('x1',s1x.toFixed(1));E('rayL1').setAttribute('y1',s1y.toFixed(1));E('rayL1').setAttribute('x2',x1.toFixed(1));E('rayL1').setAttribute('y2',GY);
    E('rayL2').setAttribute('x1',s2x.toFixed(1));E('rayL2').setAttribute('y1',s2y.toFixed(1));E('rayL2').setAttribute('x2',x2.toFixed(1));E('rayL2').setAttribute('y2',GY);
    E('rayFoot').setAttribute('x',x1.toFixed(1));E('rayFoot').setAttribute('width',f.toFixed(1));
    var en=Math.round(Math.max(0,Math.sin((Math.max(0,noonAlt()))*D2R))*100);
    E('rayFoot').setAttribute('fill', en>75?'#12B886':en>45?'#FFB84D':'#FF5D5D');
    E('dSunPct').textContent=(noonAlt()<0)?'극야 — 0%':'같은 햇빛이 '+(f/BW).toFixed(1)+'배로 퍼짐 → 에너지 '+en+'%';
    /* 🚀 속도 — 자전 선속도 = 1674×cos(위도) km/h */
    var spin=Math.round(1674*Math.cos(lat*D2R));
    E('dSpin').textContent='자전: 시속 '+spin.toLocaleString()+' km'+(spin>1200?' (소리보다 빨라!)':spin<50?' (극점은 제자리 팽이!)':'');
    E('dLatNm').textContent=Math.abs(lat-37.5)<1?'서울 근처':(lat>66.5?'북극권!':(lat<-66.5?'남극권!':(lat<0?'남반구':'북반구')));
  }

  /* ── 루프 ── */
  var last=0, RATE={h:0,d:1,w:5,m:26};
  function frame(now){
    if(playing){
      if(!last)last=now;var dt=Math.min((now-last)/1000,.06);last=now;
      if(unit==='h'){
        simHour+=dt*3;
        if(stage===1){hoursRun+=dt*3;
          if(hoursRun>=24){hoursRun=0;
            discover('🔭 <b>발견!</b> 해는 어디로 가는 게 아니었어 — <b>지구가 스스로 한 바퀴 도는 것(자전)</b>이었어! 지구가 도니까 내가 태양 쪽을 보면 낮, 등지면 밤. 한 바퀴 = 하루(24시간)야.');
            var pb=E('p1');if(pb){pb.textContent='▶ 하루 살아보기';pb.classList.remove('on');}
          }}
      } else { simDay+=dt*RATE[unit]; simHour+=dt*RATE[unit]*24; }
      while(simHour>=24)simHour-=24; while(simDay>=365.25)simDay-=365.25;
      dash(); drawSky();
      var fd=E('f_date'); if(fd)fd.value=Math.floor(simDay);
    }
    var a=orbA();
    earthPos.position.set(Math.cos(a)*ORB,0,Math.sin(a)*ORB);
    tiltGrp.rotation.z=-tilt*D2R;   /* 축은 늘 +X 쪽(우주 고정) — a=0(동지)에 북극이 태양 반대쪽 = decl() 수식과 일치 */
    ghostGrp.visible=(view==='space'&&stage>=2);
    for(var gi=0;gi<ghostAxes.length;gi++)ghostAxes[gi].rotation.z=-tilt*D2R;   /* 네 축이 언제나 평행 */
    spinGrp.rotation.y=(simHour/24)*Math.PI*2-a+Math.PI;
    camUpd(); renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }

  /* 카메라 드래그 */
  var drag=false,px=0,py=0;
  function dn(e){drag=true;var p=e.touches?e.touches[0]:e;px=p.clientX;py=p.clientY;}
  function mv(e){if(!drag)return;var p=e.touches?e.touches[0]:e;
    th-=(p.clientX-px)*.008;ph-=(p.clientY-py)*.006;ph=Math.max(.2,Math.min(1.45,ph));
    px=p.clientX;py=p.clientY;if(e.touches)e.preventDefault();}
  function up(){drag=false;}
  cv.addEventListener('mousedown',dn);cv.addEventListener('touchstart',dn,{passive:false});
  cv.addEventListener('touchmove',function(e){if(drag){mv(e);e.preventDefault();}},{passive:false});
  window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);cv.addEventListener('touchend',up);
  window.addEventListener('resize',fit);

  setStage(1); fit(); requestAnimationFrame(frame);
})();
</script>

  케이랩 과학실(SciLab) E-4 용해·재결정 — 황금 샘플(scilab.html 물 끓이기 v0.2) 복사→스왑.
  흡수: v2 dissolve.js 용해도 곡선·포화·★재결정 와우(예측 빗나감형 12호). SPEC_E4.md 기반.
    · 미션: 물 비커 → 설탕 → 유리막대(젓기) → 온도계
    · 현상: 저을수록·따뜻할수록 빨리·많이 녹음 → 포화 → ★냉각 시 석출(재결정)
    · ★와우(중/고): 다 녹아 사라진 설탕이 식히면 도로 나옴 — 물질 보존(사라진 게 아니라 숨은 것)
    · 신기법 = 석출 결정(§3-B 승격): 불투명 InstancedMesh — E-3 얼음 조각 함정 해법 그대로
  렌더 표준(데모 1호 확정): three r185 벤더 · ACES · RoomEnvironment PMREM · PCFSoft · 유리=블렌딩 · 액체=굴절 · 품질 자동

<style>

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#171b21;font-family:'Gowun Dodum',sans-serif}

  .eq .nm{font-size:11.5px;margin-top:4px;line-height:1.25}

  #success{bottom:50%;transform:translate(-50%,50%);text-align:center}

    #mission{max-width:86vw;padding:9px 12px}
    #mission .mp{display:none}
    .eq{width:76px} .eq .ic{font-size:23px}

</style>

<!-- ═══ 순수 로직 (렌더러 무관 · node 테스트 대상) ═══ -->
<script>
(function(){
  'use strict';

  /* ── 용해·재결정 시뮬 (SPEC_E4 A-2 — v2 dissolve 용해도 곡선. 냉각 시 초과분 석출) ── */
  function createDissolveSim(){
    var S = { temp:20, sugar:0, dissolved:0, precip:0, stir:false, phase:'clear', satEver:false };
    var SUGAR_W=8;   // 각설탕 1개 무게(g) — 저울 표시용
    function LIMIT(t){ return Math.round(18 + t*0.6); }   // 용해도(각설탕 개수) — v2 sugar 원본
    function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
    function addSugar(n){ S.sugar += n; }
    function setTemp(t){ S.temp = clamp(t, 10, 80); }
    function stir(on){ S.stir = !!on; }
    function step(dt, inp){
      if(dt>0.05) dt=0.05;
      var lim = LIMIT(S.temp);
      // 녹기: 한계까지 서서히 (저으면 3배 빠름)
      var canDissolve = Math.min(S.sugar, lim) - S.dissolved;
      if(canDissolve > 0){
        S.dissolved += Math.min(canDissolve, (S.stir?0.9:0.3)*dt);
      }
      // ★재결정/석출: 한계가 녹은 양보다 낮아지면(냉각) 초과분이 도로 나옴
      if(S.dissolved > lim){
        var back = Math.min(S.dissolved - lim, 0.6*dt);
        S.dissolved -= back;
        S.satEver = true;
      }
      S.precip = S.sugar - S.dissolved;   // 안 녹은 + 석출된 총 미용해량
      if(S.precip < 0) S.precip = 0;
      var atLimit = (S.dissolved >= lim - 0.05);
      var canMore = (Math.min(S.sugar, lim) - S.dissolved) > 0.05;
      if(S.satEver && S.precip > 0.3) S.phase='recrystal';           // 냉각 석출
      else if(atLimit && S.sugar > lim + 0.3) S.phase='saturated';   // 한계까지 녹고 남음
      else if(canMore) S.phase='dissolving';                         // 아직 녹는 중
      else if(S.sugar > 0.05) S.phase='dissolved';                   // 다 녹아 맑음(사라진 듯)
      else S.phase='clear';                                          // 설탕 안 넣음
      return S;
    }
    function totalMass(){ return 100 + Math.round(S.sugar*SUGAR_W); }   // 물 100g + 설탕 (무게 보존)
    return { state:S, step:step, addSugar:addSugar, setTemp:setTemp, stir:stir,
             LIMIT:LIMIT, totalMass:totalMass, SUGAR_W:SUGAR_W };
  }

  /* ── 미션 정의 (SPEC_E4 A-1) ── */
  var MISSION_DISSOLVE = {
    id:'dissolve_recrystal',
    title:'용해와 재결정 — 사라진 설탕은 어디에?',
    required:['beaker_w','sugar','rod','thermo'],
    needs:{
      sugar: { pre:['beaker_w'], msg:'설탕을 녹일 <b>물(비커)이 먼저</b> 있어야죠!' },
      rod:   { pre:['beaker_w'], msg:'유리막대로 저으려면 <b>저을 용액(비커)이 먼저</b>!' },
      thermo:{ pre:['beaker_w'], msg:'온도계는 물에 꽂아 재요 — <b>물이 든 비커가 먼저</b>!' }
    },
    wrong:{
      magnet:'🧲 자석은 철을 끌어당기는 도구 — 설탕이 녹는 것과는 상관없어요.',
      magnifier:'🔍 돋보기는 작은 것을 볼 때! 녹고 나면 눈에 안 보여요(입자로 섞임).',
      cup_l:'🫙 빈 컵은 이 실험엔 필요 없어요 — 물이 든 비커에 녹여요.',
      candle:'🕯️ 초는 연소 실험에서! 오늘은 <b>물에 녹이고 식혀</b> 관찰해요.'
    }
  };

  function createMissionRun(M){
    var placed={}, wrongCount=0, ready=false;
    function pick(id, freeMode){
      if(placed[id]) return {act:'already'};
      if(!freeMode && M.wrong[id]) { wrongCount++; return {act:'wrong', msg:M.wrong[id]}; }
      var rule = M.needs[id];
      if(rule){
        for(var i=0;i<rule.pre.length;i++)
          if(!placed[rule.pre[i]]) return {act:'blocked', msg:rule.msg};
      }
      placed[id]=true;
      ready = M.required.every(function(r){return placed[r];});
      return {act:'placed', ready:ready};
    }
    function remove(id){
      if(!placed[id]) return false;
      Object.keys(M.needs).forEach(function(k){
        if(placed[k] && M.needs[k].pre.indexOf(id)>=0) remove(k);
      });
      delete placed[id];
      ready=false;
      return true;
    }
    function count(){ return M.required.filter(function(r){return placed[r];}).length; }
    return { placed:placed, pick:pick, remove:remove, count:count,
             isReady:function(){return ready;}, wrongCount:function(){return wrongCount;} };
  }

  var API = { createDissolveSim:createDissolveSim, MISSION_DISSOLVE:MISSION_DISSOLVE, createMissionRun:createMissionRun };
  if(typeof window!=='undefined'){ window.SciLab=API; }
  if(typeof module!=='undefined' && module.exports){ module.exports=API; }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ═════════ 렌더 기반 (데모 1호 확정 표준) ═════════ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
// ⚠️ WebGL 컨텍스트 유실 가드(강건성표준 R4, 2026-07-08 페이블): 전자칠판·태블릿 장시간 사용 후 검은 화면 방지
renderer.domElement.addEventListener('webglcontextlost',function(e){ e.preventDefault();
  if(document.getElementById('ctxlost'))return;
  var o=document.createElement('div'); o.id='ctxlost';
  o.style.cssText='position:fixed;inset:0;background:rgba(10,12,16,.93);color:#e8ecf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999';
  var t=document.createElement('div'); t.textContent='화면이 잠시 멈췄어요'; t.style.cssText='font-size:20px;font-weight:700';
  var b=document.createElement('button'); b.textContent='다시 열기';
  b.style.cssText='padding:10px 26px;border-radius:12px;border:0;background:#5B9BF0;color:#fff;font-size:16px;cursor:pointer';
  b.addEventListener('click',function(){ location.reload(); });
  o.appendChild(t); o.appendChild(b); document.body.appendChild(o);
});


const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2b3340'); gr.addColorStop(.55,'#1b2129'); gr.addColorStop(1,'#12161c');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const bg=new THREE.CanvasTexture(c); bg.colorSpace=THREE.SRGBColorSpace;
  scene.background=bg;
}
scene.fog = new THREE.Fog(0x161b22, 4.2, 9.5);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 30);
camera.position.set(0.95, 0.9, 1.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.32, -0.02);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=0.65; controls.maxDistance=3.4;
controls.maxPolarAngle=1.46; controls.enablePan=false;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(1.8,3.4,1.6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-1.8; sun.shadow.camera.right=1.8;
sun.shadow.camera.top=2.2; sun.shadow.camera.bottom=-0.6;
sun.shadow.camera.near=0.5; sun.shadow.camera.far=9;
sun.shadow.bias=-0.0004; sun.shadow.radius=5;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x2b241c, 0.35));

/* 재질 — 유리=블렌딩, 액체=굴절(데모 1호 확정) */
const GLASS = new THREE.MeshPhysicalMaterial({

    precipMesh.userData.pos.push({

function onPick(id, cardEl){
  if(succeeded && !freeMode) return;
  if(run.placed[id]){
    run.remove(id);
    Object.keys(EQ_OBJ).forEach(k=>{ if(!run.placed[k] && EQ_OBJ[k]) EQ_OBJ[k].visible=false; });
    syncTray(); renderProg(); updateCtrls(); updateHUD();
    return;
  }
  const r=run.pick(id, freeMode);
  if(r.act==='wrong' || r.act==='blocked'){
    cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
    toast(r.msg, true, r.act==='wrong'?4200:3800);
    return;
  }
  if(r.act==='placed'){
    const o=EQ_OBJ[id];
    if(o.userData.free){ const [x,z]=nextSpot(); o.position.x=x; o.position.z=z; }
    dropIn(id);
    syncTray(); renderProg(); updateCtrls(); updateHUD();
    if(r.ready && !freeMode && !predictShown){
      toast('✅ 준비 끝! 🍬 설탕을 넣고 🥄 저어 녹여 봐요');
    } else if(r.ready && freeMode){
      toast('준비 완료 — 설탕 넣고 젓고, 온도를 바꿔 봐요');
    }
  }
}

});

  b.addEventListener('click',()=>{
    prediction2=b.dataset.pick; predict2El.classList.add('hide');
    toast(prediction2==='same'?'🎯 예측 접수! 계속 지켜봐요':'🤔 정말 다른 물질일까요?', false, 4000);
  });
});

modeBtn.addEventListener('click',()=>{
  freeMode=!freeMode;
  modeBtn.textContent=freeMode?'🎯 미션 모드':'🧪 자유 실험';
  missionEl.style.display=freeMode?'none':'';
  document.querySelector('#topbar .badge').textContent=freeMode?'자유 실험':'미션 · 용해와 재결정';
  toast(freeMode?'자유 실험 — 무엇이든 해보세요':'미션 모드 — 필요한 기구만!');
});

function resetAll(keepMode){
  sim=createDissolveSim(); run=createMissionRun(MISSION_DISSOLVE);
  Object.keys(EQ_OBJ).forEach(k=>{ if(EQ_OBJ[k]) EQ_OBJ[k].visible=false; });
  prediction=null; predictShown=false; succeeded=false; successAt=0;
  prediction2=null; predict2Shown=false; precipShown=false; clearedOnce=false;
  stirring=false; sugarAnimT=-1; spotIdx=0;
  sugarFly.forEach(f=>RIG.remove(f.o)); sugarFly.length=0;
  sugarCubes.forEach(c=>{ c.visible=true; c.scale.setScalar(1); });
  stirBtn.textContent='🥄 젓기'; stirBtn.classList.add('off');
  // 석출·물색 리셋
  precipMesh.visible=false;
  for(let i=0;i<PRECIP_MAX;i++){ precipTarget[i]=0; precipCur[i]=0; }
  dissolveWaterMat.attenuationColor.set(0xBFE3F5);
  stateEl.textContent='설탕을 넣고 저어 녹여 봐요 — 그다음 식혀 보세요';
  predictEl.classList.add('hide'); predict2El.classList.add('hide'); successEl.classList.add('hide');
  syncTray(); renderProg(); updateCtrls(); updateHUD();
  if(!keepMode && freeMode){ modeBtn.click(); }
}
resetBtn.addEventListener('click',()=>resetAll(true));
$('sucAgain').addEventListener('click',()=>resetAll(true));
$('sucFree').addEventListener('click',()=>{ successEl.classList.add('hide'); if(!freeMode) modeBtn.click(); });


/* ═════════ 품질 자동 ═════════ */
let frames=0, fpsStart=performance.now(), qualityChecked=false;
function checkQuality(now){
  frames++;
  if(qualityChecked) return;
  if(now-fpsStart>4000){
    qualityChecked=true;
    const fps=frames/((now-fpsStart)/1000);
    if(fps<38){
      renderer.setPixelRatio(1);
      sun.shadow.mapSize.set(1024,1024);
      if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
      sun.shadow.radius=3;
    }
  }
}

/* ═════════ 메인 루프 ═════════ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.elapsedTime;

  // 등장 연출
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt*3.2;
    const k=Math.min(d.t,1), e=1-Math.pow(1-k,3);
    d.o.position.y=d.o.userData.baseY+0.28*(1-e);
    if(k>=1){ d.o.position.y=d.o.userData.baseY; drops.splice(i,1); }
  }

  const ready = run.isReady();
  const S=sim.step(dt, {});

  // 설탕 투입 연출 — 접시 위 → 비커 수면 낙하 → 녹으며 사라짐
  for(let i=sugarFly.length-1;i>=0;i--){
    const f=sugarFly[i]; f.t+=dt*1.4;
    const k=Math.min(f.t,1);
    f.o.position.x = (BK_R+0.07)*(1-k);            // 접시 → 비커 중앙
    f.o.position.y = 0.05 + (WATER_H-0.05)*k;      // 위 → 수면
    if(k>0.55){ const m=(k-0.55)/0.45; f.o.scale.setScalar(1-m); }  // 수면 닿은 뒤 녹음
    f.o.rotation.y += dt*3;
    if(k>=1){ RIG.remove(f.o); sugarFly.splice(i,1); }
  }
  // 물색: 녹은 설탕 농도 반영 (맑은 청 → 살짝 황갈, dissolve 비례)
  if(run.placed.beaker_w){
    const conc=Math.min(S.dissolved/40, 1);
    dissolveWaterMat.attenuationColor.lerp(new THREE.Color().setRGB(
      0.75 - conc*0.15, 0.89 - conc*0.12, 0.96 - conc*0.20), Math.min(dt*1.5,1));
  }

  // ★석출 결정 렌더 (§3-B — visible 수 = precip 비례)
  if(run.placed.beaker_w){
    const showN = Math.min(PRECIP_MAX, Math.floor(S.precip * PRECIP_PER));
    let anyNew=false;
    precipMesh.visible = showN>0;
    for(let i=0;i<PRECIP_MAX;i++){
      precipTarget[i] = (i<showN) ? 1 : 0;
      const before=precipCur[i];
      precipCur[i] += (precipTarget[i]-precipCur[i])*Math.min(dt*5,1);
      if(precipCur[i]<0.001 && precipTarget[i]===0){ precipCur[i]=0; }
      if(before<0.02 && precipCur[i]>=0.02) anyNew=true;
      const p=precipMesh.userData.pos[i];
      precipDummy.position.set(p.x, p.y, p.z);
      precipDummy.rotation.set(p.rx, p.ry, 0);
      precipDummy.scale.setScalar(precipCur[i]<0.001?0.001:precipCur[i]);
      precipDummy.updateMatrix();
      precipMesh.setMatrixAt(i, precipDummy.matrix);
    }
    precipMesh.instanceMatrix.needsUpdate=true;
    if(anyNew && S.satEver) KLabSnd('tap');
  }

  // 유리막대 젓기 연출
  if(stirring && EQ_OBJ.rod){ EQ_OBJ.rod.rotation.y=Math.sin(t*9)*0.4; }
  else if(EQ_OBJ.rod){ EQ_OBJ.rod.rotation.y*=0.9; }

  // 다 녹아 맑아진 순간 기록 (예측 트리거 조건)
  if(!clearedOnce && S.phase==='dissolved' && S.dissolved>sim.LIMIT(20)){ clearedOnce=true; }

  // ★와우 2차 — 첫 석출 결정 등장 순간(중/고)
  if(!precipShown && S.phase==='recrystal'){
    precipShown=true;
    if(showWow && !predict2Shown && !freeMode){ predict2Shown=true; predict2El.classList.remove('hide'); }
  }

  updateHUD();

  // 상태줄
  let st='';
  if(succeeded) st='✨ 재결정 — 미션 성공!';
  else if(S.phase==='dissolving') st='🥄 설탕이 녹는 중 — 맑아져요';
  else if(S.phase==='dissolved') st='설탕이 다 녹아 사라진 듯 보여요 — 이제 식혀 볼까요?';
  else if(S.phase==='saturated') st='더 못 녹아요(포화) — 온도를 올리면 마저 녹아요';
  else if(S.phase==='recrystal') st='✨ 결정이 도로 나왔어요 — 재결정!';
  else if(ready) st='🍬 설탕을 넣고 🥄 저어 녹여 봐요';
  stateEl.textContent=st;

  // 성공 판정 — recrystal 2초 지속
  if(S.phase==='recrystal' && S.satEver){
    if(!successAt) successAt=t;
    if(!succeeded && t-successAt>2){
      succeeded=true;
      const w=run.wrongCount();
      let msg='따뜻할수록 더 많이 녹아요(용해도). 식히면 <b>넘치는 만큼</b> 도로 <b>결정으로 나와요(재결정)</b> — 사라진 게 아니라 <b>숨어 있던 그 설탕</b>이에요.';
      if(prediction) msg=(prediction==='back'?'🎯 <b>1차 예측 적중!</b> ':'🤔 1차 예측과 달랐죠? ')+msg;
      if(prediction2) msg+= (prediction2==='same')
        ? '<br>🎯 <b>2차도 적중</b> — 새 물질이 아니라 아까 그 설탕! 무게도 그대로였죠(물질 보존).'
        : '<br>🤔 2차는 달랐죠? 새 물질이 아니라 <b>아까 녹았던 그 설탕</b>이에요.';
      msg+= '<br>소금 만들기(천일염)·눈꽃사탕이 바로 이 재결정 원리예요!';
      msg+= w===0 ? '<br><b>기구도 한 번에 딱 맞게 골랐어요!</b>' :
                    `<br>기구 고르기 다시 생각해 본 횟수: ${w}번 — 그것도 배움이에요!`;
      $('sucMsg').innerHTML=msg;
      if(!freeMode) successEl.classList.remove('hide');
      else toast('✨ 녹았던 설탕이 도로 나왔어요 — 재결정!',false,5200);
    }
  } else successAt=0;

  controls.update();
  renderer.render(scene,camera);
  checkQuality(performance.now());
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').classList.add('hide');
toast('🎯 미션: 선반에서 <b>필요한 기구만</b> 골라 실험을 준비해 봐요!', false, 5200);

/* 트레이 UI 생성 — 모든 함수·상태 정의 후 (클릭 핸들러 안전) */

EQUIP.forEach(e=>{

  d.addEventListener('click',()=>onPick(e.id,d));
  trayEl.appendChild(d);
});

animate();

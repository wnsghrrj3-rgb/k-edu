<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>케이랩 · 지형실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --acc:#9B7BF5; --acc2:#7856d6; --ink:#1d2733;
    --hud:rgba(20,24,31,.78); --hudline:rgba(255,255,255,.10);
    --ok:#12B886; --info:#5B9BF0; --ink-light:#e8eef6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14181e;font-family:'Gowun Dodum',sans-serif}
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0}

  /* 상단 바 */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:linear-gradient(180deg,rgba(16,20,26,.82),rgba(16,20,26,0));color:var(--ink-light)}
  .topbar .title{font-family:'Jua';font-size:20px;letter-spacing:.5px}
  .topbar .title b{color:var(--acc)}
  .topbar .spacer{flex:1}
  .btn{border:0;border-radius:12px;padding:9px 15px;font-family:'Gowun Dodum';font-size:14px;
    cursor:pointer;background:rgba(255,255,255,.10);color:var(--ink-light);border:1px solid var(--hudline)}
  .btn:hover{background:rgba(255,255,255,.18)}
  .btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.acc:hover{background:var(--acc2)}

  /* 모드/학년 탭 */
  .tabs{position:fixed;top:56px;left:16px;z-index:12;display:flex;flex-direction:column;gap:8px}
  .seg{display:flex;background:var(--hud);border:1px solid var(--hudline);border-radius:14px;padding:4px;backdrop-filter:blur(8px)}
  .seg button{border:0;background:transparent;color:#aeb8c6;font-family:'Gowun Dodum';font-size:13.5px;
    padding:7px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--acc);color:#fff}
  .seg.grade button.on{background:#3a4658;color:#fff}

  /* 하단 컨텍스트 패널 */
  .panel{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;
    display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:min(92vw,720px);
    background:var(--hud);border:1px solid var(--hudline);border-radius:16px;backdrop-filter:blur(8px);
    color:var(--ink-light);font-size:14px}
  .panel .hint{color:#9fb0c4;font-size:13px}
  .panel input[type=range]{width:180px;accent-color:var(--acc)}
  .panel.hide{display:none}

  /* 유리판(모드 B 투영) */
  #glass{position:fixed;right:18px;top:110px;z-index:11;width:190px;height:190px;border-radius:14px;
    background:linear-gradient(160deg,rgba(155,123,245,.10),rgba(20,24,31,.55));
    border:1px solid rgba(155,123,245,.35);box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(4px);padding:8px}
  #glass canvas{width:100%;height:calc(100% - 22px);border-radius:8px;background:rgba(10,12,16,.35)}
  #glass .lab{color:#cdbcff;font-size:11px;text-align:center;padding-bottom:4px;font-family:'Jua'}
  #glass.hide{display:none}

  /* 카드(예측/성공/단면) */
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:30;
    background:rgba(255,255,255,.98);border-radius:20px;padding:22px 24px;min-width:260px;max-width:88vw;
    box-shadow:0 20px 60px rgba(0,0,0,.55);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  .card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .card h3{margin:0 0 14px;font-family:'Jua';font-size:19px}
  .card .opts{display:flex;flex-direction:column;gap:9px}
  .card .opts.row{flex-direction:row;flex-wrap:wrap}
  .card .opts button{border:2px solid #e3e8ef;background:#fff;border-radius:12px;padding:11px 15px;
    cursor:pointer;color:var(--ink);font-family:'Gowun Dodum';font-size:14.5px;flex:1}
  .card .opts button:hover{border-color:var(--acc);background:#f6f2ff}
  .card .opts button.pri{background:var(--ok);border-color:var(--ok);color:#fff}
  #sectionCard svg{display:block;margin:6px auto 2px}

  /* 토스트 */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);z-index:28;
    background:rgba(255,255,255,.97);color:var(--ink);font-size:14px;padding:11px 18px;border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .3s,transform .3s;max-width:86vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 사운드 토글 */
  #sndtog{position:fixed;right:18px;top:14px;z-index:13}

  /* 로딩 */
  #loading{position:fixed;inset:0;z-index:60;background:#14181e;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#cdbcff;gap:14px;font-family:'Jua'}
  #loading .spin{width:44px;height:44px;border:4px solid rgba(155,123,245,.25);border-top-color:var(--acc);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
  <div id="stage"></div>

  <div class="topbar">
    <div class="title">🏔 케이랩 <b>지형실</b></div>
    <div class="spacer"></div>
    <button class="btn acc" id="newMt">🎲 새로운 산</button>
  </div>
  <button class="btn" id="sndtog">🔊</button>

  <div class="tabs">
    <div class="seg mode" id="modeTabs">
      <button data-mode="stack" class="on">🧱 쌓기</button>
      <button data-mode="cut">🔪 자르기</button>
      <button data-mode="explore">💧 탐험</button>
    </div>
    <div class="seg grade" id="gradeTabs">
      <button data-grade="low">저학년</button>
      <button data-grade="mid" class="on">중학년</button>
      <button data-grade="high">고학년</button>
    </div>
  </div>

  <div class="panel" id="panel"><span class="hint" id="panelHint">등고선 판을 낮은 층부터 쌓아 산을 만들어요.</span></div>

  <div id="glass" class="hide">
    <div class="lab">🗺 산을 자르면 나오는 지도</div>
    <canvas id="glassCv" width="220" height="220"></canvas>
  </div>

  <div class="card" id="predict"></div>
  <div class="card" id="success"></div>
  <div class="card" id="sectionCard"></div>
  <div id="toast"></div>

  <div id="loading"><div class="spin"></div><div>지형실 준비 중…</div></div>

<script id="terrain-logic">
/* ═══════════════════════════════════════════════════════════════════
   케이랩 사회실 · 지형실(Terrain) 순수 로직  — window.Terrain
   SPEC_지형실_구현.md §1(산 생성)·§2(마칭 스퀘어)·§5(물방울·단면)
   THREE 무관. jsdom/node 검산 대상. terrain.html에 <script id="terrain-logic">로 인라인.
   ═══════════════════════════════════════════════════════════════════ */
(function (root) {
  'use strict';

  var G = 128;                 // 격자 128²
  var LEVELS = 7;              // k=0..6
  function levelOf(k){ return 0.12 + 0.11 * k; }   // L_k = 0.12 + 0.11k

  /* ── 결정론 PRNG (mulberry32 — 물감 SPEC §6 공통 수식) ── */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ── smoothstep / fade ── */
  function smoothstep(a, b, x) {
    if (b === a) return x < a ? 0 : 1;
    var t = (x - a) / (b - a);
    if (t < 0) t = 0; else if (t > 1) t = 1;
    return t * t * (3 - 2 * t);
  }
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // smootherstep(quintic)

  /* ── value noise (2옥타브 fbm, 스케일 26px) ── */
  function makeNoise(rng) {
    // 정수 격자 해시 테이블 (결정론)
    var P = new Float32Array(4096);
    for (var i = 0; i < P.length; i++) P[i] = rng();
    function hash(ix, iy) {
      var xi = ((ix % 61) + 61) % 61;
      var yi = ((iy % 67) + 67) % 67;
      return P[(xi * 67 + yi) & 4095];
    }
    function vnoise(px, py, cell) {
      var gx = px / cell, gy = py / cell;
      var ix = Math.floor(gx), iy = Math.floor(gy);
      var fx = gx - ix, fy = gy - iy;
      var ux = fade(fx), uy = fade(fy);
      var a = hash(ix, iy),     b = hash(ix + 1, iy);
      var c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
      var top = a + (b - a) * ux;
      var bot = c + (d - c) * ux;
      return top + (bot - top) * uy;   // [0,1]
    }
    return function fbm2(px, py) {
      return 0.6 * vnoise(px, py, 26) + 0.3 * vnoise(px, py, 13);
    };
  }

  /* ── §1  산 생성 : H(x,y) ── */
  function makeTerrain(seed) {
    var rng = mulberry32(seed >>> 0);
    var fbm2 = makeNoise(rng);

    // 봉우리 K=1~3, a∈[0.55,1.0], σ∈[0.10,0.18], 중심 [0.25,0.75]², 간거리≥0.22
    var K = 1 + Math.floor(rng() * 3);
    var peaks = [], tries = 0;
    while (peaks.length < K && tries < 400) {
      tries++;
      var cx = 0.25 + rng() * 0.50, cy = 0.25 + rng() * 0.50;
      var ok = true;
      for (var p = 0; p < peaks.length; p++) {
        var dx = cx - peaks[p].cx, dy = cy - peaks[p].cy;
        if (Math.sqrt(dx * dx + dy * dy) < 0.22) { ok = false; break; }
      }
      if (!ok) continue;
      peaks.push({ cx: cx, cy: cy, a: 0.55 + rng() * 0.45, s: 0.10 + rng() * 0.08 });
    }
    if (peaks.length === 0) peaks.push({ cx: 0.5, cy: 0.5, a: 1.0, s: 0.14 });

    var H = new Float32Array(G * G);
    var i, j, x, y;
    for (j = 0; j < G; j++) {
      for (i = 0; i < G; i++) {
        x = i / (G - 1); y = j / (G - 1);
        var h = 0;
        for (var k = 0; k < peaks.length; k++) {
          var q = peaks[k];
          var ddx = x - q.cx, ddy = y - q.cy;
          var d2 = ddx * ddx + ddy * ddy;
          h += q.a * Math.exp(-d2 / (2 * q.s * q.s));
        }
        h += 0.14 * fbm2(i, j);         // px = i,j (26px 셀)
        H[j * G + i] = h;
      }
    }
    // 정규화 [0,1]
    normalize(H);
    // 경계 가드 : ×smoothstep(0,0.08,min(x,y,1-x,1-y)) + 테두리 2셀 강제 0
    for (j = 0; j < G; j++) {
      for (i = 0; i < G; i++) {
        x = i / (G - 1); y = j / (G - 1);
        var m = Math.min(x, y, 1 - x, 1 - y);
        H[j * G + i] *= smoothstep(0, 0.08, m);
        if (i < 2 || i > G - 3 || j < 2 || j > G - 3) H[j * G + i] = 0;
      }
    }
    // 가드로 최댓값이 낮아짐 → 재정규화
    normalize(H);
    // 바닥 컷 H<0.06 → 0
    for (i = 0; i < H.length; i++) if (H[i] < 0.06) H[i] = 0;

    return { H: H, G: G, seed: seed >>> 0, peaks: peaks, K: peaks.length };
  }

  function normalize(H) {
    var mn = Infinity, mx = -Infinity, i;
    for (i = 0; i < H.length; i++) { if (H[i] < mn) mn = H[i]; if (H[i] > mx) mx = H[i]; }
    var d = (mx - mn) || 1;
    for (i = 0; i < H.length; i++) H[i] = (H[i] - mn) / d;
  }

  function sampleH(H, i, j) { return H[j * G + i]; }

  /* 실수 좌표 쌍선형 보간 (물방울·단면용) — px,py in [0,127] */
  function bilerp(H, px, py) {
    if (px < 0) px = 0; else if (px > G - 1) px = G - 1;
    if (py < 0) py = 0; else if (py > G - 1) py = G - 1;
    var i0 = Math.floor(px), j0 = Math.floor(py);
    var i1 = Math.min(i0 + 1, G - 1), j1 = Math.min(j0 + 1, G - 1);
    var fx = px - i0, fy = py - j0;
    var a = H[j0 * G + i0], b = H[j0 * G + i1], c = H[j1 * G + i0], d = H[j1 * G + i1];
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  }

  /* ∇H 중심차분 (격자단위) */
  function gradH(H, px, py) {
    var e = 1.0;
    var gx = (bilerp(H, px + e, py) - bilerp(H, px - e, py)) / (2 * e);
    var gy = (bilerp(H, px, py + e) - bilerp(H, px, py - e)) / (2 * e);
    return [gx, gy];
  }

  /* ── §2  마칭 스퀘어 : 레벨 L 등고선 폴리곤(들) ──
     반환 = [ [ [x,y],... ](폐곡선), ... ]  (그리드 좌표 0..127) */
  function contour(H, L, simplify) {
    if (simplify === undefined) simplify = true;
    var pts = {};                 // edgeId -> [x,y]
    var segs = [];                // [edgeIdA, edgeIdB]
    var i, j;

    function hE(i, j) { return 'h' + i + '_' + j; }  // 수평(가로) 에지 (i,j)-(i+1,j)
    function vE(i, j) { return 'v' + i + '_' + j; }  // 수직(세로) 에지 (i,j)-(i,j+1)

    function hPt(i, j) {
      var id = hE(i, j);
      if (!pts[id]) {
        var a = H[j * G + i], b = H[j * G + i + 1];
        var t = (b === a) ? 0.5 : (L - a) / (b - a);
        if (t < 0) t = 0; else if (t > 1) t = 1;
        pts[id] = [i + t, j];
      }
      return id;
    }
    function vPt(i, j) {
      var id = vE(i, j);
      if (!pts[id]) {
        var a = H[j * G + i], b = H[(j + 1) * G + i];
        var t = (b === a) ? 0.5 : (L - a) / (b - a);
        if (t < 0) t = 0; else if (t > 1) t = 1;
        pts[id] = [i, j + t];
      }
      return id;
    }

    for (j = 0; j < G - 1; j++) {
      for (i = 0; i < G - 1; i++) {
        var TL = H[j * G + i], TR = H[j * G + i + 1];
        var BR = H[(j + 1) * G + i + 1], BL = H[(j + 1) * G + i];
        var code = 0;
        if (TL >= L) code |= 1;
        if (TR >= L) code |= 2;
        if (BR >= L) code |= 4;
        if (BL >= L) code |= 8;
        if (code === 0 || code === 15) continue;

        var T = function () { return hPt(i, j); };
        var B = function () { return hPt(i, j + 1); };
        var Le = function () { return vPt(i, j); };
        var R = function () { return vPt(i + 1, j); };

        switch (code) {
          case 1:  segs.push([Le(), T()]); break;
          case 2:  segs.push([T(), R()]); break;
          case 3:  segs.push([Le(), R()]); break;
          case 4:  segs.push([R(), B()]); break;
          case 6:  segs.push([T(), B()]); break;
          case 7:  segs.push([Le(), B()]); break;
          case 8:  segs.push([B(), Le()]); break;
          case 9:  segs.push([T(), B()]); break;
          case 11: segs.push([R(), B()]); break;
          case 12: segs.push([Le(), R()]); break;
          case 13: segs.push([T(), R()]); break;
          case 14: segs.push([Le(), T()]); break;
          case 5: {  // TL,BR 위 — 안장점, 중앙값 판정 (T-1 고정)
            var c5 = (TL + TR + BR + BL) / 4;
            if (c5 >= L) { segs.push([T(), R()]); segs.push([B(), Le()]); }
            else         { segs.push([T(), Le()]); segs.push([B(), R()]); }
            break;
          }
          case 10: { // TR,BL 위 — 안장점
            var c10 = (TL + TR + BR + BL) / 4;
            if (c10 >= L) { segs.push([T(), Le()]); segs.push([B(), R()]); }
            else          { segs.push([T(), R()]); segs.push([B(), Le()]); }
            break;
          }
        }
      }
    }

    // 세그먼트 → 폐곡선 링크 (에지 공유로 연결)
    var adj = {};
    for (var s = 0; s < segs.length; s++) {
      var a = segs[s][0], b = segs[s][1];
      (adj[a] || (adj[a] = [])).push({ to: b, seg: s });
      (adj[b] || (adj[b] = [])).push({ to: a, seg: s });
    }
    var used = new Array(segs.length).fill(false);
    var polys = [];
    for (var st = 0; st < segs.length; st++) {
      if (used[st]) continue;
      var start = segs[st][0];
      var cur = start, prevSeg = -1;
      var poly = [pts[start]];
      var guard = 0;
      while (guard++ < segs.length * 4) {
        var nbrs = adj[cur] || [];
        var nx = null;
        for (var n = 0; n < nbrs.length; n++) {
          if (!used[nbrs[n].seg] && nbrs[n].seg !== prevSeg) { nx = nbrs[n]; break; }
        }
        if (!nx) break;
        used[nx.seg] = true; prevSeg = nx.seg;
        poly.push(pts[nx.to]);
        cur = nx.to;
        if (cur === start) break;
      }
      if (poly.length >= 3) polys.push(poly);
    }
    return simplify ? polys.map(function (p) { return rdp(p); }) : polys;
  }

  /* Ramer–Douglas–Peucker (ε=1.2px) — 폐곡선 보존 */
  function rdp(poly, eps) {
    eps = eps || 1.2;
    if (poly.length < 4) return poly;
    var closed = poly[0][0] === poly[poly.length - 1][0] && poly[0][1] === poly[poly.length - 1][1];
    var open = closed ? poly.slice(0, -1) : poly.slice();
    function seg(a, b, arr) {
      if (arr.length < 3) return arr;
      var dmax = 0, idx = 0;
      for (var k = 1; k < arr.length - 1; k++) {
        var d = perpDist(arr[k], arr[0], arr[arr.length - 1]);
        if (d > dmax) { dmax = d; idx = k; }
      }
      if (dmax > eps) {
        var l = seg(0, idx, arr.slice(0, idx + 1));
        var r = seg(idx, arr.length - 1, arr.slice(idx));
        return l.slice(0, -1).concat(r);
      }
      return [arr[0], arr[arr.length - 1]];
    }
    var simp = seg(0, open.length - 1, open);
    if (closed) simp.push(simp[0]);
    return simp.length >= 4 ? simp : poly;
  }
  function perpDist(p, a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1];
    var len = Math.hypot(dx, dy) || 1e-9;
    return Math.abs((p[0] - a[0]) * dy - (p[1] - a[1]) * dx) / len;
  }

  /* 전 레벨 등고선 세트 */
  function contourSet(H) {
    var out = [];
    for (var k = 0; k < LEVELS; k++) out.push({ k: k, L: levelOf(k), polys: contour(H, levelOf(k)) });
    return out;
  }

  /* 폴리곤 면적 (shoelace, 절댓값) */
  function polyArea(poly) {
    var s = 0;
    for (var i = 0; i < poly.length - 1; i++) s += poly[i][0] * poly[i + 1][1] - poly[i + 1][0] * poly[i][1];
    return Math.abs(s) / 2;
  }
  /* 점 다각형 포함 (ray casting) */
  function pointIn(pt, poly) {
    var x = pt[0], y = pt[1], inside = false;
    for (var i = 0, jj = poly.length - 1; i < poly.length; jj = i++) {
      var xi = poly[i][0], yi = poly[i][1], xj = poly[jj][0], yj = poly[jj][1];
      var hit = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
      if (hit) inside = !inside;
    }
    return inside;
  }

  /* ── §5  물방울 : 경사하강 궤적 ── */
  function droplet(H, px, py, opts) {
    opts = opts || {};
    var maxStep = opts.maxStep || 400;
    var dt = opts.dt || 1.0;
    var path = [[px, py, bilerp(H, px, py)]];
    for (var s = 0; s < maxStep; s++) {
      var g = gradH(H, px, py);
      var mag = Math.hypot(g[0], g[1]);
      if (mag < 0.002) break;
      px += -g[0] * 0.9 * dt * 2.2;
      py += -g[1] * 0.9 * dt * 2.2;
      if (px < 0) px = 0; if (px > G - 1) px = G - 1;
      if (py < 0) py = 0; if (py > G - 1) py = G - 1;
      path.push([px, py, bilerp(H, px, py)]);
    }
    return path;
  }

  /* ── §5  단면 : 두 점 사이 96샘플 프로파일 ── */
  function section(H, ax, ay, bx, by, n) {
    n = n || 96;
    var prof = [];
    for (var i = 0; i < n; i++) {
      var t = i / (n - 1);
      var px = ax + (bx - ax) * t, py = ay + (by - ay) * t;
      prof.push({ t: t, h: bilerp(H, px, py) });
    }
    return prof;
  }

  /* ── 판(쌓기) 부피 : Σ area_k × 0.11  (RDP 전 raw 폴리곤 = 판 실제 면적) ── */
  function plateVolume(H) {
    var v = 0;
    for (var k = 0; k < LEVELS; k++) {
      var polys = contour(H, levelOf(k), false), ak = 0;
      for (var p = 0; p < polys.length; p++) ak += polyArea(polys[p]);
      v += ak * 0.11;
    }
    return v;
  }
  /* 계단화 H 적분 : ∫(레벨수(H)·0.11) — 셀 4×4 서브샘플(경계 이산화 편향 제거) */
  function quantVolume(H) {
    var SS = 4, w = 1 / (SS * SS), v = 0, i, j, si, sj;
    for (j = 0; j < G - 1; j++) {
      for (i = 0; i < G - 1; i++) {
        for (sj = 0; sj < SS; sj++) {
          for (si = 0; si < SS; si++) {
            var h = bilerp(H, i + (si + 0.5) / SS, j + (sj + 0.5) / SS);
            var cnt = 0;
            for (var k = 0; k < LEVELS; k++) if (h >= levelOf(k)) cnt++;
            v += cnt * 0.11 * w;
          }
        }
      }
    }
    return v;
  }

  var API = {
    G: G, LEVELS: LEVELS, levelOf: levelOf,
    mulberry32: mulberry32, smoothstep: smoothstep,
    makeTerrain: makeTerrain, sampleH: sampleH, bilerp: bilerp, gradH: gradH,
    contour: contour, contourSet: contourSet,
    polyArea: polyArea, pointIn: pointIn,
    droplet: droplet, section: section,
    plateVolume: plateVolume, quantVolume: quantVolume
  };
  root.Terrain = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : this);

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const T = window.Terrain;
const HS = 1.4;                 // heightScale (무대 단위)
const params = new URLSearchParams(location.search);
const MORPH = params.get('morph') || 'fade';   // fade | lift

/* ══════════ 사운드 (KLab.sound 미니 — Web Audio 합성) ══════════ */
const Snd = (function(){
  let ctx=null, on = localStorage.getItem('terrain_snd')!=='0';
  function ac(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function beep(f,d,type,g){ const c=ac(); if(!c||!on)return; const o=c.createOscillator(),ga=c.createGain();
    o.type=type||'sine'; o.frequency.value=f; ga.gain.value=g||0.06; o.connect(ga); ga.connect(c.destination);
    const t=c.currentTime; o.start(t); ga.gain.setValueAtTime(g||0.06,t); ga.gain.exponentialRampToValueAtTime(0.0001,t+d); o.stop(t+d); }
  return {
    play(n){ if(n==='tap')beep(520,.06,'triangle');
      else if(n==='snap')beep(680,.10,'sine',.07);
      else if(n==='success'){beep(660,.12,'sine',.07);setTimeout(()=>beep(880,.18,'sine',.07),110);}
      else if(n==='nope')beep(180,.16,'sawtooth',.05);
      else if(n==='drip')beep(1200,.05,'sine',.04); },
    toggle(){ on=!on; localStorage.setItem('terrain_snd',on?'1':'0'); return on; },
    get on(){return on;}
  };
})();
document.getElementById('sndtog').onclick=function(){ this.textContent = Snd.toggle()?'🔊':'🔇'; };
document.getElementById('sndtog').textContent = Snd.on?'🔊':'🔇';

/* ══════════ 씬 (klab3 코어 레시피 — r185·PMREM·ACESFilmic) ══════════ */
const stageEl=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
stageEl.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x161b22);
scene.fog=new THREE.Fog(0x161b22,4.2,10);

const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.05,50);
camera.position.set(1.7,1.55,1.9);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const sun=new THREE.DirectionalLight(0xfff4e0,2.0);
sun.position.set(3,5,2); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.near=0.5; sun.shadow.camera.far=14;
sun.shadow.camera.left=-3; sun.shadow.camera.right=3; sun.shadow.camera.top=3; sun.shadow.camera.bottom=-3;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd4ff,0x2a2418,0.55));

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=1.0; controls.maxDistance=5.5;
controls.maxPolarAngle=1.46; controls.enablePan=false;
controls.target.set(0,0.28,0);

// 무대 바닥
const floorMat=new THREE.MeshStandardMaterial({color:0x1b2028,roughness:.95,metalness:0});
const floor=new THREE.Mesh(new THREE.CircleGeometry(4,48),floorMat);
floor.rotation.x=-Math.PI/2; floor.position.y=-0.02; floor.receiveShadow=true; scene.add(floor);

/* ══════════ 상태 ══════════ */
let TR=null, cset=null, mode='stack', grade='mid', locked=false;
let plateGroup=new THREE.Group(), mtnMesh=null, stackTarget=[], stackedCount=0;
scene.add(plateGroup);

/* 고도색 (윗면) */
function altColor(hNorm, steep){
  if(steep>0.55) return new THREE.Color(0x8d8f92);        // 바위
  if(hNorm<0.28) return new THREE.Color(0x4c7a4c);        // 초록
  if(hNorm<0.62) return new THREE.Color(0x9c7a4a);        // 갈색
  return new THREE.Color(0xcbc3b4);                        // 회백
}
const SOIL=0x8a6a3d;

/* grid 좌표 → world XZ [-1,1] */
function gx(x){ return x/(T.G-1)*2-1; }

/* ══════════ 판 빌드 (모드 A) ══════════ */
function buildPlates(){
  plateGroup.clear(); stackTarget=[]; stackedCount=0;
  for(let k=0;k<T.LEVELS;k++){
    const polys=cset[k].polys;
    if(!polys.length) continue;
    // 면적 내림차순 → 최대는 외곽, 내부 포함되는 것은 holes
    const sorted=polys.slice().sort((a,b)=>T.polyArea(b)-T.polyArea(a));
    const outer=sorted[0];
    const shape=new THREE.Shape(outer.map(p=>new THREE.Vector2(gx(p[0]),gx(p[1]))));
    for(let s=1;s<sorted.length;s++){
      // 내부 판정(대표점) → hole
      let cx=0,cy=0; sorted[s].forEach(q=>{cx+=q[0];cy+=q[1];}); cx/=sorted[s].length; cy/=sorted[s].length;
      if(T.pointIn([cx,cy],outer)){
        const hole=new THREE.Path(sorted[s].map(p=>new THREE.Vector2(gx(p[0]),gx(p[1]))));
        shape.holes.push(hole);
      }
    }
    const depth=0.11*HS;
    let geo;
    try{ geo=new THREE.ExtrudeGeometry(shape,{depth:depth,bevelEnabled:false}); }
    catch(e){ continue; }
    geo.rotateX(-Math.PI/2);
    const hNorm=(0.12+0.11*k);
    const topCol=altColor(hNorm,0);
    const mat=new THREE.MeshStandardMaterial({color:topCol,roughness:.9,metalness:0,transparent:true,opacity:1});
    // 옆면(단면) 흙색 느낌 — 단일 재질이라 살짝 어둡게
    const mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.userData={k:k, placed:false, home:null};
    plateGroup.add(mesh);
    stackTarget.push(mesh);
  }
  // 트레이 셔플 배치 (무대 앞쪽 흩뿌림)
  const rng=T.mulberry32(TR.seed^0x9e3779b9);
  stackTarget.forEach((m,idx)=>{
    const ang=rng()*Math.PI*2, rad=1.15+rng()*0.7;
    m.position.set(Math.cos(ang)*rad, 0.02+idx*0.001, 0.9+Math.sin(ang)*rad*0.55);
    m.userData.home=m.position.clone();
    m.rotation.y=rng()*0.4-0.2;
  });
}

/* ══════════ 매끈 산 (모핑 대상 · 모드 B/C 본체) ══════════ */
function buildMountain(){
  if(mtnMesh){ scene.remove(mtnMesh); mtnMesh.geometry.dispose(); }
  const N=T.G;
  const geo=new THREE.PlaneGeometry(2,2,N-1,N-1);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position, col=[];
  const H=TR.H;
  for(let j=0;j<N;j++){
    for(let i=0;i<N;i++){
      const idx=j*N+i;
      const h=H[j*N+i];
      pos.setY(idx, h*HS*0.77);
      // 경사(∇H) → 색
      const g=T.gradH(H,i,j); const steep=Math.hypot(g[0],g[1]);
      const c=altColor(h,steep);
      col.push(c.r,c.g,c.b);
    }
  }
  pos.needsUpdate=true; geo.computeVertexNormals();
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92,metalness:0,
    transparent:true,opacity:0, side:THREE.DoubleSide, clippingPlanes:[], clipShadows:true});
  mtnMesh=new THREE.Mesh(geo,mat);
  mtnMesh.castShadow=true; mtnMesh.receiveShadow=true; mtnMesh.visible=false;
  scene.add(mtnMesh);
}

/* ══════════ 새 지형 ══════════ */
function regen(seed){
  TR=T.makeTerrain(seed>>>0);
  cset=T.contourSet(TR.H);
  buildPlates();
  buildMountain();
  applyMode();
}

/* ══════════ 완성 모핑 (판 → 매끈 산) ══════════ */
function morphToMountain(){
  locked=true; controls.enabled=false;
  mtnMesh.visible=true;
  const t0=performance.now(), dur=800;
  function anim(now){
    let u=(now-t0)/dur; if(u>1)u=1;
    const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    if(MORPH==='lift'){
      plateGroup.children.forEach(m=>{ if(m.material)m.material.opacity=1-e; });
      mtnMesh.scale.set(1,Math.max(0.001,e),1); mtnMesh.material.opacity=1;
    } else {
      plateGroup.children.forEach(m=>{ if(m.material)m.material.opacity=1-e; });
      mtnMesh.scale.set(1,1,1); mtnMesh.material.opacity=e;
    }
    if(u<1){ requestAnimationFrame(anim); }
    else{ plateGroup.visible=false; spinCamera(); Snd.play('success');
      showSuccess('🏔 산 완성!','계단처럼 쌓인 등고선 판이 매끈한 산이 되었어요. 평면의 동심원 = 입체의 산!'); }
  }
  requestAnimationFrame(anim);
}
function spinCamera(){
  const t0=performance.now(), dur=1200, r=Math.hypot(camera.position.x,camera.position.z), a0=Math.atan2(camera.position.z,camera.position.x);
  function s(now){ let u=(now-t0)/dur; if(u>1)u=1; const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    const a=a0+e*Math.PI/6; camera.position.x=Math.cos(a)*r; camera.position.z=Math.sin(a)*r; controls.update();
    if(u<1)requestAnimationFrame(s); else{locked=false;controls.enabled=true;} }
  requestAnimationFrame(s);
}

/* ══════════ 드래그(집기·스냅) — 모드 A ══════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let dragging=null, dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function setNdc(e){ const x=e.touches?e.touches[0].clientX:e.clientX, y=e.touches?e.touches[0].clientY:e.clientY;
  ndc.x=x/innerWidth*2-1; ndc.y=-(y/innerHeight*2)+1; }
function onDown(e){
  if(mode!=='stack'||locked) return;
  setNdc(e); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(plateGroup.children.filter(m=>!m.userData.placed),false);
  if(hit.length){ dragging=hit[0].object; controls.enabled=false; Snd.play('tap'); }
}
function onMove(e){
  if(!dragging) return;
  setNdc(e); ray.setFromCamera(ndc,camera);
  const pt=new THREE.Vector3();
  dragPlane.constant=-(0.05); // 살짝 띄워 이동
  if(ray.ray.intersectPlane(dragPlane,pt)){ dragging.position.x=pt.x; dragging.position.z=pt.z; dragging.position.y=0.06; }
}
function onUp(){
  if(!dragging){ controls.enabled=true; return; }
  const m=dragging; dragging=null; controls.enabled=true;
  const d=Math.hypot(m.position.x,m.position.z);
  if(d<0.12){
    if(m.userData.k===stackedCount){          // 절차: 다음 순서 판만
      m.position.set(0,0.001+stackedCount*(0.11*HS),0);
      m.userData.placed=true; stackedCount++;
      Snd.play('snap');
      if(stackedCount>=stackTarget.length){ setTimeout(morphToMountain,260); }
    } else {
      m.material.opacity=0.45; Snd.play('nope');
      toast('이 판은 <b>더 높은 층</b>이에요 — 낮은 판부터!');
      backHome(m);
    }
  } else backHome(m);
}
function backHome(m){ const h=m.userData.home; if(h){ m.position.copy(h); m.material.opacity=1; } }
renderer.domElement.addEventListener('pointerdown',onDown);
renderer.domElement.addEventListener('pointermove',onMove);
renderer.domElement.addEventListener('pointerup',onUp);

/* ══════════ 모드 B — 자르기(클리핑 + 유리판 투영) ══════════ */
const clipPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),0.9);
const glass=document.getElementById('glass'), gcv=document.getElementById('glassCv'), gctx=gcv.getContext('2d');
let projectedLevels={};
function drawGlass(){
  gctx.clearRect(0,0,gcv.width,gcv.height);
  gctx.lineWidth=1.4;
  Object.keys(projectedLevels).forEach(k=>{
    const polys=cset[k].polys; gctx.strokeStyle='#9B7BF5';
    polys.forEach(p=>{ gctx.beginPath(); p.forEach((q,i)=>{ const X=q[0]/(T.G-1)*gcv.width, Y=q[1]/(T.G-1)*gcv.height;
      i?gctx.lineTo(X,Y):gctx.moveTo(X,Y); }); gctx.stroke(); });
  });
  // 현재 절단선(흰)
  const hLevel=(0.9-clipPlane.constant); // constant 낮을수록 높이 낮음(뒤에서 반전 처리)
}
function setCut(s){                          // s: 0.1~0.9 (높이)
  clipPlane.constant=s*HS*0.77;              // world y
  mtnMesh.material.clippingPlanes=[clipPlane];
  // 현재 높이 등고선(H값 = s) 유리판 흰선 + 0.11 간격 누적
  const hVal=s;
  gctx.clearRect(0,0,gcv.width,gcv.height);
  // 누적 레벨
  for(let k=0;k<T.LEVELS;k++){ if(hVal>=T.levelOf(k)) projectedLevels[k]=1; }
  gctx.lineWidth=1.3;
  Object.keys(projectedLevels).forEach(k=>{ gctx.strokeStyle='#9B7BF5';
    cset[k].polys.forEach(p=>{ gctx.beginPath(); p.forEach((q,i)=>{ const X=q[0]/(T.G-1)*gcv.width,Y=q[1]/(T.G-1)*gcv.height;
      i?gctx.lineTo(X,Y):gctx.moveTo(X,Y); }); gctx.stroke(); }); });
  // 현재 절단 테두리(흰)
  const cur=T.contour(TR.H,Math.max(0.001,Math.min(0.999,hVal)),true);
  gctx.strokeStyle='#ffffff'; gctx.lineWidth=1.8;
  cur.forEach(p=>{ gctx.beginPath(); p.forEach((q,i)=>{ const X=q[0]/(T.G-1)*gcv.width,Y=q[1]/(T.G-1)*gcv.height;
    i?gctx.lineTo(X,Y):gctx.moveTo(X,Y); }); gctx.stroke(); });
}

/* ══════════ 모드 C — 물방울·단면 ══════════ */
let dropLines=[], sectionPts=[];
function dropAt(px,py){
  const path=T.droplet(TR.H,px,py);
  const geo=new THREE.BufferGeometry();
  const v=[]; path.forEach(p=>{ v.push(gx(p[0]), p[2]*HS*0.77+0.01, gx(p[1])); });
  geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x5BB8F0}));
  scene.add(line); dropLines.push(line);
  if(dropLines.length>6){ const old=dropLines.shift(); scene.remove(old); }
  Snd.play('drip');
}
function pickTerrain(e){
  setNdc(e); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObject(mtnMesh,false);
  if(!hit.length) return null;
  const p=hit[0].point;
  const px=(p.x+1)/2*(T.G-1), py=(p.z+1)/2*(T.G-1);
  return [Math.max(0,Math.min(T.G-1,px)),Math.max(0,Math.min(T.G-1,py))];
}
function onExploreTap(e){
  if(mode!=='explore'||locked) return;
  const g=pickTerrain(e); if(!g) return;
  if(exploreTool==='drop'){ dropAt(g[0],g[1]); }
  else {
    sectionPts.push(g);
    if(sectionPts.length===2){ showSection(sectionPts[0],sectionPts[1]); sectionPts=[]; }
    else toast('두 번째 지점을 탭하면 <b>단면</b>이 나와요.');
  }
}
renderer.domElement.addEventListener('pointerdown',onExploreTap);

let exploreTool='drop';
function showSection(a,b){
  const prof=T.section(TR.H,a[0],a[1],b[0],b[1],96);
  const W=260,Hh=120,pad=10;
  let d='';
  prof.forEach((s,i)=>{ const X=pad+i/(prof.length-1)*(W-2*pad); const Y=Hh-pad-s.h*1.6*(Hh-2*pad); d+=(i?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1)+' '; });
  const svg=`<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}">
    <rect x="0" y="0" width="${W}" height="${Hh}" rx="10" fill="#f4f0ff"/>
    <path d="${d}" fill="none" stroke="#9B7BF5" stroke-width="2.5"/>
    <line x1="${pad}" y1="${Hh-pad}" x2="${W-pad}" y2="${Hh-pad}" stroke="#c9bde8"/></svg>`;
  const el=document.getElementById('sectionCard');
  el.innerHTML=`<h3>⛰ 등산 경로 단면</h3>${svg}<div class="opts"><button class="pri" onclick="this.closest('.card').classList.remove('show')">닫기</button></div>`;
  el.classList.add('show');
}

/* ══════════ 예측 카드 / 성공 / 토스트 ══════════ */
function showPredict(q,opts,cb){
  const el=document.getElementById('predict');
  el.innerHTML=`<h3>🔮 ${q}</h3><div class="opts"></div>`;
  const box=el.querySelector('.opts');
  opts.forEach((o,i)=>{ const b=document.createElement('button'); b.textContent=o;
    b.onclick=()=>{ el.classList.remove('show'); Snd.play('tap'); cb&&cb(i); }; box.appendChild(b); });
  el.classList.add('show');
}
function showSuccess(t,body){
  const el=document.getElementById('success');
  el.innerHTML=`<h3>${t}</h3><p style="margin:0 0 14px;line-height:1.5">${body}</p>
    <div class="opts"><button class="pri" id="okBtn">좋아요</button></div>`;
  el.querySelector('#okBtn').onclick=()=>el.classList.remove('show');
  el.classList.add('show');
}
let toastTimer=null;
function toast(msg){ const el=document.getElementById('toast'); el.innerHTML=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }

/* ══════════ 모드/학년칸 ══════════ */
const panel=document.getElementById('panel'), panelHint=document.getElementById('panelHint');
function applyMode(){
  // 학년 게이팅: 저=A만, 중=A+B, 고=전부
  const modeBtns=document.querySelectorAll('#modeTabs button');
  modeBtns.forEach(b=>{ const md=b.dataset.mode;
    const allow = md==='stack' || (md==='cut'&&grade!=='low') || (md==='explore'&&grade==='high');
    b.style.display=allow?'':'none';
  });
  if((mode==='cut'&&grade==='low')||(mode==='explore'&&grade!=='high')) mode='stack';
  modeBtns.forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));

  plateGroup.visible=(mode==='stack');
  if(mtnMesh){ mtnMesh.visible=(mode!=='stack'); mtnMesh.scale.set(1,1,1);
    mtnMesh.material.opacity=(mode!=='stack')?1:0;
    mtnMesh.material.clippingPlanes=(mode==='cut')?[clipPlane]:[]; }
  glass.classList.toggle('hide',mode!=='cut');

  // 패널 갱신
  panel.innerHTML=''; 
  if(mode==='stack'){
    if(mode==='stack' && plateGroup.children.every(m=>m.userData.placed) && stackedCount) plateGroup.visible=false;
    panel.appendChild(mk('<span class="hint">등고선 판을 <b>낮은 층부터</b> 가운데로 끌어와 쌓아요.</span>'));
  } else if(mode==='cut'){
    projectedLevels={};
    const wrap=mk('<span>🔪 자르는 높이</span>');
    const sl=document.createElement('input'); sl.type='range'; sl.min='5'; sl.max='95'; sl.value='90';
    sl.oninput=()=>setCut(parseInt(sl.value)/100);
    const rst=document.createElement('button'); rst.className='btn'; rst.textContent='지도 리셋';
    rst.onclick=()=>{ projectedLevels={}; setCut(parseInt(sl.value)/100); };
    panel.appendChild(wrap); panel.appendChild(sl); panel.appendChild(rst);
    setCut(0.9);
    if(!sessionStorage.cutPredict){ sessionStorage.cutPredict='1';
      showPredict('산을 수평으로 자른 테두리는 무슨 모양일까요?',['직선','동심원(닫힌 고리)','네모'],()=>{}); }
  } else {
    const t1=document.createElement('button'); t1.className='btn'; t1.textContent='💧 물방울';
    const t2=document.createElement('button'); t2.className='btn'; t2.textContent='📈 단면(두 점)';
    function selTool(t){ exploreTool=t; t1.classList.toggle('acc',t==='drop'); t2.classList.toggle('acc',t==='section'); sectionPts=[];
      panelHintSet(t==='drop'?'산 위를 탭하면 물방울이 골짜기로 굴러가요.':'산 위 <b>두 지점</b>을 탭하면 등산 단면이 나와요.'); }
    t1.onclick=()=>selTool('drop'); t2.onclick=()=>selTool('section');
    const scale=mk('<span class="hint">📏 지도 폭 2km · 1cm ≈ 200m</span>');
    panel.appendChild(t1); panel.appendChild(t2); panel.appendChild(scale);
    selTool('drop');
  }
  function panelHintSet(h){ const s=panel.querySelector('.hint'); }
}
function mk(html){ const s=document.createElement('span'); s.innerHTML=html; return s; }

document.querySelectorAll('#modeTabs button').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.mode; Snd.play('tap');
    document.querySelectorAll('#modeTabs button').forEach(x=>x.classList.toggle('on',x===b)); applyMode(); };
});
document.querySelectorAll('#gradeTabs button').forEach(b=>{
  b.onclick=()=>{ grade=b.dataset.grade; Snd.play('tap');
    document.querySelectorAll('#gradeTabs button').forEach(x=>x.classList.toggle('on',x===b)); applyMode(); };
});
document.getElementById('newMt').onclick=()=>{
  Snd.play('tap'); dropLines.forEach(l=>scene.remove(l)); dropLines=[]; sectionPts=[]; plateGroup.visible=true;
  regen((Math.random()*1e9)>>>0);
};

/* ══════════ 루프 ══════════ */
function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* ══════════ 시작 ══════════ */
const seed0=parseInt(params.get('seed'))||((Date.now()&0x7fffffff)>>>0);
regen(seed0);
loop();
document.getElementById('loading').style.display='none';

// 노출(스모크 마운트 확인용)
window.__TERRAIN_SCENE={ regen, get mode(){return mode;}, get grade(){return grade;}, get stackedCount(){return stackedCount;} };
</script>
</body>
</html>

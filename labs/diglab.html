<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>케이랩 · 발굴실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --acc:#9B7BF5; --acc2:#7856d6; --ink:#1d2733;
    --hud:rgba(20,24,31,.78); --hudline:rgba(255,255,255,.10);
    --ok:#12B886; --info:#5B9BF0; --ink-light:#e8eef6; --warn:#e8a13a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171310;font-family:'Gowun Dodum',sans-serif}
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:linear-gradient(180deg,rgba(18,14,11,.86),rgba(18,14,11,0));color:var(--ink-light)}
  .topbar .title{font-family:'Jua';font-size:20px;letter-spacing:.5px}
  .topbar .title b{color:var(--acc)}
  .topbar .title #artName{color:var(--warn);font-size:14px}
  .topbar .spacer{flex:1}
  .btn{border:0;border-radius:12px;padding:9px 15px;font-family:'Gowun Dodum';font-size:14px;
    cursor:pointer;background:rgba(255,255,255,.10);color:var(--ink-light);border:1px solid var(--hudline)}
  .btn:hover{background:rgba(255,255,255,.18)}
  .btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.acc:hover{background:var(--acc2)}
  .btn[disabled]{opacity:.4;pointer-events:none}

  /* 도구 트레이(하단 중앙) */
  .tools{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;
    display:flex;align-items:center;gap:8px;padding:8px;background:var(--hud);border:1px solid var(--hudline);
    border-radius:16px;backdrop-filter:blur(8px)}
  .tools .tool{border:0;background:transparent;color:#cbb;font-family:'Gowun Dodum';font-size:22px;
    width:52px;height:52px;border-radius:12px;cursor:pointer;position:relative}
  .tools .tool small{display:block;font-size:10px;color:#9a8f86;margin-top:-4px}
  .tools .tool.on{background:var(--acc);color:#fff}
  .tools .tool.on small{color:#eee}

  /* 학습/학년 탭 */
  .tabs{position:fixed;top:56px;left:16px;z-index:12;display:flex;flex-direction:column;gap:8px}
  .seg{display:flex;background:var(--hud);border:1px solid var(--hudline);border-radius:14px;padding:4px;backdrop-filter:blur(8px)}
  .seg button{border:0;background:transparent;color:#aeb8c6;font-family:'Gowun Dodum';font-size:13.5px;
    padding:7px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--acc);color:#fff}
  .seg.grade button.on{background:#5a4632;color:#fff}

  /* 노출 게이지(우상단) */
  #expose{position:fixed;right:16px;top:60px;z-index:12;width:190px;padding:12px 14px;
    background:var(--hud);border:1px solid var(--hudline);border-radius:14px;backdrop-filter:blur(8px);color:var(--ink-light)}
  #expose .lab{font-size:12px;color:#b7a99c;margin-bottom:6px}
  #expose .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.10);overflow:hidden}
  #expose .fill{height:100%;width:0;background:linear-gradient(90deg,var(--warn),var(--ok));transition:width .2s}
  #expose .pct{font-size:12px;margin-top:6px;text-align:right;color:#cdbca8}
  #expose .note{font-size:11px;color:#8f8378;margin-top:6px;line-height:1.4}

  .panel{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:11;
    padding:9px 16px;max-width:min(92vw,640px);background:var(--hud);border:1px solid var(--hudline);
    border-radius:14px;backdrop-filter:blur(8px);color:#cdbca8;font-size:13px;text-align:center}
  .panel.hide{display:none}

  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:30;
    background:rgba(255,255,255,.98);border-radius:20px;padding:22px 24px;min-width:260px;max-width:88vw;
    box-shadow:0 20px 60px rgba(0,0,0,.55);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  .card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .card h3{margin:.1em 0 .5em;font-family:'Jua';color:var(--acc2)}
  .card .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border-radius:12px;
    border:1px solid #e2e2ea;background:#f7f7fb;cursor:pointer;font-family:'Gowun Dodum';font-size:15px}
  .card .opt:hover{background:#efeafb}
  .card .cbtn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;
    font-family:'Jua';font-size:16px;cursor:pointer}

  #toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-8px);z-index:40;
    background:rgba(24,18,14,.94);color:#f4ead9;padding:11px 18px;border-radius:12px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:86vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:#171310;color:#cbb8a3;font-family:'Jua'}
  .spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── 연표실 (T2-2) ── */
  #timelineHud{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#1c150e,#0e0a07);
    color:var(--ink-light);flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:18px;font-family:'Jua'}
  #tlHead{text-align:center}
  #tlHead .tt{font-size:21px;font-weight:800}
  #tlHead .tt b{color:var(--warn)}
  #tlQ{margin-top:6px;color:#c9bba9;font-size:14px}
  #tlChip{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:10px 20px;border-radius:999px;
    background:var(--hud);border:1px solid var(--hudline);font-size:17px;font-weight:700}
  #tlChip .dot{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
  #tlTrack{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:840px}
  .tlEra{position:relative;min-width:96px;padding:16px 12px;border-radius:14px;cursor:pointer;text-align:center;
    background:rgba(255,255,255,.06);border:1px solid var(--hudline);transition:transform .12s,background .2s;user-select:none}
  .tlEra:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}
  .tlEra .en{font-weight:800;font-size:16px}
  .tlEra .sp{font-size:11px;color:#b7a99c;margin-top:4px}
  .tlEra.ok{background:linear-gradient(180deg,rgba(18,184,134,.38),rgba(18,184,134,.12));border-color:var(--ok);cursor:default;transform:translateY(-3px)}
  .tlEra.ok .badge{position:absolute;top:-12px;right:-8px;font-size:22px}
  .tlEra.wrong{animation:tlShake .4s}
  @keyframes tlShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}60%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
  #tlPanel{max-width:560px;text-align:center;opacity:0;max-height:0;overflow:hidden;transition:opacity .35s,max-height .4s}
  #tlPanel.show{opacity:1;max-height:220px}
  #tlPanel .pt{font-size:19px;font-weight:800;color:var(--ok)}
  #tlPanel .pd{margin-top:8px;line-height:1.65;color:#e8dccb;font-size:15px}
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="topbar">
    <div class="title">🏺 케이랩 <b>발굴실</b> <span id="artName"></span></div>
    <div class="spacer"></div>
    <button class="btn" id="gridBtn">📐 조사격자</button>
    <button class="btn" id="recBtn">📸 기록</button>
    <button class="btn acc" id="liftBtn" disabled>⬆ 들어올리기</button>
    <button class="btn" id="newBtn">🕳 새 구덩이</button>
  </div>
  <button class="btn" id="sndtog" style="position:fixed;right:16px;bottom:18px;z-index:12">🔊</button>

  <div class="tabs">
    <div class="seg grade" id="gradeTabs">
      <button data-grade="low">저학년</button>
      <button data-grade="mid" class="on">중학년</button>
      <button data-grade="high">고학년</button>
    </div>
  </div>

  <div id="expose">
    <div class="lab">🔎 유물이 드러난 정도</div>
    <div class="bar"><div class="fill" id="exFill"></div></div>
    <div class="pct" id="exPct">0%</div>
    <div class="note" id="exNote">붓으로 살살 파 보세요. 85%까지 드러나면 들어올릴 수 있어요.</div>
  </div>

  <div class="tools" id="tools">
    <button class="tool on" data-tool="brush">🖌<small>붓</small></button>
    <button class="tool" data-tool="trowel">🪏<small>꽃삽</small></button>
  </div>

  <div class="panel" id="panel">흙을 문질러 파 보세요. 깊이 들어갈수록 옛 지층이 드러나요.</div>

  <!-- ══ 복원실 HUD (기본 숨김) ══ -->
  <div id="restoreHud" style="display:none">
    <div id="restoreBar" style="position:fixed;right:16px;top:60px;z-index:12;width:200px;padding:12px 14px;
      background:var(--hud);border:1px solid var(--hudline);border-radius:14px;backdrop-filter:blur(8px);color:var(--ink-light)">
      <div style="font-size:12px;color:#b7a99c;margin-bottom:6px">🧩 조각 맞추기</div>
      <div style="height:10px;border-radius:6px;background:rgba(255,255,255,.10);overflow:hidden">
        <div id="rsFill" style="height:100%;width:0;background:linear-gradient(90deg,var(--warn),var(--ok));transition:width .25s"></div></div>
      <div id="rsPct" style="font-size:12px;margin-top:6px;text-align:right;color:#cdbca8">0 / 0</div>
      <div id="rsNote" style="font-size:11px;color:#8f8378;margin-top:6px;line-height:1.4">트레이의 조각을 눌러 든 뒤, 항아리 위로 끌어 맞춰요.</div>
    </div>
    <div class="tools" id="restoreTools">
      <button class="tool on" id="rsRotate">↻<small>돌리기</small></button>
      <button class="tool" id="rsDigBack">🕳<small>발굴실</small></button>
    </div>
    <div class="panel" id="rsPanel">조각을 눌러 들어요. <b>↻ 돌리기</b>로 방향을 맞추고, 항아리 중앙으로 끌어다 놓으면 딱 붙어요.</div>
  </div>

  <!-- ══ 연표실 (T2-2) — 복원 완료 후 시대 배치 ══ -->
  <div id="timelineHud" style="display:none">
    <div id="tlHead">
      <div class="tt">📜 유물은 어느 <b>시대</b>에 만들어졌을까요?</div>
      <div id="tlQ">복원한 유물을 알맞은 시대 칸에 놓아 보세요.</div>
      <div id="tlChip"></div>
    </div>
    <div id="tlTrack"></div>
    <div id="tlPanel"></div>
    <button class="btn acc" id="tlBack">🕳 새 유물 발굴하기</button>
  </div>

  <div class="card" id="predict"></div>
  <div class="card" id="info"></div>
  <div id="toast"></div>

  <div id="loading"><div class="spin"></div><div>발굴실 준비 중…</div></div>

<script id="diglab-logic">
/* ══════════ 발굴실 순수 로직 (window.DigLab) — THREE 무관·jsdom 검산 대상 ══════════
   SPEC_발굴실_구현.md §1(흙 필드·도구 프로파일)·§2(노출·손상)·§4(조각 분할 — 심장)·§5(스냅) 수식.
   diglab.html에 <script id="diglab-logic">로 인라인. */
(function (root) {
  'use strict';
  var GW = 192, GH = 128;                 // 구덩이 격자(가로 넓게, SPEC §1)

  /* ── 결정론 PRNG·해시 (물감 SPEC §6 공통) ── */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {                    // FNV-1a 32bit
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* ── §1 흙 필드 : D[i] = 파낸 깊이 0..1 ── */
  function makeField() { return new Float32Array(GW * GH); }   // 0 = 안 판 상태
  function idx(i, j) { return j * GW + i; }

  /* 도구 프로파일 (SPEC §1 표) */
  var TOOLS = {
    brush:  { R: 0.040, dz: 0.0045, rim: 0.00, particles: 8 },   // 느리고 안전(정답 도구)
    trowel: { R: 0.075, dz: 0.030,  rim: 0.25, particles: 0 }    // 빠르고 넓게 — 유물 코앞이면 손상
  };

  /* 스탬프: (cx,cz) 정규화[0,1]에 도구 프로파일 감산(→ D 증가). 반환 = 더티 셀 목록(D-1 최적화). */
  function stamp(D, cx, cz, toolName, rng) {
    var t = TOOLS[toolName]; if (!t) return { dirty: [] };
    rng = rng || Math.random;
    var R = t.R, R2 = R * R;
    var i0 = Math.max(0, Math.floor((cx - R) * (GW - 1))), i1 = Math.min(GW - 1, Math.ceil((cx + R) * (GW - 1)));
    var j0 = Math.max(0, Math.floor((cz - R) * (GH - 1))), j1 = Math.min(GH - 1, Math.ceil((cz + R) * (GH - 1)));
    var dirty = [];
    for (var j = j0; j <= j1; j++) {
      for (var i = i0; i <= i1; i++) {
        var x = i / (GW - 1), z = j / (GH - 1);
        var dx = x - cx, dz = z - cz, d2 = dx * dx + dz * dz;
        if (d2 > R2) continue;
        var r = Math.sqrt(d2) / R;                 // 0..1
        var falloff = Math.cos(Math.PI / 2 * r); falloff *= falloff;   // cos² 감쇠
        var add = t.dz * falloff;
        if (t.rim > 0 && r > 0.6) add *= (1 + (rng() - 0.5) * 2 * t.rim);  // 꽃삽 림 노이즈 ±25%
        var k = idx(i, j), nv = D[k] + add; if (nv > 1) nv = 1;
        if (nv !== D[k]) { D[k] = nv; dirty.push(k); }
      }
    }
    return { dirty: dirty };
  }

  /* ── §1 지층 밴드 색 (파 내려갈수록 옛 층) ── */
  function layerColor(depth) {
    if (depth < 0.18) return '#6b4f2f';   // 겉흙
    if (depth < 0.45) return '#8a6a3d';   // 갈색층
    if (depth < 0.75) return '#b99a63';   // 모래층
    return '#7a6a55';                     // 점토층
  }
  function layerName(depth) {
    if (depth < 0.18) return '겉흙';
    if (depth < 0.45) return '갈색층';
    if (depth < 0.75) return '모래층';
    return '점토층';
  }

  /* ── §2 노출률 : 유물 xz 바운딩 내 셀 중 D>d_a 비율 (D-3: 바운딩만 스캔) ──
     place = { ax, az, rx, rz, d_a }  (정규화 중심·반경·유물 상단 깊이) */
  function exposeRatio(D, place) {
    var i0 = Math.max(0, Math.floor((place.ax - place.rx) * (GW - 1)));
    var i1 = Math.min(GW - 1, Math.ceil((place.ax + place.rx) * (GW - 1)));
    var j0 = Math.max(0, Math.floor((place.az - place.rz) * (GH - 1)));
    var j1 = Math.min(GH - 1, Math.ceil((place.az + place.rz) * (GH - 1)));
    var tot = 0, exp = 0;
    for (var j = j0; j <= j1; j++) for (var i = i0; i <= i1; i++) {
      var x = i / (GW - 1), z = j / (GH - 1);
      // 타원 바운딩 내부만
      var nx = (x - place.ax) / place.rx, nz = (z - place.az) / place.rz;
      if (nx * nx + nz * nz > 1) continue;
      tot++; if (D[idx(i, j)] > place.d_a) exp++;
    }
    return tot ? exp / tot : 0;
  }

  /* ── §2 손상 판정 (꽃삽만·스탬프 시점, D-5) ──
     스탬프 중심이 유물 바운딩+0.02 안 && 그 지점 D > d_a − 0.05 (유물 코앞) → true. */
  function damageAt(D, cx, cz, place, toolName) {
    if (toolName !== 'trowel') return false;
    var nx = (cx - place.ax) / (place.rx + 0.02), nz = (cz - place.az) / (place.rz + 0.02);
    if (nx * nx + nz * nz > 1) return false;
    var i = Math.round(cx * (GW - 1)), j = Math.round(cz * (GH - 1));
    if (i < 0 || i > GW - 1 || j < 0 || j > GH - 1) return false;
    return D[idx(i, j)] > (place.d_a - 0.05);
  }

  /* ── §4 조각(shard) 분할 — 파라미터 공간(θ,y) 분할 [이 SPEC의 심장] ──
     N = shards_base + 2·hp_lost. 각도 구간 A = ceil(N/2)(균등+지터, 간격≥0.5rad 보장).
     수평 절단선 1개 y_c∈[0.35,0.6]을 각폭 넓은 구간부터 (N−A)개에 적용 → 조각 수 = A+(N−A)=N 정확.
     결정론: rng = mulberry32(hashStr(id) ^ hp_lost) → 같은 유물·같은 손상이면 같은 조각.
     ⚠️ SPEC 본문 공식 채택(괄호의 'N=5 각도5구간' 예시와 상충 → 본문·검산 불변식 우선). */
  function splitShards(art, hpLost) {
    hpLost = hpLost || 0;
    var N = art.shards_base + 2 * hpLost;
    var A = Math.ceil(N / 2);
    var rng = mulberry32((hashStr(art.id) ^ Math.imul(hpLost + 1, 0x9E3779B9)) >>> 0);
    var seg = 2 * Math.PI / A;

    // A개 각도 경계 = 균등 + 지터(±15% → 최소간격 ≥0.7·seg ≥0.73rad)
    var bounds = [];
    for (var i = 0; i < A; i++) bounds.push(i * seg + (rng() - 0.5) * seg * 0.30);
    bounds.sort(function (a, b) { return a - b; });
    var segs = [];
    for (i = 0; i < A; i++) {
      var t0 = bounds[i], t1 = (i < A - 1) ? bounds[i + 1] : bounds[0] + 2 * Math.PI;
      segs.push({ th0: t0, th1: t1, w: t1 - t0 });
    }
    // 각폭 넓은 순 (N−A)개 구간에 수평 절단
    var order = segs.map(function (s, ix) { return ix; }).sort(function (a, b) { return segs[b].w - segs[a].w; });
    var cut = {}; for (var k = 0; k < (N - A); k++) cut[order[k]] = true;
    var yc = 0.35 + rng() * 0.25;                       // [0.35,0.60]

    var shards = [], id = 0;
    for (i = 0; i < A; i++) {
      var s = segs[i];
      if (cut[i]) {
        shards.push({ id: id++, th0: s.th0, th1: s.th1, y0: 0, y1: yc, cut: true });
        shards.push({ id: id++, th0: s.th0, th1: s.th1, y0: yc, y1: 1, cut: true });
      } else {
        shards.push({ id: id++, th0: s.th0, th1: s.th1, y0: 0, y1: 1, cut: false });
      }
    }
    return { N: N, A: A, yc: yc, angleSegs: segs, shards: shards };
  }

  /* 조각의 원 파라미터 중심(복원 스냅 목표 계산 보조) */
  function shardCenter(shard) {
    return { th: (shard.th0 + shard.th1) / 2, y: (shard.y0 + shard.y1) / 2 };
  }

  /* ── §5 복원 스냅 판정 ── */
  function snapOk(dpos, drotDeg, tol) {
    return dpos < (tol || 0.06) && Math.abs(drotDeg) < 12;
  }

  /* ── §5 복원실 — 트레이 산개 레이아웃(결정론) ──
     splitShards 결과를 소비. 각 조각 = { id, th·y(원 파라미터 홈), trayAngle(트레이 링 각), rot0deg(초기 흐트러짐 — 30°배수 1..11, 절대 0 아님 → 항상 돌릴 게 있음·↻30°로 정확 도달), placed }.
     rng = mulberry32(hashStr(id) ^ (hpLost+7)…) → 같은 유물·같은 손상이면 같은 산개(재현). */
  function restoreLayout(art, hpLost) {
    hpLost = hpLost || 0;
    var info = splitShards(art, hpLost);
    var N = info.N;
    var rng = mulberry32((hashStr(art.id) ^ Math.imul(hpLost + 7, 0x85EBCA6B)) >>> 0);
    var slots = info.shards.map(function (s, k) {
      var c = shardCenter(s);
      var trayAngle = (k / N) * 2 * Math.PI + (rng() - 0.5) * 0.5;   // 링 균등 + 지터
      var steps = 1 + Math.floor(rng() * 11);                        // 1..11
      return { id: s.id, th: c.th, y: c.y, trayAngle: trayAngle, rot0deg: (steps * 30) % 360, placed: false };
    });
    return { N: N, yc: info.yc, slots: slots, shards: info.shards };
  }
  function restoreProgress(slots) {
    var p = 0; for (var i = 0; i < slots.length; i++) if (slots[i].placed) p++;
    return { placed: p, total: slots.length, ratio: slots.length ? p / slots.length : 0 };
  }
  function restoreDone(slots) {
    for (var i = 0; i < slots.length; i++) if (!slots[i].placed) return false;
    return slots.length > 0;
  }
  /* 조각의 실제 프로파일 y 구간(정규화 y0..y1 → 프로파일 좌표) — 부분 라티스 생성 기준 */
  function shardYSpan(profile, shard) {
    var y0 = profile[0][1], y1 = profile[profile.length - 1][1], H = y1 - y0;
    return { yLo: y0 + shard.y0 * H, yHi: y0 + shard.y1 * H };
  }

  /* ── §3 lathe 프로파일 유효성 (회전체 원산지) ── */
  function latheValid(profile) {
    if (!profile || profile.length < 3) return false;
    for (var i = 0; i < profile.length; i++) {
      if (profile[i][0] < 0) return false;                  // 반지름 음수 불가
      if (i > 0 && profile[i][1] < profile[i - 1][1]) return false;  // y 비감소
    }
    return true;
  }

  var ERA_ORDER = ['구석기', '신석기', '청동기', '삼국', '고려', '조선', '근대'];
  function eraIndex(era) { return ERA_ORDER.indexOf(era); }
  /* 연표실 판정 — 순수 로직. chosenEra가 유물 시대면 ok, 아니면 timeline_wrong 맞춤 문구(없으면 기본). */
  function timelineResult(art, chosenEra) {
    var ok = (chosenEra === art.era);
    var msg = ok ? ('맞았어요! ' + art.name + '은(는) ' + art.era + ' 유물이에요.')
      : ((art.timeline_wrong && art.timeline_wrong[chosenEra]) || '다시 생각해봐요 — 이 유물의 재료와 생김새를 떠올려요.');
    return { ok: ok, era: art.era, chosen: chosenEra, msg: msg };
  }

  var API = {
    GW: GW, GH: GH, TOOLS: TOOLS,
    mulberry32: mulberry32, hashStr: hashStr,
    makeField: makeField, idx: idx, stamp: stamp,
    layerColor: layerColor, layerName: layerName,
    exposeRatio: exposeRatio, damageAt: damageAt,
    splitShards: splitShards, shardCenter: shardCenter,
    snapOk: snapOk, latheValid: latheValid,
    restoreLayout: restoreLayout, restoreProgress: restoreProgress,
    restoreDone: restoreDone, shardYSpan: shardYSpan,
    ERA_ORDER: ERA_ORDER, eraIndex: eraIndex, timelineResult: timelineResult
  };
  root.DigLab = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : this);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DL = window.DigLab;
const ARTS = window.DIG_ARTIFACTS;
const params = new URLSearchParams(location.search);

/* 무대 좌표: 흙판 가로 3(X)·세로 2(Z), 깊이 스케일 DEP. 정규화(cx,cz)∈[0,1] ↔ 월드. */
const SX = 3.0, SZ = 2.0, DEP = 1.2;
const nx2wx = cx => (cx - 0.5) * SX, nz2wz = cz => (cz - 0.5) * SZ;

/* ══════════ 사운드 (KLab.sound 미니) ══════════ */
const Snd = (function(){
  let ctx=null, on=localStorage.getItem('dig_snd')!=='0';
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function beep(f,d,type,g){ const c=ac(); if(!c||!on)return; const o=c.createOscillator(),ga=c.createGain();
    o.type=type||'sine'; o.frequency.value=f; ga.gain.value=g||0.05; o.connect(ga); ga.connect(c.destination);
    const t=c.currentTime; o.start(t); ga.gain.setValueAtTime(g||0.05,t); ga.gain.exponentialRampToValueAtTime(0.0001,t+d); o.stop(t+d); }
  return {
    play(n){ if(n==='dig')beep(150+Math.random()*40,.07,'sawtooth',.035);
      else if(n==='brush')beep(2200+Math.random()*300,.03,'triangle',.015);
      else if(n==='tap')beep(520,.06,'triangle');
      else if(n==='reveal'){beep(560,.12,'sine',.06);setTimeout(()=>beep(760,.16,'sine',.06),90);}
      else if(n==='success'){beep(660,.12,'sine',.07);setTimeout(()=>beep(880,.18,'sine',.07),110);setTimeout(()=>beep(1040,.2,'sine',.06),240);}
      else if(n==='nope'){beep(180,.16,'square',.05);} },
    toggle(){ on=!on; localStorage.setItem('dig_snd',on?'1':'0'); return on; }
  };
})();
document.getElementById('sndtog').onclick=e=>{ e.currentTarget.textContent=Snd.toggle()?'🔊':'🔈'; };

/* ══════════ 씬 (klab3 코어 — r185·PMREM·ACESFilmic) ══════════ */
const stageEl=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stageEl.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x171310);
scene.fog=new THREE.Fog(0x171310,5,11);

const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.05,50);
camera.position.set(0.2,2.3,2.7);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const sun=new THREE.DirectionalLight(0xfff0d8,2.0);
sun.position.set(2.5,5,2.5); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.near=0.5; sun.shadow.camera.far=14;
sun.shadow.camera.left=-3; sun.shadow.camera.right=3; sun.shadow.camera.top=3; sun.shadow.camera.bottom=-3;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcdd8ff,0x2a1e14,0.5));

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=1.4; controls.maxDistance=5.5;
controls.maxPolarAngle=1.35; controls.enablePan=false;
controls.target.set(0,-0.35,0);

/* ══════════ 흙 상자(측벽) ══════════ */
const wallMat=new THREE.MeshStandardMaterial({color:0x5c4630,roughness:1});
const box=new THREE.Mesh(new THREE.BoxGeometry(SX,DEP,SZ),wallMat);
box.position.y=-DEP/2; box.receiveShadow=true; scene.add(box);

/* ══════════ 흙 표면(정점색=지층·y=-D·DEP) ══════════ */
const GW=DL.GW, GH=DL.GH;
const soilGeo=new THREE.PlaneGeometry(SX,SZ,GW-1,GH-1);
soilGeo.rotateX(-Math.PI/2);
const soilCol=new Float32Array(GW*GH*3);
soilGeo.setAttribute('color',new THREE.BufferAttribute(soilCol,3));
const soilMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:false});
const soil=new THREE.Mesh(soilGeo,soilMat); soil.receiveShadow=true; scene.add(soil);
const soilPos=soilGeo.attributes.position;
const _c=new THREE.Color();
function vtxIndex(i,j){ return j*GW+i; }   // PlaneGeometry 정점 순서 = 행우선(위→아래)
function paintVtx(i,j){
  const k=vtxIndex(i,j), d=D[DL.idx(i,j)];
  soilPos.setY(k,-d*DEP);
  _c.set(DL.layerColor(d)); soilCol[k*3]=_c.r; soilCol[k*3+1]=_c.g; soilCol[k*3+2]=_c.b;
}
function repaintAll(){ for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)paintVtx(i,j);
  soilPos.needsUpdate=true; soilGeo.attributes.color.needsUpdate=true; soilGeo.computeVertexNormals(); }

/* ══════════ 유물(LatheGeometry) ══════════ */
const ART_SC=0.62;                     // 유물 스케일
let art=ARTS[params.get('artifact')]||ARTS['bitsal'];
let artMesh=null, place=null;
function latheTexture(a){
  const cv=document.createElement('canvas'); cv.width=cv.height=512; const g=cv.getContext('2d');
  g.fillStyle=a.geo.tint||'#B08860'; g.fillRect(0,0,512,512);
  if(a.geo.pattern==='comb_lines'){ g.strokeStyle='rgba(60,40,25,.42)'; g.lineWidth=2.5;
    for(let x=-512;x<512;x+=14){ g.beginPath(); g.moveTo(x,0); g.lineTo(x+256,512); g.stroke(); } }
  else if(a.geo.pattern==='inlay'){ g.strokeStyle='rgba(245,245,235,.7)'; g.lineWidth=3;
    for(let y=120;y<420;y+=90){ g.beginPath(); g.moveTo(0,y); g.lineTo(512,y); g.stroke(); }
    g.strokeStyle='rgba(30,30,30,.6)'; for(let y=126;y<426;y+=90){ g.beginPath(); g.moveTo(0,y); g.lineTo(512,y); g.stroke(); } }
  else if(a.geo.pattern==='blue_paint'){ g.strokeStyle='rgba(38,66,150,.78)'; g.lineWidth=5; g.lineCap='round';
    for(let cx=90;cx<512;cx+=150){ const cy=250+(cx%2?30:-20);   // 흰 바탕에 푸른 초화(草花) 붓질
      g.beginPath(); g.moveTo(cx,cy+70); g.quadraticCurveTo(cx-30,cy,cx,cy-60); g.stroke();
      g.beginPath(); g.moveTo(cx,cy-10); g.quadraticCurveTo(cx+42,cy-30,cx+58,cy-8); g.stroke();
      g.beginPath(); g.moveTo(cx,cy+20); g.quadraticCurveTo(cx-42,cy,cx-58,cy+22); g.stroke(); } }
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace; return tx;
}
function buildArtifact(){
  if(artMesh){ scene.remove(artMesh); artMesh.geometry.dispose(); }
  let geo;
  if(art.geo.type==='lathe'){
    const pts=art.geo.profile.map(p=>new THREE.Vector2(Math.max(0.001,p[0])*ART_SC, p[1]*ART_SC));
    geo=new THREE.LatheGeometry(pts,48);
  } else { geo=new THREE.SphereGeometry(0.18,16,12); }   // composite는 T2-2
  const mat=new THREE.MeshStandardMaterial({map:latheTexture(art),roughness:0.82,metalness:0.02});
  artMesh=new THREE.Mesh(geo,mat);
  artMesh.castShadow=false;                              // D-2: 흙 위 그림자 스포일러 방지
  // 배치: 앵커 중앙, top 깊이 = place.d_a. profile 최고 y = 마지막 점.
  const topY=art.geo.profile[art.geo.profile.length-1][1]*ART_SC;
  place={ ax:0.5, az:0.5, rx:0.10, rz:0.14, d_a:0.42 };
  artMesh.position.set(nx2wx(place.ax), -place.d_a*DEP - topY, nz2wz(place.az));
  scene.add(artMesh);
}

/* ══════════ 상태 ══════════ */
let D=DL.makeField();
let tool='brush', grade='mid', hpLost=0, lifted=false, gridOn=false;
let predicted=false;

function resetDig(){
  D=DL.makeField(); hpLost=0; lifted=false;
  buildArtifact(); repaintAll();
  document.getElementById('liftBtn').disabled=true;
  updateExpose();
  cracks.forEach(c=>scene.remove(c)); cracks=[];
  if(artMesh) artMesh.position.y=-place.d_a*DEP - art.geo.profile[art.geo.profile.length-1][1]*ART_SC;
}

/* ══════════ 노출 게이지 ══════════ */
const exFill=document.getElementById('exFill'), exPct=document.getElementById('exPct'), exNote=document.getElementById('exNote');
function updateExpose(){
  const r=DL.exposeRatio(D,place), pc=Math.round(r*100);
  exFill.style.width=pc+'%'; exPct.textContent=pc+'%';
  const lift=document.getElementById('liftBtn');
  if(r>=0.85 && !lifted){ lift.disabled=false; exNote.textContent='다 드러났어요! ⬆ 들어올리기를 눌러요.'; }
  else if(!lifted){ exNote.textContent='붓으로 살살 파 보세요. 85%까지 드러나면 들어올릴 수 있어요.'; }
  return r;
}

/* ══════════ 크랙 데칼(간이) ══════════ */
let cracks=[];
function addCrack(){
  const g=new THREE.BufferGeometry(); const pts=[];
  const base=artMesh.position.clone(); base.y+=art.geo.profile[art.geo.profile.length-1][1]*ART_SC*0.6;
  let p=base.clone().add(new THREE.Vector3((Math.random()-.5)*.14,0,(Math.random()-.5)*.14));
  for(let s=0;s<5;s++){ pts.push(p.x,p.y,p.z); p=p.clone().add(new THREE.Vector3((Math.random()-.5)*.06,-0.03,(Math.random()-.5)*.06)); }
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.55}));
  scene.add(l); cracks.push(l);
}
function shake(){ const p=camera.position.clone(); let n=0;
  const iv=setInterval(()=>{ camera.position.set(p.x+(Math.random()-.5)*.05,p.y+(Math.random()-.5)*.05,p.z); if(++n>6){clearInterval(iv);camera.position.copy(p);} },22); }

/* ══════════ 발굴 인터랙션 ══════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let digging=false;
function hitSoil(ev){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.x=((ev.clientX-r.left)/r.width)*2-1; ndc.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObject(soil,false)[0];
  if(!hit) return null;
  const cx=hit.point.x/SX+0.5, cz=hit.point.z/SZ+0.5;
  if(cx<0||cx>1||cz<0||cz>1) return null;
  return {cx,cz};
}
function digAt(cx,cz){
  if(lifted) return;
  // 손상 판정(스탬프 시점)
  if(DL.damageAt(D,cx,cz,place,tool)){
    if(hpLost<art.hp){ hpLost++; addCrack(); shake(); Snd.play('nope');
      toast('조심! 유물이에요 — 🖌 붓으로 살살 파요'); }
    else { shake(); }
  }
  const res=DL.stamp(D,cx,cz,tool,Math.random);
  for(const k of res.dirty){ const j=(k/GW)|0, i=k-j*GW; paintVtx(i,j); }
  if(res.dirty.length){ soilPos.needsUpdate=true; soilGeo.attributes.color.needsUpdate=true; soilGeo.computeVertexNormals(); }
  Snd.play(tool==='brush'?'brush':'dig');
  const prevR=lastR; lastR=updateExpose();
  if(prevR<0.85 && lastR>=0.85) Snd.play('reveal');
}
let lastR=0;
renderer.domElement.addEventListener('pointerdown',ev=>{
  const h=hitSoil(ev); if(h){ digging=true; controls.enabled=false;
    // 꽃삽 첫 사용 = 예측 카드(반증 학습)
    if(tool==='trowel' && !predicted){ predicted=true; showPredict(); return; }
    digAt(h.cx,h.cz); }
});
renderer.domElement.addEventListener('pointermove',ev=>{ if(!digging)return; const h=hitSoil(ev); if(h)digAt(h.cx,h.cz); });
addEventListener('pointerup',()=>{ digging=false; controls.enabled=true; });

/* ══════════ 도구·학년·버튼 ══════════ */
document.querySelectorAll('#tools .tool').forEach(b=>{ b.onclick=()=>{ tool=b.dataset.tool; Snd.play('tap');
  document.querySelectorAll('#tools .tool').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('panel').textContent = tool==='brush'
    ? '🖌 붓 — 느리지만 안전해요. 유물 가까이는 붓으로.'
    : '🪏 꽃삽 — 빠르지만 유물에 닿으면 금이 가요.'; }; });
document.querySelectorAll('#gradeTabs button').forEach(b=>{ b.onclick=()=>{ grade=b.dataset.grade; Snd.play('tap');
  document.querySelectorAll('#gradeTabs button').forEach(x=>x.classList.toggle('on',x===b)); applyGrade(); }; });
function applyGrade(){
  // 저학년 = 붓만
  const tw=document.querySelector('#tools .tool[data-tool="trowel"]');
  if(grade==='low'){ tw.style.display='none'; if(tool==='trowel'){ tool='brush';
    document.querySelectorAll('#tools .tool').forEach(x=>x.classList.toggle('on',x.dataset.tool==='brush')); } }
  else tw.style.display='';
  // 고학년 = 격자·기록 의무 안내
  document.getElementById('panel').textContent = grade==='high'
    ? '고학년 — 📐 조사격자를 설치하고 📸 기록하며 발굴해요.' : '흙을 문질러 파 보세요. 깊이 들어갈수록 옛 지층이 드러나요.';
}
document.getElementById('newBtn').onclick=()=>{ Snd.play('tap'); resetDig(); };
document.getElementById('gridBtn').onclick=e=>{ gridOn=!gridOn; grid.visible=gridOn; e.currentTarget.classList.toggle('acc',gridOn); Snd.play('tap');
  if(gridOn) toast('📐 조사 격자 설치 — 구획을 기록하며 발굴해요'); };
document.getElementById('recBtn').onclick=()=>{ Snd.play('tap');
  const r=Math.round(DL.exposeRatio(D,place)*100);
  toast('📸 기록 — 노출 '+r+'% · 이 층은 '+DL.layerName(place.d_a)+' (깊을수록 오래된 층)'); };
document.getElementById('liftBtn').onclick=()=>{ if(lifted)return; lifted=true; liftArtifact(); };

/* 조사 격자 오버레이(4×3) */
const grid=new THREE.Group(); grid.visible=false;
(function(){ const mat=new THREE.LineBasicMaterial({color:0xffe08a,transparent:true,opacity:0.5});
  for(let c=0;c<=4;c++){ const x=nx2wx(c/4); const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,0.01,-SZ/2),new THREE.Vector3(x,0.01,SZ/2)]); grid.add(new THREE.Line(g,mat)); }
  for(let r=0;r<=3;r++){ const z=nz2wz(r/3); const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-SX/2,0.01,z),new THREE.Vector3(SX/2,0.01,z)]); grid.add(new THREE.Line(g,mat)); }
})(); scene.add(grid);

/* ══════════ 들어올리기 연출 → 발굴 완료(복원실=T2-1) ══════════ */
function liftArtifact(){
  controls.enabled=false;
  const y0=artMesh.position.y, y1=0.6, t0=performance.now(), dur=1100;
  (function a(now){ let u=(now-t0)/dur; if(u>1)u=1; const e=1-Math.pow(1-u,3);
    artMesh.position.y=y0+(y1-y0)*e; artMesh.rotation.y=e*Math.PI*2;
    if(u<1)requestAnimationFrame(a);
    else{ Snd.play('success'); controls.enabled=true;
      const info=DL.splitShards(art,hpLost);
      showRestoreOffer(info.N);
    }
  })(performance.now());
}
/* 발굴 완료 → 복원실 입장 제안 카드 */
function showRestoreOffer(N){
  const c=document.getElementById('info');
  const dmg = hpLost>0

/* ══════════════════════ 복원실 (T2-1) — 한 파일 내 씬 전환 ══════════════════════
   발굴 D상태·hpLost·splitShards 결과를 그대로 소비. 조각 = 부분 라티스 쉘(절단면 측벽 tint×0.6).
   조각 들기→↻돌리기(30°)→항아리 중앙으로 드래그→스냅(이음선 발광·팅음)→전 조각 완료 시 치유·승격·2회전·수집. */
let mode='dig';
const RS = { built:false, layout:null, vessel:null, turntable:null, groups:[], sel:null,
             hoverY:0.36, ringR:0.95, snapPosW:(params.get('snap')==='0.09'?0.30:0.22),
             ground:null, healed:null, done:false };

function rAtProfile(profile, y){
  for(let i=0;i<profile.length-1;i++){ const a=profile[i], b=profile[i+1];
    if(y>=a[1]-1e-9 && y<=b[1]+1e-9){ const t=(b[1]-a[1])?(y-a[1])/(b[1]-a[1]):0; return a[0]+(b[0]-a[0])*t; } }
  return profile[profile.length-1][0];
}
/* 부분 라티스 쉘: 조각 [θ0,θ1]×[y0,y1] → 외피+내피+절단 측벽. 정점색으로 내부/측벽 어둡게. */
function buildShardGeo(profile, shard){
  const span=DL.shardYSpan(profile, shard), yLo=span.yLo, yHi=span.yHi;
  // y 행: 경계 보간 + 내부 원프로파일 점
  const ys=[yLo]; for(const p of profile){ if(p[1]>yLo+1e-4 && p[1]<yHi-1e-4) ys.push(p[1]); } ys.push(yHi);
  const rows=ys.map(y=>({ r:rAtProfile(profile,y), y:y }));
  const COLS=16, th0=shard.th0, th1=shard.th1;
  const wall=Math.max(0.012, 0.03/ART_SC);           // 쉘 두께(프로파일-r 단위)
  const pos=[], col=[], idx=[]; const R=rows.length, C=COLS+1;
  const push=(r,y,th,shade)=>{ pos.push(Math.max(0.001,r)*Math.cos(th)*ART_SC, y*ART_SC, Math.max(0.001,r)*Math.sin(th)*ART_SC);
    col.push(shade,shade,shade); return pos.length/3-1; };
  // 외피(밝음 1.0) · 내피(0.55)
  const outer=[], inner=[];
  for(let ri=0;ri<R;ri++){ outer.push([]); inner.push([]);
    for(let ci=0;ci<C;ci++){ const th=th0+(th1-th0)*ci/COLS; const rw=rows[ri];
      outer[ri].push(push(rw.r, rw.y, th, 1.0));
      inner[ri].push(push(Math.max(0.001,rw.r-wall), rw.y, th, 0.55)); } }
  const quad=(a,b,c,d)=>{ idx.push(a,b,c, a,c,d); };
  for(let ri=0;ri<R-1;ri++)for(let ci=0;ci<C-1;ci++){
    quad(outer[ri][ci],outer[ri+1][ci],outer[ri+1][ci+1],outer[ri][ci+1]);        // 외피
    quad(inner[ri][ci],inner[ri][ci+1],inner[ri+1][ci+1],inner[ri+1][ci]);        // 내피(역감김)
  }
  // 절단 측벽(어두움 0.42) — 4모서리에서 외↔내 연결
  const S=0.42;
  for(let ri=0;ri<R-1;ri++){ // 좌·우 각도 절단면
    const oL0=outer[ri][0],oL1=outer[ri+1][0],iL0=inner[ri][0],iL1=inner[ri+1][0];
    const a=push(rows[ri].r,rows[ri].y,th0,S), b=push(rows[ri+1].r,rows[ri+1].y,th0,S);
    const c=push(Math.max(0.001,rows[ri+1].r-wall),rows[ri+1].y,th0,S), d=push(Math.max(0.001,rows[ri].r-wall),rows[ri].y,th0,S);
    quad(a,b,c,d);
    const e=push(rows[ri].r,rows[ri].y,th1,S), f=push(rows[ri+1].r,rows[ri+1].y,th1,S);
    const g=push(Math.max(0.001,rows[ri+1].r-wall),rows[ri+1].y,th1,S), h=push(Math.max(0.001,rows[ri].r-wall),rows[ri].y,th1,S);
    quad(e,h,g,f);
  }
  for(let ci=0;ci<C-1;ci++){ // 상·하 수평 절단면
    const th=th0+(th1-th0)*ci/COLS, thN=th0+(th1-th0)*(ci+1)/COLS, top=rows[0], bot=rows[R-1];
    let a=push(top.r,top.y,th,S), b=push(top.r,top.y,thN,S), c=push(Math.max(0.001,top.r-wall),top.y,thN,S), d=push(Math.max(0.001,top.r-wall),top.y,th,S); quad(a,d,c,b);
    let e=push(bot.r,bot.y,th,S), f=push(bot.r,bot.y,thN,S), g=push(Math.max(0.001,bot.r-wall),bot.y,thN,S), h=push(Math.max(0.001,bot.r-wall),bot.y,th,S); quad(e,f,g,h);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return geo;
}
function fullVesselMesh(healed){
  const pts=art.geo.profile.map(p=>new THREE.Vector2(Math.max(0.001,p[0])*ART_SC,p[1]*ART_SC));
  const geo=new THREE.LatheGeometry(pts,48);
  const mat = healed
    ? new THREE.MeshPhysicalMaterial({map:latheTexture(art),roughness:0.5,metalness:0.02,clearcoat:0.9,clearcoatRoughness:0.25})
    : new THREE.MeshStandardMaterial({map:latheTexture(art),roughness:0.82});
  const m=new THREE.Mesh(geo,mat); m.castShadow=true; return m;
}
function enterRestore(){
  mode='restore';
  try{ if(window.parent&&parent!==window&&parent.KEDU_COLLECT) parent.KEDU_COLLECT('dig_'+art.id); }catch(e){}
  // 발굴실 UI·오브젝트 숨김
  ['tools','expose','panel'].forEach(id=>{ const el=document.getElementById(id); if(el)el.style.display='none'; });
  document.querySelector('.tabs').style.display='none';

  soil.visible=false; box.visible=false; grid.visible=false; if(artMesh)artMesh.visible=false; cracks.forEach(c=>c.visible=false);
  document.getElementById('restoreHud').style.display='';

  buildRestore();
  camera.position.set(0.1,1.4,2.4); controls.target.set(0,0.2,0); controls.minDistance=1.2; controls.maxDistance=4.5; controls.maxPolarAngle=1.45;

function buildRestore(){
  const L=DL.restoreLayout(art,hpLost); RS.layout=L; RS.done=false; RS.groups=[]; RS.sel=null;
  // 턴테이블
  const tt=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.66,0.05,48),
    new THREE.MeshStandardMaterial({color:0x2c2620,roughness:0.7,metalness:0.2}));
  tt.position.y=-0.025; tt.receiveShadow=true; scene.add(tt); RS.turntable=tt;
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.63,0.012,8,64),
    new THREE.MeshStandardMaterial({color:0x9B7BF5,roughness:0.4,emissive:0x3a2c6a,emissiveIntensity:0.4}));
  ring.rotation.x=Math.PI/2; ring.position.y=0.005; scene.add(ring); RS.turntable.userData={ring};
  RS.vessel=new THREE.Group(); scene.add(RS.vessel);              // 조립 완료 조각들이 여기 편입
  RS.ground=new THREE.Plane(new THREE.Vector3(0,1,0), 0);         // 드래그 평면(y=hoverY로 상수 이동)
  // 조각 생성·산개
  for(const s of L.shards){
    const slot=L.slots.find(z=>z.id===s.id);
    const geo=buildShardGeo(art.geo.profile,s);
    const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(art.geo.tint||'#B08860'),vertexColors:true,roughness:0.8,metalness:0.02,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(geo,mat); mesh.castShadow=true;
    const g=new THREE.Group(); g.add(mesh);
    const ang=slot.trayAngle;
    g.position.set(Math.cos(ang)*RS.ringR, RS.hoverY, Math.sin(ang)*RS.ringR);
    g.rotation.y=slot.rot0deg*Math.PI/180;
    g.userData={ id:s.id, slot, mesh, placed:false, baseCol:0x000000 };
    scene.add(g); RS.groups.push(g);
  }
  RS.built=true; updateRestoreProgress();
}
function updateRestoreProgress(){
  const pr=DL.restoreProgress(RS.layout.slots);
  document.getElementById('rsFill').style.width=Math.round(pr.ratio*100)+'%';
  document.getElementById('rsPct').textContent=pr.placed+' / '+pr.total;
  document.getElementById('rsNote').textContent = pr.placed===0
    ? '트레이의 조각을 눌러 든 뒤, 항아리 위로 끌어 맞춰요.'
    : pr.placed<pr.total ? '좋아요! 남은 조각도 방향을 맞춰 붙여요.' : '완성!';
}
function normAngle(a){ a%=Math.PI*2; if(a>Math.PI)a-=Math.PI*2; if(a<-Math.PI)a+=Math.PI*2; return a; }
function seamGlow(g){
  const m=g.userData.mesh;
  if(m.material.emissive){ m.material.emissive.set(0xFFD966); m.material.emissiveIntensity=0.9;
    const t0=performance.now(); (function f(now){ let u=(now-t0)/400; if(u>1)u=1;
      m.material.emissiveIntensity=0.9*(1-u); if(u<1)requestAnimationFrame(f); else m.material.emissiveIntensity=0; })(now0()); }
}
function now0(){ return (performance&&performance.now)?performance.now():0; }
/* 조각 배치 시도(스냅). posOK·rotOK → 흡착 애니메이션. 반환 성공 여부. */
function tryPlace(g){
  if(g.userData.placed) return false;
  const p=g.position, dpos=Math.hypot(p.x, p.z);                     // 목표=중앙(0,0)
  const drotDeg=Math.abs(normAngle(g.rotation.y))*180/Math.PI;
  if(!(dpos<RS.snapPosW && DL.snapOk(0, drotDeg, 0.06))) return false; // 위치=월드톨, 회전=SPEC 12°
  g.userData.placed=true; g.userData.slot.placed=true;
  const x0=p.x,y0=p.y,z0=p.z,r0=g.rotation.y,t0=now0();
  (function a(now){ let u=(now-t0)/260; if(u>1)u=1; const e=1-Math.pow(1-u,3);
    g.position.set(x0*(1-e),(y0+(0-y0)*e),z0*(1-e)); g.rotation.y=r0*(1-e);
    if(u<1)requestAnimationFrame(a); else { g.position.set(0,0,0); g.rotation.y=0; seamGlow(g); } })(t0);
  Snd.play('success'); updateRestoreProgress();
  if(RS.sel===g) RS.sel=null;
  if(DL.restoreDone(RS.layout.slots)) setTimeout(healVessel,360);
  return true;
}
function healVessel(){
  if(RS.done) return; RS.done=true;
  RS.groups.forEach(g=>{ scene.remove(g); });                       // 조각 치우고
  const healed=fullVesselMesh(true); scene.add(healed); RS.healed=healed;  // 매끈한 완성체
  // 이음선 플래시 + 2회전 감상
  const t0=now0();
  (function a(now){ let u=(now-t0)/1600; if(u>1)u=1;
    healed.rotation.y=u*Math.PI*4;                                  // 2바퀴
    if(healed.material.emissive){ healed.material.emissive.set(0xFFD966); healed.material.emissiveIntensity=0.5*Math.max(0,1-u*1.4); }
    if(u<1)requestAnimationFrame(a); else showArtifactCard(); })(t0);
  Snd.play('reveal');
}
function showArtifactCard(){

  c.innerHTML='<h3>✨ '+art.name+' 복원 완료!</h3>'+

/* ── 복원실 인터랙션 ── */
const rsRay=new THREE.Raycaster(), rsNdc=new THREE.Vector2();
let rsDragging=false;
function rsPick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  rsNdc.x=((ev.clientX-r.left)/r.width)*2-1; rsNdc.y=-((ev.clientY-r.top)/r.height)*2+1;
  rsRay.setFromCamera(rsNdc,camera);
  const meshes=RS.groups.filter(g=>!g.userData.placed).map(g=>g.userData.mesh);
  const hit=rsRay.intersectObjects(meshes,false)[0];
  if(!hit) return null;
  let o=hit.object; while(o && RS.groups.indexOf(o)<0) o=o.parent;
  return o;
}
function rsGroundXZ(ev){
  const r=renderer.domElement.getBoundingClientRect();
  rsNdc.x=((ev.clientX-r.left)/r.width)*2-1; rsNdc.y=-((ev.clientY-r.top)/r.height)*2+1;
  rsRay.setFromCamera(rsNdc,camera);
  const pt=new THREE.Vector3(); const plane=new THREE.Plane(new THREE.Vector3(0,1,0), -RS.hoverY);
  rsRay.ray.intersectPlane(plane, pt);
  return pt;
}
renderer.domElement.addEventListener('pointerdown',ev=>{ if(mode!=='restore')return;
  const g=rsPick(ev); if(g){ RS.sel=g; rsDragging=true; controls.enabled=false;
    RS.groups.forEach(x=>{ if(x.userData.mesh.material.emissive){ x.userData.mesh.material.emissiveIntensity=0; } });
    if(g.userData.mesh.material.emissive){ g.userData.mesh.material.emissive.set(0x9B7BF5); g.userData.mesh.material.emissiveIntensity=0.35; }
    Snd.play('tap'); } });
renderer.domElement.addEventListener('pointermove',ev=>{ if(mode!=='restore'||!rsDragging||!RS.sel)return;
  const p=rsGroundXZ(ev); if(p){ RS.sel.position.x=p.x; RS.sel.position.z=p.z; } });
addEventListener('pointerup',()=>{ if(mode!=='restore')return; rsDragging=false; controls.enabled=true;
  if(RS.sel && !RS.sel.userData.placed){ if(!tryPlace(RS.sel)){ /* 근접 힌트 */
    const d=Math.hypot(RS.sel.position.x,RS.sel.position.z);
    if(d<RS.snapPosW*1.6) toast('조금만 더! ↻ 돌리기로 방향을 맞춰봐요'); } } });
document.getElementById('rsRotate').onclick=()=>{ if(!RS.sel||RS.sel.userData.placed){ toast('먼저 조각을 눌러 들어요'); return; }

(function loop(){ requestAnimationFrame(loop); controls.update();
  if(mode==='restore' && RS.built && !RS.done){ const t=now0(), dt=(t-_last)/1000; _last=t;
    if(RS.turntable){ RS.turntable.rotation.y+=0.15*dt; RS.vessel.rotation.y+=0.15*dt;
      if(RS.turntable.userData&&RS.turntable.userData.ring) RS.turntable.userData.ring.rotation.z+=0.15*dt; } }
  renderer.render(scene,camera); })();

// 딥링크 학년
const pg=params.get('grade'); if(pg&&['low','mid','high'].includes(pg)){ grade=pg;
  document.querySelectorAll('#gradeTabs button').forEach(x=>x.classList.toggle('on',x.dataset.grade===grade)); }
buildArtifact(); repaintAll(); applyGrade(); lastR=updateExpose();
document.getElementById('loading').style.display='none';

// 딥링크: ?stage=restore → 발굴 건너뛰고 복원실 직행(교사·검수용). hp=n으로 손상 조각수 프리셋.
const php=parseInt(params.get('hp')||'0',10); if(php>0) hpLost=Math.min(php,art.hp);
if(params.get('stage')==='restore'){ lifted=true; enterRestore(); }
if(params.get('stage')==='timeline'){ lifted=true; enterTimeline(); }   // 교사·검수 직행

// 스모크 노출
window.__DIG_SCENE={ get tool(){return tool;}, get grade(){return grade;}, get hpLost(){return hpLost;},
  get exposeRatio(){return DL.exposeRatio(D,place);}, get lifted(){return lifted;},
  digAt, resetDig, get artName(){return art.name;},
  get mode(){return mode;}, enterRestore, exitRestore,
  get restoreProgress(){return RS.layout?DL.restoreProgress(RS.layout.slots):null;},
  get restoreGroups(){return RS.groups.length;},
  // 테스트 헬퍼: 조각을 목표 자세로 세팅 후 스냅 시도
  rsForcePlace(i){ const g=RS.groups[i]; if(!g)return false; g.position.set(0,0,0); g.rotation.y=0; RS.sel=g; return tryPlace(g); },
  rsPlaceAll(){ let n=0; RS.groups.slice().forEach((g,i)=>{ g.position.set(0,0,0); g.rotation.y=0; RS.sel=g; if(tryPlace(g))n++; }); return n; },
  get restoreDone(){return RS.done;},
  // 연표실 훅
  enterTimeline, exitTimeline, get tlDone(){return tlDone;},
  get tlEraCount(){return document.querySelectorAll('.tlEra').length;},
  tlPickEra(era){ const el=document.querySelector('.tlEra[data-era="'+era+'"]'); if(el&&el.onclick)el.onclick(); return tlDone; } };
</script>

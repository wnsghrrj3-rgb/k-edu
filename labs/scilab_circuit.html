<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>케이랩 · 전기 실험실 «불을 켜는 법»</title>
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:'Gowun Dodum',system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{display:block}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#8b949e;z-index:50}
  #loading.hide{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">전기 실험실 준비 중…</div>

<!-- ═══════════════════════════════════════════════════════════
     순수 로직 (P1 게이트: 렌더 0줄 · window.KCircuit / module.exports)
     — 회로 해석 엔진(노드 전압법 + 가우스 소거). 렌더 어댑터(P2)는 별도 module script.
     근거: SPEC_CIRCUIT.md §2 회로 모델(수치 확정) · §5 테스트 계약(24단언)
     ═══════════════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════
   전기 실험실 P1 «회로 해석 엔진» — 순수 로직 (렌더 0줄)
   회로 = 격자 위 소자(변). solve(edges) → 노드 전압 · 소자별 전류 · 밝기.
   토폴로지 감지 코드 없음(직/병렬 자동) — 노드 전압법 일반해.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // ── SPEC_CIRCUIT §2 확정 수치 ──────────────────────────────
  var NX = 4, NY = 3, NNODE = NX * NY;              // 4×3 격자 = 12노드
  var R_WIRE = 0.001, R_BULB = 10, R_COPPER = 0.01; // 저항(Ω)
  var R_SW_CLOSED = 0.001, R_SW_OPEN = 1e9;
  var R_GLASS = 1e9;                                // 유리 막대(부도체)
  var BAT_EMF = 1.5, BAT_R = 0.5;                   // 전지: EMF·내부저항
  var EPS_FLOAT = 1e-12;                            // 부동 노드 약접지
  var SHORT_I = 1.0, OPEN_I = 1e-4;                 // 단락·개회로 임계
  // 기준 밝기 P0 = 전지1+전구1 회로 전구 전력
  var P0 = (BAT_EMF / (BAT_R + R_BULB)) * (BAT_EMF / (BAT_R + R_BULB)) * R_BULB; // 0.20408W
  var B_CAP = 2.5;                                  // 밝기 클램프

  // ── 격자 좌표(P2 렌더 참조용 · 순수 로직은 노드 인덱스만 씀) ──
  var GRID_X = [-0.225, -0.075, 0.075, 0.225];
  var GRID_Z = [-0.15, 0, 0.15];
  function nodeAt(ix, iy) { return iy * NX + ix; }  // 0..11
  function nodeXZ(n) { return { x: GRID_X[n % NX], z: GRID_Z[Math.floor(n / NX)] }; }

  // ── 소자 저항(전지는 별도 취급) ──
  function resistance(e) {
    switch (e.type) {
      case 'wire': return R_WIRE;
      case 'bulb': return R_BULB;
      case 'switch': return e.open ? R_SW_OPEN : R_SW_CLOSED;
      case 'rod_copper': return R_COPPER;
      case 'rod_glass': return R_GLASS;
      default: throw new Error('알 수 없는 소자: ' + e.type);
    }
  }

  // ── 가우스 소거(부분 피벗 · Gauss-Jordan) ──
  //    특이 행(부동 방어)은 건너뛰고 해당 미지수 0으로 — §7 안정성 방어
  function gaussSolve(G, J) {
    var n = J.length, i, r, c, col;
    var M = [];
    for (i = 0; i < n; i++) M.push(G[i].slice().concat([J[i]]));
    for (col = 0; col < n; col++) {
      var piv = col;
      for (r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      if (piv !== col) { var tmp = M[piv]; M[piv] = M[col]; M[col] = tmp; }
      var d = M[col][col];
      if (Math.abs(d) < 1e-14) continue;            // 특이 → 스킵
      for (r = 0; r < n; r++) {
        if (r === col) continue;
        var f = M[r][col] / d;
        if (f === 0) continue;
        for (c = col; c <= n; c++) M[r][c] -= f * M[col][c];
      }
    }
    var x = new Array(n);
    for (i = 0; i < n; i++) {
      var dd = M[i][i];
      x[i] = (Math.abs(dd) < 1e-14) ? 0 : M[i][n] / dd;
    }
    return x;
  }

  // ── 전구 밝기(정규화) ──
  function bulbBrightness(I) {
    var P = I * I * R_BULB;
    var B = Math.sqrt(P / P0);
    return B < B_CAP ? B : B_CAP;                   // 클램프 ㉑
  }

  // ── 회로 해석 (순수) ──
  //    edges: [{id,type,a,b, open?, flip?}]  (a,b = 노드 인덱스 0..11)
  //    return: {nodeV[], branches:[{id,type,I,V,P}], brightness:{id:B}, shorted, open}
  function solve(edges) {
    var i, e;
    // 노드 인덱스 경계 검증 ⑲
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      if (e.a < 0 || e.a >= NNODE || e.b < 0 || e.b >= NNODE || e.a !== (e.a | 0) || e.b !== (e.b | 0))
        throw new RangeError('격자 밖 노드: ' + e.a + ',' + e.b);
    }
    var n = NNODE;
    var G = [], J = new Array(n);
    for (i = 0; i < n; i++) { G.push(new Array(n)); for (var k = 0; k < n; k++) G[i][k] = 0; J[i] = 0; }

    var batteries = [];
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      if (e.a === e.b) continue;                    // 자기 루프 무시
      if (e.type === 'battery') {
        var flip = !!e.flip;
        var na = flip ? e.b : e.a;                  // 음극
        var nb = flip ? e.a : e.b;                  // 양극
        var gb = 1 / BAT_R;
        G[na][na] += gb; G[nb][nb] += gb; G[na][nb] -= gb; G[nb][na] -= gb;
        var In = BAT_EMF / BAT_R;                   // 노턴 전류원(음극→양극)
        J[nb] += In; J[na] -= In;
        batteries.push({ e: e, na: na, nb: nb });
      } else {
        var g = 1 / resistance(e);
        G[e.a][e.a] += g; G[e.b][e.b] += g; G[e.a][e.b] -= g; G[e.b][e.a] -= g;
      }
    }

    // 부동(미접속) 노드 약접지 — 특이 방지
    for (i = 0; i < n; i++) if (Math.abs(G[i][i]) < EPS_FLOAT) G[i][i] += EPS_FLOAT;

    // 접지 노드: 최저 인덱스 전지 음극. 전지 없으면 최저 연결 노드. 없으면 0.
    var gnd = -1;
    if (batteries.length) {
      gnd = batteries[0].na;
      for (i = 1; i < batteries.length; i++) if (batteries[i].na < gnd) gnd = batteries[i].na;
    } else {
      for (i = 0; i < edges.length && gnd < 0; i++) if (edges[i].a !== edges[i].b) gnd = Math.min(edges[i].a, edges[i].b);
      if (gnd < 0) gnd = 0;
    }
    // 접지 강제: V[gnd]=0
    for (i = 0; i < n; i++) G[gnd][i] = 0;
    G[gnd][gnd] = 1; J[gnd] = 0;

    var V = gaussSolve(G, J);

    // 소자별 전류·전력
    var branches = [], brightness = {}, shorted = false, anyFlow = false;
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      if (e.a === e.b) { branches.push({ id: e.id, type: e.type, I: 0, V: 0, P: 0 }); continue; }
      if (e.type === 'battery') {
        var fl = !!e.flip;
        var a2 = fl ? e.b : e.a, b2 = fl ? e.a : e.b;
        var Ib = (BAT_EMF + V[a2] - V[b2]) / BAT_R;  // 내부 음극→양극 방향
        branches.push({ id: e.id, type: 'battery', I: Ib, V: V[b2] - V[a2], P: Ib * (V[b2] - V[a2]) });
        if (Math.abs(Ib) > SHORT_I) shorted = true;
        if (Math.abs(Ib) > OPEN_I) anyFlow = true;
      } else {
        var R = resistance(e);
        var Ir = (V[e.a] - V[e.b]) / R;              // a→b
        var Pr = Ir * Ir * R;
        branches.push({ id: e.id, type: e.type, I: Ir, V: V[e.a] - V[e.b], P: Pr });
        if (Math.abs(Ir) > OPEN_I) anyFlow = true;
        if (e.type === 'bulb') {
          brightness[e.id] = (Math.abs(Ir) < OPEN_I) ? 0 : bulbBrightness(Ir);
        }
      }
    }
    return { nodeV: V, branches: branches, brightness: brightness, shorted: shorted, open: !anyFlow };
  }

  // ── 소자 방향(전류 렌더용 · P2가 부호로 흐름 방향 결정) ──
  function branchById(res, id) {
    for (var i = 0; i < res.branches.length; i++) if (res.branches[i].id === id) return res.branches[i];
    return null;
  }

  // ═══ 미션 (SPEC §4 · 4종) ══════════════════════════════════
  //   check: closed(폐회로) / brighter(B≥1.5) / parallel(1구 제거 견딤) / conductor(구리로 켜짐)
  var MISSIONS = [
    { id: 'c1_light', kind: 'mission', check: 'closed', icon: '💡', grade: 'low',
      title: '전구에 불을 켜라', brief: '전지와 전구를 전선으로 이어 불을 켜 봐요.',
      hint: '전지 → 전구 → 전지로 한 바퀴 이어져야 불이 들어와요.',
      tray: ['battery', 'bulb', 'wire'], wrong: ['magnet', 'beaker'] },
    { id: 'c2_bright', kind: 'mission', check: 'brighter', icon: '🔆', grade: 'mid',
      title: '더 밝게 켜라', brief: '전지 2개로 전구를 더 밝게 켜 봐요.',
      hint: '전지를 한 줄로(직렬) 이으면 힘이 세져요.',
      tray: ['battery', 'battery', 'bulb', 'wire'], wrong: ['magnet', 'thermo'] },
    { id: 'c3_parallel', kind: 'mission', check: 'parallel', icon: '🔀', grade: 'mid',
      title: '하나가 꺼져도 켜지게 하라', brief: '전구 두 개를 나란히(병렬) 이어 봐요.',
      hint: '두 전구가 각자 전지로 가는 길을 따로 가지면, 하나를 빼도 남은 게 켜져요.',
      tray: ['battery', 'bulb', 'bulb', 'wire'], wrong: ['magnifier'] },
    { id: 'c4_conductor', kind: 'mission', check: 'conductor', icon: '🧪', grade: 'high',
      title: '도체를 찾아라', brief: '전선 한 칸이 비어 있어요. 구리 막대와 유리 막대 중 무엇이 전기를 통할까요?',
      hint: '끼워서 불이 들어오는 쪽이 전기를 통하는 물질(도체)이에요.',
      tray: ['battery', 'bulb', 'wire', 'rod_copper', 'rod_glass'], wrong: [] }
  ];

  function evalMission(mission, edges) {
    var res = solve(edges);
    var bulbs = edges.filter(function (e) { return e.type === 'bulb'; });
    var lit = bulbs.filter(function (e) { return res.brightness[e.id] > 0; });
    switch (mission.check) {
      case 'closed':
        return { done: lit.length > 0, res: res };
      case 'brighter':
        return { done: lit.some(function (e) { return res.brightness[e.id] >= 1.5; }), res: res };
      case 'parallel': {
        if (bulbs.length < 2) return { done: false, res: res };
        // 각 전구를 하나씩 빼도 남은 전구가 켜지는가(병렬 견고성)
        var robust = bulbs.every(function (rm) {
          var sub = edges.filter(function (e) { return e !== rm; });
          var r2 = solve(sub);
          return bulbs.some(function (e) { return e !== rm && r2.brightness[e.id] > 0; });
        });
        return { done: lit.length >= 2 && robust, res: res };
      }
      case 'conductor': {
        var viaCopper = edges.some(function (e) { return e.type === 'rod_copper'; });
        return { done: viaCopper && lit.length > 0, res: res };
      }
      default:
        return { done: false, res: res };
    }
  }

  // ── 미션 러너(황금 하니스 승계 · 순수) ──
  function createMissionRun(mission) {
    var wrongTries = 0, done = false;
    return {
      mission: mission,
      evaluate: function (edges) {
        if (done) return { done: true, wrongTries: wrongTries };
        var r = evalMission(mission, edges);
        if (r.done) { done = true; }
        return { done: r.done, wrongTries: wrongTries, res: r.res };
      },
      markWrong: function () { if (!done) wrongTries++; },
      isDone: function () { return done; },
      tries: function () { return wrongTries; }
    };
  }

  var API = {
    NX: NX, NY: NY, NNODE: NNODE,
    R_WIRE: R_WIRE, R_BULB: R_BULB, R_COPPER: R_COPPER, R_GLASS: R_GLASS,
    R_SW_OPEN: R_SW_OPEN, R_SW_CLOSED: R_SW_CLOSED,
    BAT_EMF: BAT_EMF, BAT_R: BAT_R, SHORT_I: SHORT_I, OPEN_I: OPEN_I, P0: P0, B_CAP: B_CAP,
    GRID_X: GRID_X, GRID_Z: GRID_Z, nodeAt: nodeAt, nodeXZ: nodeXZ,
    resistance: resistance, gaussSolve: gaussSolve, bulbBrightness: bulbBrightness,
    solve: solve, branchById: branchById,
    MISSIONS: MISSIONS, evalMission: evalMission, createMissionRun: createMissionRun
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  if (typeof window !== 'undefined') window.KCircuit = API;
})();
</script>
</body>
</html>

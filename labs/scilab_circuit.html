<title>케이랩 · 전기 실험실 «불을 켜는 법»</title>
<style>

  #stage canvas{display:block}

</head>
<body>
<div id="stage"></div>
<div id="loading">전기 실험실 준비 중…</div>

<div id="shortBanner" class="hide">⚠️ <b>전선이 뜨거워져요!</b> 진짜 전지는 이렇게 하면 위험해요 — 전구를 꼭 끼워요. (콘센트에는 절대 하지 않기)</div>

<!-- ═══════════════════════════════════════════════════════════
     순수 로직 (P1 게이트: 렌더 0줄 · window.KCircuit / module.exports)
     — 회로 해석 엔진(노드 전압법 + 가우스 소거). 렌더 어댑터(P2)는 별도 module script.
     근거: SPEC_CIRCUIT.md §2 회로 모델(수치 확정) · §5 테스트 계약(24단언)
     ═══════════════════════════════════════════════════════════ -->
<script>
/* ═══════════════════════════════════════════════════════════════
   전기 실험실 P1 «회로 해석 엔진» — 순수 로직 (렌더 0줄)
   회로 = 격자 위 소자(변). solve(edges) → 노드 전압 · 소자별 전류 · 밝기.
   토폴로지 감지 코드 없음(직/병렬 자동) — 노드 전압법 일반해.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // ── SPEC_CIRCUIT §2 확정 수치 ──────────────────────────────
  var NX = 4, NY = 3, NNODE = NX * NY;              // 4×3 격자 = 12노드
  var R_WIRE = 0.001, R_BULB = 10, R_COPPER = 0.01; // 저항(Ω)
  var R_SW_CLOSED = 0.001, R_SW_OPEN = 1e9;
  var R_GLASS = 1e9;                                // 유리 막대(부도체)
  var BAT_EMF = 1.5, BAT_R = 0.5;                   // 전지: EMF·내부저항
  var EPS_FLOAT = 1e-12;                            // 부동 노드 약접지
  var SHORT_I = 1.0, OPEN_I = 1e-4;                 // 단락·개회로 임계
  // 기준 밝기 P0 = 전지1+전구1 회로 전구 전력
  var P0 = (BAT_EMF / (BAT_R + R_BULB)) * (BAT_EMF / (BAT_R + R_BULB)) * R_BULB; // 0.20408W
  var B_CAP = 2.5;                                  // 밝기 클램프

  // ── 격자 좌표(P2 렌더 참조용 · 순수 로직은 노드 인덱스만 씀) ──
  var GRID_X = [-0.225, -0.075, 0.075, 0.225];
  var GRID_Z = [-0.15, 0, 0.15];
  function nodeAt(ix, iy) { return iy * NX + ix; }  // 0..11
  function nodeXZ(n) { return { x: GRID_X[n % NX], z: GRID_Z[Math.floor(n / NX)] }; }

  // ── 소자 저항(전지는 별도 취급) ──
  function resistance(e) {
    switch (e.type) {
      case 'wire': return R_WIRE;
      case 'bulb': return R_BULB;
      case 'switch': return e.open ? R_SW_OPEN : R_SW_CLOSED;
      case 'rod_copper': return R_COPPER;
      case 'rod_glass': return R_GLASS;
      default: throw new Error('알 수 없는 소자: ' + e.type);
    }
  }

  // ── 가우스 소거(부분 피벗 · Gauss-Jordan) ──
  //    특이 행(부동 방어)은 건너뛰고 해당 미지수 0으로 — §7 안정성 방어
  function gaussSolve(G, J) {
    var n = J.length, i, r, c, col;
    var M = [];
    for (i = 0; i < n; i++) M.push(G[i].slice().concat([J[i]]));
    for (col = 0; col < n; col++) {
      var piv = col;
      for (r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      if (piv !== col) { var tmp = M[piv]; M[piv] = M[col]; M[col] = tmp; }
      var d = M[col][col];
      if (Math.abs(d) < 1e-14) continue;            // 특이 → 스킵
      for (r = 0; r < n; r++) {
        if (r === col) continue;
        var f = M[r][col] / d;
        if (f === 0) continue;
        for (c = col; c <= n; c++) M[r][c] -= f * M[col][c];
      }
    }
    var x = new Array(n);
    for (i = 0; i < n; i++) {
      var dd = M[i][i];
      x[i] = (Math.abs(dd) < 1e-14) ? 0 : M[i][n] / dd;
    }
    return x;
  }

  // ── 전구 밝기(정규화) ──
  function bulbBrightness(I) {
    var P = I * I * R_BULB;
    var B = Math.sqrt(P / P0);
    return B < B_CAP ? B : B_CAP;                   // 클램프 ㉑
  }

  // ── 회로 해석 (순수) ──
  //    edges: [{id,type,a,b, open?, flip?}]  (a,b = 노드 인덱스 0..11)
  //    return: {nodeV[], branches:[{id,type,I,V,P}], brightness:{id:B}, shorted, open}
  function solve(edges) {
    var i, e;
    // 노드 인덱스 경계 검증 ⑲
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      if (e.a < 0 || e.a >= NNODE || e.b < 0 || e.b >= NNODE || e.a !== (e.a | 0) || e.b !== (e.b | 0))
        throw new RangeError('격자 밖 노드: ' + e.a + ',' + e.b);
    }
    var n = NNODE;
    var G = [], J = new Array(n);
    for (i = 0; i < n; i++) { G.push(new Array(n)); for (var k = 0; k < n; k++) G[i][k] = 0; J[i] = 0; }

    var batteries = [];
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      if (e.a === e.b) continue;                    // 자기 루프 무시
      if (e.type === 'battery') {
        var flip = !!e.flip;
        var na = flip ? e.b : e.a;                  // 음극
        var nb = flip ? e.a : e.b;                  // 양극
        var gb = 1 / BAT_R;
        G[na][na] += gb; G[nb][nb] += gb; G[na][nb] -= gb; G[nb][na] -= gb;
        var In = BAT_EMF / BAT_R;                   // 노턴 전류원(음극→양극)
        J[nb] += In; J[na] -= In;
        batteries.push({ e: e, na: na, nb: nb });
      } else {
        var g = 1 / resistance(e);
        G[e.a][e.a] += g; G[e.b][e.b] += g; G[e.a][e.b] -= g; G[e.b][e.a] -= g;
      }
    }

    // 부동(미접속) 노드 약접지 — 특이 방지
    for (i = 0; i < n; i++) if (Math.abs(G[i][i]) < EPS_FLOAT) G[i][i] += EPS_FLOAT;

    // 접지 노드: 최저 인덱스 전지 음극. 전지 없으면 최저 연결 노드. 없으면 0.
    var gnd = -1;
    if (batteries.length) {
      gnd = batteries[0].na;
      for (i = 1; i < batteries.length; i++) if (batteries[i].na < gnd) gnd = batteries[i].na;
    } else {
      for (i = 0; i < edges.length && gnd < 0; i++) if (edges[i].a !== edges[i].b) gnd = Math.min(edges[i].a, edges[i].b);
      if (gnd < 0) gnd = 0;
    }
    // 접지 강제: V[gnd]=0
    for (i = 0; i < n; i++) G[gnd][i] = 0;
    G[gnd][gnd] = 1; J[gnd] = 0;

    var V = gaussSolve(G, J);

    // 소자별 전류·전력
    var branches = [], brightness = {}, shorted = false, anyFlow = false;
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      if (e.a === e.b) { branches.push({ id: e.id, type: e.type, I: 0, V: 0, P: 0 }); continue; }
      if (e.type === 'battery') {
        var fl = !!e.flip;
        var a2 = fl ? e.b : e.a, b2 = fl ? e.a : e.b;
        var Ib = (BAT_EMF + V[a2] - V[b2]) / BAT_R;  // 내부 음극→양극 방향
        branches.push({ id: e.id, type: 'battery', I: Ib, V: V[b2] - V[a2], P: Ib * (V[b2] - V[a2]) });
        if (Math.abs(Ib) > SHORT_I) shorted = true;
        if (Math.abs(Ib) > OPEN_I) anyFlow = true;
      } else {
        var R = resistance(e);
        var Ir = (V[e.a] - V[e.b]) / R;              // a→b
        var Pr = Ir * Ir * R;
        branches.push({ id: e.id, type: e.type, I: Ir, V: V[e.a] - V[e.b], P: Pr });
        if (Math.abs(Ir) > OPEN_I) anyFlow = true;
        if (e.type === 'bulb') {
          brightness[e.id] = (Math.abs(Ir) < OPEN_I) ? 0 : bulbBrightness(Ir);
        }
      }
    }
    return { nodeV: V, branches: branches, brightness: brightness, shorted: shorted, open: !anyFlow };
  }

  // ── 소자 방향(전류 렌더용 · P2가 부호로 흐름 방향 결정) ──
  function branchById(res, id) {
    for (var i = 0; i < res.branches.length; i++) if (res.branches[i].id === id) return res.branches[i];
    return null;
  }

  // ═══ 미션 (SPEC §4 · 4종) ══════════════════════════════════
  //   check: closed(폐회로) / brighter(B≥1.5) / parallel(1구 제거 견딤) / conductor(구리로 켜짐)
  var MISSIONS = [
    { id: 'c1_light', kind: 'mission', check: 'closed', icon: '💡', grade: 'low',
      title: '전구에 불을 켜라', brief: '전지와 전구를 전선으로 이어 불을 켜 봐요.',
      hint: '전지 → 전구 → 전지로 한 바퀴 이어져야 불이 들어와요.',
      tray: ['battery', 'bulb', 'wire'], wrong: ['magnet', 'beaker'] },
    { id: 'c2_bright', kind: 'mission', check: 'brighter', icon: '🔆', grade: 'mid',
      title: '더 밝게 켜라', brief: '전지 2개로 전구를 더 밝게 켜 봐요.',
      hint: '전지를 한 줄로(직렬) 이으면 힘이 세져요.',
      tray: ['battery', 'battery', 'bulb', 'wire'], wrong: ['magnet', 'thermo'] },
    { id: 'c3_parallel', kind: 'mission', check: 'parallel', icon: '🔀', grade: 'mid',
      title: '하나가 꺼져도 켜지게 하라', brief: '전구 두 개를 나란히(병렬) 이어 봐요.',
      hint: '두 전구가 각자 전지로 가는 길을 따로 가지면, 하나를 빼도 남은 게 켜져요.',
      tray: ['battery', 'bulb', 'bulb', 'wire'], wrong: ['magnifier'] },
    { id: 'c4_conductor', kind: 'mission', check: 'conductor', icon: '🧪', grade: 'high',
      title: '도체를 찾아라', brief: '전선 한 칸이 비어 있어요. 구리 막대와 유리 막대 중 무엇이 전기를 통할까요?',
      hint: '끼워서 불이 들어오는 쪽이 전기를 통하는 물질(도체)이에요.',
      tray: ['battery', 'bulb', 'wire', 'rod_copper', 'rod_glass'], wrong: [] }
  ];

  function evalMission(mission, edges) {
    var res = solve(edges);
    var bulbs = edges.filter(function (e) { return e.type === 'bulb'; });
    var lit = bulbs.filter(function (e) { return res.brightness[e.id] > 0; });
    switch (mission.check) {
      case 'closed':
        return { done: lit.length > 0, res: res };
      case 'brighter':
        return { done: lit.some(function (e) { return res.brightness[e.id] >= 1.5; }), res: res };
      case 'parallel': {
        if (bulbs.length < 2) return { done: false, res: res };
        // 각 전구를 하나씩 빼도 남은 전구가 켜지는가(병렬 견고성)
        var robust = bulbs.every(function (rm) {
          var sub = edges.filter(function (e) { return e !== rm; });
          var r2 = solve(sub);
          return bulbs.some(function (e) { return e !== rm && r2.brightness[e.id] > 0; });
        });
        return { done: lit.length >= 2 && robust, res: res };
      }
      case 'conductor': {
        var viaCopper = edges.some(function (e) { return e.type === 'rod_copper'; });
        return { done: viaCopper && lit.length > 0, res: res };
      }
      default:
        return { done: false, res: res };
    }
  }

  // ── 미션 러너(황금 하니스 승계 · 순수) ──
  function createMissionRun(mission) {
    var wrongTries = 0, done = false;
    return {
      mission: mission,
      evaluate: function (edges) {
        if (done) return { done: true, wrongTries: wrongTries };
        var r = evalMission(mission, edges);
        if (r.done) { done = true; }
        return { done: r.done, wrongTries: wrongTries, res: r.res };
      },
      markWrong: function () { if (!done) wrongTries++; },
      isDone: function () { return done; },
      tries: function () { return wrongTries; }
    };
  }

  var API = {
    NX: NX, NY: NY, NNODE: NNODE,
    R_WIRE: R_WIRE, R_BULB: R_BULB, R_COPPER: R_COPPER, R_GLASS: R_GLASS,
    R_SW_OPEN: R_SW_OPEN, R_SW_CLOSED: R_SW_CLOSED,
    BAT_EMF: BAT_EMF, BAT_R: BAT_R, SHORT_I: SHORT_I, OPEN_I: OPEN_I, P0: P0, B_CAP: B_CAP,
    GRID_X: GRID_X, GRID_Z: GRID_Z, nodeAt: nodeAt, nodeXZ: nodeXZ,

const scene = new THREE.Scene();
{
  const c=document.createElement('canvas'); c.width=4; c.height=256;

scene.fog = new THREE.Fog(0x10151b, 3.2, 8.0);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.03, 30);

const sun = new THREE.DirectionalLight(0xfff2e0, 2.0);
sun.position.set(1.2,2.8,1.0); sun.castShadow=true;

scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8fb4d8, 0x2b241c, 0.30));

/* ═════════ 회로판(테이블 + 격자 보드) ═════════ */
const BENCH_Y = 0.0;
const NODE_Y  = BENCH_Y + 0.02;
const GX = K.GRID_X, GZ = K.GRID_Z, NX = K.NX;
function nodePos(n){ return new THREE.Vector3(GX[n % NX], NODE_Y, GZ[Math.floor(n / NX)]); }

{ // 상판(짙은 무광)
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.05, 0.85),
    new THREE.MeshStandardMaterial({ color:0x272c34, roughness:0.74, metalness:0.05 }));
  top.position.set(0, BENCH_Y-0.025, 0); top.receiveShadow=true; scene.add(top);
  // 회로 보드
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.014, 0.44),
    new THREE.MeshStandardMaterial({ color:0x2f3742, roughness:0.6, metalness:0.12 }));
  board.position.set(0, BENCH_Y+0.007, 0); board.receiveShadow=true; scene.add(board);
}

// 격자 노드점 + 변 히트
const NODE_MAT = new THREE.MeshStandardMaterial({ color:0x5a6675, roughness:0.5, metalness:0.3 });
for(let n=0;n<K.NNODE;n++){
  const dot=new THREE.Mesh(new THREE.CylinderGeometry(0.009,0.009,0.006,18), NODE_MAT);
  dot.position.copy(nodePos(n)); dot.position.y=BENCH_Y+0.016; scene.add(dot);
}
// 변 목록(가로 9 + 세로 8 = 17)
const EDGES = [];
for(let iy=0;iy<3;iy++) for(let ix=0;ix<3;ix++){ const a=iy*NX+ix, b=iy*NX+ix+1; EDGES.push({key:a+'_'+b,a,b}); }
for(let iy=0;iy<2;iy++) for(let ix=0;ix<4;ix++){ const a=iy*NX+ix, b=(iy+1)*NX+ix; EDGES.push({key:a+'_'+b,a,b}); }

const edgeHit = [];  // {key,a,b,mid,dir,len,hit}
EDGES.forEach(E=>{
  const pa=nodePos(E.a), pb=nodePos(E.b);
  const mid=pa.clone().add(pb).multiplyScalar(0.5);
  const len=pa.distanceTo(pb), dir=pb.clone().sub(pa).normalize();
  // 히트 실린더 r=0.05 (§7) — 투명
  const hit=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,len,10),
    new THREE.MeshBasicMaterial({ visible:false }));
  hit.position.copy(mid); hit.position.y=BENCH_Y+0.05;
  // 실린더 기본 y축 → 변 방향으로
  hit.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  hit.userData.edge=E; scene.add(hit);
  edgeHit.push({ key:E.key, a:E.a, b:E.b, mid, dir, len, hit });
});
function edgeByKey(k){ return edgeHit.find(e=>e.key===k); }

/* ═════════ 소자 3D 빌더 ═════════ */
const GLASS = () => new THREE.MeshPhysicalMaterial({ color:0xcfe6ff, roughness:0.08, metalness:0,
  transparent:true, opacity:0.2, clearcoat:1, clearcoatRoughness:0.06, envMapIntensity:1.1 });
const COPPER = new THREE.MeshStandardMaterial({ color:0xB87333, roughness:0.35, metalness:0.85 });
const FILA_COLD = new THREE.Color(0x3a2a18), FILA_HOT = new THREE.Color(0xFFF4D6);

// 변 방향에 맞춰 그룹 정렬(가로변=x축, 세로변=z축)
function orientToEdge(grp, E){
  const eh=edgeByKey(E.key);
  grp.position.copy(eh.mid); grp.position.y=NODE_Y+0.006;
  // 기본은 x축 정렬 소자 → 변 방향으로 회전(수평면 within, y회전)
  const ang=Math.atan2(eh.dir.z, eh.dir.x);
  grp.rotation.y=-ang;
}

function buildWire(E){
  const eh=edgeByKey(E.key);
  const pa=nodePos(E.a).clone(), pb=nodePos(E.b).clone(); pa.y=NODE_Y+0.006; pb.y=NODE_Y+0.006;
  const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(pa,pb),1,0.004,8,false),
    new THREE.MeshStandardMaterial({ color:0x9aa4b0, roughness:0.4, metalness:0.6 }));
  tube.castShadow=true;
  const grp=new THREE.Group(); grp.add(tube); scene.add(grp);
  return { grp, kind:'wire' };
}
function buildBattery(E){
  const grp=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,0.09,20),
    new THREE.MeshStandardMaterial({ color:0x2b3440, roughness:0.5, metalness:0.4 }));
  body.rotation.z=Math.PI/2; body.castShadow=true; grp.add(body);
  // +극(구리 캡, 돌기) / −극(평평)
  const capP=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.012,16), COPPER);
  capP.rotation.z=Math.PI/2; capP.position.x=0.051; grp.add(capP);
  const capN=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.026,0.006,20),
    new THREE.MeshStandardMaterial({ color:0x8a939e, roughness:0.5, metalness:0.6 }));
  capN.rotation.z=Math.PI/2; capN.position.x=-0.046; grp.add(capN);
  scene.add(grp);
  return { grp, kind:'battery', capP, capN };
}
function buildBulb(E){
  const grp=new THREE.Group();
  const socket=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.02,0.022,18),
    new THREE.MeshStandardMaterial({ color:0x6b7482, roughness:0.4, metalness:0.7 }));
  socket.position.y=0.011; socket.castShadow=true; grp.add(socket);
  const glass=new THREE.Mesh(new THREE.SphereGeometry(0.028,24,20), GLASS());
  glass.position.y=0.05; glass.renderOrder=4; grp.add(glass);
  // 필라멘트 W자
  const pts=[new THREE.Vector3(-0.011,0.038,0),new THREE.Vector3(-0.005,0.056,0),
    new THREE.Vector3(0,0.04,0),new THREE.Vector3(0.005,0.056,0),new THREE.Vector3(0.011,0.038,0)];
  const filaMat=new THREE.MeshStandardMaterial({ color:0x3a2a18, emissive:FILA_COLD.clone(), emissiveIntensity:0, roughness:0.5, metalness:0.3 });
  const fila=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,0.0012,6,false), filaMat);
  grp.add(fila);
  // 내부 글로우 스프라이트
  const glowTex=makeGlowTex();
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:0xFFE9B0, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }));
  glow.scale.set(0.001,0.001,1); glow.position.y=0.05; grp.add(glow);
  const light=new THREE.PointLight(0xFFE3A8, 0, 0.6, 2); light.position.y=0.05; grp.add(light);
  scene.add(grp);
  return { grp, kind:'bulb', filaMat, glow, light };
}
function buildSwitch(E){
  const grp=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.008,0.024),
    new THREE.MeshStandardMaterial({ color:0x2a323d, roughness:0.6, metalness:0.2 }));
  base.castShadow=true; grp.add(base);
  const p1=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.004,0.01,10), COPPER); p1.position.set(-0.02,0.008,0); grp.add(p1);
  const p2=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.004,0.01,10), COPPER); p2.position.set(0.02,0.008,0); grp.add(p2);
  const lever=new THREE.Mesh(new THREE.BoxGeometry(0.044,0.004,0.006), COPPER);
  const pivot=new THREE.Group(); pivot.position.set(-0.02,0.012,0);
  lever.position.x=0.02; pivot.add(lever); grp.add(pivot);
  scene.add(grp);
  return { grp, kind:'switch', pivot };
}
function buildRod(E, type){
  const grp=new THREE.Group();
  const mat = type==='rod_copper' ? COPPER.clone() : GLASS();
  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.11,16), mat);
  rod.rotation.z=Math.PI/2; rod.castShadow=true; if(type==='rod_glass') rod.renderOrder=4; grp.add(rod);
  scene.add(grp);
  return { grp, kind:type };
}
function makeGlowTex(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'); const rg=g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(255,240,200,1)'); rg.addColorStop(.4,'rgba(255,225,150,.6)'); rg.addColorStop(1,'rgba(255,220,140,0)');
  g.fillStyle=rg; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const DOT_TEX = makeGlowTex();

/* ═════════ 배치 상태 + solve 연동 ═════════ */
const placed = new Map();   // key → {E, item, edgeData:{id,type,a,b,open,flip}, dots}
let lastRes = { branches:[], brightness:{}, shorted:false, open:true };

function placedEdgesArr(){ return [...placed.values()].map(p=>p.edgeData); }

function rebuild(){
  const arr = placedEdgesArr();
  const res = K.solve(arr);
  lastRes = res;
  // 밝기·전류 반영
  placed.forEach(p=>{
    const br = res.branches.find(b=>b.id===p.edgeData.id);
    p.curr = br ? br.I : 0;
    if(p.item.kind==='bulb'){
      const B = res.brightness[p.edgeData.id] || 0;
      const t = Math.min(1, B/1.5);
      p.item.filaMat.emissive.copy(FILA_COLD).lerp(FILA_HOT, t);
      p.item.filaMat.emissiveIntensity = B<=0 ? 0 : (0.4 + 1.8*Math.min(1,B/2.5));
      p.item.filaMat.color.copy(B<=0 ? new THREE.Color(0x3a2a18) : new THREE.Color(0xFFECC0));
      p.item.light.intensity = 0.4 * B;
      const gs = B<=0 ? 0.001 : (0.05 + 0.05*Math.min(2.5,B));
      p.item.glow.scale.set(gs,gs,1);
      p.item.glow.material.opacity = Math.min(0.9, B*0.5);
    }
    // dots 표시 갱신
    if(p.dots) p.dots.visible = (FLOW==='dots' && Math.abs(p.curr)>K.OPEN_I);
  });
  // 단락 배너
  document.getElementById('shortBanner').classList.toggle('hide', !res.shorted);
  updateHud(res);
  if(typeof onRebuilt==='function') onRebuilt();   // P3: 미션 판정 + 밝기 렌즈
}

function updateHud(res){
  const nBulb = [...placed.values()].filter(p=>p.item.kind==='bulb').length;
  const lit = Object.values(res.brightness).filter(b=>b>0).length;
  let msg;
  if(placed.size===0) msg='전지·전구·전선을 골라 회로판 칸에 놓아 보세요.';
  else if(res.shorted) msg='⚠️ 전선만으로 전지를 이으면 위험해요 — 전구를 끼워요.';
  else if(nBulb===0) msg='전구를 놓아 불을 켜 봐요.';
  else if(lit>0) msg=`불이 켜진 전구 ${lit}개 · 회로가 이어졌어요!`;
  else msg='회로가 아직 안 이어졌어요. 한 바퀴 도는지 살펴봐요.';
  document.getElementById('hud').textContent = msg;
}

/* ═════════ 전류 dots(흐름 ∝ I) ═════════ */
function buildDots(p){
  const eh=edgeByKey(p.E.key);
  const n=Math.max(3, Math.round(eh.len/0.018));
  const grp=new THREE.Group();
  const arr=[];
  for(let i=0;i<n;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT_TEX, color:0x7fd4ff, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false }));
    s.scale.set(0.012,0.012,1); grp.add(s); arr.push(s);
  }
  grp.userData={ eh, arr, n, off:0 }; grp.visible=false; scene.add(grp);
  return grp;
}
function animateDots(dt){
  if(FLOW!=='dots') return;
  placed.forEach(p=>{
    if(!p.dots || !p.dots.visible) return;
    const u=p.dots.userData; const I=p.curr||0;
    u.off = (u.off + I*0.35*dt/Math.max(u.eh.len,1e-3)); u.off -= Math.floor(u.off);
    const pa=nodePos(p.E.a).clone(), pb=nodePos(p.E.b).clone(); pa.y=NODE_Y+0.02; pb.y=NODE_Y+0.02;
    for(let i=0;i<u.n;i++){
      let t=((i/u.n)+u.off)%1; if(t<0)t+=1;
      u.arr[i].position.lerpVectors(pa,pb,t);
    }
  });
}

/* ═════════ 소자 배치/조작 ═════════ */
function makeItem(type, E){
  if(type==='wire') return buildWire(E);
  if(type==='battery'){ const it=buildBattery(E); orientToEdge(it.grp,E); return it; }
  if(type==='bulb'){ const it=buildBulb(E); orientToEdge(it.grp,E); return it; }
  if(type==='switch'){ const it=buildSwitch(E); orientToEdge(it.grp,E); return it; }
  if(type==='rod_copper'||type==='rod_glass'){ const it=buildRod(E,type); orientToEdge(it.grp,E); return it; }
}
function placeAt(E, type){
  if(placed.has(E.key)) return;
  const item=makeItem(type,E);
  const edgeData={ id:E.key, type, a:E.a, b:E.b };
  if(type==='switch') edgeData.open=false;
  const rec={ E, item, edgeData, curr:0, dots:null };
  if(type!=='wire' || FLOW==='dots'){ rec.dots=buildDots(rec); }
  placed.set(E.key, rec);
  rebuild();
}
function removeAt(key){
  const rec=placed.get(key); if(!rec) return;
  scene.remove(rec.item.grp); if(rec.dots) scene.remove(rec.dots);
  placed.delete(key); rebuild();
}
function tapPlaced(rec){
  const t=rec.edgeData.type;
  if(t==='battery'){ rec.edgeData.flip=!rec.edgeData.flip; rec.item.grp.rotation.y += Math.PI; rebuild(); }
  else if(t==='switch'){ rec.edgeData.open=!rec.edgeData.open;
    rec.item.pivot.rotation.z = rec.edgeData.open ? 0.7 : 0; rebuild(); }
  else { removeAt(rec.E.key); }
}

/* ═════════ 트레이(P2 자유 팔레트) ═════════ */
const TRAY = [
  { type:'battery', ic:'🔋', label:'전지' },
  { type:'bulb', ic:'💡', label:'전구' },
  { type:'wire', ic:'➖', label:'전선' },
  { type:'switch', ic:'🎚️', label:'스위치' },
  { type:'rod_copper', ic:'🟤', label:'구리막대' },
  { type:'rod_glass', ic:'⬜', label:'유리막대' }
];
let sel = null;
function buildTray(){
  const tray=document.getElementById('tray'); tray.innerHTML='';
  const list = GRADE==='low' ? TRAY.filter(t=>['battery','bulb','wire'].includes(t.type)) : TRAY;
  list.forEach(t=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="ic">${t.ic}</span>${t.label}`;
    b.onclick=()=>{ sel = (sel===t.type ? null : t.type);
      [...tray.children].forEach(c=>c.classList.remove('on'));
      if(sel===t.type) b.classList.add('on'); };
    tray.appendChild(b);
  });
  const r=document.createElement('button'); r.className='reset'; r.innerHTML='<span class="ic">↺</span>비우기';
  r.onclick=()=>{ [...placed.keys()].forEach(removeAt); sel=null; [...tray.children].forEach(c=>c.classList.remove('on')); };
  tray.appendChild(r);
}

/* ═════════ 입력(탭=배치/조작 · 드래그=궤도 · 길게=회수) ═════════ */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let downXY=null, downT=0, longTimer=null;
function pick(clientX, clientY, targets){
  ptr.x=(clientX/innerWidth)*2-1; ptr.y=-(clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(targets, true);
}
function onDown(e){
  downXY={ x:e.clientX, y:e.clientY }; downT=performance.now();
  // 길게 = 회수
  const hit=pick(e.clientX,e.clientY, edgeHit.map(x=>x.hit));
  if(hit.length){
    const key=hit[0].object.userData.edge.key;
    if(placed.has(key)){ longTimer=setTimeout(()=>{ removeAt(key); longTimer=null; downXY=null; }, 500); }
  }
}
function onUp(e){
  if(longTimer){ clearTimeout(longTimer); longTimer=null; }
  if(!downXY) return;
  const moved=Math.hypot(e.clientX-downXY.x, e.clientY-downXY.y);
  downXY=null;
  if(moved>6) return;  // 드래그=궤도
  const hit=pick(e.clientX,e.clientY, edgeHit.map(x=>x.hit));
  if(!hit.length) return;
  const E=hit[0].object.userData.edge;
  if(placed.has(E.key)){ tapPlaced(placed.get(E.key)); }
  else if(sel){ placeAt(E, sel); }
}
function onCancel(){ if(longTimer){ clearTimeout(longTimer); longTimer=null; } downXY=null; }  // R3
renderer.domElement.addEventListener('pointerdown', onDown);
renderer.domElement.addEventListener('pointerup', onUp);
renderer.domElement.addEventListener('pointercancel', onCancel);

addEventListener('resize', ()=>{   // R7
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ═════════ 루프 ═════════ */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;   // R2 클램프
  controls.update();
  animateDots(dt);
  // pulse 티어: 전구 글로우 미세 파동
  if(FLOW==='pulse'){
    const ph=0.5+0.5*Math.sin(now*0.005);
    placed.forEach(p=>{ if(p.item.kind==='bulb' && Math.abs(p.curr)>K.OPEN_I){
      p.item.glow.material.opacity = Math.min(0.9,(0.4+0.4*ph)); } });
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ═════════ P3 미션 UI + ★와우 병렬 예측 + 밝기막대 렌즈 ═════════ */
// 학년칸(§4): 저=C-1만 / 중=C-1~C-3 / 고=전체+자유 단락
const GRADE_MISSIONS = {
  low:  ['c1_light'],
  mid:  ['c1_light','c2_bright','c3_parallel'],
  high: ['c1_light','c2_bright','c3_parallel','c4_conductor']
};
const MDEF = {}; K.MISSIONS.forEach(m=>{ MDEF[m.id]=m; });
// C-3 ★와우 예측 카드(SPEC §4)
const C3_PREDICT = {
  q:'전구 하나를 빼면 나머지 전구는 어떻게 될까요?',
  opts:['같이 꺼진다','그대로 켜져 있다'], answer:1,
  explain:'그대로 켜져 있어요 — 오히려 아주 살짝 더 밝아져요(밝기 0.95 → 1.00). 두 전구가 각자 전지로 가는 길을 따로 가지기(병렬) 때문이에요. 우리 집 전등이 병렬로 이어진 이유예요 — 하나가 나가도 나머지는 계속 켜지니까요. (전선만으로 이으면 위험한 건 그대로예요 · 콘센트에는 절대 하지 않기)'
};
let activeMission=null, missionCleared=false, predictAnswered=false, mBusy=false;   // R6 재진입 가드

function buildMissionUI(){
  const wrap=document.createElement('div'); wrap.id='mwrap'; document.body.appendChild(wrap);
  wrap.innerHTML=`
    <button id="lensBtn">📊 밝기</button>
    <button id="mBtn">🎯 미션</button>
    <div id="mBanner" class="hide"><span id="mbIcon"></span><div><div id="mbTitle"></div><div id="mbHint"></div></div><button id="mbClose">✕</button></div>
    <div id="mHome" class="hide"><div class="mcard"><h2>⚡ 전기 미션</h2><div id="mList"></div><button id="mFree">자유 실험</button></div></div>
    <div id="mPredict" class="hide"><div class="mcard"><div id="mpQ"></div><div id="mpOpts"></div><div id="mpExplain" class="hide"></div><button id="mpGo" class="hide">계속 실험하기</button></div></div>
    <div id="mClear" class="hide"><div class="mcard"><div class="mcIcon">🎉</div><div id="mcMsg">미션 성공!</div><button id="mcNext">다른 미션</button><button id="mcStay">계속 실험</button></div></div>
    <div id="brightLens" class="hide"><h3>💡 전구 밝기</h3><div id="blBody"></div></div>`;
  document.getElementById('mBtn').onclick=openHome;
  document.getElementById('mbClose').onclick=()=>setMission(null);
  document.getElementById('mFree').onclick=()=>{ setMission(null); closeAll(); };
  document.getElementById('mpGo').onclick=()=>document.getElementById('mPredict').classList.add('hide');
  document.getElementById('mcNext').onclick=openHome;
  document.getElementById('mcStay').onclick=closeAll;
  const lb=document.getElementById('lensBtn');
  lb.classList.toggle('on', LENS_ON0);
  document.getElementById('brightLens').classList.toggle('hide', !LENS_ON0);
  lb.onclick=()=>{ const on=!lb.classList.contains('on'); lb.classList.toggle('on',on);
    document.getElementById('brightLens').classList.toggle('hide',!on); if(on) renderLens(lastRes); };
  renderList();
}
function renderList(){
  const list=document.getElementById('mList'); list.innerHTML='';
  GRADE_MISSIONS[GRADE].forEach(id=>{
    const m=MDEF[id]; if(!m) return;
    const b=document.createElement('button'); b.className='mItem';
    b.innerHTML=`<span class="mi">${m.icon}</span><span><b>${m.title}</b><br><small>${m.brief}</small></span>`;
    b.onclick=()=>{ setMission(id); closeAll(); }; list.appendChild(b);
  });
}
function openHome(){ closeAll(); document.getElementById('mHome').classList.remove('hide'); }
function closeAll(){ ['mHome','mPredict','mClear'].forEach(i=>document.getElementById(i).classList.add('hide')); }
function setMission(id){
  activeMission=id; missionCleared=false; predictAnswered=false;
  // 미션 시작 = 회로판 비우기(직전 미션 잔여 소자 제거 · 판정 오염 방지)
  [...placed.keys()].forEach(removeAt);
  const bn=document.getElementById('mBanner');
  if(id && MDEF[id]){ const m=MDEF[id];
    document.getElementById('mbIcon').textContent=m.icon;
    document.getElementById('mbTitle').textContent=m.title;
    document.getElementById('mbHint').textContent=m.hint;
    bn.classList.remove('hide');
  } else bn.classList.add('hide');
  rebuild();
}
function showPredict(){
  const box=document.getElementById('mPredict'); box.classList.remove('hide');
  document.getElementById('mpQ').textContent=C3_PREDICT.q;
  const opts=document.getElementById('mpOpts'); opts.innerHTML='';
  const ex=document.getElementById('mpExplain'), go=document.getElementById('mpGo');
  ex.classList.add('hide'); go.classList.add('hide');
  C3_PREDICT.opts.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='mpOpt'; b.textContent=o;
    b.onclick=()=>{
      predictAnswered=true;
      opts.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.classList.add(i===C3_PREDICT.answer?'right':'wrong');
      if(i!==C3_PREDICT.answer) opts.children[C3_PREDICT.answer].classList.add('right');
      ex.textContent=C3_PREDICT.explain; ex.classList.remove('hide'); go.classList.remove('hide');
    };
    opts.appendChild(b);
  });
}
function showCleared(){
  const m=MDEF[activeMission]; if(!m) return;
  document.getElementById('mcMsg').textContent=`${m.icon} ${m.title} — 성공!`;
  document.getElementById('mClear').classList.remove('hide');
}
// rebuild 끝 훅: 미션 진행 판정 + C-3 ★와우 예측
function onRebuilt(){
  renderLens(lastRes);
  if(!activeMission || missionCleared || mBusy) return;
  mBusy=true;
  try{
    const r=K.evalMission(MDEF[activeMission], placedEdgesArr());
    if(r.done){
      // C-3 병렬 완성 = 예측 카드 먼저(★와우), 답하면 성공
      if(activeMission==='c3_parallel' && !predictAnswered){ showPredict(); }
      else { missionCleared=true; showCleared(); }
    }
  } finally { mBusy=false; }
}
// 밝기막대 렌즈(상태 비교 · 정직한 선택 — 시계열 그래프 아님)
function renderLens(res){
  const panel=document.getElementById('brightLens'); if(!panel || panel.classList.contains('hide')) return;
  const body=document.getElementById('blBody'); if(!body) return;
  const bulbs=[...placed.values()].filter(p=>p.item.kind==='bulb');
  if(!bulbs.length){ body.innerHTML='<div class="blEmpty">전구를 놓으면 밝기가 나와요.</div>'; return; }
  let n=0, html='';
  bulbs.forEach(p=>{ n++;
    const B=(res.brightness && res.brightness[p.edgeData.id]) || 0;
    const pct=Math.min(100, (B/2.5)*100);
    html+=`<div class="blRow"><span class="blName">💡${n}</span><span class="blTrack"><span class="blFill" style="width:${pct.toFixed(0)}%"></span></span><span class="blVal">${B.toFixed(2)}</span></div>`;
  });
  body.innerHTML=html;
}


function init(){
  buildTray();
  buildMissionUI();
  rebuild();
  document.getElementById('loading').classList.add('hide');
  requestAnimationFrame(frame);
}
init();
</script>

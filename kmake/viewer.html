<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Gowun Dodum',sans-serif;background:#101423;overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
#stageWrap{position:relative}
#stage{position:relative;transform-origin:top left;border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.5);background:#fff}
#stage canvas{position:absolute;left:0;top:0;width:100%!important;height:100%!important}
#mbgCv{z-index:1} #fabCv{z-index:2} #fxCv{z-index:3;pointer-events:none} #ovCv{z-index:4;pointer-events:none;transition:opacity .6s ease,transform .6s ease}
#ovCv.out-fade{opacity:0}
#ovCv.out-slideL{transform:translateX(-104%)}
#ovCv.out-zoom{opacity:0;transform:scale(1.18)}
#badge{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:rgba(255,255,255,.94);color:#3B4258;border-radius:50px;padding:9px 18px;font-size:12.5px;font-weight:700;text-decoration:none;box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;gap:6px;align-items:center;backdrop-filter:blur(6px)}
#badge b{color:#5B8EF8}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#E7EAF4;z-index:60;background:#101423;text-align:center;padding:24px}
#msg .t{font-size:19px;font-weight:800} #msg .s{font-size:13.5px;color:#9AA3BC;line-height:1.7}
#msg a{color:#8FB3FF}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#8FB3FF;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>

<body>
<div id="stageWrap"><div id="stage">
  <canvas id="mbgCv"></canvas>
  <canvas id="fabCv"></canvas>
  <canvas id="fxCv"></canvas>
  <canvas id="ovCv"></canvas>
</div></div>
<div id="msg"><div class="spin"></div><div class="t">카드 여는 중…</div></div>
<a id="badge" class="hidden" href="https://keduclass.com/kmake/" target="_blank">✨ <span><b>케이메이커</b>로 만들었어요</span></a>

<script>var canvas=null, baseW=720, baseH=1280;</script>
<script src="motion.js?v=20260704b"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function fail(t, s) {
    $('msg').innerHTML = '<div class="t">' + t + '</div><div class="s">' + s +
      '<br><br><a href="https://keduclass.com/kmake/">나도 카드 만들러 가기 →</a></div>';
    $('msg').classList.remove('hidden');
  }

  /* ---------- 문서 파싱 (v4 + 레거시) ---------- */
  var doc = null;
  try {
    var h = location.hash.match(/#c=(.+)/);
    if (!h) throw 0;
    doc = JSON.parse(LZString.decompressFromEncodedURIComponent(h[1]));
  } catch (e) {
    fail('카드를 찾을 수 없어요', '링크가 잘렸거나 만료됐을 수 있어요.<br>보낸 분께 다시 요청해 보세요.');
    return;
  }
  var scenes = (doc.scenes && doc.scenes.length)
    ? doc.scenes.map(function (s) { return { canvas: s.canvas, motionBg: s.motionBg || null, dur: Math.max(0.5, Math.min(30, +s.dur || 3.5)), transition: s.transition || 'fade' }; })
    : [{ canvas: doc.canvas, motionBg: doc.motionBg || null, dur: 4, transition: 'fade' }];
  baseW = doc.baseW || 720; baseH = doc.baseH || 1280;

  /* ---------- 스테이지 ---------- */
  var stage = $('stage');
  stage.style.width = baseW + 'px'; stage.style.height = baseH + 'px';
  ['mbgCv', 'fxCv', 'ovCv'].forEach(function (id) { $(id).width = baseW; $(id).height = baseH; });
  function fit() {
    var k = Math.min(innerWidth / baseW, (innerHeight - 20) / baseH) * 0.96;
    stage.style.transform = 'scale(' + k + ')';
    $('stageWrap').style.width = baseW * k + 'px';
    $('stageWrap').style.height = baseH * k + 'px';
  }
  addEventListener('resize', fit); fit();

  canvas = new fabric.StaticCanvas('fabCv', { width: baseW, height: baseH, renderOnAddRemove: false });
  var mbgCtx = $('mbgCv').getContext('2d');
  var ovCtx = $('ovCv').getContext('2d');
  KM_MOTION.fxOverride($('fxCv'));

  /* ---------- 폰트 선로딩 ---------- */
  function collectFonts() {
    var set = new Set();
    scenes.forEach(function (sc) { (sc.canvas && sc.canvas.objects || []).forEach(function walk(o) {
      if (o.fontFamily) set.add(o.fontFamily);
      (o.objects || []).forEach(walk);
    }); });
    return Array.from(set);
  }
  function preloadFonts() {
    var jobs = collectFonts().map(function (f) { return document.fonts.load('400 24px "' + f + '"').catch(function () {}); });
    return Promise.race([Promise.allSettled(jobs), new Promise(function (r) { setTimeout(r, 3500); })]);
  }

  /* ---------- 씬 재생 ---------- */
  var raf = 0, skip = false, prevTrans = null;
  function loadScene(sc) {
    return new Promise(function (res) { canvas.loadFromJSON(sc.canvas, function () { canvas.renderAll(); res(); }); });
  }
  function snapshotOverlay(mbgOn) {
    ovCtx.clearRect(0, 0, baseW, baseH);
    ovCtx.fillStyle = '#fff'; ovCtx.fillRect(0, 0, baseW, baseH);
    if (mbgOn) ovCtx.drawImage($('mbgCv'), 0, 0);
    ovCtx.drawImage(canvas.lowerCanvasEl, 0, 0, baseW, baseH);
    ovCtx.drawImage($('fxCv'), 0, 0);
    var ov = $('ovCv');
    ov.className = ''; ov.style.opacity = 1;
  }
  function overlayOut(kind) {
    var ov = $('ovCv');
    if (!prevTrans) { ov.style.opacity = 0; return; }
    if (kind === 'none') { ov.style.transition = 'none'; ov.style.opacity = 0; requestAnimationFrame(function () { ov.style.transition = ''; }); return; }
    requestAnimationFrame(function () { ov.classList.add('out-' + (kind === 'slideL' || kind === 'zoom' ? kind : 'fade')); });
  }
  function playScene(i) {
    var sc = scenes[i];
    return loadScene(sc).then(function () {
      var mbg = KM_MOTION.offlineMbg(sc.motionBg, baseW, baseH);
      mbgCtx.clearRect(0, 0, baseW, baseH);
      if (mbg) { mbgCtx.fillStyle = mbg.base || '#fff'; mbgCtx.fillRect(0, 0, baseW, baseH); }
      KM_MOTION.offlineBegin();
      overlayOut(prevTrans);
      skip = false;
      var t0 = performance.now(), lastT = 0;
      return new Promise(function (res) {
        (function frame() {
          var t = (performance.now() - t0) / 1000;
          if (mbg) { mbg.frame(mbgCtx, t, Math.min(0.05, t - lastT)); }
          lastT = t;
          KM_MOTION.offlineFrame(t);
          if (t >= sc.dur || skip) {
            snapshotOverlay(!!mbg);
            prevTrans = sc.transition;
            KM_MOTION.offlineEnd();
            res();
          } else raf = requestAnimationFrame(frame);
        })();
      });
    });
  }
  function run() {
    var p = Promise.resolve(), n = scenes.length;
    for (var i = 0; i < n; i++) (function (i) { p = p.then(function () { return playScene(i); }); })(i);
    p.then(function () { setTimeout(run, 500); }); // 카드 무한 반복
  }
  addEventListener('pointerdown', function () { skip = true; });

  preloadFonts().then(function () {
    $('msg').classList.add('hidden');
    $('badge').classList.remove('hidden');
    run();
  });
})();
</script>
</body>

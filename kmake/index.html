<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이메이커 | K-edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&family=Hahmlet:wght@400;700&family=Gamja+Flower&family=Bagel+Fat+One&family=Dongle:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Song+Myung&family=Diphylleia&family=Hi+Melody&family=Poor+Story&family=East+Sea+Dokdo&family=Nanum+Brush+Script&family=Yeon+Sung&family=Cute+Font&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  --blue:#5B8EF8; --blue-d:#4A7DE8; --blue-l:#EEF4FE; --blue-ll:#F6F9FF;
  --ink:#2D3748; --ink-2:#4A5568; --gray:#718096; --gray-l:#A0AEC0;
  --line:#E5E8EE; --line-2:#EDEFF3; --bg:#F4F5F8; --stage:#E9EBF0;
  --slot:#F59E0B; --slot-l:#FEF6E3; --slot-d:#B45309;
  --guide:#EC4899; --danger:#E53E3E; --white:#fff;
  --sh-sm:0 1px 2px rgba(16,24,40,.05);
  --sh:0 4px 16px rgba(16,24,40,.09);
  --sh-lg:0 12px 40px rgba(16,24,40,.16);
  --sh-pop:0 6px 28px rgba(16,24,40,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Gowun Dodum','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CBD2DC;border-radius:10px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#AEB7C4;background-clip:content-box}

/* ============ 시작 화면 ============ */
#start{position:fixed;inset:0;z-index:100;overflow-y:auto;
  background:radial-gradient(1200px 600px at 50% -10%, #E8F0FE 0%, transparent 60%), linear-gradient(180deg,#FBFCFE 0%,#F4F5F8 100%)}
.start-inner{max-width:840px;margin:0 auto;padding:56px 24px 80px;text-align:center;position:relative}
.start-back{position:absolute;top:24px;left:24px;color:var(--gray);text-decoration:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:9px;transition:.15s;background:rgba(255,255,255,.6)}
.start-back:hover{background:#fff;color:var(--ink);box-shadow:var(--sh-sm)}
.start-badge{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:50px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--blue);box-shadow:var(--sh-sm);margin-bottom:22px}
.start-badge .dot{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px #DCFCE7}
.start-logo{font-family:'Jua',sans-serif;font-size:54px;line-height:1.05;color:var(--ink);letter-spacing:-1px}
.start-logo b{color:var(--blue)}
.start-sub{font-size:16px;color:var(--gray);margin-top:14px;font-weight:500;line-height:1.6}
.start-tabs{display:inline-flex;gap:4px;margin:36px 0 28px;background:var(--white);padding:5px;border-radius:50px;box-shadow:var(--sh);border:1px solid var(--line-2)}
.start-tab{border:none;background:none;padding:11px 30px;border-radius:50px;font-size:15px;font-weight:700;color:var(--gray);transition:all .18s cubic-bezier(.4,0,.2,1)}
.start-tab.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(91,142,248,.35)}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.sec-title{text-align:left;font-size:14px;font-weight:700;color:var(--ink);margin:30px 0 14px;display:flex;align-items:baseline;gap:10px}
.sec-title span{font-size:12px;font-weight:500;color:var(--gray-l)}
.tpl-wrap{margin-top:8px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.tpl-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .2s cubic-bezier(.34,1.4,.5,1),box-shadow .2s,border-color .2s;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.tpl-card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg);border-color:#CBD9F8}
.tpl-thumb{width:100%;aspect-ratio:16/10;border-radius:9px;overflow:hidden;box-shadow:0 4px 14px rgba(16,24,40,.12);background:#F1F3F7;display:flex;align-items:center;justify-content:center}
.tpl-thumb svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.tpl-name{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:12px;text-align:left}
.tpl-badge{position:absolute;top:12px;right:12px;background:rgba(91,142,248,.95);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:50px;box-shadow:0 2px 8px rgba(91,142,248,.4)}
.preset-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;transition:transform .2s cubic-bezier(.34,1.4,.5,1),box-shadow .2s,border-color .2s;box-shadow:var(--sh-sm)}
.preset-card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg);border-color:#CBD9F8}
.preset-thumb{height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.preset-thumb svg{max-width:100%;max-height:100%;filter:drop-shadow(0 6px 14px rgba(16,24,40,.14))}
.preset-name{font-size:14.5px;font-weight:700;color:var(--ink)}
.preset-dim{font-size:11.5px;color:var(--gray-l);margin-top:4px;font-weight:500}
.preset-custom{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed #C3CCDA;background:var(--blue-ll)}
.preset-custom .ico{font-size:26px;margin-bottom:8px}
.preset-custom .row{display:flex;align-items:center;gap:6px;margin:6px 0 10px}
.preset-custom input{width:56px;padding:7px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:13px;outline:none;background:#fff}
.preset-custom input:focus{border-color:var(--blue)}

/* ============ 에디터 셸 ============ */
#editor{display:flex;flex-direction:column;height:100%}

/* 메인 바 */
.topbar{height:56px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:40;box-shadow:var(--sh-sm)}
.topbar .logo{font-family:'Jua';letter-spacing:1px;font-size:23px;color:var(--blue);user-select:none}
.topbar .home{border:none;background:none;color:var(--gray);text-decoration:none;font-size:13px;font-weight:600;padding:7px 11px;border-radius:8px;transition:.15s;cursor:pointer}
.topbar .home:hover{background:var(--bg);color:var(--ink)}
.vr{width:1px;height:24px;background:var(--line)}
.mode-toggle{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:3px}
.mode-toggle button{border:none;background:none;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:700;color:var(--gray);transition:.15s;display:flex;align-items:center;gap:6px}
.mode-toggle button:hover{color:var(--ink)}
.mode-toggle button.on{background:var(--white);color:var(--blue);box-shadow:var(--sh-sm)}
.mode-toggle button.on[data-mode=fill]{color:var(--slot-d)}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border:none;background:none;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--gray);transition:.14s}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:19px;height:19px}
.tb-btn{height:38px;padding:0 15px;border:1px solid var(--line);background:var(--white);border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:.14s}
.tb-btn:hover{border-color:#C3CCDA;background:#FAFBFD}
.tb-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 8px rgba(91,142,248,.3)}
.tb-btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.tb-btn svg{width:16px;height:16px}

/* 컨텍스트 바 (선택 시) */
.ctxbar{height:52px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;z-index:30;overflow-x:auto;box-shadow:var(--sh-sm)}
.ctxbar.empty{display:none}
.ctx-group{display:flex;align-items:center;gap:6px}
.ctx-sep{width:1px;height:22px;background:var(--line);flex-shrink:0;margin:0 3px}
.ctx-btn{height:34px;min-width:34px;padding:0 9px;border:1px solid transparent;background:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.13s;flex-shrink:0}
.ctx-btn:hover{background:var(--bg)}
.ctx-btn.on{background:var(--blue-l);color:var(--blue)}
.ctx-btn svg{width:17px;height:17px}
.ctx-btn.del:hover{background:#FEF2F2;color:var(--danger)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:34px;overflow:hidden;flex-shrink:0}
.stepper button{width:30px;height:100%;border:none;background:var(--white);color:var(--gray);font-size:16px;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--bg);color:var(--ink)}
.stepper input{width:42px;height:100%;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:13px;font-weight:600;outline:none;color:var(--ink)}

/* 폰트 드롭다운 */
.font-dd{position:relative;flex-shrink:0}
.font-dd>button{height:34px;min-width:132px;padding:0 12px;border:1px solid var(--line);background:var(--white);border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.13s}
.font-dd>button:hover{border-color:#C3CCDA}
.font-dd>button svg{width:14px;height:14px;color:var(--gray);flex-shrink:0}
.font-list{position:absolute;top:40px;left:0;width:218px;max-height:340px;overflow-y:auto;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-pop);padding:6px;z-index:60}
.font-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;border:none;background:none;border-radius:8px;font-size:18px;color:var(--ink);transition:.1s;text-align:left}
.font-item:hover{background:var(--blue-ll)}
.font-item .fname{font-size:11px;color:var(--gray-l);font-family:'Gowun Dodum';font-weight:500}
.font-item.sel{background:var(--blue-l)}
.font-div{font-size:10.5px;font-weight:800;color:var(--gray-l);letter-spacing:1px;padding:10px 12px 4px;font-family:'Gowun Dodum'}
.font-div:not(:first-child){border-top:1px solid var(--line);margin-top:4px}

/* 색 스와치 버튼 + 팝오버 */
.color-btn{position:relative;flex-shrink:0}
.color-btn>button{height:34px;padding:0 8px;border:1px solid var(--line);background:var(--white);border-radius:8px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2);transition:.13s}
.color-btn>button:hover{border-color:#C3CCDA}
.color-btn .chip{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.color-pop{position:absolute;top:40px;left:0;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-pop);padding:14px;z-index:60;width:206px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatches button{width:24px;height:24px;border-radius:7px;border:1px solid rgba(0,0,0,.1);transition:transform .1s,box-shadow .1s}
.swatches button:hover{transform:scale(1.14)}
.swatches button.sel{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--blue)}
.color-custom{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line-2)}
.color-custom input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#fff;cursor:pointer}
.color-custom span{font-size:12px;color:var(--gray);font-weight:600}

/* 워크스페이스 */
.workspace{flex:1;display:flex;min-height:0;position:relative}

/* 좌측 도구 */
.tools{width:78px;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;flex-shrink:0;z-index:20}
.tool{width:60px;height:58px;border:none;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--gray);font-size:10.5px;font-weight:600;transition:.14s}
.tool:hover{background:var(--blue-ll);color:var(--blue)}
.tool:active{transform:scale(.94)}
.tool svg{width:23px;height:23px;stroke-width:1.8}
.tool-sep{width:40px;height:1px;background:var(--line-2);margin:5px 0}
.tools.locked{opacity:.4;pointer-events:none}
/* 아이콘 패널 */
.icon-panel{position:absolute;left:78px;top:0;bottom:0;width:340px;background:var(--white);border-right:1px solid var(--line);z-index:25;display:flex;flex-direction:column;box-shadow:8px 0 24px rgba(16,24,40,.06)}
.ip-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.ip-title{font-family:'Jua';letter-spacing:1px;font-size:19px;color:var(--ink)}
.ip-close{border:none;background:none;font-size:18px;color:var(--gray);width:32px;height:32px;border-radius:8px}
.ip-close:hover{background:var(--bg);color:var(--ink)}
.ip-search{padding:0 18px 12px}
.ip-modes{display:flex;flex-wrap:wrap;gap:5px;padding:0 18px 12px}
.ip-mode{flex:1 1 calc(50% - 3px);border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--gray);transition:.13s;white-space:nowrap}
.ip-grid.illust{grid-template-columns:repeat(2,1fr)}
.ip-grid.illust .ip-item{aspect-ratio:4/3;padding:8px}
.ip-grid.photo{grid-template-columns:repeat(3,1fr)}
.ip-grid.photo .ip-item{aspect-ratio:1;padding:6px;background:repeating-conic-gradient(#F1F3F7 0 25%,#fff 0 50%) 0 0/16px 16px}
.ip-grid.bg-grid{grid-template-columns:repeat(2,1fr)}
.ip-grid.bg-grid .ip-item{aspect-ratio:3/2;padding:0;overflow:hidden}
.ip-grid.bg-grid .ip-item svg{width:100%;height:100%;border-radius:9px}
.ip-item.bg-none{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--gray);background:repeating-linear-gradient(45deg,#fff,#fff 8px,#F1F3F7 8px,#F1F3F7 16px)}
.ip-mode:hover{border-color:var(--blue);color:var(--blue)}
.ip-mode.on{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.ip-search input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;outline:none;background:var(--bg)}
.ip-search input:focus{border-color:var(--blue);background:#fff}
.ip-cats{display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px;flex-shrink:0;scrollbar-width:thin}
.ip-cats::-webkit-scrollbar{height:0}
.ip-cat{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:50px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--gray);white-space:nowrap;transition:.13s}
.ip-cat:hover{border-color:var(--blue);color:var(--blue)}
.ip-cat.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ip-grid{flex:1;overflow-y:auto;padding:6px 18px 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;align-content:start}
.ip-item{aspect-ratio:1;border:1px solid var(--line-2);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.12s;padding:11px}
.ip-item:hover{border-color:var(--blue);background:var(--blue-ll);color:var(--blue);transform:translateY(-2px)}
.ip-item svg{width:100%;height:100%}
.ip-empty{grid-column:1/-1;text-align:center;color:var(--gray-l);font-size:13px;padding:40px 0}
.ip-credit{flex-shrink:0;padding:9px 18px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--gray-l);line-height:1.4;background:#FBFCFE}

/* 캔버스 무대 */
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:var(--stage);
  background-image:radial-gradient(circle, #D8DCE4 1px, transparent 1px);background-size:22px 22px;
  padding:40px;position:relative}
.canvas-stage{box-shadow:var(--sh-lg);background:#fff;border-radius:2px}
.mode-banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:var(--slot);color:#fff;padding:9px 20px;border-radius:50px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(245,158,11,.4);display:flex;align-items:center;gap:8px;z-index:10}
.zoombar{position:absolute;bottom:20px;right:24px;background:var(--white);border-radius:50px;box-shadow:var(--sh);display:flex;align-items:center;padding:5px;gap:2px;border:1px solid var(--line-2);z-index:10}
/* 🎬 씬 스트립 (scene.js) */
.scene-strip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--sh-lg);max-width:min(92%,720px);z-index:5}
.sc-thumbs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;max-width:480px}
.sc-item{position:relative;flex-shrink:0;width:64px;height:48px;border:2px solid var(--line);border-radius:9px;background:#fff;padding:0;overflow:hidden;transition:.12s}
.sc-item img{width:100%;height:100%;object-fit:cover;display:block}
.sc-item .sc-blank{display:block;width:100%;height:100%;background:repeating-conic-gradient(#F1F3F7 0 25%,#fff 0 50%) 0 0/12px 12px}
.sc-item:hover{border-color:var(--blue)}
.sc-item.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-l)}
.sc-num{position:absolute;left:3px;bottom:2px;font-size:10px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);border-radius:5px;padding:0 4px;line-height:14px}
.sc-x{position:absolute;right:2px;top:2px;font-size:9px;line-height:14px;width:14px;text-align:center;color:#fff;background:rgba(0,0,0,.45);border-radius:5px;cursor:pointer;opacity:0;transition:.12s}
.sc-item:hover .sc-x{opacity:1}
.sc-x:hover{background:var(--red,#DC2626)}
.sc-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sc-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--gray);white-space:nowrap;transition:.12s}
.sc-btn:hover{border-color:var(--blue);color:var(--blue)}
.sc-meta{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--gray);white-space:nowrap}
.sc-meta input{width:44px;border:1px solid var(--line);border-radius:7px;padding:4px 5px;font-size:12px;text-align:center}
.sc-meta select{border:1px solid var(--line);border-radius:7px;padding:4px 5px;font-size:11.5px;background:#fff}
@media (max-width:640px){.scene-strip{bottom:8px;max-width:96%}.sc-thumbs{max-width:60vw}.sc-meta{display:none}}
/* 🎬 영상 진행 오버레이 (video.js) */
.vid-progress{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(20,24,34,.45);backdrop-filter:blur(3px)}
.vp-card{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);padding:22px 26px;min-width:300px;max-width:86%}
.vp-title{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:14px}
.vp-bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.vp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#8B5CF6);border-radius:6px;transition:width .15s}
.vp-row{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:700;color:var(--gray)}
.vp-hint{margin-top:12px;font-size:11.5px;color:var(--gray-l)}
.zoombar button{width:32px;height:32px;border:none;background:none;border-radius:50%;font-size:18px;color:var(--gray);display:flex;align-items:center;justify-content:center;transition:.12s}
.zoombar button:hover{background:var(--bg);color:var(--ink)}
.zoombar .zlabel{font-size:12.5px;color:var(--ink-2);min-width:46px;text-align:center;font-weight:700}

/* 우측 패널 */
.panel{width:258px;background:var(--white);border-left:1px solid var(--line);overflow-y:auto;flex-shrink:0;z-index:20}
.panel-sec{padding:18px;border-bottom:1px solid var(--line-2)}
.panel-sec h3{font-size:11px;font-weight:700;color:var(--gray-l);letter-spacing:.6px;text-transform:uppercase;margin-bottom:13px;display:flex;align-items:center;gap:6px}
.p-empty{padding:48px 22px;text-align:center;color:var(--gray-l)}
.p-empty .big{font-size:34px;margin-bottom:14px;opacity:.7}
.p-empty p{font-size:13px;line-height:1.7}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--gray);font-weight:600;margin-bottom:7px}
.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;resize:vertical;min-height:60px;transition:.13s;color:var(--ink)}
.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.align-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.align-grid button{height:38px;border:1px solid var(--line);background:var(--white);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--gray);transition:.13s}
.align-grid button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-ll)}
.align-grid button svg{width:18px;height:18px}
.layer-row,.act-row{display:flex;gap:7px}
.layer-row button,.act-row button{flex:1;height:40px;border:1px solid var(--line);background:var(--white);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--gray);font-weight:600;transition:.13s}
.layer-row button:hover,.act-row button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-ll)}
.act-row button.del:hover{border-color:var(--danger);color:var(--danger);background:#FEF2F2}
.layer-row svg,.act-row svg{width:17px;height:17px}
.range-row{display:flex;align-items:center;gap:11px}
.range-row input[type=range]{flex:1;accent-color:var(--blue)}
.range-row .val{font-size:12px;color:var(--ink-2);font-weight:700;min-width:38px;text-align:right}
/* 📸 사진 패널 (photo.js) */
.pm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pm-chip{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px 6px;color:var(--gray);transition:.12s}
.pm-chip svg{width:26px;height:26px;fill:currentColor;opacity:.85}
.pm-chip span{font-size:10.5px;font-weight:700}
.pm-chip:hover{border-color:var(--blue);color:var(--blue)}
.pm-chip.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.pf-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.pf-chip{border:1px solid var(--line);background:#fff;border-radius:50px;padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--gray);transition:.12s}
.pf-chip:hover{border-color:var(--blue);color:var(--blue)}
.pf-chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dim-grid .field label{margin-bottom:5px}
.dim-grid input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;color:var(--ink)}
.dim-grid input:focus{border-color:var(--blue)}

/* 슬롯 박스 */
.slot-box{background:var(--slot-l);border:1px solid #FBE3B0;border-radius:12px;padding:14px}
.slot-head{display:flex;align-items:center;justify-content:space-between}
.slot-head .t{font-size:12.5px;font-weight:700;color:var(--slot-d);display:flex;align-items:center;gap:6px}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#D9DEE6;border-radius:50px;transition:.2s;cursor:pointer}
.switch .track:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.track{background:var(--slot)}
.switch input:checked+.track:before{transform:translateX(18px)}
.slot-label{margin-top:12px}
.slot-label label{font-size:11.5px;color:var(--slot-d);font-weight:600;display:block;margin-bottom:6px}
.slot-label input{width:100%;padding:8px 10px;border:1px solid #FBE3B0;border-radius:8px;font-size:13px;outline:none;background:#fff;color:var(--ink)}
.slot-label input:focus{border-color:var(--slot)}
.slot-hint{font-size:11.5px;color:var(--slot-d);margin-top:9px;line-height:1.5;opacity:.85}

/* fill 모드 우측 */
.fill-card{padding:18px}
.fill-tag{display:inline-flex;align-items:center;gap:6px;background:var(--slot-l);color:var(--slot-d);font-size:12px;font-weight:700;padding:5px 11px;border-radius:50px;margin-bottom:14px}

/* 내보내기 메뉴 */
.export-wrap{position:relative}
.export-menu{position:absolute;top:46px;right:0;background:var(--white);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh-pop);padding:7px;z-index:60;min-width:172px}
.export-menu button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;padding:11px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.1s}
.em-sub{font-size:10.5px;color:var(--gray-l);font-weight:600;margin-top:1px}
.export-menu button:hover{background:var(--blue-ll);color:var(--blue)}
.export-menu button .em-ico{width:30px;height:30px;border-radius:8px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

/* 토스트 */
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:50px;font-size:14px;font-weight:600;opacity:0;transition:all .26s cubic-bezier(.34,1.3,.5,1);z-index:200;pointer-events:none;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:9px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .tcheck{color:#6EE7B7}

/* ===== 케이메이커 2.0 모션 ===== */
.tb-btn.play{background:#7C3AED;color:#fff;border-color:transparent}
.tb-btn.play:hover{background:#6D28D9}
.tb-btn.play svg{width:15px;height:15px}
#kmPlay{position:fixed;inset:0;z-index:1000;background:#0E1220;display:flex;align-items:center;justify-content:center;animation:kmpIn .25s ease}
@keyframes kmpIn{from{opacity:0}to{opacity:1}}
#kmPlay .kmp-stagewrap{display:flex;align-items:center;justify-content:center}
#kmPlay .canvas-stage{box-shadow:0 24px 90px rgba(0,0,0,.55);border-radius:10px;overflow:hidden}
#kmPlay .kmp-ctl{position:fixed;bottom:26px;right:26px;display:flex;gap:10px;opacity:.4;transition:opacity .2s}
#kmPlay .kmp-ctl:hover{opacity:1}
#kmPlay .kmp-ctl button{border:none;background:rgba(255,255,255,.14);color:#fff;font-family:inherit;font-size:14px;font-weight:700;padding:11px 18px;border-radius:12px;backdrop-filter:blur(8px)}
#kmPlay .kmp-ctl button:hover{background:rgba(255,255,255,.26)}
.anim-sec select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink)}
.anim-sec .anim-prev{width:100%;justify-content:center;margin-top:10px;background:#F3EFFE;color:#7C3AED;border-color:#E4DAFB}
.anim-sec .anim-prev:hover{background:#EAE2FD}
.mbg-item{position:relative}
.mbg-item.sel{outline:2.5px solid #7C3AED;outline-offset:1px}
.mbg-tag{position:absolute;left:6px;bottom:6px;background:#7C3AED;color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;pointer-events:none}
</style>
  <script src="/kedu_gate.js"></script>
</head>
<body>

<!-- ============ 시작 화면 ============ -->
<div id="start">
  <div class="start-inner">
    <a href="/?role=teacher" class="start-back">← K-edu 홈으로</a>
    <div class="start-badge"><span class="dot"></span>K-edu · 완전 무료</div>
    <div class="start-logo">케이<b>메이크</b></div>
    <div class="start-sub">상장·학습지·이름표·발표자료를 무료로 뚝딱.<br>한 번 만든 틀은 이름만 바꿔 다시 써요.</div>
    <div class="start-tabs">
      <button class="start-tab on" data-aud="teacher">👩‍🏫 선생님</button>
      <button class="start-tab" data-aud="student">🎒 학생</button>
    </div>
    <div class="tpl-wrap hidden" id="tplWrap">
      <div class="sec-title">✨ 바로 쓰는 템플릿 <span>고르면 이름·날짜만 바꿔서 인쇄</span></div>
      <div class="tpl-grid"></div>
    </div>
    <div class="sec-title" style="margin-top:8px">📐 빈 캔버스로 시작</div>
    <div class="preset-grid" id="presetGrid"></div>
  </div>
</div>

<!-- ============ 에디터 ============ -->
<div id="editor" class="hidden">
  <!-- 메인 바 -->
  <div class="topbar">
    <span class="logo" onclick="goHome()" style="cursor:pointer" title="케이메이커 홈">케이메이커</span>
    <button class="home" onclick="goHome()">← 홈</button>
    <div class="vr"></div>
    <div class="mode-toggle" id="modeToggle">
      <button class="on" data-mode="edit">✏️ 만들기</button>
      <button data-mode="fill">📝 채우기</button>
    </div>
    <div class="vr"></div>
    <button class="icon-btn" id="btnUndo" title="실행취소 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
    <button class="icon-btn" id="btnRedo" title="다시실행 (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg></button>
    <div class="spacer"></div>
    <button class="tb-btn" id="btnOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>불러오기</button>
    <button class="tb-btn" id="btnSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>저장</button>
    <button class="tb-btn play" id="btnPlay" onclick="KM_MOTION.enterPlay()" title="전체화면 재생 — TV에 띄우기"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>재생</button>
    <div class="export-wrap">
      <button class="tb-btn primary" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>내보내기</button>
      <div class="export-menu hidden" id="exportMenu">
        <button onclick="exportPNG()"><span class="em-ico">🖼</span><div><div>PNG 이미지</div></div></button>
        <button onclick="exportPDF()"><span class="em-ico">📄</span><div><div>PDF 문서</div></div></button>
        <button onclick="exportPPTX()"><span class="em-ico">📊</span><div><div>PPT 파워포인트</div></div></button>
        <button onclick="closePops();KM_VIDEO.exportMP4()"><span class="em-ico">🎬</span><div><div>영상 (MP4)</div><div class="em-sub">씬 · 모션 · 전환이 그대로 영상으로</div></div></button>
      </div>
    </div>
  </div>

  <!-- 컨텍스트 바 -->
  <div class="ctxbar empty" id="ctxbar"></div>

  <div class="workspace">
    <!-- 좌측 도구 -->
    <div class="tools" id="toolbar">
      <button class="tool" data-tool="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>텍스트</button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="rect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>사각형</button>
      <button class="tool" data-tool="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/></svg>원</button>
      <button class="tool" data-tool="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>선</button>
      <button class="tool" data-tool="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="18" y2="12"/><polyline points="13 7 19 12 13 17"/></svg>화살표</button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 16l-5-5L5 20"/></svg>이미지</button>
      <button class="tool" data-tool="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.5 2.3 7.1-6.3-4.6L5.7 21l2.3-7.1-6-4.5h7.6z"/></svg>아이콘</button>
      <button class="tool" data-tool="bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="9" cy="8.5" r="1.5"/></svg>배경</button>
    </div>

    <!-- 배경 패널 -->
    <div class="icon-panel hidden" id="bgPanel">
      <div class="ip-head"><span class="ip-title">배경</span><button class="ip-close" id="bgClose">✕</button></div>
      <div class="ip-cats" id="bgCats"></div>
      <div class="ip-grid bg-grid" id="bgGrid"></div>
    </div>

    <!-- 아이콘 패널 -->
    <div class="icon-panel hidden" id="iconPanel">
      <div class="ip-head">
        <span class="ip-title">아이콘</span>
        <button class="ip-close" id="ipClose">✕</button>
      </div>
      <div class="ip-modes">
        <button class="ip-mode on" data-im="line">✏️ 라인</button>
        <button class="ip-mode" data-im="color">🎨 컬러</button>
        <button class="ip-mode" data-im="illust">🖼 일러스트</button>
        <button class="ip-mode" data-im="shape">🔷 꾸밈</button>
        <button class="ip-mode" data-im="photo">📸 실사</button>
      </div>
      <div class="ip-search"><input type="text" id="ipSearch" placeholder="검색 (별, 하트, 연필, star...)"></div>
      <div class="ip-cats" id="ipCats"></div>
      <div class="ip-grid" id="ipGrid"></div>
      <div class="ip-credit">아이콘 출처: Lucide (MIT) · OpenMoji (CC BY-SA 4.0) · unDraw</div>
    </div>

    <!-- 캔버스 -->
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas-stage"><canvas id="c"></canvas></div>
      <div class="mode-banner hidden" id="modeBanner">📝 채우기 모드 — 노란 점선 칸을 눌러 내용만 바꾸세요</div>
      <div class="scene-strip hidden" id="sceneStrip"></div>
      <div class="vid-progress hidden" id="vidProgress">
        <div class="vp-card">
          <div class="vp-title">🎬 영상 만드는 중</div>
          <div class="vp-bar"><i></i></div>
          <div class="vp-row"><span class="vp-label"></span><span class="vp-pct">0%</span></div>
          <div class="vp-hint">창을 닫지 말고 잠시만요 — 프레임을 한 장 한 장 그리고 있어요</div>
        </div>
      </div>
      <div class="zoombar">
        <button id="zoomOut" title="축소">−</button>
        <button class="zlabel" id="zoomFit" title="화면 맞춤" style="border-radius:8px;width:auto;padding:0 4px">100%</button>
        <button id="zoomIn" title="확대">+</button>
      </div>
    </div>

    <!-- 우측 패널 -->
    <div class="panel" id="panel"></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="imgInput" accept="image/*,.heic,.heif" class="hidden">
<input type="file" id="jsonInput" accept=".kmake,.json,application/json" class="hidden">

<script src="icons.js"></script>
<script src="shapes.js"></script>
<script src="backgrounds.js"></script>
<script src="templates.js"></script>
<script src="motion.js"></script>
<script src="photo.js"></script>
<script src="scene.js"></script>
<script src="video.js"></script>
<script src="kmake.js"></script>
</body>
</html>

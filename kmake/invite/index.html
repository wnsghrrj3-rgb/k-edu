<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url=/maker/invite/">
<meta name="robots" content="noindex">
<title>초대장 만들기 — 새 주소로 이동 중</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: #F6F8FC; color: #1F2937; }
  main { text-align: center; padding: 32px 24px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #5B8EF8; display: inline-block;
         margin: 0 3px; animation: b 1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-6px); opacity: 1; } }
  h1 { font-size: 18px; font-weight: 700; margin: 14px 0 6px; }
  p { font-size: 14px; color: #6B7280; margin: 0; }
  a { color: #5B8EF8; font-weight: 600; }
</style>
</head>
<body data-r85-redirect>
<main>
  <div aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <h1>초대장 만들기가 새 집으로 이사했어요</h1>
  <p>잠시 후 자동으로 이동합니다.<br>이동하지 않으면 <a href="/maker/invite/">여기를 눌러 주세요</a>.</p>
</main>
<script data-r85-redirect>
location.replace('/maker/invite/' + location.search + location.hash);
</script>
</body>
</html>

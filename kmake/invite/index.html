<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>초대장 | 케이메이커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1c1c22; --line:#e3e0da; --gold:#a8894e; --paper:#faf9f6; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Noto Sans KR',sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; justify-content:center; }
  .wrap{ width:min(720px,100%); padding:36px 20px 60px; }
  h1{ font-family:'Noto Serif KR'; font-weight:500; font-size:clamp(24px,4.5vw,30px); text-align:center; }
  .sub{ text-align:center; color:#8a877f; font-size:14px; font-weight:300; margin:10px 0 34px; }
  .field{ border-top:1px solid var(--line); padding:22px 2px; }
  .field:last-of-type{ border-bottom:1px solid var(--line); }
  .flabel{ font-size:12px; letter-spacing:.14em; color:#9a958a; margin-bottom:14px; font-weight:500; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:15px; padding:10px 20px; border-radius:2px; border:1px solid var(--line); background:#fff; color:#55524b; cursor:pointer; transition:.18s; }
  .chip.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
  input[type=text]{ width:100%; font-family:'Noto Serif KR'; font-weight:500; font-size:21px; padding:6px 2px 10px; border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); border-radius:0; }
  input[type=text]:focus{ outline:none; border-bottom-color:var(--gold); }
  input::placeholder{ color:#c5c1b8; font-weight:300; }
  .go{ display:block; width:100%; font-weight:500; font-size:16px; letter-spacing:.16em; color:#fff; background:var(--ink); border:none; border-radius:2px; padding:19px; cursor:pointer; margin-top:36px; }
  .go:active{ transform:scale(.99); }
  #stage{ display:none; }
  .cvBox{ position:relative; border-radius:4px; overflow:hidden; box-shadow:0 24px 60px rgba(20,18,30,.18); }
  canvas{ display:block; width:100%; height:auto; }
  .toolRow{ display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .tool{ flex:1 1 120px; font-size:14px; letter-spacing:.06em; padding:14px 10px; border-radius:2px; border:1px solid var(--line); cursor:pointer; background:#fff; color:var(--ink); }
  .tool.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .tool:active{ transform:scale(.97); }
  #recBadge{ position:absolute; top:14px; left:14px; background:rgba(0,0,0,.5); color:#fff; font-size:12px; letter-spacing:.08em; padding:7px 14px; border-radius:2px; display:none; }
  .back{ display:inline-block; font-size:13px; color:#9a958a; text-decoration:none; letter-spacing:.06em; margin-bottom:18px; }
</style>
<script src="/kedu_gate.js"></script>
</head>
<body>
<div class="wrap">

  <div id="form">
    <a class="back" href="/kmake/">← 케이메이커</a>
    <h1>초대장</h1>
    <div class="sub">행사만 적으세요 · 입장권이 되어 나옵니다</div>

    <div class="field">
      <div class="flabel">EVENT — 어떤 자리인가요</div>
      <div class="chips" id="occasionChips">
        <button class="chip on" data-k="recital">학예회</button>
        <button class="chip" data-k="openclass">공개수업</button>
        <button class="chip" data-k="exhibit">전시회</button>
        <button class="chip" data-k="classevent">학급 행사</button>
        <button class="chip" data-k="party">생일 파티</button>
        <button class="chip" data-k="gathering">모임</button>
      </div>
    </div>

    <div class="field">
      <div class="flabel">TITLE — 행사 이름</div>
      <input type="text" id="titleIn" maxlength="14" placeholder="1학년 2반 가을 학예회">
    </div>
    <div class="field">
      <div class="flabel">WHEN — 일시</div>
      <input type="text" id="whenIn" maxlength="22" placeholder="10월 24일 금요일 오후 2시">
    </div>
    <div class="field">
      <div class="flabel">WHERE — 장소</div>
      <input type="text" id="whereIn" maxlength="20" placeholder="본관 3층 시청각실">
    </div>
    <div class="field">
      <div class="flabel">MESSAGE — 한마디 <span style="letter-spacing:0;color:#c0bcb2">(비워 두면 알아서)</span></div>
      <input type="text" id="msgIn" maxlength="26" placeholder="">
    </div>

    <button class="go" id="makeBtn">초대장 만들기</button>
  </div>

  <div id="stage">
    <a class="back" href="/kmake/">← 케이메이커</a>
    <h1>완성</h1>
    <div class="sub">저장해서 알림장·단체방에 보내세요</div>
    <div class="cvBox">
      <canvas id="cv" width="1280" height="720"></canvas>
      <div id="recBadge">● RECORDING</div>
    </div>
    <div class="toolRow">
      <button class="tool" id="replayBtn">다시 재생</button>
      <button class="tool" id="pngBtn">이미지 저장</button>
      <button class="tool primary" id="webmBtn">영상 저장</button>
      <button class="tool" id="backBtn">수정</button>
    </div>
  </div>

</div>

<script>
/* ─────────────────────────────────────────
   멸치 2호 초대장 v0.2 — 아트 디렉션: 「낮의 티켓」
   1호 카드(밤·다크·금분·시머)와 정반대 세계:
   크림 종이 + 잉크, 실물 입장권(절취선·스텁·펀치홀),
   행 슬라이드-인, 마지막에 도장 쿵. 금분·보케·시머 없음.
   ───────────────────────────────────────── */
const THEMES = {
  recital:   { en:'GRAND RECITAL', acc:'#8e2f3f', seal:'학예회',
    presets:['아이들이 준비한 무대에 초대합니다','귀한 걸음으로 자리를 빛내 주세요'] },
  openclass: { en:'OPEN CLASS',    acc:'#2b4a7a', seal:'공개수업',
    presets:['아이들의 배움을 함께 봐 주세요','교실의 하루를 열어 보입니다'] },
  exhibit:   { en:'EXHIBITION',    acc:'#7a5b21', seal:'전시회',
    presets:['작품 하나하나에 마음을 담았습니다','천천히 둘러봐 주세요'] },
  classevent:{ en:'CLASS DAY',     acc:'#2f5d43', seal:'학급행사',
    presets:['우리 반의 특별한 하루에 초대합니다','함께여서 더 빛나는 날'] },
  party:     { en:'BIRTHDAY PARTY',acc:'#b0562f', seal:'초대',
    presets:['함께라서 더 즐거운 날','당신이 와야 완성되는 자리'] },
  gathering: { en:'GATHERING',     acc:'#6b4a2e', seal:'모임',
    presets:['오랜만에 얼굴 봐요','같이 밥 한 끼 해요'] }
};
const LOOP = 8;
const PAPER='#f1ece1', TICKET='#fffdf6', INK='#26231c';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
const state={ occ:'recital', title:'', when:'', where:'', msg:'' };

const chipBox=document.getElementById('occasionChips');
chipBox.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  chipBox.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  b.classList.add('on'); state.occ=b.dataset.k;
  document.getElementById('msgIn').placeholder=THEMES[state.occ].presets[0];
});

let startT=0, playing=false, grain=[];
document.getElementById('makeBtn').onclick=async()=>{
  const th=THEMES[state.occ];
  state.title=document.getElementById('titleIn').value.trim()||'우리의 작은 행사';
  state.when =document.getElementById('whenIn').value.trim() ||'곧, 좋은 날에';
  state.where=document.getElementById('whereIn').value.trim()||'우리 교실';
  state.msg  =document.getElementById('msgIn').value.trim()
            ||th.presets[Math.floor(Math.random()*th.presets.length)];
  try{
    await document.fonts.load("700 80px 'Noto Serif KR'");
    await document.fonts.load("300 40px 'Noto Serif KR'");
    await document.fonts.load("500 30px 'Noto Sans KR'");
  }catch(e){}
  document.getElementById('form').style.display='none';
  document.getElementById('stage').style.display='block';
  build(); play();
  window.scrollTo({top:0,behavior:'smooth'});
};
document.getElementById('backBtn').onclick=()=>{
  playing=false;
  document.getElementById('stage').style.display='none';
  document.getElementById('form').style.display='block';
};
document.getElementById('replayBtn').onclick=()=>{ build(); play(); };
function play(){ startT=performance.now(); if(!playing){ playing=true; requestAnimationFrame(tick);} }
function tick(now){ if(!playing) return; drawScene(((now-startT)/1000)%LOOP); requestAnimationFrame(tick); }

const eoc=x=>1-Math.pow(1-x,3);
const eob=x=>{const c=1.4; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const clamp01=x=>Math.max(0,Math.min(1,x));
const seg=(t,a,b)=>clamp01((t-a)/(b-a));

function build(){
  grain=Array.from({length:900},()=>({x:Math.random()*W,y:Math.random()*H,a:Math.random()*.05,s:Math.random()<.5?1:1.5}));
}

/* 티켓 지오메트리 */
const TX=120, TY=150, TW2=1040, TH2=420, PERF=TX+TW2-236; // 절취선 x

/* 타임라인:
   0.0 종이 / 0.4-1.3 티켓이 아래서 슬쩍 올라와 안착(미세 회전)
   1.4 펀치홀 뚫림·절취선 / 1.6 EN 라벨 / 2.0 행사명(잉크 슬라이드)
   2.7 구분바 / 3.1 WHEN 행 / 3.7 WHERE 행 (좌측 슬라이드-인)
   4.6 한마디 / 5.6 도장 쿵 / 이후 티켓 미세 부유 */
function drawScene(t){
  const th=THEMES[state.occ];

  /* 종이 배경 + 결 */
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  const pg=ctx.createLinearGradient(0,0,0,H);
  pg.addColorStop(0,'rgba(255,255,255,.35)'); pg.addColorStop(1,'rgba(120,100,70,.08)');
  ctx.fillStyle=pg; ctx.fillRect(0,0,W,H);
  grain.forEach(g=>{ ctx.globalAlpha=g.a; ctx.fillStyle='#5a4a30';
    ctx.fillRect(g.x,g.y,g.s,g.s); });
  ctx.globalAlpha=1;

  /* 티켓 등장 + 안착 후 부유 */
  const ep=eob(seg(t,0.4,1.3));
  const settle=t>1.3;
  const oy=(1-ep)*70 + (settle? Math.sin(t*1.1)*2.5 : 0);
  const rot=(1-ep)*0.03 + (settle? Math.sin(t*.7)*.0025 : 0);

  ctx.save();
  ctx.translate(W/2, TY+TH2/2+oy); ctx.rotate(rot); ctx.translate(-W/2, -(TY+TH2/2));
  ctx.globalAlpha=Math.min(1,ep*1.4);

  /* 그림자 → 몸통 → 테두리 */
  ctx.shadowColor='rgba(60,45,20,.28)'; ctx.shadowBlur=34; ctx.shadowOffsetY=16;
  rr(TX,TY,TW2,TH2,14); ctx.fillStyle=TICKET; ctx.fill();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  rr(TX,TY,TW2,TH2,14); ctx.strokeStyle=hexA(th.acc,.5); ctx.lineWidth=1.5; ctx.stroke();
  rr(TX+10,TY+10,TW2-20,TH2-20,9); ctx.strokeStyle=hexA(th.acc,.22); ctx.lineWidth=1; ctx.stroke();

  /* 펀치홀 + 절취선 (1.4~) */
  const hp=eoc(seg(t,1.35,1.7));
  if(hp>0){
    ctx.fillStyle=PAPER;
    ctx.beginPath(); ctx.arc(PERF,TY,15*hp,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(PERF,TY+TH2,15*hp,0,6.28); ctx.fill();
    ctx.strokeStyle=hexA(INK,.3); ctx.lineWidth=1.5; ctx.setLineDash([2,7]);
    ctx.beginPath(); ctx.moveTo(PERF,TY+22); ctx.lineTo(PERF,TY+TH2-22); ctx.stroke();
    ctx.setLineDash([]);
  }

  const LX=TX+62;             // 본문 왼쪽 기준
  /* EN 라벨 */
  const lp=eoc(seg(t,1.6,2.1));
  if(lp>0){
    ctx.globalAlpha=lp; ctx.fillStyle=th.acc;
    ctx.font="500 19px 'Noto Sans KR'"; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    drawSpaced('INVITATION · '+th.en, LX, TY+72, 5.5, false);
    ctx.globalAlpha=Math.min(1,ep*1.4);
  }

  /* 행사명 — 잉크가 왼쪽에서 배어들 듯 */
  const np=eoc(seg(t,2.0,2.7));
  if(np>0){
    ctx.save();
    ctx.beginPath(); ctx.rect(LX-4, TY+92, (TW2-320)*np+8, 90); ctx.clip();
    ctx.globalAlpha=np; ctx.fillStyle=INK;
    ctx.font="700 62px 'Noto Serif KR'"; ctx.textAlign='left';
    ctx.fillText(state.title, LX, TY+160);
    ctx.restore(); ctx.globalAlpha=Math.min(1,ep*1.4);
  }

  /* 구분바 */
  const dp=eoc(seg(t,2.7,3.1));
  if(dp>0){ ctx.fillStyle=th.acc; ctx.fillRect(LX, TY+186, 150*dp, 3); }

  /* WHEN / WHERE — 좌측 슬라이드-인 */
  infoRow(t,3.1,'WHEN', state.when,  TY+238, th, LX);
  infoRow(t,3.7,'WHERE',state.where, TY+300, th, LX);

  /* 한마디 */
  const mp=eoc(seg(t,4.6,5.4));
  if(mp>0){
    ctx.globalAlpha=mp*.85; ctx.fillStyle='#57503f';
    ctx.font="300 27px 'Noto Serif KR'"; ctx.textAlign='left';
    ctx.fillText('“ '+state.msg+' ”', LX, TY+372+(1-mp)*10);
    ctx.globalAlpha=Math.min(1,ep*1.4);
  }

  /* 스텁(절취선 오른쪽) — 세로 레터, NO. */
  if(hp>0){
    ctx.save(); ctx.globalAlpha=hp*Math.min(1,ep*1.4);
    ctx.translate(PERF+118, TY+TH2/2); ctx.rotate(Math.PI/2);
    ctx.fillStyle=hexA(th.acc,.85); ctx.font="500 20px 'Noto Sans KR'"; ctx.textAlign='center';
    drawSpaced('ADMIT · ALL', 0, 8, 7, true);
    ctx.restore();
    ctx.globalAlpha=hp*Math.min(1,ep*1.4);
    ctx.fillStyle=hexA(INK,.45); ctx.font="400 15px 'Noto Sans KR'"; ctx.textAlign='center';
    drawSpaced('NO. 001', PERF+118, TY+TH2-38, 3, true);
    ctx.globalAlpha=Math.min(1,ep*1.4);
  }

  /* 도장 — 쿵 (5.6) */
  const sp=seg(t,5.6,6.0);
  if(sp>0){
    const s=eob(sp), scale=1.9-0.9*s;
    ctx.save();
    ctx.translate(TX+TW2-360, TY+TH2-96); ctx.rotate(-.16); ctx.scale(scale,scale);
    ctx.globalAlpha=Math.min(1,sp*1.6)*.92;
    ctx.strokeStyle=th.acc; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(0,0,52,0,6.28); ctx.stroke();
    ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(0,0,44,0,6.28); ctx.stroke();
    ctx.fillStyle=th.acc; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=(th.seal.length>3? "700 21px":"700 26px")+" 'Noto Serif KR'";
    ctx.fillText(th.seal, 0, 1);
    ctx.restore();
    /* 착지 순간 종이 눌림 링 */
    if(sp>0.85&&sp<1){
      ctx.globalAlpha=(1-sp)*3*.3; ctx.strokeStyle=th.acc; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(TX+TW2-360, TY+TH2-96, 62+(sp-.85)*160, 0, 6.28); ctx.stroke();
    }
    ctx.globalAlpha=Math.min(1,ep*1.4);
  }

  ctx.restore(); /* 티켓 변환 끝 */

  /* 워터마크 */
  ctx.globalAlpha=.4; ctx.fillStyle='#8a7a5c';
  ctx.font="300 16px 'Noto Sans KR'"; ctx.textAlign='right';
  ctx.fillText('K-MAKER · keduclass.com', W-24, H-20);
  ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
}
function infoRow(t,at,label,value,y,th,LX){
  const p=eoc(seg(t,at,at+.6)); if(p<=0) return;
  const dx=(1-p)*-36;
  ctx.globalAlpha=p;
  ctx.fillStyle=th.acc; ctx.fillRect(LX+dx, y-16, 4, 20);
  ctx.font="500 15px 'Noto Sans KR'"; ctx.textAlign='left'; ctx.fillStyle=hexA(th.acc,.9);
  drawSpaced(label, LX+18+dx, y-14, 3.5, false);
  ctx.fillStyle=INK; ctx.font="500 33px 'Noto Serif KR'";
  ctx.fillText(value, LX+18+dx, y+22);
  ctx.globalAlpha=1;
}
function drawSpaced(s,x0,y,sp,center){
  let w=0; for(const ch of s) w+=ctx.measureText(ch).width+sp;
  let x=center? x0-(w-sp)/2 : x0;
  const prev=ctx.textAlign; ctx.textAlign='left';
  for(const ch of s){ ctx.fillText(ch,x,y); x+=ctx.measureText(ch).width+sp; }
  ctx.textAlign=prev;
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

document.getElementById('pngBtn').onclick=()=>{
  drawScene(6.3);
  const a=document.createElement('a');
  a.download='초대장_'+state.title+'.png'; a.href=cv.toDataURL('image/png'); a.click();
  play();
};
document.getElementById('webmBtn').onclick=()=>{
  const stream=cv.captureStream(30);
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){ alert('이 기기에서는 영상 저장이 지원되지 않습니다. 이미지 저장을 이용해 주세요.'); return; }
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:7_000_000});
  const chunks=[]; rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{
    const a=document.createElement('a');
    a.download='초대장_'+state.title+'.webm';
    a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})); a.click();
    document.getElementById('recBadge').style.display='none';
  };
  document.getElementById('recBadge').style.display='block';
  build(); play(); rec.start();
  setTimeout(()=>rec.stop(), LOOP*1000);
};
build();
</script>
</body>
</html>

  알아볼까요, 지도서 p.170~176) 근거 · ★ 주제② 첫 차시 — 성취기준이 [6사08-01]에서 [6사08-02]로 바뀐다.

⚠️ 엔진은 대단원1 l01~l11 · 대단원2 l01~l04에서 100% 승계. 2단원 색 #C2410C 유지 · CSS 변수명 무수정.

직접조작: 맡을 곳이 없으면 일이 쌓이는 판(51번째 신규 패턴 — 나중에 세운 것이 이미 지난 걸음을 되살리는 형)
  ⭐ 앞의 쉰 종에서 **한 걸음은 언제나 판의 「지금」에만 작용했다.** 놓으면 그 자리가 채워졌고, 세우면
     그 잣대가 걸렀고, 되돌리면 그 자리가 돌아왔다. 44번째(빛과 그늘이 함께 자라는 판)에서 한 걸음이
     두 자리를 동시에 만들 때조차 그 두 자리는 **그 걸음이 만든 것**이었다.
     이번만 **한 걸음이 이미 지나간 걸음들에 소급해 작용한다** — 국가기관 하나를 세우면 **앞서 쌓여 있던**
     나랏일 가운데 그 기관이 맡을 일이 그 자리에서 처리된다.
  ⭐ **처음에는 어느 일도 처리되지 않는다 — 판이 막아서가 아니라 맡을 곳이 아직 없기 때문이다.**
     47번째(첫 길이 막히는 판)와의 대비: 거기서는 막히는 자리를 판이 미리 정해 두었다.
     여기서는 **막는 자리 자체가 없다.** 받을 데가 없을 뿐이고, 그래서 일은 사라지지 않고 그대로 쌓인다.
     근거는 교과서 [친구와 활동] 원문 「나랏일을 맡아 하는 기관이 없으면 어떤 일이 일어날지 쓰고,
     친구들과 이야기해 봅시다」 — 없으면 어떻게 되는지를 **판이 실제로 보여 주는 것**이 이 조작이다.
  ⭐ **처리된 일을 따로 담는 상태가 코드에 아예 없다** — `nkDone(st)` **한 줄**(쌓인 일 ∧ 세운 기관이
     맡는 일)이 처리된 일을 다 고르고, `NK_OWNER`를 읽는 자리는 `nkOrgMask(st)` **단 하나**다.
     그래서 「기관을 세우지 않았는데 처리된 일」도 「쌓지 않았는데 처리된 일」도 만들어질 수 없다.
  ⭐ **일을 쌓는 자리에는 옳고 그름이 없다** — 정답 상수 자체가 코드에 없다(`NK_PILE_OK` 부재).
     어느 일부터 쌓아도 되고 어느 기관부터 세워도 된다(순서 독립 · 일 6 순열 × 기관 6 순열 전수 대조).
  ① **나랏일 3건 쌓기**(교과서 75쪽 세 장면 원문 · 무판정 · 순서 자유)
     → 셋이 다 쌓이면 [친구와 활동] 예시 답안 원문 3줄이 뜬다.
  ② **국가기관 세우기 3걸음**(국회·행정부·법원 · 순서 자유)
     → 세울 때마다 **앞서 쌓여 있던** 일 가운데 그 기관이 맡을 일이 그 자리에서 처리된다.
  ③ **[스스로 활동] 어린이 보호 구역 — 어느 기관이 한 일인지 3택**(교과서 원문)
  ④ 마무리 3택 = 국가기관이 있는 까닭(교과서 본문 원문)
  ⚠️ 일·기관·대응·3택 전량 고정 리터럴 — 난수 0.
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 이미 쌓은 일 재클릭 — 판 불변 / ④ 세 일을 다 쌓기 전 기관 세우기 무시(순서) — 판 불변 /
     ⑤ 이미 세운 기관 재클릭 — 판 불변 / ⑥ 세 기관 전 [스스로 활동] 무시(순서) /
     ⑦ [스스로 활동] 확정 뒤 재선택 무시 / ⑧ [스스로 활동] 전 마무리 무시(순서) /
     ⑨ 안내 표시 중 재클릭 무시(`nkBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.nk-q`로 떼어 전 단계 상시 노출. 상태 열쇠 11개.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 「맡을 곳이 없는 자리」는 실제 나라가 아니다.** 교과서 [친구와 활동]이 「나랏일을 맡아 하는
     기관이 없으면 어떤 일이 일어날지」 생각해 보라고 한 자리를 판으로 옮긴 것이며, 판에 그렇게 적었다.
  ㉡ **기관이 없을 때 일어나는 일은 지도서 예시 답안 원문만 쓰고 지어내지 않는다**
     (일상생활이 불편해짐 / 국민의 안전을 위협받는 일이 생김 / 법을 지키지 않는 사람이 생김).
  ㉢ **세 기관이 하는 일은 교과서 원문 한 줄씩까지만.** 국회·행정부·법원이 하는 일을 자세히 알아보는
     것은 다음 차시들 몫이라 판이 그 이상 말하지 않는다.
  ㉣ **판이 일에 점수를 매기지 않는다.** 일을 쌓는 자리에 정답이 없고, 어느 일부터 쌓아도 판이 같다.

⚠️ 설계 원칙
  · **8차시 이후 침범 0** — 「국회에서 하는 일」은 차시 예고 자리까지. 국회의원·법률안·심의·거부권·
    감시·견제·임기 0 / 국무총리·행정 각부 0 / 재판의 종류·삼심제·공개 재판·법관 0.
  · **11~12차시 침범 0** — **권력 분립 0 · 독재 0 · 균형 0.** 「권력」은 [생각을 열어요] 원문 자리까지.
  · **주제① 재현 0** — 선거·유권자·공약·투표·후보자·기표소 0(「민주주의」는 META와 [생각을 열어요] 원문).
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 우리나라의 실제 정당·정치인 이름 0, 실제 사건의 연도·결과 0.
    「제임스 매디슨」은 교과서 [생각을 열어요] 원문 인물이라 그 자리까지(개수 대조).
  · 교사용 참고 자료 0 — 참고 도서 세 종, 의원 내각제·대통령제·이원 집정부제, 링컨 대통령의 연설,
    「헌법」 조항과 민주 공화국, **입법부·사법부·삼권 분립** 학술 용어, 활동지 신문 기사(신문사 이름·날짜·
    금액·인원) 전부 0.
  · **파일 전체에 네 자리 연도 0 · 금액·통계 수치 0** · **학생 이름 0 · 실제 지역 이름 0.**
  · 정서 — 홍수·층간 소음·교통사고는 교과서가 말한 만큼만 쓰고 겁주지 않는다. **사람이 다치는 묘사 0**
    (교과서의 「어린이가 크게 다쳤습니다」는 판·문항에 옮기지 않고 사건만 쓴다). 어느 기관도 나쁜 곳으로
    그리지 않는다.

.nk-list{display:flex;flex-direction:column;gap:5px;max-height:214px;overflow-y:auto}

  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.nk-list button:hover{border-color:var(--green);background:var(--bub)}
.nk-list button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.nk-list button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.nk-list button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.nk-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.nk-none{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.nk-none b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

    ${[0,1,2].map(i=>{const y=96+i*22;
      return `<rect x="46" y="${y}" width="228" height="18" rx="5" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>

/* ===== 직접조작 — 맡을 곳이 없으면 일이 쌓이는 판(51번째 신규 패턴) =====
   ⭐ 앞의 쉰 종에서 **한 걸음은 언제나 판의 「지금」에만 작용했다.** 이번만 한 걸음이
      **이미 지나간 걸음들에 소급해 작용한다** — 기관을 세우면 앞서 쌓여 있던 일이 그 자리에서 처리된다.
   ⭐ **처음에는 어느 일도 처리되지 않는다** — 판이 막아서가 아니라 **맡을 곳이 아직 없기 때문**이다.
      막는 자리 자체가 없고, 그래서 일은 사라지지 않고 그대로 쌓인다.
   ⭐ **처리된 일을 따로 담는 상태가 코드에 아예 없다** — `nkDone(st)` 한 줄이 처리된 일을 다 고르고,
      `NK_OWNER`를 읽는 자리는 `nkOrgMask(st)` 단 하나다.
   ⭐ **일을 쌓는 자리에는 옳고 그름이 없다**(정답 상수 부재) · 순서 독립.
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */
const NK_N = 3;
/* 나랏일 셋 \u2014 교과서 75쪽 세 장면 원문 근거(「~자」·「~하도록」이 곧 상황이다) */
const NK_JOB = [

const NK_ORG_DO = ['법을 만드는 곳','법을 바탕으로 나라의 일을 집행하는 곳','법에 따라 판결을 내리는 곳'];

const NK_OWNER = [0, 1, 2];
/* 기관이 맡아 한 일 \u2014 교과서 75쪽 원문 */
const NK_ORG_DID = [

/* [친구와 활동] 기관이 없으면 일어나는 일 \u2014 지도서 예시 답안 원문(지어내지 않는다) */
const NK_NONE = [

];
/* ③ [스스로 활동] 어린이 보호 구역 \u2014 어느 기관이 한 일인가 */
const NK_CASE = ['국회', '행정부', '법원'];
const NK_CASE_OK = 1;
const NK_CASE_NO = [
  '국회는 <b>법을 만드는 곳</b>이에요. 카메라를 설치하라고 지시한 일과는 달라요.',

  '법원은 <b>법에 따라 판결을 내리는 곳</b>이에요. 카메라를 설치하라고 지시한 일과는 달라요.'
];
/* ④ 마무리 \u2014 국가기관이 있는 까닭(교과서 본문 원문) */
const NK_FIN = [
  '나랏일을 맡을 사람을 더 많이 뽑기 위해서예요',
  '기관마다 서로 다른 건물을 짓기 위해서예요',
  '국민의 자유와 권리를 보장하기 위해서예요'
];
const NK_FIN_OK = 2;
const NK_FIN_NO = [
  '사람의 수가 아니라 <b>나랏일</b>이 먼저예요. 판에서 기관을 세운 까닭을 떠올려 봐요.',
  '건물이 아니라 <b>하는 일</b>에 따라 나눠져 있어요.',
  ''
];
/* 안내 \u2014 어느 문구에도 「틀렸다」는 말이 없다 */
const NK_ALREADY_J = '그 일은 <b>이미 쌓여 있어요.</b> 판은 그대로예요.';
const NK_ALREADY_O = '그 기관은 <b>이미 세웠어요.</b> 판은 그대로예요.';
const NK_ORDER_O = '먼저 <b>나랏일 셋</b>을 모두 판에 올려 봐요.';
/* 받침 처리 \u2014 안내문에 「을(를)」 병기가 남지 않게 한다 */
function nkJ(s){ const c=s.charCodeAt(s.length-1); return (c>=0xAC00&&c<=0xD7A3) ? ((c-0xAC00)%28!==0) : false; }

/* ★ NK_OWNER를 읽는 자리는 여기 한 곳뿐이다. */
function nkOwnerOf(j){ return NK_OWNER[j]; }
/* 세운 기관이 맡는 일의 자리를 모은다 \u2014 이 함수 밖에서는 대응을 알 길이 없다. */
function nkOrgMask(st){ let m=0; for(let j=0;j<NK_N;j++){ if(st.nkOrg & (1<<j)) m |= 1<<nkOwnerOf(j); } return m; }
/* ★ 이 한 줄이 이 패턴의 핵심 신규성이다 \u2014 처리된 일을 따로 담는 상태가 없고,
   처리된 것은 언제나 **쌓인 일과 세운 기관에서 그대로 읽힌다.**
   그래서 기관을 세우는 걸음이 **이미 지나간 걸음**에 소급해 작용한다. */
function nkDone(st){ return st.nkPile & nkOrgMask(st); }
function nkWait(st){ return st.nkPile & ~nkOrgMask(st); }
function nkBits(m){ const r=[]; for(let k=0;k<NK_N;k++){ if(m & (1<<k)) r.push(k); } return r; }
function nkAllPiled(st){ return st.nkPile === (1<<NK_N)-1; }
function nkAllOrg(st){ return st.nkOrg === (1<<NK_N)-1; }

/* 판 \u2014 위는 국가기관 세 자리(세우기 전에는 비어 있다), 아래는 나랏일 세 줄.
   ⚠️ 일 줄을 그리는 자리는 **여기 한 곳뿐**이고, 처리됐는지는 `nkDone`이 정한다. */
function nkCanvas(st){
  const done = nkDone(st), wait = nkWait(st), orgn = nkBits(st.nkOrg).length;
  const dn = nkBits(done).length, wn = nkBits(wait).length;
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = st.nkFin!=null ? '나랏일을 맡아 하는 곳이 하는 일에 따라 나눠져 있어요'
    : (nkAllOrg(st) ? '세 기관이 서고 쌓였던 일이 모두 처리됐어요'
      : (nkAllPiled(st) ? '기관을 세우면 쌓여 있던 일 가운데 그 기관이 맡을 일이 처리돼요'
        : '아직 맡아 하는 곳이 없어요 \u2014 올린 일은 그대로 쌓여요'));
  g+=`<text x="160" y="21" font-size="10.2" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  g+=`<text x="20" y="37" font-size="8.6" fill="#B45309" font-weight="800">국가기관 \u2014 세운 곳 ${orgn} / ${NK_N}</text>`;
  for(let j=0;j<NK_N;j++){
    const built = !!(st.nkOrg & (1<<j)), x = 12 + j*100;
    g+=`<rect data-org="${j}" data-built="${built?1:0}" x="${x}" y="${42}" width="96" height="52" rx="8" fill="${built?'#fff':'#F8FAFC'}" stroke="${built?'#C2410C':'#CBD5E0'}" stroke-width="${built?1.8:1.2}"${built?'':' stroke-dasharray="4 3"'}/>`;
    if(built){
      g+=`<rect x="${x+20}" y="52" width="56" height="7" rx="2" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.1"/>`;
      g+=`<path d="M${x+26} 59 L${x+26} 74 M${x+38} 59 L${x+38} 74 M${x+50} 59 L${x+50} 74 M${x+62} 59 L${x+62} 74" stroke="#EA580C" stroke-width="1.3"/>`;
      g+=`<text x="${x+48}" y="88" font-size="9" fill="#9A3412" text-anchor="middle" font-weight="800">${NK_ORG[j]}</text>`;
    } else {
      g+=`<text x="${x+48}" y="66" font-size="8" fill="#94A3B8" text-anchor="middle" font-weight="800">아직</text>`;
      g+=`<text x="${x+48}" y="80" font-size="8" fill="#94A3B8" text-anchor="middle" font-weight="800">세우지 않았어요</text>`;
    }
  }
  g+=`<text x="20" y="112" font-size="8.6" fill="#B45309" font-weight="800">나랏일 \u2014 처리된 일 ${dn} \u00B7 쌓인 일 ${wn}</text>`;
  for(let k=0;k<NK_N;k++){
    const piled = !!(st.nkPile & (1<<k)), fin = !!(done & (1<<k));
    const y = 118 + k*40;
    g+=`<rect data-job="${k}" data-pile="${piled?1:0}" data-done="${fin?1:0}" x="14" y="${y}" width="292" height="34" rx="7" fill="${fin?'#fff':(piled?'#FFF7ED':'#F8FAFC')}" stroke="${fin?'#C2410C':(piled?'#FDBA74':'#CBD5E0')}" stroke-width="${fin?1.8:1.3}"${piled?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="160" y="${y+14}" font-size="8" fill="${fin?'#9A3412':(piled?'#B45309':'#94A3B8')}" text-anchor="middle" font-weight="800">${piled?NK_JOB_S[k]:'아직 올리지 않았어요'}</text>`;
    if(fin){
      const j = nkBits(st.nkOrg).filter(o=>nkOwnerOf(o)===k)[0];
      g+=`<text x="160" y="${y+27}" font-size="6.8" fill="#9A3412" text-anchor="middle" font-weight="700">\u300C${NK_ORG[j]}\u300D${nkJ(NK_ORG[j])?'\uC774':'\uAC00'} 맡아 처리했어요</text>`;
    } else if(piled){
      g+=`<text x="160" y="${y+27}" font-size="6.8" fill="#B45309" text-anchor="middle" font-weight="700">맡아 하는 곳이 없어 그대로 쌓여 있어요</text>`;
    } else {
      g+=`<text x="160" y="${y+27}" font-size="6.6" fill="#CBD5E0" text-anchor="middle" font-weight="700">\u00B7</text>`;
    }
  }
  g+=`<rect data-orgn="${orgn}" data-donen="${dn}" data-waitn="${wn}" x="14" y="118" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function nkPanel(st){
  const fin = st.nkFin!=null, allP = nkAllPiled(st), allO = nkAllOrg(st), cased = st.nkCase!=null;
  const q = fin
    ? '나랏일은 사라지지 않았어요. <b>맡아 하는 곳</b>이 생기자 그 자리에서 처리됐어요.'
    : (cased ? '<b>국가기관이 있는 까닭</b>은 무엇일까요?'
      : (allO ? '<b>[스스로 활동]</b> 어린이 보호 구역에 과속 단속 카메라를 설치하라고 지시한 곳은 어디일까요?'
        : (allP ? '<b>국가기관을 세워</b> 봐요. 쌓여 있던 일 가운데 그 기관이 맡을 일이 처리돼요.'
          : '나랏일을 판에 올려 봐요. 이 자리에는 <b>정답이 없어요</b> \u2014 어느 일부터 올려도 돼요.')));
  let right = `<div class="nk-q">${q}</div>`;

  if(fin){
    right+=`<div class="dw-card"><div class="pt">\uD83C\uDFDB\uFE0F 쌓인 일은 왜 나중에 처리됐을까요</div>
      <div>처음에 일이 쌓이기만 한 것은 판이 막았기 때문이 아니에요. <b>맡아 하는 곳이 아직 없었기 때문</b>이에요.</div>
      <div style="margin-top:5px">기관을 세우자 <b>앞서 쌓여 있던 일</b>이 그 자리에서 처리됐어요. 나랏일은 사라지지 않고 기다리고 있었어요.</div>
      <div style="margin-top:5px;color:#64748B">국회\u00B7행정부\u00B7법원이 하는 일을 <b>더 자세히</b> 알아보는 것은 다음 시간부터예요.</div></div>`;
  } else if(cased){
    right+=`<div class="nk-fin">${NK_FIN.map((f,k)=>
      `<button class="${st.nkWrongF===k?'no':''}" onclick="nkFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(allO){
    right+=`<div class="dw-step">\uD83D\uDEA6 스스로 활동 \u2014 어린이 보호 구역</div>`;
    right+=`<div class="nk-note">어린이 보호 구역에서 교통사고가 일어나자 국가기관들이 저마다 할 일을 했어요.</div>`;
    right+=`<div class="nk-fin">${NK_CASE.map((s,k)=>
      `<button class="${st.nkWrongC===k?'no':''}" onclick="nkPickCase(${k})">${s}</button>`).join('')}</div>`;
  } else if(allP){
    right+=`<div class="dw-step">\uD83C\uDFDB\uFE0F 국가기관 세우기</div>`;
    right+=`<div class="nk-none"><b>기관이 없으면?</b><br>\u00B7 ${NK_NONE.join('<br>\u00B7 ')}</div>`;
    right+=`<div class="nk-list">${NK_ORG.map((o,j)=>{
      const on = !!(st.nkOrg & (1<<j));
      return `<button class="${on?'ok':''}${st.nkWrongO===j?' no':''}" onclick="nkBuild(${j})">${on?'\u2713 ':''}${o} \u2014 ${NK_ORG_DO[j]}</button>`;
    }).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">\uD83D\uDCCB 나랏일 올리기</div>`;
    right+=`<div class="nk-list">${NK_JOB.map((t,k)=>{
      const on = !!(st.nkPile & (1<<k));
      return `<button class="${on?'ok':''}${st.nkWrongJ===k?' no':''}" onclick="nkPut(${k})">${on?'\u2713 ':''}${t}</button>`;
    }).join('')}</div>`;
  }
  if(st.nkMsg) right+=`<div class="dw-msg${st.nkWarn?' warn':''}">${st.nkMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDFDB\uFE0F 맡아 하는 곳이 생겨야 일이 처리돼요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${nkCanvas(st)}<div class="cvcap">판의 「기관이 없는 자리」는 실제 나라가 아니라, 없으면 어떻게 되는지 살펴보는 자리예요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const LS_KEY = "kedu_progress_g6_social_u2_l05";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  nkPile:0, nkOrg:0, nkCase:null, nkFin:null,
  nkWrongJ:null, nkWrongO:null, nkWrongC:null, nkWrongF:null,
  nkMsg:null, nkWarn:false, nkBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function nkRender(){ main.innerHTML = slides[state.idx].render(state); }
function nkHold(msg){
  state.nkWarn=true; state.nkBusy=true; state.nkMsg=msg;
  playThud(); nkRender();
  setTimeout(()=>{ state.nkBusy=false; state.nkWarn=false; state.nkMsg=null;
    state.nkWrongJ=null; state.nkWrongO=null; state.nkWrongC=null; state.nkWrongF=null; nkRender(); },1600);
}

/* ① 나랏일 올리기 — ⚠️ 판정 0. 어느 일부터 올려도 되고, 옳고 그름이 없다.
   ★ 이 자리에서는 어떤 일도 처리되지 않는다 — 판이 막아서가 아니라 맡을 곳이 아직 없기 때문이다. */
function nkPut(k){
  if(state.nkFin!=null) return;                                        // 가드①
  if(state.nkBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=NK_N) return;                   // 가드②
  if(state.nkPile & (1<<k)){                                           // 가드③ 이미 쌓은 일 — 판 불변
    state.nkWrongJ=k; nkHold(NK_ALREADY_J); return; }
  state.nkPile |= 1<<k; state.nkWrongJ=null; state.nkWarn=false;
  const jjo = nkJ(NK_JOB_S[k]) ? '\uC774' : '\uAC00';
  state.nkMsg = nkAllPiled(state)
    ? `<b>\u300C${NK_JOB_S[k]}\u300D</b>${jjo} 판에 올라왔어요. 세 가지 일이 <b>모두</b> 쌓였는데 <b>처리된 것은 하나도 없어요</b> \u2014 맡아 하는 곳이 없기 때문이에요.`
    : `<b>\u300C${NK_JOB_S[k]}\u300D</b>${jjo} 판에 올라왔어요. 그런데 맡아 하는 곳이 없어서 <b>그대로 쌓였어요.</b>`;
  if(nkAllPiled(state)) playChime(); else playBlip();
  nkRender();
}

/* ② 국가기관 세우기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   기관을 세우는 걸음이 **이미 지나간 걸음**(앞서 쌓인 일)에 소급해 작용한다.
   ⚠️ 처리된 일을 따로 담지 않는다 — 처리는 `nkDone`이 쌓인 일과 세운 기관에서 그대로 읽는다. */
function nkBuild(j){
  if(state.nkFin!=null) return;                                        // 가드①
  if(state.nkBusy) return;                                             // 가드⑨
  if(!Number.isInteger(j) || j<0 || j>=NK_N) return;                   // 가드②
  if(!nkAllPiled(state)){                                              // 가드④ 순서 — 판 불변
    state.nkWrongO=j; nkHold(NK_ORDER_O); return; }
  if(state.nkOrg & (1<<j)){                                            // 가드⑤ 이미 세운 기관 — 판 불변
    state.nkWrongO=j; nkHold(NK_ALREADY_O); return; }
  state.nkOrg |= 1<<j; state.nkWrongO=null; state.nkWarn=false;
  const k = nkOwnerOf(j);
  const ojo = nkJ(NK_ORG[j]) ? '\uC744' : '\uB97C', jjo = nkJ(NK_JOB_S[k]) ? '\uC774' : '\uAC00';
  state.nkMsg = nkAllOrg(state)
    ? `<b>\u300C${NK_ORG[j]}\u300D</b>${ojo} 세우자 쌓여 있던 <b>\u300C${NK_JOB_S[k]}\u300D</b>${jjo} 처리됐어요 \u2014 ${NK_ORG_DID[k]} 세 기관이 <b>모두</b> 섰어요.`
    : `<b>\u300C${NK_ORG[j]}\u300D</b>${ojo} 세우자 <b>앞서 쌓여 있던</b> \u300C${NK_JOB_S[k]}\u300D${jjo} 그 자리에서 처리됐어요 \u2014 ${NK_ORG_DID[k]}`;
  if(nkAllOrg(state)) playChime(); else playBlip();
  nkRender();
}

/* ③ [스스로 활동] 어린이 보호 구역 */
function nkPickCase(k){
  if(state.nkFin!=null) return;                                        // 가드①
  if(state.nkBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=NK_CASE.length) return;         // 가드②
  if(!nkAllOrg(state)) return;                                         // 가드⑥ 세 기관 전 무시(순서)
  if(state.nkCase!=null) return;                                       // 가드⑦ 확정 뒤 재선택 무시
  if(k===NK_CASE_OK){
    state.nkCase=k; state.nkWrongC=null; state.nkWarn=false;
    state.nkMsg = '<b>행정부</b>는 어린이 보호 구역에 과속 단속 카메라를 설치하라고 지시했어요. 법을 바탕으로 <b>나라의 일을 집행하는 곳</b>이에요.';
    playChime(); nkRender(); return;
  }
  state.nkWrongC=k;
  nkHold(NK_CASE_NO[k]);
}

/* ④ 마무리 — 「국가기관이 있는 까닭」 */
function nkFinish(k){
  if(state.nkFin!=null) return;                                        // 가드①
  if(state.nkBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=NK_FIN.length) return;          // 가드②
  if(state.nkCase==null) return;                                       // 가드⑧ [스스로 활동] 전 무시(순서)
  if(k===NK_FIN_OK){
    state.nkFin=k; state.nkWrongF=null; state.nkMsg=null; state.nkWarn=false;
    playChime(); nkRender(); return;
  }
  state.nkWrongF=k;
  nkHold(NK_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l06_법이되기까지.html'; } // l06 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

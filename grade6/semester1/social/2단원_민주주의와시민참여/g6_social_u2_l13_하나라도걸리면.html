직접조작: 자리마다 같은 답이 다른 뜻을 갖는 판 · 맞히는 것과 안심하는 것이 서로 다른 일인 형
  (59번째 신규 패턴)
  ⭐ 앞의 쉰여덟 종에서 **판이 받는 답은 자리가 달라도 뜻이 같았다** — 맞으면 판이 나아갔고 어긋나면
     그대로였다. 50번째(잣대를 세워야 걸러지는 판)에서 잣대를 세우면 언제나 걸러진 것이 늘었고,

     맞히는 일과 판이 좋아지는 일은 **늘 같은 방향**이었다. 이번만 **똑같은 「그렇다」가 한 자리에서는
     의심 표를 올리고 다른 자리에서는 올리지 않는다.** 판이 「맞았어요」라고 말한 그 자리에서
     의심 표가 오른다 — **맞히는 것과 안심하는 것이 서로 다른 일이다.**
  ⭐ 근거는 교과서 106쪽 [할 수 있어요] 검토표가 네 기준을 **같은 「그렇다 / 그렇지 않다」로** 묻는데
     그 답이 뜻하는 바가 자리마다 다르다는 것이다. ㉮ 「뉴스 형식을 흉내 내고 있나요 → 그렇다」는
     걸리는 자리이고, ㉯ 「글을 작성한 사람과 날짜가 정확하게 제시되어 있나요 → 그렇다」는 걸리지
     않는 자리다. 그래서 **작성자와 날짜가 또렷한 글도 허위 조작 정보일 수 있다.**
  ⭐ **56번째와의 대비** — 거기서 줄어드는 것은 판이 묻는 **물음의 수**였고 신규성은 「걷어 내야
     답이 나온다」는 데 있었다. 여기서 물음의 수는 넷으로 처음부터 끝까지 고정이고, 달라지는 것은
     **같은 답이 자리마다 갖는 뜻**이다.
  ⭐ **안심 표는 아무리 쌓여도 결론을 만들지 못하고, 의심 표는 하나만으로 결론을 만든다** —
     판단 처리기(`ckDecide`) 본문에 **안심 표를 읽는 자리가 없다**(구조로 대조). 그리고 한 번 오른
     의심 표는 뒤에 안심 표가 올라도 **되돌아오지 않는다**(채운 자리를 줄이는 곳이 코드에 0).
  ⭐ **어느 자리가 걸리는 자리인지를 따로 담는 상태가 코드에 아예 없다** — `CK_DM` 한 줄이 그것을
     다 정하고, 그 상수를 읽는 자리도 `ckDoubt` **단 하나**다(`ckSafeMask`는 `ckDoubt`를 거친다).
  ⭐ **판이 어느 자리가 걸리는 자리인지 미리 알려 주지 않는다** — 답하기 전 판의 표 칸은 전부 비어
     있고, 기준 줄에도 걸림 표시가 없다(미리 노출 0을 시점 전수로 대조).
  ① **기준 네 줄에 답 달기**(순서 자유 · 판정 있음 · 맞히면 그 줄이 채워지고 ★ 의심 표가 오르거나

  ⚠️ 기준·답·표 전량 고정 리터럴 — 난수 0.

     ③ 네 줄을 다 채우기 전 판단 무시(순서) — 판 불변 / ④ 이미 답한 줄 재클릭 무시 — 판 불변 /

⚠️ 정직 원칙 네 곳
  ㉠ **판에 놓인 게시 글은 교과서 106쪽 게시 글의 「형식」을 옮긴 자리이지 실제로 있었던 일이
     아니다**(캔버스 캡션). 그 글이 **무엇을 두고 무슨 주장을 했는지는 화면에 옮기지 않았다** —
     어떤 동물을 두고 「모두 사라지도록 해야 한다」고 말하는 글이라 정서 가드에 걸린다. 그 글은
     교실에서 교과서를 펴고 함께 읽는다(완료 카드 명시).
  ㉡ **[미디어 활동] 105쪽 신문 기사의 실제 사례는 화면에 옮기지 않는다** — 실제 유명인과 다른
     나라의 실제 선거에 관한 일이라, 자기주도 화면에는 지도서 예시 답안이 정리한 **주의하는 방법
     ㉠㉡㉢**까지만 옮긴다(슬라이드 명시).
  ㉢ **[할 수 있어요] 실제로 미디어를 검색해 자료를 찾고 그 결과를 친구들과 서로 검토하는 활동은
     교실 몫**이다. 화면이 다루는 자리는 **네 기준을 어떻게 적용하는가**까지다(완료 카드 명시).
  ㉣ **[스스로 활동] 이용 습관 점검표와 「나의 다짐」은 학생이 직접 쓰는 것**이라 화면이 대신하지
     않는다(리빌 예시 답안에 「내 다짐은 내가 직접 적어요」 병기).

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:11px 15px;
  font-size:clamp(13px,2.2vw,16.5px);line-height:1.6}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 자리마다 같은 답이 다른 뜻을 갖는 판 */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.ck-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:var(--bub);border-radius:9px;padding:7px 11px;line-height:1.45}
.ck-fin{display:flex;flex-direction:column;gap:5px}
.ck-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.ck-fin button:hover{background:var(--bub)}
.ck-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.ck-act{display:flex;flex-direction:column;gap:5px}
.ck-act button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.ck-act button:hover{border-color:var(--green);background:var(--bub)}
.ck-act button.a2{border-color:var(--amber);background:#FFFBEB;color:#B45309}
.ck-act button.a3{border-color:var(--cyan);background:#FFF7ED;color:var(--green-d)}
.ck-act button.a4{border-style:dashed}
.ck-rows{display:flex;flex-direction:column;gap:5px}
.ck-row{border:2px solid #CBD5E0;border-radius:10px;padding:6px 8px;background:#fff}
.ck-row.done{border-color:var(--cyan);background:#FFF7ED}
.ck-row.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.ck-rq{font-size:clamp(10.2px,1.73vw,12.2px);font-weight:700;color:#334155;line-height:1.45;margin-bottom:4px}
.ck-yn{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ck-yn button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:5px 6px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--ink);font-size:clamp(10px,1.7vw,12.2px)}
.ck-yn button:hover{border-color:var(--green);background:var(--bub)}
.ck-done{display:flex;justify-content:space-between;gap:6px;font-size:clamp(9.8px,1.66vw,11.8px);font-weight:800}
.ck-done .a{color:var(--green-d)}
.ck-done .m{color:#B45309}
.ck-done .m.safe{color:#166534}
.ck-judge{display:flex;flex-direction:column;gap:5px}
.ck-judge button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.ck-judge button:hover{background:var(--bub)}
.ck-judge button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.ck-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.ck-keynote{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.ck-keynote b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ===== 직접조작 — 자리마다 같은 답이 다른 뜻을 갖는 판(59번째 신규 패턴) =====
   ⭐ 앞의 쉰여덟 종에서 **판이 받는 답은 자리가 달라도 뜻이 같았다.** 이번만 **똑같은 「그렇다」가
      한 자리에서는 의심 표를 올리고 다른 자리에서는 올리지 않는다** — 맞히는 것과 안심하는 것이
      서로 다른 일이다.
   ⭐ **안심 표는 아무리 쌓여도 결론을 만들지 못하고, 의심 표는 하나만으로 결론을 만든다**
      (`ckDecide` 본문에 안심 표를 읽는 자리가 없다 — 구조로 대조).
   ⭐ **어느 자리가 걸리는 자리인지를 따로 담는 상태가 코드에 아예 없다** — `CK_DM` 한 줄이 다 정하고
      그 상수를 읽는 자리도 `ckDoubt` 단 하나다.
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */

const CK_N = 4;
/* 교과서 106쪽 [할 수 있어요] 검토 기준 넷 — 원문 */
const CK_Q = [
  '「속보」, 「단독 보도」 등으로 뉴스 형식을 흉내 내고 있나요?',
  '글을 작성한 사람과 날짜가 정확하게 제시되어 있나요?',
  '믿을 만한 출처에서 얻은 정보를 제시하고 있나요?',
  '주장을 뒷받침하는 근거가 타당한가요?'];
const CK_Q_S = ['뉴스 형식을 흉내 냈나요','글쓴이와 날짜가 있나요','믿을 만한 출처인가요','근거가 타당한가요'];
/* 이 게시 글에 대한 답 — 1 = 그렇다 · 0 = 그렇지 않다 */
const CK_ANS = [1,1,0,0];
const CK_ANS_S = ['그렇지 않다','그렇다'];
/* ★ 이 한 줄이 「어느 자리의 답이 의심 표를 올리는가」를 다 정한다.
   ㉮ 흉내 냈다 → 걸린다 / ㉯ 글쓴이와 날짜가 있다 → 걸리지 않는다 / ㉰ 출처가 아니다 → 걸린다 /
   ㉱ 근거가 타당하지 않다 → 걸린다. */
const CK_DM = 0b1101;
/* 판에 놓인 게시 글 — 교과서 106쪽 게시 글의 **형식**을 옮긴 자리(무슨 주장을 했는지는 옮기지 않았다). */
const CK_PIECE = ['㉮ 「긴급 속보!」로 시작하는 제목이 붙어 있어요',
  '㉯ 글쓴이의 이름과 올린 날짜가 또렷이 적혀 있어요',
  '㉰ 「우리 동네에 도는 소문에 따르면」이라고만 적혀 있어요',
  '㉱ 주장은 세게 하는데 뒷받침하는 것은 그 소문뿐이에요'];
/* ② 판단하기 */
const CK_J = ['🙂 믿고 그대로 다른 사람에게 공유해요','🔎 의심하고 다른 자료로 확인해요'];
/* ③ 마무리 — 지도서 「17~18차시 주요 내용 정리」 2 원문 */
const CK_FIN = ['미디어의 내용은 모두 거짓이니 아예 이용하지 않아요',
  '미디어의 내용을 무조건 믿지 않고 의심하며, 맞춤형으로 제공되는 정보만 이용하지 않아요',
  '내 관점에 맞는 정보만 골라 보고 다른 정보는 무시해요'];
const CK_FIN_OK = 1;
const CK_FIN_NO = ['미디어에는 우리에게 <b>필요한 정보</b>도 있어요. 이용하지 않는 것이 아니라 <b>따져 보고</b> 이용해요.',
  '',
  '내 관점에 맞는 정보만 보면 <b>편견이 강해져요.</b> 다양한 관점을 <b>균형 있게</b> 살펴봐요.'];
/* 안내 — 어긋난 답에는 왜 그런지만 말하고 다른 자리의 답을 흘리지 않는다. */
const CK_NO = ['제목을 다시 봐요. <b>「긴급 속보!」</b>로 시작하고 있어요. 판은 그대로예요.',
  '글쓴이의 <b>이름과 날짜</b>가 또렷이 적혀 있어요. 판은 그대로예요.',
  '적힌 것은 <b>동네에 도는 소문</b>뿐이에요. 판은 그대로예요.',
  '뒷받침하는 것이 <b>그 소문뿐</b>이에요. 판은 그대로예요.'];
const CK_ALREADY = '이 줄은 <b>이미 답했어요.</b> 판은 그대로예요.';
const CK_LOCK_J = '이미 <b>판단을 정했어요.</b> 판은 그대로예요.';
const CK_ORDER_C = '아직 <b>답하지 않은 줄</b>이 있어요. 네 줄을 다 채운 뒤에 판단해요. 판은 그대로예요.';
const CK_ORDER_F = '아직 <b>판단하지 않았어요.</b> 먼저 판단하기를 눌러 봐요. 판은 그대로예요.';
const CK_TRUST_NO = '걸린 자리가 <b>남아 있어요.</b> 안심 표가 아무리 많아도 <b>하나라도 걸리면</b> 그대로 믿을 수 없어요. 판은 그대로예요.';

/* ★ 이 한 줄이 「지금 걸린 자리가 어디인가」를 다 정한다. 걸림을 따로 담는 상태는 코드에 없다. */
function ckDoubt(st){ return st.ckMark & CK_DM; }
/* ★ 이 한 줄이 「그 자리가 걸리는 자리인가」를 다 정한다 — 판·패널·처리기는 모두 이 줄을 거친다. */
function ckIsDoubt(i){ return ((CK_DM >> i) & 1) === 1; }
/* 안심 자리 — ⚠️ `CK_DM`을 다시 읽지 않고 `ckDoubt`를 거친다. */
function ckSafeMask(st){ return st.ckMark ^ ckDoubt(st); }
function ckBits(m){ let n=0; for(let k=0;k<CK_N;k++){ if(m & (1<<k)) n++; } return n; }
function ckReady(st){ return ckBits(st.ckMark) >= CK_N; }

/* 판 — 위는 게시 글 네 조각, 가운데는 기준 네 줄과 표, 아래는 결론.
   ⚠️ 걸림 표시를 그리는 자리는 **여기 한 곳뿐**이고, 답하기 전에는 어느 자리가 걸리는 자리인지
      판이 알려 주지 않는다. */
function ckCanvas(st){
  const fin = st.ckFin!=null, judged = st.ckJudge!=null;
  const dn = ckBits(ckDoubt(st)), sn = ckBits(ckSafeMask(st)), filled = ckBits(st.ckMark);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="268" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = fin ? '하나라도 걸리면 따져 봐야 해요'
    : (judged ? '의심하고 다른 자료로 확인했어요'
      : (ckReady(st) ? '네 줄을 다 채웠어요 — 이제 판단해요'
        : (dn>0 ? '걸린 자리가 생겼어요' : '기준에 하나씩 답해 봐요')));
  g+=`<text x="160" y="19" font-size="9.4" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  g+=`<rect x="12" y="26" width="296" height="56" rx="8" fill="#fff" stroke="#C2410C" stroke-width="1.8"/>`;
  for(let p=0;p<CK_N;p++){
    g+=`<text data-piece="${p}" x="20" y="${39+p*13}" font-size="6.6" fill="#334155" font-weight="700">${CK_PIECE[p]}</text>`;
  }
  for(let i=0;i<CK_N;i++){
    const m = !!(st.ckMark & (1<<i)), dm = m && ckIsDoubt(i), y = 88 + i*28;
    g+=`<rect data-row="${i}" data-marked="${m?1:0}" data-doubt="${dm?1:0}" x="12" y="${y}" width="296" height="24" rx="7" fill="${m?'#fff':'#F8FAFC'}" stroke="${m?'#C2410C':'#CBD5E0'}" stroke-width="${m?1.7:1.1}"${m?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="20" y="${y+15}" font-size="6.8" fill="${m?'#9A3412':'#94A3B8'}" font-weight="800">${i+1}. ${CK_Q_S[i]}</text>`;
    g+=`<rect x="176" y="${y+4}" width="60" height="16" rx="6" fill="${m?'#FFEDD5':'#F1F5F9'}"/>`;
    g+=`<text x="206" y="${y+15}" font-size="6.4" fill="${m?'#9A3412':'#CBD5E0'}" text-anchor="middle" font-weight="800">${m?CK_ANS_S[CK_ANS[i]]:'아직'}</text>`;
    g+=`<rect x="242" y="${y+4}" width="58" height="16" rx="6" fill="${m?(dm?'#FFFDF5':'#DCFCE7'):'#F1F5F9'}" stroke="${m?(dm?'#B45309':'#16A34A'):'#E2E8F0'}" stroke-width="1.1"/>`;
    g+=`<text x="271" y="${y+15}" font-size="6.2" fill="${m?(dm?'#8A6D3B':'#166534'):'#CBD5E0'}" text-anchor="middle" font-weight="800">${m?(dm?'걸려요':'괜찮아요'):'—'}</text>`;
  }
  g+=`<rect x="12" y="202" width="296" height="20" rx="7" fill="${dn>0?'#FFFDF5':'#fff'}" stroke="${dn>0?'#B45309':'#CBD5E0'}" stroke-width="1.3"/>`;
  g+=`<text data-doubtn="${dn}" data-safen="${sn}" x="160" y="216" font-size="7.2" fill="${dn>0?'#8A6D3B':'#94A3B8'}" text-anchor="middle" font-weight="800">걸린 자리 ${dn} · 괜찮은 자리 ${sn} · 답한 줄 ${filled} / ${CK_N}</text>`;
  const vd = dn>0 ? 1 : 0;
  g+=`<rect data-verdict="${vd}" data-judge="${judged?st.ckJudge:-1}" x="12" y="226" width="296" height="26" rx="7" fill="${vd?'#FFEDD5':'#F8FAFC'}" stroke="${vd?'#C2410C':'#E2E8F0'}" stroke-width="${vd?2:1.1}"${vd?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text x="160" y="243" font-size="7.6" fill="${vd?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${vd?'하나라도 걸렸어요 — 따져 봐야 해요':'아직 걸린 자리가 없어요'}</text>`;
  g+=`<rect x="12" y="256" width="296" height="16" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.1"/>`;
  g+=`<text x="160" y="267" font-size="6.4" fill="#9A3412" text-anchor="middle" font-weight="800">괜찮은 자리가 늘어도 걸린 자리는 되돌아오지 않아요</text>`;
  return `<svg viewBox="0 0 320 280"><rect width="320" height="280" fill="#ffffff"/>${g}</svg>`;
}

function ckPanel(st){
  const fin = st.ckFin!=null, judged = st.ckJudge!=null;
  const q = fin

function questionHTML(q,i,st){

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function ckRender(){ main.innerHTML = slides[state.idx].render(state); }
function ckHold(msg){
  state.ckWarn=true; state.ckBusy=true; state.ckMsg=msg;
  playThud(); ckRender();
  setTimeout(()=>{ state.ckBusy=false; state.ckWarn=false; state.ckMsg=null;
    state.ckWrongC=null; state.ckWrongJ=null; state.ckWrongF=null; ckRender(); },1600);
}

/* ① 기준 한 줄에 답 달기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   판정은 자리마다 있지만 **맞혔다고 안심 표가 되는 것은 아니다.** 같은 「그렇다」가
   ㉮ 자리에서는 의심 표를 올리고 ㉯ 자리에서는 올리지 않는다.
   ⚠️ 순서 자유 — 어느 줄부터 답해도 좋다. */
function ckAsk(i,v){
  if(state.ckFin!=null) return;                                        // 가드①
  if(state.ckBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=CK_N) return;                   // 가드②
  if(!Number.isInteger(v) || v<0 || v>1) return;                       // 가드②
  if(state.ckJudge!=null){ ckHold(CK_LOCK_J); return; }                // 가드⑦ 판 불변
  if(state.ckMark & (1<<i)){ ckHold(CK_ALREADY); return; }             // 가드④ 판 불변
  if(v !== CK_ANS[i]){ state.ckWrongC=i; ckHold(CK_NO[i]); return; }   // 가드⑧ 판 불변
  state.ckMark |= 1 << i;                                              // ★ 채우는 자리는 여기 한 곳뿐
  state.ckWarn=false; state.ckWrongC=null;
  const doubt = ckIsDoubt(i);
  state.ckMsg = doubt
    ? `<b>맞았어요.</b> 그런데 이 자리는 <b>걸리는 자리</b>예요 — 의심 표가 하나 올랐어요. 지금 <b>${ckBits(ckDoubt(state))} / ${CK_N}</b>이에요.`
    : `<b>맞았어요.</b> 이 자리는 <b>걸리지 않는 자리</b>예요 — 의심 표가 오르지 않았어요. 맞히는 것과 안심하는 것은 <b>다른 일</b>이에요.`;
  playBlip(); ckRender();
}

/* ② 판단하기 — ★ 의심 표가 하나라도 있으면 「믿고 그대로 공유해요」를 판이 받지 않는다(핵심 가드).
   ⚠️ 이 본문은 **안심 표를 읽지 않는다** — 안심 표는 아무리 쌓여도 결론을 만들지 못한다. */
function ckDecide(k){
  if(state.ckFin!=null) return;                                        // 가드①
  if(state.ckBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=CK_J.length) return;            // 가드②
  if(!ckReady(state)){ ckHold(CK_ORDER_C); return; }                   // 가드③ 순서 — 판 불변
  if(state.ckJudge!=null){ ckHold(CK_LOCK_J); return; }                // 가드⑦ 판 불변
  if(k===0 && ckDoubt(state)!==0){ state.ckWrongJ=k; ckHold(CK_TRUST_NO); return; } // 가드⑤ ★핵심 — 판 불변
  state.ckJudge=k; state.ckWrongJ=null; state.ckWarn=false;
  state.ckMsg = `<b>의심하고 다른 자료로 확인하기로 했어요.</b> 걸린 자리가 <b>${ckBits(ckDoubt(state))}</b>이었어요. 괜찮은 자리가 있었지만 결론은 되돌아오지 않았어요.`;
  playChime(); ckRender();
}

/* ③ 마무리 — 「미디어를 올바르게 이용하려면 어떤 태도가 필요할까요?」
   (지도서 「17~18차시 주요 내용 정리」 2 원문) */
function ckFinish(k){
  if(state.ckFin!=null) return;                                        // 가드①
  if(state.ckBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=CK_FIN.length) return;          // 가드②
  if(state.ckJudge==null){ ckHold(CK_ORDER_F); return; }               // 가드⑥ 순서 — 판 불변
  if(k===CK_FIN_OK){
    state.ckFin=k; state.ckWrongF=null; state.ckMsg=null; state.ckWarn=false;
    playChime(); ckRender(); return;
  }
  state.ckWrongF=k;
  ckHold(CK_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l14_골라실어요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

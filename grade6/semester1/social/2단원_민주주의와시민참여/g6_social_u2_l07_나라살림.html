⚠️ 엔진은 대단원1 l01~l11 · 대단원2 l01~l06에서 100% 승계. 2단원 색 #C2410C 유지 · CSS 변수명 무수정.

⚠️ 파일명을 `나라살림`으로 지었다(배선 예외 대신). l06이 「국무총리」·「행정 각부」를 개수 0으로 재고
   있어서 파일명에 그 낱말이 들어가면 재배선이 곧바로 그 가드를 깨뜨린다. 겹치지 않는 이름을 골라
   예외를 만들지 않았다(l05 `나랏일` · l06 `법이되기까지` 선례 승계).

직접조작: 자리가 비어도 일이 옮겨 가는 판(53번째 신규 패턴 — 한 자리의 몫을 다른 자리가 대신 지는 형)
  ⭐ 앞의 쉰두 종에서 **자리가 비면 그 자리의 몫도 함께 비었다.** 47번째(첫 길이 막히는 판)에서
     회의장 자리가 차서 길이 닫혔을 때 그 자리에서 할 일도 함께 없어졌고, 51번째(맡을 곳이 없으면
     일이 쌓이는 판)에서 맡을 곳이 없는 일은 **누구에게도 가지 않고 그대로 쌓였다.**
     이번만 **자리가 비어도 그 자리의 일이 사라지지 않고 옆자리로 옮겨 간다** — 대통령이 임무를
     수행할 수 없는 상황이 되면 국무총리가 대통령의 임무를 대신한다. 근거는 교과서 80쪽 본문 원문
     「대통령이 임무를 수행할 수 없는 상황이 생기면 대통령의 임무를 대신합니다」.
  ⭐ **51번째와의 정면 대비** — 거기서는 맡을 곳이 없어 일이 **쌓였고**(멈췄고), 여기서는 맡을 곳이
     비어도 **대신할 자리가 있어 이어진다.** 나라의 살림은 멈출 수 없기 때문이다.
  ⭐ **46번째(도로 감추는 형)와의 대비** — 거기서는 드러난 것이 **도로 덮였다.** 여기서는 어느
     시점에도 대통령의 일이 판에서 **사라지지 않는다** — 지는 자리만 바뀔 뿐이다.
  ⭐ **대신 맡는 동안에도 국무총리의 본래 몫은 그대로다** — 두 몫을 **함께** 진다. 하나가 다른
     하나를 밀어내지 않는다(스모크가 구조로 대조).
  ⭐ **대통령의 일을 지금 어느 자리가 지고 있는지를 따로 담는 상태가 코드에 아예 없다** —
     `agHolder(st) = st.agAway ? 1 : 0` **한 줄**이 그것을 다 정하고, 그 줄이 코드에 단 하나이며
     `AG_DUTY`를 그리는 자리도 **단 하나**, `AG_OWNER[`를 읽는 자리도 **단 하나**(`agOwnerOf`)다.
  ⭐ **자리를 비우고 되돌리는 데에는 옳고 그름이 없다**(`AG_AWAY_OK` 부재 · 무판정). 교과서가
     「상황이 생기면 대신합니다」라고만 적었으므로 판이 대신 판정하지 않는다. 감점 0.
  ① **행정부를 이루는 자리 3 세우기**(대통령 / 국무총리 / 행정 각부 · 순서 자유 · 무판정 · 교과서 원문)
  ② **카드 뉴스 4장을 행정 각부에 나눠 맡기기**(교과서 [스스로 활동] · 순서 자유 · 판정 있음)
  ③ **대통령 자리가 비는 자리**(무판정 · 비우면 국무총리가 대통령의 일을 대신 지고, 돌아오면 되돌아간다)
  ④ 마무리 3택 = 행정 각부가 하는 일(지도서 핵심 질문 예시 답안 원문)
  ⚠️ 자리·카드·부·3택 전량 고정 리터럴 — 난수 0(`AG_OWNER=[0,3,1,2]` 한 줄이 카드↔부 대응을 통째로 정한다).
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 세 자리를 다 세우기 전 카드 고르기 무시(순서) — 판 불변 / ④ 이미 세운 자리 재클릭 — 판 불변 /
     ⑤ 카드를 고르기 전 부 고르기 무시(순서) — 판 불변 / ⑥ 이미 맡긴 카드 재클릭 — 판 불변 /
     ⑦ 네 일을 다 맡기기 전, 또는 상태와 어긋난 자리 비우기·돌아오기 무시 — 판 불변 /
     ⑧ 자리를 비웠다 돌아오기 전 마무리 무시(순서) / ⑨ 안내 표시 중 재클릭 무시(`agBusy`).

⚠️ 정직 원칙 네 곳
  ㉠ **화면이 [친구와 활동] 행정 각부 조사를 대신하지 않는다.** 진짜 활동은 교실에서 행정 각부
     하나를 골라 하는 일을 조사하고 친구들과 이야기하는 일이고, 판이 다루는 자리는 **업무를 나눠
     맡는 구조**까지다. 완료 카드에 그렇게 적었다.
  ㉡ **각 부가 하는 일을 지어내지 않는다** — 교과서가 부마다 하는 일을 따로 적지 않았으므로 판은
     부 이름과 교과서 [스스로 활동]의 카드 뉴스까지만 쓰고 그 이상 말하지 않는다.
  ㉢ **자리를 비우는 자리에 옳고 그름을 두지 않는다.**
  ㉣ **판의 자리는 실제 나라의 조직도를 그대로 옮긴 것이 아니라 교과서 80~81쪽을 판으로 옮긴
     자리다**(캔버스 캡션에 명시). 교과서 말풍선대로 **행정부 조직은 새로 만들어지거나 조정되고
     이름이 바뀌기도 한다**는 것을 판이 스스로 말한다.

⚠️ 설계 원칙
  · **10차시 침범 0** — 삼심 0 · 법관 0 · 공개 재판 0 · 대법원 0 · 대법원장 0.
    「법원」은 **차시 예고 자리까지**(개수 ≤3), 「판결」은 확인 문항 오답 보기 자리까지(개수 ≤2).
  · **11~12차시 침범 0** — **독재 0 · 균형 0 · 감시 0 · 견제 0** ·
    「권력 분립」은 **META 주제명 한 자리뿐(개수 1 대조)**.
  · **l06 재현 최소** — 법률안 0 · 거부권 0 · 국정 감사 0 · 예산안 0 · 국회의원 0 ·
    「인사 청문회」는 교과서 [꼭 기억해요] 2번 오답 원문 자리까지(개수 ≤2) ·
    「심의」는 교과서 「행정부 최고 심의 기관」 원문 자리까지(개수 ≤4).
  · **주제① 재현 0** — 선거·공약·유권자·후보자·기표소·모의 선거 **전부 0**(교과서 원문 「국민이
    선출한 대통령」의 「선출」은 유지).
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 우리나라의 실제 정당·정치인 0, 실제 대통령 이름 0, 실제 정책·사건·연도 0.
    어느 기관도 나쁜 곳으로 그리지 않는다. 대통령이 자리를 비우는 일을 옳은 일로도 그른 일로도
    그리지 않고, 그 까닭도 교과서가 적은 만큼(「임무를 수행할 수 없는 상황」)까지만 쓴다.
  · 교사용 참고 자료 0 — 참고 도서 다섯 종, 감사원, 국무 조정실·처·청·위원회, 중앙 정부·지방 정부·
    지방 자치 제도, 정기 국회·임시 국회, 국무 회의의 정족수와 심의 항목 수, 어린이 정부 포털·

  · 정서 — 대통령이 자리를 비우는 자리를 무섭거나 큰일 난 일로 그리지 않는다. 사람이 다치거나
    괴로워하는 묘사 0. **학생 이름 0 · 실제 지역 이름 0.**

.ag-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);

.ag-fin{display:flex;flex-direction:column;gap:5px}
.ag-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.ag-fin button:hover{background:var(--bub)}
.ag-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.ag-list{display:flex;flex-direction:column;gap:5px;max-height:206px;overflow-y:auto}
.ag-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.ag-list button:hover{border-color:var(--green);background:var(--bub)}
.ag-list button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.ag-list button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.ag-list button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.ag-push{border:2px solid var(--green);background:var(--bub);color:var(--green-d);border-radius:10px;
  padding:9px 10px;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:clamp(11px,1.87vw,13.4px);text-align:center;line-height:1.4}
.ag-push:hover{background:#FFE4CC}
.ag-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.ag-seatnote{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.ag-seatnote b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

  // 2 살펴보기 — 행정부의 뜻
  gov:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    <text x="160" y="18" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">행정부는 어떤 곳인가요</text>
    <rect x="14" y="30" width="292" height="40" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>

    <text x="160" y="61" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">나라의 살림을 맡아 하는 국가기관</text>

  // 3 살펴보기 — 행정부의 구성(교과서 80쪽)
  org:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="17" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">행정부는 어떻게 이루어질까요</text>

      <rect x="${12+j*80}" y="116" width="56" height="26" rx="7" fill="#fff" stroke="#EA580C" stroke-width="1.4"/>

    <text x="160" y="160" font-size="8" fill="#64748B" text-anchor="middle" font-weight="700">행정 각부는 업무를 나눠 맡아요</text></svg>`,

    <text x="240" y="72" font-size="7.2" fill="#B45309" text-anchor="middle" font-weight="700">대통령의 임무를 대신해요</text>
    <path d="M142 60 L178 60" stroke="#EA580C" stroke-width="2"/><path d="M172 56 L178 60 L172 64 Z" fill="#EA580C"/>
    <rect x="20" y="100" width="280" height="26" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>

    <rect x="20" y="134" width="280" height="24" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/>
    <text x="160" y="150" font-size="8.2" fill="#9A3412" text-anchor="middle" font-weight="800">나라의 살림은 멈출 수 없기 때문이에요</text></svg>`,
  // 6 살펴보기 — 행정 각부와 카드 뉴스(교과서 81쪽 [스스로 활동])
  cards:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="18" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">행정 각부는 어떤 일을 할까요</text>
    ${[['경제','나라 살림'],['교육','배우는 일'],['외교','다른 나라'],['환경','환경 지키기']].map((t,i)=>{
      const x=10+i*76;

    <rect x="94" y="70" width="132" height="18" rx="5" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.3"/>

function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

/* ===== 직접조작 — 자리가 비어도 일이 옮겨 가는 판(53번째 신규 패턴) =====
   ⭐ 앞의 쉰두 종에서 **자리가 비면 그 자리의 몫도 함께 비었다.** 이번만 자리가 비어도
      그 자리의 일이 **사라지지 않고 옆자리로 옮겨 간다.**
   ⭐ **51번째(맡을 곳이 없으면 일이 쌓이는 판)와의 정면 대비** — 거기서는 맡을 곳이 없어
      일이 쌓였고, 여기서는 맡을 곳이 비어도 대신할 자리가 있어 이어진다.
   ⭐ **대통령의 일을 지금 어느 자리가 지고 있는가**는 `agHolder(st)` 한 줄이 다 정한다.
      그것을 따로 담는 상태가 코드에 없고, `AG_DUTY`를 그리는 자리도 코드에 단 하나다.
   ⭐ **자리를 비우고 되돌리는 데에는 옳고 그름이 없다**(정답 상수 부재 · 무판정).
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */
const AG_N = 3;
/* 행정부를 이루는 자리 셋 \u2014 교과서 80쪽 본문 원문 */
const AG_SEAT = ['대통령','국무총리','행정 각부'];
const AG_SEAT_DO = [
  '국민이 선출한 대통령은 행정부의 최고 책임자이자 우리나라의 대표로, 나라의 중요한 일을 결정합니다.',
  '국무총리는 대통령을 보좌하고 행정 각부를 관리하며, 대통령이 임무를 수행할 수 없는 상황이 생기면 대통령의 임무를 대신합니다.',
  '행정 각부는 경제, 교육, 외교, 국방, 환경 등의 업무를 나눠 맡아서 국민의 안전하고 편리한 삶을 위해 다양한 일을 합니다.'
];
/* 판에 적히는 짧은이름 \u2014 위 두 칸의 본래 몫 */
const AG_SEAT_S = ['행정부의 최고 책임자이자 우리나라의 대표','대통령을 보좌하고 행정 각부를 관리해요'];
/* ★ 대통령의 일 \u2014 이 문구는 코드에 단 하나이고, 판에 그리는 자리도 단 하나다. */
const AG_DUTY = '나라의 중요한 일을 결정해요';
/* 행정 각부 네 곳 \u2014 교과서 81쪽 [스스로 활동] 보기 원문 */
const AG_MIN = ['교육부','재정 경제부','외교부','기후 에너지 환경부'];
/* 카드 뉴스 네 장 \u2014 교과서 81쪽 [스스로 활동] · 지도서 예시 답안 원문 */
const AG_CARD = [
  '학생들이 꿈꾸는 장래 희망에 관해 이야기하는 카드 뉴스',
  '국립 공원의 아름다움을 소개하는 카드 뉴스',
  '우리나라의 경제 정책 방향에 관해 이야기하는 카드 뉴스',
  '다른 나라와 함께한 외교와 관련한 내용을 담은 카드 뉴스'
];
const AG_CARD_S = ['장래 희망 이야기','국립 공원의 아름다움','경제 정책 방향','외교와 관련한 내용'];
/* ⚠️ 카드 j를 만든 부 \u2014 이 한 줄이 카드와 부의 대응을 통째로 정한다(난수 0). */
const AG_OWNER = [0, 3, 1, 2];
/* 자리를 비우고 되돌릴 때 판이 하는 말 \u2014 ⚠️ 어느 문구에도 옳고 그름이 없다 */
const AG_AWAY_MSG = '대통령이 <b>임무를 수행할 수 없는 상황</b>이 됐어요. 그런데 <b>나라의 중요한 일을 결정하는 일</b>은 판에서 사라지지 않았어요 \u2014 <b>국무총리</b> 자리로 옮겨 갔어요.';
const AG_BACK_MSG = '대통령이 <b>돌아왔어요.</b> 대신 맡았던 일을 <b>대통령이 다시</b> 맡아요 \u2014 판이 비기 전과 같아졌어요.';
/* ④ 마무리 \u2014 행정 각부가 하는 일(지도서 핵심 질문 예시 답안 원문) */
const AG_FIN = [
  '나라의 중요한 일을 각 부가 저마다 따로 결정해요',
  '경제, 교육, 외교, 국방, 환경 등의 업무를 나눠 맡아서 국민의 안전하고 편리한 삶을 위해 다양한 일을 해요',
  '한 곳에서 나라의 모든 업무를 도맡아 처리해요'
];
const AG_FIN_OK = 1;
const AG_FIN_NO = [
  '나라의 중요한 일이나 정책은 <b>국무 회의</b>를 열어 <b>함께</b> 의논해요.',
  '',
  '행정 각부는 업무를 <b>나눠</b> 맡아요. 한 곳이 모든 일을 도맡지 않아요.'
];
/* 안내 \u2014 어느 문구에도 「틀렸다」는 말이 없다 */
const AG_ALREADY_S = '그 자리는 <b>이미 세웠어요.</b> 판은 그대로예요.';
const AG_ORDER_C = '먼저 <b>행정부를 이루는 자리</b> 셋을 모두 세워 봐요.';
const AG_ALREADY_C = '그 카드 뉴스는 <b>이미 맡겼어요.</b> 판은 그대로예요.';
const AG_ORDER_M = '먼저 <b>카드 뉴스</b>를 하나 골라 봐요.';
const AG_ORDER_A = '먼저 <b>카드 뉴스 넷</b>을 모두 나눠 맡겨 봐요.';
const AG_WRONG_M = '그 부에서 만든 카드 뉴스가 아니에요. 카드 뉴스에 담긴 <b>내용</b>을 다시 읽어 봐요.';
/* 받침 처리 \u2014 안내문에 「을(를)」 병기가 남지 않게 한다 */
function agJ(s){ const c=s.charCodeAt(s.length-1); return (c>=0xAC00&&c<=0xD7A3) ? ((c-0xAC00)%28!==0) : false; }

/* ★ AG_OWNER를 읽는 자리는 여기 한 곳뿐이다. */
function agOwnerOf(j){ return AG_OWNER[j]; }
/* ★ 이 한 줄이 「대통령의 일을 지금 어느 자리가 지고 있는가」를 다 정한다
   \u2014 그것을 따로 담는 상태가 코드에 없다. */
function agHolder(st){ return st.agAway ? 1 : 0; }
function agBits(m,n){ const r=[]; for(let k=0;k<n;k++){ if(m & (1<<k)) r.push(k); } return r; }
function agAllSeat(st){ return st.agSeat === (1<<AG_N)-1; }
function agAllJob(st){ return st.agJob === (1<<AG_CARD.length)-1; }
function agCardOf(st,m){ for(let j=0;j<AG_CARD.length;j++){ if((st.agJob & (1<<j)) && agOwnerOf(j)===m) return j; } return -1; }
function agReady(st){ return agAllJob(st) && st.agBack>0 && !st.agAway; }

/* 판 \u2014 위는 대통령·국무총리 두 칸, 가운데는 행정 각부 띠, 아래는 부 네 줄.
   ⚠️ 대통령의 일(`AG_DUTY`)을 그리는 자리는 **여기 한 곳뿐**이고,
      어느 칸에 그릴지는 `agHolder(st)`가 정한다. */
function agCanvas(st){
  const fin = st.agFin!=null;
  const seatN = agBits(st.agSeat,AG_N).length, jobN = agBits(st.agJob,AG_CARD.length).length;
  const dutyAt = (st.agSeat & 1) ? agHolder(st) : -1;
  const set2 = !!(st.agSeat & 4);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = fin ? '행정 각부가 업무를 나눠 맡아 나라의 살림을 해요'
    : (st.agAway ? '대통령 자리가 비었어요 \u2014 그 일은 어디에 있나요?'
      : (agReady(st) ? '대통령이 돌아왔어요 \u2014 판이 비기 전과 같아졌어요'
        : (agAllJob(st) ? '나라의 일을 모두 나눠 맡겼어요'
          : (seatN<AG_N ? '행정부를 이루는 자리를 세워 봐요' : '카드 뉴스를 어느 부에서 만들었을지 맡겨 봐요'))));
  g+=`<text x="160" y="20" font-size="10" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  for(let i=0;i<2;i++){
    const set = !!(st.agSeat & (1<<i)), empty = (i===0 && st.agAway), on = set && !empty, x = 12 + i*152;
    g+=`<rect data-seat="${i}" data-set="${set?1:0}" data-empty="${empty?1:0}" x="${x}" y="28" width="144" height="52" rx="8" fill="${on?'#fff':'#F8FAFC'}" stroke="${on?'#C2410C':'#CBD5E0'}" stroke-width="${on?1.9:1.2}"${on?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+72}" y="45" font-size="9" fill="${set?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${set?AG_SEAT[i]:'아직이에요'}</text>`;
    g+=`<text x="${x+72}" y="58" font-size="6.4" fill="${on?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="700">${empty?'지금은 임무를 수행할 수 없어요':(set?AG_SEAT_S[i]:'세우지 않았어요')}</text>`;
    g+=`<text data-duty="${dutyAt===i?1:0}" x="${x+72}" y="71" font-size="6.6" fill="#C2410C" text-anchor="middle" font-weight="800">${dutyAt===i?AG_DUTY:'\u00B7'}</text>`;
  }
  g+=`<rect data-seat="2" data-set="${set2?1:0}" data-empty="0" x="12" y="86" width="296" height="24" rx="8" fill="${set2?'#fff':'#F8FAFC'}" stroke="${set2?'#C2410C':'#CBD5E0'}" stroke-width="${set2?1.7:1.2}"${set2?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text x="160" y="102" font-size="8.4" fill="${set2?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${set2?`행정 각부 \u2014 나눠 맡은 일 ${jobN} / ${AG_CARD.length}`:'행정 각부 \u2014 아직 세우지 않았어요'}</text>`;
  for(let m=0;m<AG_MIN.length;m++){
    const cj = agCardOf(st,m), y = 116 + m*30, got = cj>=0;
    g+=`<rect data-min="${m}" data-card="${cj}" x="14" y="${y}" width="292" height="26" rx="6" fill="${got?'#fff':'#F8FAFC'}" stroke="${got?'#C2410C':(set2?'#CBD5E0':'#E2E8F0')}" stroke-width="${got?1.6:1.1}"${got?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="26" y="${y+17}" font-size="7.6" fill="${set2?(got?'#9A3412':'#94A3B8'):'#E2E8F0'}" font-weight="800">${set2?AG_MIN[m]:'\u00B7'}</text>`;
    g+=`<text x="206" y="${y+17}" font-size="7.2" fill="${got?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="800">${set2?(got?AG_CARD_S[cj]:'아직 맡은 일이 없어요'):''}</text>`;
  }
  g+=`<text x="20" y="240" font-size="7.6" fill="#B45309" font-weight="800">세운 자리 ${seatN} / ${AG_N} \u00B7 자리를 비운 횟수 ${st.agBack}</text>`;
  g+=`<rect data-seatn="${seatN}" data-jobn="${jobN}" data-awayn="${st.agAway?1:0}" data-backn="${st.agBack}" x="14" y="116" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function agPanel(st){
  const fin = st.agFin!=null, allS = agAllSeat(st), allJ = agAllJob(st);
  const q = fin
    ? '행정 각부는 업무를 <b>나눠 맡고</b>, 자리가 비면 그 일을 <b>다른 자리가 대신</b> 맡아요.'
    : (agReady(st) ? '<b>행정 각부</b>는 어떤 일을 할까요?'
      : (allJ ? (st.agAway ? '대통령의 일은 지금 <b>어느 자리</b>에 있나요? 판을 보고 확인한 뒤 되돌려 봐요.'
                          : '대통령이 <b>임무를 수행할 수 없는 상황</b>이 되면 그 일은 어떻게 될까요?')
        : (allS ? (st.agOpen==null ? '카드 뉴스를 하나 골라 봐요. 어느 것부터 골라도 돼요.'
                                   : '이 카드 뉴스는 <b>어느 부</b>에서 만들었을까요?')
          : '<b>행정부</b>를 이루는 자리를 세워 봐요. 어느 자리부터 세워도 돼요.')));
  let right = `<div class="ag-q">${q}</div>`;

  if(fin){
    right+=`<div class="dw-card"><div class="pt">\uD83C\uDFDB\uFE0F 자리가 비어도 일은 사라지지 않았어요</div>
      <div>대통령이 임무를 수행할 수 없는 상황이 됐을 때 <b>나라의 중요한 일을 결정하는 일</b>은 없어지지 않고 <b>국무총리</b> 자리로 옮겨 갔어요. <b>나라의 살림은 멈출 수 없기 때문</b>이에요.</div>
      <div style="margin-top:5px">대신 맡는 동안에도 국무총리의 <b>본래 몫은 그대로</b>였어요. 두 몫을 <b>함께</b> 진 거예요. 대통령이 돌아오자 판은 비기 전과 <b>같아졌어요.</b></div>
      <div style="margin-top:5px;color:#64748B">행정 각부 가운데 하나를 골라 <b>하는 일을 조사해</b> 친구들과 이야기하는 것은 교실에서 하는 활동이에요. 화면이 그 활동을 대신하지 않아요.</div></div>`;
  } else if(agReady(st)){
    right+=`<div class="ag-fin">${AG_FIN.map((f,k)=>
      `<button class="${st.agWrongF===k?'no':''}" onclick="agFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(allJ){
    right+=`<div class="dw-step">\uD83D\uDD01 자리 \u2014 이 자리에는 정답이 없어요</div>`;
    right+=`<div class="ag-seatnote"><b>대통령이 임무를 수행할 수 없는 상황이 생기면 국무총리가 대통령의 임무를 대신합니다.</b><br>어느 쪽을 눌러도 판이 옳고 그름을 말하지 않아요.</div>`;
    right+=`<div class="ag-fin">
      <button onclick="agTurn(1)"${st.agAway?' disabled':''}>\u26A0\uFE0F 대통령이 임무를 수행할 수 없어요</button>
      <button onclick="agTurn(0)"${st.agAway?'':' disabled'}>\u21A9\uFE0F 대통령이 돌아왔어요</button></div>`;
  } else if(allS){
    if(st.agOpen==null){
      right+=`<div class="dw-step">\uD83D\uDCF0 카드 뉴스 고르기</div>`;
      right+=`<div class="ag-list">${AG_CARD.map((c,j)=>{
        const on = !!(st.agJob & (1<<j));
        return `<button class="${on?'ok':''}" onclick="agPick(${j})">${on?'\u2713 ':''}${c}</button>`;
      }).join('')}</div>`;
    } else {
      right+=`<div class="dw-step">\uD83C\uDFE2 어느 부에서 만들었을까요</div>`;
      right+=`<div class="ag-note">${AG_CARD[st.agOpen]}</div>`;
      right+=`<div class="ag-list">${AG_MIN.map((m,k)=>
        `<button class="${st.agWrongM===k?'no':''}" onclick="agGive(${k})">${m}</button>`).join('')}</div>`;
    }
  } else {
    right+=`<div class="dw-step">\u25B6 행정부를 이루는 자리 세우기</div>`;
    right+=`<div class="ag-list">${AG_SEAT.map((s,i)=>{
      const on = !!(st.agSeat & (1<<i));
      return `<button class="${on?'ok':''}" onclick="agSet(${i})">${on?'\u2713 ':''}${s} \u2014 ${AG_SEAT_DO[i]}</button>`;
    }).join('')}</div>`;
  }
  if(st.agMsg) right+=`<div class="dw-msg${st.agWarn?' warn':''}">${st.agMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDFDB\uFE0F 자리가 비어도 일은 사라지지 않아요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${agCanvas(st)}<div class="cvcap">판의 자리는 교과서 80~81쪽을 옮긴 자리예요. 실제 나라의 조직도를 그대로 옮긴 것은 아니에요. 행정부 조직은 새로 만들어지거나 조정되고, 이름이 바뀌기도 해요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l07";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  agSeat:0, agJob:0, agOpen:null, agAway:false, agBack:0, agFin:null,
  agWrongM:null, agWrongF:null,
  agMsg:null, agWarn:false, agBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function agRender(){ main.innerHTML = slides[state.idx].render(state); }
function agHold(msg){
  state.agWarn=true; state.agBusy=true; state.agMsg=msg;
  playThud(); agRender();
  setTimeout(()=>{ state.agBusy=false; state.agWarn=false; state.agMsg=null;
    state.agWrongM=null; state.agWrongF=null; agRender(); },1600);
}

/* ① 행정부를 이루는 자리 세우기 — ⚠️ 판정 0 · 순서 자유 */
function agSet(i){
  if(state.agFin!=null) return;                                        // 가드①
  if(state.agBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=AG_N) return;                   // 가드②
  if(state.agSeat & (1<<i)){ agHold(AG_ALREADY_S); return; }           // 가드④ 판 불변
  state.agSeat |= 1<<i; state.agWarn=false;
  const sjo = agJ(AG_SEAT[i]) ? '\uC744' : '\uB97C';
  state.agMsg = agAllSeat(state)
    ? `<b>\u300C${AG_SEAT[i]}\u300D</b>${sjo} 세웠어요 \u2014 ${AG_SEAT_DO[i]} 행정부를 이루는 자리를 <b>모두</b> 세웠어요.`
    : `<b>\u300C${AG_SEAT[i]}\u300D</b>${sjo} 세웠어요 \u2014 ${AG_SEAT_DO[i]}`;
  if(agAllSeat(state)) playChime(); else playBlip();
  agRender();
}

/* ② 카드 뉴스 고르기 — ⚠️ 판정 0(고르는 자리에는 옳고 그름이 없다) */
function agPick(j){
  if(state.agFin!=null) return;                                        // 가드①
  if(state.agBusy) return;                                             // 가드⑨
  if(!Number.isInteger(j) || j<0 || j>=AG_CARD.length) return;         // 가드②
  if(!agAllSeat(state)){ agHold(AG_ORDER_C); return; }                 // 가드③ 순서 — 판 불변
  if(state.agJob & (1<<j)){ agHold(AG_ALREADY_C); return; }            // 가드⑥ 판 불변
  state.agOpen = j; state.agWarn=false; state.agMsg=null;
  playBlip(); agRender();
}

/* ② 부 고르기 — 판정 있음. ⚠️ 어긋나도 판은 그대로이고 안내가 주인 부를 짚지 않는다. */
function agGive(m){
  if(state.agFin!=null) return;                                        // 가드①
  if(state.agBusy) return;                                             // 가드⑨
  if(!Number.isInteger(m) || m<0 || m>=AG_MIN.length) return;          // 가드②
  if(state.agOpen==null){ agHold(AG_ORDER_M); return; }                // 가드⑤ 순서 — 판 불변
  const j = state.agOpen;
  if(agOwnerOf(j)!==m){                                                // 어긋남 — 판 불변
    state.agWrongM=m; agHold(AG_WRONG_M); return; }
  state.agJob |= 1<<j; state.agOpen=null; state.agWrongM=null; state.agWarn=false;
  state.agMsg = agAllJob(state)
    ? `<b>\u300C${AG_MIN[m]}\u300D</b>에서 만든 카드 뉴스였어요. 나라의 일을 <b>모두</b> 나눠 맡겼어요.`
    : `<b>\u300C${AG_MIN[m]}\u300D</b>에서 만든 카드 뉴스였어요.`;
  if(agAllJob(state)) playChime(); else playBlip();
  agRender();
}

/* ③ 자리 비우기·돌아오기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   ⚠️ 옳고 그름이 없다(정답 상수 부재). 자리가 비어도 **대통령의 일은 사라지지 않고**
      `agHolder`가 가리키는 자리로 옮겨 간다. */
function agTurn(k){
  if(state.agFin!=null) return;                                        // 가드①
  if(state.agBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>1) return;                       // 가드②
  if(!agAllJob(state)) return;                                         // 가드⑦ 순서 — 판 불변
  if((k===1) === state.agAway) return;                                 // 가드⑦ 어긋난 상태 — 판 불변
  if(k===1){
    state.agAway = true;                                               // ★ 자리가 비는 자리는 여기 한 곳뿐
    state.agBack += 1;
    state.agWarn=false; state.agMsg = AG_AWAY_MSG;
    playBlip(); agRender(); return;
  }
  state.agAway = false;                                                // ★ 자리가 돌아오는 자리도 여기 한 곳뿐
  state.agWarn=false; state.agMsg = AG_BACK_MSG;
  playChime(); agRender();
}

/* ④ 마무리 — 「행정 각부는 어떤 일을 하나요」 */
function agFinish(k){
  if(state.agFin!=null) return;                                        // 가드①
  if(state.agBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=AG_FIN.length) return;          // 가드②
  if(!agReady(state)) return;                                          // 가드⑧ 순서 — 판 불변
  if(k===AG_FIN_OK){
    state.agFin=k; state.agWrongF=null; state.agMsg=null; state.agWarn=false;
    playChime(); agRender(); return;
  }
  state.agWrongF=k;
  agHold(AG_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l08 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

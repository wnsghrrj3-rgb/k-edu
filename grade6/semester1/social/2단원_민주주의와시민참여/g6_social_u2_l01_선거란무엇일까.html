학습 목표: 민주주의에서 선거가 무엇인지 설명할 수 있다.
수업 기법 및 전략: 돌아가며 말하기 · 의견 나누기
★★ 대단원2 첫 차시 — 1단원(평화 통일·민주화·산업화)에서 2단원(민주주의와 시민 참여)으로 넘어오는 자리.
⚠️ 엔진은 대단원1 l01~l11에서 100% 승계. **색만 2단원 색 #C2410C로 바꾸고 CSS 변수명·엔진은 무수정.**

직접조작: 첫 길이 막히는 판(47번째 신규 패턴 — 막다른 길이 배움인 형)
  ⭐ 앞의 마흔여섯 종에서 판이 연 길은 **전부 끝까지 갈 수 있는 길**이었다.
     알맞게 밟으면 판은 반드시 완성됐고, 막히는 것은 언제나 **어긋난 조작**의 몫이었다(가드).
     이번만 **알맞게 밟아도 끝나지 않는 길**이 판에 처음 들어간다 —
     국민을 한 사람씩 회의장으로 보내는 일은 어긋난 조작이 아닌데도 **세 자리에서 멈추고**,
     판은 스스로 「이 길로는 모두의 뜻을 담을 수 없어요」 하며 그 길을 닫는다.
     **막힘이 벌이 아니라 배움이다** — 감점 0, 경고 어휘 0.
     근거는 교과서 본문 원문 「나라를 운영하려면 결정해야 할 중요한 일이 많습니다.
     그러나 모든 국민이 정치에 직접 참여하여 나라의 일을 결정하고 나라 살림을 운영하는 것은
     어렵기 때문에 대표를 뽑아 일을 맡깁니다」.
  ⭐ **판은 되돌아가지 않는다.** 첫 길이 닫히면 회의장 자리는 비지만, 직접 가 본 세 사람에게는
     「직접 가 봄」 표시가 남는다 — 판은 앞으로 나아가며 **길만 바꾼다.**
     ⚠️ l11(46번째 「판이 도로 감추는 형」)과의 대비 — 거기서는 판이 뒤집기 전과 **글자 하나 다르지 않게**
     돌아갔다. 여기서는 자리가 비어도 판이 **뒤집기 전과 달라진다**(직접 가 봄 표시가 새로 생긴다).
     되감김이 아니라 **단조 전진**이다.
  ⭐ **국민은 한 명도 사라지지 않는다.** 대표를 뽑아도 판 아래 열두 사람은 그대로 있다 —
     국민이 없어지는 것이 아니라 **뜻을 맡기는 것**이기 때문이다.
     구조로 보장 — 국민 칸을 그리는 자리가 코드에 단 하나이고 그 수는 언제나 `VT_N`이다.
  ⭐ **표는 열두 사람에게서 하나씩 나온다.** 이미 표를 낸 사람은 다시 낼 수 없고,
     모인 표는 어느 경로로도 줄지 않는다(`vtBallot` 단조 증가).
  ① **직접 가기**(국민을 회의장으로 — 세 자리가 차면 판이 멈춘다 · 그 뒤 다른 국민을 눌러도 판 불변)
  ② **길 바꾸기**(「다른 길로 가 볼까요?」 — 학생이 스스로 막다른 길을 인정하는 유일한 자리)
  ③ **대표 뽑기**(열두 사람이 한 표씩 → 열두 표가 모이면 대표 세 사람이 회의장에 앉는다)
  ④ [미디어 활동] 3택 = 선거의 의미(교과서 본문 원문)
  ⑤ 마무리 3택 = 「선거를 민주주의의 꽃이라고 부르는 까닭」(지도서 예시 답안 원문)
  ⚠️ 국민·표·3택 전량 고정 리터럴 — 난수 0. VT_REP는 고정 리터럴이라 대표가 매번 같다.
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 이미 회의장에 들어간 국민 재클릭 무시 — 판 불변 /
     ④ 자리가 다 찬 뒤 다른 국민 클릭 무시 — 판 불변(안내만 · 막다른 길의 신호) /
     ⑤ 첫 길을 닫기 전 투표 무시(순서) / ⑥ 이미 표를 낸 국민 재클릭 무시 — 판 불변 /
     ⑦ 열두 표가 모이기 전 [미디어 활동] 무시(순서) / ⑧ [미디어 활동] 전 마무리 무시(순서) /
     ⑨ 안내 표시 중 재클릭 무시(`vtBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.vt-q`로 떼어 전 단계 상시 노출.

지도서 근거(대단원2 2차시 p.130~136):
  [생각을 열어요] 대통령 선거 참여 인증 이벤트 — 「선거에 참여하고 투표소 밖에서 사진을 찍어
    댓글로 올려 주세요. 추첨으로 열 분께 맛있는 음료를 드립니다.」 / 「투표는 국민의 소중한 권리입니다.」
    예시 답안 — 선거 참여를 독려하기 위해서이다 / 선거의 중요성을 알리기 위해서이다.
  [본문] 나라를 운영하려면 결정해야 할 중요한 일이 많습니다. 그러나 모든 국민이 정치에 직접 참여하여
    나라의 일을 결정하고 나라 살림을 운영하는 것은 어렵기 때문에 대표를 뽑아 일을 맡깁니다.
    오늘날 우리나라를 비롯한 대부분의 민주주의 국가에서는 자신들을 대신할 대표를 뽑아 나라의 중요한
    일을 맡기고 있습니다. 이처럼 국민이 자신들을 대표할 사람을 투표로 뽑는 일을 선거라고 합니다.
  [친구와 활동] 대표를 뽑는 것과 관련 있는 경험을 쓰고 친구들과 이야기하기.
    예시 답안 — 학교에서 학급 회장 선거에 참여한 적이 있다 / 부모님을 따라서 투표소에 가 본 적이 있다 /
    거리에서 선거 유세를 하는 모습을 본 적이 있다 / 텔레비전에서 개표 방송을 본 적이 있다.
    지도 꿀 Tip — 직접적인 경험뿐만 아니라 부모님께 들은 경험도 이야기해 보도록 한다.
  [말풍선] 우리나라에서 선거로 뽑는 대표는 누구인가요? → 대통령, 국회의원, 도지사, 시장, 군수,
    구청장, 도의원, 시의원, 군의원, 구의원, 교육감 등입니다.
  [낱말] 유권자 = 선거에서 대표를 뽑을 수 있는 권리를 가진 사람으로, 우리나라에서는 선거일 기준으로
    18세 이상인 사람을 말함.
  [말풍선] 민주주의란 국민이 국가의 주인으로서 권리를 갖고, 그 권리를 자유롭고 평등하게 행사하는
    정치 형태를 말해요.
  [미디어 활동] 신문 기사 — 선거는 국민을 위해 일할 국민의 대표를 뽑는 중요한 일이고, 후보자는
    실현 가능한 정책과 공약으로 정정당당하게 경쟁해야 하며, 유권자의 의사가 선거라는 민주적 절차를
    통해 결과에 반영된다는 내용.
    예시 답안 ㉠ 선거란 무엇인지 — 선거는 국민을 위해 일할 국민의 대표를 뽑는 일이다.
    예시 답안 ㉡ 민주주의의 꽃이라 부르는 까닭 — 선거는 국민이 정치에 참여하고 국가의 주인으로서
    권리를 행사하는 가장 기본적인 방법이기 때문이다.
    (핵심 질문 답 — 유권자의 의사가 선거 결과에 반영되어 나라의 일을 결정하고 나라 살림을 운영할 때
    영향을 미치기 때문입니다.)
  [꼭 기억해요] 1 우리나라에서는 모든 국민이 정치에 직접 참여하여 나라의 일을 결정합니다. (✗)
    2 국민이 자신들을 대표할 사람을 투표로 뽑는 일을 ( 선거 )라고 합니다.
  [2차시 주요 내용 정리] 1. 선거의 의미: 국민이 자신들을 대표할 사람을 투표로 뽑는 일
    2. 선거의 필요성 ① 나라를 운영하려면 결정해야 할 중요한 일이 많음
    ② 모든 국민이 정치에 직접 참여하여 나라의 일을 결정하고 나라 살림을 운영하는 것은 어려움.
  [정리] 차시 예고 = 선거가 중요한 까닭 알아보기.
⚠️ 설계 원칙:
  · **2차시 이후 침범 0** — 선거가 중요한 까닭·한 표의 소중함·선거로 생기는 변화 0,
    선거 과정·선거 원칙(보통·평등·직접·비밀)·사전 투표 0, 모의 선거·선거 공약·선거 운동 0.
    차시 예고 두 자리에서 「선거가 중요한 까닭」이라는 **이름만.**
  · **주제②·③ 침범 0** — 국회·행정부·법원·권력 분립 0, 미디어의 의미·역할·비판적 분석·허위 조작 정보 0.
    「[미디어 활동]」은 **교과서 활동 이름**이므로 이름으로만 쓴다(대단원1 l01 선례 승계).
  · **대단원1 재현 0** — 분단·평화 통일·이산가족·4·19 혁명·5·18 민주화 운동·6월 민주 항쟁·산업화 0.
    「민주주의」는 이 차시의 핵심 낱말이라 **교과서 말풍선 정의**로만 쓴다.
  · **정치적 중립** — 실제 정당·후보자·정치인 이름 0, 실제 선거 결과·연도 0.
    판의 국민·대표에는 이름을 붙이지 않고 **번호**로만 둔다.
  · 교사용 참고 자료 0 — 참고 도서 여섯 종, 아테네 민주주의 자료, 탐구 질문 프로젝트·GRASPS·평가 계획,
    신문사 이름과 날짜, 누리집 주소, 영상 링크, 활동지 쪽수.
  · **문항 내 연도·날짜·수치 0** — 「18세 이상」은 교과서 낱말 풀이 원문이라 **슬라이드에만.**
  · **정직 원칙 세 곳** — ㉠ 화면이 실제 투표를 대신하지 않는다. 판이 다루는 것은 **왜 대표를 뽑는가**이다.
    ㉡ [친구와 활동]의 경험 이야기는 판이 대신 말하지 않는다 — **지도서 예시 답안 원문**만 [답 보기]로 둔다.
    ㉢ 판의 대표 세 사람은 **뽑는 방법을 보여 주는 도식**일 뿐 실제 선거 결과가 아니다.
  · **학생 이름·친구 이름 0.**
  · 정서 — 겁주는 어휘 0. 투표하지 않는 사람을 나무라지 않는다.

.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(15px,2.6vw,20px);font-weight:700;line-height:1.6;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
.opt{background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;
  font-family:inherit;font-size:clamp(13px,2.2vw,16.5px);font-weight:500;text-align:left;line-height:1.5;transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:#16A34A;background:#DCFCE7;font-weight:700}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:11px;border-radius:12px;padding:12px 16px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;animation:fadeUp .3s ease both}
.fb.ok{background:#DCFCE7;color:#166534;font-weight:700}
.hint{margin-top:9px;background:var(--amber-bg);border-radius:11px;padding:10px 14px;
  font-size:clamp(12.5px,2.1vw,15px);color:var(--amber);line-height:1.55}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:11px 15px;
  font-size:clamp(13px,2.2vw,16.5px);line-height:1.6}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 첫 길이 막히는 판(막다른 길이 배움인 형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;

.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;

.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.vt-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);

  line-height:1.3;text-align:center}
.vt-grid button:hover{border-color:var(--green);background:var(--bub)}
.vt-grid button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.vt-grid button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.vt-grid button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.vt-turn{border:2px solid var(--cyan);background:#FFF7ED;color:var(--green-d);border-radius:10px;
  padding:9px 10px;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:clamp(11px,1.87vw,13.5px);text-align:center;line-height:1.45;animation:pop .35s ease both}
.vt-turn:hover{background:var(--bub)}
.vt-src{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.vt-fin{display:flex;flex-direction:column;gap:5px}
.vt-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.vt-fin button:hover{background:var(--bub)}
.vt-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;

.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}

/* ===== 직접조작 — 첫 길이 막히는 판(47번째 신규 패턴 — 막다른 길이 배움인 형) =====
   ⭐ 앞의 마흔여섯 종에서 판이 연 길은 전부 **끝까지 갈 수 있는 길**이었다.
      이번만 **알맞게 밟아도 끝나지 않는 길**이 들어간다 — 국민을 회의장으로 직접 보내는 일은
      어긋난 조작이 아닌데도 세 자리에서 멈추고, 판은 스스로 그 길을 닫는다.
      **막힘이 벌이 아니라 배움이다**(감점 0 · 경고 어휘 0).
      근거는 교과서 본문 원문 「모든 국민이 정치에 직접 참여하여 나라의 일을 결정하고
      나라 살림을 운영하는 것은 어렵기 때문에 대표를 뽑아 일을 맡깁니다」.
   ⭐ **판은 되돌아가지 않는다** — 첫 길이 닫히면 자리는 비지만 「직접 가 봄」 표시가 새로 남는다.
      l11(46번째 「도로 감추는 형」)은 판이 뒤집기 전과 글자 하나 다르지 않게 돌아갔다.
      여기서는 판이 뒤집기 전과 **반드시 달라진다** — 되감김이 아니라 단조 전진이다.
   ⭐ **국민은 한 명도 사라지지 않는다** — 국민 칸을 그리는 자리가 코드에 단 하나이고 그 수는 언제나 VT_N.
   ⭐ **표는 열두 사람에게서 하나씩** — 이미 낸 사람은 다시 낼 수 없고, 모인 표는 어느 경로로도 줄지 않는다.
   ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(Number.isInteger·범위) /
      ③ 이미 들어간 국민 재클릭 — 판 불변 / ④ 자리가 찬 뒤 다른 국민 클릭 — 판 불변(막다른 길의 신호) /
      ⑤ 첫 길을 닫기 전 투표 무시(순서) / ⑥ 이미 표를 낸 국민 재클릭 — 판 불변 /
      ⑦ 열두 표 전 [미디어 활동] 무시(순서) / ⑧ [미디어 활동] 전 마무리 무시(순서) /
      ⑨ 안내 표시 중 재클릭 무시(vtBusy).
   ⚠️ 전량 고정 리터럴 — 난수 0. 발문은 `.vt-q`로 떼어 전 단계 상시 노출. */
const VT_N = 12;
const VT_SEATS = 3;
const VT_REP = [3, 6, 10];                        // 뽑힌 대표 — 고정 리터럴(난수 0 · 실제 인물 0)
/* 안내 — 어느 문구에도 「틀렸다」는 말이 없다. 막힌 것은 학생이 아니라 길이기 때문이다. */
const VT_ALREADY_IN   = '그 사람은 <b>이미 회의장에 들어갔어요.</b> 판은 그대로예요.';

const VT_MEDIA = [                                // [미디어 활동] 신문 기사를 읽고 — 선거란 무엇인지

  '',

];
const VT_FIN = [                                  // 「선거를 민주주의의 꽃이라고 부르는 까닭은?」
  '유권자의 뜻이 선거를 통해 결과에 반영되고, 국민이 정치에 참여하는 가장 기본적인 방법이기 때문이에요',
  '선거가 있는 날에 꽃을 나누어 주기 때문이에요',
  '선거로 뽑힌 대표가 가장 힘이 세기 때문이에요'
];
const VT_FIN_OK = 0;                              // 지도서 예시 답안 원문
const VT_FIN_NO = [
  '',
  '꽃처럼 아름다워서가 아니에요. 선거가 민주주의에서 <b>가장 중요한 자리</b>를 맡고 있기 때문이에요.',
  '누가 더 힘이 센지를 정하는 일이 아니에요. <b>국민의 뜻</b>을 담는 일이에요.'
];

function vtFull(st){ return st.vtIn.length>=VT_SEATS; }
function vtAllVoted(st){ return st.vtBallot.length>=VT_N; }
function vtSeatRow(st){                                                 // 회의장에 앉아 있는 사람
  if(!st.vtClosed) return st.vtIn.slice();
  return vtAllVoted(st) ? VT_REP.slice() : [];
}

/* 판 — 위는 회의장, 가운데는 투표함, 아래는 국민 열두 사람.
   ⚠️ 국민 칸을 그리는 자리는 **여기 한 곳뿐**이고 그 수는 언제나 VT_N이다(사라지지 않음의 구조적 보장). */
function vtCanvas(st){
  const seated = vtSeatRow(st), reps = st.vtClosed && vtAllVoted(st);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = st.vtFin!=null ? '국민이 뽑은 대표가 나라의 일을 맡았어요'
    : (reps ? '대표 세 사람이 자리에 앉았어요 — 국민은 그대로예요'
      : (st.vtClosed ? `모인 표 ${st.vtBallot.length} / ${VT_N}`
        : `직접 회의장에 간 사람 ${st.vtIn.length} / ${VT_N}`));
  g+=`<text x="160" y="22" font-size="10.6" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  // 회의장 — 자리 세 개
  g+=`<rect data-hall="1" x="14" y="28" width="292" height="52" rx="8" fill="#fff" stroke="#C2410C" stroke-width="1.8"/>`;
  g+=`<text x="160" y="42" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">나라의 일을 정하는 자리 (${VT_SEATS}자리)</text>`;
  for(let s=0;s<VT_SEATS;s++){
    const cx=88+s*72, who=seated[s];
    if(who==null){
      g+=`<circle cx="${cx}" cy="64" r="10" fill="#fff" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="3 3"/>`;
      continue;
    }
    g+=`<circle data-seat="${who}"${reps?' data-rep="1"':''} cx="${cx}" cy="64" r="10" fill="${reps?'#C2410C':'#EA580C'}"/>`;
    g+=`<text x="${cx}" y="68" font-size="8.6" fill="#fff" text-anchor="middle" font-weight="800">${who+1}</text>`;
  }
  g+=`<rect data-seated="${seated.length}" x="14" y="28" width="0" height="0" fill="none"/>`;
  // 가운데 — 첫 길 안내 / 투표함
  if(!st.vtClosed){
    g+=`<rect x="14" y="88" width="292" height="26" rx="7" fill="${vtFull(st)?'#FEF3C7':'#FFEDD5'}"/>`;
    g+=`<text x="160" y="105" font-size="8.6" fill="${vtFull(st)?'#92400E':'#7C2D12'}" text-anchor="middle" font-weight="800">${
      vtFull(st) ? `자리가 다 찼는데 아직 ${VT_N-VT_SEATS}명이 남았어요` : '국민을 한 사람씩 회의장으로 보내 봐요'}</text>`;
  } else {
    g+=`<rect data-closed="1" x="112" y="86" width="96" height="30" rx="7" fill="#fff" stroke="#C2410C" stroke-width="1.8"/>`;
    g+=`<rect x="136" y="82" width="48" height="6" rx="3" fill="#9A3412"/>`;
    g+=`<text data-ballot="${st.vtBallot.length}" x="160" y="106" font-size="9" fill="#9A3412" text-anchor="middle" font-weight="800">투표함 ${st.vtBallot.length}표</text>`;
    if(reps) g+=`<rect data-band="1" x="14" y="120" width="292" height="0" fill="none"/>`;
  }
  // 국민 열두 사람 — 코드에 단 하나뿐인 자리
  g+=`<text x="160" y="136" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">국민 ${VT_N}명</text>`;
  for(let i=0;i<VT_N;i++){
    const cx=52+(i%4)*72, cy=158+Math.floor(i/4)*32;
    const went = st.vtIn.indexOf(i)>=0, voted = st.vtBallot.indexOf(i)>=0;
    const isRep = reps && VT_REP.indexOf(i)>=0;
    g+=`<circle data-cz="${i}"${went?' data-went="1"':''}${voted?' data-voted="1"':''}${isRep?' data-czrep="1"':''} cx="${cx}" cy="${cy}" r="11" fill="${voted?'#FDBA74':'#FFEDD5'}" stroke="${isRep?'#C2410C':'#EA580C'}" stroke-width="${isRep?2.4:1.4}"/>`;
    g+=`<text x="${cx}" y="${cy+4}" font-size="8.6" fill="#9A3412" text-anchor="middle" font-weight="800">${i+1}</text>`;
    if(went) g+=`<circle cx="${cx+11}" cy="${cy-9}" r="3.2" fill="#B45309"/>`;
  }
  g+=`<rect data-citizens="${VT_N}" x="14" y="140" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function vtPanel(st){
  const done = st.vtFin!=null, all = vtAllVoted(st), med = st.vtMedia!=null;
  const q = done
    ? '국민이 자신들을 대표할 사람을 투표로 뽑는 일 — 이것이 선거예요.'
    : (med ? '선거를 <b>민주주의의 꽃</b>이라고 부르는 까닭은 무엇일까요?'
      : (st.vtClosed && all ? '신문 기사를 읽고, 민주주의에서 선거란 무엇인지 알아봅시다.'
        : (st.vtClosed ? '열두 사람이 <b>한 표씩</b> 내면 대표를 뽑을 수 있어요.'
          : '나라의 일을 정하러 국민을 <b>직접</b> 회의장으로 보내 봐요.')));
  let right = `<div class="vt-q">${q}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">\uD83D\uDDF3\uFE0F 두 길을 다 밟아 봤어요</div>
      <div>모두 직접 모이는 길은 <b>세 자리에서 멈췄고</b>, 대표를 뽑는 길은 <b>열두 사람의 뜻</b>을 다 담았어요.
      그래서 대부분의 민주주의 국가에서는 <b>대표를 뽑아</b> 나라의 중요한 일을 맡겨요.</div>
      <div style="margin-top:5px;color:#64748B">국민이 자신들을 대표할 사람을 투표로 뽑는 일 — 이것을 <b>선거</b>라고 해요.</div></div>`;
  } else if(med){
    right+=`<div class="vt-src"><b>\uD83D\uDCF0 신문 기사에서</b><br>
      유권자의 의사가 선거라는 <b>민주적 절차</b>를 통해 결과에 반영된다고 했어요.</div>`;
    right+=`<div class="vt-fin">${VT_FIN.map((f,k)=>
      `<button class="${st.vtWrongF===k?'no':''}" onclick="vtFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(all){
    right+=`<div class="dw-step">\uD83D\uDCF0 미디어 활동</div>`;
    right+=`<div class="vt-src">열두 표가 모여 대표 세 사람이 자리에 앉았어요. 그런데 판 아래 <b>국민 ${VT_N}명은 그대로</b>예요.</div>`;

}

    :`<div class="note">국민의 뜻은 어디에 담길까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약 — 2차시 주요 내용 정리 원문
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">①</span><div><b style="color:var(--green)">선거의 의미</b> — 국민이 자신들을 대표할 사람을 투표로 뽑는 일이에요.</div></div>
    <div class="sum-item"><span class="n">②</span><div><b style="color:var(--green)">선거가 필요한 까닭 하나</b> — 나라를 운영하려면 결정해야 할 중요한 일이 많아요.</div></div>
    <div class="sum-item"><span class="n">③</span><div><b style="color:var(--green)">선거가 필요한 까닭 둘</b> — 모든 국민이 정치에 직접 참여해 나라의 일을 결정하고 나라 살림을 운영하는 것은 어려워요.</div></div>
    <div class="sum-item"><span class="n">④</span><div><b style="color:var(--green)">유권자</b> — 선거에서 대표를 뽑을 수 있는 권리를 가진 사람이에요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b>민주주의의 꽃</b> — 유권자의 뜻이 선거를 통해 결과에 반영되고, 선거는 국민이 정치에 참여하는 가장 기본적인 방법이에요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">선거가 중요한 까닭</b>을 알아봐요.</div></div>`});
// 17 정리: 자기 평가 — 학습 목표 기준 3항
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"선거가 무엇인지 말할 수 있어요",st)}
    ${selfCheck(1,"대표를 뽑아 일을 맡기는 까닭을 말할 수 있어요",st)}
    ${selfCheck(2,"선거를 민주주의의 꽃이라고 부르는 까닭을 설명할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">선거가 중요한 까닭</b>!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l01";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  vtIn:[], vtClosed:false, vtBallot:[], vtMedia:null, vtFin:null,
  vtWrongC:null, vtWrongM:null, vtWrongF:null,
  vtMsg:null, vtWarn:false, vtBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function vtRender(){ main.innerHTML = slides[state.idx].render(state); }
function vtHold(msg){
  state.vtWarn=true; state.vtBusy=true; state.vtMsg=msg;
  playThud(); vtRender();
  setTimeout(()=>{ state.vtBusy=false; state.vtWarn=false; state.vtMsg=null;
    state.vtWrongC=null; state.vtWrongM=null; state.vtWrongF=null; vtRender(); },1600);
}
function vtFullMsg(){ return `자리 ${VT_SEATS}개가 <b>다 찼어요.</b> 아직 ${VT_N-VT_SEATS}명이 남았는데 더 들어갈 자리가 없어요. 판은 그대로예요.`; }

/* ①·③ 국민 한 사람 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   첫 길에서는 회의장으로 보내고, 길을 바꾼 뒤에는 한 표를 낸다.
   ⚠️ 첫 길은 알맞게 밟아도 VT_SEATS에서 멈춘다 — 그때 판은 나무라지 않고 남은 사람 수만 알려 준다.
   ⚠️ vtBallot은 vtClosed 전에는 어느 경로로도 늘지 않는다(가드⑤ 순서). */
function vtCitizen(i){
  if(state.vtFin!=null) return;                                        // 가드①
  if(state.vtBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=VT_N) return;                   // 가드②
  if(!state.vtClosed){
    if(state.vtIn.indexOf(i)>=0){                                      // 가드③ 이미 들어간 사람 — 판 불변
      state.vtWrongC=i; vtHold(VT_ALREADY_IN); return; }
    if(vtFull(state)){                                                 // 가드④ 자리가 찬 뒤 — 판 불변(막다른 길의 신호)
      state.vtWrongC=i; vtHold(vtFullMsg()); return; }
    state.vtIn.push(i); state.vtWrongC=null; state.vtWarn=false;
    state.vtMsg = vtFull(state)
      ? `자리가 다 찼어요. 그런데 아직 <b>${VT_N-VT_SEATS}명</b>이 남았어요 — 이 길로는 모두의 뜻을 담을 수 없어요.`
      : `한 사람이 회의장에 들어갔어요. 남은 자리 <b>${VT_SEATS-state.vtIn.length}개</b>.`;
    playBlip(); vtRender(); return;
  }
  if(vtAllVoted(state)) return;                                        // 표가 다 모인 뒤 재클릭 무시
  if(state.vtBallot.indexOf(i)>=0){                                    // 가드⑥ 이미 표를 낸 사람 — 판 불변
    state.vtWrongC=i; vtHold(VT_ALREADY_VOTE); return; }
  state.vtBallot.push(i); state.vtWrongC=null; state.vtWarn=false;
  state.vtMsg = vtAllVoted(state)
    ? '열두 표가 모였어요. <b>대표 세 사람</b>이 자리에 앉았어요 — 그런데 국민은 <b>한 명도 사라지지 않았어요.</b>'
    : `한 표를 냈어요. 모인 표 <b>${state.vtBallot.length}표</b>.`;
  if(vtAllVoted(state)) playChime(); else playBlip();
  vtRender();
}

/* ② 길 바꾸기 — ★ 학생이 스스로 막다른 길을 인정하는 유일한 자리.
   ⚠️ 자리가 다 차기 전에는 길을 닫지 않는다(막힘을 겪지 않고 건너뛸 수 없다). */
function vtTurn(){
  if(state.vtFin!=null) return;                                        // 가드①
  if(state.vtBusy) return;                                             // 가드⑨
  if(state.vtClosed) return;
  if(!vtFull(state)) return;                                           // 순서 — 막힌 뒤에만 길이 바뀐다
  state.vtClosed=true; state.vtWrongC=null; state.vtWarn=false;
  state.vtMsg = VT_CLOSED_MSG;
  playChime(); vtRender();
}

/* ④ [미디어 활동] — 신문 기사를 읽고 선거가 무엇인지 */
function vtPickMedia(k){
  if(state.vtFin!=null) return;                                        // 가드①
  if(state.vtBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=VT_MEDIA.length) return;        // 가드②
  if(!state.vtClosed || !vtAllVoted(state)) return;                    // 가드⑦ 열두 표 전 무시(순서)
  if(state.vtMedia!=null) return;
  if(k===VT_MEDIA_OK){
    state.vtMedia=k; state.vtWrongM=null; state.vtWarn=false;
    state.vtMsg = '국민이 자신들을 대표할 사람을 <b>투표로 뽑는 일</b> — 이것을 <b>선거</b>라고 해요.';
    playChime(); vtRender(); return;
  }
  state.vtWrongM=k;
  vtHold(VT_MEDIA_NO[k]);
}

/* ⑤ 마무리 — 「선거를 민주주의의 꽃이라고 부르는 까닭」 */
function vtFinish(k){
  if(state.vtFin!=null) return;                                        // 가드①
  if(state.vtBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=VT_FIN.length) return;          // 가드②
  if(state.vtMedia==null) return;                                      // 가드⑧ [미디어 활동] 전 무시(순서)
  if(k===VT_FIN_OK){
    state.vtFin=k; state.vtWrongF=null; state.vtMsg=null; state.vtWarn=false;
    playChime(); vtRender(); return;
  }
  state.vtWrongF=k;
  vtHold(VT_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l02 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

     검토표의 답은 기사의 좋고 나쁨이 아니라 **그 기사에 그런 것이 있는지 없는지**이므로,

⚠️ 정직 원칙 네 곳
  ㉠ **판에 놓인 조각 넷은 지도서 19차시 예시 답안의 기사를 옮긴 자리이지 실제로 있었던 일이

  ㉡ **나머지 조각 둘은 교과서 111쪽 기준 「사실을 과장하거나 왜곡한 것이 있나요?」가 가리키는

  ㉢ **실제 조사(설문지·인터넷 검색·면담)와 기사 쓰기는 교실 몫**이다. 화면이 다루는 자리는
     **무엇을 싣고 무엇을 싣지 않는가**까지다(완료 카드 명시).
  ㉣ **기준 「같은 주제로 작성된 기사의 내용에서 서로 다른 점이 있나요?」는 친구가 쓴 기사가 있어야
     답할 수 있으므로 판에 두지 않았다.** 그 기준은 슬라이드와 문항에서만 다룬다(교실 몫 명시).

/* ===== 직접조작 — 검토표의 답이 판이 아니라 내가 담은 것에서 나오는 판(60번째 신규 패턴) =====
   ⭐ 앞의 쉰아홉 종에서 **정답은 언제나 판 안에 리터럴로 있었다.** 이번만 **검토표의 답을 정해 두는
      상수가 코드에 아예 없다**(`NW_OK` 부재) — `nwAnswer(m)` 한 줄이 **학생이 담은 조각에서**
      세 답을 그때그때 계산한다.
   ⭐ **같은 물음이 두 번 서로 다른 답을 받는다** — 조각을 바꿔 다시 쓰면 답이 실제로 뒤집힌다.
   ⭐ **핵심 가드는 「조각이 다른가」가 아니라 「답이 달라지는가」로 막는다**(가드⑦).
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */

const NW_N = 6;      /* 조사한 내용 조각 여섯 */
const NW_PICK = 4;   /* 기사에 싣는 줄 넷 */
const NW_ALL = (1<<NW_N) - 1;

/* 조각 여섯 — ㉮㉯㉰㉱는 지도서 19차시 예시 답안의 기사를 옮긴 자리이고,
   ㉲㉳은 교과서 111쪽 기준 2가 가리키는 자리를 판이 지어 놓은 것이다(캔버스 캡션 명시). */
const NW_LINE = [
  '지난주부터 시작된 점심시간 음악 방송이 학생들에게 큰 호응을 얻고 있다.',
  '점심시간 음악 방송은 매주 월요일과 수요일 점심시간에 진행된다.',
  '방송에서는 학생들이 보낸 사연과 신청곡을 들려준다.',
  '우리 반 학생 대부분이 음악 방송을 유익하다고 응답했다(출처: 우리 반 대상 설문 조사).',
  '점심시간 음악 방송은 학교를 뜨겁게 달군 폭발적인 인기의 최고 방송이다.',
  '점심시간 음악 방송을 싫어하는 학생은 한 명도 없다.'];
const NW_LINE_S = ['큰 호응을 얻고 있어요','월요일과 수요일에 해요','사연과 신청곡을 들려줘요',
  '설문 조사 결과 — 출처 있음','뜨겁게 달군 최고 방송','싫어하는 학생은 없대요'];
const NW_TITLE = '뜨거운 반응을 불러일으킨 점심시간 음악 방송';

/* ★ 이 세 줄이 조각의 성질을 다 정한다 — 어느 조각이 사실인지 · 과장인지 · 출처를 함께 적었는지. */
const NW_FACT = 0b011111;   /* ㉳만 사실이 아니다(대부분이 유익하다고 응답 — 「한 명도 없다」와 어긋난다) */
const NW_HYPE = 0b010000;   /* ㉲ — 사실이되 과장된 표현 */
const NW_SRC  = 0b001000;   /* ㉱ — 출처를 함께 적었다 */

/* 교과서 111쪽 검토 기준 — 판에 두는 것은 셋뿐이다(4번은 친구의 기사가 있어야 답할 수 있다). */
const NW_C = ['기사의 내용이 사실인가요?',
  '기사의 내용 중 사실을 과장하거나 왜곡한 것이 있나요?',
  '기사에 드러난 내용을 뒷받침할 출처가 제시되어 있나요?'];
const NW_C_S = ['내용이 사실인가요','과장·왜곡이 있나요','출처가 있나요'];
const NW_CN = 3;
const NW_YN = ['그렇지 않다','그렇다'];

/* 마무리 — 지도서 19차시 예시 답안 5 원문 */
const NW_FIN = ['기사를 길게 쓸수록 읽는 사람에게 신뢰를 줄 수 있다',
  '뉴스 기사를 작성할 때는 출처를 분명하게 밝혀야 읽는 사람에게 신뢰를 줄 수 있다',
  '눈길을 끌도록 사실보다 과장해서 써야 사람들이 많이 읽는다'];
const NW_FIN_OK = 1;
const NW_FIN_NO = ['길이가 신뢰를 만들지는 않아요. 읽는 사람이 믿을 수 있게 하는 것은 <b>어디에서 알아낸 것인지</b>예요.',
  '',
  '과장해서 쓰면 <b>사실을 왜곡</b>하게 돼요. 기사는 눈길보다 <b>사실</b>이 먼저예요.'];

/* 안내 — 어긋난 답에는 왜 그런지만 말하고 다른 줄의 답을 흘리지 않는다. */
const NW_NO_C = ['내 기사에 실린 줄을 다시 읽어 봐요. <b>사실이 아닌 줄</b>이 있는지 살펴봐요. 판은 그대로예요.',
  '내 기사에 실린 줄을 다시 읽어 봐요. <b>과장하거나 왜곡한 줄</b>이 있는지 살펴봐요. 판은 그대로예요.',
  '내 기사에 실린 줄을 다시 읽어 봐요. <b>어디에서 알아낸 것인지</b> 적힌 줄이 있는지 살펴봐요. 판은 그대로예요.'];
const NW_ALREADY_L = '이 조각은 <b>이미 실었어요.</b> 판은 그대로예요.';
const NW_ALREADY_C = '이 줄은 <b>이미 답했어요.</b> 판은 그대로예요.';
const NW_FULL = '기사에 실을 줄은 <b>넷</b>이에요. 자리가 다 찼어요. 판은 그대로예요.';
const NW_LOCK_L = '검토를 시작한 뒤에는 <b>기사를 고칠 수 없어요.</b> 판은 그대로예요.';
const NW_ORDER_C = '아직 <b>기사가 다 되지 않았어요.</b> 조각 넷을 실은 뒤에 검토해요. 판은 그대로예요.';
const NW_ORDER_A = '아직 <b>검토가 끝나지 않았어요.</b> 세 줄을 다 답한 뒤에 다시 써 봐요. 판은 그대로예요.';
const NW_ORDER_F = '아직 <b>두 번째 검토가 끝나지 않았어요.</b> 판은 그대로예요.';
const NW_SAME = '이 조각을 실으면 검토표의 <b>세 답이 첫 기사와 똑같아질 수밖에 없어요.</b> 견줄 것이 없어요. 다른 조각을 실어 봐요. 판은 그대로예요.';

/* ★ 이 한 줄이 검토표의 세 답을 다 정한다 — 정답 상수는 코드에 없다. */
function nwAnswer(m){
  return [ (m & ~NW_FACT & NW_ALL)===0 ? 1 : 0,
           (m & NW_HYPE)!==0 ? 1 : 0,
           (m & NW_SRC)!==0 ? 1 : 0 ];
}
function nwBits(m){ let n=0; for(let k=0;k<NW_N;k++){ if(m & (1<<k)) n++; } return n; }
function nwSet(m){ const r=[]; for(let k=0;k<NW_N;k++){ if(!(m & (1<<k))) r.push(k); } return r; }
/* ★ 판이 지금 걸음만 보지 않고 **남은 길까지 내다보고** 막는다 —
   이 원고를 넷까지 채웠을 때 첫 기사와 답이 달라지는 길이 하나라도 남아 있는가.
   ⚠️ 이 한 줄 덕분에 두 번째 기사에서 **막다른 길이 생기지 않는다**(전수로 대조). */
function nwCanDiffer(m, first){
  const need = NW_PICK - nwBits(m);
  if(need < 0) return false;
  const rest = nwSet(m), fa = nwAnswer(first);
  let found = false;
  const go=(idx, cur, left)=>{
    if(found) return;
    if(left===0){ if(!nwSame(nwAnswer(cur), fa)) found=true; return; }
    if(idx>=rest.length || rest.length-idx < left) return;
    go(idx+1, cur | (1<<rest[idx]), left-1);
    go(idx+1, cur, left);
  };
  go(0, m, need);
  return found;
}
function nwSame(a,b){ return a[0]===b[0] && a[1]===b[1] && a[2]===b[2]; }
function nwFull(st){ return nwBits(st.nwMask) >= NW_PICK; }
function nwChecked(st){ return st.nwDone === (1<<NW_CN)-1; }
function nwRound(st){ return st.nwFirst==null ? 0 : 1; }
/* 두 기사의 답이 몇 줄 달라졌는지 — 두 번째 검토를 마친 뒤에만 판에 그린다. */
function nwDiff(st){
  if(st.nwFirst==null) return -1;
  const a=nwAnswer(st.nwFirst), b=nwAnswer(st.nwMask);
  let n=0; for(let i=0;i<NW_CN;i++){ if(a[i]!==b[i]) n++; } return n;
}

/* 판 — 위는 기사 원고, 가운데는 검토표 세 줄, 아래는 두 기사를 견주는 줄.
   ⚠️ 답하지 않은 줄의 칸은 비어 있다 — 판이 검토표의 답을 미리 알려 주지 않는다. */
function nwCanvas(st){
  const fin = st.nwFin!=null, r = nwRound(st), full = nwFull(st), ck = nwChecked(st);
  const filled = nwBits(st.nwMask);
  const done2 = r===1 && ck;
  let g='';
  g+=`<rect x="8" y="6" width="304" height="268" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = fin ? '기사가 달라지면 검토표의 답도 달라져요'
    : (done2 ? '두 번째 기사도 검토했어요 — 견줘 봐요'
      : (ck ? '검토를 마쳤어요 — 조각을 바꿔 다시 써 볼까요'
        : (full ? '기사가 다 됐어요 — 이제 기준에 답해요'
          : (r===1 ? '두 번째 기사에 실을 조각을 골라요' : '기사에 실을 조각을 골라요'))));
  g+=`<text x="160" y="19" font-size="9.4" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  /* 기사 원고 */
  g+=`<rect data-round="${r}" data-fill="${filled}" x="12" y="26" width="296" height="100" rx="8" fill="#fff" stroke="#C2410C" stroke-width="1.8"/>`;
  g+=`<rect x="18" y="32" width="284" height="16" rx="5" fill="#FFEDD5"/>`;
  g+=`<text x="160" y="43" font-size="7" fill="#9A3412" text-anchor="middle" font-weight="800">${r===1?'두 번째 기사':'첫 기사'} · ${NW_TITLE}</text>`;
  const put=[]; for(let i=0;i<NW_N;i++){ if(st.nwMask & (1<<i)) put.push(i); }
  for(let j=0;j<NW_PICK;j++){
    const i = put[j], has = i!=null, y = 52 + j*17;
    g+=`<rect data-line="${j}" data-piece="${has?i:-1}" x="18" y="${y}" width="284" height="15" rx="5" fill="${has?'#FFFDF5':'#F8FAFC'}" stroke="${has?'#B45309':'#CBD5E0'}" stroke-width="1.1"${has?'':' stroke-dasharray="3 3"'}/>`;
    g+=`<text x="24" y="${y+10.5}" font-size="6.4" fill="${has?'#8A6D3B':'#CBD5E0'}" font-weight="800">${has?`${'㉮㉯㉰㉱㉲㉳'[i]} ${NW_LINE_S[i]}`:'아직 비어 있어요'}</text>`;
  }
  /* 검토표 세 줄 — 답한 줄만 답을 보인다 */
  for(let c=0;c<NW_CN;c++){
    const dn = !!(st.nwDone & (1<<c)), y = 132 + c*26;
    const av = dn ? nwAnswer(st.nwMask)[c] : -1;
    g+=`<rect data-crit="${c}" data-cans="${av}" x="12" y="${y}" width="296" height="22" rx="7" fill="${dn?'#fff':'#F8FAFC'}" stroke="${dn?'#C2410C':'#CBD5E0'}" stroke-width="${dn?1.7:1.1}"${dn?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="20" y="${y+14}" font-size="6.8" fill="${dn?'#9A3412':'#94A3B8'}" font-weight="800">${c+1}. ${NW_C_S[c]}</text>`;
    g+=`<rect x="212" y="${y+3}" width="88" height="16" rx="6" fill="${dn?'#FFEDD5':'#F1F5F9'}"/>`;
    g+=`<text x="256" y="${y+14}" font-size="6.4" fill="${dn?'#9A3412':'#CBD5E0'}" text-anchor="middle" font-weight="800">${dn?NW_YN[av]:'아직'}</text>`;
  }
  /* 두 기사를 견주는 줄 — 첫 기사의 세 답은 두 번째 회전에서 보이고, 달라진 줄 수는 두 번째 검토를 마친 뒤에만 */
  const fa = st.nwFirst!=null ? nwAnswer(st.nwFirst) : [-1,-1,-1];
  const dv = done2 ? nwDiff(st) : -1;
  g+=`<rect data-fa0="${fa[0]}" data-fa1="${fa[1]}" data-fa2="${fa[2]}" data-diff="${dv}" x="12" y="210" width="296" height="24" rx="7" fill="${dv>0?'#FFEDD5':'#F8FAFC'}" stroke="${dv>0?'#C2410C':'#E2E8F0'}" stroke-width="${dv>0?2:1.1}"${dv>0?'':' stroke-dasharray="4 3"'}/>`;
  const cmp = st.nwFirst==null ? '아직 첫 기사만 있어요'
    : (done2 ? `첫 기사와 견주니 ${dv} 줄이 달라졌어요` : `첫 기사의 답 — ${fa.map((v,i)=>`${i+1}. ${NW_YN[v]}`).join(' · ')}`);
  g+=`<text x="160" y="226" font-size="7.2" fill="${dv>0?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${cmp}</text>`;
  g+=`<rect x="12" y="240" width="296" height="16" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.1"/>`;
  g+=`<text x="160" y="251" font-size="6.4" fill="#9A3412" text-anchor="middle" font-weight="800">실은 줄 ${filled} / ${NW_PICK} · 답한 기준 ${nwBits(st.nwDone)} / ${NW_CN}</text>`;
  g+=`<rect x="12" y="260" width="296" height="14" rx="6" fill="#fff" stroke="#CBD5E0" stroke-width="1"/>`;
  g+=`<text x="160" y="270" font-size="6.2" fill="#64748B" text-anchor="middle" font-weight="800">검토표의 답은 판이 아니라 내가 실은 줄에서 나와요</text>`;
  return `<svg viewBox="0 0 320 280"><rect width="320" height="280" fill="#ffffff"/>${g}</svg>`;
}

function nwPanel(st){
  const fin = st.nwFin!=null, r = nwRound(st), full = nwFull(st), ck = nwChecked(st);
  const done2 = r===1 && ck;

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l14";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  nwMask:0, nwFirst:null, nwDone:0, nwFin:null,
  nwWrongL:null, nwWrongC:null, nwWrongF:null,
  nwMsg:null, nwWarn:false, nwBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);

  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');

  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function nwRender(){ main.innerHTML = slides[state.idx].render(state); }
function nwHold(msg){
  state.nwWarn=true; state.nwBusy=true; state.nwMsg=msg;
  playThud(); nwRender();
  setTimeout(()=>{ state.nwBusy=false; state.nwWarn=false; state.nwMsg=null;
    state.nwWrongL=null; state.nwWrongC=null; state.nwWrongF=null; nwRender(); },1600);
}

/* ① 조각을 기사에 싣기 — 무판정. 무엇을 실어도 판이 받는다.
   ★ 다만 두 번째 기사에서는 **검토표의 세 답이 첫 기사와 똑같아질 수밖에 없는 조각**을 받지
      않는다(가드⑦). 판이 보는 것은 「조각이 겹치는가」가 아니라 「답이 달라질 길이 남아 있는가」다.
   ⚠️ 순서 자유 — 어느 조각부터 실어도 좋다. */
function nwPut(i){
  if(state.nwFin!=null) return;                                        // 가드①
  if(state.nwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=NW_N) return;                   // 가드②
  if(state.nwDone!==0){ nwHold(NW_LOCK_L); return; }                   // 가드⑧ 판 불변
  if(state.nwMask & (1<<i)){ nwHold(NW_ALREADY_L); return; }           // 가드④ 판 불변
  if(nwBits(state.nwMask) >= NW_PICK){ nwHold(NW_FULL); return; }      // 가드⑤ 판 불변
  if(state.nwFirst!=null && !nwCanDiffer(state.nwMask | (1<<i), state.nwFirst)){
    state.nwWrongL=i; nwHold(NW_SAME); return;                         // 가드⑦ ★핵심 — 판 불변
  }
  state.nwMask |= 1 << i;                                              // ★ 싣는 자리는 여기 한 곳뿐
  state.nwWarn=false; state.nwWrongL=null;
  state.nwMsg = nwFull(state)
    ? `<b>기사가 다 됐어요.</b> 이제 기준에 답해 봐요. 답은 <b>내가 실은 줄</b>에서 나와요.`
    : `<b>실었어요.</b> 지금 <b>${nwBits(state.nwMask)} / ${NW_PICK}</b>줄이에요.`;
  playBlip(); nwRender();
}

/* ② 검토표 한 줄에 답하기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   판정은 있지만 **정답 상수가 코드에 없다.** 답은 `nwAnswer(state.nwMask)`가
   **학생이 실은 줄에서** 그때그때 계산한다. 기사가 달라지면 같은 물음의 답도 달라진다. */
function nwCheck(c,v){
  if(state.nwFin!=null) return;                                        // 가드①
  if(state.nwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(c) || c<0 || c>=NW_CN) return;                  // 가드②
  if(!Number.isInteger(v) || v<0 || v>1) return;                       // 가드②
  if(!nwFull(state)){ nwHold(NW_ORDER_C); return; }                    // 가드③ 순서 — 판 불변
  if(state.nwDone & (1<<c)){ nwHold(NW_ALREADY_C); return; }           // 가드④ 판 불변
  if(v !== nwAnswer(state.nwMask)[c]){ state.nwWrongC=c; nwHold(NW_NO_C[c]); return; } // 판 불변
  state.nwDone |= 1 << c;                                              // ★ 답을 채우는 자리는 여기 한 곳뿐
  state.nwWarn=false; state.nwWrongC=null;
  state.nwMsg = nwChecked(state)
    ? (nwRound(state)===1
        ? `<b>두 번째 검토를 마쳤어요.</b> 첫 기사와 견주니 <b>${nwDiff(state)} 줄</b>이 달라졌어요. 판이 답을 바꾼 것이 아니라 <b>내가 실은 줄</b>이 달라진 거예요.`
        : `<b>검토를 마쳤어요.</b> 이 답은 판에 적혀 있던 것이 아니라 <b>내가 실은 줄</b>에서 나온 거예요.`)
    : `<b>맞았어요.</b> 내 기사를 잘 읽었어요. 남은 기준은 <b>${NW_CN - nwBits(state.nwDone)}</b>줄이에요.`;
  playBlip(); nwRender();
}

/* ③ 조각을 바꿔 다시 써 보기 — 첫 기사를 그대로 두고 두 번째 기사를 새로 연다.
   ⚠️ 첫 기사의 세 답도 따로 담지 않는다 — `nwAnswer(state.nwFirst)`가 그때그때 계산한다. */
function nwAgain(){
  if(state.nwFin!=null) return;                                        // 가드①
  if(state.nwBusy) return;                                             // 가드⑨
  if(!nwChecked(state)){ nwHold(NW_ORDER_A); return; }                 // 가드⑥ 순서 — 판 불변
  if(state.nwFirst!=null){ nwHold(NW_ORDER_A); return; }               // 가드⑥ 두 번만 쓴다 — 판 불변
  state.nwFirst = state.nwMask;                                        // ★ 첫 기사를 옮겨 두는 자리는 여기 한 곳뿐
  state.nwMask = 0; state.nwDone = 0;
  state.nwWarn=false; state.nwWrongL=null; state.nwWrongC=null;
  state.nwMsg = `<b>두 번째 기사를 열었어요.</b> 이번에는 <b>다른 조각</b>을 실어 봐요. 검토표의 답이 첫 기사와 <b>똑같아지는 조각</b>은 판이 받지 않아요.`;
  playChime(); nwRender();
}

/* ④ 마무리 — 「뉴스 기사를 작성하고 검토한 후 알게 된 점」(지도서 19차시 예시 답안 5 원문) */
function nwFinish(k){
  if(state.nwFin!=null) return;                                        // 가드①
  if(state.nwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=NW_FIN.length) return;          // 가드②
  if(!(nwRound(state)===1 && nwChecked(state))){ nwHold(NW_ORDER_F); return; } // 가드⑧ 순서 — 판 불변
  if(k===NW_FIN_OK){
    state.nwFin=k; state.nwWrongF=null; state.nwMsg=null; state.nwWarn=false;
    playChime(); nwRender(); return;
  }
  state.nwWrongF=k;
  nwHold(NW_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l15_번갈아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

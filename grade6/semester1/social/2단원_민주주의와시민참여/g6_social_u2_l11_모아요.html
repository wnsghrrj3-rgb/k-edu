학습 목표: 민주주의에서 미디어의 역할을 설명할 수 있다.

⚠️ 파일명을 `모아요`로 지었다(배선 예외 대신). l10이 「미디어의 역할」·「여론」·「사회문제」·「허위」·
   「조작 정보」·「거짓」·「비판적」·「국회」·「행정부」·「법원」을 개수 0으로, 「역할」을 개수 2(차시 예고
   두 자리)로 재고 있어서 파일명에 그 낱말이 들어가면 재배선이 곧바로 그 가드를 깨뜨린다.
   겹치지 않는 이름을 골라 예외를 만들지 않았다
   (l05 `나랏일` · l06 `법이되기까지` · l07 `나라살림` · l08 `세번까지` · l09 `나눠맡아요` ·
    l10 `주고받아요` 선례 승계).

직접조작: 한 걸음이 판의 두 자리를 함께 올리는 판 · 쌓인 수가 아니라 갈래가 차야 열리는 형
  (57번째 신규 패턴)
  ⭐ 앞의 쉰여섯 종에서 **한 걸음은 언제나 판의 한 자리만 움직였다.** 50번째(잣대를 세워야 걸러지는
     판)에서도 세운 잣대 하나가 걸러진 것 하나를 늘렸고, 55번째(가리키는 자리가 사라지는 판)와
     56번째(잣대를 걷어 내야 답이 나오는 판)에서는 판의 무엇인가가 **줄었다.** 이번만 **한 걸음이
     두 자리를 함께 올린다** — 자료를 역할에 담을 때마다 그 **역할 칸**과 **모인 생각 줄**이 같은
     걸음에 함께 오른다. 근거는 교과서 98쪽 본문 원문 「미디어를 이용해 주고받는 여러 정보와
     사람들의 생각은 이러한 의사 결정을 하는 데 영향을 미칩니다」 — 미디어가 역할을 할 때마다
     그 정보는 역할 쪽에도 쌓이고 사람들의 생각 쪽에도 함께 쌓인다.
  ⭐ **56번째와의 정면 대비** — 거기서는 판이 재는 물음이 **줄어들수록** 답에 가까워졌고,
     여기서는 **늘어나되 두 자리가 함께** 오른다.
  ⭐ **50번째와의 대비** — 거기서 늘어난 것은 **한 자리**였다. 한 걸음에 두 자리가 오르는 자리는
     여기가 처음이다.
  ⭐ **판이 여는 조건은 쌓인 수가 아니라 갈래다** — `RL_NEED` 한 줄이 그것을 정한다.
     **모인 생각이 넷인데 열리지 않고, 셋인데 열리는 길이 실제로 있다**(갈래 둘 / 갈래 셋).
     판이 세는 것이 개수가 아니라 갈래인 자리는 여기가 처음이다.
  ⭐ **갈래 수를 따로 담는 상태가 코드에 아예 없다** — `rlKinds(st)` **한 줄**이 그것을 다 정하고,
     `rlSum(st)` 한 줄이 모인 생각을 정하며, `RL_OWNER[`를 읽는 자리도 `rlOwnerOf` **단 하나**,
     `RL_PAIROF[`를 읽는 자리도 **단 하나**, `data-kinds`를 그리는 자리도 **단 하나**다.
  ⭐ **의사 결정을 여는 자리와 빗대는 말을 고르는 자리에는 옳고 그름이 없다**
     (`RL_DEC_OK` 부재 · 무판정 · 감점 0 · `rlDecide()`는 인자 0).
  ① **자료 여섯을 역할 셋에 담기**(교과서 95~99쪽 자료 · 순서 자유 · 판정 있음 ·
     **`RL_OWNER=[0,1,2,1,0,2]`** 한 줄) — ★ 한 걸음마다 역할 칸과 모인 생각 줄이 함께 오른다
  ② **의사 결정 열기**(무판정 · **갈래 셋이 차야 열린다** — 모인 생각이 더 많아도 갈래가 둘이면 판 불변)
  ③ **빗대는 말 둘에 까닭 짝짓기**(안내소·파수꾼 ↔ 지도서 예시 답안 원문 · 순서 자유 · 판정 있음 ·
     **`RL_PAIROF=[0,1]`** 한 줄)
  ④ 마무리 3택 = 민주주의에서 미디어가 중요한 까닭(지도서 「주요 내용 정리」 2 원문)
  ⚠️ 자료·역할·빗대는 말·3택 전량 고정 리터럴 — 난수 0.
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ **갈래가 셋이 되기 전 의사 결정 무시 — 판 불변**(핵심 가드) / ④ 이미 담은 자료 재클릭 — 판 불변 /
     ⑤ 이미 연 의사 결정 재클릭 — 판 불변 / ⑥ 여섯을 다 담고 의사 결정을 열기 전 빗대는 말 고르기
     무시(순서) — 판 불변 / ⑦ 이미 짝지은 빗대는 말 재클릭 — 판 불변 / ⑧ 두 빗대는 말을 다 짝짓기 전
     마무리 무시(순서) / ⑨ 안내 표시 중 재클릭 무시(`rlBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.rl-q`로 떼어 전 단계 상시 노출. 상태 열쇠 12개.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 역할 칸은 교과서 95~99쪽 자료를 옮긴 자리이지 미디어의 역할을 수로 잰 것이 아니다**
     — 담긴 수는 판이 받은 자료의 개수일 뿐이다(캔버스 캡션).
  ㉡ **하나의 자료에서 여러 역할을 함께 읽을 수도 있다** — 판은 교과서와 지도서가 짚은 역할 하나만
     담는다(캔버스 캡션). 판이 담지 않은 읽기를 틀렸다고 하지 않는다.
  ㉢ **빗대는 말에는 옳고 그름이 없다** — 지도서가 안내소와 파수꾼을 둘 다 예시 답안으로 들었다.
     판이 재는 것은 빗댄 말이 아니라 그 **까닭**이다(정직 문면 명시).
  ㉣ **[친구와 활동] 문제 해결 방법에 관한 내 입장을 쓰고 이야기하는 활동과 [스스로 활동] 문장
     완성하기는 교실 몫이다**(완료 카드 명시 · 리빌 예시 답안에 「내 문장은 내가 직접 적어요」 병기).

⚠️ 설계 원칙
  · **16차시 침범 0** — 허위 0 · 조작 정보 0 · 거짓 0 · 가짜 0. 「비판적」은 **차시 예고 두 자리뿐**.
  · **17~18차시 침범 0** — 이용 습관 0 · 피라미드 0 · 대응 0.
  · **19~20차시 침범 0** — 뉴스 기사 작성 0 · 생각 그물 0 · 물레방아 0.
  · **주제② 재현 0** — 국회·행정부·법원·국가기관·권력 분립·견제·균형 전부 0. 교과서 95쪽 ㉯의
    「국회」는 화면에 옮기지 않고 「법을 만들어 달라는 요구」까지만 적었다.
  · **주제① 재현 0** — 선거·공약·유권자·후보자·기표소·투표율 전부 0. 교과서 96쪽 세 사례 가운데
    선거 관련 공익 광고는 화면에 옮기지 않았다.
  · **l10 재현 최소** — 미디어의 뜻·종류(신문·방송·사회 관계망 서비스의 특징)는 다시 가르치지 않는다.
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 실제 정당·정치인 0, 실제 정책·사건·연도 0, 실제 부처·방송사·신문사·누리집·
    상표 이름 0(교과서 96쪽 기사 출처와 99쪽 부처 이름은 옮기지 않았다).
  · 교사용 참고 자료 0 — 참고 도서 네 종, 프레이밍, 의제 설정, 환경 감시·상관관계 조정·문화 전수·
    오락 기능, 미디어 리터러시, 매스 미디어, 대중 매체, 올드 미디어·뉴 미디어, 아테네·아고라·
    데모크라시·아리스토텔레스, 여론, 딥페이크 전부 0.
  · **파일 전체에 네 자리 연도 0 · 금액·인원 수치 0**(CSS 밖 스코프).

    사람이 다치는 묘사 0 · 겁주는 어휘 0 · **학생 이름 0 · 실제 지역 이름 0.**

/* 직접조작 — 잣대를 걷어 내야 답이 나오는 판 */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.rl-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:var(--bub);border-radius:9px;padding:7px 11px;line-height:1.45}
.rl-fin{display:flex;flex-direction:column;gap:5px}
.rl-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.rl-fin button:hover{background:var(--bub)}
.rl-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.rl-list{display:flex;flex-direction:column;gap:5px;max-height:206px;overflow-y:auto}
.rl-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.rl-list button:hover{border-color:var(--green);background:var(--bub)}
.rl-list button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.rl-list button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.rl-list button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.rl-dec{border:2px solid var(--amber);background:#FFFBEB;color:#B45309;border-radius:10px;padding:8px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.5px,1.75vw,12.6px);text-align:center}
.rl-dec:hover{background:#FEF3C7}
.rl-dec.on{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.rl-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.rl-keynote{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.rl-keynote b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;

.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}

/* ===== 직접조작 — 한 걸음이 판의 두 자리를 함께 올리는 판(57번째 신규 패턴) =====
   ⭐ 앞의 쉰여섯 종에서 **한 걸음은 언제나 판의 한 자리만 움직였다.** 이번만 자료를 역할에 담을 때마다
      **역할 칸**과 **모인 생각 줄**이 같은 걸음에 함께 오른다.
   ⭐ **판이 여는 조건은 쌓인 수가 아니라 갈래다**(`RL_NEED` 한 줄) — 모인 생각이 넷인데 열리지 않고
      셋인데 열리는 길이 실제로 있다.
   ⭐ **갈래 수를 따로 담는 상태가 코드에 없다** — `rlKinds(st)` 한 줄이 그것을 다 정하고,
      `RL_OWNER[`를 읽는 자리도 `rlOwnerOf` 한 곳뿐이다.
   ⭐ **의사 결정을 여는 자리와 빗대는 말을 고르는 자리에 옳고 그름이 없다**(정답 상수 부재 · 감점 0).
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */

/* 민주주의에서 미디어의 역할 셋 — 지도서 「14~15차시 주요 내용 정리」 1 원문 */
const RL_ROLE = ['새로운 사실을 신속하게 전달해요','사회적인 가치나 규범을 제시해요','사회문제를 지목하고 해결 방안을 제시해요'];
const RL_ROLE_S = ['새로운 사실','가치나 규범','문제와 해결 방안'];
/* 판이 받는 자료 여섯 — 교과서 95~99쪽 */
const RL_CASE = ['㉠ 보호 구역에 방치된 전동 킥보드를 발견 즉시 옮긴다는 소식',
                 '㉡ 편견과 차별이 없는 말을 쓰자고 권하는 텔레비전 프로그램',
                 '㉢ 논밭과 산에 세운 태양광 발전 시설의 문제와 해결 방법을 알린 글',

                 '㉤ 새로운 돌고래를 동물원이나 수족관에 들일 수 없게 됐다는 소식',
                 '㉥ 돌고래가 바다로 돌아가기까지를 담은 방송'];
const RL_CASE_S = ['㉠ 킥보드 소식','㉡ 말 프로그램','㉢ 태양광 글','㉣ 어린이 프로그램','㉤ 돌고래 소식','㉥ 돌고래 방송'];
const RL_CASE_D = ['방치된 전동 킥보드를 옮긴다는 <b>새로운 사실</b>을 사람들이 곧바로 알게 됐어요.',
                   '어떤 말을 쓰는 것이 좋은지 <b>사회에서 중요하게 여기는 가치</b>를 보여 줘요.',

                   '돌고래 쇼의 <b>문제와 그 해결 방안</b>을 더 많은 사람이 이해하게 됐어요.'];
/* ⚠️ 자료 i가 담기는 역할 — 이 한 줄이 판의 대답을 통째로 정한다(난수 0). */
const RL_OWNER = [0, 1, 2, 1, 0, 2];
/* ★ 판이 열리는 조건 — 쌓인 수가 아니라 갈래다. 이 한 줄이 그것을 정한다. */

/* ③ 빗대는 말과 까닭 — 지도서 예시 답안 원문 두 가지 */
const RL_LIKE = ['안내소','파수꾼'];
const RL_WHY = ['사람들이 의사 결정을 하는 데 필요한 다양한 정보를 제공하기 때문이에요',
                '중요한 사실을 알리고 사회문제를 지목한 뒤 그것이 해결되도록 사람들의 생각을 모으기 때문이에요'];
const RL_WHY_S = ['필요한 정보를 줘요','생각을 모아 줘요'];
/* ⚠️ 빗대는 말 j가 가리키는 까닭 자리 — 이 한 줄이 대응을 통째로 정한다(난수 0). */
const RL_PAIROF = [0, 1];
/* ④ 마무리 — 민주주의에서 미디어가 중요한 까닭(지도서 「주요 내용 정리」 2 원문) */
const RL_FIN = ['미디어를 이용해 주고받는 여러 정보와 사람들의 생각은 사회문제에 관한 의사 결정을 하는 데 영향을 미쳐요',
                '미디어는 사람들이 정보를 주고받지 못하게 막아요',
                '미디어는 언제나 한 사람에게만 정보를 전해요'];
const RL_FIN_OK = 0;
const RL_FIN_NO = ['',
  '판에서 자료를 담을 때마다 <b>모인 생각</b>이 함께 늘어났어요. 미디어는 정보를 주고받게 해 줘요.',
  '미디어를 이용하면 <b>많은 사람</b>에게 같은 내용의 정보를 한꺼번에 전할 수 있어요.'];
/* 안내 — ⚠️ 여는 자리와 고르는 자리 어디에도 「틀렸다」는 말이 없다 */
const RL_LOCK_M = '아직 <b>채워지지 않은 갈래</b>가 있어요. 판은 모인 생각이 몇인지가 아니라 <b>갈래가 몇 가지 채워졌는지</b>를 봐요. 판은 그대로예요.';
const RL_ALREADY_C = '그 자료는 <b>이미 담았어요.</b> 판은 그대로예요.';
const RL_ALREADY_D = '의사 결정은 <b>이미 열었어요.</b> 판은 그대로예요.';
const RL_ORDER_R = '먼저 <b>자료</b>를 하나 골라 봐요.';
const RL_WRONG_R = '그 역할에 담을 자료가 아니에요. 이 자료가 사람들에게 무엇을 알려 주는지 다시 읽어 봐요.';
const RL_ORDER_L = '먼저 <b>자료 여섯</b>을 모두 담고 <b>의사 결정</b>을 열어 봐요.';
const RL_ALREADY_L = '그 말은 <b>이미 짝지었어요.</b> 판은 그대로예요.';
const RL_ORDER_W = '먼저 <b>빗대는 말</b>을 하나 골라 봐요.';
const RL_WRONG_W = '그 말에 붙는 까닭이 아니에요. 그 말이 무엇을 해 주는 곳인지 떠올려 봐요.';

/* ★ RL_OWNER를 읽는 자리는 여기 한 곳뿐이다. */
function rlOwnerOf(i){ return RL_OWNER[i]; }
/* ★ RL_PAIROF를 읽는 자리는 여기 한 곳뿐이다. */
function rlWhyOf(j){ return RL_PAIROF[j]; }
function rlBits(m,n){ const r=[]; for(let k=0;k<n;k++){ if(m & (1<<k)) r.push(k); } return r; }
/* ★ 이 한 줄이 「지금 모인 생각이 몇인가」를 다 정한다 — 담은 자료마다 하나씩 오른다. */
function rlSum(st){ return st.rlOwn.filter(v=>v>=0).length; }
/* ★ 이 한 줄이 「지금 채워진 갈래가 몇인가」를 다 정한다 —
   그것을 따로 담는 상태가 코드에 없다. 모인 생각이 늘어도 이 값은 그대로일 수 있다. */
function rlKinds(st){ let n=0; for(let r=0;r<RL_ROLE.length;r++){ if(st.rlOwn.indexOf(r)>=0) n++; } return n; }
/* 역할 r에 담긴 자료 수 — 판이 그리는 두 자리 가운데 하나 */
function rlCnt(st,r){ return st.rlOwn.filter(v=>v===r).length; }
function rlCanOpen(st){ return rlKinds(st) >= RL_NEED; }
function rlAllOwn(st){ return st.rlOwn.every(v=>v>=0); }
function rlAllPair(st){ return st.rlPair === (1<<RL_LIKE.length)-1; }
function rlLikeOpen(st){ return rlAllOwn(st) && st.rlDec; }
function rlReady(st){ return rlAllPair(st); }

/* 판 — 위는 역할 세 칸, 가운데는 자료 여섯 칸, 아래는 모인 생각·갈래·의사 결정·빗대는 말.
   ⚠️ 갈래를 그리는 자리는 **여기 한 곳뿐**이고, 값은 `rlKinds(st)`가 정한다. */
function rlCanvas(st){
  const fin = st.rlFin!=null;
  const sum = rlSum(st), kinds = rlKinds(st), open = rlCanOpen(st);

      : (rlLikeOpen(st) ? '민주주의에서 미디어는 무엇과 같을까요'
        : (st.rlDec ? '남은 자료도 마저 담아 봐요'
          : (open ? '갈래 셋이 다 채워졌어요 — 의사 결정을 열 수 있어요'
            : '아직 채워지지 않은 갈래가 있어요'))));
  g+=`<text x="160" y="19" font-size="9.4" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  for(let r=0;r<RL_ROLE.length;r++){
    const n = rlCnt(st,r), x = 12 + r*100;
    g+=`<rect data-role="${r}" data-cnt="${n}" x="${x}" y="26" width="96" height="42" rx="7" fill="${n>0?'#fff':'#F8FAFC'}" stroke="${n>0?'#C2410C':'#CBD5E0'}" stroke-width="${n>0?1.7:1.2}"${n>0?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+48}" y="42" font-size="6.8" fill="${n>0?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${RL_ROLE_S[r]}</text>`;
    g+=`<text x="${x+48}" y="60" font-size="7.4" fill="${n>0?'#C2410C':'#CBD5E0'}" text-anchor="middle" font-weight="800">${n>0?('담긴 자료 '+n):'아직 비었어요'}</text>`;
  }
  for(let i=0;i<RL_CASE.length;i++){
    const own = st.rlOwn[i], put = own>=0, x = 12 + (i%3)*100, y = 74 + Math.floor(i/3)*32;
    g+=`<rect data-case="${i}" data-own="${own}" x="${x}" y="${y}" width="96" height="28" rx="6" fill="${put?'#fff':'#F8FAFC'}" stroke="${put?'#EA580C':'#CBD5E0'}" stroke-width="${put?1.5:1.1}"${put?'':' stroke-dasharray="3 3"'}/>`;
    g+=`<text x="${x+48}" y="${y+12}" font-size="6.4" fill="${put?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${RL_CASE_S[i]}</text>`;
    g+=`<text x="${x+48}" y="${y+23}" font-size="6" fill="${put?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="800">${put?RL_ROLE_S[own]:'아직 담지 않았어요'}</text>`;
  }
  g+=`<rect x="12" y="140" width="296" height="22" rx="7" fill="${sum>0?'#FFEDD5':'#fff'}" stroke="${sum>0?'#EA580C':'#CBD5E0'}" stroke-width="1.4"${sum>0?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text data-sum="${sum}" x="160" y="155" font-size="7.6" fill="${sum>0?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">모인 생각 ${sum} / 6 — 자료를 담을 때마다 함께 올라요</text>`;
  g+=`<rect x="12" y="166" width="296" height="22" rx="7" fill="${open?'#FFEDD5':'#fff'}" stroke="${open?'#C2410C':'#CBD5E0'}" stroke-width="1.5"${open?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text data-kinds="${kinds}" x="160" y="181" font-size="7.6" fill="${open?'#C2410C':'#94A3B8'}" text-anchor="middle" font-weight="800">채워진 갈래 ${kinds} / 3 — ${open?'판이 열려요':'모인 생각이 많아도 열리지 않아요'}</text>`;
  g+=`<rect data-dec="${st.rlDec?1:0}" x="12" y="192" width="296" height="26" rx="7" fill="${st.rlDec?'#fff':'#F1F5F9'}" stroke="${st.rlDec?'#C2410C':'#E2E8F0'}" stroke-width="${st.rlDec?2:1.1}"${st.rlDec?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text x="160" y="209" font-size="7.4" fill="${st.rlDec?'#C2410C':'#CBD5E0'}" text-anchor="middle" font-weight="800">${st.rlDec?'사회문제에 관한 의사 결정에 영향을 미쳐요':'의사 결정 — 아직 열리지 않았어요'}</text>`;
  for(let j=0;j<RL_LIKE.length;j++){
    const pd = !!(st.rlPair & (1<<j)), x = 12 + j*148, lo = rlLikeOpen(st);

  g+=`<rect x="12" y="254" width="296" height="16" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.1"/>`;
  g+=`<text x="160" y="265" font-size="6.4" fill="#9A3412" text-anchor="middle" font-weight="800">담은 자료 ${sum} / 6 · 채워진 갈래 ${kinds} / 3 · 짝지은 말 ${pairN} / 2</text>`;
  g+=`<rect data-pairn="${pairN}" x="14" y="253" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 280"><rect width="320" height="280" fill="#ffffff"/>${g}</svg>`;
}

function rlPanel(st){
  const fin = st.rlFin!=null, lo = rlLikeOpen(st);
  const q = fin
    ? '자료를 담을 때마다 <b>역할 칸</b>과 <b>모인 생각</b>이 함께 올랐어요. 판이 열린 것은 모인 수가 커서가 아니라 <b>갈래가 다 채워졌기</b> 때문이에요.'
    : (rlReady(st) ? '민주주의에서 <b>미디어가 중요한 까닭</b>은 무엇일까요?'
      : (lo ? (st.rlOpenL==null ? '빗대는 말을 하나 골라 봐요. 어느 것부터 골라도 돼요.'
                                : '이 말에 붙는 <b>까닭</b>은 무엇일까요?')
        : (st.rlPick==null ? '자료를 하나 골라 봐요. 어느 것부터 골라도 돼요.'
                           : '이 자료는 미디어의 <b>어떤 역할</b>을 보여 줄까요?')));

  if(fin){
    right+=`<div class="dw-card"><div class="pt">🗞️ 두 자리가 함께 오르는 판이었어요</div>
      <div>자료를 역할에 담을 때마다 <b>역할 칸</b>과 <b>모인 생각</b>이 <b>같은 걸음에 함께</b> 올랐어요. 미디어가 하는 일은 그때마다 사람들 사이에 생각도 함께 쌓아요.</div>

      <div style="margin-top:5px;color:#64748B">태양광 발전 시설의 해결 방법에 관한 <b>내 입장을 댓글로 쓰고 친구들과 이야기하는</b> 활동과, 민주주의에서 미디어를 무엇에 빗댈지 <b>내 문장으로 적어 보는</b> 활동은 교실에서 하는 활동이에요. 화면이 그 활동을 대신하지 않아요.</div></div>`;

  } else if(lo){
    if(st.rlOpenL==null){
      right+=`<div class="dw-step">💬 빗대는 말 고르기 — 이 자리에는 옳고 그름이 없어요</div>`;
      right+=`<div class="rl-keynote">민주주의에서 미디어는 무엇과 같을까요? <b>안내소든 파수꾼이든 좋아요.</b> 판이 재는 것은 빗댄 말이 아니라 그 <b>까닭</b>이에요.</div>`;
      right+=`<div class="rl-list">${RL_LIKE.map((c,j)=>{
        const on = !!(st.rlPair & (1<<j));
        return `<button class="${on?'ok':''}" onclick="rlLikeSel(${j})">${on?'✓ ':''}${c}</button>`;
      }).join('')}</div>`;
    } else {

  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">담을 때마다 두 자리가 함께 올라요</h2>
  <div class="ka-grp">${rlPanel(st)}</div>`});
// 7 살펴보기 — reveal: [풍덩 사회 속으로] 1인 미디어(교과서 100쪽)
slides.push({stage:2,badge:"개념",reveal:true,render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">[풍덩 사회 속으로] 1인 미디어로 정보의 생산자가 돼요</h2>
  <div class="ka-grp">
  <div class="paper"><div class="ph">💬 돌아가며 말하기</div>
    개인이 글, 사진, 영상 등과 같은 정보를 만들어 미디어를 통해 다른 사람들과 공유하는 것을 <b>1인 미디어</b>라고 해요. 1인 미디어가 활성화되면서 무엇이 달라졌을까요?</div>
  <div class="scene-row">${sceneCard('solo','1인 미디어','wide')}</div>
  ${st.revealed?`<div class="answer-box">· 사람들은 정보의 소비자에서 <b>누구나 정보의 생산자</b>가 될 수 있게 됐어요.<br>
    · 민주주의에서 다양한 사람이 자신의 생각을 <b>더욱 활발하게 소통</b>할 수 있게 됐어요.<br>
    <span style="color:#64748B">내가 이용해 본 1인 미디어는 내가 직접 적어요.</span></div>`
    :`<div class="note">누가 정보를 만들 수 있게 됐을까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  <div class="tipbox"><b>폴로(follow)</b> — 주로 사회 관계망 서비스에서 특정 운영자의 게시물을 지속적으로 볼 수 있게 구독하는 것.</div>
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약 — 14~15차시 주요 내용 정리 원문
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('wrap','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">①</span><div><b style="color:var(--green)">새로운 사실</b> — 많은 사람에게 영향을 미치는 새로운 사실을 신속하게 전달해요.</div></div>
    <div class="sum-item"><span class="n">②</span><div><b style="color:var(--green)">가치나 규범</b> — 사회적인 가치나 규범을 제시해요.</div></div>
    <div class="sum-item"><span class="n">③</span><div><b style="color:var(--green)">사회문제</b> — 사회문제를 지목하고 그것의 해결 방안을 제시해요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--green)">중요한 까닭</b> — 미디어를 이용해 주고받는 여러 정보와 사람들의 생각은 사회문제에 관한 의사 결정을 하는 데 영향을 미쳐요.</div></div>
  </div>
  <div class="note">다음 시간에는 미디어의 내용을 <b style="color:var(--green)">비판적</b>으로 분석해야 하는 까닭을 알아봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 평가해요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"민주주의에서 미디어의 역할을 설명할 수 있어요",st)}
    ${selfCheck(1,"민주주의에서 미디어가 중요한 까닭을 설명할 수 있어요",st)}
    ${selfCheck(2,"1인 미디어가 무엇인지 설명할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 미디어의 내용을 <b style="color:var(--amber)">비판적</b>으로 분석해야 하는 까닭!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l11";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  rlOwn:[-1,-1,-1,-1,-1,-1], rlPick:null, rlDec:false, rlOpenL:null, rlPair:0, rlFin:null,
  rlWrongR:null, rlWrongW:null, rlWrongF:null,
  rlMsg:null, rlWarn:false, rlBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function rlRender(){ main.innerHTML = slides[state.idx].render(state); }
function rlHold(msg){
  state.rlWarn=true; state.rlBusy=true; state.rlMsg=msg;
  playThud(); rlRender();
  setTimeout(()=>{ state.rlBusy=false; state.rlWarn=false; state.rlMsg=null;
    state.rlWrongR=null; state.rlWrongW=null; state.rlWrongF=null; rlRender(); },1600);
}

/* ① 자료 고르기 — ⚠️ 판정 0 · 순서 자유(어느 자료부터 골라도 된다) */
function rlCase(i){
  if(state.rlFin!=null) return;                                        // 가드①
  if(state.rlBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=RL_CASE.length) return;         // 가드②
  if(state.rlOwn[i]>=0){ rlHold(RL_ALREADY_C); return; }               // 가드④ 판 불변
  state.rlPick = i; state.rlWarn=false; state.rlMsg=null;
  playBlip(); rlRender();
}

/* ① 역할에 담기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   한 걸음이 판의 **두 자리**(그 역할 칸과 모인 생각 줄)를 함께 올린다.
   ⚠️ 어긋나도 판은 그대로이고 안내가 알맞은 역할을 짚지 않는다. */
function rlRole(k){
  if(state.rlFin!=null) return;                                        // 가드①
  if(state.rlBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RL_ROLE.length) return;         // 가드②
  if(state.rlPick==null){ rlHold(RL_ORDER_R); return; }                // 순서 — 판 불변
  const i = state.rlPick;
  if(rlOwnerOf(i)!==k){                                                // 어긋남 — 판 불변
    state.rlWrongR=k; rlHold(RL_WRONG_R); return; }
  const wasOpen = rlCanOpen(state);
  state.rlOwn[i] = k;                                                  // ★ 담는 자리는 여기 한 곳뿐
  state.rlPick=null; state.rlWrongR=null; state.rlWarn=false;
  state.rlMsg = rlAllOwn(state)
    ? `<b>「${RL_CASE_S[i]}」</b>를 담았어요. 자료 여섯을 <b>모두</b> 담았어요 — 모인 생각 ${rlSum(state)} · 채워진 갈래 ${rlKinds(state)}.`
    : `<b>「${RL_CASE_S[i]}」</b>를 담았어요. ${RL_CASE_D[i]} 모인 생각 <b>${rlSum(state)}</b> · 채워진 갈래 <b>${rlKinds(state)}</b>.`;
  if(!wasOpen && rlCanOpen(state)) playChime(); else playBlip();
  rlRender();
}

/* ② 의사 결정 열기 — ⚠️ 판정 0 · 인자 0. ★ 여는 조건은 쌓인 수가 아니라 갈래다. */
function rlDecide(){
  if(state.rlFin!=null) return;                                        // 가드①
  if(state.rlBusy) return;                                             // 가드⑨
  if(state.rlDec){ rlHold(RL_ALREADY_D); return; }                     // 가드⑤ 판 불변
  if(!rlCanOpen(state)){ rlHold(RL_LOCK_M); return; }                  // 가드③ ★핵심 — 판 불변
  state.rlDec = true; state.rlWarn=false;
  state.rlMsg = `세 갈래가 <b>다 채워졌어요.</b> 주고받은 정보와 사람들의 생각이 사회문제에 관한 <b>의사 결정</b>에 영향을 미쳐요.`;
  playChime(); rlRender();
}

/* ③ 빗대는 말 고르기 — ⚠️ 판정 0(안내소든 파수꾼이든 좋다) · 순서 자유 */
function rlLikeSel(j){
  if(state.rlFin!=null) return;                                        // 가드①
  if(state.rlBusy) return;                                             // 가드⑨
  if(!Number.isInteger(j) || j<0 || j>=RL_LIKE.length) return;         // 가드②
  if(!rlLikeOpen(state)){ rlHold(RL_ORDER_L); return; }                // 가드⑥ 순서 — 판 불변
  if(state.rlPair & (1<<j)){ rlHold(RL_ALREADY_L); return; }           // 가드⑦ 판 불변
  state.rlOpenL = j; state.rlWarn=false; state.rlMsg=null;
  playBlip(); rlRender();
}

/* ③ 까닭 짝짓기 — 판정 있음. ⚠️ 어긋나도 판은 그대로이고 안내가 알맞은 까닭을 짚지 않는다. */
function rlWhy(k){
  if(state.rlFin!=null) return;                                        // 가드①
  if(state.rlBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RL_WHY.length) return;          // 가드②
  if(state.rlOpenL==null){ rlHold(RL_ORDER_W); return; }               // 순서 — 판 불변
  const j = state.rlOpenL;
  if(rlWhyOf(j)!==k){                                                  // 어긋남 — 판 불변
    state.rlWrongW=k; rlHold(RL_WRONG_W); return; }
  state.rlPair |= 1<<j; state.rlOpenL=null; state.rlWrongW=null; state.rlWarn=false;
  state.rlMsg = rlAllPair(state)
    ? `<b>「${RL_WHY_S[k]}」</b> — 빗대는 말 둘에 까닭을 <b>모두</b> 붙였어요.`
    : `<b>「${RL_WHY_S[k]}」</b>예요.`;
  if(rlAllPair(state)) playChime(); else playBlip();
  rlRender();
}

/* ④ 마무리 — 「민주주의에서 미디어가 중요한 까닭은?」 */
function rlFinish(k){
  if(state.rlFin!=null) return;                                        // 가드①
  if(state.rlBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RL_FIN.length) return;          // 가드②
  if(!rlReady(state)) return;                                          // 가드⑧ 순서 — 판 불변
  if(k===RL_FIN_OK){
    state.rlFin=k; state.rlWrongF=null; state.rlMsg=null; state.rlWarn=false;
    playChime(); rlRender(); return;
  }
  state.rlWrongF=k;
  rlHold(RL_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l12_따져봐요.html'; } // l12 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

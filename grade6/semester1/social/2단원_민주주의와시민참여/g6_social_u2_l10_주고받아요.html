   (l05 `나랏일` · l06 `법이되기까지` · l07 `나라살림` · l08 `세번까지` · l09 `나눠맡아요` 선례 승계).

직접조작: 잣대를 걷어 내야 답이 나오는 판(56번째 신규 패턴 — 판이 재는 물음이 줄어들수록
  답에 가까워지고, 걷어 낼 수 없는 잣대가 하나 남는 형)
  ⭐ 앞의 쉰다섯 종에서 **판이 재는 것은 늘거나 그대로였다.** 50번째(잣대를 세워야 걸러지는 판)에서는
     잣대를 세울수록 걸러진 것이 늘었고, 다른 판들에서도 학생이 한 일은 언제나 판에 무엇을
     **더하는** 일이었다. 이번만 **걷어 내야 판이 답한다** — 겉모습을 재던 잣대를 하나씩 걷어 내면
     판이 두 자료를 가르지 못하게 되고, 그때 비로소 「둘 다 미디어예요」라고 말한다.
     근거는 이 차시의 [스스로 활동]이 **미디어의 결정적 속성**을 가려내는 활동이라는 것 —
     결정적 속성을 찾는 일은 곧 **결정적이지 않은 것을 걷어 내는 일**이다.
  ⭐ **50번째와의 정면 대비** — 거기서는 잣대를 **세웠고**, 여기서는 잣대를 **걷어 낸다.**
     판이 재는 잣대의 수가 줄어드는 자리는 여기가 처음이다.
  ⭐ **52번째(걸음이 물러나는 판)와의 대비** — 거기서 줄어든 것은 판의 **걸음**이었고 재는 잣대는
     그대로였다. 여기서는 걸음이 아니라 **잣대 자체가 줄어든다.**
  ⭐ **55번째(가리키는 자리가 사라지는 판)와의 대비** — 거기서 사라진 것은 판이 가리키는 **자리**였고,
     여기서 사라지는 것은 판이 묻는 **물음**이다.
  ⭐ **걷어 낼 수 없는 잣대가 하나 있다** — `MD_KEY` 한 줄이 그것을 정한다. 그것까지 걷어 내면
     미디어인지 아닌지를 물을 것이 하나도 남지 않기 때문이다. 그 잣대가 곧 결정적 속성이다.
  ⭐ **겉모습이 전혀 다른 두 자료가 마지막 잣대 하나에서 같은 답을 얻는다** — 두 자료를 가르던
     잣대가 처음에는 셋이었는데 걷어 낼수록 `3 → 2 → 1 → 0`으로 줄어든다.
  ⭐ **가르는 잣대의 수를 따로 담는 상태가 코드에 아예 없다** — `mdSplit(st)` **한 줄**이 그것을
     다 정하고, `MD_ANS[`를 읽는 자리도 `mdAnsOf` 한 곳뿐이며, `data-split`을 그리는 자리도 단 하나다.
  ⭐ **걷어 내는 자리에 「틀렸다」는 말이 없다** — 결정적인 잣대를 걷어 내려 해도 판은 왜 걷어 낼 수
     없는지만 말하고 감점하지 않는다(`MD_OUT_OK` 부재 · 감점 0).
  ① **잣대 걷어 내기 3걸음**(겉모습을 재는 잣대 셋 · 순서 자유 · 판정 있음 — 결정적인 잣대는 걷어 낼 수 없다)
  ② **남은 잣대 하나로 두 자료 재기**(무판정 · 둘 다 「예」 · 순서 자유)
  ③ **미디어 종류 셋 짝짓기**(신문·방송·사회 관계망 서비스 ↔ 특징 · 순서 자유 · 판정 있음 · 교과서 94쪽 원문)
  ④ 마무리 3택 = 미디어의 뜻(지도서 정리 원문)
  ⚠️ 자료·잣대·종류·3택 전량 고정 리터럴 — 난수 0(`MD_ANS` · `MD_KEY` · `MD_PAIROF` 각 한 줄).
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 가르는 잣대가 남아 있는 동안 자료 재기 무시(순서) — 판 불변 /
     ④ **결정적인 잣대는 걷어 낼 수 없음 — 판 불변**(핵심 가드) / ⑤ 이미 걷어 낸 잣대 재클릭 — 판 불변 /
     ⑥ 두 자료를 다 재기 전 종류 고르기 무시(순서) — 판 불변 / ⑦ 이미 짝지은 종류 재클릭 — 판 불변 /
     ⑧ 세 종류를 다 짝짓기 전 마무리 무시(순서) / ⑨ 안내 표시 중 재클릭 무시(`mdBusy`).

⚠️ 정직 원칙 네 곳
  ㉠ **판의 잣대는 두 자료를 견주려고 판이 세운 자리이지 미디어를 가리는 공식 기준표가 아니다**
     — 교과서가 정한 잣대는 마지막 하나(정보를 주고받으며 의사소통하려고 쓰는 수단인가)뿐이다(캔버스 캡션).
  ㉡ **미디어가 아닌 예를 지어내지 않는다** — 교과서가 미디어가 아닌 예를 들지 않았으므로 판도 들지 않는다.
     판이 재는 자료는 교과서 93쪽 ㉮·㉯ 둘뿐이고, 둘 다 미디어다.
  ㉢ **걷어 내는 자리에 옳고 그름을 두지 않는다** — 감점 0 · 정오 어휘 0.
  ㉣ **[친구와 활동] 미디어를 이용한 경험을 쓰고 친구들과 이야기하는 활동은 교실 몫이다**(완료 카드 명시).

⚠️ 설계 원칙
  · **14~15차시 침범 0** — 미디어의 역할(새로운 사실 전달·사회적 가치나 규범 제시·사회문제 주목·

  · **16차시 침범 0** — 허위 조작 정보 0 · 거짓 정보 0 · 비판적 0 · 신뢰 0.
  · **17~18차시 침범 0** — 이용 습관 0 · 피라미드 0 · 주의하는 방법 0.
  · **19~20차시 침범 0** — 뉴스 기사 작성 0 · 생각 그물 0 · 물레방아 0.

  · **주제① 재현 최소** — 공약·유권자·후보자·기표소·투표율 0. 「선거」는 교과서 92~93쪽 [스스로 활동]
    원문 자리까지(선거 공고문 · 선거 안내 인터넷 누리집 · 선거 관련 정보).
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 실제 정당·정치인 0, 실제 선거·연도 0, 실제 누리집·방송사·신문사 이름 0,

    매개자·중간자·연결자, 국어과 성취기준 번호 전부 0.
  · **파일 전체에 네 자리 연도 0 · 금액·인원 수치 0**(CSS 밖 스코프).

.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.md-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:var(--bub);border-radius:9px;padding:7px 11px;line-height:1.45}
.md-fin{display:flex;flex-direction:column;gap:5px}
.md-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.md-fin button:hover{background:var(--bub)}
.md-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.md-list{display:flex;flex-direction:column;gap:5px;max-height:206px;overflow-y:auto}
.md-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.md-list button:hover{border-color:var(--green);background:var(--bub)}
.md-list button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.md-list button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.md-list button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.md-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.md-keynote{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.md-keynote b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}
</style>
<script src="/kedu_gate.js"></script>
</head>

  </div>
</div>

/* ===== 직접조작 — 잣대를 걷어 내야 답이 나오는 판(56번째 신규 패턴) =====
   ⭐ 앞의 쉰다섯 종에서 **판이 재는 것은 늘거나 그대로였다.** 50번째(잣대를 세워야 걸러지는 판)에서는
      잣대를 세울수록 걸러진 것이 늘었다. 이번만 **걷어 내야 판이 답한다.**
   ⭐ **걷어 낼 수 없는 잣대가 하나 있다**(`MD_KEY`) — 그것까지 걷어 내면 미디어인지 아닌지를 물을 것이
      하나도 남지 않기 때문이다. 그것이 결정적 속성이다.
   ⭐ **가르는 잣대의 수**는 `mdSplit(st)` 한 줄이 다 정한다. 그것을 따로 담는 상태가 코드에 없고,
      `MD_ANS[`를 읽는 자리도 `mdAnsOf` 한 곳뿐이다.
   ⭐ **걷어 내는 자리에 옳고 그름이 없다**(정답 상수 부재 · 감점 0).
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */

/* 판이 재는 두 자료 — 교과서 93쪽 [스스로 활동] ㉮·㉯ */
const MD_SRC = ['㉮ 옛날의 선거 공고문','㉯ 선거 안내 인터넷 누리집'];
const MD_SRC_S = ['㉮ 공고문','㉯ 누리집'];
const MD_SRC_D = ['사람들이 많이 모이는 곳에 선거 관련 정보를 알리는 공고문을 게시했어요.',
                  '인터넷 누리집에서 선거 관련 정보를 확인하고 궁금한 점을 직접 묻고 답할 수 있어요.'];
/* 판이 세운 잣대 넷 — 앞의 셋은 겉모습을 재고, 마지막 하나만 미디어인지를 잰다. */
const MD_TEST = ['옛날에 쓰던 것인가요?','종이에 적혀 있나요?','사람들이 많이 모이는 곳에 걸어 두나요?',
                 '사람들이 정보를 주고받으며 의사소통하려고 쓰나요?'];
const MD_TEST_S = ['옛날 것인가','종이인가','걸어 두는가','정보를 주고받는 수단인가'];
/* ⚠️ 잣대 t로 잰 두 자료의 답 — 이 한 줄이 판의 대답을 통째로 정한다(난수 0). */
const MD_ANS = [[1,0],[1,0],[1,0],[1,1]];
/* ★ 걷어 낼 수 없는 잣대 — 이 한 줄이 「결정적 속성」을 정한다. */
const MD_KEY = 3;
/* ③ 미디어의 종류와 특징 — 교과서 94쪽 원문 */
const MD_KIND = ['신문','방송','사회 관계망 서비스'];
const MD_KIND_S = ['신문','방송','사회 관계망'];
const MD_FEAT = ['영상과 소리 등을 이용해 다양한 정보를 전달합니다',
                 '글, 음성, 영상 등 다양한 형태의 정보를 주고받으며 의사소통합니다',
                 '글과 사진 등으로 새로운 정보를 전달합니다'];
const MD_FEAT_S = ['영상과 소리','글·음성·영상','글과 사진'];
/* ⚠️ 종류 i가 가리키는 특징 자리 — 이 한 줄이 대응을 통째로 정한다(난수 0). */
const MD_PAIROF = [2, 0, 1];
/* ④ 마무리 — 미디어의 뜻(지도서 정리 원문) */
const MD_FIN = ['사람들이 정보를 주고받으며 의사소통하기 위해 사용하는 수단이에요',
                '옛날 사람들만 쓰던 물건을 가리키는 말이에요',
                '종이에 적어서 전하는 글만 가리키는 말이에요'];
const MD_FIN_OK = 0;
const MD_FIN_NO = ['',
  '미디어는 옛날부터 오늘날까지 이어져 왔어요. 오늘날에도 전화·책·신문·방송·사회 관계망 서비스를 이용해요.',
  '판이 잣대를 걷어 낼 때 <b>「종이인가」</b>는 미디어를 정하는 잣대가 아니었어요.'];
/* 안내 — ⚠️ 어느 문구에도 「틀렸다」는 말이 없다 */
const MD_KEY_M = '이 잣대는 <b>걷어 낼 수 없어요.</b> 이것까지 걷어 내면 미디어인지 아닌지를 <b>물을 것이 하나도 남지 않아요.</b> 판은 그대로예요.';
const MD_ALREADY_T = '그 잣대는 <b>이미 걷어 냈어요.</b> 판은 그대로예요.';
const MD_ORDER_S = '아직 두 자료를 <b>가르는 잣대</b>가 남아 있어요. 먼저 걷어 내 봐요.';
const MD_ALREADY_S = '그 자료는 <b>이미 쟀어요.</b> 판은 그대로예요.';
const MD_ORDER_K = '먼저 <b>두 자료</b>를 남은 잣대로 재어 봐요.';
const MD_ALREADY_K = '그 종류는 <b>이미 짝지었어요.</b> 판은 그대로예요.';
const MD_ORDER_F = '먼저 <b>종류</b>를 하나 골라 봐요.';
const MD_WRONG_F = '그 종류의 특징이 아니에요. 무엇으로 정보를 전달하는지 다시 읽어 봐요.';

/* ★ MD_ANS를 읽는 자리는 여기 한 곳뿐이다. */
function mdAnsOf(t,s){ return MD_ANS[t][s]; }
/* ★ MD_PAIROF를 읽는 자리는 여기 한 곳뿐이다. */
function mdFeatOf(i){ return MD_PAIROF[i]; }
function mdBits(m,n){ const r=[]; for(let k=0;k<n;k++){ if(m & (1<<k)) r.push(k); } return r; }
/* 지금 판에 남아 있는 잣대 */
function mdLeft(st){ const r=[]; for(let t=0;t<MD_TEST.length;t++){ if(!(st.mdOut & (1<<t))) r.push(t); } return r; }
/* ★ 이 한 줄이 「지금 판이 두 자료를 가르는 잣대가 몇인가」를 다 정한다 —
   그것을 따로 담는 상태가 코드에 없다. 걷어 낼수록 이 값이 줄어든다(3 → 2 → 1 → 0). */
function mdSplit(st){ return mdLeft(st).filter(t=>mdAnsOf(t,0)!==mdAnsOf(t,1)).length; }
function mdSame(st){ return mdSplit(st)===0; }
function mdAllJudge(st){ return st.mdJudge === (1<<MD_SRC.length)-1; }
function mdAllPair(st){ return st.mdPair === (1<<MD_KIND.length)-1; }
function mdReady(st){ return mdAllPair(st); }

/* 판 — 위는 자료 두 칸, 가운데는 잣대 네 줄, 아래는 판의 답과 종류 세 칸.
   ⚠️ 가르는 잣대의 수를 그리는 자리는 **여기 한 곳뿐**이고, 값은 `mdSplit(st)`가 정한다. */
function mdCanvas(st){
  const fin = st.mdFin!=null;
  const outN = mdBits(st.mdOut,MD_TEST.length).length, judN = mdBits(st.mdJudge,MD_SRC.length).length;
  const pairN = mdBits(st.mdPair,MD_KIND.length).length, split = mdSplit(st);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = fin ? '정보를 주고받으며 의사소통하려고 쓰는 수단이 미디어예요'
    : (mdReady(st) ? '미디어의 종류 셋을 모두 짝지었어요'
      : (mdAllJudge(st) ? '겉모습은 달라도 둘 다 미디어예요'
        : (mdSame(st) ? '남은 잣대는 하나예요 — 두 자료를 재어 봐요'
          : '잣대가 많아서 둘이 같은지 아직 말할 수 없어요')));
  g+=`<text x="160" y="19" font-size="9.6" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  for(let s=0;s<MD_SRC.length;s++){
    const said = !!(st.mdJudge & (1<<s)), x = 12 + s*156;
    g+=`<rect data-src="${s}" data-said="${said?1:0}" x="${x}" y="26" width="140" height="40" rx="7" fill="${said?'#fff':'#F8FAFC'}" stroke="${said?'#C2410C':'#CBD5E0'}" stroke-width="${said?1.7:1.2}"${said?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+70}" y="42" font-size="7.6" fill="${said?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${MD_SRC_S[s]}</text>`;
    g+=`<text x="${x+70}" y="57" font-size="6.6" fill="${said?'#C2410C':'#CBD5E0'}" text-anchor="middle" font-weight="800">${said?'예 — 미디어예요':'아직 재지 않았어요'}</text>`;
  }
  for(let t=0;t<MD_TEST.length;t++){
    const gone = !!(st.mdOut & (1<<t)), y = 72 + t*22;
    const cuts = mdAnsOf(t,0)!==mdAnsOf(t,1);
    g+=`<rect data-test="${t}" data-gone="${gone?1:0}" x="12" y="${y}" width="296" height="19" rx="6" fill="${gone?'#F1F5F9':'#fff'}" stroke="${gone?'#E2E8F0':(cuts?'#EA580C':'#C2410C')}" stroke-width="${gone?1:1.5}"${gone?' stroke-dasharray="3 3"':''}/>`;
    g+=`<text x="22" y="${y+13}" font-size="7" fill="${gone?'#CBD5E0':'#9A3412'}" font-weight="800"${gone?' text-decoration="line-through"':''}>${MD_TEST_S[t]}</text>`;
    g+=`<text x="238" y="${y+13}" font-size="6.6" fill="${gone?'#CBD5E0':(cuts?'#B45309':'#C2410C')}" text-anchor="middle" font-weight="800">${gone?'걷어 냈어요':(cuts?'㉮ 예 · ㉯ 아니요 — 갈라요':'㉮ 예 · ㉯ 예 — 같아요')}</text>`;
  }
  g+=`<rect x="12" y="161" width="296" height="22" rx="7" fill="${mdSame(st)?'#FFEDD5':'#fff'}" stroke="${mdSame(st)?'#C2410C':'#CBD5E0'}" stroke-width="1.5"${mdSame(st)?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text data-split="${split}" x="160" y="176" font-size="7.6" fill="${mdSame(st)?'#C2410C':'#94A3B8'}" text-anchor="middle" font-weight="800">${split>0?('두 자료를 가르는 잣대가 '+split+'개 남았어요'):'두 자료를 가르는 잣대가 없어요'}</text>`;
  for(let i=0;i<MD_KIND.length;i++){
    const pd = !!(st.mdPair & (1<<i)), x = 12 + i*100, y = 188, open = mdAllJudge(st);
    g+=`<rect data-kind="${i}" data-paired="${pd?1:0}" x="${x}" y="${y}" width="96" height="32" rx="7" fill="${pd?'#fff':'#F8FAFC'}" stroke="${pd?'#C2410C':(open?'#CBD5E0':'#E2E8F0')}" stroke-width="${pd?1.6:1.1}"${pd?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+48}" y="${y+13}" font-size="6.8" fill="${open?'#9A3412':'#E2E8F0'}" text-anchor="middle" font-weight="800">${open?MD_KIND_S[i]:'·'}</text>`;
    g+=`<text x="${x+48}" y="${y+26}" font-size="6.4" fill="${pd?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="800">${open?(pd?MD_FEAT_S[mdFeatOf(i)]:'아직 짝짓지 않았어요'):''}</text>`;
  }
  g+=`<rect x="12" y="224" width="296" height="18" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.1"/>`;
  g+=`<text x="160" y="237" font-size="6.6" fill="#9A3412" text-anchor="middle" font-weight="800">걷어 낸 잣대 ${outN} / 3 · 잰 자료 ${judN} / 2 · 짝지은 종류 ${pairN} / 3</text>`;
  g+=`<rect data-out="${outN}" data-jud="${judN}" data-pairn="${pairN}" x="14" y="160" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function mdPanel(st){
  const fin = st.mdFin!=null, same = mdSame(st), judged = mdAllJudge(st);
  const q = fin
    ? '겉모습이 아주 다른 두 자료가 <b>같은 답</b>을 얻었어요. 미디어를 정하는 것은 겉모습이 아니라 <b>하는 일</b>이에요.'

      : (judged ? (st.mdOpenK==null ? '종류를 하나 골라 봐요. 어느 것부터 골라도 돼요.'

        : (same ? '남은 잣대는 하나뿐이에요. 두 자료를 <b>하나씩 재어</b> 봐요.'
          : '두 자료를 <b>가르는 잣대</b>를 걷어 내 봐요. 어느 것부터 걷어 내도 돼요.')));
  let right = `<div class="md-q">${q}</div>`;

  if(fin){
    right+=`<div class="dw-card"><div class="pt">📡 걷어 내야 답이 나오는 판이었어요</div>
      <div>처음에는 잣대가 넷이라 두 자료가 <b>자꾸 갈렸어요.</b> 겉모습을 재던 잣대를 하나씩 <b>걷어 내자</b> 가르는 잣대가 사라지고, 남은 잣대 하나에서 <b>둘 다 같은 답</b>을 얻었어요.</div>
      <div style="margin-top:5px">그 마지막 잣대는 <b>걷어 낼 수 없었어요.</b> 그것까지 걷어 내면 미디어인지 아닌지를 물을 것이 하나도 남지 않기 때문이에요. 사람들이 <b>정보를 주고받으며 의사소통하기 위해 사용하는 수단</b> — 그것이 미디어예요.</div>
      <div style="margin-top:5px;color:#64748B">생활 속에서 미디어를 이용한 <b>내 경험을 쓰고 친구들과 이야기해 보는</b> 활동은 교실에서 하는 활동이에요. 화면이 그 활동을 대신하지 않아요.</div></div>`;
  } else if(mdReady(st)){
    right+=`<div class="md-fin">${MD_FIN.map((f,k)=>
      `<button class="${st.mdWrongF===k?'no':''}" onclick="mdFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(judged){
    if(st.mdOpenK==null){
      right+=`<div class="dw-step">📚 종류 고르기 — 무엇으로 전달할까요?</div>`;
      right+=`<div class="md-list">${MD_KIND.map((c,i)=>{
        const on = !!(st.mdPair & (1<<i));
        return `<button class="${on?'ok':''}" onclick="mdKind(${i})">${on?'✓ ':''}${c}</button>`;
      }).join('')}</div>`;
    } else {
      right+=`<div class="dw-step">🔎 이 미디어의 특징</div>`;
      right+=`<div class="md-note">${MD_KIND[st.mdOpenK]}</div>`;
      right+=`<div class="md-list">${MD_FEAT.map((f,k)=>
        `<button class="${st.mdWrongK===k?'no':''}" onclick="mdPair(${k})">${f}</button>`).join('')}</div>`;
    }
  } else if(same){
    right+=`<div class="dw-step">⚖️ 남은 잣대로 재기 — 이 자리에는 정답이 없어요</div>`;
    right+=`<div class="md-keynote">남은 잣대는 <b>「${MD_TEST[MD_KEY]}」</b> 하나예요. 두 자료를 하나씩 눌러 재어 봐요. 어느 것부터 눌러도 판이 옳고 그름을 말하지 않아요.</div>`;
    right+=`<div class="md-list">${MD_SRC.map((s,i)=>{
      const on = !!(st.mdJudge & (1<<i));
      return `<button class="${on?'ok':''}" onclick="mdJudge(${i})">${on?'✓ ':''}${s}</button>`;
    }).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">✂️ 잣대 걷어 내기</div>`;
    right+=`<div class="md-keynote">잣대가 많으면 두 자료가 <b>자꾸 갈려요.</b> 미디어인지를 정하는 데 <b>꼭 필요하지 않은</b> 잣대를 걷어 내 봐요. 걷어 낼 수 없는 잣대가 하나 있지만, 그때에도 판이 <b>틀렸다고 말하지 않아요.</b></div>`;
    right+=`<div class="md-list">${MD_TEST.map((t,j)=>{
      const gone = !!(st.mdOut & (1<<j));
      return `<button class="${gone?'ok':''}" onclick="mdCut(${j})">${gone?'✓ 걷어 냄 · ':''}${t}</button>`;
    }).join('')}</div>`;
  }
  if(st.mdMsg) right+=`<div class="dw-msg${st.mdWarn?' warn':''}">${st.mdMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">✂️ 잣대를 걷어 낼수록 답이 가까워져요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${mdCanvas(st)}<div class="cvcap">앞의 세 잣대는 두 자료를 견주려고 판이 세운 자리예요. 교과서가 정한 잣대는 마지막 하나뿐이고, 판이 재는 자료는 교과서에 실린 둘뿐이에요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    ${selfCheck(2,"생활 속에서 이용하는 미디어에 관심을 두게 됐어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 민주주의에서 미디어의 <b style="color:var(--amber)">역할</b> 알아보기!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l10";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  mdOut:0, mdJudge:0, mdOpenK:null, mdPair:0, mdFin:null,
  mdWrongK:null, mdWrongF:null,
  mdMsg:null, mdWarn:false, mdBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function mdRender(){ main.innerHTML = slides[state.idx].render(state); }
function mdHold(msg){
  state.mdWarn=true; state.mdBusy=true; state.mdMsg=msg;
  playThud(); mdRender();
  setTimeout(()=>{ state.mdBusy=false; state.mdWarn=false; state.mdMsg=null;
    state.mdWrongK=null; state.mdWrongF=null; mdRender(); },1600);
}

/* ① 잣대 걷어 내기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   ⚠️ 걷어 내는 데 옳고 그름이 없다(정답 상수 부재). 결정적인 잣대만 걷어 낼 수 없고,
      그때에도 판은 왜 걷어 낼 수 없는지만 말한다. */
function mdCut(t){
  if(state.mdFin!=null) return;                                        // 가드①
  if(state.mdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(t) || t<0 || t>=MD_TEST.length) return;         // 가드②
  if(t===MD_KEY){ mdHold(MD_KEY_M); return; }                          // 가드④ ★ 판 불변
  if(state.mdOut & (1<<t)){ mdHold(MD_ALREADY_T); return; }            // 가드⑤ 판 불변
  state.mdOut |= 1<<t;                                                 // ★ 걷어 내는 자리는 여기 한 곳뿐
  state.mdWarn=false;
  state.mdMsg = mdSame(state)
    ? `<b>「${MD_TEST_S[t]}」</b>를 걷어 냈어요. 이제 두 자료를 <b>가르는 잣대가 하나도 없어요</b> — 남은 잣대는 하나뿐이에요.`
    : `<b>「${MD_TEST_S[t]}」</b>를 걷어 냈어요. 아직 <b>가르는 잣대가 ${mdSplit(state)}개</b> 남았어요.`;
  if(mdSame(state)) playChime(); else playBlip();
  mdRender();
}

/* ② 남은 잣대로 자료 재기 — ⚠️ 판정 0(잣대가 하나뿐이라 재는 데 옳고 그름이 없다) · 순서 자유 */
function mdJudge(s){
  if(state.mdFin!=null) return;                                        // 가드①
  if(state.mdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(s) || s<0 || s>=MD_SRC.length) return;          // 가드②
  if(!mdSame(state)){ mdHold(MD_ORDER_S); return; }                    // 가드③ 순서 — 판 불변
  if(state.mdJudge & (1<<s)){ mdHold(MD_ALREADY_S); return; }          // 판 불변
  state.mdJudge |= 1<<s; state.mdWarn=false;
  state.mdMsg = mdAllJudge(state)
    ? `<b>「${MD_SRC_S[s]}」</b>도 <b>예</b>예요. 두 자료가 <b>같은 답</b>을 얻었어요 — 겉모습은 달라도 둘 다 미디어예요.`
    : `<b>「${MD_SRC_S[s]}」</b>는 <b>예</b>예요. ${MD_SRC_D[s]}`;
  if(mdAllJudge(state)) playChime(); else playBlip();
  mdRender();
}

/* ③ 종류 고르기 — ⚠️ 판정 0 · 순서 자유 */
function mdKind(i){
  if(state.mdFin!=null) return;                                        // 가드①
  if(state.mdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=MD_KIND.length) return;         // 가드②
  if(!mdAllJudge(state)){ mdHold(MD_ORDER_K); return; }                // 가드⑥ 순서 — 판 불변
  if(state.mdPair & (1<<i)){ mdHold(MD_ALREADY_K); return; }           // 가드⑦ 판 불변
  state.mdOpenK = i; state.mdWarn=false; state.mdMsg=null;
  playBlip(); mdRender();
}

/* ③ 특징 짝짓기 — 판정 있음. ⚠️ 어긋나도 판은 그대로이고 안내가 알맞은 특징을 짚지 않는다. */
function mdPair(k){
  if(state.mdFin!=null) return;                                        // 가드①
  if(state.mdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=MD_FEAT.length) return;         // 가드②
  if(state.mdOpenK==null){ mdHold(MD_ORDER_F); return; }               // 순서 — 판 불변
  const i = state.mdOpenK;
  if(mdFeatOf(i)!==k){                                                 // 어긋남 — 판 불변
    state.mdWrongK=k; mdHold(MD_WRONG_F); return; }
  state.mdPair |= 1<<i; state.mdOpenK=null; state.mdWrongK=null; state.mdWarn=false;
  state.mdMsg = mdAllPair(state)
    ? `<b>「${MD_FEAT_S[k]}」</b>예요. 미디어의 종류 셋을 <b>모두</b> 짝지었어요.`
    : `<b>「${MD_FEAT_S[k]}」</b>예요.`;
  if(mdAllPair(state)) playChime(); else playBlip();
  mdRender();
}

/* ④ 마무리 — 「미디어란 무엇인가요」 */
function mdFinish(k){
  if(state.mdFin!=null) return;                                        // 가드①
  if(state.mdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=MD_FIN.length) return;          // 가드②
  if(!mdReady(state)) return;                                          // 가드⑧ 순서 — 판 불변
  if(k===MD_FIN_OK){
    state.mdFin=k; state.mdWrongF=null; state.mdMsg=null; state.mdWarn=false;
    playChime(); mdRender(); return;
  }
  state.mdWrongF=k;
  mdHold(MD_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l11_모아요.html'; } // l11 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

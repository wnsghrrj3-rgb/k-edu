직접조작: 되돌려도 함께 되돌아오지 않는 판 · 지우는 자리와 지워지지 않는 자리가 한 판에 함께 있는 형
  (58번째 신규 패턴)
  ⭐ 앞의 쉰일곱 종에서 **되돌림은 판을 통째로 되돌리거나 아예 없었다.** 46번째(도로 감추는 형)에서
     되감김 뒤 판은 뒤집기 전과 **글자 하나 다르지 않게** 돌아갔고, 55번째(가리키는 자리가 사라지는
     판)에서는 기울였다가 견제하면 판이 **같은 자리로 되돌아왔으며**, 53번째(자리가 비어도 일이
     옮겨 가는 판)에서도 대통령이 돌아오면 일이 **그대로 되돌아갔다.** 52번째에서 걸음이 물러났을
     때조차 물러난 것은 걸음 하나였고 판의 나머지는 온전했다. 이번만 **지우는 자리와 지워지지 않는
     자리가 한 판에 함께 있다** — 소식을 지우면 물든 생각은 **전부 되돌아오는데** 그 소식을 믿고
     **이미 정한 일은 그대로 남는다.**
  ⭐ 근거는 교과서 101쪽 [스스로 활동] 만화 원문 「누군가 단체 대화방에 퍼뜨린 거짓 소문 때문에
     내가 회장 선거에서 떨어지다니, 너무 억울해!」 — 소문이 사실이 아니라고 밝혀져도 이미 내려진
     결정은 그 자리에 남는다. 그리고 교과서 103쪽 본문 「허위 조작 정보로 사람들이 올바르지 못한
     인식을 갖게 되어 잘못된 여론을 형성하면 합리적인 의사 결정을 방해해 민주주의를 위협할 수
     있습니다」 — 판이 보여 주는 것이 바로 그 **의사 결정**이다.
  ⭐ **57번째와의 대비** — 거기서 갈래는 **판에 쌓인 것의 종류**였고 신규성은 「여는 조건이 쌓인
     수가 아니라 갈래」라는 데 있었다. 여기서 신규성은 여는 조건이 아니라 **되돌림이 판의 한쪽에만
     닿는다**는 데 있다. 판이 세는 「겪어 본 길」은 신규성이 아니라 두 길을 나란히 놓기 위한 자리다.
  ⭐ **같은 단추를 같은 방법으로 눌러도 언제 누르느냐에 따라 판에 남는 것이 다르다** —
     `fkClear()`는 인자 0이고 단추 글자도 두 길 내내 같다. 달라진 것은 **정하기 전에 눌렀는지
     정하고 나서 눌렀는지**뿐이다.
  ⭐ **되돌아오지 않은 자리를 늘리는 곳이 코드에 단 하나이고 덜어 내는 곳이 아예 없다** —
     `state.fkKept += 1` 한 자리 · `fkKept`를 줄이거나 0으로 되돌리는 자리 0.
     그리고 **지우는 자리(`fkClear`) 본문에 `state.fkDec = false`가 없다**(구조로 대조).
  ⭐ **퍼지는 자리·정하는 자리·밝히는 자리에는 옳고 그름이 없다**

     만들어지는 자리를 정한다)
  ② **그 소식을 믿은 채 정해요**(무판정 · **여론이 만들어져야 열린다** — 핵심 가드)
  ③ **사실이 아니었어요**(무판정 · 소식 줄과 물든 생각이 **전부 되돌아오고**, ★ 이미 정한 일은

     미디어의 내용을 비판적으로 분석하여 이용해야 하는 까닭(지도서 「16차시 주요 내용 정리」 2 원문)
  ⚠️ 소식·생각 칸·3택 전량 고정 리터럴 — 난수 0.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 소식은 교과서 101쪽 만화를 옮긴 자리이지 실제로 있었던 일이 아니다**(캔버스 캡션).
     판이 그리는 「생각 칸」은 사람 수를 잰 것이 아니라 소식이 퍼지는 모양을 나타낸 도식이다.
  ㉡ **[미디어 활동]의 실제 사건은 화면에 옮기지 않는다** — 교과서 102쪽 누리집 게시 글은 오래전에
     실제로 있었던 일이라, 자기주도 화면에는 그 일에서 배울 **구조**(근거 없는 소문 → 사실 확인
     없는 보도 → 많은 사람의 큰 피해)까지만 옮기고 **나라·사람들의 이름과 피해의 자세한 모습은
     옮기지 않는다.** 그 사건은 교실에서 교과서를 펴고 함께 읽는다(완료 카드·슬라이드 명시).
  ㉢ **밝히는 자리에 옳고 그름이 없다** — 어느 길을 먼저 겪어도 좋고, 판이 「틀렸다」고 말하지
     않는다(정직 문면 명시).
  ㉣ **[친구와 활동] 미디어를 이용할 때 주의할 점을 쓰고 친구들과 이야기하는 활동은 교실 몫**
     (완료 카드 명시 · 리빌 예시 답안에 「내 생각은 내가 직접 적어요」 병기).

⚠️ 설계 원칙

  · **19~20차시 침범 0** — 뉴스 기사 작성 0 · 생각 그물 0 · 물레방아 0.
  · **주제② 재현 0** — 국회·행정부·법원·국가기관·권력 분립·견제 전부 0.
  · **주제① 재현 최소** — 공약·유권자·후보자·기표소·투표율 0. 「선거」는 교과서 101쪽 만화
    원문(학교 회장 뽑기) 자리까지만.
  · **l10·l11 재현 최소** — 미디어의 뜻·종류와 미디어의 역할 셋은 다시 가르치지 않는다.
    「미디어의 역할」은 되짚기 한 자리까지.
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 실제 정당·정치인 0, 실제 선거·사건·연도 0, 실제 누리집·방송사·신문사·
    상표 이름 0, 특정 나라·사람들을 나쁘게 그리지 않는다(나라 이름 0).
  · 교사용 참고 자료 0 — 참고 도서 두 종, 딥페이크, 미디어 리터러시, 매스 미디어, 유언비어,

    인공지능으로 만든 합성 영상 사례라 자기주도 화면에 옮기지 않는다(교실에서 교과서로 읽는다).
  · **파일 전체에 네 자리 연도 0 · 금액·인원 수치 0**(CSS 밖 스코프).
  · 정서 — 미디어를 무서운 것으로 그리지 않는다(따져 보면 된다는 쪽으로 쓴다). 사람이 다치거나
    목숨을 잃는 묘사 0 · 겁주는 어휘 0 · 사람 형상 대신 칸과 말풍선으로만 그린다 ·
    **학생 이름 0 · 실제 지역 이름 0.**
  · 판에서 소식을 퍼뜨리는 자리는 **학생이 퍼뜨리는 자리가 아니라 퍼지는 모습을 지켜보는 자리**로
    적었다(단추 글자 「소식이 퍼져요」).

  font-size:clamp(12.5px,2.1vw,15px);color:var(--amber);line-height:1.55}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:11px 15px;
  font-size:clamp(13px,2.2vw,16.5px);line-height:1.6}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 되돌려도 함께 되돌아오지 않는 판 */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.fk-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:var(--bub);border-radius:9px;padding:7px 11px;line-height:1.45}
.fk-fin{display:flex;flex-direction:column;gap:5px}
.fk-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.fk-fin button:hover{background:var(--bub)}
.fk-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.fk-act{display:flex;flex-direction:column;gap:5px}
.fk-act button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.fk-act button:hover{border-color:var(--green);background:var(--bub)}
.fk-act button.a2{border-color:var(--amber);background:#FFFBEB;color:#B45309}
.fk-act button.a3{border-color:var(--cyan);background:#FFF7ED;color:var(--green-d)}
.fk-act button.a4{border-style:dashed}
.fk-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.fk-keynote{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.fk-keynote b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ===== 직접조작 — 되돌려도 함께 되돌아오지 않는 판(58번째 신규 패턴) =====
   ⭐ 앞의 쉰일곱 종에서 **되돌림은 판을 통째로 되돌리거나 아예 없었다**(46·53·55번째).
      이번만 **지우는 자리와 지워지지 않는 자리가 한 판에 함께 있다** — 소식을 지우면 물든 생각은
      전부 되돌아오는데, 그 소식을 믿고 **이미 정한 일은 그대로 남는다.**
   ⭐ **되돌아오지 않은 자리를 늘리는 곳이 코드에 단 하나이고 덜어 내는 곳이 아예 없다.**
   ⭐ **지우는 자리(`fkClear`) 본문에 결정을 지우는 자리가 없다**(구조로 대조).
   ⭐ **같은 단추를 눌러도 언제 눌렀느냐에 따라 판에 남는 것이 다르다**(`fkClear()`는 인자 0).
   ⭐ **퍼지는 자리·정하는 자리·밝히는 자리에 옳고 그름이 없다**(정답 상수 부재 · 감점 0).
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */

/* 판의 생각 칸 — 사람 수를 잰 것이 아니라 소식이 퍼지는 모양을 나타낸 도식이다. */
const FK_N = 5;
/* ★ 이 한 줄이 「여론이 만들어지는 자리」를 정한다 — 많은 사람이 갖고 있는 공통된 의견. */
const FK_NEED = 3;
/* 겪어 보는 길 둘 — 정하고 나서 밝힌 길 / 정하기 전에 밝힌 길 */
const FK_BOTH = 2;
const FK_WALK_S = ['정하고 나서 밝힌 길','정하기 전에 밝힌 길'];
/* 판에 걸리는 소식 — 교과서 101쪽 [스스로 활동] 만화를 옮긴 자리(실제로 있었던 일이 아니다). */
const FK_NEWS = '어떤 학생이 회장으로 뽑히려고 친구들에게 먹을 것을 사 주며 부탁했다는 소식';
const FK_NEWS_S = '사실이 아닌 소식이 걸려 있어요';
const FK_NEWS_OFF = '소식을 지웠어요 — 사실이 아니었어요';
const FK_DEC_S = '그 소식을 믿은 채 뽑았어요';
/* ④ 마무리 — 미디어의 내용을 비판적으로 분석하여 이용해야 하는 까닭(지도서 「16차시 주요 내용 정리」 2 원문) */
const FK_FIN = ['미디어가 전하는 정보는 모두 거짓이기 때문이에요',
  '미디어를 아예 이용하지 않는 것이 가장 좋기 때문이에요',
  '허위 조작 정보로 잘못된 여론이 만들어지면 합리적인 의사 결정을 방해해 민주주의를 위협할 수 있기 때문이에요'];
const FK_FIN_OK = 2;
const FK_FIN_NO = ['미디어가 전하는 정보가 <b>모두</b> 거짓인 것은 아니에요. 그래서 <b>따져 보는</b> 일이 필요해요.',
  '미디어는 우리에게 <b>필요한 정보</b>도 전해요. 이용하지 않는 것이 아니라 <b>내용을 따져 보고</b> 이용해요.',
  ''];
/* 안내 — ⚠️ 퍼지는 자리·정하는 자리·밝히는 자리 어디에도 「틀렸다」는 말이 없다 */
const FK_LOCK_M = '아직 <b>여론이 만들어지지 않았어요.</b> 생각이 <b>셋</b> 모여야 여론이 돼요. 판은 그대로예요.';
const FK_FULL = '이 판의 생각 칸은 <b>모두 물들었어요.</b> 판은 그대로예요.';
const FK_GONE = '이 판의 소식은 <b>이미 지웠어요.</b> 판은 그대로예요.';
const FK_ALREADY_D = '이 판에서는 <b>이미 정했어요.</b> 판은 그대로예요.';
const FK_ALREADY_C = '이 소식은 <b>이미 밝혔어요.</b> 판은 그대로예요.';
const FK_ORDER_A = '아직 소식이 <b>걸려 있어요.</b> 먼저 <b>사실이 아니었어요</b>를 눌러 봐요.';
const FK_ORDER_F = '아직 <b>겪어 보지 않은 길</b>이 있어요. <b>처음부터 다시</b>를 눌러 다른 길도 겪어 봐요.';

/* ★ 이 한 줄이 「이 길에서 되돌아오지 않은 자리가 생기는가」를 다 정한다 — 정하고 나서 밝혔는가. */
function fkLate(st){ return st.fkDec; }
/* ★ 이 한 줄이 「여론이 만들어졌는가」를 다 정한다. */
function fkOpinion(st){ return st.fkSpread >= FK_NEED; }
/* ★ 이 한 줄이 「겪어 본 길이 몇인가」를 다 정한다. */
function fkWalks(st){ let n=0; for(let k=0;k<FK_BOTH;k++){ if(st.fkWalk & (1<<k)) n++; } return n; }
function fkReady(st){ return fkWalks(st) >= FK_BOTH; }

/* 판 — 위는 소식 줄과 생각 칸, 가운데는 여론 띠와 결정 줄,
   아래는 ★ 되돌아오지 않은 자리와 겪어 본 길.
   ⚠️ 되돌아오지 않은 자리를 그리는 자리는 **여기 한 곳뿐**이다. */
function fkCanvas(st){
  const fin = st.fkFin!=null;
  const on = st.fkOn, mind = st.fkSpread, op = fkOpinion(st), walks = fkWalks(st);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="268" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = fin ? '지운 자리와 지워지지 않은 자리가 함께 있었어요'
    : (fkReady(st) ? '두 길을 모두 겪어 봤어요'
      : (!on ? '이 길은 끝났어요 — 처음부터 다시 눌러 봐요'
        : (st.fkDec ? '이미 정했어요 — 이제 사실이 아니었다고 밝혀 볼까요'
          : (op ? '여론이 만들어졌어요' : '소식이 퍼지고 있어요'))));
  g+=`<text x="160" y="19" font-size="9.4" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  g+=`<rect data-news="${on?1:0}" x="12" y="26" width="296" height="26" rx="7" fill="${on?'#fff':'#F1F5F9'}" stroke="${on?'#C2410C':'#E2E8F0'}" stroke-width="${on?2:1.1}"${on?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text x="160" y="43" font-size="7.6" fill="${on?'#C2410C':'#94A3B8'}" text-anchor="middle" font-weight="800">${on?FK_NEWS_S:FK_NEWS_OFF}</text>`;
  for(let i=0;i<FK_N;i++){
    const wet = i < mind, x = 12 + i*60;
    g+=`<rect data-mindcell="${i}" data-wet="${wet?1:0}" x="${x}" y="60" width="56" height="34" rx="7" fill="${wet?'#FFEDD5':'#F8FAFC'}" stroke="${wet?'#EA580C':'#CBD5E0'}" stroke-width="${wet?1.6:1.1}"${wet?'':' stroke-dasharray="3 3"'}/>`;
    g+=`<text x="${x+28}" y="76" font-size="6.6" fill="${wet?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${wet?'그대로':'아직'}</text>`;
    g+=`<text x="${x+28}" y="87" font-size="6.6" fill="${wet?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="800">${wet?'믿었어요':'못 들었어요'}</text>`;
  }
  g+=`<rect x="12" y="102" width="296" height="22" rx="7" fill="${op?'#FFEDD5':'#fff'}" stroke="${op?'#C2410C':'#CBD5E0'}" stroke-width="1.5"${op?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text data-mind="${mind}" data-op="${op?1:0}" x="160" y="117" font-size="7.6" fill="${op?'#C2410C':'#94A3B8'}" text-anchor="middle" font-weight="800">그대로 믿은 생각 ${mind} / ${FK_N} — ${op?'여론이 만들어졌어요':'셋이 모여야 여론이 돼요'}</text>`;
  g+=`<rect data-dec="${st.fkDec?1:0}" x="12" y="130" width="296" height="26" rx="7" fill="${st.fkDec?'#fff':'#F1F5F9'}" stroke="${st.fkDec?'#C2410C':'#E2E8F0'}" stroke-width="${st.fkDec?2:1.1}"${st.fkDec?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text x="160" y="147" font-size="7.4" fill="${st.fkDec?'#C2410C':'#CBD5E0'}" text-anchor="middle" font-weight="800">${st.fkDec?FK_DEC_S:'아직 정하지 않았어요'}</text>`;
  g+=`<rect x="12" y="164" width="296" height="26" rx="7" fill="${st.fkKept>0?'#FFFDF5':'#fff'}" stroke="${st.fkKept>0?'#B45309':'#CBD5E0'}" stroke-width="${st.fkKept>0?2:1.1}"${st.fkKept>0?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text data-kept="${st.fkKept}" x="160" y="181" font-size="7.6" fill="${st.fkKept>0?'#8A6D3B':'#94A3B8'}" text-anchor="middle" font-weight="800">되돌아오지 않은 자리 ${st.fkKept} — ${st.fkKept>0?'소식을 지워도 이미 정한 일은 남아요':'아직 없어요'}</text>`;
  for(let j=0;j<FK_BOTH;j++){
    const wk = !!(st.fkWalk & (1<<j)), x = 12 + j*148;
    g+=`<rect data-walk="${j}" data-walked="${wk?1:0}" x="${x}" y="196" width="144" height="26" rx="7" fill="${wk?'#fff':'#F8FAFC'}" stroke="${wk?'#C2410C':'#E2E8F0'}" stroke-width="${wk?1.6:1.1}"${wk?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+72}" y="207" font-size="6.6" fill="${wk?'#9A3412':'#CBD5E0'}" text-anchor="middle" font-weight="800">${FK_WALK_S[j]}</text>`;
    g+=`<text x="${x+72}" y="217" font-size="6.2" fill="${wk?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="800">${wk?(j===0?'자리가 남았어요':'남은 자리가 없어요'):'아직 겪지 않았어요'}</text>`;
  }
  g+=`<rect x="12" y="228" width="296" height="22" rx="7" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1.2"/>`;
  g+=`<text x="160" y="243" font-size="7" fill="#64748B" text-anchor="middle" font-weight="800">지우는 일은 소식과 생각에만 닿아요 · 이미 정한 일에는 닿지 않아요</text>`;
  g+=`<rect x="12" y="254" width="296" height="16" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.1"/>`;
  g+=`<text data-walks="${walks}" x="160" y="265" font-size="6.4" fill="#9A3412" text-anchor="middle" font-weight="800">겪어 본 길 ${walks} / ${FK_BOTH} · 되돌아오지 않은 자리 ${st.fkKept}</text>`;
  return `<svg viewBox="0 0 320 280"><rect width="320" height="280" fill="#ffffff"/>${g}</svg>`;
}

function fkPanel(st){
  const fin = st.fkFin!=null;
  const q = fin
    ? '소식을 지우면 물든 생각은 <b>전부 되돌아왔어요.</b> 그런데 이미 정한 일은 <b>되돌아오지 않았어요.</b>'
    : (fkReady(st) ? '미디어의 내용을 <b>비판적으로 분석</b>하여 이용해야 하는 까닭은 무엇일까요?'
      : (!st.fkOn ? '이 길은 끝났어요. <b>처음부터 다시</b>를 눌러 다른 길도 겪어 봐요.'
        : (st.fkDec ? '이제 <b>사실이 아니었어요</b>를 눌러 봐요. 무엇이 되돌아올까요?'
          : (fkOpinion(st) ? '여론이 만들어졌어요. 이대로 <b>정하면</b> 어떻게 될까요?'
                           : '소식이 어떻게 퍼지는지 지켜봐요.'))));
  let right = `<div class="fk-q">${q}</div>`;

  if(fin){
    right+=`<div class="dw-card"><div class="pt">🔎 지워지지 않는 자리가 있었어요</div>
      <div>소식을 지우면 물든 생각은 <b>전부 되돌아왔어요.</b> 그런데 그 소식을 믿고 <b>이미 정한 일</b>은 그대로 남았어요. 같은 단추를 눌렀는데도 <b>정하기 전에</b> 눌렀을 때는 남는 자리가 없었어요.</div>
      <div style="margin-top:5px">허위 조작 정보로 <b>잘못된 여론</b>이 만들어지면 <b>합리적인 의사 결정</b>을 방해해 민주주의를 위협할 수 있어요. 그래서 미디어의 내용을 <b>비판적으로 분석</b>하여 이용해요.</div>
      <div style="margin-top:5px;color:#64748B">교과서 102쪽에 실린 <b>오래전에 실제로 있었던 일</b>은 교실에서 교과서를 펴고 함께 읽어요. 미디어를 이용할 때 <b>주의할 점을 쓰고 친구들과 이야기하는</b> 활동도 교실에서 하는 활동이에요. 화면이 그 활동을 대신하지 않아요.</div></div>`;
  } else if(fkReady(st)){
    right+=`<div class="fk-fin">${FK_FIN.map((f,k)=>
      `<button class="${st.fkWrongF===k?'no':''}" onclick="fkFinish(${k})">${f}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">📰 소식판을 지켜봐요</div>`;
    right+=`<div class="fk-keynote">이 자리에는 <b>옳고 그름이 없어요.</b> 어느 길을 먼저 겪어도 좋아요. 판이 「틀렸다」고 말하지 않아요.</div>`;
    right+=`<div class="fk-act">
      <button class="a1" onclick="fkSpreadStep()">▶ 소식이 퍼져요</button>
      <button class="a2" onclick="fkDecide()">🗳 그 소식을 믿은 채 정해요</button>
      <button class="a3" onclick="fkClear()">🔎 사실이 아니었어요</button>
      <button class="a4" onclick="fkAgain()">↻ 처음부터 다시</button>
    </div>`;
    right+=`<div class="fk-note">${st.fkOn?FK_NEWS:'지금 판에 걸린 소식은 없어요.'}</div>`;
  }
  if(st.fkMsg) right+=`<div class="dw-msg${st.fkWarn?' warn':''}">${st.fkMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🔎 지워도 함께 되돌아오지 않아요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${fkCanvas(st)}<div class="cvcap">판에 걸린 소식은 교과서 101쪽 만화를 옮긴 자리이지 <b>실제로 있었던 일이 아니에요.</b> 생각 칸은 사람 수를 잰 것이 아니라 소식이 퍼지는 모양을 나타낸 도식이에요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 평가해요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"허위 조작 정보가 무엇인지 설명할 수 있어요",st)}
    ${selfCheck(1,"허위 조작 정보가 생기는 까닭을 말할 수 있어요",st)}
    ${selfCheck(2,"미디어의 내용을 비판적으로 분석해야 하는 까닭을 설명할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 미디어를 <b style="color:var(--amber)">올바르게 이용하는 태도</b>!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l12";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  fkOn:true, fkSpread:0, fkDec:false, fkKept:0, fkWalk:0, fkFin:null,
  fkWrongF:null,
  fkMsg:null, fkWarn:false, fkBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function fkRender(){ main.innerHTML = slides[state.idx].render(state); }
function fkHold(msg){
  state.fkWarn=true; state.fkBusy=true; state.fkMsg=msg;
  playThud(); fkRender();
  setTimeout(()=>{ state.fkBusy=false; state.fkWarn=false; state.fkMsg=null;
    state.fkWrongF=null; fkRender(); },1600);
}

/* ① 소식이 퍼져요 — ⚠️ 판정 0 · 인자 0. 학생이 퍼뜨리는 자리가 아니라 퍼지는 모습을 지켜보는 자리다. */
function fkSpreadStep(){
  if(state.fkFin!=null) return;                                        // 가드①
  if(state.fkBusy) return;                                             // 가드⑨
  if(!state.fkOn){ fkHold(FK_GONE); return; }                          // 가드④ 판 불변
  if(state.fkSpread >= FK_N){ fkHold(FK_FULL); return; }               // 가드⑤ 판 불변
  const wasOp = fkOpinion(state);
  state.fkSpread += 1;                                                 // ★ 퍼지는 자리는 여기 한 곳뿐
  state.fkWarn=false;
  state.fkMsg = fkOpinion(state) && !wasOp
    ? `생각이 <b>셋</b> 모였어요 — <b>여론</b>이 만들어졌어요. 여론은 <b>많은 사람이 갖고 있는 공통된 의견</b>이에요.`
    : `소식을 <b>그대로 믿은 생각</b>이 하나 늘었어요. 지금 <b>${state.fkSpread} / ${FK_N}</b>이에요.`;
  if(fkOpinion(state) && !wasOp) playChime(); else playBlip();
  fkRender();
}

/* ② 그 소식을 믿은 채 정해요 — ⚠️ 판정 0 · 인자 0. ★ 여론이 만들어져야 열린다(핵심 가드). */
function fkDecide(){
  if(state.fkFin!=null) return;                                        // 가드①
  if(state.fkBusy) return;                                             // 가드⑨
  if(!state.fkOn){ fkHold(FK_GONE); return; }                          // 가드④ 판 불변
  if(state.fkDec){ fkHold(FK_ALREADY_D); return; }                     // 가드⑥ 판 불변
  if(!fkOpinion(state)){ fkHold(FK_LOCK_M); return; }                  // 가드③ ★핵심 — 판 불변
  state.fkDec = true; state.fkWarn=false;
  state.fkMsg = `잘못된 <b>여론</b>을 바탕으로 <b>정했어요.</b> 이제 사실이 아니었다고 밝히면 무엇이 되돌아올까요?`;
  playChime(); fkRender();
}

/* ③ 사실이 아니었어요 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   소식 줄과 물든 생각은 **전부 되돌아오고**, 이미 정한 일은 **되돌아오지 않는다.**
   ⚠️ 판정 0 · 인자 0. 이 본문에는 결정을 지우는 자리가 없다. */
function fkClear(){
  if(state.fkFin!=null) return;                                        // 가드①
  if(state.fkBusy) return;                                             // 가드⑨
  if(!state.fkOn){ fkHold(FK_ALREADY_C); return; }                     // 가드⑦ 판 불변
  const late = fkLate(state);
  if(late) state.fkKept += 1;                                          // ★ 늘어나는 자리 단 하나
  state.fkWalk |= 1 << (late?0:1);
  state.fkOn = false;                                                  // ★ 되돌아오는 자리 — 소식
  state.fkSpread = 0;                                                  // ★ 되돌아오는 자리 — 생각
  state.fkWarn=false;
  state.fkMsg = late
    ? `소식과 물든 생각은 <b>전부 되돌아왔어요.</b> 그런데 <b>이미 정한 일</b>은 그대로 남았어요 — 되돌아오지 않은 자리 <b>${state.fkKept}</b>.`
    : `소식과 물든 생각이 <b>전부 되돌아왔어요.</b> 아직 정하지 않았기 때문에 <b>되돌아오지 않은 자리가 생기지 않았어요.</b>`;
  playChime(); fkRender();
}

/* ④ 처음부터 다시 — 새 소식판을 연다. ⚠️ 되돌아오지 않은 자리는 여기서도 줄지 않는다. */
function fkAgain(){
  if(state.fkFin!=null) return;                                        // 가드①
  if(state.fkBusy) return;                                             // 가드⑨
  if(state.fkOn){ fkHold(FK_ORDER_A); return; }                        // 가드⑧ 순서 — 판 불변
  state.fkOn = true; state.fkDec = false; state.fkSpread = 0;
  state.fkWarn=false;
  state.fkMsg = fkReady(state)
    ? `새 소식판을 열었어요. 두 길을 <b>모두</b> 겪어 봤어요.`
    : `새 소식판을 열었어요. 이번에는 <b>${FK_WALK_S[(state.fkWalk & 1)?1:0]}</b>도 겪어 봐요.`;
  playBlip(); fkRender();
}

/* ⑤ 마무리 — 「미디어의 내용을 비판적으로 분석하여 이용해야 하는 까닭은?」 */
function fkFinish(k){
  if(state.fkFin!=null) return;                                        // 가드①
  if(state.fkBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=FK_FIN.length) return;          // 가드②
  if(!fkReady(state)){ fkHold(FK_ORDER_F); return; }                   // 가드⑨ 순서 — 판 불변
  if(k===FK_FIN_OK){
    state.fkFin=k; state.fkWrongF=null; state.fkMsg=null; state.fkWarn=false;
    playChime(); fkRender(); return;
  }
  state.fkWrongF=k;
  fkHold(FK_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l13_하나라도걸리면.html'; } // l13 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

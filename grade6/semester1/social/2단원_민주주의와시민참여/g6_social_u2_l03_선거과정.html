직접조작: 재료가 차례를 정하는 판(49번째 신규 패턴 — 앞 걸음이 만든 것이 뒤 걸음의 재료가 되는 형)
  ⭐ 앞의 마흔여덟 종에서 **차례가 있는 판은 차례가 언제나 하나**였고(34번째 「차례 세우기」,
     l08 「시대 차례」 — 정해진 한 줄을 그대로 밟아야 했다), **차례가 없는 판은 아무 차례로나** 되었다
     (l06 「순서 자유」, l03 「함께 놓이는 판」). 이번만 **되는 차례가 여럿이되 아무 차례나 되지는 않는다.**
     여섯 걸음을 세우는 길은 정확히 **세 갈래**이고, 그 밖의 어떤 차례로도 판이 완성되지 않는다.
  ⭐ **그 경계를 정하는 것은 판의 규칙이 아니라 재료다.** 앞 걸음이 만든 것이 뒤 걸음의 재료가 되고,
     재료가 갖춰지지 않은 걸음은 설 수 없다. 「개표」가 먼저 설 수 없는 까닭은 판이 막아서가 아니라
     **셀 표가 아직 없기 때문**이다. 근거는 교과서 본문 원문 「선거는 법에 정해진 절차에 따라
     이루어집니다」 — 절차가 차례를 가지는 까닭이 곧 이것이다.
  ⭐ **재료를 따로 담는 상태가 코드에 아예 없다** — `epHave(st)` **한 줄**이 갖춰진 재료를 다 고른다
     (세운 걸음의 `EP_MAKE`를 모을 뿐이다). 그래서 「세운 걸음과 갖춰진 재료가 어긋나는 판」은
     만들어질 수 없다.
  ⭐ **판의 자리는 교과서 차례로 고정되어 있고, 학생이 정하는 것은 켜는 순서뿐이다.**
     어느 갈래로 완주해도 판의 그림은 **교과서 차례 그대로**다(정직 — 교과서 차례를 잘못 배우지 않는다).
  ⭐ **재료가 없는 걸음을 골라도 판은 알맞은 걸음을 말하지 않고, 무엇이 없는지만 말한다.**
     감점 0 · 「틀렸다」는 말 0 — 아직 차례가 아닐 뿐이다.
  ⚠️ 34번째(차례 세우기)와의 대비 — 거기서는 판이 차례를 알려 주지 않았고 차례는 **하나**였다.
     여기서는 판이 **갖춰진 것을 늘 보여 주고**, 차례는 **여럿**이다. 감춤이 아니라 재료다.
  ① **선거 과정 여섯 걸음 세우기**(재료가 정하는 차례 · 되는 갈래 셋)
  ② **[스스로 활동] 네 나라 견주기**(우리나라의 어느 선거 원칙과 다른지 4택 × 네 나라)
  ③ **[미디어 활동] 3택** = 다양한 방법으로 투표에 참여할 수 있도록 한 까닭(지도서 예시 답안 원문)
  ④ 마무리 3택 = 선거 원칙을 정해 놓은 까닭(지도서 핵심 질문 예시 답안 원문)
  ⚠️ 걸음·재료·나라·원칙·3택 전량 고정 리터럴 — 난수 0.
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 이미 세운 걸음 재클릭 무시 — 판 불변 / ④ 재료가 갖춰지지 않은 걸음 무시 — 판 불변(무엇이 없는지만) /
     ⑤ 여섯 걸음 전 나라 견주기 무시(순서) / ⑥ 이미 견준 나라 재클릭 무시 — 판 불변 /
     ⑦ 네 나라 전 [미디어 활동] 무시(순서) / ⑧ [미디어 활동] 전 마무리 무시(순서) /
     ⑨ 안내 표시 중 재클릭 무시(`epBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.ep-q`로 떼어 전 단계 상시 노출.

지도서 근거(대단원2 4차시 p.144~152):
  [동기 유발] 투표소의 모습을 본 적이 있나요? / 투표소를 설치해서 투표하는 까닭은?
    → 공정하게 투표하도록 / 누구나 똑같은 조건에서 투표에 참여하고 투표 결과를 조작하지 못하도록.
  [본문 64쪽] 선거는 법에 정해진 절차에 따라 이루어집니다.
    1 선거인 명부 작성 — 선거 관리 위원회에서 투표할 수 있는 사람들의 명단을 만듭니다.
    2 후보자 등록 — 대표가 되기를 원하는 사람이 선거 관리 위원회에 후보자 등록을 합니다.
    3 선거 운동 — 후보자는 선거 공보, 후보자 토론회, 거리 유세 등 다양한 방법으로 선거 운동을 합니다.
    4 투표 — 유권자는 투표소에 가서 자기가 지지하는 후보자에게 투표합니다.
    5 개표 — 선거 관리 위원회가 투표함을 열어서 투표 결과를 확인합니다.
    6 당선자 결정 및 당선증 발급 — 가장 많은 표를 얻은 후보자를 당선자로 결정하고, 당선증을 줍니다.
    말풍선 — 투표는 신분 확인하기, 투표용지 받기, 투표하기, 투표함에 투표용지 넣기 과정을 거쳐요.
  [낱말] 선거 공보 = 후보자의 기호, 이름, 사진, 공약 등을 실어 유권자에게 나눠 주는 문서.
  [핵심 질문] 선거가 법에 정해진 절차에 따라 이루어지는 까닭 = 선거를 공정하게 치르기 위해서.
  [본문 65쪽 선거 원칙] 보통 선거(18세 이상이면 누구나 투표할 수 있어요) / 평등 선거(모든 사람은
    한 표씩 투표해요) / 직접 선거(투표권을 가진 사람이 직접 투표해요) / 비밀 선거(어느 후보자에게
    투표했는지 알 수 없도록 비밀을 보장해요).
  [스스로 활동] 네 나라와 우리나라 선거 원칙의 차이점 — 지도서 예시 답안 원문
    ㉮ 심부름 나라: 우리나라에서는 투표권을 가진 사람이 직접 투표하지만, 심부름 나라에서는
       다른 사람이 대신 투표할 수 있다.
    ㉯ 어린이 나라: 우리나라에서는 18세 이상이면 누구나 투표할 수 있지만, 어린이 나라에서는
       초등학교에 다니는 어린이만 투표할 수 있다.
    ㉰ 왁자지껄 나라: 우리나라에서는 어느 후보자에게 투표했는지 알 수 없도록 비밀을 보장해야 하지만,
       왁자지껄 나라에서는 투표소에서 자기가 지지하는 후보자의 이름을 이야기하여 자신의 의사를 표시한다.
    ㉱ 박사 나라: 우리나라에서는 학력과 관계없이 모든 유권자가 한 표씩 투표할 수 있지만,
       박사 나라에서는 박사 학위가 있는 사람이 세 표씩 투표할 수 있다.
  [핵심 질문] 선거 원칙을 정해 놓은 까닭 = 공정하고 민주적인 선거가 이루어지도록 하기 위해서 /
    모든 사람에게 동등한 권리를 주기 위해서.
  [낱말] 거소 투표 = 선거일에 투표소를 방문하기 어려운 유권자가 자신이 머무는 곳에서 투표하는 방식.
    선상 투표 = 선거일에 투표소에서 투표할 수 없는 선원을 대상으로 배에서 실시하는 투표.
  [미디어 활동] 신문 기사 「소중한 한 표! 꼭 투표하세요」 — 몸이 불편해 이동하기 어렵거나
    외국에서 항해하는 배에 타고 있는 유권자는 선거일 전에 미리 신고하면 투표할 수 있다.
    [정보 활용] 유권자가 다양한 방법으로 투표에 참여할 수 있도록 한 까닭 예시 답안 =
    모든 사람이 평등하게 선거에 참여할 수 있도록 하기 위해서 / 선거에 참여하는 것은 중요한 일이기 때문 /
    되도록 많은 사람이 투표에 참여하도록 하기 위해서 / 선거권을 보장하기 위해서.
  [별별 직업] 선거 관리 위원회 공무원 — 선거 관리 위원회는 선거와 투표가 공정하고 올바르게
    이루어지도록 관리하는 국가기관. 공무원은 후보자 등록, 선거 운동, 투표 및 개표 등 선거의 모든
    과정을 공정하게 관리하고, 유권자가 선거에 적극적으로 참여하도록 홍보 활동을 함.
    되려면 = 민주주의에 관한 올바른 생각 / 국민의 소중한 주권 행사를 돕고 보호하려는 마음 /
    선거 과정에서 실수가 생기지 않도록 꼼꼼하게 일을 처리하려는 태도.
  [꼭 기억해요] 1 선거는 ( 법 )에 정해진 절차에 따라 이루어집니다.
    2 우리나라에서는 공정한 선거를 위해 선거 원칙을 상황에 따라 바꿉니다. ( ✕ )
  [4차시 주요 내용 정리] 1. 선거 과정: 선거인 명부 작성 → 후보자 등록 → 선거 운동 → 투표 → 개표 →
    당선자 결정 및 당선증 발급 2. 선거 원칙: ① 보통·평등·직접·비밀 선거의 원칙이 있음
    ② 공정하고 민주적인 선거를 위해 국민 누구나 선거 원칙을 지켜야 함
    3. 선거에 참여할 수 있는 다양한 방법: 거소 투표, 선상 투표 등.
  [정리] 차시 예고 = 모의 선거를 통해 선거에 참여하기.
⚠️ 설계 원칙:
  · **5차시 이후 침범 0** — 모의 선거·선거 벽보 만들기·투표용지 만들기·공약 만들기·개표 실습 0.
    차시 예고 자리에서 **이름만.** 사전 투표 0(교사용 참고 자료 몫).
  · **l01(2차시)·l02(3차시) 재현 최소** — 민주주의의 꽃·국민 주권·재검표·소중한 한 표(문항)·
    유권자 낱말 풀이는 앞 차시 몫이라 문항으로 내지 않는다. 「소중한 한 표」는 교과서 66쪽
    신문 기사 제목 원문 자리 하나뿐.
  · **주제②③ 침범 0** — 국회·행정부·법원·권력 분립 0, 미디어의 의미·역할·비판적 분석 0.
    「[미디어 활동]」은 **교과서 활동 이름**으로만 쓴다(대단원2 l01·l02 선례 승계).
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 실제 정당·정치인 이름 0, 실제 선거의 종류·결과·연도·득표수·투표율 0.
    판의 후보자는 이름 없이 **기호**로만 둔다. 네 나라는 교과서가 지어낸 이야기 나라이고
    실제 나라가 아니다(판과 슬라이드에 명시).
  · 교사용 참고 자료 0 — 참고 도서 세 종, 선거권 역사와 나이 변화, 기탁금, 비례 대표, 「공직 선거법」,
    선거 운동 기간, 투표 시간, 무효표 규정, 다른 나라의 청소년 선거권, 어린이 의회,
    누리집 주소, 신문사 이름과 날짜, 활동지 쪽수, 평가 관점.
  · **문항 내 연도·득표수·투표율·수치 0.** 「18세 이상」은 교과서 보통 선거 원문이라
    슬라이드·조작·문항 보기에서 쓴다.
  · **정서** — 네 나라를 나쁜 나라로 그리지 않는다. **우리나라와 다른 점을 견주는 자리**일 뿐이다.
    투표하지 않는 사람을 나무라지 않는다. 몸이 불편한 사람을 안쓰러운 대상이 아니라
    **투표할 권리를 가진 사람**으로 쓴다. 겁주는 어휘 0.
  · **정직 원칙 세 곳** — ㉠ 화면이 실제 선거·투표·개표를 대신하지 않는다. 판이 다루는 것은

@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0}
.ka-lb{background:#F1F5F9;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-family:inherit;
  font-weight:700;color:var(--muted);font-size:clamp(11px,1.9vw,13px);display:flex;align-items:center;gap:6px}
.ka-lb svg{width:14px;height:14px}
.ka-bar{flex:1;height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.ka-bar>div{height:100%;background:var(--green);border-radius:99px;transition:width .35s ease;width:5%}
.ka-pg{font-size:clamp(11px,1.9vw,13px);color:var(--muted);font-weight:700;min-width:46px;text-align:right}
.ka-sc{display:flex;align-items:center;gap:3px;background:var(--amber-bg);border-radius:99px;padding:5px 11px}
.ka-sc svg{width:15px;height:15px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;color:var(--amber);font-size:clamp(14px,2.4vw,17px)}
.ka-sc-u{font-size:11px;color:var(--amber);font-weight:700}

/* 메인 */
.ka-m{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:4px 2px}
.ka-tags{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ka-bg{display:inline-flex;align-items:center;gap:5px;background:var(--bub);color:var(--green-d);
  border-radius:99px;padding:5px 12px;font-size:clamp(11px,1.9vw,13px);font-weight:700}
.ka-bg svg{width:13px;height:13px}
.ka-bg.s2{background:#E0F2FE;color:#075985}
.ka-bg.s3{background:#DCFCE7;color:#166534}
.ka-bg.s4{background:#FEF3C7;color:#92400E}
.ka-bg.s5{background:#F3E8FF;color:#6B21A8}
.ka-meta{font-size:clamp(10px,1.7vw,12px);color:#94A3B8;font-weight:600}
.ka-t{font-size:clamp(19px,3.4vw,27px);font-weight:700;line-height:1.4;margin-bottom:10px}
.ka-bub{background:var(--bub);border-radius:14px;padding:13px 18px;font-size:clamp(14px,2.4vw,18px);
  line-height:1.7;margin-bottom:12px}
.ka-emph{color:var(--green-d);font-weight:700}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.scene.wide{width:clamp(240px,44vw,420px)}
.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(15px,2.6vw,20px);font-weight:700;line-height:1.6;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
.opt{background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;
  font-family:inherit;font-size:clamp(13px,2.2vw,16.5px);font-weight:500;text-align:left;line-height:1.5;transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:#16A34A;background:#DCFCE7;font-weight:700}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:11px;border-radius:12px;padding:12px 16px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;animation:fadeUp .3s ease both}
.fb.ok{background:#DCFCE7;color:#166534;font-weight:700}
.hint{margin-top:9px;background:var(--amber-bg);border-radius:11px;padding:10px 14px;
  font-size:clamp(12.5px,2.1vw,15px);color:var(--amber);line-height:1.55}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:11px 15px;
  font-size:clamp(13px,2.2vw,16.5px);line-height:1.6}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 재료가 차례를 정하는 판(앞 걸음이 만든 것이 뒤 걸음의 재료가 되는 형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.ep-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:var(--bub);border-radius:9px;padding:7px 11px;line-height:1.45}
.ep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ep-grid button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:8px 2px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--ink);font-size:clamp(10.4px,1.75vw,12.8px);transition:.15s;
  line-height:1.3;text-align:center}
.ep-grid button:hover{border-color:var(--green);background:var(--bub)}
.ep-grid button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.ep-grid button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.ep-grid button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.ep-again{border:2px solid var(--cyan);background:#FFF7ED;color:var(--green-d);border-radius:10px;
  padding:9px 10px;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:clamp(11px,1.87vw,13.5px);text-align:center;line-height:1.45;animation:pop .35s ease both}
.ep-again:hover{background:var(--bub)}
.ep-src{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.ep-fin{display:flex;flex-direction:column;gap:5px}
.ep-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.ep-fin button:hover{background:var(--bub)}
.ep-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.ep-list{display:flex;flex-direction:column;gap:5px;max-height:214px;overflow-y:auto}
.ep-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.ep-list button:hover{border-color:var(--green);background:var(--bub)}
.ep-list button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.ep-list button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.ep-list button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.ep-land{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.ep-land b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}
</style>
<script src="/kedu_gate.js"></script>

<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="goHub()">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>
      <span>차시 목록</span>
    </button>
    <div class="ka-bar"><div id="bar"></div></div>
    <div class="ka-pg" id="pg">1 / 18</div>
    <div class="ka-sc">
      <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#B45309"/></svg>
      <span class="ka-sc-n" id="score">0</span><span class="ka-sc-u">점</span>
    </div>
  </div>

  <div class="ka-m" id="main"></div>

  <div class="ka-f">
    <button class="ka-nav ka-nav-prev" id="prev" onclick="prev()">← 이전</button>
    <button class="ka-nav mob-hide" id="listen" disabled title="음성은 준비 중이에요">
      <svg viewBox="0 0 16 16"><path d="M 3 6 L 3 10 L 6 10 L 10 13 L 10 3 L 6 6 Z" fill="currentColor"/><path d="M 12 5 Q 14 8 12 11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      다시 듣기
    </button>
    <button class="ka-nav" id="hint" onclick="useHint()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="4" fill="currentColor"/><rect x="6" y="9.5" width="4" height="2.5" fill="currentColor"/><rect x="6.5" y="12.5" width="3" height="1" fill="currentColor"/></svg>
      힌트
    </button>
    <button class="ka-nav ka-nav-next" id="next" onclick="next()">다음 →</button>
  </div>
</div>

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 모든 그림은 내용을 나타낸 도식이며 실제 사진·자료가 아니다.
   ⚠️ 정치적 중립: 실제 정당·정치인·선거 결과 0. 후보자는 이름 없이 기호로만 그린다. */
const SVG = {
  // 1 들어가기 — 투표소의 모습(동기 유발)
  poll:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="20" font-size="11.2" fill="#9A3412" text-anchor="middle" font-weight="800">투표소의 모습</text>
    <rect x="16" y="30" width="288" height="126" rx="12" fill="#fff" stroke="#C2410C" stroke-width="2"/>
    <rect x="30" y="44" width="80" height="60" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
    <text x="70" y="60" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">신분 확인하는 곳</text>
    <rect x="42" y="68" width="56" height="26" rx="4" fill="#fff" stroke="#FDBA74" stroke-width="1.2"/>
    <rect x="126" y="44" width="80" height="60" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
    <text x="166" y="60" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">가림막이 있는 곳</text>
    <path d="M140 70 L192 70 L192 96 L140 96 Z" fill="#fff" stroke="#FDBA74" stroke-width="1.2"/>
    <path d="M140 70 L140 96" stroke="#EA580C" stroke-width="2"/>
    <rect x="222" y="44" width="66" height="60" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
    <text x="255" y="60" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">투표함</text>
    <rect x="234" y="68" width="42" height="26" rx="4" fill="#fff" stroke="#FDBA74" stroke-width="1.2"/>
    <rect x="248" y="64" width="14" height="4" rx="2" fill="#C2410C"/>
    <text x="160" y="126" font-size="9" fill="#9A3412" text-anchor="middle" font-weight="800">누구나 똑같은 조건에서 투표에 참여하도록</text>
    <text x="160" y="142" font-size="9" fill="#B45309" text-anchor="middle" font-weight="700">정해진 곳에 투표소를 두어요</text></svg>`,
  // 2 살펴보기 — 선거는 법에 정해진 절차에 따라
  flow:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="20" font-size="11.2" fill="#9A3412" text-anchor="middle" font-weight="800">선거는 법에 정해진 절차에 따라 이루어져요</text>
    <rect x="14" y="32" width="292" height="46" rx="10" fill="#fff" stroke="#C2410C" stroke-width="2"/>
    <text x="160" y="52" font-size="9.6" fill="#9A3412" text-anchor="middle" font-weight="800">법</text>
    <text x="160" y="68" font-size="8.6" fill="#B45309" text-anchor="middle" font-weight="700">누가 · 언제 · 어떻게 할지를 미리 정해 두어요</text>
    <path d="M160 80 L160 92" stroke="#EA580C" stroke-width="2"/>
    <path d="M156 90 L160 98 L164 90 Z" fill="#EA580C"/>
    <rect x="14" y="100" width="292" height="54" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
    <text x="160" y="120" font-size="9.4" fill="#9A3412" text-anchor="middle" font-weight="800">정해진 차례대로 한 걸음씩</text>
    <text x="160" y="138" font-size="8.6" fill="#B45309" text-anchor="middle" font-weight="700">그래야 선거를 공정하게 치를 수 있어요</text></svg>`,
  // 4 살펴보기 — 투표의 네 걸음(교과서 말풍선 원문)
  ballot:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="20" font-size="11.2" fill="#9A3412" text-anchor="middle" font-weight="800">투표는 이런 차례를 거쳐요</text>
    ${[0,1,2,3].map((k)=>{const x=12+k*76;return `<rect x="${x}" y="34" width="70" height="52" rx="9" fill="#fff" stroke="#C2410C" stroke-width="1.8"/>
      <circle cx="${x+35}" cy="50" r="9" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
      <text x="${x+35}" y="53.5" font-size="8.6" fill="#9A3412" text-anchor="middle" font-weight="800">${k+1}</text>`;}).join('')}
    <text x="47" y="74" font-size="7.6" fill="#9A3412" text-anchor="middle" font-weight="800">신분 확인하기</text>
    <text x="123" y="74" font-size="7.6" fill="#9A3412" text-anchor="middle" font-weight="800">투표용지 받기</text>
    <text x="199" y="74" font-size="7.6" fill="#9A3412" text-anchor="middle" font-weight="800">투표하기</text>
    <text x="275" y="70" font-size="7.2" fill="#9A3412" text-anchor="middle" font-weight="800">투표함에</text>

  const head = st.epFin!=null ? '법에 정해진 차례와 선거 원칙을 살펴봤어요'
    : (all ? '여섯 걸음이 모두 섰어요 \u2014 이제 선거 원칙을 견주어 봐요'
      : '재료가 갖춰진 걸음부터 설 수 있어요');
  g+=`<text x="160" y="22" font-size="10.4" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  // 여섯 자리 — 교과서 차례 고정. 켜지지 않은 자리에는 걸음 이름을 두지 않는다(미리 노출 0).
  for(let i=0;i<EP_N;i++){
    const x = 14 + (i%3)*100, y = 32 + Math.floor(i/3)*54;
    const on = st.epDone.indexOf(i)>=0;
    g+=`<rect data-cell="${i}" data-on="${on?1:0}" x="${x}" y="${y}" width="92" height="46" rx="9" fill="${on?'#fff':'#F8FAFC'}" stroke="${on?'#C2410C':'#CBD5E0'}" stroke-width="${on?1.8:1.4}"${on?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<circle cx="${x+13}" cy="${y+13}" r="8" fill="${on?'#FFEDD5':'#EEF2F6'}" stroke="${on?'#EA580C':'#CBD5E0'}" stroke-width="1.3"/>`;
    g+=`<text x="${x+13}" y="${y+16.4}" font-size="8.2" fill="${on?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${i+1}</text>`;
    if(on){
      const nm = EP_STEP[i];
      if(nm.length>8){
        g+=`<text x="${x+46}" y="${y+30}" font-size="7.4" fill="#9A3412" text-anchor="middle" font-weight="800">${nm.slice(0,7)}</text>`;
        g+=`<text x="${x+46}" y="${y+40}" font-size="7.4" fill="#9A3412" text-anchor="middle" font-weight="800">${nm.slice(7)}</text>`;
      } else {
        g+=`<text x="${x+46}" y="${y+35}" font-size="8.6" fill="#9A3412" text-anchor="middle" font-weight="800">${nm}</text>`;
      }
    } else {
      g+=`<text x="${x+50}" y="${y+31}" font-size="7.8" fill="#94A3B8" text-anchor="middle" font-weight="700">아직</text>`;
    }
  }
  // 화살표 — 자리 사이의 차례(교과서 차례)
  [0,1,3,4].forEach(i=>{ const x=14+(i%3)*100+92, y=32+Math.floor(i/3)*54+23;
    g+=`<path d="M${x} ${y} L${x+5} ${y}" stroke="#EA580C" stroke-width="1.5"/><path d="M${x+3} ${y-3} L${x+8} ${y} L${x+3} ${y+3} Z" fill="#EA580C"/>`; });
  g+=`<path d="M260 78 L260 84 L60 84 L60 88" stroke="#EA580C" stroke-width="1.5" fill="none"/>`;
  g+=`<path d="M57 86 L60 92 L63 86 Z" fill="#EA580C"/>`;
  // 아래 띠 — 갖춰진 것 / 선거 원칙
  g+=`<rect x="14" y="146" width="292" height="96" rx="9" fill="#fff" stroke="${all?'#B45309':'#EA580C'}" stroke-width="1.8"/>`;
  if(!all){
    g+=`<text x="160" y="161" font-size="8.6" fill="#9A3412" text-anchor="middle" font-weight="800">갖춰진 것 ${hv.length} / ${EP_N}</text>`;
    if(hv.length===0){
      g+=`<text x="160" y="196" font-size="8.2" fill="#94A3B8" text-anchor="middle" font-weight="700">아직 갖춰진 것이 없어요.</text>`;
      g+=`<text x="160" y="210" font-size="8.2" fill="#94A3B8" text-anchor="middle" font-weight="700">재료가 필요 없는 걸음부터 세워 봐요.</text>`;
    }
    hv.forEach((k,idx)=>{ const x=22+(idx%2)*146, y=168+Math.floor(idx/2)*24;
      g+=`<rect data-mat="${k}" x="${x}" y="${y}" width="140" height="20" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/>`;
      const t=EP_MAT[k];
      g+=`<text x="${x+70}" y="${y+13.6}" font-size="${t.length>12?6.6:7.4}" fill="#9A3412" text-anchor="middle" font-weight="800">${t}</text>`; });
  } else {
    g+=`<text x="160" y="161" font-size="8.6" fill="#B45309" text-anchor="middle" font-weight="800">선거 원칙 \u2014 견주어 본 나라 ${lands} / 4</text>`;
    for(let k=0;k<4;k++){
      const x=22+(k%2)*146, y=168+Math.floor(k/2)*34;
      const hit = st.epLand.indexOf(k)>=0;
      g+=`<rect data-rule="${k}" data-hit="${hit?1:0}" x="${x}" y="${y}" width="140" height="28" rx="7" fill="${hit?'#FFEDD5':'#F8FAFC'}" stroke="${hit?'#EA580C':'#CBD5E0'}" stroke-width="1.3"/>`;
      g+=`<text x="${x+70}" y="${y+12}" font-size="7.8" fill="${hit?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${EP_RULE[k]}</text>`;
      g+=`<text x="${x+70}" y="${y+22}" font-size="6.6" fill="${hit?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="700">${hit?EP_LAND[st.epLand.indexOf(k)]+' 나라와 달라요':'아직'}</text>`;
    }
  }
  g+=`<rect data-lit="${st.epDone.length}" data-have="${hv.length}" data-lands="${lands}" x="14" y="146" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function epPanel(st){
  const done = st.epFin!=null, all = epAllSteps(st), lands = epAllLands(st), med = st.epMedia!=null;
  const cur = st.epLand.findIndex(v=>v==null);
  const q = done
    ? '선거 원칙은 상황에 따라 바꾸지 않아요. 국민 누구나 지켜야 해요.'
    : (med ? '우리나라에서 <b>선거 원칙을 정해 놓은 까닭</b>은 무엇일까요?'
      : (lands ? '신문 기사를 읽고, 유권자가 <b>다양한 방법</b>으로 투표에 참여할 수 있도록 한 까닭을 찾아봅시다.'
        : (all ? `<b>${EP_LAND[cur]}</b>는 우리나라의 어느 선거 원칙과 다른가요?`
          : '<b>재료가 갖춰진 걸음</b>부터 세울 수 있어요. 지금 세울 수 있는 걸음을 골라 봐요.')));
  let right = `<div class="ep-q">${q}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">\uD83D\uDDF3\uFE0F 차례를 정한 것은 무엇이었나요</div>
      <div>판이 차례를 막은 것이 아니었어요. <b>앞 걸음이 만든 것</b>이 뒤 걸음의 재료가 되어서,
      재료가 갖춰진 걸음만 설 수 있었지요.</div>
      <div style="margin-top:5px">그래서 <b>선거인 명부 작성</b>과 <b>후보자 등록</b>은 어느 것을 먼저 세워도 되었고,
      <b>개표</b>는 표가 생긴 뒤에만 설 수 있었어요.</div>
      <div style="margin-top:5px;color:#64748B">선거가 <b>법에 정해진 절차</b>를 갖는 까닭이 바로 이것이에요.</div></div>`;
  } else if(med){
    right+=`<div class="ep-fin">${EP_FIN.map((f,k)=>
      `<button class="${st.epWrongF===k?'no':''}" onclick="epFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(lands){
    right+=`<div class="dw-step">\uD83D\uDCF0 미디어 활동</div>`;
    right+=`<div class="ep-src"><b>소중한 한 표! 꼭 투표하세요</b><br>
      몸이 불편해 이동하기 어렵거나 외국에서 항해하는 배에 타고 있는 유권자는
      선거일 전에 미리 신고하면 투표할 수 있어요.</div>`;
    right+=`<div class="ep-fin">${EP_MEDIA.map((s,k)=>
      `<button class="${st.epWrongM===k?'no':''}" onclick="epPickMedia(${k})">${s}</button>`).join('')}</div>`;
  } else if(all){
    right+=`<div class="dw-step">\uD83D\uDDE3\uFE0F 스스로 활동 \u2014 이야기 나라와 견주기</div>`;
    right+=`<div class="ep-land"><b>${EP_LAND[cur]}</b>에서는 ${EP_LAND_T[cur]}</div>`;
    right+=`<div class="ep-fin">${EP_RULE.map((r,k)=>
      `<button class="${st.epWrongR===k?'no':''}" onclick="epPickRule(${k})">${r} \u2014 ${EP_RULE_D[k]}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">\uD83E\uDDF1 선거 과정 \u2014 세울 수 있는 걸음을 골라요</div>`;
    right+=`<div class="ep-list">${EP_STEP.map((s,i)=>{
      const on = st.epDone.indexOf(i)>=0;
      return `<button class="${on?'ok':''}${st.epWrongS===i?' no':''}" onclick="epPut(${i})">${on?'\u2713 ':''}${s}</button>`;
    }).join('')}</div>`;
  }
  if(st.epMsg) right+=`<div class="dw-msg${st.epWarn?' warn':''}">${st.epMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83E\uDDF1 앞 걸음이 만든 것이 뒤 걸음의 재료가 돼요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${epCanvas(st)}<div class="cvcap">자리는 교과서 차례 그대로예요. 정하는 것은 세우는 순서뿐이에요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";

const main=document.getElementById('main');
function render(){

  state.revealed = false;

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function epRender(){ main.innerHTML = slides[state.idx].render(state); }
function epHold(msg){
  state.epWarn=true; state.epBusy=true; state.epMsg=msg;
  playThud(); epRender();
  setTimeout(()=>{ state.epBusy=false; state.epWarn=false; state.epMsg=null;
    state.epWrongS=null; state.epWrongR=null; state.epWrongM=null; state.epWrongF=null; epRender(); },1600);
}

/* ① 걸음 세우기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   판이 차례를 강제하는 자리가 없다. 설 수 있는지 없는지는 **재료**가 정한다.
   ⚠️ 재료가 없어도 벌이 없다 — 감점 0 · 「틀렸다」는 말 0 · 판 불변. */
function epPut(i){
  if(state.epFin!=null) return;                                        // 가드①
  if(state.epBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=EP_N) return;                   // 가드②
  if(state.epDone.indexOf(i)>=0){                                      // 가드③ 이미 세운 걸음 — 판 불변
    state.epWrongS=i; epHold(EP_ALREADY); return; }
  if(!epReady(state,i)){                                               // 가드④ 재료 없음 — 판 불변
    const ms = epMatList(epMissing(state,i));
    const need = ms.map(k=>'\u300C'+EP_MAT[k]+'\u300D').join(' \u00B7 ');
    const njo = epJ(EP_MAT[ms[ms.length-1]]) ? '\uC774' : '\uAC00';
    const sjo = epJ(EP_STEP[i]) ? '\uC774' : '\uAC00';
    state.epWrongS=i;
    epHold(`<b>\u300C${EP_STEP[i]}\u300D</b>${sjo} 서려면 ${need}${njo} 있어야 해요. 아직 <b>갖춰진 것</b>에 없어요.`);
    return; }
  state.epDone.push(i); state.epWrongS=null; state.epWarn=false;
  const mt = EP_MAT[i];
  const sjo2 = epJ(EP_STEP[i]) ? '\uC774' : '\uAC00';
  const mjo = epJ(mt) ? '\uC744' : '\uB97C';
  state.epMsg = epAllSteps(state)
    ? `<b>\u300C${EP_STEP[i]}\u300D</b>까지 섰어요. 여섯 걸음이 <b>모두</b> 섰어요 \u2014 이제 선거 원칙을 견주어 봐요.`
    : `<b>\u300C${EP_STEP[i]}\u300D</b>${sjo2} 섰어요. 이 걸음이 \u300C${mt}\u300D${mjo} 만들어 <b>갖춰진 것</b>에 더했어요.`;
  if(epAllSteps(state)) playChime(); else playBlip();
  epRender();
}

/* ② [스스로 활동] 네 나라 견주기 — 우리나라의 어느 선거 원칙과 다른가 */
function epPickRule(k){
  if(state.epFin!=null) return;                                        // 가드①
  if(state.epBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=EP_RULE.length) return;         // 가드②
  if(!epAllSteps(state)){ state.epWrongR=k; epHold(EP_ORDER_L); return; }  // 가드⑤ 순서
  const cur = state.epLand.findIndex(v=>v==null);
  if(cur<0){ state.epWrongR=k; epHold(EP_LAND_DONE); return; }         // 가드⑥ 네 나라 다 견줌 — 판 불변
  if(k!==EP_LAND_OK[cur]){ state.epWrongR=k; epHold(EP_LAND_NO); return; }
  state.epLand[cur]=k; state.epWrongR=null; state.epWarn=false;
  state.epMsg = `<b>${EP_LAND[cur]}</b>는 우리나라의 <b>${EP_RULE[k]}</b> 원칙과 달라요 \u2014 우리나라에서는 ${EP_RULE_D[k]}.`;
  if(epAllLands(state)) playChime(); else playBlip();
  epRender();
}

/* ③ [미디어 활동] — 다양한 방법으로 투표에 참여할 수 있도록 한 까닭 */
function epPickMedia(k){
  if(state.epFin!=null) return;                                        // 가드①
  if(state.epBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=EP_MEDIA.length) return;        // 가드②
  if(!epAllLands(state)) return;                                       // 가드⑦ 네 나라 전 무시(순서)
  if(state.epMedia!=null) return;
  if(k===EP_MEDIA_OK){
    state.epMedia=k; state.epWrongM=null; state.epWarn=false;
    state.epMsg = '<b>모든 사람이 평등하게</b> 선거에 참여할 수 있도록 여러 방법을 마련해 둔 거예요.';
    playChime(); epRender(); return;
  }
  state.epWrongM=k;
  epHold(EP_MEDIA_NO[k]);
}

/* ④ 마무리 — 「선거 원칙을 정해 놓은 까닭」 */
function epFinish(k){
  if(state.epFin!=null) return;                                        // 가드①
  if(state.epBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=EP_FIN.length) return;          // 가드②
  if(state.epMedia==null) return;                                      // 가드⑧ [미디어 활동] 전 무시(순서)
  if(k===EP_FIN_OK){
    state.epFin=k; state.epWrongF=null; state.epMsg=null; state.epWarn=false;
    playChime(); epRender(); return;
  }
  state.epWrongF=k;
  epHold(EP_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l04_모의선거.html'; } // l04 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

⚠️ 엔진은 대단원1 l01~l11 · 대단원2 l01~l07에서 100% 승계. 2단원 색 #C2410C 유지 · CSS 변수명 무수정.

⚠️ 파일명을 `세번까지`로 지었다(배선 예외 대신). l07이 「법원」을 개수 ≤3, 「판결」을 개수 ≤2,
   「삼심」을 개수 0으로 재고 있어서 파일명에 그 낱말이 들어가면 재배선이 곧바로 그 가드를 깨뜨린다.
   겹치지 않는 이름을 골라 예외를 만들지 않았다(l05 `나랏일` · l06 `법이되기까지` · l07 `나라살림` 선례 승계).

직접조작: 판정이 최종이 아닌 판(54번째 신규 패턴 — 같은 사건을 다시 물으면 판정이 바뀔 수 있고,
  물을 수 있는 횟수에 상한이 있는 형)
  ⭐ 앞의 쉰세 종에서 **판이 한 번 내린 판정은 그 자리에서 끝이었다.** 48번째(부동의 형)에서는
     다시 세어도 판이 **한 글자도 달라지지 않았고**, 37번째(접어 두는 형)에서는 판정을 **미뤘을 뿐**
     답은 처음부터 정해져 있었으며, 52번째(걸음이 물러나는 형)에서는 되돌려 보내면 걸음이
     **물러났지 판정이 바뀌지는 않았다.** 이번만 **판이 내린 판정이 최종이 아니다** — 같은 사건을
     다시 물으면 더 위의 법원이 다시 판정하고, 세 번째 판정에서 **결과가 뒤집힌다.**
     근거는 교과서 84쪽 본문 원문 「하나의 사건에 대해 세 번까지 재판을 받을 수 있도록 한 삼심
     제도를 두어 잘못된 판결로 억울한 일이 생기는 것을 막고 있습니다」와 [미디어 활동] 기사
     「3심에서 뒤집힌 재판 결과」.
  ⭐ **48번째(부동의 형)와의 정면 대비** — 거기서는 다시 세는 일이 **확인**이라 판이 움직이지
     않았고, 여기서는 다시 묻는 일이 **다시 판정**이라 결과가 바뀔 수 있다.
  ⭐ **52번째와의 대비** — 거기서는 되돌려 보내면 걸음이 **아래로 물러났다.** 여기서는 다시 물을
     때마다 사건이 **위의 법원으로 올라가고**, 한 번 올라간 자리는 다시 내려오지 않는다(단조 증가).
  ⭐ **그리고 물을 수 있는 횟수에 상한이 있다.** 47번째(첫 길이 막히는 판)에서 길이 막혔을 때는
     「다른 길로 가 볼까요」 단추가 **새로 열렸다.** 여기서는 세 번째 판정 뒤에 다시 묻는 단추가
     **사라지고 아무 단추도 새로 열리지 않는다** — 그것이 교과서가 말한 「세 번까지」다.
  ⭐ **사건은 한 글자도 달라지지 않는다** — 세 판정을 지나는 동안 판에 적힌 사건은 같은 문자열이고
     그것을 그리는 자리도 코드에 단 하나다. 달라지는 것은 **어느 법원이 판정했는가**와 **판정**뿐이다.
  ⭐ **지금의 판정이 무엇인지를 따로 담는 상태가 코드에 아예 없다** — `jdVerdict(st)` **한 줄**이
     그것을 다 정하고, `JD_RULING[`을 읽는 자리도 그 한 곳뿐이다. 그래서 「묻지 않았는데 바뀐 판정」도
     「세 번을 넘긴 판정」도 만들어질 수 없다.
  ⭐ **다시 묻는 자리에는 옳고 그름이 없다**(`JD_ASK_OK` 부재 · 무판정 · 감점 0). 교과서가
     「재판을 받을 수 있도록」이라고만 적었으므로 판이 대신 판정하지 않는다.
  ① **법원이 하는 일 세 장면 잇기**(교과서 83쪽 세 장면 ↔ 법원이 하는 일 셋 · 순서 자유 · 판정 있음)
  ② **한 사건을 세 번까지 묻기**(1심 → 2심 → 3심 · 다시 묻기는 무판정 · 세 번째에 판정이 뒤집힘 ·
     세 번째 뒤에는 다시 물을 수 없음)
  ③ **공정한 재판을 위한 제도 세 가지 세우기**(지도서 활동지 상황 1·2·3 ↔ 제도 · 순서 자유 · 판정 있음)
  ④ 마무리 3택 = 재판이 공정하게 이루어져야 하는 까닭(지도서 핵심 질문 예시 답안 원문)
  ⚠️ 장면·사건·판정·제도·3택 전량 고정 리터럴 — 난수 0(`JD_RULING=[0,0,1]` 한 줄이 세 판정을 통째로 정한다).
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 세 장면을 다 잇기 전 재판 열기 무시(순서) — 판 불변 / ④ 이미 이은 장면 재클릭 — 판 불변 /
     ⑤ **세 번째 판정 뒤 다시 묻기 무시 — 판 불변(상한)** / ⑥ 세 번째 판정 전 제도 세우기 무시(순서) — 판 불변 /
     ⑦ 이미 세운 제도 재클릭 — 판 불변 / ⑧ 세 제도를 다 세우기 전 마무리 무시(순서) /
     ⑨ 안내 표시 중 재클릭 무시(`jdBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.jd-q`로 떼어 전 단계 상시 노출. 상태 열쇠 12개.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 사건은 교과서 84쪽 [미디어 활동] 기사를 옮긴 자리이지 실제 재판 절차를 그대로 옮긴
     것이 아니다**(캔버스 캡션에 명시). 기사에서 밑줄을 긋고 써 보는 활동은 교실 몫이다.
  ㉡ **판정의 내용을 지어내지 않는다** — 기사가 적은 만큼(1심·2심은 병원 측, 3심은 환자의 가족이
     손해 배상을 받음)까지만 쓰고, 재판이 어떻게 진행되는지의 자세한 절차는 교과서가 말하지
     않았으므로 판이 그 이상 말하지 않는다.
  ㉢ **다시 묻는 자리에 옳고 그름을 두지 않는다.**
  ㉣ **어느 쪽도 나쁜 쪽으로 그리지 않는다** — 재판에서 진 쪽을 나쁘게 그리지 않고, 병원도 기사가
     적은 만큼(「일부 잘못된 판단을 했다는 것을 인정받아」)까지만 쓴다.

⚠️ 설계 원칙
  · **11~12차시 침범 0** — **독재 0 · 균형 0 · 감시 0 · 견제 0** · 「권력 분립」은 **META 주제명 한 자리뿐**.

  · **주제① 재현 0** — 선거·공약·유권자·후보자·기표소 전부 0.
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 우리나라의 실제 정당·정치인 0, 실제 사건·연도·신문사 이름·금액 0(교과서 기사의
    출처·날짜·「벌금 100만 원」은 옮기지 않는다). 어느 기관도 나쁜 곳으로 그리지 않는다.
  · 교사용 참고 자료 0 — 참고 도서 세 종, 헌법 조항(제103조·제109조), 사법권·심급 제도·증거 재판주의·
    공개 재판주의·민사 재판·형사 재판·행정 재판·가사·소년·특허·군사·선거 재판, 판사·원고·피고·기소·
    소송, 법원 어린이 누리집·커리어넷·「사법부 홍보 비디오」, 국무 회의·감사원 전부 0.
    (「피고인」·「위자료」·「손해 배상」은 교과서 낱말 풀이 원문이라 쓴다.)

.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.jd-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:var(--bub);border-radius:9px;padding:7px 11px;line-height:1.45}
.jd-fin{display:flex;flex-direction:column;gap:5px}
.jd-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.jd-fin button:hover{background:var(--bub)}
.jd-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.jd-list{display:flex;flex-direction:column;gap:5px;max-height:206px;overflow-y:auto}
.jd-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.6px,1.8vw,13px);transition:.15s;
  line-height:1.4;text-align:left}
.jd-list button:hover{border-color:var(--green);background:var(--bub)}
.jd-list button.ok{border-color:var(--cyan);background:#FFF7ED;color:#C79A7A}
.jd-list button.no{border-color:var(--amber);background:var(--amber-bg);animation:shakeNo .4s ease}
.jd-list button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.jd-ask{border:2px solid var(--green);background:var(--bub);color:var(--green-d);border-radius:10px;
  padding:9px 10px;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:clamp(11px,1.87vw,13.4px);text-align:center;line-height:1.4}
.jd-ask:hover{background:#FFE4CC}
.jd-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.jd-casenote{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.8px,1.83vw,13px);line-height:1.5;color:#3F3A2C}
.jd-casenote b{color:#8A6D3B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#FFEDD5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(194,65,12,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}
</style>
<script src="/kedu_gate.js"></script>
</head>



<body>
<div class="ka">
  <div class="ka-h">

      <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>

      힌트
    </button>
    <button class="ka-nav ka-nav-next" id="next" onclick="next()">다음 →</button>
  </div>
</div>

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====

   ⚠️ 정치적 중립: 우리나라의 실제 정당·정치인 0. 기관은 사람 형상이 아니라 건물과 표찰로만 그린다. */
const SVG = {
  // 1 들어가기 — 정의의 여신상(지도서 동기 유발 · 저울과 책 · 사람 형상 대신 물건으로만)
  open:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="19" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">무엇을 들고 있을까요?</text>
    <path d="M100 40 L100 130" stroke="#C2410C" stroke-width="3"/>
    <path d="M60 52 L140 52" stroke="#C2410C" stroke-width="2.4"/>
    <path d="M60 52 L52 84 M60 52 L68 84" stroke="#EA580C" stroke-width="1.4"/><path d="M50 84 L70 84 L66 92 L54 92 Z" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.3"/>
    <path d="M140 52 L132 84 M140 52 L148 84" stroke="#EA580C" stroke-width="1.4"/><path d="M130 84 L150 84 L146 92 L134 92 Z" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.3"/>
    <text x="100" y="150" font-size="8.6" fill="#9A3412" text-anchor="middle" font-weight="800">저울</text>
    <rect x="196" y="56" width="70" height="52" rx="4" fill="#fff" stroke="#C2410C" stroke-width="1.8"/>
    <path d="M231 56 L231 108" stroke="#EA580C" stroke-width="1.4"/>
    <path d="M204 70 L224 70 M204 80 L224 80 M204 90 L224 90 M238 70 L258 70 M238 80 L258 80 M238 90 L258 90" stroke="#FDBA74" stroke-width="1.3"/>
    <text x="231" y="150" font-size="8.6" fill="#9A3412" text-anchor="middle" font-weight="800">법전</text>
    <text x="160" y="164" font-size="7.8" fill="#64748B" text-anchor="middle" font-weight="700">공정하게 · 정해진 법률에 따라</text></svg>`,
  // 2 살펴보기 — 법원의 뜻
  court:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    <text x="160" y="18" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">법원은 어떤 곳인가요</text>
    <rect x="14" y="30" width="292" height="40" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
    <text x="160" y="47" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">사람들 사이에 다툼이 생기거나 범죄가 발생했을 때</text>
    <text x="160" y="61" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">재판을 통해 옳고 그름을 가리는 국가기관</text>
    <rect x="14" y="80" width="292" height="40" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
    <text x="160" y="97" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">법을 어긴 사람을 처벌하여</text>
    <text x="160" y="111" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">사회 질서를 유지해요</text>
    <rect x="52" y="130" width="216" height="26" rx="8" fill="#fff" stroke="#EA580C" stroke-width="1.3"/>
    <text x="160" y="147" font-size="8.2" fill="#B45309" text-anchor="middle" font-weight="800">개인과 국가, 지방 자치 단체 사이의 갈등도 해결해요</text></svg>`,
  // 3 살펴보기 — 법원에서 하는 일 세 장면(교과서 83쪽)
  three:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="17" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">법원에서 하는 일 세 가지</text>
    ${[['개인 간의','갈등을 해결'],['법을 어긴 사람을','처벌'],['개인과 국가 사이의','갈등을 해결']].map((t,i)=>{
      const x=12+i*102;
      return `<rect x="${x}" y="30" width="94" height="86" rx="9" fill="#fff" stroke="#EA580C" stroke-width="1.5"/>
      <rect x="${x+27}" y="42" width="40" height="26" rx="4" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/>
      <path d="M${x+35} 42 L${x+35} 34 M${x+47} 42 L${x+47} 34 M${x+59} 42 L${x+59} 34" stroke="#EA580C" stroke-width="1.6"/>
      <text x="${x+47}" y="88" font-size="7.4" fill="#C2410C" text-anchor="middle" font-weight="800">${t[0]}</text>
      <text x="${x+47}" y="102" font-size="7.4" fill="#9A3412" text-anchor="middle" font-weight="800">${t[1]}</text>`;}).join('')}
    <rect x="12" y="126" width="296" height="30" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.3"/>
    <text x="160" y="145" font-size="8.2" fill="#9A3412" text-anchor="middle" font-weight="800">모두 재판을 통해 옳고 그름을 가려요</text></svg>`,
  // 4 살펴보기 — reveal: 법원이 없다면
  none:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    <text x="160" y="18" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">법원이 없다면 어떤 일이 생길까요</text>
    <rect x="20" y="34" width="120" height="54" rx="9" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="80" y="56" font-size="9" fill="#94A3B8" text-anchor="middle" font-weight="800">법원</text>
    <text x="80" y="72" font-size="7.2" fill="#94A3B8" text-anchor="middle" font-weight="700">없다면?</text>
    <rect x="180" y="34" width="120" height="54" rx="9" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
    <text x="240" y="52" font-size="8" fill="#9A3412" text-anchor="middle" font-weight="800">다툼과 갈등</text>
    <text x="240" y="66" font-size="8" fill="#9A3412" text-anchor="middle" font-weight="800">옳고 그름</text>
    <text x="240" y="80" font-size="7" fill="#B45309" text-anchor="middle" font-weight="700">누가 가려 줄까요?</text>
    <path d="M142 60 L178 60" stroke="#EA580C" stroke-width="2"/><path d="M172 56 L178 60 L172 64 Z" fill="#EA580C"/>
    <rect x="20" y="100" width="280" height="26" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3"/>
    <text x="160" y="117" font-size="8.2" fill="#9A3412" text-anchor="middle" font-weight="800">떠올려 보고 답을 확인해요</text>
    <rect x="20" y="134" width="280" height="24" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/>
    <text x="160" y="150" font-size="8.2" fill="#9A3412" text-anchor="middle" font-weight="800">법원은 사회 질서를 유지하는 국가기관이에요</text></svg>`,
  // 6 살펴보기 — 공정한 재판을 위한 제도(교과서 84쪽)
  fair:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="18" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">공정한 재판을 위한 제도</text>
    ${[['법원의 독립','법관의 신분 보장'],['삼심 제도','세 번까지 재판'],['재판의 과정과','결과 공개']].map((t,i)=>{
      const x=10+i*102;
      return `<rect x="${x}" y="30" width="96" height="70" rx="9" fill="#fff" stroke="#EA580C" stroke-width="1.5"/>
      <rect x="${x+30}" y="40" width="36" height="8" rx="2" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.1"/>
      <text x="${x+48}" y="70" font-size="7.8" fill="#C2410C" text-anchor="middle" font-weight="800">${t[0]}</text>
      <text x="${x+48}" y="86" font-size="6.8" fill="#9A3412" text-anchor="middle" font-weight="700">${t[1]}</text>`;}).join('')}
    <rect x="10" y="110" width="300" height="46" rx="9" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.3"/>
    <text x="160" y="128" font-size="8.2" fill="#9A3412" text-anchor="middle" font-weight="800">국민의 자유와 권리를 보장하려면</text>
    <text x="160" y="144" font-size="8.2" fill="#9A3412" text-anchor="middle" font-weight="800">재판이 공정하게 이루어져야 해요</text></svg>`,
  // 7 살펴보기 — reveal: [별별 직업] 변호사(사람 형상 대신 상담 탁자와 서류로만)
  lawyer:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    <text x="160" y="19" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">어려움에 처한 사람을 법을 이용해 도와줘요</text>
    <rect x="60" y="34" width="200" height="66" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.8"/>
    <rect x="80" y="48" width="70" height="38" rx="5" fill="#fff" stroke="#EA580C" stroke-width="1.3"/>
    <path d="M88 58 L142 58 M88 66 L142 66 M88 74 L128 74" stroke="#FDBA74" stroke-width="1.4"/>
    <rect x="170" y="48" width="70" height="38" rx="5" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.3"/>
    <text x="205" y="71" font-size="8.4" fill="#9A3412" text-anchor="middle" font-weight="800">법률 상담</text>
    <rect x="14" y="110" width="292" height="46" rx="9" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.3"/>

    <text x="160" y="144" font-size="8.2" fill="#9A3412" text-anchor="middle" font-weight="800">의뢰인을 도와 변호를 해 줘요</text></svg>`,
  // 16 정리
  wrap:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FFF7ED"/>
    <text x="160" y="20" font-size="11.4" fill="#9A3412" text-anchor="middle" font-weight="800">오늘의 정리</text>
    ${[['★','재판을 통해 옳고 그름을 가리는 국가기관'],['①','다툼·범죄 \u2014 재판을 통해 옳고 그름을 가려요'],['②','법을 어긴 사람을 처벌해 사회 질서를 유지해요'],['③','개인과 국가, 지방 자치 단체 사이의 갈등을 해결해요']].map((t,i)=>{
      const y=32+i*32;
      return `<rect x="16" y="${y}" width="288" height="26" rx="7" fill="#fff" stroke="#EA580C" stroke-width="1.3"/>
      <text x="30" y="${y+17}" font-size="9.4" fill="#C2410C" font-weight="800">${t[0]}</text>
      <text x="172" y="${y+17}" font-size="7.6" fill="#9A3412" text-anchor="middle" font-weight="800">${t[1]}</text>`;}).join('')}
    <text x="160" y="166" font-size="8.2" fill="#64748B" text-anchor="middle" font-weight="700">모두 법원에서 하는 일이에요</text></svg>`,
  // 18 종료
  done:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    <circle cx="160" cy="80" r="46" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
    <path d="M138 80 L154 96 L184 64" stroke="#C2410C" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="150" font-size="11" fill="#9A3412" text-anchor="middle" font-weight="800">법원에서 하는 일을 알아봤어요</text></svg>`
};
function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

/* ===== 직접조작 — 판정이 최종이 아닌 판(54번째 신규 패턴) =====
   ⭐ 앞의 쉰세 종에서 **판이 한 번 내린 판정은 그 자리에서 끝이었다.** 이번만 판이 내린 판정이

    <div class="tipbox">우리나라는 원칙적으로 하나의 사건에 대해 <b>세 번까지 재판</b>을 받을 수 있도록 한 <b>삼심 제도</b>를 두어 잘못된 판결로 억울한 일이 생기는 것을 막고 있어요. 또한 재판 결과의 공정성을 확보하기 위해 특별한 경우를 제외하고 <b>재판의 과정과 결과를 공개</b>해요.</div></div>`});
// 7 살펴보기 — reveal: [별별 직업] 변호사
slides.push({stage:2,badge:"개념",reveal:true,render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">[별별 직업] 변호사는 어떤 일을 하나요?</h2>
  <div class="ka-grp">
  <div class="paper"><div class="ph">\uD83D\uDD0E 어려움에 처한 사람을 법을 이용해 도와줘요!</div>
    개인 간의 다툼이나 범죄 사건이 발생했을 때 <b>의뢰인을 도와 변호</b>를 해 줘요. 법과 관련한 일로 고민이 있는 사람에게 <b>법률 상담</b>을 해 주거나 기업, 단체 등을 대신해 법적인 문제를 해결해 주기도 해요.</div>
  <div class="scene-row">${sceneCard('lawyer','변호사','wide')}</div>
  ${st.revealed?`<div class="answer-box">\u00B7 법학 전문 대학원을 졸업해 <b>변호사 자격시험</b>에 합격해야 해요.<br>
    \u00B7 사건을 체계적으로 분석하고 추리하여 문제를 해결할 수 있는 <b>논리력</b>과, 자신의 생각을 말과 글로 조리 있게 표현할 수 있는 <b>언어 능력</b>이 필요해요.<br>
    \u00B7 자신의 생각과 감정을 잘 알고, 자신을 돌아보며 감정을 조절할 수 있는 <b>자기 성찰 능력</b>도 중요해요.</div>`
    :`<div class="note">변호사가 되려면 어떤 것이 필요할까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약 — 10차시 주요 내용 정리 원문
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('wrap','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--green)">법원</b> \u2014 사람들 사이에 다툼이 생기거나 범죄가 발생했을 때 재판을 통해 옳고 그름을 가리고, 법을 어긴 사람을 처벌하여 사회 질서를 유지하는 국가기관이에요.</div></div>
    <div class="sum-item"><span class="n">①</span><div><b style="color:var(--green)">법원에서 하는 일</b> \u2014 재판을 통해 옳고 그름을 가림 \u00B7 법을 어긴 사람을 처벌해 사회 질서를 유지함 \u00B7 개인과 국가, 지방 자치 단체 사이에 생긴 갈등을 해결함.</div></div>
    <div class="sum-item"><span class="n">②</span><div><b style="color:var(--green)">공정한 재판을 위한 제도</b> \u2014 법원의 독립과 법관의 신분 보장, 삼심 제도, 재판의 과정과 결과 공개.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">국가기관의 권력을 나누는 까닭</b>을 알아봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"법원에서 하는 일을 설명할 수 있어요",st)}
    ${selfCheck(1,"공정한 재판을 위한 제도의 필요성을 말할 수 있어요",st)}
    ${selfCheck(2,"재판이 공정하게 이루어져야 하는 까닭에 관심을 갖게 됐어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">국가기관의 권력을 나누는 까닭</b>!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  jdLink:0, jdOpen:null, jdLevel:0, jdFix:0, jdOpenF:null, jdFin:null,
  jdWrongK:null, jdWrongK2:null, jdWrongF:null,
  jdMsg:null, jdWarn:false, jdBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function jdRender(){ main.innerHTML = slides[state.idx].render(state); }
function jdHold(msg){
  state.jdWarn=true; state.jdBusy=true; state.jdMsg=msg;
  playThud(); jdRender();
  setTimeout(()=>{ state.jdBusy=false; state.jdWarn=false; state.jdMsg=null;
    state.jdWrongK=null; state.jdWrongK2=null; state.jdWrongF=null; jdRender(); },1600);
}

/* ① 장면 고르기 — ⚠️ 판정 0(고르는 자리에는 옳고 그름이 없다) · 순서 자유 */
function jdPick(j){
  if(state.jdFin!=null) return;                                        // 가드①
  if(state.jdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(j) || j<0 || j>=JD_SCENE.length) return;        // 가드②
  if(state.jdLink & (1<<j)){ jdHold(JD_ALREADY_J); return; }           // 가드④ 판 불변
  state.jdOpen = j; state.jdWarn=false; state.jdMsg=null;
  playBlip(); jdRender();
}

/* ① 일 잇기 — 판정 있음. ⚠️ 어긋나도 판은 그대로이고 안내가 알맞은 일을 짚지 않는다. */
function jdLink(k){
  if(state.jdFin!=null) return;                                        // 가드①
  if(state.jdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=JD_JOB.length) return;          // 가드②
  if(state.jdOpen==null){ jdHold(JD_ORDER_K); return; }                // 순서 — 판 불변
  const j = state.jdOpen;
  if(jdKindOf(j)!==k){                                                 // 어긋남 — 판 불변
    state.jdWrongK=k; jdHold(JD_WRONG_K); return; }
  state.jdLink |= 1<<j; state.jdOpen=null; state.jdWrongK=null; state.jdWarn=false;
  state.jdMsg = jdAllLink(state)
    ? `이 장면은 <b>\u300C${JD_JOB_S[k]}\u300D</b>이었어요. 세 장면을 <b>모두</b> 이었어요. 이제 한 사건을 재판에 부쳐 봐요.`
    : `이 장면은 <b>\u300C${JD_JOB_S[k]}\u300D</b>이었어요.`;
  if(jdAllLink(state)) playChime(); else playBlip();
  jdRender();
}

/* ② 다시 묻기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   ⚠️ 옳고 그름이 없다(정답 상수 부재). 같은 사건을 다시 물으면 **더 위의 법원이 다시 판정**하고,
      지금의 판정은 `jdVerdict`가 정한다. 세 번째 뒤에는 **다시 물을 수 없다**(상한). 인자를 받지 않는다. */
function jdAsk(){
  if(state.jdFin!=null) return;                                        // 가드①
  if(state.jdBusy) return;                                             // 가드⑨
  if(!jdAllLink(state)){ jdHold(JD_ORDER_A); return; }                 // 가드③ 순서 — 판 불변
  if(state.jdLevel >= JD_MAX) return;                                  // 가드⑤ 상한 — 판 불변
  state.jdLevel += 1;                                                  // ★ 사건이 위로 올라가는 자리는 여기 한 곳뿐
  state.jdWarn=false; state.jdMsg = JD_ASK_MSG[state.jdLevel-1];
  if(jdDone(state)) playChime(); else playBlip();
  jdRender();
}

/* ③ 상황 고르기 — ⚠️ 판정 0 · 순서 자유 */
function jdSit(i){
  if(state.jdFin!=null) return;                                        // 가드①
  if(state.jdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=JD_SIT.length) return;          // 가드②
  if(!jdDone(state)){ jdHold(JD_ORDER_S); return; }                    // 가드⑥ 순서 — 판 불변
  if(state.jdFix & (1<<i)){ jdHold(JD_ALREADY_S); return; }            // 가드⑦ 판 불변
  state.jdOpenF = i; state.jdWarn=false; state.jdMsg=null;
  playBlip(); jdRender();
}

/* ③ 제도 세우기 — 판정 있음. ⚠️ 어긋나도 판은 그대로이고 안내가 알맞은 제도를 짚지 않는다. */
function jdFix(k){
  if(state.jdFin!=null) return;                                        // 가드①
  if(state.jdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=JD_FIX.length) return;          // 가드②
  if(state.jdOpenF==null){ jdHold(JD_ORDER_F); return; }               // 순서 — 판 불변
  const i = state.jdOpenF;
  if(jdFixOf(i)!==k){                                                  // 어긋남 — 판 불변
    state.jdWrongK2=k; jdHold(JD_WRONG_F); return; }
  state.jdFix |= 1<<i; state.jdOpenF=null; state.jdWrongK2=null; state.jdWarn=false;
  state.jdMsg = jdAllFix(state)
    ? `<b>\u300C${JD_FIX_S[k]}\u300D</b>이 그 상황을 막아요. 공정한 재판을 위한 제도를 <b>모두</b> 세웠어요.`
    : `<b>\u300C${JD_FIX_S[k]}\u300D</b>이 그 상황을 막아요.`;
  if(jdAllFix(state)) playChime(); else playBlip();
  jdRender();
}

/* ④ 마무리 — 「재판이 공정하게 이루어져야 하는 까닭은 무엇인가요」 */
function jdFinish(k){
  if(state.jdFin!=null) return;                                        // 가드①
  if(state.jdBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=JD_FIN.length) return;          // 가드②
  if(!jdReady(state)) return;                                          // 가드⑧ 순서 — 판 불변
  if(k===JD_FIN_OK){
    state.jdFin=k; state.jdWrongF=null; state.jdMsg=null; state.jdWarn=false;
    playChime(); jdRender(); return;
  }
  state.jdWrongF=k;
  jdHold(JD_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l09 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

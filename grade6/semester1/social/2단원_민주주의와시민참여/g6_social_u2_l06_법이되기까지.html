  지도서 p.177~179) 근거.
학습 목표: 국회에서 하는 일을 설명할 수 있다.
수업 기법 및 전략: 모둠 토의 · 의견 나누기
⚠️ 엔진은 대단원1 l01~l11 · 대단원2 l01~l05에서 100% 승계. 2단원 색 #C2410C 유지 · CSS 변수명 무수정.

⚠️ 파일명을 `법이되기까지`로 지었다(배선 예외 대신). l05가 「국회에서 하는 일」을 개수 ≤2로 재고 있고
   「법률안」·「심의」·「거부권」·「감시」·「견제」·「국회의원」을 개수 0으로 재고 있어서, 파일명에 그 낱말이
   들어가면 재배선이 곧바로 그 가드를 깨뜨린다. 겹치지 않는 이름을 골라 예외를 만들지 않았다(l05 선례).

직접조작: 미는 자리와 끝내는 자리가 다른 판(52번째 신규 패턴 — 판의 걸음이 처음으로 물러나는 형)
  ⭐ 앞의 쉰한 종에서 **판의 걸음은 한 번도 줄어들지 않았다.** 47번째(첫 길이 막히는 판)에서 첫 길이
     닫혔을 때도 「직접 가 봄」 표시가 새로 남아 판은 앞으로만 갔고, 42번째(되돌아온 요구가 판을 키우는
     판)에서 요구가 세 번 되돌아왔을 때도 광장은 **자라기만** 했으며, 46번째(도로 감추는 형)의 되감김조차
     **가져간 쌍은 건드리지 않아** 진행은 언제나 단조였다.
     이번만 **판의 걸음 수가 실제로 줄어든다** — 되돌려 보내면 법률안이 국회로 돌아가 걸음이 물러난다.
     근거는 교과서 77쪽 말풍선 원문 「대통령은 새로운 법에 관한 의견이 다르면 거부권을 행사할 수 있어요」.
  ⭐ **그리고 그 물림은 국회 자리에서 일어나지 않는다** — 걸음을 미는 단추는 앞 세 걸음에만 있고,
     마지막 걸음은 **대통령 칸의 두 단추 중 하나로만** 일어난다. 세 걸음을 다 밀어도 미는 단추가 사라진다.
     ⚠️ 47번째(첫 길이 막히는 판)와의 대비 — 거기서는 **판이 막는 자리를 미리 정해 두었고** 학생이
     스스로 길을 닫아야 했다. 여기서는 **막는 자리가 아니라 손이 닿는 자리 자체가 다르다.**
  ⭐ **법률이 되었는지를 따로 담는 상태가 코드에 아예 없다** — `lwLaw(st) = st.lwStep >= LW_N`
     **한 줄**이 그것을 다 정하고, 그 줄이 코드에 단 하나이며 `LW_WHO[`를 읽는 자리도 **단 하나**
     (`lwWhoOf`)다. 그래서 「밀지 않았는데 법률이 된 판」도 「서명하지 않았는데 시행된 판」도
     만들어질 수 없다.
  ⭐ **되돌려 보내는 자리에는 옳고 그름이 없다**(`LW_SIGN_OK` 부재 · 무판정). 교과서가 「행사할 수
     있어요」라고만 적었으므로 판이 대신 판정하지 않는다. 몇 번을 되돌려도 감점 0이고, 판이
     「그러면 안 돼요」라고 말하지 않는다.
  ① **법이 만들어지는 걸음 3 밀기**(교과서 77쪽 원문 · 국민 → 국회의원 → 국회 · 차례 고정 · 무판정)
  ② **대통령 칸 — 서명하기 / 되돌려 보내기**(무판정 · 되돌려 보내면 걸음이 물러나 다시 심의한다)
  ③ **국회가 하는 다른 일 3건 세우기**(교과서 79쪽 원문 · 순서 자유 · 무판정)
  ④ 마무리 3택 = 대통령이 법률안에 서명하는 까닭(지도서 예시 답안 원문)
  ⚠️ 걸음·자리·일·3택 전량 고정 리터럴 — 난수 0(`LW_WHO=[0,1,1,2]` 한 줄이 자리 대응을 통째로 정한다).
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ **마지막 걸음은 미는 단추로 밀 수 없음 — 판 불변**(핵심 가드) / ④ 법률이 된 뒤 밀기 무시 /
     ⑤ 마지막 걸음 차례가 아닐 때 대통령 칸 무시(순서) — 판 불변 /
     ⑥ 법률이 되기 전 다른 일 세우기 무시(순서) — 판 불변 / ⑦ 이미 세운 일 재클릭 — 판 불변 /
     ⑧ 세 일을 다 세우기 전 마무리 무시(순서) / ⑨ 안내 표시 중 재클릭 무시(`lwBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.lw-q`로 떼어 전 단계 상시 노출. 상태 열쇠 10개.

⚠️ 정직 원칙 네 곳
  ㉠ **화면이 [친구와 활동] 법률안 제안서 쓰기를 대신하지 않는다.** 진짜 활동은 교실에서 모둠이
     우리 생활에서 개선이 필요한 문제를 찾아 제안서를 쓰는 일이고, 판이 다루는 자리는 **법이
     만들어지는 걸음**까지다. 완료 카드에 그렇게 적었다.
  ㉡ **되돌려 보내는 자리에 옳고 그름을 두지 않는다** — 교과서가 「행사할 수 있어요」라고만 적었다.
  ㉢ **국회가 하는 일은 교과서 원문 한 줄씩까지만** — 어떻게 심사하는지의 자세한 절차는 교과서가
     말하지 않았으므로 판이 그 이상 말하지 않는다.
  ㉣ **판의 걸음은 실제 나라의 절차를 그대로 옮긴 것이 아니라 교과서 77쪽 그림을 판으로 옮긴 자리다**
     — 캔버스 캡션에 명시(스모크가 대조).

⚠️ 설계 원칙
  · **9차시 이후 침범 0** — 국무총리 0 · 행정 각부 0 · 행정부가 하는 일 상세 0.
    (「행정부」는 국정 감사의 대상으로 교과서 79쪽 원문이 말한 자리까지.)
  · **10차시 침범 0** — 삼심 0 · 법관 0 · 공개 재판 0 · 대법원 0 · 대법원장 0.
  · **11~12차시 침범 0** — **독재 0 · 균형 0** · 「권력 분립」은 **META 주제명 한 자리뿐(개수 1)** ·
    「감시」·「견제」는 교과서 77쪽 본문 원문 자리까지(개수 ≤5).
  · **주제① 재현 최소** — 「선거」는 교과서 8차시 본문 원문 자리까지(개수 ≤2) · 공약·유권자·후보자·
    기표소·모의 선거 0. 「투표」는 교과서 걸음 원문 자리까지.
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 우리나라의 실제 정당·정치인 0, 실제 법률 이름 0, 실제 사건·연도 0.

    사람이 다치거나 괴로워하는 묘사 0. **학생 이름 0 · 실제 지역 이름 0.**

   앞 세 걸음은 미는 단추로 밀리고, 마지막 걸음은 대통령 칸에서만 일어난다. */
const LW_WHO = [0, 1, 1, 2];
/* 국회에서 하는 다른 일 셋 \u2014 교과서 79쪽 원문 */
const LW_JOB = ['국정 감사','예산안 심의','인사 청문회'];

  '일을 맡을 사람이 그 일을 하는 데 알맞은 능력을 갖췄는지 살펴봐요.'
];
const LW_JOB_S = ['나라를 잘 운영하는지 확인','나라 살림 계획을 살펴봄','맡을 사람이 알맞은지 살펴봄'];
/* 되돌려 보냈을 때 판이 하는 말 \u2014 ⚠️ 어느 문구에도 옳고 그름이 없다 */
const LW_BACK_MSG = '법률안이 <b>국회로 되돌아왔어요.</b> 국회의원들이 <b>다시 심의</b>합니다 \u2014 판의 걸음이 한 걸음 물러났어요.';
const LW_SIGN_MSG = '대통령이 법률안에 <b>서명</b>했어요. 새 법률을 널리 알리고 <b>시행</b>합니다.';
/* ④ 마무리 \u2014 대통령이 법률안에 서명하는 까닭(지도서 예시 답안 원문) */
const LW_FIN = [
  '법을 만드는 일을 대통령이 대신 하기 위해서예요',
  '국회에서 마음대로 법을 만들지 못하게 하기 위해서예요',
  '법률안을 더 빨리 시행하기 위해서예요'
];
const LW_FIN_OK = 1;
const LW_FIN_NO = [
  '대통령이 법을 <b>대신 만드는</b> 것이 아니에요. 법을 만드는 일은 국회가 해요.',
  '',
  '<b>빨리</b> 하기 위해서가 아니에요. 판에서 되돌려 보낼 수 있었던 까닭을 떠올려 봐요.'
];
/* 안내 \u2014 어느 문구에도 「틀렸다」는 말이 없다 */
const LW_NOT_MINE = '여기서부터는 <b>국회의 손이 닿지 않아요.</b> 마지막 걸음은 <b>대통령</b>이 하는 일이에요.';
const LW_ALREADY_J = '그 일은 <b>이미 세웠어요.</b> 판은 그대로예요.';
const LW_ORDER_J = '먼저 <b>법이 만들어지는 걸음</b>을 끝까지 밟아 봐요.';
/* 받침 처리 \u2014 안내문에 「을(를)」 병기가 남지 않게 한다 */
function lwJ(s){ const c=s.charCodeAt(s.length-1); return (c>=0xAC00&&c<=0xD7A3) ? ((c-0xAC00)%28!==0) : false; }

/* ★ LW_WHO를 읽는 자리는 여기 한 곳뿐이다. */
function lwWhoOf(k){ return LW_WHO[k]; }
/* ★ 이 한 줄이 「법률이 되었는가」를 다 정한다 \u2014 그것을 따로 담는 상태가 코드에 없다. */
function lwLaw(st){ return st.lwStep >= LW_N; }
function lwTurnSeat(st){ return lwLaw(st) ? -1 : lwWhoOf(st.lwStep); }
function lwPushable(st){ return !lwLaw(st) && lwTurnSeat(st)!==2; }
function lwBits(m){ const r=[]; for(let j=0;j<LW_JOB.length;j++){ if(m & (1<<j)) r.push(j); } return r; }
function lwAllJob(st){ return st.lwJob === (1<<LW_JOB.length)-1; }

/* 판 \u2014 위는 자리 세 칸, 가운데는 걸음 네 줄, 아래는 국회가 하는 다른 일 세 칸.
   ⚠️ 걸음 줄을 그리는 자리는 **여기 한 곳뿐**이고, 몇 걸음까지 왔는지는 `state.lwStep`이 정한다. */
function lwCanvas(st){
  const law = lwLaw(st), turn = lwTurnSeat(st), jn = lwBits(st.lwJob).length;
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = st.lwFin!=null ? '국회는 법을 만들고, 나랏일이 잘 운영되는지 살펴봐요'
    : (law ? (lwAllJob(st) ? '국회가 하는 일을 모두 세웠어요' : '법률이 시행됐어요 \u2014 국회가 하는 다른 일도 세워 봐요')
      : (st.lwStep===3 ? '여기서부터는 대통령 칸의 차례예요' : '법이 만들어지는 걸음을 밀어 봐요'));
  g+=`<text x="160" y="21" font-size="10.2" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  for(let j=0;j<3;j++){
    const on = (turn===j), x = 12 + j*100;
    g+=`<rect data-seat="${j}" data-turn="${on?1:0}" x="${x}" y="28" width="96" height="34" rx="8" fill="${on?'#fff':'#F8FAFC'}" stroke="${on?'#C2410C':'#CBD5E0'}" stroke-width="${on?1.9:1.2}"${on?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+48}" y="45" font-size="9" fill="${on?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${LW_SEAT[j]}</text>`;
    g+=`<text x="${x+48}" y="56" font-size="6.6" fill="${on?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="700">${on?'지금 이 자리의 차례':'\u00B7'}</text>`;
  }
  g+=`<text x="20" y="78" font-size="8.6" fill="#B45309" font-weight="800">법이 만들어지는 걸음 \u2014 ${Math.min(st.lwStep,LW_N)} / ${LW_N} \u00B7 되돌려 보낸 횟수 ${st.lwBack}</text>`;
  for(let k=0;k<LW_N;k++){
    const on = st.lwStep > k, y = 84 + k*26;
    g+=`<rect data-step="${k}" data-on="${on?1:0}" x="14" y="${y}" width="292" height="23" rx="6" fill="${on?'#fff':'#F8FAFC'}" stroke="${on?'#C2410C':'#CBD5E0'}" stroke-width="${on?1.6:1.1}"${on?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="26" y="${y+15}" font-size="8" fill="${on?'#C2410C':'#CBD5E0'}" font-weight="800">${['\u2460','\u2461','\u2462','\u2463'][k]}</text>`;
    g+=`<text x="168" y="${y+15}" font-size="7.5" fill="${on?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${on?LW_STEP_S[k]:'아직이에요'}</text>`;
    g+=`<text x="292" y="${y+15}" font-size="6.4" fill="${on?'#B45309':'#CBD5E0'}" text-anchor="end" font-weight="700">${LW_SEAT[lwWhoOf(k)]}</text>`;
  }
  g+=`<text x="20" y="198" font-size="8.6" fill="#B45309" font-weight="800">국회가 하는 다른 일 \u2014 세운 일 ${jn} / ${LW_JOB.length}</text>`;
  for(let j=0;j<LW_JOB.length;j++){
    const set = !!(st.lwJob & (1<<j)), x = 12 + j*100;
    g+=`<rect data-job="${j}" data-set="${set?1:0}" x="${x}" y="202" width="96" height="38" rx="8" fill="${set?'#fff':'#F8FAFC'}" stroke="${set?'#C2410C':'#CBD5E0'}" stroke-width="${set?1.8:1.2}"${set?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+48}" y="219" font-size="8.2" fill="${set?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${set?LW_JOB[j]:'아직'}</text>`;
    g+=`<text x="${x+48}" y="232" font-size="6.2" fill="${set?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="700">${set?LW_JOB_S[j]:'세우지 않았어요'}</text>`;
  }
  g+=`<rect data-stepn="${Math.min(st.lwStep,LW_N)}" data-backn="${st.lwBack}" data-lawn="${law?1:0}" data-jobn="${jn}" x="14" y="84" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function lwPanel(st){
  const fin = st.lwFin!=null, law = lwLaw(st), allJ = lwAllJob(st), turn = lwTurnSeat(st);
  const q = fin
    ? '법을 만드는 일은 국회가 하고, <b>마지막 서명</b>은 대통령이 했어요. 두 자리가 <b>나눠 맡고</b> 있어요.'
    : (allJ ? '<b>대통령이 법률안에 서명</b>하는 까닭은 무엇일까요?'
      : (law ? '<b>국회가 하는 다른 일</b>도 세워 봐요. 어느 것부터 세워도 돼요.'
        : (turn===2 ? '마지막 걸음은 <b>대통령 칸</b>에서 일어나요. 서명할까요, 되돌려 보낼까요?'
          : `지금은 <b>\u300C${LW_SEAT[turn]}\u300D</b> 자리의 차례예요. 걸음을 밀어 봐요.`)));
  let right = `<div class="lw-q">${q}</div>`;

  if(fin){
    right+=`<div class="dw-card"><div class="pt">\uD83C\uDFDB\uFE0F 판이 물러났던 까닭</div>
      <div>되돌려 보내면 법률안이 <b>국회로 돌아가</b> 다시 심의해요. 그래서 판의 걸음이 <b>물러났어요.</b></div>
      <div style="margin-top:5px">마지막 걸음을 국회 자리에서 밀 수 없었던 것은 판이 막았기 때문이 아니에요. <b>그 걸음을 하는 자리가 달랐기 때문</b>이에요. 대통령과 국회가 <b>힘을 나눠</b> 맡고 있어요.</div>
      <div style="margin-top:5px;color:#64748B">우리 생활에서 고쳤으면 하는 일을 찾아 <b>법률안 제안서</b>를 써 보는 것은 교실에서 모둠 친구들과 함께 하는 활동이에요. 화면이 그 활동을 대신하지 않아요.</div></div>`;
  } else if(allJ){
    right+=`<div class="lw-fin">${LW_FIN.map((f,k)=>
      `<button class="${st.lwWrongF===k?'no':''}" onclick="lwFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(law){
    right+=`<div class="dw-step">\uD83C\uDFDB\uFE0F 국회가 하는 다른 일 세우기</div>`;
    right+=`<div class="lw-list">${LW_JOB.map((o,j)=>{
      const on = !!(st.lwJob & (1<<j));
      return `<button class="${on?'ok':''}${st.lwWrongJ===j?' no':''}" onclick="lwSet(${j})">${on?'\u2713 ':''}${o} \u2014 ${LW_JOB_DO[j]}</button>`;
    }).join('')}</div>`;
  } else if(turn===2){
    right+=`<div class="dw-step">\u270D\uFE0F 대통령 칸 \u2014 이 자리에는 정답이 없어요</div>`;
    right+=`<div class="lw-seatnote"><b>대통령은 새로운 법에 관한 의견이 다르면 거부권을 행사할 수 있어요.</b><br>어느 쪽을 골라도 판이 옳고 그름을 말하지 않아요.</div>`;
    right+=`<div class="lw-fin">
      <button onclick="lwSign(0)">\u270D\uFE0F 서명하기 \u2014 새 법률을 널리 알리고 시행해요</button>
      <button onclick="lwSign(1)">\u21A9\uFE0F 되돌려 보내기 \u2014 국회에서 다시 심의해요</button></div>`;
  } else {
    right+=`<div class="dw-step">\u25B6 걸음 밀기</div>`;
    right+=`<div class="lw-note">${LW_STEP[st.lwStep]}</div>`;
    right+=`<button class="lw-push" onclick="lwPush()">\u25B6 \u300C${LW_SEAT[turn]}\u300D 자리의 걸음을 밀어요</button>`;
  }
  if(st.lwMsg) right+=`<div class="dw-msg${st.lwWarn?' warn':''}">${st.lwMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDFDB\uFE0F 미는 자리와 끝내는 자리가 달라요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${lwCanvas(st)}<div class="cvcap">판의 걸음은 교과서 77쪽 그림을 옮긴 자리예요. 실제 나라의 절차를 그대로 옮긴 것은 아니에요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function lwRender(){ main.innerHTML = slides[state.idx].render(state); }
function lwHold(msg){
  state.lwWarn=true; state.lwBusy=true; state.lwMsg=msg;
  playThud(); lwRender();
  setTimeout(()=>{ state.lwBusy=false; state.lwWarn=false; state.lwMsg=null;
    state.lwWrongP=null; state.lwWrongJ=null; state.lwWrongF=null; lwRender(); },1600);
}

/* ① 걸음 밀기 — ⚠️ 판정 0. 앞 세 걸음만 이 단추로 밀린다.
   ★ 가드③이 이 패턴의 한 축이다 — 마지막 걸음은 미는 단추로는 밀 수 없다. */
function lwPush(){
  if(state.lwFin!=null) return;                                        // 가드①
  if(state.lwBusy) return;                                             // 가드⑨
  if(lwLaw(state)) return;                                             // 가드④ 법률이 된 뒤 밀기 무시
  if(!lwPushable(state)){                                              // 가드③ 마지막 걸음 — 판 불변
    state.lwWrongP=state.lwStep; lwHold(LW_NOT_MINE); return; }
  const k = state.lwStep;
  state.lwStep += 1;                                                   // ★ 걸음이 늘어나는 자리는 여기 한 곳뿐
  state.lwWrongP=null; state.lwWarn=false;
  const sjo = lwJ(LW_STEP_S[k]) ? '\uC774' : '\uAC00';
  state.lwMsg = (lwTurnSeat(state)===2)
    ? `<b>\u300C${LW_STEP_S[k]}\u300D</b>${sjo} 판에 놓였어요. 여기까지가 <b>국회의 몫</b>이에요 \u2014 마지막 걸음은 <b>대통령 칸</b>에서 일어나요.`
    : `<b>\u300C${LW_STEP_S[k]}\u300D</b>${sjo} 판에 놓였어요. 다음은 <b>\u300C${LW_SEAT[lwTurnSeat(state)]}\u300D</b> 자리의 차례예요.`;
  playBlip();
  lwRender();
}

/* ② 대통령 칸 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   ⚠️ 옳고 그름이 없다(정답 상수 부재). 되돌려 보내면 **판의 걸음이 물러난다.** */
function lwSign(k){
  if(state.lwFin!=null) return;                                        // 가드①
  if(state.lwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>1) return;                       // 가드②
  if(lwTurnSeat(state)!==2) return;                                    // 가드⑤ 순서 — 판 불변
  if(k===0){
    state.lwStep += 1;
    state.lwWarn=false; state.lwMsg = LW_SIGN_MSG;
    playChime(); lwRender(); return;
  }
  state.lwStep -= 1;                                                   // ★ 걸음이 줄어드는 자리는 여기 한 곳뿐
  state.lwBack += 1;
  state.lwWarn=false; state.lwMsg = LW_BACK_MSG;
  playBlip(); lwRender();
}

/* ③ 국회가 하는 다른 일 세우기 — ⚠️ 판정 0 · 순서 자유 */
function lwSet(j){
  if(state.lwFin!=null) return;                                        // 가드①
  if(state.lwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(j) || j<0 || j>=LW_JOB.length) return;          // 가드②
  if(!lwLaw(state)){                                                   // 가드⑥ 순서 — 판 불변
    state.lwWrongJ=j; lwHold(LW_ORDER_J); return; }
  if(state.lwJob & (1<<j)){                                            // 가드⑦ 이미 세운 일 — 판 불변
    state.lwWrongJ=j; lwHold(LW_ALREADY_J); return; }
  state.lwJob |= 1<<j; state.lwWrongJ=null; state.lwWarn=false;
  const ojo = lwJ(LW_JOB[j]) ? '\uC744' : '\uB97C';
  state.lwMsg = lwAllJob(state)
    ? `<b>\u300C${LW_JOB[j]}\u300D</b>${ojo} 세웠어요 \u2014 ${LW_JOB_DO[j]} 국회가 하는 일을 <b>모두</b> 세웠어요.`
    : `<b>\u300C${LW_JOB[j]}\u300D</b>${ojo} 세웠어요 \u2014 ${LW_JOB_DO[j]}`;
  if(lwAllJob(state)) playChime(); else playBlip();
  lwRender();
}

/* ④ 마무리 — 「대통령이 법률안에 서명하는 까닭」 */
function lwFinish(k){
  if(state.lwFin!=null) return;                                        // 가드①
  if(state.lwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=LW_FIN.length) return;          // 가드②
  if(!lwAllJob(state)) return;                                         // 가드⑧ 세 일 전 무시(순서)
  if(k===LW_FIN_OK){
    state.lwFin=k; state.lwWrongF=null; state.lwMsg=null; state.lwWarn=false;
    playChime(); lwRender(); return;
  }
  state.lwWrongF=k;
  lwHold(LW_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l07_나라살림.html'; } // l07 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

성취기준 [6사08-02] · 교과서 p.86~91 · 지도서(대단원2 **11~12차시** 국가기관의 권력을 나누는 까닭을
  알아볼까요 / [할 수 있어요] 권력을 나누는 이유 탐구하기, 지도서 p.198~203) 근거.
학습 목표: 국가기관의 권력을 나누는 까닭을 설명할 수 있다.
수업 기법 및 전략: 모둠 토의 · 의견 나누기
★ 주제② 마지막 차시라 주제 마무리([얼마나 잘했을까] · [재미있게 확인해요])가 함께 붙는다.
⚠️ 엔진은 대단원1 l01~l11 · 대단원2 l01~l08에서 100% 승계. 2단원 색 #C2410C 유지 · CSS 변수명 무수정.

⚠️ 파일명을 `나눠맡아요`로 지었다(배선 예외 대신). l08이 「독재」·「균형」·「감시」·「견제」를 개수 0으로,
   「권력 분립」을 개수 1, 「권력을 나누는」을 개수 2로 재고 있어서 파일명에 그 낱말이 들어가면
   재배선이 곧바로 그 가드를 깨뜨린다. 겹치지 않는 이름을 골라 예외를 만들지 않았다
   (l05 `나랏일` · l06 `법이되기까지` · l07 `나라살림` · l08 `세번까지` 선례 승계).

직접조작: 가리키는 자리가 사라지는 판(55번째 신규 패턴 — 어느 자리도 가장 크지 않은 상태가
  판의 정상 상태이고, 한 자리로 기울면 판이 그 자리를 가리켰다가 견제 한 번에 다시 사라지는 형)
  ⭐ 앞의 쉰네 종에서 **판은 언제나 어떤 자리를 가리키고 있었다.** 53번째(대신 맡는 형)에서는
     대통령의 일을 지는 자리가 **언제나 정확히 하나**였고, 54번째(판정이 최종이 아닌 형)에서는
     판정이 바뀌기는 해도 **언제나 하나**였다. 이번만 **판이 가리키는 자리가 아예 없는 것이
     정상 상태다** — 세 힘을 나눠 맡기면 어느 자리도 가장 크지 않게 되고, 판은 아무 자리도
     가리키지 않는다. 근거는 교과서 87쪽 본문 원문 「한 국가기관이 나라의 중요한 일을 마음대로
     처리할 수 없도록 서로를 견제하고 균형을 이뤄 내며, 국민의 자유와 권리를 보장합니다」.
  ⭐ **53번째와의 정면 대비** — 거기서는 자리가 비어도 **지는 자리가 하나 남았다.** 여기서는
     힘을 다 나누면 **가리키는 자리가 하나도 남지 않는다.** 그것이 균형이다.
  ⭐ **54번째와의 대비** — 거기서는 다시 물을수록 판정이 **바뀌었고**, 여기서는 기울였다가
     견제하면 판이 **같은 자리로 돌아온다**(되돌아온다 · 바뀌지 않는다).
  ⭐ **한 자리로 기울이면 가리키는 자리가 다시 생긴다** — 그리고 「견제와 균형」 한 번에 다시
     사라진다. 어느 자리를 기울여도 결과는 같다(세 갈래 전수 동일).
  ⭐ **지금 어느 자리가 가장 큰지를 따로 담는 상태가 코드에 아예 없다** — `pwTop(st)` **한 줄**이
     그것을 다 정하고, `PW_OWNER[`를 읽는 자리도 `pwOwnerOf` 한 곳뿐이며, 가장 큰 자리를 그리는
     자리도 **단 하나**다.
  ⭐ **기울이는 자리와 되돌리는 자리에는 옳고 그름이 없다**(`PW_LEAN_OK` 부재 · 무판정 · 감점 0).
  ① **힘 세 가지를 나눠 맡기기**(재판을 하는 힘 / 법을 만드는 힘 / 나라 살림을 하는 힘 ↔ 국회·행정부·법원 ·
     순서 자유 · 판정 있음 · 교과서 87쪽 원문)
  ② **기울여 보기 · 견제하기**(무판정 · 어느 자리로든 기울일 수 있고, 견제 한 번에 되돌아온다 · 몇 번이든)
  ③ **견제 사례 세 가지 짝짓기**(교과서 88쪽 ㉮㉯㉰ ↔ 「누가 누구를 견제하는가」 · 순서 자유 · 판정 있음)
  ④ 마무리 3택 = 국가기관의 권력을 분립하는 이유(지도서 핵심 질문 예시 답안 원문)
  ⚠️ 힘·자리·사례·3택 전량 고정 리터럴 — 난수 0(`PW_OWNER=[2,0,1]` · `PW_PAIROF=[1,2,0]` 각 한 줄).
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 세 힘을 다 나누기 전 기울이기 무시(순서) — 판 불변 / ④ 이미 나눈 힘 재클릭 — 판 불변 /
     ⑤ 기울지 않았는데 견제 무시 — 판 불변 / ⑥ 한 번도 균형을 되찾기 전 사례 고르기 무시(순서) — 판 불변 /
     ⑦ 이미 짝지은 사례 재클릭 — 판 불변 / ⑧ 세 사례를 다 짝짓기 전 마무리 무시(순서) /
     ⑨ 안내 표시 중 재클릭 무시(`pwBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.pw-q`로 떼어 전 단계 상시 노출. 상태 열쇠 13개.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 자리는 교과서 87쪽 도식을 판으로 옮긴 자리이지 실제 국가기관의 크기를 잰 것이 아니다**
     (캔버스 캡션에 명시).
  ㉡ **판이 국가기관의 힘을 숫자로 지어내지 않는다** — 판의 몫은 「맡은 힘의 개수」일 뿐이고,
     실제 국가기관의 권한을 수치로 비교한 것이 아니다(캡션에 명시).
  ㉢ **기울이고 되돌리는 자리에 옳고 그름을 두지 않는다.**
  ㉣ **어느 국가기관도 나쁜 곳으로 그리지 않는다** — 견제는 서로를 바로잡는 일이지 누가 나빠서
     하는 일이 아니라는 것을 판이 스스로 말한다.

⚠️ 설계 원칙
  · **주제③(미디어) 침범 0** — 미디어·광고·누리 소통망·가짜 정보 전부 0(차시 예고 자리의 「미디어」 한 자리 제외).
  · **l05~l08 재현은 주제 마무리 자리까지만** — 이 차시는 주제② 마지막 차시라 [재미있게 확인해요]와
    [얼마나 잘했을까]가 붙는다. 삼심·국무총리·행정 각부는 **주제 마무리 문항 자리까지만** 쓴다.
  · **주제① 재현 0** — 공약·유권자·후보자·기표소 전부 0.(교과서 86쪽 만화 원문의 「선거를 하여」는 유지)
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 우리나라의 실제 정당·정치인·대통령 이름 0, 실제 정책·사건·연도 0.
    지도서의 교사용 동기 유발(세계의 독재자·역사적 사실 조사)과 「권력 분립 위반 사례」 검색 안내는
    **화면에 옮기지 않는다** — 「독재」 낱말 0. 교과서 86쪽 만화가 적은 만큼(「권력이 한곳에 집중되면」)까지만.
  · 교사용 참고 자료 0 — 참고 도서 네 종, 헌법 조문 번호(제40조·제66조·제101조), 입법권·행정권·사법권·
    입법부·사법부·삼권 분립, 국무 조정실·감사원·지방 자치 단체장·공청회·시위 전부 0.
    (「국정 감사」·「법률안 거부권」은 교과서 88쪽 본문 원문이라 쓴다.)
  · **파일 전체에 네 자리 연도 0 · 금액·인원 수치 0**(CSS 밖 스코프).
  · 정서 — 만화의 「쫓아내는」은 교과서 원문까지만(개수 ≤2), 사람이나 동물이 다치는 묘사 0,
    겁주는 어휘 0 · **학생 이름 0 · 실제 지역 이름 0.**

      언제나 정확히 하나였고, 54번째에서는 판정이 언제나 하나 있었다. 이번만 **가리키는 자리가
      하나도 없는 것이 판의 정상 상태다** — 세 힘을 나눠 맡기면 어느 자리도 가장 크지 않게 된다.
   ⭐ **한 자리로 기울이면 가리키는 자리가 다시 생기고, 견제 한 번에 다시 사라진다.**
      어느 자리를 기울여도 결과는 같다(복원).
   ⭐ **지금 어느 자리가 가장 큰지**는 `pwTop(st)` 한 줄이 다 정한다. 그것을 따로 담는 상태가
      코드에 없고, `PW_OWNER[`를 읽는 자리도 `pwOwnerOf` 한 곳뿐이다.
   ⭐ **기울이는 자리와 되돌리는 자리에는 옳고 그름이 없다**(정답 상수 부재 · 무판정).
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */
const PW_HOME = 3;                       /* 판 위 「한 자리」 — 힘이 아직 모여 있는 자리 */
const PW_ALL = [0, 1, 2, 3];
const PW_SLOT = ['국회','행정부','법원','한 자리'];
/* 세 국가기관이 하는 일 — 교과서 87쪽 도식 원문 */
const PW_DO = ['나라를 다스리는 법을 만듭니다','법에 따라 나라 살림을 합니다','법에 따라 재판을 합니다'];
/* 나눠 맡길 세 가지 힘 */
const PW_POWER = ['재판을 하는 힘','법을 만드는 힘','나라 살림을 하는 힘'];
const PW_POWER_S = ['재판','법 만들기','나라 살림'];
/* ⚠️ 힘 p를 맡는 자리 — 이 한 줄이 힘과 자리의 대응을 통째로 정한다(난수 0). */
const PW_OWNER = [2, 0, 1];
/* 서로 견제하는 세 가지 모습 — 교과서 88쪽 [할 수 있어요] 원문 */
const PW_CASE = [
  '국회는 행정부가 법에 따라 나라의 살림을 잘 운영하고 있는지 확인하려고 국정 감사를 했습니다.',
  '대통령은 국회에서 통과된 법률안에 관한 의견이 다를 때 국회에서 이를 다시 논의할 것을 요구하는 법률안 거부권을 행사했습니다.',
  '법원은 행정부가 내린 명령이 헌법에 위반되어 무효라고 판단하므로 명령을 취소하라고 결정했습니다.'
];
const PW_CASE_S = ['㉮ 국정 감사','㉯ 법률안 거부권','㉰ 명령 취소 결정'];
const PW_DIR = ['법원이 행정부를 견제해요','국회가 행정부를 견제해요','행정부가 국회를 견제해요'];
const PW_DIR_S = ['법원 → 행정부','국회 → 행정부','행정부 → 국회'];
/* ⚠️ 사례 i가 보여 주는 견제 방향 — 이 한 줄이 대응을 통째로 정한다(난수 0). */
const PW_PAIROF = [1, 2, 0];
/* ④ 마무리 — 국가기관의 권력을 분립하는 이유(지도서 핵심 질문 예시 답안 원문) */
const PW_FIN = [
  '어느 한 국가기관의 힘이 가장 커지게 하기 위해서예요',
  '국민의 자유와 권리를 보장하기 위해서예요',
  '나라의 일을 더 빨리 처리하기 위해서예요'
];
const PW_FIN_OK = 1;
const PW_FIN_NO = [
  '한 자리의 힘이 가장 커지면 그 자리가 나라의 중요한 일을 <b>마음대로</b> 처리할 수 있어요. 판에서도 기울인 자리를 곧바로 견제했어요.',
  '',
  '빨리 처리하는 것이 목적이라면 셋으로 <b>나눠 맡길</b> 까닭이 없었을 거예요.'
];
/* 기울였을 때·되돌렸을 때 판이 하는 말 — ⚠️ 어느 문구에도 옳고 그름이 없다 */
const PW_LEAN_M = '한 자리로 힘이 기울었어요. 판이 다시 <b>그 자리</b>를 가리켜요. 이대로 두면 그 자리가 나라의 중요한 일을 마음대로 처리할 수도 있어요.';
const PW_BAL_M = '다른 자리들이 <b>견제</b>했어요. 가리키는 자리가 <b>다시 사라졌어요</b> — 어느 자리도 가장 크지 않아요. 이것이 <b>균형</b>이에요.';
/* 안내 — 어느 문구에도 「틀렸다」는 말이 없다 */
const PW_ALREADY_P = '그 힘은 <b>이미 맡겼어요.</b> 판은 그대로예요.';
const PW_ORDER_K = '먼저 <b>힘</b>을 하나 골라 봐요.';
const PW_WRONG_K = '그 힘을 맡는 자리가 아니에요. 세 자리가 하는 일을 다시 읽어 봐요.';
const PW_ORDER_L = '먼저 <b>세 가지 힘</b>을 모두 나눠 맡겨 봐요.';
const PW_ORDER_B = '아직 어느 자리로도 <b>기울지 않았어요.</b> 판은 그대로예요.';
const PW_ORDER_C = '먼저 기울었던 판을 <b>견제</b>해서 균형으로 되돌려 봐요.';
const PW_ALREADY_C = '그 사례는 <b>이미 짝지었어요.</b> 판은 그대로예요.';
const PW_ORDER_D = '먼저 <b>사례</b>를 하나 골라 봐요.';
const PW_WRONG_D = '그 사례가 보여 주는 견제 방향이 아니에요. <b>누가</b> <b>누구를</b> 확인하고 있는지 다시 읽어 봐요.';

/* ★ PW_OWNER를 읽는 자리는 여기 한 곳뿐이다. */
function pwOwnerOf(p){ return PW_OWNER[p]; }
/* ★ PW_PAIROF를 읽는 자리는 여기 한 곳뿐이다. */
function pwDirOf(i){ return PW_PAIROF[i]; }
function pwBits(m,n){ const r=[]; for(let k=0;k<n;k++){ if(m & (1<<k)) r.push(k); } return r; }
/* 자리 k가 지금 맡은 몫 — 「한 자리」는 아직 나누지 않은 힘을 모두 쥐고 있다. */
function pwShare(st,k){ const g=pwBits(st.pwGive,PW_POWER.length);
  return (k===PW_HOME ? PW_POWER.length-g.length : g.filter(p=>pwOwnerOf(p)===k).length) + (st.pwLean===k ? 1 : 0); }
/* ★ 이 한 줄이 「지금 판이 어느 자리를 가리키는가」를 다 정한다 — 그것을 따로 담는 상태가 코드에 없다.
   가장 큰 자리가 유일할 때만 그 자리를 가리키고, 어느 자리도 가장 크지 않으면 가리키지 않는다(-1). */
function pwTop(st){ const v=PW_ALL.map(k=>pwShare(st,k)), m=Math.max.apply(null,v); return v.filter(x=>x===m).length===1 ? v.indexOf(m) : -1; }
function pwAllGive(st){ return st.pwGive === (1<<PW_POWER.length)-1; }
function pwAllPair(st){ return st.pwPair === (1<<PW_CASE.length)-1; }
function pwFelt(st){ return st.pwBal > 0; }
function pwPowerAt(st,k){ for(let p=0;p<PW_POWER.length;p++){ if((st.pwGive & (1<<p)) && pwOwnerOf(p)===k) return p; } return -1; }
function pwReady(st){ return pwAllPair(st); }

/* 판 — 위는 세 국가기관 자리와 「한 자리」, 가운데는 가리키는 자리, 아래는 견제 사례 세 칸.
   ⚠️ 가리키는 자리를 그리는 자리는 **여기 한 곳뿐**이고, 무엇을 그릴지는 `pwTop(st)`가 정한다. */
function pwCanvas(st){
  const fin = st.pwFin!=null;
  const giveN = pwBits(st.pwGive,PW_POWER.length).length, pairN = pwBits(st.pwPair,PW_CASE.length).length;
  const top = pwTop(st);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = fin ? '권력을 나누는 까닭은 국민의 자유와 권리를 보장하기 위해서예요'
    : (pwReady(st) ? '서로 견제하는 세 모습을 모두 짝지었어요'
      : (pwFelt(st) ? '견제하는 모습을 사례에서 찾아봐요'
        : (st.pwLean!=null ? `${PW_SLOT[st.pwLean]} 쪽으로 힘이 기울었어요` 
          : (pwAllGive(st) ? '어느 자리도 가장 크지 않아요 — 한번 기울여 볼까요?' : '힘을 알맞은 자리에 나눠 맡겨 봐요'))));
  g+=`<text x="160" y="19" font-size="9.6" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  for(let k=0;k<3;k++){
    const p = pwPowerAt(st,k), got = p>=0, x = 12 + k*100;
    g+=`<rect data-slot="${k}" data-power="${p}" x="${x}" y="26" width="96" height="46" rx="7" fill="${got?'#fff':'#F8FAFC'}" stroke="${got?'#C2410C':'#CBD5E0'}" stroke-width="${got?1.7:1.2}"${got?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+48}" y="40" font-size="7.6" fill="${got?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${PW_SLOT[k]}</text>`;
    g+=`<text x="${x+48}" y="52" font-size="5.8" fill="${got?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="700">${PW_DO[k]}</text>`;
    g+=`<text data-share="${pwShare(st,k)}" x="${x+48}" y="66" font-size="6.4" fill="${got?'#C2410C':'#CBD5E0'}" text-anchor="middle" font-weight="800">${got?('맡은 힘 · '+PW_POWER_S[p]):'아직 맡지 않았어요'}</text>`;
  }
  const homeN = pwShare(st,PW_HOME);
  g+=`<rect data-home="${homeN}" x="12" y="80" width="140" height="40" rx="7" fill="${homeN>0?'#FFEDD5':'#F8FAFC'}" stroke="${homeN>0?'#C2410C':'#CBD5E0'}" stroke-width="${homeN>0?1.7:1.1}"${homeN>0?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text x="82" y="96" font-size="7.6" fill="${homeN>0?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">한 자리에 모인 힘</text>`;
  g+=`<text x="82" y="112" font-size="6.6" fill="${homeN>0?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="800">${homeN>0?(homeN+' 가지 남았어요'):'모두 나눴어요'}</text>`;
  g+=`<rect x="168" y="80" width="140" height="40" rx="7" fill="#fff" stroke="${top>=0?'#C2410C':'#CBD5E0'}" stroke-width="${top>=0?1.8:1.2}"${top>=0?'':' stroke-dasharray="4 3"'}/>`;
  g+=`<text x="238" y="96" font-size="7.4" fill="#9A3412" text-anchor="middle" font-weight="800">판이 가리키는 자리</text>`;
  g+=`<text data-top="${top}" x="238" y="112" font-size="7.6" fill="${top>=0?'#C2410C':'#94A3B8'}" text-anchor="middle" font-weight="800">${top<0?'없어요 — 균형이에요':PW_SLOT[top]}</text>`;
  for(let i=0;i<PW_CASE.length;i++){
    const pd = !!(st.pwPair & (1<<i)), x = 12 + i*100, y = 130;
    g+=`<rect data-case="${i}" data-paired="${pd?1:0}" x="${x}" y="${y}" width="96" height="46" rx="7" fill="${pd?'#fff':'#F8FAFC'}" stroke="${pd?'#C2410C':(pwFelt(st)?'#CBD5E0':'#E2E8F0')}" stroke-width="${pd?1.6:1.1}"${pd?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<text x="${x+48}" y="146" font-size="6.6" fill="${pwFelt(st)?'#9A3412':'#E2E8F0'}" text-anchor="middle" font-weight="800">${pwFelt(st)?PW_CASE_S[i]:'·'}</text>`;
    g+=`<text x="${x+48}" y="164" font-size="6.4" fill="${pd?'#B45309':'#CBD5E0'}" text-anchor="middle" font-weight="800">${pwFelt(st)?(pd?PW_DIR_S[pwDirOf(i)]:'아직 짝짓지 않았어요'):''}</text>`;
  }
  g+=`<rect x="12" y="186" width="296" height="26" rx="7" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.2"/>`;
  g+=`<text x="160" y="203" font-size="7.4" fill="#9A3412" text-anchor="middle" font-weight="800">${fin?'서로 견제하고 균형을 이뤄 국민의 자유와 권리를 보장해요':'견제는 누가 나빠서가 아니라 서로 바로잡으려고 하는 일이에요'}</text>`;
  g+=`<text x="20" y="230" font-size="7.4" fill="#B45309" font-weight="800">나눈 힘 ${giveN} / ${PW_POWER.length} · 되찾은 균형 ${st.pwBal}회 · 짝지은 사례 ${pairN} / ${PW_CASE.length}</text>`;
  g+=`<rect data-given="${giveN}" data-bal="${st.pwBal}" data-pairn="${pairN}" x="14" y="120" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function pwPanel(st){
  const fin = st.pwFin!=null, allG = pwAllGive(st), felt = pwFelt(st);
  const q = fin
    ? '국회·행정부·법원이 국가 권력을 <b>나눠 맡고</b>, 서로를 <b>견제</b>하며 <b>균형</b>을 이뤄 내요.'
    : (pwReady(st) ? '우리나라에서 국가기관의 권력을 <b>분립하는 이유</b>는 무엇일까요?'
      : (felt ? (st.pwOpenP==null ? '사례를 하나 골라 봐요. 어느 것부터 골라도 돼요.'
                                  : '이 사례는 <b>누가 누구를</b> 견제하는 모습일까요?')
        : (allG ? (st.pwLean==null ? '어느 자리도 가장 크지 않아요. 한 자리로 <b>기울여</b> 보면 어떻게 될까요?'
                                   : '기울어진 판을 어떻게 하면 <b>균형</b>으로 되돌릴 수 있을까요?')
          : (st.pwOpen==null ? '힘을 하나 골라 봐요. 어느 것부터 골라도 돼요.'
                             : '이 힘은 <b>어느 자리</b>가 맡아야 할까요?'))));
  let right = `<div class="pw-q">${q}</div>`;

  if(fin){
    right+=`<div class="dw-card"><div class="pt">⚖️ 가리키는 자리가 없는 것이 정상이었어요</div>
      <div>세 가지 힘을 <b>나눠 맡기자</b> 판이 가리키던 자리가 <b>사라졌어요.</b> 한 자리로 기울이면 판이 다시 그 자리를 가리켰지만, 다른 자리들이 <b>견제</b>하자 또 사라졌어요. 어느 자리도 가장 크지 않은 것 — 그것이 <b>균형</b>이에요.</div>
      <div style="margin-top:5px">우리나라에서는 국회, 행정부, 법원이 국가 권력을 나눠 맡도록 <b>헌법으로 정해</b> 놓았어요. 한 국가기관이 나라의 중요한 일을 마음대로 처리할 수 없도록 서로를 견제하고 균형을 이뤄 내며, <b>국민의 자유와 권리를 보장</b>해요.</div>
      <div style="margin-top:5px;color:#64748B">각 국가기관이 서로 견제하는 <b>목적을 쓰고 친구들과 이야기해 보는</b> 활동은 교실에서 하는 활동이에요. 화면이 그 활동을 대신하지 않아요.</div></div>`;
  } else if(pwReady(st)){
    right+=`<div class="pw-fin">${PW_FIN.map((f,k)=>
      `<button class="${st.pwWrongF===k?'no':''}" onclick="pwFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(felt){
    if(st.pwOpenP==null){
      right+=`<div class="dw-step">🔎 사례 고르기 — 누가 누구를 견제할까요?</div>`;
      right+=`<div class="pw-list">${PW_CASE.map((c,i)=>{
        const on = !!(st.pwPair & (1<<i));
        return `<button class="${on?'ok':''}" onclick="pwCase(${i})">${on?'✓ ':''}${c}</button>`;
      }).join('')}</div>`;
    } else {
      right+=`<div class="dw-step">↔️ 이 사례가 보여 주는 견제 방향</div>`;
      right+=`<div class="pw-note">${PW_CASE[st.pwOpenP]}</div>`;
      right+=`<div class="pw-list">${PW_DIR.map((d,k)=>
        `<button class="${st.pwWrongK2===k?'no':''}" onclick="pwPair(${k})">${d}</button>`).join('')}</div>`;
    }
  } else if(allG){
    right+=`<div class="dw-step">⚖️ 기울여 보기 — 이 자리에는 정답이 없어요</div>`;
    right+=`<div class="pw-casenote">세 자리가 힘을 나눠 맡아 <b>어느 자리도 가장 크지 않아요.</b> 한 자리로 기울여 보고, 다른 자리들이 <b>견제</b>하면 어떻게 되는지 봐요. 어느 쪽을 눌러도 판이 옳고 그름을 말하지 않아요.</div>`;
    right+=`<div class="pw-list">${[0,1,2].map(k=>
      `<button ${st.pwLean!=null?'disabled':''} onclick="pwLean(${k})">${PW_SLOT[k]} 쪽으로 기울여요</button>`).join('')}</div>`;
    right+=`<div class="pw-fin"><button class="pw-ask" onclick="pwBalance()">🤝 견제와 균형 — 되돌려요</button></div>`;
  } else {
    if(st.pwOpen==null){
      right+=`<div class="dw-step">🗂️ 힘 고르기</div>`;
      right+=`<div class="pw-list">${PW_POWER.map((p,j)=>{
        const on = !!(st.pwGive & (1<<j));
        return `<button class="${on?'ok':''}" onclick="pwPick(${j})">${on?'✓ ':''}${p}</button>`;
      }).join('')}</div>`;
    } else {
      right+=`<div class="dw-step">🏛️ 이 힘은 어느 자리가 맡을까요</div>`;
      right+=`<div class="pw-note">${PW_POWER[st.pwOpen]}</div>`;
      right+=`<div class="pw-list">${[0,1,2].map(k=>
        `<button class="${st.pwWrongK===k?'no':''}" onclick="pwGive(${k})">${PW_SLOT[k]} — ${PW_DO[k]}</button>`).join('')}</div>`;
    }
  }
  if(st.pwMsg) right+=`<div class="dw-msg${st.pwWarn?' warn':''}">${st.pwMsg}</div>`;

  return `<div class="dw-wrap">

  <div class="ka-grp"><div class="scene-row">${sceneCard('wrap','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--green)">권력 분립</b> — 국가 권력을 국회, 행정부, 법원이 나눠 맡도록 헌법으로 정해 놓은 것이에요.</div></div>
    <div class="sum-item"><span class="n">①</span><div><b style="color:var(--green)">나누는 까닭</b> — 한 국가기관이 나라의 중요한 일을 마음대로 처리할 수 없도록 서로를 견제하고 균형을 이뤄 내기 위해서예요.</div></div>
    <div class="sum-item"><span class="n">②</span><div><b style="color:var(--green)">가장 큰 까닭</b> — 국민의 자유와 권리를 보장하기 위해서예요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">미디어</b>가 무엇인지 알아봐요.</div></div>`});
// 17 정리: 자기 평가 — ★ 주제② 마무리 [얼마나 잘했을까] 원문 3항
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">[얼마나 잘했을까] 주제를 마무리해요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"국회, 행정부, 법원이 하는 일을 설명할 수 있어요",st)}
    ${selfCheck(1,"각 국가기관의 권력을 분립하는 이유를 탐구할 수 있어요",st)}
    ${selfCheck(2,"국가기관의 권력 분립을 이해하고, 국가기관이 하는 일에 관심을 두게 됐어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요. 이번 주제를 모두 마쳤어요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">미디어</b>가 무엇인지 알아보기!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  pwGive:0, pwOpen:null, pwLean:null, pwBal:0, pwPair:0, pwOpenP:null, pwFin:null,
  pwWrongK:null, pwWrongK2:null, pwWrongF:null,
  pwMsg:null, pwWarn:false, pwBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function pwRender(){ main.innerHTML = slides[state.idx].render(state); }
function pwHold(msg){
  state.pwWarn=true; state.pwBusy=true; state.pwMsg=msg;
  playThud(); pwRender();
  setTimeout(()=>{ state.pwBusy=false; state.pwWarn=false; state.pwMsg=null;
    state.pwWrongK=null; state.pwWrongK2=null; state.pwWrongF=null; pwRender(); },1600);
}

/* ① 힘 고르기 — ⚠️ 판정 0(고르는 자리에는 옳고 그름이 없다) · 순서 자유 */
function pwPick(j){
  if(state.pwFin!=null) return;                                        // 가드①
  if(state.pwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(j) || j<0 || j>=PW_POWER.length) return;        // 가드②
  if(state.pwGive & (1<<j)){ pwHold(PW_ALREADY_P); return; }           // 가드④ 판 불변
  state.pwOpen = j; state.pwWarn=false; state.pwMsg=null;
  playBlip(); pwRender();
}

/* ① 힘 맡기기 — 판정 있음. ⚠️ 어긋나도 판은 그대로이고 안내가 알맞은 자리를 짚지 않는다. */
function pwGive(k){
  if(state.pwFin!=null) return;                                        // 가드①
  if(state.pwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=3) return;                      // 가드②
  if(state.pwOpen==null){ pwHold(PW_ORDER_K); return; }                // 순서 — 판 불변
  const j = state.pwOpen;
  if(pwOwnerOf(j)!==k){                                                // 어긋남 — 판 불변
    state.pwWrongK=k; pwHold(PW_WRONG_K); return; }
  state.pwGive |= 1<<j; state.pwOpen=null; state.pwWrongK=null; state.pwWarn=false;
  state.pwMsg = pwAllGive(state)
    ? `<b>「${PW_SLOT[k]}」</b>가 그 힘을 맡아요. 세 가지 힘을 <b>모두</b> 나눠 맡겼어요. 판이 가리키던 자리가 <b>사라졌어요</b> — 어느 자리도 가장 크지 않아요.`
    : `<b>「${PW_SLOT[k]}」</b>가 그 힘을 맡아요.`;
  if(pwAllGive(state)) playChime(); else playBlip();
  pwRender();
}

/* ② 기울여 보기 — ★ 이 함수와 pwBalance가 이 패턴의 핵심 신규성이다.
   ⚠️ 옳고 그름이 없다(정답 상수 부재). 한 자리로 기울이면 `pwTop`이 다시 그 자리를 가리킨다. */
function pwLean(k){
  if(state.pwFin!=null) return;                                        // 가드①
  if(state.pwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=3) return;                      // 가드②
  if(!pwAllGive(state)){ pwHold(PW_ORDER_L); return; }                 // 가드③ 순서 — 판 불변
  if(state.pwLean!=null) return;                                       // 이미 기울어 있음 — 판 불변
  state.pwLean = k;                                                    // ★ 기우는 자리는 여기 한 곳뿐
  state.pwWarn=false; state.pwMsg = PW_LEAN_M;
  playBlip(); pwRender();
}

/* ② 견제와 균형 — ★ 되돌리는 자리. ⚠️ 옳고 그름이 없다 · 인자를 받지 않는다. */
function pwBalance(){
  if(state.pwFin!=null) return;                                        // 가드①
  if(state.pwBusy) return;                                             // 가드⑨
  if(!pwAllGive(state)){ pwHold(PW_ORDER_L); return; }                 // 가드③ 순서 — 판 불변
  if(state.pwLean==null){ pwHold(PW_ORDER_B); return; }                // 가드⑤ 판 불변
  state.pwLean = null;                                                 // ★ 되돌리는 자리는 여기 한 곳뿐
  state.pwBal += 1;                                                    // ★ 늘어나는 자리는 여기 한 곳뿐(단조 증가)
  state.pwWarn=false; state.pwMsg = PW_BAL_M;
  playChime(); pwRender();
}

/* ③ 사례 고르기 — ⚠️ 판정 0 · 순서 자유 */
function pwCase(i){
  if(state.pwFin!=null) return;                                        // 가드①
  if(state.pwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=PW_CASE.length) return;         // 가드②
  if(!pwFelt(state)){ pwHold(PW_ORDER_C); return; }                    // 가드⑥ 순서 — 판 불변
  if(state.pwPair & (1<<i)){ pwHold(PW_ALREADY_C); return; }           // 가드⑦ 판 불변
  state.pwOpenP = i; state.pwWarn=false; state.pwMsg=null;
  playBlip(); pwRender();
}

/* ③ 견제 방향 짝짓기 — 판정 있음. ⚠️ 어긋나도 판은 그대로이고 안내가 알맞은 방향을 짚지 않는다. */
function pwPair(k){
  if(state.pwFin!=null) return;                                        // 가드①
  if(state.pwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=PW_DIR.length) return;          // 가드②
  if(state.pwOpenP==null){ pwHold(PW_ORDER_D); return; }               // 순서 — 판 불변
  const i = state.pwOpenP;
  if(pwDirOf(i)!==k){                                                  // 어긋남 — 판 불변
    state.pwWrongK2=k; pwHold(PW_WRONG_D); return; }
  state.pwPair |= 1<<i; state.pwOpenP=null; state.pwWrongK2=null; state.pwWarn=false;
  state.pwMsg = pwAllPair(state)
    ? `<b>「${PW_DIR_S[k]}」</b>예요. 서로 견제하는 세 모습을 <b>모두</b> 짝지었어요.`
    : `<b>「${PW_DIR_S[k]}」</b>예요.`;
  if(pwAllPair(state)) playChime(); else playBlip();
  pwRender();
}

/* ④ 마무리 — 「국가기관의 권력을 분립하는 이유는 무엇인가요」 */
function pwFinish(k){
  if(state.pwFin!=null) return;                                        // 가드①
  if(state.pwBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=PW_FIN.length) return;          // 가드②
  if(!pwReady(state)) return;                                          // 가드⑧ 순서 — 판 불변
  if(k===PW_FIN_OK){
    state.pwFin=k; state.pwWrongF=null; state.pwMsg=null; state.pwWarn=false;
    playChime(); pwRender(); return;
  }
  state.pwWrongF=k;
  pwHold(PW_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l10 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

K-edu 사회 6-1 · 2단원 민주주의와 시민 참여 · 주제① 민주주의와 선거 · 4차시(l04)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사08-01] · 교과서 p.68~73 · 지도서(대단원2 **5~6차시** 모의 선거를 통해 선거에 참여해 볼까요,
  지도서 p.152~157) 근거 · ★ 주제① 마지막 차시 — 주제 마무리([재미있게 확인해요]·[얼마나 잘했을까])가 함께 붙는다.
학습 목표: 모의 선거를 통해 선거에 참여할 수 있다.
수업 기법 및 전략: 모둠 토의 · 돌아가며 말하기 · 의사 결정하기
⚠️ 엔진은 대단원1 l01~l11 · 대단원2 l01~l03에서 100% 승계. 2단원 색 #C2410C 유지 · CSS 변수명 무수정.

직접조작: 잣대를 세워야 걸러지는 판(50번째 신규 패턴 — 재는 자를 학생이 세우는 형)
  ⭐ 앞의 마흔아홉 종에서 **무엇이 어긋난 것인지는 언제나 판이 이미 알고 있었다.** 학생이 무엇을 하든
     어긋남의 목록은 처음부터 판 안에 있었고 다만 드러나지 않았을 뿐이다 — 47번째(첫 길이 막히는 판)에서도
     막히는 자리는 판이 미리 정해 두었고, 37번째(접어 두는 형)조차 **판정을 미뤘을 뿐** 답은 이미 있었다.
     이번만 **어긋남이 학생이 세운 잣대에서 비로소 생긴다.** 잣대를 하나도 세우지 않으면 판은 여섯 공약
     가운데 어느 것도 어긋났다고 하지 않는다. 그것은 판이 감추는 것이 아니라 **아직 잴 자가 없기 때문**이다.
  ⭐ **판의 거르는 힘이 학생이 세운 잣대에서만 나온다** — 문구가 아니라 **구조**다:
     `evOut(st)` **한 줄**이 걸러진 공약을 다 고르고(세운 잣대가 잡는 것의 합집합),
     `EV_CATCH`를 읽는 자리는 `evCatch(r)` **단 하나**다. 걸러진 공약을 따로 담는 상태가 코드에 아예 없다.
     그래서 「세운 잣대와 걸러진 공약이 어긋나는 판」은 만들어질 수 없다.
  ⭐ **판이 점수를 매기지 않는다** — 교과서 채점표의 1~5점은 학생마다 다르게 매길 수 있는 값이라
     판이 대신 매기지 않는다(정직). 판이 보는 것은 **잣대에 걸리는지 아닌지**뿐이고, 총점도 등수도 없다.
  ⭐ **잣대가 아닌 것을 골라도 아무것도 걸러지지 않는다** — 판은 「틀렸다」고 하지 않고
     그것이 왜 공약을 재는 잣대가 될 수 없는지만 말한다. 감점 0 · 판 불변.
  ⭐ **잣대 셋을 어느 순서로 세워도 걸러지는 셋은 같다**(순서 독립 · 6 순열 전수 대조).
  ⚠️ 44번째(빛과 그늘이 함께 자라는 판)와의 대비 — 거기서는 **한 걸음이 판의 두 자리를 동시에 만들었고**
     그 두 자리는 처음부터 판의 것이었다. 여기서는 **자리를 만드는 것이 아니라 자를 만든다.**
  ① **잣대 세우기 3걸음**(교과서 채점표 원문 3기준 · 잣대가 아닌 것 셋이 섞여 있다)
     → 잣대를 세울 때마다 그 잣대에 걸리는 공약 하나가 판에서 걸러진다.
  ② **[스스로 활동] 나의 한 표**(잣대에 걸리지 않은 셋 가운데 하나 · **판정 0** — 뽑는 사람은 유권자 자신)
  ③ **투표할 때 주의할 점 3택**(지도서 원문)
  ④ 마무리 3택 = 선거 공약을 평가할 때 고려할 점(지도서 정리 원문)
  ⚠️ 공약·잣대·걸림·3택 전량 고정 리터럴 — 난수 0.
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 이미 세운 잣대 재클릭 무시 — 판 불변 / ④ 잣대가 아닌 것 — 판 불변(까닭만 말한다) /
     ⑤ 세 잣대 전 「나의 한 표」 무시(순서) / ⑥ 걸러진 공약에 한 표 무시 — 판 불변 /
     ⑦ 「나의 한 표」 전 주의점 3택 무시(순서) / ⑧ 주의점 전 마무리 무시(순서) /
     ⑨ 안내 표시 중 재클릭 무시(`evBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.ev-q`로 떼어 전 단계 상시 노출. 상태 열쇠 11개.

⚠️ 정직 원칙 네 곳
  ㉠ **화면이 모의 선거를 대신하지 않는다.** 진짜 활동은 교실에서 모둠이 공약을 정하고, 도화지에 선거 벽보를
     만들고, 연설하고, 토론회를 열고, 기표소에서 투표하는 일이다. 조작이 다루는 것은 교과서 [할 수 있어요]
     「선거 공약 평가하기」 — **공약을 재는 잣대를 세우는 일**까지다(완료 카드에 명시).
  ㉡ **채점표의 점수는 두지 않는다.** 1~5점은 사람마다 다르게 매길 수 있어서 판이 대신 매기지 않는다.
  ㉢ **「나의 한 표」에는 정답이 없다.** 교과서가 「뽑고 싶은 후보자와 그 까닭」이라 적었으므로 판이 판정하지
     않고, 총점·등수도 두지 않는다.
  ㉣ **걸러진 세 공약의 까닭은 지도서 원문만 쓰고 지어내지 않는다.**

⚠️ 설계 원칙
  · **주제② 침범 0** — 국회·행정부·법원·권력 분립·헌법·법률 0. 「국가기관」은 차시 예고 자리에서만.
  · **주제③ 침범 0** — 미디어 0(이 차시에는 [미디어 활동]이 없다).
  · **l01~l03 회수만** — 이 차시는 **주제 마무리**라 회수가 정당하다([재미있게 확인해요]·[얼마나 잘했을까]).
    다만 **새 사실 0** — 선거 과정 여섯 걸음 재현 0, 선거 원칙 네 이름 나열 0, 거소 투표·선상 투표 0,
    「민주주의의 꽃」은 주제 마무리 정답 자리에서만.
  · **대단원1 재현 0 · 대단원3 침범 0.**
  · **정치적 중립** — 실제 정당·정치인 이름 0, 실제 선거 결과·연도·득표수·투표율 0, 후보자는 모둠 기호로만.
    「대통령 선거」는 교과서 모의 선거 원문 자리에서만.
  · 교사용 참고 자료 0 — 참고 도서 네 종, 매니페스토 운동, 학교 선거 도우미·사이버 선거 역사관·
    중앙 선거 방송 토론 위원회·정책 공약 마당·선거 관리 위원회 도서관 누리집, 다른 나라 의무 투표제·
    위임 투표·자서식 투표·전자 투표 사례 전부 0.
  · **문항 내 연도·금액·수치 0** · **학생 이름 0.**
  · 정서 — 어떤 정책이 옳다고 못박지 않는다(걸러지는 까닭은 지도서 원문 근거로만). 상대 후보를 깎아내리는
    일을 부추기지 않고, 그것이 잣대가 될 수 없음을 판이 정면으로 말한다. 지지·반대를 유도하지 않는다.

   ⭐ 앞의 마흔아홉 종에서 **무엇이 어긋난 것인지는 언제나 판이 이미 알고 있었다.**
      이번만 **어긋남이 학생이 세운 잣대에서 비로소 생긴다** — 잣대를 세우기 전에는 여섯 공약이
      모두 나란하고, 판은 어느 것도 어긋났다고 하지 않는다. 감추는 것이 아니라 **잴 자가 없는 것**이다.
   ⭐ **거르는 힘이 세운 잣대에서만 나온다** — `evOut(st)` 한 줄이 걸러진 공약을 다 고르고,
      `EV_CATCH`를 읽는 자리는 `evCatch(r)` 단 하나다. 걸러진 공약을 담는 상태가 코드에 없다.
   ⭐ **판이 점수를 매기지 않는다**(정직) — 채점표의 1~5점은 사람마다 다르게 매길 수 있는 값이다.
      판이 보는 것은 잣대에 걸리는지 아닌지뿐이고, 총점도 등수도 없다.
   ⭐ **잣대가 아닌 것을 골라도 아무것도 걸러지지 않는다** — 「틀렸다」는 말 0 · 감점 0 · 판 불변.
   ⚠️ 가드 9종은 파일 머리 주석 참조. 전량 고정 리터럴 — 난수 0. */
const EV_N = 6;
/* 공약 여섯 \u2014 앞 셋은 교과서 68~69쪽 원문, 뒤 셋은 지도서가 「잘못된 공약」으로 든 예시 원문 근거 */
const EV_PL = [
  '근무 시간을 자유롭게 하고, 육아 휴직 제도를 확대 시행하여 저출산 문제를 해결하겠습니다.',
  '태양 에너지를 활용하고, 일회용품 사용 관련 법을 개정하여 기후 위기에 대처하겠습니다.',
  '사이버 범죄로부터 안전한 환경을 만들고, 범죄를 예방하고 처벌을 강화하여 안전한 나라를 만들겠습니다.',
  '환경 보호를 위해 힘쓰겠습니다.',
  '모든 국민에게 똑같이 큰돈을 나누어 주겠습니다.',
  '집값을 올려 주겠습니다.'
];
/* 판에 적히는 짧은이름 \u2014 앞 셋은 교과서 선거 벽보 문구 원문 */
const EV_PL_S = ['저출산 문제를 해결하겠습니다','기후 위기에 대처하겠습니다','안전한 나라를 만들겠습니다',
                 '환경 보호를 위해 힘쓰겠습니다','모든 국민에게 큰돈을 드리겠습니다','집값을 올려 드리겠습니다'];
/* 잣대 후보 여섯 \u2014 앞 셋은 교과서 70쪽 선거 공약 채점표의 평가 내용 원문, 뒤 셋은 잣대가 될 수 없는 것 */
const EV_RULE = ['공약이 구체적이다','실천할 수 있는 공약이다','공약이 국민의 요구를 반영하고 있다',
                 '후보자가 목소리가 크고 말을 잘한다','상대 후보자를 세게 깎아내린다','우리 모둠이 낸 공약이다'];
/* ⚠️ 이 한 줄이 판의 거르는 힘을 통째로 정한다 \u2014 판에는 「어긋난 공약 목록」이 따로 없다.
   길이가 곧 「잣대가 되는 것」의 수이기도 하다(뒤 셋은 잣대가 아니라 아무것도 거르지 못한다). */
const EV_CATCH = [3, 4, 5];
/* 걸린 까닭 \u2014 지도서 원문 근거만 쓰고 지어내지 않는다 */
const EV_WHY = [
  '구체적인 내용 없이 <b>\u300C환경 보호를 위해 힘쓰겠다\u300D라고만</b> 했어요. 무엇을 언제까지 어떻게 할지가 없어요.',
  '나라에서 걷을 수 있는 <b>세금은 한정되어 있어서</b> 실천하기 어려워요.',
  '<b>모든 국민이 집값을 올려 주는 것을 원하는 것은 아니에요.</b>'
];
/* 잣대가 아닌 것 \u2014 안내에 알맞은 잣대 원문도, 걸러질 공약 원문도 들어 있지 않다 */
const EV_NOT = [
  '그건 <b>공약을 보는 잣대가 아니에요.</b> 후보자가 말을 잘하는지가 아니라, 내놓은 공약이 어떤지를 재는 것만 잣대가 돼요.',
  '선거 운동에서는 <b>상대 후보자를 비방하지 않아요.</b> 깎아내리는 일은 잣대가 될 수 없어요.',
  '누가 낸 공약인지는 <b>공정한 잣대가 아니에요.</b> 어느 모둠의 공약이든 같은 잣대로 재야 해요.'
];
/* ③ 투표할 때 주의할 점 \u2014 지도서 원문 */
const EV_CARE = [
  '어느 후보자를 뽑을지 친구들과 함께 정해서 똑같이 투표해요',
  '후보자의 공약을 꼼꼼히 살펴보고, 한 후보자에게만 투표해요',
  '마음에 드는 후보자가 여럿이면 여러 후보자에게 투표해요'
];
const EV_CARE_OK = 1;
const EV_CARE_NO = [
  '어느 후보자에게 투표했는지는 <b>말하지 않아요.</b> 투표는 스스로 정하는 일이에요.',
  '',
  '여러 후보자에게 투표하면 <b>내 표가 무효 처리</b>돼요. 한 후보자에게만 투표해요.'
];
/* ④ 마무리 \u2014 선거 공약을 평가할 때 고려할 점(지도서 정리 원문) */
const EV_FIN = [
  '공약을 낸 후보자의 목소리가 큰지 살펴봐요',
  '공약이 구체적이고 실천할 수 있는지 검토하고, 국민의 요구를 반영하고 있는지 확인해요',
  '공약의 수가 많을수록 좋은 공약이라고 봐요'
];
const EV_FIN_OK = 1;
const EV_FIN_NO = [
  '목소리가 아니라 <b>공약</b>을 봐요. 판에서 세운 잣대를 떠올려 봐요.',
  '',
  '수가 많다고 좋은 공약은 아니에요. <b>무엇을 언제까지 어떻게</b> 할지를 봐요.'
];
/* 안내 \u2014 어느 문구에도 「틀렸다」는 말이 없다 */
const EV_ALREADY = '그 잣대는 <b>이미 세웠어요.</b> 판은 그대로예요.';
const EV_ORDER_V = '먼저 <b>잣대 셋</b>을 모두 세워 봐요.';
const EV_OUTVOTE = '그 공약은 <b>잣대에 걸렸어요.</b> 잣대에 걸리지 않은 공약 가운데에서 골라요.';
/* 받침 처리 \u2014 안내문에 「을(를)」 병기가 남지 않게 한다 */
function evJ(s){ const c=s.charCodeAt(s.length-1); return (c>=0xAC00&&c<=0xD7A3) ? ((c-0xAC00)%28!==0) : false; }

/* ★ EV_CATCH를 읽는 자리는 여기 한 곳뿐이다. */
function evCatch(r){ return EV_CATCH[r]; }
/* ★ 이 한 줄이 이 패턴의 핵심 신규성이다 \u2014 걸러진 공약을 따로 담는 상태가 없고,
   걸러진 것은 언제나 **세운 잣대에서 그대로 읽힌다.** */
function evOut(st){ let m=0; st.evSet.forEach(r=>{ m |= 1<<evCatch(r); }); return m; }
function evIsRule(r){ return Number.isInteger(r) && r>=0 && r<EV_CATCH.length; }
function evOutList(st){ const m=evOut(st), r=[]; for(let k=0;k<EV_N;k++){ if(m & (1<<k)) r.push(k); } return r; }
function evLeftList(st){ const m=evOut(st), r=[]; for(let k=0;k<EV_N;k++){ if(!(m & (1<<k))) r.push(k); } return r; }
function evAllRules(st){ return st.evSet.length>=EV_CATCH.length; }

/* 판 \u2014 위는 채점표 세 줄(세운 잣대만 적힌다), 아래는 공약 여섯 장.
   ⚠️ 공약 칸을 그리는 자리는 **여기 한 곳뿐**이고, 걸러졌는지는 `evOut`이 정한다. */
function evCanvas(st){
  const m = evOut(st), outs = evOutList(st), left = evLeftList(st), all = evAllRules(st);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>`;
  const head = st.evFin!=null ? '잣대를 세워 공약을 살펴봤어요'
    : (st.evVote!=null ? '나의 한 표를 놓았어요'
      : (all ? '잣대 셋이 섰어요 \u2014 남은 공약 가운데 한 표를 놓아 봐요'
        : '잣대를 세우면 그 잣대에 걸리는 공약이 걸러져요'));
  g+=`<text x="160" y="21" font-size="10.4" fill="#9A3412" text-anchor="middle" font-weight="800">${head}</text>`;
  g+=`<text x="20" y="37" font-size="8.6" fill="#B45309" font-weight="800">선거 공약 채점표 \u2014 평가 내용 ${st.evSet.length} / ${EV_CATCH.length}</text>`;
  for(let j=0;j<EV_CATCH.length;j++){
    const set = j < st.evSet.length, y = 42 + j*26;
    g+=`<rect data-slot="${j}" data-set="${set?1:0}" x="14" y="${y}" width="292" height="22" rx="6" fill="${set?'#fff':'#F8FAFC'}" stroke="${set?'#C2410C':'#CBD5E0'}" stroke-width="${set?1.6:1.2}"${set?'':' stroke-dasharray="4 3"'}/>`;
    g+=`<circle cx="${27}" cy="${y+11}" r="7" fill="${set?'#FFEDD5':'#EEF2F6'}" stroke="${set?'#EA580C':'#CBD5E0'}" stroke-width="1.2"/>`;
    g+=`<text x="27" y="${y+14.2}" font-size="7.4" fill="${set?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${j+1}</text>`;
    g+=`<text x="168" y="${y+14.6}" font-size="8.4" fill="${set?'#9A3412':'#94A3B8'}" text-anchor="middle" font-weight="800">${set?EV_RULE[st.evSet[j]]:'아직 세우지 않았어요'}</text>`;
  }
  g+=`<text x="20" y="134" font-size="8.6" fill="#B45309" font-weight="800">공약 \u2014 걸러지지 않고 남은 것 ${left.length} / ${EV_N}</text>`;
  for(let k=0;k<EV_N;k++){
    const out = outs.indexOf(k)>=0, voted = st.evVote===k;
    const x = 14 + (k%2)*148, y = 140 + Math.floor(k/2)*34;
    g+=`<rect data-pl="${k}" data-out="${out?1:0}" data-vote="${voted?1:0}" x="${x}" y="${y}" width="144" height="30" rx="7" fill="${out?'#F1F5F9':(voted?'#FFEDD5':'#fff')}" stroke="${out?'#CBD5E0':(voted?'#B45309':'#EA580C')}" stroke-width="${voted?1.8:1.3}"${out?' stroke-dasharray="4 3"':''}/>`;
    const t = EV_PL_S[k];
    g+=`<text x="${x+72}" y="${y+13.4}" font-size="${t.length>14?6.6:7.2}" fill="${out?'#94A3B8':'#9A3412'}" text-anchor="middle" font-weight="800">${t}</text>`;
    if(out){
      const by = st.evSet.find(r=>evCatch(r)===k);
      g+=`<text x="${x+72}" y="${y+24}" font-size="6.4" fill="#94A3B8" text-anchor="middle" font-weight="700">\u300C${EV_RULE[by]}\u300D 잣대에 걸렸어요</text>`;
    } else if(voted){
      g+=`<text x="${x+72}" y="${y+24}" font-size="6.6" fill="#B45309" text-anchor="middle" font-weight="800">\u2714 나의 한 표</text>`;
    } else {
      g+=`<text x="${x+72}" y="${y+24}" font-size="6.4" fill="#CBD5E0" text-anchor="middle" font-weight="700">${all?'남았어요':'아직 재지 않았어요'}</text>`;
    }
  }
  g+=`<rect data-setn="${st.evSet.length}" data-outn="${outs.length}" data-leftn="${left.length}" x="14" y="140" width="0" height="0" fill="none"/>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function evPanel(st){
  const done = st.evFin!=null, all = evAllRules(st), voted = st.evVote!=null, cared = st.evCare!=null;
  const left = evLeftList(st);
  const q = done
    ? '공약을 재는 잣대는 후보자가 누구인지가 아니라 <b>공약이 어떤지</b>를 봐요.'
    : (cared ? '<b>선거 공약을 평가할 때</b>는 어떤 점을 고려해야 할까요?'
      : (voted ? '<b>투표할 때 주의할 점</b>은 무엇일까요?'
        : (all ? '잣대에 걸리지 않은 공약 가운데 <b>나의 한 표</b>를 놓아 봐요. 이 자리에는 정답이 없어요.'
          : '<b>공약을 재는 잣대</b>를 세워 봐요. 잣대를 세우면 그 잣대에 걸리는 공약이 걸러져요.')));
  let right = `<div class="ev-q">${q}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">\uD83D\uDCCF 무엇이 어긋난 것인지는 누가 정했나요</div>
      <div>처음에는 여섯 공약이 모두 나란했어요. 판이 감춘 것이 아니라 <b>아직 잴 자가 없었기 때문</b>이에요.</div>
      <div style="margin-top:5px">잣대를 세우자 비로소 걸리는 공약이 생겼어요. <b>거르는 힘은 여러분이 세운 잣대에서 나왔어요.</b></div>
      <div style="margin-top:5px;color:#64748B">진짜 모의 선거는 교실에서 해요 \u2014 모둠이 공약을 정하고, 도화지에 선거 벽보를 만들고,
      연설하고 토론회를 열고, 기표소에서 투표해요. 판이 다룬 자리는 그 가운데 <b>공약 평가하기</b> 한 걸음이에요.</div></div>`;
  } else if(cared){
    right+=`<div class="ev-fin">${EV_FIN.map((f,k)=>
      `<button class="${st.evWrongF===k?'no':''}" onclick="evFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(voted){
    right+=`<div class="dw-step">\uD83D\uDDF3\uFE0F 투표하기</div>`;
    right+=`<div class="ev-fin">${EV_CARE.map((s,k)=>
      `<button class="${st.evWrongC===k?'no':''}" onclick="evPickCare(${k})">${s}</button>`).join('')}</div>`;
  } else if(all){
    right+=`<div class="dw-step">\uD83D\uDDF3\uFE0F 스스로 활동 \u2014 나의 한 표</div>`;
    right+=`<div class="ev-note">잣대에 걸리지 않았다고 해서 판이 뽑아 주지는 않아요. <b>뽑는 사람은 유권자인 여러분</b>이에요.</div>`;
    right+=`<div class="ev-fin">${left.map(k=>
      `<button class="${st.evWrongV===k?'no':''}" onclick="evVoteFor(${k})">${EV_PL_S[k]}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">\uD83D\uDCCF 할 수 있어요 \u2014 선거 공약 채점표 만들기</div>`;
    right+=`<div class="ev-list">${EV_RULE.map((r,i)=>{
      const on = st.evSet.indexOf(i)>=0;
      return `<button class="${on?'ok':''}${st.evWrongR===i?' no':''}" onclick="evPut(${i})">${on?'\u2713 ':''}${r}</button>`;
    }).join('')}</div>`;
  }
  if(st.evMsg) right+=`<div class="dw-msg${st.evWarn?' warn':''}">${st.evMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCCF 세운 잣대만큼만 판이 재요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${evCanvas(st)}<div class="cvcap">판은 점수를 매기지 않아요. 잣대에 걸리는지 아닌지만 봐요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">국가기관</b>!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u2_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  evSet:[], evVote:null, evCare:null, evFin:null,
  evWrongR:null, evWrongV:null, evWrongC:null, evWrongF:null,
  evMsg:null, evWarn:false, evBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function evRender(){ main.innerHTML = slides[state.idx].render(state); }
function evHold(msg){
  state.evWarn=true; state.evBusy=true; state.evMsg=msg;
  playThud(); evRender();
  setTimeout(()=>{ state.evBusy=false; state.evWarn=false; state.evMsg=null;
    state.evWrongR=null; state.evWrongV=null; state.evWrongC=null; state.evWrongF=null; evRender(); },1600);
}

/* ① 잣대 세우기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   판에는 「어긋난 공약 목록」이 없다. 무엇이 걸리는지는 **세운 잣대**가 정한다.
   ⚠️ 잣대가 아닌 것을 골라도 벌이 없다 — 감점 0 · 「틀렸다」는 말 0 · 판 불변. */
function evPut(r){
  if(state.evFin!=null) return;                                        // 가드①
  if(state.evBusy) return;                                             // 가드⑨
  if(!Number.isInteger(r) || r<0 || r>=EV_RULE.length) return;         // 가드②
  if(state.evSet.indexOf(r)>=0){                                       // 가드③ 이미 세운 잣대 — 판 불변
    state.evWrongR=r; evHold(EV_ALREADY); return; }
  if(!evIsRule(r)){                                                    // 가드④ 잣대가 아님 — 판 불변
    state.evWrongR=r; evHold(EV_NOT[r-EV_CATCH.length]); return; }
  state.evSet.push(r); state.evWrongR=null; state.evWarn=false;
  const k = evCatch(r), pjo = evJ(EV_PL_S[k]) ? '\uC774' : '\uAC00';
  state.evMsg = evAllRules(state)
    ? `\u300C${EV_RULE[r]}\u300D 잣대에 <b>\u300C${EV_PL_S[k]}\u300D</b>${pjo} 걸렸어요 \u2014 ${EV_WHY[r]} 잣대 셋이 <b>모두</b> 섰어요.`
    : `\u300C${EV_RULE[r]}\u300D 잣대를 세웠어요. 이 잣대에 <b>\u300C${EV_PL_S[k]}\u300D</b>${pjo} 걸렸어요 \u2014 ${EV_WHY[r]}`;
  if(evAllRules(state)) playChime(); else playBlip();
  evRender();
}

/* ② [스스로 활동] 나의 한 표 — ⚠️ 판정 0. 뽑는 사람은 유권자 자신이다. */
function evVoteFor(k){
  if(state.evFin!=null) return;                                        // 가드①
  if(state.evBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=EV_N) return;                   // 가드②
  if(!evAllRules(state)){ state.evWrongV=k; evHold(EV_ORDER_V); return; }  // 가드⑤ 순서
  if(state.evVote!=null) return;
  if(evOut(state) & (1<<k)){                                           // 가드⑥ 걸러진 공약 — 판 불변
    state.evWrongV=k; evHold(EV_OUTVOTE); return; }
  state.evVote=k; state.evWrongV=null; state.evWarn=false;
  state.evMsg = `<b>\u300C${EV_PL_S[k]}\u300D</b>에 한 표를 놓았어요. 이 자리에는 <b>정답이 없어요</b> \u2014 잣대에 걸리지 않은 공약 가운데 무엇을 고를지는 유권자인 여러분이 정해요.`;
  playChime(); evRender();
}

/* ③ 투표할 때 주의할 점 */
function evPickCare(k){
  if(state.evFin!=null) return;                                        // 가드①
  if(state.evBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=EV_CARE.length) return;         // 가드②
  if(state.evVote==null) return;                                       // 가드⑦ 한 표 전 무시(순서)
  if(state.evCare!=null) return;
  if(k===EV_CARE_OK){
    state.evCare=k; state.evWrongC=null; state.evWarn=false;
    state.evMsg = '공약을 <b>꼼꼼히 살펴보고</b>, <b>한 후보자에게만</b> 투표해요.';
    playChime(); evRender(); return;
  }
  state.evWrongC=k;
  evHold(EV_CARE_NO[k]);
}

/* ④ 마무리 — 「선거 공약을 평가할 때 고려할 점」 */
function evFinish(k){
  if(state.evFin!=null) return;                                        // 가드①
  if(state.evBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=EV_FIN.length) return;          // 가드②
  if(state.evCare==null) return;                                       // 가드⑧ 주의점 전 무시(순서)
  if(k===EV_FIN_OK){
    state.evFin=k; state.evWrongF=null; state.evMsg=null; state.evWarn=false;
    playChime(); evRender(); return;
  }
  state.evWrongF=k;
  evHold(EV_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l05_나랏일.html'; } // l05 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

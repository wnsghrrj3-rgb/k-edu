직접조작: 되돌아온 요구가 판을 키우는 판(42번째 신규 패턴 — 밀어낼수록 커지는 형)
  ⭐ 앞의 마흔한 종에서 **판이 되돌린 자리는 언제나 판이 그대로였다.**
     카드가 되돌아오면 판은 불변이었고, 어긋난 걸음은 판을 한 칸도 바꾸지 못했고,
     막힌 길을 골라도 바깥 칸은 하나도 채워지지 않았다 — **되돌림은 언제나 아무 일도 아니었다.**
     이번만 **되돌림 자체가 판을 키운다.** 요구가 되돌아올 때마다 광장이 한 줄씩 자란다.
     까닭은 교과서 본문이 그렇게 적었기 때문이다 —
     「정부는 직선제 요구를 받아들이지 않고 간선제를 유지하겠다고 발표했습니다.
      **이후 시위가 더욱 번졌고**」.
  ⭐ **그리고 같은 단추를 같은 방법으로 눌러도, 광장이 자란 뒤에는 결과가 달라진다.**
     앞의 마흔한 종에서 어떤 자리의 옳고 그름은 **그 자리 자체로 정해져** 있었다 —
     같은 것을 언제 눌러도 같은 답이 돌아왔다.
     (l04의 「층이 물린 판」조차 앞선 선택이 **후보**를 바꾼 것이지,
      같은 자리의 결과가 걸음에 따라 달라진 것은 아니었다.)
     여기서만 **같은 단추가 세 번은 되돌아오고 네 번째에 받아들여진다.**
     학생이 한 일은 조금도 달라지지 않았다 — 달라진 것은 **광장의 크기**뿐이다.
     ⚠️ 단추의 글자도 걸음마다 같다(스모크가 네 걸음 전수로 대조).
  ⭐ **되돌림에는 정오 표시도 감점도 0이다.** 거절은 틀린 일이 아니라 그때 실제로 일어난 일이다.
     그래서 되돌림은 **경고 경로(`sqHold`)를 타지 않는다**(스모크가 구조로 대조).
  ⭐ **요구는 한 번도 달라지지 않는다.** 처음에 세운 요구가 끝까지 그대로 판 아래에 적혀 있고,
     확정한 뒤에는 바꿀 수 없다(가드④). 달라지는 것은 요구가 아니라 **함께 선 사람의 수**다.
  ⭐ 마무리를 확정하면 **광장에 모였던 줄이 투표소의 줄로 바뀐다** —
     교과서 [스스로 활동]의 제13대 대통령 선거 기사 「높은 열기 줄 이은 주권 행렬」이 그 자리다.
     거리에서 외치던 요구가 **투표소의 줄**이 되었다.
  ① 요구 세우기 3택 → 정답 = 「대통령 직선제 개헌」(교과서 본문 원문 · 정답 자리 2)
  ② 「요구해요」 4걸음 — 같은 단추. 1~3회는 되돌아오고 그때마다 광장이 한 줄 자란다.
     네 번째에 문이 열린다(전국 곳곳으로 번진 뒤).
  ③ 6월 민주 항쟁으로 달라진 모습 3칸 놓기(순서 자유 · 셋 다 교과서 원문이라 판정 0)
  ④ 마무리 3택 = [스스로 활동] 발문 「선거에서 이런 현상이 나타난 까닭은?」
     → 확정하면 **광장의 줄이 투표소의 줄로 바뀐다**
  ⚠️ 요구·일지·달라진 모습·마무리 전량 고정 리터럴 — 난수 0.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 요구·모습·마무리 번호(`Number.isInteger`) /

     ⑤ 문이 열린 뒤 「요구해요」 재클릭 무시 / ⑥ 문이 열리기 전 달라진 모습 무시(순서) /
     ⑦ 세 칸을 다 놓기 전 마무리 무시(순서) · 이미 놓인 칸 재선택 판 불변 /
     ⑧ 안내 표시 중 재클릭 무시(`sqBusy`).

지도서 근거(9차시 p.80~85):
  [동기 유발] 세 장의 사진에 관해 이야기해 봅시다.
    → 박종철의 영정을 들고 많은 학생이 추모하는 것으로 보아 죽음에 문제가 있었던 것 같습니다 /
      '직선제로 민주 정부'라는 글이 있는 것으로 보아 당시 시민들이 직선제를 원했던 것 같습니다.
  [본문] 5·18 민주화 운동을 진압한 전두환은 간선제로 대통령이 됐습니다.
    이후 전두환 정부는 언론을 통제하고 민주화 운동을 탄압했습니다.
    1987년 민주화 운동에 참여했던 대학생 박종철이 경찰의 고문으로 사망하는 사건이 일어나자,
    시민들은 직선제 개헌 등을 요구하며 시위를 벌였습니다.
    그러나 정부는 직선제 요구를 받아들이지 않고 간선제를 유지하겠다고 발표했습니다.
    이후 시위가 더욱 번졌고, 그 과정에서 대학생 이한열이 경찰이 쏜 최루탄에 맞아 크게 다쳤습니다.
    이를 계기로 1987년 6월, 정부의 독재에 반대하고 대통령 직선제를 요구하는 시위가
    전국에서 일어났습니다(6월 민주 항쟁).
    결국 정부는 대통령 직선제를 포함한 국민의 민주화 요구를 받아들였습니다.
  [낱말] 간선제 = 일정 수의 선거인단이 대표를 뽑는 선거 제도.
    직선제 = 국민이 직접 대표를 뽑는 선거 제도. / 개헌 = 헌법을 고침.
    주권 = 국가의 중요한 일을 결정하는 권리.
  [스스로 활동 ①] 6월 민주 항쟁 당시의 상황 일지를 보고, 내가 그곳에 있었을 때의 모습을
    상상하며 빈칸에 알맞은 말을 써 봅시다.
    상황 일지 — 17:00 시위대 성당 진입: 성당 진입 경사로를 중심으로 시민, 학생들이 집결하여
      경찰과 대치 시작 / 20:00 경찰과 대치 중: 시위대가 더 늘어남 /
      21:30 방어벽 설치: 늘어난 시민과 학생들이 횃불을 들고 구호를 외침.
    사진 캡션 = 명동 성당에서 시위를 벌이는 시민들(1987년).
    발문 = 무엇을 봤을까? 무엇을 들었을까? 어떤 냄새를 맡았을까? 무슨 생각을 하고 있었을까? 무슨 말을 했을까?
    예시 답안 = 많은 시민과 학생이 경찰과 맞서고 있었을 것 같다 /
      직선제를 시행하자는 시민들의 구호를 들었을 것 같다 /
      정부에서 국민의 요구를 받아들여 시위가 끝나기를 바랐을 것 같다 / 민주주의 회복이라고 외쳤을 것 같다.
    활동 의도 = 내가 당시 시위에 참여한 학생이라고 생각하고 사료를 통해 체험해 보는 활동이다.
  [스스로 활동 ②] 6월 민주 항쟁 이후 치른 선거에서 아래와 같은 현상이 나타난 까닭을 써 봅시다.
    기사 제목 = 높은 열기 줄 이은 주권 행렬.
    예시 답안 = 국민이 직접 대통령을 선출하는 직선제가 이루어졌기 때문에
      많은 사람이 줄지어 선거에 참여했다.
    활동 의도 = 국민의 열망을 담아 직선제로 치러진 선거를 살펴보고 선거권의 중요성을 알게 하는 활동이다.
  [본문] 6월 민주 항쟁은 우리 사회의 여러 분야에 민주적인 제도가 만들어지는 데 큰 역할을 했습니다.
    대통령 직선제, 지방 자치제 등이 자리 잡으면서 시민의 영향력이 커졌고,
    민주주의가 더욱 발전하게 됐습니다.
  [달라진 모습 3종 원문] 1987년 대통령 선거를 시작으로 오늘날까지 직선제가 시행되고 있습니다(대통령 직선제 시행) /
    지역 주민이 뽑은 대표가 그 지역의 일을 처리하는 지방 자치제가 다시 시행됐습니다(지방 자치제 시행) /
    시민들이 다양한 시민 단체를 만들어 사회문제를 해결하는 데 참여합니다(시민 참여 확대).
  [핵심 질문] 6월 민주 항쟁으로 무엇이 바뀌었나요? → 위 3종.
    6월 민주 항쟁이 우리나라 민주주의에 끼친 영향은 무엇인가요?
    → 우리 사회의 여러 분야에 민주적인 제도가 만들어지는 데 큰 역할을 했습니다 /
      시민의 힘으로 민주주의를 지켜낼 수 있다는 자신감과 희망을 주었습니다.
  [꼭 기억해요] 1 1987년 6월, 정부의 독재에 반대하고 대통령 직선제를 요구하는 6월 민주 항쟁이 일어났습니다.
    2 6월 민주 항쟁 이후 대통령 직선제, 지방 자치제 등이 다시 시행됐습니다. (○)
  [9차시 주요 내용 정리] 1. 원인: 전두환 정부의 독재와 민주화 요구 탄압 /
    2. 전개 과정 ① 대학생 박종철이 고문으로 사망함 ② 직선제 개헌을 요구하는 시위가 일어남
      ③ 정부는 직선제 개헌을 거부함 ④ 정부의 독재 반대와 직선제를 요구하는 시위가 전국으로 퍼짐 /
    3. 결과: 대통령 직선제, 지방 자치제 등 시행.
  [정리] 차시 예고 = 우리나라 산업의 발달 과정 알아보기.

const SQ_CHG = [                                  // 교과서 본문 원문 — 달라진 모습 3종
  '1987년 대통령 선거를 시작으로 오늘날까지 직선제가 시행되고 있어요',
  '지역 주민이 뽑은 대표가 그 지역의 일을 처리하는 지방 자치제가 다시 시행됐어요',
  '시민들이 다양한 시민 단체를 만들어 사회문제를 해결하는 데 참여해요'
];
const SQ_CHG_S = ['대통령 직선제 시행','지방 자치제 시행','시민 참여 확대'];   // 교과서 도식 원문

const SQ_FIN = [                                  // [스스로 활동] 발문 — 줄지어 선거에 참여한 까닭
  '국민이 직접 대통령을 뽑는 직선제가 이루어졌기 때문이에요',
  '선거를 하지 않으면 벌을 받게 되었기 때문이에요',
  '투표소가 예전보다 훨씬 가까워졌기 때문이에요'
];
const SQ_FIN_OK = 0;                              // 지도서 예시 답안 원문

/* ⚠️ 광장을 따로 담는 배열은 두지 않는다 — 한 숫자 `sqStep`이 광장을 다 그린다.
   ⚠️ 문이 열리는 조건은 `sqStep`이 다 찼다는 것 하나뿐이다(코드에 단 한 자리). */
function sqOpened(st){ return st.sqStep >= SQ_CROWD.length; }
function sqHasChg(st,j){ return ((st.sqChg>>j)&1)===1; }
function sqCountChg(st){ let n=0; for(let j=0;j<SQ_CHG.length;j++) if(sqHasChg(st,j)) n++; return n; }
function sqAllChg(st){ return sqCountChg(st)===SQ_CHG.length; }
function sqVoted(st){ return st.sqFin!=null; }              // ★ 줄이 투표소의 줄로 바뀌는 유일한 조건

/* 판 — 왼쪽이 광장(아래에서 위로 자란다), 오른쪽 위가 정부의 문, 그 아래가 달라진 모습.
   ⚠️ 아직 자라지 않은 자리에는 글자를 두지 않는다(미리 흘리지 않는다). */
function sqCanvas(st){
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>`;
  const head = sqVoted(st)
    ? '광장의 줄이 투표소의 줄이 되었어요'
    : (sqOpened(st) ? '전국으로 번지자 문이 열렸어요'
      : (st.sqCry!=null ? `광장 ${st.sqStep} / ${SQ_CROWD.length} · 문은 아직 닫혀 있어요`
        : '먼저 무엇을 요구할지 세워 봐요'));
  g+=`<text x="160" y="22" font-size="10.4" fill="#1E3A8A" text-anchor="middle" font-weight="800">${head}</text>`;
  g+=`<text x="79" y="40" font-size="9.2" fill="#1E3A8A" text-anchor="middle" font-weight="800">${sqVoted(st)?'투표소':'광장'}</text>`;
  g+=`<text x="242" y="40" font-size="9.2" fill="#64748B" text-anchor="middle" font-weight="800">정부</text>`;
  /* 광장 — 아래에서 위로 자란다. 마무리를 확정하면 투표소의 줄로 바뀐다. */
  const rows = sqVoted(st) ? SQ_VOTE : SQ_CROWD;
  for(let i=0;i<SQ_CROWD.length;i++){
    const y = 190 - i*44;
    if(st.sqStep<=i){
      g+=`<rect x="12" y="${y}" width="134" height="34" rx="7" fill="#fff" stroke="#CBD5E0" stroke-width="1.3" stroke-dasharray="4 3"/>`;
      continue;
    }
    const fill = sqVoted(st) ? '#DCFCE7' : '#DBEAFE', line = sqVoted(st) ? '#16A34A' : '#1D4ED8';
    const ink  = sqVoted(st) ? '#166534' : '#1E3A8A';
    g+=`<rect data-row="${i}" x="12" y="${y}" width="134" height="34" rx="7" fill="${fill}" stroke="${line}" stroke-width="1.6"/>`;
    g+=`<text x="22" y="${y+13}" font-size="7.4" fill="#64748B" font-weight="800">${sqVoted(st)?'':SQ_TIME[i]}</text>`;
    g+=`<text x="79" y="${y+26}" font-size="8.2" fill="${ink}" text-anchor="middle" font-weight="800">${rows[i]}</text>`;
  }
  /* 정부의 문 — 닫혀 있는 동안에는 되돌아오는 화살표만, 열리면 앞으로 가는 화살표. */
  const opened = sqOpened(st);
  g+=`<rect data-door="${opened?'open':'shut'}" x="176" y="48" width="132" height="46" rx="8"
      fill="${opened?'#DCFCE7':'#fff'}" stroke="${opened?'#16A34A':'#B45309'}" stroke-width="1.8"
      ${opened?'':'stroke-dasharray="7 4"'}/>`;
  g+=`<text x="242" y="76" font-size="8.6" fill="${opened?'#166534':'#92400E'}" text-anchor="middle" font-weight="800">${opened?SQ_OPEN:SQ_SHUT}</text>`;
  if(st.sqCry!=null && !opened){
    g+=`<path data-back="1" d="M172 110 L152 110" stroke="#B45309" stroke-width="1.8" stroke-dasharray="5 3"/>`;
    g+=`<path d="M156 106 L146 110 L156 114 Z" fill="#B45309"/>`;
    g+=`<text x="242" y="112" font-size="7.4" fill="#92400E" text-anchor="middle" font-weight="800">요구가 되돌아와요</text>`;
  }
  if(opened){
    g+=`<path data-through="1" d="M150 110 L170 110" stroke="#16A34A" stroke-width="1.8"/>`;
    g+=`<path d="M166 106 L176 110 L166 114 Z" fill="#16A34A"/>`;
  }
  /* 달라진 모습 — 문이 열린 뒤에만 자리가 생긴다. */
  for(let j=0;j<SQ_CHG.length;j++){
    const y = 124 + j*38;
    if(!opened || !sqHasChg(st,j)){
      g+=`<rect x="176" y="${y}" width="132" height="30" rx="7" fill="${opened?'#fff':'#F8FAFC'}" stroke="${opened?'#CBD5E0':'#E2E8F0'}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      continue;
    }
    g+=`<rect data-chg="${j}" x="176" y="${y}" width="132" height="30" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>`;
    g+=`<text x="242" y="${y+19}" font-size="8.2" fill="#166534" text-anchor="middle" font-weight="800">${SQ_CHG_S[j]}</text>`;
  }
  /* 요구 띠 — 확정한 뒤 끝까지 달라지지 않는다. */
  if(st.sqCry!=null){
    g+=`<rect data-cry="1" x="12" y="212" width="296" height="26" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.4"/>`;
    g+=`<text x="160" y="229" font-size="8.6" fill="#1E3A8A" text-anchor="middle" font-weight="800">우리의 요구 — ${SQ_CRY_S}</text>`;
  } else {
    g+=`<rect x="12" y="212" width="296" height="26" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function sqPanel(st){
  const done = st.sqFin!=null, opened = sqOpened(st), allChg = sqAllChg(st);
  const q = done
    ? '거리에서 외치던 요구가 투표소의 줄이 되었어요.'
    : (allChg ? '선거에서 이런 현상이 나타난 까닭은 무엇일까요?'
      : (opened ? '6월 민주 항쟁으로 무엇이 바뀌었나요?'
        : (st.sqCry!=null ? '요구가 되돌아올 때 <b>광장</b>은 어떻게 되는지 살펴봐요.'
          : '시민들은 무엇을 요구했나요?')));
  let right = `<div class="sq-q">${q}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">\uD83D\uDDF3\uFE0F 광장의 줄이 투표소의 줄이 되었어요</div>
      <div><b>국민이 직접 대통령을 뽑는 직선제</b>가 이루어졌기 때문에 많은 사람이 줄지어 선거에 참여했어요.
      대통령 직선제, 지방 자치제 등이 자리 잡으면서 <b>시민의 영향력이 커졌고 민주주의가 더욱 발전하게 됐어요.</b></div>
      <div style="margin-top:5px;color:#64748B">되돌아온 요구를 끝까지 놓지 않은 사람들이 있었어요.</div></div>`;
  } else if(allChg){
    right+=`<div class="sq-src"><b>\uD83D\uDCF0 그날의 기사</b><br>높은 열기 줄 이은 주권 행렬</div>`;
    right+=`<div class="sq-fin">${SQ_FIN.map((f,k)=>
      `<button class="${st.sqWrongF===k?'no':''}" onclick="sqFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(opened){
    right+=`<div class="dw-step">\uD83C\uDF31 달라진 모습을 놓아 봐요</div>`;
    right+=`<div class="sq-list">${SQ_CHG.map((c,j)=>{
      const cls = sqHasChg(st,j)?'ok':'';
      return `<button class="${cls}" onclick="sqPickChg(${j})">${c}</button>`;
    }).join('')}</div>`;
  } else if(st.sqCry!=null){
    right+=`<div class="dw-step">\uD83D\uDCE2 요구하기 ${st.sqStep} / ${SQ_CROWD.length}</div>`;
    right+=`<button class="sq-ask" onclick="sqAsk()">${SQ_ASKQ}</button>`;
    if(st.sqStep>0){
      right+=`<div class="sq-log">${SQ_LOG.slice(0,st.sqStep).map((l,i)=>
        `<div><b>${SQ_TIME[i]}</b> \u00B7 ${l}</div>`).join('')}</div>`;
    }
  } else {
    right+=`<div class="dw-step">\uD83D\uDDE3\uFE0F 요구 세우기</div>`;
    right+=`<div class="sq-fin">${SQ_CRY.map((c,k)=>
      `<button class="${st.sqWrongC===k?'no':''}" onclick="sqPickCry(${k})">${c}</button>`).join('')}</div>`;
  }
  if(st.sqMsg) right+=`<div class="dw-msg${st.sqWarn?' warn':''}">${st.sqMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCE2 요구가 되돌아올 때 광장이 어떻게 되는지 살펴봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${sqCanvas(st)}<div class="cvcap">되돌아와도 광장은 줄지 않아요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function sqRender(){ main.innerHTML = slides[state.idx].render(state); }
/* ⚠️ 경고 경로 — 어긋난 고르기에만 쓴다. ★ 되돌림은 이 경로를 타지 않는다. */
function sqHold(msg){
  state.sqWarn=true; state.sqBusy=true; state.sqMsg=msg;
  playThud(); sqRender();
  setTimeout(()=>{ state.sqBusy=false; state.sqWarn=false; state.sqMsg=null;
    state.sqWrongC=null; state.sqWrongF=null; sqRender(); },1600);
}

/* ① 요구 세우기 — 확정한 뒤에는 바꿀 수 없다(가드④). */
function sqPickCry(k){
  if(state.sqFin!=null) return;                                        // 가드①
  if(state.sqBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SQ_CRY.length) return;          // 가드②
  if(state.sqCry!=null) return;                                        // 가드④ 요구는 한 번 세우면 달라지지 않는다
  if(k===SQ_CRY_OK){
    state.sqCry=k; state.sqWrongC=null; state.sqWarn=false;
    state.sqMsg = '이제 <b>같은 요구</b>를 정부에 해 봐요. 요구는 끝까지 달라지지 않아요.';
    playChime(); sqRender(); return;
  }
  state.sqWrongC=k;
  sqHold(SQ_CRY_NO[k]);
}

/* ② 요구하기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   인자가 없는 단 하나의 처리기이고, 단추의 글자도 걸음마다 같다.
   ★ 되돌아올 때마다 광장이 한 줄 자란다 — 되돌림이 판을 키우는 유일한 자리.
   ★ 그리고 광장이 다 자란 뒤에는 **같은 호출**이 받아들여진다.
   ⚠️ 되돌림은 정오가 아니므로 경고 경로(sqHold)를 타지 않고 warn도 세우지 않는다. */
function sqAsk(){
  if(state.sqFin!=null) return;                                        // 가드①
  if(state.sqBusy) return;                                             // 가드⑧
  if(state.sqCry==null) return;                                        // 가드③ 요구를 세우기 전 무시(순서)
  if(sqOpened(state)) return;                                          // 가드⑤ 문이 열린 뒤 재클릭 무시
  state.sqStep += 1;                                                   // ★ 되돌아와도 광장은 한 줄 자란다
  state.sqWrongC=null; state.sqWarn=false;
  if(sqOpened(state)){                                                 // ★ 문이 열리는 유일한 자리
    state.sqMsg = SQ_WON; playChime(); sqRender(); return;
  }
  state.sqMsg = SQ_BACK[state.sqStep-1];
  playBlip(); sqRender();
}

/* ③ 달라진 모습 놓기 — 셋 다 교과서 원문이라 판정이 없다(순서 자유). */
function sqPickChg(j){
  if(state.sqFin!=null) return;                                        // 가드①
  if(state.sqBusy) return;                                             // 가드⑧
  if(!Number.isInteger(j) || j<0 || j>=SQ_CHG.length) return;          // 가드②
  if(!sqOpened(state)) return;                                         // 가드⑥ 문이 열리기 전 무시(순서)
  if(sqHasChg(state,j)) return;                                        // 가드⑦ 이미 놓인 칸 — 판 불변
  state.sqChg |= (1<<j);
  state.sqWarn=false;
  state.sqMsg = `<b>${SQ_CHG_S[j]}</b> \u2014 ${SQ_CHG[j]}`;
  playBlip(); sqRender();
}

/* ④ 마무리 — [스스로 활동] 발문. ★ 확정하면 광장의 줄이 투표소의 줄로 바뀐다. */
function sqFinish(k){
  if(state.sqFin!=null) return;                                        // 가드①
  if(state.sqBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SQ_FIN.length) return;          // 가드②
  if(!sqAllChg(state)) return;                                         // 가드⑦ 세 칸 전 무시(순서)
  if(k===SQ_FIN_OK){
    state.sqFin=k;                                                     // ★ 줄이 투표소의 줄로 바뀌는 유일한 자리
    state.sqWrongF=null; state.sqMsg=null; state.sqWarn=false;
    playChime(); sqRender(); return;
  }
  state.sqWrongF=k;
  sqHold(k===1
    ? '벌을 받지 않으려고 줄을 선 것이 아니에요. <b>내 손으로 직접 뽑을 수 있게 되었기 때문</b>이었어요.'
    : '가까워져서가 아니에요. <b>국민이 직접 대통령을 뽑는 선거</b>였기 때문이에요.');
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l08 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

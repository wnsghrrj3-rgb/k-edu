성취기준 [6사07-01] · 교과서 p.15~17 · 지도서(대단원1 **3차시** 분단의 아픔이 담긴 장소를 살펴볼까요 /
  [디지털+ 할 수 있어요] 인터넷으로 분단과 관련 있는 장소 답사하기, 지도서 p.35~41) 근거
학습 목표: 분단의 아픔이 담긴 장소를 조사할 수 있다.
수업 기법 및 전략: 경험 나누기 · 조사하기 · 답사하기
⚠️ 엔진은 l01(6-1 u1 l01)에서 100% 승계. 1단원 색 #1D4ED8 그대로 — CSS 변수명·엔진 무수정.

직접조작: 답사 수첩 — 접어 둔 첫 짐작(37번째 신규 패턴 — 접어 두는 형 / 판이 첫 짐작을 그 자리에서 채점하지 않는다)
  ⭐ 앞의 서른여섯 종은 전부 **판이 그 걸음 안에서 반응을 끝냈다.** 맞다·틀리다를 돌려주든,
     「아직 한쪽만 놓였어요」라고 기다리든, 무판정으로 세기만 하든, 학생이 무엇을 하면
     판의 답은 **그 자리에서** 났다. 이번만 **판이 첫 짐작을 그 자리에서 채점하지 않고 접어 둔다.**
     장소를 정하면 판이 먼저 「그곳은 어떤 곳일까요?」를 3택으로 묻는데, 무엇을 골라도
     옳고 그름을 말하지 않고 수첩 첫 칸에 **접어서** 넣는다(글자가 가려진다).
     다섯 걸음을 밟아 답사를 마쳐야 그 칸을 **펴 볼 수 있고**, 그제야 내 짐작과
     답사로 알게 된 것이 나란히 놓인다.
     까닭은 이 차시가 다루는 것이 **답사**이기 때문이다 — 답사는 미리 아는 것을 확인하는 일이 아니라
     **가서 알게 되는 일**이고, 교과서 [디지털+]도 고르기(1) → 답사(2) → 정리의 차례를 두고 있으며
     지도서의 「답사를 한 후 어떤 생각이 들었나요?」도 **답사 뒤에** 온다.
  ⭐ **접힌 칸은 답사 중에 열리지 않는다** — 눌러도 판은 「답사를 마쳐야 펴 볼 수 있어요」까지만 말한다(가드⑤).
     그리고 접혀 있는 동안 그 짐작의 옳고 그름을 판이 **어디에도 표시하지 않는다**(§6-2 구조 검사 대상).
  ⭐ **펴 보았을 때에도 판은 짐작을 틀렸다고 하지 않는다** — 「가 보기 전에는 이렇게 생각했어요 /
     가 보고 나서 이렇게 알게 됐어요」로 **나란히 놓기만** 한다. 짐작은 틀리는 것이 아니라 **바뀌는 것**이다.
  ⭐ 34번째 「차례 세우기」와 반대다 — 거기서는 판이 다음 걸음을 말해 주지 않았지만,
     여기서는 판이 **차례대로 한 걸음씩 연다.** 답사의 차례가 교과서 예시에 이미 정해져 있기 때문이다.
     신규성은 걸음의 차례가 아니라 **판정을 접어 두는 데** 있다.
  ⚠️ 가드 8종 — ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`) /
     ③ 짐작을 접기 전 걸음 밟기 무시(순서) / ④ 차례가 아닌 걸음 무시 /
     ⑤ **답사를 마치기 전 접힌 칸 펴기 무시**(핵심 신규성) / ⑥ 시설 셋을 다 짝짓기 전 걸음 5 완료 0 /
     ⑦ 수첩을 펴기 전 마무리 무시(순서) / ⑧ 안내 표시 중 재클릭 무시(`svBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.sv-q`로 떼어 전 단계 상시 노출.

지도서 근거(3차시 p.35~41):
  [동기 유발] 6·25 전쟁 하면 떠오르는 장소 — 휴전선 / 판문점. 가 본 적 있는 곳 — 전쟁 기념관 / 통일 전망대.
  [학습 문제] 분단의 아픔이 담긴 장소를 살펴봅시다.
  [본문] 우리나라 곳곳에는 6·25 전쟁의 흔적이 남아 있는 장소나 분단으로 생긴 장소 등
    분단의 아픔이 담긴 여러 장소가 있습니다.
  [사진 캡션 원문 4종]
    · 휴전선 — 6·25 전쟁 이후 한반도를 가로지르는 휴전선이 설치됐습니다.
    · 아바이 마을(강원특별자치도 속초시) — 6·25 전쟁 중 남쪽으로 피란을 왔다가 돌아가지 못한 사람들이
      모여 살면서 만들어진 마을입니다.  낱말 — 아바이 = 아버지를 뜻하는 사투리.
    · 백마고지 전적지(강원특별자치도 철원군) — 6·25 전쟁 중 백마고지 전투가 있었던 곳으로,
      전투에서 희생된 군인들을 기리는 기념관과 기념비가 세워져 있습니다.
    · 장사 상륙 작전 전승 기념관(경상북도 영덕군) — 6·25 전쟁 중 장사 상륙 작전에 학생 신분으로
      참전했던 군인들을 추모하는 기념관입니다.
  [본문] 우리나라는 분단의 아픔이 담긴 장소를 평화의 장소로 바꾸려고 노력하고 있습니다.
    · DMZ 평화의 길 — 비무장 지대(DMZ) 일부 구간을 남과 북의 합의로 개방하여 사람들이 관람할 수 있도록 만들었습니다.
    · 오산 죽미령 평화 공원 — 6·25 전쟁 중 국제 연합군의 첫 전투가 벌어진 곳을 평화의 중요성을 알리는 공간으로 만들었습니다.
  [낱말] 비무장 지대 = 정전 협정에 따라 설치된 곳으로 군사 분계선에서 남과 북 각각 2 km 범위에
    군사 충돌을 방지하려고 설정한 지대. 군사적 행위와 무기 휴대가 원칙적으로 금지된다.
    비무장 지대는 자연환경이 잘 보전되어 있어 여러 희귀 식물과 멸종 위기에 있는 야생 동물이 살고 있다.
  [스스로 활동] 통일이 된 후에 비무장 지대를 평화의 장소로 활용할 수 있는 방법 —
    예시 답안 = 평화 생태 학습 공간 / 평화 통일을 기념하는 공연장 / 평화의 의미를 생각할 수 있는 곳.
  [디지털+ 할 수 있어요] 인터넷으로 분단과 관련 있는 장소 답사하기
    1 답사하고 싶은 장소 고르기 — 오산 죽미령 평화 공원 / 판문점 / DMZ 평화의 길 / 기타( )
    2 예시(판문점) 다섯 걸음 원문 —
      ① 판문점 누리집을 방문합니다. ② 판문점이 어떤 의미가 있는 장소인지 알아봅니다.
      ③ 판문점에서 일어났던 사건들을 살펴봅니다. ④ 판문점의 주요 시설들을 살펴봅니다.
      ⑤ 각 주요 시설들이 어떤 곳인지 확인합니다.
    [활동 자료 11 예시 답안] 의미 = 정전 협정 체결과 남북 정상 회담의 장소로, 분단과 평화의 상징적인 의미가 있는 곳.
      볼 수 있는 것 = 자유의 집(남북 적십자 간 업무와 회담을 지원하는 곳) /
      군사 정전 위원회 회의실(한반도 정전을 관리하기 위해 군사 분계선 가운데에 지은 임시 건물로 회의실로 이용하는 곳) /
      돌아오지 않는 다리(남북 포로 교환이 이루어졌던 곳).
      느낀 점 = 판문점이라는 공간이 남북이 만나는 장소로서, 분단의 장소가 아닌 평화의 장소로 바뀌면 좋겠다.
  [3차시 주요 내용 정리] 1. 분단의 아픔이 담긴 장소: 휴전선, 아바이 마을, 백마고지 전적지, 장사 상륙 작전 전승 기념관 등
    2. 평화의 장소로 바꾸기 위한 노력: DMZ 평화의 길, 오산 죽미령 평화 공원 등
  [꼭 기억해요] 1 6·25 전쟁 이후 한반도를 가로지르는 **휴전선**이 설치됐습니다.
    2 우리나라는 분단의 아픔이 담긴 장소를 **평화의 장소**로 바꾸려고 노력하고 있습니다.
  [정리] 차시 예고 = 평화 통일을 위한 노력 알아보기.
⚠️ 설계 원칙:
  · **4차시(평화 통일을 위한 노력) 선행 침범 0** — 7·4 남북 공동 성명·남북 기본 합의서·정상 회담 횟수와 장소·
    개성 만월대·겨레말큰사전·단일팀·팀 코리아·공동 입장 0. 「평화 통일」은 META 주제명 두 자리와
    [스스로 활동] 예시 답안 원문 한 자리에서만.
    ⚠️ 「남북 정상 회담」은 **3차시 지도서 답사 예시 답안 원문**에 있는 그대로 수첩 한 자리에서만 쓰고,
       언제·몇 차례·어디에서 열렸는지는 4차시 몫이므로 쓰지 않는다(문항 0).
  · **5~6차시(실천)·7차시 이후(민주화·산업화) 침범 0** — 민주화·산업화는 META 한 자리씩.
  · **2차시는 회수만** — 실향민·이산가족·국방비·분단 비용·남북 언어는 낱말로만 되짚는다.
  · 교사용 참고 자료 0 — 참고 도서, 판문점 어원·널문리·휴전 협정 날짜·포로 교환 인원,
    백마고지 전투 사상자 수·부대 이름, 베를린 장벽과 독일 통일, 도끼 만행 사건, 누리집 주소, 두산 백과 등 출처.
  · **문항 내 연도·인원·거리 수치 0 · 행정구역 표기 0**(강원특별자치도·경상북도·경기도·속초시·철원군·영덕군).
    행정구역은 교과서 사진 캡션 원문으로 **슬라이드에만** 둔다. 비무장 지대의 2 km도 슬라이드 원문에만.
  · **학생 이름 0.**
  · 정서 — **북한 사람을 적으로 그리지 않는다.** 무기·폐허 그림 0, 겁주는 어휘 0.
    전투와 희생은 교과서 원문이 말하는 만큼만 쓰고, 기리고 추모하는 마음 쪽으로 쓴다.
    분단의 아픔이 담긴 장소를 무서운 곳으로 그리지 않는다 — **평화의 장소로 바뀌는 흐름**을 나란히 둔다.
  · ⚠️ 정직 원칙 — ㉠ 실제 인터넷 답사를 화면에서 대신해 주지 않는다.
    조작이 다루는 것은 **답사의 차례와 수첩**이다(누리집을 흉내내지 않는다).
    ㉡ 교과서 [디지털+] 1의 「기타(    )」 빈칸은 학생이 채우는 자리이므로 **지어내지 않는다.**

.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);

.check.on{border-color:var(--green);background:var(--bub)}

.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* ===== 직접조작 — 답사 수첩 · 접어 둔 첫 짐작(37번째 신규 패턴 — 접어 두는 형) =====
   ⭐ 앞의 서른여섯 종은 전부 **판이 그 걸음 안에서 반응을 끝냈다.**
      맞다·틀리다를 곧바로 돌려주든, 반대쪽을 기다린다고 말하든, 무판정으로 세기만 하든,
      학생이 무엇을 누르면 판의 태도는 **그 자리에서** 정해졌다.
      이번만 **판이 첫 짐작을 그 자리에서 채점하지 않고 접어 둔다.**
      무엇을 골라도 판은 옳고 그름을 말하지 않고 수첩 첫 칸에 접어서 넣는다 — 글자가 가려진다.
      다섯 걸음을 밟아 답사를 마쳐야 그 칸을 펴 볼 수 있다.
      까닭은 이 차시가 다루는 것이 **답사**이기 때문이다. 답사는 미리 아는 것을 확인하는 일이 아니라
      **가서 알게 되는 일**이고, 그래서 짐작은 답사보다 먼저 채점될 수 없다.
   ⭐ 접힌 칸은 답사 중에 열리지 않는다(가드⑤ — 핵심 신규성).
      그리고 접혀 있는 동안 판은 그 짐작의 옳고 그름을 **어디에도 표시하지 않는다.**
   ⭐ 펴 보았을 때에도 판은 짐작을 틀렸다고 하지 않는다 —
      「가 보기 전에는 / 가 보고 나서는」으로 **나란히 놓기만** 한다.
      옳고 그름이 있는 자리는 시설 확인 3택과 마무리 3택 두 곳뿐이다.
   ① 첫 짐작 3택 → 무판정 · 접어 둠
   ② 다섯 걸음 답사(교과서 [디지털+] 예시 원문 · 차례 고정 — 판이 한 걸음씩 연다)
      걸음 5에서 주요 시설 셋이 어떤 곳인지 확인(짝짓기 · 판정 있음)
   ③ 수첩 펴 보기 — 짐작과 알게 된 것을 나란히
   ④ 마무리 3택 = 지도서 「답사를 하고 느낀 점」 예시 답안 원문
   ⚠️ 짐작·걸음·노트·시설·쓰임새 전량 고정 리터럴 — 난수 0.
   ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`) /
      ③ 짐작을 접기 전 걸음 밟기 무시(순서) / ④ 차례가 아닌 걸음 무시 /
      ⑤ **답사를 마치기 전 접힌 칸 펴기 무시**(핵심) / ⑥ 시설 셋을 다 짝짓기 전 걸음 완료 0 /
      ⑦ 수첩을 펴기 전 마무리 무시(순서) / ⑧ 안내 표시 중 재클릭 무시(`svBusy`).
   ⚠️ 발문은 `.sv-q`로 떼어 전 단계 상시 노출. */
const SV_PLACE = '판문점';                      // 교과서 [디지털+] 2 예시가 판문점 하나이므로 지어내지 않는다
const SV_GUESS = [                              // 첫 짐작 3택 — 판이 채점하지 않는다
  '남과 북이 만나서 이야기를 나누던 곳일 것 같아요',

  '큰 전투가 벌어졌던 곳일 것 같아요'
];
const SV_GUESS_S = ['남과 북이 만나던 곳','군인들만 오가던 곳','큰 전투가 있던 곳'];  // 수첩 칸 표시용 짧은이름
const SV_STEP = [                               // 교과서 [디지털+] 예시 다섯 걸음 — 원문 그대로·차례 고정

  '각 주요 시설들이 어떤 곳인지 확인합니다.'
];
const SV_NOTE = [                               // 걸음마다 수첩에 적히는 줄 — 지도서 예시 답안 원문
  '답사할 장소를 판문점으로 정했어요.',
  '6·25 전쟁 중 휴전 회담과 정전 협정이 이루어졌던 장소로, 남북 분단을 상징적으로 보여 주는 곳이에요.',
  '남북 정상 회담이 열린 적이 있어요.',

];
const SV_NOTE_S = ['답사할 곳 — 판문점','휴전 회담과 정전 협정이 이루어진 곳',
                   '남북 정상 회담이 열린 적이 있는 곳','자유의 집 · 회의실 · 돌아오지 않는 다리',
                   '세 시설이 어떤 곳인지 확인함'];
const SV_FAC = ['자유의 집','군사 정전 위원회 회의실','돌아오지 않는 다리'];
const SV_USE = [                                // 자리 i의 알맞은 쓰임새도 i — 판정 한 줄 검증
  '남북 적십자 간 업무와 회담을 지원하는 곳이에요.',
  '한반도 정전을 관리하기 위해 군사 분계선 가운데에 지은 임시 건물로, 회의실로 이용하는 곳이에요.',
  '남북 포로 교환이 이루어졌던 곳이에요.'
];
const SV_FIN = [                                // 마무리 3택 — 정답 자리 1
  '판문점은 사람들이 갈 수 없는 곳이니 관심을 두지 않아도 돼요',
  '판문점이 남북이 만나는 장소로서, 분단의 장소가 아닌 평화의 장소로 바뀌면 좋겠어요',
  '분단의 아픔이 담긴 장소는 그대로 잊고 지내는 것이 좋겠어요'
];
const SV_FIN_OK = 1;                            // 지도서 「답사를 하고 느낀 점」 예시 답안 원문

function svDoneFac(st,i){ return st.svFac.indexOf(i)>=0; }

/* 판 — 수첩. 첫 칸은 접혀 있고, 다섯 걸음을 마쳐야 펴진다. */
function svCanvas(st){
  const open = st.svOpen, gs = st.svGuess;
  let g='';
  g+=`<rect x="10" y="12" width="300" height="226" rx="10" fill="#FFFDF5" stroke="#E7D9A8" stroke-width="2.2"/>`;
  g+=`<text x="160" y="32" font-size="11.5" fill="#8A6D3B" text-anchor="middle" font-weight="800">답사 수첩</text>`;
  // 첫 칸 — 접힌 짐작
  if(gs==null){
    g+=`<rect x="22" y="42" width="276" height="32" rx="8" fill="#fff" stroke="#CBD5E0" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    g+=`<text x="160" y="62" font-size="9.4" fill="#A0AEC0" text-anchor="middle">가 보기 전 내 짐작 — 아직 고르지 않았어요</text>`;
  } else if(!open){
    g+=`<rect x="22" y="42" width="276" height="32" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.8"/>`;
    g+=`<path d="M22 58 L298 58" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="5 4"/>`;
    g+=`<text x="160" y="56" font-size="9.4" fill="#94A3B8" text-anchor="middle" font-weight="800">가 보기 전 내 짐작</text>`;
    g+=`<text x="160" y="70" font-size="9" fill="#94A3B8" text-anchor="middle">접어 두었어요</text>`;
  } else {
    g+=`<rect x="22" y="42" width="276" height="32" rx="8" fill="#fff" stroke="#B45309" stroke-width="1.8"/>`;
    g+=`<text x="160" y="55" font-size="8.6" fill="#B45309" text-anchor="middle" font-weight="800">가 보기 전 내 짐작</text>`;
    g+=`<text x="160" y="69" font-size="9.6" fill="#8A6D3B" text-anchor="middle" font-weight="800">${SV_GUESS_S[gs]}</text>`;
  }
  // 걸음 다섯
  for(let k=0;k<5;k++){
    const cx=44+k*58, on = st.svStep>k;
    g+=`<circle cx="${cx}" cy="92" r="11" fill="${on?'#DBEAFE':'#fff'}" stroke="${on?'#1D4ED8':'#CBD5E0'}" stroke-width="1.8"/>`;
    g+=`<text x="${cx}" y="96" font-size="9.6" fill="${on?'#1E3A8A':'#A0AEC0'}" text-anchor="middle" font-weight="800">${k+1}</text>`;
    if(k<4) g+=`<line x1="${cx+11}" y1="92" x2="${cx+47}" y2="92" stroke="${(k+2)<=st.svStep?'#1D4ED8':'#E2E8F0'}" stroke-width="2"/>`;
  }
  // 알게 된 것 다섯 줄
  for(let k=0;k<5;k++){
    const y=114+k*22;
    if(st.svStep>k){
      g+=`<rect x="22" y="${y}" width="276" height="18" rx="5" fill="#fff" stroke="#E7D9A8" stroke-width="1.2"/>`;
      g+=`<text x="30" y="${y+13}" font-size="8.4" fill="#3F3A2C" font-weight="700">${k+1}. ${SV_NOTE_S[k]}</text>`;
    } else {
      g+=`<rect x="22" y="${y}" width="276" height="18" rx="5" fill="#FBF9F0" stroke="#EDE4CC" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    }
  }
  g+=`<text x="160" y="232" font-size="10.4" fill="#8A6D3B" text-anchor="middle" font-weight="800">밟은 걸음 ${st.svStep} / 5</text>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function svPanel(st){
  if(!st.svFac) st.svFac=[];
  const done = st.svFin!=null;
  const walked = st.svStep>=5;
  const q = done
    ? '답사를 마치고 수첩을 정리했어요.'
    : (st.svOpen ? '답사를 하고 나니 어떤 생각이 드나요?'
      : (walked ? '다섯 걸음을 다 밟았어요. 이제 접어 둔 짐작을 펴 봐요.'
        : (st.svGuess==null ? '판문점은 어떤 곳일까요? 가 보기 전 짐작을 하나 골라 접어 두어요.'
          : (st.svFacOpen ? '주요 시설이 각각 어떤 곳인지 확인해 봐요.'
            : '차례대로 한 걸음씩 답사해 봐요.'))));
  let right = `<div class="sv-q">${q}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">🧭 답사를 마쳤어요</div>
      <div>판문점은 <b>휴전 회담과 정전 협정</b>이 이루어졌던 곳으로, <b>남북 분단</b>을 상징적으로 보여 주는 장소예요.</div>
      <div style="margin-top:5px;color:#64748B">우리나라는 이렇게 <b>분단의 아픔이 담긴 장소</b>를
      <b>평화의 장소</b>로 바꾸려고 노력하고 있어요.</div></div>`;
  } else if(st.svOpen){
    right+=`<div class="dw-card"><div class="pt">📖 접어 둔 칸을 폈어요</div>
      <div><b>가 보기 전에는</b> — ${SV_GUESS[st.svGuess]}</div>
      <div style="margin-top:4px"><b>가 보고 나서는</b> — ${SV_NOTE[1]}</div>
      <div style="margin-top:5px;color:#64748B">짐작은 맞히는 것이 아니에요. <b>답사를 하면서 바뀌어 가는 것</b>이에요.</div></div>`;
    right+=`<div class="sv-fin">${SV_FIN.map((f,k)=>
      `<button class="${st.svWrongF===k?'no':''}" onclick="svFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(walked){
    right+=`<button class="sv-fold" onclick="svOpenFold()">🔖 접어 둔 짐작 펴 보기</button>`;
  } else if(st.svGuess==null){
    right+=`<div class="dw-step">🤔 가 보기 전 짐작</div>`;
    right+=`<div class="sv-list">${SV_GUESS.map((gtx,k)=>
      `<button onclick="svPickGuess(${k})">${gtx}</button>`).join('')}</div>`;
  } else if(st.svFacOpen){
    right+=`<div class="dw-step">🏛️ 주요 시설</div>`;
    right+=`<div class="sv-list">${SV_FAC.map((f,i)=>
      svDoneFac(st,i) ? `<button class="ok" disabled>${f}</button>`
                      : `<button class="${st.svFacSel===i?'on':''}" onclick="svPickFac(${i})">${f}</button>`).join('')}</div>`;
    if(st.svFacSel!=null){
      right+=`<div class="dw-step">🔎 어떤 곳일까요?</div>`;
      right+=`<div class="sv-list">${SV_USE.map((u,k)=>
        `<button onclick="svPickUse(${k})">${u}</button>`).join('')}</div>`;
    }
  } else {
    right+=`<div class="dw-step">🚶 답사의 차례</div>`;
    right+=`<div class="sv-list">${SV_STEP.map((s,k)=>
      st.svStep>k ? `<button class="ok" disabled>${k+1}. ${s}</button>`
        : (st.svStep===k ? `<button onclick="svStepGo(${k})">${k+1}. ${s}</button>`
                         : `<button disabled>${k+1}. ${s}</button>`)).join('')}</div>`;
    right+=`<button class="sv-fold" onclick="svOpenFold()">🔖 접어 둔 짐작 펴 보기</button>`;
  }
  if(st.svMsg) right+=`<div class="dw-msg${st.svWarn?' warn':''}">${st.svMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🧭 인터넷으로 판문점을 답사하고 수첩에 적어요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${svCanvas(st)}<div class="cvcap">첫 짐작은 접어 두었어요 — 답사를 마쳐야 펴 볼 수 있어요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    <div class="note">다음은 <b style="color:var(--amber)">평화 통일을 위한 노력</b>!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u1_l02";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  svGuess:null, svStep:0, svFacOpen:false, svFacSel:null, svFac:[], svOpen:false, svFin:null,
  svWrongF:null, svMsg:null, svWarn:false, svBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function svRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 첫 짐작 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   무엇을 골라도 판정하지 않는다. 옳고 그름을 말하지도, 표시하지도 않고 접어 둔다. */
function svPickGuess(k){
  if(state.svFin!=null) return;                                        // 가드①
  if(state.svBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SV_GUESS.length) return;         // 가드②
  if(state.svGuess!=null) return;                                      // 이미 접어 둔 뒤 재선택 무시
  state.svGuess=k;
  state.svWarn=false;                                                  // ★ 채점하지 않으므로 경고도 없다
  state.svMsg='짐작을 <b>수첩 첫 칸에 접어</b> 두었어요. 답사를 마치면 펴 볼 수 있어요.';
  playBlip(); svRender();
}

/* ② 답사의 걸음 — 차례 고정(교과서 [디지털+] 예시 원문 순서). 판이 한 걸음씩 연다. */
function svStepGo(k){
  if(state.svFin!=null) return;                                        // 가드①
  if(state.svBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SV_STEP.length) return;          // 가드②
  if(state.svGuess==null){                                             // 가드③ 짐작을 접기 전 걸음 무시(순서)
    state.svWarn=true; state.svBusy=true;
    state.svMsg='먼저 <b>가 보기 전 짐작</b>을 하나 골라 접어 두어요.';
    playThud(); svRender();
    setTimeout(()=>{ state.svBusy=false; state.svWarn=false; state.svMsg=null; svRender(); },1600);
    return;
  }
  if(k!==state.svStep) return;                                         // 가드④ 차례가 아닌 걸음 무시
  if(k<4){
    state.svStep=k+1; state.svWarn=false;
    state.svMsg=`수첩에 적었어요 — ${SV_NOTE[k]}`;
    playBlip(); svRender(); return;
  }
  state.svFacOpen=true; state.svWarn=false;                            // 걸음 5 = 시설 확인 짝짓기
  state.svMsg='주요 시설이 <b>각각 어떤 곳인지</b> 확인해 봐요.';
  playBlip(); svRender();
}

/* ②-1 시설 고르기 */
function svPickFac(i){
  if(state.svFin!=null) return;                                        // 가드①
  if(state.svBusy) return;                                             // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=SV_FAC.length) return;           // 가드②
  if(!state.svFacOpen) return;                                         // 가드④ 걸음 5 전 무시(순서)
  if(svDoneFac(state,i)) return;                                       // 이미 확인한 시설 무시
  state.svFacSel=i; state.svWarn=false; state.svMsg=null; svRender();
}

/* ②-2 쓰임새 3택 — 오답 안내는 주인 자리를 짚어 준다(5-1 u3 l06·l08 규약 승계) */
function svPickUse(u){
  if(state.svFin!=null) return;                                        // 가드①
  if(state.svBusy) return;                                             // 가드⑧
  if(!Number.isInteger(u) || u<0 || u>=SV_USE.length) return;           // 가드②
  if(state.svFacSel==null) return;                                     // 가드④ 시설을 고르기 전 무시(순서)
  const i=state.svFacSel;
  if(u===i){
    state.svFac.push(i); state.svFacSel=null; state.svWarn=false;
    if(state.svFac.length>=SV_FAC.length){                             // 가드⑥ 셋을 다 짝지어야 걸음 완료
      state.svStep=5; state.svFacOpen=false;
      state.svMsg='다섯 걸음을 모두 밟았어요. 이제 <b>접어 둔 짐작</b>을 펴 볼 수 있어요.';
      playChime(); svRender(); return;
    }
    state.svMsg=`수첩에 적었어요 — <b>${SV_FAC[i]}</b>은(는) ${SV_USE[i]}`;
    playChime(); svRender(); return;
  }
  state.svWarn=true; state.svBusy=true;
  state.svMsg=`그것은 <b>${SV_FAC[u]}</b>이(가) 하는 일이에요. 다시 살펴봐요.`;
  playThud(); svRender();
  setTimeout(()=>{ state.svBusy=false; state.svWarn=false; state.svMsg=null; svRender(); },1600);
}

/* ③ 접어 둔 칸 펴 보기 — 가드⑤가 이 패턴의 핵심 신규성을 지킨다.
   답사를 마치기 전에는 열리지 않는다. */
function svOpenFold(){
  if(state.svFin!=null) return;                                        // 가드①
  if(state.svBusy) return;                                             // 가드⑧
  if(state.svOpen) return;                                             // 이미 폈으면 무시
  if(state.svStep<5){                                                  // 가드⑤ ★ 핵심
    state.svWarn=true; state.svBusy=true;
    state.svMsg='아직 답사 중이에요. <b>답사를 마쳐야</b> 펴 볼 수 있어요.';
    playThud(); svRender();
    setTimeout(()=>{ state.svBusy=false; state.svWarn=false; state.svMsg=null; svRender(); },1600);
    return;
  }
  state.svOpen=true; state.svWarn=false;
  state.svMsg='가 보기 전 짐작과 가 보고 나서 알게 된 것을 <b>나란히</b> 놓았어요.';
  playChime(); svRender();
}

/* ④ 마무리 — 답사를 하고 느낀 점(지도서 예시 답안 원문) */
function svFinish(k){
  if(state.svFin!=null) return;                                        // 가드①
  if(state.svBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SV_FIN.length) return;           // 가드②
  if(!state.svOpen) return;                                            // 가드⑦ 수첩을 펴기 전 마무리 무시(순서)
  if(k===SV_FIN_OK){
    state.svFin=k; state.svWrongF=null; state.svMsg=null; state.svWarn=false;
    playChime(); svRender(); return;
  }
  state.svWrongF=k; state.svWarn=true; state.svBusy=true;
  state.svMsg = k===0
    ? '갈 수 없는 곳이라고 해서 <b>관심을 두지 않아도 되는 것은 아니에요.</b> 인터넷으로도 답사할 수 있었지요.'
    : '아픔이 담긴 장소를 <b>잊는 것</b>이 아니라 <b>평화의 장소로 바꾸려고</b> 노력하고 있어요.';
  playThud(); svRender();
  setTimeout(()=>{ state.svBusy=false; state.svWrongF=null; state.svMsg=null; state.svWarn=false; svRender(); },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l03_평화통일노력.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

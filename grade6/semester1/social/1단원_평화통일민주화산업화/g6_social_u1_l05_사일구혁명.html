학습 목표: 4·19 혁명과 민주화를 위한 사람들의 노력을 설명할 수 있다.
수업 기법 및 전략: 돌아가며 말하기 · 사료 탐구
★ 주제② 첫 차시 — 주제①(평화 통일)에서 주제②(민주화와 산업화)로 넘어오는 자리.
⚠️ 엔진은 l01~l04에서 100% 승계. 1단원 색 #1D4ED8 그대로 — CSS 변수명·엔진 무수정.

직접조작: 거슬러 오르는 판(40번째 신규 패턴 — 결과에서 원인으로 되짚는 형)
  ⭐ 앞의 서른아홉 종은 전부 **빈 판에서 앞으로 나아갔다.**
     카드를 놓든, 칸을 칠하든, 걸음을 밟든, 갈래를 고르든 — 판은 언제나 **비어 있는 데서 시작해
     내용이 흐르는 방향으로** 쌓였다. 이번만 판이 **이미 한 줄을 놓은 채로 시작하고,
     학생은 그 줄에서 **거꾸로** 거슬러 오른다.**
     판 맨 위에는 결과(대통령 자리에서 물러남)가 처음부터 놓여 있고, 판은 묻는다 —
     「그 <b>앞</b>에는 무슨 일이 있었나요?」
     까닭은 이 차시가 다루는 것이 **원인**이기 때문이다. 지도서 [친구와 활동]의 활동 의도가
     「부정 선거로 생겨난 문제를 이야기함으로써 **4·19 혁명의 원인을 생각해 보는 활동**」이고,
     [7차시 주요 내용 정리]도 「1. 4·19 혁명의 **원인**: 3·15 부정 선거」를 맨 앞에 둔다.
     역사는 일어난 일을 차례로 외우는 공부가 아니라 **왜 그리 되었는지 되짚는** 공부다.
  ⭐ **그래서 교과서 연표 차례대로 밟으면 판이 한 칸도 열리지 않는다.** 정순은 전부 물린다
     (스모크가 다섯 시점 전수로 대조 — 「앞으로 쌓는 판」 변이는 여기서 걸린다).
  ⭐ **어긋난 일을 골라도 판은 답을 말하지 않고 방향만 알려 준다.**
     이미 놓인 일이면 「그보다 <b>앞</b>의 일을 찾아 봐요」, 더 앞의 일이면
     「<b>바로 앞</b>의 일부터 한 칸씩」 — 두 안내 어디에도 알맞은 일의 이름·날짜가 없다.
  ⭐ **그리고 다 마치면 판이 방향을 뒤집어 다시 읽어 준다.**
     거슬러 오른 다섯 줄이 **원인에서 결과로** 다시 놓인다. 앞의 서른아홉 종에서 판은
     한 번 쌓인 뒤 그대로 있었다 — 판이 제가 쌓은 것을 **반대 방향으로 다시 읽는 것**은 여기가 처음이다.
     거슬러 올라 찾은 일들이 실은 **하나의 흐름**이었다는 것을 판이 스스로 보여 준다.
  ⭐ l04의 「갈래가 갈리는 형」과 견주면 — 거기서는 갈래가 **갈렸다가 합류**했고,
     여기서는 방향이 **거슬러 올랐다가 뒤집힌다.** 파일 머리 주석에 대비를 명시했다.
  ① 결과 한 줄이 이미 놓인 판 — 「그 앞에는 무슨 일이 있었나요?」
  ② 거슬러 오르기 4걸음(교과서 연표 원문 · 바로 앞의 일만 받는다 · 어긋나면 방향만 안내)
  ③ [친구와 활동] 부정 선거가 이뤄지면 생기는 문제 3택(지도서 예시 답안 원문)
  ④ 마무리 3택 = 핵심 질문 「4·19 혁명의 의의는 무엇인가요?」 → 확정하면 **판이 뒤집힌다**
  ⚠️ 사건·날짜·문항·마무리 전량 고정 리터럴 — 난수 0.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 사건·문제·마무리 번호(`Number.isInteger`) /
     ③ 거슬러 오르기를 마치기 전 [친구와 활동] 무시(순서) / ④ 이미 놓인 일 재선택 — 판 불변(방향 안내만) /
     ⑤ 바로 앞이 아닌 더 앞의 일 — 판 불변(방향 안내만) / ⑥ [친구와 활동] 전 마무리 무시(순서) /
     ⑦ 거슬러 오르기를 마친 뒤 사건 단추 재클릭 무시 / ⑧ 안내 표시 중 재클릭 무시(`rvBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.rv-q`로 떼어 전 단계 상시 노출.

지도서 근거(7차시 p.68~71):
  [생각을 열어요] 같은 장소를 같은 구도로 찍어 이어 붙인 두 사진 — 서울특별시 중구.
    왼쪽 2017년은 도로에 차들이 다니고, 오른쪽 1987년은 시민들과 경찰들이 맞서고 있다.
    활동 의도 — 같은 장소이지만 시대적 상황에 따라 다른 삶의 모습이 나타난다는 것을 깨닫는 활동.
  [본문] 8·15 광복 이후 우리나라는 민주주의 제도를 도입하고 정부를 수립했습니다.
    그러나 첫 번째 대통령이었던 이승만은 헌법을 바꿔 가며 세 차례나 대통령에 당선됐습니다.
    6·25 전쟁 이후 경제가 어려운 상황에서 장기 집권이 이어지자, 국민의 불만이 높아졌습니다.
    정부는 다음 정부통령 선거에서도 이겨 계속 집권하려고 선거 운동에 개입했습니다.
    이에 대구에서는 정부에 항의하는 학생 시위가 일어났습니다.
    그러나 정부가 1960년 3월 15일 선거에서 부정한 방법으로 이기자, 시민들은 선거 무효를 주장하며
    시위를 벌였습니다. 특히 마산 시위에 참여했던 고등학생 김주열의 시신이 발견되면서 시위는 전국으로 퍼졌습니다.
    4월 19일에는 서울을 비롯한 여러 도시에서 많은 학생과 시민이 시위를 벌였고,
    초등학생과 대학교수까지 시위에 참여했습니다(4·19 혁명).
    결국 이승만은 대통령 자리에서 물러났고 3·15 부정 선거는 무효가 됐습니다.
    4·19 혁명은 시민과 학생의 힘으로 민주적 절차를 무시한 정권을 무너뜨린 사건으로,
    우리나라 민주주의 발전에 밑거름이 됐습니다.
  [낱말] 정부통령 선거 = 대통령과 부통령을 함께 뽑는 선거.
  [말풍선] 우리나라에서 대통령을 몇 번 할 수 있나요? → 정부 수립 당시에는 두 번까지 할 수 있었지만,
    현재는 한 번만 할 수 있습니다.
  [사진으로 보는 4·19 혁명] 연표 원문 다섯 칸 —
    2월 28일 대구의 고등학생들이 처음으로 정부에 맞서다 /
    3월 15일 부정한 방법으로 정부통령 선거를 치르다 /
    4월 11일 김주열의 시신이 발견되다 /
    4월 19~26일 초등학생들도 시위에 참여하다 /
    4월 26일 이승만이 대통령 자리에서 물러나다.
  [친구와 활동] 당시 3·15 부정 선거에서 있었던 일 말풍선 원문 세 가지 —
    돈이나 물건을 주고 특정 후보에게 투표하라고 했어요 /
    조를 짜서 투표하고, 조장이 누구에게 투표하는지 확인했어요 /
    선거 전에 미리 표시한 투표지가 투표함에서 발견됐어요.
    예시 답안 — 선거로 뽑힌 대표자를 따르지 않는다 / 국민이 투표 결과를 믿지 못하게 된다 /
      국민의 뜻이 제대로 전달되지 않는다.
  [스스로 활동] 사료 — 차 위에서 사람들이 무엇이라고 외쳤을지 써 보기.
    현수막 문구 원문 = 이 대통령 사임, 민주주의의 승리.
    예시 답안 = 민주주의 만세! 우리가 승리했다.
  [핵심 질문] 4·19 혁명의 의의는 무엇인가요? → 시민과 학생의 힘으로 민주적 절차를 무시한 정권을
    무너뜨렸습니다 / 우리나라 민주주의 발전에 밑거름이 됐습니다.
  [지도서 유추] 차 위에서 외치는 사람들의 마음 — 정권을 무너뜨렸다는 자부심과 뿌듯함,
    목숨을 잃은 시민들에 대한 안타까움.
  [꼭 기억해요] 1 이승만 정부는 계속 집권하려고 3·15 부정 선거를 벌였습니다.
    2 4·19 혁명은 초등학생부터 대학교수까지 각계각층의 사람들이 참여했습니다. (○)
  [7차시 주요 내용 정리] 1. 원인: 3·15 부정 선거 / 2. 전개 과정 ①~⑤ / 3. 의의.
  [정리] 차시 예고 = 5·18 민주화 운동과 민주화를 위한 사람들의 노력 알아보기.
⚠️ 설계 원칙:
  · **8차시 이후 침범 0** — 5·18 민주화 운동은 **차시 예고 두 자리에서만.**
    6월 민주 항쟁 0, 산업의 발달 과정·산업화로 달라진 생활 모습 0(산업화는 META 안에서만).
  · **대단원2 이후 침범 0** — 민주주의에서 선거가 무엇인지·선거 과정·국회·행정부·법원·미디어 0.
    이 차시의 「선거」는 **3·15 부정 선거와 정부통령 선거**라는 역사 사실로만 쓴다.
  · **주제① 침범 0** — 평화 통일·분단·북한·휴전선·이산가족 등 재현 0.
    「6·25 전쟁」은 교과서 7차시 본문 원문(경제가 어려운 상황)으로 **두 자리까지만.**
  · **문항 내 연도 0** — 1960년·1987년·2017년은 교과서 원문으로 **슬라이드에만.**
    인원·금액 수치 0.
  · 교사용 참고 자료 0 — 참고 도서 세 종, 2·28 민주 운동 기념 사업회와 대구 시내 고등학교 이름,
    국가 기념일 지정, 유네스코 세계 기록 유산·기록물 점수·사상자 수·제2공화국·68혁명·신문사 이름,
    조병옥·이기붕·장면 등 교사용 인물, 자유당, 5인조 공개 투표, 누리집 주소, 사료 저자 이름.
  · **정직 원칙 두 곳** — ㉠ 화면이 실제 사료 조사를 대신해 주지 않는다.
    조작이 다루는 것은 **일이 일어난 차례와 그 방향**이다.
    ㉡ 교과서 [스스로 활동]의 빈칸은 지어내지 않고 **지도서 예시 답안 원문**만 둔다.
  · **학생 이름 0.** 김주열은 교과서 본문·연표에 실린 역사 속 인물이므로 원문 그대로 둔다.
  · 정서 — 폭력·유혈 묘사 0, 무기 그림 0, 겁주는 어휘 0.
    목숨을 잃은 사람은 **기리고 안타까워하는** 쪽으로 쓴다(지도서 유추 근거).
    특정 정당·정치 세력을 편들거나 몰아세우지 않는다. 사실과 교과서가 말하는 의의까지만 쓴다.

.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.scene.wide{width:clamp(240px,44vw,420px)}
.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;

.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

.q-stem{font-size:clamp(15px,2.6vw,20px);font-weight:700;line-height:1.6;margin-bottom:12px}

.opt{background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;
  font-family:inherit;font-size:clamp(13px,2.2vw,16.5px);font-weight:500;text-align:left;line-height:1.5;transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:#16A34A;background:#DCFCE7;font-weight:700}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:11px;border-radius:12px;padding:12px 16px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;animation:fadeUp .3s ease both}
.fb.ok{background:#DCFCE7;color:#166534;font-weight:700}
.hint{margin-top:9px;background:var(--amber-bg);border-radius:11px;padding:10px 14px;
  font-size:clamp(12.5px,2.1vw,15px);color:var(--amber);line-height:1.55}

.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}

.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;

.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}

.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}

  text-align:left;line-height:1.45}
.rv-list button:hover{border-color:var(--green);background:var(--bub)}
.rv-list button.ok{border-color:var(--cyan);background:#EFF6FF;color:#93A9C9}
.rv-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}

.rv-fin{display:flex;flex-direction:column;gap:5px}
.rv-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.rv-fin button:hover{background:var(--bub)}
.rv-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;

.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}

.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(29,78,216,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}

  .ka-f{grid-template-columns:1fr 1fr}

/* ===== 직접조작 — 거슬러 오르는 판(40번째 신규 패턴 — 결과에서 원인으로 되짚는 형) =====
   ⭐ 앞의 서른아홉 종은 전부 **빈 판에서 앞으로 나아갔다.**
      이번만 판이 **이미 결과 한 줄을 놓은 채로 시작하고**, 학생은 거기서 **거꾸로** 거슬러 오른다.
      까닭은 이 차시가 다루는 것이 **원인**이기 때문이다 — 지도서 [친구와 활동]의 활동 의도가
      「부정 선거로 생겨난 문제를 이야기함으로써 4·19 혁명의 **원인**을 생각해 보는 활동」이고,
      [7차시 주요 내용 정리]도 「1. 4·19 혁명의 **원인**: 3·15 부정 선거」를 맨 앞에 둔다.
   ⭐ **그래서 교과서 연표 차례대로 밟으면 판이 한 칸도 열리지 않는다**(스모크가 다섯 시점 전수로 대조).
   ⭐ **어긋난 일을 골라도 판은 답을 말하지 않고 방향만 알려 준다** — 두 안내 어디에도
      알맞은 일의 원문·짧은이름·날짜가 없다(스모크가 16경로 전수로 대조).
   ⭐ **다 마치면 판이 방향을 뒤집어 다시 읽어 준다** — 거슬러 오른 다섯 줄이 원인에서 결과로 다시 놓인다.
      판이 제가 쌓은 것을 반대 방향으로 다시 읽는 것은 여기가 처음이다.
   ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`) /
      ③ 거슬러 오르기를 마치기 전 [친구와 활동] 무시(순서) / ④ 이미 놓인 일 재선택 — 판 불변 /
      ⑤ 바로 앞이 아닌 더 앞의 일 — 판 불변 / ⑥ [친구와 활동] 전 마무리 무시(순서) /
      ⑦ 거슬러 오르기를 마친 뒤 사건 단추 재클릭 무시 / ⑧ 안내 표시 중 재클릭 무시(`rvBusy`).
   ⚠️ 전량 고정 리터럴 — 난수 0. 발문은 `.rv-q`로 떼어 전 단계 상시 노출. */

  '군대의 힘으로 정부를 바꾼 일이에요',

];
const RV_FIN_OK = 2;                              // 교과서 본문 원문

function rvTop(){ return RV_EV.length-1; }                              // 판에 처음부터 놓인 줄 = 결과
function rvNeed(st){ return rvTop()-1-st.rvStep; }                      // 지금 찾아야 할 「바로 앞의 일」
function rvWalked(st){ return st.rvStep>=rvTop(); }                     // 맨 앞까지 거슬러 올랐는가
function rvPlaced(st){                                                  // 판에 놓인 줄 — 결과에서 원인 쪽으로
  const a=[]; for(let k=0;k<=st.rvStep;k++) a.push(rvTop()-k); return a; }
function rvOrder(st){ const a=rvPlaced(st); return st.rvFlip ? a.slice().reverse() : a; }

/* 판 — 다섯 자리. 뒤집기 전에는 위가 결과·아래로 갈수록 과거이고, 뒤집으면 위가 원인이 된다.
   ⚠️ 아직 놓이지 않은 자리에는 글자를 두지 않는다(미리 흘리지 않는다). */
function rvCanvas(st){
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>`;
  const head = st.rvFlip
    ? '이제 원인에서 결과로 — 하나의 흐름이에요'
    : (rvWalked(st) ? '맨 앞까지 거슬러 올랐어요' : `거슬러 오른 걸음 ${st.rvStep} / ${rvTop()}`);
  g+=`<text x="160" y="22" font-size="10.6" fill="#1E3A8A" text-anchor="middle" font-weight="800">${head}</text>`;
  const ord=rvOrder(st);
  for(let i=0;i<RV_EV.length;i++){
    const y=30+i*40, ev=ord[i];
    if(ev==null){
      g+=`<rect x="12" y="${y}" width="296" height="34" rx="7" fill="#fff" stroke="#CBD5E0" stroke-width="1.3" stroke-dasharray="4 3"/>`;
      continue;
    }
    const first = !st.rvFlip && i===0;
    g+=`<rect data-row="${ev}" x="12" y="${y}" width="296" height="34" rx="7" fill="${first?'#DCFCE7':'#DBEAFE'}" stroke="${first?'#16A34A':'#1D4ED8'}" stroke-width="1.6"/>`;
    g+=`<text x="22" y="${y+21}" font-size="8.6" fill="${first?'#166534':'#1E3A8A'}" font-weight="800">${RV_DATE[ev]}</text>`;
    g+=`<text x="196" y="${y+21}" font-size="9" fill="#1E3A8A" text-anchor="middle" font-weight="800">${RV_EV_S[ev]}</text>`;
  }
  for(let i=0;i<RV_EV.length-1;i++){
    const y=30+i*40+34, on=(ord[i]!=null && ord[i+1]!=null);
    if(!on) continue;
    const d=st.rvFlip?'fwd':'back';
    g+=`<path data-arrow="${d}" d="M154 ${y+1} L166 ${y+1} L160 ${y+5} Z" fill="#94A3B8"/>`;
    g+=`<text x="200" y="${y+5}" font-size="7.4" fill="#94A3B8" font-weight="800">${st.rvFlip?'그 뒤에':'그 앞에'}</text>`;
  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function rvPanel(st){
  const done = st.rvFin!=null, walked=rvWalked(st), issued=st.rvIssue!=null;

        : '판 맨 위에 <b>결과</b>가 놓여 있어요. 그 <b>앞</b>에는 무슨 일이 있었나요?'));

    right+=`<div class="dw-card"><div class="pt">\uD83D\uDD01 판이 방향을 뒤집었어요</div>
      <div>거꾸로 되짚어 찾은 다섯 가지 일을 이제 <b>원인에서 결과로</b> 다시 읽어 봐요.

      `<button class="${st.rvWrongF===k?'no':''}" onclick="rvFinish(${k})">${f}</button>`).join('')}</div>`;

    right+=`<div class="rv-src">맨 아래에 <b>대구 학생 시위</b>가 놓였고, 그 뒤 <b>3·15 부정 선거</b>가 있었어요.</div>`;

  } else {
    right+=`<div class="dw-step">\u23EA 그 앞의 일 찾기</div>`;
    right+=`<div class="rv-list">${RV_EV.map((e,i)=>{
      const placed = rvPlaced(st).indexOf(i)>=0;

      return `<button class="${cls}" onclick="rvPickRow(${i})"><span class="rv-date">${RV_DATE[i]}</span> ${e}</button>`;
    }).join('')}</div>`;
  }
  if(st.rvMsg) right+=`<div class="dw-msg${st.rvWarn?' warn':''}">${st.rvMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\u23EA 결과에서 시작해 그 앞의 일을 하나씩 거슬러 올라가요</b></div>

      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

// 16 정리: 요약 — 7차시 주요 내용 정리 원문
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">①</span><div><b style="color:var(--green)">4·19 혁명의 원인</b> — 3·15 부정 선거예요.</div></div>
    <div class="sum-item"><span class="n">②</span><div><b style="color:var(--green)">전개 과정</b> — 부정 선거가 일어나고, 시민들이 선거 무효를 주장하며 시위를 벌였어요.</div></div>
    <div class="sum-item"><span class="n">③</span><div><b style="color:var(--green)">번져 간 시위</b> — 고등학생 김주열을 잃은 일이 알려지며 시위가 전국으로 퍼졌고, 4월 19일 여러 도시에서 시위가 일어났어요.</div></div>
    <div class="sum-item"><span class="n">④</span><div><b style="color:var(--green)">결과</b> — 이승만이 대통령 자리에서 물러났고, 3·15 부정 선거는 무효가 됐어요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b>의의</b> — 시민과 학생의 힘으로 민주적 절차를 무시한 정권을 무너뜨려, 우리나라 민주주의 발전에 밑거름이 됐어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">5·18 민주화 운동</b>과 그 노력을 알아봐요.</div></div>`});
// 17 정리: 자기 평가 — 학습 목표 기준 3항
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"4·19 혁명이 일어난 원인을 말할 수 있어요",st)}
    ${selfCheck(1,"4·19 혁명이 어떻게 전개됐는지 차례대로 말할 수 있어요",st)}
    ${selfCheck(2,"4·19 혁명의 의의를 설명할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">5·18 민주화 운동</b>과 민주화를 위한 사람들의 노력!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u1_l05";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  rvStep:0, rvIssue:null, rvFin:null, rvFlip:false,
  rvWrongR:null, rvWrongI:null, rvWrongF:null,
  rvMsg:null, rvWarn:false, rvBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function rvRender(){ main.innerHTML = slides[state.idx].render(state); }
function rvHold(msg){
  state.rvWarn=true; state.rvBusy=true; state.rvMsg=msg;
  playThud(); rvRender();
  setTimeout(()=>{ state.rvBusy=false; state.rvWarn=false; state.rvMsg=null;
    state.rvWrongR=null; state.rvWrongI=null; state.rvWrongF=null; rvRender(); },1600);
}

/* ① · ② 거슬러 오르기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   판은 결과 한 줄이 놓인 채로 시작하고, 받는 것은 **바로 앞의 일** 하나뿐이다.
   어긋난 일을 골라도 알맞은 일의 이름·날짜를 말하지 않고 **방향만** 알려 준다. */
function rvPickRow(i){
  if(state.rvFin!=null) return;                                        // 가드①
  if(state.rvBusy) return;                                             // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=RV_EV.length) return;           // 가드②
  if(rvWalked(state)) return;                                          // 가드⑦ 다 거슬러 오른 뒤 재클릭 무시
  const need = rvNeed(state);
  if(i>need){                                                          // 가드④ 이미 판에 놓인 일
    state.rvWrongR=i; rvHold(RV_ALREADY); return;
  }
  if(i<need){                                                          // 가드⑤ 더 앞의 일 — 방향만 안내
    state.rvWrongR=i; rvHold(RV_BACK); return;
  }
  state.rvStep++; state.rvWrongR=null; state.rvWarn=false;
  state.rvMsg = RV_WHY[need];
  playChime(); rvRender();
}

/* ③ [친구와 활동] — 부정 선거가 이뤄지면 생기는 문제 */
function rvPickIssue(k){
  if(state.rvFin!=null) return;                                        // 가드①
  if(state.rvBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=RV_ISSUE.length) return;        // 가드②
  if(!rvWalked(state)) return;                                         // 가드③ 거슬러 오르기 전 무시(순서)
  if(state.rvIssue!=null) return;
  if(k===RV_ISSUE_OK){
    state.rvIssue=k; state.rvWrongI=null; state.rvWarn=false;
    state.rvMsg = '부정한 선거는 <b>국민의 뜻</b>을 담지 못해요. 그래서 시민들이 거리로 나섰지요.';
    playChime(); rvRender(); return;
  }
  state.rvWrongI=k;
  rvHold(RV_ISSUE_NO[k]);
}

/* ④ 마무리 — 핵심 질문 「4·19 혁명의 의의」. ★ 확정하면 판이 방향을 뒤집는다. */
function rvFinish(k){
  if(state.rvFin!=null) return;                                        // 가드①
  if(state.rvBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=RV_FIN.length) return;          // 가드②
  if(state.rvIssue==null) return;                                      // 가드⑥ [친구와 활동] 전 무시(순서)
  if(k===RV_FIN_OK){
    state.rvFin=k; state.rvFlip=true;                                  // ★ 판이 뒤집히는 유일한 자리
    state.rvWrongF=null; state.rvMsg=null; state.rvWarn=false;
    playChime(); rvRender(); return;
  }
  state.rvWrongF=k;
  rvHold(k===0
    ? '4·19 혁명을 이끈 것은 <b>시민과 학생</b>이에요. 힘으로 누른 일이 아니에요.'
    : '<b>초등학생부터 대학교수까지</b> 각계각층의 사람들이 함께 참여한 일이에요.');
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l06_오일팔민주화운동.html'; } // l05 → l06 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

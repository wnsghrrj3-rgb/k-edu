직접조작: 두 가지로 읽히는 판(45번째 신규 패턴 — 같은 자리가 눈에 따라 글씨도 되고 그림도 되는 형)
  ⭐ 앞의 마흔네 종에서 **판의 한 자리는 언제나 한 가지 뜻이었다.**
     채워졌거나 비었거나, 밝은 줄이거나 그늘이거나 — 자리마다 뜻이 하나였다.
     l09에서 한 걸음이 두 자리를 만들었지만 **그 둘은 서로 다른 자리**였다.
     이번만 **같은 자리가 두 가지로 읽힌다** — 판에 「보는 눈」이 있어,
     글씨 눈으로 보면 획이 진하게 읽히고, 그림 눈으로 보면 **같은 획**이 장면 속에 묻힌다.
     까닭은 교과서가 그렇게 적었기 때문이다 — 「숨긴 글씨를 진하게 나타내고,
     나머지 부분은 색칠해 그림을 완성합니다」. 숨은 글씨 그림은 **지우는 그림이 아니라 묻는 그림**이다.
  ⭐ **판이 두 벌 있지 않다.** 이것은 문구가 아니라 구조다 —
     글씨 판과 그림 판을 따로 담는 상태가 아예 없고(`state.hgWord`·`hgPic`·`hgTwo` 부재),
     `hgCell(st,i)` 한 자리가 눈 하나(`st.hgEye`)만 받아 두 모습을 다 그린다.
     그래서 눈을 바꿔도 **놓인 장면 수와 글자는 달라질 수 없다.**
  ⭐ **눈을 바꾸는 것으로는 아무것도 진행되지 않는다.** 앞의 마흔네 종에서
     판의 모습이 달라지는 것은 언제나 **진행**이었다 — 칸이 채워졌고, 막대가 자랐고, 물음표가 생겼다.

지도서 근거(13차시 p.108~109):
  [학습 목표] 「평화 통일을 위한 노력, 민주화와 산업화」에서 공부한 내용을 바탕으로
    창의·융합 활동을 할 수 있다.
  [동기 유발] 「평화 통일을 위한 노력, 민주화와 산업화」에서 공부한 내용은 무엇인가요?
    → 분단의 아픔을 간직한 장소를 찾아보고, 평화의 장소로 바꾸기 위한 노력을 살펴봤습니다. /
      평화 통일을 위해 우리가 할 수 있는 일을 실천했습니다. /
      우리나라의 민주주의가 어떻게 발전하였는지 주요 사건을 중심으로 살펴봤습니다. /
      시대별로 우리나라의 산업이 어떻게 발전했는지 살펴봤습니다.
  [학습 문제] 단원에서 공부한 내용을 바탕으로 창의·융합 활동을 해 봅시다.
  [전개] 숨은 글씨 그림이란 무엇일까요?
    → 사건에 어울리는 글씨를 떠올리고, 떠오르는 장면 속에 글씨를 숨겨 그림을 그리는 활동입니다.
  [전개] 이 단원에서 인상 깊었거나 흥미로웠던 역사적 사건은 무엇인가요?
    → 6·25 전쟁과 통일이 떠오릅니다. / 3·15 부정 선거의 무효를 주장한 4·19 혁명이 떠오릅니다. /
      대통령 직선제를 끌어낸 6월 민주 항쟁이 떠오릅니다.
  [전개] 내가 선택한 역사적 사건과 관련해서 생각나는 단어를 떠올려 봅시다.
    → 6·25 전쟁을 생각하면 피란이나 희생이 떠오릅니다. /
      4·19 혁명을 떠올리면 선거나 시위, 눈물 등이 떠오릅니다.
  [전개] 숨은 글씨 그림을 그리려면 어떻게 해야 할까요?
    → 내가 생각한 단어 중에서 그림을 표현할 단어를 정합니다. /
      단어와 어울리는 그림을 그려 보며, 글씨를 어떻게 숨길 수 있을지 생각해 봅니다. /
      숨은 글씨를 진하게 나타내고, 나머지 부분은 채색합니다.
  [교과서 이렇게 해 봐요] ① 이 단원에서 공부한 역사적 사건 중 하나를 쓰고, 그와 관련 있는 단어를 씁니다.
    ② 그림으로 표현할 단어를 정하고, 글씨에 그림을 어떻게 그릴지 생각합니다.
    ③ 숨긴 글씨를 진하게 나타내고, 나머지 부분은 색칠해 그림을 완성합니다. / 준비물 = 색칠 도구.
  [교과서 예시] 역사적 사건 6월 민주 항쟁 · 숨은 글씨 시위 —
      「6월 민주 항쟁에서 시위하던 시민들의 모습이 생각나서 ‘시위’라는 글씨에 그림을 그렸어요.」
    역사적 사건 6월 민주 항쟁 · 숨은 글씨 선거 —
      「6월 민주 항쟁의 결과 대통령 직선제가 시행돼서 ‘선거’라는 글씨에 그림을 그렸어요.」
  [예시 답안 1] 역사적 사건 4·19 혁명 / 6월 민주 항쟁 · 숨은 글씨 혁명 / 분노 · 그림 설명 =
      「학생들이 거리로 나와 민주주의를 외치는 4·19 혁명의 모습을 그림.」 /
      「정부의 독재에 분노하고 직선제를 요구하는 모습을 그림.」
  [교과서 활동 2] 친구들의 그림에서 숨은 글씨를 찾고 느낀 점을 써 봅시다.
    예시 답안 2 = 숨은 글씨 혁명 「여러 사람을 이용해 글자를 숨긴 것이 재밌었다.」 /
      숨은 글씨 분노 「사람들이 마스크를 쓴 장면을 글씨로 바꾼 것이 흥미로웠다.」
  [전개] 그림을 완성하고 친구들에게 작품을 설명해 봅시다.
  [전개] 친구들의 작품을 살펴보면서 느낀 점을 이야기해 봅시다.
    → 우리 반 친구들의 아이디어가 정말 놀랍고, 역사적 사건에 관해 다시 생각해 볼 수 있는
      뜻깊은 시간이었습니다.
  [지도 방법] 관련 있는 사건 중 하나를 선정하여 떠오르는 장면을 생각해 보도록 한다. /
    떠올린 장면을 그림으로 어떻게 나타낼 것인지 생각해 보고, 관련 있는 글씨를 어떻게 숨길지 고민한다. /
    숨은 글씨를 활용하여 그림을 완성하고, 친구들의 작품과 비교해 보도록 한다. /
    친구들의 작품 속에 숨어 있는 글씨를 발견해 보고, 인상 깊었던 점을 발표해 보도록 한다.
  [차시 예고] 다음 시간에는 「평화 통일을 위한 노력, 민주화와 산업화」에서 공부한 내용을 정리해 보겠습니다.
⚠️ 정직 원칙 네 곳:
  ㉠ **판의 그림 설명 넷은 교과서 예시 둘과 지도서 예시 답안 둘의 원문이다.**
     지어낸 작품은 한 자리도 두지 않았다. 그래서 자리가 정확히 넷이다 — 더 만들 수 있었지만 만들지 않았다.
  ㉡ **설명 속에 정답 글씨가 그대로 들어 있는 자리가 셋 있다**(시위·혁명·분노).
     원문을 고쳐서 어려움을 만들지 않는다 — 교과서 [이렇게 해 봐요] ①이 이미
     「사건을 쓰고 그와 관련 있는 단어를 쓴다」이므로, 설명에서 낱말을 뽑는 것이 **활동 그 자체**다.
     대신 **적용 문항 둘은 글자를 맞춰서는 풀 수 없는 자리**(조작 직결)로 세웠다.
  ㉢ **친구 이름은 두지 않는다** — 예시 답안 2의 김○○·이□□는 활동지의 빈칸 예시이므로
     「친구가 남긴 느낀 점」으로만 쓴다(학생 이름 0 규약 승계).
  ㉣ **판이 그리는 장면은 사람 형상이 아니라 도식이다** — 시위·거리의 사람들은
     막대와 손팻말·말풍선 같은 도형으로만 나타낸다(l09 정서 규약 승계).

.ka-lb{background:#F1F5F9;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-family:inherit;
  font-weight:700;color:var(--muted);font-size:clamp(11px,1.9vw,13px);display:flex;align-items:center;gap:6px}
.ka-lb svg{width:14px;height:14px}
.ka-bar{flex:1;height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden}
.ka-bar>div{height:100%;background:var(--green);border-radius:99px;transition:width .35s ease;width:5%}
.ka-pg{font-size:clamp(11px,1.9vw,13px);color:var(--muted);font-weight:700;min-width:46px;text-align:right}
.ka-sc{display:flex;align-items:center;gap:3px;background:var(--amber-bg);border-radius:99px;padding:5px 11px}
.ka-sc svg{width:15px;height:15px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;color:var(--amber);font-size:clamp(14px,2.4vw,17px)}
.ka-sc-u{font-size:11px;color:var(--amber);font-weight:700}

/* 메인 */
.ka-m{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:4px 2px}
.ka-tags{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ka-bg{display:inline-flex;align-items:center;gap:5px;background:var(--bub);color:var(--green-d);
  border-radius:99px;padding:5px 12px;font-size:clamp(11px,1.9vw,13px);font-weight:700}
.ka-bg svg{width:13px;height:13px}
.ka-bg.s2{background:#E0F2FE;color:#075985}
.ka-bg.s3{background:#DCFCE7;color:#166534}
.ka-bg.s4{background:#FEF3C7;color:#92400E}
.ka-bg.s5{background:#F3E8FF;color:#6B21A8}
.ka-meta{font-size:clamp(10px,1.7vw,12px);color:#94A3B8;font-weight:600}
.ka-t{font-size:clamp(19px,3.4vw,27px);font-weight:700;line-height:1.4;margin-bottom:10px}
.ka-bub{background:var(--bub);border-radius:14px;padding:13px 18px;font-size:clamp(14px,2.4vw,18px);
  line-height:1.7;margin-bottom:12px}
.ka-emph{color:var(--green-d);font-weight:700}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.scene.wide{width:clamp(240px,44vw,420px)}
.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(15px,2.6vw,20px);font-weight:700;line-height:1.6;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%}
.opt{background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;
  font-family:inherit;font-size:clamp(13px,2.2vw,16.5px);font-weight:500;text-align:left;line-height:1.5;transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:#16A34A;background:#DCFCE7;font-weight:700}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:11px;border-radius:12px;padding:12px 16px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;animation:fadeUp .3s ease both}
.fb.ok{background:#DCFCE7;color:#166534;font-weight:700}
.hint{margin-top:9px;background:var(--amber-bg);border-radius:11px;padding:10px 14px;
  font-size:clamp(12.5px,2.1vw,15px);color:var(--amber);line-height:1.55}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:11px 15px;
  font-size:clamp(13px,2.2vw,16.5px);line-height:1.6}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 두 가지로 읽히는 판(같은 자리가 눈에 따라 글씨도 되고 그림도 되는 형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.hg-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:var(--bub);border-radius:9px;padding:7px 11px;line-height:1.45}
.hg-list{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto}
.hg-list button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.4px,1.75vw,12.8px);transition:.15s;
  text-align:left;line-height:1.45}
.hg-list button:hover{border-color:var(--green);background:var(--bub)}
.hg-list button.ok{border-color:var(--cyan);background:#EFF6FF;color:#93A9C9}
.hg-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.hg-list button:disabled{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0;cursor:default}
.hg-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.hg-row button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:7px 6px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--ink);font-size:clamp(10.4px,1.75vw,12.6px);transition:.15s;line-height:1.35}
.hg-row button:hover{border-color:var(--green);background:var(--bub)}
.hg-row button.on{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.hg-row button.ok{border-color:#E2E8F0;background:#F8FAFC;color:#CBD5E0}
.hg-row button:disabled{cursor:default}

.hg-fin{display:flex;flex-direction:column;gap:5px}
.hg-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.hg-fin button:hover{background:var(--bub)}
.hg-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.hg-eye{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.hg-eye button{border:2px dashed #94A3B8;background:#fff;border-radius:9px;padding:6px 6px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--muted);font-size:clamp(10.2px,1.72vw,12.4px);transition:.15s;line-height:1.35}
.hg-eye button:hover{border-color:var(--green);background:var(--bub)}
.hg-eye button.on{border-style:solid;border-color:var(--green);background:var(--bub);color:var(--green-d)}
.hg-eyecap{font-size:clamp(9.6px,1.62vw,11.6px);color:var(--muted);line-height:1.45}


.hg-log{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto}
.hg-log div{background:#F8FAFC;border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:8px;
  padding:6px 9px;font-size:clamp(10.2px,1.72vw,12.4px);line-height:1.45;color:#334155}
.hg-log div b{color:var(--green-d)}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#075985;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(29,78,216,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="goHub()">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>
      <span>차시 목록</span>
    </button>
    <div class="ka-bar"><div id="bar"></div></div>
    <div class="ka-pg" id="pg">1 / 18</div>
    <div class="ka-sc">
      <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#B45309"/></svg>
      <span class="ka-sc-n" id="score">0</span><span class="ka-sc-u">점</span>
    </div>
  </div>

  <div class="ka-m" id="main"></div>

  <div class="ka-f">
    <button class="ka-nav ka-nav-prev" id="prev" onclick="prev()">← 이전</button>
    <button class="ka-nav mob-hide" id="listen" disabled title="음성은 준비 중이에요">
      <svg viewBox="0 0 16 16"><path d="M 3 6 L 3 10 L 6 10 L 10 13 L 10 3 L 6 6 Z" fill="currentColor"/><path d="M 12 5 Q 14 8 12 11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      다시 듣기
    </button>
    <button class="ka-nav" id="hint" onclick="useHint()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="4" fill="currentColor"/><rect x="6" y="9.5" width="4" height="2.5" fill="currentColor"/><rect x="6.5" y="12.5" width="3" height="1" fill="currentColor"/></svg>
      힌트
    </button>
    <button class="ka-nav ka-nav-next" id="next" onclick="next()">다음 →</button>
  </div>
</div>



<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====

   ⚠️ 정서 원칙 — 사람 형상 대신 막대·손팻말·말풍선 같은 도형으로만 그린다(l09 규약 승계).
      친구의 작품을 견주어 잘잘못을 매기지 않는다. */

    <text x="236" y="65" font-size="7.8" fill="#1E3A8A" text-anchor="middle" font-weight="800">우리가 할 수 있는 일 실천</text>

    <text x="84" y="117" font-size="7.8" fill="#1E3A8A" text-anchor="middle" font-weight="800">주요 사건을 중심으로</text>

    <text x="236" y="117" font-size="7.8" fill="#1E3A8A" text-anchor="middle" font-weight="800">어떻게 발전했는지</text>
    <text x="160" y="152" font-size="9" fill="#94A3B8" text-anchor="middle">오늘은 공부한 내용으로 창의·융합 활동을 해요</text>

  // 2 숨은 글씨 그림이란 — 같은 획이 두 가지로 읽힌다
  hidden:`<svg viewBox="0 0 320 176"><rect width="320" height="176" fill="#F8FAFC"/>
    <text x="160" y="22" font-size="11" fill="#1E3A8A" text-anchor="middle" font-weight="800">글씨를 장면 속에 숨겨 그리는 활동이에요</text>

    </svg>`,
  // 3 [이렇게 해 봐요] 3단계 + 준비물

/* ===== 직접조작 — 두 가지로 읽히는 판(45번째 신규 패턴 —
        같은 자리가 눈에 따라 글씨도 되고 그림도 되는 형) =====
   ⭐ 앞의 마흔네 종에서 **판의 한 자리는 언제나 한 가지 뜻이었다.**
      l09에서 한 걸음이 두 자리를 만들었지만 **그 둘은 서로 다른 자리**였다.
      이번만 **같은 자리가 두 가지로 읽힌다** — 「보는 눈」을 바꾸면
      글씨 눈에서는 획이 진하게 읽히고, 그림 눈에서는 **같은 획**이 장면 속에 묻힌다.
      까닭은 교과서가 「숨긴 글씨를 진하게 나타내고, 나머지 부분은 색칠해 그림을 완성합니다」라고
      적었기 때문이다 — 숨은 글씨 그림은 **지우는 그림이 아니라 묻는 그림**이다.
   ⭐ **판이 두 벌 있지 않다.** 이것은 구조다 — 글씨 판과 그림 판을 따로 담는 상태가 아예 없고,
      `hgCell(st,i)` 한 자리가 눈 하나(`st.hgEye`)만 받아 두 모습을 다 그린다.
   ⭐ **눈을 바꾸는 것으로는 아무것도 진행되지 않는다.** `hgFlip()`은 진행 열쇠
      (`hgLay`·`hgSel`·`hgRead`·`hgFin`·점수)를 한 자리도 건드리지 않는다.
      앞의 마흔네 종에서 판의 모습이 달라지는 것은 언제나 진행이었다.
   ⭐ **눈은 어느 시점에도 잠기지 않는다** — 마무리를 확정한 뒤에도 두 눈으로 다시 볼 수 있다.
      완성한 그림을 두 가지로 읽는 것이 이 활동의 결과물이기 때문이다(가드① 밖).
   ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금(눈은 예외) / ② 무효 번호(`Number.isInteger`) /
      ③ 자리를 고르기 전 카드 무시(순서) / ④ 이미 채운 자리 재선택 무시 — 판 불변 /
      ⑤ 어긋난 카드 — 판 불변(놓인 장면·고른 자리·눈 세 갈래) /
      ⑥ 네 자리를 다 채우기 전 읽기 무시(순서) / ⑦ 읽기 전 마무리 무시·읽기 확정 뒤 재읽기 무시 /
      ⑧ 안내 표시 중 재클릭 무시(`hgBusy`) — 눈은 예외.
   ⚠️ 전량 고정 리터럴 — 난수 0. 발문은 `.hg-q`로 떼어 전 단계 상시 노출.
   ⚠️ opbody 분리자는 `const HG_N = 4;` — 스칼라라 `HG_WORD`·`HG_WHY` 같은 파생 접두 충돌이 없다
      (l03·l04·l09 규약 승계). */
const HG_N = 4;

/* 숨은 글씨 넷 — 판에 처음부터 진하게 놓여 있다(교과서 ③ 「숨긴 글씨를 진하게」).
   전량 교과서 예시 둘 + 지도서 예시 답안 둘의 원문. 지어낸 작품 0(정직 원칙 ㉠). */
const HG_WORD = ['시위','선거','혁명','분노'];

/* 보기 차례 — 자리마다 다르게 두어 정답 자리가 [3,1,0,2]로 갈린다. */

/* 장면을 놓았을 때 판이 하는 말 — ★ 눈을 바꿔 보라고 권하되 강요하지 않는다. */

function hgBit(i){ return 1<<i; }
function hgCount(m){ let n=0; for(let i=0;i<HG_N;i++){ if(m & hgBit(i)) n++; } return n; }
function hgAllLaid(st){ return hgCount(st.hgLay)===HG_N; }
function hgPhase(st){ return hgAllLaid(st) ? (st.hgRead==null ? 'read' : 'fin') : 'lay'; }

/* ★ 같은 자리를 두 모습으로 그리는 단 하나의 자리.
   ⚠️ 글씨 판·그림 판을 따로 담지 않는다 — 눈(`eye`) 하나만 받는다.

function hgCell(st,i){
  const x = 14 + 152*(i%2), y = 52 + 78*Math.floor(i/2), w = 140, h = 70;

      g+=`<rect x="${x+22}" y="${y+24}" width="24" height="10" rx="2" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>`;
      g+=`<rect x="${x+94}" y="${y+22}" width="24" height="10" rx="2" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>`; }
    if(i===1){ g+=`<rect x="${x+40}" y="${y+38}" width="60" height="22" rx="4" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.2"/>`;
      g+=`<path d="M${x+58} ${y+38} L${x+82} ${y+38}" stroke="#60A5FA" stroke-width="2"/>`;
      g+=`<rect x="${x+62}" y="${y+24}" width="16" height="12" rx="2" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>`; }
    if(i===2){ g+=`<path d="M${x+12} ${y+58} L${x+128} ${y+58}" stroke="#93C5FD" stroke-width="2.4"/>`;
      g+=`<path d="M${x+24} ${y+58} L${x+24} ${y+36} M${x+44} ${y+58} L${x+44} ${y+32} M${x+64} ${y+58} L${x+64} ${y+38} M${x+84} ${y+58} L${x+84} ${y+32} M${x+104} ${y+58} L${x+104} ${y+36}" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>`; }
    if(i===3){ g+=`<rect x="${x+14}" y="${y+26}" width="34" height="16" rx="7" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>`;
      g+=`<rect x="${x+54}" y="${y+22}" width="34" height="16" rx="7" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>`;
      g+=`<rect x="${x+94}" y="${y+26}" width="34" height="16" rx="7" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>`;
      g+=`<path d="M${x+22} ${y+58} L${x+22} ${y+46} M${x+70} ${y+58} L${x+70} ${y+42} M${x+118} ${y+58} L${x+118} ${y+46}" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round"/>`; }
    g+=`</g>`;
  }
  /* ★ 글자 — 두 눈 모두에서 같은 자리·같은 글자. 눈에 따라 진하기만 달라진다. */
  g+=`<text data-glyph="${i}" data-ink="${pic?'pic':'word'}" x="${x+w/2}" y="${y+50}" font-size="24" fill="${pic?'#93C5FD':(laid?'#1E3A8A':'#CBD5E0')}" text-anchor="middle" font-weight="800">${HG_WORD[i]}</text>`;
  /* 놓인 장면의 짧은이름 — 글씨 눈에서만 이름표로 읽힌다. */
  if(laid && eye===0){
    g+=`<text data-name="${i}" x="${x+w/2}" y="${y+64}" font-size="7.2" fill="#1E3A8A" text-anchor="middle" font-weight="800">${HG_WHY_S[i]}</text>`;

  if(laid) g+=`<rect data-lay="${i}" x="${x+2}" y="${y+2}" width="4" height="4" rx="1" fill="${pic?'#60A5FA':'#1D4ED8'}"/>`;
  return g;
}

function hgCanvas(st){
  const nL=hgCount(st.hgLay), done = st.hgFin!=null, ph = hgPhase(st);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>`;
  const head = done ? '두 눈으로 다시 읽어 봐도 좋아요'
    : (ph==='fin' ? '마지막 물음이에요'
      : (ph==='read' ? '눈을 바꿔 보고 무엇이 달라지는지 읽어 봐요'
        : (st.hgSel!=null ? `\u300C${HG_WORD[st.hgSel]}\u300D 자리를 골랐어요` : '작품 자리를 하나 골라 봐요')));
  g+=`<text x="160" y="22" font-size="10.4" fill="#1E3A8A" text-anchor="middle" font-weight="800">${head}</text>`;
  g+=`<text data-eye="${st.hgEye}" data-layn="${nL}" x="160" y="40" font-size="8.4" fill="${st.hgEye===1?'#4338CA':'#64748B'}" text-anchor="middle" font-weight="800">보는 눈 \u00B7 ${st.hgEye===1?'그림 눈':'글씨 눈'} \u00B7 장면 ${nL} / ${HG_N}</text>`;
  for(let i=0;i<HG_N;i++){ g+=hgCell(st,i); }
  /* ★ 완성 띠 — 두 눈 읽기를 맞힌 뒤에만 뜬다(코드에 단 한 자리). */
  if(st.hgRead!=null){
    g+=`<rect data-band="1" x="12" y="212" width="296" height="26" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>`;
    g+=`<text x="160" y="229" font-size="8.6" fill="#166534" text-anchor="middle" font-weight="800">${HG_BAND}</text>`;
  } else {
    g+=`<rect x="12" y="212" width="296" height="26" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function hgPanel(st){
  const done = st.hgFin!=null, ph = hgPhase(st);
  const q = done
    ? '같은 자리를 <b>글씨로도, 그림으로도</b> 읽을 수 있어요.'
    : (ph==='fin' ? '친구들의 작품을 살펴보면서 느낀 점은 무엇인가요?'
      : (ph==='read' ? '<b>보는 눈</b>을 바꾸면 판의 자리가 어떻게 달라지나요?'
        : (st.hgSel!=null
          ? `\u300C${HG_WORD[st.hgSel]}\u300D \u2014 이 글씨에는 <b>어떤 장면</b>을 그렸을까요?`
          : '작품 자리를 하나 골라, 그 글씨에 어울리는 <b>그림 설명</b>을 찾아봐요.')));
  let right = `<div class="hg-q">${q}</div>`;

  /* ★ 보는 눈 — 어느 시점에도 잠기지 않는다(가드① 밖). 진행 열쇠를 건드리지 않는다. */
  right+=`<div class="hg-eye">
    <button class="${st.hgEye===0?'on':''}" onclick="hgFlip(0)">\uD83D\uDD24 글씨 눈</button>
    <button class="${st.hgEye===1?'on':''}" onclick="hgFlip(1)">\uD83C\uDFA8 그림 눈</button>
  </div>`;
  right+=`<div class="hg-eyecap">눈을 바꿔도 <b>놓은 장면은 그대로</b>예요 \u2014 같은 자리를 다르게 읽는 것뿐이에요.</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">\uD83C\uDFA8 두 가지로 읽히는 그림</div>
      <div>글자는 <b>어느 눈에서도 지워지지 않았어요.</b> 그림 눈에서는 같은 획이 장면 속에 묻힐 뿐이에요 \u2014
      숨은 글씨 그림은 <b>지우는 그림이 아니라 묻는 그림</b>이니까요.</div>
      <div style="margin-top:5px">눈을 바꾸는 것은 판을 앞으로 나아가게 하지 않아요.
      그래서 <b>다 끝낸 뒤에도</b> 두 눈으로 몇 번이든 다시 볼 수 있어요.</div></div>`;
  } else if(ph==='fin'){
    right+=`<div class="dw-step">\uD83D\uDCDD 오늘의 마무리</div>`;
    right+=`<div class="hg-fin">${HG_FIN.map((f,k)=>
      `<button class="${st.hgWrongF===k?'no':''}" onclick="hgFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(ph==='read'){
    right+=`<div class="dw-step">\uD83D\uDC40 두 눈으로 읽기</div>`;
    right+=`<div class="hg-fin">${HG_READ.map((r,k)=>
      `<button class="${st.hgWrongR===k?'no':''}" onclick="hgReadPick(${k})">${r}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">\uD83D\uDD8C\uFE0F 장면 놓기 \u00B7 ${hgCount(st.hgLay)} / ${HG_N}</div>`;
    right+=`<div class="hg-row">${HG_WORD.map((s,i)=>{
      const filled = st.hgLay & hgBit(i);
      return `<button class="${filled?'ok':''}${st.hgSel===i?' on':''}" ${filled?'disabled':''} onclick="hgTake(${i})">${s}${filled?' \u2713':''}</button>`;
    }).join('')}</div>`;
    if(st.hgSel!=null){
      const ord = HG_WHY_ORD[st.hgSel];
      right+=`<div class="hg-list">${ord.map((owner,k)=>
        `<button class="${st.hgWrong===k?'no':''}" onclick="hgPut(${k})">${HG_WHY[owner]}</button>`).join('')}</div>`;
    }
  }
  if(st.hgMsg) right+=`<div class="dw-msg${st.hgWarn?' warn':''}">${st.hgMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDFA8 같은 자리가 눈에 따라 글씨도 되고 그림도 돼요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${hgCanvas(st)}<div class="cvcap">교과서 예시와 예시 답안을 나타낸 도식이에요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u1_l10";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  hgLay:0, hgSel:null, hgEye:0, hgRead:null, hgFin:null,
  hgWrong:null, hgWrongR:null, hgWrongF:null,
  hgMsg:null, hgWarn:false, hgBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function hgRender(){ main.innerHTML = slides[state.idx].render(state); }
/* ⚠️ 경고 경로 — 어긋난 카드에만 쓴다. 판은 이 경로에서 한 자리도 달라지지 않는다. */
function hgHold(msg){
  state.hgWarn=true; state.hgBusy=true; state.hgMsg=msg;
  playThud(); hgRender();
  setTimeout(()=>{ state.hgBusy=false; state.hgWarn=false; state.hgMsg=null;
    state.hgWrong=null; state.hgWrongR=null; state.hgWrongF=null; hgRender(); },1600);
}

/* ★★ 보는 눈 — 이 패턴의 핵심 신규성이다.
   진행 열쇠(`hgLay`·`hgSel`·`hgRead`·`hgFin`·점수)를 한 자리도 건드리지 않는다.
   ⚠️ 가드①(확정 후 잠금)·가드⑧(안내 중 잠금) **밖에 있다** — 눈은 어느 시점에도 잠기지 않는다.
   앞의 마흔네 종에서 판의 모습이 달라지는 것은 언제나 진행이었다. 여기서만 진행 없이 모습만 달라진다. */
function hgFlip(e){
  if(!Number.isInteger(e) || e<0 || e>1) return;                        // 가드②
  if(state.hgEye===e) return;
  state.hgEye=e;
  playBlip(); hgRender();
}

/* ① 자리 고르기 — 판정 없음(어느 자리부터 채워도 된다). */
function hgTake(i){
  if(state.hgFin!=null) return;                                        // 가드①
  if(state.hgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=HG_N) return;                    // 가드②
  if(state.hgLay & hgBit(i)) return;                                   // 가드④ 이미 채운 자리 재선택 무시
  state.hgSel=i; state.hgMsg=null; state.hgWarn=false; state.hgWrong=null;
  playBlip(); hgRender();
}

/* ② 장면 놓기 — 맞히면 그 자리에 장면이 입혀진다.
   ⚠️ 글자는 이 함수가 그리지 않는다 — 글자는 처음부터 끝까지 판에 있다(교과서 ③).
   ⚠️ 어긋난 카드에는 판이 한 자리도 달라지지 않는다(가드⑤). */
function hgPut(k){
  if(state.hgFin!=null) return;                                        // 가드①
  if(state.hgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HG_N) return;                    // 가드②
  if(state.hgSel==null) return;                                        // 가드③ 자리를 고르기 전 카드 무시
  const e = state.hgSel;
  if(state.hgLay & hgBit(e)) return;                                   // 가드④
  const owner = HG_WHY_ORD[e][k];
  if(owner===e){
    state.hgLay |= hgBit(e);                                           // ★ 장면이 입혀지는 유일한 자리
    state.hgSel=null; state.hgWrong=null; state.hgWarn=false;
    state.hgMsg = HG_OK[e];
    playChime(); hgRender(); return;
  }
  state.hgWrong=k;                                                     // 가드⑤ 판 불변
  hgHold(`그것은 <b>${HG_WORD[owner]}</b> 자리의 설명이에요. 이 글씨의 설명을 다시 찾아봐요.`);
}

/* ③ 두 눈 읽기 — 조작 직결. 네 자리를 다 채워야 열린다. */
function hgReadPick(k){
  if(state.hgFin!=null) return;                                        // 가드①
  if(state.hgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HG_READ.length) return;          // 가드②
  if(!hgAllLaid(state)) return;                                        // 가드⑥ 네 자리 전 읽기 무시(순서)
  if(state.hgRead!=null) return;                                       // 가드⑦ 읽기 확정 뒤 재읽기 무시
  if(k===HG_READ_OK){
    state.hgRead=k; state.hgSel=null;
    state.hgWrongR=null; state.hgMsg=null; state.hgWarn=false;
    playChime(); hgRender(); return;
  }
  state.hgWrongR=k;
  hgHold(k===0
    ? '두 눈으로 번갈아 봐요 \u2014 <b>글자는 지워지지 않았어요.</b>'
    : '글자가 <b>다른 글자로 바뀌지는 않았어요.</b> 같은 획을 다시 봐요.');
}

/* ④ 마무리 — 지도서 정리 예시 답안. 두 눈 읽기를 맞혀야 열린다. */
function hgFinish(k){
  if(state.hgFin!=null) return;                                        // 가드①
  if(state.hgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HG_FIN.length) return;          // 가드②
  if(state.hgRead==null) return;                                       // 가드⑦ 읽기 전 마무리 무시(순서)
  if(k===HG_FIN_OK){
    state.hgFin=k; state.hgSel=null;
    state.hgWrongF=null; state.hgMsg=null; state.hgWarn=false;
    playChime(); hgRender(); return;
  }
  state.hgWrongF=k;
  hgHold(k===0
    ? '같은 사건이라도 친구마다 <b>떠올린 장면이 달랐어요.</b> 판의 네 자리를 다시 봐요.'
    : '숨은 글씨는 꾸미개가 아니라 <b>사건에서 떠올린 낱말</b>이에요.');
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l11 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

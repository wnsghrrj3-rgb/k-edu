영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사07-01] · 교과서 p.12~14 · 지도서(대단원1 **2차시** 분단으로 나타난 문제점을 알아볼까요, 지도서 p.28~31) 근거
학습 목표: 분단으로 나타난 문제점을 설명할 수 있다.
수업 기법 및 전략: 모둠 토의 · 돌아가며 말하기
⚠️ 사회 6-1 첫 차시 — 엔진은 5-1 u3 l01에서 100% 승계하고 색·톤만 6학년 1단원으로 전환했다.
   1단원 색 #1D4ED8(딥블루) — CSS 변수값만 바꾸고 변수명은 그대로 두어 엔진 코드를 무수정 승계한다.

직접조작: 남북 낱말 다리 놓기(36번째 신규 패턴 — 양쪽이 다 놓여야 판이 입을 여는 형)
  ⭐ 앞의 서른다섯 종은 전부 **한 번 누를 때마다 판이 곧바로 답했다.**
     이번만 **한쪽만으로는 판이 아무 판정도 하지 않는다** — 반대쪽을 기다리기만 한다.
     차이는 언제나 둘 사이에 있고, 한쪽 낱말만으로는 무엇이 다른지 견줄 수 없기 때문이다.
  ⭐ 어느 쪽을 먼저 골라도 된다(순서 강제 0). 짝이 아니면 판은 「같은 것을 가리키지 않아요」까지만 말하고
     **어느 쪽이 잘못됐는지는 말하지 않는다.** 두 선택이 남아 있어 **한쪽만 바꿔 다시 댈 수 있다**(부분 교체).
  ⭐ 보기 여섯 가운데 **둘(사탕가루·즉석국수)은 자리가 없다** — 교과서 [스스로 활동]의 보기가 여섯이고
     빈칸이 넷이기 때문이다. 자리 없는 낱말은 **틀렸다고 하지 않고** 「오늘 채울 네 칸에는 들어가지 않아요」라고만 한다.
     ⚠️ 그 둘의 뜻은 교과서에 없으므로 **지어내지 않는다**(정직 원칙).
  ⚠️ 가드 8종 — ① 마무리 확정 후 전체 잠금 / ② 무효 낱말 번호(`Number.isInteger`) /
     ③ 이미 다리가 놓인 낱말 재선택 무시 / ④ 같은 낱말 재클릭 무시 /
     ⑤ **한쪽만 놓였을 때 판정 0**(핵심 신규성) / ⑥ 네 다리 전 마무리 무시(순서) /
     ⑦ 무효 마무리 번호 / ⑧ 안내 표시 중 재클릭 무시(`nbBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.nb-q`로 떼어 전 단계 상시 노출.

지도서 근거(2차시 p.28~31):
  [생각을 열어요] 금강산으로 수학여행을 간 모습(1936년) → 오늘날 갈 수 없는 까닭
    = 남북이 분단되어 왕래할 수 없기 때문 / 남북 관계가 좋지 않아 금강산 관광이 중단됐기 때문.
    ⚠️ 학생들이 자신의 생각을 자유롭게 이야기할 수 있도록 편안한 분위기를 유도한다.
  [학습 문제] 분단으로 나타난 문제점을 알아봅시다.
  [본문] 광복 이후 대한민국 정부와 북한 정권이 각각 수립되며 분단 → 6·25 전쟁을 겪으며 분단이 굳어짐.
    분단으로 고향을 잃은 실향민과 이산가족은 여전히 아픔을 안고 살아감.
    분단 이후 70여 년이 흐르면서 생활 방식과 언어 등의 차이가 커지고 있음.
  [사진] ① 파주 임진각에서 합동 차례를 지내는 실향민 ② 만났다가 다시 헤어지는 이산가족.
  [스스로 활동] 남북 언어 차이 — 보기 6(둥글파·사탕가루·돼지세겹살·가락지빵·과일단물·즉석국수),
    빈칸 4(도넛=가락지빵 · 삼겹살=돼지세겹살 · 주스=과일단물 · 양파=둥글파).
    핵심 질문 = 언어 차이가 계속된다면? → 서로 의사소통하기 어려워진다 / 외국어로 인식할 것 같다.
    ⚠️ 북한에서는 물건의 특징을 순우리말로 많이 표현한다.
  [본문] 북한은 분단 이후 군사적으로 남한을 위협하면서 한반도에 전쟁의 긴장감을 만들어 왔고,
    이에 우리나라는 많은 국방비를 지출하고 있다.
    낱말 — 국방비 = 나라를 지키고 군대를 유지하는 데 드는 모든 비용 /
           국력 = 한 나라가 지닌 정치·경제·문화·군사 등 모든 방면의 힘.
    국방비 그래프 원문값(국방부, 2024.) = 2003 17.5 · 2008 26.6 · 2013 34.3 · 2018 43.1 · 2023 57.0(조 원).
  [미디어 활동] 분단 비용 뉴스 기사 — 군대 유지 비용 / 북한 지역의 풍부한 자원을 활용할 수 없어 생기는 비용 /
    대륙으로 길이 연결되지 않아 멀리 돌아서 가며 생기는 비용 / 이산가족의 아픔 / 약해진 국력.
    ⚠️ 지도 꿀 Tip — 분단 비용을 단순히 경제 논리로만 생각하지 않고 여러 방면에서 다각적으로 생각하게 한다.
  [2차시 주요 내용 정리] ① 실향민과 이산가족의 아픔 ② 차이가 커지는 생활 방식과 언어 등
    ③ 북한의 군사적 위협에 따른 전쟁의 긴장감 ④ 많은 국방비 지출.
  [꼭 기억해요] 1 남북 **분단** 이후 시간이 흐르면서 생활 방식과 **언어** 등의 차이가 커지고 있습니다.
  [정리] 차시 예고 = 분단의 아픔이 담긴 장소 살펴보기.
⚠️ 설계 원칙:
  · **3차시(분단의 아픔이 담긴 장소) 선행 침범 0** — 개별 장소 이름·전시물·답사·평화의 장소 0.
    「분단의 아픔이 담긴 장소」는 **차시 예고 두 자리에서만**.
  · **4차시(평화 통일을 위한 노력) 침범 0** — 정치·사회문화·경제적 노력, 남북 협력, 단일팀 0.
    「평화 통일」은 META 주제명 두 자리에서만.
  · **5~6차시(실천)·7차시 이후(민주화·산업화) 침범 0.**
  · 교사용 참고 자료 0 — 참고 도서, 이산가족 통계 수치, 유형/무형 분단 비용 학술 분류,
    신문사 이름·기사 날짜, 연평도·미사일 등 개별 도발 사건 표기.
  · **문항 내 연도·금액·비율 0** — 국방비 그래프 원문값은 슬라이드에만 두고 문항에서는 묻지 않는다.
  · **우리나라 지역 이름 0**(파주·임진각 포함) · **학생 이름 0**.
  · 정서 — **북한 사람을 적으로 그리지 않는다.** 폐허·무기 그림 0. 문제는 분단이라는 상황이고,
    실향민과 이산가족은 겁주기 위한 소재가 아니라 **아픔을 가진 사람**으로 쓴다.
    조작에서 자리 없는 낱말을 골라도 ‘틀렸다’로 다루지 않는다.

      이번만 **한쪽만으로는 판이 아무 판정도 하지 않는다.** 남한 쪽 낱말 하나만 골라도,
      북한 쪽 낱말 하나만 골라도 판은 옳다고도 틀렸다고도 하지 않고 **반대쪽을 기다린다.**
      판정은 오직 두 쪽이 다 놓였을 때에만 온다.
      까닭은 이 차시가 다루는 것이 낱말이 아니라 **차이**이기 때문이다 —
      차이는 언제나 둘 사이에 있고, 한쪽만으로는 무엇이 다른지 견줄 수 없다.
   ⭐ 어느 쪽을 먼저 골라도 된다(순서 강제 0). 짝이 아니면 판은
      「이 둘은 같은 것을 가리키지 않아요」까지만 말하고 **어느 쪽이 잘못됐는지는 말하지 않는다.**
      두 쪽 선택은 그대로 남아 있어서 **한쪽만 바꿔 다시 대 볼 수 있다**(부분 교체).
   ⭐ 보기 여섯 가운데 **둘은 자리가 없다.** 교과서 [스스로 활동]의 보기가 실제로 여섯이고
      빈칸이 넷이기 때문이다. 자리가 없는 낱말을 대면 판은 틀렸다고 하지 않고
      「오늘 채울 네 칸에는 들어가지 않아요」라고만 말한다 — **틀린 낱말이 아니라 오늘의 칸이 아닌 낱말**이다.
      ⚠️ 이 둘의 뜻은 교과서에 없으므로 **지어내지 않는다**(정직 원칙).
   ① 남한 쪽 / 북한 쪽에서 하나씩 고른다(순서 자유).
   ② 두 쪽이 다 놓이면 판정 — 맞으면 휴전선 위로 다리가 놓이고 사전에 한 줄이 적힌다.
   ③ 네 다리가 놓이면 마무리 3택이 열린다(순서 강제).
      마무리 = 「이 차이가 계속 커지면?」 → 지도서 예시 답안 원문(서로 의사소통하기 어려워진다).
   ⚠️ 남북 낱말과 정답 짝은 **고정 리터럴 — 난수 0.** 레이아웃 측정이 필요 없어 jsdom에서 그대로 검증된다.
   ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 남한·북한 낱말 번호(`Number.isInteger`) /
      ③ 이미 다리가 놓인 낱말 재선택 무시(양쪽) / ④ 이미 고른 같은 낱말 재클릭 무시 /
      ⑤ **한쪽만 놓였을 때 판정 0**(핵심 신규성 — 기다리기만 한다) /
      ⑥ 네 다리가 놓이기 전 마무리 무시(순서) / ⑦ 무효 마무리 번호 /
      ⑧ 안내 표시 중 재클릭 무시(`nbBusy`). 재시도 허용(감점 없음), 조작에 점수 0.
   ⚠️ 발문은 `.nb-q`로 떼어 **전 단계 상시 노출**(5-1 u2 l06 규약 승계). */
const NB_S = ['도넛','삼겹살','주스','양파'];                                   // 남한 쪽 낱말 4 — 교과서 원문
const NB_N = ['둥글파','사탕가루','돼지세겹살','가락지빵','과일단물','즉석국수']; // 북한 쪽 보기 6 — 교과서 원문 그대로
const NB_PAIR = [3,2,4,0];        // 남한 i ↔ 북한 NB_PAIR[i] : 도넛=가락지빵 · 삼겹살=돼지세겹살 · 주스=과일단물 · 양파=둥글파
const NB_NOSEAT = [1,5];          // 오늘 채울 네 칸에 자리가 없는 보기 — 사탕가루 · 즉석국수
const NB_FIN = [
  '남한과 북한 사람들이 저절로 같은 말을 쓰게 돼요',
  '같은 민족인데도 서로 의사소통하기 어려워져요',
  '말이 달라도 아무 일도 생기지 않아요'
];
const NB_FIN_OK = 1;              // 지도서 예시 답안 원문 — 서로 의사소통하기 어려워집니다

function nbNoSeat(j){ return NB_NOSEAT.indexOf(j)>=0; }
function nbDoneS(st,i){ return st.nbBridge.some(b=>b.s===i); }
function nbDoneN(st,j){ return st.nbBridge.some(b=>b.n===j); }

/* 판 — 가운데 휴전선, 왼쪽 남한 쪽, 오른쪽 북한 쪽, 놓인 다리 */
function nbCanvas(st){
  const br=st.nbBridge;
  let g='';
  g+=`<line x1="160" y1="30" x2="160" y2="222" stroke="#CBD5E0" stroke-width="2.6" stroke-dasharray="7 5"/>`;
  g+=`<text x="80" y="22" font-size="11" fill="#1E3A8A" text-anchor="middle" font-weight="800">남한 쪽</text>`;
  g+=`<text x="240" y="22" font-size="11" fill="#1E3A8A" text-anchor="middle" font-weight="800">북한 쪽</text>`;
  for(let k=0;k<4;k++){
    const y=36+k*46, b=br[k];
    if(b==null){
      g+=`<rect x="12" y="${y}" width="120" height="32" rx="8" fill="#fff" stroke="#CBD5E0" stroke-width="1.6" stroke-dasharray="4 3"/>`;
      g+=`<text x="72" y="${y+21}" font-size="9.4" fill="#A0AEC0" text-anchor="middle">빈 칸</text>`;
      g+=`<rect x="188" y="${y}" width="120" height="32" rx="8" fill="#fff" stroke="#CBD5E0" stroke-width="1.6" stroke-dasharray="4 3"/>`;
      g+=`<text x="248" y="${y+21}" font-size="9.4" fill="#A0AEC0" text-anchor="middle">빈 칸</text>`;
    } else {
      g+=`<rect x="12" y="${y}" width="120" height="32" rx="8" fill="#fff" stroke="#1D4ED8" stroke-width="1.9"/>`;
      g+=`<text x="72" y="${y+21}" font-size="10.6" fill="#1E3A8A" text-anchor="middle" font-weight="800">${NB_S[b.s]}</text>`;
      g+=`<rect x="188" y="${y}" width="120" height="32" rx="8" fill="#fff" stroke="#3B82F6" stroke-width="1.9"/>`;
      g+=`<text x="248" y="${y+21}" font-size="10.6" fill="#1E3A8A" text-anchor="middle" font-weight="800">${NB_N[b.n]}</text>`;
      g+=`<path d="M132 ${y+16} L188 ${y+16}" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/>`;
      g+=`<circle cx="160" cy="${y+16}" r="6" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8"/>`;
    }
  }
  g+=`<text x="160" y="238" font-size="10.4" fill="#1E3A8A" text-anchor="middle" font-weight="800">놓은 다리 ${br.length} / 4</text>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function nbPanel(st){
  if(!st.nbBridge) st.nbBridge=[];
  const done = st.nbFin!=null;
  const full = st.nbBridge.length>=4;
  const q = done
    ? '네 다리를 모두 놓았어요.'
    : (full ? '이 차이가 계속 커지면 어떤 일이 벌어질까요?'
            : '같은 것을 가리키는 두 낱말을 양쪽에서 하나씩 골라 봐요.');
  let right = `<div class="nb-q">${q}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">🗣️ 같은 것을 서로 다르게 불러요</div>
      <div>남한과 북한은 <b>같은 말을 쓰던 한민족</b>이에요. 그런데 분단 뒤 <b>70여 년</b>이 흐르는 동안
      같은 것을 서로 다르게 부르게 되었어요.</div>
      <div style="margin-top:5px;color:#64748B">이 차이가 계속 커지면 <b>서로 의사소통하기 어려워져요.</b>
      말만이 아니라 <b>생활 방식</b>의 차이도 함께 커지고 있어요.</div></div>`;
  } else if(full){
    right+=`<div class="nb-fin">${NB_FIN.map((f,k)=>
      `<button class="${st.nbWrongF===k?'no':''}" onclick="nbFinish(${k})">${f}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">🇰🇷 남한 쪽 낱말</div>`;
    right+=`<div class="nb-row">${NB_S.map((w,i)=>
      nbDoneS(st,i) ? `<button class="ok" disabled>${w}</button>`
                    : `<button class="${st.nbS===i?'on':''}" onclick="nbPickS(${i})">${w}</button>`).join('')}</div>`;
    right+=`<div class="dw-step">📖 북한 쪽 보기</div>`;
    right+=`<div class="nb-row">${NB_N.map((w,j)=>
      nbDoneN(st,j) ? `<button class="ok" disabled>${w}</button>`
                    : `<button class="${st.nbN===j?'on':''}" onclick="nbPickN(${j})">${w}</button>`).join('')}</div>`;
  }
  if(st.nbMsg) right+=`<div class="dw-msg${st.nbWarn?' warn':''}">${st.nbMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🌉 같은 것을 가리키는 두 낱말에 다리를 놓아요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${nbCanvas(st)}<div class="cvcap">한쪽만 골라서는 판이 맞다·틀리다를 말하지 않아요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u1_l01";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  nbS:null, nbN:null, nbBridge:[], nbFin:null,
  nbWrongF:null, nbMsg:null, nbWarn:false, nbBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function nbRender(){ main.innerHTML = slides[state.idx].render(state); }

/* 두 쪽이 다 놓였을 때에만 판정한다 — 이 함수가 이 패턴의 핵심 신규성이다.
   한쪽만 놓였으면 옳다·틀리다를 말하지 않고 반대쪽을 기다린다(가드⑤). */
function nbJudge(){
  const i=state.nbS, j=state.nbN;
  if(i==null || j==null){                                  // 가드⑤ 한쪽만으로는 판정 0
    state.nbWarn=false;
    state.nbMsg = (i==null && j==null)
      ? '양쪽에서 하나씩 골라야 견줄 수 있어요.'
      : '아직 한쪽만 놓였어요. <b>반대쪽</b>도 골라 봐요.';
    playBlip(); nbRender(); return;
  }
  if(nbNoSeat(j)){                                         // 자리가 없는 보기 — 틀렸다고 하지 않는다
    state.nbWarn=false; state.nbBusy=true;
    state.nbMsg=`<b>${NB_N[j]}</b>도 보기에 있는 낱말이지만, <b>오늘 채울 네 칸</b>에는 들어가지 않아요. 다른 낱말로 대 봐요.`;
    playThud(); nbRender();
    setTimeout(()=>{ state.nbBusy=false; state.nbN=null; nbRender(); },1600);
    return;
  }
  if(NB_PAIR[i]===j){
    state.nbBridge.push({s:i,n:j});
    state.nbS=null; state.nbN=null; state.nbWarn=false;
    state.nbMsg=`다리가 놓였어요 — 남한의 <b>${NB_S[i]}</b>를 북한에서는 <b>${NB_N[j]}</b>라고 불러요.`;
    playChime(); nbRender(); return;
  }
  // 짝이 아니면 — 어느 쪽이 잘못됐는지는 말하지 않는다(한쪽만 바꿔 다시 댈 수 있다)
  state.nbWarn=true; state.nbBusy=true;
  state.nbMsg=`<b>${NB_S[i]}</b>와 <b>${NB_N[j]}</b>는 같은 것을 가리키지 않아요. 한쪽만 바꿔서 다시 대 봐도 좋아요.`;
  playThud(); nbRender();
  setTimeout(()=>{ state.nbBusy=false; state.nbWarn=false; nbRender(); },1600);
}

/* ① 남한 쪽 낱말 고르기 */
function nbPickS(i){
  if(state.nbFin!=null) return;                                     // 가드①
  if(state.nbBusy) return;                                          // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=NB_S.length) return;          // 가드②
  if(nbDoneS(state,i)) return;                                      // 가드③ 이미 다리가 놓인 낱말
  if(state.nbS===i) return;                                         // 가드④ 같은 낱말 재클릭
  state.nbS=i; nbJudge();
}

/* ② 북한 쪽 보기 고르기 — 어느 쪽을 먼저 골라도 된다(순서 강제 0) */
function nbPickN(j){
  if(state.nbFin!=null) return;                                     // 가드①
  if(state.nbBusy) return;                                          // 가드⑧
  if(!Number.isInteger(j) || j<0 || j>=NB_N.length) return;          // 가드②
  if(nbDoneN(state,j)) return;                                      // 가드③
  if(state.nbN===j) return;                                         // 가드④
  state.nbN=j; nbJudge();
}

/* ③ 마무리 — 이 차이가 계속 커지면? */
function nbFinish(k){
  if(state.nbFin!=null) return;                                     // 가드①
  if(state.nbBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=NB_FIN.length) return;        // 가드⑦
  if(state.nbBridge.length < 4) return;                             // 가드⑥ 네 다리 미완성 시 무시(순서)
  if(k===NB_FIN_OK){
    state.nbFin=k; state.nbWrongF=null; state.nbMsg=null; state.nbWarn=false;
    playChime(); nbRender(); return;
  }
  state.nbWrongF=k; state.nbWarn=true; state.nbBusy=true;
  state.nbMsg = k===0
    ? '오가지 못하는 동안 말은 <b>저절로 같아지지 않아요.</b> 오히려 차이가 커지고 있어요.'
    : '같은 것을 다르게 부르면 <b>대화가 어려워져요.</b> 아무 일도 생기지 않는 것은 아니에요.';
  playThud(); nbRender();
  setTimeout(()=>{ state.nbBusy=false; state.nbWrongF=null; state.nbMsg=null; state.nbWarn=false; nbRender(); },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // l02 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

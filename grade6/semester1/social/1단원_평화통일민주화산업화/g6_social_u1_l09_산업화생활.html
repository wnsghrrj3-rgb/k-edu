직접조작: 빛과 그늘이 함께 자라는 판(44번째 신규 패턴 — 한 걸음이 밝은 줄과 그늘 자리를 동시에 만드는 형)
  ⭐ 앞의 마흔세 종에서 **한 번의 고르기는 판의 한 성질만 정했다.**
     맞으면 채워졌고 어긋나면 그대로였다. 두 자리가 함께 움직인 자리도 있었지만
     (l03 「함께 놓이는 판」) 그 둘은 **같은 성질의 두 몫**이었다 — 둘 다 「함께 한 일」이었다.
     한쪽이 커지면 다른 쪽이 줄어든 자리(l08 「기우는 판」)에서도
     **줄어드는 쪽은 학생이 고른 것이 아니라 계산된 결과**였다.
     이번만 **한 걸음이 서로 반대되는 두 자리를 동시에 만든다** —
     밝은 줄을 놓으면 그 아래에 **그늘 자리(물음표)가 함께 생긴다.**
     까닭은 교과서가 그렇게 적었기 때문이다 — 「많은 사람이 일자리를 찾아 도시로 몰려들면서
     도시 인구는 빠르게 증가했습니다」와 「하지만 산업화 과정에서 많은 사람이 도시로 몰려들면서
     일자리와 주택이 부족해졌습니다」는 **같은 걸음에서 나온 두 줄**이다.
  ⭐ **밝은 면만 담긴 판은 어느 시점에도 만들어지지 않는다.**
     이것은 문구가 아니라 구조다 — **물음표를 따로 담는 상태가 아예 없고**,
     `spQmask(st) = st.spLit & ~st.spDark` 한 줄이 물음표를 다 그린다.
     그래서 밝은 줄 수 = 물음표 수 + 그늘 수가 어느 시점에도 어긋나지 않는다.
  ⭐ **그늘이 있다는 것은 알리되 무엇인지는 말하지 않는다.** 물음표인 동안 그 걸음의
     그늘 원문·짧은이름은 판에 한 자리도 새지 않는다. l02의 「접어 두는 형」과 견주면 —
     거기서는 판이 **판정을 미뤘고**, 여기서는 판정은 그 자리에서 곧바로 하되
     **다음 자리의 내용을 감춘다.** 미룸과 감춤은 다르다.
  ⭐ **판이 「교과서는 여기까지만 말했어요」라고 답하는 자리가 하나 있다.**
     앞의 마흔세 종에서 판은 **모든 자리에 답을 가지고 있었다.**
     「길이 이어짐」 걸음의 그늘 자리에는 지어낸 그늘을 두지 않고 그 말을 둔다 —
     교과서가 지하철과 고속 국도의 그늘을 적지 않았기 때문이다.
     ⚠️ 그 자리의 다른 보기 셋은 **다른 걸음의 그늘 원문**이라 지어냄이 0이다.
  ① **달라진 생활 4장 놓기**(순서 자유 · 걸음을 고르고 그 걸음의 카드를 고른다)

지도서 근거(11~12차시 p.94~99):
  [동기 유발] 우리 지역의 경제가 성장하면서 달라진 점은 무엇인가요?
    → 과거에 논밭이 많았다고 들었는데, 오늘날은 높은 건물과 도로가 많아졌습니다. /
      우리 지역에 고속 열차가 개통되어 다른 지역으로 쉽고 빠르게 이동할 수 있습니다.
  [본문] 우리나라는 1960년대 이후 짧은 기간 동안 놀라운 경제성장을 이뤄 냈습니다.
    산업의 발달로 사람들의 일상생활도 많이 달라졌습니다.
    많은 사람이 일자리를 찾아 도시로 몰려들면서 도시 인구는 빠르게 증가했습니다.
    이에 정부는 좁은 땅에 여러 사람이 살 수 있는 아파트 단지를 많이 지었습니다.
    또한 지하철을 개통하고, 고속 국도를 확대하여 전국을 일일생활권으로 만들었습니다.
  [낱말] 일일생활권 = 하루 동안 볼일을 끝내고 되돌아올 수 있는 거리의 범위.
    대중 매체 = 많은 사람에게 정보를 전달하는 수단.
    달동네 = 산비탈 같은 높은 곳에 가난한 사람들이 모여 사는 동네로,
      높은 곳에 있어 달이 잘 보인다는 뜻에서 붙여짐.
  [스스로 활동] 경부 고속 국도의 개통이 일상생활에 미친 영향을 써 봅시다.
    자료 = 서울에서 부산까지 연결하는 경부 고속 국도는 이전에는 기차로 12시간,
      기존 도로로는 15시간이 걸리던 이동 시간을 4시간 30분대로 크게 단축했습니다.
    → 예시 답안 = 지역 간의 이동이 활발해졌을 것 같다. / 자동차를 사려는 사람이 많아졌을 것 같다.
    활동 의도 = 경부 고속 국도의 개통이 사람들의 생활 모습에 어떻게 영향을 끼쳤는지 파악하는 활동이다.
  [본문] 소득 수준이 높아지면서 텔레비전, 냉장고, 세탁기 등 가전제품이 가정에 보급되고,
    승용차를 보유한 사람도 늘어났습니다. 또한 라디오, 텔레비전과 같은 대중 매체가 널리
    보급되면서 가요, 영화, 드라마, 스포츠 등 대중문화가 성장했습니다.
  [본문·문제점] 하지만 산업화 과정에서 많은 사람이 도시로 몰려들면서 일자리와 주택이
    부족해졌습니다. 안정된 일자리를 찾지 못한 사람들은 가난한 생활을 했고,
    도시의 변두리나 달동네라고 불리는 높은 지대에 모여 살기도 했습니다.
    또한 도시와 농촌 간의 소득 격차가 더욱 벌어지고 농촌 인구도 크게 줄어들었습니다.
  [본문·근로자] 1960~70년대 수출 중심의 정책을 추진한 정부는 수출품의 가격을 낮춰
    경쟁력을 유지하려고 근로자의 권리를 제한하고 임금을 낮게 유지했습니다.
    근로자들은 열악한 근무 환경에서 장시간 노동과 낮은 임금에 시달렸습니다.
    이후 많은 사람이 노동 문제에 관심을 가지면서 근무 환경 개선, 임금 인상 등
    근로자의 권리를 보호하려고 노력했습니다.
  [미디어 활동] 전태일이 대통령에게 보낸 편지 —
    저희는 근로 기준법의 혜택을 조금도 못 받고 있습니다. 근로자의 90 % 이상이 평균 연령
    18세의 여성이며, 보조로 일하는 종업원의 평균 연령은 15세입니다. …
    1일 15시간씩 작업합니다. 저희의 요구는 1일 근무 시간을 10~12시간으로,
    1개월에 휴일 이틀을 일요일마다 휴일로 쉬기를 희망합니다.
    말풍선 = 당시 근로 기준법에서 근로 시간은 주당 48시간이었습니다.
    [정보 활용] 근로자들이 그러한 환경에서 일하게 된 까닭 →
      예시 답안 = 수출품의 가격을 낮춰 경쟁력을 유지하려고 근로자의 임금을 낮게 유지했다.
  [디지털+ 할 수 있어요] 영상 편집 도구로 민주화나 산업화 소개 영상 만들기 —
    ① 민주화나 산업화와 관련 있는 사건이나 인물 쓰기 ② 영상의 제목 짓기
    ③ 스토리보드 만들기(순서·장면·대사와 자막·음악·시간) ④ 스토리보드를 바탕으로 영상 만들기.
    스토리보드란 = 영상을 만들기 전 어떻게 장면을 구성할 것인지 대략적인 내용을 기록하는 것.
  [별별 직업] 도시 재생 전문가 — 낡고 오래된 도시에 새로운 생명을 불어 넣어요!
    하는 일 = 쇠퇴하거나 오래된 도시를 되살릴 수 있도록 도시 재생 계획을 세우는 일을 합니다.
      먼저 그 지역의 문화와 역사 등을 조사하고, 주민들과 함께 마을을 어떻게 바꿀 것인지
      논의해 도시 계획을 세웁니다. 이때 지역의 문화와 역사적 특색을 살려 개성이 잘 살아나도록 합니다.
    되려면 = 논리적으로 사고할 수 있는 능력과 창의력, 입체적인 물체의 위치나 모습을
      상상하고 떠올릴 수 있는 공간 지각력.
  [꼭 기억해요] 1 산업화 과정에서 많은 사람이 일자리를 찾아 (도시)로 몰려들었습니다.
    2 1960~70년대 (근로자)들이 열악한 근무 환경에 시달리자, 많은 사람이 이들의 권리를
    보호하려고 노력했습니다.
  [11~12차시 주요 내용 정리] 1. 산업화로 달라진 일상생활 ① 도시화 ② 교통의 발달 ③ 소득 수준 향상
    ④ 대중문화 성장 / 2. 산업화로 나타난 문제점 ① 도시 인구 집중으로 일자리와 주택이 부족해짐
    ② 도시 빈민이 생기고, 도시와 농촌 간 소득 격차가 커짐 ③ 근로자들은 장시간 노동과 낮은 임금에 시달림.
  [정리] 학습 내용 정리 = 산업화로 긍정적인 면도 나타났지만, 부정적인 면도 동시에 나타났다는 것을
    알게 됐습니다. / 차시 예고 = 생각을 펼쳐요.
⚠️ 정직 원칙 네 곳:
  ㉠ **판의 그늘 자리 하나는 비워 두지 않고 「교과서는 여기까지만 말했어요」로 채운다.**
     지하철·고속 국도의 그늘을 교과서가 적지 않았기 때문이고, 없는 것을 지어내지 않기 위해서다.
     그 자리의 다른 보기 셋은 모두 **다른 걸음의 그늘 원문**이다.
  ㉡ 교과서 [스스로 활동]·[정보 활용]의 빈칸은 지어내지 않고 **지도서 예시 답안 원문**만 둔다.
  ㉢ **전태일 편지에서 금액(하루에 받은 돈)과 비율은 옮기지 않는다** —
     그때의 화폐 가치가 오늘과 달라 숫자를 그대로 옮기면 뜻이 어긋나기 때문이다.
     대신 **나이와 근무 시간은 원문 그대로** 둔다(지도서가 오늘의 같은 나이와 견주도록 지도한다).
     경부 고속 국도의 **총 거리도 두지 않는다** — 외울 값이 아니라 줄어든 시간이 활동의 핵심이다.
  ㉣ [별별 직업]의 **마을 이름은 두지 않는다** — 도시 재생이 무엇인지 아는 데 이름이 필요하지 않고,
     사진 해설의 재개발 경위는 교사용이다. 「어느 마을의 옛 모습과 오늘날 모습」으로만 쓴다.

/* ===== 직접조작 — 빛과 그늘이 함께 자라는 판(44번째 신규 패턴 —
        한 걸음이 밝은 줄과 그늘 자리를 동시에 만드는 형) =====
   ⭐ 앞의 마흔세 종에서 **한 번의 고르기는 판의 한 성질만 정했다.**
      두 자리가 함께 움직인 자리도 있었지만(l03) 그 둘은 **같은 성질의 두 몫**이었고,
      한쪽이 커지면 다른 쪽이 줄어든 자리(l08)에서도 **줄어드는 쪽은 학생이 고른 것이 아니라
      계산된 결과**였다. 이번만 **한 걸음이 서로 반대되는 두 자리를 동시에 만든다** —
      밝은 줄을 놓으면 그 아래에 **그늘 자리(물음표)가 함께 생긴다.**
      까닭은 교과서가 「많은 사람이 도시로 몰려들면서 도시 인구는 빠르게 증가했습니다」와
      「하지만 많은 사람이 도시로 몰려들면서 일자리와 주택이 부족해졌습니다」를
      **같은 걸음에서 나온 두 줄**로 적었기 때문이다.
   ⭐ **밝은 면만 담긴 판은 어느 시점에도 만들어지지 않는다.** 이것은 구조다 —
      **물음표를 따로 담는 상태가 아예 없고**, `spQmask(st) = st.spLit & ~st.spDark` 한 줄이
      물음표를 다 그린다. 그래서 밝은 줄 수 = 물음표 수 + 그늘 수가 어긋날 수 없다.
   ⭐ **그늘이 있다는 것은 알리되 무엇인지는 말하지 않는다.** 물음표인 동안
      그 걸음의 그늘 원문·짧은이름은 판에 한 자리도 새지 않는다.
   ⭐ **판이 「교과서는 여기까지만 말했어요」라고 답하는 자리가 하나 있다.**
      「길이 이어짐」 걸음의 그늘을 교과서가 적지 않았기 때문이고,
      그 자리의 다른 보기 셋은 **다른 걸음의 그늘 원문**이라 지어냄이 0이다.
   ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 걸음·카드·마무리 번호(`Number.isInteger`) /
      ③ 걸음을 고르기 전 카드 무시(순서) / ④ 이미 채운 자리 재선택 무시 — 판 불변 /
      ⑤ 어긋난 카드 — 판 불변(밝은 줄·물음표·그늘 전부 불변) /
      ⑥ 밝은 넷을 다 놓기 전 그늘 무시(순서) / ⑦ 그늘 넷을 다 열기 전 마무리 무시(순서) /
      ⑧ 안내 표시 중 재클릭 무시(`spBusy`).
   ⚠️ 전량 고정 리터럴 — 난수 0. 발문은 `.sp-q`로 떼어 전 단계 상시 노출.
   ⚠️ opbody 분리자는 `const SP_N = 4;` — 스칼라라 파생 접두 충돌이 없다(l03·l04 규약 승계). */
const SP_N = 4;

/* 산업화의 네 걸음 — 판에 처음부터 놓여 있다(비어 있지 않다). */
const SP_STEP = ['도시로 몰려듦','길이 이어짐','살림이 나아짐','수출에 힘씀'];

/* 보기 차례 — 걸음마다 다르게 두어 정답 자리가 [1,0,2,3]로 갈린다. */
const SP_LIT_ORD = [[2,0,3,1],[1,3,0,2],[3,1,2,0],[0,2,1,3]];

/* 나타난 문제 — 전량 교과서 본문 원문.

const SP_DARK = [

const SP_DARK_S = ['일자리와 주택 부족','교과서가 말한 데까지','소득 격차가 벌어짐','장시간 노동·낮은 임금'];
/* 보기 차례 — 정답 자리가 [2,1,3,0]로 갈린다(밝은 쪽과 다른 자리). */
const SP_DARK_ORD = [[1,3,0,2],[2,1,3,0],[0,3,1,2],[3,2,0,1]];

/* 밝은 줄을 놓았을 때 판이 하는 말 — ★ 그늘이 함께 생겼다는 것만 말하고 내용은 감춘다. */
const SP_OK_LIT = [

  '지하철과 고속 국도로 <b>전국이 일일생활권</b>이 되었어요. 이 걸음에도 <b>그늘</b> 자리가 함께 생겼어요 — 아직 무엇인지는 말하지 않을게요.',
  '소득 수준이 높아지면서 <b>가전제품과 승용차</b>가 늘었어요. 이 걸음에도 <b>그늘</b> 자리가 함께 생겼어요 — 아직 무엇인지는 말하지 않을게요.',

];
/* 그늘을 열었을 때 판이 하는 말. */
const SP_OK_DARK = [
  '도시로 몰려든 것과 <b>일자리와 주택이 부족해진 것</b>은 같은 걸음에서 나왔어요.',
  '이 걸음의 문제는 <b>교과서가 적어 두지 않았어요.</b> 없는 것을 지어내지 않고, 교과서가 말한 데까지만 두었어요.',

const SP_BAND = '달라진 생활과 나타난 문제는 같은 걸음에서 함께 나왔어요';

/* 마무리 — 지도서 학습 내용 정리 예시 답안. 정답 자리 1. */
const SP_FIN = [
  '산업화로 좋아지기만 해서 어려운 점은 하나도 없었어요',
  '산업화로 좋아진 점도 있었지만, 그와 함께 어려운 점도 나타났어요',
  '산업화로 어려워지기만 해서 좋아진 점은 하나도 없었어요'
];
const SP_FIN_OK = 1;

function spBit(i){ return 1<<i; }
function spCount(m){ let n=0; for(let i=0;i<SP_N;i++){ if(m & spBit(i)) n++; } return n; }
/* ⚠️ 물음표를 따로 담는 상태는 두지 않는다 — 이 한 줄이 물음표를 다 그린다. */
function spQmask(st){ return st.spLit & ~st.spDark; }
function spAllLit(st){ return spCount(st.spLit)===SP_N; }
function spAllDark(st){ return spCount(st.spDark)===SP_N; }
function spPhase(st){ return spAllLit(st) ? 'dark' : 'lit'; }

/* 판 — 네 걸음이 세로로 놓이고, 각 걸음마다 위(달라진 생활)와 아래(나타난 문제) 두 자리가 있다.
   ⚠️ 아직 열지 않은 그늘은 물음표로만 두고 내용을 흘리지 않는다. */
function spCanvas(st){
  const lit=st.spLit, dark=st.spDark, qm=spQmask(st);
  const nL=spCount(lit), nD=spCount(dark), nQ=spCount(qm);
  const done = st.spFin!=null, ph = spPhase(st);
  let g='';
  g+=`<rect x="8" y="6" width="304" height="238" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>`;
  const head = done ? '한 걸음이 두 줄을 함께 남겼어요'
    : (spAllDark(st) ? '물음표를 모두 열었어요 — 마지막 물음이에요'
      : (ph==='dark' ? '이제 물음표를 열어 봐요'
        : (st.spSel!=null ? `「${SP_STEP[st.spSel]}」 걸음을 골랐어요` : '걸음을 하나 골라 봐요')));
  g+=`<text x="160" y="22" font-size="10.4" fill="#1E3A8A" text-anchor="middle" font-weight="800">${head}</text>`;
  /* 열 머리 */
  g+=`<text x="50" y="46" font-size="8.4" fill="#64748B" text-anchor="middle" font-weight="800">산업화의 걸음</text>`;
  g+=`<text data-litn="${nL}" x="147" y="46" font-size="8.4" fill="#1E3A8A" text-anchor="middle" font-weight="800">달라진 생활 ${nL}</text>`;
  g+=`<text data-darkn="${nD}" data-qmn="${nQ}" x="258" y="46" font-size="8.4" fill="#92400E" text-anchor="middle" font-weight="800">나타난 문제 ${nD}</text>`;
  for(let i=0;i<SP_N;i++){
    const y = 54 + 38*i, on = (st.spSel===i && !done);
    /* 걸음 칸 — 처음부터 넷 다 놓여 있다. */
    g+=`<rect data-step="${i}" x="12" y="${y}" width="74" height="32" rx="7" fill="${on?'#DBEAFE':'#fff'}" stroke="${on?'#1D4ED8':'#CBD5E0'}" stroke-width="${on?1.8:1.2}"/>`;
    g+=`<text x="49" y="${y+20}" font-size="7.4" fill="${on?'#1E3A8A':'#334155'}" text-anchor="middle" font-weight="800">${SP_STEP[i]}</text>`;
    /* 달라진 생활 칸 */
    if(lit & spBit(i)){
      g+=`<rect data-lit="${i}" x="92" y="${y}" width="110" height="32" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>`;
      g+=`<text x="147" y="${y+20}" font-size="7.2" fill="#1E3A8A" text-anchor="middle" font-weight="800">${SP_LIT_S[i]}</text>`;
    } else {
      g+=`<rect x="92" y="${y}" width="110" height="32" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.1" stroke-dasharray="4 3"/>`;
    }
    /* 나타난 문제 칸 — 물음표 · 열린 그늘 · 아직 자리 없음 */
    if(dark & spBit(i)){
      g+=`<rect data-dark="${i}" x="208" y="${y}" width="100" height="32" rx="7" fill="#FFF8E1" stroke="#B45309" stroke-width="1.5"/>`;
      g+=`<text x="258" y="${y+20}" font-size="7.2" fill="#92400E" text-anchor="middle" font-weight="800">${SP_DARK_S[i]}</text>`;
    } else if(qm & spBit(i)){
      g+=`<rect data-qm="${i}" x="208" y="${y}" width="100" height="32" rx="7" fill="#fff" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3"/>`;
      g+=`<text x="258" y="${y+21}" font-size="12" fill="#B45309" text-anchor="middle" font-weight="800">?</text>`;
    } else {
      g+=`<rect x="208" y="${y}" width="100" height="32" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.1" stroke-dasharray="4 3"/>`;
    }
  }
  /* ★ 완성 띠 — 그늘 넷을 다 연 뒤에만 뜬다(코드에 단 한 자리). */
  if(spAllDark(st)){
    g+=`<rect data-band="1" x="12" y="208" width="296" height="28" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>`;
    g+=`<text x="160" y="226" font-size="8.6" fill="#166534" text-anchor="middle" font-weight="800">${SP_BAND}</text>`;
  } else {
    g+=`<rect x="12" y="208" width="296" height="28" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function spPanel(st){
  const done = st.spFin!=null, ph = spPhase(st), allD = spAllDark(st);
  const q = done
    ? '달라진 생활과 나타난 문제는 <b>같은 걸음</b>에서 함께 나왔어요.'
    : (allD ? '산업화로 달라진 생활 모습을 살펴보고 알게 된 것은 무엇인가요?'
      : (st.spSel!=null
        ? `「${SP_STEP_L[st.spSel]}」 \u2014 이 걸음에서 ${ph==='lit'?'<b>달라진 생활</b>':'<b>나타난 문제</b>'}은 무엇인가요?`
        : (ph==='lit' ? '걸음을 하나 골라, 그 걸음에서 <b>달라진 생활</b>을 찾아봐요.'
          : '이번에는 물음표를 열어, 그 걸음에서 <b>나타난 문제</b>를 찾아봐요.')));
  let right = `<div class="sp-q">${q}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">\uD83C\uDF07 한 걸음이 남긴 두 줄</div>
      <div>밝은 줄을 놓을 때마다 아래에 <b>물음표가 함께 생겼어요.</b> 달라진 생활에는 그와 함께
      나타난 문제도 있었기 때문이에요. 그래서 <b>밝은 면만 담긴 판은 한 번도 만들어지지 않았어요.</b></div>
      <div style="margin-top:5px">「길이 이어짐」 걸음의 아래에는 <b>교과서가 말한 데까지</b>만 두었어요 \u2014
      교과서가 적지 않은 것을 지어내지 않으려고요.</div></div>`;
  } else if(allD){
    right+=`<div class="dw-step">\uD83D\uDCDD 오늘의 마무리</div>`;
    right+=`<div class="sp-fin">${SP_FIN.map((f,k)=>
      `<button class="${st.spWrongF===k?'no':''}" onclick="spFinish(${k})">${f}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="dw-step">${ph==='lit'?'\u2600\uFE0F 달라진 생활':'\uD83C\uDF25\uFE0F 나타난 문제'} \u00B7 ${ph==='lit'?spCount(st.spLit):spCount(st.spDark)} / ${SP_N}</div>`;
    right+=`<div class="sp-row">${SP_STEP.map((s,i)=>{
      const filled = ph==='lit' ? (st.spLit & spBit(i)) : (st.spDark & spBit(i));
      const mark = filled ? '\u2713' : (ph==='dark' ? '?' : '');
      return `<button class="${filled?'ok':''}${st.spSel===i?' on':''}" ${filled?'disabled':''} onclick="spTake(${i})">${s}${mark?' '+mark:''}</button>`;
    }).join('')}</div>`;
    if(st.spSel!=null){
      const ord = ph==='lit' ? SP_LIT_ORD[st.spSel] : SP_DARK_ORD[st.spSel];
      const pool = ph==='lit' ? SP_LIT : SP_DARK;
      right+=`<div class="sp-list">${ord.map((owner,k)=>
        `<button class="${st.spWrong===k?'no':''}" onclick="spPut(${k})">${pool[owner]}</button>`).join('')}</div>`;
    }
  }
  if(st.spMsg) right+=`<div class="dw-msg${st.spWarn?' warn':''}">${st.spMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDF07 한 걸음을 놓으면 판의 두 자리가 함께 생겨요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${spCanvas(st)}<div class="cvcap">교과서가 말한 걸음과 두 줄을 나타낸 도식이에요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

  <div class="tipbox"><b>도시 재생 전문가</b>는 <b>쇠퇴하거나 오래된 도시를 되살릴 수 있도록 도시 재생 계획을 세우는 일</b>을 해요. 그 지역의 <b>문화와 역사</b>를 조사하고 주민들과 함께 논의해, <b>지역의 특색이 잘 살아나도록</b> 계획을 세워요.</div>
  <div class="note">교과서 <b>[재미있게 확인해요]</b>의 가로세로 퍼즐도 펼쳐서 직접 풀어 보면 좋아요. 다음 시간에는 <b style="color:var(--green)">생각을 펼쳐요</b> 활동을 해요.</div></div>`});
// 17 정리: 자기 평가 — [얼마나 잘했을까] 3항 원문
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"민주화와 산업화로 달라진 사람들의 생활 모습을 설명할 수 있어요",st)}
    ${selfCheck(1,"우리나라의 민주화와 산업화 과정을 다양한 방법으로 표현할 수 있어요",st)}
    ${selfCheck(2,"산업화의 성과와 한계를 이해하고, 문제 해결을 위한 실천에 관심을 두게 됐어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">생각을 펼쳐요</b>!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u1_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  spLit:0, spDark:0, spSel:null, spFin:null,
  spWrong:null, spWrongF:null,
  spMsg:null, spWarn:false, spBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function spRender(){ main.innerHTML = slides[state.idx].render(state); }
/* ⚠️ 경고 경로 — 어긋난 카드에만 쓴다. 판은 이 경로에서 한 자리도 달라지지 않는다. */
function spHold(msg){
  state.spWarn=true; state.spBusy=true; state.spMsg=msg;
  playThud(); spRender();
  setTimeout(()=>{ state.spBusy=false; state.spWarn=false; state.spMsg=null;
    state.spWrong=null; state.spWrongF=null; spRender(); },1600);
}

/* ① 걸음 고르기 — 판정 없음(어느 걸음부터 채워도 된다). */
function spTake(i){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=SP_N) return;                    // 가드②
  const ph = spPhase(state);
  const filled = ph==='lit' ? (state.spLit & spBit(i)) : (state.spDark & spBit(i));
  if(filled) return;                                                   // 가드④ 이미 채운 자리 재선택 무시
  state.spSel=i; state.spMsg=null; state.spWarn=false; state.spWrong=null;
  playBlip(); spRender();
}

/* ② 카드 놓기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   밝은 줄을 놓는 자리에서 `spLit`에 한 자리가 켜지고, **그 순간 물음표가 함께 생긴다.**
   물음표를 따로 담는 상태가 없기 때문에 밝은 면만 담긴 판은 만들어질 수 없다.
   ⚠️ 어긋난 카드에는 판이 한 자리도 달라지지 않는다(가드⑤). */
function spPut(k){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SP_N) return;                    // 가드②
  if(state.spSel==null) return;                                        // 가드③ 걸음을 고르기 전 카드 무시
  const e = state.spSel, ph = spPhase(state);
  if(ph==='lit'  && (state.spLit  & spBit(e))) return;                 // 가드④
  if(ph==='dark' && (state.spDark & spBit(e))) return;                 // 가드④
  const ord = ph==='lit' ? SP_LIT_ORD[e] : SP_DARK_ORD[e];
  const owner = ord[k];
  if(owner===e){
    if(ph==='lit'){
      state.spLit |= spBit(e);                                         // ★ 밝은 줄과 물음표가 함께 생기는 유일한 자리
    } else {
      if(!spAllLit(state)) return;                                     // 가드⑥ 밝은 넷을 다 놓기 전 그늘 무시(순서)
      state.spDark |= spBit(e);
    }
    state.spSel=null; state.spWrong=null; state.spWarn=false;
    state.spMsg = ph==='lit' ? SP_OK_LIT[e] : SP_OK_DARK[e];
    playChime(); spRender(); return;
  }
  state.spWrong=k;                                                     // 가드⑤ 판 불변
  spHold(`그것은 <b>${SP_STEP[owner]}</b> 걸음의 것이에요. 이 걸음의 것을 다시 찾아봐요.`);
}

/* ③ 마무리 — 지도서 학습 내용 정리. 그늘 넷을 다 열어야 열린다. */
function spFinish(k){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SP_FIN.length) return;          // 가드②
  if(!spAllDark(state)) return;                                        // 가드⑦ 그늘 넷 전 무시(순서)
  if(k===SP_FIN_OK){
    state.spFin=k; state.spSel=null;
    state.spWrongF=null; state.spMsg=null; state.spWarn=false;
    playChime(); spRender(); return;
  }
  state.spWrongF=k;
  spHold(k===0
    ? '좋아진 점만 있었던 것은 아니에요. 판의 <b>아래쪽 줄</b>을 다시 읽어 봐요.'
    : '어려운 점만 있었던 것도 아니에요. 판의 <b>위쪽 줄</b>을 다시 읽어 봐요.');
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l10_생각을펼쳐요.html'; } // l09 → l10 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

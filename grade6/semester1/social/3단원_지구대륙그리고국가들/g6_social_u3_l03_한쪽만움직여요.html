직접조작: 따로 도는 두 잣대의 판 · 한쪽으로 옮기면 한 잣대만 움직이고 다른 잣대는 미동도 하지 않는 형
         (64번째 신규 패턴)
  ⭐ 앞의 예순세 종에서 **판이 재는 잣대는 언제나 하나로 이어져 있었다.** 43번째(기우는 판)에서 한쪽이
     커질 때 다른 쪽이 줄어든 것도 **두 자리가 한 잣대로 묶여 있었기** 때문이고, 44번째(빛과 그늘이 함께
     자라는 판)에서 두 자리가 함께 오른 것도 **한 걸음이 두 자리를 함께 만들었기** 때문이며,
     63번째(배율을 옮기는 판)에서 배율을 옮기면 **판이 통째로 달라졌다.** 어느 판에서도 **한 걸음이
     판의 한쪽에 닿고 다른 쪽에는 아예 닿지 않은 적이 없다.**
  ⭐ 이번만 **판에 서로 만나지 않는 두 잣대가 있다.** 남북으로 옮기면 **햇볕 칸만** 달라지고 시각 칸은
     글자 하나 달라지지 않는다. 동서로 옮기면 **시각 칸만** 달라지고 햇볕 칸은 글자 하나 달라지지
     않는다. 근거는 교과서 131쪽 본문이 「지구는 둥글어서 **위도에 따라** 햇볕을 받는 양이 다릅니다」라
     했고, 133쪽 본문이 「**경도에 따라** 시각이 달라져 시차가 발생합니다」라 했다는 것이다.
  ⭐ **58번째(되돌려도 함께 되돌아오지 않는 판)와의 대비** — 거기서는 판의 한쪽만 되돌아왔지만
     되돌리는 걸음은 **판 전체를 겨눈 한 걸음**이었다. 여기서는 걸음 자체가 **두 갈래로 갈려 있고**
     각 걸음이 닿는 자리가 처음부터 다르다.
  ⭐ **적도에서 떨어진 만큼이 같으면 햇볕 칸도 같다** — 북위 30°와 남위 30°의 햇볕 칸이 글자까지
     같다(`mvBand`가 적도에서 떨어진 만큼만 센다). 그래서 「북쪽이 언제나 춥다」는 오개념이 **판에서
     직접 무너진다.**
  ⭐ **햇볕을 정하는 자리와 시각을 정하는 자리가 코드에 한 줄씩뿐이다** — `mvSun(st)` 한 줄이
     `st.mvLat`만 읽고, `mvTime(st)` 한 줄이 `st.mvLon`만 읽는다. **`MV_SUN[`·`MV_TIME[`를 읽는 자리도
     각각 그 한 줄뿐**이고, 남북 처리기 본문에 `mvLon`이 0, 동서 처리기 본문에 `mvLat`이 0이다.
  ⭐ **판은 한 번에 한 축만 연다** — 남북 단계에서는 동서 단추가 화면에 없고, 동서 단계에서는 남북
     단추가 화면에 없다. 두 잣대가 따로 돈다는 것이 화면 구조로도 드러난다.
  ⭐ **옮기는 자리에 옳고 그름이 없다**(`MV_MOVE_OK` 부재 · 무판정 · 감점 0).

     ★ 옮길 때마다 햇볕 칸이 달라지고 **시각 칸은 미동도 하지 않는다**)

     ★ 옮길 때마다 시각 칸이 달라지고 **햇볕 칸은 미동도 하지 않는다**)

  ④ 마무리 3택 = 지도서 「5~6차시 주요 내용 정리」 원문
  ⚠️ 위선·경선·햇볕 칸·시각 칸·안내 전량 고정 리터럴 — 난수 0.
  ⚠️ 가드 9종: ① 마무리 확정 후 전체 잠금 / ② 무효 번호(`Number.isInteger`·범위) /
     ③ 판 끝을 넘어가는 이동 무시 — 판 불변 · 안내는 「여기가 판의 끝이에요」까지만 /
     ④ 햇볕 갈래 셋을 겪기 전 「동서로 옮기기」 무시(순서) — 판 불변 /
     ⑤ **지금 열려 있지 않은 축으로 옮기기 무시 — 판 불변**(핵심 가드 · 한 번에 한 축) /
     ⑥ 경도 갈래 셋을 겪기 전 판 읽기 무시(순서) — 판 불변 /
     ⑦ 판 읽기를 마친 뒤 다시 읽기 무시 — 판 불변 /
     ⑧ 판을 읽기 전 마무리 무시(순서) — 판 불변 /
     ⑨ 안내 표시 중 재클릭 무시(`mvBusy`).
     재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.mv-q`로 떼어 전 단계 상시 노출. 상태 열쇠 13개.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 자리는 실제 나라·도시의 이름을 옮기지 않고 위도·경도의 이름으로만 둔다** — 나라와 대륙의
     이름은 **뒤 차시** 몫이다(캔버스 캡션 명시).
  ㉡ **판의 그림은 지구본과 세계지도에 그려 놓은 선을 나타낸 도식이지 실제 지도가 아니다**(캡션).
  ㉢ **위도대에 해당하는 나라를 찾는 활동과 경도별로 나라를 나누는 활동은 교실 몫이다** — 화면이
     다루는 자리는 **한쪽으로 옮기면 무엇이 달라지고 무엇이 달라지지 않는가**까지다(완료 카드 명시).
  ㉣ **판의 시각 칸은 시각이 같은지 다른지까지만 말하고 몇 시인지는 말하지 않는다** — 나라마다
     기준이 되는 경선을 정해 그 경선의 시각을 쓰기 때문이다(교과서 133쪽 본문 원문).

  · **l01·l02 재현 최소** — 「지구본」·「세계지도」는 교과서 130쪽 [동기 유발]·본문 원문 자리까지 각 ≤6 ·

  · **대단원1·2 재현 0**(선거·국회·행정부·법원·권력 분립·미디어·평화 통일·민주화·산업화·헌법·인권 전부 0).

.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);

.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}

.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.mv-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);

.mv-pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.mv-pad button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:9px 4px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10px,1.7vw,12.4px);line-height:1.35}
.mv-pad button:hover{background:var(--bub)}
.mv-pad button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.mv-pad .sp{visibility:hidden}
.mv-go{display:flex;flex-direction:column;gap:5px}
.mv-go button{border:2px solid var(--green);background:#D1FAE5;color:var(--green-d);border-radius:10px;padding:8px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.5px,1.8vw,13px);line-height:1.45}
.mv-go button:hover{background:#A7F3D0}
.mv-go button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.mv-read{display:flex;flex-direction:column;gap:5px}
.mv-read button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.mv-read button:hover{background:var(--bub)}
.mv-read button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.mv-fin{display:flex;flex-direction:column;gap:5px}
.mv-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;

.mv-fin button:hover{background:var(--bub)}
.mv-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}

.mv-seen{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
.mv-seen .row{border:2px solid var(--line);border-radius:9px;padding:5px 8px;background:#F8FAFC;

.mv-seen .row.on{border-color:var(--green);background:#ECFDF5;color:var(--green-d)}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#D1FAE5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);

/* ===== 직접조작 — 따로 도는 두 잣대의 판(64번째 신규 패턴) =====
   ⭐ 앞의 예순세 종에서 **판이 재는 잣대는 언제나 하나로 이어져 있었다.** 43번째(기우는 판)에서 한쪽이
      커질 때 다른 쪽이 줄어든 것도 두 자리가 **한 잣대로 묶여 있었기** 때문이고, 44번째(빛과 그늘이
      함께 자라는 판)에서 두 자리가 함께 오른 것도 **한 걸음이 두 자리를 함께 만들었기** 때문이며,
      63번째(배율을 옮기는 판)에서 배율을 옮기면 **판이 통째로 달라졌다.**
   ⭐ 이번만 **판에 서로 만나지 않는 두 잣대가 있다.** 남북으로 옮기면 햇볕 칸만 달라지고 **시각 칸은
      글자 하나 달라지지 않는다.** 동서로 옮기면 시각 칸만 달라지고 **햇볕 칸은 글자 하나 달라지지
      않는다.** 근거는 교과서 131쪽 「위도에 따라 햇볕을 받는 양이 다릅니다」와 133쪽 「경도에 따라
      시각이 달라져 시차가 발생합니다」이다.
   ⭐ **적도에서 떨어진 만큼이 같으면 햇볕 칸도 같다** — 북위 30°와 남위 30°의 햇볕 칸이 글자까지 같다.
   ⭐ **햇볕을 정하는 자리와 시각을 정하는 자리가 코드에 한 줄씩뿐이다** — `mvSun`은 `mvLat`만,
      `mvTime`은 `mvLon`만 읽는다. 남북 처리기에 `mvLon` 0, 동서 처리기에 `mvLat` 0.
   ⭐ **판은 한 번에 한 축만 연다** — 지금 열려 있지 않은 축으로는 옮길 수 없다(핵심 가드).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 옮기는 자리에 옳고 그름 0. */
const MV_LAT_N = 7;   /* 위선 일곱 */
const MV_LON_N = 5;   /* 경선 다섯 */
const MV_LAT_MID = 3; /* 가운데 = 적도 */
const MV_LON_MID = 2; /* 가운데 = 본초 자오선 */
const MV_SUN_NEED = 3;  /* 햇볕 갈래 넷 가운데 셋 이상을 겪어야 다음이 열린다 */
const MV_SIDE_NEED = 3; /* 서경 쪽 · 본초 자오선 · 동경 쪽 세 갈래를 다 겪어야 열린다 */

/* 위선 일곱 — 교과서 130쪽 그림의 눈금 그대로(북쪽·남쪽으로 각각 90°씩) */
const MV_LAT_S = ['북위 90°','북위 60°','북위 30°','적도 0°','남위 30°','남위 60°','남위 90°'];

const MV_LOCK_EW = '지금은 <b>남북으로 옮기는 차례</b>예요. 동서로는 옮길 수 없어요. 판은 그대로예요.';

/* ★ 적도에서 떨어진 만큼 — 햇볕 갈래를 정하는 한 줄. */
function mvBand(lat){ return Math.abs(lat - MV_LAT_MID); }
/* ★ 본초 자오선에서 어느 쪽인지 — 0 서경 쪽 · 1 본초 자오선 · 2 동경 쪽. */
function mvSide(lon){ return lon < MV_LON_MID ? 0 : lon > MV_LON_MID ? 2 : 1; }
/* ★★ 햇볕은 `mvLat`만 읽는다 — `MV_SUN[`를 읽는 자리도 여기 한 곳뿐. */
function mvSun(st){ return MV_SUN[mvBand(st.mvLat)]; }
/* ★★ 시각은 `mvLon`만 읽는다 — `MV_TIME[`를 읽는 자리도 여기 한 곳뿐. */
function mvTime(st){ return MV_TIME[st.mvLon]; }
function mvSeenS(st){ let n=0; for(let i=0;i<4;i++){ if(st.mvSeenS & (1<<i)) n++; } return n; }
function mvSeenT(st){ let n=0; for(let i=0;i<3;i++){ if(st.mvSeenT & (1<<i)) n++; } return n; }
function mvOpenEW(st){ return mvSeenS(st) >= MV_SUN_NEED; }
function mvOpenRead(st){ return st.mvPhase===1 && mvSeenT(st) >= MV_SIDE_NEED; }

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u3_l03";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  mvLat:MV_LAT_MID, mvLon:MV_LON_MID, mvSeenS:1, mvSeenT:0, mvPhase:0, mvRead:null, mvFin:null,
  mvWrongE:false, mvWrongR:null, mvWrongF:null,
  mvMsg:null, mvWarn:false, mvBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function mvRender(){ main.innerHTML = slides[state.idx].render(state); }
function mvHold(msg){
  state.mvWarn=true; state.mvBusy=true; state.mvMsg=msg;
  playThud(); mvRender();
  setTimeout(()=>{ state.mvBusy=false; state.mvWarn=false; state.mvMsg=null;
    state.mvWrongE=false; state.mvWrongR=null; state.mvWrongF=null; mvRender(); },1600);
}

/* ① 남북으로 옮기기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   위도만 바뀐다. 이 본문에는 `mvLon`을 건드리는 자리가 **하나도 없다.**
   ★ 옮기는 자리에는 옳고 그름이 없다(정답 상수 부재 · 감점 0). */
function mvNS(d){
  if(state.mvFin!=null) return;                                        // 가드①
  if(state.mvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(d) || (d!==1 && d!==-1)) return;                // 가드②
  if(state.mvPhase!==0){ mvHold(MV_LOCK_NS); return; }                 // 가드⑤ ★핵심 — 판 불변
  const nx = state.mvLat + d;
  if(nx<0 || nx>=MV_LAT_N){ mvHold(MV_EDGE); return; }                 // 가드③ 판 불변
  state.mvLat = nx;                                                    // ★ 위도가 바뀌는 자리는 여기 한 곳뿐
  state.mvSeenS |= 1 << mvBand(state.mvLat);
  state.mvWarn=false; state.mvWrongE=false;
  state.mvMsg = `<b>${MV_LAT_S[state.mvLat]}</b>(으)로 옮겼어요. <b>햇볕 칸</b>을 살펴봐요 — 시각 칸은 그대로예요.`;
  playBlip(); mvRender();
}

/* ② 동서로 옮기기 — 경도만 바뀐다. 이 본문에는 `mvLat`을 건드리는 자리가 **하나도 없다.** */
function mvEW(d){
  if(state.mvFin!=null) return;                                        // 가드①
  if(state.mvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(d) || (d!==1 && d!==-1)) return;                // 가드②
  if(state.mvPhase!==1){ mvHold(MV_LOCK_EW); return; }                 // 가드⑤ ★핵심 — 판 불변
  const nx = state.mvLon + d;
  if(nx<0 || nx>=MV_LON_N){ mvHold(MV_EDGE); return; }                 // 가드③ 판 불변
  state.mvLon = nx;                                                    // ★ 경도가 바뀌는 자리는 여기 한 곳뿐
  state.mvSeenT |= 1 << mvSide(state.mvLon);
  state.mvWarn=false;
  state.mvMsg = `<b>${MV_LON_S[state.mvLon]}</b>(으)로 옮겼어요. <b>시각 칸</b>을 살펴봐요 — 햇볕 칸은 그대로예요.`;
  playBlip(); mvRender();
}

/* ③ 축 바꾸기 — 햇볕 갈래 셋을 겪어야 열린다(순서). */
function mvNext(){
  if(state.mvFin!=null) return;                                        // 가드①
  if(state.mvBusy) return;                                             // 가드⑨
  if(state.mvPhase!==0) return;                                        // 이미 동서 차례
  if(!mvOpenEW(state)){ state.mvWrongE=true; mvHold(MV_ORDER_E); return; } // 가드④ 순서 — 판 불변
  state.mvPhase = 1;
  state.mvSeenT |= 1 << mvSide(state.mvLon);
  state.mvWarn=false; state.mvWrongE=false;
  state.mvMsg = `이제 <b>동서로</b> 옮겨 봐요. 이번에는 무엇이 달라지는지 살펴봐요.`;
  playBlip(); mvRender();
}

/* ④ 판 다시 읽기 — 판이 표시해 주지 않고 학생이 판을 읽어서 찾는다. */
function mvReadPick(k){
  if(state.mvFin!=null) return;                                        // 가드①
  if(state.mvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=MV_READ.length) return;         // 가드②
  if(!mvOpenRead(state)){ mvHold(MV_ORDER_R); return; }                // 가드⑥ 순서 — 판 불변
  if(state.mvRead!=null){ mvHold(MV_READ_DONE); return; }              // 가드⑦ 판 불변
  if(k!==MV_READ_OK){ state.mvWrongR=k; mvHold(MV_READ_NO[k]); return; }
  state.mvRead=k; state.mvWrongR=null; state.mvMsg=null; state.mvWarn=false;
  playBlip(); mvRender();
}

/* ⑤ 마무리 — 지도서 「5~6차시 주요 내용 정리」 원문 */
function mvFinish(k){
  if(state.mvFin!=null) return;                                        // 가드①
  if(state.mvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=MV_FIN.length) return;          // 가드②
  if(state.mvRead==null){ mvHold(MV_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===MV_FIN_OK){
    state.mvFin=k; state.mvWrongF=null; state.mvMsg=null; state.mvWarn=false;
    playChime(); mvRender(); return;
  }
  state.mvWrongF=k;
  mvHold(MV_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u3_l04_만나야정해져요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

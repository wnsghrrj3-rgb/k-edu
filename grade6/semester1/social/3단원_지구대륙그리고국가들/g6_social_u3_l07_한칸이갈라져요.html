.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 두 잣대가 만나야 자리가 하나로 정해지는 판 */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.hs-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:#ECFDF5;border-left:4px solid var(--green);border-radius:0 8px 8px 0;padding:6px 9px;line-height:1.45}
.hs-pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.hs-pad button.on{border-color:var(--green);background:#D1FAE5;color:var(--green-d)}
.hs-go button.er{border-color:#CBD5E0;background:#F8FAFC;color:#64748B}
.hs-go button.er:hover{background:#F1F5F9}
.hs-pad button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:9px 4px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10px,1.7vw,12.4px);line-height:1.35}
.hs-pad button:hover{background:var(--bub)}
.hs-pad button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.hs-pad .sp{visibility:hidden}
.hs-go{display:flex;flex-direction:column;gap:5px}
.hs-go button{border:2px solid var(--green);background:#D1FAE5;color:var(--green-d);border-radius:10px;padding:8px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.5px,1.8vw,13px);line-height:1.45}
.hs-go button:hover{background:#A7F3D0}
.hs-go button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.hs-read{display:flex;flex-direction:column;gap:5px}
.hs-read button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.hs-read button:hover{background:var(--bub)}
.hs-read button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.hs-fin{display:flex;flex-direction:column;gap:5px}
.hs-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.hs-fin button:hover{background:var(--bub)}
.hs-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.hs-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.hs-seen{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
.hs-seen .row{border:2px solid var(--line);border-radius:9px;padding:5px 8px;background:#F8FAFC;
  font-size:clamp(9.8px,1.66vw,11.6px);font-weight:700;color:#94A3B8;line-height:1.4}
.hs-seen .row.on{border-color:var(--green);background:#ECFDF5;color:var(--green-d)}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#D1FAE5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;

.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(4,120,87,.32)}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}

.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}

  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}

/* ===== 직접조작 — 한 걸음이 이미 있던 칸을 둘로 쪼개는 판(68번째 신규 패턴) =====
   ★ 앞의 예순일곱 종에서 판의 칸은 처음부터 끝까지 그대로였거나 없던 자리가 하나 열렸을 뿐이다.
     이미 있던 칸 하나가 둘로 쪼개진 적은 한 번도 없다.
   ★ 이번만 적도를 한 번 그으면 아프리카 칸이 위아래 둘로 갈라져 판의 칸이 둘에서 셋이 된다.
   ★ 어느 칸이 쪼개질지는 판이 아니라 그 칸에 놓인 것이 정한다 — `hsSplit` 한 줄.
   ★ 유럽 칸은 적도를 그은 뒤에도 글자 하나 달라지지 않는다.
   ★ 쪼개져도 나라는 한 나라도 자리를 옮기지 않는다.
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. */
const HS_CONT_N = 2;    /* 대륙 둘 */
const HS_LAND_N = 8;    /* 나라 여덟 */

const HS_OWNER = [0,0,0,1,1,1,1,1];
/* ★ 반구 — 0 북반구 · 1 남반구. 이 상수를 대괄호로 읽는 자리는 코드에 hsHemiOf 한 곳뿐이다. */
const HS_HEMI  = [0,0,0,0,0,0,1,1];
const HS_HALF = ['북반구','남반구'];
const HS_LAND_D = [

const HS_ORDER_F = '아직 <b>판을 읽지 않았어요.</b> 판을 먼저 읽어 봐요. 판은 그대로예요.';
const HS_EQ_MSG = '선을 한 번 그었을 뿐인데 <b>판의 칸이 둘에서 셋</b>이 됐어요. 어느 칸이 갈라졌는지 살펴봐요.';

/* ★★ 반구를 읽는 자리 — 코드에 이 한 곳뿐이다. */
function hsHemiOf(i){ return HS_HEMI[i]; }
/* ★★ 어느 칸이 쪼개지는지 — 이 한 줄이 다 정한다. 쪼개짐을 따로 담는 상수도 상태도 없다. */
function hsSplit(st,c){ let n=0,s=0; for(let i=0;i<HS_LAND_N;i++){ if(HS_OWNER[i]===c && ((st.hsPut>>i)&1)){ if(hsHemiOf(i)) s++; else n++; } } return n>0 && s>0; }
function hsBits(m){ let n=0; for(let i=0;i<HS_LAND_N;i++){ if((m>>i)&1) n++; } return n; }
function hsAllPut(st){ return hsBits(st.hsPut)===HS_LAND_N; }
/* 판의 칸 수 — 상수가 아니라 판에 놓인 것이 정한다. */
function hsCells(st){ let n=0; for(let c=0;c<HS_CONT_N;c++){ n += (st.hsEq && hsSplit(st,c)) ? 2 : 1; } return n; }
function hsMine(st,c,half){ const out=[]; for(let i=0;i<HS_LAND_N;i++){ if(HS_OWNER[i]!==c) continue; if(!((st.hsPut>>i)&1)) continue; if(half!=null && hsHemiOf(i)!==half) continue; out.push({s:HS_LAND[i],i:i}); } return out; }

function hsChips(list,y0){
  return list.map((o,j)=>{ const x = 18 + (j%3)*96, y = y0 + Math.floor(j/3)*30;
    return `<rect x="${x}" y="${y}" width="90" height="24" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
      <text x="${x+45}" y="${y+16}" font-size="6.2" fill="#065F46" text-anchor="middle" font-weight="800" data-land="${o.i}">${o.s}</text>`;
  }).join('');
}

    : st.hsEq ? '어느 칸이 갈라졌는지 살펴봐요'
    : allput ? '이제 적도를 그어 봐요'
    : '나라를 골라 알맞은 대륙에 놓아 봐요';

  /* 유럽 칸 — ★ 이 구간은 hsEq를 읽지 않는다. 적도를 그어도 글자 하나 달라지지 않는다. */
  const e = hsMine(st,0,null);
  const euro = `<g data-cont="0" data-split="0" data-contn="${e.length}">
    <rect x="12" y="30" width="296" height="64" rx="8" fill="${e.length?'#ECFDF5':'#fff'}" stroke="${e.length?'#047857':'#E2E8F0'}" stroke-width="${e.length?1.4:1}"/>

        <rect x="12" y="172" width="296" height="46" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.4"/>

        ${hsChips(ss,188)}
      </g>
    </g>`;
  } else {
    const a = hsMine(st,1,null);
    afri = `<g data-cont="1" data-split="0" data-contn="${a.length}">
      <rect x="12" y="100" width="296" height="118" rx="8" fill="${a.length?'#ECFDF5':'#fff'}" stroke="${a.length?'#047857':'#E2E8F0'}" stroke-width="${a.length?1.4:1}"/>

function questionHTML(q,i,st){
  const qs = st.q[i];

    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";

  }).join("");

  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;

  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }





function hsRender(){ main.innerHTML = slides[state.idx].render(state); }
function hsHold(msg){
  state.hsWarn=true; state.hsBusy=true; state.hsMsg=msg;
  playThud(); hsRender();
  setTimeout(()=>{ state.hsBusy=false; state.hsWarn=false; state.hsMsg=null;
    state.hsWrongC=null; state.hsWrongR=null; state.hsWrongF=null; hsRender(); },1600);
}

/* ① 나라 고르기 — 고르는 자리에는 옳고 그름이 없다(정답 상수 부재). */
function hsPick(i){
  if(state.hsFin!=null) return;                                        // 가드①
  if(state.hsBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=HS_LAND_N) return;              // 가드②
  if(hsAllPut(state)) return;                                          // 다 놓은 뒤에는 고르는 자리가 없다
  if((state.hsPut>>i)&1){ hsHold(HS_DUP); return; }                    // 가드③ 판 불변
  state.hsSel = i;
  state.hsWarn=false; state.hsWrongC=null; state.hsMsg=null;
  playBlip(); hsRender();
}

/* ② 대륙에 놓기 — 어긋나면 판 불변. ★ 안내에 알맞은 대륙 이름이 들어가지 않는다. */
function hsPlace(k){
  if(state.hsFin!=null) return;                                        // 가드①
  if(state.hsBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=HS_CONT_N) return;              // 가드②
  if(state.hsSel==null){ hsHold(HS_PICK_FIRST); return; }              // 판 불변
  const i = state.hsSel;
  if(k!==HS_OWNER[i]){ state.hsWrongC=k; hsHold(HS_CONT_NO); return; } // 가드④ 판 불변
  state.hsPut |= (1<<i);                                               // ★ 나라가 놓이는 자리는 여기 한 곳뿐
  state.hsSel = null;
  state.hsWarn=false; state.hsWrongC=null;
  state.hsMsg = hsAllPut(state)
    ? `<b>${HS_LAND[i]}</b>은(는) <b>${HS_CONT[k]}</b>에 있어요. ${HS_LAND_D[i]} 여덟 나라를 모두 놓았어요 \u2014 이제 <b>선을 그어</b> 봐요.`
    : `<b>${HS_LAND[i]}</b>은(는) <b>${HS_CONT[k]}</b>에 있어요. ${HS_LAND_D[i]}`;
  playBlip(); hsRender();
}

/* ③ 적도 긋기 — ★★ 이 걸음이 이 패턴의 핵심이다.
   선을 한 번 그으면 이미 있던 칸 하나가 둘로 쪼개져 판의 칸이 둘에서 셋이 된다.
   어느 칸이 쪼개질지는 판이 아니라 그 칸에 놓인 것이 정한다(`hsSplit`).
   ★ 긋는 자리에는 옳고 그름이 없다 — 정답 상수가 코드에 없고 감점도 없다. */
function hsEquator(){
  if(state.hsFin!=null) return;                                        // 가드①
  if(state.hsBusy) return;                                             // 가드⑨
  if(!hsAllPut(state)){ hsHold(HS_ORDER_E); return; }                  // 가드⑤ 순서 — 판 불변
  if(state.hsEq){ hsHold(HS_ALREADY_E); return; }                      // 가드⑥ 판 불변
  state.hsEq = true;                                                   // ★ 판이 갈라지는 자리는 여기 한 곳뿐
  state.hsWarn=false;
  state.hsMsg = HS_EQ_MSG;
  playBlip(); hsRender();
}

/* ④ 판 읽기 — 적도를 그어야 열린다(가드⑦). 어긋나면 판 불변. */
function hsReadPick(k){
  if(state.hsFin!=null) return;                                        // 가드①
  if(state.hsBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=HS_READ.length) return;         // 가드②
  if(!state.hsEq){ hsHold(HS_ORDER_R); return; }                       // 가드⑦ ★핵심 — 판 불변
  if(state.hsRead!=null){ hsHold(HS_ALREADY_E); return; }              // 판 불변
  if(k===HS_READ_OK){
    state.hsRead=k; state.hsWrongR=null; state.hsWarn=false;
    state.hsMsg = '판을 잘 읽었어요. 갈라진 것은 <b>칸</b>이지 나라가 아니에요 \u2014 나라는 놓인 자리에 그대로 있어요.';
    playChime(); hsRender(); return;
  }
  state.hsWrongR=k;
  hsHold(HS_READ_NO[k]);
}

/* ⑤ 마무리 — 지도서 11차시 지도 꿀 Tip 원문 */
function hsFinish(k){
  if(state.hsFin!=null) return;                                        // 가드①
  if(state.hsBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=HS_FIN.length) return;          // 가드②
  if(state.hsRead==null){ hsHold(HS_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===HS_FIN_OK){
    state.hsFin=k; state.hsWrongF=null; state.hsMsg=null; state.hsWarn=false;
    playChime(); hsRender(); return;
  }
  state.hsWrongF=k;
  hsHold(HS_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u3_l08_둘이이어져요.html'; } // 3단원 8차시
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

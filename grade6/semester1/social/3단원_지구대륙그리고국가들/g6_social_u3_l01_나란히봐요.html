⚠️ 정직 원칙 네 곳
  ㉠ **판의 두 땅·두 자리는 실제 나라·대륙의 이름을 옮기지 않고 기호로만 둔다** — 대륙과 나라의 이름은
     이 주제가 아니라 **뒤 차시** 몫이다(캔버스 캡션 명시).
  ㉡ **실제 활동은 교실에서 세계지도와 지구본을 손에 들고 한다** — 자를 대어 잇고, 실을 매어 잇고,
     테이프로 고정해서 한다. 화면이 다루는 자리는 **같은 물음이 두 자료에서 다르게 보인다는 것**까지다
     (완료 카드 명시).
  ㉢ **판의 그림은 두 자료의 특징을 나타낸 도식이지 실제 지도가 아니다**(캔버스 캡션).
  ㉣ **[생각을 열어요]의 이야기는 교과서가 적은 만큼까지만** — 실제 사람에게 있었던 일이라 나라 이름·
     연도·영화 제목을 옮기지 않고 「먼 나라」·「어느 해」로만 쓴다.

  · **[풍덩] 「지도에 담긴 세계의 모습은 실제와 다를 수 있어요」는 이 차시 원문이라 쓰되**, 두 땅의
    **이름은 옮기지 않고**(8차시 이후 몫) 「위쪽 땅」·「아래쪽 땅」으로 쓰며, **비율·거리 수치 0**으로
    「훨씬 좁아요」·「같은 길이인데 실제 거리는 달라요」까지만 쓴다.

function twRowFull(st,q){ return twHas(st,q,0) && twHas(st,q,1); }
function twDoneN(st){ let n=0; for(let k=0;k<TW_N*2;k++){ if(st.twDone & (1<<k)) n++; } return n; }
function twSitN(st){ let n=0; for(let k=0;k<TW_S;k++){ if(st.twSit & (1<<k)) n++; } return n; }

  } else if(allS){
    right += `<div class="dw-step">\uD83E\uDDE9 두 자료에 나타난 모습이 다른 까닭</div>`;
    right += `<div class="tw-fin">${TW_FIN.map((t,k)=>`<button class="${st.twWrongF===k?'no':''}" onclick="twFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(allQ){
    right += `<div class="dw-step">\uD83C\uDFAF 상황에 알맞은 자료를 골라요</div>`;
    right += `<div class="tw-sit">${TW_SIT.map((s,i)=>{
      const got = !!(st.twSit & (1<<i));
      return `<div class="row"><div class="rt">${'\u2460\u2461\u2462\u2463\u2464'[i]} ${s.t}</div>${
        got ? `<div class="done">\u2713 ${TW_TOOL[s.ok]}</div>`
            : `<div class="two">${TW_TOOL.map((t,v)=>`<button class="${(st.twWrongS && st.twWrongS.i===i && st.twWrongS.v===v)?'no':''}" onclick="twSitPick(${i},${v})">${TW_MARK[v]} ${t}</button>`).join('')}</div>`
      }</div>`;
    }).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\u2696 같은 물음을 두 자료에 대어 봐요</div>`;
    right += `<div class="tw-note">보기는 <b>두 자료가 함께 쓰는 한 벌</b>이에요. 달라지는 것은 <b>어느 자료에서 고르느냐</b>뿐이에요.</div>`;
    right += `<div class="tw-list">${TW_Q.map((o,i)=>`<div class="tw-grp"><div class="gh">${'\u3269\u326A\u326B'[i]} ${o.q}</div>${
      TW_TOOL.map((t,side)=>{
        const got = twHas(st,i,side);
        return `<div class="tw-side"><div class="sh">${TW_MARK[side]} ${t}로 볼 때</div>${
          got ? `<div class="tw-set"><div class="got">\u2713 ${o.opts[TW_ANS[i][side]]}</div></div>`
              : `<div class="tw-set">${o.opts.map((op,k)=>`<button class="${(st.twWrongP && st.twWrongP.q===i && st.twWrongP.side===side && st.twWrongP.k===k)?'no':''}" onclick="twPick(${i},${side},${k})">${op}</button>`).join('')}</div>`
        }</div>`;
      }).join('')
    }${twRowFull(st,i)?`<div class="tw-note" style="margin-top:5px">${TW_WHY[i]}</div>`:''}</div>`).join('')}</div>`;
  }
  if(st.twMsg) right += `<div class="dw-msg${st.twWarn?' warn':''}">${st.twMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\u2696 같은 물음을 두 자료에 대어 봐요</b></div>

    </div>
  </div>`;

    <span style="color:#64748B">지나는 자리의 이름은 <b>교실에서 직접</b> 찾아 적어요. 화면이 그 활동을 대신하지 않아요.</span></div>`
    :`<div class="note">두 줄이 지나는 자리는 같을까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 6 살펴보기 — 직접조작(같은 물음의 답이 자료마다 갈리는 판)
slides.push({stage:2,badge:"개념",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">같은 물음을 두 자료에 대어 봐요</h2>
  <div class="ka-grp">${twPanel(st)}</div>`});
// 7 살펴보기 — reveal: [풍덩 사회 속으로]
slides.push({stage:2,badge:"개념",reveal:true,render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">지도에 담긴 세계의 모습은 실제와 다를 수 있어요</h2>
  <div class="ka-grp">
  <div class="paper"><div class="ph">\uD83C\uDF0A 풍덩 사회 속으로</div>
    우리가 흔히 보는 세계지도에서는 <b>위쪽 땅</b>과 <b>아래쪽 땅</b>이 비슷하게 넓어 보여요. 실제 넓이도 그럴까요? 먼저 떠올려 보고 눌러요.</div>
  <div class="scene-row">${sceneCard('deep','실제 넓이와 견주기','wide')}</div>
  ${st.revealed?`<div class="answer-box">· 흔히 보는 세계지도는 <b>면적이나 거리가 실제와 다르게</b> 나타나기도 해요.<br>
    · 지도에서는 비슷해 보이지만 <b>위쪽 땅은 아래쪽 땅보다 훨씬 좁아요.</b><br>
    · 지도에서 <b>같은 길이</b>로 그은 두 도막도 실제 거리는 서로 달라요.<br>
    · 이러한 문제점을 보완하려고 사람들은 세계지도를 <b>다양한 모양으로</b> 만들기도 해요.</div>`
    :`<div class="note">실제 넓이도 비슷할까요?</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('sum','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">①</span><div><b style="color:var(--green)">지구본</b> — 실제 지구의 모습을 작게 줄여 만든 모형이에요.</div></div>
    <div class="sum-item"><span class="n">②</span><div><b style="color:var(--green)">지구본의 좋은 점과 아쉬운 점</b> — 위치·면적·지역 간 거리가 비교적 정확하지만, 세계의 모습을 한눈에 볼 수 없어요.</div></div>
    <div class="sum-item"><span class="n">③</span><div><b style="color:var(--green)">세계지도</b> — 둥근 지구를 평면으로 나타낸 것이에요.</div></div>
    <div class="sum-item"><span class="n">④</span><div><b style="color:var(--green)">세계지도의 좋은 점과 아쉬운 점</b> — 세계의 모습을 한눈에 살펴볼 수 있지만, 위치·면적 등이 실제와 다르게 나타날 수 있어요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--green)">오늘의 조작</b> — 같은 물음인데 두 자료의 답이 갈렸어요. <b>어느 쪽도 틀리지 않았고</b>, 무엇을 하려는지에 따라 알맞은 자료가 달라져요.</div></div>
  </div>
  <div class="note">실제로 견주어 보는 활동은 <b>교실에서</b> 세계지도와 지구본을 손에 들고 해요. 다음 시간에는 <b style="color:var(--green)">디지털 영상 지도</b>를 살펴봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 활동을 스스로 평가해요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"지구본이 무엇인지와 그 특징을 이야기할 수 있어요",st)}
    ${selfCheck(1,"세계지도가 무엇인지와 그 특징을 이야기할 수 있어요",st)}
    ${selfCheck(2,"상황에 알맞은 자료를 골라 그 까닭을 이야기할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">디지털 영상 지도</b>!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u3_l01";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  twDone:0, twSit:0, twFin:null,
  twWrongP:null, twWrongS:null, twWrongF:null,
  twMsg:null, twWarn:false, twBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function twRender(){ main.innerHTML = slides[state.idx].render(state); }
function twHold(msg){
  state.twWarn=true; state.twBusy=true; state.twMsg=msg;
  playThud(); twRender();
  setTimeout(()=>{ state.twBusy=false; state.twWarn=false; state.twMsg=null;
    state.twWrongP=null; state.twWrongS=null; state.twWrongF=null; twRender(); },1600);
}

/* ① 같은 물음을 두 자료에 각각 대기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   같은 보기 한 벌을 두 자료가 함께 쓰는데 **정답이 자료마다 다르다.**
   그래서 한 자료에서 받지 않은 그 보기가 **다른 자료에서는 맞는 답**이 된다.
   ★ 정답을 읽는 자리는 `TW_ANS[q][side]` 한 곳뿐이다(구조로 대조).
   ⚠️ 순서 자유 — 여섯 자리를 어느 차례로 채워도 좋다. */
function twPick(q,side,k){
  if(state.twFin!=null) return;                                        // 가드①
  if(state.twBusy) return;                                             // 가드⑨
  if(!Number.isInteger(q) || q<0 || q>=TW_N) return;                   // 가드②
  if(!Number.isInteger(side) || side<0 || side>1) return;              // 가드②
  if(!Number.isInteger(k) || k<0 || k>=2) return;                      // 가드②
  if(twHas(state,q,side)){ twHold(TW_ALREADY); return; }               // 가드③ 판 불변
  const ok = TW_ANS[q][side];                                          // ★ 정답을 읽는 자리는 여기 한 곳뿐
  if(k !== ok){                                                        // 가드④ ★핵심 — 판 불변
    state.twWrongP = {q:q, side:side, k:k};
    twHold(TW_OTHER[side]);
    return;
  }
  state.twDone |= 1 << (q*2+side);                                     // ★ 자리가 차는 자리는 여기 한 곳뿐
  state.twWarn=false; state.twWrongP=null;
  state.twMsg = twRowFull(state,q)
    ? `<b>${TW_TOOL[side]}에서도 맞혔어요.</b> 같은 물음인데 두 자료의 답이 달라요. ${TW_GOOD_MSG[q]}`
    : `<b>${TW_TOOL[side]}에서는 맞아요.</b> 같은 물음을 <b>${TW_TOOL[1-side]}</b>에도 대어 봐요.`;
  playBlip(); twRender();
}

/* ② 상황에 알맞은 자료 고르기(지도서 활동지 원문 다섯) — 순서 자유. */
function twSitPick(i,v){
  if(state.twFin!=null) return;                                        // 가드①
  if(state.twBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=TW_S) return;                   // 가드②
  if(!Number.isInteger(v) || v<0 || v>1) return;                       // 가드②
  if(!twAllQ(state)){ twHold(TW_ORDER_S); return; }                    // 가드⑤ 순서 — 판 불변
  if(state.twSit & (1<<i)){ twHold(TW_S_ALREADY); return; }            // 가드⑥ 판 불변
  if(v !== TW_SIT[i].ok){ state.twWrongS={i:i,v:v}; twHold(TW_NO_S); return; } // 가드⑦ 판 불변
  state.twSit |= 1 << i;                                               // ★ 상황이 차는 자리는 여기 한 곳뿐
  state.twWarn=false; state.twWrongS=null;
  state.twMsg = twAllS(state)
    ? `<b>다섯 상황을 모두 골랐어요.</b> 무엇을 하려는지에 따라 알맞은 자료가 달라졌어요.`
    : `<b>알맞게 골랐어요.</b> 남은 상황도 골라 봐요.`;
  playBlip(); twRender();
}

/* ③ 마무리 — 「두 자료에 나타난 모습이 다른 까닭」(지도서 [친구와 활동] 예시 답안 원문) */
function twFinish(k){
  if(state.twFin!=null) return;                                        // 가드①
  if(state.twBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=TW_FIN.length) return;          // 가드②
  if(!twAllS(state)){ twHold(TW_ORDER_F); return; }                    // 가드⑧ 순서 — 판 불변
  if(k===TW_FIN_OK){
    state.twFin=k; state.twWrongF=null; state.twMsg=null; state.twWarn=false;
    playChime(); twRender(); return;
  }
  state.twWrongF=k;
  twHold(TW_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u3_l02_적어야남아요.html'; } // 3단원 2차시(l02) 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

직접조작: 출발한 자리로 돌아와야 닫히는 판 ·
         이미 다녀온 자리를 다시 밟는 걸음이 판을 완성하는 형(70번째 신규 패턴)
  ⭐ 앞의 예순아홉 종에서 **이미 놓인 자리·이미 다녀온 자리를 다시 누르는 일은 언제나 가드였다** —
     「이미 놓았어요. 판은 그대로예요」(대다수) · 「이미 이었어요」(69번) · 「이미 대어 봤어요」(67번).
     걸음은 언제나 **새 자리**로만 갔고, 판이 스스로 되돌아간 자리(46번·55번·58번)도 학생의 걸음이
     돌아간 것이 아니었다. **학생의 걸음이 처음 자리로 되돌아가 그것으로 판이 완성된 적은 한 번도 없다.**
  ⭐ 이번만 **이미 다녀온 자리를 다시 밟는 걸음이 판을 바꾼다** — 여섯 나라를 다 들러도 판은
     「아직 길이 아니에요」이고, **출발한 우리나라로 돌아오는 한 걸음**이 길을 닫는다.
     근거는 교과서 155쪽 [생각을 펼쳐요] 3 활동판이 **「대한민국 출발」**에서 시작해 **「대한민국 도착」**으로
     끝난다는 것과, 지도서 13차시 예시 답안 원문 「우리나라에서 출발하여 …을 거쳐 **우리나라로 돌아오는**
     여행 경로를 계획했습니다」이다. 여행 경로는 나라를 늘어놓은 줄이 아니라 **돌아와서 닫히는 길**이다.
  ⭐ **돌아오는 걸음은 나라를 하나도 더하지 않는다** — 들른 나라는 여섯 그대로이고, 늘어나는 것은
     **이어진 선 하나**뿐이다(여섯 → 여섯 · 선 여섯 → 일곱). 판 갈래로 들른 나라 목록의 **문자열 동일성**을
     대조한다. ★ 69번(둘이 이어지는 판)과 견주면 — 거기서도 나라는 자리를 옮기지 않았지만 판에
     **새 것**(좁고 잘록한 땅)이 놓였다. 여기서는 새 것이 하나도 놓이지 않고 **이미 있던 자리로 돌아간다.**
  ⭐ **여섯을 다 들르기 전에는 돌아올 수 없다**(핵심 가드) — 판 불변이고, 안내는 「아직 들르지 않은 나라가
     있어요」까지만 말한다. 안내 상수에 **나라 이름 0**(상수 차원 대조).
  ⭐ **들르는 차례에는 옳고 그름이 없다** — 정답 차례 상수가 코드에 아예 없다(`RT_ORDER_OK`·`RT_ROUTE` 부재).
     720 순열 어느 차례로 들러도 돌아오면 닫히고, 완주 판의 들른 나라 수·이어진 선의 수가 같다.
     ⚠️ 49번(재료가 차례를 정하는 판)과 견주면 — 거기서는 되는 차례가 셋뿐이었다. 여기서는 **전부** 된다.
     지도서가 「각 나라의 위치를 고려」하라고 했지만 그것은 학생이 세계지도를 펴고 정하는 몫이고,
     판은 차례를 재지 않는다(정직 원칙 ㉣).
  ⭐ **닫힘을 정하는 것이 코드에 한 줄이다** — `rtClosed(st) = st.rtBack===true`, 이어진 선의 수는
     `rtSeg(st) = 들른 나라 수 + (닫혔으면 1)` 한 줄. 선의 수를 따로 담는 상태도, 닫힘을 따로 담는 배열도 없다.
     돌아오는 자리(`state.rtBack = true`)는 코드에 **단 하나**이고 되돌리는 자리는 0,
     들르는 자리(`state.rtPath.push`)도 단 하나이고 덜어 내는 자리는 0이다.
  ⭐ **판에 놓는 것이 두 갈래다** — 나라는 들르고(새 자리), 우리나라는 돌아온다(다녀온 자리).

⚠️ 정직 원칙 네 곳
  ㉠ **판의 자리는 대륙별로 나눈 도식이지 실제 세계지도나 지구본이 아니다** — 판의 선은 실제 거리와
     방향을 나타내지 않는다(캡션 · 상시 노출).
  ㉡ **판의 여섯 나라와 그 까닭은 지도서 예시 답안이다** — 가 보고 싶은 나라와 까닭은 학생이
     직접 정해 교과서 표에 쓴다(캡션 · 완료 카드 명시).
  ㉢ **여행 경로를 세계지도에 그리고 친구들에게 소개하는 일은 교실 몫**이다(완료 카드 명시).
  ㉣ **판은 들르는 차례에 옳고 그름을 두지 않는다** — 나라의 위치를 고려해 차례를 정하는 일은 세계지도를
     펴고 하는 학생의 몫이고, 판이 다루는 자리는 **출발한 곳으로 돌아와야 길이 닫힌다**는 것까지다.

.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:11px 15px;
  font-size:clamp(13px,2.2vw,16.5px);line-height:1.6}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;

.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 출발한 자리로 돌아와야 닫히는 판 */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);

.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;

.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.rt-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:#ECFDF5;border-left:4px solid var(--green);border-radius:0 8px 8px 0;padding:6px 9px;line-height:1.45}
.rt-pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.rt-pad button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 4px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10px,1.7vw,12.4px);line-height:1.35;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.rt-pad button .ct{font-size:clamp(8.4px,1.4vw,10px);font-weight:700;color:#64748B}

.rt-home button:hover{background:#FEF3C7}

.rt-read button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;

.rt-read button:hover{background:var(--bub)}
.rt-read button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.rt-fin{display:flex;flex-direction:column;gap:5px}
.rt-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.rt-fin button:hover{background:var(--bub)}
.rt-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.rt-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#D1FAE5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;

.ka-nav svg{width:16px;height:16px}

.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(4,120,87,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}

     학생의 걸음이 처음 자리로 되돌아가 그것으로 판이 완성된 적은 한 번도 없다.
   ★ 이번만 이미 다녀온 자리(우리나라)를 다시 밟는 걸음이 판을 닫는다.
     여섯 나라를 다 들러도 판은 길이 아니고, 출발한 곳으로 돌아오는 한 걸음이 길을 닫는다.
   ★ 돌아오는 걸음은 나라를 하나도 더하지 않는다 — 늘어나는 것은 이어진 선 하나뿐이다.
   ★ 들르는 차례에는 옳고 그름이 없다 — 정답 차례 상수가 코드에 없다(RT_ORDER_OK·RT_ROUTE 부재).
   ★ 닫힘을 정하는 것이 코드에 한 줄이다(rtClosed) · 선의 수도 한 줄이다(rtSeg).

/* ★★ 닫힘을 정하는 한 줄 — 닫힘을 따로 담는 배열도 상수도 없다. */
function rtClosed(st){ return st.rtBack===true; }
function rtStops(st){ return st.rtPath.length; }
function rtAll(st){ return rtStops(st)===RT_N; }
/* ★★ 이어진 선의 수 — 이 한 줄이 다 정한다. 돌아오면 나라가 아니라 선이 하나 는다. */
function rtSeg(st){ return rtStops(st) + (rtClosed(st)?1:0); }
function rtVisited(st,i){ return st.rtPath.indexOf(i)>=0; }
/* 판의 자리 — 대륙별 도식 좌표(실제 위치 아님) */
function rtNodeXY(i){ return {x:18+(i%3)*96, y:100+Math.floor(i/3)*70}; }
function rtCenter(i){ if(i<0) return {cx:160,cy:53}; const p=rtNodeXY(i); return {cx:p.x+45,cy:p.y+20}; }

function rtCanvas(st){
  const fin = st.rtFin!=null, all = rtAll(st), closed = rtClosed(st), stops = rtStops(st), seg = rtSeg(st);
  const head = fin ? '가 보고 싶은 나라를 정해 여행 경로를 만들었어요'
    : st.rtRead!=null ? '판을 읽었어요 \u2014 이제 정리해요'
    : closed ? '출발한 곳으로 돌아왔어요 \u2014 여행 경로가 닫혔어요'
    : all ? '여섯 나라를 다 들렀어요 \u2014 그런데 아직 길이 아니에요'
    : '대륙마다 하나씩, 나라를 들러 봐요';

  /* 출발·도착 자리 — 우리나라 */
  const homeg = `<g data-home="1" data-closed="${closed?1:0}">
    <rect x="112" y="40" width="96" height="26" rx="7" fill="${closed?'#FEF3C7':'#fff'}" stroke="${closed?'#B45309':'#047857'}" stroke-width="1.6"/>
    <text x="160" y="52" font-size="7.4" fill="${closed?'#92400E':'#065F46'}" text-anchor="middle" font-weight="800">${RT_HOME}</text>
    <text x="160" y="61" font-size="5.2" fill="#64748B" text-anchor="middle" font-weight="700">${closed?'출발 \u00b7 도착':'출발'}</text>
  </g>`;

  /* ★ 이어진 선 — 들른 순서대로 앞 자리에서 다음 자리로. 닫히면 마지막 자리에서 출발 자리로 한 줄 더. */
  let lines='';
  for(let k=0;k<stops;k++){
    const a = rtCenter(k===0?-1:st.rtPath[k-1]), b = rtCenter(st.rtPath[k]);
    lines += `<line x1="${a.cx}" y1="${a.cy}" x2="${b.cx}" y2="${b.cy}" stroke="#047857" stroke-width="1.8" data-seg="${k}"/>`;
  }
  if(closed){
    const a = rtCenter(st.rtPath[stops-1]), b = rtCenter(-1);
    lines += `<line x1="${a.cx}" y1="${a.cy}" x2="${b.cx}" y2="${b.cy}" stroke="#B45309" stroke-width="2.2" data-close="1"/>`;
  }

  /* 여섯 나라 자리 — ★ 이 구간은 rtBack을 읽지 않는다. 돌아와도 글자 하나 달라지지 않는다. */
  let nodes='';
  for(let i=0;i<RT_N;i++){
    const p = rtNodeXY(i), on = rtVisited(st,i), ord = st.rtPath.indexOf(i);
    nodes += `<g data-node="${i}" data-on="${on?1:0}">
      <rect x="${p.x}" y="${p.y}" width="90" height="40" rx="7" fill="${on?'#D1FAE5':'#F8FAFC'}" stroke="${on?'#047857':'#CBD5E0'}" stroke-width="${on?1.4:1}"/>
      <text x="${p.x+45}" y="${p.y+14}" font-size="5.4" fill="#64748B" text-anchor="middle" font-weight="700">${RT_CONT[i]}</text>
      <text x="${p.x+45}" y="${p.y+29}" font-size="7.4" fill="${on?'#065F46':'#94A3B8'}" text-anchor="middle" font-weight="800" data-land="${i}">${RT_LAND[i]}</text>
      ${on?`<circle cx="${p.x+9}" cy="${p.y+9}" r="6.5" fill="#047857"/><text x="${p.x+9}" y="${p.y+11.6}" font-size="6.4" fill="#fff" text-anchor="middle" font-weight="800" data-ord="${ord+1}">${ord+1}</text>`:''}
    </g>`;
  }

  const segmsg = closed
    ? `이어진 선 ${seg}개 \u2014 출발한 곳으로 돌아와 길이 닫혔어요`
    : all ? `이어진 선 ${seg}개 \u2014 아직 열려 있어요 · 길이 아니에요`
    : `이어진 선 ${seg}개 \u2014 아직 열려 있어요`;
  return `<svg viewBox="0 0 320 280" data-stops="${stops}" data-seg="${seg}" data-back="${closed?1:0}" data-path="${st.rtPath.join('-')}" data-read="${st.rtRead==null?-1:st.rtRead}" data-fin="${fin?1:0}">
    <rect width="320" height="280" fill="#fff"/>
    <rect x="12" y="8" width="296" height="16" rx="6" fill="#D1FAE5"/>
    <text x="160" y="20" font-size="7.6" fill="#065F46" text-anchor="middle" font-weight="800">${head}</text>
    ${lines}
    ${homeg}
    ${nodes}
    <rect x="12" y="232" width="296" height="20" rx="6" fill="#FEF3C7"/>
    <text x="160" y="246" font-size="7" fill="#92400E" text-anchor="middle" font-weight="800" data-segmsg="1">${segmsg}</text>
    <rect x="12" y="258" width="296" height="18" rx="6" fill="#F1F5F9"/>
    <text x="160" y="270" font-size="6.4" fill="#334155" text-anchor="middle" font-weight="800" data-tally="1">들른 나라 ${stops} / ${RT_N} \u00b7 돌아와도 들른 나라는 늘지 않아요</text>
  </svg>`;
}

function rtPanel(st){
  const fin = st.rtFin!=null, all = rtAll(st), closed = rtClosed(st);
  const q = fin ? '가 보고 싶은 나라를 정해 여행 경로를 만들었어요.'

      들르는 <b>차례</b>는 판이 정해 두지 않았어요. 어느 차례로 들러도 돌아오면 닫혔어요.<br>
      <span style="color:#64748B">판의 여섯 나라와 까닭은 <b>지도서 예시 답안</b>이에요. <b>가 보고 싶은 나라와 까닭</b>은
      내가 직접 정해 교과서 표에 써요. 나라의 <b>위치를 고려해</b> 차례를 정하고, 여행 경로를
      <b>세계지도에 그리고 친구들에게 소개하는 일</b>은 교실에서 직접 해요.</span></div>`;
  } else if(st.rtRead!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="rt-fin">${RT_FIN.map((t,k)=>`<button class="${st.rtWrongF===k?'no':''}" onclick="rtFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(closed){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="rt-read">${RT_READ.map((t,k)=>`<button class="${st.rtWrongR===k?'no':''}" onclick="rtReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\u2708\uFE0F 나라를 들러요</div>`;
    right += `<div class="rt-pad">${RT_LAND.map((t,i)=>`<button class="${rtVisited(st,i)?'on':''}" onclick="rtVisit(${i})"><span class="ct">${RT_CONT[i]}</span>${t}</button>`).join('')}</div>`;
    right += `<div class="rt-home"><button onclick="rtReturn()">\uD83C\uDFE0 ${RT_HOME}로 돌아와요</button></div>`;
    right += `<div class="rt-note">${all?'여섯 나라를 다 들렀어요. 여행 경로는 <b>출발한 곳</b>에서 시작해 <b>출발한 곳</b>에서 끝나요.':'대륙마다 <b>하나씩</b> 들러요. 들르는 차례에 감점은 없어요.'}</div>`;
  }
  if(st.rtMsg) right += `<div class="dw-msg${st.rtWarn?' warn':''}">${st.rtMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83E\uDDED 돌아와야 닫히는 판</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${rtCanvas(st)}<div class="cvcap">판의 자리는 <b>대륙별로 나눈 도식</b>이지 실제 세계지도나 지구본이 아니에요. 판의 선은 실제 거리와 방향을 나타내지 않아요. 여섯 나라와 까닭은 <b>지도서 예시 답안</b>이에요.</div></div>
      <div class="dw-right">${right}</div>

  </div>`;
}

      <div class="sum-item"><span class="n">\u2460</span><div><b style="color:var(--green)">소개하기</b> \u2014 완성한 여행 경로를 친구들에게 소개해요. 어느 대륙의 어느 나라를 어떤 차례로 들르는지 말해요.</div></div>
      <div class="sum-item"><span class="n">\u2461</span><div><b style="color:var(--green)">발표하기</b> \u2014 친구들이 소개한 내용 중에서 <b>인상 깊었던 점</b>을 발표해요.</div></div>
      <div class="sum-item"><span class="n">\u2462</span><div><b style="color:var(--green)">핵심 역량</b> \u2014 나라에 관한 지리 정보를 조사하고 여행 경로를 만들어 보는 활동으로 <b>정보 활용 능력</b>과 <b>창의적 사고력</b>을 길러요.</div></div>
    </div>
    <div class="note">소개하는 일과 발표하는 일은 <b>교실에서 직접</b> 해요.</div></div>`});
// 7 살펴보기 — 되짚기: 예시 답안 여섯 나라의 위치와 영토 특징
slides.push({stage:2,badge:"개념",render:()=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">예시 답안의 여섯 나라를 되짚어요</h2>
  <div class="ka-grp">
    <div class="sum-list">
      <div class="sum-item"><span class="n">\u2460</span><div><b style="color:var(--green)">일본</b>(아시아) \u2014 섬나라예요.</div></div>
      <div class="sum-item"><span class="n">\u2461</span><div><b style="color:var(--green)">뉴질랜드</b>(오세아니아) \u2014 남반구에 있고, 두 개의 큰 섬과 여러 개의 작은 섬으로 이루어져 있어요.</div></div>
      <div class="sum-item"><span class="n">\u2462</span><div><b style="color:var(--green)">독일</b>(유럽) \u2014 아홉 나라와 국경을 맞대고 있어요.</div></div>
      <div class="sum-item"><span class="n">\u2463</span><div><b style="color:var(--green)">이집트</b>(아프리카) \u2014 국경선 일부가 직선으로 반듯해요.</div></div>
      <div class="sum-item"><span class="n">\u2464</span><div><b style="color:var(--green)">미국</b>(북아메리카) \u2014 캐나다를 사이에 두고 본토와 알래스카 지역으로 나뉘어 있어요.</div></div>
      <div class="sum-item"><span class="n">\u2465</span><div><b style="color:var(--green)">칠레</b>(남아메리카) \u2014 남아메리카 서부에 있고, 동서 길이에 비해 남북 길이가 매우 길어요.</div></div>
    </div>
    <div class="note">어느 나라도 더 좋거나 나쁘지 않아요 \u2014 <b>가 보고 싶은 까닭</b>은 사람마다 달라요.</div></div>`});
// 8~15 문항
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('sum','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">\u2460</span><div><b style="color:var(--green)">정하기</b> \u2014 대륙별로 가 보고 싶은 나라를 하나씩 정하고 그 까닭을 써요.</div></div>
    <div class="sum-item"><span class="n">\u2461</span><div><b style="color:var(--green)">살펴보기</b> \u2014 지구본, 세계지도, 디지털 영상 지도로 그 나라의 위치와 영토의 특징을 살펴봐요.</div></div>
    <div class="sum-item"><span class="n">\u2462</span><div><b style="color:var(--green)">만들기</b> \u2014 각 나라의 위치를 고려해 여행 경로를 만들고, 세계지도에 나타내요.</div></div>
    <div class="sum-item"><span class="n">\u2463</span><div><b style="color:var(--green)">소개하기</b> \u2014 완성한 여행 경로를 친구들에게 소개하고, 인상 깊었던 점을 발표해요.</div></div>
    <div class="sum-item"><span class="n">\u2605</span><div><b style="color:var(--green)">오늘의 조작</b> \u2014 여섯 나라를 다 들러도 길이 아니었고, <b>출발한 곳으로 돌아오는 한 걸음</b>이 길을 닫았어요. 들른 나라는 여섯 그대로였어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b>'지구, 대륙 그리고 국가들'</b>에서 공부한 내용을 정리해요.</div></div>`});
// 17 정리: 자기 평가 — 지도서 13차시 지도 방법 3항
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 활동을 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"지구본과 세계지도, 디지털 영상 지도를 활용해 나라의 위치와 영토 특징을 조사했어요",st)}
    ${selfCheck(1,"대륙 및 나라의 위치를 고려해 여행 경로를 만들었어요",st)}
    ${selfCheck(2,"친구들에게 여행 경로를 소개하고, 인상 깊었던 점을 발표했어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">'지구, 대륙 그리고 국가들'</b>에서 공부한 내용을 정리해요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u3_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  rtPath:[], rtBack:false, rtRead:null, rtFin:null,
  rtWrongR:null, rtWrongF:null,
  rtMsg:null, rtWarn:false, rtBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function rtRender(){ main.innerHTML = slides[state.idx].render(state); }
function rtHold(msg){
  state.rtWarn=true; state.rtBusy=true; state.rtMsg=msg;
  playThud(); rtRender();
  setTimeout(()=>{ state.rtBusy=false; state.rtWarn=false; state.rtMsg=null;
    state.rtWrongR=null; state.rtWrongF=null; rtRender(); },1600);
}

/* ① 나라 들르기 — 들르는 자리에는 옳고 그름이 없다(정답 차례 상수 부재). 순서 자유. */
function rtVisit(i){
  if(state.rtFin!=null) return;                                        // 가드①
  if(state.rtBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=RT_N) return;                   // 가드②
  if(rtClosed(state)){ rtHold(RT_CLOSED_VISIT); return; }              // 가드⑤ 판 불변
  if(rtVisited(state,i)){ rtHold(RT_DUP); return; }                    // 가드③ 판 불변
  state.rtPath.push(i);                                                // ★ 나라가 들르는 자리는 여기 한 곳뿐
  state.rtWarn=false;
  state.rtMsg = rtAll(state)
    ? `<b>${RT_LAND[i]}</b> \u2014 ${RT_WHY[i]} ${RT_LAND_D[i]} ${RT_ALL_MSG}`
    : `<b>${RT_LAND[i]}</b> \u2014 ${RT_WHY[i]} ${RT_LAND_D[i]}`;
  playBlip(); rtRender();
}

/* ② 우리나라로 돌아오기 — ★★ 이 걸음이 이 패턴의 핵심이다.
   이미 다녀온 자리를 다시 밟는 걸음이 판을 닫는다. 나라는 하나도 늘지 않는다.
   ★ 인자 0 · 여섯을 다 들러야 열린다(가드④) · 안내에 나라 이름 0. */
function rtReturn(){
  if(state.rtFin!=null) return;                                        // 가드①
  if(state.rtBusy) return;                                             // 가드⑨
  if(rtClosed(state)){ rtHold(RT_ALREADY_BACK); return; }              // 가드⑥ 판 불변
  if(!rtAll(state)){ rtHold(RT_ORDER_BACK); return; }                  // 가드④ ★핵심 — 판 불변
  state.rtBack = true;                                                 // ★ 판이 닫히는 자리는 여기 한 곳뿐
  state.rtWarn=false;
  state.rtMsg = RT_BACK_MSG;
  playBlip(); rtRender();
}

/* ③ 판 읽기 — 닫혀야 열린다(가드⑦). 어긋나면 판 불변. */
function rtReadPick(k){
  if(state.rtFin!=null) return;                                        // 가드①
  if(state.rtBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RT_READ.length) return;         // 가드②
  if(!rtClosed(state)){ rtHold(RT_ORDER_R); return; }                  // 가드⑦ 순서 — 판 불변
  if(state.rtRead!=null){ rtHold(RT_ALREADY_BACK); return; }           // 판 불변
  if(k===RT_READ_OK){
    state.rtRead=k; state.rtWrongR=null; state.rtWarn=false;
    state.rtMsg = '판을 잘 읽었어요. 여행 경로는 나라를 늘어놓은 줄이 아니라 <b>출발한 곳으로 돌아와서 닫히는 길</b>이에요.';
    playChime(); rtRender(); return;
  }
  state.rtWrongR=k;
  rtHold(RT_READ_NO[k]);
}

/* ④ 마무리 — 교과서 155쪽 [생각을 펼쳐요] 3 원문 */
function rtFinish(k){
  if(state.rtFin!=null) return;                                        // 가드①
  if(state.rtBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RT_FIN.length) return;          // 가드②
  if(state.rtRead==null){ rtHold(RT_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===RT_FIN_OK){
    state.rtFin=k; state.rtWrongF=null; state.rtMsg=null; state.rtWarn=false;
    playChime(); rtRender(); return;
  }
  state.rtWrongF=k;
  rtHold(RT_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 10차시 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

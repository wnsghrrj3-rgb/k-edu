⚠️ 정직 원칙 네 곳
  ㉠ **판의 격자는 위선과 경선이 만나는 것을 나타낸 도식이지 실제 지구본이나 세계지도가 아니다**(캡션).
     교과서 지도는 10° 단위로 그어져 있지만 판은 자리를 세기 쉽도록 성글게 그었다.
  ㉡ **판의 자리에는 나라의 이름을 옮기지 않는다** — 그 자리가 실제로 어느 나라인지는 **교실에서**
     세계지도와 지구본을 펴고 찾는다(캔버스 캡션·완료 카드 명시).
  ㉢ **적도와 본초 자오선을 빨간색·파란색으로 표시하는 활동과 빗금을 치는 활동은 교실 몫**이다 —
     화면이 다루는 자리는 **두 선이 만나야 자리가 하나로 정해진다**는 것까지다(완료 카드 명시).
  ㉣ **[재미있게 확인해요]는 재현하지 않는다** — 문제를 풀고 그 답의 화살표 방향대로 위선과 경선을
     따라가 도착한 지점의 나라를 쓰는 활동이라 교과서 지도가 있어야 한다. 정리에서 교과서를 펴서
     직접 풀어 보라고 **안내하는 데까지만** 한다(5-1 u3 l05 · 6-1 u1 l09 · u2 l13 규약 승계).

.opt{background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;
  font-family:inherit;font-size:clamp(13px,2.2vw,16.5px);font-weight:500;text-align:left;line-height:1.5;transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:#16A34A;background:#DCFCE7;font-weight:700}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:11px;border-radius:12px;padding:12px 16px;font-size:clamp(13px,2.2vw,16px);line-height:1.6;animation:fadeUp .3s ease both}
.fb.ok{background:#DCFCE7;color:#166534;font-weight:700}
.hint{margin-top:9px;background:var(--amber-bg);border-radius:11px;padding:10px 14px;
  font-size:clamp(12.5px,2.1vw,15px);color:var(--amber);line-height:1.55}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:9px;width:100%;max-width:660px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:11px 15px;
  font-size:clamp(13px,2.2vw,16.5px);line-height:1.6}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'\2713';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 두 잣대가 만나야 자리가 하나로 정해지는 판 */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--amber)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.pn-q{font-size:clamp(11.6px,1.97vw,14px);font-weight:800;color:var(--green);
  background:#ECFDF5;border-left:4px solid var(--green);border-radius:0 8px 8px 0;padding:6px 9px;line-height:1.45}
.pn-pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.pn-pad button.on{border-color:var(--green);background:#D1FAE5;color:var(--green-d)}
.pn-go button.er{border-color:#CBD5E0;background:#F8FAFC;color:#64748B}
.pn-go button.er:hover{background:#F1F5F9}
.pn-pad button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:9px 4px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10px,1.7vw,12.4px);line-height:1.35}
.pn-pad button:hover{background:var(--bub)}
.pn-pad button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pn-pad .sp{visibility:hidden}
.pn-go{display:flex;flex-direction:column;gap:5px}
.pn-go button{border:2px solid var(--green);background:#D1FAE5;color:var(--green-d);border-radius:10px;padding:8px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.5px,1.8vw,13px);line-height:1.45}
.pn-go button:hover{background:#A7F3D0}
.pn-go button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pn-read{display:flex;flex-direction:column;gap:5px}
.pn-read button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.pn-read button:hover{background:var(--bub)}
.pn-read button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pn-fin{display:flex;flex-direction:column;gap:5px}
.pn-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.pn-fin button:hover{background:var(--bub)}
.pn-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pn-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
.pn-seen{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
.pn-seen .row{border:2px solid var(--line);border-radius:9px;padding:5px 8px;background:#F8FAFC;
  font-size:clamp(9.8px,1.66vw,11.6px);font-weight:700;color:#94A3B8;line-height:1.4}
.pn-seen .row.on{border-color:var(--green);background:#ECFDF5;color:var(--green-d)}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#D1FAE5;border-radius:12px;padding:11px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#7C2D12;max-width:660px}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(4,120,87,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ===== 직접조작 — 두 걸음이 만나야 자리가 정해지는 판(65번째 신규 패턴) =====
   ⭐ 앞의 예순네 종에서 **한 걸음은 언제나 판의 무엇인가를 정했다.** 64번째(따로 도는 두 잣대의 판)에서
      남북으로 옮기면 햇볕 칸이 곧바로 달라졌고, 63번째(배율을 옮기는 판)에서 배율을 옮기면 판이 곧바로
      달라졌다. 한 걸음을 밟았는데 판이 「아직 정해지지 않았어요」라고 답한 적이 없다.
   ⭐ 이번만 **한 걸음으로는 자리가 정해지지 않는다.** 위선 하나를 그으면 그 위선 위의 다섯 자리가 모두
      후보로 남고, 경선 하나를 그어도 마찬가지다. **두 선이 만나야 후보가 하나로 줄어든다.**
      근거는 교과서 134쪽 본문 「위선과 경선이 만나는 지점으로 위치를 표현할 수 있습니다」이다.
   ⭐ **36번째(양쪽이 다 놓여야 판이 입을 여는 형)와의 정면 대비** — 거기서는 한쪽만 놓으면 판이 아무
      판정도 하지 않고 **기다렸다.** 여기서는 한쪽만 그어도 판이 곧바로 반응하되 그 반응이
      **「아직 다섯 곳이 남았다」**이다. 침묵이 아니라 **여럿을 보여 주는 것**이다.
   ⭐ **후보를 따로 담는 상태가 코드에 아예 없다** — `pnCand(st)` 한 줄이 후보 수를 다 정한다.
   ⭐ **어느 잣대를 먼저 그어도 같은 자리가 나온다**(긋는 차례 자유).
   ⭐ **지우면 후보가 도로 늘어난다**(1 → 5 → 25).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 긋는 자리에 옳고 그름 0. */
const PN_LAT_N = 5;   /* 위선 다섯 */
const PN_LON_N = 5;   /* 경선 다섯 */

/* 위선 다섯 — 적도를 가운데 두고 성글게 그은 자리(교과서 지도는 10° 단위 · 판은 도식이다). */
const PN_LAT_S = ['북위 60°','북위 30°','적도 0°','남위 30°','남위 60°'];
/* 경선 다섯 — 본초 자오선을 가운데 두고 성글게 그은 자리. */
const PN_LON_S = ['서경 60°','서경 30°','본초 자오선 0°','동경 30°','동경 60°'];

/* ★ 찾을 자리 셋 — 판에는 나라의 이름을 옮기지 않고 기호로만 둔다(정직 원칙 ㉡). */
const PN_TASK = [{lat:1, lon:3}, {lat:4, lon:0}, {lat:2, lon:2}];
const PN_TASK_M = ['\u32AE','\u32AF','\u32B0'];

const PN_READ = [
  '위선을 먼저 그으면 안 되기 때문이에요',
  '위선 하나 위에는 여러 자리가 있어서, 경선과 만나야 자리가 하나로 정해지기 때문이에요',
  '위선 하나만으로도 이미 정해졌는데 판이 일부러 늦춘 것이에요'
];
const PN_READ_OK = 1;
const PN_READ_NO = [
  '경선을 먼저 그었을 때에도 <b>자리가 하나로 정해지지 않았어요.</b> 다시 살펴봐요. 판은 그대로예요.',
  '',
  '위선만 그었을 때 판에 <b>남은 자리가 몇 곳</b>이었는지 떠올려 봐요. 판은 그대로예요.'
];

const PN_FIN = [
  '위선 하나만으로 위치를 표현할 수 있어요',
  '경선 하나만으로 위치를 표현할 수 있어요',
  '위선과 경선이 만나는 지점으로 위치를 표현할 수 있어요'
];
const PN_FIN_OK = 2;
const PN_FIN_NO = [
  '위선 하나 위에는 <b>여러 자리</b>가 있었어요. 다시 생각해 봐요.',
  '경선 하나 위에도 <b>여러 자리</b>가 있었어요. 다시 생각해 봐요.',
  ''
];

/* ★ 핵심 가드 안내 — 한 걸음으로는 자리가 정해지지 않는다. */
const PN_ONE = '아직 <b>한 잣대만 그었어요.</b> 남은 자리가 여럿이라 아직 하나로 정할 수 없어요. 다른 잣대도 그어 봐요. 판은 그대로예요.';
const PN_NONE_YET = '아직 <b>아무 잣대도 긋지 않았어요.</b> 위선이나 경선을 먼저 그어 봐요. 판은 그대로예요.';
const PN_DUP_LAT = '위선은 <b>이미 그어 두었어요.</b> 바꾸려면 먼저 <b>지우기</b>를 눌러요. 판은 그대로예요.';
const PN_DUP_LON = '경선은 <b>이미 그어 두었어요.</b> 바꾸려면 먼저 <b>지우기</b>를 눌러요. 판은 그대로예요.';
const PN_ERASE_NONE = '지울 잣대가 <b>아직 없어요.</b> 판은 그대로예요.';
const PN_ORDER_R = '아직 <b>세 자리를 다 정하지 않았어요.</b> 남은 자리를 먼저 찾아봐요. 판은 그대로예요.';
const PN_READ_DONE = '판은 <b>이미 다시 읽었어요.</b> 판은 그대로예요.';
const PN_ORDER_F = '아직 <b>판을 다시 읽지 않았어요.</b> 판은 그대로예요.';

/* ★★ 후보 수 — 이 한 줄이 판의 후보를 다 정한다. 후보를 따로 담는 상태가 코드에 없다. */
function pnCand(st){ return (st.pnLat<0 ? PN_LAT_N : 1) * (st.pnLon<0 ? PN_LON_N : 1); }
/* ★ 두 잣대가 다 그어졌는가 — 자리가 하나로 정해졌는가와 같은 말이다. */
function pnBoth(st){ return st.pnLat>=0 && st.pnLon>=0; }
function pnAllDone(st){ return st.pnStep >= PN_TASK.length; }
function pnOpenRead(st){ return pnAllDone(st); }

function pnCanvas(st){
  const fin = st.pnFin!=null, read = st.pnRead!=null, cand = pnCand(st);
  const head = fin ? '위치를 표현하는 방법을 정리했어요'
    : read ? '이제 오늘 공부한 것을 정리해요'
    : pnAllDone(st) ? '세 자리를 다 찾았어요 — 판을 다시 읽어 볼까요?'
    : pnBoth(st) ? '자리가 하나로 정해졌어요'
    : cand<PN_LAT_N*PN_LON_N ? '아직 자리가 여럿이에요'
    : '위선이나 경선을 그어 봐요';

  const rows = PN_LAT_S.map((s,k)=>{
    const on = st.pnLat===k;
    return `<line x1="12" y1="${44+k*28}" x2="308" y2="${44+k*28}" stroke="${on?'#0D9488':'#E2E8F0'}" stroke-width="${on?2.8:1}"/>`;
  }).join('');
  const cols = PN_LON_S.map((s,j)=>{
    const on = st.pnLon===j;
    return `<line x1="${42+j*56}" y1="28" x2="${42+j*56}" y2="168" stroke="${on?'#B45309':'#E2E8F0'}" stroke-width="${on?2.8:1}"/>`;
  }).join('');

  /* ★ 후보 점 — 한 잣대만 그으면 그 줄(또는 칸)의 다섯 자리가 모두 후보로 남는다. */
  let dots = '';
  if(st.pnLat>=0 && st.pnLon<0){
    dots = PN_LON_S.map((s,j)=>`<circle cx="${42+j*56}" cy="${44+st.pnLat*28}" r="3.4" fill="#94A3B8" data-dot="1"/>`).join('');
  } else if(st.pnLon>=0 && st.pnLat<0){
    dots = PN_LAT_S.map((s,k)=>`<circle cx="${42+st.pnLon*56}" cy="${44+k*28}" r="3.4" fill="#94A3B8" data-dot="1"/>`).join('');
  } else if(pnBoth(st)){
    dots = `<circle cx="${42+st.pnLon*56}" cy="${44+st.pnLat*28}" r="6.2" fill="#DC2626" stroke="#fff" stroke-width="1.8" data-hit="1"/>`;
  }

  const t = pnAllDone(st) ? null : PN_TASK[st.pnStep];
  const task = t ? `${PN_TASK_M[st.pnStep]} <tspan font-weight="800">${PN_LAT_S[t.lat]}</tspan> \u00b7 <tspan font-weight="800">${PN_LON_S[t.lon]}</tspan> 자리를 찾아 봐요`
    : '세 자리를 모두 찾았어요';

  const fixes = PN_TASK.map((q,i)=>{
    const on = i < st.pnStep;
    return `<rect x="${12+i*100}" y="202" width="96" height="26" rx="7" fill="${on?'#ECFDF5':'#F8FAFC'}" stroke="${on?'#047857':'#E2E8F0'}" stroke-width="${on?1.4:1}"/>
      <text x="${60+i*100}" y="212" font-size="6.4" fill="${on?'#065F46':'#94A3B8'}" text-anchor="middle" font-weight="800">${PN_TASK_M[i]}</text>
      <text x="${60+i*100}" y="223" font-size="6" fill="${on?'#065F46':'#CBD5E0'}" text-anchor="middle" font-weight="700" data-fix="${i}">${on?PN_LAT_S[q.lat]+' \u00b7 '+PN_LON_S[q.lon]:'아직 정하지 않았어요'}</text>`;
  }).join('');

  return `<svg viewBox="0 0 320 280" data-step="${st.pnStep}" data-lat="${st.pnLat}" data-lon="${st.pnLon}" data-cand="${cand}" data-both="${pnBoth(st)?1:0}" data-read="${read?1:0}" data-fin="${fin?1:0}">
    <rect width="320" height="280" fill="#fff"/>
    <rect x="12" y="8" width="296" height="16" rx="6" fill="#D1FAE5"/>
    <text x="160" y="20" font-size="8" fill="#065F46" text-anchor="middle" font-weight="800">${head}</text>
    <rect x="12" y="28" width="296" height="140" rx="9" fill="#F8FAFC" stroke="#047857" stroke-width="1.4"/>
    ${rows}${cols}${dots}
    <rect x="12" y="174" width="296" height="22" rx="7" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/>
    <text x="160" y="188" font-size="6.8" fill="#B45309" text-anchor="middle" font-weight="700" data-task="1">${task}</text>
    ${fixes}
    <rect x="12" y="234" width="296" height="18" rx="6" fill="#F1F5F9"/>
    <text x="160" y="246" font-size="7" fill="#334155" text-anchor="middle" font-weight="800" data-cand2="1">지금 남은 자리 ${cand}곳${pnBoth(st)?' \u2014 하나로 정해졌어요':(cand<PN_LAT_N*PN_LON_N?' \u2014 아직 여럿이에요':'')}</text>
    <rect x="12" y="256" width="296" height="18" rx="6" fill="#F8FAFC"/>
    <text x="160" y="268" font-size="6.4" fill="#64748B" text-anchor="middle" font-weight="700" data-guide="1">${pnBoth(st)?'두 선이 만났어요 \u2014 이제 이 자리로 정할 수 있어요':'한 선만으로는 자리가 하나로 정해지지 않아요'}</text>
  </svg>`;
}

function pnPanel(st){
  const fin = st.pnFin!=null, read = st.pnRead!=null;
  const q = fin ? '위치를 표현하는 방법을 정리했어요.'
    : read ? '오늘 공부한 내용을 어떻게 정리하면 좋을까요?'
    : pnAllDone(st) ? '위선 하나만 그었을 때 자리가 하나로 정해지지 않았어요. 왜 그랬을까요?'
    : '위선과 경선을 그어 자리를 찾아봐요. 어느 쪽을 먼저 그어도 좋아요.';
  let right = `<div class="pn-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDCCD 자리를 표현해 봤어요</div>
      위선 하나만 그었을 때에는 <b>남은 자리가 다섯 곳</b>이었어요. 경선 하나만 그었을 때에도 마찬가지였어요.
      <b>두 선이 만나야</b> 자리가 하나로 정해졌어요.<br>
      그래서 지구본이나 세계지도에서는 <b>위선과 경선이 만나는 지점</b>으로 위치를 표현해요.<br>
      <span style="color:#64748B">판의 격자는 위선과 경선이 만나는 것을 나타낸 <b>도식</b>이지 실제 지구본이나 세계지도가
      아니에요. 그 자리가 실제로 <b>어느 나라</b>인지는 교실에서 세계지도와 지구본을 펴고 찾아요.
      적도와 본초 자오선을 색으로 표시하는 활동과 빗금을 치는 활동도 <b>교실에서</b> 해요.</span></div>`;
  } else if(read){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="pn-fin">${PN_FIN.map((t,k)=>`<button class="${st.pnWrongF===k?'no':''}" onclick="pnFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(pnAllDone(st)){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 다시 읽어요</div>`;
    right += `<div class="pn-note">위선 하나만 그었을 때 판에 <b>남은 자리가 몇 곳</b>이었는지 떠올려 보고 골라요.</div>`;

  if(st.pnMsg) right += `<div class="dw-msg${st.pnWarn?' warn':''}">${st.pnMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCCD 두 선이 만나는 자리를 찾아 봐요</b></div>

}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_social_u3_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  pnStep:0, pnLat:-1, pnLon:-1, pnRead:null, pnFin:null,
  pnWrongP:false, pnWrongR:null, pnWrongF:null,
  pnMsg:null, pnWarn:false, pnBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function pnRender(){ main.innerHTML = slides[state.idx].render(state); }
function pnHold(msg){
  state.pnWarn=true; state.pnBusy=true; state.pnMsg=msg;
  playThud(); pnRender();
  setTimeout(()=>{ state.pnBusy=false; state.pnWarn=false; state.pnMsg=null;
    state.pnWrongP=false; state.pnWrongR=null; state.pnWrongF=null; pnRender(); },1600);
}

/* ① 위선 긋기 — ★ 이 걸음만으로는 자리가 정해지지 않는다.
   그은 뒤에도 `pnCand`는 1이 아니라 경선 수 그대로 남는다.
   ★ 긋는 자리에는 옳고 그름이 없다(정답 상수 부재 · 감점 0). */
function pnDrawLat(k){
  if(state.pnFin!=null) return;                                        // 가드①
  if(state.pnBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=PN_LAT_N) return;               // 가드②
  if(pnAllDone(state)) return;                                         // 세 자리를 다 정했다
  if(state.pnLat>=0){ pnHold(PN_DUP_LAT); return; }                    // 가드③ 판 불변
  state.pnLat = k;                                                     // ★ 위선이 그어지는 자리는 여기 한 곳뿐
  state.pnWarn=false; state.pnWrongP=false;
  state.pnMsg = pnBoth(state)
    ? `<b>${PN_LAT_S[k]}</b> 위선을 그었어요. 두 선이 만났어요 \u2014 이제 <b>이 자리로 정해요</b>를 눌러요.`
    : `<b>${PN_LAT_S[k]}</b> 위선을 그었어요. 이 선 위에는 아직 <b>${pnCand(state)}곳</b>이 남아 있어요.`;
  playBlip(); pnRender();
}

/* ② 경선 긋기 — 위선과 똑같이, 이 걸음만으로도 자리가 정해지지 않는다. */
function pnDrawLon(j){
  if(state.pnFin!=null) return;                                        // 가드①
  if(state.pnBusy) return;                                             // 가드⑨
  if(!Number.isInteger(j) || j<0 || j>=PN_LON_N) return;               // 가드②
  if(pnAllDone(state)) return;                                         // 세 자리를 다 정했다
  if(state.pnLon>=0){ pnHold(PN_DUP_LON); return; }                    // 가드③ 판 불변
  state.pnLon = j;                                                     // ★ 경선이 그어지는 자리는 여기 한 곳뿐
  state.pnWarn=false; state.pnWrongP=false;
  state.pnMsg = pnBoth(state)
    ? `<b>${PN_LON_S[j]}</b> 경선을 그었어요. 두 선이 만났어요 \u2014 이제 <b>이 자리로 정해요</b>를 눌러요.`
    : `<b>${PN_LON_S[j]}</b> 경선을 그었어요. 이 선 위에는 아직 <b>${pnCand(state)}곳</b>이 남아 있어요.`;
  playBlip(); pnRender();
}

/* ③ 그은 선 지우기 — ★ 지우면 후보가 도로 늘어난다(1 → 5 → 25). */
function pnErase(){
  if(state.pnFin!=null) return;                                        // 가드①
  if(state.pnBusy) return;                                             // 가드⑨
  if(pnAllDone(state)) return;                                         // 세 자리를 다 정했다
  if(state.pnLat<0 && state.pnLon<0){ pnHold(PN_ERASE_NONE); return; } // 가드⑤ 판 불변
  state.pnLat=-1; state.pnLon=-1;
  state.pnWarn=false; state.pnWrongP=false;
  state.pnMsg = `그은 선을 지웠어요. 남은 자리가 다시 <b>${pnCand(state)}곳</b>이 됐어요.`;
  playBlip(); pnRender();
}

/* ④ 이 자리로 정해요 — ★★ 이 함수가 이 패턴의 핵심 가드다.
   두 선이 다 그어지기 전에는 자리가 하나로 정해지지 않으므로 판이 받지 않는다(판 불변). */
function pnFix(){
  if(state.pnFin!=null) return;                                        // 가드①
  if(state.pnBusy) return;                                             // 가드⑨
  if(pnAllDone(state)) return;                                         // 세 자리를 다 정했다
  if(!pnBoth(state)){ state.pnWrongP=true; pnHold(PN_ONE); return; }   // 가드④ ★핵심 — 판 불변
  const t = PN_TASK[state.pnStep];
  if(state.pnLat!==t.lat || state.pnLon!==t.lon){
    state.pnWrongP=true;
    pnHold(`여기는 <b>${PN_LAT_S[state.pnLat]} \u00b7 ${PN_LON_S[state.pnLon]}</b>이에요. 찾는 자리와 달라요. <b>지우기</b>를 누르고 다시 그어 봐요. 판은 그대로예요.`);
    return;
  }
  state.pnStep += 1;                                                   // ★ 자리가 정해지는 자리는 여기 한 곳뿐
  state.pnLat=-1; state.pnLon=-1;
  state.pnWarn=false; state.pnWrongP=false;
  state.pnMsg = pnAllDone(state)
    ? `<b>${PN_TASK_M[state.pnStep-1]}</b> 자리를 정했어요. 세 자리를 모두 찾았어요 \u2014 이제 <b>판을 다시 읽어</b> 봐요.`
    : `<b>${PN_TASK_M[state.pnStep-1]}</b> 자리를 정했어요. 다음 자리를 찾아봐요.`;
  playBlip(); pnRender();
}

/* ⑤ 판 다시 읽기 — 판이 표시해 주지 않고 학생이 판을 읽어서 찾는다. */
function pnReadPick(k){
  if(state.pnFin!=null) return;                                        // 가드①
  if(state.pnBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=PN_READ.length) return;         // 가드②
  if(!pnOpenRead(state)){ pnHold(PN_ORDER_R); return; }                // 가드⑥ 순서 — 판 불변
  if(state.pnRead!=null){ pnHold(PN_READ_DONE); return; }              // 가드⑦ 판 불변
  if(k!==PN_READ_OK){ state.pnWrongR=k; pnHold(PN_READ_NO[k]); return; }
  state.pnRead=k; state.pnWrongR=null; state.pnMsg=null; state.pnWarn=false;
  playBlip(); pnRender();
}

/* ⑥ 마무리 — 지도서 「7차시 주요 내용 정리」 1 원문 */
function pnFinish(k){
  if(state.pnFin!=null) return;                                        // 가드①
  if(state.pnBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=PN_FIN.length) return;          // 가드②
  if(state.pnRead==null){ pnHold(PN_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===PN_FIN_OK){
    state.pnFin=k; state.pnWrongF=null; state.pnMsg=null; state.pnWarn=false;
    playChime(); pnRender(); return;
  }
  state.pnWrongF=k;
  pnHold(PN_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 5차시 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

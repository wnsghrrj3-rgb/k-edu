⚠️ 정직 원칙 네 곳
  ㉠ **판의 자리는 실제 나라·도시·장소의 이름을 옮기지 않고 기호로만 둔다** — 지도서 지도 방법 원문이

     체험하는 수준」이라고 했고, 나라와 도시의 이름은 **뒤 차시** 몫이다(캔버스 캡션 명시).
  ㉡ **수첩에 적히는 것은 답 자체가 아니라 「무엇을 보고 알았는지」까지다** — 실제 답은 교실에서
     디지털 영상 지도를 켜고 **직접 검색해서** 찾는다(완료 카드 명시).
  ㉢ **판의 그림은 디지털 영상 지도의 화면을 나타낸 도식이지 실제 화면이나 사진이 아니다**(캡션).
  ㉣ **[디지털+]의 물음은 학생이 스스로 만들어 친구와 묻고 답한다** — 화면이 그 활동을 대신하지 않고

/* ===== 직접조작 — 배율을 옮기면 같은 자리가 다르게 보이는 판(63번째 신규 패턴) =====

      판이 스스로 되돌린 것이었고, 되감김 뒤 판은 뒤집기 전과 글자 하나 다르지 않게 돌아갔다.
      **학생이 다른 데를 보는 사이에 판이 비워진 적은 한 번도 없다.**
   ⭐ 이번만 **판은 지금 배율의 것만 보여 주고, 배율을 옮기면 앞의 것이 판에서 사라진다.**
      남는 것은 **수첩에 적어 둔 것뿐**이다 — 판을 오가는 것만으로는 아무것도 쌓이지 않고 **적어야 쌓인다.**
   ⭐ **33번째(돌아다니기형)와의 대비** — 거기서는 판이 여러 **곳**으로 나뉘어 있었다. 여기서는 **자리가 같다.**
   ⭐ **어느 배율도 언제나 낫지 않다** — `MZ_AT`에 세 배율이 모두 들어 있다.
   ⭐ **지금 무엇이 보이는지를 따로 담는 상태가 코드에 없다** — `mzSeen` 한 줄이 그것을 다 정한다.
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 배율을 옮기는 자리에 옳고 그름 0. */

function mzHas(st,i){ return !!(st.mzNote & (1<<i)); }
function mzNoteN(st){ let n=0; for(let i=0;i<MZ_N;i++){ if(st.mzNote & (1<<i)) n++; } return n; }

function mzCanvas(st){
  const fin = st.mzFin!=null, all = mzAll(st), read = st.mzRead!=null;

  const tabs = MZ_LEV.map((o,k)=>{

  const pieces = MZ_PIECE[lev].map((p,j)=>`<g data-piece="${j}">
      <rect x="24" y="${90+j*22}" width="272" height="18" rx="5" fill="#ECFDF5" stroke="#047857" stroke-width=".9"/>
      <text x="160" y="${102+j*22}" font-size="6.6" fill="#065F46" text-anchor="middle" font-weight="700">${p}</text></g>`).join('');

  /* 수첩 — 적은 줄만 글자가 있다(적지 않은 줄의 문면은 판에 없다). */
  const rows = MZ_Q.map((o,i)=>{

function mzPanel(st){
  const fin = st.mzFin!=null, all = mzAll(st), read = st.mzRead!=null;
  const q = fin ? '화면을 옮겨 보고 수첩까지 정리했어요.'
    : read ? '디지털 영상 지도로 세계의 모습을 살펴보면 어떤 점이 좋을까요?'
    : all ? '수첩을 다 채웠어요. 지금 판에는 무엇이 남아 있나요?'
    : '화면을 옮겨 가며 물음마다 무엇을 보고 알았는지 수첩에 적어 봐요.';
  let right = `<div class="mz-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDDFA 화면을 옮겨 보았어요</div>
      같은 자리를 보고 있었는데 <b>화면을 옮길 때마다 보이는 것이 달라졌어요.</b>
      많이 줄이면 어느 쪽인지는 알아도 색은 알 수 없었고, 거리 보기를 켜면 색은 알아도 어느 나라인지는
      알 수 없었어요. <b>어느 화면도 언제나 낫지 않아요.</b><br>
      그리고 <b>화면에는 아무것도 쌓이지 않았어요.</b> 남은 것은 <b>수첩에 적어 둔 것뿐</b>이에요.<br>
      <span style="color:#64748B">판의 자리는 <b>기호</b>일 뿐 실제 나라나 장소가 아니에요. 수첩에 적힌 것도
      답 자체가 아니라 <b>무엇을 보고 알았는지</b>까지예요. 실제 답은 <b>교실에서</b> 디지털 영상 지도를 켜고
      직접 검색해서 찾고, 물음도 <b>내가 만들어</b> 친구와 묻고 답해요.</span></div>`;
  } else if(read){
    right += `<div class="dw-step">\uD83E\uDDED 살펴보면 좋은 점</div>`;
    right += `<div class="mz-fin">${MZ_FIN.map((t,k)=>`<button class="${st.mzWrongF===k?'no':''}" onclick="mzFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 다시 읽어요</div>`;
    right += `<div class="mz-note">화면을 이리저리 옮겨 보면서 <b>판에 무엇이 남아 있는지</b> 살펴본 뒤 골라요.</div>`;
    right += `<div class="mz-lev">${MZ_LEV.map((o,k)=>`<button class="${k===st.mzLev?'on':''}" onclick="mzGo(${k})">${o.n}</button>`).join('')}</div>`;
    right += `<div class="mz-read">${MZ_READ.map((t,k)=>`<button class="${st.mzWrongR===k?'no':''}" onclick="mzReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDD0D 화면을 옮겨 가며 수첩을 채워요</div>`;
    right += `<div class="mz-lev">${MZ_LEV.map((o,k)=>`<button class="${k===st.mzLev?'on':''}" onclick="mzGo(${k})">${o.n}</button>`).join('')}</div>`;
    right += `<div class="mz-note">화면을 옮기면 <b>앞에서 보이던 것은 사라져요.</b> 남는 것은 <b>수첩에 적은 것</b>뿐이에요.</div>`;
    right += `<div class="mz-list">${MZ_Q.map((o,i)=>{
      const got = mzHas(st,i);
      return got ? `<div class="got">\u2713 ${o.t}</div>`
        : `<button class="${st.mzWrongN===i?'no':''}" onclick="mzWrite(${i})">${o.t}</button>`;
    }).join('')}</div>`;
  }
  if(st.mzMsg) right += `<div class="dw-msg${st.mzWarn?' warn':''}">${st.mzMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDDFA 화면을 옮겨 가며 살펴봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${mzCanvas(st)}<div class="cvcap">판의 <b>자리</b>는 기호일 뿐 실제 나라나 장소가 아니에요. 그림은 디지털 영상 지도의 화면을 나타낸 <b>도식</b>이지 실제 화면이나 사진이 아니에요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const LS_KEY = "kedu_progress_g6_social_u3_l02";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  mzLev:0, mzNote:0, mzRead:null, mzFin:null,
  mzWrongN:null, mzWrongR:null, mzWrongF:null,
  mzMsg:null, mzWarn:false, mzBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";

  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');

  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }


function mzRender(){ main.innerHTML = slides[state.idx].render(state); }
function mzHold(msg){
  state.mzWarn=true; state.mzBusy=true; state.mzMsg=msg;
  playThud(); mzRender();
  setTimeout(()=>{ state.mzBusy=false; state.mzWarn=false; state.mzMsg=null;
    state.mzWrongN=null; state.mzWrongR=null; state.mzWrongF=null; mzRender(); },1600);
}

/* ① 배율 옮기기 — ★ 이 함수가 이 패턴의 핵심 신규성이다.
   배율이 바뀌면 판이 보여 주는 것이 통째로 바뀌고 **앞의 것은 판에서 사라진다.**
   ★ 옮기는 자리에는 옳고 그름이 없다(정답 상수 부재 · 감점 0).
   ★ 배율이 바뀌는 자리는 코드에 단 하나다. */
function mzGo(k){
  if(state.mzFin!=null) return;                                        // 가드①
  if(state.mzBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=MZ_L) return;                   // 가드②
  if(k===state.mzLev){ mzHold(MZ_SAME); return; }                      // 가드⑤ 판 불변
  state.mzLev = k;                                                     // ★ 배율이 바뀌는 자리는 여기 한 곳뿐
  state.mzWarn=false; state.mzWrongN=null;
  state.mzMsg = `<b>${MZ_LEV[k].s}</b> 화면으로 옮겼어요. 앞 화면에서 보이던 것은 <b>사라졌어요.</b> 수첩에 적은 줄은 그대로예요.`;
  playBlip(); mzRender();
}

/* ② 수첩에 적기 — 지금 배율에서 보이는 물음만 적힌다.
   ★ 핵심 가드 — 보이지 않는 물음은 판이 받지 않고, **어느 배율로 옮기라고는 말하지 않는다.**
   ⚠️ 순서 자유 — 네 줄을 어느 차례로 적어도 좋다. */
function mzWrite(i){
  if(state.mzFin!=null) return;                                        // 가드①
  if(state.mzBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=MZ_N) return;                   // 가드②
  if(mzHas(state,i)){ mzHold(MZ_ALREADY); return; }                    // 가드③ 판 불변
  if(!(mzSeen(state.mzLev) & (1<<i))){                                 // 가드④ ★핵심 — 판 불변
    state.mzWrongN = i;
    mzHold(MZ_NOSEE);
    return;
  }
  state.mzNote |= 1 << i;                                              // ★ 수첩이 차는 자리는 여기 한 곳뿐
  state.mzWarn=false; state.mzWrongN=null;
  state.mzMsg = mzAll(state)
    ? `<b>네 줄을 모두 적었어요.</b> 화면을 옮겨 보면서 판에 무엇이 남아 있는지 살펴봐요.`
    : `<b>수첩에 적었어요.</b> 화면에서 사라져도 적어 둔 줄은 남아요.`;
  playBlip(); mzRender();
}

/* ③ 판 다시 읽기 — 판이 표시해 주지 않고 학생이 판을 읽어서 찾는다. */
function mzReadPick(k){
  if(state.mzFin!=null) return;                                        // 가드①
  if(state.mzBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=MZ_READ.length) return;         // 가드②
  if(!mzAll(state)){ mzHold(MZ_ORDER_R); return; }                     // 가드⑥ 순서 — 판 불변
  if(state.mzRead!=null){ mzHold(MZ_READ_DONE); return; }              // 가드⑦ 판 불변
  if(k!==MZ_READ_OK){ state.mzWrongR=k; mzHold(MZ_READ_NO[k]); return; }
  state.mzRead=k; state.mzWrongR=null; state.mzMsg=null; state.mzWarn=false;
  playBlip(); mzRender();
}

/* ④ 마무리 — 「디지털 영상 지도로 세계의 모습을 살펴보면 좋은 점」(지도서 사회과 과정·기능 원문) */
function mzFinish(k){
  if(state.mzFin!=null) return;                                        // 가드①
  if(state.mzBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=MZ_FIN.length) return;          // 가드②
  if(state.mzRead==null){ mzHold(MZ_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===MZ_FIN_OK){
    state.mzFin=k; state.mzWrongF=null; state.mzMsg=null; state.mzWarn=false;
    playChime(); mzRender(); return;
  }
  state.mzWrongF=k;
  mzHold(MZ_FIN_NO[k]);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u3_l03_한쪽만움직여요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

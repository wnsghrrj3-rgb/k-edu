직접조작: 떨어져 있던 두 덩어리가 한 걸음으로 하나가 되는 판 ·
         이어 주는 것은 큰 것도 긴 것도 아니라 두 쪽에 함께 닿은 것인 형(69번째 신규 패턴)
  ⭐ 앞의 예순여덟 종에서 **판의 조각은 그대로였거나 늘어나기만 했다.** 68번(한 칸이 갈라지는 판)에서
     칸이 둘에서 셋이 됐고, 67번(손에 남는 판)에서 없던 자리가 하나 열렸으며, 66번(둘레가 채워지는 판)
     에서 늘어난 것은 채워진 칸이었다. 55번에서 사라진 것은 칸이 아니라 판이 가리키던 자리였고,
     63번에서 비워진 것은 칸이 아니라 그 안의 것이었다.
     **따로 떨어져 있던 두 덩어리가 하나로 합쳐진 적은 한 번도 없다.**
  ⭐ 이번만 **한 걸음이 떨어져 있던 두 덩어리를 하나로 잇는다** — 판의 덩어리가 **둘에서 하나**가 된다.
     ★★ 바로 앞 차시(68번)와 **정확히 반대**다. 거기서는 하나가 둘로 **갈라졌고**, 여기서는 둘이
     하나로 **이어진다.** 근거는 교과서 150쪽 원문 「파나마 영토 전체가 북아메리카와 남아메리카를 잇는
     지협입니다」와 낱말 풀이 「지협 = 두 개의 육지를 연결하는 좁고 잘록한 땅」,
     그리고 지도서 12차시 핵심 질문 답 원문 「북아메리카와 파나마 지협으로 이어져 있습니다」이다.
  ⭐ **무엇이 이을지는 크기가 아니라 두 쪽에 함께 닿아 있는지가 정한다** — 잇는 자리에 놓을 수 있는
     것이 셋인데, **세계에서 가장 큰 섬**(그린란드)도 **세계에서 가장 긴 산맥**(안데스산맥)도 잇지
     못하고, 셋 가운데 가장 작은 **「좁고 잘록한 땅」**(파나마 지협)만 잇는다. 그래서 「큰 것이 잇는다」는
     짐작이 판에서 직접 무너진다. 셋 다 이 차시 교과서 원문이 「가장 큰」·「가장 긴」·「좁고 잘록한」으로
     소개한 것들이다.
  ⭐ **이을 수 있는지를 정해 두는 정답 상수가 코드에 아예 없다**(`IJ_BR_OK` 부재) — `ijPieces` 한 줄이
     그때그때 센다. ⚠️ 60번째(정답 상수가 코드에 없는 판)와 견주면 — 거기서는 **답 자체가 학생이 실은
     줄에서 계산되는 것**이 신규성이었다. 여기서 신규성은 **판의 덩어리가 줄어드는 데** 있고, 정답 상수
     부재는 그 신규성이 문구가 아니라 **코드로 서 있다는 증거**다.
  ⭐ **이어져도 나라는 한 나라도 자리를 옮기지 않는다** — 북아메리카에 놓인 셋과 남아메리카에 놓인 셋은
     이은 뒤에도 **글자 하나 달라지지 않는다**(판 갈래로 문자열 동일성 대조). 이어진 것은 판이지
     나라가 아니다.
  ⭐ **잇지 못한 것에 「틀렸다」가 없다** — 판 불변이고, 안내는 **어느 대륙 안에만 있는지**까지만 말한다.
     알맞은 답의 문면은 안내에 0이고 감점도 0이다.
  ⭐ **판에 놓는 것이 두 갈래다** — 나라는 대륙 칸에 놓고, 땅의 생김새는 두 칸 **사이**에 놓는다.
     사이에 놓인 것은 어느 대륙 칸에도 들어가지 않는다.

3단계 — ① **나라 여섯을 두 대륙에 나눠 놓기**(순서 자유 · 판정 있음 · 어긋나면 판 불변,
  안내에 알맞은 대륙 이름 0) → ② **두 칸을 잇기 3택**(여섯을 다 놓아야 열린다 · ★ 판이 이어진다)
  → ③ **판 읽기 3택**(어떻게 이어졌나요? · 정답 자리 1)
  → ④ 마무리 3택 = 지도서 12차시 학습 내용 정리 원문(정답 자리 0).

⚠️ 가드 9종:

     ② 무효 번호(`Number.isInteger`·범위)
     ③ 이미 놓은 나라 다시 놓기 무시 — 판 불변
     ④ 어긋난 대륙 — 판 불변(안내에 알맞은 대륙 이름 0)
     ⑤ 여섯을 다 놓기 전 잇기 무시(순서) — 판 불변
     ⑥ 이미 이은 뒤 다시 잇기 무시 — 판 불변
     ⑦ **잇기 전 판 읽기 무시 — 판 불변**(핵심 가드)
     ⑧ 판을 읽기 전 마무리 무시(순서) — 판 불변
     ⑨ 안내 표시 중 재클릭 무시(`ijBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.ij-q`로 떼어 전 단계 상시 노출.
   상태 열쇠 12개(완주 뒤에도 불변).

⚠️ 정직 원칙 네 곳
  ㉠ **판의 그림은 나라가 어느 대륙에 속하는지와 두 대륙이 어떻게 이어지는지를 나타낸 도식이지
     실제 세계지도나 지구본이 아니다**(캡션 · 상시 노출).
  ㉡ **판은 나라의 넓이를 재지 않는다** — 「가장 넓은 나라」는 교과서가 말한 자리까지만 쓰고
     판이 나라의 크기를 견주지 않는다.
  ㉢ **국경선을 따라 그리고 영토를 색칠해 보는 활동은 교실 몫**이다(완료 카드 명시).
  ㉣ **판에는 이 차시 원문이 다룬 이름까지만 옮긴다** — 교과서 150·152쪽 지도에 인쇄된 나머지 나라는
     판에 0이고, [스스로 활동]의 답에 나오는 나라만 슬라이드에서 다룬다.

/* ===== 직접조작 — 떨어져 있던 두 덩어리가 한 걸음으로 하나가 되는 판(69번째 신규 패턴) =====
   ★ 앞의 예순여덟 종에서 판의 조각은 그대로였거나 늘어나기만 했다. 68번(한 칸이 갈라지는 판)에서
     칸이 둘에서 셋이 됐고, 67번에서 없던 자리가 하나 열렸다.
     따로 떨어져 있던 두 덩어리가 하나로 합쳐진 적은 한 번도 없다.
   ★ 이번만 한 걸음이 떨어져 있던 두 덩어리를 하나로 잇는다 — 판의 덩어리가 둘에서 하나가 된다.
     ★★ 68번과 정확히 반대다. 거기서는 하나가 둘로 갈라졌고 여기서는 둘이 하나로 이어진다.
   ★ 무엇이 이을지는 크기가 아니라 두 쪽에 함께 닿아 있는지가 정한다 — `ijPieces` 한 줄.
   ★ 이을 수 있는지를 정해 두는 정답 상수가 코드에 아예 없다(IJ_BR_OK 부재).
   ★ 이어져도 나라는 한 나라도 자리를 옮기지 않는다.
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. */
const IJ_CONT_N = 2;    /* 대륙 둘 */
const IJ_LAND_N = 6;    /* 나라 여섯 */

const IJ_CONT = ['북아메리카','남아메리카'];
const IJ_CONT_D = [
  '동쪽으로 대서양, 서쪽으로 태평양과 접해 있어요',

/* 나라 여섯 — 전부 이 차시 교과서 본문 원문 */
const IJ_LAND = ['캐나다','미국','멕시코','브라질','칠레','아르헨티나'];
const IJ_OWNER = [0,0,0,1,1,1];
const IJ_LAND_D = [
  '미국과 함께 북아메리카의 대부분을 차지해요. 태평양, 대서양, 북극해에 접해 있어요.',
  '캐나다를 사이에 두고 본토와 알래스카 지역으로 나뉘어요.',

  '동서 길이에 비해 남북 길이가 매우 긴 나라예요. 서쪽은 태평양과 접해 있어요.',
  '남아메리카 남부에 있어요. 영토가 남북으로 길고, 동쪽으로 대서양과 접해요.'
];

const IJ_BRIDGE = [

const IJ_BRIDGE_S = ['그린란드','안데스산맥','파나마 지협'];
/* ★★ 어느 대륙에 닿아 있는지 — 이 상수를 대괄호로 읽는 자리는 코드에 ijReachOf 한 곳뿐이다.

const IJ_REACH = [0b01, 0b10, 0b11];

/* 안내 — ★ 어긋난 대륙 안내에 알맞은 대륙 이름이 들어가지 않는다. */
const IJ_DUP = '이 나라는 <b>이미 놓았어요.</b> 아직 놓지 않은 나라를 놓아 봐요. 판은 그대로예요.';
const IJ_PICK_FIRST = '먼저 <b>나라를 하나 골라</b> 봐요. 판은 그대로예요.';
const IJ_CONT_NO = '그 나라는 <b>다른 대륙</b>에 있어요. 판은 그대로예요.';
const IJ_ORDER_B = '아직 <b>나라를 다 놓지 않았어요.</b> 여섯 나라를 모두 놓은 뒤에 이어 봐요. 판은 그대로예요.';
const IJ_ALREADY_B = '<b>이미 이었어요.</b> 한 번 이으면 돼요. 판은 그대로예요.';
const IJ_ORDER_R = '아직 <b>두 칸이 이어지지 않았어요.</b> 먼저 이어야 판을 읽을 수 있어요. 판은 그대로예요.';
const IJ_ORDER_F = '아직 <b>판을 읽지 않았어요.</b> 판을 먼저 읽어 봐요. 판은 그대로예요.';
const IJ_JOIN_MSG = '가장 큰 섬도 가장 긴 산맥도 잇지 못했는데 <b>좁고 잘록한 땅</b> 하나가 이었어요. <b>판의 덩어리가 둘에서 하나</b>가 됐어요.';

/* ★★ 닿는 곳을 읽는 자리 — 코드에 이 한 곳뿐이다. */
function ijReachOf(k){ return IJ_REACH[k]; }
/* 사이에 놓인 것이 대륙 c에 닿는지 */
function ijTouch(st,c){ return st.ijBr!=null && ((ijReachOf(st.ijBr)>>c)&1)===1; }
/* ★★ 판의 덩어리 수 — 이 한 줄이 다 정한다. 덩어리를 따로 담는 상수도 상태도 없다. */
function ijPieces(st){ let n=0; for(let c=0;c<IJ_CONT_N;c++){ if(!ijTouch(st,c)) n++; } return n===0 ? 1 : IJ_CONT_N; }
function ijBits(m){ let n=0; for(let i=0;i<IJ_LAND_N;i++){ if((m>>i)&1) n++; } return n; }
function ijAllPut(st){ return ijBits(st.ijPut)===IJ_LAND_N; }
function ijMine(st,c){ const out=[]; for(let i=0;i<IJ_LAND_N;i++){ if(IJ_OWNER[i]!==c) continue; if(!((st.ijPut>>i)&1)) continue; out.push({s:IJ_LAND[i],i:i}); } return out; }

function ijChips(list,y0){
  return list.map((o,j)=>{ const x = 18 + (j%3)*96, y = y0 + Math.floor(j/3)*30;
    return `<rect x="${x}" y="${y}" width="90" height="24" rx="6" fill="#D1FAE5" stroke="#047857" stroke-width="1"/>
      <text x="${x+45}" y="${y+16}" font-size="6.6" fill="#065F46" text-anchor="middle" font-weight="800" data-land="${o.i}">${o.s}</text>`;
  }).join('');
}

  const fin = st.ijFin!=null, allput = ijAllPut(st), joined = ijPieces(st)===1;
  const head = fin ? '북아메리카와 남아메리카의 나라를 살펴봤어요'
    : st.ijRead!=null ? '판을 읽었어요 \u2014 이제 정리해요'
    : joined ? '떨어져 있던 두 칸이 하나로 이어졌어요'
    : allput ? '두 칸이 아직 떨어져 있어요 \u2014 무엇이 이을까요'
    : '나라를 골라 알맞은 대륙에 놓아 봐요';

  /* 북아메리카 칸 — ★ 이 구간은 ijBr를 읽지 않는다. 이어도 글자 하나 달라지지 않는다. */

  const northg = `<g data-cont="0" data-contn="${n.length}">
    <rect x="12" y="30" width="296" height="76" rx="8" fill="${n.length?'#ECFDF5':'#fff'}" stroke="${n.length?'#047857':'#E2E8F0'}" stroke-width="${n.length?1.4:1}"/>

  </g>`;

  /* 남아메리카 칸 — ★ 이 구간도 ijBr를 읽지 않는다. */
  const s = ijMine(st,1);
  const southg = `<g data-cont="1" data-contn="${s.length}">
    <rect x="12" y="148" width="296" height="76" rx="8" fill="${s.length?'#FFFBEB':'#fff'}" stroke="${s.length?'#B45309':'#E2E8F0'}" stroke-width="${s.length?1.4:1}"/>

    ${ijChips(s,180)}
    ${s.length===0?`<text x="160" y="198" font-size="6" fill="#CBD5E0" text-anchor="middle" font-weight="700" data-empty="1">아직 비어 있어요</text>`:''}
  </g>`;

  /* ★★ 두 칸 사이의 자리 — 여기에 놓인 것이 두 쪽에 함께 닿으면 판이 하나로 이어진다. */

    ? `<g data-mid="1">
        <line x1="160" y1="106" x2="160" y2="114" stroke="#047857" stroke-width="2.4" data-link="0"/>
        <rect x="112" y="114" width="96" height="26" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="1.6"/>
        <text x="160" y="131" font-size="7.6" fill="#92400E" text-anchor="middle" font-weight="800" data-bridge="1">${IJ_BRIDGE_S[st.ijBr]}</text>
        <line x1="160" y1="140" x2="160" y2="148" stroke="#B45309" stroke-width="2.4" data-link="1"/>

    : `<g data-mid="0">
        <rect x="112" y="114" width="96" height="26" rx="7" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="5 3"/>
        <text x="160" y="131" font-size="6.6" fill="#94A3B8" text-anchor="middle" font-weight="700" data-gap="1">아직 이어지지 않았어요</text>

  const pieces = ijPieces(st), putn = ijBits(st.ijPut);
  const piecemsg = joined
    ? `판의 덩어리 ${pieces}개 \u2014 두 칸이 하나로 이어졌어요`
    : `판의 덩어리 ${pieces}개 \u2014 두 칸이 따로 떨어져 있어요`;
  return `<svg viewBox="0 0 320 280" data-put="${st.ijPut}" data-putn="${putn}" data-br="${st.ijBr==null?-1:st.ijBr}" data-pieces="${pieces}" data-read="${st.ijRead==null?-1:st.ijRead}" data-fin="${fin?1:0}">

function ijPanel(st){
  const fin = st.ijFin!=null, allput = ijAllPut(st), joined = ijPieces(st)===1;
  const q = fin ? '북아메리카와 남아메리카의 나라를 살펴봤어요.'
    : st.ijRead!=null ? '오늘 공부한 내용을 어떻게 정리하면 좋을까요?'
    : joined ? '판의 덩어리가 둘에서 하나가 됐어요. 어떻게 이어졌을까요?'
    : allput ? '여섯 나라를 모두 놓았어요. 두 칸은 아직 떨어져 있어요. 무엇이 두 칸을 이을까요?'
    : (st.ijSel!=null ? `<b>${IJ_LAND[st.ijSel]}</b>은(는) 어느 대륙에 있을까요?` : '나라를 하나 골라 봐요. 어느 나라부터 골라도 좋아요.');
  let right = `<div class="ij-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83E\uDDE9 좁고 잘록한 땅 하나가 이었어요</div>
      여섯 나라를 모두 놓아도 판의 덩어리는 <b>둘</b>이었어요. 그런데 두 칸 <b>사이</b>에 놓은 것 하나로
      덩어리가 <b>둘에서 하나</b>가 됐어요.<br>
      이은 것은 <b>가장 큰 섬</b>도 <b>가장 긴 산맥</b>도 아니었어요. 둘은 <b>한 대륙 안에만</b> 있었기 때문이에요.
      이은 것은 셋 가운데 가장 작은 <b>좁고 잘록한 땅</b>이었고, 그 땅이 <b>두 쪽에 함께 닿아</b> 있었어요.<br>
      그리고 <b>나라는 한 나라도 자리를 옮기지 않았어요.</b> 이어진 것은 <b>판</b>이지 나라가 아니에요.<br>
      <span style="color:#64748B">판의 그림은 나라가 어느 대륙에 속하는지와 <b>두 대륙이 어떻게 이어지는지</b>를
      나타낸 도식이지 실제 세계지도나 지구본이 아니에요. 판은 나라의 <b>넓이를 재지 않아요.</b>
      <b>국경선을 따라 그리고 영토를 색칠해 보는 활동</b>은 교실에서 세계지도를 펴고 직접 해요.</span></div>`;
  } else if(st.ijRead!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="ij-fin">${IJ_FIN.map((t,k)=>`<button class="${st.ijWrongF===k?'no':''}" onclick="ijFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(joined){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="ij-read">${IJ_READ.map((t,k)=>`<button class="${st.ijWrongR===k?'no':''}" onclick="ijReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else if(allput){
    right += `<div class="dw-step">\uD83E\uDDE9 두 칸 사이에 놓아요</div>`;
    right += `<div class="ij-go">${IJ_BRIDGE.map((t,k)=>`<button class="${st.ijWrongB===k?'no':''}" onclick="ijBridgePut(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="ij-note">셋 다 이 대륙에 있는 것이에요. 이 가운데 <b>두 쪽에 함께 닿아</b> 있는 것은 무엇일까요?
      놓는 자리에 감점은 없어요.</div>`;
  } else {
    right += `<div class="dw-step">\uD83C\uDF0E 나라를 놓아요</div>`;
    right += `<div class="ij-pad">${IJ_LAND.map((t,i)=>`<button class="${((st.ijPut>>i)&1)?'on':(st.ijSel===i?'sel':'')}" onclick="ijPick(${i})">${t}</button>`).join('')}</div>`;
    if(st.ijSel!=null){
      right += `<div class="ij-go">${IJ_CONT.map((t,k)=>`<button class="${st.ijWrongC===k?'no':''}" onclick="ijPlace(${k})">${t}에 놓기</button>`).join('')}</div>`;
    } else {
      right += `<div class="ij-note">나라를 고르면 <b>어느 대륙에 있는지</b> 물어봐요.</div>`;
    }
  }
  if(st.ijMsg) right += `<div class="dw-msg${st.ijWarn?' warn':''}">${st.ijMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83E\uDDE9 둘이 하나로 이어지는 판</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${ijCanvas(st)}<div class="cvcap">판의 그림은 나라가 <b>어느 대륙에 속하는지</b>와 <b>두 대륙이 어떻게 이어지는지</b>를 나타낸 도식이지 실제 세계지도나 지구본이 아니에요. 판은 넓이를 재지 않아요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }





function ijRender(){ main.innerHTML = slides[state.idx].render(state); }
function ijHold(msg){
  state.ijWarn=true; state.ijBusy=true; state.ijMsg=msg;
  playThud(); ijRender();
  setTimeout(()=>{ state.ijBusy=false; state.ijWarn=false; state.ijMsg=null;
    state.ijWrongC=null; state.ijWrongB=null; state.ijWrongR=null; state.ijWrongF=null; ijRender(); },1600);
}

/* ① 나라 고르기 — 고르는 자리에는 옳고 그름이 없다(정답 상수 부재). */
function ijPick(i){
  if(state.ijFin!=null) return;                                        // 가드①
  if(state.ijBusy) return;                                             // 가드⑨
  if(!Number.isInteger(i) || i<0 || i>=IJ_LAND_N) return;              // 가드②
  if(ijAllPut(state)) return;                                          // 다 놓은 뒤에는 고르는 자리가 없다
  if((state.ijPut>>i)&1){ ijHold(IJ_DUP); return; }                    // 가드③ 판 불변
  state.ijSel = i;
  state.ijWarn=false; state.ijWrongC=null; state.ijMsg=null;
  playBlip(); ijRender();
}

/* ② 대륙에 놓기 — 어긋나면 판 불변. ★ 안내에 알맞은 대륙 이름이 들어가지 않는다. */
function ijPlace(k){
  if(state.ijFin!=null) return;                                        // 가드①
  if(state.ijBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=IJ_CONT_N) return;              // 가드②
  if(state.ijSel==null){ ijHold(IJ_PICK_FIRST); return; }              // 판 불변
  const i = state.ijSel;
  if(k!==IJ_OWNER[i]){ state.ijWrongC=k; ijHold(IJ_CONT_NO); return; } // 가드④ 판 불변
  state.ijPut |= (1<<i);                                               // ★ 나라가 놓이는 자리는 여기 한 곳뿐
  state.ijSel = null;
  state.ijWarn=false; state.ijWrongC=null;
  state.ijMsg = ijAllPut(state)
    ? `<b>${IJ_LAND[i]}</b>은(는) <b>${IJ_CONT[k]}</b>에 있어요. ${IJ_LAND_D[i]} 여섯 나라를 모두 놓았어요 \u2014 그런데 두 칸은 아직 <b>떨어져</b> 있어요.`
    : `<b>${IJ_LAND[i]}</b>은(는) <b>${IJ_CONT[k]}</b>에 있어요. ${IJ_LAND_D[i]}`;
  playBlip(); ijRender();
}

/* ③ 두 칸 사이에 놓기 — ★★ 이 걸음이 이 패턴의 핵심이다.
   두 쪽에 함께 닿은 것을 놓으면 떨어져 있던 두 덩어리가 하나로 이어진다.
   ★ 이을 수 있는지를 정해 두는 정답 상수가 코드에 없다 — `ijPieces` 한 줄이 그때그때 센다. */
function ijBridgePut(k){
  if(state.ijFin!=null) return;                                        // 가드①
  if(state.ijBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=IJ_BRIDGE.length) return;       // 가드②
  if(!ijAllPut(state)){ ijHold(IJ_ORDER_B); return; }                  // 가드⑤ 순서 — 판 불변
  if(ijPieces(state)===1){ ijHold(IJ_ALREADY_B); return; }             // 가드⑥ 판 불변
  if(ijPieces({ijBr:k})!==1){ state.ijWrongB=k; ijHold(IJ_BR_NO[k]); return; } // 판 불변 — 정답 상수가 아니라 ijPieces가 정한다
  state.ijBr = k;                                                      // ★ 판이 이어지는 자리는 여기 한 곳뿐
  state.ijWarn=false; state.ijWrongB=null;
  state.ijMsg = IJ_JOIN_MSG;
  playBlip(); ijRender();
}

/* ④ 판 읽기 — 두 칸이 이어져야 열린다(가드⑦). 어긋나면 판 불변. */
function ijReadPick(k){
  if(state.ijFin!=null) return;                                        // 가드①
  if(state.ijBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=IJ_READ.length) return;         // 가드②
  if(ijPieces(state)!==1){ ijHold(IJ_ORDER_R); return; }               // 가드⑦ ★핵심 — 판 불변
  if(state.ijRead!=null){ ijHold(IJ_ALREADY_B); return; }              // 판 불변
  if(k===IJ_READ_OK){
    state.ijRead=k; state.ijWrongR=null; state.ijWarn=false;
    state.ijMsg = '판을 잘 읽었어요. 이어진 것은 <b>판</b>이지 나라가 아니에요 \u2014 나라는 놓인 자리에 그대로 있어요.';
    playChime(); ijRender(); return;
  }
  state.ijWrongR=k;
  ijHold(IJ_READ_NO[k]);
}

/* ⑤ 마무리 — 지도서 12차시 학습 내용 정리 원문 */
function ijFinish(k){
  if(state.ijFin!=null) return;                                        // 가드①
  if(state.ijBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=IJ_FIN.length) return;          // 가드②
  if(state.ijRead==null){ ijHold(IJ_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===IJ_FIN_OK){
    state.ijFin=k; state.ijWrongF=null; state.ijMsg=null; state.ijWarn=false;
    playChime(); ijRender(); return;
  }
  state.ijWrongF=k;
  ijHold(IJ_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u3_l09_돌아와야닫혀요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

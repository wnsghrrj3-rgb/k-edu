<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#F5F7FA;min-height:100vh;color:#1A202C}

.top-bar{background:#fff;border-bottom:1px solid #E2E8F0;height:52px;display:flex;align-items:center;padding:0 24px;gap:12px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#718096;text-decoration:none;font-weight:500;transition:color .15s}
.back-link:hover{color:#1A202C}
.top-title{font-family:'Jua',sans-serif;font-size:16px;color:#1A202C}

main{max-width:800px;margin:0 auto;padding:28px 20px 60px}

.page-header{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.subject-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:50px;font-family:'Jua',sans-serif;font-size:18px;color:#fff;background:#8E3B62}
.page-title{font-family:'Jua',sans-serif;font-size:26px}

.unit-section{margin-bottom:30px}
.unit-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #E2E8F0}
.unit-num{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:16px;color:#fff}
.unit-name{font-family:'Jua',sans-serif;font-size:18px;color:#1A202C}
.unit-count{font-size:13px;color:#A0AEC0;margin-left:auto}

.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 8px rgba(0,0,0,.05);cursor:pointer;text-decoration:none;color:#1A202C;border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s}
.lesson-card:hover{transform:translateY(-2px);border-color:var(--uc);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.lesson-num{min-width:32px;height:32px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:14px;color:#fff;background:var(--uc);flex-shrink:0}
.lesson-title{font-size:14px;font-weight:500;flex:1}
.lesson-arrow{color:#CBD5E0;font-size:16px}
.lesson-badge{font-size:11px;padding:2px 8px;border-radius:50px;font-weight:500;flex-shrink:0}
.badge-tb{background:#EBF8FF;color:#2B6CB0}
.badge-soon{background:#EDF2F7;color:#A0AEC0}

.lesson-card-soon{background:#FAFAFA;box-shadow:none;border:1px dashed #E2E8F0;cursor:default;opacity:.7}
.lesson-card-soon:hover{transform:none;border-color:#E2E8F0;box-shadow:none}
.lesson-card-soon .lesson-num{background:#CBD5E0!important}
.lesson-card-soon .lesson-title{color:#A0AEC0}

footer{text-align:center;padding:18px 24px;border-top:1px solid #E2E8F0;background:#fff}
.footer-text{font-size:12px;color:#A0AEC0}
.footer-text strong{color:#718096;font-weight:500}
.footer-text a{color:#5B8EF8;text-decoration:none;margin-left:10px}
.footer-text a:hover{text-decoration:underline}

@media(max-width:600px){
  .page-header{flex-direction:column;align-items:flex-start;gap:8px}
  .page-title{font-size:22px}
  .lesson-card{padding:12px 14px}
}
</style>
  <script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>

<script>

const U1 = '1단원_깊이있게감상해요/';
const U2 = '2단원_궁금한점을해결해요/';
const U3 = '3단원_보거나듣고판단해요/';
const U4 = '4단원_소중한우리말/';
const U5 = '5단원_언어와소통/';
const UNITS = [
  {
    num: 1, name: "깊이 있게 감상해요", emoji: "🔎", color: "#2C5F7C",
    lessons: [
      {n:"1",     file:U1+"g6_kor_u1_l01.html",    title:"단원 시작 — 배울 내용 살펴보기", track:"tb"},
      {n:"2~3",   file:U1+"g6_kor_u1_l02_03.html", title:"작가의 의도를 짐작하는 방법 알기", track:"tb"},
      {n:"4~6",   file:U1+"g6_kor_u1_l04_06.html", title:"작가의 의도를 짐작하며 시 읽기", track:"tb"},
      {n:"7~8",   file:U1+"g6_kor_u1_l07_08.html", title:"이야기의 줄거리를 간추리는 방법 알기", track:"tb"},
      {n:"9~11",  file:U1+"g6_kor_u1_l09_11.html", title:"이야기를 읽고 줄거리 간추리기", track:"tb"},
      {n:"12~13", file:U1+"g6_kor_u1_l12_13.html", title:"배운 내용 실천하기 — 문학 작품 소개하기", track:"tb"},
      {n:"14",    file:U1+"g6_kor_u1_l14.html",    title:"단원 마무리하기 (정리 · 기초 다지기)", track:"tb"}
    ]
  },
  {
    num: 2, name: "궁금한 점을 해결해요", emoji: "🗣️", color: "#8A5A2B",
    lessons: [
      {n:"1",     file:U2+"g6_kor_u2_l01.html",    title:"단원 시작 — 배울 내용 살펴보기", track:"tb"},
      {n:"2",     file:U2+"g6_kor_u2_l02.html",    title:"면담의 특성 이해하기", track:"tb"},
      {n:"3~4",   file:U2+"g6_kor_u2_l03_04.html", title:"면담의 절차 이해하기", track:"tb"},
      {n:"5~6",   file:U2+"g6_kor_u2_l05_06.html", title:"진로와 관련한 면담 자료 살펴보기", track:"tb"},
      {n:"7~8",   file:U2+"g6_kor_u2_l07_08.html", title:"매체를 고려하여 주변 인물과 면담하기", track:"tb"},
      {n:"9~10",  file:U2+"g6_kor_u2_l09_10.html", title:"면담 과정을 성찰하고 면담 보고서 쓰기", track:"tb"},
      {n:"11~12", file:U2+"g6_kor_u2_l11_12.html", title:"배운 내용 실천하기 — 작품 속 인물과 면담하기", track:"tb"},
      {n:"13",    file:U2+"g6_kor_u2_l13.html",    title:"단원 마무리하기 (정리 · 기초 다지기)", track:"tb"}
    ]
  },
  {
    num: 3, name: "보거나 듣고 판단해요", emoji: "⚖️", color: "#7E2A85",
    lessons: [
      {n:"1",     file:U3+"g6_kor_u3_l01.html",    title:"단원 시작 — 배울 내용 살펴보기", track:"tb"},
      {n:"2~3",   file:U3+"g6_kor_u3_l02_03.html", title:"주장하는 말의 타당성을 평가하는 방법 알기", track:"tb"},
      {n:"4~6",   file:U3+"g6_kor_u3_l04_06.html", title:"주장하는 말의 내용을 평가하며 듣기", track:"tb"},
      {n:"7~8",   file:U3+"g6_kor_u3_l07_08.html", title:"영상을 보고 주장 파악하기", track:"tb"},
      {n:"9~11",  file:U3+"g6_kor_u3_l09_11.html", title:"카드 뉴스 내용을 평가하며 보기", track:"tb"},
      {n:"12~13", file:U3+"g6_kor_u3_l12_13.html", title:"배운 내용 실천하기 — 우리가 정한 주제의 영상 설명하기", track:"tb"},
      {n:"14",    file:U3+"g6_kor_u3_l14.html",    title:"단원 마무리하기 (정리 · 기초 다지기)", track:"tb"}
    ]
  },
  {
    num: 4, name: "소중한 우리말", emoji: "🌾", color: "#3A358D",
    lessons: [
      {n:"1",     file:U4+"g6_kor_u4_l01.html",    title:"단원 시작 — 배울 내용 살펴보기", track:"tb"},
      {n:"2~3",   file:U4+"g6_kor_u4_l02_03.html", title:"고유어의 가치 이해하기", track:"tb"},
      {n:"4~5",   file:U4+"g6_kor_u4_l04_05.html", title:"고유어를 활용한 사례를 조사하여 발표하기", track:"tb"},
      {n:"6~7",   file:U4+"g6_kor_u4_l06_07.html", title:"우리말을 지키기 위한 노력 이해하기", track:"tb"},
      {n:"8~10",  file:U4+"g6_kor_u4_l08_10.html", title:"우리말을 바르게 사용하는 태도 갖기", track:"tb"},
      {n:"11~12", file:U4+"g6_kor_u4_l11_12.html", title:"배운 내용 실천하기 — 우리말 지킴이 활동 하기", track:"tb"},
      {n:"13",    file:U4+"g6_kor_u4_l13.html",    title:"단원 마무리하기 (정리 · 기초 다지기)", track:"tb"}
    ]
  },
  {
    num: 5, name: "언어와 소통", emoji: "📰", color: "#60702E",
    lessons: [
      {n:"1",     file:U5+"g6_kor_u5_l01.html",    title:"단원 시작 — 배울 내용 살펴보기", track:"tb"},
      {n:"2~3",   file:U5+"g6_kor_u5_l02_03.html", title:"문자 언어와 음성 언어의 특성 이해하기", track:"tb"},
      {n:"4",     file:U5+"g6_kor_u5_l04.html",    title:"매체 자료에서 언어의 표현 효과 이해하기", track:"tb"},
      {n:"5~6",   file:U5+"g6_kor_u5_l05_06.html", title:"언어의 표현 효과를 생각하며 영상 감상하기", track:"tb"},
      {n:"7~8",   file:U5+"g6_kor_u5_l07_08.html", title:"독자를 고려해 글 쓰는 방법 알기", track:"tb"},
      {n:"9~11",  file:U5+"g6_kor_u5_l09_11.html", title:"독자를 고려해 기사문 쓰기", track:"tb"},
      {n:"12~13", file:U5+"g6_kor_u5_l12_13.html", title:"배운 내용 실천하기 — 마음을 전하는 편지 쓰기", track:"tb"},
      {n:"14",    file:U5+"g6_kor_u5_l14.html",    title:"단원 마무리하기 (정리 · 기초 다지기)", track:"tb"}
    ]
  }
];

const content = document.getElementById('content');
UNITS.forEach((unit) => {
  const tbCount = unit.lessons.filter(l => l.track === 'tb').length;
  const soonCount = unit.lessons.filter(l => l.track === 'soon').length;

  const section = document.createElement('div');
  section.className = 'unit-section';

  let html = `
    <div class="unit-header">
      <div class="unit-num" style="background:${unit.color}">${unit.num}</div>
      <div class="unit-name">${unit.emoji} ${unit.num}단원: ${unit.name}</div>
      <div class="unit-count">라이브 ${tbCount}차시${soonCount ? ' · 준비 중 ' + soonCount : ''}</div>
    </div>
    <div class="lesson-list">
  `;

  html += unit.lessons.map(l => l.track === 'tb' ? `
    <a class="lesson-card" href="${l.file}" style="--uc:${unit.color}">
      <div class="lesson-num">${l.n}</div>
      <div class="lesson-title">${l.title}</div>
      <span class="lesson-badge badge-tb">교과서</span>
      <div class="lesson-arrow">›</div>
    </a>
  ` : `
    <div class="lesson-card lesson-card-soon">
      <div class="lesson-num">${l.n}</div>
      <div class="lesson-title">${l.title}</div>
      <span class="lesson-badge badge-soon">준비 중</span>
    </div>
  `).join('');

  html += `</div>`;
  section.innerHTML = html;
  content.appendChild(section);
});
</script>

직접조작: 가계와 기업을 잇는 고리 판
  ⭐ 씨앗은 지도서 3~4차시 두 핵심 질문 — 「시장경제에서 가계가 역할을 제대로 못한다면 어떤 일이 일어날까요?」
     「기업이 역할을 제대로 못한다면 어떤 일이 일어날까요?」 + 교과서 67쪽 「가계와 기업은 … 밀접한 관계를 맺으며 도움을 주고받습니다」.
  ⭐ 고리 넷이 한 바퀴를 이룬다 — ⓪ 가계 → 기업 일손 · ① 기업 → 가계 물건·서비스(시장에서) · ② 가계 → 기업 물건값(시장에서) ·
     ③ 기업 → 가계 소득(급여). 흐름 표시(말)는 고리 앞에 서 있고 「한 칸 돌려요」로 한 고리씩 나아간다(rgPos 0~4 · 4 = 한 바퀴).
  ⭐ 가위로 고리 하나를 끊을 수 있다(한 번에 하나 · 다시 누르면 이음 · 다른 고리를 누르면 가위가 옮겨 감).
     흐름이 멈추는지는 **멈춤을 담는 상태 없이** `rgStop(st) = st.rgCut === st.rgPos % 4` 한 줄이 그때그때 정한다.
  ⭐★ 가계가 하는 일(⓪·②)이 끊겨도, 기업이 하는 일(①·③)이 끊겨도 흐름 전체가 그 자리에서 멈춘다 — 멈춘 자리의 모습은
     지도서 예시 답안 원문(`RG_LINK[k].stop`)으로 보여 준다.
  ⭐ 수첩 세 줄(한 바퀴 다 돈 판 · 가계가 하는 일이 끊겨 멈춘 판 · 기업이 하는 일이 끊겨 멈춘 판)은
     본 판 기록 `state.rgSeen |=` 단 하나(`rgLook`)에서만 선다(줄 상태 0 · 줄지 않음). 세 줄 최소 걸음은 판 전수 BFS.
  ⭐ 판 읽기는 세 줄이 다 선 뒤에만(정답 자리 1). 이어서 기업의 성장이 주는 도움 3택(정답 자리 2) →
     마무리 3택 = 가계와 기업의 관계(정답 자리 0).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 멈춘 자리에서 돌리기 무시 — 판 불변(가위를 거두거나 옮기라는 안내)
     ④ 수첩 세 줄이 선 뒤 판 움직이기(가위·돌리기) 무시 — 판 불변
     ⑤ 세 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑥ 판을 읽기 전 성장 3택 무시 · 고른 뒤 다시 무시 · 알맞지 않은 도움 무시
     ⑦ 도움을 고르기 전 마무리 무시(순서)
     ⑧ 알맞지 않은 마무리 무시
     ⑨ 안내 표시 중 재클릭 무시(`rgBusy`).
   수첩 줄은 기록에서만 — 가위를 거두어도 줄지 않음(|= 단 하나).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.rg-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판은 가계와 기업의 관계를 어림해 나타낸 도식이다** — 실제 경제에서는 은행·정부 등 여러 주체와 여러 시장이 얽혀 있고,
     판은 가계와 기업 사이의 네 흐름만 보여 준다(캡션 상시).
  ㉡ **판에는 금액을 적지 않는다** — 자동차 비교도 가격을 별점으로만(교과서 금액 생략).
  ㉢ **고리가 끊기면 한 번에 모두 멈추는 것은 판의 단순화**다 — 실제로는 서서히 어려워진다(캡션 「어림」으로 명시).

  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.rg-read button:hover,.rg-comp button:hover,.rg-fin button:hover{background:var(--bub)}
.rg-read button.no,.rg-comp button.no,.rg-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.rg-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .rg-link{grid-template-columns:18px 1fr auto;padding:3px 4px} .rg-link button{padding:2px 4px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

function rgStop(st){ return st.rgCut === st.rgPos % RG_N; }
/* ★ 이 판이 수첩의 어느 줄인지 — 한 줄 */
function rgBit(st){ return rgStop(st) ? (RG_LINK[st.rgCut].f===0 ? 2 : 4) : (st.rgPos===RG_LAP ? 1 : 0); }
function rgHas(st,b){ return (st.rgSeen & b)!==0; }
function rgAll(st){ return st.rgSeen===RG_ALL; }
/* ★ 고리 — RG_LINK 를 처리기가 읽는 자리 단 하나 */
function rgLinkOf(k){ return RG_LINK[k]; }

function rgLinks(st){
  return `<div class="rg-links">${RG_LINK.map((L,i)=>{ const cut=st.rgCut===i, done=!cut && i<st.rgPos, next=!cut && !done && i===st.rgPos;
    return `<div class="rg-link${cut?' cut':done?' done':next?' next':''}" data-link="${i}" data-cut="${cut?1:0}" data-done="${done?1:0}">
      <span class="ar">${cut?'\u2702\uFE0F':L.f===0?'\u2192':'\u2190'}</span>
      <span>${RG_WHO[L.f]} \u2192 ${RG_WHO[1-L.f]} \u00b7 <b>${L.t}</b></span>
      <button data-k="${i}" onclick="rgCutAt(${i})">${cut?'\uD83D\uDD17 잇기':'\u2702\uFE0F 끊기'}</button></div>`; }).join('')}</div>`;
}
function rgState(st){
  const s = rgStop(st) ? 'stop' : st.rgPos===RG_LAP ? 'lap' : 'go';
  const t = s==='stop' ? `\u26D4 흐름이 멈췄어요 \u2014 ${RG_LINK[st.rgCut].stop}`
    : s==='lap' ? '\uD83D\uDD04 고리를 한 바퀴 다 돌았어요'
    : `\u25B6 다음 차례 \u2014 ${RG_LINK[st.rgPos].do}`;
  return `<div class="rg-state ${s}" data-s="${s}">${t}</div>`;
}
function rgNote(st){
  return RG_NOTE.map((t,i)=>{ const b=1<<i, on=rgHas(st,b);
    return `<div class="rg-line${on?' set':''}" data-line="${i}">${on?'\u2714 '+t+'을 봤어요':t+' \u2014 아직 못 봤어요'}</div>`; }).join('');
}

function rgBoard(st){
  const fin = st.rgFin!=null, all = rgAll(st);
  const head = fin ? '가계와 기업의 역할을 알아봤어요'
    : st.rgComp!=null ? '기업의 성장이 주는 도움까지 골랐어요 \u2014 이제 정리해요'
    : st.rgRead!=null ? '기업의 성장이 주는 도움을 골라 봐요'
    : all ? '수첩의 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : '고리를 끊어 보고 흐름을 돌려 봐요';
  return `<div class="rg-board" data-cut="${st.rgCut}" data-pos="${st.rgPos}" data-stop="${rgStop(st)?1:0}" data-seen="${st.rgSeen}" data-all="${all?1:0}" data-read="${st.rgRead==null?-1:st.rgRead}" data-comp="${st.rgComp==null?-1:st.rgComp}" data-fin="${fin?1:0}">

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function rgRender(){ main.innerHTML = slides[state.idx].render(state); }
function rgHold(msg){
  state.rgWarn=true; state.rgBusy=true; state.rgMsg=msg;
  playThud(); rgRender();
  setTimeout(()=>{ state.rgBusy=false; state.rgWarn=false; state.rgMsg=null;
    state.rgWrongR=null; state.rgWrongC=null; state.rgWrongF=null; rgRender(); },1600);
}
/* ★ 본 판 기록 — 더하기만 하는 자리 단 하나 */
function rgLook(){ state.rgSeen |= rgBit(state); }
function rgSay(base){
  state.rgWarn=false;
  if(rgAll(state)){ state.rgMsg = RG_ALL_MSG; playChime(); }
  else { state.rgMsg = base; playBlip(); }
  rgRender();
}

/* ① 가위 — 고리 하나를 끊거나 잇기(한 번에 하나) */
function rgCutAt(k){
  if(state.rgFin!=null) return;                                        // 가드①
  if(state.rgBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RG_N) return;                   // 가드②
  if(rgAll(state)){ rgHold(RG_LOCK); return; }                         // 가드④ 판 불변
  const L = rgLinkOf(k);
  state.rgCut = state.rgCut===k ? -1 : k;                              // ★ 가위가 놓이는 자리 단 하나
  rgLook();
  rgSay(state.rgCut!==k ? `「${L.t}」 고리를 <b>다시 이었어요</b>.`
    : rgStop(state) ? `「${L.t}」 고리를 <b>끊었어요</b> \u2014 흐름이 바로 이 고리 앞에 있어 <b>흐름이 멈췄어요</b>.`
    : `「${L.t}」 고리를 <b>끊었어요</b>. 흐름을 돌려 봐요.`);
}

/* ② 한 칸 돌리기 — 흐름이 고리 하나를 지나감 */
function rgStep(){
  if(state.rgFin!=null) return;                                        // 가드①
  if(state.rgBusy) return;                                             // 가드⑨
  if(rgAll(state)){ rgHold(RG_LOCK); return; }                         // 가드④ 판 불변
  if(rgStop(state)){ rgHold(RG_STUCK); return; }                       // 가드③ 판 불변
  const L = rgLinkOf(state.rgPos % RG_N);
  state.rgPos = state.rgPos % RG_N + 1;                                // ★ 흐름이 나아가는 자리 단 하나
  rgLook();
  rgSay(rgStop(state) ? `「${L.do}」 \u2014 그런데 다음 고리가 끊겨 <b>흐름이 멈췄어요</b>.`
    : state.rgPos===RG_LAP ? `「${L.do}」 \u2014 고리를 <b>한 바퀴</b> 다 돌았어요.`
    : `「${L.do}」 \u2014 흐름이 한 칸 나아갔어요.`);
}

/* ③ 판 읽기 — 수첩 세 줄 뒤에만(가드⑤). */
function rgReadPick(k){
  if(state.rgFin!=null) return;                                        // 가드①
  if(state.rgBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RG_READ.length) return;         // 가드②
  if(!rgAll(state)){ rgHold(RG_ORDER_R); return; }                     // 가드⑤ 순서 — 판 불변
  if(state.rgRead!=null){ rgHold(RG_READ_AGAIN); return; }             // 가드⑤ 판 불변
  if(k===RG_READ_OK){
    state.rgRead=k; state.rgWrongR=null; state.rgWarn=false;
    state.rgMsg = '판을 잘 읽었어요. 가계와 기업은 <b>서로 이어져</b> 있어서, 어느 한쪽이 역할을 못하면 다른 쪽도 어려워져요.';
    playChime(); rgRender(); return;
  }
  state.rgWrongR=k;
  rgHold(RG_READ_NO[k]);
}

/* ④ 기업의 성장이 주는 도움 — 판을 읽은 뒤에만(가드⑥). */
function rgCompPick(k){
  if(state.rgFin!=null) return;                                        // 가드①
  if(state.rgBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RG_COMP.length) return;         // 가드②
  if(state.rgRead==null){ rgHold(RG_ORDER_C); return; }                // 가드⑥ 순서 — 판 불변
  if(state.rgComp!=null){ rgHold(RG_COMP_AGAIN); return; }             // 가드⑥ 판 불변
  if(k!==RG_COMP_OK){ state.rgWrongC=k; rgHold(RG_COMP_NO[k]); return; } // 가드⑥ 판 불변
  state.rgComp = k;                                                    // ★ 도움을 고르는 자리 단 하나
  state.rgWarn=false;
  state.rgMsg = '기업이 성장하려고 노력하면 소비자는 <b>품질이 좋은 상품을 더 저렴하게</b> 살 수 있어요 \u2014 나라 경제가 발전하는 데도 도움이 돼요.';
  playChime(); rgRender();
}

/* ⑤ 마무리 — 교과서 67쪽 가계와 기업의 관계 */
function rgFinish(k){
  if(state.rgFin!=null) return;                                        // 가드①
  if(state.rgBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RG_FIN.length) return;          // 가드②
  if(state.rgComp==null){ rgHold(RG_ORDER_F); return; }                // 가드⑦ 순서 — 판 불변
  if(k===RG_FIN_OK){
    state.rgFin=k; state.rgWrongF=null; state.rgMsg=null; state.rgWarn=false;
    playChime(); rgRender(); return;
  }
  state.rgWrongF=k;
  rgHold(RG_FIN_NO[k]);                                                // 가드⑧ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l03_저울을맞춰요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

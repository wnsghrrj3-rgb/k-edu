  font-family:inherit;font-weight:800;font-size:clamp(9.6px,1.62vw,11.8px)}
.jw-look:hover{background:#BAE6FD}
.jw-say{border-radius:8px;padding:5px 8px;font-weight:800;font-size:clamp(9.2px,1.56vw,11.2px);line-height:1.4;
  background:#EFF6FF;color:#1E3A8A;border:2px solid #0369A1}
.jw-note{display:flex;flex-direction:column;gap:4px}
.jw-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-radius:7px;padding:4px 8px;font-weight:800;
  font-size:clamp(9.4px,1.58vw,11.4px);border:2px dashed #CBD5E0;background:#F8FAFC;color:#94A3B8}
.jw-line.set{border-style:solid;border-color:#059669;background:#ECFDF5;color:#065F46}
.jw-read,.jw-mean,.jw-fin{display:flex;flex-direction:column;gap:5px}
.jw-read button,.jw-mean button,.jw-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.jw-read button:hover,.jw-mean button:hover,.jw-fin button:hover{background:var(--bub)}
.jw-read button.no,.jw-mean button.no,.jw-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.jw-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .jw-sw{gap:3px} .jw-tog,.jw-f{font-size:8.6px;padding:3px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

  </div>
</div>
<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙 ㉠·㉢: 모든 그림은 내용을 나타낸 도식이며 실제 사진·지도가 아니다.
   ⚠️ 사람 형상 대신 도형으로만 그린다. 비율·물량·순위·금액·연도는 적지 않는다. */
const SVG = {
  // 1 들어가기 — 나라마다 다른 조건(도식)

  // 2 살펴보기 — 우리나라 주요 수입품·수출품(도식 · 수치 없음)

    <rect x="168" y="24" width="140" height="112" rx="10" fill="#F0FDF4" stroke="#166534" stroke-width="1.5"/>

    ${[['\u26FD','천연자원 수입','#1E40AF'],['\uD83C\uDFED','상품 생산','#9A3412'],['\uD83D\uDE97','상품 수출','#166534']].map((t,i)=>`<rect x="${16+i*104}" y="40" width="80" height="70" rx="10" fill="#fff" stroke="${t[2]}" stroke-width="1.6"/>
      <text x="${56+i*104}" y="80" font-size="22" text-anchor="middle">${t[0]}</text>
      <text x="${56+i*104}" y="100" font-size="7.4" fill="${t[2]}" text-anchor="middle" font-weight="800">${t[1]}</text>${i<2?`<path d="M${98+i*104} 75 L${118+i*104} 75" stroke="#A16207" stroke-width="2.2"/><path d="M${116+i*104} 70 L${122+i*104} 75 L${116+i*104} 80 Z" fill="#A16207"/>`:''}`).join('')}
    <text x="160" y="142" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="800">들여온 자원으로 만들어 내보내요(도식)</text></svg>`,
  // 5 살펴보기 — 우리나라와 조건이 다른 나라들(도식)
  world:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#F8FAFC"/>
    ${[['\uD83C\uDF3E','쌀을 많이 수출하는 나라','넓은 땅 \u00b7 알맞은 기후'],['\u26FD','원유를 많이 수출하는 나라','풍부한 원유'],['\uD83E\uDD16','기술 상품을 수출하는 나라','뛰어난 기술']].map((t,i)=>`<rect x="${10+i*102}" y="30" width="96" height="92" rx="10" fill="#fff" stroke="#475569" stroke-width="1.4"/>
      <text x="${58+i*102}" y="70" font-size="22" text-anchor="middle">${t[0]}</text>
      <text x="${58+i*102}" y="92" font-size="6.4" fill="#334155" text-anchor="middle" font-weight="800">${t[1]}</text>
      <text x="${58+i*102}" y="108" font-size="6.4" fill="#A16207" text-anchor="middle" font-weight="800">${t[2]}</text>`).join('')}
    <text x="160" y="150" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="800">나라의 특징에 따라 수출하는 것이 달라요(도식)</text></svg>`,

  port:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#E0F2FE"/>
    <path d="M20 86 C90 60 230 60 300 86" fill="none" stroke="#0369A1" stroke-width="2.2" stroke-dasharray="6 4"/>

    <circle cx="160" cy="68" r="16" fill="#FEF3C7" stroke="#A16207" stroke-width="1.8"/><text x="160" y="73" font-size="13" text-anchor="middle">\u2693</text>
    <text x="160" y="104" font-size="7.8" fill="#854D0E" text-anchor="middle" font-weight="800">항로 길목의 큰 항구</text>
    ${[70,250].map(x=>`<text x="${x}" y="96" font-size="13" text-anchor="middle">\uD83D\uDEA2</text>`).join('')}
    <text x="160" y="146" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="800">모인 상품을 필요한 나라에 다시 팔아요(도식)</text></svg>`,
  // 7 살펴보기 — 꼭 기억해요(도식)
  keep:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>

    <text x="160" y="128" font-size="8.6" fill="#FDE68A" text-anchor="middle" font-weight="800">무역이 이루어지는 다양한 모습을 살펴봤어요</text></svg>`,
  // 18 종료
  done:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>
    <circle cx="160" cy="76" r="40" fill="#fff" stroke="#A16207" stroke-width="2.4"/>
    <path d="M142 76 L156 90 L180 62" fill="none" stroke="#A16207" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

/* ===== 직접조작 — 나라의 조건 스위치를 켜고 끄며 무역의 모습을 보는 판 =====
   ★ 스위치를 누르면 그 조건이 켜지고 꺼진다(jwTap · 판 바꾸는 자리 state.jwOn = 단 하나 · 조건마다 한 비트).
   ★ 조건별 흐름은 jwWay 한 줄 · 판의 모습은 jwKind 한 줄(담는 상태 0).
   ★★ 기록장 기록은 |= 만(jwLog · jwNote 단 하나 · 적기 처리기에서만).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. */
/* 조건 셋 — 교과서 100~104쪽(on = 켰을 때 흐름 · off = 껐을 때 흐름) */
const JW_SW = [
  {t:'자원\u00b7넓은 땅', ic:'\uD83C\uDF3E', on:'넉넉해요', off:'부족해요',
   out:'\uD83C\uDF3E\u26FD 농산물\u00b7천연자원', in:'\u26FD 원유\u00b7천연가스\u00b7석탄'},
  {t:'기술', ic:'\u2699\uFE0F', on:'발달했어요', off:'부족해요',
   out:'\uD83D\uDCBE\uD83D\uDE97 기술로 만든 상품', in:'\uD83D\uDCBE\uD83D\uDE97 다른 나라가 만든 상품'},
  {t:'항로 길목\u00b7큰 항구', ic:'\u2693', on:'있어요', off:'없어요',
   out:'\uD83D\uDEA2 여러 나라에서 모인 상품', in:''}
];
const JW_N = 3;
const JW_ALL = 7;
/* 흐름 이름 — 나가요 · 들어와요 · 모였다가 다시 나가요 · 없음 */
const JW_WAYTXT = {out:'나가요(수출)', in:'들어와요(수입)', via:'모였다가 다시 나가요', none:'흐름이 없어요'};
/* ★ 판의 모습 표 — 켠 조건(비트 0 자원·땅 · 1 기술 · 2 길목)마다 한 칸
   0 우리나라 같은 모습 · 1 자원·농산물 수출 · 2 싱가포르 같은 모습 · 3 여러 모습이 겹침 · 4 내보낼 것이 없음 */
const JW_KIND = [4, 1, 0, 3, 2, 3, 3, 3];
/* 기록장 세 줄 */
const JW_LINE = [
  '천연자원은 들여오고, 발달한 기술로 상품을 만들어 수출해요 \u2014 우리나라 같은 모습',

  '항로 길목의 큰 항구에 모인 상품을 필요한 나라에 다시 팔아요 \u2014 싱가포르 같은 모습'
];
/* 판의 모습 — 줄 종류와 같은 자리 */
const JW_SAY = [
  '지금 판은 <b>자원은 들어오고, 기술로 만든 상품은 나가요</b>.',

/* ② 판 읽기 */
const JW_READ = [

const JW_READ_OK = 1;
const JW_READ_NO = [

/* ③ 핵심 질문 — 이를 통해 알 수 있는 우리나라 무역의 특징은 무엇인가요? */
const JW_MEAN = [
  '우리나라는 천연자원이 풍부해서 천연자원을 주로 수출해요',

function jwSw(s){ return JW_SW[s]; }
function jwIsOn(st,s){ return (st.jwOn >> s) & 1; }
/* ★ 조건별 흐름 — 한 줄(길목: 켜면 via · 끄면 none / 자원·땅·기술: 켜면 out · 끄면 in) */
function jwWay(st,s){ return s===2 ? (jwIsOn(st,s) ? 'via' : 'none') : (jwIsOn(st,s) ? 'out' : 'in'); }
/* ★ 판의 모습(줄 종류) — 한 줄(표 JW_KIND) */
function jwKind(st){ return JW_KIND[st.jwOn]; }
function jwHas(st,l){ return (st.jwLog & (1<<l))!==0; }
function jwLines(st){ return [0,1,2].filter(l=>jwHas(st,l)).length; }
function jwAll(st){ return st.jwLog===JW_ALL; }

function jwToggles(st){
  return [0,1,2].map(s=>{ const on=jwIsOn(st,s);
    return `<button class="jw-tog" data-s="${s}" data-on="${on}" onclick="jwTap(${s})"><span>${jwSw(s).ic} ${jwSw(s).t}</span><span class="lamp"></span><span class="st">${on?jwSw(s).on:jwSw(s).off}</span></button>`; }).join('');
}
function jwFlows(st){
  return [0,1,2].map(s=>{ const w=jwWay(st,s); const g = w==='out'||w==='via' ? jwSw(s).out : w==='in' ? jwSw(s).in : '\u2693 큰 항구';
    const ar = w==='in' ? '\u2B05' : w==='via' ? '\u21C4' : w==='out' ? '\u27A1' : '\u00B7';
    return `<div class="jw-f" data-s="${s}" data-way="${w}"><span class="g">${g}</span><span class="ar">${ar}</span><span class="w">${JW_WAYTXT[w]}</span></div>`; }).join('');
}
function jwNotes(st){
  return JW_LINE.map((t,l)=>{ const on=jwHas(st,l);
    return `<div class="jw-line${on?' set':''}" data-line="${l}">${on?'\u2714 '+t:'\u2610 아직 적지 않은 줄'}</div>`; }).join('');
}

function jwBoard(st){
  const fin = st.jwFin!=null, all = jwAll(st), k=jwKind(st);
  const head = fin ? '무역이 이루어지는 다양한 모습을 살펴봤어요'
    : st.jwMean!=null ? '우리나라 무역의 특징까지 골랐어요 \u2014 이제 정리해요'
    : st.jwRead!=null ? '우리나라 무역의 특징을 골라 봐요'
    : all ? '기록장 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : st.jwLog!==0 ? '스위치를 바꿔 다른 모습을 찾아 적어 봐요'
    : '스위치를 하나 켜고 달라진 판을 적어 봐요';
  return `<div class="jw-board" data-on="${st.jwOn}" data-log="${st.jwLog}" data-lines="${jwLines(st)}" data-all="${all?1:0}" data-kind="${k}" data-read="${st.jwRead==null?-1:st.jwRead}" data-mean="${st.jwMean==null?-1:st.jwMean}" data-fin="${fin?1:0}">
    <div class="jw-head">${head}</div>
    <div class="jw-sw">${jwToggles(st)}</div>
    <div class="jw-flow">${jwFlows(st)}</div>

    <div class="jw-note">${jwNotes(st)}</div>

    ${selfCheck(2,"무역이 이루어지는 다양한 모습을 설명할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">무역을 통한 세계 여러 나라의 상호 의존과 경쟁 관계</b>를 살펴봐요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u2_l11";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  jwOn:0, jwLog:0,
  jwRead:null, jwMean:null, jwFin:null,
  jwWrongR:null, jwWrongK:null, jwWrongF:null,
  jwMsg:null, jwWarn:false, jwBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function jwRender(){ main.innerHTML = slides[state.idx].render(state); }
function jwHold(msg){
  state.jwWarn=true; state.jwBusy=true; state.jwMsg=msg;
  playThud(); jwRender();
  setTimeout(()=>{ state.jwBusy=false; state.jwWarn=false; state.jwMsg=null;
    state.jwWrongR=null; state.jwWrongK=null; state.jwWrongF=null; jwRender(); },1600);
}
/* ★ 기록장 기록 — 더하기만 하는 자리 단 하나 */
function jwNote(l){ state.jwLog |= (1 << l); }

/* ① 스위치 — 그 조건을 켜고 끔 */
function jwTap(s){
  if(state.jwFin!=null) return;                                        // 가드①
  if(state.jwBusy) return;                                             // 가드⑧
  if(!Number.isInteger(s) || s<0 || s>=JW_N) return;                   // 가드②
  if(jwAll(state)){ jwHold(JW_LOCK); return; }                         // 가드③ 판 불변
  state.jwOn = state.jwOn ^ (1 << s);                                  // ★ 판이 바뀌는 자리 단 하나
  state.jwWarn=false; state.jwMsg=null; playBlip(); jwRender();
}

/* ② 기록장에 적기 — 한 가지 모습이고(가드⑩) 아직 적지 않았을 때만(가드⑨) */
function jwWrite(){
  if(state.jwFin!=null) return;                                        // 가드①
  if(state.jwBusy) return;                                             // 가드⑧
  if(jwAll(state)){ jwHold(JW_LOCK); return; }                         // 가드③ 판 불변
  const l = jwKind(state);
  if(l===3){ jwHold(JW_MIX); return; }                                 // 가드⑩ 여러 모습이 겹침 — 판 불변
  if(l===4){ jwHold(JW_NONE); return; }                                // 가드⑩ 내보낼 것이 없음 — 판 불변
  if(jwHas(state,l)){ jwHold(JW_AGAIN); return; }                      // 가드⑨ 이미 선 줄 — 판 불변
  jwNote(l);
  state.jwWarn=false;
  if(jwAll(state)){ state.jwMsg = JW_ALL_MSG; playChime(); }
  else { state.jwMsg = `기록장에 적었어요 \u2014 ${JW_LINE[l]}. 스위치를 바꿔 다른 모습을 찾아봐요.`; playChime(); }
  jwRender();
}

/* ③ 판 읽기 — 기록장 세 줄 뒤에만(가드④). */
function jwReadPick(k){
  if(state.jwFin!=null) return;                                        // 가드①
  if(state.jwBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JW_READ.length) return;         // 가드②
  if(!jwAll(state)){ jwHold(JW_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.jwRead!=null){ jwHold(JW_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===JW_READ_OK){
    state.jwRead=k; state.jwWrongR=null; state.jwWarn=false;
    state.jwMsg = '판을 잘 읽었어요. 켠 <b>조건</b>에 따라 나가고 들어오는 흐름이 달라졌어요.';
    playChime(); jwRender(); return;
  }
  state.jwWrongR=k;
  jwHold(JW_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function jwMeanPick(k){
  if(state.jwFin!=null) return;                                        // 가드①
  if(state.jwBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JW_MEAN.length) return;         // 가드②
  if(state.jwRead==null){ jwHold(JW_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.jwMean!=null){ jwHold(JW_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==JW_MEAN_OK){ state.jwWrongK=k; jwHold(JW_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.jwMean = k;                                                    // ★ 핵심 질문을 고르는 자리 단 하나
  state.jwWarn=false;
  state.jwMsg = '천연자원은 <b>수입</b>하고, 발달한 기술로 만든 상품은 <b>수출</b>해요.';
  playChime(); jwRender();
}

/* ⑤ 마무리 — 교과서 104쪽 꼭 기억해요 2 */
function jwFinish(k){
  if(state.jwFin!=null) return;                                        // 가드①
  if(state.jwBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JW_FIN.length) return;          // 가드②
  if(state.jwMean==null){ jwHold(JW_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===JW_FIN_OK){
    state.jwFin=k; state.jwWrongF=null; state.jwMsg=null; state.jwWarn=false;
    playChime(); jwRender(); return;
  }
  state.jwWrongF=k;
  jwHold(JW_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 12차시(l12) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

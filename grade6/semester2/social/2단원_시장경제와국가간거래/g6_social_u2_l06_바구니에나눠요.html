학습 목표: 경제성장이 우리 생활에 미치는 영향을 설명할 수 있다.

META = "2단원 시장경제와 국가 간 거래 · 주제② 경제성장과 우리 생활"
⚠️ 엔진은 u2 l05(→ u2 l04 → … 6-1 사회 엔진)에서 100% 승계 · 엔진 무수정 · 2단원 색 #A16207 그대로.
⚠️ 회수 키 `g6_s2_social_u2_l06_v1` · 맵 키 `g6_social_u2_l06` · 파일명 `바구니에나눠요` — 조작 이름(선례 승계).

직접조작: 경제성장이 바꾼 생활을 네 바구니에 나누는 카드 판
  ⭐ 씨앗은 지도서 9차시 전개 「경제성장과 관련된 카드를 분류하며 관련 내용과 연관 지어 봅시다」
     (첨단 기술 · 문화 산업 · 교육 · 의료 카드를 주제에 따라 분류하고 뒷면에 생활의 변화를 쓰기)와 교과서 81~83쪽.
  ⭐ 카드 여덟 장(바구니마다 두 장) · 카드를 하나 들고(`qnHold`) 바구니를 고른다. 카드의 바구니는 **담는 상태 없이** `qnHome(c)` 한 줄이 정한다.
  ⭐ 알맞은 바구니에 놓으면 카드가 뒤집혀 **뒷면(생활의 변화)** 이 보인다. 놓은 기록은 `state.qnPut |=` 단 하나(`qnNote` · 바구니 처리기에서만)에서만 선다(줄지 않음 · 되돌리기 없음).
  ⭐ 수첩 네 줄은 바구니가 찼는지 `qnFull` 한 줄에서만 읽는다(줄 상태 0).
  ⭐ 판 읽기는 네 줄이 다 선 뒤에만(정답 자리 1) → 핵심 질문 「경제성장과 문화 산업은 어떤 관계가 있을까요?」 3택(정답 자리 2) →
     마무리 3택 = 삶의 질이 높아져요(정답 자리 0).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 수첩 네 줄이 선 뒤 판 움직이기(카드·바구니) 무시 — 판 불변
     ④ 네 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 관계 3택 무시 · 고른 뒤 다시 무시 · 알맞지 않은 관계 무시
     ⑥ 관계를 고르기 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`qnBusy`)
     ⑨ 이미 놓은 카드 들기 · 카드 없이 바구니 고르기 · 알맞지 않은 바구니 무시 — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.qn-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **카드와 그림은 교과서 사진을 나타낸 도식** — 실제 사진이 아니다(캡션 상시).
  ㉡ **그래프는 늘어난 흐름만 보이는 도식** — 금액·수명 수치는 적지 않는다.
  ㉢ **경제성장이 생활에 미치는 영향은 좋은 변화만 있는 것은 아니다** — 문제는 다음 시간에 알아본다(캡션 한 자리 · 차시 예고).
  ㉣ **영상 보기 · 카드 뒷면 쓰기 · 모둠 문장 만들기 · 밑줄 긋기 · 직업 소개 영상은 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 빠른 경제성장으로 생긴 문제 · 해결 방법 · 무역 0(차시 예고 한 자리만).
  **교사용 참고 자료 0** — 참고 도서·저자·출판사 · 누리집 주소 · 활동지 · 평가 관점.

const QN_ALL_MSG = '수첩의 네 줄이 <b>모두 섰어요</b>. 판을 읽어 봐요.';

/* ★ 카드의 바구니 — 한 줄(담는 자리 0) */
function qnHome(c){ return QN_CARD[c].b; }
function qnIn(st,c){ return (st.qnPut >> c & 1) === 1; }
/* ★ 바구니가 찼는지 — 한 줄 */
function qnFull(st,b){ return QN_CARD.every((x,c)=>x.b!==b || qnIn(st,c)); }
function qnAll(st){ return st.qnPut===QN_ALL; }
function qnCount(st,b){ return QN_CARD.filter((x,c)=>x.b===b && qnIn(st,c)).length; }

function qnCards(st){
  return `<div class="qn-cards">${QN_CARD.map((x,c)=>{ const put=qnIn(st,c), held=st.qnHold===c;
    return `<button class="qn-card${put?' put':''}${held?' held':''}" data-c="${c}" data-put="${put?1:0}" data-held="${held?1:0}" onclick="qnPick(${c})">${put?`\u2714 ${x.back}<span class="bk">${QN_BASK[qnHome(c)].i} ${QN_BASK[qnHome(c)].t}</span>`:x.t}</button>`; }).join('')}</div>`;
}
function qnBaskets(st){
  return `<div class="qn-baskets">${QN_BASK.map((k,b)=>{ const full=qnFull(st,b);
    return `<button class="qn-basket${full?' full':''}" data-b="${b}" data-full="${full?1:0}" onclick="qnDrop(${b})"><span class="ic">${k.i}</span>${k.t}<span class="cnt">${qnCount(st,b)} / 2장</span></button>`; }).join('')}</div>`;
}
function qnNotes(st){
  return QN_NOTE.map((t,b)=>{ const on=qnFull(st,b);
    return `<div class="qn-line${on?' set':''}" data-line="${b}">${on?'\u2714 '+t+'을 모두 놓았어요':t+' \u2014 아직 다 놓지 않았어요'}</div>`; }).join('');
}

function qnBoard(st){
  const fin = st.qnFin!=null, all = qnAll(st);
  const head = fin ? '경제성장이 우리 생활에 미치는 영향을 알아봤어요'
    : st.qnMean!=null ? '관계까지 골랐어요 \u2014 이제 정리해요'
    : st.qnRead!=null ? '경제성장과 문화 산업의 관계를 골라 봐요'
    : all ? '수첩의 네 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : st.qnHold>=0 ? '든 카드를 알맞은 바구니에 놓아 봐요'
    : '카드를 하나 골라 들어 봐요';
  return `<div class="qn-board" data-put="${st.qnPut}" data-hold="${st.qnHold}" data-all="${all?1:0}" data-read="${st.qnRead==null?-1:st.qnRead}" data-mean="${st.qnMean==null?-1:st.qnMean}" data-fin="${fin?1:0}">
    <div class="qn-head">${head}</div>
    ${qnCards(st)}
    ${qnBaskets(st)}
    <div class="qn-note">${qnNotes(st)}</div>
  </div>`;
}

  } else if(st.qnMean!=null){

    right += `<div class="qn-fin">${QN_FIN.map((t,k)=>`<button class="${st.qnWrongF===k?'no':''}" onclick="qnFinish(${k})">${t}</button>`).join('')}</div>`;

  return `<div class="dw-wrap">

}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const main=document.getElementById('main');

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function qnRender(){ main.innerHTML = slides[state.idx].render(state); }
function qnHoldMsg(msg){
  state.qnWarn=true; state.qnBusy=true; state.qnMsg=msg;
  playThud(); qnRender();
  setTimeout(()=>{ state.qnBusy=false; state.qnWarn=false; state.qnMsg=null;
    state.qnWrongR=null; state.qnWrongM=null; state.qnWrongF=null; qnRender(); },1600);
}
/* ★ 놓은 기록 — 더하기만 하는 자리 단 하나 */
function qnNote(){ state.qnPut |= 1 << state.qnHold; }

/* ① 카드 — 들기 · 든 카드를 다시 누르면 내려놓기 */
function qnPick(c){
  if(state.qnFin!=null) return;                                        // 가드①
  if(state.qnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(c) || c<0 || c>=QN_N) return;                   // 가드②
  if(qnAll(state)){ qnHoldMsg(QN_LOCK); return; }                      // 가드③ 판 불변
  if(qnIn(state,c)){ qnHoldMsg(QN_PUT_AGAIN); return; }                // 가드⑨ 이미 놓은 카드 — 판 불변
  state.qnHold = state.qnHold===c ? -1 : c;                            // ★ 카드를 드는 자리 단 하나
  state.qnWarn=false; state.qnMsg=null; playBlip(); qnRender();
}

/* ② 바구니 — 든 카드를 놓기 */
function qnDrop(b){
  if(state.qnFin!=null) return;                                        // 가드①
  if(state.qnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(b) || b<0 || b>=QN_BASK.length) return;         // 가드②
  if(qnAll(state)){ qnHoldMsg(QN_LOCK); return; }                      // 가드③ 판 불변
  if(state.qnHold<0){ qnHoldMsg(QN_EMPTY); return; }                   // 가드⑨ 카드 없음 — 판 불변
  if(qnHome(state.qnHold)!==b){ qnHoldMsg(QN_WRONG[b]); return; }      // 가드⑨ 알맞지 않은 바구니 — 판 불변
  const c = state.qnHold;
  qnNote();
  state.qnHold = -1;
  state.qnWarn=false;
  if(qnAll(state)){ state.qnMsg = QN_ALL_MSG; playChime(); }
  else { state.qnMsg = `「${QN_BASK[b].t}」 바구니에 놓았어요 \u2014 뒷면: ${QN_CARD[c].back}.`; playBlip(); }
  qnRender();
}

/* ③ 판 읽기 — 수첩 네 줄 뒤에만(가드④). */
function qnReadPick(k){
  if(state.qnFin!=null) return;                                        // 가드①
  if(state.qnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=QN_READ.length) return;         // 가드②
  if(!qnAll(state)){ qnHoldMsg(QN_ORDER_R); return; }                  // 가드④ 순서 — 판 불변
  if(state.qnRead!=null){ qnHoldMsg(QN_READ_AGAIN); return; }          // 가드④ 판 불변
  if(k===QN_READ_OK){
    state.qnRead=k; state.qnWrongR=null; state.qnWarn=false;
    state.qnMsg = '판을 잘 읽었어요. 경제가 성장하면 우리 생활의 <b>여러 부분</b>이 달라져요.';
    playChime(); qnRender(); return;
  }
  state.qnWrongR=k;
  qnHoldMsg(QN_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function qnMeanPick(k){
  if(state.qnFin!=null) return;                                        // 가드①
  if(state.qnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=QN_MEAN.length) return;         // 가드②
  if(state.qnRead==null){ qnHoldMsg(QN_ORDER_M); return; }             // 가드⑤ 순서 — 판 불변
  if(state.qnMean!=null){ qnHoldMsg(QN_MEAN_AGAIN); return; }          // 가드⑤ 판 불변
  if(k!==QN_MEAN_OK){ state.qnWrongM=k; qnHoldMsg(QN_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.qnMean = k;                                                    // ★ 관계를 고르는 자리 단 하나
  state.qnWarn=false;
  state.qnMsg = '경제가 성장하면 <b>문화 산업</b>이 발달하고, 문화 산업이 발달하면 <b>경제성장</b>에 도움을 줘요.';
  playChime(); qnRender();
}

/* ⑤ 마무리 — 교과서 83쪽 */
function qnFinish(k){
  if(state.qnFin!=null) return;                                        // 가드①
  if(state.qnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=QN_FIN.length) return;          // 가드②
  if(state.qnMean==null){ qnHoldMsg(QN_ORDER_F); return; }             // 가드⑥ 순서 — 판 불변
  if(k===QN_FIN_OK){
    state.qnFin=k; state.qnWrongF=null; state.qnMsg=null; state.qnWarn=false;
    playChime(); qnRender(); return;
  }
  state.qnWrongF=k;
  qnHoldMsg(QN_FIN_NO[k]);                                             // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 7차시(l07) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

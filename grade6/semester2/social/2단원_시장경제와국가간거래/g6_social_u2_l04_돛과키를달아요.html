직접조작: 기업이라는 배 — 돛(자유)과 키(책임)
  ⭐ 씨앗은 지도서 6~7차시 동기 유발 두 물음 「기업에 자유가 없다면 어떻게 될까요?」 · 「기업에 자유만 있다면 어떻게 될까요?」와
     교과서 72~75쪽(기업을 설립해 자유롭게 경쟁 · 무엇을 얼마나 생산할지 결정 · 과도한 경쟁의 문제 · 환경 보존 · 공정한 경쟁).
  ⭐ 배에 카드 셋을 달고 뗄 수 있다(순서 자유 · 여러 장) — 돛 한 장(자유롭게 경쟁하며 생산을 정해요) · 키 두 장(환경 보존 · 공정한 경쟁).
     배가 어디에 닿는지는 **도착을 담는 상태 없이** `yhWay(st)` 한 줄이 그때그때 정한다(돛 없음 0 · 돛만 1 · 돛과 키 둘 2).
  ⭐ 생산 계획 셋(교과서 73쪽 — 고루 좋아하는 제품 · 가격 낮추기 · 온라인 광고)은 어느 것을 골라도 **결과는 배만 본다**(계획마다 다른 셈 0).
  ⭐ 수첩 세 줄(돛 없이 띄운 판 · 돛만 올리고 띄운 판 · 돛과 키를 함께 갖추고 띄운 판)은
     항해 기록 `state.yhLog |=` 단 하나(`yhNote` · 항해 처리기에서만)에서만 선다(줄 상태 0 · 줄지 않음). 세 줄 최소 걸음은 판 전수 BFS.
  ⭐ 판 읽기는 세 줄이 다 선 뒤에만(정답 자리 1). 이어서 사회적 책임이 필요한 까닭 3택(정답 자리 2) →
     마무리 3택 = 기업의 자유와 사회적 책임(정답 자리 0).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 8종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 수첩 세 줄이 선 뒤 판 움직이기(카드·항해) 무시 — 판 불변
     ④ 세 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 까닭 3택 무시 · 고른 뒤 다시 무시 · 알맞지 않은 까닭 무시
     ⑥ 까닭을 고르기 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`yhBusy`).
   수첩 줄은 기록에서만 — 카드를 떼어도 줄지 않음(|= 단 하나).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.yh-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판은 기업의 자유와 책임의 관계를 어림해 나타낸 도식이다** — 실제 기업의 경제활동은 여러 사정에 따라 달라진다(캡션 상시).
  ㉡ **키 두 장은 교과서의 예시일 뿐이다** — 두 장만 있으면 된다는 뜻이 아니라, 자유와 책임이 함께 가야 한다는 것을 나타낸 것(캡션 상시).
  ㉢ **신문 이름 · 날짜 · 연도 · 나무 수 · 가격 · 광고비 비율 · 실제 기업 이름은 적지 않는다**(교과서 73쪽 표·그래프의 수치는 말로 어림).
  ㉣ **문제 해결 방법 쓰기 · 브레인 라이팅 · 뉴스 찾기 · 영상 보기 · 장바구니 찾기 놀이는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 경제성장의 뜻 · 경제성장의 영향 · 무역 0(차시 예고 한 자리만).
  **교사용 참고 자료 0** — 참고 도서·저자·출판사 · 신문 이름·날짜 · 활동지 · 평가 관점 · 누리집 주소.

.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

const YH_ORDER_F = '아직 <b>사회적 책임이 필요한 까닭</b>을 고르지 않았어요. 먼저 골라 봐요. 판은 그대로예요.';
const YH_ALL_MSG = '수첩의 세 줄이 <b>모두 섰어요</b>. 판을 읽어 봐요.';

/* 돛 — 한 줄 */
function yhSail(st){ return st.yhLaw & 1; }
/* 단 키 수 — 한 줄 */
function yhKeel(st){ return (st.yhLaw >> 1 & 1) + (st.yhLaw >> 2 & 1); }
/* ★ 배가 닿는 곳 — 돛과 키에서 그때그때 정하는 한 줄(도착을 담는 자리 0) */
function yhWay(st){ return yhSail(st)===0 ? 0 : yhKeel(st)===YH_KEEL ? 2 : 1; }
/* ★ 이 판이 수첩의 어느 줄인지 — 한 줄 */
function yhMark(st){ return 1 << yhWay(st); }
function yhLook(st){ return YH_LOOK[yhWay(st)]; }
function yhHas(st,b){ return (st.yhLog & b)!==0; }
function yhAll(st){ return st.yhLog===YH_ALL; }
/* ★ 카드·계획 — 처리기가 읽는 자리 각각 단 하나 */
function yhCardOf(k){ return YH_CARD[k]; }
function yhPlanOf(k){ return YH_PLAN[k]; }

function yhSea(st){
  const way = yhWay(st), x = [40,150,250][way];
  return `<div class="yh-sea" data-x="${x}" data-way="${way}"><svg viewBox="0 0 320 130">
    <rect width="320" height="130" fill="#F0F9FF"/>
    <path d="M0 92 Q40 84 80 92 T160 92 T240 92 T320 92 L320 130 L0 130 Z" fill="#BAE6FD"/>
    <rect x="4" y="66" width="30" height="26" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/><text x="19" y="82" font-size="7" fill="#475569" text-anchor="middle" font-weight="800">부두</text>
    <path d="M176 92 L192 64 L210 92 Z" fill="#94A3B8"/><text x="193" y="60" font-size="7" fill="#64748B" text-anchor="middle" font-weight="800">바위</text>
    <rect x="272" y="58" width="44" height="34" rx="3" fill="#DCFCE7" stroke="#15803D" stroke-width="1.4"/><text x="294" y="79" font-size="7.6" fill="#166534" text-anchor="middle" font-weight="800">항구</text>
    <g class="yh-boat" transform="translate(${x-40},0)">
      <path d="M30 84 L70 84 L64 96 L36 96 Z" fill="#A16207"/>
      <path d="M50 84 L50 44" stroke="#334155" stroke-width="2"/>
      ${yhSail(st)?`<path class="yh-sail" d="M52 46 L72 80 L52 80 Z" fill="#FEF3C7" stroke="#A16207" stroke-width="1.2"/>`:''}
      ${[0,1].map(i=>(st.yhLaw>>(i+1)&1)?`<rect class="yh-chip" x="${22+i*6}" y="86" width="5" height="12" rx="1.5" fill="#0369A1"/>`:'').join('')}
    </g>
    ${way===1?`<text x="160" y="40" font-size="14" text-anchor="middle">\u26A0\uFE0F</text>`:''}
  </svg></div>`;
}
function yhCards(st){
  return `<div class="yh-cards">${YH_CARD.map((c,i)=>{ const on=(st.yhLaw>>i&1)===1;
    return `<button class="${on?'on':''}${c.sail?' sail':''}" data-card="${i}" data-on="${on?1:0}" onclick="yhToggle(${i})">${on?'\u2714 ':'\u2795 '}${c.t}</button>`; }).join('')}</div>`;
}
function yhState(st){
  const s = yhLook(st);
  return `<div class="yh-state ${s}" data-s="${s}">\u26F5 ${YH_SAY[s]}</div>`;
}
function yhPlans(){
  return `<div class="yh-plans">${YH_PLAN.map((t,i)=>`<button data-plan="${i}" onclick="yhSailOut(${i})">\uD83D\uDEA2 배를 띄워요 \u2014 「${t}」</button>`).join('')}</div>`;
}
function yhNotes(st){
  return YH_NOTE.map((t,i)=>{ const b=1<<i, on=yhHas(st,b);
    return `<div class="yh-line${on?' set':''}" data-line="${i}">${on?'\u2714 '+t+'을 봤어요':t+' \u2014 아직 못 봤어요'}</div>`; }).join('');
}

function yhBoard(st){
  const fin = st.yhFin!=null, all = yhAll(st);
  const head = fin ? '기업의 자유와 사회적 책임을 알아봤어요'
    : st.yhWhy!=null ? '사회적 책임이 필요한 까닭까지 골랐어요 \u2014 이제 정리해요'
    : st.yhRead!=null ? '사회적 책임이 필요한 까닭을 골라 봐요'
    : all ? '수첩의 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : '돛과 키를 달고 떼며 배를 띄워 봐요';
  return `<div class="yh-board" data-law="${st.yhLaw}" data-way="${yhWay(st)}" data-log="${st.yhLog}" data-all="${all?1:0}" data-read="${st.yhRead==null?-1:st.yhRead}" data-why="${st.yhWhy==null?-1:st.yhWhy}" data-fin="${fin?1:0}">
    <div class="yh-head">${head}</div>
    ${yhSea(st)}
    ${yhCards(st)}
    ${yhState(st)}
    ${yhPlans()}
    <div class="yh-note">${yhNotes(st)}</div>
  </div>`;
}

function yhPanel(st){
  const fin = st.yhFin!=null, all = yhAll(st);
  const q = fin ? '기업이라는 배로 기업의 자유와 사회적 책임을 살펴봤어요.'
    : st.yhWhy!=null ? '오늘 공부한 내용을 정리해요. 기업의 자유와 사회적 책임은 어떤 관계일까요?'
    : st.yhRead!=null ? '기업이 사회적 책임을 다해야 하는 까닭은 무엇일까요?'
    : all ? '돛 없이, 돛만, 돛과 키를 함께 갖추고 배를 띄워 봤어요. 판에서 무엇을 알 수 있나요?'
    : st.yhLog!==0 ? '수첩의 세 줄을 모두 세워 봐요. 돛과 키를 바꿔 달고 다시 띄우면 배는 어디에 닿을까요?'
    : '기업에 자유가 없다면, 자유만 있다면 어떻게 될까요? 먼저 돛 없이 배를 띄워 보고, 돛과 키를 달아 봐요.';
  let right = `<div class="yh-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\u26F5 기업이라는 배 \u2014 돛과 키</div>
      돛(<b>자유</b>)이 없으면 배가 나아가지 못했고, 돛만 있으면 <b>바위</b>에 부딪혔어요. <b>환경을 지키고</b> <b>공정하게 경쟁하는</b> 키(<b>책임</b>)를 함께 갖추자
      배가 항구에 닿았어요. 기업의 경제활동은 사회에 큰 영향을 미치므로 기업은 <b>사회에 대한 책임감</b>을 가져야 해요.<br>
      <span style="color:#64748B">판은 기업의 자유와 책임의 관계를 어림한 <b>도식</b>이에요. 실제 기업의 경제활동은 여러 사정에 따라 달라져요.
      <b>문제 해결 방법 쓰기</b>, <b>친구들과 생각 나누기</b>, <b>뉴스 찾기</b>, <b>영상 보기</b>와 <b>장바구니 찾기 놀이</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.yhWhy!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="yh-fin">${YH_FIN.map((t,k)=>`<button class="${st.yhWrongF===k?'no':''}" onclick="yhFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.yhRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 사회적 책임이 필요한 까닭</div>`;
    right += `<div class="yh-why">${YH_WHY.map((t,k)=>`<button class="${st.yhWrongW===k?'no':''}" onclick="yhWhyPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="yh-hint">기업이 이윤만 중요하게 생각할 때 생긴 문제들이 누구에게 피해를 주었는지 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="yh-read">${YH_READ.map((t,k)=>`<button class="${st.yhWrongR===k?'no':''}" onclick="yhReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\u26F5 기업이라는 배</div>`;
    right += `<div class="yh-hint"><b>돛</b>이나 <b>키</b> 카드를 누르면 배에 달리고, 다시 누르면 떼어져요(순서도 장수도 마음대로). <b>배를 띄워요</b>를 누르면 지금 배로 생산 계획을 실행해요 \u2014 어느 계획이든 배가 닿는 곳은 돛과 키가 정해요. 수첩의 <b>세 줄</b>이 모두 서면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.yhMsg) right += `<div class="dw-msg${st.yhWarn?' warn':''}">${st.yhMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\u26F5 기업이라는 배 \u2014 돛(자유)과 키(책임)</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${yhBoard(st)}<div class="cvcap">판은 기업의 자유와 책임의 관계를 어림한 <b>도식</b>이에요. 실제 기업의 경제활동은 여러 사정에 따라 달라져요 \u2014 키 두 장은 교과서의 예시일 뿐, 두 장만 있으면 된다는 뜻이 아니라 자유와 책임이 함께 가야 한다는 것을 나타냈어요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u2_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  yhLaw:0, yhLog:0, yhLast:null,
  yhRead:null, yhWhy:null, yhFin:null,
  yhWrongR:null, yhWrongW:null, yhWrongF:null,
  yhMsg:null, yhWarn:false, yhBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function yhRender(){ main.innerHTML = slides[state.idx].render(state); }
function yhHold(msg){
  state.yhWarn=true; state.yhBusy=true; state.yhMsg=msg;
  playThud(); yhRender();
  setTimeout(()=>{ state.yhBusy=false; state.yhWarn=false; state.yhMsg=null;
    state.yhWrongR=null; state.yhWrongW=null; state.yhWrongF=null; yhRender(); },1600);
}
/* ★ 항해 기록 — 더하기만 하는 자리 단 하나 */
function yhNote(){ state.yhLog |= yhMark(state); }
function yhSay(base){
  state.yhWarn=false;
  if(yhAll(state)){ state.yhMsg = YH_ALL_MSG; playChime(); }
  else { state.yhMsg = base; playBlip(); }
  yhRender();
}

/* ① 돛·키 카드 — 배에 달거나 떼기(순서 자유) */
function yhToggle(k){
  if(state.yhFin!=null) return;                                        // 가드①
  if(state.yhBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YH_CARD.length) return;         // 가드②
  if(yhAll(state)){ yhHold(YH_LOCK); return; }                         // 가드③ 판 불변
  const C = yhCardOf(k);
  state.yhLaw ^= 1<<k;                                                 // ★ 카드가 달리고 떼어지는 자리 단 하나
  yhSay((state.yhLaw>>k&1) ? `「${C.t}」 카드를 배에 <b>달았어요</b> \u2014 ${C.long}.`
    : `「${C.t}」 카드를 배에서 <b>뗐어요</b>.`);
}

/* ② 배 띄우기 — 지금 배로 생산 계획 실행(결과는 배만 봄) */
function yhSailOut(k){
  if(state.yhFin!=null) return;                                        // 가드①
  if(state.yhBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YH_PLAN.length) return;         // 가드②
  if(yhAll(state)){ yhHold(YH_LOCK); return; }                         // 가드③ 판 불변
  const P = yhPlanOf(k);
  state.yhLast = k;
  yhNote();
  yhSay(`「${P}」 \u2014 ${YH_SAY[yhLook(state)]}.`);
}

/* ③ 판 읽기 — 수첩 세 줄 뒤에만(가드④). */
function yhReadPick(k){
  if(state.yhFin!=null) return;                                        // 가드①
  if(state.yhBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YH_READ.length) return;         // 가드②
  if(!yhAll(state)){ yhHold(YH_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.yhRead!=null){ yhHold(YH_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===YH_READ_OK){
    state.yhRead=k; state.yhWrongR=null; state.yhWarn=false;
    state.yhMsg = '판을 잘 읽었어요. 기업이 나아가려면 <b>자유</b>가 필요하고, 바르게 나아가려면 <b>사회적 책임</b>이 함께 필요해요.';
    playChime(); yhRender(); return;
  }
  state.yhWrongR=k;
  yhHold(YH_READ_NO[k]);
}

/* ④ 사회적 책임이 필요한 까닭 — 판을 읽은 뒤에만(가드⑤). */
function yhWhyPick(k){
  if(state.yhFin!=null) return;                                        // 가드①
  if(state.yhBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YH_WHY.length) return;          // 가드②
  if(state.yhRead==null){ yhHold(YH_ORDER_W); return; }                // 가드⑤ 순서 — 판 불변
  if(state.yhWhy!=null){ yhHold(YH_WHY_AGAIN); return; }               // 가드⑤ 판 불변
  if(k!==YH_WHY_OK){ state.yhWrongW=k; yhHold(YH_WHY_NO[k]); return; } // 가드⑤ 판 불변
  state.yhWhy = k;                                                     // ★ 까닭을 고르는 자리 단 하나
  state.yhWarn=false;
  state.yhMsg = '기업의 경제활동은 <b>사회에 큰 영향</b>을 미치고, 기업은 시장경제를 이루는 <b>중요한 주체</b>예요 \u2014 그래서 기업은 사회에 대한 책임감을 가져야 해요.';
  playChime(); yhRender();
}

/* ⑤ 마무리 — 교과서 72~75쪽 */
function yhFinish(k){
  if(state.yhFin!=null) return;                                        // 가드①
  if(state.yhBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YH_FIN.length) return;          // 가드②
  if(state.yhWhy==null){ yhHold(YH_ORDER_F); return; }                 // 가드⑥ 순서 — 판 불변
  if(k===YH_FIN_OK){
    state.yhFin=k; state.yhWrongF=null; state.yhMsg=null; state.yhWarn=false;
    playChime(); yhRender(); return;
  }
  state.yhWrongF=k;
  yhHold(YH_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l05_기간을골라요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

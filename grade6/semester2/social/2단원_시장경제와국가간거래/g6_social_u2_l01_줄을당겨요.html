직접조작: 두 쪽이 함께 당기는 사과 가격 줄다리기 판
  ⭐ 씨앗은 교과서 62쪽 한 줄 — 「시장에서는 사람들이 필요로 하는 상품의 양과 기업에서 제공하는 상품의 양에 따라 가격이 정해집니다」
     + 지도서 2차시 동기 유발 예시 답안 「사람들이 사고 싶어 하는 사과의 양에 비해 시장에 공급되는 사과의 양이 변할 수 있기 때문이다」.
  ⭐ 판의 한쪽은 가계 쪽(사람들이 사려는 사과 상자) · 다른 쪽은 기업 쪽(시장에 내놓은 사과 상자) — 처음은 둘 다 셋(지난주 판).
     단추 넷으로 한쪽을 한 상자씩 늘리거나 줄인다. 가운데 가격 깃발은 **가격을 적는 자리가 코드에 아예 없다** —
     `tgFlag(st) = st.tgQty[0] - st.tgQty[1]` 한 줄이 두 쪽의 양을 견주어 그때그때 정한다(TG_PRICE 류 상수·상태 0).
  ⭐★ 그래서 **양이 둘 다 달라져도 가격은 지난주와 같을 수 있다** — 넷·넷, 둘·둘, 다섯·다섯 모두 깃발이 가운데.
     가격은 한쪽의 양이 아니라 **두 쪽을 함께 견준 것**이다.
  ⭐ 수첩 세 줄(싸진 판 · 비싸진 판 · 양은 달라졌는데 가격은 같은 판)은 본 판 기록 `state.tgSeen |=` 단 하나에서만 선다(줄 상태 0 · 줄지 않음).
     세 줄이 서는 데 **적어도 세 걸음**(판 전수 BFS) — 첫 걸음은 언제나 깃발을 옮기므로 「같은 판」은 두 쪽을 다 움직여야 선다.
  ⭐ 판 읽기는 세 줄이 다 선 뒤에만(정답 자리 2). 이어서 자유로운 경쟁의 도움 3택(정답 자리 0) → 마무리 3택 = 시장경제의 뜻(정답 자리 1).

단계 — ① 두 쪽 움직여 수첩 세 줄 세우기 → ② 판 읽기 3택(정답 자리 2) → ③ 자유로운 경쟁의 도움 3택(정답 자리 0) →
  ④ 마무리 3택 = 교과서 62쪽 시장경제의 뜻(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 가득 찬 쪽 늘리기 무시(다섯 상자) — 판 불변
     ④ 한 상자 남은 쪽 줄이기 무시 — 판 불변
     ⑤ 수첩 세 줄이 선 뒤 판 움직이기 무시 — 판 불변
     ⑥ 세 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑦ 판을 읽기 전 경쟁 3택 무시 · 고른 뒤 다시 무시 · 알맞지 않은 도움 무시
     ⑧ 도움을 고르기 전 마무리 무시(순서)
     ⑨ 알맞지 않은 마무리 무시
     ⑩ 안내 표시 중 재클릭 무시(`tgBusy`).
   수첩 줄은 기록에서만 — 판을 되돌려도 줄지 않음(|= 단 하나).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.tg-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판은 사과의 양과 가격을 어림해 나타낸 도식이다** — 실제 시장의 가격은 여러 까닭으로 정해지며, 판은 사려는 양과 내놓은 양 두 가지만 견준다(캡션 상시).
  ㉡ **판에는 금액을 적지 않는다** — 가격은 「지난주보다 싸요 · 같아요 · 비싸요」와 깃발 자리로만.
  ㉢ **수요 · 공급이라는 말은 쓰지 않는다** — 지도서 「수요와 공급의 개념을 사용하는 것보다 학생들의 다양한 경험을 떠올려」 원문.
  ㉣ **시장에서 경제활동을 한 경험 쓰기 · 친구와 이야기하기는 교실 몫**이다(완료 카드 명시).

.tg-word{text-align:center;font-weight:800;font-size:clamp(11px,1.86vw,13.4px);border-radius:7px;padding:3px 6px}
.tg-word.up{background:#FEE2E2;color:#B91C1C} .tg-word.down{background:#DBEAFE;color:#1D4ED8} .tg-word.same{background:#F1F5F9;color:#334155}
.tg-note{display:flex;flex-direction:column;gap:4px}
.tg-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-radius:7px;padding:4px 8px;font-weight:800;
  font-size:clamp(9.4px,1.58vw,11.4px);border:2px dashed #CBD5E0;background:#F8FAFC;color:#94A3B8}
.tg-line.set{border-style:solid;border-color:#059669;background:#ECFDF5;color:#065F46}
.tg-read,.tg-comp,.tg-fin{display:flex;flex-direction:column;gap:5px}
.tg-read button,.tg-comp button,.tg-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.tg-read button:hover,.tg-comp button:hover,.tg-fin button:hover{background:var(--bub)}
.tg-read button.no,.tg-comp button.no,.tg-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.tg-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .tg-box{height:20px;font-size:11px} .tg-cell{height:18px;font-size:10px} .tg-btns button{padding:4px 2px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ★ 가격 깃발 — 두 쪽의 양을 견주는 한 줄(가격을 적는 자리 0) */
function tgFlag(st){ return st.tgQty[0] - st.tgQty[1]; }
function tgWord(st){ const f=tgFlag(st); return f>0 ? '지난주보다 비싸요' : f<0 ? '지난주보다 싸요' : '지난주와 같아요'; }
/* ★ 이 판이 수첩의 어느 줄인지 — 한 줄 */
function tgBit(st){ const f=tgFlag(st); return f<0 ? 1 : f>0 ? 2 : (st.tgQty[0]!==TG_BASE ? 4 : 0); }
function tgHas(st,b){ return (st.tgSeen & b)!==0; }
function tgAll(st){ return st.tgSeen===TG_ALL; }
/* ★ 단추 — TG_ACT 를 읽는 자리 단 하나 */
function tgActOf(a){ return TG_ACT[a]; }

function tgBoxes(st,s){
  let b=''; for(let i=0;i<TG_MAX;i++){ const on=i<st.tgQty[s]; b += `<div class="tg-box${on?' on':''}" data-on="${on?1:0}">${on?'\uD83C\uDF4E':''}</div>`; }
  return b;
}
function tgSides(st){
  return `<div class="tg-sides">${TG_SIDE.map((S,s)=>`<div class="tg-side s${s}" data-side="${s}" data-n="${st.tgQty[s]}">
      <div class="tg-sn">${S.n}</div><div class="tg-st">${S.t} \u00b7 ${st.tgQty[s]}상자</div>
      <div class="tg-boxes">${tgBoxes(st,s)}</div>
      <div class="tg-btns">${[0,1,2,3].filter(a=>TG_ACT[a].s===s).map(a=>`<button data-a="${a}" onclick="tgAct(${a})">${TG_ACT[a].d>0?'\uFF0B':'\uFF0D'} ${TG_ACT[a].t}</button>`).join('')}</div>
    </div>`).join('')}</div>`;
}
function tgTrack(st){
  const f=tgFlag(st), w=tgWord(st); let c='';
  for(let i=0;i<2*TG_MID-1;i++){ const here = i===TG_MID-1+f; c += `<div class="tg-cell${i===TG_MID-1?' mid':''}${here?' here':''}" data-i="${i}">${here?'\uD83D\uDEA9':''}</div>`; }
  return `<div class="tg-price" data-flag="${f}"><div class="tg-pt">\uD83C\uDF4E 사과 가격</div><div class="tg-track">${c}</div>
    <div class="tg-ends"><span>\u2190 싸요</span><span>가운데 = 지난주</span><span>비싸요 \u2192</span></div>
    <div class="tg-word ${f>0?'up':f<0?'down':'same'}">${w}</div></div>`;
}
function tgNote(st){
  return TG_NOTE.map((t,i)=>{ const b=1<<i, on=tgHas(st,b);
    return `<div class="tg-line${on?' set':''}" data-line="${i}">${on?'\u2714 '+t+'을 봤어요':t+' \u2014 아직 못 봤어요'}</div>`; }).join('');
}

function tgBoard(st){
  const fin = st.tgFin!=null, all = tgAll(st);
  const head = fin ? '시장경제가 무엇인지 알아봤어요'
    : st.tgComp!=null ? '자유로운 경쟁의 도움까지 골랐어요 \u2014 이제 정리해요'
    : st.tgRead!=null ? '자유로운 경쟁이 주는 도움을 골라 봐요'
    : all ? '수첩의 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : '두 쪽을 움직여 가격 깃발을 살펴봐요';
  return `<div class="tg-board" data-q="${st.tgQty.join(',')}" data-flag="${tgFlag(st)}" data-seen="${st.tgSeen}" data-all="${all?1:0}" data-read="${st.tgRead==null?-1:st.tgRead}" data-comp="${st.tgComp==null?-1:st.tgComp}" data-fin="${fin?1:0}">
    <div class="tg-head">${head}</div>
    ${tgSides(st)}
    ${tgTrack(st)}
    <div class="tg-note">${tgNote(st)}</div>
  </div>`;
}

function tgPanel(st){
  const fin = st.tgFin!=null, all = tgAll(st);

  let right = `<div class="tg-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDF4E 두 쪽이 함께 당기는 사과 가격 줄다리기 판</div>

      <span style="color:#64748B">판은 사과의 양과 가격을 어림한 <b>도식</b>이에요. 실제 시장의 가격은 여러 까닭으로 정해지고, 판에는 금액을 적지 않았어요.
      <b>시장에서 경제활동을 한 경험 쓰기</b>와 <b>자유로운 경쟁이 주는 도움을 친구들과 이야기하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.tgComp!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="tg-fin">${TG_FIN.map((t,k)=>`<button class="${st.tgWrongF===k?'no':''}" onclick="tgFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.tgRead!=null){
    right += `<div class="dw-step">\uD83C\uDFC3 자유로운 경쟁이 주는 도움</div>`;
    right += `<div class="tg-comp">${TG_COMP.map((t,k)=>`<button class="${st.tgWrongC===k?'no':''}" onclick="tgCompPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="tg-hint">시장에서는 일자리를 얻으려고, 원하는 물건을 사려고 다른 사람들과 경쟁해요. 기업은 더 많은 물건을 팔려고 다른 기업과 경쟁해요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="tg-read">${TG_READ.map((t,k)=>`<button class="${st.tgWrongR===k?'no':''}" onclick="tgReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83C\uDF4E 사과 가격 줄다리기</div>`;
    right += `<div class="tg-hint">두 쪽의 단추를 눌러 사과를 <b>한 상자씩</b> 늘리거나 줄여 봐요. 가운데 깃발이 가격이에요. 수첩의 <b>세 줄</b>이 모두 서면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.tgMsg) right += `<div class="dw-msg${st.tgWarn?' warn':''}">${st.tgMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDF4E 두 쪽이 함께 당기는 사과 가격 줄다리기 판</b></div>

      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");

}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function tgRender(){ main.innerHTML = slides[state.idx].render(state); }
function tgHold(msg){
  state.tgWarn=true; state.tgBusy=true; state.tgMsg=msg;
  playThud(); tgRender();
  setTimeout(()=>{ state.tgBusy=false; state.tgWarn=false; state.tgMsg=null;
    state.tgWrongR=null; state.tgWrongC=null; state.tgWrongF=null; tgRender(); },1600);
}

/* ① 두 쪽 움직이기 — 한 상자씩 */
function tgAct(a){
  if(state.tgFin!=null) return;                                        // 가드①
  if(state.tgBusy) return;                                             // 가드⑩
  if(!Number.isInteger(a) || a<0 || a>=TG_ACT.length) return;          // 가드②
  if(tgAll(state)){ tgHold(TG_LOCK); return; }                         // 가드⑤ 판 불변
  const A = tgActOf(a), n = state.tgQty[A.s] + A.d;
  if(n>TG_MAX){ tgHold(TG_FULL); return; }                             // 가드③ 판 불변
  if(n<TG_MIN){ tgHold(TG_EMPTY); return; }                            // 가드④ 판 불변
  state.tgQty[A.s] += A.d;                                             // ★ 양이 바뀌는 자리 단 하나
  state.tgSeen |= tgBit(state);                                        // ★ 본 판 기록 — 더하기만 하는 자리 단 하나
  state.tgWarn=false;
  const dir = (A.s===0 ? A.d : -A.d) > 0 ? '비싼 쪽' : '싼 쪽';
  state.tgMsg = tgAll(state) ? TG_ALL_MSG : `「${A.t}」 \u2014 가격 깃발이 <b>${dir}</b>으로 한 칸 옮겨 갔어요. ${tgWord(state)}.`;
  if(tgAll(state)) playChime(); else playBlip();
  tgRender();
}

/* ② 판 읽기 — 수첩 세 줄 뒤에만(가드⑥). */
function tgReadPick(k){
  if(state.tgFin!=null) return;                                        // 가드①
  if(state.tgBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=TG_READ.length) return;         // 가드②
  if(!tgAll(state)){ tgHold(TG_ORDER_R); return; }                     // 가드⑥ 순서 — 판 불변
  if(state.tgRead!=null){ tgHold(TG_READ_AGAIN); return; }             // 가드⑥ 판 불변
  if(k===TG_READ_OK){
    state.tgRead=k; state.tgWrongR=null; state.tgWarn=false;
    state.tgMsg = '판을 잘 읽었어요. 가격은 한쪽의 양이 아니라 <b>두 쪽의 양을 함께 견주어</b> 정해졌어요 \u2014 그래서 두 쪽이 똑같이 늘면 가격은 그대로였어요.';
    playChime(); tgRender(); return;
  }
  state.tgWrongR=k;
  tgHold(TG_READ_NO[k]);
}

/* ③ 자유로운 경쟁이 주는 도움 — 판을 읽은 뒤에만(가드⑦). */
function tgCompPick(k){
  if(state.tgFin!=null) return;                                        // 가드①
  if(state.tgBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=TG_COMP.length) return;         // 가드②
  if(state.tgRead==null){ tgHold(TG_ORDER_C); return; }                // 가드⑦ 순서 — 판 불변
  if(state.tgComp!=null){ tgHold(TG_COMP_AGAIN); return; }             // 가드⑦ 판 불변
  if(k!==TG_COMP_OK){ state.tgWrongC=k; tgHold(TG_COMP_NO[k]); return; } // 가드⑦ 판 불변
  state.tgComp = k;                                                    // ★ 도움을 고르는 자리 단 하나
  state.tgWarn=false;
  state.tgMsg = '기업들이 자유롭게 경쟁하면 <b>더 좋은 물건</b>을 만들려고 노력해요 \u2014 우리는 더 우수한 품질의 물건을 살 수 있어요.';
  playChime(); tgRender();
}

/* ④ 마무리 — 교과서 62쪽 시장경제의 뜻 */
function tgFinish(k){
  if(state.tgFin!=null) return;                                        // 가드①
  if(state.tgBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=TG_FIN.length) return;          // 가드②
  if(state.tgComp==null){ tgHold(TG_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===TG_FIN_OK){
    state.tgFin=k; state.tgWrongF=null; state.tgMsg=null; state.tgWarn=false;
    playChime(); tgRender(); return;
  }
  state.tgWrongF=k;
  tgHold(TG_FIN_NO[k]);                                                // 가드⑨ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 2차시(l02) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

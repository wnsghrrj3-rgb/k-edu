직접조작: 가상의 두 나라(㉮·㉯)가 물자 넷을 누가 만들지 정하면, 두 나라 창고가 「없어요/아쉬워요/넉넉해요」로 바뀌는 판

  ⭐ 물자 넷 = 옷 · 쌀 · 비행기 · 천연가스(`GK_GOODS` — can[나라] = 만들 수 있나 · best = 더 잘 만드는 나라).
     비행기·천연가스는 97쪽 글을 두 나라에 옮겨 붙인 도식이다(㉮만 비행기 · ㉯만 천연가스) — 캡션 상시.
  ⭐ 물자를 누르면 만드는 쪽이 「각자 만들어요 → ㉮가 만들어 나눠요 → ㉯가 만들어 나눠요」로 돈다
     (`gkTap` · 판 바꾸는 자리 `state.gkPick =` 단 하나 · 물자마다 두 비트).
  ⭐ ★ 나라별 창고 칸은 `gkGet` 한 줄 — 만드는 나라가 못 만들면 없어요(0) · 더 잘 만드는 나라가 아니면 아쉬워요(1) · 아니면 넉넉해요(2) · 담는 상태 0.
  ⭐ ★ 수출/수입 표시는 `gkWord` 한 줄(각자거나 못 만들면 없음 · 만드는 나라 = 수출 · 다른 나라 = 수입).

     ③ 두 나라가 각각 잘 만드는 것을 만들어 서로 사고파니 두 나라 모두 넉넉해짐.

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:

     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 세 줄이 선 뒤 판 움직이기(물자·적기) 무시 — 판 불변
     ④ 세 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 핵심 질문 무시 · 고른 뒤 다시 무시 · 알맞지 않은 답 무시

     ⑨ 이미 적은 줄 다시 적기 무시 — 판 불변.

.gk-read button,.gk-mean button,.gk-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.gk-read button:hover,.gk-mean button:hover,.gk-fin button:hover{background:var(--bub)}
.gk-read button.no,.gk-mean button.no,.gk-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.gk-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .gk-grid{grid-template-columns:1.2fr 1fr 1fr;gap:3px} .gk-good,.gk-cell{font-size:8.6px;padding:3px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

   ★ 나라별 창고 칸은 gkGet 한 줄 · 수출/수입 표시는 gkWord 한 줄 · 판의 모습은 gkKind 한 줄(담는 상태 0).

function gkGood(g){ return GK_GOODS[g]; }
function gkMk(st,g){ return (st.gkPick >> (2*g)) & 3; }
function gkSet(p,g,m){ return (p & ~(3 << (2*g))) | (m << (2*g)); }
/* ★ 창고 칸 — 한 줄(만드는 나라가 못 만들면 0 없어요 · 더 잘 만드는 나라가 아니면 1 아쉬워요 · 아니면 2 넉넉해요) */
function gkGet(st,c,g){ const m = gkMk(st,g)===0 ? c : gkMk(st,g)-1; return !gkGood(g).can[m] ? 0 : gkGood(g).best===m ? 2 : 1; }
/* ★ 수출/수입 — 한 줄(각자거나 못 만들면 없음 · 만드는 나라 = 수출 · 다른 나라 = 수입) */
function gkWord(st,c,g){ return (gkMk(st,g)===0 || gkGet(st,c,g)===0) ? '' : gkMk(st,g)-1===c ? '수출' : '수입'; }
/* ★ 판의 모습(줄 종류) — 한 줄(여덟 칸 가운데 가장 낮은 칸) */
function gkKind(st){ return Math.min(...[0,1].map(c=>Math.min(...[0,1,2,3].map(g=>gkGet(st,c,g))))); }
function gkHas(st,l){ return (st.gkLog & (1<<l))!==0; }
function gkLines(st){ return [0,1,2].filter(l=>gkHas(st,l)).length; }
function gkAll(st){ return st.gkLog===GK_ALL; }

function gkRows(st){
  return [0,1,2,3].map(g=>{ const m=gkMk(st,g);
    return `<button class="gk-good" data-g="${g}" data-mk="${m}" onclick="gkTap(${g})"><span>${gkGood(g).ic} ${gkGood(g).t}</span><span class="mk">\u21BB ${GK_MAKER[m]}</span><span class="ft">${gkGood(g).ft}</span></button>`+
      [0,1].map(c=>{ const v=gkGet(st,c,g), w=gkWord(st,c,g);
        return `<div class="gk-cell lv${v}" data-c="${c}" data-g="${g}" data-lv="${v}" data-word="${w}"><span>${v===0?'\u2716':v===1?'\u25B3':'\u25CE'} ${GK_LV[v]}</span>${w?`<span class="tag${w==='수입'?' in':' out'}">${w}</span>`:''}</div>`; }).join(''); }).join('');
}
function gkNotes(st){
  return GK_LINE.map((t,l)=>{ const on=gkHas(st,l);
    return `<div class="gk-line${on?' set':''}" data-line="${l}">${on?'\u2714 '+t:'\u2610 아직 적지 않은 줄'}</div>`; }).join('');
}

function gkBoard(st){
  const fin = st.gkFin!=null, all = gkAll(st), k=gkKind(st);
  const head = fin ? '무역이 이루어지는 까닭을 알아봤어요'
    : st.gkMean!=null ? '무역이 이루어지는 까닭까지 골랐어요 \u2014 이제 정리해요'
    : st.gkRead!=null ? '무역이 이루어지는 까닭을 골라 봐요'
    : all ? '기록장 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : st.gkLog!==0 ? '물자를 눌러 만드는 쪽을 바꾸고, 달라진 판을 적어 봐요'
    : '지금 판의 모습을 기록장에 적어 봐요';
  return `<div class="gk-board" data-pick="${st.gkPick}" data-log="${st.gkLog}" data-lines="${gkLines(st)}" data-all="${all?1:0}" data-kind="${k}" data-read="${st.gkRead==null?-1:st.gkRead}" data-mean="${st.gkMean==null?-1:st.gkMean}" data-fin="${fin?1:0}">
    <div class="gk-head">${head}</div>
    <div class="gk-grid"><div class="gk-th g">물자 \u00b7 만드는 쪽</div><div class="gk-th a">${GK_LAND[0]} 창고</div><div class="gk-th b">${GK_LAND[1]} 창고</div>${gkRows(st)}</div>
    <div class="gk-say" data-say="${k}">${GK_SAY[k]}</div>
    <div class="gk-row"><button class="gk-look" data-look="1" onclick="gkWrite()">\u270D\uFE0F 기록장에 적기</button></div>
    <div class="gk-note">${gkNotes(st)}</div>
  </div>`;
}

function gkPanel(st){
  const fin = st.gkFin!=null, all = gkAll(st);
  const q = fin ? '두 나라 사이에 무역 길을 이으며 무역이 이루어지는 까닭을 알아봤어요.'
    : st.gkMean!=null ? '오늘 공부한 내용을 정리해요. 무엇을 내보내고 무엇을 들여올까요?'
    : st.gkRead!=null ? '핵심 질문 \u2014 무역이 이루어지는 까닭은 무엇일까요?'
    : all ? '기록장 세 줄이 모두 섰어요. 판에서 무엇을 알 수 있나요?'
    : st.gkLog!==0 ? '물자를 눌러 만드는 쪽을 바꿔 보며 기록장 세 줄을 모두 세워요.'
    : '가상의 두 나라가 물자 넷을 모두 각자 만들고 있어요. 두 나라 창고를 살펴봐요.';
  let right = `<div class="gk-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDEA2 무역이 이루어지는 까닭을 알아봐요</div>
      사람들은 한 나라 안에서 구하기 어려운 물자나 서비스를 이용하려고 <b>무역</b>을 해요.
      나라마다 자연환경, 자원, 자본, 기술 등에 차이가 있어서, 각 나라는 더 잘 생산할 수 있는 물자나 서비스를 <b>수출</b>하고 더 잘 생산하지 못하거나 부족한 물자나 서비스를 <b>수입</b>해 이익을 얻으려고 해요.<br>
      <span style="color:#64748B">판은 교과서 속 가상의 두 나라 이야기를 옮긴 도식이에요.
      <b>돌아가며 말하기</b>, <b>무역의 좋은 점을 친구와 이야기하기</b>, <b>우리 생활 속 무역 사례 더 찾기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.gkMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="gk-fin">${GK_FIN.map((t,k)=>`<button class="${st.gkWrongF===k?'no':''}" onclick="gkFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.gkRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 핵심 질문</div>`;
    right += `<div class="gk-mean">${GK_MEAN.map((t,k)=>`<button class="${st.gkWrongK===k?'no':''}" onclick="gkMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="gk-hint">㉮ 나라와 ㉯ 나라가 무엇이 달랐는지 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="gk-read">${GK_READ.map((t,k)=>`<button class="${st.gkWrongR===k?'no':''}" onclick="gkReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDEA2 만드는 쪽을 바꿔 창고 보기</div>`;
    right += `<div class="gk-hint"><b>물자</b>를 누를 때마다 만드는 쪽이 <b>각자 → ㉮ → ㉯</b> 차례로 바뀌어요. 창고 칸은 <b>없어요</b>(구할 수 없어요), <b>아쉬워요</b>(구할 수는 있지만 품질이 낮거나 값이 비싸요), <b>넉넉해요</b> 가운데 하나예요. <b>기록장에 적기</b>를 누르면 지금 판의 모습이 적혀요. 세 줄을 모두 세우면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.gkMsg) right += `<div class="dw-msg${st.gkWarn?' warn':''}">${st.gkMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDEA2 두 나라 사이에 무역 길을 이어요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${gkBoard(st)}<div class="cvcap">판은 교과서 속 가상의 두 나라 이야기를 옮긴 <b>도식</b>이에요. 비행기와 천연가스 칸은 교과서 속 다른 글을 두 나라에 옮겨 붙였을 뿐, 실제 나라의 모습은 아니에요. 수치는 적지 않았어요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  self:[false,false,false],
  revealed:false,
  gkPick:0, gkLog:0,
  gkRead:null, gkMean:null, gkFin:null,
  gkWrongR:null, gkWrongK:null, gkWrongF:null,
  gkMsg:null, gkWarn:false, gkBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function gkRender(){ main.innerHTML = slides[state.idx].render(state); }
function gkHold(msg){
  state.gkWarn=true; state.gkBusy=true; state.gkMsg=msg;
  playThud(); gkRender();
  setTimeout(()=>{ state.gkBusy=false; state.gkWarn=false; state.gkMsg=null;
    state.gkWrongR=null; state.gkWrongK=null; state.gkWrongF=null; gkRender(); },1600);
}
/* ★ 기록장 기록 — 더하기만 하는 자리 단 하나 */
function gkNote(l){ state.gkLog |= (1 << l); }

/* ① 물자 — 만드는 쪽을 각자 → ㉮ → ㉯ 차례로 바꿈 */
function gkTap(g){
  if(state.gkFin!=null) return;                                        // 가드①
  if(state.gkBusy) return;                                             // 가드⑧
  if(!Number.isInteger(g) || g<0 || g>=GK_N) return;                   // 가드②
  if(gkAll(state)){ gkHold(GK_LOCK); return; }                         // 가드③ 판 불변
  state.gkPick = gkSet(state.gkPick, g, (gkMk(state,g)+1)%3);          // ★ 판이 바뀌는 자리 단 하나
  state.gkWarn=false; state.gkMsg=null; playBlip(); gkRender();
}

/* ② 기록장에 적기 — 아직 적지 않은 판의 모습일 때만(가드⑨) */
function gkWrite(){
  if(state.gkFin!=null) return;                                        // 가드①
  if(state.gkBusy) return;                                             // 가드⑧
  if(gkAll(state)){ gkHold(GK_LOCK); return; }                         // 가드③ 판 불변
  const l = gkKind(state);
  if(gkHas(state,l)){ gkHold(GK_AGAIN); return; }                      // 가드⑨ 이미 선 줄 — 판 불변
  gkNote(l);
  state.gkWarn=false;
  if(gkAll(state)){ state.gkMsg = GK_ALL_MSG; playChime(); }
  else { state.gkMsg = `기록장에 적었어요 \u2014 ${GK_LINE[l]}. 물자를 눌러 만드는 쪽을 바꿔 봐요.`; playChime(); }
  gkRender();
}

/* ③ 판 읽기 — 기록장 세 줄 뒤에만(가드④). */
function gkReadPick(k){
  if(state.gkFin!=null) return;                                        // 가드①
  if(state.gkBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=GK_READ.length) return;         // 가드②
  if(!gkAll(state)){ gkHold(GK_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.gkRead!=null){ gkHold(GK_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===GK_READ_OK){
    state.gkRead=k; state.gkWrongR=null; state.gkWarn=false;
    state.gkMsg = '판을 잘 읽었어요. 두 나라가 <b>잘 만드는 것</b>을 만들어 서로 사고팔 때 여덟 칸이 모두 넉넉해졌어요.';
    playChime(); gkRender(); return;
  }
  state.gkWrongR=k;
  gkHold(GK_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function gkMeanPick(k){
  if(state.gkFin!=null) return;                                        // 가드①
  if(state.gkBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=GK_MEAN.length) return;         // 가드②
  if(state.gkRead==null){ gkHold(GK_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.gkMean!=null){ gkHold(GK_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==GK_MEAN_OK){ state.gkWrongK=k; gkHold(GK_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.gkMean = k;                                                    // ★ 핵심 질문을 고르는 자리 단 하나
  state.gkWarn=false;
  state.gkMsg = '나라마다 조건이 달라 <b>잘 만드는 것</b>이 다르기 때문에 무역이 이루어져요.';
  playChime(); gkRender();
}

/* ⑤ 마무리 — 교과서 99쪽 꼭 기억해요 2 */
function gkFinish(k){
  if(state.gkFin!=null) return;                                        // 가드①
  if(state.gkBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=GK_FIN.length) return;          // 가드②
  if(state.gkMean==null){ gkHold(GK_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===GK_FIN_OK){
    state.gkFin=k; state.gkWrongF=null; state.gkMsg=null; state.gkWarn=false;
    playChime(); gkRender(); return;
  }
  state.gkWrongF=k;
  gkHold(GK_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 11차시(l11) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

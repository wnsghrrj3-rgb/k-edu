  background:#EFF6FF;color:#1E3A8A;border:2px solid #0369A1}
.zc-note{display:flex;flex-direction:column;gap:4px}
.zc-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-radius:7px;padding:4px 8px;font-weight:800;

.zc-line.set{border-style:solid;border-color:#059669;background:#ECFDF5;color:#065F46}
.zc-read,.zc-mean,.zc-fin{display:flex;flex-direction:column;gap:5px}
.zc-read button,.zc-mean button,.zc-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.zc-read button:hover,.zc-mean button:hover,.zc-fin button:hover{background:var(--bub)}
.zc-read button.no,.zc-mean button.no,.zc-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.zc-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .zc-gate{gap:3px} .zc-ctl,.zc-slot,.zc-good{font-size:8.4px;padding:3px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){

  .ka-f{grid-template-columns:1fr 1fr}

}

function zcGoalOf(st){ return st.zcGate % 3; }
function zcWorkOf(st){ return (st.zcGate / 3) | 0; }
/* ★ 표지에 드러난 모습 수 — 한 줄 */
function zcShow(st){ return (zcGoalOf(st) > 0 ? 1 : 0) + zcWorkOf(st); }
/* ★ 판의 모습(줄 종류) — 한 줄(표 ZC_KIND) */
function zcKind(st){ return ZC_KIND[st.zcGate]; }
function zcHas(st,l){ return (st.zcLog & (1<<l))!==0; }
function zcLines(st){ return [0,1,2].filter(l=>zcHas(st,l)).length; }
function zcAll(st){ return st.zcLog===ZC_ALL; }

function zcCtls(st){
  const g=zcGoalOf(st), k=zcWorkOf(st);
  return `<button class="zc-ctl" data-a="0" data-lv="${g}" onclick="zcTap(0)"><span>\uD83C\uDFAF 기업의 목표</span><span class="dot">${[1,2].map(i=>`<i class="${g>=i?'on':''}"></i>`).join('')}</span><span class="st">${ZC_GOALTXT[g]}</span></button>`
    + `<button class="zc-ctl" data-a="1" data-lv="${k?2:0}" onclick="zcTap(1)"><span>\uD83E\uDD1D 근로자를 위한 노력</span><span class="dot"><i class="${k?'on':''}"></i></span><span class="st">${ZC_WORKTXT[k]}</span></button>`;
}
function zcCover(st){
  const g=zcGoalOf(st), k=zcWorkOf(st);
  return `<div class="zc-mast">이달의 기업<small>우리나라 대표 기업을 알아보는</small></div>`
    + `<div class="zc-slot" data-who="goal" data-lv="${g}" data-on="${g>0?1:0}">\uD83C\uDFAF ${ZC_GOAL[g]}</div>`
    + `<div class="zc-slot" data-who="work" data-on="${k}">${k?'\uD83E\uDD1D '+ZC_WORK:'\u2610 근로자를 위한 노력 칸이 비어 있어요'}</div>`
    + `<div class="zc-good">${ZC_GOOD}</div>`;
}
function zcNotes(st){
  return ZC_LINE.map((t,l)=>{ const on=zcHas(st,l);
    return `<div class="zc-line${on?' set':''}" data-line="${l}">${on?'\u2714 '+t:'\u2610 아직 적지 않은 줄'}</div>`; }).join('');
}

function zcBoard(st){
  const fin = st.zcFin!=null, all = zcAll(st), k=zcKind(st), s=zcShow(st);
  const head = fin ? '기업 운영 계획을 세우고 잡지 표지를 꾸며 봤어요'
    : st.zcMean!=null ? '표지에 담을 모습까지 골랐어요 \u2014 이제 정리해요'
    : st.zcRead!=null ? '표지에 담을 우리 기업의 모습을 골라 봐요'
    : all ? '기록장 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : st.zcLog!==0 ? '단추를 바꿔 다른 표지를 찾아 적어 봐요'
    : '단추를 눌러 표지를 바꾸고, 기록장에 적어 봐요';
  return `<div class="zc-board" data-gate="${st.zcGate}" data-goal="${zcGoalOf(st)}" data-work="${zcWorkOf(st)}" data-show="${s}" data-log="${st.zcLog}" data-lines="${zcLines(st)}" data-all="${all?1:0}" data-kind="${k}" data-read="${st.zcRead==null?-1:st.zcRead}" data-mean="${st.zcMean==null?-1:st.zcMean}" data-fin="${fin?1:0}">
    <div class="zc-head">${head}</div>
    <div class="zc-gate">${zcCtls(st)}</div>
    <div class="zc-cover">${zcCover(st)}</div>
    <div class="zc-star" data-star="${s}">${ZC_STAR[s]}</div>
    <div class="zc-say" data-say="${k}">${ZC_SAY[k]}</div>
    <div class="zc-row"><button class="zc-look" data-look="1" onclick="zcWrite()">\u270D\uFE0F 기록장에 적기</button></div>
    <div class="zc-note">${zcNotes(st)}</div>
  </div>`;
}

function zcPanel(st){
  const fin = st.zcFin!=null, all = zcAll(st);
  const q = fin ? '기업의 대표가 되어 기업 운영 계획을 세우고 이달의 기업 표지를 꾸며 봤어요.'
    : st.zcMean!=null ? '오늘 공부한 내용을 정리해요. 시장경제에서 기업은 어떤 역할을 해야 할까요?'
    : st.zcRead!=null ? '핵심 질문 \u2014 기업의 대표로서 잡지 표지에 우리 기업의 어떤 모습을 담으면 좋을까요?'
    : all ? '기록장 세 줄이 모두 섰어요. 판에서 무엇을 알 수 있나요?'
    : st.zcLog!==0 ? '단추를 바꿔 가며 기록장 세 줄을 모두 세워요.'
    : '도식 속 이달의 기업 표지에 ☆☆ 게임을 만드는 ◯◯ 기업이 실려요. 지금 표지에는 이윤만 적혀 있어요.';
  let right = `<div class="zc-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDFE2 기업의 바람직한 역할</div>
      기업은 좋은 상품을 만들어 다른 나라에 수출하며 <b>이윤</b>을 얻어요. 이윤을 얻는 것은 기업의 자연스러운 목표예요.
      그와 함께 <b>사회적 책임</b>을 다하려는 목표를 세우고, <b>근로자의 권리</b>를 보호하려고 노력하면 우리 기업의 특징이 잘 드러나요.<br>
      <span style="color:#64748B">판의 잡지와 ◯◯ 기업은 도식이고, 대표 상품과 수출국은 교과서 예시예요.
      <b>색칠 도구로 잡지 표지 완성하기</b>, <b>수출하고 싶은 나라 조사하기</b>, <b>완성한 표지를 친구들에게 소개하기</b>, <b>컴퓨터 편집 프로그램으로 표지 만들기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.zcMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="zc-fin">${ZC_FIN.map((t,k)=>`<button class="${st.zcWrongF===k?'no':''}" onclick="zcFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.zcRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 핵심 질문</div>`;
    right += `<div class="zc-mean">${ZC_MEAN.map((t,k)=>`<button class="${st.zcWrongK===k?'no':''}" onclick="zcMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="zc-hint">기록장 셋째 줄을 적을 때의 표지를 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="zc-read">${ZC_READ.map((t,k)=>`<button class="${st.zcWrongR===k?'no':''}" onclick="zcReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDCF0 표지를 바꾸며 보기</div>`;
    right += `<div class="zc-hint"><b>기업의 목표</b> 단추를 누를 때마다 이윤만 \u2192 지속가능한 성장 \u2192 환경을 지키며 성장 \u2192 다시 이윤만으로 바뀌어요. <b>근로자를 위한 노력</b> 단추는 표지에 근로자를 위한 노력을 적거나 지워요. 별은 표지에 우리 기업의 특징이 얼마나 드러났는지 보여 줘요. <b>기록장에 적기</b>를 누르면 지금 표지의 모습이 적혀요. 세 줄을 모두 세우면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.zcMsg) right += `<div class="dw-msg${st.zcWarn?' warn':''}">${st.zcMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCF0 이달의 기업 표지를 꾸며요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${zcBoard(st)}<div class="cvcap">판의 잡지와 ◯◯ 기업은 <b>도식</b>이에요. 실제 기업이 아니고, 대표 상품과 수출국은 교과서 예시예요. 별은 표지에 드러난 모습을 센 것일 뿐 기업의 점수가 아니에요. 수치는 적지 않았어요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u2_l13";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  zcGate:0, zcLog:0,
  zcRead:null, zcMean:null, zcFin:null,
  zcWrongR:null, zcWrongK:null, zcWrongF:null,
  zcMsg:null, zcWarn:false, zcBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function zcRender(){ main.innerHTML = slides[state.idx].render(state); }
function zcHold(msg){
  state.zcWarn=true; state.zcBusy=true; state.zcMsg=msg;
  playThud(); zcRender();
  setTimeout(()=>{ state.zcBusy=false; state.zcWarn=false; state.zcMsg=null;
    state.zcWrongR=null; state.zcWrongK=null; state.zcWrongF=null; zcRender(); },1600);
}
/* ★ 기록장 기록 — 더하기만 하는 자리 단 하나 */
function zcNote(l){ state.zcLog |= (1 << l); }

/* ① 표지 단추 — 0 기업의 목표(이윤만 → 지속가능한 성장 → 환경을 지키며 성장 → 이윤만) · 1 근로자를 위한 노력(켬·끔) */
function zcTap(a){
  if(state.zcFin!=null) return;                                        // 가드①
  if(state.zcBusy) return;                                             // 가드⑧
  if(!Number.isInteger(a) || a<0 || a>=ZC_N) return;                   // 가드②
  if(zcAll(state)){ zcHold(ZC_LOCK); return; }                         // 가드③ 판 불변
  const g=zcGoalOf(state), k=zcWorkOf(state);
  state.zcGate = a===0 ? (g+1)%3 + 3*k : g + 3*(1-k);                  // ★ 판이 바뀌는 자리 단 하나
  state.zcWarn=false; state.zcMsg=null; playBlip(); zcRender();
}

/* ② 기록장에 적기 — 기업의 특징이 드러나고(가드⑩) 아직 적지 않았을 때만(가드⑨) */
function zcWrite(){
  if(state.zcFin!=null) return;                                        // 가드①
  if(state.zcBusy) return;                                             // 가드⑧
  if(zcAll(state)){ zcHold(ZC_LOCK); return; }                         // 가드③ 판 불변
  const l = zcKind(state);
  if(l===3){ zcHold(ZC_BLANK); return; }                               // 가드⑩ 특징이 드러나지 않음 — 판 불변
  if(zcHas(state,l)){ zcHold(ZC_AGAIN); return; }                      // 가드⑨ 이미 선 줄 — 판 불변
  zcNote(l);
  state.zcWarn=false;
  if(zcAll(state)){ state.zcMsg = ZC_ALL_MSG; playChime(); }
  else { state.zcMsg = `기록장에 적었어요 \u2014 ${ZC_LINE[l]}. 단추를 바꿔 다른 표지를 찾아봐요.`; playChime(); }
  zcRender();
}

/* ③ 판 읽기 — 세 줄 뒤에만(가드④) */
function zcReadPick(k){
  if(state.zcFin!=null) return;                                        // 가드①
  if(state.zcBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=ZC_READ.length) return;         // 가드②
  if(!zcAll(state)){ zcHold(ZC_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.zcRead!=null){ zcHold(ZC_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===ZC_READ_OK){
    state.zcRead=k; state.zcWrongR=null; state.zcWarn=false;
    state.zcMsg = '판을 잘 읽었어요. <b>사회적 책임 목표</b>와 <b>근로자를 위한 노력</b>을 함께 적으니 별이 가장 많이 떴어요.';
    playChime(); zcRender(); return;
  }
  state.zcWrongR=k;
  zcHold(ZC_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function zcMeanPick(k){
  if(state.zcFin!=null) return;                                        // 가드①
  if(state.zcBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=ZC_MEAN.length) return;         // 가드②
  if(state.zcRead==null){ zcHold(ZC_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.zcMean!=null){ zcHold(ZC_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==ZC_MEAN_OK){ state.zcWrongK=k; zcHold(ZC_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.zcMean = k;                                                    // ★ 핵심 질문을 고르는 자리 단 하나
  state.zcWarn=false;
  state.zcMsg = '대표 상품과 주요 수출국, <b>사회적 책임 목표</b>, <b>근로자를 위한 노력</b>을 담으면 우리 기업의 특징이 잘 드러나요.';
  playChime(); zcRender();
}

/* ⑤ 마무리 — 지도서 19차시 핵심 역량 */
function zcFinish(k){
  if(state.zcFin!=null) return;                                        // 가드①
  if(state.zcBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=ZC_FIN.length) return;          // 가드②
  if(state.zcMean==null){ zcHold(ZC_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===ZC_FIN_OK){
    state.zcFin=k; state.zcWrongF=null; state.zcMsg=null; state.zcWarn=false;
    playChime(); zcRender(); return;
  }
  state.zcWrongF=k;
  zcHold(ZC_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 14차시(l14) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

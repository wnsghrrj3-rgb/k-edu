직접조작: 네 곳을 살펴 경고등을 켜는 성장 도시 계기판
  ⭐ 씨앗은 지도서 10차시 전개 「빠른 경제성장 과정에서 발생한 환경 문제, 빈부 격차 문제, 과소비와 자원 낭비 문제,
     저임금과 노사 갈등 문제 살펴보기」와 교과서 85~87쪽 미디어 활동(뉴스·신문 기사 제목).
  ⭐ 성장 도시의 네 곳(쓰레기 처리장 · 한 동네의 두 집 · 옷 가게와 식당 · 공장 협의실)에는 **좋아진 모습이 늘 보인다**.
     돋보기를 한 곳에 대고(`jgAt` · 옮기는 자리 한 줄) 「무엇이 늘었나요」 → 「그래서 어떤 일이」 순서로 읽는다.
  ⭐ 읽은 기록은 `state.jgSeen |=` 단 하나(`jgNote` · 읽기 처리기에서만 · 줄지 않음).
  ⭐ ★ 경고등은 **켜짐 상태 없이** `jgLamp(st,i)` 한 줄이 두 읽기 비트를 보고 정한다(경고등 상태 0 · 수첩 네 줄도 같은 한 줄).
  ⭐ ★★ 경고등이 켜져도 그 곳의 좋아진 모습은 사라지지 않는다 — 같은 성장 속에 좋아진 모습과 문제가 함께 있다.
  ⭐ 판 읽기는 네 경고등이 다 켜진 뒤에만(정답 자리 2) → 핵심 질문 「문제가 계속되면 어떻게 될까요?」 3택(정답 자리 0) →
     마무리 3택 = 긍정적인 영향과 함께 네 가지 문제도 나타났어요(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 경고등 넷이 켜진 뒤 판 움직이기(돋보기·읽기) 무시 — 판 불변
     ④ 네 경고등 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 핵심 질문 무시 · 고른 뒤 다시 무시 · 알맞지 않은 답 무시
     ⑥ 핵심 질문 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`jgBusy`)
     ⑨ 돋보기 없이 읽기 · 「무엇이 늘었나요」 전 「그래서」 읽기 · 이미 읽은 것 다시 읽기 무시 — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.jg-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **도시와 그림은 교과서 사진·기사를 나타낸 도식** — 실제 사진이 아니다(캡션 상시).
  ㉡ **네 곳은 교과서의 예시** — 경제성장으로 생긴 문제가 네 가지뿐이라는 뜻이 아니다(캡션 상시).

.end3 .a3{background:#F1F5F9;color:var(--muted)}

/* 읽기 비트 — 곳 i 의 읽기 k */
function jgBit(i,k){ return 1 << (2*i + k); }
function jgHas(st,i,k){ return (st.jgSeen & jgBit(i,k))!==0; }
/* ★ 경고등 — 한 줄(켜짐 상태 0) */
function jgLamp(st,i){ return (st.jgSeen >> (2*i) & 3) === 3; }
function jgLit(st){ return [0,1,2,3].filter(i=>jgLamp(st,i)).length; }
function jgAll(st){ return st.jgSeen===JG_ALL; }
function jgSpotOf(i){ return JG_SPOT[i]; }

function jgLamps(st){
  return `<div class="jg-lamps">${JG_SPOT.map((s,i)=>{ const on=jgLamp(st,i);
    return `<div class="jg-lamp${on?' on':''}" data-lamp="${i}" data-on="${on?1:0}"><span class="bulb">${on?'\uD83D\uDFE0':'\u26AB'}</span>${on?s.lamp:'?'}</div>`; }).join('')}</div>`;
}
function jgSpots(st){
  return `<div class="jg-spots">${JG_SPOT.map((s,i)=>{ const at=st.jgAt===i, on=jgLamp(st,i);
    return `<button class="jg-spot${at?' at':''}${on?' warn':''}" data-spot="${i}" data-at="${at?1:0}" onclick="jgGo(${i})"><span class="ic">${s.i}</span>${s.t}<span class="gd">\uD83D\uDE0A ${s.good}</span></button>`; }).join('')}</div>`;
}
function jgLens(st){
  if(st.jgAt<0) return `<div class="jg-lens" data-at="-1">\uD83D\uDD0D 살펴볼 곳을 골라 돋보기를 대 봐요.</div>`;
  const s=jgSpotOf(st.jgAt);
  const found=[0,1].filter(k=>jgHas(st,st.jgAt,k)).map(k=>`<div class="jg-found" data-k="${k}">${JG_LOOK[k]} \u2014 ${k===0?s.more:s.then}</div>`).join('');
  return `<div class="jg-lens" data-at="${st.jgAt}"><div>\uD83D\uDD0D <b>${s.t}</b>에 돋보기를 댔어요.</div>
    <div class="jg-looks">${[0,1].map(k=>`<button class="${jgHas(st,st.jgAt,k)?'seen':''}" data-look="${k}" onclick="jgRead(${k})">${JG_LOOK[k]}</button>`).join('')}</div>${found}</div>`;
}
function jgNotes(st){
  return JG_SPOT.map((s,i)=>{ const on=jgLamp(st,i);
    return `<div class="jg-line${on?' set':''}" data-line="${i}">${on?'\u2714 '+s.t+' \u2014 '+s.lamp+'를 찾았어요':s.t+' \u2014 아직 다 살펴보지 않았어요'}</div>`; }).join('');
}

function jgBoard(st){
  const fin = st.jgFin!=null, all = jgAll(st);
  const head = fin ? '빠른 경제성장으로 발생한 문제를 알아봤어요'
    : st.jgKey!=null ? '문제가 계속되면 어떻게 될지까지 골랐어요 \u2014 이제 정리해요'
    : st.jgRead!=null ? '문제가 계속되면 어떻게 될지 골라 봐요'
    : all ? '경고등 넷이 모두 켜졌어요 \u2014 판을 읽어 봐요'
    : st.jgAt>=0 ? '돋보기를 댄 곳을 차례대로 읽어 봐요'
    : '살펴볼 곳을 하나 골라 봐요';
  return `<div class="jg-board" data-at="${st.jgAt}" data-seen="${st.jgSeen}" data-lit="${jgLit(st)}" data-all="${all?1:0}" data-read="${st.jgRead==null?-1:st.jgRead}" data-key="${st.jgKey==null?-1:st.jgKey}" data-fin="${fin?1:0}">
    <div class="jg-head">${head}</div>
    ${jgLamps(st)}
    ${jgSpots(st)}
    ${jgLens(st)}
    <div class="jg-note">${jgNotes(st)}</div>
  </div>`;
}

function jgPanel(st){
  const fin = st.jgFin!=null, all = jgAll(st);
  const q = fin ? '성장 도시의 네 곳을 살펴 경고등을 켜며 빠른 경제성장으로 발생한 문제를 알아봤어요.'
    : st.jgKey!=null ? '오늘 공부한 내용을 정리해요. 빠른 경제성장은 우리 생활에 어떤 영향을 미쳤나요?'
    : st.jgRead!=null ? '핵심 질문 \u2014 경고등이 켜진 문제가 계속되면 어떻게 될까요?'
    : all ? '경고등이 모두 켜졌어요. 판에서 무엇을 알 수 있나요?'
    : st.jgSeen!==0 ? '경고등 넷을 모두 켜 봐요. 아직 살펴보지 않은 곳은 어디인가요?'
    : '경제가 빠르게 성장한 도시예요. 좋아진 모습 뒤에는 어떤 문제가 있을까요? 네 곳을 살펴봐요.';
  let right = `<div class="jg-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDEA8 빠른 경제성장으로 발생한 문제</div>
      우리나라 경제는 빠르게 성장했어요. 그에 따라 긍정적인 영향도 있었지만 <b>환경 문제</b>, <b>빈부 격차 문제</b>,

      <span style="color:#64748B">도시와 그림은 교과서 사진과 기사를 나타낸 <b>도식</b>이에요. 네 곳은 교과서의 예시일 뿐이에요.
      <b>동영상 보기</b>, <b>기사 밑줄 긋기</b>, <b>돌아가며 말하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.jgKey!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="jg-fin">${JG_FIN.map((t,k)=>`<button class="${st.jgWrongF===k?'no':''}" onclick="jgFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.jgRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 핵심 질문</div>`;
    right += `<div class="jg-key">${JG_KEY.map((t,k)=>`<button class="${st.jgWrongK===k?'no':''}" onclick="jgKeyPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="jg-hint">네 곳의 「그래서 어떤 일이」를 함께 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="jg-read">${JG_READ.map((t,k)=>`<button class="${st.jgWrongR===k?'no':''}" onclick="jgReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDD0D 네 곳을 살펴 경고등 켜기</div>`;
    right += `<div class="jg-hint"><b>살펴볼 곳</b>을 누르면 돋보기가 옮겨 가요. <b>무엇이 늘었나요</b>를 먼저, <b>그래서 어떤 일이</b>를 다음에 읽으면 그곳의 <b>경고등</b>이 켜져요. 경고등 <b>넷</b>이 모두 켜지면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.jgMsg) right += `<div class="dw-msg${st.jgWarn?' warn':''}">${st.jgMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDEA8 네 곳을 살펴 경고등을 켜요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${jgBoard(st)}<div class="cvcap">판은 빠른 경제성장과 우리 생활의 관계를 어림한 <b>도식</b>이에요. 네 곳은 교과서의 예시일 뿐, 경제성장으로 생긴 문제가 네 가지뿐이라는 뜻은 아니에요. 수치는 적지 않았어요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function jgRender(){ main.innerHTML = slides[state.idx].render(state); }
function jgHold(msg){
  state.jgWarn=true; state.jgBusy=true; state.jgMsg=msg;
  playThud(); jgRender();
  setTimeout(()=>{ state.jgBusy=false; state.jgWarn=false; state.jgMsg=null;
    state.jgWrongR=null; state.jgWrongK=null; state.jgWrongF=null; jgRender(); },1600);
}
/* ★ 읽은 기록 — 더하기만 하는 자리 단 하나 */
function jgNote(k){ state.jgSeen |= jgBit(state.jgAt,k); }

/* ① 돋보기 — 살펴볼 곳 옮기기 */
function jgGo(i){
  if(state.jgFin!=null) return;                                        // 가드①
  if(state.jgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=JG_N) return;                   // 가드②
  if(jgAll(state)){ jgHold(JG_LOCK); return; }                         // 가드③ 판 불변
  state.jgAt = i;                                                      // ★ 돋보기가 옮겨 가는 자리 단 하나
  state.jgWarn=false; state.jgMsg=null; playBlip(); jgRender();
}

/* ② 읽기 — 0 무엇이 늘었나요 · 1 그래서 어떤 일이 */
function jgRead(k){
  if(state.jgFin!=null) return;                                        // 가드①
  if(state.jgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JG_LOOK.length) return;         // 가드②
  if(jgAll(state)){ jgHold(JG_LOCK); return; }                         // 가드③ 판 불변
  if(state.jgAt<0){ jgHold(JG_NOSPOT); return; }                       // 가드⑨ 돋보기 없음 — 판 불변
  if(jgHas(state,state.jgAt,k)){ jgHold(JG_AGAIN); return; }           // 가드⑨ 이미 읽음 — 판 불변
  if(k===1 && !jgHas(state,state.jgAt,0)){ jgHold(JG_ORDER_T); return; } // 가드⑨ 순서 — 판 불변
  jgNote(k);
  state.jgWarn=false;
  const s = jgSpotOf(state.jgAt);
  if(jgAll(state)){ state.jgMsg = JG_ALL_MSG; playChime(); }
  else if(jgLamp(state,state.jgAt)){ state.jgMsg = `「${s.t}」의 경고등이 켜졌어요 \u2014 ${s.lamp}.`; playChime(); }
  else { state.jgMsg = `「${s.t}」 \u2014 무엇이 늘었는지 읽었어요. 이제 그래서 어떤 일이 생겼는지 읽어 봐요.`; playBlip(); }
  jgRender();
}

/* ③ 판 읽기 — 경고등 넷 뒤에만(가드④). */
function jgReadPick(k){
  if(state.jgFin!=null) return;                                        // 가드①
  if(state.jgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JG_READ.length) return;         // 가드②
  if(!jgAll(state)){ jgHold(JG_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.jgRead!=null){ jgHold(JG_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===JG_READ_OK){
    state.jgRead=k; state.jgWrongR=null; state.jgWarn=false;
    state.jgMsg = '판을 잘 읽었어요. 같은 성장 속에서 <b>좋아진 모습</b>과 <b>여러 가지 문제</b>가 함께 나타났어요.';
    playChime(); jgRender(); return;
  }
  state.jgWrongR=k;
  jgHold(JG_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function jgKeyPick(k){
  if(state.jgFin!=null) return;                                        // 가드①
  if(state.jgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JG_KEY.length) return;          // 가드②
  if(state.jgRead==null){ jgHold(JG_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.jgKey!=null){ jgHold(JG_KEY_AGAIN); return; }               // 가드⑤ 판 불변
  if(k!==JG_KEY_OK){ state.jgWrongK=k; jgHold(JG_KEY_NO[k]); return; } // 가드⑤ 판 불변
  state.jgKey = k;                                                     // ★ 핵심 질문을 고르는 자리 단 하나
  state.jgWarn=false;
  state.jgMsg = '문제가 계속되면 <b>경제가 계속 성장하기 어려워질</b> 수 있어요.';
  playChime(); jgRender();
}

/* ⑤ 마무리 — 지도서 10차시 학습 내용 정리 */
function jgFinish(k){
  if(state.jgFin!=null) return;                                        // 가드①
  if(state.jgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JG_FIN.length) return;          // 가드②
  if(state.jgKey==null){ jgHold(JG_ORDER_F); return; }                 // 가드⑥ 순서 — 판 불변
  if(k===JG_FIN_OK){
    state.jgFin=k; state.jgWrongF=null; state.jgMsg=null; state.jgWarn=false;
    playChime(); jgRender(); return;
  }
  state.jgWrongF=k;
  jgHold(JG_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 8차시(l08) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

  ⭐ 씨앗은 교과서 116~117쪽 놀이 규칙 — 모둠이 카드 한 장을 뽑아 그 내용에 관한 서로 다른 문장 넷(사실 셋 · 거짓 하나)을 쓰고,

  ⭐ ★ 가리킨 문장이 스파이 문장인지는 `fzKind` 한 줄(표 `FZ_SPY` = [2,0,3,1]) — 스파이면 카드 번호 · 아니면 4(사실인 문장 · 적을 수 없음).
  ⭐ ★★ 스파이 카드 기록은 `state.fzLog |=` 단 하나(`fzNote` · 적기 처리기에서만 · 줄지 않음) — 네 칸 최소 걸음(BFS).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:

     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 네 칸이 찬 뒤 판 움직이기(카드·친구·적기) 무시 — 판 불변
     ④ 네 칸 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시

     ⑦ 알맞지 않은 마무리 무시

     ⑨ 이미 찾은 카드의 스파이 다시 적기 무시 — 판 불변
     ⑩ 사실인 문장을 스파이로 적기 무시 — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.fz-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳

.fz-read button:hover,.fz-mean button:hover,.fz-fin button:hover{background:var(--bub)}
.fz-read button.no,.fz-mean button.no,.fz-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.fz-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .fz-gate{gap:3px} .fz-ctl,.fz-sent,.fz-line{font-size:8.4px;padding:3px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<body>
<div class="ka">
  <div class="ka-h">

    <button class="ka-nav ka-nav-next" id="next" onclick="next()">다음 →</button>
  </div>
</div>
<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====

  // 4 살펴보기 — 생각 그물: 세계 속의 무역(도식)

    <rect x="112" y="66" width="96" height="36" rx="18" fill="#BFDBFE" stroke="#1E40AF" stroke-width="1.6"/>
    <text x="160" y="88" font-size="8" fill="#1E3A8A" text-anchor="middle" font-weight="900">세계 속의 무역</text>
    ${[['무역의 뜻',20,22],['무역이 이루어지는 까닭',200,22],['다양한 모습',20,124],['상호 의존과 경쟁',200,124]].map(t=>`<rect x="${t[1]}" y="${t[2]}" width="100" height="26" rx="8" fill="#fff" stroke="#1E40AF" stroke-width="1.3"/>
      <text x="${t[1]+50}" y="${t[2]+17}" font-size="6.8" fill="#1E3A8A" text-anchor="middle" font-weight="800">${t[0]}</text>`).join('')}
    <path d="M120 48 L140 66 M200 48 L180 66 M120 124 L140 102 M200 124 L180 102" stroke="#1E40AF" stroke-width="1.4"/></svg>`,

    ${['㉮','㉯','㉰','㉱'].map((t,i)=>`<rect x="${106+i*52}" y="46" width="44" height="64" rx="6" fill="#fff" stroke="${i===2?'#DC2626':'#7C3AED'}" stroke-width="1.5"/>

  sum:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#1E293B"/>

function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

/* ===== 직접조작 — 스파이를 찾아라 판 =====

   ★ 가리킨 문장이 스파이 문장인지는 fzKind 한 줄(표 FZ_SPY · 담는 상태 0).
   ★★ 스파이 카드 기록은 |= 만(fzLog · fzNote 단 하나 · 적기 처리기에서만).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 카드와 문장은 도식이다. 판은 스파이 자리를 화면에 드러내지 않는다. */
const FZ_N = 2;
const FZ_ALL = 15;
const FZ_WHO = ['㉮','㉯','㉰','㉱'];
/* 카드 넷 — 교과서 114~115쪽 생각 그물 · 117쪽 예시 카드 */
const FZ_CARD = ['시장경제','경제성장','무역','상호 의존과 경쟁'];
const FZ_SENT = [
  ['시장경제는 시장에서 가계와 기업이 자유롭게 경쟁하며 경제활동을 하는 방식이에요.',
   '가계는 기업의 생산 활동에 참여하고 소득을 얻어요.',
   '시장경제에서는 기업이 어떤 상품을 얼마나 생산할지 정부가 모두 정해 줘요.',
   '기업은 물건이나 서비스를 생산하고 판매하여 이윤을 얻어요.'],

   '첨단 기술이 발전하여 생산 속도가 빨라지고 생산량이 늘어났어요.',
   '사람들의 생활이 풍족해지면서 문화와 관련한 산업이 발달했어요.'],
  ['무역이란 나라 사이에 물자나 서비스를 사고파는 것이에요.',
   '나라마다 효율적으로 생산하는 물자나 서비스가 달라 무역이 필요해요.',

   '다른 나라에 물자나 서비스를 파는 것을 수입이라고 해요.'],
  ['여러 나라의 우수한 물자를 모아 새로운 제품을 생산해요.',

/* ★ 카드마다 스파이 자리(거짓인 문장) — 판에는 드러내지 않는다 */

function fzCardOf(st){ return st.fzGate % 4; }
function fzWhoOf(st){ return (st.fzGate / 4) | 0; }
/* ★ 가리킨 문장이 스파이 문장인지 — 한 줄(표 FZ_SPY) · 스파이면 카드 번호 · 아니면 4 */
function fzKind(st){ return FZ_SPY[fzCardOf(st)] === fzWhoOf(st) ? fzCardOf(st) : 4; }
function fzHas(st,l){ return (st.fzLog & (1<<l))!==0; }
function fzLines(st){ return [0,1,2,3].filter(l=>fzHas(st,l)).length; }
function fzAll(st){ return st.fzLog===FZ_ALL; }

function fzCtls(st){
  const c=fzCardOf(st), w=fzWhoOf(st);
  return `<button class="fz-ctl" data-a="0" data-lv="${c}" onclick="fzTap(0)"><span>\uD83C\uDCCF 카드 뽑기</span><span class="dot">${[0,1,2,3].map(i=>`<i class="${c===i?'on':''}"></i>`).join('')}</span><span class="st">${FZ_CARD[c]} 카드</span></button>`
    + `<button class="fz-ctl" data-a="1" data-lv="${w}" onclick="fzTap(1)"><span>\uD83D\uDC49 친구 가리키기</span><span class="dot">${[0,1,2,3].map(i=>`<i class="${w===i?'on':''}"></i>`).join('')}</span><span class="st">${FZ_WHO[w]} 친구</span></button>`;
}
function fzCardView(st){
  const c=fzCardOf(st), w=fzWhoOf(st);
  return `<div class="fz-title" data-card="${c}">\uD83C\uDCCF ${FZ_CARD[c]} 카드<small>모둠 친구 넷이 서로 다른 문장을 보여 줘요</small></div>`
    + FZ_SENT[c].map((t,i)=>`<div class="fz-sent" data-who="${i}" data-pt="${w===i?1:0}"><span class="who">${FZ_WHO[i]}</span><span>${t}</span></div>`).join('');
}
function fzNotes(st){
  return FZ_CARD.map((t,l)=>{ const on=fzHas(st,l);
    return `<div class="fz-line${on?' set':''}" data-line="${l}">${on?'\u2714 '+t+' 카드 \u2014 스파이 '+FZ_WHO[FZ_SPY[l]]+' \u00b7 바로잡은 사실: '+FZ_FIX[l]:'\u2610 '+t+' 카드 \u2014 아직 찾지 않았어요'}</div>`; }).join('');
}

function fzBoard(st){
  const fin = st.fzFin!=null, all = fzAll(st), c=fzCardOf(st), w=fzWhoOf(st);
  const head = fin ? '스파이를 찾으며 단원에서 공부한 내용을 정리했어요'
    : st.fzMean!=null ? '생각 그물 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.fzRead!=null ? '생각 그물의 빈칸을 채워 봐요'
    : all ? '스파이 카드 네 칸이 모두 찼어요 \u2014 판을 읽어 봐요'
    : st.fzLog!==0 ? '카드를 바꿔 다른 모둠의 스파이도 찾아봐요'
    : '친구를 가리키며 네 문장을 읽고, 거짓인 문장을 든 스파이를 찾아요';
  return `<div class="fz-board" data-gate="${st.fzGate}" data-card="${c}" data-who="${w}" data-log="${st.fzLog}" data-lines="${fzLines(st)}" data-all="${all?1:0}" data-read="${st.fzRead==null?-1:st.fzRead}" data-mean="${st.fzMean==null?-1:st.fzMean}" data-fin="${fin?1:0}">
    <div class="fz-head">${head}</div>
    <div class="fz-gate">${fzCtls(st)}</div>
    <div class="fz-card">${fzCardView(st)}</div>
    <div class="fz-say" data-say="${w}">지금 <b>${FZ_WHO[w]} 친구</b>의 문장을 가리키고 있어요. 이 문장은 사실일까요, 거짓일까요?</div>
    <div class="fz-row"><button class="fz-look" data-look="1" onclick="fzWrite()">\uD83D\uDD75\uFE0F 스파이로 적기</button></div>
    <div class="fz-note"><div class="nh">\uD83D\uDCCB 스파이 카드</div>${fzNotes(st)}</div>

}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u2_l14";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  fzGate:0, fzLog:0,
  fzRead:null, fzMean:null, fzFin:null,
  fzWrongR:null, fzWrongK:null, fzWrongF:null,
  fzMsg:null, fzWarn:false, fzBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function fzRender(){ main.innerHTML = slides[state.idx].render(state); }
function fzHold(msg){
  state.fzWarn=true; state.fzBusy=true; state.fzMsg=msg;
  playThud(); fzRender();
  setTimeout(()=>{ state.fzBusy=false; state.fzWarn=false; state.fzMsg=null;
    state.fzWrongR=null; state.fzWrongK=null; state.fzWrongF=null; fzRender(); },1600);
}
/* ★ 스파이 카드 기록 — 더하기만 하는 자리 단 하나 */
function fzNote(l){ state.fzLog |= (1 << l); }

/* ① 판 단추 — 0 카드 뽑기(시장경제 → 경제성장 → 무역 → 상호 의존과 경쟁 → 시장경제) · 1 친구 가리키기(㉮ → ㉯ → ㉰ → ㉱ → ㉮) */
function fzTap(a){
  if(state.fzFin!=null) return;                                        // 가드①
  if(state.fzBusy) return;                                             // 가드⑧
  if(!Number.isInteger(a) || a<0 || a>=FZ_N) return;                   // 가드②
  if(fzAll(state)){ fzHold(FZ_LOCK); return; }                         // 가드③ 판 불변
  const c=fzCardOf(state), w=fzWhoOf(state);
  state.fzGate = a===0 ? (c+1)%4 + 4*w : c + 4*((w+1)%4);              // ★ 판이 바뀌는 자리 단 하나
  state.fzWarn=false; state.fzMsg=null; playBlip(); fzRender();
}

/* ② 스파이로 적기 — 가리킨 문장이 거짓이고(가드⑩) 아직 적지 않았을 때만(가드⑨) */
function fzWrite(){
  if(state.fzFin!=null) return;                                        // 가드①
  if(state.fzBusy) return;                                             // 가드⑧
  if(fzAll(state)){ fzHold(FZ_LOCK); return; }                         // 가드③ 판 불변
  const l = fzKind(state);
  if(l===4){ fzHold(FZ_TRUE); return; }                                // 가드⑩ 사실인 문장 — 판 불변
  if(fzHas(state,l)){ fzHold(FZ_AGAIN); return; }                      // 가드⑨ 이미 찾은 카드 — 판 불변
  fzNote(l);
  state.fzWarn=false;
  if(fzAll(state)){ state.fzMsg = FZ_ALL_MSG; playChime(); }
  else { state.fzMsg = `스파이를 찾았어요 \u2014 ${FZ_CARD[l]} 카드의 ${FZ_WHO[FZ_SPY[l]]} 친구예요. 바로잡은 사실: ${FZ_FIX[l]}. 카드를 바꿔 다른 스파이도 찾아봐요.`; playChime(); }
  fzRender();
}

/* ③ 판 읽기 — 네 칸 뒤에만(가드④) */
function fzReadPick(k){
  if(state.fzFin!=null) return;                                        // 가드①
  if(state.fzBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=FZ_READ.length) return;         // 가드②
  if(!fzAll(state)){ fzHold(FZ_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.fzRead!=null){ fzHold(FZ_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===FZ_READ_OK){
    state.fzRead=k; state.fzWrongR=null; state.fzWarn=false;
    state.fzMsg = '판을 잘 읽었어요. 스파이는 카드마다 다른 자리에 있었고, <b>공부한 사실</b>과 견주어야 찾을 수 있었어요.';
    playChime(); fzRender(); return;
  }
  state.fzWrongR=k;
  fzHold(FZ_READ_NO[k]);
}

/* ④ 생각 그물 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function fzMeanPick(k){
  if(state.fzFin!=null) return;                                        // 가드①
  if(state.fzBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=FZ_MEAN.length) return;         // 가드②
  if(state.fzRead==null){ fzHold(FZ_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.fzMean!=null){ fzHold(FZ_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==FZ_MEAN_OK){ state.fzWrongK=k; fzHold(FZ_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.fzMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.fzWarn=false;
  state.fzMsg = '시장경제는 시장에서 가계와 기업이 자유롭게 <b>경쟁</b>하며 경제활동을 하는 방식이에요.';
  playChime(); fzRender();
}

/* ⑤ 마무리 — 지도서 20차시 학습 내용 정리 */
function fzFinish(k){
  if(state.fzFin!=null) return;                                        // 가드①
  if(state.fzBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=FZ_FIN.length) return;          // 가드②
  if(state.fzMean==null){ fzHold(FZ_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===FZ_FIN_OK){
    state.fzFin=k; state.fzWrongF=null; state.fzMsg=null; state.fzWarn=false;
    playChime(); fzRender(); return;
  }
  state.fzWrongF=k;
  fzHold(FZ_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 1차시(u3 l01) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

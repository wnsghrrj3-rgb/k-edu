.yb-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .yb-sea{grid-template-columns:1fr 1fr;gap:3px} .yb-box{font-size:8.6px;padding:3px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙 ㉠·㉢: 모든 그림은 내용을 나타낸 도식이며 실제 사진·지도가 아니다.
   ⚠️ 사람 형상 대신 도형으로만 그린다. 금액·양·거리·연도는 적지 않는다. */
const SVG = {
  // 1 들어가기 — 교실 물건과 생산지(도식 · 교과서 94쪽)
  open:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>
    ${[['\uD83D\uDEAA','출입문'],['\uD83D\uDCDA','책꽂이'],['\uD83E\uDE91','의자'],['\u270F\uFE0F','연필'],['\uD83D\uDCF1','태블릿'],['\uD83D\uDC55','옷']].map((t,i)=>`<rect x="${14+i*50}" y="40" width="44" height="62" rx="8" fill="#fff" stroke="#A16207" stroke-width="1.4"/>
      <text x="${36+i*50}" y="72" font-size="18" text-anchor="middle">${t[0]}</text>
      <text x="${36+i*50}" y="94" font-size="7.4" fill="#854D0E" text-anchor="middle" font-weight="800">${t[1]}</text>`).join('')}
    <text x="160" y="130" font-size="8" fill="#334155" text-anchor="middle" font-weight="800">교실 물건과 재료는 어디에서 왔을까요?(도식)</text></svg>`,
  // 2 살펴보기 — 다른 나라에서 온 물건과 음식(도식)
  life:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#F8FAFC"/>
    <circle cx="160" cy="84" r="30" fill="#FEF3C7" stroke="#A16207" stroke-width="1.6"/>
    <text x="160" y="88" font-size="8" fill="#854D0E" text-anchor="middle" font-weight="800">우리 생활</text>
    ${[[60,44,'\uD83E\uDDF9'],[260,44,'\u2712\uFE0F'],[60,126,'\uD83E\uDD6D'],[260,126,'\uD83E\uDD69']].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="18" fill="#fff" stroke="#0369A1" stroke-width="1.4"/>
      <text x="${p[0]}" y="${p[1]+6}" font-size="16" text-anchor="middle">${p[2]}</text>

    <text x="160" y="162" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="700">다른 나라에서 생산한 물건과 음식(도식)</text></svg>`,
  // 3 살펴보기 — 고려 시대 벽란도(상상 도식)
  port:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#E0F2FE"/>
    <rect x="0" y="0" width="120" height="170" fill="#FEF3C7"/>
    <rect x="96" y="70" width="40" height="12" fill="#A16207"/>
    <path d="M170 110 L260 110 L246 128 L184 128 Z" fill="#92400E"/><path d="M214 110 L214 54" stroke="#78350F" stroke-width="2.4"/>
    <path d="M216 56 L252 100 L216 100 Z" fill="#fff" stroke="#94A3B8" stroke-width="1"/>
    ${[[30,60],[62,60],[30,92],[62,92]].map(p=>`<rect x="${p[0]}" y="${p[1]}" width="24" height="20" rx="3" fill="#fff" stroke="#B45309" stroke-width="1.2"/>`).join('')}
    <text x="60" y="140" font-size="8" fill="#854D0E" text-anchor="middle" font-weight="800">고려 벽란도</text>
    <text x="215" y="146" font-size="8" fill="#075985" text-anchor="middle" font-weight="800">송·아라비아 상인의 배</text>
    <text x="160" y="22" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="800">여러 나라 상인이 드나든 항구(상상 도식)</text></svg>`,
  // 5 살펴보기 — 무역·수입·수출(도식)
  mean:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    <rect x="18" y="50" width="96" height="64" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1.6"/>
    <rect x="206" y="50" width="96" height="64" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
    <text x="66" y="87" font-size="9" fill="#854D0E" text-anchor="middle" font-weight="800">우리나라</text>
    <text x="254" y="87" font-size="9" fill="#075985" text-anchor="middle" font-weight="800">다른 나라</text>
    <path d="M118 70 L200 70" stroke="#166534" stroke-width="2.4"/><path d="M198 64 L208 70 L198 76 Z" fill="#166534"/>
    <path d="M202 96 L122 96" stroke="#1E40AF" stroke-width="2.4"/><path d="M124 90 L114 96 L124 102 Z" fill="#1E40AF"/>
    <text x="160" y="62" font-size="8" fill="#166534" text-anchor="middle" font-weight="800">팔아요 = 수출</text>
    <text x="160" y="112" font-size="8" fill="#1E40AF" text-anchor="middle" font-weight="800">사 와요 = 수입</text>
    <text x="160" y="150" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="800">나라와 나라 사이에 사고팔거나 교환해요(도식)</text></svg>`,
  // 6 살펴보기 — 무역 관련 뉴스(도식)
  news:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#F8FAFC"/>
    ${[0,1].map(i=>`<rect x="${26+i*140}" y="30" width="128" height="96" rx="8" fill="#fff" stroke="${i?'#166534':'#1E40AF'}" stroke-width="1.6"/>
      <rect x="${38+i*140}" y="42" width="104" height="10" rx="3" fill="${i?'#DCFCE7':'#DBEAFE'}"/>
      ${[0,1,2,3].map(r=>`<rect x="${38+i*140}" y="${62+r*14}" width="${104-r*12}" height="6" rx="3" fill="#E2E8F0"/>`).join('')}
      <text x="${90+i*140}" y="50" font-size="7.4" fill="${i?'#166534':'#1E40AF'}" text-anchor="middle" font-weight="800">${i?'수출 관련 뉴스':'수입 관련 뉴스'}</text>`).join('')}
    <text x="160" y="150" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="800">다양한 분야의 무역 소식(도식)</text></svg>`,
  // 7 살펴보기 — 꼭 기억해요(도식)
  keep:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>
    <path d="M60 84 L260 84" stroke="#A16207" stroke-width="3" stroke-dasharray="6 4"/>
    <path d="M70 76 L60 84 L70 92" fill="none" stroke="#A16207" stroke-width="3"/><path d="M250 76 L260 84 L250 92" fill="none" stroke="#A16207" stroke-width="3"/>
    <circle cx="40" cy="84" r="18" fill="#FEF9C3" stroke="#A16207" stroke-width="1.6"/><circle cx="280" cy="84" r="18" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
    <text x="160" y="134" font-size="8" fill="#334155" text-anchor="middle" font-weight="800">나라와 나라 사이에 물자나 서비스가 오가요(도식)</text></svg>`,
  // 16 정리
  sum:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#1E293B"/>
    ${['생산지 찾기','벽란도','무역의 뜻','뉴스 찾기'].map((t,i)=>`<rect x="${20+i*74}" y="52" width="62" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>

    <text x="160" y="128" font-size="8.6" fill="#FDE68A" text-anchor="middle" font-weight="800">무역이 무엇인지 알아봤어요</text></svg>`,

  done:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>
    <circle cx="160" cy="76" r="40" fill="#fff" stroke="#A16207" stroke-width="2.4"/>
    <path d="M142 76 L156 90 L180 62" fill="none" stroke="#A16207" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

};
function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

/* ===== 직접조작 — 벽란도 부두에서 상자를 옮기며 수입·수출을 보는 판 =====
   ★ 상자를 누르면 건너편으로 옮겨지고 그 상자를 고른다(ybTap · 옮긴 기록 |= 단 하나 · 고른 자리 = 단 하나 · 되돌리기 없음).
   ★★ 상자가 있는 쪽은 ybSide 한 줄 · 이름표(수입/수출)는 ybWord 한 줄 — 난 쪽과 보는 쪽이 같으면 수출, 다르면 수입(담는 상태 0).
   ★★ 수첩 기록은 |= 만(ybLog · ybNote 단 하나 · 적기 처리기에서만) — 줄 종류는 ybKind 한 줄.
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. */
/* 물건 상자 아홉 — 교과서 95쪽 벽란도 글(from 0 = 고려에서 사 간 물건 · 1 = 다른 나라 상인이 가져와 판 물건) */
const YB_GOODS = [
  {t:'비단', from:1}, {t:'삼베', from:0}, {t:'약재', from:1},
  {t:'모시', from:0}, {t:'서적', from:1}, {t:'인삼', from:0},
  {t:'악기', from:1}, {t:'종이', from:0}, {t:'보석', from:1}
];
/* 보는 쪽 둘 */
const YB_SIDE = ['고려 벽란도','다른 나라 상인'];
const YB_N = 9;
const YB_ALL = 7;
/* 수첩 세 줄 */
const YB_LINE = [
  '고려에서 보니 다른 나라에서 사 온 물건은 수입이에요',
  '고려에서 보니 다른 나라에 판 물건은 수출이에요',
  '다른 나라 상인 쪽에서 보니 수입과 수출이 뒤바뀌었어요'
];

/* ② 판 읽기 */
const YB_READ = [
  '물건마다 수입인지 수출인지가 처음부터 정해져 있었어요',
  '같은 물건이 오가도 어느 나라에서 보느냐에 따라 수입이 되기도 하고 수출이 되기도 했어요',
  '벽란도에서는 물건이 다른 나라에서 고려로 한쪽으로만 오갔어요'
];
const YB_READ_OK = 1;
const YB_READ_NO = [
  '수첩 셋째 줄을 다시 봐요. 보는 쪽을 바꾸자 같은 상자의 <b>이름표</b>가 바뀌었어요. 판을 다시 읽어 봐요.',
  null,
  '삼베, 모시, 인삼, 종이는 <b>어느 쪽</b>으로 옮겨졌나요? 판을 다시 읽어 봐요.'
];

/* ③ 핵심 질문 — 무역이란 무엇인가요? */
const YB_MEAN = [
  '한 나라 안에서 사람들끼리 물건을 사고파는 활동이에요',
  '다른 나라 물건을 구경만 하는 활동이에요',
  '나라와 나라 사이에 물자나 서비스를 사고팔거나 교환하는 활동이에요'
];
const YB_MEAN_OK = 2;
const YB_MEAN_NO = [
  '벽란도에는 <b>여러 나라</b>의 상인들이 드나들었어요. 판은 그대로예요.',
  '상자는 부두에 머물지 않고 <b>건너편으로 옮겨졌어요</b>. 판은 그대로예요.',
  null
];

/* ④ 마무리 — 지도서 13차시 주요 내용 정리 */
const YB_FIN = [
  '다른 나라에서 물자나 서비스를 사 오는 것은 수입이고, 다른 나라에 물자나 서비스를 파는 것은 수출이에요',
  '다른 나라에서 물자나 서비스를 사 오는 것은 수출이고, 다른 나라에 물자나 서비스를 파는 것은 수입이에요',
  '나라와 나라 사이에 물건을 사고파는 일은 오늘날에만 있고 옛날에는 없었어요'
];
const YB_FIN_OK = 0;
const YB_FIN_NO = [
  null,
  '고려에서 보았을 때 비단의 이름표를 떠올려 봐요. 오늘의 정리를 다시 골라 봐요.',
  '고려 시대 <b>벽란도</b>를 떠올려 봐요. 오늘의 정리를 다시 골라 봐요.'
];

/* 안내 */
const YB_LOCK = '수첩 <b>세 줄이 모두 섰어요</b>. 부두는 이대로 둬요. 판을 읽어 봐요. 판은 그대로예요.';
const YB_NONE = '아직 <b>고른 상자</b>가 없어요. 상자를 눌러 건너편으로 옮긴 뒤에 적어요. 판은 그대로예요.';
const YB_AGAIN = '그 줄은 <b>이미 적었어요</b>. 다른 상자를 고르거나 보는 쪽을 바꿔 봐요. 판은 그대로예요.';
const YB_ORDER_R = '아직 <b>수첩 세 줄</b>이 다 서지 않았어요. 세 줄을 모두 적은 뒤에 읽을 수 있어요. 판은 그대로예요.';
const YB_READ_AGAIN = '<b>이미 판을 읽었어요.</b> 판은 그대로예요.';
const YB_ORDER_K = '아직 <b>판을 읽지 않았어요.</b> 판을 먼저 읽어 봐요. 판은 그대로예요.';
const YB_MEAN_AGAIN = '무역이 무엇인지는 <b>이미 골랐어요</b>. 판은 그대로예요.';
const YB_ORDER_F = '아직 <b>무역이 무엇인지</b> 고르지 않았어요. 먼저 골라 봐요. 판은 그대로예요.';
const YB_ALL_MSG = '수첩 <b>세 줄이 모두 섰어요</b>. 판을 읽어 봐요.';

function ybGood(k){ return YB_GOODS[k]; }
function ybIsSent(st,k){ return (st.ybSent >> k & 1)===1; }
/* ★ 상자가 지금 있는 쪽 — 한 줄 */
function ybSide(st,k){ return ybIsSent(st,k) ? 1 - ybGood(k).from : ybGood(k).from; }
/* ★★ 이름표 — 한 줄(옮기지 않은 상자는 이름표 없음 · 난 쪽 = 보는 쪽이면 수출) */
function ybWord(st,k){ return !ybIsSent(st,k) ? '' : ybGood(k).from===st.ybView ? '수출' : '수입'; }
/* ★ 줄 종류 — 한 줄(고른 상자 없으면 -1 · 다른 나라 쪽에서 보면 2 · 고려에서 보면 수입 0 / 수출 1) */
function ybKind(st){ return (st.ybAt<0 || !ybIsSent(st,st.ybAt)) ? -1 : st.ybView===1 ? 2 : ybGood(st.ybAt).from===0 ? 1 : 0; }
function ybHas(st,l){ return (st.ybLog & (1<<l))!==0; }
function ybLines(st){ return [0,1,2].filter(l=>ybHas(st,l)).length; }
function ybAll(st){ return st.ybLog===YB_ALL; }

function ybDock(st,s){
  const ks=[0,1,2,3,4,5,6,7,8].filter(k=>ybSide(st,k)===s);
  return `<div class="yb-dock${st.ybView===s?' view':''}" data-side="${s}" data-n="${ks.length}"><div class="yb-dname">${s===0?'\u2693 고려 벽란도':'\u26F5 다른 나라 상인의 배'}</div>`+
    ks.map(k=>{ const w=ybWord(st,k);
      return `<button class="yb-box${st.ybAt===k?' at':''}" data-k="${k}" data-word="${w}" onclick="ybTap(${k})">\uD83D\uDCE6 ${ybGood(k).t}<span class="tag${w==='수입'?' in':w==='수출'?' out':''}">${w||'제자리'}</span></button>`; }).join('')+`</div>`;
}
function ybNotes(st){
  return YB_LINE.map((t,l)=>{ const on=ybHas(st,l);
    return `<div class="yb-line${on?' set':''}" data-line="${l}">${on?'\u2714 '+t:'\u2610 아직 적지 않은 줄'}</div>`; }).join('');
}

function ybBoard(st){
  const fin = st.ybFin!=null, all = ybAll(st), k=ybKind(st);
  const head = fin ? '무역이 무엇인지 알아봤어요'
    : st.ybMean!=null ? '무역이 무엇인지까지 골랐어요 \u2014 이제 정리해요'
    : st.ybRead!=null ? '무역이 무엇인지 골라 봐요'
    : all ? '수첩 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : k>=0 ? '고른 상자의 이름표를 보고 수첩에 적어 봐요'
    : '상자를 눌러 건너편으로 옮겨 봐요';
  const say = k>=0 ? `<div class="yb-say at">「${ybGood(st.ybAt).t}」 \u2014 ${YB_SIDE[st.ybView]} 쪽에서 보면 <b>${ybWord(st,st.ybAt)}</b>이에요.</div>`
    : `<div class="yb-say">상자를 누르면 건너편 부두로 옮겨져요. 한 번 판 물건은 되돌리지 않아요.</div>`;
  return `<div class="yb-board" data-sent="${st.ybSent}" data-at="${st.ybAt}" data-view="${st.ybView}" data-log="${st.ybLog}" data-lines="${ybLines(st)}" data-all="${all?1:0}" data-kind="${k}" data-read="${st.ybRead==null?-1:st.ybRead}" data-mean="${st.ybMean==null?-1:st.ybMean}" data-fin="${fin?1:0}">
    <div class="yb-head">${head}</div>
    <div class="yb-sea">${ybDock(st,0)}${ybDock(st,1)}</div>
    ${say}
    <div class="yb-row"><button class="yb-flip" data-flip="1" onclick="ybFlip()">\uD83D\uDC40 지금은 ${YB_SIDE[st.ybView]} 쪽에서 봐요 \u2014 바꿔 보기</button>
    <button class="yb-look" data-look="1" onclick="ybWrite()">\u270D\uFE0F 수첩에 적기</button></div>
    <div class="yb-note">${ybNotes(st)}</div>
  </div>`;
}

function ybPanel(st){
  const fin = st.ybFin!=null, all = ybAll(st);
  const q = fin ? '벽란도 부두에서 상자를 옮기며 무역이 무엇인지 알아봤어요.'
    : st.ybMean!=null ? '오늘 공부한 내용을 정리해요. 수입과 수출은 각각 무엇인가요?'
    : st.ybRead!=null ? '핵심 질문 \u2014 무역이란 무엇인가요?'
    : all ? '수첩 세 줄이 모두 섰어요. 판에서 무엇을 알 수 있나요?'
    : st.ybLog!==0 ? '다른 상자를 옮기거나 보는 쪽을 바꿔 보며 수첩 세 줄을 모두 세워요.'
    : '고려 시대 벽란도 부두예요. 상자를 옮기며 이름표가 어떻게 붙는지 살펴봐요.';
  let right = `<div class="yb-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\u2693 무역이 무엇인지 알아봐요</div>
      나라와 나라 사이에 물자나 서비스를 사고팔거나 교환하는 활동을 <b>무역</b>이라고 해요.
      다른 나라에서 물자나 서비스를 사 오는 것은 <b>수입</b>, 다른 나라에 물자나 서비스를 파는 것은 <b>수출</b>이에요. 같은 물건이라도 어느 나라에서 보느냐에 따라 수입이 되기도 하고 수출이 되기도 해요.<br>
      <span style="color:#64748B">판은 교과서 속 벽란도 글을 옮긴 도식이에요.
      <b>교실 물건의 생산지 찾아보기</b>, <b>글의 제목 짓기와 피라미드 토의</b>, <b>인터넷에서 무역 뉴스 찾기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.ybMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="yb-fin">${YB_FIN.map((t,k)=>`<button class="${st.ybWrongF===k?'no':''}" onclick="ybFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.ybRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 핵심 질문</div>`;
    right += `<div class="yb-mean">${YB_MEAN.map((t,k)=>`<button class="${st.ybWrongK===k?'no':''}" onclick="ybMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="yb-hint">벽란도에 드나든 상인들이 어디에서 왔는지 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="yb-read">${YB_READ.map((t,k)=>`<button class="${st.ybWrongR===k?'no':''}" onclick="ybReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDCE6 상자를 옮겨 이름표 보기</div>`;
    right += `<div class="yb-hint"><b>상자</b>를 누르면 건너편 부두로 옮겨지고 그 상자가 골라져요. 옮긴 상자에는 <b>이름표</b>가 붙어요. <b>수첩에 적기</b>를 누르면 고른 상자의 이름표가 수첩에 적혀요. <b>보는 쪽</b>도 바꿔 보며 수첩 세 줄을 모두 세우면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.ybMsg) right += `<div class="dw-msg${st.ybWarn?' warn':''}">${st.ybMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\u2693 벽란도 부두에서 상자를 배에 실어요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${ybBoard(st)}<div class="cvcap">판은 교과서 속 벽란도 글을 옮긴 <b>도식</b>이에요. 물건 아홉은 글에 나온 것뿐이고, 벽란도에서 오간 물건이 이것뿐이라는 뜻은 아니에요. 수치는 적지 않았어요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function ybRender(){ main.innerHTML = slides[state.idx].render(state); }
function ybHold(msg){
  state.ybWarn=true; state.ybBusy=true; state.ybMsg=msg;

  setTimeout(()=>{ state.ybBusy=false; state.ybWarn=false; state.ybMsg=null;
    state.ybWrongR=null; state.ybWrongK=null; state.ybWrongF=null; ybRender(); },1600);
}

function ybNote(l){ state.ybLog |= (1 << l); }

/* ① 상자 — 난 쪽에 있으면 건너편으로 옮기고, 옮긴 상자면 고르기만 */
function ybTap(k){
  if(state.ybFin!=null) return;                                        // 가드①
  if(state.ybBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YB_N) return;                   // 가드②
  if(ybAll(state)){ ybHold(YB_LOCK); return; }                         // 가드③ 판 불변
  state.ybSent |= (1 << k);                                            // ★ 옮긴 기록 — 더하기만(되돌리기 없음)
  state.ybAt = k;                                                      // ★ 고른 상자 자리 단 하나
  state.ybWarn=false; state.ybMsg=null; playBlip(); ybRender();
}

function ybFlip(){
  if(state.ybFin!=null) return;                                        // 가드①
  if(state.ybBusy) return;                                             // 가드⑧
  if(ybAll(state)){ ybHold(YB_LOCK); return; }                         // 가드③ 판 불변
  state.ybView = 1 - state.ybView;                                     // ★ 보는 쪽이 바뀌는 자리 단 하나
  state.ybWarn=false; state.ybMsg=null; playBlip(); ybRender();
}

/* ③ 수첩에 적기 — 고른 상자가 있고 아직 적지 않은 줄일 때만(가드⑨) */
function ybWrite(){
  if(state.ybFin!=null) return;                                        // 가드①
  if(state.ybBusy) return;                                             // 가드⑧
  if(ybAll(state)){ ybHold(YB_LOCK); return; }                         // 가드③ 판 불변
  const l = ybKind(state);
  if(l<0){ ybHold(YB_NONE); return; }                                  // 가드⑨ 고른 상자 없음 — 판 불변
  if(ybHas(state,l)){ ybHold(YB_AGAIN); return; }                      // 가드⑨ 이미 선 줄 — 판 불변
  ybNote(l);
  state.ybWarn=false;
  if(ybAll(state)){ state.ybMsg = YB_ALL_MSG; playChime(); }
  else { state.ybMsg = `수첩에 적었어요 \u2014 ${YB_LINE[l]}. 다른 상자를 옮기거나 보는 쪽을 바꿔 봐요.`; playChime(); }
  ybRender();
}

/* ④ 판 읽기 — 수첩 세 줄 뒤에만(가드④). */
function ybReadPick(k){
  if(state.ybFin!=null) return;                                        // 가드①
  if(state.ybBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YB_READ.length) return;         // 가드②
  if(!ybAll(state)){ ybHold(YB_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.ybRead!=null){ ybHold(YB_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===YB_READ_OK){
    state.ybRead=k; state.ybWrongR=null; state.ybWarn=false;
    state.ybMsg = '판을 잘 읽었어요. 물건이 나라와 나라 사이를 오갈 때, <b>사 오는 쪽</b>에서는 수입이고 <b>파는 쪽</b>에서는 수출이에요.';
    playChime(); ybRender(); return;
  }
  state.ybWrongR=k;
  ybHold(YB_READ_NO[k]);
}

/* ⑤ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function ybMeanPick(k){
  if(state.ybFin!=null) return;                                        // 가드①
  if(state.ybBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YB_MEAN.length) return;         // 가드②
  if(state.ybRead==null){ ybHold(YB_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.ybMean!=null){ ybHold(YB_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==YB_MEAN_OK){ state.ybWrongK=k; ybHold(YB_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.ybMean = k;                                                    // ★ 핵심 질문을 고르는 자리 단 하나
  state.ybWarn=false;
  state.ybMsg = '나라와 나라 사이에 물자나 서비스를 사고팔거나 교환하는 활동이 <b>무역</b>이에요.';
  playChime(); ybRender();
}

/* ⑥ 마무리 — 지도서 13차시 주요 내용 정리 */
function ybFinish(k){
  if(state.ybFin!=null) return;                                        // 가드①
  if(state.ybBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YB_FIN.length) return;          // 가드②
  if(state.ybMean==null){ ybHold(YB_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===YB_FIN_OK){
    state.ybFin=k; state.ybWrongF=null; state.ybMsg=null; state.ybWarn=false;
    playChime(); ybRender(); return;
  }
  state.ybWrongF=k;
  ybHold(YB_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 10차시(l10) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

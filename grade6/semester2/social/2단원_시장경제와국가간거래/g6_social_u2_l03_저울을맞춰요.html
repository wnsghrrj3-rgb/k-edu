META = "2단원 시장경제와 국가 간 거래 · 주제① 우리나라 시장경제의 특징"
⚠️ 엔진은 u2 l02(→ u2 l01 → u1 l12 → … 6-1 사회 엔진)에서 100% 승계 · 엔진 무수정 · 2단원 색 #A16207 그대로.
⚠️ 회수 키 `g6_s2_social_u2_l03_v1` · 맵 키 `g6_social_u2_l03` · 파일명 `저울을맞춰요` — 조작 이름(선례 승계).

직접조작: 근로자와 기업이 마주 앉는 협의 저울
  ⭐ 씨앗은 지도서 5차시 셋째 핵심 질문 「우리나라에서는 근로자의 권리를 보호하려고 어떤 법과 제도를 마련해 두었나요?」와
     교과서 71쪽 세 모습(단체를 만들거나 가입 · 기업과 협의 · 함께 단체로 행동) + 지도서 「근로 조건 형성에 영향을 미칠 수 있는 기회를 보장」.
  ⭐ 저울 왼쪽은 기업(무게 3 · 고정), 오른쪽은 근로자. 권리 카드 셋을 저울에 올리고 내릴 수 있다(순서 자유 · 여러 장).
     저울이 기운 정도는 **기울기를 담는 상태 없이** `wbTilt(st) = WB_FIRM - wbCnt(st)` 한 줄이 그때그때 정한다.
  ⭐ 요청 셋(교과서 69~71쪽 문면 — 아플 때 휴가 · 휴게실 · 복지 혜택)은 어느 것을 골라도 **결과는 저울만 본다**(요청마다 다른 셈 0).
  ⭐ 수첩 세 줄(카드 없이 혼자 요청 · 카드 몇 장만 올리고 요청 · 세 장 모두 올리고 요청)은
     요청 기록 `state.wbLog |=` 단 하나(`wbNote` · 요청 처리기에서만)에서만 선다(줄 상태 0 · 줄지 않음). 세 줄 최소 걸음은 판 전수 BFS.
  ⭐ 판 읽기는 세 줄이 다 선 뒤에만(정답 자리 2). 이어서 권리를 보호해야 하는 까닭 3택(정답 자리 0) →
     마무리 3택 = 법과 제도가 있는 까닭(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 8종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 수첩 세 줄이 선 뒤 판 움직이기(카드·요청) 무시 — 판 불변
     ④ 세 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 까닭 3택 무시 · 고른 뒤 다시 무시 · 알맞지 않은 까닭 무시
     ⑥ 까닭을 고르기 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`wbBusy`).
   수첩 줄은 기록에서만 — 카드를 내려도 줄지 않음(|= 단 하나).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.wb-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판은 근로자와 기업의 관계를 어림해 나타낸 도식이다** — 실제 협의는 여러 사정에 따라 달라진다(캡션 상시).
  ㉡ **세 권리가 모두 있어야만 말할 수 있다는 뜻이 아니다** — 법과 제도가 근로자의 목소리를 받쳐 준다는 것을 나타낸 것(캡션 상시).
  ㉢ **신문 기사의 비율 수치 · 신문 이름 · 날짜 · 법 조항 번호는 적지 않는다**(「많은 근로자」로 어림).
  ㉣ **내가 생각한 방법 쓰기 · 모둠 문장 만들기 · 영상 보기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 기업의 자유 · 사회적 책임 · 공정 거래 · 경제성장 · 무역 0(차시 예고 한 자리만).

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}

.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

const WB_WHY_AGAIN = '권리를 보호해야 하는 까닭은 <b>이미 골랐어요</b>. 판은 그대로예요.';
const WB_ORDER_F = '아직 <b>권리를 보호해야 하는 까닭</b>을 고르지 않았어요. 먼저 골라 봐요. 판은 그대로예요.';

/* 올린 카드 수 — 한 줄 */
function wbCnt(st){ return (st.wbLaw & 1) + (st.wbLaw >> 1 & 1) + (st.wbLaw >> 2 & 1); }
/* ★ 저울이 기운 정도 — 기업 무게에서 올린 카드 수를 뺀 한 줄(기울기를 담는 자리 0) */
function wbTilt(st){ return WB_FIRM - wbCnt(st); }
/* ★ 이 판이 수첩의 어느 줄인지 — 한 줄 */
function wbMark(st){ return wbTilt(st)===0 ? 4 : wbTilt(st)===WB_FIRM ? 1 : 2; }
function wbLook(st){ return wbTilt(st)===0 ? 'flat' : wbTilt(st)===WB_FIRM ? 'full' : 'half'; }
function wbHas(st,b){ return (st.wbLog & b)!==0; }
function wbAll(st){ return st.wbLog===WB_ALL; }
/* ★ 카드·요청 — 처리기가 읽는 자리 각각 단 하나 */
function wbCardOf(k){ return WB_CARD[k]; }
function wbAskOf(k){ return WB_ASK[k]; }

function wbScale(st){
  const dy = wbTilt(st)*9;
  return `<div class="wb-scale" data-dy="${dy}"><svg viewBox="0 0 320 130">
    <path d="M160 40 L160 112" stroke="#334155" stroke-width="3"/><path d="M128 116 L192 116" stroke="#334155" stroke-width="4"/>
    <path d="M60 ${40+dy} L260 ${40-dy}" stroke="#A16207" stroke-width="4" stroke-linecap="round"/><circle cx="160" cy="40" r="4" fill="#334155"/>
    <rect x="22" y="${46+dy}" width="76" height="30" rx="7" fill="#fff" stroke="#A16207" stroke-width="1.6"/>
    <text x="60" y="${65+dy}" font-size="10" fill="#854D0E" text-anchor="middle" font-weight="800">\uD83C\uDFED 기업</text>
    <rect x="222" y="${46-dy}" width="76" height="30" rx="7" fill="#fff" stroke="#0369A1" stroke-width="1.6"/>
    <text x="260" y="${65-dy}" font-size="10" fill="#075985" text-anchor="middle" font-weight="800">근로자</text>
    ${[0,1,2].map(i=>(st.wbLaw>>i&1)?`<rect class="wb-chip" x="${228+i*22}" y="${30-dy}" width="18" height="12" rx="3" fill="#0369A1"/>`:'').join('')}
  </svg></div>`;
}
function wbCards(st){
  return `<div class="wb-cards">${WB_CARD.map((c,i)=>{ const on=(st.wbLaw>>i&1)===1;
    return `<button class="${on?'on':''}" data-card="${i}" data-on="${on?1:0}" onclick="wbToggle(${i})">${on?'\u2714 ':'\u2795 '}${c.t}</button>`; }).join('')}</div>`;
}
function wbState(st){
  const s = wbLook(st);
  return `<div class="wb-state ${s}" data-s="${s}">\u2696\uFE0F ${WB_SAY[s]}</div>`;
}
function wbAsks(){
  return `<div class="wb-asks">${WB_ASK.map((t,i)=>`<button data-ask="${i}" onclick="wbAsk(${i})">\uD83D\uDCE3 요청해요 \u2014 「${t}」</button>`).join('')}</div>`;
}
function wbNotes(st){
  return WB_NOTE.map((t,i)=>{ const b=1<<i, on=wbHas(st,b);
    return `<div class="wb-line${on?' set':''}" data-line="${i}">${on?'\u2714 '+t+'을 봤어요':t+' \u2014 아직 못 봤어요'}</div>`; }).join('');
}

function wbBoard(st){
  const fin = st.wbFin!=null, all = wbAll(st);
  const head = fin ? '근로자의 권리를 보호하는 모습을 살펴봤어요'
    : st.wbWhy!=null ? '권리를 보호해야 하는 까닭까지 골랐어요 \u2014 이제 정리해요'
    : st.wbRead!=null ? '권리를 보호해야 하는 까닭을 골라 봐요'
    : all ? '수첩의 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : '권리 카드를 올리고 내리며 요청해 봐요';
  return `<div class="wb-board" data-law="${st.wbLaw}" data-tilt="${wbTilt(st)}" data-log="${st.wbLog}" data-all="${all?1:0}" data-read="${st.wbRead==null?-1:st.wbRead}" data-why="${st.wbWhy==null?-1:st.wbWhy}" data-fin="${fin?1:0}">
    <div class="wb-head">${head}</div>
    ${wbScale(st)}
    ${wbCards(st)}
    ${wbState(st)}
    ${wbAsks()}
    <div class="wb-note">${wbNotes(st)}</div>
  </div>`;
}

  } else if(all){

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

function render(){
  const s=slides[state.idx];

  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }

let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function wbRender(){ main.innerHTML = slides[state.idx].render(state); }
function wbHold(msg){
  state.wbWarn=true; state.wbBusy=true; state.wbMsg=msg;
  playThud(); wbRender();
  setTimeout(()=>{ state.wbBusy=false; state.wbWarn=false; state.wbMsg=null;
    state.wbWrongR=null; state.wbWrongW=null; state.wbWrongF=null; wbRender(); },1600);
}
/* ★ 요청 기록 — 더하기만 하는 자리 단 하나 */
function wbNote(){ state.wbLog |= wbMark(state); }
function wbSay(base){
  state.wbWarn=false;
  if(wbAll(state)){ state.wbMsg = WB_ALL_MSG; playChime(); }
  else { state.wbMsg = base; playBlip(); }
  wbRender();
}

/* ① 권리 카드 — 저울에 올리거나 내리기(순서 자유) */
function wbToggle(k){
  if(state.wbFin!=null) return;                                        // 가드①
  if(state.wbBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WB_CARD.length) return;         // 가드②
  if(wbAll(state)){ wbHold(WB_LOCK); return; }                         // 가드③ 판 불변
  const C = wbCardOf(k);
  state.wbLaw ^= 1<<k;                                                 // ★ 카드가 오르내리는 자리 단 하나
  wbSay((state.wbLaw>>k&1) ? `「${C.t}」 카드를 저울에 <b>올렸어요</b> \u2014 ${C.long}.`
    : `「${C.t}」 카드를 저울에서 <b>내렸어요</b>.`);
}

/* ② 요청 — 지금 저울로 기업에 요청(결과는 저울만 봄) */
function wbAsk(k){
  if(state.wbFin!=null) return;                                        // 가드①
  if(state.wbBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WB_ASK.length) return;          // 가드②
  if(wbAll(state)){ wbHold(WB_LOCK); return; }                         // 가드③ 판 불변
  const A = wbAskOf(k);
  state.wbLast = k;
  wbNote();
  wbSay(`「${A}」 \u2014 ${WB_SAY[wbLook(state)]}.`);
}

/* ③ 판 읽기 — 수첩 세 줄 뒤에만(가드④). */
function wbReadPick(k){
  if(state.wbFin!=null) return;                                        // 가드①
  if(state.wbBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WB_READ.length) return;         // 가드②
  if(!wbAll(state)){ wbHold(WB_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.wbRead!=null){ wbHold(WB_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===WB_READ_OK){
    state.wbRead=k; state.wbWrongR=null; state.wbWarn=false;
    state.wbMsg = '판을 잘 읽었어요. 근로자 한 사람의 목소리는 작아도, <b>법이 보장한 권리</b>가 있으면 기업과 대등하게 협의할 수 있어요.';
    playChime(); wbRender(); return;
  }
  state.wbWrongR=k;
  wbHold(WB_READ_NO[k]);
}

/* ④ 권리를 보호해야 하는 까닭 — 판을 읽은 뒤에만(가드⑤). */
function wbWhyPick(k){
  if(state.wbFin!=null) return;                                        // 가드①
  if(state.wbBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WB_WHY.length) return;          // 가드②
  if(state.wbRead==null){ wbHold(WB_ORDER_W); return; }                // 가드⑤ 순서 — 판 불변
  if(state.wbWhy!=null){ wbHold(WB_WHY_AGAIN); return; }               // 가드⑤ 판 불변
  if(k!==WB_WHY_OK){ state.wbWrongW=k; wbHold(WB_WHY_NO[k]); return; } // 가드⑤ 판 불변
  state.wbWhy = k;                                                     // ★ 까닭을 고르는 자리 단 하나
  state.wbWarn=false;
  state.wbMsg = '근로자의 노동력은 경제활동에서 <b>중요한 역할</b>을 하고, 근로자와 기업은 <b>서로 의존</b>해요 \u2014 그래서 근로자의 권리를 보호하는 것이 중요해요.';
  playChime(); wbRender();
}

/* ⑤ 마무리 — 교과서 71쪽 */
function wbFinish(k){
  if(state.wbFin!=null) return;                                        // 가드①
  if(state.wbBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WB_FIN.length) return;          // 가드②
  if(state.wbWhy==null){ wbHold(WB_ORDER_F); return; }                 // 가드⑥ 순서 — 판 불변
  if(k===WB_FIN_OK){
    state.wbFin=k; state.wbWrongF=null; state.wbMsg=null; state.wbWarn=false;
    playChime(); wbRender(); return;
  }
  state.wbWrongF=k;
  wbHold(WB_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l04_돛과키를달아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

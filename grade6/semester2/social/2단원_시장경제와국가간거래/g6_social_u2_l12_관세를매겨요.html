  font-family:inherit;font-weight:800;font-size:clamp(9.6px,1.62vw,11.8px)}
.gt-look:hover{background:#BAE6FD}
.gt-say{border-radius:8px;padding:5px 8px;font-weight:800;font-size:clamp(9.2px,1.56vw,11.2px);line-height:1.4;
  background:#EFF6FF;color:#1E3A8A;border:2px solid #0369A1}
.gt-note{display:flex;flex-direction:column;gap:4px}
.gt-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-radius:7px;padding:4px 8px;font-weight:800;
  font-size:clamp(9.4px,1.58vw,11.4px);border:2px dashed #CBD5E0;background:#F8FAFC;color:#94A3B8}
.gt-line.set{border-style:solid;border-color:#059669;background:#ECFDF5;color:#065F46}
.gt-read,.gt-mean,.gt-fin{display:flex;flex-direction:column;gap:5px}
.gt-read button,.gt-mean button,.gt-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.gt-read button:hover,.gt-mean button:hover,.gt-fin button:hover{background:var(--bub)}
.gt-read button.no,.gt-mean button.no,.gt-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.gt-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .gt-gate,.gt-shelf{gap:3px} .gt-ctl,.gt-steel,.gt-c{font-size:8.4px;padding:3px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====

    <rect x="18" y="34" width="130" height="86" rx="10" fill="#F0FDF4" stroke="#166534" stroke-width="1.5"/>
    <rect x="172" y="34" width="130" height="86" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="83" y="70" font-size="22" text-anchor="middle">\uD83D\uDED2</text><text x="83" y="96" font-size="7.2" fill="#166534" text-anchor="middle" font-weight="800">얻기 힘든 물자도 써요</text>

/* ===== 직접조작 — 세관에서 관세와 수입 제한을 조절하며 우리 철강을 보는 판 =====
   ★ 관세 단추·수입 제한 단추 둘(gtTap) — 판 바꾸는 자리 state.gtGate = 단 하나(관세 + 3 × 제한).
   ★ 손님이 고르는 수입 철강 수는 gtImpN 한 줄 · 제철소 모습 gtMill 한 줄 · 판의 모습 gtKind 한 줄(담는 상태 0).
   ★★ 기록장 기록은 |= 만(gtLog · gtNote 단 하나 · 적기 처리기에서만).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 「싸요·비싸요」는 견준 말일 뿐 값이 아니다. */
const GT_N = 2;
const GT_ALL = 7;
/* 관세 세 단계 — 교과서 108쪽(관세: 다른 나라에서 수입하는 상품에 부과하는 세금) */

const GT_TAG = ['싸요','비슷해요','비싸요'];
const GT_CAPTXT = ['제한 없음','일정한 양까지만'];

   0 수입이 늘어 우리 제철소가 어려움 · 1 높은 관세로 보호 · 2 수입 제한으로 보호 · 3 두 조치가 겹침 · 4 낮은 관세로 또렷하지 않음 */
const GT_KIND = [0, 4, 1, 2, 3, 3];
/* 기록장 세 줄 */

  '관세도 수입 제한도 없으니 값싼 수입 철강이 많이 팔려 우리 제철소가 어려워요 \u2014 수입이 늘어 국내 기업이 피해를 입는 모습',

];

const GT_SAY = [
  '지금 판은 <b>값싼 수입 철강이 많이 팔려</b> 우리 제철소가 어려워요.',

function gtTaxOf(st){ return st.gtGate % 3; }
function gtCapOf(st){ return (st.gtGate / 3) | 0; }
/* ★ 손님이 고르는 수입 철강 수 — 한 줄(제한이면 한 상자까지 · 관세가 높을수록 줄어듦) */
function gtImpN(st){ return Math.min(gtCapOf(st) ? 1 : 4, [4,2,0][gtTaxOf(st)]); }
/* ★ 제철소 모습 — 한 줄 */
function gtMill(st){ const n=gtImpN(st); return n>=3 ? 0 : n===2 ? 1 : 2; }
/* ★ 판의 모습(줄 종류) — 한 줄(표 GT_KIND) */
function gtKind(st){ return GT_KIND[st.gtGate]; }
function gtHas(st,l){ return (st.gtLog & (1<<l))!==0; }
function gtLines(st){ return [0,1,2].filter(l=>gtHas(st,l)).length; }
function gtAll(st){ return st.gtLog===GT_ALL; }

function gtCtls(st){
  const t=gtTaxOf(st), c=gtCapOf(st);
  return `<button class="gt-ctl" data-a="0" data-lv="${t}" onclick="gtTap(0)"><span>\uD83D\uDEC3 관세</span><span class="bar">${[1,2].map(i=>`<i class="${t>=i?'on':''}"></i>`).join('')}</span><span class="st">${GT_TAXTXT[t]}</span></button>`
    + `<button class="gt-ctl" data-a="1" data-lv="${c?2:0}" onclick="gtTap(1)"><span>\uD83D\uDCE6 수입 제한</span><span class="bar"><i class="${c?'on':''}"></i></span><span class="st">${GT_CAPTXT[c]}</span></button>`;
}
function gtShelf(st){
  const t=gtTaxOf(st), c=gtCapOf(st);
  return `<div class="gt-steel" data-who="imp" data-tag="${t}">\uD83D\uDCE6\uD83D\uDD29 수입 철강<br><span class="tag">${GT_TAG[t]}</span>${c?' <span class="tag">한 상자까지</span>':''}</div>`
    + `<div class="gt-steel" data-who="home">\uD83D\uDD29 우리 철강<br><span class="tag">그대로예요</span></div>`;
}
function gtCarts(st){
  const n=gtImpN(st);
  return [0,1,2,3].map(i=>{ const b = i<n ? 'imp' : 'home';
    return `<div class="gt-c" data-i="${i}" data-buy="${b}">\uD83D\uDED2 손님<br>${b==='imp'?'수입 철강':'우리 철강'}</div>`; }).join('');
}
function gtNotes(st){
  return GT_LINE.map((t,l)=>{ const on=gtHas(st,l);
    return `<div class="gt-line${on?' set':''}" data-line="${l}">${on?'\u2714 '+t:'\u2610 아직 적지 않은 줄'}</div>`; }).join('');
}

function gtBoard(st){
  const fin = st.gtFin!=null, all = gtAll(st), k=gtKind(st), m=gtMill(st);
  const head = fin ? '무역 속 경쟁과 국내 산업 보호를 살펴봤어요'
    : st.gtMean!=null ? '나라에서 취하는 조치까지 골랐어요 \u2014 이제 정리해요'
    : st.gtRead!=null ? '나라에서 취하는 조치를 골라 봐요'
    : all ? '기록장 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : st.gtLog!==0 ? '단추를 바꿔 다른 모습을 찾아 적어 봐요'
    : '지금 판을 먼저 적고, 단추를 눌러 판을 바꿔 봐요';
  return `<div class="gt-board" data-gate="${st.gtGate}" data-tax="${gtTaxOf(st)}" data-cap="${gtCapOf(st)}" data-imp="${gtImpN(st)}" data-log="${st.gtLog}" data-lines="${gtLines(st)}" data-all="${all?1:0}" data-kind="${k}" data-read="${st.gtRead==null?-1:st.gtRead}" data-mean="${st.gtMean==null?-1:st.gtMean}" data-fin="${fin?1:0}">
    <div class="gt-head">${head}</div>
    <div class="gt-gate">${gtCtls(st)}</div>
    <div class="gt-shelf">${gtShelf(st)}</div>
    <div class="gt-cart">${gtCarts(st)}</div>
    <div class="gt-mill" data-mill="${m}">${GT_MILL[m]}</div>
    <div class="gt-say" data-say="${k}">${GT_SAY[k]}</div>
    <div class="gt-row"><button class="gt-look" data-look="1" onclick="gtWrite()">\u270D\uFE0F 기록장에 적기</button></div>
    <div class="gt-note">${gtNotes(st)}</div>
  </div>`;
}

function gtPanel(st){
  const fin = st.gtFin!=null, all = gtAll(st);
  const q = fin ? '관세와 수입 제한을 조절하며 무역 속 경쟁과 국내 산업 보호를 살펴봤어요.'
    : st.gtMean!=null ? '오늘 공부한 내용을 정리해요. 무역을 통한 세계 여러 나라의 관계는 어떠한가요?'
    : st.gtRead!=null ? '핵심 질문 \u2014 수입이 늘어나면서 발생하는 피해를 줄여 국내 산업을 보호하고 성장시키기 위해 나라에서 어떤 조치를 취하나요?'
    : all ? '기록장 세 줄이 모두 섰어요. 판에서 무엇을 알 수 있나요?'
    : st.gtLog!==0 ? '단추를 바꿔 가며 기록장 세 줄을 모두 세워요.'
    : '도식 속 우리 가게에 수입 철강과 우리 철강이 나란히 있어요. 관세도 수입 제한도 없는 지금 판을 먼저 살펴봐요.';
  let right = `<div class="gt-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDF0F 무역을 통한 상호 의존과 경쟁</div>
      세계 여러 나라는 무역을 통해 <b>서로 의존</b>하면서, 물자나 서비스를 수출하여 더 많은 이익을 얻으려고 <b>서로 경쟁</b>해요.
      수입이 늘어 국내 기업이 피해를 입거나 관련 산업이 성장하기 어려울 때, 나라는 수입품에 <b>높은 관세</b>를 부과하거나 <b>일정한 양 이하로 수입을 제한</b>하기도 해요.<br>
      <span style="color:#64748B">판의 가게와 제철소는 도식이에요. 실제 무역에서는 관세 말고도 품질, 기술 같은 여러 조건이 함께 작용해요.
      <b>신문 기사에 밑줄 긋기</b>, <b>두 나라의 관계 변화 써 보기</b>, <b>모둠 토의</b>, <b>제철 산업 영상 보기</b>, <b>관세사 알아보기</b>, <b>컨테이너 찾기 놀이</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.gtMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="gt-fin">${GT_FIN.map((t,k)=>`<button class="${st.gtWrongF===k?'no':''}" onclick="gtFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.gtRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 핵심 질문</div>`;
    right += `<div class="gt-mean">${GT_MEAN.map((t,k)=>`<button class="${st.gtWrongK===k?'no':''}" onclick="gtMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="gt-hint">기록장 둘째·셋째 줄을 적을 때 누른 단추를 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="gt-read">${GT_READ.map((t,k)=>`<button class="${st.gtWrongR===k?'no':''}" onclick="gtReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDEC3 관세와 수입 제한을 조절하며 보기</div>`;
    right += `<div class="gt-hint"><b>관세</b>는 다른 나라에서 수입하는 상품에 부과하는 세금이에요. <b>관세</b> 단추를 누를 때마다 관세 없음 \u2192 낮은 관세 \u2192 높은 관세 \u2192 다시 관세 없음으로 바뀌고, 관세가 높을수록 수입 철강이 비싸져요. <b>수입 제한</b> 단추는 수입 철강을 일정한 양까지만 들여오게 해요. 손님 넷은 더 싼 철강을 골라요. <b>기록장에 적기</b>를 누르면 지금 판의 모습이 적혀요. 세 줄을 모두 세우면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.gtMsg) right += `<div class="dw-msg${st.gtWarn?' warn':''}">${st.gtMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDEC3 세관에서 관세를 매겨요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${gtBoard(st)}<div class="cvcap">판의 가게·세관·제철소는 <b>도식</b>이에요. 「싸요·비싸요」는 두 철강을 견준 말일 뿐 실제 값이 아니고, 실제 무역에서는 품질·기술 같은 여러 조건이 함께 작용해요. 수치는 적지 않았어요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    ${st.revealed?`<div class="answer-box">\u2014 일하는 사람들: 일을 하며 필요한 <b>소득</b>을 얻을 수 있어요.<br>
      \u2014 전 세계 사람들: 기존보다 <b>저렴한 가격</b>으로, 더 다양한 제품을 구입할 수 있어요.<br>
      \u2014 문제점: 근로자들이 정당한 임금을 받지 못하거나, 생산 과정에서 환경 오염이 생기기도 해요. 그래서 <b>정당한 분배</b>가 이루어져야 해요.<br>
      \u2014 꼭 기억해요 1 \u2014 <b>경쟁</b> \u00b7 꼭 기억해요 2 \u2014 <b>맞아요</b></div>`
      :`<div class="note">일하는 사람, 사는 사람, 걱정되는 점을 차례로 생각해 봐요.</div><button class="reveal-btn" onclick="reveal()">생각 보기</button>`}
  </div>`});
// 8~15 문항
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약 — 지도서 17~18차시 주요 내용 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('sum','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">\u2460</span><div><b>상호 의존</b> \u2014 세계 여러 나라는 무역을 통해 물자나 기술을 주고받으며 서로 의존해요.</div></div>
    <div class="sum-item"><span class="n">\u2461</span><div><b>경쟁</b> \u2014 첨단 기술 개발, 다른 나라 시설 건설, 더 나은 무역 환경 등 다양한 분야에서 서로 경쟁해요.</div></div>
    <div class="sum-item"><span class="n">\u2462</span><div><b>국내 산업 보호</b> \u2014 수입이 늘어 국내 산업이 어려울 때 수입품에 높은 관세를 부과하거나 수입을 제한하기도 해요.</div></div>
    <div class="sum-item"><span class="n">\u2463</span><div><b>세계로 가는 기업</b> \u2014 기업은 물자를 생산하는 데 유리한 환경을 갖춘 나라에서 경제활동을 하기도 해요.</div></div>
    <div class="sum-item"><span class="n">\u2605</span><div><b>오늘의 조작</b> \u2014 관세도 수입 제한도 없으면 우리 제철소가 어려웠고, 높은 관세나 수입 제한을 쓰니 우리 철강이 더 잘 팔렸어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b>[생각을 펼쳐요] 기업 운영 계획을 세우고 기업 소개 잡지</b>를 완성해요. 준비물은 색칠 도구예요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">공부한 내용을 되돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"무역을 통해 나라끼리 서로 의존하는 사례를 말할 수 있어요",st)}
    ${selfCheck(1,"세계 여러 나라가 무역에서 경쟁하는 모습을 말할 수 있어요",st)}
    ${selfCheck(2,"무역을 통한 세계 여러 나라의 상호 의존과 경쟁 관계를 설명할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">기업 운영 계획을 세우고 기업 소개 잡지</b>를 완성해요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u2_l12";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  gtGate:0, gtLog:0,
  gtRead:null, gtMean:null, gtFin:null,
  gtWrongR:null, gtWrongK:null, gtWrongF:null,
  gtMsg:null, gtWarn:false, gtBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function gtRender(){ main.innerHTML = slides[state.idx].render(state); }
function gtHold(msg){
  state.gtWarn=true; state.gtBusy=true; state.gtMsg=msg;
  playThud(); gtRender();
  setTimeout(()=>{ state.gtBusy=false; state.gtWarn=false; state.gtMsg=null;
    state.gtWrongR=null; state.gtWrongK=null; state.gtWrongF=null; gtRender(); },1600);
}
/* ★ 기록장 기록 — 더하기만 하는 자리 단 하나 */
function gtNote(l){ state.gtLog |= (1 << l); }

/* ① 세관 단추 — 0 관세(없음 → 낮음 → 높음 → 없음) · 1 수입 제한(켬·끔) */
function gtTap(a){
  if(state.gtFin!=null) return;                                        // 가드①
  if(state.gtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(a) || a<0 || a>=GT_N) return;                   // 가드②
  if(gtAll(state)){ gtHold(GT_LOCK); return; }                         // 가드③ 판 불변
  const t=gtTaxOf(state), c=gtCapOf(state);
  state.gtGate = a===0 ? (t+1)%3 + 3*c : t + 3*(1-c);                  // ★ 판이 바뀌는 자리 단 하나
  state.gtWarn=false; state.gtMsg=null; playBlip(); gtRender();
}

/* ② 기록장에 적기 — 한 가지 모습이고(가드⑩) 아직 적지 않았을 때만(가드⑨) */
function gtWrite(){
  if(state.gtFin!=null) return;                                        // 가드①
  if(state.gtBusy) return;                                             // 가드⑧
  if(gtAll(state)){ gtHold(GT_LOCK); return; }                         // 가드③ 판 불변
  const l = gtKind(state);
  if(l===3){ gtHold(GT_MIX); return; }                                 // 가드⑩ 두 조치가 겹침 — 판 불변
  if(l===4){ gtHold(GT_LOW); return; }                                 // 가드⑩ 또렷하지 않음 — 판 불변
  if(gtHas(state,l)){ gtHold(GT_AGAIN); return; }                      // 가드⑨ 이미 선 줄 — 판 불변
  gtNote(l);
  state.gtWarn=false;
  if(gtAll(state)){ state.gtMsg = GT_ALL_MSG; playChime(); }
  else { state.gtMsg = `기록장에 적었어요 \u2014 ${GT_LINE[l]}. 단추를 바꿔 다른 모습을 찾아봐요.`; playChime(); }
  gtRender();
}

/* ③ 판 읽기 — 세 줄 뒤에만(가드④) */
function gtReadPick(k){
  if(state.gtFin!=null) return;                                        // 가드①
  if(state.gtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=GT_READ.length) return;         // 가드②
  if(!gtAll(state)){ gtHold(GT_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.gtRead!=null){ gtHold(GT_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===GT_READ_OK){
    state.gtRead=k; state.gtWrongR=null; state.gtWarn=false;
    state.gtMsg = '판을 잘 읽었어요. <b>높은 관세</b>나 <b>수입 제한</b>으로 우리 철강이 더 잘 팔렸어요.';
    playChime(); gtRender(); return;
  }
  state.gtWrongR=k;
  gtHold(GT_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function gtMeanPick(k){
  if(state.gtFin!=null) return;                                        // 가드①
  if(state.gtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=GT_MEAN.length) return;         // 가드②
  if(state.gtRead==null){ gtHold(GT_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.gtMean!=null){ gtHold(GT_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==GT_MEAN_OK){ state.gtWrongK=k; gtHold(GT_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.gtMean = k;                                                    // ★ 핵심 질문을 고르는 자리 단 하나
  state.gtWarn=false;
  state.gtMsg = '수입품에 <b>높은 관세</b>를 부과하거나 일정한 양 이하로 <b>수입을 제한</b>해요.';
  playChime(); gtRender();
}

/* ⑤ 마무리 — 교과서 109쪽 꼭 기억해요 1 */
function gtFinish(k){
  if(state.gtFin!=null) return;                                        // 가드①
  if(state.gtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=GT_FIN.length) return;          // 가드②
  if(state.gtMean==null){ gtHold(GT_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===GT_FIN_OK){
    state.gtFin=k; state.gtWrongF=null; state.gtMsg=null; state.gtWarn=false;
    playChime(); gtRender(); return;
  }
  state.gtWrongF=k;
  gtHold(GT_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l13_표지를꾸며요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

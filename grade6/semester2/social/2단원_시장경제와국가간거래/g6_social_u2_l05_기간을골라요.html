META = "2단원 시장경제와 국가 간 거래 · 주제② 경제성장과 우리 생활"
⚠️ 엔진은 u2 l04(→ u2 l03 → … 6-1 사회 엔진)에서 100% 승계 · 엔진 무수정 · 2단원 색 #A16207 그대로.
⚠️ 회수 키 `g6_s2_social_u2_l05_v1` · 맵 키 `g6_social_u2_l05` · 파일명 `기간을골라요` — 조작 이름(선례 승계).

직접조작: 기간을 골라 견주는 두 나라 소득 막대 판
  ⭐ 씨앗은 교과서 79쪽 스스로 활동 「1960년부터 1980년까지 · 1980년 이후 우리나라와 ○○ 나라의 1인당 국민 총소득 변화를 비교해 써 봅시다」와
     지도서 8차시 그래프 해설(1970년대까지 큰 차이 없음 · 1980년대부터 격차가 크게 벌어짐).
  ⭐ 막대 높이는 교과서 그래프 값(세계 은행 자료)을 **같은 잣대 하나(KY_TOP)** 로 옮긴다 — 화면에 금액은 적지 않는다.
  ⭐ 시작·끝 손잡이 둘로 기간을 고른다(시작은 늘 끝보다 앞). 기간의 성격은 **담는 상태 없이** `kyKind(st)` 한 줄이 정한다
     (1980년까지 안쪽 0 · 1980년부터 뒤쪽 1 · 1980년을 사이에 둠 2).
  ⭐ 수첩 세 줄은 「이 기간을 견줘요」 기록 `state.kyLog |=` 단 하나(`kyNote` · 견주기 처리기에서만)에서만 선다(줄 상태 0 · 줄지 않음).
  ⭐ 판 읽기는 세 줄이 다 선 뒤에만(정답 자리 2) → 핵심 질문 「경제성장이란 무엇인가요?」 3택(정답 자리 0) →
     마무리 3택 = 우리나라의 빠른 경제성장(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 수첩 세 줄이 선 뒤 판 움직이기(손잡이·견주기) 무시 — 판 불변
     ④ 세 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 뜻 3택 무시 · 고른 뒤 다시 무시 · 알맞지 않은 뜻 무시
     ⑥ 뜻을 고르기 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`kyBusy`)
     ⑨ 손잡이가 그래프 끝을 넘거나 시작이 끝을 넘어서는 움직임 무시 — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.ky-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **막대 높이는 교과서 그래프 값을 한 잣대로 옮긴 것** — 금액은 적지 않는다(캡션 상시).
  ㉡ **○○ 나라는 교과서처럼 이름을 밝히지 않는다.**
  ㉢ **경제성장 속도는 나라마다 다르며, 빠르면 좋고 느리면 나쁘다는 뜻이 아니다**(지도서 지도 꿀 Tip · 캡션 상시 · 마무리 오답 안내).
  ㉣ **영상 보기 · 모둠 토의 · 돌아가며 말하기 · 밑줄 긋기 · 앞으로의 모습 쓰기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 경제성장이 생활에 미친 영향(첨단 기술·교육·의료) · 빠른 경제성장으로 생긴 문제 · 무역 0(차시 예고 한 자리만).
  **교사용 참고 자료 0** — 참고 도서·저자·출판사 · 누리집 주소 · 활동지 · 평가 관점.
  사람 형상 0 · 금액 0 · 비율 0 · 쪽수 0 · 실제 기업 이름 0 · 나라 이름은 우리나라뿐.

/* ★ 기간의 성격 — 두 손잡이에서 그때그때 정하는 한 줄(담는 자리 0) */
function kyKind(st){ return st.kyEnd <= KY_TURN ? 0 : st.kyFrom >= KY_TURN ? 1 : 2; }
/* ★ 이 기간이 수첩의 어느 줄인지 — 한 줄 */
function kyMark(st){ return 1 << kyKind(st); }
function kyLook(st){ return KY_LOOK[kyKind(st)]; }
function kyHas(st,b){ return (st.kyLog & b)!==0; }
function kyAll(st){ return st.kyLog===KY_ALL; }
/* 손잡이 자리 — 0 시작 · 1 끝 */
function kyAt(st,h){ return h===0 ? st.kyFrom : st.kyEnd; }
/* ★ 막대 높이 — 한 잣대 KY_TOP 하나로만 */
function kyH(v){ return Math.max(2, Math.round(v / KY_TOP * 96)); }
/* ★ 움직임 — 처리기가 읽는 자리 단 하나 */
function kyMoveOf(k){ return KY_MOVE[k]; }
function kyIn(st,i){ return i>=st.kyFrom && i<=st.kyEnd; }

function kyGraph(st){
  const k = kyKind(st);
  return `<div class="ky-graph" data-from="${st.kyFrom}" data-end="${st.kyEnd}" data-kind="${k}"><svg viewBox="0 0 320 150">
    <rect width="320" height="150" fill="#fff"/>
    <rect class="ky-win" x="${14+st.kyFrom*42}" y="6" width="${(st.kyEnd-st.kyFrom)*42+40}" height="124" rx="6" fill="#FEF3C7" opacity=".7"/>
    <line x1="10" y1="118" x2="312" y2="118" stroke="#94A3B8" stroke-width="1.2"/>
    ${KY_YEAR.map((y,i)=>{ const x=20+i*42, on=kyIn(st,i), a=kyH(KY_KOR[i]), b=kyH(KY_OTH[i]);
      return `<g class="ky-col" data-i="${i}" data-in="${on?1:0}" opacity="${on?1:.35}">
      <rect class="ky-kor" x="${x}" y="${118-a}" width="13" height="${a}" data-h="${a}" fill="#A16207"/>
      <rect class="ky-oth" x="${x+14}" y="${118-b}" width="13" height="${b}" data-h="${b}" fill="#94A3B8"/>
      <text x="${x+13}" y="129" font-size="7.4" fill="#334155" text-anchor="middle" font-weight="800">${y}</text></g>`; }).join('')}
    <text x="${34+st.kyFrom*42}" y="143" font-size="7.4" fill="#0369A1" text-anchor="middle" font-weight="800">\u25B2시작</text>
    <text x="${34+st.kyEnd*42}" y="143" font-size="7.4" fill="#0369A1" text-anchor="middle" font-weight="800">\u25B2끝</text>
  </svg></div>`;
}
function kyKeys(){
  return `<div class="ky-keys"><span><i style="background:#A16207"></i>우리나라</span><span><i style="background:#94A3B8"></i>○○ 나라</span></div>`;
}
function kyMoves(){
  return `<div class="ky-moves">${KY_MOVE.map((m,i)=>`<button data-move="${i}" onclick="kyMove(${i})">${m.t}</button>`).join('')}</div>`;
}
function kySpan(st){
  return `<div class="ky-span" data-span="${st.kyFrom}-${st.kyEnd}">고른 기간: <b>${KY_YEAR[st.kyFrom]}년</b>부터 <b>${KY_YEAR[st.kyEnd]}년</b>까지</div>`;
}
function kySay(st){
  const s = kyLook(st);
  return `<div class="ky-say ${s}" data-s="${s}">\uD83D\uDCCA ${KY_SAY[s]}</div>`;
}
function kyNotes(st){
  return KY_NOTE.map((t,i)=>{ const b=1<<i, on=kyHas(st,b);
    return `<div class="ky-line${on?' set':''}" data-line="${i}">${on?'\u2714 '+t+'을 봤어요':t+' \u2014 아직 못 봤어요'}</div>`; }).join('');
}

function kyBoard(st){
  const fin = st.kyFin!=null, all = kyAll(st);
  const head = fin ? '경제성장이 무엇인지 알아봤어요'
    : st.kyMean!=null ? '경제성장의 뜻까지 골랐어요 \u2014 이제 정리해요'
    : st.kyRead!=null ? '경제성장이 무엇인지 골라 봐요'
    : all ? '수첩의 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : '손잡이로 기간을 골라 두 나라를 견줘 봐요';
  return `<div class="ky-board" data-from="${st.kyFrom}" data-end="${st.kyEnd}" data-kind="${kyKind(st)}" data-log="${st.kyLog}" data-all="${all?1:0}" data-read="${st.kyRead==null?-1:st.kyRead}" data-mean="${st.kyMean==null?-1:st.kyMean}" data-fin="${fin?1:0}">
    <div class="ky-head">${head}</div>
    ${kyGraph(st)}
    ${kyKeys()}
    ${kyMoves()}
    ${kySpan(st)}
    <button class="ky-look" onclick="kyCompare()">\uD83D\uDD0D 이 기간을 견줘요</button>
    ${kySay(st)}
    <div class="ky-note">${kyNotes(st)}</div>

}

  } else if(st.kyMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="ky-fin">${KY_FIN.map((t,k)=>`<button class="${st.kyWrongF===k?'no':''}" onclick="kyFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.kyRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 핵심 질문</div>`;
    right += `<div class="ky-mean">${KY_MEAN.map((t,k)=>`<button class="${st.kyWrongM===k?'no':''}" onclick="kyMeanPick(${k})">${t}</button>`).join('')}</div>`;

  } else if(all){

    right += `<div class="ky-hint"><b>시작</b>과 <b>끝</b> 손잡이를 움직여 기간을 고르고, <b>이 기간을 견줘요</b>를 누르면 수첩에 적혀요. 시작은 늘 끝보다 앞이에요. 수첩의 <b>세 줄</b>이 모두 서면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.kyMsg) right += `<div class="dw-msg${st.kyWarn?' warn':''}">${st.kyMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCCA 기간을 골라 견주는 두 나라의 1인당 국민 총소득</b></div>

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function kyRender(){ main.innerHTML = slides[state.idx].render(state); }
function kyHold(msg){
  state.kyWarn=true; state.kyBusy=true; state.kyMsg=msg;
  playThud(); kyRender();
  setTimeout(()=>{ state.kyBusy=false; state.kyWarn=false; state.kyMsg=null;
    state.kyWrongR=null; state.kyWrongM=null; state.kyWrongF=null; kyRender(); },1600);
}
/* ★ 견준 기록 — 더하기만 하는 자리 단 하나 */
function kyNote(){ state.kyLog |= kyMark(state); }
function kyTell(base){
  state.kyWarn=false;
  if(kyAll(state)){ state.kyMsg = KY_ALL_MSG; playChime(); }
  else { state.kyMsg = base; playBlip(); }
  kyRender();
}

/* ① 손잡이 — 시작·끝을 한 칸씩(시작은 늘 끝보다 앞) */
function kyMove(k){
  if(state.kyFin!=null) return;                                        // 가드①
  if(state.kyBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=KY_MOVE.length) return;         // 가드②
  if(kyAll(state)){ kyHold(KY_LOCK); return; }                         // 가드③ 판 불변
  const M = kyMoveOf(k), to = kyAt(state,M.h) + M.d;
  if(to<0 || to>=KY_N){ kyHold(KY_EDGE); return; }                     // 가드⑨ 그래프 끝 — 판 불변
  if(M.h===0 ? to>=state.kyEnd : to<=state.kyFrom){ kyHold(KY_CROSS); return; } // 가드⑨ 뒤바뀜 — 판 불변
  if(M.h===0) state.kyFrom = to; else state.kyEnd = to;               // ★ 손잡이가 움직이는 자리 단 하나
  state.kyWarn=false; state.kyMsg=null; playBlip(); kyRender();
}

/* ② 견주기 — 지금 기간을 수첩에 적기 */
function kyCompare(){
  if(state.kyFin!=null) return;                                        // 가드①
  if(state.kyBusy) return;                                             // 가드⑧
  if(kyAll(state)){ kyHold(KY_LOCK); return; }                         // 가드③ 판 불변
  kyNote();
  kyTell(`${KY_YEAR[state.kyFrom]}년부터 ${KY_YEAR[state.kyEnd]}년까지 \u2014 ${KY_SAY[kyLook(state)]}.`);
}

/* ③ 판 읽기 — 수첩 세 줄 뒤에만(가드④). */
function kyReadPick(k){
  if(state.kyFin!=null) return;                                        // 가드①
  if(state.kyBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=KY_READ.length) return;         // 가드②
  if(!kyAll(state)){ kyHold(KY_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.kyRead!=null){ kyHold(KY_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===KY_READ_OK){
    state.kyRead=k; state.kyWrongR=null; state.kyWarn=false;
    state.kyMsg = '판을 잘 읽었어요. 1980년을 지나며 우리나라의 1인당 국민 총소득이 <b>급격하게</b> 늘었어요.';
    playChime(); kyRender(); return;
  }
  state.kyWrongR=k;
  kyHold(KY_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function kyMeanPick(k){
  if(state.kyFin!=null) return;                                        // 가드①
  if(state.kyBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=KY_MEAN.length) return;         // 가드②
  if(state.kyRead==null){ kyHold(KY_ORDER_M); return; }                // 가드⑤ 순서 — 판 불변
  if(state.kyMean!=null){ kyHold(KY_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==KY_MEAN_OK){ state.kyWrongM=k; kyHold(KY_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.kyMean = k;                                                    // ★ 뜻을 고르는 자리 단 하나
  state.kyWarn=false;
  state.kyMsg = '국가의 전체적인 생산 수준이나 국민 소득이 증가하여 경제 규모가 커지는 것을 <b>경제성장</b>이라고 해요.';
  playChime(); kyRender();
}

/* ⑤ 마무리 — 교과서 79~80쪽 */
function kyFinish(k){
  if(state.kyFin!=null) return;                                        // 가드①
  if(state.kyBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=KY_FIN.length) return;          // 가드②
  if(state.kyMean==null){ kyHold(KY_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===KY_FIN_OK){
    state.kyFin=k; state.kyWrongF=null; state.kyMsg=null; state.kyWarn=false;
    playChime(); kyRender(); return;
  }
  state.kyWrongF=k;
  kyHold(KY_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 6차시(l06) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

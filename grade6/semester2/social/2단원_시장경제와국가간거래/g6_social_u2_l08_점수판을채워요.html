META = "2단원 시장경제와 국가 간 거래 · 주제② 경제성장과 우리 생활"
⚠️ 엔진은 u2 l07(→ u2 l06 → … 6-1 사회 엔진)에서 100% 승계 · 엔진 무수정 · 2단원 색 #A16207 그대로.

직접조작: 세 해결 방안에 세 기준으로 점수를 매겨 견주는 점수판
  ⭐ 씨앗은 교과서 90쪽 「평가 기준을 세우고, 평가 기준에 따라 점수를 매겨 보며 해결 방안을 검토해 봅시다」(실천할 수 있나요 · 효과가 큰가요 · 비용이 적게 드나요 · 1~5점)와
     지도서 11~12차시 전개 「점수를 매기고 합계를 내서 최고점을 받은 해결 방안을 선정한다」.
  ⭐ 방안 셋은 교과서 90쪽 모둠 예시(환경 문제) — 시민 단체 감시 · 자원량 법으로 정하기 · 캠페인. 기준 셋 × 방안 셋 = 아홉 칸.
  ⭐ 칸을 누르면 점수가 1 → 3 → 5 → 1 로 돈다(`hpTap` · 칸이 바뀌는 자리 한 줄 · 아홉 칸은 `hpPt` 한 수 안의 두 비트씩).
  ⭐ ★ 합계는 `hpSum` 한 줄 · 최고 방안은 `hpBest` 한 줄(아홉 칸이 다 차고 최고가 하나일 때만 · 담는 상태 0).
  ⭐ ★★ 검토(`hpCheck`)한 기록은 `state.hpLog |=` 단 하나(`hpNote` · 검토 처리기에서만 · 줄지 않음) — 수첩 세 줄 = 세 방안이 각각 최고가 된 판.
     같은 세 방안이라도 점수(기준)에 따라 최고가 바뀐다 — 그래서 평가 기준이 중요하다.
  ⭐ 판 읽기는 세 줄 뒤에만(정답 자리 0) → 핵심 질문 「문제를 해결하기 위해 어떤 노력을 하고 있나요?」 3택(정답 자리 1) →
     마무리 3택 = 해결해야 지속적으로 발전(정답 자리 2).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 세 줄이 선 뒤 판 움직이기(칸·검토) 무시 — 판 불변
     ④ 세 줄 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 핵심 질문 무시 · 고른 뒤 다시 무시 · 알맞지 않은 답 무시
     ⑥ 핵심 질문 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`hpBusy`)
     ⑨ 빈칸이 있을 때 검토 · 최고가 둘 이상(동점)일 때 검토 · 이미 선 줄 다시 검토 무시 — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.hp-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **점수에는 정답이 없다** — 어느 칸에 몇 점을 매길지는 모둠 토의로 정한다(캡션 상시).
  ㉡ **방안 셋은 교과서의 예시**(환경 문제) — 해결 방안이 셋뿐이라는 뜻이 아니다(캡션 상시).
  ㉢ **수치는 적지 않는다** — 빈곤율 그래프·나라 이름·금액 0(칸의 점수 1·3·5 와 합계만).
  ㉣ **문제 고르기 · 모둠 토의 · 실천 계획 · 발표 · 자기 평가 · 암호 찾기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 무역 0(차시 예고 한 자리만).
  **교사용 참고 자료 0** — 참고 도서·저자·출판사 · 누리집 주소 · 활동지 · 평가 관점 · GRASPS.
  사람 형상 0 · 금액 0 · 비율 0 · 쪽수 0 · 실제 기관·신문 이름 0 · 연도 0.

.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙 ㉠·㉢: 모든 그림은 내용을 나타낸 도식이며 실제 사진이 아니다.
   ⚠️ 사람 형상 대신 도형으로만 그린다. 금액·비율·수치는 적지 않는다. */
const SVG = {
  // 1 들어가기 — 켜진 경고등 앞에서 하나를 고르는 자리(도식)

    <text x="200" y="145" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="800">해결하고 싶은 문제를 골라요(도식)</text></svg>`,
  // 2 살펴보기 — 모둠이 둘러앉아 방안을 내는 자리(도식)
  talk:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#F8FAFC"/>
    <ellipse cx="160" cy="92" rx="92" ry="40" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>

    <text x="160" y="96" font-size="8.4" fill="#334155" text-anchor="middle" font-weight="800">해결 방안 토의</text>
    <text x="160" y="160" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="700">모둠별로 토의해 방안을 찾아요(도식)</text></svg>`,
  // 3 살펴보기 — 방안 셋(도식)
  plans:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    ${[['\uD83D\uDC41\uFE0F','시민 단체 감시'],['\uD83D\uDCDC','자원량을 법으로'],['\uD83D\uDCE3','캠페인']].map((t,i)=>`<rect x="${28+i*92}" y="36" width="80" height="90" rx="10" fill="#FEF9C3" stroke="#A16207" stroke-width="1.4"/>
      <text x="${68+i*92}" y="80" font-size="22" text-anchor="middle">${t[0]}</text>
      <text x="${68+i*92}" y="110" font-size="7.6" fill="#854D0E" text-anchor="middle" font-weight="800">${t[1]}</text>`).join('')}
    <text x="160" y="152" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="700">환경 문제의 해결 방안 예시 셋(도식)</text></svg>`,
  // 4 살펴보기 — 공유지의 비극(도식)
  pond:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#F0F9FF"/>

    <path d="M156 96 L190 96" stroke="#C2410C" stroke-width="2"/><path d="M190 90 L200 96 L190 102 Z" fill="#C2410C"/>
    <ellipse cx="250" cy="96" rx="58" ry="30" fill="#BAE6FD" stroke="#0369A1" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="90" y="140" font-size="7.6" fill="#0C4A6E" text-anchor="middle" font-weight="800">처음 공동 어장</text>
    <text x="250" y="140" font-size="7.6" fill="#9A3412" text-anchor="middle" font-weight="800">몇 달 뒤</text>
    <text x="160" y="160" font-size="7.4" fill="#64748B" text-anchor="middle" font-weight="700">공유하는 자원을 함부로 쓰면(도식)</text></svg>`,
  // 5 살펴보기 — 점수판(도식)
  sheet:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>
    ${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<rect x="${40+c*62}" y="${30+r*26}" width="58" height="22" rx="4" fill="${r===0||c===0?'#FEF3C7':'#fff'}" stroke="#A16207" stroke-width="1"/>`).join('')).join('')}
    <text x="69" y="45" font-size="7" fill="#854D0E" text-anchor="middle" font-weight="800">기준 \ 방안</text>
    <text x="160" y="150" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="800">기준마다 점수를 매겨 합계를 견줘요(도식)</text></svg>`,
  // 6 살펴보기 — 노력(정부·기업과 근로자·시민 단체와 개인)(도식)
  effort:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#fff"/>
    ${[['\uD83C\uDFDB\uFE0F','정부'],['\uD83E\uDD1D','기업과 근로자'],['\uD83C\uDF3F','시민 단체와 개인']].map((t,i)=>`<rect x="${24+i*96}" y="40" width="84" height="84" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
      <text x="${66+i*96}" y="82" font-size="22" text-anchor="middle">${t[0]}</text>
      <text x="${66+i*96}" y="110" font-size="7.4" fill="#065F46" text-anchor="middle" font-weight="800">${t[1]}</text>`).join('')}
    <text x="160" y="152" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="800">함께 노력해요(도식)</text></svg>`,
  // 7 살펴보기 — 꼭 기억해요(도식)
  keep:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>
    <path d="M30 136 L110 104 L170 84 L230 62 L290 44" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <path d="M284 36 L302 40 L292 56 Z" fill="#059669"/>
    <text x="160" y="150" font-size="7.8" fill="#334155" text-anchor="middle" font-weight="800">문제를 해결해야 경제가 지속적으로 발전해요(도식)</text></svg>`,
  // 16 정리
  sum:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#1E293B"/>
    ${['문제 고르기','방안 토의','기준으로 검토','실천 계획'].map((t,i)=>`<rect x="${20+i*74}" y="52" width="62" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="${51+i*74}" y="76" font-size="7.2" fill="#9A3412" text-anchor="middle" font-weight="800">${t}</text>${i<3?`<path d="M${82+i*74} 72 L${92+i*74} 72" stroke="#FDE68A" stroke-width="2"/>`:''}`).join('')}
    <text x="160" y="128" font-size="8.6" fill="#FDE68A" text-anchor="middle" font-weight="800">빠른 경제성장으로 발생한 문제를 해결해요</text></svg>`,
  // 18 종료
  done:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#FEFCE8"/>
    <circle cx="160" cy="76" r="40" fill="#fff" stroke="#A16207" stroke-width="2.4"/>
    <path d="M142 76 L156 90 L180 62" fill="none" stroke="#A16207" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="142" font-size="11" fill="#854D0E" text-anchor="middle" font-weight="800">오늘 공부를 마쳤어요</text></svg>`
};
function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

/* ===== 직접조작 — 세 해결 방안에 세 기준으로 점수를 매겨 견주는 점수판 =====
   ★ 칸을 누르면 빈칸 → 1 → 3 → 5 → 1 로 돈다(hpTap · 칸이 바뀌는 자리 한 줄 · 아홉 칸은 hpPt 한 수 안의 두 비트씩).
   ★★ 합계는 hpSum 한 줄 · 최고 방안은 hpBest 한 줄(아홉 칸이 다 차고 최고가 하나일 때만 · 담는 상태 0).
   ★★ 검토한 기록은 |= 만(hpLog · hpNote 단 하나 · 검토 처리기에서만) — 수첩 세 줄 = 세 방안이 각각 최고가 된 판.
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 점수에는 정답이 없다. */
/* 방안 셋 — 교과서 90쪽 모둠 예시(환경 문제) */
const HP_PLAN = [
  {t:'시민 단체를 만들어 무분별한 개발 감시하기', s:'시민 단체 감시', i:'\uD83D\uDC41\uFE0F'},
  {t:'개발할 수 있는 자원량 법으로 정하기',        s:'자원량을 법으로', i:'\uD83D\uDCDC'},
  {t:'환경 문제의 심각성을 알리는 캠페인 벌이기',  s:'캠페인 벌이기',   i:'\uD83D\uDCE3'}
];
/* 기준 셋 — 교과서 90쪽 평가 기준 */
const HP_CRIT = ['실천할 수 있나요?','효과가 큰가요?','비용이 적게 드나요?'];
const HP_N = 3;
const HP_ALL = 7;
/* 칸 값 — 두 비트 0·1·2·3 → 빈칸·1점·3점·5점 */
const HP_VAL = [0,1,3,5];

/* ② 판 읽기 */
const HP_READ = [
  '같은 세 방안이라도 어떤 기준에 몇 점을 매기느냐에 따라 가장 좋은 방안이 달라졌어요',
  '세 방안 가운데 가장 좋은 방안은 언제나 하나로 정해져 있었어요',
  '점수를 매기지 않아도 어느 방안이 가장 좋은지 알 수 있었어요'
];
const HP_READ_OK = 0;
const HP_READ_NO = [
  null,
  '수첩을 다시 봐요. 세 방안이 <b>각각</b> 가장 좋은 방안이 된 판이 있었어요. 판을 다시 읽어 봐요.',
  '아홉 칸이 다 차기 전에는 <b>검토</b>할 수 없었어요. 판을 다시 읽어 봐요.'
];

/* ③ 핵심 질문 — 경제성장 과정에서 발생한 문제를 해결하기 위해 어떤 노력을 하고 있나요? */
const HP_MEAN = [
  '문제는 누군가 한 사람이 혼자 해결하고 있어요',
  '정부는 다양한 제도와 정책을 만들고, 기업과 근로자는 서로 소통하며, 시민 단체와 개인도 여러 분야에서 노력하고 있어요',
  '문제가 저절로 해결되기를 기다리고 있어요'
];
const HP_MEAN_OK = 1;
const HP_MEAN_NO = [
  '해변가에서 쓰레기를 줍는 <b>시민 단체와 개인</b>, 제도를 만드는 <b>정부</b>를 떠올려 봐요. 판은 그대로예요.',
  null,
  '지난 시간에 켜진 경고등을 떠올려 봐요. 그대로 두면 경제가 <b>계속 성장하기 어려워져요</b>. 판은 그대로예요.'
];

/* ④ 마무리 — 지도서 11~12차시 학습 내용 정리 */
const HP_FIN = [
  '빠른 경제성장으로 발생한 문제는 그대로 두어도 경제가 지속적으로 발전해요',
  '빠른 경제성장으로 발생한 문제는 정부만 해결할 수 있어요',
  '빠른 경제성장으로 발생한 여러 가지 문제를 해결해야 우리나라 경제가 지속적으로 발전할 수 있어요'
];
const HP_FIN_OK = 2;
const HP_FIN_NO = [
  '경고등이 켜진 채로 두면 어떻게 되는지 떠올려 봐요. 오늘의 정리를 다시 골라 봐요.',
  '정부뿐 아니라 <b>기업, 근로자, 시민 단체, 개인</b>도 함께 노력해요. 오늘의 정리를 다시 골라 봐요.',
  null
];

/* 안내 */
const HP_LOCK = '수첩 <b>세 줄이 모두 섰어요</b>. 점수판은 이대로 둬요. 판을 읽어 봐요. 판은 그대로예요.';
const HP_EMPTY = '아직 <b>빈칸</b>이 있어요. 아홉 칸에 점수를 다 매긴 뒤에 검토할 수 있어요. 판은 그대로예요.';
const HP_TIE = '합계가 가장 높은 방안이 <b>둘 이상</b>이에요. 점수를 바꿔 하나가 가장 높게 만든 뒤 검토해요. 판은 그대로예요.';
const HP_AGAIN = '그 방안이 가장 좋은 판은 <b>이미 검토했어요</b>. 점수를 바꿔 다른 방안이 가장 높게 만들어 봐요. 판은 그대로예요.';
const HP_ORDER_R = '아직 <b>수첩 세 줄</b>이 다 서지 않았어요. 세 방안이 각각 가장 높게 되는 판을 검토한 뒤에 읽을 수 있어요. 판은 그대로예요.';
const HP_READ_AGAIN = '<b>이미 판을 읽었어요.</b> 판은 그대로예요.';
const HP_ORDER_K = '아직 <b>판을 읽지 않았어요.</b> 판을 먼저 읽어 봐요. 판은 그대로예요.';
const HP_MEAN_AGAIN = '어떤 노력을 하고 있는지는 <b>이미 골랐어요</b>. 판은 그대로예요.';
const HP_ORDER_F = '아직 <b>어떤 노력을 하고 있는지</b> 고르지 않았어요. 먼저 골라 봐요. 판은 그대로예요.';
const HP_ALL_MSG = '수첩 <b>세 줄이 모두 섰어요</b>. 판을 읽어 봐요.';

/* 칸 — 방안 p · 기준 c 의 두 비트 */
function hpShift(p,c){ return 2*(3*p + c); }
function hpAt(st,p,c){ return HP_VAL[st.hpPt >> hpShift(p,c) & 3]; }
function hpFull(st){ return [0,1,2].every(p=>[0,1,2].every(c=>hpAt(st,p,c)>0)); }
/* ★ 합계 — 한 줄 */
function hpSum(st,p){ return hpAt(st,p,0) + hpAt(st,p,1) + hpAt(st,p,2); }
/* ★★ 최고 방안 — 한 줄(다 차고 최고가 하나일 때만 · 아니면 -1) */
function hpBest(st){ const s=[0,1,2].map(p=>hpSum(st,p)), m=Math.max(s[0],s[1],s[2]); return (hpFull(st) && s.filter(v=>v===m).length===1) ? s.indexOf(m) : -1; }
function hpHas(st,p){ return (st.hpLog & (1<<p))!==0; }
function hpLines(st){ return [0,1,2].filter(p=>hpHas(st,p)).length; }
function hpAll(st){ return st.hpLog===HP_ALL; }
function hpPlanOf(p){ return HP_PLAN[p]; }

function hpGrid(st){
  const best=hpBest(st), full=hpFull(st);
  let h=`<div class="hp-grid" data-best="${best}" data-full="${full?1:0}"><div class="hp-crit" style="justify-content:center">기준 \\ 방안</div>`;
  h+=HP_PLAN.map((pl,p)=>`<div class="hp-plan${best===p?' best':''}" data-plan="${p}">${pl.i} ${pl.s}</div>`).join('');
  HP_CRIT.forEach((cr,c)=>{ h+=`<div class="hp-crit" data-crit="${c}">${cr}</div>`;
    h+=HP_PLAN.map((pl,p)=>{ const v=hpAt(st,p,c);
      return `<button class="hp-cell${v?'':' none'}" data-cell="${p}-${c}" data-v="${v}" onclick="hpTap(${p},${c})">${v?v+'점':'빈칸'}<span class="st">${v?'\u2605'.repeat((v+1)/2):'\u2610'}</span></button>`; }).join(''); });
  h+=`<div class="hp-crit">합계</div>`;
  h+=HP_PLAN.map((pl,p)=>`<div class="hp-sum${best===p?' best':''}${full?'':' none'}" data-sum="${p}" data-total="${full?hpSum(st,p):-1}">${full?hpSum(st,p)+'점':'\u2014'}</div>`).join('');
  return h+`</div>`;
}
function hpNotes(st){
  return HP_PLAN.map((pl,p)=>{ const on=hpHas(st,p);
    return `<div class="hp-line${on?' set':''}" data-line="${p}">${on?'\u2714 「'+pl.s+'」가 가장 높은 판을 검토했어요':'「'+pl.s+'」가 가장 높은 판 \u2014 아직 검토하지 않았어요'}</div>`; }).join('');
}

function hpBoard(st){
  const fin = st.hpFin!=null, all = hpAll(st), best=hpBest(st);
  const head = fin ? '문제의 해결 방안을 기준에 따라 검토해 봤어요'
    : st.hpMean!=null ? '어떤 노력을 하고 있는지까지 골랐어요 \u2014 이제 정리해요'
    : st.hpRead!=null ? '어떤 노력을 하고 있는지 골라 봐요'
    : all ? '수첩 세 줄이 모두 섰어요 \u2014 판을 읽어 봐요'
    : best>=0 ? '가장 높은 방안이 하나예요 \u2014 검토해 봐요'
    : hpFull(st) ? '아홉 칸이 다 찼어요 \u2014 합계를 견줘 봐요'
    : '아홉 칸에 점수를 매겨 봐요';
  const say = best>=0 ? `<div class="hp-say best">합계가 가장 높은 방안은 「${hpPlanOf(best).s}」예요.</div>`
    : hpFull(st) ? `<div class="hp-say">합계가 가장 높은 방안이 둘 이상이에요.</div>`
    : `<div class="hp-say">칸을 누를 때마다 1점 \u2192 3점 \u2192 5점으로 바뀌어요.</div>`;
  return `<div class="hp-board" data-pt="${st.hpPt}" data-log="${st.hpLog}" data-lines="${hpLines(st)}" data-all="${all?1:0}" data-read="${st.hpRead==null?-1:st.hpRead}" data-mean="${st.hpMean==null?-1:st.hpMean}" data-fin="${fin?1:0}">
    <div class="hp-head">${head}</div>
    ${hpGrid(st)}
    ${say}
    <button class="hp-look" data-look="1" onclick="hpCheck()">\uD83D\uDD0E 검토하기 \u2014 가장 높은 방안을 수첩에 적어요</button>
    <div class="hp-note">${hpNotes(st)}</div>
  </div>`;
}

  } else if(st.hpMean!=null){

    right += `<div class="hp-fin">${HP_FIN.map((t,k)=>`<button class="${st.hpWrongF===k?'no':''}" onclick="hpFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.hpRead!=null){
    right += `<div class="dw-step">\uD83E\uDD14 핵심 질문</div>`;
    right += `<div class="hp-mean">${HP_MEAN.map((t,k)=>`<button class="${st.hpWrongK===k?'no':''}" onclick="hpMeanPick(${k})">${t}</button>`).join('')}</div>`;

  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="hp-read">${HP_READ.map((t,k)=>`<button class="${st.hpWrongR===k?'no':''}" onclick="hpReadPick(${k})">${t}</button>`).join('')}</div>`;

  }

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCCB 점수판을 채워 해결 방안을 검토해요</b></div>

  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>

    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

  state.hpWarn=true; state.hpBusy=true; state.hpMsg=msg;
  playThud(); hpRender();
  setTimeout(()=>{ state.hpBusy=false; state.hpWarn=false; state.hpMsg=null;
    state.hpWrongR=null; state.hpWrongK=null; state.hpWrongF=null; hpRender(); },1600);
}
/* ★ 검토한 기록 — 더하기만 하는 자리 단 하나 */
function hpNote(p){ state.hpLog |= (1 << p); }

/* ① 칸 — 빈칸 → 1 → 3 → 5 → 1 */
function hpTap(p,c){
  if(state.hpFin!=null) return;                                        // 가드①
  if(state.hpBusy) return;                                             // 가드⑧
  if(!Number.isInteger(p) || p<0 || p>=HP_N) return;                   // 가드②
  if(!Number.isInteger(c) || c<0 || c>=HP_CRIT.length) return;         // 가드②
  if(hpAll(state)){ hpHold(HP_LOCK); return; }                         // 가드③ 판 불변
  const sh = hpShift(p,c), v = state.hpPt >> sh & 3;
  state.hpPt = (state.hpPt & ~(3 << sh)) | (((v % 3) + 1) << sh);     // ★ 칸이 바뀌는 자리 단 하나
  state.hpWarn=false; state.hpMsg=null; playBlip(); hpRender();
}

/* ② 검토 — 아홉 칸이 다 차고 최고가 하나일 때만(가드⑨) */
function hpCheck(){
  if(state.hpFin!=null) return;                                        // 가드①
  if(state.hpBusy) return;                                             // 가드⑧
  if(hpAll(state)){ hpHold(HP_LOCK); return; }                         // 가드③ 판 불변
  if(!hpFull(state)){ hpHold(HP_EMPTY); return; }                      // 가드⑨ 빈칸 — 판 불변
  const b = hpBest(state);
  if(b<0){ hpHold(HP_TIE); return; }                                   // 가드⑨ 동점 — 판 불변
  if(hpHas(state,b)){ hpHold(HP_AGAIN); return; }                      // 가드⑨ 이미 선 줄 — 판 불변
  hpNote(b);
  state.hpWarn=false;
  if(hpAll(state)){ state.hpMsg = HP_ALL_MSG; playChime(); }
  else { state.hpMsg = `「${hpPlanOf(b).s}」가 가장 높은 판을 수첩에 적었어요. 점수를 바꿔 다른 방안이 가장 높게 되는 판도 검토해 봐요.`; playChime(); }
  hpRender();
}

/* ③ 판 읽기 — 수첩 세 줄 뒤에만(가드④). */
function hpReadPick(k){
  if(state.hpFin!=null) return;                                        // 가드①
  if(state.hpBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HP_READ.length) return;         // 가드②
  if(!hpAll(state)){ hpHold(HP_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.hpRead!=null){ hpHold(HP_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===HP_READ_OK){
    state.hpRead=k; state.hpWrongR=null; state.hpWarn=false;
    state.hpMsg = '판을 잘 읽었어요. 같은 방안이라도 <b>기준</b>에 따라 가장 좋은 방안이 달라져요. 그래서 평가 기준이 중요해요.';
    playChime(); hpRender(); return;
  }
  state.hpWrongR=k;
  hpHold(HP_READ_NO[k]);
}

/* ④ 핵심 질문 — 판을 읽은 뒤에만(가드⑤). */
function hpMeanPick(k){
  if(state.hpFin!=null) return;                                        // 가드①
  if(state.hpBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HP_MEAN.length) return;         // 가드②
  if(state.hpRead==null){ hpHold(HP_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.hpMean!=null){ hpHold(HP_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==HP_MEAN_OK){ state.hpWrongK=k; hpHold(HP_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.hpMean = k;                                                    // ★ 핵심 질문을 고르는 자리 단 하나
  state.hpWarn=false;
  state.hpMsg = '<b>정부, 기업과 근로자, 시민 단체와 개인</b>이 함께 노력해요.';
  playChime(); hpRender();
}

/* ⑤ 마무리 — 지도서 11~12차시 학습 내용 정리 */
function hpFinish(k){
  if(state.hpFin!=null) return;                                        // 가드①
  if(state.hpBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HP_FIN.length) return;          // 가드②
  if(state.hpMean==null){ hpHold(HP_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===HP_FIN_OK){
    state.hpFin=k; state.hpWrongF=null; state.hpMsg=null; state.hpWarn=false;
    playChime(); hpRender(); return;
  }
  state.hpWrongF=k;
  hpHold(HP_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u2_l09_배에실어요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

@media(max-width:420px){ .jt-notes,.jt-pile{grid-template-columns:1fr} .jt-n,.jt-s,.jt-slot{font-size:8.6px;padding:3px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

function JT_NO(s,r){ return `고른 조각은 <b>${JT_REG[r]}</b> 쪽지에 맞지 않아요. 조각의 낱말을 다시 읽고 알맞은 쪽지를 찾아봐요. 판은 그대로예요.`; }

function jtHas(st,s){ return (st.jtLog & (1<<s))!==0; }
/* ★ 붙일 수 있는지 — 한 줄 · 조각의 쪽지 자리일 때만 */
function jtFit(s,r){ return JT_TO[s]===r; }
function jtSlot(st,r,k){ return [0,1,2,3,4,5,6,7].find(s=>jtHas(st,s) && JT_TO[s]===r && JT_KIND[s]===k); }
function jtSit(st,r){ return jtSlot(st,r,0)!==undefined; }
function jtWhy(st,r){ return jtSlot(st,r,1)!==undefined; }
function jtCount(st){ return [0,1,2,3,4,5,6,7].filter(s=>jtHas(st,s)).length; }
function jtDone(st){ return [0,1,2,3].filter(r=>jtSit(st,r) && jtWhy(st,r)).length; }
function jtAll(st){ return st.jtLog===JT_ALL; }

function jtMap(st){
  const P=[[110,34],[150,84],[178,44],[290,96]];
  const pins=P.map((p,r)=>{ const f=jtSit(st,r) && jtWhy(st,r);
    return `<g class="jt-pin" data-r="${r}" data-full="${f?1:0}"><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${f?'#059669':'#7C3AED'}" stroke="#fff" stroke-width="1.6"/><text x="${p[0]}" y="${p[1]+3}" font-size="7.4" fill="#fff" text-anchor="middle" font-weight="900">${r+1}</text></g>`; }).join('');
  return `<svg viewBox="0 0 320 124" data-done="${jtDone(st)}"><rect width="320" height="124" fill="#E0F2FE"/>
    <ellipse cx="116" cy="34" rx="30" ry="18" fill="#BBF7D0" stroke="#047857" stroke-width="1"/>
    <ellipse cx="140" cy="88" rx="30" ry="30" fill="#BBF7D0" stroke="#047857" stroke-width="1"/>
    <ellipse cx="222" cy="40" rx="62" ry="28" fill="#BBF7D0" stroke="#047857" stroke-width="1"/>
    <ellipse cx="258" cy="104" rx="22" ry="11" fill="#BBF7D0" stroke="#047857" stroke-width="1"/>
    <ellipse cx="178" cy="46" rx="8" ry="10" fill="#7DD3FC" stroke="#0369A1" stroke-width="1"/>
    ${pins}</svg>`;
}
function jtNotes(st){
  return JT_REG.map((t,r)=>{ const a=jtSlot(st,r,0), b=jtSlot(st,r,1);
    const sl=(x,k)=>`<span class="jt-slot${x!==undefined?' set':''}" data-k="${k}">${JT_KNAME[k]}: ${x!==undefined?JT_STRIP[x]:'\u2610 아직 비었어요'}</span>`;
    return `<button class="jt-n" data-r="${r}" data-sit="${a!==undefined?1:0}" data-why="${b!==undefined?1:0}" onclick="jtStick(${r})"><span class="jt-rg">\uD83D\uDCCC ${r+1}. ${t}</span>${sl(a,0)}${sl(b,1)}</button>`; }).join('');
}
function jtPile(st){
  return JT_STRIP.map((t,s)=>{ const on=st.jtSel===s?1:0, u=jtHas(st,s)?1:0;
    return `<button class="jt-s" data-s="${s}" data-k="${JT_KIND[s]}" data-on="${on}" data-used="${u}" onclick="jtPick(${s})"><span class="jt-k">${JT_KNAME[JT_KIND[s]]}</span>${t}</button>`; }).join('');
}

function jtBoard(st){
  const fin = st.jtFin!=null, all = jtAll(st), sel = st.jtSel<8;
  const head = fin ? '쪽지를 붙여 지구촌 문제를 조사하고 정리했어요'
    : st.jtMean!=null ? '꼭! 기억해요 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.jtRead!=null ? '꼭! 기억해요 빈칸을 채워 봐요'
    : all ? '네 쪽지를 모두 채웠어요 \u2014 판을 읽어 봐요'
    : st.jtLog!==0 ? '남은 조각도 골라 알맞은 쪽지에 붙여 봐요'
    : '조사 조각을 고르고 알맞은 쪽지에 붙여요';
  return `<div class="jt-board" data-sel="${st.jtSel}" data-log="${st.jtLog}" data-cnt="${jtCount(st)}" data-done="${jtDone(st)}" data-all="${all?1:0}" data-read="${st.jtRead==null?-1:st.jtRead}" data-mean="${st.jtMean==null?-1:st.jtMean}" data-fin="${fin?1:0}">
    <div class="jt-head">${head}</div>
    <div class="jt-map">${jtMap(st)}</div>
    <div class="jt-notes">${jtNotes(st)}</div>
    <div class="jt-say" data-sel="${sel?1:0}">${sel?`고른 조각: <b>${JT_STRIP[st.jtSel]}</b> \u2014 알맞은 쪽지를 눌러 붙여요`:'아래 조사 조각을 하나 골라요'}</div>
    <div class="jt-pile">${jtPile(st)}</div>
    <div class="jt-tally">붙인 조각 ${jtCount(st)} / 8 \u00b7 다 채운 쪽지 ${jtDone(st)} / 4</div>
  </div>`;
}

function jtPanel(st){
  const fin = st.jtFin!=null, all = jtAll(st);
  const q = fin ? '쪽지를 붙이며 지구촌을 위협하는 여러 가지 문제를 조사했어요.'
    : st.jtMean!=null ? '오늘 공부한 내용을 정리해요. 지구촌을 위협하는 문제는 어떻게 조사할 수 있나요?'
    : st.jtRead!=null ? '꼭! 기억해요 \u2014 「지구촌에서 어떤 문제가 나타나고 있으며, (  )은/는 무엇인지 관심을 기울여야 합니다」의 빈칸에 알맞은 말은 무엇일까요?'
    : all ? '네 쪽지를 모두 채웠어요. 세계지도에서 무엇을 알 수 있나요?'
    : st.jtLog!==0 ? '남은 조각도 알맞은 쪽지에 붙여요.'
    : '조사 조각을 세계지도의 붙임쪽지에 붙여 봐요. 지구촌 곳곳에서는 어떤 문제가 나타나고 있을까요?';
  let right = `<div class="jt-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDCCC 쪽지를 붙이며 정리했어요</div>
      지구촌을 위협하는 문제는 <b>문제 생각하기</b>, <b>조사 방법 정하기</b>, <b>문제 상황과 원인 조사하기</b>, <b>내용 정리하기</b>의 순서로 조사할 수 있어요.
      지구촌 곳곳에서 여러 문제가 나타나고 있고, 지구촌에서 나타나는 문제는 <b>우리 모두의 문제</b>예요.<br>
      <span style="color:#64748B">판의 세계지도와 쪽지는 도식이에요. 실제로는 지구촌 곳곳에서 더 많은 문제가 나타나요.
      <b>책, 신문, 누리집, 영상으로 직접 조사하기</b>, <b>활동 자료의 붙임쪽지 쓰기</b>, <b>세계지도에 붙이기</b>, <b>모둠별로 발표하기</b>, <b>느낀 점 쓰기</b>, <b>패스트 패션 영상 보기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.jtMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="jt-fin">${JT_FIN.map((t,k)=>`<button class="${st.jtWrongF===k?'no':''}" onclick="jtFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.jtRead!=null){
    right += `<div class="dw-step">\uD83D\uDCCC 꼭! 기억해요 빈칸</div>`;
    right += `<div class="jt-mean">${JT_MEAN.map((t,k)=>`<button class="${st.jtWrongK===k?'no':''}" onclick="jtMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="jt-hint">쪽지의 두 칸을 떠올려 봐요. 한 칸은 문제 상황이었어요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="jt-read">${JT_READ.map((t,k)=>`<button class="${st.jtWrongR===k?'no':''}" onclick="jtReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDCCC 쪽지를 붙여요</div>`;
    right += `<div class="jt-hint">아래 <b>조사 조각</b>을 누르면 조각을 집어요. 같은 조각을 다시 누르면 내려놓아요. 조각을 집은 채로 <b>붙임쪽지</b>를 누르면, 알맞은 쪽지일 때 조각이 붙어요. 쪽지마다 <b>문제 상황</b>을 먼저 붙이고 그다음 아래 칸을 채워요. 네 쪽지를 모두 채우면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.jtMsg) right += `<div class="dw-msg${st.jtWarn?' warn':''}">${st.jtMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCCC 쪽지를 붙여요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${jtBoard(st)}<div class="cvcap">판의 세계지도와 쪽지는 <b>도식</b>이에요. 핀 자리는 대략이고, 쪽지 넷은 교과서와 지도서의 조사 예시예요. 실제로는 지구촌 곳곳에서 더 많은 문제가 나타나요. 판은 문제의 크기를 재지 않아요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u3_l06";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  jtSel:8, jtLog:0,
  jtRead:null, jtMean:null, jtFin:null,
  jtWrongR:null, jtWrongK:null, jtWrongF:null,
  jtMsg:null, jtWarn:false, jtBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function jtRender(){ main.innerHTML = slides[state.idx].render(state); }
function jtHold(msg){
  state.jtWarn=true; state.jtBusy=true; state.jtMsg=msg;
  playThud(); jtRender();
  setTimeout(()=>{ state.jtBusy=false; state.jtWarn=false; state.jtMsg=null;
    state.jtWrongR=null; state.jtWrongK=null; state.jtWrongF=null; jtRender(); },1600);
}
/* ★ 붙인 기록 — 더하기만 하는 자리 단 하나 */
function jtNote(s){ state.jtLog |= (1 << s); }

/* ① 조사 조각 — 조각을 집거나(고름) 같은 조각을 다시 눌러 내려놓음 */
function jtPick(s){
  if(state.jtFin!=null) return;                                        // 가드①
  if(state.jtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(s) || s<0 || s>=JT_N) return;                   // 가드②
  if(jtAll(state)){ jtHold(JT_LOCK); return; }                         // 가드③ 판 불변
  if(jtHas(state,s)){ jtHold(JT_AGAIN); return; }                      // 가드⑨ 이미 붙인 조각 — 판 불변
  state.jtSel = (state.jtSel===s) ? 8 : s;                             // ★ 조각을 고르는 자리 단 하나
  state.jtWarn=false; state.jtMsg=null; playBlip(); jtRender();
}

/* ② 붙임쪽지 — 조각을 골랐고(가드⑩) 원인이면 상황이 먼저 붙었고(가드⑫) 알맞은 쪽지일 때만(가드⑪) 붙인다 */
function jtStick(r){
  if(state.jtFin!=null) return;                                        // 가드①
  if(state.jtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(r) || r<0 || r>=JT_R) return;                   // 가드②
  if(jtAll(state)){ jtHold(JT_LOCK); return; }                         // 가드③ 판 불변
  const s = state.jtSel;
  if(s===8){ jtHold(JT_PICK); return; }                                // 가드⑩ 조각을 고르지 않음 — 판 불변
  if(JT_KIND[s]===1 && !jtSit(state,r)){ jtHold(JT_FIRST); return; }   // 가드⑫ 상황 먼저 — 짝 판정보다 먼저 봄 · 판 불변
  if(!jtFit(s,r)){ jtHold(JT_NO(s,r)); return; }                       // 가드⑪ 맞지 않는 쪽지 — 판 불변
  jtNote(s); state.jtSel = 8;
  state.jtWarn=false;
  if(jtAll(state)){ state.jtMsg = JT_ALL_MSG; playChime(); }
  else { state.jtMsg = `붙였어요 \u2014 <b>${JT_REG[r]}</b> 쪽지의 ${JT_KNAME[JT_KIND[s]]} 칸이에요. ${(jtSit(state,r) && jtWhy(state,r))?'이 쪽지를 다 채웠어요.':'이 쪽지의 남은 칸도 채워 봐요.'}`; playChime(); }
  jtRender();
}

/* ③ 판 읽기 — 네 쪽지 뒤에만(가드④) */
function jtReadPick(k){
  if(state.jtFin!=null) return;                                        // 가드①
  if(state.jtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JT_READ.length) return;         // 가드②
  if(!jtAll(state)){ jtHold(JT_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.jtRead!=null){ jtHold(JT_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===JT_READ_OK){
    state.jtRead=k; state.jtWrongR=null; state.jtWarn=false;
    state.jtMsg = '판을 잘 읽었어요. 세계지도의 네 쪽지처럼 <b>지구촌 곳곳</b>에서 여러 문제가 나타나고, 쪽지마다 <b>문제 상황</b>과 그 까닭을 함께 적었어요.';
    playChime(); jtRender(); return;
  }
  state.jtWrongR=k;
  jtHold(JT_READ_NO[k]);
}

/* ④ 꼭! 기억해요 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function jtMeanPick(k){
  if(state.jtFin!=null) return;                                        // 가드①
  if(state.jtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JT_MEAN.length) return;         // 가드②
  if(state.jtRead==null){ jtHold(JT_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.jtMean!=null){ jtHold(JT_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==JT_MEAN_OK){ state.jtWrongK=k; jtHold(JT_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.jtMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.jtWarn=false;
  state.jtMsg = '지구촌에서 어떤 문제가 나타나고 있으며, <b>원인</b>은 무엇인지 관심을 기울여야 해요.';
  playChime(); jtRender();
}

/* ⑤ 마무리 — 지도서 8~9차시 주요 내용 정리 */
function jtFinish(k){
  if(state.jtFin!=null) return;                                        // 가드①
  if(state.jtBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JT_FIN.length) return;          // 가드②
  if(state.jtMean==null){ jtHold(JT_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===JT_FIN_OK){
    state.jtFin=k; state.jtWrongF=null; state.jtMsg=null; state.jtWarn=false;
    playChime(); jtRender(); return;
  }
  state.jtWrongF=k;
  jtHold(JT_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u3_l07_함께들어요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

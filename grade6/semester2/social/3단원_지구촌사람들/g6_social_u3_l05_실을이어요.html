   ★★ 실 기록은 |= 만(ytLog · ytNote 단 하나 · 문제 카드 처리기에서만).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 실은 도식이다. */

const YT_MATCH = [2, 3, 0, 1];

function ytHas(st,c){ return (st.ytLog & (1<<c))!==0; }
/* ★ 이을 수 있는지 — 한 줄 · 고른 원인의 짝 자리일 때만 */
function ytFit(c,p){ return YT_MATCH[c]===p; }
function ytTiedP(st,p){ return [0,1,2,3].some(c=>ytHas(st,c) && YT_MATCH[c]===p); }
function ytLines(st){ return [0,1,2,3].filter(c=>ytHas(st,c)).length; }
function ytAll(st){ return st.ytLog===YT_ALL; }

function ytCards(st){
  const L = YT_CAUSE.map((t,c)=>{ const on=st.ytSel===c?1:0, td=ytHas(st,c)?1:0;
    return `<button class="yt-c" data-c="${c}" data-on="${on}" data-tied="${td}" onclick="ytPick(${c})">${t}</button>`; }).join('');
  const R = YT_PROB.map((t,p)=>{ const td=ytTiedP(st,p)?1:0;
    return `<button class="yt-p" data-p="${p}" data-tied="${td}" onclick="ytTie(${p})">${t}</button>`; }).join('');
  return {L,R};
}
function ytThread(st){
  const y=i=>15+i*30;
  const lines=[0,1,2,3].filter(c=>ytHas(st,c)).map(c=>`<path class="yt-str" data-c="${c}" d="M0 ${y(c)} C24 ${y(c)} 22 ${y(YT_MATCH[c])} 46 ${y(YT_MATCH[c])}" fill="none" stroke="#059669" stroke-width="2.4"/>`).join('');
  const hold=st.ytSel<4?`<circle class="yt-knot" cx="4" cy="${y(st.ytSel)}" r="4" fill="#7C3AED"/>`:'';
  return `<svg viewBox="0 0 46 120" preserveAspectRatio="none" data-sel="${st.ytSel}" data-str="${ytLines(st)}"><rect width="46" height="120" fill="#F8FAFC"/>${lines}${hold}</svg>`;
}
function ytNotes(st){
  return YT_CAUSE.map((t,c)=>{ const on=ytHas(st,c);
    return `<div class="yt-line${on?' set':''}" data-line="${c}">${on?'\u270F\uFE0F '+t+' \u2192 '+YT_PROB[YT_MATCH[c]]+' \u2014 '+YT_EFF[c]+' \u00b7 '+YT_EX[c]:'\u2610 '+t+' \u2014 아직 잇지 않았어요'}</div>`; }).join('');
}

function ytBoard(st){
  const fin = st.ytFin!=null, all = ytAll(st), sel = st.ytSel<4;
  const head = fin ? '실을 이어 지구촌 문제를 살펴보고 정리했어요'
    : st.ytMean!=null ? '꼭! 기억해요 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.ytRead!=null ? '꼭! 기억해요 빈칸을 채워 봐요'
    : all ? '네 실을 모두 이었어요 \u2014 판을 읽어 봐요'
    : st.ytLog!==0 ? '다른 원인 카드도 골라 실을 이어 봐요'
    : '원인 카드를 고르고 알맞은 문제 카드에 실을 이어요';
  const k = ytCards(st);
  return `<div class="yt-board" data-sel="${st.ytSel}" data-log="${st.ytLog}" data-lines="${ytLines(st)}" data-all="${all?1:0}" data-read="${st.ytRead==null?-1:st.ytRead}" data-mean="${st.ytMean==null?-1:st.ytMean}" data-fin="${fin?1:0}">
    <div class="yt-head">${head}</div>
    <div class="yt-web"><div class="yt-col">${k.L}</div><div class="yt-mid">${ytThread(st)}</div><div class="yt-col">${k.R}</div></div>
    <div class="yt-say" data-sel="${sel?1:0}">${sel?`고른 원인: <b>${YT_CAUSE[st.ytSel]}</b> \u2014 알맞은 문제 카드를 눌러 실을 이어요`:'왼쪽 원인 카드를 하나 골라요'}</div>
    <div class="yt-note"><div class="nh">\uD83D\uDCD2 지구촌 문제 기록장</div>${ytNotes(st)}</div>
  </div>`;
}

function ytPanel(st){

  const q = fin ? '실을 이어 지구촌을 위협하는 여러 가지 문제를 살펴봤어요.'

  } else if(st.ytMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="yt-fin">${YT_FIN.map((t,k)=>`<button class="${st.ytWrongF===k?'no':''}" onclick="ytFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.ytRead!=null){
    right += `<div class="dw-step">\uD83D\uDCCC 꼭! 기억해요 빈칸</div>`;
    right += `<div class="yt-mean">${YT_MEAN.map((t,k)=>`<button class="${st.ytWrongK===k?'no':''}" onclick="ytMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="yt-hint">판에서 화석 연료 카드와 이은 문제 카드의 이름을 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="yt-read">${YT_READ.map((t,k)=>`<button class="${st.ytWrongR===k?'no':''}" onclick="ytReadPick(${k})">${t}</button>`).join('')}</div>`;

  }
  if(st.ytMsg) right += `<div class="dw-msg${st.ytWarn?' warn':''}">${st.ytMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83E\uDDF5 실을 이어요</b></div>

function questionHTML(q,i,st){

let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function ytHold(msg){
  state.ytWarn=true; state.ytBusy=true; state.ytMsg=msg;

  setTimeout(()=>{ state.ytBusy=false; state.ytWarn=false; state.ytMsg=null;

function ytPick(c){
  if(state.ytFin!=null) return;                                        // 가드①
  if(state.ytBusy) return;                                             // 가드⑧
  if(!Number.isInteger(c) || c<0 || c>=YT_N) return;                   // 가드②
  if(ytAll(state)){ ytHold(YT_LOCK); return; }                         // 가드③ 판 불변

  state.ytSel = (state.ytSel===c) ? 4 : c;                             // ★ 원인을 고르는 자리 단 하나
  state.ytWarn=false; state.ytMsg=null; playBlip(); ytRender();
}

function ytTie(p){
  if(state.ytFin!=null) return;                                        // 가드①

  if(!Number.isInteger(p) || p<0 || p>=YT_N) return;                   // 가드②
  if(ytAll(state)){ ytHold(YT_LOCK); return; }                         // 가드③ 판 불변
  const c = state.ytSel;
  if(c===4){ ytHold(YT_PICK); return; }                                // 가드⑩ 원인을 고르지 않음 — 판 불변
  if(!ytFit(c,p)){ ytHold(YT_NO(c,p)); return; }                       // 가드⑪ 짝이 아님 — 판 불변
  ytNote(c); state.ytSel = 4;
  state.ytWarn=false;
  if(ytAll(state)){ state.ytMsg = YT_ALL_MSG; playChime(); }
  else { state.ytMsg = `이었어요 \u2014 ${YT_CAUSE[c]} \u2192 <b>${YT_PROB[p]}</b>. ${YT_EFF[c]}. 다른 원인 카드도 골라 봐요.`; playChime(); }
  ytRender();
}

/* ③ 판 읽기 — 네 실 뒤에만(가드④) */
function ytReadPick(k){
  if(state.ytFin!=null) return;                                        // 가드①
  if(state.ytBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YT_READ.length) return;         // 가드②
  if(!ytAll(state)){ ytHold(YT_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.ytRead!=null){ ytHold(YT_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===YT_READ_OK){
    state.ytRead=k; state.ytWrongR=null; state.ytWarn=false;
    state.ytMsg = '판을 잘 읽었어요. 지구촌 문제는 <b>사람들의 활동과 전쟁, 재난</b> 같은 까닭으로 나타나 <b>동식물과 사람의 삶</b>에 영향을 미쳐요.';
    playChime(); ytRender(); return;
  }
  state.ytWrongR=k;
  ytHold(YT_READ_NO[k]);
}

/* ④ 꼭! 기억해요 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function ytMeanPick(k){
  if(state.ytFin!=null) return;                                        // 가드①
  if(state.ytBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YT_MEAN.length) return;         // 가드②
  if(state.ytRead==null){ ytHold(YT_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.ytMean!=null){ ytHold(YT_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==YT_MEAN_OK){ state.ytWrongK=k; ytHold(YT_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.ytMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.ytWarn=false;
  state.ytMsg = '지구촌에는 자원과 에너지 고갈, 생태계 파괴, <b>기후변화</b>, 난민 등의 문제가 나타나고 있어요.';
  playChime(); ytRender();
}

/* ⑤ 마무리 — 지도서 7차시 주요 내용 정리 */
function ytFinish(k){
  if(state.ytFin!=null) return;                                        // 가드①
  if(state.ytBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=YT_FIN.length) return;          // 가드②
  if(state.ytMean==null){ ytHold(YT_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===YT_FIN_OK){
    state.ytFin=k; state.ytWrongF=null; state.ytMsg=null; state.ytWarn=false;
    playChime(); ytRender(); return;
  }
  state.ytWrongF=k;
  ytHold(YT_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 6차시(u3 l06) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

직접조작: 「돋보기를 옮겨요」 판 (교과서 125~127쪽 · 지도서 2~3차시 발문)
  ⭐ 씨앗은 지도서 274쪽 발문 — 동아시아와 남부 아시아(기후가 온화한 평야 · 농업) · 서부 유럽(산업 · 일자리 · 교통) ·
     사하라 사막(강수량이 매우 적음) · 알래스카(기온이 매우 낮음). 교과서 125쪽 「인구 분포에 영향을 주는 요인」.
  ⭐ 돋보기 옮기기 단추·까닭 카드 넘기기 단추 둘(hxTap) — 판 바꾸는 자리 state.hxGate = 단 하나(지역 + 4 × 까닭).
  ⭐ ★ 돋보기 속 지역과 고른 까닭이 맞는지는 `hxKind` 한 줄(표 `HX_MATCH` = [1,3,2,0]) — 맞으면 지역 번호 · 아니면 4(핀을 꽂을 수 없음).
  ⭐ ★★ 핀 기록은 `state.hxLog |=` 단 하나(`hxNote` · 핀 꽂기 처리기에서만 · 줄지 않음) — 핀 네 개 최소 걸음(BFS).
  ⭐ 판에는 어느 까닭이 맞는지 표시하지 않는다(DOM 에 맞는 까닭 자리 0) — 점의 많고 적음과 지역의 환경을 견주어 찾는다.
  ⭐ 판 읽기는 핀 네 개 뒤에만(정답 자리 1) → 꼭! 기억해요 빈칸 3택(교과서 128쪽 「자연환경」 · 정답 자리 0)
     → 마무리 3택 = 지도서 2~3차시 주요 내용 정리(세계의 인구 분포 · 정답 자리 2).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 핀 네 개가 꽂힌 뒤 판 움직이기(돋보기·까닭·핀) 무시 — 판 불변
     ④ 핀 네 개 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시
     ⑥ 빈칸 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`hxBusy`)
     ⑨ 이미 핀을 꽂은 지역에 다시 꽂기 무시 — 판 불변
     ⑩ 맞지 않는 까닭으로 핀 꽂기 무시 — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.hx-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 지도와 점은 도식이다** — 실제 인구 분포 지도가 아니고, 점의 개수는 인구수가 아니라 많고 적음만 나타낸다(캡션 상시).
  ㉡ **지역 표시는 대략의 자리일 뿐**이다 — 경계·거리·면적 0.
  ㉢ **판은 맞는 까닭이 어디 있는지 알려 주지 않는다** — 맞지 않는 까닭을 고르면 「맞지 않아요」라고만 알린다.

.hx-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .hx-gate{gap:3px} .hx-ctl,.hx-card,.hx-line{font-size:8.4px;padding:3px} .hx-lens .ring{width:48px;height:48px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

  lat:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#F8FAFC"/>

function hxAreaOf(st){ return st.hxGate % 4; }
function hxWhyOf(st){ return (st.hxGate / 4) | 0; }
/* ★ 돋보기 속 지역과 고른 까닭이 맞는지 — 한 줄(표 HX_MATCH) · 맞으면 지역 번호 · 아니면 4 */
function hxKind(st){ return HX_MATCH[hxAreaOf(st)] === hxWhyOf(st) ? hxAreaOf(st) : 4; }
function hxHas(st,l){ return (st.hxLog & (1<<l))!==0; }
function hxPins(st){ return [0,1,2,3].filter(l=>hxHas(st,l)).length; }
function hxAll(st){ return st.hxLog===HX_ALL; }

function hxCtls(st){
  const r=hxAreaOf(st), y=hxWhyOf(st);
  return `<button class="hx-ctl" data-a="0" data-lv="${r}" onclick="hxTap(0)"><span>\uD83D\uDD0D 돋보기 옮기기</span><span class="dot">${[0,1,2,3].map(i=>`<i class="${r===i?'on':''}"></i>`).join('')}</span><span class="st">${HX_AREA[r]}</span></button>`
    + `<button class="hx-ctl" data-a="1" data-lv="${y}" onclick="hxTap(1)"><span>\uD83C\uDCCF 까닭 카드 넘기기</span><span class="dot">${[0,1,2,3].map(i=>`<i class="${y===i?'on':''}"></i>`).join('')}</span><span class="st">${HX_NO[y]} 카드</span></button>`;
}
function hxMap(st){
  const r=hxAreaOf(st);
  return `<svg viewBox="0 0 320 150"><rect width="320" height="150" fill="#EFF6FF"/>${HX_LAND}
    ${HX_AT.map((p,i)=>`<circle class="hx-at" data-at="${i}" data-on="${r===i?1:0}" cx="${p[0]}" cy="${p[1]}" r="${r===i?13:5}" fill="${r===i?'none':'#94A3B8'}" stroke="${r===i?'#5B21B6':'#fff'}" stroke-width="${r===i?3:1.2}"/>${hxHas(st,i)?`<text x="${p[0]}" y="${p[1]-8}" font-size="10" text-anchor="middle">\uD83D\uDCCD</text>`:''}`).join('')}</svg>`;
}
function hxLens(st){
  const r=hxAreaOf(st), m=HX_MANY[r];
  return `<div class="ring" data-many="${m}">${HX_DOTS[m].map(p=>`<b style="left:${p[0]}px;top:${p[1]}px"></b>`).join('')}</div>
    <div class="txt"><div class="hx-area" data-area="${r}">\uD83D\uDD0D ${HX_AREA[r]}</div><div class="hx-many">${HX_MANYTXT[m]}</div></div>`;
}
function hxCards(st){
  const y=hxWhyOf(st);
  return HX_WHY.map((t,i)=>`<div class="hx-card" data-no="${i}" data-pt="${y===i?1:0}"><span class="no">${HX_NO[i]}</span><span>${t}</span></div>`).join('');
}
function hxNotes(st){
  return HX_AREA.map((t,l)=>{ const on=hxHas(st,l);
    return `<div class="hx-line${on?' set':''}" data-line="${l}">${on?'\uD83D\uDCCD '+t+' \u2014 인구가 '+(HX_MANY[l]?'많아요':'적어요')+' \u00b7 까닭: '+HX_WHY[HX_MATCH[l]]:'\u2610 '+t+' \u2014 아직 핀을 꽂지 않았어요'}</div>`; }).join('');
}

function hxBoard(st){
  const fin = st.hxFin!=null, all = hxAll(st), r=hxAreaOf(st), y=hxWhyOf(st);
  const head = fin ? '돋보기로 세계의 인구 분포를 살펴보고 정리했어요'
    : st.hxMean!=null ? '꼭! 기억해요 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.hxRead!=null ? '꼭! 기억해요 빈칸을 채워 봐요'
    : all ? '핀 네 개를 모두 꽂았어요 \u2014 판을 읽어 봐요'
    : st.hxLog!==0 ? '돋보기를 옮겨 다른 지역에도 핀을 꽂아 봐요'
    : '돋보기 속 점을 보고, 알맞은 까닭 카드를 골라 핀을 꽂아요';
  return `<div class="hx-board" data-gate="${st.hxGate}" data-area="${r}" data-why="${y}" data-log="${st.hxLog}" data-pins="${hxPins(st)}" data-all="${all?1:0}" data-read="${st.hxRead==null?-1:st.hxRead}" data-mean="${st.hxMean==null?-1:st.hxMean}" data-fin="${fin?1:0}">
    <div class="hx-head">${head}</div>
    <div class="hx-gate">${hxCtls(st)}</div>
    <div class="hx-map">${hxMap(st)}</div>
    <div class="hx-lens">${hxLens(st)}</div>
    <div class="hx-why">${hxCards(st)}</div>
    <div class="hx-say" data-say="${y}">지금 <b>${HX_NO[y]} 까닭 카드</b>를 골랐어요. 이 까닭이 돋보기 속 지역과 맞을까요?</div>
    <div class="hx-row"><button class="hx-pin" data-pin="1" onclick="hxWrite()">\uD83D\uDCCD 핀 꽂기</button></div>
    <div class="hx-note"><div class="nh">\uD83D\uDDFA\uFE0F 핀 기록장</div>${hxNotes(st)}</div>
  </div>`;
}

function hxPanel(st){
  const fin = st.hxFin!=null, all = hxAll(st);
  const q = fin ? '돋보기로 세계의 인구 분포와 그 까닭을 살펴봤어요.'
    : st.hxMean!=null ? '오늘 공부한 내용을 정리해요. 세계의 인구는 어떻게 분포하나요?'
    : st.hxRead!=null ? '꼭! 기억해요 \u2014 「기온, 강수량, 지형 등 (  )과/와 산업, 교통, 문화 등 인문환경은 세계의 인구 분포에 많은 영향을 줍니다」의 빈칸에 알맞은 말은 무엇일까요?'
    : all ? '핀 네 개를 모두 꽂았어요. 판에서 무엇을 알 수 있나요?'
    : st.hxLog!==0 ? '돋보기를 옮겨 가며 네 지역에 모두 핀을 꽂아요.'
    : '도식 지도의 네 지역에 돋보기를 대 봐요. 인구가 많거나 적은 까닭은 무엇일까요?';
  let right = `<div class="hx-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDD0D 돋보기로 살펴보며 정리했어요</div>
      세계의 인구는 <b>고르게 분포하지 않아요</b>. 기온, 강수량, 지형 등 <b>자연환경</b>과 산업, 교통, 문화 등 <b>인문환경</b>이 인구 분포에 영향을 줘요.
      기후가 온화한 평야나 산업이 발달한 곳에는 인구가 많이, 사막이나 극지방처럼 생활하기 어려운 곳에는 적게 분포해요.<br>
      <span style="color:#64748B">판의 지도와 점은 도식이에요.
      <b>통계 누리집 살펴보기</b>, <b>붙임딱지 붙이기</b>, <b>지도에서 인구가 많은 곳에 ○표 하기</b>, <b>친구와 이야기하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.hxMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="hx-fin">${HX_FIN.map((t,k)=>`<button class="${st.hxWrongF===k?'no':''}" onclick="hxFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.hxRead!=null){
    right += `<div class="dw-step">\uD83D\uDCCC 꼭! 기억해요 빈칸</div>`;
    right += `<div class="hx-mean">${HX_MEAN.map((t,k)=>`<button class="${st.hxWrongK===k?'no':''}" onclick="hxMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="hx-hint">기온, 강수량, 지형은 자연이 만든 환경이에요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="hx-read">${HX_READ.map((t,k)=>`<button class="${st.hxWrongR===k?'no':''}" onclick="hxReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDD0D 돋보기를 옮겨요</div>`;
    right += `<div class="hx-hint"><b>돋보기 옮기기</b> 단추를 누를 때마다 동아시아와 남부 아시아 \u2192 서부 유럽 \u2192 사하라 사막 \u2192 알래스카 \u2192 다시 동아시아와 남부 아시아로 옮겨 가요. <b>까닭 카드 넘기기</b> 단추는 ㉠ \u2192 ㉡ \u2192 ㉢ \u2192 ㉣ 차례로 골라요. 돋보기 속 지역과 맞는 까닭 카드를 고르고 <b>핀 꽂기</b>를 누르면 핀 기록장에 적혀요. 네 지역에 모두 핀을 꽂으면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.hxMsg) right += `<div class="dw-msg${st.hxWarn?' warn':''}">${st.hxMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDD0D 돋보기를 옮겨요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${hxBoard(st)}<div class="cvcap">판의 지도와 점은 <b>도식</b>이에요. 실제 인구 분포 지도가 아니고, 점의 개수는 인구수가 아니라 많고 적음만 나타내요. 지역 표시는 대략의 자리예요. 판은 어느 까닭이 맞는지 미리 알려 주지 않아요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  hxRead:null, hxMean:null, hxFin:null,
  hxWrongR:null, hxWrongK:null, hxWrongF:null,
  hxMsg:null, hxWarn:false, hxBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function hxRender(){ main.innerHTML = slides[state.idx].render(state); }
function hxHold(msg){
  state.hxWarn=true; state.hxBusy=true; state.hxMsg=msg;
  playThud(); hxRender();
  setTimeout(()=>{ state.hxBusy=false; state.hxWarn=false; state.hxMsg=null;
    state.hxWrongR=null; state.hxWrongK=null; state.hxWrongF=null; hxRender(); },1600);
}
/* ★ 핀 기록 — 더하기만 하는 자리 단 하나 */
function hxNote(l){ state.hxLog |= (1 << l); }

/* ① 판 단추 — 0 돋보기 옮기기(동아시아와 남부 아시아 → 서부 유럽 → 사하라 사막 → 알래스카 → 처음) · 1 까닭 카드 넘기기(㉠ → ㉡ → ㉢ → ㉣ → ㉠) */
function hxTap(a){
  if(state.hxFin!=null) return;                                        // 가드①
  if(state.hxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(a) || a<0 || a>=HX_N) return;                   // 가드②
  if(hxAll(state)){ hxHold(HX_LOCK); return; }                         // 가드③ 판 불변
  const r=hxAreaOf(state), y=hxWhyOf(state);
  state.hxGate = a===0 ? (r+1)%4 + 4*y : r + 4*((y+1)%4);              // ★ 판이 바뀌는 자리 단 하나
  state.hxWarn=false; state.hxMsg=null; playBlip(); hxRender();
}

/* ② 핀 꽂기 — 고른 까닭이 맞고(가드⑩) 아직 꽂지 않았을 때만(가드⑨) */
function hxWrite(){
  if(state.hxFin!=null) return;                                        // 가드①
  if(state.hxBusy) return;                                             // 가드⑧
  if(hxAll(state)){ hxHold(HX_LOCK); return; }                         // 가드③ 판 불변
  const l = hxKind(state);
  if(l===4){ hxHold(HX_NOT); return; }                                 // 가드⑩ 맞지 않는 까닭 — 판 불변
  if(hxHas(state,l)){ hxHold(HX_AGAIN); return; }                      // 가드⑨ 이미 꽂은 지역 — 판 불변
  hxNote(l);
  state.hxWarn=false;
  if(hxAll(state)){ state.hxMsg = HX_ALL_MSG; playChime(); }
  else { state.hxMsg = `핀을 꽂았어요 \u2014 ${HX_AREA[l]}에는 인구가 ${HX_MANY[l]?'많아요':'적어요'}. 까닭: ${HX_WHY[HX_MATCH[l]]}. 돋보기를 옮겨 다른 지역도 살펴봐요.`; playChime(); }
  hxRender();
}

/* ③ 판 읽기 — 핀 네 개 뒤에만(가드④) */
function hxReadPick(k){
  if(state.hxFin!=null) return;                                        // 가드①
  if(state.hxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HX_READ.length) return;         // 가드②
  if(!hxAll(state)){ hxHold(HX_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.hxRead!=null){ hxHold(HX_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===HX_READ_OK){
    state.hxRead=k; state.hxWrongR=null; state.hxWarn=false;
    state.hxMsg = '판을 잘 읽었어요. 인구는 <b>고르게 분포하지 않고</b>, 지역의 환경에 따라 많이 사는 곳과 적게 사는 곳이 나뉘어요.';
    playChime(); hxRender(); return;
  }
  state.hxWrongR=k;
  hxHold(HX_READ_NO[k]);
}

/* ④ 꼭! 기억해요 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function hxMeanPick(k){
  if(state.hxFin!=null) return;                                        // 가드①
  if(state.hxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HX_MEAN.length) return;         // 가드②
  if(state.hxRead==null){ hxHold(HX_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.hxMean!=null){ hxHold(HX_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==HX_MEAN_OK){ state.hxWrongK=k; hxHold(HX_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.hxMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.hxWarn=false;
  state.hxMsg = '기온, 강수량, 지형 등 <b>자연환경</b>과 산업, 교통, 문화 등 인문환경은 세계의 인구 분포에 많은 영향을 줘요.';
  playChime(); hxRender();
}

/* ⑤ 마무리 — 지도서 2~3차시 주요 내용 정리 */
function hxFinish(k){
  if(state.hxFin!=null) return;                                        // 가드①
  if(state.hxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=HX_FIN.length) return;          // 가드②
  if(state.hxMean==null){ hxHold(HX_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===HX_FIN_OK){
    state.hxFin=k; state.hxWrongF=null; state.hxMsg=null; state.hxWarn=false;
    playChime(); hxRender(); return;
  }
  state.hxWrongF=k;
  hxHold(HX_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 2차시(u3 l02) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

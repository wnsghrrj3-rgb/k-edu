  ⭐ 씨앗은 교과서 157쪽 스토리보드 예시 — 여섯 장면의 그림(그림 설명)과 글·대사, 156쪽 계획서(제목·주제·대상·줄거리).

  ⭐ ★ 이어진 장면은 `state.jnPut` 한 비트 수(0~63)가 정한다 — 장면별 글 배열 0 · 카드별 사용 배열 0(쓴 카드는 jnPut 에서 읽음).
  ⭐ ★ 글 카드가 그 장면과 이어지는지는 `jnFit` 한 줄(표 `JN_DECK` = [3,0,5,1,2,4] — 카드 자리 → 장면) · 잇는 자리(`state.jnPut |=`)는 코드에 단 하나.
     ★★ 핵심 신규성 = **그림과 글 짝짓기(장면 고정)** — 고른 장면의 그림과 이어지지 않는 글은 붙지 않고, 안내에는 알맞은 카드가 드러나지 않는다.
        이은 장면에는 그 장면이 담은 단원 주제(세계의 인구 분포 · 지구촌의 문제와 지속가능한 미래)가 드러나 셈 줄로 모인다.
  ⭐ 판 읽기는 여섯 장면이 다 이어진 뒤에만(정답 자리 1) → 계획 세우기 빈칸 3택(지도서 347쪽 「독자」 · 정답 자리 2)

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 11종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 여섯 장면이 다 이어진 뒤 장면 고르기·카드 고르기 무시(`JN_LOCK`) — 판 불변
     ④ 다 잇기 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시
     ⑥ 빈칸 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`jnBusy`)
     ⑨ 장면을 고르기 전 카드 무시(`JN_PICK_FIRST`) · 이미 글이 있는 장면 고르기 무시(`JN_FILLED`) — 판 불변
     ⑩ 이미 이은 카드 다시 무시(`JN_USED`) — 판 불변
     ⑪ 고른 장면과 이어지지 않는 글 무시(`JN_NOFIT`) — 판 불변 · 안내에 알맞은 카드 문면 0.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.jn-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 그림 장면은 도식이다** — 판에서는 그림을 그리거나 색칠하지 않는다(캡션 상시).
  ㉡ **계획서와 여섯 장면은 교과서 예시다** — 실제 그림책의 주제와 줄거리는 모둠이 함께 정한다.
  ㉢ **판에 사람 형상 0** — 지구·건물·천막·온도계·재활용 표시·팻말 그림과 번호만.

⚠️ 설계 원칙

function JN_NOFIT(f){ return `고른 글은 <b>${f+1}번 장면</b>의 그림과 이어지지 않아요. 그림 설명을 다시 읽고, 그 장면에서 하고 싶은 말이 무엇인지 생각해 봐요. 판은 그대로예요.`; }

/* ★ 이어진 장면 — 비트 하나 · 카드가 장면과 이어지는지 — 한 줄 */
function jnHas(m,f){ return ((m>>f)&1)===1; }
function jnFit(f,c){ return JN_DECK[c]===f; }
function jnUsed(st,c){ return jnHas(st.jnPut, JN_DECK[c]); }
function jnCount(st){ return [0,1,2,3,4,5].filter(f=>jnHas(st.jnPut,f)).length; }
function jnPartN(st,p){ return [0,1,2,3,4,5].filter(f=>JN_PART[f]===p && jnHas(st.jnPut,f)).length; }
/* ★★ 여섯 장면을 다 잇는 자리 — 단 하나 */
function jnDone(st){ return st.jnPut===JN_ALL; }

function jnPic(f){
  const ic=JN_ICON[f];
  return `<svg viewBox="0 0 100 44"><rect width="100" height="44" fill="#F5F3FF"/>${ic.map((e,k)=>`<text x="${ic.length===1?50:34+k*32}" y="31" font-size="22" text-anchor="middle">${e}</text>`).join('')}</svg>`;
}
function jnFrames(st){
  return `<div class="jn-frames">${[0,1,2,3,4,5].map(f=>{ const put=jnHas(st.jnPut,f), sel=st.jnSel===f;
    return `<button class="jn-f" data-f="${f}" data-put="${put?1:0}" data-sel="${sel?1:0}" onclick="jnFrame(${f})"><span class="jn-no">${f+1}</span>${jnPic(f)}<span class="jn-d">${JN_PIC[f]}</span>${put?`<span class="jn-t">${JN_TXT[f][0]}: ${JN_TXT[f][1]}</span><span class="jn-pt">${JN_PNAME[JN_PART[f]]}</span>`:'<span class="jn-t jn-blank">글\u00b7대사 칸이 비어 있어요</span>'}</button>`; }).join('')}</div>`;
}
function jnCards(st){
  return `<div class="jn-cards">${JN_DECK.map((x,c)=>`<button class="jn-c" data-c="${c}" data-used="${jnUsed(st,c)?1:0}" onclick="jnCard(${c})"><span class="jn-lb">${JN_TXT[x][0]}</span>${JN_TXT[x][1]}</button>`).join('')}</div>`;
}

function jnBoard(st){
  const fin = st.jnFin!=null, done = jnDone(st), n = jnCount(st);
  const head = fin ? '장면을 이어 그림책 스토리보드를 완성했어요'
    : st.jnMean!=null ? '계획 세우기 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.jnRead!=null ? '계획 세우기 빈칸을 채워 봐요'
    : done ? '여섯 장면에 글이 모두 이어졌어요 \u2014 판을 읽어 봐요'
    : st.jnSel!=null ? `${st.jnSel+1}번 장면을 골랐어요 \u2014 어울리는 글 카드를 골라요`
    : n>0 ? '아직 빈 장면을 골라 이어 가요'
    : '그림 장면을 하나 고르고, 그 그림에 어울리는 글 카드를 골라요';
  return `<div class="jn-board" data-put="${st.jnPut}" data-n="${n}" data-sel="${st.jnSel==null?-1:st.jnSel}" data-done="${done?1:0}" data-read="${st.jnRead==null?-1:st.jnRead}" data-mean="${st.jnMean==null?-1:st.jnMean}" data-fin="${fin?1:0}">
    <div class="jn-head">${head}</div>
    <div class="jn-plan">${JN_PLAN.map(r=>`<span class="jn-pk">${r[0]}</span><span>${r[1]}</span>`).join('')}</div>
    ${jnFrames(st)}
    ${jnCards(st)}
    <div class="jn-tally">이은 장면 ${n} / 6 \u00b7 ${JN_PNAME[0]} ${jnPartN(st,0)} / 3 \u00b7 ${JN_PNAME[1]} ${jnPartN(st,1)} / 3</div>
  </div>`;
}

function jnPanel(st){
  const fin = st.jnFin!=null, done = jnDone(st);
  const q = fin ? '그림 장면마다 글을 이어 단원에서 공부한 내용을 담은 그림책 스토리보드를 완성했어요.'
    : st.jnMean!=null ? '오늘 공부한 내용을 정리해요. 그림책 스토리보드는 어떻게 만들까요?'
    : st.jnRead!=null ? '계획 세우기 \u2014 「그림책 제작을 위한 계획을 세울 때는 (  )을/를 정하고, 그 수준에 맞는 내용을 구성해야 합니다」의 빈칸에 알맞은 말은 무엇일까요?'
    : done ? '여섯 장면에 글이 모두 이어졌어요. 판에서 무엇을 알 수 있나요?'
    : jnCount(st)>0 ? '빈 장면에도 글을 이어 가요. 그림과 글이 이야기의 흐름에 맞나요?'
    : '단원에서 공부한 내용을 담은 그림책 스토리보드를 만들어 봐요. 그림 장면마다 어떤 글이 어울릴까요?';
  let right = `<div class="jn-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDCD6 장면을 이어 정리했어요</div>
      <b>스토리보드</b>는 장면을 구성하며 이야기의 흐름을 작성한 것이에요. 판의 여섯 장면은 <b>세계의 인구 분포</b>에서 시작해 <b>지구촌의 문제와 지속가능한 미래</b>로 이어졌어요.
      그림책을 만들 때는 <b>독자의 수준</b>에 맞게 내용을 구성하고, 모둠 친구들과 <b>역할을 나누어</b> 협력해요.<br>
      <span style="color:#64748B">판의 그림 장면과 계획서는 교과서 예시를 나타낸 도식이에요. 판에서는 그림을 그리거나 색칠하지 않았어요.
      <b>그림책 주제 정하기</b>, <b>줄거리 만들기</b>, <b>역할 나누기</b>, <b>장면 그리고 색칠하기</b>, <b>그림책 발표회</b>, <b>느낀 점 이야기하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.jnMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="jn-fin">${JN_FIN.map((t,k)=>`<button class="${st.jnWrongF===k?'no':''}" onclick="jnFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.jnRead!=null){
    right += `<div class="dw-step">\uD83D\uDCCC 계획 세우기 빈칸</div>`;
    right += `<div class="jn-mean">${JN_MEAN.map((t,k)=>`<button class="${st.jnWrongK===k?'no':''}" onclick="jnMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="jn-hint">초성 힌트 \u2014 ㄷ ㅈ. 판의 계획서 「대상」 칸에는 이 그림책을 읽을 사람이 적혀 있어요.</div>`;
  } else if(done){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="jn-read">${JN_READ.map((t,k)=>`<button class="${st.jnWrongR===k?'no':''}" onclick="jnReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDCD6 장면을 이어요</div>`;
    right += `<div class="jn-hint">판의 계획서를 읽고, <b>그림 장면</b>을 하나 골라요.<br>
      \u2460 그림과 그림 설명을 읽어요.<br>
      \u2461 그 장면에 어울리는 <b>글 카드</b>를 골라 이어요. 「글」은 장면을 설명하는 글이고, 「대사」는 등장인물이 하는 말이에요.<br>
      \u2462 여섯 장면을 모두 이으면 그림책 이야기가 완성돼요. 감점은 없어요.</div>`;
  }
  if(st.jnMsg) right += `<div class="dw-msg${st.jnWarn?' warn':''}">${st.jnMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDCD6 장면을 이어요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${jnBoard(st)}<div class="cvcap">판의 그림 장면은 <b>도식</b>이에요. 계획서와 여섯 장면은 교과서에 나온 예시예요. 판에서는 그림을 그리거나 색칠하지 않아요. 실제 그림책의 주제와 줄거리는 모둠이 함께 정해요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

};

  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function jnRender(){ main.innerHTML = slides[state.idx].render(state); }
function jnHold(msg){
  state.jnWarn=true; state.jnBusy=true; state.jnMsg=msg;
  playThud(); jnRender();
  setTimeout(()=>{ state.jnBusy=false; state.jnWarn=false; state.jnMsg=null;
    state.jnWrongR=null; state.jnWrongK=null; state.jnWrongF=null; jnRender(); },1600);
}

/* ① 장면 고르기 — 빈 장면만(가드③·⑨) */
function jnFrame(f){
  if(state.jnFin!=null) return;                                        // 가드①
  if(state.jnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(f) || f<0 || f>=JN_N) return;                   // 가드②
  if(jnDone(state)){ jnHold(JN_LOCK); return; }                        // 가드③ 판 불변
  if(jnHas(state.jnPut,f)){ jnHold(JN_FILLED); return; }               // 가드⑨ 이미 글이 있는 장면 — 판 불변
  state.jnSel = f;                                                     // ★ 장면을 고르는 자리 단 하나
  state.jnWarn=false;
  state.jnMsg = `<b>${f+1}번 장면</b>을 골랐어요. 이 그림에 어울리는 글 카드를 골라요.`;
  playBlip(); jnRender();
}

/* ② 글 카드 — 고른 장면과 이어질 때만 붙는다(가드③·⑨·⑩·⑪) */
function jnCard(c){
  if(state.jnFin!=null) return;                                        // 가드①
  if(state.jnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(c) || c<0 || c>=JN_N) return;                   // 가드②
  if(jnDone(state)){ jnHold(JN_LOCK); return; }                        // 가드③ 판 불변
  if(state.jnSel==null){ jnHold(JN_PICK_FIRST); return; }              // 가드⑨ 장면 먼저 — 판 불변
  if(jnUsed(state,c)){ jnHold(JN_USED); return; }                      // 가드⑩ 이미 이은 카드 — 판 불변
  const f = state.jnSel;
  if(!jnFit(f,c)){ jnHold(JN_NOFIT(f)); return; }                      // 가드⑪ 그림과 이어지지 않음 — 판 불변
  state.jnPut |= (1<<f);                                               // ★ 장면에 글을 잇는 자리 단 하나
  state.jnSel = null;
  state.jnWarn=false;
  if(jnDone(state)){ state.jnMsg = JN_END_MSG; playChime(); }
  else { state.jnMsg = `<b>${f+1}번 장면</b>에 글을 이었어요. 이 장면은 <b>${JN_PNAME[JN_PART[f]]}</b>를 담았어요.`; playBlip(); }
  jnRender();
}

/* ③ 판 읽기 — 다 이은 뒤에만(가드④) */
function jnReadPick(k){
  if(state.jnFin!=null) return;                                        // 가드①
  if(state.jnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JN_READ.length) return;         // 가드②
  if(!jnDone(state)){ jnHold(JN_ORDER_R); return; }                    // 가드④ 순서 — 판 불변
  if(state.jnRead!=null){ jnHold(JN_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===JN_READ_OK){
    state.jnRead=k; state.jnWrongR=null; state.jnWarn=false;
    state.jnMsg = '판을 잘 읽었어요. 장면마다 그림과 글이 이어져 <b>이야기의 흐름</b>이 생겼고, 단원의 두 주제가 골고루 담겼어요.';
    playChime(); jnRender(); return;
  }
  state.jnWrongR=k;
  jnHold(JN_READ_NO[k]);
}

/* ④ 계획 세우기 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function jnMeanPick(k){
  if(state.jnFin!=null) return;                                        // 가드①
  if(state.jnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JN_MEAN.length) return;         // 가드②
  if(state.jnRead==null){ jnHold(JN_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.jnMean!=null){ jnHold(JN_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==JN_MEAN_OK){ state.jnWrongK=k; jnHold(JN_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.jnMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.jnWarn=false;
  state.jnMsg = '그림책 제작을 위한 계획을 세울 때는 <b>독자</b>를 정하고, 그 수준에 맞는 내용을 구성해야 해요.';
  playChime(); jnRender();
}

/* ⑤ 마무리 — 지도서 13차시 학습 목표·지도 방법 */
function jnFinish(k){
  if(state.jnFin!=null) return;                                        // 가드①
  if(state.jnBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=JN_FIN.length) return;          // 가드②
  if(state.jnMean==null){ jnHold(JN_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===JN_FIN_OK){
    state.jnFin=k; state.jnWrongF=null; state.jnMsg=null; state.jnWarn=false;
    playChime(); jnRender(); return;
  }
  state.jnWrongF=k;
  jnHold(JN_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 10차시(u3 l10) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

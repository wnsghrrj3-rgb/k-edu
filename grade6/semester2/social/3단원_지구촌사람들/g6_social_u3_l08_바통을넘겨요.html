  ⭐ 씨앗은 교과서·지도서의 생활 속 실천 넷 — 네 친구가 인증 순서대로 바통을 이어받는다.

  ⭐ ★ 릴레이가 어디까지 왔는지는 `state.boPos` 한 숫자(0~12)가 정한다 — 친구별 단계 배열 0 · 게시판 기록 배열 0.
  ⭐ ★ 지금 바통을 쥔 친구는 `boRun`(boPos ÷ 3) 한 자리 · 지금 할 일은 `boNeed` 한 줄 · 기록 칸은 `BO_KIND` 한 줄 표 · 릴레이를 한 칸 넘기는 자리(`state.boPos += 1`)는 코드에 단 하나.

     ⑤ 판을 읽기 전 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시

     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`boBusy`)

@media(max-width:520px){ .bo-acts{grid-template-columns:repeat(2,1fr)} }
@media(max-width:380px){ .bo-a,.bo-rec{font-size:8.4px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

const BO_REC_FIRST = '아직 <b>실천한 내용</b>을 기록하지 않았어요. 릴레이 순서 ②를 봐요. 판은 그대로예요.';

const BO_END_MSG = '넷째 친구까지 실천을 마치고 알렸어요. <b>바통이 모두 이어졌어요</b>. 판을 읽어 봐요.';
function BO_SIGN(a){ return `고른 칸은 <b>${BO_KNAME[a-1]}</b> 칸이에요. 이 실천은 그 칸에 들어가지 않아요. 카드를 다시 읽고, 더 자주 해야 할 것인지 줄이거나 없애야 할 것인지 생각해 봐요. 판은 그대로예요.`; }

/* ★ 바통을 쥔 친구 — 한 자리 · 지금 할 일 — 한 줄 */
function boRun(p){ return Math.floor(p/BO_S); }
function boNeed(p){ const s=p%BO_S; return s===0 ? 0 : s===1 ? 1+BO_KIND[boRun(p)] : 3; }
function boMark(st,r){ return Math.max(0, Math.min(BO_S, st.boPos - r*BO_S)); }
function boPassed(st){ return [0,1,2,3].filter(r=>boMark(st,r)===BO_S).length; }
function boRecN(st){ return [0,1,2,3].filter(r=>boMark(st,r)>=2).length; }
/* ★★ 릴레이를 마치는 자리 — 단 하나 */
function boDone(st){ return st.boPos===BO_END; }
function boOrderMsg(p,a){ const s=p%BO_S; return s===0 ? BO_PHOTO_FIRST : s===1 ? (a===0 ? BO_PHOTO_AGAIN : BO_REC_FIRST) : BO_REC_DONE; }

function boTrack(st){
  const done=boDone(st), at=done?BO_N:boRun(st.boPos);
  const X=[44,112,180,248];
  const lanes=[0,1,2].map(r=>{ const on=boMark(st,r)===BO_S;
    return `<line class="bo-lane" data-r="${r}" data-on="${on?1:0}" x1="${X[r]+16}" y1="54" x2="${X[r+1]-16}" y2="54" stroke="${on?'#7C3AED':'#CBD5E0'}" stroke-width="${on?4:2}"${on?'':' stroke-dasharray="5 4"'}/>`; }).join('');
  const goal=`<line class="bo-lane" data-r="3" data-on="${done?1:0}" x1="${X[3]+16}" y1="54" x2="290" y2="54" stroke="${done?'#7C3AED':'#CBD5E0'}" stroke-width="${done?4:2}"${done?'':' stroke-dasharray="5 4"'}/>`;
  const st4=X.map((x,r)=>{ const m=boMark(st,r), cur=!done && r===at;
    return `<g class="bo-st" data-r="${r}" data-mark="${m}" data-cur="${cur?1:0}"><circle cx="${x}" cy="54" r="15" fill="${m===BO_S?'#7C3AED':cur?'#FEF3C7':'#fff'}" stroke="${cur?'#D97706':'#7C3AED'}" stroke-width="${cur?3:1.6}"/>
      <text x="${x}" y="59" font-size="12" fill="${m===BO_S?'#fff':'#4C1D95'}" text-anchor="middle" font-weight="900">${r+1}</text>
      <text x="${x}" y="88" font-size="10" text-anchor="middle">${m>=1?'\uD83D\uDCF7':'\u00B7'}${m>=2?'\uD83D\uDCDD':'\u00B7'}${m>=3?'\uD83D\uDCE3':'\u00B7'}</text></g>`; }).join('');
  const bx=done?296:X[at];
  return `<svg viewBox="0 0 320 104" data-at="${at}"><rect width="320" height="104" fill="#F5F3FF"/>
    ${lanes}${goal}${st4}
    <text x="300" y="60" font-size="16" text-anchor="middle">\uD83C\uDFC1</text>
    <g class="bo-baton" data-at="${at}"><rect x="${bx-12}" y="20" width="24" height="7" rx="3.5" fill="#D97706" stroke="#92400E" stroke-width="1"/></g>
  </svg>`;
}
function boWall(st){
  const recs=[0,1,2,3].filter(r=>boMark(st,r)>=2);
  return `<div class="bo-wall" data-n="${recs.length}"><div class="bo-wt">\uD83D\uDCCB 실천 인증 게시판</div>${recs.length?recs.map(r=>`<div class="bo-rec" data-r="${r}"><span class="bo-k">${BO_KNAME[BO_KIND[r]]}</span>${BO_WHO[r]} \u00b7 ${BO_CARD[r]}</div>`).join(''):'<div class="bo-empty">아직 올라온 기록이 없어요</div>'}</div>`;
}

function boBoard(st){
  const fin = st.boFin!=null, done = boDone(st), r = boRun(st.boPos), m = done?0:st.boPos%BO_S;
  const head = fin ? '바통을 이어받으며 세계시민으로 실천했어요'
    : st.boMean!=null ? '꼭! 기억해요 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.boRead!=null ? '꼭! 기억해요 빈칸을 채워 봐요'
    : done ? '바통이 넷째 친구까지 이어졌어요 \u2014 판을 읽어 봐요'
    : st.boPos>0 ? '릴레이 순서대로 이어 가요'
    : '바통을 쥔 친구의 실천 카드를 읽고 릴레이 순서대로 눌러요';
  const prog = done ? '' : `<div class="bo-prog">${BO_STEPNAME.map((t,k)=>`<span data-k="${k}" data-on="${k<m?1:0}">${k+1} ${t}</span>`).join('')}</div>`;
  return `<div class="bo-board" data-pos="${st.boPos}" data-run="${done?BO_N:r}" data-step="${m}" data-done="${done?1:0}" data-read="${st.boRead==null?-1:st.boRead}" data-mean="${st.boMean==null?-1:st.boMean}" data-fin="${fin?1:0}">
    <div class="bo-head">${head}</div>
    <div class="bo-track">${boTrack(st)}</div>
    <div class="bo-card" data-end="${done?1:0}">${done?'네 친구가 모두 실천을 마쳤어요':`<span class="bo-no">${r+1} / 4</span>${BO_WHO[r]}의 실천: <b>${BO_CARD[r]}</b>`}</div>
    ${prog}
    <div class="bo-acts">${BO_ACT.map((t,a)=>`<button class="bo-a" data-a="${a}" onclick="boAct(${a})">${t}</button>`).join('')}</div>
    ${boWall(st)}
    <div class="bo-tally">바통을 넘긴 친구 ${boPassed(st)} / 4 \u00b7 게시판 기록 ${boRecN(st)} / 4</div>
  </div>`;
}

      <div class="dw-right">${right}</div>

  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">생각을 펼쳐요</b> 활동을 해요. 준비물은 <b>색칠 도구</b>예요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u3_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  boPos:0,
  boRead:null, boMean:null, boFin:null,
  boWrongR:null, boWrongK:null, boWrongF:null,
  boMsg:null, boWarn:false, boBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function boRender(){ main.innerHTML = slides[state.idx].render(state); }
function boHold(msg){
  state.boWarn=true; state.boBusy=true; state.boMsg=msg;
  playThud(); boRender();
  setTimeout(()=>{ state.boBusy=false; state.boWarn=false; state.boMsg=null;
    state.boWrongR=null; state.boWrongK=null; state.boWrongF=null; boRender(); },1600);
}

/* ① 릴레이 단추 — 지금 할 일(boNeed)일 때만 한 칸 넘어간다(가드⑨·⑩) */
function boAct(a){
  if(state.boFin!=null) return;                                        // 가드①
  if(state.boBusy) return;                                             // 가드⑧
  if(!Number.isInteger(a) || a<0 || a>=BO_ACT.length) return;          // 가드②
  if(boDone(state)){ boHold(BO_LOCK); return; }                        // 가드③ 판 불변
  const p = state.boPos, r = boRun(p), need = boNeed(p);
  if(a!==need){
    if(p%BO_S===1 && (a===1 || a===2)){ boHold(BO_SIGN(a)); return; }  // 가드⑩ 그 칸이 아님 — 판 불변
    boHold(boOrderMsg(p,a)); return;                                   // 가드⑨ 차례를 건너뜀 — 판 불변
  }
  state.boPos += 1;                                                    // ★ 릴레이를 넘기는 자리 단 하나
  state.boWarn=false;
  if(boDone(state)){ state.boMsg = BO_END_MSG; playChime(); }
  else if(a===0){ state.boMsg = `<b>${BO_WHO[r]}</b>가 실천하는 모습을 담아 인증 사진을 찍었어요.`; playBlip(); }
  else if(a!==3){ state.boMsg = `<b>${BO_WHO[r]}</b>의 실천을 <b>${BO_KNAME[a-1]}</b>으로 게시판에 기록했어요.`; playBlip(); }
  else { state.boMsg = `<b>${BO_WHO[r]}</b>가 다음 차례인 <b>${BO_WHO[r+1]}</b>에게 알렸어요. 바통이 넘어갔어요.`; playBlip(); }
  boRender();
}

/* ② 판 읽기 — 릴레이를 마친 뒤에만(가드④) */
function boReadPick(k){
  if(state.boFin!=null) return;                                        // 가드①
  if(state.boBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=BO_READ.length) return;         // 가드②
  if(!boDone(state)){ boHold(BO_ORDER_R); return; }                    // 가드④ 순서 — 판 불변
  if(state.boRead!=null){ boHold(BO_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===BO_READ_OK){
    state.boRead=k; state.boWrongR=null; state.boWarn=false;
    state.boMsg = '판을 잘 읽었어요. 한 친구의 실천이 알림을 따라 다음 친구에게 이어져 넷째 친구까지 닿았어요. <b>작은 실천</b>도 이어지면 지구를 지키는 힘이 될 수 있어요.';
    playChime(); boRender(); return;
  }
  state.boWrongR=k;
  boHold(BO_READ_NO[k]);
}

/* ③ 꼭! 기억해요 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function boMeanPick(k){
  if(state.boFin!=null) return;                                        // 가드①
  if(state.boBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=BO_MEAN.length) return;         // 가드②
  if(state.boRead==null){ boHold(BO_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.boMean!=null){ boHold(BO_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==BO_MEAN_OK){ state.boWrongK=k; boHold(BO_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.boMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.boWarn=false;
  state.boMsg = '지구촌의 지속가능한 미래를 위해 협력하며 책임 있게 행동하는 사람을 <b>세계시민</b>이라고 해요.';
  playChime(); boRender();
}

/* ④ 마무리 — 지도서 12차시 주요 내용 정리 */
function boFinish(k){
  if(state.boFin!=null) return;                                        // 가드①
  if(state.boBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=BO_FIN.length) return;          // 가드②
  if(state.boMean==null){ boHold(BO_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===BO_FIN_OK){
    state.boFin=k; state.boWrongF=null; state.boMsg=null; state.boWarn=false;
    playChime(); boRender(); return;
  }
  state.boWrongF=k;
  boHold(BO_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 9차시(u3 l09) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

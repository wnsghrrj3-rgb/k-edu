  ⭐ ★ 어느 판을 적을 수 있는지는 `cgKind` 한 줄 — **연령층 선을 그었을 때만** 출생률·사망률 두 비트 번호 · 아니면 4(적을 수 없음).
  ⭐ ★★ 판 기록은 `state.cgLog |=` 단 하나(`cgNote` · 판 적기 처리기에서만 · 줄지 않음) — 네 판 최소 걸음(BFS 8).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 네 판을 다 적은 뒤 판 움직이기(단추·적기) 무시 — 판 불변
     ④ 네 판 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시

     ⑧ 안내 표시 중 재클릭 무시(`cgBusy`)
     ⑨ 이미 적은 판 다시 적기 무시 — 판 불변
     ⑩ 연령층 선을 긋지 않고 적기 무시(`CG_LINE`) — 판 불변.

.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====

function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

   ★ 아래층(유소년층) 막대는 CG_YOUNG · 위층(노년층) 막대는 CG_OLD · 층의 모양은 cgTilt 한 줄 · 적을 수 있는 판은 cgKind 한 줄(선을 그었을 때만).
   ★★ 판 기록은 |= 만(cgLog · cgNote 단 하나 · 판 적기 처리기에서만).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 막대는 도식이다. */

const CG_ALL = 15;

function cgOn(st,b){ return (st.cgGate & (1<<b))!==0; }
/* ★ 층의 모양 — 한 줄 · 0 위층이 넓음 · 1 비슷함 · 2 아래층이 넓음 */
function cgTilt(st){ return Math.sign(CG_YOUNG[st.cgGate & 1] - CG_OLD[(st.cgGate >> 1) & 1]) + 1; }
/* ★ 적을 수 있는 판 — 한 줄 · 연령층 선을 그었을 때만 출생률·사망률 두 비트 번호 · 아니면 4 */
function cgKind(st){ return (st.cgGate & 4) ? (st.cgGate & 3) : 4; }
function cgHas(st,l){ return (st.cgLog & (1<<l))!==0; }
function cgLines(st){ return [0,1,2,3].filter(l=>cgHas(st,l)).length; }
function cgAll(st){ return st.cgLog===CG_ALL; }

function cgBtns(st){
  return CG_BTN.map((t,b)=>{ const on=cgOn(st,b)?1:0;
    return `<button class="cg-btn" data-b="${b}" data-on="${on}" onclick="cgTap(${b})"><span>${CG_ICON[b]} ${t}</span><span class="st">${CG_ST[b][on]}</span></button>`; }).join('');
}
function cgLand(st){
  const yw=CG_YOUNG[st.cgGate & 1], ow=CG_OLD[(st.cgGate >> 1) & 1], ln=cgOn(st,2);
  const rows=[[2,ow],[2,ow],[1,CG_MID],[1,CG_MID],[1,CG_MID],[0,yw],[0,yw]];
  const bars=rows.map((r,i)=>{ const y=8+i*11;
    return `<rect class="cg-bar" data-band="${r[0]}" data-side="L" x="${159-r[1]}" y="${y}" width="${r[1]}" height="10" fill="#A78BFA"/><rect class="cg-bar" data-band="${r[0]}" data-side="R" x="161" y="${y}" width="${r[1]}" height="10" fill="#F9A8D4"/>`; }).join('');
  const cuts=ln?[29.5,62.5].map(y=>`<path class="cg-cut" d="M84 ${y} L236 ${y}" stroke="#B45309" stroke-width="2" stroke-dasharray="5 3"/>`).join('')
    +[[18,2],[46,1],[79,0]].map(t=>`<text class="cg-tag" x="24" y="${t[0]+3}" font-size="7.4" fill="#78350F" font-weight="900">${CG_BAND[t[1]]}</text>`).join(''):'';
  return `<svg viewBox="0 0 320 96" data-young="${yw}" data-old="${ow}" data-line="${ln?1:0}"><rect width="320" height="96" fill="#F8FAFC"/>${bars}<path d="M160 6 L160 86" stroke="#334155" stroke-width="1"/>${cuts}<text x="118" y="94" font-size="6.8" fill="#4C1D95" text-anchor="middle" font-weight="800">\u2190 남자</text><text x="202" y="94" font-size="6.8" fill="#9D174D" text-anchor="middle" font-weight="800">여자 \u2192</text></svg>`;
}
function cgNotes(st){
  return CG_CASE.map((t,l)=>{ const on=cgHas(st,l);
    return `<div class="cg-line${on?' set':''}" data-line="${l}">${on?'\u270F\uFE0F '+t+' \u2014 '+CG_SHAPE[cgTilt({cgGate:l})]+' \u00b7 '+CG_EX[l]:'\u2610 '+t+' \u2014 아직 적지 않았어요'}</div>`; }).join('');
}

function cgBoard(st){
  const fin = st.cgFin!=null, all = cgAll(st), ln=cgOn(st,2);
  const head = fin ? '연령층 선으로 인구 구조를 살펴보고 정리했어요'
    : st.cgMean!=null ? '꼭! 기억해요 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.cgRead!=null ? '꼭! 기억해요 빈칸을 채워 봐요'
    : all ? '네 판을 모두 적었어요 \u2014 판을 읽어 봐요'
    : st.cgLog!==0 ? '출생률이나 사망률을 바꿔 다음 판도 적어 봐요'
    : '출생률과 사망률을 정하고 연령층 선을 그어 판을 적어요';
  return `<div class="cg-board" data-gate="${st.cgGate}" data-log="${st.cgLog}" data-lines="${cgLines(st)}" data-all="${all?1:0}" data-read="${st.cgRead==null?-1:st.cgRead}" data-mean="${st.cgMean==null?-1:st.cgMean}" data-fin="${fin?1:0}">
    <div class="cg-head">${head}</div>
    <div class="cg-gate">${cgBtns(st)}</div>
    <div class="cg-land">${cgLand(st)}</div>
    <div class="cg-say" data-line="${ln?1:0}">출생률 <b>${CG_ST[0][cgOn(st,0)?1:0]}</b> \u00b7 사망률 <b>${CG_ST[1][cgOn(st,1)?1:0]}</b> \u2014 ${ln?`층을 나눈 모양: <b>${CG_SHAPE[cgTilt(st)]}</b>`:'연령층 선을 그어야 층의 모양을 알 수 있어요'}</div>
    <div class="cg-row"><button class="cg-pen" data-pen="1" onclick="cgWrite()">\u270F\uFE0F 판 적기</button></div>
    <div class="cg-note"><div class="nh">\uD83D\uDCD2 인구 구조 기록장</div>${cgNotes(st)}</div>
  </div>`;
}

function cgPanel(st){

    : st.cgRead!=null ? '꼭! 기억해요 \u2014 「인구 구조는 (  ), (  ) 등에 따라 다르게 나타납니다」의 빈칸에 알맞은 말은 무엇일까요?'

    : st.cgLog!==0 ? '출생률과 사망률을 바꿔 가며 네 판을 모두 적어요.'

  if(fin){

      <span style="color:#64748B">판의 막대는 도식이에요.
      <b>누리집에서 인구 피라미드 살펴보기</b>, <b>두 나라에 필요한 시설 이야기하기</b>, <b>세계 인구 구조 그래프 그려 보기</b>, <b>친구와 이야기하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.cgMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="cg-fin">${CG_FIN.map((t,k)=>`<button class="${st.cgWrongF===k?'no':''}" onclick="cgFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.cgRead!=null){
    right += `<div class="dw-step">\uD83D\uDCCC 꼭! 기억해요 빈칸</div>`;
    right += `<div class="cg-mean">${CG_MEAN.map((t,k)=>`<button class="${st.cgWrongK===k?'no':''}" onclick="cgMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="cg-hint">판에서 층의 모양을 바꾼 단추 두 개의 이름을 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="cg-read">${CG_READ.map((t,k)=>`<button class="${st.cgWrongR===k?'no':''}" onclick="cgReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\u2702\uFE0F 층을 나눠요</div>`;
    right += `<div class="cg-hint"><b>출생률</b> 단추를 누르면 아래층 막대가 짧아지거나 길어지고, <b>사망률</b> 단추를 누르면 위층 막대가 길어지거나 짧아져요. <b>연령층 선</b> 단추를 눌러 선을 그으면 층을 나누어 볼 수 있어요. 선을 그은 채로 <b>판 적기</b>를 누르면 기록장에 적혀요. 네 판을 모두 적으면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.cgMsg) right += `<div class="dw-msg${st.cgWarn?' warn':''}">${st.cgMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\u2702\uFE0F 층을 나눠요</b></div>
    <div class="dw-body">

}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  self:[false,false,false],
  revealed:false,
  cgGate:0, cgLog:0,
  cgRead:null, cgMean:null, cgFin:null,
  cgWrongR:null, cgWrongK:null, cgWrongF:null,
  cgMsg:null, cgWarn:false, cgBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function cgRender(){ main.innerHTML = slides[state.idx].render(state); }
function cgHold(msg){
  state.cgWarn=true; state.cgBusy=true; state.cgMsg=msg;
  playThud(); cgRender();
  setTimeout(()=>{ state.cgBusy=false; state.cgWarn=false; state.cgMsg=null;
    state.cgWrongR=null; state.cgWrongK=null; state.cgWrongF=null; cgRender(); },1600);
}
/* ★ 판 기록 — 더하기만 하는 자리 단 하나 */
function cgNote(l){ state.cgLog |= (1 << l); }

/* ① 단추 — 0 출생률(낮아요 ↔ 높아요) · 1 사망률(낮아요 ↔ 높아요) · 2 연령층 선(지웠어요 ↔ 그었어요) */
function cgTap(b){
  if(state.cgFin!=null) return;                                        // 가드①
  if(state.cgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(b) || b<0 || b>=CG_N) return;                   // 가드②
  if(cgAll(state)){ cgHold(CG_LOCK); return; }                         // 가드③ 판 불변
  state.cgGate ^= (1 << b);                                            // ★ 판이 바뀌는 자리 단 하나
  state.cgWarn=false; state.cgMsg=null; playBlip(); cgRender();
}

/* ② 판 적기 — 연령층 선을 그었고(가드⑩) 아직 적지 않았을 때만(가드⑨) */
function cgWrite(){
  if(state.cgFin!=null) return;                                        // 가드①
  if(state.cgBusy) return;                                             // 가드⑧
  if(cgAll(state)){ cgHold(CG_LOCK); return; }                         // 가드③ 판 불변
  const l = cgKind(state);
  if(l===4){ cgHold(CG_LINE); return; }                                // 가드⑩ 연령층 선을 긋지 않음 — 판 불변
  if(cgHas(state,l)){ cgHold(CG_AGAIN); return; }                      // 가드⑨ 이미 적은 판 — 판 불변
  cgNote(l);
  state.cgWarn=false;
  if(cgAll(state)){ state.cgMsg = CG_ALL_MSG; playChime(); }
  else { state.cgMsg = `적었어요 \u2014 ${CG_CASE[l]}이면 ${CG_SHAPE[cgTilt(state)]}이에요. 출생률이나 사망률 단추를 눌러 다른 판을 만들어 봐요.`; playChime(); }
  cgRender();
}

/* ③ 판 읽기 — 네 판 뒤에만(가드④) */
function cgReadPick(k){
  if(state.cgFin!=null) return;                                        // 가드①
  if(state.cgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=CG_READ.length) return;         // 가드②
  if(!cgAll(state)){ cgHold(CG_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.cgRead!=null){ cgHold(CG_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===CG_READ_OK){
    state.cgRead=k; state.cgWrongR=null; state.cgWarn=false;
    state.cgMsg = '판을 잘 읽었어요. <b>출생률</b>은 아래층을, <b>사망률과 평균 수명</b>은 위층을 바꾸어 나라마다 인구 구조가 다르게 나타나요.';
    playChime(); cgRender(); return;
  }
  state.cgWrongR=k;
  cgHold(CG_READ_NO[k]);
}

/* ④ 꼭! 기억해요 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function cgMeanPick(k){
  if(state.cgFin!=null) return;                                        // 가드①
  if(state.cgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=CG_MEAN.length) return;         // 가드②
  if(state.cgRead==null){ cgHold(CG_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.cgMean!=null){ cgHold(CG_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==CG_MEAN_OK){ state.cgWrongK=k; cgHold(CG_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.cgMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.cgWarn=false;
  state.cgMsg = '인구 구조는 <b>출생률, 사망률</b> 등에 따라 다르게 나타나요.';
  playChime(); cgRender();
}

/* ⑤ 마무리 — 지도서 6차시 주요 내용 정리 */
function cgFinish(k){
  if(state.cgFin!=null) return;                                        // 가드①
  if(state.cgBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=CG_FIN.length) return;          // 가드②
  if(state.cgMean==null){ cgHold(CG_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===CG_FIN_OK){
    state.cgFin=k; state.cgWrongF=null; state.cgMsg=null; state.cgWarn=false;
    playChime(); cgRender(); return;
  }
  state.cgWrongF=k;
  cgHold(CG_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 5차시(u3 l05) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

직접조작: 「인구 물통의 꼭지를 돌려요」 판 (교과서 131쪽 · 지도서 4차시 핵심 질문 「나라의 인구수 변화에 영향을 주는 요인」)
  ⭐ 씨앗은 지도서 283쪽 핵심 질문 — 나라의 인구수는 출생, 사망, 인구의 이동, 환경의 변화 등에 따라 달라진다.
     들어오는 꼭지 둘(출생 · 들어오는 이동) · 나가는 꼭지 둘(사망 · 나가는 이동). 환경의 변화는 투발루 예(이주 계획)로 나가는 이동에 잇는다.
  ⭐ 꼭지 단추 넷(wvTap) — 판 바꾸는 자리 state.wvGate = 단 하나(꼭지 열림 네 비트 · ^=).
  ⭐ ★ 물통이 늘지·그대로인지·줄지는 `wvDir` 한 줄(표 `WV_SIDE` = [1,1,-1,-1] 합의 부호).
  ⭐ ★ 어느 요인을 적을 수 있는지는 `wvKind` 한 줄 — 꼭지가 **딱 하나** 열렸을 때만 그 번호 · 아니면 4(적을 수 없음).
  ⭐ ★★ 요인 기록은 `state.wvLog |=` 단 하나(`wvNote` · 요인 적기 처리기에서만 · 줄지 않음) — 네 요인 최소 걸음(BFS 11).
  ⭐ 판 읽기는 네 요인 뒤에만(정답 자리 2) → 꼭! 기억해요 빈칸 3택(교과서 131쪽 「인구의 이동」 · 정답 자리 1)
     → 마무리 3택 = 지도서 4차시 주요 내용 정리(정답 자리 0).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 네 요인을 다 적은 뒤 판 움직이기(꼭지·적기) 무시 — 판 불변
     ④ 네 요인 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시
     ⑥ 빈칸 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`wvBusy`)
     ⑨ 이미 적은 요인 다시 적기 무시 — 판 불변
     ⑩ 꼭지가 하나도 안 열렸거나 둘 이상 열렸을 때 적기 무시(`WV_ONE`) — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.wv-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 물통과 꼭지는 도식이다** — 물의 양은 실제 인구수가 아니라 늘고 줄어드는 방향만 나타낸다(캡션 상시).
  ㉡ **판은 나라별 인구수나 인구 성장률을 계산하지 않는다** — 수치는 교과서 자료만 슬라이드에 적는다.
  ㉢ **물통 칸의 사망은 요인 이름일 뿐**이다 — 사람 형상·장면 0.
  ㉣ **사회과 부도에서 나라 찾기 · 국가 통계 포털 살펴보기 · 더 알아보고 싶은 나라 조사하기 · 친구와 이야기하기는 교실 몫**이다(완료 카드 명시).

.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

function wvOpen(st,i){ return (st.wvGate & (1<<i))!==0; }
/* ★ 물통 — 한 줄(표 WV_SIDE 합의 부호) · 1 늘어요 · 0 그대로 · -1 줄어요 */
function wvDir(st){ return Math.sign([0,1,2,3].reduce((s,i)=>s+(wvOpen(st,i)?WV_SIDE[i]:0),0)); }
/* ★ 적을 수 있는 요인 — 한 줄 · 꼭지가 딱 하나 열렸을 때만 그 번호 · 아니면 4 */
function wvKind(st){ const i=[1,2,4,8].indexOf(st.wvGate); return i<0 ? 4 : i; }
function wvHas(st,l){ return (st.wvLog & (1<<l))!==0; }
function wvLines(st){ return [0,1,2,3].filter(l=>wvHas(st,l)).length; }
function wvAll(st){ return st.wvLog===WV_ALL; }

function wvTaps(st){
  return WV_TAP.map((t,i)=>{ const on=wvOpen(st,i)?1:0;
    return `<button class="wv-tap" data-t="${i}" data-side="${WV_SIDE[i]>0?'in':'out'}" data-on="${on}" onclick="wvTap(${i})"><span>${WV_ICON[i]} ${t}</span><span class="sd">${WV_SIDE[i]>0?'들어오는 꼭지':'나가는 꼭지'}</span><span class="st">${on?'열림':'잠김'}</span></button>`; }).join('');
}
function wvTank(st){
  const d=wvDir(st), lv=WV_LV[d+1];
  const pipe=(i,x1,y1,x2,y2,c)=>`<path class="wv-flow" data-f="${i}" data-on="${wvOpen(st,i)?1:0}" d="M${x1} ${y1} L${x2} ${y2}" stroke="${wvOpen(st,i)?c:'#CBD5E0'}" stroke-width="${wvOpen(st,i)?5:3}" stroke-linecap="round"${wvOpen(st,i)?'':' stroke-dasharray="4 4"'}/>`;
  return `<svg viewBox="0 0 320 130"><rect width="320" height="130" fill="#F8FAFC"/>
    ${pipe(0,40,22,122,40,'#7C3AED')}${pipe(1,40,58,122,58,'#7C3AED')}${pipe(2,198,72,280,72,'#B45309')}${pipe(3,198,98,280,112,'#B45309')}
    ${[[0,40,22],[1,40,58]].map(p=>`<text x="${p[1]-4}" y="${p[2]+3}" font-size="7" fill="#4C1D95" text-anchor="end" font-weight="800">${WV_TAP[p[0]]}</text>`).join('')}
    ${[[2,280,72],[3,280,112]].map(p=>`<text x="${p[1]+4}" y="${p[2]+3}" font-size="7" fill="#78350F" font-weight="800">${WV_TAP[p[0]]}</text>`).join('')}
    <rect x="122" y="18" width="76" height="104" rx="8" fill="#fff" stroke="#5B21B6" stroke-width="2"/>
    <rect class="wv-water" data-dir="${d}" x="124" y="${120-lv}" width="72" height="${lv}" rx="6" fill="#C4B5FD"/>
    <text x="160" y="${114-lv}" font-size="12" text-anchor="middle">${d>0?'\u2B06\uFE0F':d<0?'\u2B07\uFE0F':'\u23F8\uFE0F'}</text>
    <text x="160" y="116" font-size="7" fill="#4C1D95" text-anchor="middle" font-weight="900">나라의 인구수</text></svg>`;
}
function wvNotes(st){
  return WV_TAP.map((t,l)=>{ const on=wvHas(st,l);
    return `<div class="wv-line${on?' set':''}" data-line="${l}">${on?'\u270F\uFE0F '+t+' \u2014 '+WV_DIRTXT[WV_SIDE[l]+1]+' \u00b7 '+WV_EX[l]:'\u2610 '+t+' \u2014 아직 적지 않았어요'}</div>`; }).join('');
}

function wvBoard(st){
  const fin = st.wvFin!=null, all = wvAll(st), d=wvDir(st);
  const open=[0,1,2,3].filter(i=>wvOpen(st,i)), inN=open.filter(i=>WV_SIDE[i]>0).length, outN=open.length-inN;
  const head = fin ? '인구 물통으로 인구수를 바꾸는 요인을 살펴보고 정리했어요'
    : st.wvMean!=null ? '꼭! 기억해요 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.wvRead!=null ? '꼭! 기억해요 빈칸을 채워 봐요'
    : all ? '네 요인을 모두 적었어요 \u2014 판을 읽어 봐요'
    : st.wvLog!==0 ? '다른 꼭지를 하나만 열어 다음 요인도 적어 봐요'
    : '꼭지를 하나 열고 물통을 살펴본 뒤 요인을 적어요';
  return `<div class="wv-board" data-gate="${st.wvGate}" data-dir="${d}" data-log="${st.wvLog}" data-lines="${wvLines(st)}" data-all="${all?1:0}" data-read="${st.wvRead==null?-1:st.wvRead}" data-mean="${st.wvMean==null?-1:st.wvMean}" data-fin="${fin?1:0}">
    <div class="wv-head">${head}</div>
    <div class="wv-gate">${wvTaps(st)}</div>
    <div class="wv-tank">${wvTank(st)}</div>
    <div class="wv-say" data-dir="${d}" data-open="${open.length}">열린 꼭지 <b>${open.length}개</b>(들어오는 꼭지 ${inN}개 \u00b7 나가는 꼭지 ${outN}개) \u2014 <b>${WV_DIRTXT[d+1]}</b></div>
    <div class="wv-row"><button class="wv-pen" data-pen="1" onclick="wvWrite()">\u270F\uFE0F 요인 적기</button></div>
    <div class="wv-note"><div class="nh">\uD83D\uDCD2 요인 기록장</div>${wvNotes(st)}</div>
  </div>`;
}

function wvPanel(st){
  const fin = st.wvFin!=null, all = wvAll(st);
  const q = fin ? '인구 물통으로 나라의 인구수를 바꾸는 요인을 살펴봤어요.'
    : st.wvMean!=null ? '오늘 공부한 내용을 정리해요. 세계 여러 나라의 인구수는 어떠한가요?'
    : st.wvRead!=null ? '꼭! 기억해요 \u2014 「나라의 인구수는 출생과 사망, (  ), 환경의 변화 등에 따라 달라집니다」의 빈칸에 알맞은 말은 무엇일까요?'
    : all ? '네 요인을 모두 적었어요. 판에서 무엇을 알 수 있나요?'
    : st.wvLog!==0 ? '꼭지를 하나씩 열어 가며 네 요인을 모두 적어요.'
    : '인구 물통의 꼭지를 열고 잠가 봐요. 나라의 인구수는 무엇 때문에 달라질까요?';
  let right = `<div class="wv-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDEB0 인구 물통으로 살펴보며 정리했어요</div>
      세계 여러 나라의 인구수는 <b>나라마다 달라요</b>. 인도, 미국처럼 인구가 많은 나라도 있고 리비아, 투발루처럼 인구가 적은 나라도 있어요.
      나라의 인구수는 <b>출생, 사망, 인구의 이동, 환경의 변화</b> 등에 따라 달라져요.<br>
      <span style="color:#64748B">판의 물통과 꼭지는 도식이에요.
      <b>사회과 부도에서 나라 찾기</b>, <b>국가 통계 포털 살펴보기</b>, <b>더 알아보고 싶은 나라 조사하기</b>, <b>친구와 이야기하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.wvMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="wv-fin">${WV_FIN.map((t,k)=>`<button class="${st.wvWrongF===k?'no':''}" onclick="wvFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.wvRead!=null){
    right += `<div class="dw-step">\uD83D\uDCCC 꼭! 기억해요 빈칸</div>`;
    right += `<div class="wv-mean">${WV_MEAN.map((t,k)=>`<button class="${st.wvWrongK===k?'no':''}" onclick="wvMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="wv-hint">들어오는 이동과 나가는 이동을 함께 부르는 말이에요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="wv-read">${WV_READ.map((t,k)=>`<button class="${st.wvWrongR===k?'no':''}" onclick="wvReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDEB0 꼭지를 돌려요</div>`;
    right += `<div class="wv-hint">꼭지 단추를 누르면 <b>열리고</b>, 다시 누르면 <b>잠겨요</b>. 위의 두 꼭지(출생 \u00b7 들어오는 이동)는 물통으로 들어오는 꼭지, 아래 두 꼭지(사망 \u00b7 나가는 이동)는 물통에서 나가는 꼭지예요. 꼭지를 <b>하나만</b> 열고 <b>요인 적기</b>를 누르면 기록장에 적혀요. 네 요인을 모두 적으면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.wvMsg) right += `<div class="dw-msg${st.wvWarn?' warn':''}">${st.wvMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDEB0 인구 물통의 꼭지를 돌려요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${wvBoard(st)}<div class="cvcap">판의 물통과 꼭지는 <b>도식</b>이에요. 물의 양은 실제 인구수가 아니라 늘고 줄어드는 방향만 나타내요. 판은 나라별 인구수나 인구 성장률을 계산하지 않아요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  document.getElementById('score').textContent = state.score;

  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}

let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function wvRender(){ main.innerHTML = slides[state.idx].render(state); }
function wvHold(msg){
  state.wvWarn=true; state.wvBusy=true; state.wvMsg=msg;
  playThud(); wvRender();
  setTimeout(()=>{ state.wvBusy=false; state.wvWarn=false; state.wvMsg=null;
    state.wvWrongR=null; state.wvWrongK=null; state.wvWrongF=null; wvRender(); },1600);
}
/* ★ 요인 기록 — 더하기만 하는 자리 단 하나 */
function wvNote(l){ state.wvLog |= (1 << l); }

/* ① 꼭지 단추 — 0 출생 · 1 들어오는 이동 · 2 사망 · 3 나가는 이동(누를 때마다 열림 ↔ 잠김) */
function wvTap(a){
  if(state.wvFin!=null) return;                                        // 가드①
  if(state.wvBusy) return;                                             // 가드⑧
  if(!Number.isInteger(a) || a<0 || a>=WV_N) return;                   // 가드②
  if(wvAll(state)){ wvHold(WV_LOCK); return; }                         // 가드③ 판 불변
  state.wvGate ^= (1 << a);                                            // ★ 판이 바뀌는 자리 단 하나
  state.wvWarn=false; state.wvMsg=null; playBlip(); wvRender();
}

/* ② 요인 적기 — 꼭지가 딱 하나 열렸고(가드⑩) 아직 적지 않았을 때만(가드⑨) */
function wvWrite(){
  if(state.wvFin!=null) return;                                        // 가드①
  if(state.wvBusy) return;                                             // 가드⑧
  if(wvAll(state)){ wvHold(WV_LOCK); return; }                         // 가드③ 판 불변
  const l = wvKind(state);
  if(l===4){ wvHold(WV_ONE); return; }                                 // 가드⑩ 꼭지 하나가 아님 — 판 불변
  if(wvHas(state,l)){ wvHold(WV_AGAIN); return; }                      // 가드⑨ 이미 적은 요인 — 판 불변
  wvNote(l);
  state.wvWarn=false;
  if(wvAll(state)){ state.wvMsg = WV_ALL_MSG; playChime(); }
  else { state.wvMsg = `적었어요 \u2014 ${WV_TAP[l]} 꼭지만 열면 ${WV_DIRTXT[WV_SIDE[l]+1]}. 꼭지를 잠그고 다른 꼭지를 하나만 열어 봐요.`; playChime(); }
  wvRender();
}

/* ③ 판 읽기 — 네 요인 뒤에만(가드④) */
function wvReadPick(k){
  if(state.wvFin!=null) return;                                        // 가드①
  if(state.wvBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WV_READ.length) return;         // 가드②
  if(!wvAll(state)){ wvHold(WV_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.wvRead!=null){ wvHold(WV_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===WV_READ_OK){
    state.wvRead=k; state.wvWrongR=null; state.wvWarn=false;
    state.wvMsg = '판을 잘 읽었어요. 나라의 인구수는 <b>출생</b>과 <b>들어오는 이동</b>으로 늘고, <b>사망</b>과 <b>나가는 이동</b>으로 줄어요.';
    playChime(); wvRender(); return;
  }
  state.wvWrongR=k;
  wvHold(WV_READ_NO[k]);
}

/* ④ 꼭! 기억해요 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function wvMeanPick(k){
  if(state.wvFin!=null) return;                                        // 가드①
  if(state.wvBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WV_MEAN.length) return;         // 가드②
  if(state.wvRead==null){ wvHold(WV_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.wvMean!=null){ wvHold(WV_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==WV_MEAN_OK){ state.wvWrongK=k; wvHold(WV_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.wvMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.wvWarn=false;
  state.wvMsg = '나라의 인구수는 출생과 사망, <b>인구의 이동</b>, 환경의 변화 등에 따라 달라져요.';
  playChime(); wvRender();
}

/* ⑤ 마무리 — 지도서 4차시 주요 내용 정리 */
function wvFinish(k){
  if(state.wvFin!=null) return;                                        // 가드①
  if(state.wvBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WV_FIN.length) return;          // 가드②
  if(state.wvMean==null){ wvHold(WV_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===WV_FIN_OK){
    state.wvFin=k; state.wvWrongF=null; state.wvMsg=null; state.wvWarn=false;
    playChime(); wvRender(); return;
  }
  state.wvWrongF=k;
  wvHold(WV_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 3차시(u3 l03) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

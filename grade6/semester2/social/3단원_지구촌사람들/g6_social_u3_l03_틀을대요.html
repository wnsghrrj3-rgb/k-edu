⚠️ 회수 키 `g6_s2_social_u3_l03_v1` · 맵 키 `g6_social_u3_l03` · 파일명 `틀을대요` — 조작 이름(선례 승계).

직접조작: 「한 칸 틀을 대요」 판 (교과서 132~133쪽 · 지도서 5차시 「인구수가 많고, 면적이 작을수록 인구 밀도는 높게 나타남」)
  ⭐ 씨앗은 지도서 291쪽 주요 내용 정리 — 인구 밀도는 일정한 면적(1 km²) 안에 사는 인구수이며, 인구수가 많고 면적이 작을수록 높다.
     단추 셋 — 인구수(적어요 ↔ 많아요) · 면적(좁아요 ↔ 넓어요) · 한 칸 틀(뗐어요 ↔ 대었어요).
  ⭐ 단추 셋(kxTap) — 판 바꾸는 자리 state.kxGate = 단 하나(세 비트 · ^=).
  ⭐ ★ 한 칸에 찍히는 점 수는 `kxPer` 한 줄(점 `KX_DOTS` ÷ 칸 `KX_TILES`) · 높아요·보통·낮아요는 `kxLevel` 한 줄(4 와 견준 부호).
  ⭐ ★ 어느 판을 적을 수 있는지는 `kxKind` 한 줄 — **한 칸 틀을 대었을 때만** 인구수·면적 두 비트 번호 · 아니면 4(적을 수 없음).
  ⭐ ★★ 판 기록은 `state.kxLog |=` 단 하나(`kxNote` · 판 적기 처리기에서만 · 줄지 않음) — 네 판 최소 걸음(BFS 8).
  ⭐ 판 읽기는 네 판 뒤에만(정답 자리 1) → 꼭! 기억해요 빈칸 3택(교과서 133쪽 「인구 밀도」 · 정답 자리 2)
     → 마무리 3택 = 지도서 5차시 주요 내용 정리(정답 자리 2).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 네 판을 다 적은 뒤 판 움직이기(단추·적기) 무시 — 판 불변
     ④ 네 판 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(자리별 안내)
     ⑤ 판을 읽기 전 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시
     ⑥ 빈칸 전 마무리 무시(순서)
     ⑦ 알맞지 않은 마무리 무시
     ⑧ 안내 표시 중 재클릭 무시(`kxBusy`)
     ⑨ 이미 적은 판 다시 적기 무시 — 판 불변
     ⑩ 한 칸 틀을 대지 않고 적기 무시(`KX_FRAME`) — 판 불변.
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.kx-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 땅 칸과 점은 도식이다** — 점 하나는 실제 사람 한 명이 아니고, 칸 하나는 실제 면적이 아니다(캡션 상시).
  ㉡ **판은 나라별 인구 밀도를 계산하지 않는다** — 수치는 교과서 자료만 슬라이드에 적는다.
  ㉢ **판의 점은 사람 형상이 아니다** — 동그라미 도형만.

.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====

function sceneCard(key,cap,extra){ return `<div class="scene ${extra||''}">${SVG[key]||''}${cap?`<div class="cap">${cap}</div>`:''}</div>`; }

   ★ 한 칸의 점 수는 kxPer 한 줄(KX_DOTS ÷ KX_TILES) · 높아요·보통·낮아요는 kxLevel 한 줄 · 적을 수 있는 판은 kxKind 한 줄(틀을 대었을 때만).
   ★★ 판 기록은 |= 만(kxLog · kxNote 단 하나 · 판 적기 처리기에서만).
   ⚠️ 전량 고정 리터럴 — 난수 0. 조작에 점수 0. 땅 칸과 점은 도식이다. */
const KX_N = 3;
const KX_ALL = 15;
/* 단추 셋 — 인구수 · 면적 · 한 칸 틀 */
const KX_BTN = ['인구수','면적','한 칸 틀'];

const KX_READ_AGAIN = '<b>이미 판을 읽었어요.</b> 판은 그대로예요.';
const KX_ORDER_K = '아직 <b>판을 읽지 않았어요.</b> 판을 먼저 읽어 봐요. 판은 그대로예요.';
const KX_MEAN_AGAIN = '꼭! 기억해요 빈칸은 <b>이미 채웠어요</b>. 판은 그대로예요.';
const KX_ORDER_F = '아직 <b>꼭! 기억해요 빈칸</b>을 채우지 않았어요. 먼저 골라 봐요. 판은 그대로예요.';
const KX_ALL_MSG = '네 판을 <b>모두 적었어요</b>. 판을 읽어 봐요.';

function kxOn(st,b){ return (st.kxGate & (1<<b))!==0; }
/* ★ 한 칸의 점 수 — 한 줄(점 ÷ 칸) */
function kxPer(st){ return KX_DOTS[st.kxGate & 1] / KX_TILES[(st.kxGate >> 1) & 1]; }
/* ★ 인구 밀도 — 한 줄 · 0 낮아요 · 1 보통이에요 · 2 높아요 */
function kxLevel(st){ return Math.sign(kxPer(st) - 4) + 1; }
/* ★ 적을 수 있는 판 — 한 줄 · 한 칸 틀을 대었을 때만 인구수·면적 두 비트 번호 · 아니면 4 */
function kxKind(st){ return (st.kxGate & 4) ? (st.kxGate & 3) : 4; }
function kxHas(st,l){ return (st.kxLog & (1<<l))!==0; }
function kxLines(st){ return [0,1,2,3].filter(l=>kxHas(st,l)).length; }
function kxAll(st){ return st.kxLog===KX_ALL; }

function kxBtns(st){
  return KX_BTN.map((t,b)=>{ const on=kxOn(st,b)?1:0;
    return `<button class="kx-btn" data-b="${b}" data-on="${on}" onclick="kxTap(${b})"><span>${KX_ICON[b]} ${t}</span><span class="st">${KX_ST[b][on]}</span></button>`; }).join('');
}
function kxLand(st){
  const wide=kxOn(st,1)?1:0, cols=wide?4:2, tiles=KX_TILES[wide], per=kxPer(st), n=Math.sqrt(per), x0=wide?100:130, y0=wide?14:29;
  const cells=Array.from({length:tiles},(_,t)=>{ const x=x0+(t%cols)*30, y=y0+((t/cols)|0)*30;
    const dots=Array.from({length:per},(_,k)=>`<circle class="kx-dot" cx="${x+(k%n+1)*30/(n+1)}" cy="${y+(((k/n)|0)+1)*30/(n+1)}" r="${per>=16?1.9:2.8}" fill="#7C3AED"/>`).join('');
    return `<rect class="kx-tile" data-t="${t}" x="${x}" y="${y}" width="30" height="30" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>${dots}`; }).join('');
  const frame=kxOn(st,2)?`<rect class="kx-frame" x="${x0-2}" y="${y0-2}" width="34" height="34" fill="none" stroke="#B45309" stroke-width="3" stroke-dasharray="5 3"/>`:'';
  return `<svg viewBox="0 0 320 90" data-tiles="${tiles}" data-per="${per}" data-frame="${kxOn(st,2)?1:0}"><rect width="320" height="90" fill="#F8FAFC"/>${cells}${frame}</svg>`;
}
function kxNotes(st){
  return KX_CASE.map((t,l)=>{ const on=kxHas(st,l);
    return `<div class="kx-line${on?' set':''}" data-line="${l}">${on?'\u270F\uFE0F '+t+' \u2014 '+KX_LVTXT[kxLevel({kxGate:l})]+' \u00b7 '+KX_EX[l]:'\u2610 '+t+' \u2014 아직 적지 않았어요'}</div>`; }).join('');
}

function kxBoard(st){
  const fin = st.kxFin!=null, all = kxAll(st), fr=kxOn(st,2);
  const head = fin ? '한 칸 틀로 인구 밀도를 살펴보고 정리했어요'
    : st.kxMean!=null ? '꼭! 기억해요 빈칸까지 채웠어요 \u2014 이제 정리해요'
    : st.kxRead!=null ? '꼭! 기억해요 빈칸을 채워 봐요'
    : all ? '네 판을 모두 적었어요 \u2014 판을 읽어 봐요'
    : st.kxLog!==0 ? '인구수나 면적을 바꿔 다음 판도 적어 봐요'
    : '인구수와 면적을 정하고 한 칸 틀을 대어 판을 적어요';
  return `<div class="kx-board" data-gate="${st.kxGate}" data-log="${st.kxLog}" data-lines="${kxLines(st)}" data-all="${all?1:0}" data-read="${st.kxRead==null?-1:st.kxRead}" data-mean="${st.kxMean==null?-1:st.kxMean}" data-fin="${fin?1:0}">
    <div class="kx-head">${head}</div>
    <div class="kx-gate">${kxBtns(st)}</div>
    <div class="kx-land">${kxLand(st)}</div>
    <div class="kx-say" data-frame="${fr?1:0}">인구수 <b>${KX_ST[0][kxOn(st,0)?1:0]}</b> \u00b7 면적 <b>${KX_ST[1][kxOn(st,1)?1:0]}</b> \u2014 ${fr?`한 칸 틀 안: <b>${KX_LVTXT[kxLevel(st)]}</b>`:'한 칸 틀을 대야 인구 밀도를 알 수 있어요'}</div>
    <div class="kx-row"><button class="kx-pen" data-pen="1" onclick="kxWrite()">\u270F\uFE0F 판 적기</button></div>
    <div class="kx-note"><div class="nh">\uD83D\uDCD2 인구 밀도 기록장</div>${kxNotes(st)}</div>
  </div>`;
}

function kxPanel(st){
  const fin = st.kxFin!=null, all = kxAll(st);
  const q = fin ? '한 칸 틀로 세계 여러 나라의 인구 밀도를 살펴봤어요.'
    : st.kxMean!=null ? '오늘 공부한 내용을 정리해요. 세계 여러 나라의 인구 밀도는 어떠한가요?'
    : st.kxRead!=null ? '꼭! 기억해요 \u2014 「세계 여러 나라는 면적과 인구수에 따라 (  )이/가 다르게 나타납니다」의 빈칸에 알맞은 말은 무엇일까요?'
    : all ? '네 판을 모두 적었어요. 판에서 무엇을 알 수 있나요?'
    : st.kxLog!==0 ? '인구수와 면적을 바꿔 가며 네 판을 모두 적어요.'
    : '인구수와 면적을 바꾸고 한 칸 틀을 대어 봐요. 한 칸에 사는 인구는 무엇에 따라 달라질까요?';
  let right = `<div class="kx-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83D\uDD32 한 칸 틀로 살펴보며 정리했어요</div>
      <b>인구 밀도</b>는 일정한 면적(1 km\u00b2) 안에 사는 인구수로, 인구가 모여 있는 정도를 나타내요.
      세계 여러 나라의 인구 밀도는 <b>나라마다 달라요</b>. 방글라데시, 르완다, 인도처럼 인구 밀도가 높은 나라도 있고 몽골, 오스트레일리아, 캐나다처럼 낮은 나라도 있어요.<br>
      <span style="color:#64748B">판의 땅 칸과 점은 도식이에요.
      <b>사회과 부도에서 나라 찾기</b>, <b>인터넷에서 인구 밀도 검색하기</b>, <b>더 알아보고 싶은 나라 조사하기</b>, <b>친구와 이야기하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.kxMean!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="kx-fin">${KX_FIN.map((t,k)=>`<button class="${st.kxWrongF===k?'no':''}" onclick="kxFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.kxRead!=null){
    right += `<div class="dw-step">\uD83D\uDCCC 꼭! 기억해요 빈칸</div>`;
    right += `<div class="kx-mean">${KX_MEAN.map((t,k)=>`<button class="${st.kxWrongK===k?'no':''}" onclick="kxMeanPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="kx-hint">한 칸 틀 안에 사는 인구수, 곧 인구가 모여 있는 정도를 부르는 말이에요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="kx-read">${KX_READ.map((t,k)=>`<button class="${st.kxWrongR===k?'no':''}" onclick="kxReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDD32 한 칸 틀을 대요</div>`;
    right += `<div class="kx-hint"><b>인구수</b> 단추를 누르면 점이 적어지거나 많아지고, <b>면적</b> 단추를 누르면 땅이 좁아지거나 넓어져요. <b>한 칸 틀</b> 단추를 눌러 틀을 대면 한 칸에 사는 인구를 볼 수 있어요. 틀을 댄 채로 <b>판 적기</b>를 누르면 기록장에 적혀요. 네 판을 모두 적으면 판을 읽을 수 있어요. 감점은 없어요.</div>`;
  }
  if(st.kxMsg) right += `<div class="dw-msg${st.kxWarn?' warn':''}">${st.kxMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDD32 한 칸 틀을 대요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${kxBoard(st)}<div class="cvcap">판의 땅 칸과 점은 <b>도식</b>이에요. 점 하나는 실제 사람 한 명이 아니고, 칸 하나는 실제 면적이 아니에요. 판은 나라별 인구 밀도를 계산하지 않아요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";

  }).join("");

  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;

  let hintHTML="";

function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

/* ★ 판 기록 — 더하기만 하는 자리 단 하나 */
function kxNote(l){ state.kxLog |= (1 << l); }

/* ① 단추 — 0 인구수(적어요 ↔ 많아요) · 1 면적(좁아요 ↔ 넓어요) · 2 한 칸 틀(뗐어요 ↔ 대었어요) */
function kxTap(b){
  if(state.kxFin!=null) return;                                        // 가드①
  if(state.kxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(b) || b<0 || b>=KX_N) return;                   // 가드②
  if(kxAll(state)){ kxHold(KX_LOCK); return; }                         // 가드③ 판 불변
  state.kxGate ^= (1 << b);                                            // ★ 판이 바뀌는 자리 단 하나
  state.kxWarn=false; state.kxMsg=null; playBlip(); kxRender();
}

/* ② 판 적기 — 한 칸 틀을 대었고(가드⑩) 아직 적지 않았을 때만(가드⑨) */
function kxWrite(){
  if(state.kxFin!=null) return;                                        // 가드①
  if(state.kxBusy) return;                                             // 가드⑧
  if(kxAll(state)){ kxHold(KX_LOCK); return; }                         // 가드③ 판 불변
  const l = kxKind(state);
  if(l===4){ kxHold(KX_FRAME); return; }                               // 가드⑩ 한 칸 틀을 대지 않음 — 판 불변
  if(kxHas(state,l)){ kxHold(KX_AGAIN); return; }                      // 가드⑨ 이미 적은 판 — 판 불변
  kxNote(l);
  state.kxWarn=false;
  if(kxAll(state)){ state.kxMsg = KX_ALL_MSG; playChime(); }
  else { state.kxMsg = `적었어요 \u2014 ${KX_CASE[l]}이면 ${KX_LVTXT[kxLevel(state)]}. 인구수나 면적 단추를 눌러 다른 판을 만들어 봐요.`; playChime(); }
  kxRender();
}

/* ③ 판 읽기 — 네 판 뒤에만(가드④) */
function kxReadPick(k){
  if(state.kxFin!=null) return;                                        // 가드①
  if(state.kxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=KX_READ.length) return;         // 가드②
  if(!kxAll(state)){ kxHold(KX_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.kxRead!=null){ kxHold(KX_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===KX_READ_OK){
    state.kxRead=k; state.kxWrongR=null; state.kxWarn=false;
    state.kxMsg = '판을 잘 읽었어요. <b>면적에 비해 인구수가 많을수록</b> 한 칸에 사는 인구가 많아 인구 밀도가 높아요.';
    playChime(); kxRender(); return;
  }
  state.kxWrongR=k;
  kxHold(KX_READ_NO[k]);
}

/* ④ 꼭! 기억해요 빈칸 — 판을 읽은 뒤에만(가드⑤). */
function kxMeanPick(k){
  if(state.kxFin!=null) return;                                        // 가드①
  if(state.kxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=KX_MEAN.length) return;         // 가드②
  if(state.kxRead==null){ kxHold(KX_ORDER_K); return; }                // 가드⑤ 순서 — 판 불변
  if(state.kxMean!=null){ kxHold(KX_MEAN_AGAIN); return; }             // 가드⑤ 판 불변
  if(k!==KX_MEAN_OK){ state.kxWrongK=k; kxHold(KX_MEAN_NO[k]); return; } // 가드⑤ 판 불변
  state.kxMean = k;                                                    // ★ 빈칸을 고르는 자리 단 하나
  state.kxWarn=false;
  state.kxMsg = '세계 여러 나라는 면적과 인구수에 따라 <b>인구 밀도</b>가 다르게 나타나요.';
  playChime(); kxRender();
}

/* ⑤ 마무리 — 지도서 5차시 주요 내용 정리 */
function kxFinish(k){
  if(state.kxFin!=null) return;                                        // 가드①
  if(state.kxBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=KX_FIN.length) return;          // 가드②
  if(state.kxMean==null){ kxHold(KX_ORDER_F); return; }                // 가드⑥ 순서 — 판 불변
  if(k===KX_FIN_OK){
    state.kxFin=k; state.kxWrongF=null; state.kxMsg=null; state.kxWarn=false;
    playChime(); kxRender(); return;
  }
  state.kxWrongF=k;
  kxHold(KX_FIN_NO[k]);                                                // 가드⑦ 판 불변
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 3단원 4차시(u3 l04) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

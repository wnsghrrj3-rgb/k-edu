<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6학년 2학기 사회 · K-edu</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#F5F7FA;min-height:100vh;color:#1A202C}

.top-bar{background:#fff;border-bottom:1px solid #E2E8F0;height:52px;display:flex;align-items:center;padding:0 24px;gap:12px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#718096;text-decoration:none;font-weight:500;transition:color .15s}
.back-link:hover{color:#1A202C}
.top-title{font-family:'Jua',sans-serif;font-size:16px;color:#1A202C}

main{max-width:800px;margin:0 auto;padding:28px 20px 60px}

.page-header{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.subject-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:50px;font-family:'Jua',sans-serif;font-size:18px;color:#fff;background:#1D4ED8}
.page-title{font-family:'Jua',sans-serif;font-size:26px}

.unit-section{margin-bottom:30px}
.unit-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #E2E8F0}
.unit-num{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:16px;color:#fff}
.unit-name{font-family:'Jua',sans-serif;font-size:18px;color:#1A202C}
.unit-count{font-size:13px;color:#A0AEC0;margin-left:auto}

.topic-name{font-family:'Jua',sans-serif;font-size:14px;color:#4A5568;margin:14px 0 8px;padding-left:2px;display:flex;align-items:center;gap:8px}
.topic-name::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--uc)}
.topic-std{font-size:11px;color:#A0AEC0;font-weight:400;font-family:'Noto Sans KR',sans-serif}

.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 1px 8px rgba(0,0,0,.05);cursor:pointer;text-decoration:none;color:#1A202C;border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s}
.lesson-card:hover{transform:translateY(-2px);border-color:var(--uc);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.lesson-num{min-width:32px;height:32px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:14px;color:#fff;background:var(--uc);flex-shrink:0}
.lesson-title{font-size:14px;font-weight:500;flex:1}
.lesson-arrow{color:#CBD5E0;font-size:16px}
.lesson-badge{font-size:11px;padding:2px 8px;border-radius:50px;font-weight:500;flex-shrink:0}
.badge-tb{background:#EBF8FF;color:#2B6CB0}
.badge-soon{background:#EDF2F7;color:#A0AEC0}

.lesson-card-soon{background:#FAFAFA;box-shadow:none;border:1px dashed #E2E8F0;cursor:default;opacity:.7}
.lesson-card-soon:hover{transform:none;border-color:#E2E8F0;box-shadow:none}
.lesson-card-soon .lesson-num{background:#CBD5E0!important}
.lesson-card-soon .lesson-title{color:#A0AEC0}

footer{text-align:center;padding:18px 24px;border-top:1px solid #E2E8F0;background:#fff}
.footer-text{font-size:12px;color:#A0AEC0}
.footer-text strong{color:#718096;font-weight:500}
.footer-text a{color:#5B8EF8;text-decoration:none;margin-left:10px}
.footer-text a:hover{text-decoration:underline}

@media(max-width:600px){
  .page-header{flex-direction:column;align-items:flex-start;gap:8px}
  .page-title{font-size:22px}
  .lesson-card{padding:12px 14px}
}
</style>
  <script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>

<main>
  <div class="page-header">

  </div>

  <div id="content"></div>
</main>

<script>
const DIR1 = "1단원_세계의자연환경/";
const DIR2 = "2단원_시장경제와국가간거래/";
const DIR3 = "3단원_지구촌사람들/";

const UNITS = [
  {
    num: 1, name: "세계의 자연환경", emoji: "\u{1F3D4}\uFE0F", color: "#0369A1",
    topics: [
      { name: "\u2460 세계 여러 지역의 지형 경관과 다양한 생활 모습", std: "[6\uC0AC10-01]", lessons: [
        {n:"1", file:DIR1+"g6_social_u1_l01_같아도갈려요.html", title:"세계 여러 지역의 지형 경관을 알아볼까요", track:"tb"},
        {n:"2", file:DIR1+"g6_social_u1_l02_까닭을켜요.html", title:"세계의 유명한 산지 지형과 생활 모습을 알아볼까요", track:"tb"},
        {n:"3", file:DIR1+"g6_social_u1_l03_강이날라요.html", title:"세계의 유명한 하천 지형과 생활 모습을 알아볼까요", track:"tb"},
        {n:"4", file:DIR1+"g6_social_u1_l04_함께움직여요.html", title:"세계의 유명한 해안 지형과 생활 모습을 알아볼까요", track:"tb"},
        {n:"5", file:DIR1+"g6_social_u1_l05_표에서나와요.html", title:"세계의 지형 경관과 생활 모습을 조사해 볼까요", track:"tb"}
      ]},
      { name: "\u2461 세계의 기후와 다양한 생활 모습", std: "[6\uC0AC10-02]", lessons: [
        {n:"6", title:"세계의 기후 분포를 알아볼까요", track:"soon"},
        {n:"7", title:"열대 기후와 건조 기후 지역의 생활 모습을 알아볼까요", track:"soon"},
        {n:"8", title:"온대 기후와 냉대 기후 지역의 생활 모습을 알아볼까요", track:"soon"},
        {n:"9", title:"한대 기후와 고산 기후 지역의 생활 모습을 알아볼까요", track:"soon"},
        {n:"10", title:"기후에 따른 사람들의 다양한 생활 모습을 조사해 볼까요", track:"soon"},
        {n:"11", title:"[생각을 펼쳐요] 자연환경을 고려한 상품의 판매 계획 세우기", track:"soon"},
        {n:"12", title:"1단원 마무리 \u2014 생각 그물\u00B7교실 놀이", track:"soon"}
      ]}
    ]
  },
  {
    num: 2, name: "시장경제와 국가 간 거래", emoji: "\u{1F3EA}", color: "#A16207",
    topics: [
      { name: "\u2460 우리나라 시장경제의 특징", std: "[6\uC0AC11-01]", lessons: [
        {n:"1", title:"시장경제가 무엇인지 알아볼까요", track:"soon"},
        {n:"2", title:"가계와 기업의 역할을 알아볼까요", track:"soon"},
        {n:"3", title:"근로자의 권리를 보호하는 모습을 살펴볼까요", track:"soon"},
        {n:"4", title:"기업의 자유와 사회적 책임을 알아볼까요", track:"soon"}
      ]},
      { name: "\u2461 경제성장과 우리 생활", std: "[6\uC0AC11-02]", lessons: [
        {n:"5", title:"경제성장이 무엇인지 알아볼까요", track:"soon"},
        {n:"6", title:"경제성장이 우리 생활에 미치는 영향을 알아볼까요", track:"soon"},
        {n:"7", title:"빠른 경제성장으로 발생한 문제를 알아볼까요", track:"soon"},
        {n:"8", title:"빠른 경제성장으로 발생한 문제를 해결해 볼까요", track:"soon"}
      ]},
      { name: "\u2462 세계 속의 무역", std: "[6\uC0AC11-03]", lessons: [
        {n:"9", title:"무역이 무엇인지 알아볼까요", track:"soon"},
        {n:"10", title:"무역이 이루어지는 까닭을 알아볼까요", track:"soon"},
        {n:"11", title:"무역이 이루어지는 다양한 모습을 살펴볼까요", track:"soon"},
        {n:"12", title:"무역을 통한 세계 여러 나라의 상호 의존과 경쟁 관계를 살펴볼까요", track:"soon"},
        {n:"13", title:"[생각을 펼쳐요] 기업 운영 계획 세우고 기업 소개 잡지 완성하기", track:"soon"},
        {n:"14", title:"2단원 마무리 \u2014 생각 그물\u00B7교실 놀이", track:"soon"}
      ]}
    ]
  },
  {
    num: 3, name: "지구촌 사람들", emoji: "\u{1F310}", color: "#7C3AED",
    topics: [
      { name: "\u2460 세계의 인구 분포", std: "[6\uC0AC12-01]", lessons: [
        {n:"1", title:"세계의 인구 분포를 알아볼까요", track:"soon"},
        {n:"2", title:"세계 여러 나라의 인구수를 알아볼까요", track:"soon"},
        {n:"3", title:"세계 여러 나라의 인구 밀도를 알아볼까요", track:"soon"},
        {n:"4", title:"세계 여러 나라의 인구 구조를 알아볼까요", track:"soon"}
      ]},
      { name: "\u2461 지구촌의 문제와 지속가능한 미래", std: "[6\uC0AC12-02]", lessons: [
        {n:"5", title:"지구촌을 위협하는 여러 가지 문제를 알아볼까요", track:"soon"},
        {n:"6", title:"지구촌을 위협하는 여러 가지 문제를 조사해 볼까요", track:"soon"},
        {n:"7", title:"지속가능한 미래를 위한 노력을 살펴볼까요", track:"soon"},
        {n:"8", title:"지속가능한 미래를 위해 우리가 할 수 있는 일을 실천해 볼까요", track:"soon"},
        {n:"9", title:"[생각을 펼쳐요] 그림책 스토리보드 만들기", track:"soon"},
        {n:"10", title:"3단원 마무리 \u2014 생각 그물\u00B7교실 놀이", track:"soon"}
      ]}
    ]
  }
];

const content = document.getElementById('content');
UNITS.forEach((unit) => {
  const all = unit.topics.reduce((a,t)=>a.concat(t.lessons), []);
  const tbCount = all.filter(l => l.track === 'tb').length;
  const soonCount = all.filter(l => l.track === 'soon').length;

  const section = document.createElement('div');
  section.className = 'unit-section';

  let html = `
    <div class="unit-header">
      <div class="unit-num" style="background:${unit.color}">${unit.num}</div>
      <div class="unit-name">${unit.emoji} ${unit.num}단원: ${unit.name}</div>
      <div class="unit-count">라이브 ${tbCount}차시${soonCount ? ' · 준비 중 ' + soonCount : ''}</div>
    </div>
  `;

  unit.topics.forEach((topic) => {
    html += `<div class="topic-name" style="--uc:${unit.color}">${topic.name} <span class="topic-std">${topic.std}</span></div>`;
    html += `<div class="lesson-list">`;
    html += topic.lessons.map(l => l.track === 'tb' ? `
      <a class="lesson-card" href="${l.file}" style="--uc:${unit.color}">
        <div class="lesson-num">${l.n}</div>
        <div class="lesson-title">${l.title}</div>
        <span class="lesson-badge badge-tb">교과서</span>
        <div class="lesson-arrow">›</div>
      </a>
    ` : `
      <div class="lesson-card lesson-card-soon">
        <div class="lesson-num">${l.n}</div>
        <div class="lesson-title">${l.title}</div>
        <span class="lesson-badge badge-soon">준비 중</span>
      </div>
    `).join('');
    html += `</div>`;
  });

  section.innerHTML = html;
  content.appendChild(section);
});
</script>

  ⭐ 학생이 누르는 단추는 셋뿐이다 — 관광객 맞이하기 · 섬 쉬게 하기(폐쇄) · 섬 다시 열기.

  ⭐ 근거 = 지도서 5차시 예시 답안 「긍정적 영향 — 관광 산업의 발달로 주민들에게 일자리가 생기고 소득이 늘어난다 /
     부정적 영향 — 환경 오염 및 쓰레기 문제가 발생한다」 · 지도 꿀 Tip 「관광 산업에 관한 균형적 시각」.

  ⭐ 의견(찬성/반대)은 **정답이 없다** — 어느 쪽을 골라도 받아들이고, 고른 쪽이 치르는 값을 판에서 본 대로 적어 준다. 한 번만.

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 12종:

     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 섬이 쉬는 동안 관광객 맞이하기 무시 — 판 불변
     ④ 관광객이 가득 찼을 때 맞이하기 무시 — 판 불변
     ⑤ 쉬게 할 까닭이 없을 때(맞이한 관광객 0 · 이미 쉼) 쉬게 하기 무시 — 판 불변
     ⑥ 섬이 열려 있을 때 다시 열기 무시 — 판 불변
     ⑦ 두 가지를 모두 겪기 전 판 읽기 무시(순서) — 판 불변
     ⑧ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑨ 판을 읽기 전 의견 무시(순서) — 판 불변
     ⑩ 의견을 고른 뒤 의견 다시 무시(한 번만) — 판 불변
     ⑪ 의견 전 마무리 무시(순서) — 판 불변
     ⑫ 안내 표시 중 재클릭 무시(`bkBusy`).
   재시도 허용(감점 없음), 조작·의견에 점수 0. 발문은 `.bk-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 그림은 도식이지 사진이 아니다** — 실제 모습은 교과서 사진으로 본다(캡션 상시).
  ㉡ **판은 두 영향이 함께 움직인다는 것만 보였다** — 실제로는 두 영향의 크기가 언제나 같지는 않다(캡션 상시).
  ㉢ **찬성과 반대에는 옳고 그름이 없다** — 판은 어느 의견도 채점하지 않는다.

/* ★★ 두 칸이 읽는 단 하나의 수 — 쉬면 0, 아니면 맞이한 관광객 */
function bkLive(st){ return st.bkShut ? 0 : st.bkTour; }
function bkGood(st){ return bkLive(st); }
function bkBad(st){ return bkLive(st); }
function bkSeenAll(st){ return st.bkSeen===3; }

function bkCanvas(st){
  const fin = st.bkFin!=null, live = bkLive(st), seen = bkSeenAll(st);
  const head = fin ? '해안 지형과 생활 모습을 살펴보았어요'
    : st.bkMine!=null ? '의견을 골랐어요 \u2014 이제 정리해요'
    : st.bkRead!=null ? '판을 읽었어요 \u2014 나의 의견을 골라요'
    : seen ? '두 가지를 모두 겪어 보았어요'
    : '관광객을 맞이하고 섬을 쉬게 해 봐요';

  /* 섬 — 파라솔 수 = 맞이한 관광객(쉬면 0) · 쓰레기 수 = 부정적 영향 칸 */
  let isle = `<rect x="8" y="32" width="304" height="40" fill="${bkBad(st)>=BK_MAX?'#A8A29E':'#7DD3FC'}"/>
    <path d="M8 72 Q160 62 312 72 L312 104 L8 104 Z" fill="#FDE68A"/>`;
  for(let u=0;u<live;u++) isle += `<g data-umb="${u}"><path d="M${40+u*44} 84 L${52+u*44} 72 L${64+u*44} 84 Z" fill="#F59E0B"/><rect x="${51+u*44}" y="82" width="2" height="14" fill="#78350F"/></g>`;
  for(let t=0;t<bkBad(st);t++) isle += `<path data-trash="${t}" d="M${200+t*30} 100 L${206+t*30} 88 L${212+t*30} 100 Z" fill="#64748B"/>`;
  if(st.bkShut) isle += `<g data-closed="1"><rect x="96" y="40" width="128" height="20" rx="6" fill="#fff" stroke="#B45309" stroke-width="1.2"/>
    <text x="160" y="53.5" font-size="7.2" fill="#92400E" text-anchor="middle" font-weight="800">섬이 쉬고 있어요</text></g>`;

  /* 두 칸 — 둘 다 bkLive 하나에서 */
  const cell = (x,label,n,lines,rest,tag,color)=>{
    let s = `<g data-cell="${tag}" data-n="${n}"><rect x="${x}" y="112" width="146" height="132" rx="8" fill="#F8FAFC" stroke="${color}" stroke-width="1.3"/>
      <text x="${x+73}" y="126" font-size="7.4" fill="${color}" text-anchor="middle" font-weight="800">${label}</text>`;
    if(st.bkShut) s += `<text x="${x+73}" y="148" font-size="5.8" fill="#334155" text-anchor="middle" font-weight="700" data-rest="${tag}">${rest}</text>`;
    else for(let r=0;r<n;r++) s += `<text x="${x+73}" y="${148+r*16}" font-size="5.8" fill="#334155" text-anchor="middle" font-weight="700" data-line="${tag}">${lines[r]}</text>`;
    for(let b=0;b<BK_MAX;b++) s += `<rect x="${x+9+b*44}" y="204" width="40" height="18" rx="3" fill="${b<n?color:'#E2E8F0'}" ${b<n?`data-bar="${tag}"`:''}/>`;
    return s + `<text x="${x+73}" y="238" font-size="6.6" fill="${color}" text-anchor="middle" font-weight="800">${n} / ${BK_MAX}</text></g>`;
  };
  const cells = cell(8,'긍정적 영향 \u00b7 일자리와 소득',bkGood(st),BK_GOOD,BK_REST_G,'good','#0369A1')
              + cell(166,'부정적 영향 \u00b7 쓰레기와 오염',bkBad(st),BK_BAD,BK_REST_B,'bad','#B45309');
  const tally = `관광객 ${live} / ${BK_MAX} \u00b7 가득 차 보기 ${(st.bkSeen&1)?'\u2713':'\u25CB'} \u00b7 쉬게 해 보기 ${(st.bkSeen&2)?'\u2713':'\u25CB'}`;
  return `<svg viewBox="0 0 320 280" data-tour="${st.bkTour}" data-shut="${st.bkShut?1:0}" data-live="${live}" data-good="${bkGood(st)}" data-bad="${bkBad(st)}" data-seen="${st.bkSeen}" data-read="${st.bkRead==null?-1:st.bkRead}" data-mine="${st.bkMine==null?-1:st.bkMine}" data-fin="${fin?1:0}">
    <rect width="320" height="280" fill="#fff"/>
    <rect x="8" y="8" width="304" height="18" rx="6" fill="#E0F2FE"/>
    <text x="160" y="20.5" font-size="7.6" fill="#075985" text-anchor="middle" font-weight="800">${head}</text>
    ${isle}
    ${cells}
    <rect x="8" y="252" width="304" height="20" rx="6" fill="#FEF3C7"/>
    <text x="160" y="265.5" font-size="7" fill="#92400E" text-anchor="middle" font-weight="800" data-tally="1">${tally}</text>
  </svg>`;
}

function bkPanel(st){
  const fin = st.bkFin!=null, seen = bkSeenAll(st);
  const q = fin ? '세계의 유명한 해안 지형과 생활 모습을 살펴보았어요.'
    : st.bkMine!=null ? '오늘 공부한 내용을 어떻게 정리하면 좋을까요?'
    : st.bkRead!=null ? '나는 보라카이섬의 폐쇄에 찬성하나요, 반대하나요?'
    : seen ? '왜 한 칸만 올리거나 한 칸만 내릴 수는 없었을까요?'
    : '관광객이 늘면 섬 주민들의 생활은 어떻게 달라질까요?';
  let right = `<div class="bk-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDFD6\uFE0F 두 칸이 함께 움직여요</div>
      관광객을 맞이하자 <b>일자리와 소득</b>이 늘었지만 <b>쓰레기와 오염</b>도 함께 늘었어요.
      섬을 쉬게 하자 자연환경은 지켰지만 주민들의 <b>일자리와 소득</b>도 함께 줄었어요.
      관광 산업에는 긍정적 영향과 부정적 영향이 함께 있어요.<br>
      <span style="color:#64748B">판은 두 영향이 함께 움직인다는 것만 보인 <b>도식</b>이에요. 실제로는 두 영향의 크기가 언제나 같지는 않아요.
      찬성과 반대에는 옳고 그름이 없어요. 친구와 <b>의견 나누기</b>와 활동지 쓰기는 교실에서 직접 해요.</span></div>`;
  } else if(st.bkMine!=null){
    right += `<div class="bk-said">나의 의견 \u2014 <b>${BK_MINE[st.bkMine]}</b><br>${BK_MINE_T[st.bkMine]}</div>`;
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="bk-fin">${BK_FIN.map((t,k)=>`<button class="${st.bkWrongF===k?'no':''}" onclick="bkFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.bkRead!=null){
    right += `<div class="dw-step">\uD83D\uDDE3\uFE0F 나의 의견</div>`;
    right += `<div class="bk-mine">${BK_MINE.map((t,k)=>`<button onclick="bkMinePick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="bk-note">어느 쪽을 골라도 좋아요. 의견에는 <b>옳고 그름이 없어요</b>. 판은 고른 쪽의 좋은 점과 걱정되는 점을 함께 보여 줘요.</div>`;
  } else if(seen){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="bk-read">${BK_READ.map((t,k)=>`<button class="${st.bkWrongR===k?'no':''}" onclick="bkReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83C\uDFD6\uFE0F 섬을 움직여요</div>`;
    right += `<div class="bk-ops">
      <button onclick="bkWelcome()"><span class="ct">관광</span>관광객 맞이하기</button>
      <button onclick="bkRest()"><span class="ct">폐쇄</span>섬 쉬게 하기</button>
      <button onclick="bkOpen()"><span class="ct">다시</span>섬 다시 열기</button></div>`;
    right += `<div class="bk-note">섬이 관광객으로 <b>가득 차 보기</b>와 섬을 <b>쉬게 해 보기</b>를 모두 해 봐요. <b>어느 것부터</b> 해도 좋아요. 몇 번이고 해도 되고, 감점은 없어요.</div>`;
  }
  if(st.bkMsg) right += `<div class="dw-msg${st.bkWarn?' warn':''}">${st.bkMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDFD6\uFE0F 두 칸이 함께 움직이는 판</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${bkCanvas(st)}<div class="cvcap">판의 그림은 <b>도식</b>이에요. 판은 관광의 두 영향이 함께 움직인다는 것만 보였어요 \u2014 실제로는 두 영향의 크기가 언제나 같지는 않아요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  bkTour:0, bkShut:false, bkSeen:0, bkRead:null, bkMine:null, bkFin:null,
  bkWrongR:null, bkWrongF:null,
  bkMsg:null, bkWarn:false, bkBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function bkRender(){ main.innerHTML = slides[state.idx].render(state); }
function bkHold(msg){
  state.bkWarn=true; state.bkBusy=true; state.bkMsg=msg;
  playThud(); bkRender();
  setTimeout(()=>{ state.bkBusy=false; state.bkWarn=false; state.bkMsg=null;
    state.bkWrongR=null; state.bkWrongF=null; bkRender(); },1600);
}

/* ① 관광객 맞이하기 — ★ 두 칸이 함께 오른다(두 칸은 bkLive 하나만 읽음). */
function bkWelcome(){
  if(state.bkFin!=null) return;                                        // 가드①
  if(state.bkBusy) return;                                             // 가드⑫
  if(state.bkShut){ bkHold(BK_RESTING); return; }                      // 가드③ 판 불변
  if(state.bkTour>=BK_MAX){ bkHold(BK_FULL); return; }                 // 가드④ 판 불변
  state.bkTour += 1;                                                   // ★ 관광객이 느는 자리 단 하나
  if(state.bkTour===BK_MAX) state.bkSeen |= 1;                         // ★ 가득 차 보기 — 줄지 않음
  state.bkWarn=false;
  let m = '관광객을 맞이했어요. <b>일자리·소득 칸</b>과 <b>쓰레기·오염 칸</b>이 함께 한 칸 올랐어요.';
  if(state.bkTour===BK_MAX) m += ' 섬이 관광객으로 <b>가득</b> 찼어요.';
  state.bkMsg = bkSeenAll(state) ? BK_ALL_MSG : m;
  playBlip(); bkRender();
}

/* ② 섬 쉬게 하기(폐쇄) — ★ 두 칸이 함께 내려간다. */
function bkRest(){
  if(state.bkFin!=null) return;                                        // 가드①
  if(state.bkBusy) return;                                             // 가드⑫
  if(state.bkShut || state.bkTour===0){ bkHold(BK_NOREST); return; }  // 가드⑤ 판 불변
  state.bkShut = true;                                                 // ★ 섬이 쉬는 자리 단 하나
  state.bkSeen |= 2;                                                   // ★ 쉬게 해 보기 — 줄지 않음
  state.bkWarn=false;
  state.bkMsg = bkSeenAll(state) ? BK_ALL_MSG : '섬을 쉬게 했어요. <b>쓰레기·오염 칸</b>과 <b>일자리·소득 칸</b>이 함께 내려갔어요.';
  playBlip(); bkRender();
}

/* ③ 섬 다시 열기 — 관광객을 처음부터 다시 맞이한다. */
function bkOpen(){
  if(state.bkFin!=null) return;                                        // 가드①
  if(state.bkBusy) return;                                             // 가드⑫
  if(!state.bkShut){ bkHold(BK_NOTSHUT); return; }                     // 가드⑥ 판 불변
  state.bkShut = false; state.bkTour = 0;                              // ★ 섬이 다시 열리는 자리 단 하나
  state.bkWarn=false;
  state.bkMsg = '섬을 다시 열었어요. 관광객을 <b>처음부터</b> 다시 맞이해요.';
  playBlip(); bkRender();
}

/* ④ 판 읽기 — 두 가지를 모두 겪어야 열린다(가드⑦). */
function bkReadPick(k){
  if(state.bkFin!=null) return;                                        // 가드①
  if(state.bkBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=BK_READ.length) return;         // 가드②
  if(!bkSeenAll(state)){ bkHold(BK_ORDER_R); return; }                 // 가드⑦ 순서 — 판 불변
  if(state.bkRead!=null){ bkHold(BK_READ_AGAIN); return; }             // 가드⑧ 판 불변
  if(k===BK_READ_OK){
    state.bkRead=k; state.bkWrongR=null; state.bkWarn=false;
    state.bkMsg = '판을 잘 읽었어요. 관광 산업에는 <b>긍정적 영향</b>과 <b>부정적 영향</b>이 함께 있어요.';
    playChime(); bkRender(); return;
  }
  state.bkWrongR=k;
  bkHold(BK_READ_NO[k]);
}

/* ⑤ 나의 의견 — 정답 없음 · 한 번만(가드⑩). */
function bkMinePick(k){
  if(state.bkFin!=null) return;                                        // 가드①
  if(state.bkBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=BK_MINE.length) return;         // 가드②
  if(state.bkRead==null){ bkHold(BK_ORDER_M); return; }                // 가드⑨ 순서 — 판 불변
  if(state.bkMine!=null){ bkHold(BK_MINE_AGAIN); return; }             // 가드⑩ 판 불변
  state.bkMine = k;                                                    // ★ 의견이 서는 자리 단 하나 · 판정 0
  state.bkWarn=false; state.bkMsg=null;
  playBlip(); bkRender();
}

/* ⑥ 마무리 — 지도서 5차시 주요 내용 정리 2·3 원문 */
function bkFinish(k){
  if(state.bkFin!=null) return;                                        // 가드①
  if(state.bkBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=BK_FIN.length) return;          // 가드②
  if(state.bkMine==null){ bkHold(BK_ORDER_F); return; }                // 가드⑪ 순서 — 판 불변
  if(k===BK_FIN_OK){
    state.bkFin=k; state.bkWrongF=null; state.bkMsg=null; state.bkWarn=false;
    playChime(); bkRender(); return;
  }
  state.bkWrongF=k;
  bkHold(BK_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l05_표에서나와요.html'; } // 1단원 5차시(l05) 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

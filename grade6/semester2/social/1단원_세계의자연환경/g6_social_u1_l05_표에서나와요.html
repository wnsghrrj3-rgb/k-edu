⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 16종:

     ④ 고른 곳이 아닌 곳의 카드 무시 — 판 불변
     ⑤ 이미 표에 담긴 카드 다시 무시 — 판 불변
     ⑥ 표에 담기 시작한 뒤 곳 바꾸기 무시 — 판 불변
     ⑦ 카드를 고르지 않고 칸 누르기 무시 — 판 불변
     ⑧ 이미 찬 칸 다시 무시 — 판 불변
     ⑨ 어울리지 않는 칸 무시 — 판 불변(고른 카드는 그대로 손에 남음)
     ⑩ 표가 다 차기 전 판 읽기 무시(순서) — 판 불변
     ⑪ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑫ 판을 읽기 전 표지판 무시(순서) — 판 불변
     ⑬ 이미 고른 옳은 설명 다시 무시 — 판 불변
     ⑭ 옳지 않은 설명 무시 — 판 불변(표지판 글자 그대로)
     ⑮ 표지판을 다 채우기 전 마무리 무시(순서) — 판 불변
     ⑯ 안내 표시 중 재클릭 무시(`pvBusy`).

⚠️ 정직 원칙 네 곳

/* ★ 비트 수 — 표의 찬 칸 수 · 표지판의 켜진 글자 수 */
function pvBits(n){ let c=0; for(let i=0;i<8;i++) if((n>>i)&1) c++; return c; }
function pvHas(st,r){ return ((st.pvFill>>r)&1)===1; }
function pvCardOf(p,r){ return PV_CARD.findIndex(c=>c.p===p && c.r===r); }
function pvFull(st){ return st.pvFill===(1<<PV_NROW)-1; }
function pvSignN(st){ return pvBits(st.pvSign); }
function pvSignFull(st){ return pvSignN(st)===PV_WORD.length; }
/* ★★ 슬라이드의 한 줄 — 정리표만 읽는다 */
function pvSlideLine(st,r){ return (st.pvPlace!=null && pvHas(st,r)) ? PV_CARD[pvCardOf(st.pvPlace,r)].t : null; }

function pvSlide(st){
  const title = pvSlideLine(st,0)!=null ? PV_PLACE[st.pvPlace].name : null;
  let s = `<div class="pv-slide" data-slide="1"><div class="pv-bar">\uD83D\uDDA5\uFE0F 슬라이드쇼 \u00b7 공유 \u2014 지형 경관과 사람들의 생활 모습</div>`;
  s += title!=null ? `<div class="pv-title" data-stitle="1">${title}</div>` : `<div class="pv-title ph" data-stitle="0">제목을 추가하려면 클릭하세요</div>`;
  for(let r=0;r<PV_NROW;r++){ const L = pvSlideLine(st,r);
    s += L!=null ? `<div class="pv-line" data-sline="${r}"><b>${PV_ROW[r]}</b> ${L}</div>` : `<div class="pv-ph" data-sph="${r}">${PV_ROW[r]} \u2014 표를 채우면 나타나요</div>`; }
  return s + `</div>`;
}

function pvBoard(st){
  const fin = st.pvFin!=null, full = pvFull(st), n = pvSignN(st);
  const head = fin ? '세계의 지형 경관과 생활 모습을 조사해 보았어요'
    : pvSignFull(st) ? '박람회 표지판이 완성되었어요 \u2014 이제 정리해요'
    : st.pvRead!=null ? '옳은 설명을 골라 박람회 표지판을 채워요'
    : full ? '표를 다 채웠어요 \u2014 소개 자료를 살펴봐요'
    : st.pvPlace!=null ? '조사 카드를 정리표에 담아요'
    : '조사할 곳을 골라요';
  const pl = st.pvPlace!=null ? ` \u2014 ${PV_PLACE[st.pvPlace].name}(${PV_PLACE[st.pvPlace].where} \u00b7 ${PV_PLACE[st.pvPlace].kind})` : '';
  let tbl = `<div class="pv-tbl"><div class="pv-th">\uD83D\uDCDD 소개 자료에 넣을 내용 정리하기${pl}</div>`;
  for(let r=0;r<PV_NROW;r++){ const on = st.pvPlace!=null && pvHas(st,r);
    tbl += `<button class="pv-row${on?' on':''}" data-row="${r}" onclick="pvRow(${r})"><span class="lb">${PV_ROW[r]}</span><span class="tx" data-cellrow="${r}">${on ? PV_CARD[pvCardOf(st.pvPlace,r)].t : '빈 칸'}</span></button>`; }
  tbl += `</div>`;
  let sign = '';
  if(st.pvRead!=null){
    sign = `<div class="pv-sign" data-signn="${n}">${PV_WORD.map((c,i)=> i<n ? `<span class="on" data-letter="${i}">${c}</span>` : `<span class="off">?</span>`).join('')}<span class="cap">박람회</span></div>`;
  }
  const tally = `정리표 ${pvBits(st.pvFill)} / ${PV_NROW} \u00b7 표지판 ${n} / ${PV_WORD.length}`;
  return `<div class="pv-board" data-place="${st.pvPlace==null?-1:st.pvPlace}" data-fill="${st.pvFill}" data-pick="${st.pvPick==null?-1:st.pvPick}" data-read="${st.pvRead==null?-1:st.pvRead}" data-sign="${st.pvSign}" data-fin="${fin?1:0}">
    <div class="pv-head">${head}</div>
    ${tbl}
    ${pvSlide(st)}
    ${sign}
    <div class="pv-tally" data-tally="1">${tally}</div>
  </div>`;
}

  } else if(pvSignFull(st)){

  } else if(st.pvRead!=null){
    right += `<div class="dw-step">\uD83E\uDEA7 박람회 표지판</div>`;
    right += `<div class="pv-says">${PV_SAY.map((t,k)=>`<button class="${((st.pvSign>>k)&1)?'on':st.pvWrongS===k?'no':''}" onclick="pvSayPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="pv-note">옳은 설명을 고를 때마다 표지판 글자가 <b>앞에서부터</b> 하나씩 켜져요. <b>어느 설명부터</b> 골라도 좋아요.</div>`;
  } else if(full){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="pv-read">${PV_READ.map((t,k)=>`<button class="${st.pvWrongR===k?'no':''}" onclick="pvReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.pvPlace!=null){
    right += `<div class="dw-step">\uD83D\uDCC7 조사 카드</div>`;
    const deck = PV_CARD.map((c,k)=>({c,k})).filter(o=>!(o.c.p===st.pvPlace && pvHas(st,o.c.r)));
    right += `<div class="pv-deck">${deck.map(o=>`<button class="${st.pvPick===o.k?'sel':''}" data-card="${o.k}" onclick="pvCard(${o.k})">${o.c.t}</button>`).join('')}</div>`;
    if(st.pvFill===0) right += `<div class="pv-places">${PV_PLACE.map((p,k)=>`<button class="${st.pvPlace===k?'on':''}" onclick="pvChoose(${k})"><span class="ct">${p.where} \u00b7 ${p.kind}</span>${p.name}</button>`).join('')}</div>`;
    right += `<div class="pv-note">카드를 하나 고른 뒤, 왼쪽 <b>정리표</b>에서 어울리는 칸을 눌러요. <b>다른 곳의 카드</b>도 섞여 있어요. 어느 칸부터 채워도 좋고, 감점은 없어요.</div>`;
  } else {
    right += `<div class="dw-step">\uD83C\uDF0F 조사할 곳</div>`;
    right += `<div class="pv-places">${PV_PLACE.map((p,k)=>`<button onclick="pvChoose(${k})"><span class="ct">${p.where} \u00b7 ${p.kind}</span>${p.name}</button>`).join('')}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83D\uDDA5\uFE0F 표에서 나오는 소개 자료 판</b></div>

}

    <div class="note">소개 자료 만들기와 발표는 교실에서 친구들과 직접 해요.</div></div>`});
// 8~15 문항
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약 — 지도서 6~7차시 주요 내용 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('sum','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">\u2460</span><div>세계에는 <b>독특하고 아름다운 지형 경관</b>이 많아요.</div></div>
    <div class="sum-item"><span class="n">\u2461</span><div>세계의 여러 지형 경관에서 살아가는 사람들의 <b>생활 모습이 다양</b>해요.</div></div>
    <div class="sum-item"><span class="n">\u2462</span><div>지형 경관과 생활 모습을 조사하는 방법 \u2014 <b>인터넷으로 조사하기 \u2192 조사 내용 정리하기 \u2192 소개 자료 만들기 \u2192 발표하기</b></div></div>
    <div class="sum-item"><span class="n">\u2605</span><div><b>오늘의 조작</b> \u2014 조사 카드를 정리표에 담자 그 내용이 그대로 소개 자료가 되었어요. 박람회 표지판은 \u2018<b>지형 경관</b>\u2019으로 완성되었어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b>세계의 기후 분포</b>를 알아봐요.</div></div>`});
// 17 정리: 자기 평가 — 교과서 29쪽 「얼마나 잘했을까」
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">공부한 내용을 되돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"세계의 다양한 지형 경관과 그곳에서 살아가는 사람들의 생활 모습을 설명할 수 있어요",st)}
    ${selfCheck(1,"세계의 다양한 지형 경관과 사람들의 생활 모습을 조사하여 소개 자료를 만들 수 있어요",st)}
    ${selfCheck(2,"세계의 아름다운 지형 경관을 살펴보고, 개발과 보전에 관한 균형 있는 관점을 지니게 됐어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">세계의 기후 분포</b>를 알아봐요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l05";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  pvPlace:null, pvPick:null, pvFill:0, pvRead:null, pvSign:0, pvFin:null,
  pvWrongR:null, pvWrongS:null, pvWrongF:null,
  pvMsg:null, pvWarn:false, pvBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function pvRender(){ main.innerHTML = slides[state.idx].render(state); }
function pvHold(msg){
  state.pvWarn=true; state.pvBusy=true; state.pvMsg=msg;
  playThud(); pvRender();
  setTimeout(()=>{ state.pvBusy=false; state.pvWarn=false; state.pvMsg=null;
    state.pvWrongR=null; state.pvWrongS=null; state.pvWrongF=null; pvRender(); },1600);
}

/* ① 조사할 곳 고르기 — 정답 없음 · 표에 담기 전까지만 바꿀 수 있음(가드⑥). */
function pvChoose(p){
  if(state.pvFin!=null) return;                                        // 가드①
  if(state.pvBusy) return;                                             // 가드⑯
  if(!Number.isInteger(p) || p<0 || p>=PV_PLACE.length) return;        // 가드②
  if(state.pvFill!==0){ pvHold(PV_LOCKED); return; }                   // 가드⑥ 판 불변
  state.pvPlace = p; state.pvPick = null;                              // ★ 곳이 서는 자리 단 하나 · 판정 0
  state.pvWarn=false;
  state.pvMsg = `<b>${PV_PLACE[p].name}</b>의 지형 경관과 생활 모습을 조사해요. 조사 카드를 골라 정리표에 담아 봐요.`;
  playBlip(); pvRender();
}

/* ② 조사 카드 고르기 */
function pvCard(k){
  if(state.pvFin!=null) return;                                        // 가드①
  if(state.pvBusy) return;                                             // 가드⑯
  if(!Number.isInteger(k) || k<0 || k>=PV_CARD.length) return;         // 가드②
  if(state.pvPlace==null){ pvHold(PV_NOPLACE); return; }               // 가드③ 순서 — 판 불변
  if(PV_CARD[k].p!==state.pvPlace){ pvHold(PV_OTHER); return; }        // 가드④ 판 불변
  if(pvHas(state,PV_CARD[k].r)){ pvHold(PV_PLACED); return; }          // 가드⑤ 판 불변
  state.pvPick = k;                                                    // ★ 카드를 손에 드는 자리 단 하나
  state.pvWarn=false; state.pvMsg='카드를 골랐어요. 왼쪽 <b>정리표</b>에서 어울리는 칸을 눌러요.';
  playBlip(); pvRender();
}

/* ③ 정리표의 칸 누르기 — ★ 표가 차면 슬라이드도 함께 찬다(슬라이드는 표만 읽음). */
function pvRow(r){
  if(state.pvFin!=null) return;                                        // 가드①
  if(state.pvBusy) return;                                             // 가드⑯
  if(!Number.isInteger(r) || r<0 || r>=PV_NROW) return;                // 가드②
  if(state.pvPick==null){ pvHold(PV_NOPICK); return; }                 // 가드⑦ 판 불변
  if(pvHas(state,r)){ pvHold(PV_ROWFULL); return; }                    // 가드⑧ 판 불변
  if(PV_CARD[state.pvPick].r!==r){ pvHold(PV_WRONGROW); return; }      // 가드⑨ 판 불변
  state.pvFill |= (1<<r); state.pvPick = null;                         // ★ 표가 차는 자리 단 하나 — 줄지 않음
  state.pvWarn=false;
  state.pvMsg = pvFull(state) ? PV_ALL_MSG : `<b>${PV_ROW[r]}</b> 칸을 채웠어요. 슬라이드에도 같은 내용이 나타났어요.`;
  playBlip(); pvRender();
}

/* ④ 판 읽기 — 표가 다 차야 열린다(가드⑩). */
function pvReadPick(k){
  if(state.pvFin!=null) return;                                        // 가드①
  if(state.pvBusy) return;                                             // 가드⑯
  if(!Number.isInteger(k) || k<0 || k>=PV_READ.length) return;         // 가드②
  if(!pvFull(state)){ pvHold(PV_ORDER_R); return; }                    // 가드⑩ 순서 — 판 불변
  if(state.pvRead!=null){ pvHold(PV_READ_AGAIN); return; }             // 가드⑪ 판 불변
  if(k===PV_READ_OK){
    state.pvRead=k; state.pvWrongR=null; state.pvWarn=false;
    state.pvMsg = '판을 잘 읽었어요. 조사한 내용을 <b>정리</b>하면 그 내용으로 <b>소개 자료</b>를 만들 수 있어요.';
    playChime(); pvRender(); return;
  }
  state.pvWrongR=k;
  pvHold(PV_READ_NO[k]);
}

/* ⑤ 박람회 표지판 — 옳은 설명을 고를 때마다 글자가 앞에서부터 하나씩 켜진다. */
function pvSayPick(k){
  if(state.pvFin!=null) return;                                        // 가드①
  if(state.pvBusy) return;                                             // 가드⑯
  if(!Number.isInteger(k) || k<0 || k>=PV_SAY.length) return;          // 가드②
  if(state.pvRead==null){ pvHold(PV_ORDER_S); return; }                // 가드⑫ 순서 — 판 불변
  if((state.pvSign>>k)&1){ pvHold(PV_SAY_AGAIN); return; }             // 가드⑬ 판 불변
  if(!PV_SAY_T[k]){ state.pvWrongS=k; pvHold(PV_SAY_NO[k]); return; }  // 가드⑭ 판 불변
  state.pvSign |= (1<<k);                                              // ★ 표지판이 켜지는 자리 단 하나 — 줄지 않음
  state.pvWarn=false;
  state.pvMsg = pvSignFull(state) ? '박람회 표지판이 <b>\u2018지형 경관\u2019</b>으로 완성되었어요!' : '옳은 설명이에요. 표지판 글자가 하나 켜졌어요.';
  playBlip(); pvRender();
}

/* ⑥ 마무리 — 지도서 6~7차시 주요 내용 정리 1 원문 */
function pvFinish(k){
  if(state.pvFin!=null) return;                                        // 가드①
  if(state.pvBusy) return;                                             // 가드⑯
  if(!Number.isInteger(k) || k<0 || k>=PV_FIN.length) return;          // 가드②
  if(!pvSignFull(state)){ pvHold(PV_ORDER_F); return; }                // 가드⑮ 순서 — 판 불변
  if(k===PV_FIN_OK){
    state.pvFin=k; state.pvWrongF=null; state.pvMsg=null; state.pvWarn=false;
    playChime(); pvRender(); return;
  }
  state.pvWrongF=k;
  pvHold(PV_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l06_적도에비춰요.html'; } // 1단원 6차시(l06) 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

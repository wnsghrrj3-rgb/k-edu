  ⭐ 기후마다 집이 **막거나 들여야 할 것 둘**이 있다(`HC_FORCE`) — 열대: 덥고 습한 공기(바람이 잘 통해야) · 해충과 불어나는 물(바닥을 띄워야) /

  ⭐★ **한 채로는 두 기후에 다 맞을 수 없다 — 창이 가른다.** 집 여덟 모습 × 기후 둘 전수 — 열대에 맞는 집 둘(창 크게) ·

단계 — ① 두 기후에 집 세우기(순서 자유) → ② 판 읽기 3택(정답 자리 2) → ③ 초원 지역의 집 3택(정답 자리 0) →
  ④ 마무리 3택 = 지도서 9차시 주요 내용 정리 · 학습 내용 정리(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 12종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 지금 있는 기후 탭 다시 누르기 무시 — 판 불변
     ④ 이미 세운 기후에 다시 세우기 무시 — 판 불변
     ⑤ 줄이 다 막히지 않은 집 세우기 무시 — 판 불변(안내에 부품 이름 0)
     ⑥ 두 기후에 다 세우기 전 판 읽기 무시(순서) — 판 불변
     ⑦ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑧ 판을 읽기 전 초원의 집 무시(순서) — 판 불변
     ⑨ 초원의 집을 고른 뒤 다시 무시 — 판 불변
     ⑩ 알맞지 않은 초원의 집 무시 — 판 불변(자리별 안내)
     ⑪ 초원의 집을 고르기 전 마무리 무시(순서) — 판 불변
     ⑫ 안내 표시 중 재클릭 무시(`hcBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.hc-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **집·옷·풍경 그림은 도식이다** — 실제 모습은 교과서 사진으로 본다(캡션 상시).
  ㉡ **같은 기후라도 생활 모습은 여러 가지다** — 한 곳의 모습을 그 기후 전체의 모습으로 여기지 않는다(지도서 「전형으로 일반화되지 않도록 주의」 · 완료 카드 명시).
  ㉢ **기후 그래프의 수치는 쓰지 않는다** — 두 도시의 모습은 말로만(막대는 강수량, 선은 기온).
  ㉣ **활동지(나라 찾기 · 사진 찾아 소개하기)와 모둠 토의는 교실 몫**이다(완료 카드 명시).

.hc-tabs button:hover,.hc-parts button:hover{background:var(--bub)}
.hc-read,.hc-fin,.hc-nomad{display:flex;flex-direction:column;gap:5px}
.hc-read button,.hc-fin button,.hc-nomad button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.hc-read button:hover,.hc-fin button:hover,.hc-nomad button:hover{background:var(--bub)}
.hc-read button.no,.hc-fin button.no,.hc-nomad button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.hc-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ★ 부품 값 — 셋을 읽는 자리 단 하나 */
function hcPartOf(st,p){ return p===0 ? st.hcWin : p===1 ? st.hcWall : st.hcFloor; }
/* ★ 줄 하나 — 부품만 읽어 막았는지 */
function hcBlock(st,c,k){ return hcPartOf(st,HC_FORCE[c][k][1])===HC_FORCE[c][k][2]; }
/* ★ 집이 그 기후에 맞는지 — 줄 둘이 다 막혔는지 */
function hcFits(st,c){ return hcBlock(st,c,0) && hcBlock(st,c,1); }
function hcBuiltOf(st,c){ return (st.hcDone & (1<<c))!==0; }
function hcAll(st){ return st.hcDone===3; }

function hcPic(st){
  const c = st.hcC, big = hcPartOf(st,0)===0, thick = hcPartOf(st,1)===1, up = hcPartOf(st,2)===0;
  const sky = c===0 ? '#DCFCE7' : '#FEF3C7', ground = c===0 ? '#86EFAC' : '#FDE68A';
  const top = up ? 40 : 70, bot = up ? 100 : 130;
  const deco = c===0
    ? [30,262,284].map(x=>`<path d="M${x} 130 L${x} 104" stroke="#78350F" stroke-width="3"/><circle cx="${x}" cy="98" r="12" fill="#16A34A"/>`).join('')
      + [40,70,236,256].map((x,i)=>`<path d="M${x} ${14+i*4} L${x-3} ${22+i*4}" stroke="#38BDF8" stroke-width="2"/>`).join('')
    : `<circle cx="266" cy="26" r="14" fill="#F59E0B"/>` + `<path d="M8 124 Q40 110 72 124" fill="#FCD34D"/><path d="M236 126 Q268 112 300 126" fill="#FCD34D"/>`;
  const win = big ? `<rect x="126" y="${top+10}" width="48" height="30" fill="#fff" stroke="#475569" stroke-width="1.6" data-win="0"/>`
    : `<rect x="144" y="${top+18}" width="12" height="10" fill="#fff" stroke="#475569" stroke-width="1.6" data-win="1"/>`;
  const posts = up ? [112,146,180].map(x=>`<rect x="${x}" y="100" width="7" height="30" fill="#78350F"/>`).join('') : '';
  return `<svg viewBox="0 0 300 150" data-c="${c}"><rect width="300" height="150" fill="${sky}"/>
    <rect x="0" y="130" width="300" height="20" fill="${ground}"/>${deco}
    <path d="M96 ${top} L150 ${top-26} L204 ${top} Z" fill="${thick?'#92400E':'#A16207'}"/>
    <rect x="104" y="${top}" width="92" height="${bot-top}" fill="${thick?'#D6A76A':'#FDE68A'}" stroke="${thick?'#92400E':'#A16207'}" stroke-width="${thick?9:2}" data-wall="${thick?1:0}"/>
    ${win}${posts}
    <text x="150" y="146" font-size="8" fill="#334155" text-anchor="middle" font-weight="800">${HC_CLIM[c]}</text></svg>`;
}
function hcForceRows(st){
  const c = st.hcC;
  return HC_FORCE[c].map((F,k)=>{ const b = hcBlock(st,c,k);
    return `<div class="hc-force ${b?'ok':'no'}" data-force="${k}"><span class="mk">${b?'\u2714':'\u2716'}</span>${F[0]} \u2014 ${b?F[3]:F[4]}</div>`; }).join('');
}

function hcBoard(st){
  const fin = st.hcFin!=null, all = hcAll(st);
  const head = fin ? '두 기후 지역의 생활 모습을 살펴보았어요'
    : st.hcNomad!=null ? '초원의 집까지 골랐어요 \u2014 이제 정리해요'
    : st.hcRead!=null ? '건조 기후의 초원 지역을 살펴봐요'
    : all ? '두 곳에 다 세웠어요 \u2014 두 집을 견주어 봐요'
    : '한 채의 집을 두 기후 지역에 세워 봐요';
  const tent = st.hcNomad!=null ? `<div class="hc-tent" data-tent="1">\u26FA 초원 지역 \u2014 ${HC_NOMAD[HC_NOMAD_OK]}</div>` : '';
  const tally = `지은 집 \u00b7 ${HC_CLIM.map((t,c)=>t+' '+(hcBuiltOf(st,c)?'\u2714':'\u2014')).join(' \u00b7 ')}`;
  return `<div class="hc-board" data-c="${st.hcC}" data-done="${st.hcDone}" data-read="${st.hcRead==null?-1:st.hcRead}" data-nomad="${st.hcNomad==null?-1:st.hcNomad}" data-fin="${fin?1:0}">
    <div class="hc-head">${head}</div>
    <div class="hc-pic">${hcPic(st)}</div>
    ${hcForceRows(st)}
    ${tent}
    <div class="hc-tally" data-tally="1">${tally}</div>
  </div>`;
}

function hcPanel(st){
  const fin = st.hcFin!=null, all = hcAll(st);
  const q = fin ? '열대 기후와 건조 기후 지역의 생활 모습을 살펴보았어요.'
    : st.hcNomad!=null ? '오늘 공부한 내용을 어떻게 정리하면 좋을까요?'
    : st.hcRead!=null ? '물과 풀을 찾아 옮겨 다니는 초원 지역에는 어떤 집이 알맞을까요?'
    : all ? '한 채의 집으로는 두 기후 지역에 다 맞출 수 없었어요. 왜 그럴까요?'
    : st.hcDone>0 ? '다른 기후 지역에도 집을 세워 봐요. 무엇을 바꿔야 할까요?'
    : '이 기후 지역에서 집이 막거나 들여야 할 것은 무엇일까요?';
  let right = `<div class="hc-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDFE0 창이 가르는 두 기후의 집</div>
      열대 기후 지역에서는 바람이 잘 통하도록 <b>창을 크게</b> 만들고 바닥을 땅에서 띄웠어요.
      건조 기후 사막 지역에서는 강한 햇볕과 모래바람을 막도록 <b>벽을 두껍게, 창을 작게</b> 만들었어요.
      물과 풀을 찾아 옮겨 다니는 초원 지역에서는 <b>이동식 가옥</b>에서 생활해요 \u2014 사람들은 기후에 맞추어 생활 모습을 다르게 발달시켰어요.<br>
      <span style="color:#64748B">판의 집은 생활 모습을 나타낸 <b>도식</b>이에요. 같은 기후 지역이라도 생활 모습은 여러 가지예요 \u2014 한 곳의 모습을 그 기후 전체의 모습으로 여기지 않아요.
      사회과 부도로 나라를 찾고 사진을 찾아 소개하는 <b>활동지</b>와 <b>모둠 토의</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.hcNomad!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="hc-fin">${HC_FIN.map((t,k)=>`<button class="${st.hcWrongF===k?'no':''}" onclick="hcFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.hcRead!=null){
    right += `<div class="dw-step">\u26FA 남은 곳 \u2014 건조 기후의 초원 지역</div>`;
    right += `<div class="hc-nomad">${HC_NOMAD.map((t,k)=>`<button class="${st.hcWrongN===k?'no':''}" onclick="hcNomadPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="hc-note">사막 주변의 초원 지역에 사는 사람들은 물과 풀이 있는 곳을 찾아 이동하며 가축을 길러요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="hc-read">${HC_READ.map((t,k)=>`<button class="${st.hcWrongR===k?'no':''}" onclick="hcReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83C\uDF0D 기후 지역</div>`;
    right += `<div class="hc-tabs">${HC_CLIM.map((t,c)=>`<button class="${c===st.hcC?'on':''}" data-clim="${c}" onclick="hcGo(${c})">${t}${hcBuiltOf(st,c)?' \u2714':''}</button>`).join('')}</div>`;
    right += `<div class="dw-step">\uD83D\uDD27 부품 바꾸기</div>`;
    right += `<div class="hc-parts">${HC_PART.map((P,p)=>`<button data-part="${p}" onclick="hcToggle(${p})">${P[0]} \u2014 <b>${P[1+hcPartOf(st,p)]}</b> (바꾸기)</button>`).join('')}</div>`;
    right += `<button class="hc-go" onclick="hcBuild()">\uD83C\uDFD7\uFE0F 이 기후 지역에 집 세우기</button>`;
    right += `<div class="hc-note">판의 줄이 <b>모두 초록</b>이 되면 세울 수 있어요. 감점은 없어요. 두 기후 지역에 다 세워 봐요.</div>`;
  }
  if(st.hcMsg) right += `<div class="dw-msg${st.hcWarn?' warn':''}">${st.hcMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDFE0 창이 가르는 두 기후의 집 판</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${hcBoard(st)}<div class="cvcap">판의 집은 생활 모습을 나타낸 <b>도식</b>이에요. 같은 기후 지역이라도 집의 모습은 여러 가지예요 \u2014 실제 모습은 교과서 사진으로 봐요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    <div class="sum-item"><span class="n">\u2461</span><div>건조 기후 \u2014 <b>연 강수량이 적은 저위도 지역과 중위도 지역</b> \u00b7 강수량이 적고 낮과 밤의 기온 차이가 큼 \u00b7 온몸을 감싸는 옷, 사막의 흙벽돌로 만든 집, 초원의 유목 생활과 이동식 가옥 등</div></div>
    <div class="sum-item"><span class="n">\u2605</span><div><b>오늘의 조작</b> \u2014 한 채의 집으로는 두 기후 지역에 다 맞출 수 없었어요. 창이 두 집을 갈랐어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b>온대 기후와 냉대 기후 지역의 생활 모습</b>을 알아봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">공부한 내용을 되돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"열대 기후와 건조 기후의 특징을 말할 수 있어요",st)}
    ${selfCheck(1,"열대 기후와 건조 기후 지역의 생활 모습을 설명할 수 있어요",st)}
    ${selfCheck(2,"기후와 사람들의 생활 모습 사이의 관계를 탐구할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">온대 기후와 냉대 기후 지역의 생활 모습</b>을 알아봐요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l07";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  hcWin:1, hcWall:0, hcFloor:1, hcC:0, hcDone:0,
  hcRead:null, hcNomad:null, hcFin:null,
  hcWrongR:null, hcWrongN:null, hcWrongF:null,
  hcMsg:null, hcWarn:false, hcBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function hcRender(){ main.innerHTML = slides[state.idx].render(state); }
function hcHold(msg){
  state.hcWarn=true; state.hcBusy=true; state.hcMsg=msg;
  playThud(); hcRender();
  setTimeout(()=>{ state.hcBusy=false; state.hcWarn=false; state.hcMsg=null;
    state.hcWrongR=null; state.hcWrongN=null; state.hcWrongF=null; hcRender(); },1600);
}

/* ① 부품 바꾸기 — 값 하나를 뒤집는다. 세운 기록(hcDone)은 건드리지 않는다. */
function hcToggle(p){
  if(state.hcFin!=null) return;                                        // 가드①
  if(state.hcBusy) return;                                             // 가드⑫
  if(!Number.isInteger(p) || p<0 || p>=HC_PART.length) return;         // 가드②
  if(p===0) state.hcWin = 1-state.hcWin;
  else if(p===1) state.hcWall = 1-state.hcWall;
  else state.hcFloor = 1-state.hcFloor;
  state.hcWarn=false;
  state.hcMsg = `<b>${HC_PART[p][0]}</b>을 바꿨어요 \u2014 지금은 <b>${HC_PART[p][1+hcPartOf(state,p)]}</b>. 판의 줄을 살펴봐요.`;
  playBlip(); hcRender();
}

/* ① 기후 탭 — 같은 집을 다른 기후 지역에 옮겨 본다. */
function hcGo(c){
  if(state.hcFin!=null) return;                                        // 가드①
  if(state.hcBusy) return;                                             // 가드⑫
  if(!Number.isInteger(c) || c<0 || c>=HC_NC) return;                  // 가드②
  if(c===state.hcC){ hcHold(HC_HERE); return; }                        // 가드③ 판 불변
  state.hcC = c;
  state.hcWarn=false;
  state.hcMsg = `같은 집을 <b>${HC_CLIM[c]}</b>에 옮겨 보았어요. 판의 줄을 읽어 봐요.`;
  playBlip(); hcRender();
}

/* ① 세우기 — 지금 기후의 줄 둘이 다 막혔을 때만. ★ 세운 기록은 더하기만 한다. */
function hcBuild(){
  if(state.hcFin!=null) return;                                        // 가드①
  if(state.hcBusy) return;                                             // 가드⑫
  if(hcBuiltOf(state,state.hcC)){ hcHold(HC_BUILT); return; }          // 가드④ 판 불변
  if(!hcFits(state,state.hcC)){ hcHold(HC_NOFIT); return; }            // 가드⑤ 판 불변
  state.hcDone |= (1<<state.hcC);                                      // ★ 세운 기록이 느는 자리 단 하나 — 줄지 않음
  state.hcWarn=false;
  state.hcMsg = hcAll(state) ? HC_ALL_MSG : `<b>${HC_CLIM[state.hcC]}</b>에 집을 세웠어요. 이제 다른 기후 지역에도 세워 봐요.`;
  playChime(); hcRender();
}

/* ② 판 읽기 — 두 기후에 다 세워야 열린다(가드⑥). */
function hcReadPick(k){
  if(state.hcFin!=null) return;                                        // 가드①
  if(state.hcBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=HC_READ.length) return;         // 가드②
  if(!hcAll(state)){ hcHold(HC_ORDER_R); return; }                     // 가드⑥ 순서 — 판 불변
  if(state.hcRead!=null){ hcHold(HC_READ_AGAIN); return; }             // 가드⑦ 판 불변
  if(k===HC_READ_OK){
    state.hcRead=k; state.hcWrongR=null; state.hcWarn=false;
    state.hcMsg = '판을 잘 읽었어요. <b>기후</b>가 다르면 집이 막고 들여야 할 것이 달라, <b>창</b>이 두 집을 갈랐어요.';
    playChime(); hcRender(); return;
  }
  state.hcWrongR=k;
  hcHold(HC_READ_NO[k]);
}

/* ③ 초원의 집 — 판을 읽은 뒤에만(가드⑧). */
function hcNomadPick(k){
  if(state.hcFin!=null) return;                                        // 가드①
  if(state.hcBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=HC_NOMAD.length) return;        // 가드②
  if(state.hcRead==null){ hcHold(HC_ORDER_N); return; }                // 가드⑧ 순서 — 판 불변
  if(state.hcNomad!=null){ hcHold(HC_NOMAD_AGAIN); return; }           // 가드⑨ 판 불변
  if(k!==HC_NOMAD_OK){ state.hcWrongN=k; hcHold(HC_NOMAD_NO[k]); return; } // 가드⑩ 판 불변
  state.hcNomad = k;                                                   // ★ 초원의 집이 서는 자리 단 하나
  state.hcWarn=false;
  state.hcMsg = '초원 지역의 사람들은 <b>유목</b> 생활을 하며 <b>이동식 가옥</b>에서 생활해요. 가축과 함께 옮겨 다니기 알맞아요.';
  playChime(); hcRender();
}

/* ④ 마무리 — 지도서 9차시 주요 내용 정리 */
function hcFinish(k){
  if(state.hcFin!=null) return;                                        // 가드①
  if(state.hcBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=HC_FIN.length) return;          // 가드②
  if(state.hcNomad==null){ hcHold(HC_ORDER_F); return; }               // 가드⑪ 순서 — 판 불변
  if(k===HC_FIN_OK){
    state.hcFin=k; state.hcWrongF=null; state.hcMsg=null; state.hcWarn=false;
    playChime(); hcRender(); return;
  }
  state.hcWrongF=k;
  hcHold(HC_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 1단원 8차시(l08) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사10-01]·[6사10-02] · 교과서 p.50~53 · 지도서(대단원1 **14차시** 「단원 마무리 — 생각 그물을 완성해요 · 교실 놀이를 함께해요」, 지도서 p.114~115) 근거.
학습 목표: '세계의 자연환경'에서 공부한 내용을 생각 그물과 교실 놀이로 정리할 수 있다.
수업 기법 및 전략: 돌아가며 말하기 · 협력 학습
META = "1단원 세계의 자연환경 · 단원 마무리"
⚠️ 엔진은 l11(l10 → … → 6-1 사회 엔진 승계)에서 100% 승계 · 엔진 무수정. 1단원 색 #0369A1.
⚠️ 회수 키 `g6_s2_social_u1_l12_v1`(학기 표지 s2 — l01 선례). 맵 키 `g6_social_u1_l12`.
⚠️ 파일명 `빙고를외쳐요` — 조작 이름(선례 승계).

직접조작: 빙고를 외치는 함께 빙고 판 (교과서 52~53쪽 교실 놀이 · 지도서 14차시 놀이 방법·유의점)
  ⭐ 씨앗은 교과서 52쪽 놀이 규칙 두 줄 —
     「친구가 정답을 맞히면 자신이 문제로 낸 단어에 ◯표를 하고 … 친구가 정답을 맞히지 못하면 단어에 ◯표를 할 수 없고」
     「문제를 낼 때는 정답이 되는 단어를 직접 말하지 않습니다」.
  ⭐ 판은 4 × 4 함께 빙고 판이다. 낱말 열여섯 = 교과서 50~51쪽 생각 그물의 산지·하천·해안 지형 경관과 생활 모습 · 기후 낱말(넷씩).
     학생이 낱말을 고르고(문제로 낼 낱말) 친구에게 낼 문제 셋 가운데 하나를 고른다 —
     ㉮ 그 낱말을 설명한 문제 → 친구가 맞힘 → ◯표 ㉯ 낱말을 직접 말한 문제 → 규칙 위반 · ◯표 없음 ㉰ 같은 가지의 다른 낱말을 설명한 문제 → 친구가 다른 낱말을 떠올림 · ◯표 없음.
  ⭐ 문제 셋의 자리는 `bnKind(k,o)` 한 줄에서만(BN_ROT 를 읽는 자리 단 하나) · 문제 글은 `bnAskText(k,o)` 한 줄에서만.
  ⭐★ ◯표 기록은 `state.bnMark |=` 단 하나(줄지 않음). 완성한 줄은 `bnLineOn` 한 줄에서만(BN_LINES 를 읽는 자리 단 하나) — 줄 상태 0.
  ⭐★★ 판의 낱말 자리는 **대각선 라틴 방진** — 가로 넷 · 세로 넷 · 대각선 둘, 어느 줄이든 산지 · 하천 · 해안 · 기후 낱말이 하나씩.
     그래서 **줄 하나만 완성해도 생각 그물 네 가지가 모두 이어진다** — 지형 경관과 기후가 한 줄에 함께.
  ⭐ 빙고 = 완성한 줄 셋(교과서 52쪽). ◯표는 **최소 아홉** — 줄 셋이 서로 한 칸씩만 겹칠 때(판 전수 BFS).
  ⭐ 판 읽기는 빙고 뒤에만(정답 자리 1). 이어서 생각 그물 빈칸 3택(교과서 51쪽 건조 기후 · 정답 자리 2) → 마무리(정답 자리 0).

단계 — ① 낱말 고르고 문제 내기 → ② 판 읽기 3택(정답 자리 1) → ③ 생각 그물 빈칸 3택(정답 자리 2) →
  ④ 마무리 3택 = 지도서 14차시 예시 답안(정답 자리 0).

⚠️ 전량 고정 리터럴 — 난수 0 · 가위바위보 0.
⚠️ 가드 12종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 낱말을 고르기 전 문제 내기 무시 — 판 불변(안내)
     ④ 이미 ◯표 한 낱말 고르기 무시 — 판 불변
     ⑤ 지금 고른 낱말 다시 무시 — 판 불변
     ⑥ 낱말을 직접 말한 문제 — ◯표 없음(규칙) · 판 불변
     ⑦ 다른 낱말을 설명한 문제 — ◯표 없음 · 판 불변
     ⑧ 빙고 뒤 판 고치기 무시(고르기·문제) — 판 불변
     ⑨ 빙고 전 판 읽기 무시 · 읽은 뒤 다시 무시 · 알맞지 않은 읽기 무시(안내에 낱말 이름 0)
     ⑩ 판을 읽기 전 생각 그물 빈칸 무시 · 고른 뒤 다시 무시 · 알맞지 않은 빈칸 무시(자리별 안내)
     ⑪ 빈칸을 고르기 전 마무리 무시(순서)
     ⑫ 안내 표시 중 재클릭 무시(`bnBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.bn-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **빙고 판·생각 그물은 도식이다** — 실제 판은 교과서 53쪽에 쓴다(캡션 상시).
  ㉡ **낱말 열여섯은 교과서 생각 그물에서 고른 예다** — 실제 놀이에서는 학생마다 중요하다고 생각하는 낱말을 써넣는다(캡션·완료 카드 명시).
  ㉢ **친구·가위바위보는 판에 없다** — 친구가 맞힘은 「그 낱말을 설명한 문제인가」 한 가지로만 본다.
  ㉣ **함께 빙고 판에 낱말 써넣기 · 가위바위보 · 교실을 돌아다니며 대결하기 · 알게 된 점과 느낀 점 쓰기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 단원 침범 0** — 2단원(시장경제와 국가 간 거래)은 차시 예고 자리까지만.
  **낱말·곳 이름은 원문이 든 것까지만** — 알프스 · 히말라야 · 이구아수.
  사람 형상 0 · 네 자리 연도 0 · 쪽수 0 · 어느 곳도 더 낫거나 못하게 그리지 않는다.

/* ★ 문제의 자리 — BN_ROT 를 읽는 자리 단 하나 */
function bnKind(k,o){ return BN_ROT[k%3][o]; }
/* 같은 가지의 다음 낱말 */
function bnAlt(k){ for(let d=1;d<BN_N;d++){ const j=(k+d)%BN_N; if(BN_CELL[j].g===BN_CELL[k].g) return j; } return k; }
/* ★ 문제 글 — 한 줄 */
function bnAskText(k,o){ const t=bnKind(k,o); return t===0 ? BN_CELL[k].clue : t===1 ? `「${BN_CELL[k].w}」! 이 낱말을 맞혀 봐.` : BN_CELL[bnAlt(k)].clue; }
function bnOn(st,k){ return (st.bnMark & (1<<k))!==0; }
/* ★ 완성한 줄 — BN_LINES 를 읽는 자리 단 하나 */
function bnLineOn(st,i){ return BN_LINES[i].every(c=>bnOn(st,c)); }
function bnLineN(st){ let n=0; for(let i=0;i<BN_LINES.length;i++) if(bnLineOn(st,i)) n++; return n; }
function bnInLine(st,k){ for(let i=0;i<BN_LINES.length;i++) if(bnLineOn(st,i) && BN_LINES[i].indexOf(k)>=0) return true; return false; }
function bnWin(st){ return bnLineN(st)>=BN_WIN; }
/* 생각 그물 가지마다 ◯표 한 낱말 수 */
function bnGrpN(st,g){ let n=0; for(let k=0;k<BN_N;k++) if(BN_CELL[k].g===g && bnOn(st,k)) n++; return n; }

function bnGrid(st){
  let s='';
  for(let k=0;k<BN_N;k++){ const c=BN_CELL[k], on=bnOn(st,k);
    s += `<button class="bn-cell g${c.g}${st.bnAt===k?' now':''}${on?' on':''}${bnInLine(st,k)?' ln':''}" data-k="${k}" data-g="${c.g}" data-on="${on?1:0}" onclick="bnPick(${k})">${c.w}${on?'<span class="ok">\u25EF</span>':''}</button>`; }
  const key = BN_GRP.map((t,g)=>`<span><i style="background:${['#64748B','#0EA5E9','#14B8A6','#F59E0B'][g]}"></i>${t}</span>`).join('');
  return `<div class="bn-grid">${s}</div><div class="bn-key">${key}</div>`;
}
function bnNote(st){
  const n = bnLineN(st), win = n>=BN_WIN, gs = BN_GRP.map((t,g)=>bnGrpN(st,g)), all4 = gs.every(x=>x>=1);
  const l0 = win ? `<div class="bn-line set" data-line="0" data-n="${n}">빙고! 완성한 줄 ${n} / ${BN_WIN}</div>`
    : `<div class="bn-line" data-line="0" data-n="${n}">완성한 줄 ${n} / ${BN_WIN}</div>`;
  const l1 = `<div class="bn-line${all4?' set':''}" data-line="1" data-grp="${gs.join(',')}">생각 그물 \u2014 ${BN_GRP.map((t,g)=>t+' '+gs[g]).join(' \u00b7 ')}</div>`;
  return l0+l1;
}

function bnBoard(st){
  const fin = st.bnFin!=null, win = bnWin(st);
  const head = fin ? '세계의 자연환경을 정리했어요'
    : st.bnNet!=null ? '생각 그물까지 채웠어요 \u2014 이제 정리해요'
    : st.bnRead!=null ? '생각 그물의 빈칸도 채워 봐요'
    : win ? '빙고를 외쳤어요 \u2014 완성한 줄을 살펴봐요'
    : st.bnAt>=0 ? '고른 낱말로 친구에게 문제를 내요'
    : '문제로 낼 낱말을 골라 봐요';
  return `<div class="bn-board" data-at="${st.bnAt}" data-mark="${st.bnMark}" data-lines="${bnLineN(st)}" data-win="${win?1:0}" data-read="${st.bnRead==null?-1:st.bnRead}" data-net="${st.bnNet==null?-1:st.bnNet}" data-fin="${fin?1:0}">
    <div class="bn-head">${head}</div>
    ${bnGrid(st)}
    <div class="bn-note">${bnNote(st)}</div>
  </div>`;
}

function bnPanel(st){
  const fin = st.bnFin!=null, win = bnWin(st), n = bnLineN(st);

    : win ? '완성한 줄의 낱말을 살펴봐요. 한 줄에는 어떤 낱말들이 들어 있나요?'
    : st.bnAt>=0 ? '친구가 맞힐 수 있도록 문제를 골라 봐요. 정답이 되는 낱말을 말해도 될까요?'
    : n>=1 ? '줄을 하나 완성했어요. 완성한 줄에는 어떤 낱말들이 들어 있나요?'
    : '빙고 판에서 문제로 낼 낱말을 골라 봐요. 그 낱말을 어떻게 설명할 수 있을까요?';
  let right = `<div class="bn-q">${q}</div>`;

  if(fin){

      <span style="color:#64748B">빙고 판과 생각 그물은 <b>도식</b>이에요. 낱말 열여섯은 교과서 생각 그물에서 고른 예예요 \u2014 실제 놀이에서는 저마다 중요하다고 생각하는 낱말을 써넣어요.
      <b>함께 빙고 판에 낱말 써넣기</b>와 <b>가위바위보</b>, <b>교실을 돌아다니며 친구와 대결하기</b>, <b>알게 된 점과 느낀 점 쓰기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.bnNet!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="bn-fin">${BN_FIN.map((t,k)=>`<button class="${st.bnWrongF===k?'no':''}" onclick="bnFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.bnRead!=null){
    right += `<div class="dw-step">\uD83D\uDD78\uFE0F 생각 그물의 빈칸</div>`;
    right += `<div class="bn-net">${BN_NET.map((t,k)=>`<button class="${st.bnWrongN===k?'no':''}" onclick="bnNetPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="bn-hint">건조 기후 지역은 비가 아주 적게 내려 나무가 잘 자라지 않아요.</div>`;
  } else if(win){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="bn-read">${BN_READ.map((t,k)=>`<button class="${st.bnWrongR===k?'no':''}" onclick="bnReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.bnAt>=0){
    right += `<div class="dw-step">\uD83D\uDDE3\uFE0F 「${BN_CELL[st.bnAt].w}」 \u2014 친구에게 낼 문제</div>`;
    right += `<div class="bn-ask">${[0,1,2].map(o=>`<button class="${st.bnWrongA===o?'no':''}" onclick="bnAsk(${o})">${bnAskText(st.bnAt,o)}</button>`).join('')}</div>`;
    right += `<div class="bn-hint">친구가 맞히면 그 낱말에 ◯표를 해요. 다른 낱말을 골라도 돼요.</div>`;
  } else {
    right += `<div class="dw-step">\uD83C\uDFB2 함께 빙고</div>`;
    right += `<div class="bn-hint">빙고 판에서 <b>문제로 낼 낱말</b>을 눌러요. 친구가 맞히면 ◯표를 하고, 가로 · 세로 · 대각선으로 <b>줄 세 개</b>를 완성하면 빙고예요. 감점은 없어요.</div>`;
  }
  if(st.bnMsg) right += `<div class="dw-msg${st.bnWarn?' warn':''}">${st.bnMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDFB2 빙고를 외치는 함께 빙고 판</b></div>

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l12";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  bnAt:-1, bnMark:0,
  bnRead:null, bnNet:null, bnFin:null,
  bnWrongA:null, bnWrongR:null, bnWrongN:null, bnWrongF:null,
  bnMsg:null, bnWarn:false, bnBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function bnRender(){ main.innerHTML = slides[state.idx].render(state); }
function bnHold(msg){
  state.bnWarn=true; state.bnBusy=true; state.bnMsg=msg;
  playThud(); bnRender();
  setTimeout(()=>{ state.bnBusy=false; state.bnWarn=false; state.bnMsg=null;
    state.bnWrongA=null; state.bnWrongR=null; state.bnWrongN=null; state.bnWrongF=null; bnRender(); },1600);
}

/* ① 낱말 고르기 — 문제로 낼 낱말 */
function bnPick(k){
  if(state.bnFin!=null) return;                                        // 가드①
  if(state.bnBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=BN_N) return;                   // 가드②
  if(bnWin(state)){ bnHold(BN_LOCK); return; }                         // 가드⑧ 판 불변
  if(bnOn(state,k)){ bnHold(BN_DONE); return; }                        // 가드④ 판 불변
  if(state.bnAt===k){ bnHold(BN_SAME); return; }                       // 가드⑤ 판 불변
  state.bnAt = k;                                                      // ★ 낱말을 고르는 자리
  state.bnWarn=false;
  state.bnMsg = `「${BN_CELL[k].w}」 \u2014 친구가 이 낱말을 떠올릴 수 있는 문제를 골라요.`;
  playBlip(); bnRender();
}

/* ① 문제 내기 — 친구가 맞히면 ◯표 */
function bnAsk(o){
  if(state.bnFin!=null) return;                                        // 가드①
  if(state.bnBusy) return;                                             // 가드⑫
  if(!Number.isInteger(o) || o<0 || o>=3) return;                      // 가드②
  if(bnWin(state)){ bnHold(BN_LOCK); return; }                         // 가드⑧ 판 불변
  if(state.bnAt<0){ bnHold(BN_NOPICK); return; }                       // 가드③ 판 불변
  const k = state.bnAt, t = bnKind(k,o);
  if(t===1){ state.bnWrongA=o; bnHold(BN_SAY); return; }               // 가드⑥ 판 불변
  if(t===2){ state.bnWrongA=o; bnHold(BN_MISS); return; }              // 가드⑦ 판 불변
  state.bnMark |= (1<<k);                                              // ★ ◯표 — 더하기만 하는 자리 단 하나
  state.bnAt = -1;                                                     // ★ 고른 낱말을 내려놓는 자리
  state.bnWarn=false;
  state.bnMsg = bnWin(state) ? BN_WIN_MSG : `친구가 맞혔어요 \u2014 「${BN_CELL[k].w}」에 ◯표를 했어요. 완성한 줄 ${bnLineN(state)} / ${BN_WIN}.`;
  if(bnWin(state)) playChime(); else playBlip();
  bnRender();
}

/* ② 판 읽기 — 빙고 뒤에만(가드⑨). */
function bnReadPick(k){
  if(state.bnFin!=null) return;                                        // 가드①
  if(state.bnBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=BN_READ.length) return;         // 가드②
  if(!bnWin(state)){ bnHold(BN_ORDER_R); return; }                     // 가드⑨ 순서 — 판 불변
  if(state.bnRead!=null){ bnHold(BN_READ_AGAIN); return; }             // 가드⑨ 판 불변
  if(k===BN_READ_OK){
    state.bnRead=k; state.bnWrongR=null; state.bnWarn=false;
    state.bnMsg = '판을 잘 읽었어요. 어느 줄이든 <b>지형 낱말 셋과 기후 낱말 하나</b>가 함께 들어 있어서, 줄 하나만 완성해도 생각 그물의 네 가지가 모두 이어졌어요.';
    playChime(); bnRender(); return;
  }
  state.bnWrongR=k;
  bnHold(BN_READ_NO[k]);
}

/* ③ 생각 그물 빈칸 — 판을 읽은 뒤에만(가드⑩). */
function bnNetPick(k){
  if(state.bnFin!=null) return;                                        // 가드①
  if(state.bnBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=BN_NET.length) return;          // 가드②
  if(state.bnRead==null){ bnHold(BN_ORDER_N); return; }                // 가드⑩ 순서 — 판 불변
  if(state.bnNet!=null){ bnHold(BN_NET_AGAIN); return; }               // 가드⑩ 판 불변
  if(k!==BN_NET_OK){ state.bnWrongN=k; bnHold(BN_NET_NO[k]); return; } // 가드⑩ 판 불변
  state.bnNet = k;                                                     // ★ 빈칸을 채우는 자리 단 하나
  state.bnWarn=false;
  state.bnMsg = '비가 아주 적게 내리는 <b>건조 기후</b> \u2014 나무 대신 흙으로 벽돌을 빚어 집을 지어요.';
  playChime(); bnRender();
}

/* ④ 마무리 — 지도서 14차시 예시 답안 */
function bnFinish(k){
  if(state.bnFin!=null) return;                                        // 가드①
  if(state.bnBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=BN_FIN.length) return;          // 가드②
  if(state.bnNet==null){ bnHold(BN_ORDER_F); return; }                 // 가드⑪ 순서 — 판 불변
  if(k===BN_FIN_OK){
    state.bnFin=k; state.bnWrongF=null; state.bnMsg=null; state.bnWarn=false;
    playChime(); bnRender(); return;
  }
  state.bnWrongF=k;
  bnHold(BN_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 2단원 1차시 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

학습 목표: 세계의 기후 분포와 기후 분포의 특징을 설명할 수 있다.
수업 기법 및 전략: 지도 살펴보기 · 탐구하기 · 돌아가며 말하기
META = "1단원 세계의 자연환경 · ② 세계의 기후와 다양한 생활 모습"
⚠️ 엔진은 l05(l04 → l03 → l02 → l01 → 6-1 사회 엔진 승계)에서 100% 승계 · 엔진 무수정. 1단원 색 #0369A1.
⚠️ 회수 키 `g6_s2_social_u1_l06_v1`(학기 표지 s2 — l01 선례). 맵 키 `g6_social_u1_l06`.
⚠️ 파일명 `적도에비춰요` — 조작 이름(선례 승계).

직접조작: 적도에 비춰 보는 기후 띠 판 (교과서 32~33쪽 「친구와 활동」 · 지도서 활동지 p.78 「세계의 기후 분포 살펴보기」)
  ⭐ 기후 카드 여섯(열대 · 건조 · 온대 · 냉대 · 한대 · 고산)이 섞여 있다. 카드를 눌러 **북반구 쪽 띠를 적도에서부터** 쌓는다.
     띠는 적도 바로 위 칸부터 하나씩만 올라간다 — 차례가 아닌 카드, 이미 쌓은 카드, 고산 기후 카드는 쌓이지 않는다.
  ⭐★ **남반구 쪽 띠를 담는 상태 0** — 남쪽은 북쪽에 쌓은 수(`mrN`)만 읽어 적도에 비춰 그린다(`mrSouthOf`).
     북쪽에 띠를 하나 쌓으면 남쪽에도 같은 차례의 띠가 하나 나타난다. 단, **냉대 기후는 남쪽에 비춰지지 않는다**(`MR_SOUTH`) —
     지도서 「냉대 기후는 남반구보다는 북반구에서 주로 나타난다」.
  ⭐ 판 읽기는 띠 다섯이 다 쌓인 뒤에만 열린다(정답 자리 1).
  ⭐ 남은 고산 기후 카드 — 어디에 놓을까? 3택(정답 자리 2 · 해발 고도가 매우 높은 산지). 놓으면 **적도 줄에 산**이 그려진다 —
     적도 부근이라도 매우 높은 산지에는 고산 기후(위도뿐만 아니라 해발 고도).
  ⭐ 근거 = 교과서 32~33쪽 본문 · 꼭 기억해요 · 지도서 8차시 발문·지도 해설(「적도를 기준으로 대칭」) · 활동지 풀이 · 주요 내용 정리.

단계 — ① 기후 띠 쌓기(적도에서부터 · 차례 고정) → ② 판 읽기 3택(정답 자리 1) → ③ 고산 기후 자리 3택(정답 자리 2) →
  ④ 마무리 3택 = 지도서 주요 내용 정리 · 학습 내용 정리 원문(정답 자리 0).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 13종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 띠 다섯을 다 쌓은 뒤 카드 무시 — 판 불변
     ④ 고산 기후 카드를 위도 차례에 넣기 무시 — 판 불변
     ⑤ 이미 쌓은 띠 다시 무시 — 판 불변
     ⑥ 차례가 아닌 띠 무시 — 판 불변(안내에 기후 이름 0)
     ⑦ 띠가 다 쌓이기 전 판 읽기 무시(순서) — 판 불변
     ⑧ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑨ 판을 읽기 전 고산 자리 무시(순서) — 판 불변
     ⑩ 고산 기후를 놓은 뒤 다시 무시 — 판 불변
     ⑪ 알맞지 않은 고산 자리 무시 — 판 불변(자리별 안내)
     ⑫ 고산 기후를 놓기 전 마무리 무시(순서) — 판 불변
     ⑬ 안내 표시 중 재클릭 무시(`mrBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.mr-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 띠는 기후가 나타나는 차례를 보여 주는 도식이다** — 실제 기후의 경계는 반듯하지 않고 위치·지형·해발 고도에 따라 달라진다(캡션 상시).
  ㉡ **남쪽 거울은 대략적인 모습이다** — 냉대 기후는 주로 북반구에 나타난다(판에 그대로 드러냄).
  ㉢ **세 도시의 연평균 기온은 교과서 수치다** — 그 밖의 수치는 쓰지 않는다.
  ㉣ **기후 분포도를 보며 돌아가며 말하기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 각 기후 지역의 생활 모습(9~11차시)은 차시 예고 자리까지만. 기후별 기온·강수량 특징도 넣지 않는다.
  **지명은 이 차시 원문이 든 것까지만** — 사우디아라비아 · 캐나다 · 페루(사진전) · 아부자 · 리옹 · 키루나 + 우리나라.
  교사용 참고 자료의 수치(기온 기준값·거리) 0 · 네 자리 연도 0 · 쪽수 0 · 누리집 주소 0 · 기후 구분 학자 이름 0.
  정서 — 어느 기후도 더 낫거나 못하게 그리지 않는다 · 사람 형상 0 · 전통 의상은 옷 모양 도형으로만.

/* ===== 직접조작 — 적도에 비춰 보는 기후 띠 판 =====

   ★★ 남반구 쪽 띠를 담는 상태 0 — 남쪽은 북쪽에 쌓은 수(mrN)만 읽어 적도에 비춰 그린다(mrSouthOf).
      냉대 기후만은 남쪽에 비춰지지 않는다(MR_SOUTH).
   ★ 고산 기후는 위도 차례가 아니다 — 띠를 다 쌓고 판을 읽은 뒤, 매우 높은 산지에 따로 놓는다.

const MR_NB = 5;

/* 기후 — 교과서 32~33쪽 · 적도에서 극지방으로 가면서 나타나는 차례(0~4) + 고산 기후(5) */

const MR_READ_NO = [

/* ★ 북쪽 띠 — 쌓은 수만 읽는다 */
function mrNorthOf(st,i){ return i<st.mrN ? MR_NAME[i] : null; }
/* ★★ 남쪽 띠 — 북쪽에 쌓은 수를 적도에 비춘다(냉대만 비춰지지 않음) */
function mrSouthOf(st,i){ return (i<st.mrN && MR_SOUTH[i]) ? MR_NAME[i] : null; }
function mrGapOf(st,i){ return mrNorthOf(st,i)!=null && mrSouthOf(st,i)==null; }
function mrFull(st){ return st.mrN===MR_NB; }
function mrSouthN(st){ let c=0; for(let i=0;i<MR_NB;i++) if(mrSouthOf(st,i)!=null) c++; return c; }

function mrNorthRows(st){
  let s = '';
  for(let i=MR_NB-1;i>=0;i--){ const N = mrNorthOf(st,i);
    s += N!=null ? `<div class="mr-row n on" data-nrow="${i}" style="background:${MR_COLOR[i]};border-color:${MR_COLOR[i]}">${N}</div>`
      : `<div class="mr-row n${i===st.mrN?' next':''}" data-nrow="${i}" data-ph="1">${i===st.mrN?'다음 띠':'?'}</div>`; }
  return s;
}
function mrSouthRows(st){
  let s = '';
  for(let i=0;i<MR_NB;i++){ const S = mrSouthOf(st,i);
    s += S!=null ? `<div class="mr-row s on" data-srow="${i}" style="background:${MR_COLOR[i]};border-color:${MR_COLOR[i]}">${S}</div>`
      : mrGapOf(st,i) ? `<div class="mr-row s gap" data-srow="${i}" data-gap="1">(남반구에는 거의 나타나지 않아요)</div>`
      : `<div class="mr-row s" data-srow="${i}" data-ph="1">?</div>`; }
  return s;
}

function mrBoard(st){
  const fin = st.mrFin!=null, full = mrFull(st);
  const head = fin ? '세계의 기후 분포를 살펴보았어요'
    : st.mrHigh!=null ? '남은 카드까지 놓았어요 \u2014 이제 정리해요'
    : st.mrRead!=null ? '남은 카드를 놓을 자리를 찾아요'
    : full ? '띠를 다 쌓았어요 \u2014 남쪽을 살펴봐요'
    : '적도에서부터 북쪽으로 기후 띠를 쌓아요';
  const peak = st.mrHigh!=null ? ` <span class="mr-peak" data-peak="1">\u26F0\uFE0F 매우 높은 산지 \u00b7 ${MR_NAME[MR_HIGH]}</span>` : '';
  const tally = `북반구 띠 ${st.mrN} / ${MR_NB} \u00b7 남반구 띠 ${mrSouthN(st)} \u00b7 남은 카드 ${st.mrHigh!=null?0:1}`;
  return `<div class="mr-board" data-n="${st.mrN}" data-read="${st.mrRead==null?-1:st.mrRead}" data-high="${st.mrHigh==null?-1:st.mrHigh}" data-fin="${fin?1:0}">
    <div class="mr-head">${head}</div>
    <div class="mr-lad"><div class="mr-pole">\u2191 북극 쪽</div>${mrNorthRows(st)}<div class="mr-eq" data-eq="1">적도 0\u00b0${peak}</div>${mrSouthRows(st)}<div class="mr-pole">\u2193 남극 쪽</div></div>
    <div class="mr-sun"><span>적도 가까이 \u2014 햇볕을 많이 받아요</span><span>극지방 쪽 \u2014 햇볕을 적게 받아요</span></div>
    <div class="mr-tally" data-tally="1">${tally}</div>
  </div>`;
}

function mrPanel(st){
  const fin = st.mrFin!=null, full = mrFull(st);
  const q = fin ? '세계의 기후 분포를 살펴보았어요.'
    : st.mrHigh!=null ? '오늘 공부한 내용을 어떻게 정리하면 좋을까요?'
    : st.mrRead!=null ? '남은 카드는 어느 곳에 놓아야 할까요?'
    : full ? '북쪽에 띠를 쌓자 남쪽에도 띠가 나타났어요. 왜 그럴까요?'
    : st.mrN>0 ? '적도에서 극지방으로 가면서 다음에는 어떤 기후가 나타날까요?'
    : '적도 바로 위에는 어떤 기후가 나타날까요?';
  let right = `<div class="mr-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDF0F 적도에 비춰 보는 기후 띠</div>
      적도에서 극지방으로 가면서 <b>열대, 건조, 온대, 냉대, 한대 기후</b>가 차례대로 나타났어요.
      북쪽에 띠를 쌓자 남쪽에도 같은 차례로 띠가 나타났어요 \u2014 세계의 기후 분포는 <b>위도</b>에 따라 달라지고, 적도를 기준으로 비슷하게 나타나요.
      <b>매우 높은 산지</b>에서는 고산 기후가 나타나요.<br>
      <span style="color:#64748B">판의 띠는 차례를 보여 주는 <b>도식</b>이에요. 실제 기후의 경계는 반듯하지 않고 위치와 지형, 해발 고도에 따라 달라져요.
      남쪽 거울도 대략적인 모습이에요 \u2014 냉대 기후는 주로 북반구에 나타나요. 기후 분포도를 보며 친구들과 <b>돌아가며 말하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.mrHigh!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="mr-fin">${MR_FIN.map((t,k)=>`<button class="${st.mrWrongF===k?'no':''}" onclick="mrFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.mrRead!=null){
    right += `<div class="dw-step">\u26F0\uFE0F 남은 카드 \u2014 ${MR_NAME[MR_HIGH]}</div>`;
    right += `<div class="mr-high">${MR_HIGHAT.map((t,k)=>`<button class="${st.mrWrongH===k?'no':''}" onclick="mrHighPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="mr-note">이 카드는 위도의 차례에 들어가지 않았어요. 이 기후가 나타나는 곳을 골라 봐요.</div>`;
  } else if(full){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="mr-read">${MR_READ.map((t,k)=>`<button class="${st.mrWrongR===k?'no':''}" onclick="mrReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83C\uDCCF 기후 카드</div>`;
    right += `<div class="mr-deck">${MR_DECK.map(c=>`<button class="${c<st.mrN?'on':''}" data-card="${c}" onclick="mrStack(${c})">${MR_NAME[c]}</button>`).join('')}</div>`;
    right += `<div class="mr-note">카드를 누르면 <b>적도 바로 위 칸</b>부터 하나씩 쌓여요. 차례가 아닌 카드는 쌓이지 않고, 감점은 없어요. 쌓을 때마다 <b>남쪽</b>을 살펴봐요.</div>`;
  }
  if(st.mrMsg) right += `<div class="dw-msg${st.mrWarn?' warn':''}">${st.mrMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDF0F 적도에 비춰 보는 기후 띠 판</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${mrBoard(st)}<div class="cvcap">판의 띠는 기후가 나타나는 차례를 보여 주는 <b>도식</b>이에요. 실제 기후의 경계는 이렇게 반듯하지 않고 위치와 지형, 해발 고도에 따라 달라져요 \u2014 실제 분포는 교과서 지도로 봐요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>

}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function mrRender(){ main.innerHTML = slides[state.idx].render(state); }
function mrHold(msg){
  state.mrWarn=true; state.mrBusy=true; state.mrMsg=msg;
  playThud(); mrRender();
  setTimeout(()=>{ state.mrBusy=false; state.mrWarn=false; state.mrMsg=null;
    state.mrWrongR=null; state.mrWrongH=null; state.mrWrongF=null; mrRender(); },1600);
}

/* ① 기후 띠 쌓기 — 적도에서부터 하나씩 · ★ 남쪽은 쌓은 수만 읽어 비춘다. */
function mrStack(c){
  if(state.mrFin!=null) return;                                        // 가드①
  if(state.mrBusy) return;                                             // 가드⑬
  if(!Number.isInteger(c) || c<0 || c>=MR_NAME.length) return;         // 가드②
  if(mrFull(state)){ mrHold(MR_FULL); return; }                        // 가드③ 판 불변
  if(c===MR_HIGH){ mrHold(MR_HIGH_NOW); return; }                      // 가드④ 판 불변
  if(c<state.mrN){ mrHold(MR_STACKED); return; }                       // 가드⑤ 판 불변
  if(c!==state.mrN){ mrHold(MR_NOTNEXT); return; }                     // 가드⑥ 판 불변
  state.mrN += 1;                                                      // ★ 띠가 쌓이는 자리 단 하나 — 줄지 않음
  state.mrWarn=false;
  state.mrMsg = mrFull(state) ? MR_ALL_MSG : `<b>${MR_NAME[c]}</b> 띠를 쌓았어요. ${mrSouthOf(state,c)!=null ? '남쪽에도 같은 띠가 나타났어요.' : '남쪽에는 이 띠가 거의 나타나지 않아요.'}`;
  playBlip(); mrRender();
}

/* ② 판 읽기 — 띠가 다 쌓여야 열린다(가드⑦). */
function mrReadPick(k){
  if(state.mrFin!=null) return;                                        // 가드①
  if(state.mrBusy) return;                                             // 가드⑬
  if(!Number.isInteger(k) || k<0 || k>=MR_READ.length) return;         // 가드②
  if(!mrFull(state)){ mrHold(MR_ORDER_R); return; }                    // 가드⑦ 순서 — 판 불변
  if(state.mrRead!=null){ mrHold(MR_READ_AGAIN); return; }             // 가드⑧ 판 불변
  if(k===MR_READ_OK){
    state.mrRead=k; state.mrWrongR=null; state.mrWarn=false;
    state.mrMsg = '판을 잘 읽었어요. 기후는 <b>위도</b>에 따라 달라지고, <b>적도</b>를 기준으로 비슷하게 나타나요.';
    playChime(); mrRender(); return;
  }
  state.mrWrongR=k;
  mrHold(MR_READ_NO[k]);
}

/* ③ 남은 카드(고산 기후) 놓기 — 판을 읽은 뒤에만(가드⑨). */
function mrHighPick(k){
  if(state.mrFin!=null) return;                                        // 가드①
  if(state.mrBusy) return;                                             // 가드⑬
  if(!Number.isInteger(k) || k<0 || k>=MR_HIGHAT.length) return;       // 가드②
  if(state.mrRead==null){ mrHold(MR_ORDER_H); return; }                // 가드⑨ 순서 — 판 불변
  if(state.mrHigh!=null){ mrHold(MR_HIGH_AGAIN); return; }             // 가드⑩ 판 불변
  if(k!==MR_HIGH_OK){ state.mrWrongH=k; mrHold(MR_HIGH_NO[k]); return; } // 가드⑪ 판 불변
  state.mrHigh = k;                                                    // ★ 산이 서는 자리 단 하나
  state.mrWarn=false;
  state.mrMsg = '매우 높은 산지에는 <b>고산 기후</b>가 나타나요. 적도 가까이라도 <b>해발 고도</b>가 높으면 기후가 달라져요.';
  playChime(); mrRender();
}

/* ④ 마무리 — 지도서 8차시 주요 내용 정리 */
function mrFinish(k){
  if(state.mrFin!=null) return;                                        // 가드①
  if(state.mrBusy) return;                                             // 가드⑬
  if(!Number.isInteger(k) || k<0 || k>=MR_FIN.length) return;          // 가드②
  if(state.mrHigh==null){ mrHold(MR_ORDER_F); return; }                // 가드⑫ 순서 — 판 불변
  if(k===MR_FIN_OK){
    state.mrFin=k; state.mrWrongF=null; state.mrMsg=null; state.mrWarn=false;
    playChime(); mrRender(); return;
  }
  state.mrWrongF=k;
  mrHold(MR_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l07_창이갈라요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

⚠️ 엔진은 l09(l08 → … → 6-1 사회 엔진 승계)에서 100% 승계 · 엔진 무수정. 1단원 색 #0369A1.
⚠️ 회수 키 `g6_s2_social_u1_l10_v1`(학기 표지 s2 — l01 선례). 맵 키 `g6_social_u1_l10`.
⚠️ 파일명 `찾아서꽂아요` — 조작 이름(선례 승계).

직접조작: 찾아서 꽂는 기후 생활 지도 판 (교과서 44~46쪽 할 수 있어요 · 매핑하기 · 지도서 12차시 발문)
  ⭐ 판은 기후 여섯 칸(열대 · 건조 · 온대 · 냉대 · 한대 · 고산)의 도식 지도다. 검색어 여덟(옥수수 · 밀 · 벼 · 올리브와 포도 · 대추야자 · 순록 ·
     알파카와 라마 · 관광)은 **앞 차시(l07~l09) 교과서 본문이 든 생활 모습**이다.
  ⭐ 검색어를 누르면 「지도에 추가」 — 그 생활이 나타나는 기후 칸마다 핀이 선다. 검색 기록은 `state.mpSrch |=` 단 하나(덜어 내는 자리 0).
     핀은 `mpOn(k,c)` 한 줄이 `MP_HIT[` 를 읽는 단 한 자리에서만 정해진다 — 칸마다 핀을 담는 상태 0.
  ⭐★ 수첩 두 줄은 검색 기록에서만 선다(`mpCover`·`mpMany`): ① 여섯 기후 칸 모두에 핀(고루 나누어 조사 — 지도서 「편중되지 않도록 기후대별로」)
     ② 한 기후 칸에 핀 셋(같은 기후 환경에서도 다양한 생활 모습 — 온대 기후의 밀 · 올리브와 포도 · 벼).
     **옥수수와 밀은 한 번에 세 기후 칸에 핀을 세운다** — 한 생활이 여러 기후에 나타난다. 수첩을 담는 상태도, 정답 자리 상수도 없다.
  ⭐ 최소 검색 — 첫째 줄 3 · 두 줄 모두 5(스모크 BFS).
  ⭐ 판 읽기는 수첩 두 줄이 다 선 뒤에만 열린다(정답 자리 1). 이어서 **송끄란 축제(타이)** 3택(정답 자리 0 · 고르면 판의 열대 기후 칸에 송끄란 핀) → 마무리(정답 자리 2).
  ⭐ 근거 = 교과서 44~47쪽 본문 · 꼭 기억해요 · 재미있게 확인해요 · 지도서 12차시 발문·예시 답안·활동지 풀이·주요 내용 정리 · 앞 차시 본문(l07~l09).

단계 — ① 검색해서 지도에 꽂기 → ② 판 읽기 3택(정답 자리 1) → ③ 송끄란 축제 3택(정답 자리 0) →
  ④ 마무리 3택 = 지도서 12차시 주요 내용 정리 · 학습 내용 정리(정답 자리 2).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 이미 꽂은 검색어 다시 무시 — 판 불변(안내)
     ④ 수첩 두 줄이 다 서기 전 판 읽기 무시(순서) — 판 불변(안내에 검색어 이름 0)
     ⑤ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑥ 판을 읽기 전 송끄란 무시(순서) — 판 불변
     ⑦ 송끄란을 고른 뒤 다시 무시 — 판 불변
     ⑧ 알맞지 않은 송끄란 설명 무시 — 판 불변(자리별 안내)
     ⑨ 송끄란을 고르기 전 마무리 무시(순서) — 판 불변
     ⑩ 안내 표시 중 재클릭 무시(`mpBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.mp-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판·핀은 도식이다** — 실제 매핑은 디지털 영상 지도에서 한다(캡션 상시).
  ㉡ **핀은 교과서가 든 예까지만이다** — 실제 생활 모습은 훨씬 여러 가지이고, 핀의 수가 그 기후 지역 생활의 많고 적음이나 살기 좋고 나쁨을 뜻하지 않는다
     (지도서 「같은 기후 환경에서도 다양한 인간의 삶」 · 캡션·완료 카드 명시).
  ㉢ **누리집 주소와 지도 서비스 이름은 쓰지 않는다**.
  ㉣ **모둠 주제 정하기 · 인터넷 조사 · 디지털 영상 지도 매핑과 공유 · 활동지 · 더 알아보고 싶은 내용 쓰기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 「생각을 펼쳐요」(13차시)는 차시 예고 자리까지만.
  **지명은 원문이 든 것까지만** — 타이 · 일본 · 에스파냐(동기 유발 축제) · 서부 유럽 · 지중해 주변 · 우리나라 · 아시아(앞 차시 본문).
  사람 형상 0 · 네 자리 연도 0 · 쪽수 0 · 누리집 주소 0 · 수치 0 · 어느 기후도 더 낫거나 못하게 그리지 않는다.

/* ★ 검색했는지 · 그 칸에 핀이 서는지 — MP_HIT 을 읽는 자리 단 하나 */
function mpDid(st,k){ return (st.mpSrch & (1<<k))!==0; }
function mpOn(k,c){ return MP_HIT[k].indexOf(c)>=0; }
/* ★ 그 칸의 핀 — 검색 기록에서만 · 칸마다 핀을 담는 상태 0 */
function mpPins(st,c){ const r=[]; for(let k=0;k<MP_KEY.length;k++) if(mpDid(st,k) && mpOn(k,c)) r.push(k); return r; }
/* ★★ 수첩 — 핀이 선 기후 칸 수 · 핀 셋이 모인 첫 칸(없으면 -1) */
function mpCover(st){ let n=0; for(let c=0;c<MP_NC;c++) if(mpPins(st,c).length>0) n++; return n; }
function mpMany(st){ for(let c=0;c<MP_NC;c++) if(mpPins(st,c).length>=MP_MANY) return c; return -1; }
function mpAll(st){ return mpCover(st)===MP_NC && mpMany(st)>=0; }

function mpMap(st){
  let h='';
  for(let c=0;c<MP_NC;c++){ const p = mpPins(st,c), sg = st.mpSong!=null && c===MP_SONG;
    h += `<div class="mp-cell${p.length?' on':''}" data-clim="${c}" data-pins="${p.length}"><span class="cn">${MP_CLIM[c]}</span><span class="mp-pins">${p.map(k=>`<span class="mp-pin" data-key="${k}">\uD83D\uDCCC ${MP_KEY[k]}</span>`).join('')}${sg?`<span class="mp-pin song" data-song="1">\uD83C\uDF89 송끄란 축제(타이)</span>`:''}</span></div>`; }
  return h;
}
function mpNote(st){
  const n = mpCover(st), m = mpMany(st);
  const l0 = n===MP_NC ? `<div class="mp-line set" data-line="0" data-cover="${n}">여섯 기후 칸 모두에 핀이 섰어요 \u2014 고루 나누어 조사했어요</div>`
    : `<div class="mp-line" data-line="0" data-cover="${n}">핀이 선 기후 칸 ${n} / ${MP_NC}</div>`;
  const l1 = m>=0 ? `<div class="mp-line set" data-line="1" data-many="${m}">${MP_CLIM[m]} 칸에 핀 셋 \u2014 같은 기후에서도 여러 가지 생활 모습이 나타나요</div>`
    : `<div class="mp-line" data-line="1" data-many="-1">한 기후 칸에 핀이 셋 모인 곳 \u2014 아직 없어요</div>`;
  return l0+l1;
}

function mpBoard(st){
  const fin = st.mpFin!=null, all = mpAll(st);
  const head = fin ? '기후에 따른 다양한 생활 모습을 지도에 모아 보았어요'
    : st.mpSong!=null ? '송끄란 축제까지 꽂았어요 \u2014 이제 정리해요'
    : st.mpRead!=null ? '다른 모둠의 축제 조사도 살펴봐요'
    : all ? '수첩이 다 채워졌어요 \u2014 핀이 선 모습을 봐요'
    : '검색해서 기후 생활 지도에 꽂아 봐요';
  return `<div class="mp-board" data-srch="${st.mpSrch}" data-read="${st.mpRead==null?-1:st.mpRead}" data-spick="${st.mpSong==null?-1:st.mpSong}" data-fin="${fin?1:0}">
    <div class="mp-head">${head}</div>
    <div class="mp-map">${mpMap(st)}</div>
    <div class="mp-note">${mpNote(st)}</div>
  </div>`;
}

  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">공부한 내용을 되돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"세계의 다양한 기후 특징을 설명할 수 있어요",st)}
    ${selfCheck(1,"세계의 기후와 사람들의 다양한 생활 모습을 관련지어 탐구할 수 있어요",st)}
    ${selfCheck(2,"세계 여러 지역의 기후에 관심과 호기심을 가지고, 이를 탐구하려는 자세를 가져요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">‘생각을 펼쳐요’</b> 활동을 해요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l10";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  mpSrch:0,
  mpRead:null, mpSong:null, mpFin:null,
  mpWrongR:null, mpWrongS:null, mpWrongF:null,
  mpMsg:null, mpWarn:false, mpBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function mpRender(){ main.innerHTML = slides[state.idx].render(state); }
function mpHold(msg){
  state.mpWarn=true; state.mpBusy=true; state.mpMsg=msg;
  playThud(); mpRender();
  setTimeout(()=>{ state.mpBusy=false; state.mpWarn=false; state.mpMsg=null;
    state.mpWrongR=null; state.mpWrongS=null; state.mpWrongF=null; mpRender(); },1600);
}

/* ① 검색해서 지도에 추가 — ★ 검색 기록은 더하기만 한다. */
function mpFind(k){
  if(state.mpFin!=null) return;                                        // 가드①
  if(state.mpBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=MP_KEY.length) return;          // 가드②
  if(mpDid(state,k)){ mpHold(MP_AGAIN); return; }                      // 가드③ 이미 꽂음 — 판 불변
  state.mpSrch |= (1<<k);                                              // ★ 검색 기록이 느는 자리 단 하나 — 줄지 않음
  state.mpWarn=false;
  const n = MP_HIT[k].length;
  state.mpMsg = mpAll(state) ? MP_ALL_MSG : `<b>「${MP_KEY[k]}」</b>을 검색해 지도에 추가했어요 \u2014 기후 칸 <b>${n}곳</b>에 핀이 섰어요.`;
  playBlip(); mpRender();
}

/* ② 판 읽기 — 수첩 두 줄이 다 서야 열린다(가드④). */
function mpReadPick(k){
  if(state.mpFin!=null) return;                                        // 가드①
  if(state.mpBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=MP_READ.length) return;         // 가드②
  if(!mpAll(state)){ mpHold(MP_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.mpRead!=null){ mpHold(MP_READ_AGAIN); return; }             // 가드⑤ 판 불변
  if(k===MP_READ_OK){
    state.mpRead=k; state.mpWrongR=null; state.mpWarn=false;
    state.mpMsg = '판을 잘 읽었어요. 온대 기후 칸에는 <b>핀 셋</b>이 모였고, 옥수수와 밀은 <b>여러 기후 칸</b>에 섰어요 \u2014 기후에 따라, 또 같은 기후 안에서도 생활 모습은 여러 가지예요.';
    playChime(); mpRender(); return;
  }
  state.mpWrongR=k;
  mpHold(MP_READ_NO[k]);
}

/* ③ 송끄란 축제(타이) — 판을 읽은 뒤에만(가드⑥). */
function mpSongPick(k){
  if(state.mpFin!=null) return;                                        // 가드①
  if(state.mpBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=MP_SG.length) return;           // 가드②
  if(state.mpRead==null){ mpHold(MP_ORDER_S); return; }                // 가드⑥ 순서 — 판 불변
  if(state.mpSong!=null){ mpHold(MP_SG_AGAIN); return; }               // 가드⑦ 판 불변
  if(k!==MP_SG_OK){ state.mpWrongS=k; mpHold(MP_SG_NO[k]); return; }   // 가드⑧ 판 불변
  state.mpSong = k;                                                    // ★ 송끄란 핀이 서는 자리 단 하나
  state.mpWarn=false;
  state.mpMsg = '송끄란 축제를 <b>열대 기후</b> 칸에 꽂았어요. 무더위와 비, 농사 \u2014 축제에도 기후가 담겨 있어요.';
  playChime(); mpRender();
}

/* ④ 마무리 — 지도서 12차시 주요 내용 정리 */
function mpFinish(k){
  if(state.mpFin!=null) return;                                        // 가드①
  if(state.mpBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=MP_FIN.length) return;          // 가드②
  if(state.mpSong==null){ mpHold(MP_ORDER_F); return; }                // 가드⑨ 순서 — 판 불변
  if(k===MP_FIN_OK){
    state.mpFin=k; state.mpWrongF=null; state.mpMsg=null; state.mpWarn=false;
    playChime(); mpRender(); return;
  }
  state.mpWrongF=k;
  mpHold(MP_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 1단원 11차시(l11) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

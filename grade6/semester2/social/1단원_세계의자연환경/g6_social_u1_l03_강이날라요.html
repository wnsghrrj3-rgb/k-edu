학습 목표: 세계의 유명한 하천 지형의 특징과 생활 모습을 설명할 수 있다.
수업 기법 및 전략: 사진 살펴보기 · 자료 조사하기 · 의견 나누기
META = "1단원 세계의 자연환경 · ① 지형 경관과 다양한 생활 모습"
⚠️ 엔진은 l02(l01 → 6-1 사회 엔진 승계)에서 100% 승계 · 엔진 무수정. 1단원 색 #0369A1.
⚠️ 회수 키 `g6_s2_social_u1_l03_v1`(학기 표지 s2 — l01 선례). 맵 키 `g6_social_u1_l03`.
⚠️ 파일명 `강이날라요` — 조작 이름(선례 승계).

직접조작: 강이 날라 주는 판
  ⭐ 판에는 한 줄기 강(상류 계곡 → 넓은 물길 → 하류)과 강가, 그리고 **생활 여섯**(교과서 20~21쪽 여섯 곳)이 있다.
  ⭐ 학생은 짐 셋(흙 · 통나무 · 물건 실은 배)을 **상류에 띄울 수만** 있다. 짐을 직접 옮기는 단추는 없다.
     **흘려보내기** 한 번이 물 위의 모든 짐을 **함께 한 칸씩** 아래로 내린다(`state.rvWater = [0, …]` 한 줄).
     강은 거슬러 오르지 않는다 — 짐을 위로 올리는 자리 0.
  ⭐ **평야는 학생이 놓지 않는다** — 하류에 닿은 흙의 수(`rvSoil`)에서만 강가의 평야가 자란다.
     근거 = 교과서 20쪽 원문 「하천이 운반한 여러 가지 퇴적물이 하천 주변에 쌓여 평야를 이루기 때문입니다」.
  ⭐ 생활 여섯은 고르지 않는다 — `rvLifeOn` 한 줄이 켠다. 세 생활(콩고강 · 이구아수 폭포 · 노르웨이)은 **강의 모습**만으로
     처음부터 켜져 있고, 세 생활(일리노이강 · 프레이저강 · 짜오프라야강)은 **강이 날라 준 것**이 하류에 닿아야 켜진다.
  ⭐ **흙은 한 번에 쌓이지 않는다** — 상류 칸에는 같은 짐이 하나만 설 수 있어, 흙 셋은 흘려보내기 사이사이에 띄워야 한다.
  ⭐ 흘려보낸 수·띄운 차례는 세지 않는다(차례·걸음 상태 0). 정답 차례 상수 0(`RV_ORDER`·`RV_LOAD_OK` 부재).
     도착한 것은 줄지 않는다(`state.rvSoil +=` · `state.rvGot |=` 각각 단 하나 · 덜어 내는 자리 0).

단계 — ① 짐을 띄우고 흘려보내며 생활 여섯 켜기(순서 자유) → ② 판 읽기 3택(세 생활이 흘려보낸 뒤에야 켜진 까닭 ·
  정답 자리 2) → ③ 마무리 3택 = 지도서 4차시 주요 내용 정리 2·3 원문(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 상류 칸에 이미 같은 짐이 떠 있으면 띄우기 무시 — 판 불변
     ④ 더 띄울 까닭이 없는 짐(흙은 셋 · 통나무·배는 하나를 이미 띄움) 띄우기 무시 — 판 불변
     ⑤ 물 위가 비었을 때 흘려보내기 무시 — 판 불변
     ⑥ 생활 여섯이 다 켜지기 전 판 읽기 무시(순서) — 판 불변
     ⑦ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑧ 판을 읽기 전 마무리 무시(순서) — 판 불변
     ⑨ 안내 표시 중 재클릭 무시(`rvBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.rv-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 그림은 도식이지 사진이 아니다** — 실제 모습은 교과서 사진과 영상으로 본다(캡션 상시).
  ㉡ **판의 강은 여러 나라의 강을 한 줄기로 모은 도식이다** — 여섯 곳은 실제로는 서로 다른 강이다(캡션 상시).
  ㉢ **판은 교과서가 든 관계만 담았다** — 평야는 흙이 오래 쌓여 이루어지며, 판의 셋은 그것을 줄여 보인 것이다.
  ㉣ **친구와 이야기하기 · 생활 일기 쓰기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 해안(5차시) 지형과 생활 0 · 기후(8차시~) 0.
  **지명은 이 차시 원문이 든 것까지만** — 아마존강 · 나일강 · 호스슈 벤드 계곡 · 빅토리아 폭포 · 콩고강 · 일리노이강 · 노르웨이 ·

  정서 — 어느 하천 생활도 더 낫거나 못하게 그리지 않는다 · 사람 형상 0.

.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ★ 물 위의 한 짐 — 칸 i 에 짐 k 가 떠 있는가 */
function rvAt(st,i,k){ return ((st.rvWater[i]>>k)&1)===1; }
function rvInWater(st,k){ let n=0; for(let i=0;i<RV_N;i++) if(rvAt(st,i,k)) n++; return n; }
function rvAny(st){ return st.rvWater.some(v=>v!==0); }
/* ★ 띄운 수 = 닿은 수 + 물 위의 수 (띄운 수 전용 상태 0) */
function rvCount(st,k){ return (k===0 ? st.rvSoil : ((st.rvGot>>k)&1)) + rvInWater(st,k); }
/* ★ 평야 — 하류에 닿은 흙의 수에서만 */
function rvPlain(st){ return st.rvSoil>=RV_NEED[0]; }
/* ★★ 켜진 생활 — 이 한 줄에서만 나온다 */
function rvLifeOn(st,k){ return k<3 ? true : k===3 ? rvPlain(st) : ((st.rvGot>>(k-3))&1)===1; }
function rvOnN(st){ let n=0; for(let k=0;k<RV_PLACE.length;k++) if(rvLifeOn(st,k)) n++; return n; }
function rvAll(st){ return rvOnN(st)===RV_PLACE.length; }

function rvItem(k,x,y){
  if(k===0) return `<circle cx="${x}" cy="${y}" r="5" fill="#A16207" data-item="0"/>`;
  if(k===1) return `<rect x="${x-11}" y="${y-3.5}" width="22" height="7" rx="3.5" fill="#78350F" data-item="1"/>`;
  return `<path d="M${x-12} ${y-3} L${x+12} ${y-3} L${x+8} ${y+5} L${x-8} ${y+5} Z" fill="#334155" data-item="2"/><rect x="${x-4}" y="${y-9}" width="8" height="6" fill="#F59E0B"/>`;
}

function rvCanvas(st){
  const fin = st.rvFin!=null, all = rvAll(st);
  const head = fin ? '하천 지형과 생활 모습을 살펴보았어요'
    : st.rvRead!=null ? '판을 읽었어요 \u2014 이제 정리해요'
    : all ? '생활 여섯이 모두 켜졌어요'
    : '짐을 상류에 띄우고 강물을 흘려보내 봐요';

  /* 물 위의 칸 셋 — 짐은 rvWater 에서만 그린다 */
  let secs='';
  for(let i=0;i<RV_N;i++){
    const x = 14+i*78;
    let items=''; let j=0;
    for(let k=0;k<RV_KIND.length;k++) if(rvAt(st,i,k)){ items += rvItem(k, x+36, 62+j*14); j++; }
    secs += `<g data-sec="${i}" data-w="${st.rvWater[i]}">
      <rect x="${x}" y="40" width="72" height="60" fill="${i===0?'#38BDF8':i===1?'#7DD3FC':'#BAE6FD'}"/>
      <text x="${x+36}" y="112" font-size="6.8" fill="#075985" text-anchor="middle" font-weight="800">${RV_SEC[i]}</text>
      ${items}</g>`;
  }
  const arrows = [0,1,2].map(i=>`<path d="M${80+i*78} 46 l6 4 l-6 4" stroke="#fff" stroke-width="1.6" fill="none"/>`).join('');
  /* 강가 — 쌓인 흙 층 · 닿은 통나무·배 */
  let bank = `<rect x="250" y="40" width="62" height="72" rx="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1"/>
    <text x="281" y="50" font-size="6.4" fill="#854D0E" text-anchor="middle" font-weight="800">강가</text>`;
  for(let s=0;s<st.rvSoil;s++) bank += `<rect x="254" y="${100-s*9}" width="54" height="8" fill="${rvPlain(st)?'#86EFAC':'#D6B98C'}" data-layer="${s}"/>`;
  if((st.rvGot>>1)&1) bank += rvItem(1,270,60).replace('data-item="1"','data-got="1"');
  if((st.rvGot>>2)&1) bank += rvItem(2,294,62).replace('data-item="2"','data-got="2"');

  /* 생활 여섯 — 켜짐은 rvLifeOn 에서만 */
  let lives='';
  for(let k=0;k<RV_PLACE.length;k++){
    const x = 8+(k%3)*102, y = 124+Math.floor(k/3)*62, on = rvLifeOn(st,k);
    lives += `<g data-life="${k}" data-on="${on?1:0}">
      <rect x="${x}" y="${y}" width="98" height="56" rx="8" fill="${on?'#E0F2FE':'#F8FAFC'}" stroke="${on?'#0369A1':'#CBD5E0'}" stroke-width="1.2" ${on?'':'stroke-dasharray="3 2"'}/>
      <text x="${x+49}" y="${y+16}" font-size="7.4" fill="${on?'#075985':'#94A3B8'}" text-anchor="middle" font-weight="800">${RV_PLACE[k]}</text>
      <text x="${x+49}" y="${y+30}" font-size="6.8" fill="${on?'#92400E':'#94A3B8'}" text-anchor="middle" font-weight="800">${RV_LIFE_S[k]}</text>
      <text x="${x+49}" y="${y+45}" font-size="6" fill="#64748B" text-anchor="middle" font-weight="700">${on?'켜졌어요':'아직 꺼져 있어요'}</text>
    </g>`;
  }
  const tally = `켜진 생활 ${rvOnN(st)} / ${RV_PLACE.length} \u00b7 강가에 쌓인 흙 ${st.rvSoil} / ${RV_NEED[0]}`;
  return `<svg viewBox="0 0 320 280" data-water="${st.rvWater.join('')}" data-soil="${st.rvSoil}" data-got="${st.rvGot}" data-on="${rvOnN(st)}" data-all="${all?1:0}" data-read="${st.rvRead==null?-1:st.rvRead}" data-fin="${fin?1:0}">
    <rect width="320" height="280" fill="#fff"/>
    <rect x="8" y="8" width="304" height="18" rx="6" fill="#E0F2FE"/>
    <text x="160" y="20.5" font-size="7.6" fill="#075985" text-anchor="middle" font-weight="800">${head}</text>
    <text x="14" y="36" font-size="6.2" fill="#64748B" font-weight="800">강물은 상류에서 하류로만 흘러요 \u2192</text>
    ${secs}
    ${arrows}
    ${bank}
    ${lives}
    <rect x="8" y="252" width="304" height="20" rx="6" fill="#FEF3C7"/>
    <text x="160" y="265.5" font-size="7" fill="#92400E" text-anchor="middle" font-weight="800" data-tally="1">${tally}</text>
  </svg>`;
}

function rvPanel(st){
  const fin = st.rvFin!=null, all = rvAll(st);
  const q = fin ? '세계의 유명한 하천 지형과 생활 모습을 살펴보았어요.'

    : '하천은 사람들의 생활에 무엇을 날라 줄까요?';
  let right = `<div class="rv-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDF0A 강이 날라요</div>
      콩고강 · 이구아수 폭포 · 노르웨이의 생활은 <b>강의 모습</b>만으로 처음부터 켜져 있었어요.
      일리노이강 · 프레이저강 · 짜오프라야강의 생활은 강이 <b>날라 준 것</b>이 하류에 닿아야 켜졌어요.
      평야도 여러분이 놓지 않았어요 \u2014 강이 나른 흙이 강가에 쌓여 생겼어요.<br>
      <span style="color:#64748B">판의 강은 여러 나라의 강을 한 줄기로 모은 <b>도식</b>이에요. 평야는 흙이 오래 쌓여 이루어지고, 판은 그것을 줄여 보였어요.
      친구와 <b>이야기하기</b>와 생활 일기 쓰기는 교실에서 직접 해요.</span></div>`;
  } else if(st.rvRead!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="rv-fin">${RV_FIN.map((t,k)=>`<button class="${st.rvWrongF===k?'no':''}" onclick="rvFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="rv-read">${RV_READ.map((t,k)=>`<button class="${st.rvWrongR===k?'no':''}" onclick="rvReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\u26F5 상류에 짐을 띄워요</div>`;
    right += `<div class="rv-load">${RV_KIND.map((t,k)=>`<button onclick="rvLoad(${k})"><span class="ct">${RV_KIND_T[k]}</span>${t}</button>`).join('')}</div>`;
    right += `<div class="dw-step">\uD83C\uDF0A 강물을 흘려보내요</div>`;
    right += `<button class="rv-flow" onclick="rvFlow()">흘려보내기 \u2014 물 위의 짐이 모두 한 칸씩 내려가요</button>`;
    right += `<div class="rv-note">짐은 <b>상류에만</b> 띄울 수 있고, 강물이 짐을 날라요. <b>어느 짐부터</b> 띄워도 좋아요. 몇 번이고 흘려보내도 되고, 감점은 없어요.</div>`;
  }
  if(st.rvMsg) right += `<div class="dw-msg${st.rvWarn?' warn':''}">${st.rvMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDF0A 강이 날라 주는 판</b></div>
    <div class="dw-body">

      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function rvRender(){ main.innerHTML = slides[state.idx].render(state); }
function rvHold(msg){
  state.rvWarn=true; state.rvBusy=true; state.rvMsg=msg;
  playThud(); rvRender();
  setTimeout(()=>{ state.rvBusy=false; state.rvWarn=false; state.rvMsg=null;
    state.rvWrongR=null; state.rvWrongF=null; rvRender(); },1600);
}

/* ① 짐 띄우기 — 상류 칸에만. 정답 짐·차례 상수 0. */
function rvLoad(k){
  if(state.rvFin!=null) return;                                        // 가드①
  if(state.rvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RV_KIND.length) return;         // 가드②
  if(rvAt(state,0,k)){ rvHold(RV_UP); return; }                        // 가드③ 판 불변
  if(rvCount(state,k)>=RV_NEED[k]){ rvHold(RV_ENOUGH); return; }       // 가드④ 판 불변
  state.rvWater[0] |= (1<<k);                                          // ★ 짐이 물에 드는 자리는 여기 한 곳뿐 · 언제나 상류
  state.rvWarn=false;
  state.rvMsg = `상류에 <b>${RV_KIND[k]}</b>을(를) 띄웠어요. 이제 강물을 흘려보내 봐요.`;
  playBlip(); rvRender();
}

/* ② 흘려보내기 — ★★ 물 위의 모든 짐이 함께 한 칸씩 내려간다. 거슬러 오르는 자리 0. */
function rvFlow(){
  if(state.rvFin!=null) return;                                        // 가드①
  if(state.rvBusy) return;                                             // 가드⑨
  if(!rvAny(state)){ rvHold(RV_EMPTY); return; }                       // 가드⑤ 판 불변
  const out = state.rvWater[RV_N-1];
  state.rvWater = [0, state.rvWater[0], state.rvWater[1]];             // ★ 짐이 움직이는 자리는 여기 한 곳뿐 · 아래로만
  if(out&1) state.rvSoil += 1;                                         // ★ 흙이 강가에 쌓이는 자리 단 하나 · 덜어 내는 자리 0
  state.rvGot |= (out&6);                                              // ★ 통나무·배가 닿는 자리 단 하나 · 덜어 내는 자리 0
  state.rvWarn=false;
  let m = '강물이 흘러 물 위의 짐이 <b>모두 한 칸씩</b> 내려갔어요.';
  if(out&1) m += rvPlain(state) ? ' 흙이 강가에 쌓여 <b>넓은 평야</b>가 생겼어요.' : ` 흙이 하류에 닿아 강가에 쌓였어요(${state.rvSoil} / ${RV_NEED[0]}).`;
  if(out&2) m += ' <b>통나무</b>가 하류에 닿았어요.';
  if(out&4) m += ' <b>물건 실은 배</b>가 하류에 닿았어요.';
  state.rvMsg = rvAll(state) ? RV_ALL_MSG : m;
  playBlip(); rvRender();
}

/* ③ 판 읽기 — 생활 여섯이 다 켜져야 열린다(가드⑥). */
function rvReadPick(k){
  if(state.rvFin!=null) return;                                        // 가드①
  if(state.rvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RV_READ.length) return;         // 가드②
  if(!rvAll(state)){ rvHold(RV_ORDER_R); return; }                     // 가드⑥ 순서 — 판 불변
  if(state.rvRead!=null){ rvHold(RV_READ_AGAIN); return; }             // 가드⑦ 판 불변
  if(k===RV_READ_OK){
    state.rvRead=k; state.rvWrongR=null; state.rvWarn=false;
    state.rvMsg = '판을 잘 읽었어요. 하천은 흙과 짐을 <b>날라 주고</b>, 그것이 닿은 곳에서 사람들의 <b>생활 모습</b>이 생겨났어요.';
    playChime(); rvRender(); return;
  }
  state.rvWrongR=k;
  rvHold(RV_READ_NO[k]);
}

/* ④ 마무리 — 지도서 4차시 주요 내용 정리 2·3 원문 */
function rvFinish(k){
  if(state.rvFin!=null) return;                                        // 가드①
  if(state.rvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=RV_FIN.length) return;          // 가드②
  if(state.rvRead==null){ rvHold(RV_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===RV_FIN_OK){
    state.rvFin=k; state.rvWrongF=null; state.rvMsg=null; state.rvWarn=false;
    playChime(); rvRender(); return;
  }
  state.rvWrongF=k;
  rvHold(RV_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l04_함께움직여요.html'; } // 1단원 4차시(l04) 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

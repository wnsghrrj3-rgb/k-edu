⚠️ 파일명 `철을돌려요` — 조작 이름(선례 승계).

직접조작: 철을 돌려 보는 세 도시의 판 (교과서 37쪽 스스로 활동 · 지도서 10차시 「세 도시의 기후 그래프 비교」 · 핵심 질문)
  ⭐ 판에는 온대 기후 지역의 세 도시 — 런던(영국) · 로마(이탈리아) · 서울(대한민국) — 가 나란히 있고, 「한 철 넘기기」 단추 하나가
     봄 → 여름 → 가을 → 겨울 → 봄 … 으로 **앞으로만** 철을 돌린다. 한 번 돌리면 세 도시가 함께 그 철이 된다.
  ⭐ 기온 막대는 세 도시가 **같은 모양**(여름이 가장 높고 겨울이 가장 낮다 — 지도서 예시 답 「일 년 중 여름철 기온이 가장 높다」) ·
     빗방울은 여름과 겨울에만 그린다(`SK_RAIN[` 읽는 자리 단 하나 · `skDrops`). 빗방울은 **한 도시 안에서** 여름과 겨울을 견주는 표시다 — 도시끼리 견주지 않는다.
  ⭐★ **한 철만 보아서는 비가 내리는 모양이 서지 않는다 — 여름과 겨울을 다 보아야 선다.** 수첩의 세 줄(비가 내리는 모양)은
     `skShape` 가 **본 철 기록**(`state.skSeen |=` 단 하나 · 덜어 내는 자리 0)에서 여름과 겨울이 모두 켜졌을 때에만, 그 도시의 여름 빗방울과 겨울 빗방울을
     견주어 계산한다 — 모양을 담는 상태도, 도시별 정답 상수도 없다. 여름에 서도 수첩은 「아직」이다.
  ⭐ 모양이 서면 그 줄에 작물이 선다(`SK_CROP[모양]` — 교과서 38쪽: 서부 유럽 밀·낙농업 · 지중해 주변 올리브·포도 · 아시아 벼농사).
  ⭐ 판 읽기는 수첩 세 줄이 다 선 뒤에만 열린다(정답 자리 0). 이어서 **냉대 기후 지역(오슬로)** 의 농사 3택(정답 자리 2) → 마무리(정답 자리 1).
  ⭐ 근거 = 교과서 37~40쪽 본문 · 지도서 10차시 발문·예시 답안·사진 해설·주요 내용 정리 · 풍덩 사회 속으로.

단계 — ① 철 넘기기(여름과 겨울을 다 볼 때까지) → ② 판 읽기 3택(정답 자리 0) → ③ 냉대 기후 지역의 농사 3택(정답 자리 2) →
  ④ 마무리 3택 = 지도서 10차시 주요 내용 정리 · 학습 내용 정리(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 수첩 세 줄이 다 서기 전 판 읽기 무시(순서) — 판 불변(안내에 철 이름 0)
     ④ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑤ 판을 읽기 전 냉대 농사 무시(순서) — 판 불변
     ⑥ 냉대 농사를 고른 뒤 다시 무시 — 판 불변
     ⑦ 알맞지 않은 냉대 농사 무시 — 판 불변(자리별 안내)
     ⑧ 냉대 농사를 고르기 전 마무리 무시(순서) — 판 불변
     ⑨ 안내 표시 중 재클릭 무시(`skBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.sk-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **기온 막대·빗방울·풍경은 도식이다** — 실제 기후 그래프와 모습은 교과서로 본다(캡션 상시).
  ㉡ **빗방울은 한 도시 안에서 철을 견주는 표시다** — 도시끼리 견주지 않는다 · 한 도시의 모습을 그 기후 전체의 모습으로 여기지 않는다

  ㉣ **활동지 · 관광 상품 만들기(스스로 활동) · 돌아가며 말하기는 교실 몫**이다(완료 카드 명시).

.sk-cold{background:#EFF6FF;border:2px solid #1D4ED8;border-radius:7px;padding:4px 8px;text-align:center;font-weight:800;color:#1E3A8A;
  font-size:clamp(9.4px,1.58vw,11.4px);line-height:1.45}
.sk-turn{border:2px solid var(--amber);background:#FFFBEB;color:var(--amber);border-radius:10px;padding:8px 4px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(11px,1.9vw,13.6px)}
.sk-turn:hover{background:var(--bub)}
.sk-read,.sk-fin,.sk-coldq{display:flex;flex-direction:column;gap:5px}
.sk-read button,.sk-fin button,.sk-coldq button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.sk-read button:hover,.sk-fin button:hover,.sk-coldq button:hover{background:var(--bub)}
.sk-read button.no,.sk-fin button.no,.sk-coldq button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.sk-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .sk-grid{gap:3px} .sk-city{padding:3px 2px} .sk-heat i{width:7px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ★ 본 철인지 */
function skSeenOf(st,s){ return (st.skSeen & (1<<s))!==0; }
/* ★ 빗방울 — SK_RAIN 을 읽는 자리 단 하나 · 여름과 겨울에만 */
function skDrops(c,s){ return s===1 ? SK_RAIN[c][0] : s===3 ? SK_RAIN[c][1] : 0; }
/* ★ 기온 막대 — SK_HEAT 를 읽는 자리 단 하나 · 도시를 받지 않는다(세 도시가 같은 모양) */
function skHeat(s){ return SK_HEAT[s]; }
/* ★★ 비가 내리는 모양 — 여름과 겨울을 다 보았을 때에만, 그 도시의 두 철 빗방울을 견주어 선다 */
function skShape(st,c){ if(!(skSeenOf(st,1) && skSeenOf(st,3))) return -1; const a = skDrops(c,1), b = skDrops(c,3); return a===b ? 0 : a<b ? 1 : 2; }
function skAll(st){ return SK_CITY.every((t,c)=>skShape(st,c)>=0); }

function skCities(st){
  const s = st.skS, h = skHeat(s);
  return SK_CITY.map((t,c)=>{ const n = skDrops(c,s);
    const bars = [1,2,3].map(v=>`<i class="${v<=h?'on':''}" style="height:${8+v*8}px"></i>`).join('');
    const rain = s===1 || s===3 ? `<div class="sk-rain" data-drops="${n}">${'\uD83D\uDCA7'.repeat(n)}</div>` : `<div class="sk-rain mid" data-drops="0">여름과 겨울 사이</div>`;
    return `<div class="sk-city" data-city="${c}"><div class="nm">${t}</div><div class="sk-heat" data-heat="${h}">${bars}</div>${rain}</div>`; }).join('');
}
function skNote(st){
  return SK_CITY.map((t,c)=>{ const p = skShape(st,c);
    return p<0 ? `<div class="sk-line" data-line="${c}" data-shape="-1">${t} \u2014 아직 비어 있어요</div>`
      : `<div class="sk-line set" data-line="${c}" data-shape="${p}">${t} \u2014 ${SK_SHAPE[p]} <span class="sk-crop" data-crop="${p}">${SK_CROP[p]}</span></div>`; }).join('');
}

function skBoard(st){
  const fin = st.skFin!=null, all = skAll(st);
  const head = fin ? '온대 기후와 냉대 기후 지역의 생활 모습을 살펴보았어요'
    : st.skCold!=null ? '냉대 기후 지역까지 살펴보았어요 \u2014 이제 정리해요'
    : st.skRead!=null ? '냉대 기후 지역도 살펴봐요'
    : all ? '수첩이 다 채워졌어요 \u2014 세 도시를 견주어 봐요'
    : '철을 넘기며 세 도시의 기온과 비를 살펴봐요';
  const season = `<div class="sk-season">${SK_SEASON.map((t,s)=>`<span class="${s===st.skS?'now':''}" data-s="${s}">${t}</span>`).join('')}</div>`;
  const cold = st.skCold!=null ? `<div class="sk-cold" data-cold="1">\u2744\uFE0F 오슬로(노르웨이) \u2014 냉대 기후 \u00b7 ${SK_COLD[SK_COLD_OK]} \u00b7 넓은 침엽수림에서 목재와 펄프를 생산해요</div>` : '';
  const tally = `본 철 \u00b7 ${SK_SEASON.map((t,s)=>t+' '+(skSeenOf(st,s)?'\u2714':'\u2014')).join(' \u00b7 ')}`;
  return `<div class="sk-board" data-s="${st.skS}" data-seen="${st.skSeen}" data-read="${st.skRead==null?-1:st.skRead}" data-cpick="${st.skCold==null?-1:st.skCold}" data-fin="${fin?1:0}">
    <div class="sk-head">${head}</div>
    ${season}
    <div class="sk-grid">${skCities(st)}</div>
    <div class="sk-note">${skNote(st)}</div>
    ${cold}
    <div class="sk-tally" data-tally="1">${tally}</div>
  </div>`;
}

function skPanel(st){
  const fin = st.skFin!=null, all = skAll(st);
  const q = fin ? '온대 기후와 냉대 기후 지역의 생활 모습을 살펴보았어요.'
    : st.skCold!=null ? '오늘 공부한 내용을 어떻게 정리하면 좋을까요?'
    : st.skRead!=null ? '겨울이 여름보다 길고 몹시 추우며 눈이 많이 내리는 냉대 기후 지역에서는 농사를 어떻게 지을까요?'
    : all ? '세 도시의 기온과 비가 내리는 모양은 어디가 같고 어디가 달랐나요?'
    : skSeenOf(st,1) ? '여름을 보았어요. 수첩은 왜 아직 비어 있을까요? 철을 더 넘겨 봐요.'
    : '온대 기후 지역의 세 도시는 철마다 어떻게 달라질까요?';
  let right = `<div class="sk-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\uD83C\uDF42 철을 돌려 보는 세 도시</div>
      온대 기후 지역의 세 도시는 모두 <b>여름 기온이 가장 높고</b> 사계절의 변화가 비교적 뚜렷했어요.
      하지만 여름과 겨울의 비를 견주어 보니 <b>비가 내리는 모양</b>이 달랐고, 그에 따라 밀과 목장, 올리브와 포도, 벼처럼 <b>다양한 농업</b>이 발달했어요.
      겨울이 길고 몹시 추운 <b>냉대 기후 지역</b>에서는 여름에 농사를 짓고 침엽수림에서 목재와 펄프를 생산해요.<br>
      <span style="color:#64748B">판의 막대와 빗방울은 한 도시 안에서 철을 견주는 <b>도식</b>이에요. 같은 기후 지역이라도 생활 모습은 여러 가지예요 \u2014 한 도시의 모습을 그 기후 전체의 모습으로 여기지 않아요.
      <b>활동지</b>와 <b>관광 상품 만들기</b>, <b>돌아가며 말하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.skCold!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="sk-fin">${SK_FIN.map((t,k)=>`<button class="${st.skWrongF===k?'no':''}" onclick="skFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.skRead!=null){
    right += `<div class="dw-step">\u2744\uFE0F 냉대 기후 지역 \u2014 오슬로(노르웨이)</div>`;
    right += `<div class="sk-coldq">${SK_COLD.map((t,k)=>`<button class="${st.skWrongC===k?'no':''}" onclick="skColdPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="sk-hint">냉대 기후는 북반구의 중위도와 고위도 지역에서 널리 나타나요. 온대 기후 지역과 같이 사계절이 있지만 겨울이 여름보다 길고 몹시 추우며 눈이 많이 내려요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="sk-read">${SK_READ.map((t,k)=>`<button class="${st.skWrongR===k?'no':''}" onclick="skReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDDD3\uFE0F 철 넘기기</div>`;
    right += `<button class="sk-turn" onclick="skTurn()">\u25B6 한 철 넘기기 (지금은 <b>${SK_SEASON[st.skS]}</b>)</button>`;
    right += `<div class="sk-hint">단추를 누를 때마다 세 도시가 함께 다음 철이 돼요. 수첩의 줄이 <b>모두 채워질 때까지</b> 넘겨 봐요. 감점은 없어요.</div>`;
  }
  if(st.skMsg) right += `<div class="dw-msg${st.skWarn?' warn':''}">${st.skMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\uD83C\uDF42 철을 돌려 보는 세 도시의 판</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${skBoard(st)}<div class="cvcap">판의 기온 막대와 빗방울은 <b>한 도시 안에서</b> 철을 견주는 도식이에요. 도시끼리 견주지 않아요 \u2014 실제 기후 그래프는 교과서로 봐요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('sum','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">\u2460</span><div>온대 기후 \u2014 <b>중위도 지역</b> \u00b7 사계절의 변화가 비교적 뚜렷함 \u00b7 다양한 농업이 발달함(서부 유럽: 밀\u00b7낙농업, 지중해 주변: 올리브와 포도 재배, 아시아: 벼농사)</div></div>
    <div class="sum-item"><span class="n">\u2461</span><div>냉대 기후 \u2014 <b>북반구의 중위도와 고위도 지역</b> \u00b7 사계절이 있지만 겨울이 여름보다 길고 몹시 추우며 눈이 많이 옴 \u00b7 여름에 밀\u00b7옥수수\u00b7감자 등을 재배함, 침엽수림이 넓게 발달하여 목재와 펄프 산업이 발달함</div></div>
    <div class="sum-item"><span class="n">\u2605</span><div><b>오늘의 조작</b> \u2014 여름 한 철만 보아서는 비가 내리는 모양을 알 수 없었어요. 한 도시 안에서 여름과 겨울을 견주어야 보였어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b>한대 기후와 고산 기후 지역의 생활 모습</b>을 알아봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">공부한 내용을 되돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"온대 기후와 냉대 기후의 특징을 말할 수 있어요",st)}
    ${selfCheck(1,"온대 기후와 냉대 기후 지역의 생활 모습을 설명할 수 있어요",st)}
    ${selfCheck(2,"기후와 사람들의 생활 모습 사이의 관계를 탐구할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">한대 기후와 고산 기후 지역의 생활 모습</b>을 알아봐요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  skS:0, skSeen:1,
  skRead:null, skCold:null, skFin:null,
  skWrongR:null, skWrongC:null, skWrongF:null,
  skMsg:null, skWarn:false, skBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function skRender(){ main.innerHTML = slides[state.idx].render(state); }
function skHold(msg){
  state.skWarn=true; state.skBusy=true; state.skMsg=msg;
  playThud(); skRender();
  setTimeout(()=>{ state.skBusy=false; state.skWarn=false; state.skMsg=null;
    state.skWrongR=null; state.skWrongC=null; state.skWrongF=null; skRender(); },1600);
}

/* ① 철 넘기기 — 앞으로만 한 철. ★ 본 철 기록은 더하기만 한다. */
function skTurn(){
  if(state.skFin!=null) return;                                        // 가드①
  if(state.skBusy) return;                                             // 가드⑨
  state.skS = (state.skS+1) % SK_NS;                                   // 철이 바뀌는 자리 단 하나 — 앞으로만
  state.skSeen |= (1<<state.skS);                                      // ★ 본 철 기록이 느는 자리 단 하나 — 줄지 않음
  state.skWarn=false;
  state.skMsg = skAll(state) ? SK_ALL_MSG : `<b>${SK_SEASON[state.skS]}</b>이 되었어요. 세 도시의 기온 막대와 빗방울을 살펴봐요.`;
  playBlip(); skRender();
}

/* ② 판 읽기 — 수첩 세 줄이 다 서야 열린다(가드③). */
function skReadPick(k){
  if(state.skFin!=null) return;                                        // 가드①
  if(state.skBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=SK_READ.length) return;         // 가드②
  if(!skAll(state)){ skHold(SK_ORDER_R); return; }                     // 가드③ 순서 — 판 불변
  if(state.skRead!=null){ skHold(SK_READ_AGAIN); return; }             // 가드④ 판 불변
  if(k===SK_READ_OK){
    state.skRead=k; state.skWrongR=null; state.skWarn=false;
    state.skMsg = '판을 잘 읽었어요. 세 도시는 <b>기온</b>의 모양이 같았지만, 여름과 겨울을 견주어 보니 <b>비가 내리는 모양</b>이 달랐어요.';
    playChime(); skRender(); return;
  }
  state.skWrongR=k;
  skHold(SK_READ_NO[k]);
}

/* ③ 냉대 기후 지역의 농사 — 판을 읽은 뒤에만(가드⑤). */
function skColdPick(k){
  if(state.skFin!=null) return;                                        // 가드①
  if(state.skBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=SK_COLD.length) return;         // 가드②
  if(state.skRead==null){ skHold(SK_ORDER_C); return; }                // 가드⑤ 순서 — 판 불변
  if(state.skCold!=null){ skHold(SK_COLD_AGAIN); return; }             // 가드⑥ 판 불변
  if(k!==SK_COLD_OK){ state.skWrongC=k; skHold(SK_COLD_NO[k]); return; } // 가드⑦ 판 불변
  state.skCold = k;                                                    // ★ 냉대 기후 지역이 판에 서는 자리 단 하나
  state.skWarn=false;
  state.skMsg = '냉대 기후 지역은 겨울이 길고 몹시 추워 <b>여름에 농사</b>를 짓고, 넓은 <b>침엽수림</b>에서 목재와 펄프를 생산해요.';
  playChime(); skRender();
}

/* ④ 마무리 — 지도서 10차시 주요 내용 정리 */
function skFinish(k){
  if(state.skFin!=null) return;                                        // 가드①
  if(state.skBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=SK_FIN.length) return;          // 가드②
  if(state.skCold==null){ skHold(SK_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===SK_FIN_OK){
    state.skFin=k; state.skWrongF=null; state.skMsg=null; state.skWarn=false;
    playChime(); skRender(); return;
  }
  state.skWrongF=k;
  skHold(SK_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l09_두길로가요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

학습 목표: 한대 기후와 고산 기후 지역의 생활 모습을 설명할 수 있다.
수업 기법 및 전략: 지도 살펴보기 · 탐구하기 · 돌아가며 말하기
META = "1단원 세계의 자연환경 · ② 세계의 기후와 다양한 생활 모습"
⚠️ 엔진은 l08(l07 → … → 6-1 사회 엔진 승계)에서 100% 승계 · 엔진 무수정. 1단원 색 #0369A1.
⚠️ 회수 키 `g6_s2_social_u1_l09_v1`(학기 표지 s2 — l01 선례). 맵 키 `g6_social_u1_l09`.
⚠️ 파일명 `두길로가요` — 조작 이름(선례 승계).

직접조작: 두 길로 가 보는 추운 기후 판 (교과서 41~42쪽 한대 기후의 분포 · 고산 기후의 분포 · 지도서 11차시 핵심 질문)
  ⭐ 판은 위도 네 줄(적도 주변 · 중위도 · 고위도 · 북극 주변) × 땅 두 칸(낮은 땅 · 높은 산지)의 여덟 곳이다. 출발은 **적도 주변의 낮은 땅**.
     움직임 단추 넷(북쪽으로 · 적도 쪽으로 · 산에 오르기 · 산에서 내려오기)이 한 칸씩 옮긴다(`state.apLat`·`state.apAlt` 바뀌는 자리 각 하나).
  ⭐ 그곳의 기후는 `apClimate(lat,alt)` 한 줄 — 높은 산지이면서 북극 주변이 아니면 고산 기후, 아니면 위도의 기후(열대·온대·냉대·한대).
     추위 막대는 `apChill(lat,alt)` 한 줄 = 위도 칸 + 땅 칸 — **북쪽으로 가도, 산 위로 올라도 추워진다**.
  ⭐★ **추운 기후로 가는 길은 둘이다.** 수첩의 두 줄(한대 기후 · 고산 기후)은 **가 본 곳 기록**(`state.apSeen |=` 단 하나 · 덜어 내는 자리 0)에서만 선다(`apWhere`).
     한대 기후는 북극 주변까지 가야만 서고, 고산 기후는 **적도 주변을 떠나지 않고 산에 한 번 오르기만 해도** 선다 — 수첩을 담는 상태도, 정답 자리 상수도 없다.
  ⭐ 가 본 곳만 기후 이름이 보인다(나머지는 「?」). 수첩 줄에는 찾은 곳과 그 기후 지역의 생활이 선다(`AP_LIFE`).
  ⭐ 판 읽기는 수첩 두 줄이 다 선 뒤에만 열린다(정답 자리 1). 이어서 **키토(에콰도르)** 의 생활 3택(정답 자리 0 · 고르면 판의 적도 높은 산지에 키토) → 마무리(정답 자리 2).
  ⭐ 근거 = 교과서 41~43쪽 본문 · 꼭 기억해요 · 지도서 11차시 발문·예시 답안·주요 내용 정리 · 별별 직업 속으로.

단계 — ① 움직이며 두 추운 기후 찾기 → ② 판 읽기 3택(정답 자리 1) → ③ 키토의 생활 3택(정답 자리 0) →
  ④ 마무리 3택 = 지도서 11차시 주요 내용 정리 · 학습 내용 정리(정답 자리 2).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 판 밖으로 나가는 움직임 무시 — 판 불변(안내)
     ④ 수첩 두 줄이 다 서기 전 판 읽기 무시(순서) — 판 불변(안내에 곳 이름 0)
     ⑤ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑥ 판을 읽기 전 키토 무시(순서) — 판 불변
     ⑦ 키토의 생활을 고른 뒤 다시 무시 — 판 불변
     ⑧ 알맞지 않은 키토의 생활 무시 — 판 불변(자리별 안내)
     ⑨ 키토를 고르기 전 마무리 무시(순서) — 판 불변
     ⑩ 안내 표시 중 재클릭 무시(`apBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.ap-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판·추위 막대·풍경은 도식이다** — 실제 분포와 모습은 교과서 지도와 사진으로 본다(캡션 상시).
  ㉡ **추위 막대는 판 안에서 견주는 표시다** — 온도가 아니다 · 한 도시의 모습을 그 기후 전체의 모습으로 여기지 않는다
     (지도서 「전형으로 일반화되지 않도록 주의」 · 캡션·완료 카드 명시).
  ㉢ **기후 그래프의 수치는 쓰지 않는다** — 기후 모습은 말로만.
  ㉣ **친구와 활동 · 스스로 활동(고산 도시 찾기) · 활동지 · 돌아가며 말하기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 기후에 따른 생활 모습 조사(12차시)는 차시 예고 자리까지만.
  **지명은 이 차시 원문이 든 것까지만** — 누크(그린란드) · 키토(에콰도르) · 캐나다 · 아르헨티나 · 페루 · 남극 · 북극 · 장보고 과학 기지.
  교사용 참고 자료의 용어·민족 이름·세부 기후 이름·수치 0 · 스스로 활동 예시 답의 도시 이름 0(학생이 부도에서 찾을 몫) · 네 자리 연도 0 · 쪽수 0 · 누리집 주소 0.

const AP_ALL_MSG = '<b>수첩의 두 줄</b>이 다 채워졌어요. 두 추운 기후는 어디에서 찾았나요?';

/* ★ 곳 번호 · 가 본 곳인지 */
function apCell(lat,alt){ return lat*AP_NA+alt; }
function apSeenOf(st,lat,alt){ return (st.apSeen & (1<<apCell(lat,alt)))!==0; }
function apInside(lat,alt){ return lat>=0 && lat<AP_NL && alt>=0 && alt<AP_NA; }
/* ★ 그곳의 기후 — 한 줄 · 높은 산지이면서 북극 주변이 아니면 고산 기후, 아니면 위도의 기후 */
function apClimate(lat,alt){ return alt===1 && lat<AP_NL-1 ? 4 : lat; }
/* ★ 추위 막대 — 한 줄 · 북쪽으로 가도, 산 위로 올라도 늘어난다 */
function apChill(lat,alt){ return lat+alt; }
/* ★★ 수첩 — 가 본 곳 가운데 그 기후인 첫 곳(없으면 -1) · 수첩을 담는 상태 0 */
function apWhere(st,k){ for(let lat=0;lat<AP_NL;lat++) for(let alt=0;alt<AP_NA;alt++) if(apSeenOf(st,lat,alt) && apClimate(lat,alt)===k) return apCell(lat,alt); return -1; }
function apAll(st){ return AP_COLDK.every(k=>apWhere(st,k)>=0); }

function apMap(st){
  let h = `<span class="lh"></span>${AP_ALT.map(t=>`<span class="lh">${t}</span>`).join('')}`;
  for(let lat=AP_NL-1;lat>=0;lat--){
    h += `<span class="lh">${AP_LAT[lat]}</span>`;
    for(let alt=0;alt<AP_NA;alt++){ const seen = apSeenOf(st,lat,alt), now = lat===st.apLat && alt===st.apAlt, c = apClimate(lat,alt);
      const qt = st.apQuito!=null && lat===AP_QUITO[0] && alt===AP_QUITO[1] ? `<span class="qt" data-quito="1">키토(에콰도르)</span>` : '';
      h += `<div class="ap-cell${seen?' seen':''}${alt===1?' hi':''}${now?' now':''}" data-cell="${apCell(lat,alt)}" data-clim="${seen?c:-1}">${now?'<span class="pin">\uD83D\uDCCD</span>':''}<span class="cn">${seen?AP_CLIM[c]:'?'}</span>${qt}</div>`; }
  }
  return h;
}
function apChillBar(st){
  const n = apChill(st.apLat,st.apAlt);
  return `<div class="ap-chill" data-chill="${n}">\u2744\uFE0F 추위 막대 <span class="ap-bars">${[1,2,3,4].map(v=>`<i class="${v<=n?'on':''}" style="height:${6+v*5}px"></i>`).join('')}</span></div>`;
}
function apNote(st){
  return AP_COLDK.map((k,i)=>{ const w = apWhere(st,k);
    return w<0 ? `<div class="ap-line" data-line="${i}" data-where="-1">${AP_CLIM[k]} \u2014 아직 찾지 못했어요</div>`
      : `<div class="ap-line set" data-line="${i}" data-where="${w}">${AP_CLIM[k]} \u2014 ${AP_LAT[Math.floor(w/AP_NA)]}의 ${AP_ALT[w%AP_NA]}에서 찾았어요 <span class="ap-life" data-life="${i}">${AP_LIFE[i]}</span></div>`; }).join('');
}

function apBoard(st){
  const fin = st.apFin!=null, all = apAll(st);
  const head = fin ? '한대 기후와 고산 기후 지역의 생활 모습을 살펴보았어요'
    : st.apQuito!=null ? '키토까지 살펴보았어요 \u2014 이제 정리해요'
    : st.apRead!=null ? '적도 주변 높은 산지의 도시도 살펴봐요'
    : all ? '수첩이 다 채워졌어요 \u2014 두 기후를 어디에서 찾았는지 봐요'
    : '움직이며 추운 기후를 찾아봐요';
  return `<div class="ap-board" data-lat="${st.apLat}" data-alt="${st.apAlt}" data-seen="${st.apSeen}" data-read="${st.apRead==null?-1:st.apRead}" data-qpick="${st.apQuito==null?-1:st.apQuito}" data-fin="${fin?1:0}">
    <div class="ap-head">${head}</div>
    <div class="ap-map">${apMap(st)}</div>
    ${apChillBar(st)}
    <div class="ap-note">${apNote(st)}</div>
  </div>`;
}

function apPanel(st){
  const fin = st.apFin!=null, all = apAll(st), got = AP_COLDK.filter(k=>apWhere(st,k)>=0).length;
  const q = fin ? '한대 기후와 고산 기후 지역의 생활 모습을 살펴보았어요.'
    : st.apQuito!=null ? '오늘 공부한 내용을 어떻게 정리하면 좋을까요?'
    : st.apRead!=null ? '적도 주변의 높은 산지에 있는 도시 키토(에콰도르)에서는 어떻게 살아갈까요?'
    : all ? '두 추운 기후는 각각 어디에서 찾았나요? 추위 막대는 어떻게 달라졌나요?'
    : got===1 ? '한 기후를 찾았어요. 남은 한 기후는 어느 쪽으로 가면 찾을 수 있을까요?'
    : '적도 주변의 낮은 땅에서 출발해요. 추운 기후는 어디에 있을까요?';
  let right = `<div class="ap-q">${q}</div>`;

  if(fin){
    right += `<div class="dw-card"><div class="pt">\u2744\uFE0F 두 길로 가 보는 추운 기후</div>
      북쪽으로 멀리 가 <b>남극과 북극 주변의 고위도 지역</b>에 닿으면 겨울이 길고 기온이 매우 낮은 <b>한대 기후</b>가 나타났어요.
      북쪽으로 가지 않고 <b>산 위로 오르기만 해도</b> 서늘한 <b>고산 기후</b>가 나타났어요 \u2014 적도 주변이라도 해발 고도가 높으면 일 년 내내 서늘해요.
      한대 기후 지역에서는 사냥과 순록 유목, 오로라와 빙하 관광을 하고, 고산 기후 지역에서는 감자와 옥수수를 재배하고 알파카와 라마를 길러요.<br>
      <span style="color:#64748B">판과 추위 막대는 판 안에서 견주는 <b>도식</b>이에요. 같은 기후 지역이라도 생활 모습은 여러 가지예요 \u2014 한 도시의 모습을 그 기후 전체의 모습으로 여기지 않아요.
      <b>친구와 활동</b>과 <b>고산 도시 찾기</b>, <b>활동지</b>, <b>돌아가며 말하기</b>는 교실에서 직접 해요.</span></div>`;
  } else if(st.apQuito!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="ap-fin">${AP_FIN.map((t,k)=>`<button class="${st.apWrongF===k?'no':''}" onclick="apFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(st.apRead!=null){
    right += `<div class="dw-step">\u26F0\uFE0F 키토(에콰도르)의 생활</div>`;
    right += `<div class="ap-quito">${AP_QT.map((t,k)=>`<button class="${st.apWrongQ===k?'no':''}" onclick="apQuitoPick(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="ap-hint">적도 주변의 일부 고산 기후 지역은 일 년 내내 서늘한 날씨가 이어지며 사람이 많이 모여 살아요. 강한 햇빛과 낮과 밤의 기온 차이를 떠올려 봐요.</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="ap-read">${AP_READ.map((t,k)=>`<button class="${st.apWrongR===k?'no':''}" onclick="apReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83E\uDDED 움직이기 \u2014 지금은 <b>${AP_LAT[st.apLat]}의 ${AP_ALT[st.apAlt]}</b></div>`;
    right += `<div class="ap-moves">${AP_MOVE_T.map((t,k)=>`<button class="ap-go" onclick="apGo(${k})">${t}</button>`).join('')}</div>`;
    right += `<div class="ap-hint">단추를 누를 때마다 한 칸씩 움직여요. 가 본 곳에는 기후 이름이 보여요. 수첩의 줄이 <b>모두 채워질 때까지</b> 움직여 봐요. 감점은 없어요.</div>`;
  }
  if(st.apMsg) right += `<div class="dw-msg${st.apWarn?' warn':''}">${st.apMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\u2744\uFE0F 두 길로 가 보는 추운 기후 판</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${apBoard(st)}<div class="cvcap">판과 추위 막대는 <b>판 안에서</b> 견주는 도식이에요. 온도를 나타낸 것이 아니에요 \u2014 실제 분포는 교과서 지도로 봐요.</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

// 16 정리: 요약 — 지도서 11차시 주요 내용 정리
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('sum','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">\u2460</span><div>한대 기후 \u2014 <b>남극과 북극 주변의 고위도 지역</b> \u00b7 겨울이 길고 기온이 매우 낮음 \u00b7 사냥, 순록 유목, 지하자원 개발, 극지방 기후 환경 연구, 오로라와 빙하 등을 이용한 관광 산업 등</div></div>
    <div class="sum-item"><span class="n">\u2461</span><div>고산 기후 \u2014 <b>해발 고도가 높은 지역</b> \u00b7 일 년 내내 날씨가 서늘함 \u00b7 감자\u00b7옥수수 재배, 알파카와 라마 사육, 챙이 넓고 둥근 모자를 쓰고, 옷을 여러 겹 입고 망토를 두름</div></div>
    <div class="sum-item"><span class="n">\u2605</span><div><b>오늘의 조작</b> \u2014 추운 기후로 가는 길은 둘이었어요. 북쪽으로 멀리 가면 한대 기후, 적도 주변이라도 산 위로 오르면 고산 기후가 나타났어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b>기후에 따른 사람들의 다양한 생활 모습</b>을 조사해 봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">공부한 내용을 되돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"한대 기후와 고산 기후의 특징을 말할 수 있어요",st)}
    ${selfCheck(1,"한대 기후와 고산 기후 지역의 생활 모습을 설명할 수 있어요",st)}
    ${selfCheck(2,"기후와 사람들의 생활 모습 사이의 관계를 탐구할 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">기후에 따른 사람들의 다양한 생활 모습</b>을 조사해 봐요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  apLat:0, apAlt:0, apSeen:1,
  apRead:null, apQuito:null, apFin:null,
  apWrongR:null, apWrongQ:null, apWrongF:null,
  apMsg:null, apWarn:false, apBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function apRender(){ main.innerHTML = slides[state.idx].render(state); }
function apHold(msg){
  state.apWarn=true; state.apBusy=true; state.apMsg=msg;
  playThud(); apRender();
  setTimeout(()=>{ state.apBusy=false; state.apWarn=false; state.apMsg=null;
    state.apWrongR=null; state.apWrongQ=null; state.apWrongF=null; apRender(); },1600);
}

/* ① 움직이기 — 한 칸씩. ★ 가 본 곳 기록은 더하기만 한다. */
function apGo(k){
  if(state.apFin!=null) return;                                        // 가드①
  if(state.apBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=AP_MOVE.length) return;         // 가드②
  const lat = state.apLat + AP_MOVE[k][0], alt = state.apAlt + AP_MOVE[k][1];
  if(!apInside(lat,alt)){ apHold(AP_EDGE); return; }                   // 가드③ 판 밖 — 판 불변
  state.apLat = lat;                                                   // 위도 칸이 바뀌는 자리 단 하나
  state.apAlt = alt;                                                   // 땅 칸이 바뀌는 자리 단 하나
  state.apSeen |= (1<<apCell(lat,alt));                                // ★ 가 본 곳 기록이 느는 자리 단 하나 — 줄지 않음
  state.apWarn=false;
  state.apMsg = apAll(state) ? AP_ALL_MSG : `<b>${AP_LAT[lat]}의 ${AP_ALT[alt]}</b>에 왔어요. 이곳은 <b>${AP_CLIM[apClimate(lat,alt)]}</b>예요.`;
  playBlip(); apRender();
}

/* ② 판 읽기 — 수첩 두 줄이 다 서야 열린다(가드④). */
function apReadPick(k){
  if(state.apFin!=null) return;                                        // 가드①
  if(state.apBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=AP_READ.length) return;         // 가드②
  if(!apAll(state)){ apHold(AP_ORDER_R); return; }                     // 가드④ 순서 — 판 불변
  if(state.apRead!=null){ apHold(AP_READ_AGAIN); return; }             // 가드⑤ 판 불변
  if(k===AP_READ_OK){
    state.apRead=k; state.apWrongR=null; state.apWarn=false;
    state.apMsg = '판을 잘 읽었어요. 북쪽으로 멀리 가도, <b>산 위로 높이</b> 올라도 추위 막대가 늘어났어요 \u2014 추운 기후로 가는 길은 둘이에요.';
    playChime(); apRender(); return;
  }
  state.apWrongR=k;
  apHold(AP_READ_NO[k]);
}

/* ③ 키토(에콰도르)의 생활 — 판을 읽은 뒤에만(가드⑥). */
function apQuitoPick(k){
  if(state.apFin!=null) return;                                        // 가드①
  if(state.apBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=AP_QT.length) return;           // 가드②
  if(state.apRead==null){ apHold(AP_ORDER_Q); return; }                // 가드⑥ 순서 — 판 불변
  if(state.apQuito!=null){ apHold(AP_QT_AGAIN); return; }              // 가드⑦ 판 불변
  if(k!==AP_QT_OK){ state.apWrongQ=k; apHold(AP_QT_NO[k]); return; }   // 가드⑧ 판 불변
  state.apQuito = k;                                                   // ★ 키토가 판에 서는 자리 단 하나
  state.apWarn=false;
  state.apMsg = '키토는 해발 고도가 높아 <b>일 년 내내 서늘</b>해요. 사람들은 <b>감자와 옥수수</b>를 재배하고 <b>알파카와 라마</b>를 기르며 기후에 적응해요.';
  playChime(); apRender();
}

/* ④ 마무리 — 지도서 11차시 주요 내용 정리 */
function apFinish(k){
  if(state.apFin!=null) return;                                        // 가드①
  if(state.apBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=AP_FIN.length) return;          // 가드②
  if(state.apQuito==null){ apHold(AP_ORDER_F); return; }               // 가드⑨ 순서 — 판 불변
  if(k===AP_FIN_OK){
    state.apFin=k; state.apWrongF=null; state.apMsg=null; state.apWarn=false;
    playChime(); apRender(); return;
  }
  state.apWrongF=k;
  apHold(AP_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l10_찾아서꽂아요.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

⚠️ 파일명 `까닭을켜요` — 조작 이름(선례 승계).

직접조작: 까닭을 켜야 이어지는 판
  ⭐ 판에는 산지 하나와 **스위치 셋**(경사 · 땅속 · 경관)이 있다. 스위치로 산지의 모습을 바꾸면
     그 모습에서 할 수 있는 **생활 모습**(계단식 농사 · 가축 기르기 · 광업 · 관광업 — 지도서 활동지 39쪽의 넷)이 켜진다.
  ⭐ **생활은 고르지 않는다** — `lvLife(st)` 한 줄이 스위치 셋에서 켜진 생활을 낸다. 생활 전용 상태 0.
  ⭐ 교과서의 다섯 곳(바나우에 · 파미르고원 · 추키카마타 · 알프스산맥 · 아이슬란드)을 판에 **잇는다.**
     그 곳의 생활 모습이 지금 판에 켜져 있을 때만 이어진다. 켜져 있지 않으면 판 불변 · 안내에 스위치·생활 이름 0 —
     어느 스위치가 까닭인지는 학생이 설명 글을 읽고 찾는다.
  ⭐ **한 모습으로는 다섯 곳을 다 이을 수 없다** — 경사 스위치는 「가파르게 경사진 곳 / 비교적 넓고 평평한 곳」 둘 중
     하나라, 계단식 농사와 가축 기르기가 함께 켜지지 않는다(여덟 모습 전수 — 한 모습에서 이을 수 있는 곳은 많아야 넷).
     근거 = 교과서 본문 원문 「산지의 경사가 가파른 곳에서는 계단식 농사를 짓기도 하고, 비교적 평탄한 곳에서는 가축을 기르기도 합니다」.
  ⭐ **한 스위치가 두 곳을 잇는다** — 경관 스위치 하나로 알프스산맥과 아이슬란드가 함께 이어질 수 있다(관광업).
  ⭐ 스위치는 몇 번이고 바꿀 수 있다(감점 0). 이은 곳은 줄지 않는다(`state.lvDone |=` 단 하나 · 덜어 내는 자리 0).
     정답 스위치·정답 차례 상수 0(`LV_SW_OK`·`LV_ORDER` 부재).

단계 — ① 스위치를 바꾸며 다섯 곳 잇기(순서 자유) → ② 판 읽기 3택(바나우에와 파미르고원을 한 모습으로 함께 잇지 못한 까닭 ·
  정답 자리 1) → ③ 마무리 3택 = 지도서 3차시 주요 내용 정리 ②③ 원문(정답 자리 2).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 9종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 이미 그 모습인 스위치 다시 누르기 무시 — 판 불변
     ④ 이미 이은 곳 다시 잇기 무시 — 판 불변
     ⑤ **생활이 켜지지 않은 곳 잇기 무시 — 판 불변 · 안내에 스위치 이름·생활 이름 0**
     ⑥ 다섯 곳을 다 잇기 전 판 읽기 무시(순서) — 판 불변
     ⑦ 판을 읽은 뒤 판 읽기 다시 무시 — 판 불변
     ⑧ 판을 읽기 전 마무리 무시(순서) — 판 불변
     ⑨ 안내 표시 중 재클릭 무시(`lvBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.lv-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 그림은 도식이지 사진이 아니다** — 실제 모습은 교과서 사진과 영상으로 본다(캡션 상시).
  ㉡ **판은 교과서가 든 관계만 담았다** — 그 조건이 있다고 언제나 그 생활만 하는 것은 아니다(교과서 문면 「~기도 합니다」).
     판의 안내도 「할 수 있는 생활」로만 말한다.
  ㉢ **스위치 셋과 생활 넷은 교과서 본문과 지도서 활동지 문면까지만**이다 — 풀이 잘 자라는 것은 파미르고원 설명 글에서 온 것이다.
  ㉣ **친구와 묻고 답하기 · 네팔 관광청 누리집 살펴보기는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 하천(4차시)·해안(5차시) 지형과 생활 0 · 기후(8차시~) 0.

@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ★★ 켜진 생활 — 이 한 줄에서만 나온다(비트 k = 생활 k). */
function lvLife(st){ return (st.lvSw[0]===0 ? 1 : 2) | (st.lvSw[1] ? 4 : 0) | (st.lvSw[2] ? 8 : 0); }
function lvLifeOn(st,k){ return ((lvLife(st)>>k)&1)===1; }
function lvLifeN(st){ let n=0; for(let k=0;k<LV_LIFE.length;k++) if(lvLifeOn(st,k)) n++; return n; }
/* ★ 곳의 생활 — LV_CASE_LIFE 를 읽는 자리는 여기 하나뿐 */
function lvLifeOf(c){ return LV_CASE_LIFE[c]; }
function lvLinked(st,c){ return ((st.lvDone>>c)&1)===1; }
function lvDoneN(st){ let n=0; for(let c=0;c<LV_N;c++) if(lvLinked(st,c)) n++; return n; }
function lvAll(st){ return lvDoneN(st)===LV_N; }

function lvCanvas(st){
  const fin = st.lvFin!=null, all = lvAll(st), steep = st.lvSw[0]===0;
  const head = fin ? '산지 지형과 생활 모습을 살펴보았어요'

    : all ? '다섯 곳을 모두 이었어요'
    : '스위치로 산지의 모습을 바꾸고 다섯 곳을 이어 봐요';

  /* 산지 — 경사 스위치가 모양을 정한다 */
  const hill = steep

  let draw = '';
  if(lvLifeOn(st,0)) draw += `<g data-draw="0">${[0,1,2,3].map(k=>{ const y=132-k*20, fx=104+(y-40)*78/102;
    return `<rect x="${(fx-30).toFixed(1)}" y="${y}" width="30" height="6" fill="#BBF7D0" stroke="#15803D" stroke-width=".6"/><rect x="${(fx-30).toFixed(1)}" y="${y}" width="30" height="2" fill="#7DD3FC"/>`; }).join('')}</g>`;
  if(lvLifeOn(st,1)) draw += `<g data-draw="1">${[0,1,2].map(k=>`<ellipse cx="${80+k*22}" cy="72" rx="7" ry="4.6" fill="#fff" stroke="#64748B" stroke-width=".8"/>`).join('')}</g>`;
  if(st.lvSw[1]) draw += `<g data-vein="1">${[[40,154],[70,160],[120,152],[160,158]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#B45309"/>`).join('')}</g>`;
  if(lvLifeOn(st,2)) draw += `<g data-draw="2"><path d="M60 142 L60 128 Q70 120 80 128 L80 142 Z" fill="#334155"/></g>`;
  if(lvLifeOn(st,3)) draw += `<g data-draw="3"><path d="M${steep?104:104} ${steep?40:78} L196 ${steep?96:104}" stroke="#334155" stroke-width="1"/><rect x="${steep?148:150}" y="${steep?64:88}" width="12" height="9" rx="2" fill="#F59E0B"/>
    <text x="${steep?118:112}" y="${steep?36:70}" font-size="9" fill="#F59E0B">\u2726</text></g>`;

  /* 조건 줄 — 스위치 셋 */
  const cond = LV_SW.map((t,s)=>`<text x="204" y="${54+s*14}" font-size="6.6" fill="${s===0||st.lvSw[s]?'#075985':'#94A3B8'}" font-weight="800" data-sw="${s}" data-v="${st.lvSw[s]}">${t} \u00b7 ${LV_SWV[s][st.lvSw[s]]}</text>`).join('');

  /* 생활 칸 넷 — 켜짐은 lvLife 에서만 · 이은 곳은 그 생활 칸 아래 */
  let lives='';
  for(let k=0;k<LV_LIFE.length;k++){
    const x = 8+k*77, on = lvLifeOn(st,k);
    const linked = [];
    for(let c=0;c<LV_N;c++) if(lvLinked(st,c) && lvLifeOf(c)===k) linked.push(c);
    lives += `<g data-life="${k}" data-on="${on?1:0}" data-n="${linked.length}">
      <rect x="${x}" y="176" width="73" height="72" rx="8" fill="${on?'#E0F2FE':'#F8FAFC'}" stroke="${on?'#0369A1':'#CBD5E0'}" stroke-width="1.2" ${on?'':'stroke-dasharray="3 2"'}/>
      <text x="${x+36.5}" y="191" font-size="7.2" fill="${on?'#075985':'#94A3B8'}" text-anchor="middle" font-weight="800">${LV_LIFE_S[k]}</text>
      ${linked.map((c,j)=>`<text x="${x+36.5}" y="${207+j*13}" font-size="6.4" fill="#92400E" text-anchor="middle" font-weight="800" data-linked="${c}">${LV_CASE[c]}</text>`).join('')}
    </g>`;
  }
  const tally = `이은 곳 ${lvDoneN(st)} / ${LV_N} \u00b7 지금 켜진 생활 ${lvLifeN(st)}가지`;
  return `<svg viewBox="0 0 320 280" data-life="${lvLife(st)}" data-done="${st.lvDone}" data-sw="${st.lvSw.join('')}" data-all="${all?1:0}" data-read="${st.lvRead==null?-1:st.lvRead}" data-fin="${fin?1:0}">

    <rect x="8" y="30" width="190" height="140" rx="8" fill="#F0F9FF"/>
    <rect x="8" y="142" width="190" height="28" fill="#E7D9A8"/>
    ${hill}
    ${draw}
    <rect x="200" y="30" width="112" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1"/>

    ${cond}
    <text x="256" y="108" font-size="6" fill="#64748B" text-anchor="middle" font-weight="700">켜진 생활은 산지의 모습에서</text>
    <text x="256" y="118" font-size="6" fill="#64748B" text-anchor="middle" font-weight="700">나와요</text>

}

      친구와 <b>묻고 답하기</b>와 네팔 관광청 누리집 살펴보기는 교실에서 직접 해요.</span></div>`;
  } else if(st.lvRead!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="lv-fin">${LV_FIN.map((t,k)=>`<button class="${st.lvWrongF===k?'no':''}" onclick="lvFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(all){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;
    right += `<div class="lv-read">${LV_READ.map((t,k)=>`<button class="${st.lvWrongR===k?'no':''}" onclick="lvReadPick(${k})">${t}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDD27 산지의 모습을 바꿔요</div>`;
    right += `<div class="lv-sw">${LV_SW.map((t,s)=>`<div class="lv-row"><span class="nm">${t}</span>${LV_SWV[s].map((v,j)=>`<button class="${st.lvSw[s]===j?'on':''}" onclick="lvSet(${s},${j})">${v}</button>`).join('')}</div>`).join('')}</div>`;
    right += `<div class="dw-step">\uD83D\uDD17 다섯 곳을 이어요</div>`;
    right += `<div class="lv-case">${LV_CASE.map((t,c)=>`<button class="${lvLinked(st,c)?'done':''}" onclick="lvLink(${c})"><span class="ct">${LV_LAND[c]}</span>${t}</button>`).join('')}</div>`;
    right += `<div class="lv-note">곳을 누르면 그 곳의 생활이 판에 켜져 있을 때 이어져요. <b>어느 곳부터</b> 이어도 좋아요. 스위치는 몇 번이고 바꿔도 되고, 감점은 없어요.</div>`;
  }
  if(st.lvMsg) right += `<div class="dw-msg${st.lvWarn?' warn':''}">${st.lvMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">\u26F0\uFE0F 까닭을 켜야 이어지는 판</b></div>

      <div class="dw-right">${right}</div>

}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  lvSw:[0,0,0], lvDone:0, lvRead:null, lvFin:null,
  lvWrongR:null, lvWrongF:null,
  lvMsg:null, lvWarn:false, lvBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function lvRender(){ main.innerHTML = slides[state.idx].render(state); }
function lvHold(msg){
  state.lvWarn=true; state.lvBusy=true; state.lvMsg=msg;
  playThud(); lvRender();
  setTimeout(()=>{ state.lvBusy=false; state.lvWarn=false; state.lvMsg=null;
    state.lvWrongR=null; state.lvWrongF=null; lvRender(); },1600);
}

/* ① 스위치 — 몇 번이고 바꿀 수 있다(감점 0). 정답 스위치 상수 0. */
function lvSet(s,v){
  if(state.lvFin!=null) return;                                        // 가드①
  if(state.lvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(s) || s<0 || s>=LV_SW.length) return;           // 가드②
  if(!Number.isInteger(v) || v<0 || v>1) return;                       // 가드②
  if(state.lvSw[s]===v){ lvHold(LV_SAME); return; }                    // 가드③ 판 불변
  state.lvSw[s] = v;                                                   // ★ 산지의 모습이 바뀌는 자리는 여기 한 곳뿐
  state.lvWarn=false;
  state.lvMsg = (s===0 ? `산지를 <b>${LV_SWV[0][v]}</b>으로 바꿨어요.` : `<b>${LV_SWV[s][1]}</b> \u2014 ${v?'켰어요':'껐어요'}.`)
    + ` 지금 판에 켜진 생활 모습은 <b>${lvLifeN(state)}가지</b>예요.`;
  playBlip(); lvRender();
}

/* ② 곳 잇기 — ★★ 그 곳의 생활이 판에 켜져 있을 때만. 안내는 까닭을 지목하지 않는다. */
function lvLink(c){
  if(state.lvFin!=null) return;                                        // 가드①
  if(state.lvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(c) || c<0 || c>=LV_N) return;                   // 가드②
  if(lvLinked(state,c)){ lvHold(LV_DUP); return; }                     // 가드④ 판 불변
  if(!lvLifeOn(state,lvLifeOf(c))){ lvHold(LV_OFF); return; }          // 가드⑤ 판 불변 · 까닭 비노출
  state.lvDone |= (1<<c);                                              // ★ 곳이 이어지는 자리는 여기 한 곳뿐 · 덜어 내는 자리 0
  state.lvWarn=false;
  state.lvMsg = lvAll(state) ? LV_ALL_MSG
    : `<b>${LV_CASE[c]}</b>(${LV_LAND[c]}) \u2014 ${LV_DESC[c]} 「${LV_LIFE_S[lvLifeOf(c)]}」에 이었어요.`;
  playBlip(); lvRender();
}

/* ③ 판 읽기 — 다섯 곳을 다 이어야 열린다(가드⑥). */
function lvReadPick(k){
  if(state.lvFin!=null) return;                                        // 가드①
  if(state.lvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=LV_READ.length) return;         // 가드②
  if(!lvAll(state)){ lvHold(LV_ORDER_R); return; }                     // 가드⑥ 순서 — 판 불변
  if(state.lvRead!=null){ lvHold(LV_READ_AGAIN); return; }             // 가드⑦ 판 불변
  if(k===LV_READ_OK){
    state.lvRead=k; state.lvWrongR=null; state.lvWarn=false;
    state.lvMsg = '판을 잘 읽었어요. 산지의 <b>모습</b>에 따라 사람들이 지형을 이용하는 <b>생활 모습</b>이 달라졌어요.';
    playChime(); lvRender(); return;
  }
  state.lvWrongR=k;
  lvHold(LV_READ_NO[k]);
}

/* ④ 마무리 — 지도서 3차시 주요 내용 정리 ②③ 원문 */
function lvFinish(k){
  if(state.lvFin!=null) return;                                        // 가드①
  if(state.lvBusy) return;                                             // 가드⑨
  if(!Number.isInteger(k) || k<0 || k>=LV_FIN.length) return;          // 가드②
  if(state.lvRead==null){ lvHold(LV_ORDER_F); return; }                // 가드⑧ 순서 — 판 불변
  if(k===LV_FIN_OK){
    state.lvFin=k; state.lvWrongF=null; state.lvMsg=null; state.lvWarn=false;
    playChime(); lvRender(); return;
  }
  state.lvWrongF=k;
  lvHold(LV_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g6_social_u1_l03_강이날라요.html'; } // 1단원 3차시(l03) 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

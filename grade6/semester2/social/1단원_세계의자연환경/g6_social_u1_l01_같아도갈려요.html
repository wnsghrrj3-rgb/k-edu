직접조작: 같은 갈래 안에서 특징이 갈리는 판
  ⭐ 일곱 곳(교과서 13~14쪽 ★ 지형)을 먼저 네 갈래(산지·하천·해안·사막)로 나눈다. 다 나누면 판의 칸은 **넷**이다.
     일곱 곳이 네 칸에 들었으니 한 칸에 여럿이 모인 자리가 있다(산지 셋 · 해안 둘).
  ⭐ 그다음 **특징 잣대**(용암이 흐르는 화산인가요? · 위쪽이 평평한가요? · …)를 하나씩 대면,
     같은 갈래 안의 곳들이 특징에 따라 **갈라진다.** 일곱 곳이 모두 제 칸을 가지면(칸 7) 판이 선다.
     근거 = 지도서 주제 일반화 원문 「같은 지형이라도 서로 다른 특징이 나타난다」(p.26)와
     지도서 2차시 발문 예시 답 「산 정상이 뾰족한 곳도 있고 평평한 곳도 있습니다」(p.29).
  ⭐ **칸 수는 저장되지 않는다** — `plCells(st)` 한 줄이 「갈래 + 댄 잣대의 답」 서명의 서로 다른 수를 센다.
     칸 배열·무리 배열·칸 수 상태가 코드에 없다.
  ⭐ **어떤 잣대는 아무것도 가르지 못한다** — 「바닷가에 있나요?」는 해안 둘에게 똑같이 「예」라서
     새 칸이 0이다. 판정도 감점도 없고 판이 「새로 갈린 칸이 없어요」라고만 말한다.
     「위쪽이 평평한가요?」도 울루루와 호라이마산을 함께 「예」로 두어 그 둘은 한 칸에 남는다.
  ⭐ 잣대의 답은 `plHas(f,i)` 한 줄에서만 나온다(`PL_FEAT_ON[` 읽는 자리 단 하나).
     정답 잣대 상수·정답 차례 상수 0(`PL_ASK_OK`·`PL_ORDER` 부재) — 어느 잣대를 어느 차례로 대도 되고,
     일곱 칸에 이르는 잣대 묶음은 여럿이다.
  ⭐ 잣대는 대기만 하고 떼지 않는다(`state.plAsk |=` 단 하나 · 떼는 자리 0) → 칸 수는 줄지 않는다(단조).

단계 — ① 일곱 곳을 네 갈래로 나누기(곳 고르고 갈래 누르기 · 순서 자유 · 어긋나면 판 불변)
  → ② 특징 잣대 대기(다 나눠야 열린다 · 칸 7이 되면 닫힌다)
  → ③ 판 읽기 3택(같은 산지인데 왜 한 칸에 남지 않았을까요? · 정답 자리 2)
  → ④ 마무리 3택 = 지도서 2차시 주요 내용 정리 ①② 원문(정답 자리 1).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 10종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 이미 나눈 곳 다시 고르기 무시 — 판 불변
     ④ 곳을 고르기 전 갈래 누르기 무시 — 판 불변
     ⑤ 어긋난 갈래 무시 — 판 불변 · 안내에 알맞은 갈래 이름 0
     ⑥ **다 나누기 전 잣대 대기 무시 — 판 불변**(순서)
     ⑦ 이미 댄 잣대 · 이미 일곱 칸이 된 뒤의 잣대 무시 — 판 불변
     ⑧ 일곱 칸 전 판 읽기 무시(순서) — 판 불변
     ⑨ 판을 읽기 전 마무리 무시(순서) — 판 불변
     ⑩ 안내 표시 중 재클릭 무시(`plBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.pl-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **판의 그림은 도식이지 사진이 아니다** — 지형의 실제 모습은 교과서 사진과 디지털 영상 지도로 본다(캡션 상시).
  ㉡ **갈래(산지·하천·해안·사막)는 교과서 본문의 네 낱말로 판이 나눈 것**이다 — 교과서는 일곱 곳에 갈래 이름표를
     붙이지 않았다. 울루루(바위산)·호라이마산을 산지로, 송네 피오르(해안선)·엘 아르코(바다 위 바위)를 해안으로
     둔 것은 교과서 설명 글의 낱말을 따른 것이다(캡션).
  ㉢ **잣대의 답은 교과서 설명 글과 지도서 예시 답 문면까지만**이다 — 「위쪽이 평평」은 호라이마산(교과서)과
     울루루(지도서 예시 답 「위쪽이 평평해 보입니다」)에만 둔다.
  ㉣ **디지털 영상 지도로 지형을 살펴보고 기념 배지를 그리는 일은 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 산지·하천·해안 사람들의 생활 모습 사례(3~5차시) 0 · 관광 산업 0 · 기후 0.
    「생활 모습」은 꼭 기억해요 ② 원문과 차시 예고 자리까지만.
  **지명은 이 차시 원문이 든 것까지만** — 일곱 곳 + 로키산맥·베나길 동굴(생각을 열어요) + 그 나라 이름.
  교사용 참고 자료의 수치(길이·깊이·높이·넓이·연도) 0 · 네 자리 연도 0 · 쪽수 0 · 비율 0.
  정서 — 어느 지형도 더 좋거나 나쁘게 그리지 않는다 · 사람 형상 0 · 유명인 0.

.pl-kind button:hover{background:var(--bub)}
.pl-ask{display:flex;flex-direction:column;gap:4px}
.pl-ask button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:6px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.4}
.pl-ask button:hover{background:var(--bub)}
.pl-ask button.used{border-color:#CBD5E0;background:#F1F5F9;color:#94A3B8}
.pl-read{display:flex;flex-direction:column;gap:5px}
.pl-read button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.pl-read button:hover{background:var(--bub)}
.pl-read button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pl-fin{display:flex;flex-direction:column;gap:5px}
.pl-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.pl-fin button:hover{background:var(--bub)}
.pl-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pl-note{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

function plKindOf(i){ return PL_KIND[i]; }
/* ★★ 잣대의 답 — 이 한 줄에서만 나온다. */
function plHas(f,i){ return (PL_FEAT_ON[f]>>i)&1; }
function plPutN(st){ let n=0; for(let i=0;i<PL_N;i++) if(st.plPut[i]>=0) n++; return n; }
function plAllPut(st){ return plPutN(st)===PL_N; }
function plAsked(st,f){ return ((st.plAsk>>f)&1)===1; }
/* ★★ 서명 — 갈래 + 댄 잣대의 답. 칸은 서로 다른 서명의 수다. */
function plSig(st,i){ let s=String(st.plPut[i]); for(let f=0;f<PL_F;f++) s += plAsked(st,f) ? plHas(f,i) : '-'; return s; }
function plCells(st){ const s=new Set(); for(let i=0;i<PL_N;i++) s.add(plSig(st,i)); return s.size; }
function plDone(st){ return plAllPut(st) && plCells(st)===PL_N; }
function plAskN(st){ let n=0; for(let f=0;f<PL_F;f++) if(plAsked(st,f)) n++; return n; }

function plCanvas(st){
  const fin = st.plFin!=null, all = plAllPut(st), done = plDone(st), cells = all ? plCells(st) : 0;
  const head = fin ? '일곱 곳의 지형 경관을 살펴보았어요'
    : st.plRead!=null ? '판을 읽었어요 \u2014 이제 정리해요'
    : done ? '일곱 곳이 모두 제 칸을 가졌어요'
    : all ? '다 나눴어요 \u2014 그런데 한 칸에 여럿이 모인 자리가 있어요'
    : '일곱 곳을 네 갈래로 나눠 봐요';

  /* 나누기 전 자리 — 나눈 곳은 빈 자리로 남는다 */
  let tray='';
  for(let i=0;i<PL_N;i++){
    const x = 7+i*44, put = st.plPut[i]>=0, sel = st.plSel===i;
    tray += `<g data-chip="${i}" data-put="${put?1:0}" data-sel="${sel?1:0}">
      <rect x="${x}" y="32" width="42" height="24" rx="6" fill="${put?'#F8FAFC':sel?'#FFF8E1':'#fff'}" stroke="${put?'#CBD5E0':sel?'#B45309':'#0284C7'}" stroke-width="1.2" ${put?'stroke-dasharray="3 2"':''}/>

    </g>`;
  }

  /* 네 갈래 칸 — 같은 서명끼리 한 상자에 모인다(상자 배열·칸 상태 0) */
  let cols='';
  for(let c=0;c<PL_KD.length;c++){
    const x = 8+c*77;
    const groups = [];
    for(let i=0;i<PL_N;i++){
      if(st.plPut[i]!==c) continue;
      const sg = plSig(st,i), g = groups.find(q=>q.sig===sg);
      if(g) g.m.push(i); else groups.push({sig:sg,m:[i]});
    }
    let y = 90, boxes='';
    groups.forEach(g=>{
      const h = 10 + g.m.length*13, many = g.m.length>1;
      boxes += `<g data-group="${g.m.join('-')}" data-kind="${c}" data-n="${g.m.length}">
        <rect x="${x+3}" y="${y}" width="67" height="${h}" rx="6" fill="${many?'#FFF8E1':'#E0F2FE'}" stroke="${many?'#B45309':'#0369A1'}" stroke-width="1.2"/>
        ${g.m.map((i,k)=>`<text x="${x+36.5}" y="${y+14+k*13}" font-size="5.8" fill="${many?'#92400E':'#075985'}" text-anchor="middle" font-weight="800" data-in="${i}">${PL_NAME[i]}</text>`).join('')}
      </g>`;
      y += h + 5;
    });
    cols += `<g data-col="${c}" data-groups="${groups.length}">
      <rect x="${x}" y="66" width="73" height="160" rx="8" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1"/>
      <text x="${x+36.5}" y="80" font-size="7.4" fill="#075985" text-anchor="middle" font-weight="800">${PL_KD[c]}</text>

function plPanel(st){

  } else if(st.plRead!=null){
    right += `<div class="dw-step">\uD83D\uDCDA 오늘의 정리</div>`;
    right += `<div class="pl-fin">${PL_FIN.map((t,k)=>`<button class="${st.plWrongF===k?'no':''}" onclick="plFinish(${k})">${t}</button>`).join('')}</div>`;
  } else if(done){
    right += `<div class="dw-step">\uD83D\uDD0E 판을 읽어요</div>`;

  } else if(all){
    right += `<div class="dw-step">\uD83D\uDCCF 특징 잣대를 대요</div>`;
    right += `<div class="pl-ask">${PL_FEAT.map((t,f)=>`<button class="${plAsked(st,f)?'used':''}" onclick="plQuery(${f})">${t}</button>`).join('')}</div>`;
    right += `<div class="pl-note">잣대는 <b>어느 것부터</b> 대도 좋아요. 대기만 하고 떼지는 않아요. 감점은 없어요.</div>`;
  } else {
    right += `<div class="dw-step">\uD83D\uDDC2\uFE0F 갈래로 나눠요</div>`;
    right += `<div class="pl-pad">${PL_NAME.map((t,i)=>`<button class="${st.plPut[i]>=0?'put':st.plSel===i?'sel':''}" onclick="plPick(${i})"><span class="ct">${PL_LAND[i]}</span>${t}</button>`).join('')}</div>`;
    right += `<div class="pl-kind">${PL_KD.map((t,k)=>`<button onclick="plSort(${k})">${t}</button>`).join('')}</div>`;

  }

  return `<div class="dw-wrap">

    <div class="dw-body">

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  plPut:[-1,-1,-1,-1,-1,-1,-1], plSel:-1, plAsk:0, plRead:null, plFin:null,
  plWrongR:null, plWrongF:null,
  plMsg:null, plWarn:false, plBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function plRender(){ main.innerHTML = slides[state.idx].render(state); }
function plHold(msg){
  state.plWarn=true; state.plBusy=true; state.plMsg=msg;
  playThud(); plRender();
  setTimeout(()=>{ state.plBusy=false; state.plWarn=false; state.plMsg=null;
    state.plWrongR=null; state.plWrongF=null; plRender(); },1600);
}

/* ① 곳 고르기 — 어느 곳부터 골라도 된다(순서 자유). */
function plPick(i){
  if(state.plFin!=null) return;                                        // 가드①
  if(state.plBusy) return;                                             // 가드⑩
  if(!Number.isInteger(i) || i<0 || i>=PL_N) return;                   // 가드②
  if(state.plPut[i]>=0){ plHold(PL_DUP); return; }                     // 가드③ 판 불변
  state.plSel = i;
  state.plWarn=false;
  state.plMsg = `<b>${PL_NAME[i]}</b>(${PL_LAND[i]}) \u2014 ${PL_DESC[i]} 어느 갈래에 들까요?`;
  playBlip(); plRender();
}

/* ② 갈래에 넣기 — 어긋나면 판 불변 · 안내에 갈래 이름 0 */
function plSort(k){
  if(state.plFin!=null) return;                                        // 가드①
  if(state.plBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=PL_KD.length) return;           // 가드②
  if(state.plSel<0){ plHold(PL_NOSEL); return; }                       // 가드④ 판 불변
  if(plKindOf(state.plSel)!==k){ plHold(PL_NOTK); return; }            // 가드⑤ 판 불변
  const i = state.plSel;
  state.plPut[i] = k;                                                  // ★ 곳이 갈래에 드는 자리는 여기 한 곳뿐
  state.plSel = -1;
  state.plWarn=false;
  state.plMsg = plAllPut(state) ? PL_PUTALL_MSG : `<b>${PL_NAME[i]}</b>을(를) <b>${PL_KD[k]}</b> 갈래에 넣었어요.`;
  playBlip(); plRender();
}

/* ③ 특징 잣대 대기 — ★★ 이 판의 핵심. 정답 잣대·차례 상수 0. 대기만 하고 떼지 않는다. */
function plQuery(f){
  if(state.plFin!=null) return;                                        // 가드①
  if(state.plBusy) return;                                             // 가드⑩
  if(!Number.isInteger(f) || f<0 || f>=PL_F) return;                   // 가드②
  if(!plAllPut(state)){ plHold(PL_ORDER_ASK); return; }                // 가드⑥ 순서 — 판 불변
  if(plDone(state)){ plHold(PL_ALLSPLIT); return; }                    // 가드⑦ 판 불변
  if(plAsked(state,f)){ plHold(PL_ASKED); return; }                    // 가드⑦ 판 불변
  const before = plCells(state);
  state.plAsk |= (1<<f);                                               // ★ 잣대가 대지는 자리는 여기 한 곳뿐
  const after = plCells(state);
  state.plWarn=false;
  state.plMsg = plDone(state) ? PL_SPLITALL_MSG
    : after===before ? PL_NOSPLIT
    : `「${PL_FEAT[f]}」 \u2014 칸이 <b>${before}개에서 ${after}개</b>로 늘었어요. 아직 한 칸에 여럿이 모인 자리가 있어요.`;
  playBlip(); plRender();
}

/* ④ 판 읽기 — 일곱 칸이 되어야 열린다(가드⑧). */
function plReadPick(k){
  if(state.plFin!=null) return;                                        // 가드①
  if(state.plBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=PL_READ.length) return;         // 가드②
  if(!plDone(state)){ plHold(PL_ORDER_R); return; }                    // 가드⑧ 순서 — 판 불변
  if(state.plRead!=null){ plHold(PL_READ_AGAIN); return; }             // 판 불변
  if(k===PL_READ_OK){
    state.plRead=k; state.plWrongR=null; state.plWarn=false;
    state.plMsg = '판을 잘 읽었어요. 같은 갈래에 모였던 곳들도 <b>특징</b>을 살펴보면 서로 달랐어요.';
    playChime(); plRender(); return;
  }
  state.plWrongR=k;
  plHold(PL_READ_NO[k]);
}

/* ⑤ 마무리 — 지도서 2차시 주요 내용 정리 ①② 원문 */
function plFinish(k){
  if(state.plFin!=null) return;                                        // 가드①
  if(state.plBusy) return;                                             // 가드⑩
  if(!Number.isInteger(k) || k<0 || k>=PL_FIN.length) return;          // 가드②
  if(state.plRead==null){ plHold(PL_ORDER_F); return; }                // 가드⑨ 순서 — 판 불변
  if(k===PL_FIN_OK){
    state.plFin=k; state.plWrongF=null; state.plMsg=null; state.plWarn=false;
    playChime(); plRender(); return;
  }
  state.plWrongF=k;
  plHold(PL_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 1단원 2차시(l02) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();
</script>

직접조작: 기능을 끼워 세우는 판매 계획서 판 (교과서 48~49쪽 생각을 펼쳐요 · 지도서 13차시 발문·예시 답안)
  ⭐ 판은 판매 계획서다 — 판매할 곳 · 특징(지형이나 기후) · 판매 동기 · 상품 종류 · 상품 특징 세 칸.
     판매할 곳 넷(브라질 · 노르웨이 · 네팔 히말라야산맥 · 콩고강)은 **교과서·지도서 예시 그대로**다. 특징·판매 동기·상품 종류는 곳을 고르면 그 곳의 글이 채워진다.
  ⭐ 기능 카드 여덟을 상품 특징 세 칸에 끼우고 뺀다. 카드마다 맞서는 자연환경이 하나 있다(해충 · 눈과 얼음 · 추위 · 빠른 물살 · 가파른 산길),
     **어디서나 쓰는 편의 기능은 둘뿐**(태양열 자동 충전 · 목에 걸어 휴대 — 지도서 예시 답안).
  ⭐ 칸마다 「이 곳에 맞아요 / 맞지 않아요」는 `spFits(p,k)` 한 줄에서만 정해진다(`SP_PLACE[p].need` 를 읽는 자리 단 하나) — 칸마다 맞음 상태 0.
     곳을 바꾸면 끼운 카드는 그대로 두고 맞음만 다시 읽힌다.
  ⭐ 계획서가 선다 = 곳을 골랐고 세 칸이 차고 세 칸 모두 맞음(`spReady`). **편의 카드가 둘뿐이라 선 계획서에는 언제나 그 곳의 자연환경에 맞춘 기능이 하나 이상 들어 있다.**
  ⭐★ 계획서가 선 곳 기록은 `state.spMade |=` 단 하나(`spMark` 안 · 줄지 않음). 수첩 두 줄은 이 기록에서만 선다 — ① 한 곳의 계획서 ② 두 곳의 계획서.
     추위에 맞춘 열선은 노르웨이와 네팔 두 곳에 다 맞는다 — 곳이 바뀌어도 같은 특징이 있으면 같은 기능이 쓰인다.
  ⭐ 판 읽기는 수첩 두 줄이 다 선 뒤에만(정답 자리 1). 이어서 브라질 예시 계획서의 판매 동기 3택(정답 자리 2) → 마무리(정답 자리 0).
  ⭐ 근거 = 교과서 48~49쪽 · 지도서 13차시 학습 안내·동기 유발·발문·예시 답안·지도 방법(실현 가능성) · 앞 차시 본문(l02 가파른 산지 · l03 콩고강 · l07~l09 기후).

단계 — ① 곳 고르고 기능 끼우기 → ② 판 읽기 3택(정답 자리 1) → ③ 브라질 판매 동기 3택(정답 자리 2) →
  ④ 마무리 3택 = 지도서 13차시 지도 방법(정답 자리 0).

⚠️ 전량 고정 리터럴 — 난수 0.
⚠️ 가드 12종:
     ① 마무리 확정 후 전체 잠금
     ② 무효 번호(`Number.isInteger`·범위) — 안내조차 띄우지 않음
     ③ 곳을 고르기 전 끼우기 무시 — 판 불변(안내)
     ④ 이미 끼운 카드 다시 무시 — 판 불변
     ⑤ 세 칸이 다 찼을 때 끼우기 무시 — 판 불변
     ⑥ 빈 칸 빼기 무시 — 판 불변
     ⑦ 지금 고른 곳 다시 무시 — 판 불변
     ⑧ 수첩 두 줄이 다 선 뒤 계획서 고치기 무시(곳·끼우기·빼기) — 판 불변
     ⑨ 수첩이 다 서기 전 판 읽기 무시 · 읽은 뒤 다시 무시(안내에 곳·카드 이름 0)
     ⑩ 판을 읽기 전 판매 동기 무시 · 고른 뒤 다시 무시 · 알맞지 않은 판매 동기 무시(자리별 안내)
     ⑪ 판매 동기를 고르기 전 마무리 무시(순서)
     ⑫ 안내 표시 중 재클릭 무시(`spBusy`).
   재시도 허용(감점 없음), 조작에 점수 0. 발문은 `.sp-q`로 떼어 전 단계 상시 노출.

⚠️ 정직 원칙 네 곳
  ㉠ **계획서·카드는 도식이다** — 실제 계획서는 교과서 활동지에 쓴다(캡션 상시).
  ㉡ **카드는 교과서·지도서 예시와 그 뜻을 살린 예까지다** — 실제 상품 아이디어는 훨씬 여러 가지이고 정답이 하나가 아니다(캡션·완료 카드 명시).
  ㉢ **누리집 주소 · 상품 가격 · 회사 이름은 쓰지 않는다**.
  ㉣ **관심 있는 나라 고르기 · 인터넷 조사 · 친구들과 아이디어 이야기하기 · 글과 그림으로 나타내기(색칠 도구)는 교실 몫**이다(완료 카드 명시).

⚠️ 설계 원칙
  **뒤 차시 침범 0** — 단원 마무리(생각 그물 · 교실 놀이)는 차시 예고 자리까지만.

  사람 형상 0 · 네 자리 연도 0 · 쪽수 0 · 누리집 주소 0 · 가격 0 · 어느 곳도 더 낫거나 못하게 그리지 않는다.

.sp-line.set{border-style:solid;border-color:#059669;background:#ECFDF5;color:#065F46}
.sp-places{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sp-place{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:6px 4px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.4px,1.78vw,12.8px)}
.sp-place.now{background:#E0F2FE;border-color:var(--green)}
.sp-cards{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sp-card{border:2px solid var(--amber);background:#FFFBEB;color:#92400E;border-radius:10px;padding:5px 6px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(9.6px,1.62vw,11.6px);text-align:left;line-height:1.35}
.sp-card:hover{background:var(--bub)}
.sp-card.done{border-color:#CBD5E0;background:#F1F5F9;color:#64748B}
.sp-read,.sp-fin,.sp-ex{display:flex;flex-direction:column;gap:5px}
.sp-read button,.sp-fin button,.sp-ex button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;
  padding:7px 10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.45}
.sp-read button:hover,.sp-fin button:hover,.sp-ex button:hover{background:var(--bub)}
.sp-read button.no,.sp-fin button.no,.sp-ex button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.sp-hint{background:#F8FAFC;border:2px dashed #CBD5E0;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.4px,1.76vw,12.4px);line-height:1.5;color:#64748B}
@media(max-width:420px){ .sp-plan{font-size:9px} .sp-cards,.sp-places{gap:3px} .sp-card{padding:4px 4px} }
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(3,105,161,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

    <rect x="20" y="8" width="280" height="132" rx="9" fill="#fff" stroke="#0369A1" stroke-width="1.4"/>

/* ===== 직접조작 — 기능을 끼워 세우는 판매 계획서 판 =====

const SP_NS = 3;
/* 맞서는 자연환경 다섯 */

/* ★ 맞음 — SP_PLACE[p].need 를 읽는 자리 단 하나 · 편의 기능은 어디서나 */
function spFits(p,k){ return SP_PART[k].need<0 || SP_PLACE[p].need.indexOf(SP_PART[k].need)>=0; }
function spIn(st,k){ return st.spSlot.indexOf(k)>=0; }
function spFull(st){ return st.spSlot.every(k=>k>=0); }
/* ★ 계획서가 선다 — 곳 · 세 칸 · 세 칸 모두 맞음 */
function spReady(st){ return st.spAt>=0 && spFull(st) && st.spSlot.every(k=>spFits(st.spAt,k)); }
/* 그 곳의 자연환경에 맞춘 기능 수(편의 기능 제외) */
function spNeedN(st){ return st.spAt<0 ? 0 : st.spSlot.filter(k=>k>=0 && SP_PART[k].need>=0 && spFits(st.spAt,k)).length; }

function spMadeOf(st){ const r=[]; for(let p=0;p<SP_PLACE.length;p++) if(st.spMade & (1<<p)) r.push(p); return r; }
function spAll(st){ return spMadeOf(st).length>=SP_MANY; }

function spSheet(st){
  const p = st.spAt, P = p>=0 ? SP_PLACE[p] : null, lock = spAll(st) || st.spFin!=null;

    + row('판매 동기', P?P.why:null) + row('상품 종류', P?P.kind:null);
  let s = '';
  for(let i=0;i<SP_NS;i++){ const k = st.spSlot[i];
    if(k<0){ s += `<div class="sp-slot" data-slot="${i}" data-part="-1"><span class="tx">빈 칸</span></div>`; continue; }
    const f = p>=0 && spFits(p,k);
    s += `<div class="sp-slot ${p<0?'':(f?'fit':'miss')}" data-slot="${i}" data-part="${k}" data-fit="${p<0?-1:(f?1:0)}"><span class="tx">${SP_PART[k].t}</span>`
      + (p<0?'':`<span class="bd">${f?'\u2714 이 곳에 맞아요':'\u2716 이 곳과 맞지 않아요'}</span>`)
      + (lock?'':`<button onclick="spOut(${i})">빼기</button>`) + `</div>`; }
  return `<div class="sp-plan">${h}<div class="k">상품 특징</div><div class="sp-slots">${s}</div></div>`;
}
function spNote(st){
  const m = spMadeOf(st), n = m.length, names = m.map(p=>SP_PLACE[p].name).join(' \u00b7 ');

    : `<div class="sp-line" data-line="0" data-made="0">판매 계획서가 선 곳 \u2014 아직 없어요</div>`;

    : `<div class="sp-line" data-line="1" data-made="${n}">계획서가 선 곳 ${n} / ${SP_MANY}</div>`;
  return l0+l1;
}

function spBoard(st){
  const fin = st.spFin!=null, all = spAll(st), rd = spReady(st);
  const head = fin ? '자연환경을 고려한 상품 판매 계획을 세워 보았어요'

      \u2014 특징: 목에 걸 수 있어 휴대하기 편리해요. 태양열을 사용하여 자동 충전돼요. 인체에 무해한 초음파를 발생시켜 해충이 가까이 오지 못하게 해요.</div>`
      :`<div class="note">상품의 어느 부분이 자연환경의 특징을 담고 있나요?</div><button class="reveal-btn" onclick="reveal()">예시 보기</button>`}
    <div class="tipbox">아이디어를 <b>실제로 만들 수 있을지(실현 가능성)</b>도 생각하며 상품을 기획해요. 실제 그림은 교실에서 색칠 도구로 그려요.</div></div>`});
// 7 살펴보기 — 직접조작(기능을 끼워 세우는 판매 계획서 판)
slides.push({stage:2,badge:"개념",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">기능을 끼워 판매 계획서를 세워 봐요</h2>
  ${spPanel(st)}`});
// 8~15 문항
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약 — 지도서 13차시 학습 안내 · 지도 방법
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 공부한 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('sum','오늘의 정리','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">\u2460</span><div>판매 계획 세우기 \u2014 <b>나라 정하기</b> \u2192 <b>지형과 기후 조사하기</b> \u2192 <b>아이디어 이야기하기</b> \u2192 <b>판매 계획 세우기</b> \u2192 <b>글과 그림으로 나타내기</b></div></div>
    <div class="sum-item"><span class="n">\u2461</span><div>지형과 기후 등 <b>자연환경의 특징</b>을 분석하고, 이를 바탕으로 그 곳 사람들에게 필요한 상품을 구상해요. 아이디어의 <b>실현 가능성</b>도 생각해요.</div></div>
    <div class="sum-item"><span class="n">\u2605</span><div><b>오늘의 조작</b> \u2014 계획서는 그 곳의 지형이나 기후에 맞춘 기능이 들어갈 때 섰어요. 곳이 바뀌면 맞는 기능도 바뀌었어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b>‘세계의 자연환경’에서 공부한 내용을 정리</b>해요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">공부한 내용을 되돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"판매할 나라의 지형과 기후 특징을 조사할 수 있어요",st)}
    ${selfCheck(1,"자연환경의 특징을 바탕으로 필요한 상품 아이디어를 구상할 수 있어요",st)}
    ${selfCheck(2,"구상한 아이디어를 글과 그림으로 나타낼 수 있어요",st)}
  </div><div class="note">별이 적게 채워진 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="scene-row">${sceneCard('done','','wide')}</div>
    <div class="end-score">⭐ ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음 시간에는 <b style="color:var(--amber)">1단원에서 공부한 내용을 정리</b>해요!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">\u2B55 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">\uD83D\uDCA1 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g6_2_social_u1_l11";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  spAt:-1, spSlot:[-1,-1,-1], spMade:0,
  spRead:null, spEx:null, spFin:null,
  spWrongR:null, spWrongE:null, spWrongF:null,
  spMsg:null, spWarn:false, spBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 \u2192';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }



function spRender(){ main.innerHTML = slides[state.idx].render(state); }
function spHold(msg){
  state.spWarn=true; state.spBusy=true; state.spMsg=msg;
  playThud(); spRender();
  setTimeout(()=>{ state.spBusy=false; state.spWarn=false; state.spMsg=null;
    state.spWrongR=null; state.spWrongE=null; state.spWrongF=null; spRender(); },1600);
}
/* ★ 계획서가 선 곳 기록 — 더하기만 한다(자리 단 하나). */
function spMark(){ if(spReady(state)) state.spMade |= (1<<state.spAt); }
function spSaid(base){
  if(spAll(state)) return SP_ALL_MSG;
  if(spReady(state)) return `<b>${SP_PLACE[state.spAt].name}</b>의 판매 계획서가 섰어요! 세 칸 모두 이 곳에 맞아요.`;
  return base;
}

/* ① 판매할 곳 고르기 — 끼운 기능은 그대로 둔다. */
function spGo(p){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑫
  if(!Number.isInteger(p) || p<0 || p>=SP_PLACE.length) return;        // 가드②
  if(spAll(state)){ spHold(SP_LOCK); return; }                         // 가드⑧ 판 불변
  if(state.spAt===p){ spHold(SP_SAME); return; }                       // 가드⑦ 판 불변
  state.spAt = p;                                                      // ★ 곳이 바뀌는 자리 단 하나
  spMark(); state.spWarn=false;
  state.spMsg = spSaid(`판매할 곳 \u2014 <b>${SP_PLACE[p].name}</b>. 끼운 기능이 이 곳에 맞는지 봐요.`);
  playBlip(); spRender();
}

/* ① 기능 끼우기 — 앞의 빈 칸부터. */
function spPut(k){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=SP_PART.length) return;         // 가드②
  if(spAll(state)){ spHold(SP_LOCK); return; }                         // 가드⑧ 판 불변
  if(state.spAt<0){ spHold(SP_NOPLACE); return; }                      // 가드③ 판 불변
  if(spIn(state,k)){ spHold(SP_DUP); return; }                         // 가드④ 판 불변
  if(spFull(state)){ spHold(SP_FULL); return; }                        // 가드⑤ 판 불변
  state.spSlot[state.spSlot.indexOf(-1)] = k;                          // ★ 칸이 차는 자리 단 하나
  spMark(); state.spWarn=false;
  state.spMsg = spSaid(`「${SP_PART[k].t}」 \u2014 ${spFits(state.spAt,k)?'이 곳에 맞아요':'이 곳과는 맞지 않아요'}.`);
  playBlip(); spRender();
}

/* ① 기능 빼기 */
function spOut(i){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑫
  if(!Number.isInteger(i) || i<0 || i>=SP_NS) return;                  // 가드②
  if(spAll(state)){ spHold(SP_LOCK); return; }                         // 가드⑧ 판 불변
  if(state.spSlot[i]<0){ spHold(SP_EMPTY); return; }                   // 가드⑥ 판 불변
  state.spSlot[i] = -1;                                                // ★ 칸이 비는 자리 단 하나
  state.spWarn=false; state.spMsg = '한 칸을 뺐어요. 다른 기능을 끼워 봐요.';
  playBlip(); spRender();
}

/* ② 판 읽기 — 수첩 두 줄이 다 서야 열린다(가드⑨). */
function spReadPick(k){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=SP_READ.length) return;         // 가드②
  if(!spAll(state)){ spHold(SP_ORDER_R); return; }                     // 가드⑨ 순서 — 판 불변
  if(state.spRead!=null){ spHold(SP_READ_AGAIN); return; }             // 가드⑨ 판 불변
  if(k===SP_READ_OK){
    state.spRead=k; state.spWrongR=null; state.spWarn=false;
    state.spMsg = '판을 잘 읽었어요. 편의 기능 카드는 <b>둘뿐</b>이라 계획서에는 언제나 그 곳의 <b>자연환경에 맞춘 기능</b>이 들어갔어요.';
    playChime(); spRender(); return;
  }
  state.spWrongR=k;
  spHold(SP_READ_NO[k]);
}

/* ③ 브라질 예시 계획서의 판매 동기 — 판을 읽은 뒤에만(가드⑩). */
function spExPick(k){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=SP_EX.length) return;           // 가드②
  if(state.spRead==null){ spHold(SP_ORDER_E); return; }                // 가드⑩ 순서 — 판 불변
  if(state.spEx!=null){ spHold(SP_EX_AGAIN); return; }                 // 가드⑩ 판 불변
  if(k!==SP_EX_OK){ state.spWrongE=k; spHold(SP_EX_NO[k]); return; }   // 가드⑩ 판 불변
  state.spEx = k;                                                      // ★ 판매 동기를 고르는 자리 단 하나
  state.spWarn=false;
  state.spMsg = '해충이 많은 <b>열대 우림</b> \u2014 기후의 특징이 판매 동기가 되고, 초음파 기능이 그 동기에 답해요.';
  playChime(); spRender();
}

/* ④ 마무리 — 지도서 13차시 지도 방법 */
function spFinish(k){
  if(state.spFin!=null) return;                                        // 가드①
  if(state.spBusy) return;                                             // 가드⑫
  if(!Number.isInteger(k) || k<0 || k>=SP_FIN.length) return;          // 가드②
  if(state.spEx==null){ spHold(SP_ORDER_F); return; }                  // 가드⑪ 순서 — 판 불변
  if(k===SP_FIN_OK){
    state.spFin=k; state.spWrongF=null; state.spMsg=null; state.spWarn=false;
    playChime(); spRender(); return;
  }
  state.spWrongF=k;
  spHold(SP_FIN_NO[k]);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true;
    let gained=q.pts;
    if(qs.hint===1) gained-=2;
    if(qs.hint>=2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">\uD83D\uDCD8 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 \u2192</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 1단원 12차시(l12) 미양산 — 양산 시 재배선
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}


render();

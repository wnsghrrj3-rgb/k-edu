<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>케이탐정 사무소</title>
<meta name="kedu-tier" content="class">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--bg:#1c1712;--wood:#2a211a;--paper:#f3e9d2;--paper2:#e8dcc0;--ink:#2b2118;--ink2:#6b5a45;--line:#c9b895;--red:#b23a2f;--gold:#e0a63a;--teal:#2f8f83;--title:'Hakgyoansim Moheomga','Jua',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;min-height:100vh;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 2px,transparent 2px 9px)}
main{max-width:920px;margin:0 auto;padding:0 20px 70px}
.gate{text-align:center;padding-top:clamp(44px,8vh,80px)}
.sign{display:inline-block;background:var(--wood);border:3px solid var(--gold);border-radius:10px;padding:22px 40px 18px;
  box-shadow:0 0 0 5px var(--wood),0 16px 40px rgba(0,0,0,.6);position:relative}
.sign:before,.sign:after{content:'';position:absolute;top:-16px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.sign:before{left:22px}.sign:after{right:22px}
.sign .en{font-size:11px;letter-spacing:6px;color:var(--gold);font-weight:700}
.sign h1{font-family:var(--title);font-weight:400;font-size:clamp(40px,8vw,60px);line-height:1.1;margin-top:4px}
.sign h1 em{font-style:normal;color:var(--gold)}
.gate .sub{margin-top:16px;color:#b9a98c;font-size:15px;line-height:1.6}
.card{margin:34px auto 0;max-width:520px;background:var(--paper);color:var(--ink);border-radius:8px;padding:18px 22px;display:flex;gap:16px;align-items:center;
  box-shadow:0 10px 26px rgba(0,0,0,.45);transform:rotate(-.6deg);position:relative}
.card .em{font-size:44px;line-height:1}
.card .nm{font-family:var(--title);font-size:26px;line-height:1.1}
.card .st{font-size:13px;color:var(--ink2);margin-top:4px}
.card .bar{margin-top:8px;height:8px;background:var(--paper2);border-radius:4px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .6s}
.card .stamp{position:absolute;right:16px;top:12px;border:2px solid var(--red);color:var(--red);font-family:var(--title);font-size:15px;padding:3px 8px;border-radius:4px;transform:rotate(8deg);opacity:.85}
.files{margin-top:52px}
.files h2{font-size:13px;letter-spacing:4px;color:#b9a98c;text-align:center;margin-bottom:18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.folder{position:relative;display:block;text-decoration:none;color:var(--ink);background:var(--paper2);border-radius:6px 14px 6px 6px;padding:22px 20px 18px;
  border-top:14px solid #d9c9a3;transition:transform .18s,box-shadow .18s;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.folder:before{content:'';position:absolute;left:0;top:-30px;width:38%;height:16px;background:#d9c9a3;border-radius:6px 6px 0 0}
a.folder:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 16px 34px rgba(0,0,0,.5)}
a.folder:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.folder .no{font-size:11px;letter-spacing:2px;color:var(--ink2);font-weight:700}
.folder .ic{font-size:36px;line-height:1;margin-top:6px}
.folder h3{font-family:var(--title);font-weight:400;font-size:25px;margin-top:8px}
.folder p{margin-top:6px;font-size:13.5px;color:var(--ink2);line-height:1.6}
.folder .go{display:inline-block;margin-top:12px;font-size:13px;font-weight:800;color:var(--teal)}
.folder .best{margin-top:10px;font-size:12px;color:var(--ink2)}
.folder.wip{opacity:.62;filter:grayscale(.4)}
.folder.wip h3{color:var(--ink2)}
.folder .seal{position:absolute;right:14px;top:14px;font-family:var(--title);font-size:13px;color:var(--red);border:2px solid var(--red);padding:2px 7px;border-radius:4px;transform:rotate(-8deg)}
.folder .seal.open{color:#1f6d63;border-color:#1f6d63}
.note{margin:40px auto 0;max-width:620px;background:#221b15;border:1px dashed #6b5a45;border-radius:10px;padding:16px 20px;font-size:13.5px;color:#cbbc9e;line-height:1.7}
.note b{color:var(--gold)}
.note .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note .chips span{background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
footer{text-align:center;padding:26px 16px 40px;font-size:12px;color:#8b7c64}
footer a{color:#8b7c64}
</style>
<script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>
<body>
<main>
  <section class="gate">
    <div class="sign"><div class="en">K - D E T E C T I V E</div><h1>케이<em>탐정</em> 사무소</h1></div>
    <p class="sub">가짜 정보를 꿰뚫어 보는 사람이 탐정이다.<br>사건 파일을 열고, 조작된 곳을 찾고, 때로는 직접 만들어서 탐정을 속여 봐.</p>
  </section>

  <div class="card" id="idcard">
    <div class="em" id="rankEm">🔍</div>
    <div style="flex:1">
      <div class="nm" id="rankNm">견습 탐정</div>
      <div class="st"><span id="total">0</span>점 · 해결한 사건 <span id="solved">0</span>건 · 최고 연속 <span id="streak">0</span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="st" id="nextTx" style="margin-top:4px"></div>
    </div>
    <div class="stamp">탐정 명함</div>
  </div>

  <section class="files">
    <h2>사 건 파 일</h2>
    <div class="grid" id="grid"></div>
  </section>

  <div class="note">
    <b>🗒️ 탐정 수첩 — 이 사무소에서 「믿을 만한 곳」</b><br>
    기사 출처가 아래 목록에 없으면 일단 의심한다. 이름이 한 글자만 달라도 다른 곳이다.
    <div class="chips" id="trusted"></div>
  </div>
</main>
<footer>사건 파일 속 기사는 전부 연습용으로 지어낸 것 · K-edu 놀이구역 · <a href="/">keduclass.com</a></footer>

<script src="./kd_core.js"></script>
<script>
(function(){
  var rec=KD.loadRec(), rank=KD.rankOf(rec.total), nx=KD.nextRank(rec.total);
  document.getElementById('rankEm').textContent=rank.em;
  document.getElementById('rankNm').textContent=rank.name;
  document.getElementById('total').textContent=rec.total;
  document.getElementById('solved').textContent=rec.solved;
  document.getElementById('streak').textContent=rec.streakBest;
  if(nx){var pct=Math.round((rec.total-rank.min)/(nx.min-rank.min)*100);setTimeout(function(){document.getElementById('bar').style.width=pct+'%'},80);
    document.getElementById('nextTx').textContent='다음 등급 '+nx.name+'까지 '+(nx.min-rec.total)+'점';}
  else{document.getElementById('bar').style.width='100%';document.getElementById('nextTx').textContent='최고 등급';}
  var g=document.getElementById('grid');
  KD.CASES.forEach(function(c){
    var el=document.createElement(c.open?'a':'div'); el.className='folder'+(c.open?'':' wip');
    if(c.open)el.href=c.href; else el.setAttribute('aria-disabled','true');
    var best=0; for(var k in rec.best){ if(k.indexOf(c.id+'.')===0) best=Math.max(best,rec.best[k]); }
    el.innerHTML='<span class="seal'+(c.open?' open':'')+'">'+(c.open?'수사 중':'준비 중')+'</span><div class="no">CASE FILE 0'+c.no+'</div><div class="ic">'+c.icon+'</div><h3>'+c.title+'</h3><p>'+c.tag+'</p>'
      +(c.open?'<span class="go">파일 열기 →</span>':'<span class="go" style="color:var(--ink2)">탐정이 아직 조사 중</span>')
      +(best?'<div class="best">🏆 내 최고 '+best+'점</div>':'');
    g.appendChild(el);
  });
  var t=document.getElementById('trusted'); KD.TRUSTED.forEach(function(n){var s=document.createElement('span');s.textContent=n;t.appendChild(s);});
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

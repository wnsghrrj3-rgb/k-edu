  linear-gradient(0deg,transparent 44%,#b8382a 44% 56%,transparent 56%),linear-gradient(90deg,transparent 44%,#b8382a 44% 56%,transparent 56%),radial-gradient(circle,#d9d5cf 0 16%,transparent 17%)}

<script type="module">
import { createScene } from './scene.js';
import { createTerrain, reset, setVent, step, blast, measure } from './terrain.js';
import { createVolcano, setHandles, stepVolcano, SAYS } from './logic.js';

const $ = id => document.getElementById(id);
const qp = new URLSearchParams(location.search);
let saved = null; try { saved = localStorage.getItem('wonder_volcano_q'); } catch (e) {}
const quality = qp.get('q') || saved || 'high';
const N = quality === 'low' ? 128 : 192, CELL = 19100 / (N - 1);            // 가로 19km 남짓의 바다
const KV = (100 / CELL) ** 2;                                               // 칸이 크면 같은 부피가 더 얇다

// ── 처음 땅: 깊은 바다 한가운데의 바다 밑 둔덕(꼭대기가 수면 바로 아래)
let seed = +(qp.get('seed') || 0) || ((Math.random() * 1e6) | 0);
function seabed(seed) {
  const r1 = Math.sin(seed * 12.9898) * 43758.5453, ph = r1 - Math.floor(r1);
  return (x, y, n) => { const c = (n - 1) / 2, dx = (x - c) * CELL / 100, dy = (y - c) * CELL / 100, r = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    const lump = Math.sin(a * 3 + ph * 6.28) * .5 + Math.sin(a * 5 - ph * 9) * .3 + Math.sin(dx * .9 + ph * 20) * Math.cos(dy * .8) * .6;
    return -250 + 205 * Math.exp(-Math.pow(r / 13, 4)) * (1 + .04 * lump) - Math.min(90, r * 1.4) + 4 * lump; };   // 넓고 평평한 꼭대기(수심 십몇 m)
}
const T = createTerrain({ N, cell: CELL, sea: 0, seed, base: seabed(seed) });
const scene = await createScene($('gl'), T, { quality });
$('load').classList.add('hide');

// ── 분출: 끈적임·기체 → 분출 모양은 logic.js 가 정하고, 땅은 terrain.js 가 쌓는다
const SPEED = 30;                                                           // 1초에 계산 걸음 수(시간이 빨리 감긴다)
const PUSH = .7, RATE = { flow: 80, fountain: 58, dome: 30, building: 6, column: 105, rest: 0 };
let V = createVolcano({ visc: .06, gas: .08, push: PUSH });
let auto = true, showT = 0, phase = 0, blasts = 0, tickAcc = 0, restT = 0, emerged = false, calmT = 0, busy = false, colEnd = -99, hadCol = false, worldT = 0;
const SHOW = [                                                              // 저절로 돌아가는 쇼(초)
  { at: 0, visc: .06, gas: .08 },          // 묽은 용암이 흘러 섬이 넓어진다
  { at: 46, visc: .12, gas: .92 },         // 불 분수와 부스러기로 원뿔이 선다
  { at: 68, visc: .07, gas: .1 },          // 다시 흘러 원뿔 기슭을 덮는다
  { at: 80, visc: .93, gas: .22 },         // 끈적한 용암 혹
  { at: 87, visc: .93, gas: .96 },         // 길이 막혀 압력이 차고 … 한 번 크게 폭발
];
const note = (t, s) => { const k = t + '|' + (s || ''); if (note.k === k) return; note.k = k; $('note').innerHTML = t + (s ? `<small>${s}</small>` : ''); $('note').classList.remove('hide'); };
function world(newSeed) {
  seed = newSeed; reset(T, { seed, base: seabed(seed) }); scene.clearFx(); scene.sync();
  V = createVolcano({ visc: V.visc, gas: V.gas, push: PUSH }); blasts = 0; emerged = false; restT = 0; calmT = 0; tickAcc = 0; colEnd = -99; hadCol = false; worldT = 0;
}
function startShow() { auto = true; showT = 0; phase = 0; V.visc = SHOW[0].visc; V.gas = SHOW[0].gas; world((Math.random() * 1e6) | 0); paintHandles(); $('auto').classList.add('hide'); }
function restart(fn) { if (busy) return; busy = true; $('veil').classList.add('on'); setTimeout(() => { fn(); $('veil').classList.remove('on'); busy = false; }, qp.get('shot') ? 0 : 950); }

function frameStep(dt) {
  if (busy) return;
  // 쇼의 차례
  if (auto) {
    showT += dt;
    while (phase < SHOW.length && showT >= SHOW[phase].at) { const s = SHOW[phase++]; setHandles(V, { visc: s.visc, gas: s.gas, push: PUSH }); paintHandles(); }
    if (phase >= SHOW.length && V.blasts > 0 && !V.column && V.push > 0) setHandles(V, { push: 0 });      // 폭발이 가라앉으면 쉰다
    if (V.push === 0) { restT += dt; if (restT > 24) { restart(startShow); return; } }
  }
  stepVolcano(V, dt); worldT += dt;
  const mode = V.mode, ramp = emerged ? 1 : Math.min(1, .012 + .5 * Math.pow(worldT / 5.5, 3));     // 바다 밑에서는 조금씩 — 물이 끓는 것부터 보인다
  if (V.column) hadCol = true; else if (hadCol) { hadCol = false; colEnd = worldT; }
  if (V.blasts > blasts) { blasts = V.blasts; blast(T, .55 + .45 * V.gas); scene.burst(1); calmT = 0; }
  setVent(T, { visc: V.visc, gas: mode === 'building' ? 0 : mode === 'column' ? Math.max(V.gas, .9) : mode === 'dome' ? Math.min(V.gas, .2) : V.gas, rate: RATE[mode] * KV * ramp });
  tickAcc += dt * SPEED; let ticked = false;
  while (tickAcc >= 1) { tickAcc--; step(T, 1); ticked = true; }
  if (mode === 'rest' && auto) { const a = T.age, k = dt * SPEED * 7; for (let i = 0; i < a.length; i++) a[i] += k; ticked = true; }   // 쉬는 동안은 세월이 더 빨리 — 풀이 돋는다
  if (ticked) scene.sync();
  scene.stepFx(dt, { mode, fountain: mode === 'fountain' ? Math.min(1, V.fountainH / 1.05) : 0, column: V.column ? Math.min(1, V.column.top) : 0 });
  // 글
  const vi = Math.round(T.vent.y) * N + Math.round(T.vent.x), top = T.g[vi] + T.melt[vi];
  if (!emerged && top > 1.5) { emerged = true; calmT = -4; }
  calmT += dt;
  if (!emerged) note('바다 밑에서 용암이 나오고 있어요', '물이 부글부글 끓고 물빛이 변해요');
  else if (calmT < 0) note('검은 섬이 얼굴을 내밀었어요!', '화산은 한 겹씩 쌓여 땅이 돼요');
  else if (mode === 'column') note(SAYS.blast);
  else if (worldT - colEnd < 7) note(SAYS.calm);
  else if (mode === 'rest') note('분출이 멈췄어요', '세월이 흐르면 검은 땅이 잿빛이 되고, 풀이 돋아요');
  else if (mode === 'flow') note('묽은 용암이 강처럼 흘러내려요', '멀리 흘러가 굳어서 넓고 완만한 산이 돼요');
  else if (mode === 'fountain') note(SAYS.fountain, '부스러기가 둘레에 쌓여 가운데가 팬 원뿔이 돼요');
  else if (mode === 'dome') note(SAYS.dome, '끈적한 용암은 멀리 못 가서 가파르게 쌓여요');
  else if (mode === 'building') note('길이 막혀 압력이 차올라요…', '오래 조용하다가 한 번에 터져요');
}

// ── 손잡이: 끈적임 레버와 기체 밸브. 손을 대면 쇼를 멈추고 손잡이를 따른다
function paintHandles() {
  $('arm').style.left = `calc(16px + ${V.visc} * (100% - 32px))`; $('wheel').style.transform = `rotate(${V.gas * 270}deg)`;
  $('lever').setAttribute('aria-valuenow', Math.round(V.visc * 100)); $('valve').setAttribute('aria-valuenow', Math.round(V.gas * 100));
}
function take(h) { if (auto) { auto = false; $('auto').classList.remove('hide'); } setHandles(V, { ...h, push: PUSH }); paintHandles(); }
function dragger(el, fn) {
  let on = false;
  el.addEventListener('pointerdown', e => { on = true; el.setPointerCapture(e.pointerId); fn(e, true); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (on) fn(e, false); });
  const up = () => { on = false; }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
dragger($('lever'), e => { const r = $('lever').getBoundingClientRect(); take({ visc: Math.min(1, Math.max(0, (e.clientX - r.left - 16) / (r.width - 32))) }); });
let vAng = 0;
dragger($('valve'), (e, first) => { const r = $('valve').getBoundingClientRect(), a = Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2);
  if (!first) { let d = a - vAng; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; take({ gas: Math.min(1, Math.max(0, V.gas + d / (1.5 * Math.PI))) }); } else take({}); vAng = a; });
$('lever').addEventListener('keydown', e => { const d = e.key === 'ArrowRight' ? .1 : e.key === 'ArrowLeft' ? -.1 : 0; if (d) take({ visc: Math.min(1, Math.max(0, V.visc + d)) }); });
$('valve').addEventListener('keydown', e => { const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? .1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -.1 : 0; if (d) take({ gas: Math.min(1, Math.max(0, V.gas + d)) }); });
$('again').onclick = () => restart(() => { if (auto) startShow(); else world((Math.random() * 1e6) | 0); });
$('auto').onclick = () => restart(startShow);
paintHandles();

// ── 옆으로 끌면 섬 둘레를 돈다
{ const cv = $('gl'); let on = false, lx = 0;
  cv.addEventListener('pointerdown', e => { on = true; lx = e.clientX; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); scene.cam.drift = 0; });
  cv.addEventListener('pointermove', e => { if (!on) return; const d = (e.clientX - lx) / innerWidth; lx = e.clientX; scene.cam.az -= d * 2.2; scene.cam.vel = -d * 30; });
  const up = () => { on = false; cv.classList.remove('drag'); }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); }


// ── 탐방: 무인기 → 깃발 → 그곳으로 내려가기(섬은 멈춘 채 그대로 기다린다)
let hold = false, tourOn = false, spot = null, spotT = 0; const pouch = [];
function findSpot() {                                                       // 용암이 길게 흐른 비탈: 꼭대기와 물가의 가운데쯤, 눈 쪽 비탈, 지금 식어 있는 곳
  const c = (N - 1) / 2, D = T.dep, cp = scene.camera.position, ca = Math.atan2(cp.x, cp.z); let far = 0;
  for (let y = D.y0; y <= D.y1; y++) for (let x = D.x0; x <= D.x1; x++) if (T.g[y * N + x] > T.sea + 2) far = Math.max(far, Math.hypot(x - T.vent.x, y - T.vent.y));
  if (far < 3) return null; let best = null, bs = -1e9;
  for (let y = D.y0; y <= D.y1; y++) for (let x = D.x0; x <= D.x1; x++) { const i = y * N + x; if (T.g[i] < T.sea + 3 || T.melt[i] > .01) continue;
    const r = Math.hypot(x - T.vent.x, y - T.vent.y) / far, sc = -Math.abs(r - .5) * 2 + .7 * Math.cos(Math.atan2(x - c, y - c) - ca - .5); if (sc > bs) { bs = sc; best = { x, y }; } }
  return best;
}
function placeFlag() {

$('drone').onclick = () => { tourOn = !tourOn; $('drone').classList.toggle('on', tourOn); spot = tourOn ? findSpot() : null; spotT = 0;
  if (tourOn && !spot) { tourOn = false; $('drone').classList.remove('on'); note.k = ''; note('아직 내려갈 땅이 없어요', '섬이 물 위로 올라오면 무인기가 내려갈 수 있어요'); } placeFlag(); };
$('flag1').onclick = () => { if (hold) return; hold = true; $('veil').classList.add('on');
  setTimeout(() => { const fr = document.createElement('iframe'); fr.title = '용암 동굴'; fr.src = `./cave/?in=1&q=${scene.quality}${qp.get('shot') ? '&shot=1' : ''}`; fr.allow = 'fullscreen'; $('tour').appendChild(fr); $('tour').classList.add('on'); fr.onload = () => { $('veil').classList.remove('on'); fr.contentWindow.focus(); }; }, qp.get('shot') ? 0 : 700); };
addEventListener('message', e => { if (e.origin !== location.origin || e.data?.type !== 'wonder-volcano-tour-back') return;
  if (Array.isArray(e.data.pouch)) pouch.push(...e.data.pouch.filter(x => typeof x === 'string').slice(0, 20));                                  // 주운 표본(돌 책상이 서면 거기에 놓인다). 기기에 남기지 않는다
  $('veil').classList.add('on'); setTimeout(() => { $('tour').classList.remove('on'); $('tour').replaceChildren(); hold = false; last = performance.now(); $('veil').classList.remove('on'); }, qp.get('shot') ? 0 : 450); });
// ── 돌리기
let last = performance.now();

    run(sec) { const dt = 1 / 30; for (let t = 0; t < sec; t += dt) { frameStep(dt); scene.stepCam(dt); } scene.render(0); return { t: showT, mode: V.mode, counts: scene.counts, m: measure(T, { ref: 0 }) }; },
    set(h) { take(h); }, show() { startShow(); }, fresh(s) { world(s); },
    cam(o) { if (o.dist) scene.cam.auto = false; Object.assign(scene.cam, o); scene.render(0); }, ui(on) { for (const q of ['.desk', '.top', '.model', '.drone']) document.querySelector(q).style.display = on ? '' : 'none'; } };
  scene.cam.drift = 0; scene.render(0); document.title = 'ready';

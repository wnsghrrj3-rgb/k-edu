<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020203;color:#f3ece6;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.5) 100%)}

.dial b{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:.84rem;color:#f0d9c8;font-weight:800;pointer-events:none}
.knob{position:absolute;left:50%;top:86px;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;cursor:grab;background:radial-gradient(circle at 35% 30%,#8d8985,#3f3c3b 60%,#201d1d);box-shadow:0 5px 14px rgba(0,0,0,.7),inset 0 2px 2px rgba(255,255,255,.25),inset 0 -6px 10px rgba(0,0,0,.5);outline:none}

.knob::after{content:"";position:absolute;left:50%;top:5px;width:8px;height:24px;margin-left:-4px;border-radius:4px;background:linear-gradient(180deg,#ffb35c,#e2452a);box-shadow:0 0 10px rgba(255,120,40,.8)}
.knob:focus-visible{box-shadow:0 0 0 3px #ffcf8a,0 5px 14px rgba(0,0,0,.7)}

.tool .n{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;border-radius:10px;background:#e2452a;color:#fff;font-size:.74rem;font-weight:800;line-height:20px;text-align:center}
#pouch{display:none}#pouch.has{display:grid}#pouch.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.94)}}
.why{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(330px,calc(50vw - 150px));background:rgba(14,9,8,.78);border:1px solid rgba(255,190,140,.3);border-radius:16px;padding:13px 15px 11px;backdrop-filter:blur(8px);transition:opacity .6s,transform .6s}
.why.hide{opacity:0;transform:translateY(12px);pointer-events:none}
.why h3{font-size:.86rem;color:#ffb35c;margin-bottom:6px}

.why button{margin-top:9px;border:1px solid rgba(255,190,140,.3);background:rgba(255,255,255,.06);color:#f3ece6;border-radius:10px;padding:6px 12px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 16px;border-radius:999px;background:rgba(14,9,8,.55);font-weight:700;font-size:.95rem;pointer-events:none;transition:opacity .8s}
.hint.hide{opacity:0}
.model{position:fixed;left:14px;top:calc(58px + env(safe-area-inset-top,0px));font-size:.72rem;color:rgba(240,217,200,.5);pointer-events:none}
#veil{position:fixed;inset:0;background:#020203;opacity:0;pointer-events:none;transition:opacity .22s}
#veil.on{opacity:1}

#load.hide{opacity:0;pointer-events:none}
@media (max-width:760px){.why{left:12px;right:12px;bottom:186px;max-width:none}.sp{display:none}.note{max-width:none;margin:0;flex:1}.model{display:none}.side{bottom:calc(196px + env(safe-area-inset-bottom,0px));right:10px}.tool small{display:none}.tool{width:52px;height:52px}.tool svg{width:32px;height:32px}}
@media (max-height:480px){.dial{transform:translateX(-50%) scale(.78);transform-origin:bottom center}.why{bottom:10px}}

<body>
<canvas id="gl"></canvas>
<div class="shade"></div>
<div class="top">
  <a class="pill" id="back" href="../" aria-label="화산섬으로 돌아가기">
    <svg viewBox="0 0 68 48" fill="none" stroke="#f0d9c8" stroke-width="3" stroke-linecap="round"><ellipse cx="14" cy="12" rx="12" ry="3.5"/><ellipse cx="54" cy="12" rx="12" ry="3.5"/><path d="M14 13v7M54 13v7M14 20c8 0 12 4 20 4s12-4 20-4"/><rect x="24" y="20" width="20" height="14" rx="6" fill="#f0d9c8" stroke="none"/><circle cx="34" cy="38" r="4" fill="#ffb35c" stroke="none"/></svg>
    <span>섬으로</span></a>

</div>
<div class="model">계산으로 닮게 만든 모형이에요.</div>

</section>
<div class="side">
  <button class="tool" id="pouch" aria-label="표본 주머니"><svg viewBox="0 0 40 40" fill="none"><path d="M12 14c-6 6-8 12-6 18 1 4 5 5 14 5s13-1 14-5c2-6 0-12-6-18z" fill="#8a6a45" stroke="#3b2a18" stroke-width="1.6"/><path d="M12 14c3 2 13 2 16 0l2-6c-5-3-15-3-20 0z" fill="#a8845a" stroke="#3b2a18" stroke-width="1.6"/><path d="M10 14h20" stroke="#e9d3a8" stroke-width="2.2" stroke-linecap="round"/></svg><span class="n" id="pn">1</span><small>표본 주머니</small></button>
  <button class="tool" id="lamp" aria-label="등불" aria-pressed="true"><svg viewBox="0 0 40 40" fill="none"><path class="glow" d="M20 22L3 39h34z" fill="url(#lg)"/><rect x="13" y="6" width="14" height="12" rx="3" fill="#d8d5d0" stroke="#3a3736" stroke-width="1.6"/><path d="M11 18h18l-3 6H14z" fill="#8d8985" stroke="#3a3736" stroke-width="1.6"/><circle class="glow" cx="20" cy="22" r="3.2" fill="#fff2c9"/><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/></linearGradient></defs></svg><small>등불</small></button>
</div>
<aside class="why hide" id="why"><h3>왜 굴이 생겼을까요?</h3><p id="whyT"></p><p id="whyW"></p><button id="whyX">알겠어요</button></aside>
<div id="veil"></div>
<div id="load">무인기가 굴로 내려가는 중…</div>
<script type="module">
import { createCave } from './scene.js';
import { caveState, snap, says, stageOf, STOPS, OUT_AT, WHY, WHERE } from './logic.js';

const $ = id => document.getElementById(id);
const qp = new URLSearchParams(location.search), shot = !!qp.get('shot'), inside = window.parent !== window && qp.get('in');
let saved = null; try { saved = localStorage.getItem('wonder_volcano_q'); } catch (e) {}
const scene = await createCave($('gl'), { quality: qp.get('q') || saved || 'high' });

// ── 다이얼: 돌리면 시간이 되감긴다. 손을 놓으면 가까운 멈춤 자리에 붙는다
let tGoal = +(qp.get('t') || 0), tCur = tGoal, shown = caveState(tCur).view, swapping = false, lampOn = true;
const seen = new Set(), pouch = [];
const stops = [...document.querySelectorAll('.stop')];
stops.forEach((b, i) => { const a = (-120 + 80 * i) * Math.PI / 180, R = 84; b.style.left = `calc(50% + ${Math.sin(a) * R}px)`; b.style.top = `${86 - Math.cos(a) * R * 0.86 - (i === 0 || i === 3 ? 4 : 0)}px`; b.onclick = () => { tGoal = STOPS[i]; paintDial(); }; });
function paintDial() { $('knob').style.transform = `rotate(${-120 + 240 * tGoal}deg)`; $('knob').setAttribute('aria-valuenow', Math.round(tGoal * 100)); $('knob').setAttribute('aria-valuetext', stops[stageOf(tGoal)].textContent); stops.forEach((b, i) => b.classList.toggle('on', Math.abs(tGoal - STOPS[i]) < 0.03)); }
{ const k = $('knob'); let on = false, last = 0;
  const ang = e => { const r = k.getBoundingClientRect(); return Math.atan2(e.clientX - r.left - r.width / 2, -(e.clientY - r.top - r.height / 2)); };
  k.addEventListener('pointerdown', e => { on = true; last = ang(e); k.setPointerCapture(e.pointerId); e.preventDefault(); });
  k.addEventListener('pointermove', e => { if (!on) return; const a = ang(e); let d = a - last; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; last = a; tGoal = Math.min(1, Math.max(0, tGoal + d / (240 * Math.PI / 180))); paintDial(); });
  const up = () => { if (!on) return; on = false; tGoal = snap(tGoal); paintDial(); }; k.addEventListener('pointerup', up); k.addEventListener('pointercancel', up);
  k.addEventListener('keydown', e => { const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0; if (!d) return; const i = Math.min(3, Math.max(0, stageOf(tGoal) + d)); tGoal = STOPS[i]; paintDial(); e.preventDefault(); }); }
paintDial();

// ── 글
let flash = null, flashUntil = 0;
function note(t, s) { const k = t + '|' + (s || ''); if (note.k === k) return; note.k = k; $('note').innerHTML = t + (s ? `<small>${s}</small>` : ''); $('note').classList.remove('hide'); }
function say(t, s, sec = 4) { flash = [t, s]; flashUntil = performance.now() + sec * 1000; }
$('whyT').textContent = WHY.join(' '); $('whyW').textContent = WHERE; $('whyX').onclick = () => $('why').classList.add('hide');

// ── 등불
$('lamp').onclick = () => { lampOn = !lampOn; scene.lamp(lampOn); $('lamp').classList.toggle('off', !lampOn); $('lamp').setAttribute('aria-pressed', lampOn);
  if (!lampOn && caveState(tCur).heat > 0.5 && shown === 'in') say('등불을 껐는데도 환해요', '용암이 내는 빛이에요'); else flash = null; };

// ── 끌어서 둘러보기 · 천장을 톡 치면 표본
{ const cv = $('gl'); let on = false, lx = 0, ly = 0, sx = 0, sy = 0, t0 = 0;
  cv.addEventListener('pointerdown', e => { on = true; lx = sx = e.clientX; ly = sy = e.clientY; t0 = performance.now(); cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', e => { if (!on) return; const k = 2.2 / innerHeight; scene.look.yaw = Math.min(1.5, Math.max(-1.5, scene.look.yaw + (e.clientX - lx) * k)); scene.look.pitch = Math.min(0.85, Math.max(-0.7, scene.look.pitch + (e.clientY - ly) * k)); lx = e.clientX; ly = e.clientY;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 30) $('hint').classList.add('hide'); });
  const up = e => { if (!on) return; on = false; cv.classList.remove('drag');
    if (Math.hypot(e.clientX - sx, e.clientY - sy) < 7 && performance.now() - t0 < 400) { const r = scene.tap(e.clientX, e.clientY);
      if (r === 'ok') { pouch.push('용암 고드름 조각'); $('pn').textContent = pouch.length; $('pouch').classList.add('has'); $('pouch').classList.remove('pop'); void $('pouch').offsetWidth; $('pouch').classList.add('pop'); say('돌 고드름 조각을 주머니에 넣었어요', '천장에서 녹아 떨어지던 용암이 굳은 거예요'); }
      else if (r === 'hot') say('아직 뜨거워서 만질 수 없어요', '다이얼을 「지금」으로 돌린 다음 쳐 보세요'); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', () => { on = false; cv.classList.remove('drag'); }); }
$('pouch').onclick = () => say(`표본 주머니에 돌 고드름 조각이 ${pouch.length}개 있어요`, '천장에서 녹아 떨어지던 용암이 굳은 거예요');
setTimeout(() => { if (!$('hint').classList.contains('hide')) { $('hint').textContent = '천장을 톡 쳐 보세요'; setTimeout(() => $('hint').classList.add('hide'), 4500); } }, 6000);

// ── 돌아가기: 섬 화면 위에 떠 있을 때는 섬에 알리고, 따로 열렸을 때는 화산 화면으로
$('back').onclick = e => { if (inside) { e.preventDefault(); window.parent.postMessage({ type: 'wonder-volcano-tour-back', place: 'cave', pouch }, location.origin); } };

// ── 한 프레임
function frameStep(dt) {
  tCur += (tGoal - tCur) * Math.min(1, dt * 3.2); if (Math.abs(tGoal - tCur) < 0.0005) tCur = tGoal;
  let s = caveState(tCur);
  if (s.view !== shown && !swapping) { swapping = true; $('veil').classList.add('on'); setTimeout(() => { shown = caveState(tCur).view; swapping = false; $('veil').classList.remove('on'); }, shot ? 0 : 260); }
  if (s.view !== shown) s = caveState(shown === 'in' ? OUT_AT : OUT_AT + 0.001);     // 장면을 바꾸는 동안은 앞 장면의 끝을 보여 준다
  scene.apply(s);
  STOPS.forEach((x, i) => { if (Math.abs(tCur - x) < 0.02) seen.add(i); });
  if (seen.size === 4 && !frameStep.why) { frameStep.why = true; setTimeout(() => $('why').classList.remove('hide'), 2500); }
  $('lamp').style.visibility = shown === 'in' ? '' : 'hidden';
  if (flash && performance.now() < flashUntil) note(flash[0], flash[1]); else { flash = null; note(...says(s.t, lampOn)); }
}
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; frameStep(dt); scene.render(dt); scene.tune(dt); requestAnimationFrame(frame); }
$('load').classList.add('hide');
if (shot) {                                                                   // 화면 찍기용
  window.__c = { scene, set(t) { tGoal = tCur = t; paintDial(); shown = caveState(t).view; frameStep(0); scene.render(0); },
    run(sec) { for (let t = 0; t < sec; t += 1 / 30) { frameStep(1 / 30); scene.render(1 / 30); } }, look(yaw, pitch) { scene.look.yaw = yaw; scene.look.pitch = pitch; scene.render(0); },
    lamp(on) { lampOn = on; scene.lamp(on); for (let i = 0; i < 30; i++) scene.render(1 / 30); frameStep(0); }, tap(x, y) { return scene.tap(x, y); },
    ui(on) { for (const q of ['.dial', '.top', '.side', '.model', '.hint', '.why', '.shade']) document.querySelector(q).style.display = on ? '' : 'none'; }, why() { $('why').style.transition = 'none'; $('why').classList.remove('hide'); } };
  $('hint').classList.add('hide'); frameStep(0); scene.render(0); document.title = 'ready';
} else requestAnimationFrame(frame);
</script>

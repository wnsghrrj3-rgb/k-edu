<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블랙홀 · 케이원더</title>
<script type="importmap">
{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#dff6ff;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#gl,#hud,#pad{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#pad{touch-action:none;cursor:crosshair}
#frame{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;overflow:visible}
#frame>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.scr{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;color:#bfefff;text-shadow:0 0 8px rgba(80,220,255,.55)}
/* 왼쪽 화면: 던질 것 + 한 줄 말 */
#left{width:620px;height:200px;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.picks{display:flex;gap:10px}
.pick{flex:1;border:2px solid rgba(90,220,255,.35);background:rgba(20,80,100,.22);color:#bfefff;border-radius:10px;padding:10px 4px;font:inherit;font-weight:800;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:inherit}
.pick i{font-style:normal;font-size:30px;line-height:1;filter:drop-shadow(0 0 6px rgba(120,230,255,.7))}
.pick.on{border-color:#ffd27a;background:rgba(255,190,90,.2);color:#ffe9bd}
#say{font-size:23px;font-weight:600;line-height:1.35;flex:1;display:flex;align-items:center}
/* 오른쪽 화면: 시계 둘 */
#right{width:470px;height:200px;padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;align-content:center}
.clk{display:flex;flex-direction:column;gap:2px}
.clk small{font-size:19px;font-weight:700;opacity:.8}
.clk b{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-family:ui-monospace,'SF Mono',Menlo,monospace}
.clk.p b{color:#ffd27a;text-shadow:0 0 10px rgba(255,190,90,.6)}
#rate{grid-column:1/3;font-size:20px;font-weight:700;opacity:.9;display:flex;justify-content:space-between;align-items:center}
#pass{border:2px solid rgba(90,220,255,.35);background:rgba(20,80,100,.22);color:#bfefff;border-radius:10px;padding:6px 12px;font:inherit;font-weight:800;font-size:19px;cursor:pointer;text-shadow:inherit;white-space:nowrap}
#scope{width:260px;height:260px;border-radius:50%}
/* 거리 레버 */
#lever{width:70px;height:300px;touch-action:none;cursor:ns-resize}
#knob{position:absolute;left:6px;width:58px;height:34px;border-radius:8px;background:linear-gradient(180deg,#d9dee6,#7f8794 45%,#3b4049);box-shadow:0 6px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.7);border:1px solid #20242b}
#knob::after{content:'';position:absolute;left:10px;right:10px;top:15px;height:3px;background:#12151a;border-radius:2px;box-shadow:0 -6px 0 #12151a,0 6px 0 #12151a}
/* 위의 글 */
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
a.back,.snd{color:#c9d3f5;text-decoration:none;font:inherit;font-weight:700;font-size:.9rem;background:rgba(4,8,16,.55);border:1px solid rgba(160,200,255,.2);padding:7px 12px;border-radius:999px;backdrop-filter:blur(6px);cursor:pointer}
.note{margin:0 auto;max-width:min(680px,66vw);background:rgba(4,8,16,.6);border:1px solid rgba(160,200,255,.2);border-radius:14px;padding:8px 16px;font-weight:700;font-size:clamp(.95rem,1.7vw,1.15rem);text-align:center;backdrop-filter:blur(6px);color:#eef2ff;transition:opacity .6s}
.note small{display:block;font-weight:500;color:#aab6de;font-size:.82em;margin-top:2px}
.note.hide{opacity:0}
.why{position:fixed;left:50%;top:26%;transform:translateX(-50%);max-width:min(560px,86vw);background:rgba(4,8,16,.82);border:1px solid rgba(255,210,122,.5);border-radius:18px;padding:16px 20px;text-align:center;font-size:1.05rem;line-height:1.6;backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .5s;color:#eef2ff;z-index:6}
.why.show{opacity:1}.why b{color:#ffd27a;display:block;margin-bottom:4px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#aab6de;font-weight:700;transition:opacity .9s;z-index:9}
#load.hide{opacity:0;pointer-events:none}
/* 세로로 긴 화면: 조종석 그림 없이 아래에 판을 깐다 */
body.flat #frame>img{display:none}
body.flat #frame{left:0;top:auto;bottom:0;transform:none;width:100%!important;height:auto!important;display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px;background:linear-gradient(180deg,transparent,rgba(2,6,12,.92) 18%)}
body.flat .scr{position:relative;transform:none!important}
body.flat #left{width:auto;height:auto;grid-column:1/3;padding:6px}
body.flat .pick{font-size:14px;padding:6px 2px}.flat .pick i{font-size:20px}
body.flat #say{font-size:15px;min-height:2.6em}
body.flat #right{width:auto;height:auto;padding:6px;grid-template-columns:1fr 1fr}
body.flat .clk b{font-size:24px}body.flat .clk small,body.flat #rate,body.flat #pass{font-size:13px}
body.flat #scope{width:110px;height:110px;grid-row:2;grid-column:2}
body.flat #lever{display:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pad"></div>
<canvas id="hud"></canvas>
<div id="frame">
  <img id="cockpit" src="./assets/cockpit.webp" alt="">
  <div class="scr" id="left">
    <div class="picks" id="picks"></div>
    <div id="say">창밖을 누른 채 끌었다 놓으면 끄는 쪽으로 던져요.</div>
  </div>
  <canvas class="scr" id="scope" width="260" height="260"></canvas>
  <div class="scr" id="right">
    <div class="clk"><small>내 시계</small><b id="cMe">00:00.0</b></div>
    <div class="clk p"><small>탐사선 시계</small><b id="cPr">--:--.-</b></div>
    <div id="rate"><span id="rateT"></span><button id="pass">✦ 뒤로 별 지나가게</button></div>
  </div>
  <div class="scr" id="lever"><div id="knob"></div></div>
</div>
<div class="top">
  <a class="back" href="../">← 케이원더</a>
  <div class="note hide" id="note"></div>
  <button class="snd" id="snd">🔇 소리 켜기</button>
</div>
<div class="why" id="why"></div>
<div id="load">우주선 창을 여는 중…</div>
<script type="module">
import { createBlackhole } from './scene.js';
import { simulate, clockRate, OBJECTS, MISSIONS, WHY, SHIP_MIN, SHIP_MAX, DISK_IN, DISK_OUT, CAPTURE } from './logic.js';

const $ = id => document.getElementById(id), qp = new URLSearchParams(location.search);
const bh = await createBlackhole($('gl'));
const quads = await fetch(new URL('./assets/cockpit.json', import.meta.url)).then(r => r.json());
await new Promise(r => { const im = $('cockpit'); if (im.complete) r(); else { im.onload = r; im.onerror = r; } });
$('load').classList.add('hide');

// ── 조종석 그림에 화면들을 맞춰 붙인다(네 귀 → 원근 변환)
function homography(w, h, q) {
  const s = [[0, 0], [w, 0], [w, h], [0, h]], A = [], b = [];
  for (let i = 0; i < 4; i++) { const [x, y] = s[i], [u, v] = q[i]; A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u); A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v); }
  for (let i = 0; i < 8; i++) { let p = i; for (let j = i + 1; j < 8; j++) if (Math.abs(A[j][i]) > Math.abs(A[p][i])) p = j; [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
    for (let j = i + 1; j < 8; j++) { const f = A[j][i] / A[i][i]; for (let k = i; k < 8; k++) A[j][k] -= f * A[i][k]; b[j] -= f * b[i]; } }
  const x = Array(8).fill(0); for (let i = 7; i >= 0; i--) { let t = b[i]; for (let k = i + 1; k < 8; k++) t -= A[i][k] * x[k]; x[i] = t / A[i][i]; }
  const [a, bb, c, d, e, f, g, hh] = x; return `matrix3d(${a},${d},0,${g},${bb},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
}
const SCR = { left: [$('left'), 620, 200], right: [$('right'), 470, 200], scope: [$('scope'), 260, 260], lever: [$('lever'), 70, 300] };
let flat = false, FW = 16, FH = 9;
function layout() {
  const vw = innerWidth, vh = innerHeight; flat = vw / vh < 1.25; document.body.classList.toggle('flat', flat);
  if (flat) { for (const k in SCR) SCR[k][0].style.transform = ''; return; }
  FW = Math.max(vw, vh * 16 / 9); FH = FW * 9 / 16; const fr = $('frame'); fr.style.width = FW + 'px'; fr.style.height = FH + 'px';
  for (const k in SCR) { const [el, w, h] = SCR[k]; el.style.transform = homography(w, h, quads.screens[k].map(([u, v]) => [u * FW, v * FH])); }
}
layout(); addEventListener('resize', layout);

// ── 던질 것 고르기
const ICON = { star: '☀', planet: '🪐', ship: '🚀', probe: '⏱' };
let what = 'planet';
for (const id of Object.keys(OBJECTS)) { const b = document.createElement('button'); b.className = 'pick'; b.dataset.v = id; b.innerHTML = `<i>${ICON[id]}</i>${OBJECTS[id].name}`;
  b.onclick = () => { what = id; touched(); paintPicks(); }; $('picks').appendChild(b); }
const paintPicks = () => { for (const b of $('picks').children) b.classList.toggle('on', b.dataset.v === what); }; paintPicks();
const say = t => { $('say').textContent = t; };

// ── 거리 레버
let dist = 20;
const lever = $('lever'), knob = $('knob');
const paintLever = () => { const f = (dist - SHIP_MIN) / (SHIP_MAX - SHIP_MIN); knob.style.top = (12 + f * (300 - 34 - 24)) + 'px'; $('rateT').textContent = `거리: 검은 원의 ${Math.round(dist)}배`; };
function leverAt(e) { const r = lever.getBoundingClientRect(); const f = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); dist = SHIP_MIN + f * (SHIP_MAX - SHIP_MIN); bh.setDist(dist); paintLever(); touched(); }
lever.onpointerdown = e => { lever.setPointerCapture(e.pointerId); leverAt(e); lever.onpointermove = leverAt; };
lever.onpointerup = lever.onpointercancel = () => { lever.onpointermove = null; };
paintLever();

// ── 던지기와 날아가는 것들
const LOOK = { star: { r: .62, c: [1.0, .82, .5] }, planet: { r: .46, c: [.22, .5, .8] }, ship: { r: .2, c: [.72, .75, .8] }, probe: { r: .2, c: [.9, .72, .3] } };
const flying = [];          // { res, i, t, o(scene obj), trail:[], live, done }
let myClock = 0, prClock = null, prRate = 1;
function throwIt(w, aim, power, mine) {
  const res = simulate({ what: w, aim, power, shipDist: dist, mass: 1 }, { maxTurns: 3 });
  const path = res.path, T = path[path.length - 1].t;
  const dur = { plunge: 6, spiral: 11, torn: 11, fling: 8, orbit: 5.2 * Math.max(1, res.turns) }[res.outcome];
  const o = { kind: w, pos: bh.world(path[0].x, path[0].y), axis: new THREE_V3(), radius: LOOK[w].r, color: [...LOOK[w].c], fade: 1, glow: [0, 0, 0] };
  while (bh.objs.length >= 3) { const old = flying.shift(); bh.objs.splice(bh.objs.indexOf(old.o), 1); }
  bh.objs.push(o); const f = { res, i: 0, t: 0, rate: T / dur, o, trail: [], mine, w, slow: 1, hold: 0 }; flying.push(f);
  if (w === 'probe') { prClock = 0; }
  audio.whoosh(); return f;
}
class V3 { constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; } set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; } }
function THREE_V3() { return new V3(); }
function stepFlying(dt) {
  for (let k = flying.length - 1; k >= 0; k--) { const f = flying[k], p = f.res.path, o = f.o;
    if (f.live) {                                                               // 궤도에 오른 것은 끌림 그대로 계속 돈다
      const L = f.live; let left = dt * f.rate;
      while (left > 0) { const r = Math.hypot(L.x, L.y), h = Math.min(left, .004 * r * Math.sqrt(r / .5)); const a = -.5 / (r * r * r);
        L.vx += a * L.x * h / 2; L.vy += a * L.y * h / 2; L.x += L.vx * h; L.y += L.vy * h; const r2 = Math.hypot(L.x, L.y), a2 = -.5 / (r2 * r2 * r2); L.vx += a2 * L.x * h / 2; L.vy += a2 * L.y * h / 2; left -= h; }
      bh.world(L.x, L.y, o.pos); o.axis.set(0, 0, 0); f.age += dt; const r = Math.hypot(L.x, L.y), v = Math.min(.99, Math.hypot(L.vx, L.vy));
      if (f.w === 'probe') prRate = clockRate(r, v) / clockRate(dist, 0);
      if (f.age > 45) o.fade = Math.max(0, o.fade - dt * .5); if (o.fade <= 0) { remove(k); continue; }
      trail(f, L.x, L.y); continue;
    }
    f.t += dt * f.rate * f.slow; while (f.i < p.length - 2 && p[f.i + 1].t < f.t) f.i++;
    const a = p[f.i], b = p[Math.min(f.i + 1, p.length - 1)], u = b.t > a.t ? Math.min(1, Math.max(0, (f.t - a.t) / (b.t - a.t))) : 1;
    let x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u; const r = Math.hypot(x, y), st = a.stretch + (b.stretch - a.stretch) * u;
    const R0 = LOOK[f.w].r, half = Math.min(3.2, R0 * (st - 1) * .55), spiral = a.spiral;
    let ax = x / r, ay = y / r; if (spiral) { const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1; ax = dx / l; ay = dy / l; }
    o.radius = R0 / Math.sqrt(Math.min(st, 5)); bh.world(ax * half, ay * half, o.axis);
    if (f.res.freezes) {                                                        // 탐사선: 가장자리에서 멈춘 듯 붉어지며 흐려진다
      const q = Math.max(0, 1 - 1 / Math.max(r, 1.0001)); f.slow = Math.max(.012, Math.min(1, q * 2.2)); const red = 1 - Math.sqrt(q);
      o.color = [LOOK[f.w].c[0] + (1 - LOOK[f.w].c[0]) * red, LOOK[f.w].c[1] * (1 - red * .9), LOOK[f.w].c[2] * (1 - red)]; o.glow = [red * .9, red * .08, 0];
      if (r < 1.25) { const k2 = 1.25 / r; x *= k2; y *= k2; f.hold += dt; o.fade = Math.max(0, 1 - f.hold / 7); }
    }
    if (f.w === 'star' && st > 1.5) o.glow = [0, 0, 0];
    bh.world(x, y, o.pos); if (f.w === 'probe') prRate = a.clock + (b.clock - a.clock) * u;
    trail(f, x, y);
    const ended = f.t >= p[p.length - 1].t || (f.res.freezes && o.fade <= 0);
    if (!ended) continue;
    if (!f.judged) { f.judged = true; landed(f); }
    if (f.res.outcome === 'orbit') { const n = p.length - 1, dtp = p[n].t - p[n - 1].t || 1; f.live = { x: p[n].x, y: p[n].y, vx: (p[n].x - p[n - 1].x) / dtp, vy: (p[n].y - p[n - 1].y) / dtp }; f.age = 0; continue; }
    if (f.res.intoDisk) { bh.flare(Math.atan2(-y, x), Math.max(DISK_IN + .4, Math.min(r, DISK_OUT - 2)), f.w === 'star' ? 1.6 : .7); audio.rumble(); }
    remove(k);
  }
}
function remove(k) { const f = flying[k]; const i = bh.objs.indexOf(f.o); if (i >= 0) bh.objs.splice(i, 1); flying.splice(k, 1); if (f.w === 'probe' && !flying.some(g => g.w === 'probe')) prRate = 1; }
function trail(f, x, y) { const t = f.trail, l = t[t.length - 1]; if (!l || Math.hypot(l[0] - x, l[1] - y) > .25) { t.push([x, y]); if (t.length > 420) t.shift(); } }

// ── 의뢰
let mi = 0, mine = false, hid = null;
const note = (t, s) => { $('note').innerHTML = t + (s ? `<small>${s}</small>` : ''); $('note').classList.remove('hide'); };
function showMission() {
  if (mi >= MISSIONS.length) { note('자유롭게 던져 보세요', '거리 레버로 다가가면 빛이 더 심하게 휘어요'); return; }
  note('의뢰 ' + (mi + 1) + ' · ' + MISSIONS[mi].say);
  if (MISSIONS[mi].id === 'hidden') { hid = { beta: .05 + Math.random() * .1, dir: Math.random() * Math.PI * 2 }; bh.hidden(hid.beta, hid.dir, 1); say('블랙홀 뒤 어딘가에 밝은 별이 숨어 있어요. 보이는 자리를 눌러요.'); }
}
function why(i) { const w = $('why'); w.innerHTML = '<b>왜 그럴까?</b>' + WHY[i]; w.classList.add('show'); audio.chime(); setTimeout(() => w.classList.remove('show'), 7500); }
function win(m) { const i = mi; mi++; note('성공! ⭐'); setTimeout(() => why(m.why), 1200); setTimeout(() => { if (i === 2) { bh.hidden(0, 0, 0); hid = null; } showMission(); }, 9000); }
function landed(f) {
  say(f.res.says);
  if (!f.mine || mi >= MISSIONS.length) return; const m = MISSIONS[mi]; if (m.id === 'hidden') return;
  if (m.ok(f.res)) win(m); else setTimeout(() => say(m.tell(f.res) + ' 귀띔: ' + m.hint), 2600);
}
function touched() { if (!mine) { mine = true; audio.unlock(); syncSnd(); showMission(); } }

// ── 창밖을 끌어 던지기 / 눌러 찾기
const pad = $('pad'), hud = $('hud'), hc = hud.getContext('2d');
let drag = null, preview = null;
// 끄는 쪽이 던지는 쪽: 위 = 블랙홀 쪽으로 곧장, 옆 = 비스듬히. 길게 끌수록 세게.
const aimOf = d => { const H = innerHeight, dx = d.x - d.x0, dy = d.y - d.y0, len = Math.hypot(dx, dy); return { aim: Math.max(-1.55, Math.min(1.55, Math.atan2(dx, -dy))), power: Math.max(.06, Math.min(1, len / (H * .36))), len }; };
pad.onpointerdown = e => { pad.setPointerCapture(e.pointerId); drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }; touched(); };
pad.onpointermove = e => { if (!drag) return; drag.x = e.clientX; drag.y = e.clientY; const a = aimOf(drag); if (a.len > 14) { drag.dirty = true; } };
pad.onpointerup = e => { if (!drag) return; const a = aimOf(drag), d = drag; drag = null; preview = null;
  if (a.len <= 14) {                                                           // 톡 누름
    if (hid) { const tap = bh.tapAngle(e.clientX, e.clientY), q = { tap, hidden: hid, shipDist: dist, mass: 1 }; const m = MISSIONS[2];
      if (mi === 2 && m.ok(q)) { say('찾았어요! 별빛이 블랙홀 둘레로 휘어서 여기 보여요.'); win(m); } else if (mi === 2) say(m.tell(q) + ' 귀띔: ' + m.hint); }
    else say('창밖을 누른 채 끌었다 놓으면 끄는 쪽으로 던져요. 위는 블랙홀 쪽, 옆은 비스듬히. 길게 끌수록 세게.');
    return; }
  throwIt(what, a.aim, a.power, true); say(`${OBJECTS[what].name}을(를) 던졌어요…`); };
pad.onpointercancel = () => { drag = null; preview = null; };
function drawHud() {
  const dpr = Math.min(devicePixelRatio || 1, 2); if (hud.width !== Math.round(innerWidth * dpr)) { hud.width = Math.round(innerWidth * dpr); hud.height = Math.round(innerHeight * dpr); }
  hc.setTransform(dpr, 0, 0, dpr, 0, 0); hc.clearRect(0, 0, innerWidth, innerHeight);
  if (!drag) return; const a = aimOf(drag); if (a.len <= 14) return;
  if (drag.dirty) { drag.dirty = false; preview = simulate({ what, aim: a.aim, power: a.power, shipDist: dist, mass: 1 }, { maxTurns: 1 }); }
  const [bx, by] = bh.bhPx(), x0 = innerWidth / 2, y0 = flat ? innerHeight * .6 : innerHeight * .715, L = innerHeight * (.08 + .3 * a.power);
  const x1 = x0 + Math.sin(a.aim) * L, y1 = y0 - Math.cos(a.aim) * L * .8;
  const g = hc.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, 'rgba(120,230,255,0)'); g.addColorStop(1, 'rgba(120,230,255,.9)');
  hc.strokeStyle = g; hc.lineWidth = 3; hc.setLineDash([10, 8]); hc.beginPath(); hc.moveTo(x0, y0); hc.lineTo(x1, y1); hc.stroke(); hc.setLineDash([]);
  hc.fillStyle = 'rgba(160,240,255,.95)'; hc.beginPath(); hc.arc(x1, y1, 6, 0, 7); hc.fill();
  hc.font = '700 15px system-ui'; hc.textAlign = 'center'; hc.fillText('세기 ' + Math.round(a.power * 100), x1, y1 - 14);
}

// ── 가운데 둥근 화면(위에서 본 판)
const sc = $('scope'), sx = sc.getContext('2d');
function drawScope() {
  const S = 260, c = S / 2, span = Math.max(dist * 1.12, 15), k = (c - 8) / span; sx.clearRect(0, 0, S, S);
  sx.fillStyle = 'rgba(0,18,24,.55)'; sx.beginPath(); sx.arc(c, c, c, 0, 7); sx.fill();
  sx.strokeStyle = 'rgba(90,220,255,.16)'; sx.lineWidth = 1; for (const r of [10, 20, 30, 40]) { if (r > span) break; sx.beginPath(); sx.arc(c, c, r * k, 0, 7); sx.stroke(); }
  const g = sx.createRadialGradient(c, c, DISK_IN * k, c, c, DISK_OUT * k); g.addColorStop(0, 'rgba(255,225,170,.95)'); g.addColorStop(.35, 'rgba(255,150,50,.7)'); g.addColorStop(1, 'rgba(255,90,20,0)');
  sx.fillStyle = g; sx.beginPath(); sx.arc(c, c, DISK_OUT * k, 0, Math.PI * 2); sx.closePath(); sx.moveTo(c + DISK_IN * k, c); sx.arc(c, c, DISK_IN * k, 0, Math.PI * 2, true); sx.closePath(); sx.fill('evenodd');
  sx.fillStyle = '#000'; sx.beginPath(); sx.arc(c, c, Math.max(2.5, k), 0, 7); sx.fill(); sx.strokeStyle = 'rgba(255,255,255,.35)'; sx.setLineDash([2, 3]); sx.beginPath(); sx.arc(c, c, CAPTURE * k, 0, 7); sx.stroke(); sx.setLineDash([]);
  const P = (x, y) => [c + x * k, c - y * k];
  if (preview) { sx.strokeStyle = 'rgba(160,240,255,.75)'; sx.lineWidth = 1.5; sx.setLineDash([4, 4]); sx.beginPath(); preview.path.forEach((p, i) => { if (i % 3) return; const [x, y] = P(p.x, p.y); i ? sx.lineTo(x, y) : sx.moveTo(x, y); }); sx.stroke(); sx.setLineDash([]); }
  for (const f of flying) { const col = f.w === 'star' ? '255,220,140' : f.w === 'planet' ? '110,190,255' : f.w === 'probe' ? '255,200,90' : '220,230,240';
    sx.strokeStyle = `rgba(${col},.55)`; sx.lineWidth = 1.5; sx.beginPath(); f.trail.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? sx.lineTo(x, y) : sx.moveTo(x, y); }); sx.stroke();
    const l = f.trail[f.trail.length - 1]; if (l) { const [x, y] = P(l[0], l[1]); sx.fillStyle = `rgb(${col})`; sx.beginPath(); sx.arc(x, y, f.w === 'star' ? 5 : 3.5, 0, 7); sx.fill(); } }
  const [ux, uy] = P(dist, 0); sx.fillStyle = '#bff3ff'; sx.beginPath(); sx.moveTo(ux - 9, uy); sx.lineTo(ux + 5, uy - 6); sx.lineTo(ux + 5, uy + 6); sx.fill();
}

// ── 시계
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); };
function clocks(dt) { myClock += dt; $('cMe').textContent = fmt(myClock);
  if (prClock === null) { $('cPr').textContent = '--:--.-'; return; }
  prClock += dt * prRate; $('cPr').textContent = fmt(prClock); if (flying.some(f => f.w === 'probe')) $('rateT').textContent = `탐사선 시계 ×${prRate.toFixed(2)}`; }

// ── 뒤로 별 지나가게
let pass = null;
$('pass').onclick = () => { touched(); if (hid) return; pass = { t: 0 }; say('블랙홀 뒤로 별 하나가 지나가요. 하나가 둘로, 그러다 고리로…'); };
function stepPass(dt) { if (!pass) return; pass.t += dt; const u = pass.t / 16; if (u >= 1) { pass = null; bh.hidden(0, 0, 0); return; }
  const beta = (u - .5) * 1.0; bh.hidden(Math.abs(beta) < 1e-3 ? 1e-3 : Math.abs(beta), beta < 0 ? Math.PI : 0, Math.min(1, Math.min(u, 1 - u) * 8)); }

// ── 소리(작게, 전부 합성)
const audio = (() => { let ctx, master, nb, on = true;
  const ok = () => on && ctx && ctx.state === 'running';
  function ensure() { if (ctx) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
    nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const ch = nb.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    for (const [f, v] of [[41, .16], [61.5, .07], [82.4, .035]]) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; g.gain.value = v; const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = .07 + Math.random() * .1; lg.gain.value = v * .5; l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(master); o.start(); l.start(); } }
  const nz = () => { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; return s; };
  return { unlock() { ensure(); if (ctx && ctx.state !== 'running') ctx.resume(); }, set(v) { on = v; if (master) master.gain.value = v ? .5 : 0; }, get on() { return on; }, get running() { return !!ctx && ctx.state === 'running'; },
    whoosh() { if (!ok()) return; const t = ctx.currentTime, n = nz(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(220, t + .9);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .05); g.gain.exponentialRampToValueAtTime(.001, t + 1); n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + 1.1); },
    rumble() { if (!ok()) return; const t = ctx.currentTime, n = nz(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'lowpass'; f.frequency.value = 140; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9, t + .3); g.gain.exponentialRampToValueAtTime(.001, t + 3.5); n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t + 3.6); },
    chime() { if (!ok()) return; const t = ctx.currentTime; [660, 990, 1320].forEach((fq, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = fq; g.gain.setValueAtTime(0, t + i * .1); g.gain.linearRampToValueAtTime(.14, t + i * .1 + .01); g.gain.exponentialRampToValueAtTime(.001, t + i * .1 + .8); o.connect(g); g.connect(master); o.start(t + i * .1); o.stop(t + i * .1 + .9); }); } }; })();
const syncSnd = () => { $('snd').textContent = audio.running && audio.on ? '🔊 소리' : '🔇 소리 켜기'; };
$('snd').onclick = () => { if (!audio.running) { audio.unlock(); audio.set(true); } else audio.set(!audio.on); setTimeout(syncSnd, 60); };

// ── 손대지 않아도 돌아가는 장면: 가끔 스스로 던진다
const DEMO = [['star', .62, .50], ['planet', 1.57, .50], ['ship', .25, .45], ['star', 1.1, .46], ['ship', .6, .9]];
let demoT = 3.5, demoI = 0;
function demo(dt) { if (mine) return; demoT -= dt; if (demoT > 0) return; const [w, a, p] = DEMO[demoI++ % DEMO.length]; const f = throwIt(w, a, p, false); demoT = 9 + Math.random() * 4; }

let last = performance.now();
function tick(dt) { demo(dt); stepFlying(dt); stepPass(dt); clocks(dt); drawScope(); drawHud(); bh.render(dt); }
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; tick(dt); bh.tune(dt); requestAnimationFrame(frame); }
if (qp.get('shot')) { window.__w = { bh, run(sec, script) { const dt = 1 / 30; let t = 0; while (t < sec) { for (const s of script || []) if (!s.done && t >= s.at) { s.done = 1; if (s.throw) throwIt(...s.throw, false); if (s.dist) { dist = s.dist; bh.setDist(dist); paintLever(); } if (s.pass) pass = { t: s.pass }; if (s.ui) touched(); } demoT = 99; stepFlying(dt); stepPass(dt); clocks(dt); if (t + dt >= sec) { drawScope(); bh.render(dt); } else bh.U.uTime.value += dt; t += dt; } return flying.map(f => f.res.outcome + ':' + f.w); } }; tick(1 / 30); document.title = 'ready'; }
else requestAnimationFrame(frame);
</script>

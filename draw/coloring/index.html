<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>색칠 놀이 — 케이아트</title>
<style>
:root{--bg:#FFF9EF;--panel:#FFFFFF;--border:#EADFC8;--ink:#2B2622;--sub:#8A7F6B;--primary:#F59E0B;--primary-light:#FEF3D8;--good:#22A06B;
--kedu-title:'Jua',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}
.tb-title{font-family:var(--kedu-title);font-size:20px}
.tb-spacer{flex:1}
.tb-btn{height:42px;min-width:42px;padding:0 14px;border:1.5px solid var(--border);background:var(--panel);border-radius:12px;color:var(--sub);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tb-btn:active{transform:scale(.96)}
.tb-btn.prim{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.g-scroll{flex:1;overflow-y:auto;padding:18px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;max-width:1100px;margin:0 auto}
.c-card{background:var(--panel);border:1.5px solid var(--border);border-radius:18px;padding:12px;text-align:center;transition:transform .14s;position:relative}
.c-card:active{transform:scale(.97)}
.c-card svg{width:100%;height:auto;border-radius:12px;background:#fff}
.c-title{font-family:var(--kedu-title);font-size:17px;margin-top:8px}
.c-badge{position:absolute;top:16px;right:16px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:3px 8px}
.c-badge.full{background:var(--good)}
.intro{max-width:1100px;margin:0 auto 14px;background:linear-gradient(120deg,#FFD873,#FFB4C0);border-radius:18px;padding:16px 20px}
.intro h1{font-family:var(--kedu-title);font-size:22px}
.intro p{font-size:14px;color:#5C4A2A;margin-top:4px}
/* 색칠 화면 */
.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.stage-wrap svg{max-width:100%;max-height:100%;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(90,70,20,.10);touch-action:manipulation}
.stage-wrap svg .part{cursor:pointer}
.palbar{flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;align-items:center}
.chip{width:46px;height:46px;border-radius:50%;border:3px solid rgba(0,0,0,.12);flex-shrink:0;position:relative}
.chip.on{border-color:var(--ink);transform:scale(1.12)}
.chip.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.chip.eraser{background:#fff;border:3px dashed #C9BCA0;font-size:20px;display:flex;align-items:center;justify-content:center}
.chip.eraser.on{border-color:var(--ink)}
.chip.eraser.on::after{content:''}
/* 완성 */
#done-ov{position:fixed;inset:0;background:rgba(43,38,34,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.d-card{background:#fff;border-radius:24px;padding:26px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.d-big{font-family:var(--kedu-title);font-size:30px}
.d-sub{color:var(--sub);margin:8px 0 16px}
.d-btns{display:flex;gap:10px;justify-content:center}
.d-btns button{height:48px;padding:0 20px;border-radius:14px;font-size:16px;border:1.5px solid var(--border);color:var(--sub);background:#fff}
.d-btns .prim{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.confetti{position:fixed;top:-14px;width:11px;height:15px;border-radius:3px;z-index:60;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(108vh) rotate(560deg)}}
@media (max-width:640px){.topbar{padding:0 8px;gap:6px}.tb-btn{padding:0 10px;font-size:13px}.tb-title{font-size:17px}.chip{width:42px;height:42px}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="/kedu_ga.js" defer></script>
</head>
<body>

<!-- ═══ 갤러리 ═══ -->
<div class="screen" id="scr-gallery">
  <div class="topbar">
    <div class="tb-title">🖍️ 색칠 놀이</div>
    <div class="tb-spacer"></div>
    <a class="tb-btn" href="/draw/masterpiece/" style="text-decoration:none">🖼️ 명화 칠하기</a>
    <a class="tb-btn" href="/draw/" style="text-decoration:none">🎨 자유 그리기</a>
  </div>
  <div class="g-scroll">
    <div class="intro">
      <h1>좋아하는 색으로 마음껏 칠해요</h1>
      <p>번호도, 정답도 없어요. 색을 고르고 칸을 톡! — 1~2학년도 혼자 할 수 있어요.</p>
    </div>
    <div class="g-grid" id="g-grid"></div>
  </div>
</div>

<!-- ═══ 색칠 ═══ -->
<div class="screen hidden" id="scr-paint">
  <div class="topbar">
    <button class="tb-btn" id="btn-back">← 그림 고르기</button>
    <div class="tb-title" id="p-title"></div>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="btn-undo" title="한 칸 되돌리기">↩</button>
    <button class="tb-btn" id="btn-reset" title="처음부터 다시">🗑</button>
    <button class="tb-btn prim" id="btn-done">다 했어요!</button>
  </div>
  <div class="stage-wrap" id="stage"></div>
  <div class="palbar" id="palbar"></div>
</div>

<!-- ═══ 완성 ═══ -->
<div id="done-ov" class="hidden">
  <div class="d-card">
    <div class="d-big">🎉 참 잘했어요!</div>
    <div class="d-sub" id="d-sub"></div>
    <div class="d-btns">
      <button id="d-more">더 칠할래요</button>
      <button id="d-gallery">다른 그림</button>
      <button class="prim" id="d-save">⬇ 그림 저장</button>
    </div>
  </div>
</div>

":"M134,158 a66,62 0 1,0 132,0 a66,62 0 1,0 -132,0 Z"},{"n":"모자 챙","d":"M148,92 L252,92 Q260,92 260,100 L260,100 Q260,108 252,108 L148,108 Q140,108 140,100 L140,100 Q140,92 148,92 Z"},{"n":"모자 통","d":"M166,34 L234,34 Q242,34 242,42 L242,88 Q242,96 234,96 L166,96 Q158,96 158,88 L158,42 Q158,34 166,34 Z"},{"n":"목도리","d":"M155,206 L245,206 Q258,206 258,219 L258,219 Q258,232 245,232 L155,232 Q142,232 142,219 L142,219 Q142,206 155,206 Z"},{"n":"목도리 자락","d":"M236,222 L242,222 Q252,222 252,232 L252,264 Q252,274 242,274 L236,274 Q226,274 226,264 L226,232 Q226,222 236,222 Z"},{"n":"코(당근)","d":"M208,162 L258,172 L208,182 Z"},{"n":"단추1","d":"M191,258 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 Z"},{"n":"단추2","d":"M191,292 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 Z"},{"n":"단추3","d":"M191,326 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 Z"},{"n":"눈송이1","d":"M59,110 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0 Z"},{"n":"눈송이2","d":"M321,90 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 Z"},{"n":"눈송이3","d":"M338,190 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 Z"},{"n":"눈송이4","d":"M48,220 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 Z"}],"deco":[{"d":"M173,148 a7,8 0 1,0 14,0 a7,8 0 1,0 -14,0 Z","k":"f"},{"d":"M215,148 a7,8 0 1,0 14,0 a7,8 0 1,0 -14,0 Z","k":"f"},{"d":"M182,190 Q200,200 218,190","k":"l"},{"d":"M112,240 L52,196","k":"l"},{"d":"M288,240 L348,196","k":"l"}]},{"id":"dino","title":"공룡","emoji":"🦖","parts":[{"n":"꼬리","d":"M130,286 L40,334 L134,330 Z"},{"n":"목·머리","d":"M256,232 C249,215 248,155 252,132 C256,109 270,97 282,92 C294,87 317,92 322,102 C327,112 314,128 310,150 C306,172 305,218 296,232 C287,246 263,249 256,232 Z"},{"n":"몸","d":"M126,272 C138,251 183,211 210,204 C237,197 271,216 286,232 C301,248 311,282 302,300 C293,318 257,333 230,338 C203,343 157,343 140,332 C123,321 114,293 126,272 Z"},{"n":"배","d":"M168,286 C180,277 234,267 250,272 C266,277 274,305 262,314 C250,323 196,331 180,326 C164,321 156,295 168,286 Z"},{"n":"다리 앞","d":"M252,310 L260,310 Q272,310 272,322 L272,356 Q272,368 260,368 L252,368 Q240,368 240,356 L240,322 Q240,310 252,310 Z"},{"n":"다리 뒤","d":"M154,314 L162,314 Q174,314 174,326 L174,358 Q174,370 162,370 L154,370 Q142,370 142,358 L142,326 Q142,314 154,314 Z"},{"n":"반점1","d":"M169,246 a15,12 0 1,0 30,0 a15,12 0 1,0 -30,0 Z"},{"n":"반점2","d":"M225,240 a13,11 0 1,0 26,0 a13,11 0 1,0 -26,0 Z"},{"n":"반점3","d":"M147,278 a11,9 0 1,0 22,0 a11,9 0 1,0 -22,0 Z"},{"n":"풀1","d":"M60,368 L72,336 L84,368 Z"},{"n":"풀2","d":"M320,368 L332,338 L344,368 Z"}],"deco":[{"d":"M289,112 a7,8 0 1,0 14,0 a7,8 0 1,0 -14,0 Z","k":"f"},{"d":"M318,126 Q308,136 296,132","k":"l"}]}];
const BASE='#FFFFFF';
function newState(dw){return{id:dw.id,fills:new Array(dw.parts.length).fill(BASE),undo:[]}}
function fill(st,idx,color){
  if(idx<0||idx>=st.fills.length)return false;
  if(st.fills[idx]===color)return false;
  st.undo.push({i:idx,c:st.fills[idx]});
  if(st.undo.length>200)st.undo.shift();
  st.fills[idx]=color;return true;
}
function undo(st){
  const u=st.undo.pop();
  if(!u)return -1;
  st.fills[u.i]=u.c;return u.i;
}
function reset(st){st.fills.fill(BASE);st.undo.length=0}
function painted(st){return st.fills.filter(c=>c!==BASE).length}
function pct(st){return Math.round(painted(st)/st.fills.length*100)}
function serialize(st){return JSON.stringify({f:st.fills})}
function restore(dw,s){
  try{const o=JSON.parse(s);
    if(!o||!Array.isArray(o.f)||o.f.length!==dw.parts.length)return null;
    const st=newState(dw);
    st.fills=o.f.map(c=>/^#[0-9A-Fa-f]{6}$/.test(c)?c:BASE);
    return st;
  }catch(e){return null}
}
return{DRAWINGS,BASE,newState,fill,undo,reset,painted,pct,serialize,restore};
})();

<script>
const KCL=window.KCL,$=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const PALETTE=['#E63946','#F77F52','#FFB703','#FFE066','#8AC926','#40916C','#48CAE4','#1982C4','#5E60CE','#9D6BC9','#F49CBB','#FF8FA3','#A9714B','#6F4518','#4A4E69','#2B2622'];
const INK='#2B2622',SW=6;
const state={dw:null,st:null,color:PALETTE[0],parts:[]};

const skey=id=>'kclv1:'+id;
function save(){try{localStorage.setItem(skey(state.dw.id),KCL.serialize(state.st))}catch(e){}}
function load(dw){try{const s=localStorage.getItem(skey(dw.id));return s?KCL.restore(dw,s):null}catch(e){return null}}

function makeSVG(dw,interactive){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 400 400');
  const bgr=document.createElementNS(NS,'rect');
  bgr.setAttribute('x',0);bgr.setAttribute('y',0);bgr.setAttribute('width',400);bgr.setAttribute('height',400);bgr.setAttribute('fill','#FFFFFF');
  svg.appendChild(bgr);
  const parts=[];
  dw.parts.forEach((p,i)=>{
    const el=document.createElementNS(NS,'path');
    el.setAttribute('d',p.d);el.setAttribute('fill',KCL.BASE);
    el.setAttribute('stroke',INK);el.setAttribute('stroke-width',SW);
    el.setAttribute('stroke-linejoin','round');
    if(interactive){el.classList.add('part');el.dataset.i=i}
    svg.appendChild(el);parts.push(el);
  });
  dw.deco.forEach(dd=>{
    const el=document.createElementNS(NS,'path');
    el.setAttribute('d',dd.d);
    if(dd.k==='f'){el.setAttribute('fill',INK)}
    else{el.setAttribute('fill','none');el.setAttribute('stroke',INK);el.setAttribute('stroke-width',SW);el.setAttribute('stroke-linecap','round')}
    el.style.pointerEvents='none';
    svg.appendChild(el);
  });
  return{svg,parts};
}

/* ── 갤러리 ── */
function buildGallery(){
  const grid=$('g-grid');grid.innerHTML='';
  for(const dw of KCL.DRAWINGS){
    const card=document.createElement('button');card.className='c-card';card.dataset.id=dw.id;
    const{svg,parts}=makeSVG(dw,false);
    const st=load(dw);
    if(st)st.fills.forEach((c,i)=>parts[i].setAttribute('fill',c));
    card.appendChild(svg);
    const t=document.createElement('div');t.className='c-title';t.textContent=dw.emoji+' '+dw.title;
    card.appendChild(t);
    if(st&&KCL.painted(st)>0){
      const b=document.createElement('div');
      const p=KCL.pct(st);
      b.className='c-badge'+(p>=100?' full':'');b.textContent=p>=100?'✓ 다 칠했어요':p+'%';
      card.appendChild(b);
    }
    grid.appendChild(card);
  }
}
$('g-grid').addEventListener('click',e=>{
  const c=e.target.closest('.c-card');
  if(c)open_(KCL.DRAWINGS.find(d=>d.id===c.dataset.id));
});

/* ── 색칠 ── */
function open_(dw){
  state.dw=dw;
  state.st=load(dw)||KCL.newState(dw);
  $('p-title').textContent=dw.emoji+' '+dw.title;
  const wrap=$('stage');wrap.innerHTML='';
  const{svg,parts}=makeSVG(dw,true);
  state.parts=parts;
  state.st.fills.forEach((c,i)=>parts[i].setAttribute('fill',c));
  svg.addEventListener('click',e=>{
    const t=e.target.closest('.part');
    if(!t)return;
    const i=+t.dataset.i;
    if(KCL.fill(state.st,i,state.color)){
      parts[i].setAttribute('fill',state.color);
      pop(parts[i]);save();
    }
  });
  wrap.appendChild(svg);
  $('scr-gallery').classList.add('hidden');$('scr-paint').classList.remove('hidden');
}
function pop(el){el.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:180,transformOrigin:'center'})}

/* ── 팔레트 ── */
function buildPal(){
  const bar=$('palbar');bar.innerHTML='';
  PALETTE.forEach(c=>{
    const b=document.createElement('button');b.className='chip'+(c===state.color?' on':'');
    b.style.background=c;b.dataset.c=c;bar.appendChild(b);
  });
  const er=document.createElement('button');er.className='chip eraser';er.dataset.c=KCL.BASE;er.textContent='🧽';
  bar.appendChild(er);
  bar.addEventListener('click',e=>{
    const b=e.target.closest('.chip');
    if(!b)return;
    state.color=b.dataset.c;
    bar.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
  });
}

/* ── 버튼 ── */
$('btn-back').onclick=()=>{$('scr-paint').classList.add('hidden');$('scr-gallery').classList.remove('hidden');buildGallery()};
$('btn-undo').onclick=()=>{
  const i=KCL.undo(state.st);
  if(i>=0){state.parts[i].setAttribute('fill',state.st.fills[i]);save()}
};
$('btn-reset').onclick=()=>{
  if(!confirm('처음부터 다시 칠할까요?'))return;
  KCL.reset(state.st);
  state.parts.forEach(p=>p.setAttribute('fill',KCL.BASE));save();
};
$('btn-done').onclick=()=>{
  $('d-sub').textContent=state.dw.title+' — '+KCL.painted(state.st)+'칸을 칠했어요';
  $('done-ov').classList.remove('hidden');confetti();
};
$('d-more').onclick=()=>$('done-ov').classList.add('hidden');
$('d-gallery').onclick=()=>{$('done-ov').classList.add('hidden');$('btn-back').onclick()};
$('d-save').onclick=savePNG;

function confetti(){
  for(let i=0;i<40;i++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=PALETTE[i%PALETTE.length];
    d.style.animationDuration=(2+Math.random()*1.6)+'s';
    d.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4200);
  }
}
function savePNG(){
  const src=$('stage').querySelector('svg');
  const xml=new XMLSerializer().serializeToString(src);
  const img=new Image();
  img.onload=()=>{
    const S=2,cv=document.createElement('canvas');cv.width=800;cv.height=800;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,800,800);
    ctx.drawImage(img,0,0,800,800);
    const a=document.createElement('a');
    a.download='색칠놀이_'+state.dw.title+'.png';
    a.href=cv.toDataURL('image/png');a.click();
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
}

buildPal();buildGallery();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>케이아트 명화 | K-edu</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style id="kedu-title-font">
@font-face{font-family:'Hakgyoansim Moheomga';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2402_keris@main/TTHakgyoansimMoheomgaB.woff2') format('woff2');font-display:swap}
:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}
</style>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#5B8EF8;--primary-light:#EBF4FF;--pink:#FF85A1;
  --bg:#EEF1F7;--panel:#fff;--ink:#1A202C;--sub:#718096;--faint:#A0AEC0;--border:#E7ECF3;
  --shadow:0 2px 14px rgba(33,52,94,.08);--shadow-lg:0 10px 36px rgba(33,52,94,.16);
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button{font-family:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.hidden{display:none!important}

/* ── 공통 탑바 ── */
.topbar{height:58px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;z-index:20}
.logo{font-family:var(--kedu-title);font-size:20px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex-shrink:0}
.logo .kk{background:linear-gradient(135deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo .badge{font-family:var(--kedu-title);font-size:12.5px;background:var(--primary-light);color:var(--primary);padding:2px 11px;border-radius:50px}
.tb-spacer{flex:1}
.tb-btn{height:38px;min-width:38px;padding:0 13px;border:1.5px solid var(--border);background:var(--panel);border-radius:11px;color:var(--sub);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .14s;white-space:nowrap}
.tb-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

/* ── 갤러리 ── */
#scr-gallery .g-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.g-wrap{max-width:1060px;margin:0 auto;padding:26px 18px 70px}
.hero{text-align:center;margin:14px 0 26px}
.hero h1{font-family:var(--kedu-title);font-size:clamp(26px,5vw,40px);line-height:1.25}
.hero h1 .grad{background:linear-gradient(120deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--sub);font-size:14.5px;margin-top:8px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.art-card{background:var(--panel);border:1.5px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s;display:flex;flex-direction:column}
.art-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.art-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#fff;border-bottom:1px solid var(--border)}
.art-thumb.tall{aspect-ratio:4/3;object-fit:cover}
.art-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.art-title{font-family:var(--kedu-title);font-size:17px;line-height:1.3}
.art-artist{font-size:12.5px;color:var(--sub);margin-top:2px}
.lv-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.lv-chip{border:1.5px solid var(--border);background:var(--panel);border-radius:50px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--sub);transition:all .13s;position:relative}
.lv-chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.lv-chip.lv3:hover{border-color:#E8863A;color:#E8863A;background:#FFF4EB}
.lv-chip.lv4{border-color:#F3D9E2;color:#C94F7C}
.lv-chip.lv4:hover{border-color:#C94F7C;background:#FDF0F5}
.lv-chip .pct{position:absolute;top:-7px;right:-6px;background:var(--primary);color:#fff;font-size:9.5px;padding:1px 6px;border-radius:50px;font-weight:900}
.lv-chip .pct.full{background:#2FB477}

/* 사진 카드 */
.photo-card{grid-column:1/-1;background:linear-gradient(120deg,#5B8EF8 0%,#7AA6FF 55%,#FF85A1 130%);border-radius:22px;padding:22px 24px;color:#fff;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(91,142,248,.32);cursor:pointer;border:none;transition:transform .16s}
.photo-card:hover{transform:translateY(-2px)}
.photo-card .pc-emoji{font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.photo-card .pc-txt{flex:1;min-width:200px;text-align:left}
.photo-card .pc-title{font-family:var(--kedu-title);font-size:21px}
.photo-card .pc-sub{font-size:13px;opacity:.92;margin-top:4px;line-height:1.5}
.photo-card .pc-btn{background:#fff;color:var(--primary);font-family:var(--kedu-title);font-size:15px;border:none;border-radius:13px;padding:12px 20px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.pc-priv{font-size:11.5px;opacity:.85;margin-top:5px}

/* ── 단계 선택 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,55,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border-radius:24px;padding:24px;width:min(430px,100%);box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:var(--kedu-title);font-size:20px;margin-bottom:3px}
.modal .m-sub{font-size:13px;color:var(--sub);margin-bottom:16px}
.lv-btn{display:flex;align-items:center;gap:13px;width:100%;border:1.5px solid var(--border);background:var(--panel);border-radius:16px;padding:13px 15px;margin-bottom:9px;transition:all .13s;text-align:left}
.lv-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.lv-btn .lb-ico{font-size:24px;flex-shrink:0}
.lv-btn .lb-name{font-family:var(--kedu-title);font-size:16px}
.lv-btn .lb-desc{font-size:12px;color:var(--sub);margin-top:2px}
.lv-btn .lb-right{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:700;flex-shrink:0}
.lv-btn .lb-resume{color:var(--primary)}
.m-close{width:100%;border:none;background:var(--bg);border-radius:13px;padding:11px;color:var(--sub);font-size:14px;margin-top:4px}

/* ── 칠하기 화면 ── */
#scr-paint{background:#E4E9F2}
.p-title{font-family:var(--kedu-title);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.p-prog{display:flex;align-items:center;gap:8px;flex-shrink:0}
.p-bar{width:90px;height:9px;background:var(--border);border-radius:50px;overflow:hidden}
.p-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--pink));border-radius:50px;transition:width .3s}
.p-pct{font-size:12.5px;font-weight:900;color:var(--primary);min-width:36px;text-align:right}
#stage-wrap{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#stage-wrap.dragging{cursor:grabbing}
#stage{width:100%;height:100%;display:block}
#stage .rg{stroke:#C3CBD9;stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .18s}
#stage .rg.sel-hi{fill:#E3EDFF}
#stage .rg.wrongf{fill:#F8C7C7!important}
#stage .rg.justfilled{animation:fillpop .3s ease}
@keyframes fillpop{0%{opacity:.35}100%{opacity:1}}
#stage.done-anim .rg{stroke:transparent;transition:stroke 1.1s ease}
#stage.done-anim text{opacity:0;transition:opacity .9s ease}
#stage text{font-family:'Noto Sans KR',sans-serif;font-weight:700;fill:#7C8698;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
/* 로딩 오버레이 */
#proc{position:absolute;inset:0;background:rgba(238,241,247,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
#proc .pr-emoji{font-size:46px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#proc .pr-txt{font-family:var(--kedu-title);font-size:17px;color:var(--ink)}
#proc .pr-sub{font-size:12.5px;color:var(--sub)}
#proc .pr-bar{width:min(300px,70vw);height:10px;background:#fff;border:1px solid var(--border);border-radius:50px;overflow:hidden}
#proc .pr-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--pink));transition:width .25s}
/* 팔레트 바 */
.pal-bar{background:var(--panel);border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex-shrink:0;display:flex;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pchip{flex-shrink:0;width:58px;border:2px solid var(--border);background:var(--panel);border-radius:15px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .13s;position:relative}
.pchip .sw{width:34px;height:34px;border-radius:11px;border:1px solid rgba(0,0,0,.1)}
.pchip .pn{font-size:12.5px;font-weight:900;color:var(--ink);line-height:1}
.pchip .rem{font-size:10px;color:var(--faint);font-weight:700;line-height:1}
.pchip.on{border-color:var(--primary);background:var(--primary-light);transform:translateY(-3px);box-shadow:0 6px 14px rgba(91,142,248,.25)}
.pchip.donec{opacity:.45}
.pchip.donec .rem{color:#2FB477}
.pchip.wiggle{animation:wig .3s ease}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ── 완성 오버레이 ── */
#done-ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#done-ov .d-card{pointer-events:auto;background:var(--panel);border-radius:26px 26px 0 0;box-shadow:0 -12px 44px rgba(33,52,94,.25);width:min(560px,100%);padding:24px 24px calc(22px + env(safe-area-inset-bottom));animation:slideup .5s cubic-bezier(.2,1.2,.4,1);text-align:center}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.d-big{font-family:var(--kedu-title);font-size:25px;background:linear-gradient(120deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.d-art{font-family:var(--kedu-title);font-size:17px;margin-top:10px}
.d-artist{font-size:13px;color:var(--sub);margin-top:3px}
.d-desc{font-size:13px;color:var(--sub);line-height:1.65;margin:12px auto 0;max-width:440px}
.d-btns{display:flex;gap:10px;margin-top:18px}
.d-btns button{flex:1;border-radius:14px;padding:13px;font-family:var(--kedu-title);font-size:15px;border:1.5px solid var(--border);background:var(--panel);color:var(--sub)}
.d-btns .prim{background:linear-gradient(120deg,var(--primary),#7AA6FF);color:#fff;border:none;box-shadow:0 6px 16px rgba(91,142,248,.3)}
.confetti{position:fixed;top:-14px;width:10px;height:14px;border-radius:3px;z-index:59;animation:cfall linear forwards;pointer-events:none}
@keyframes cfall{to{transform:translateY(108vh) rotate(680deg);opacity:.8}}

@media(max-width:640px){
  .g-wrap{padding:18px 13px 60px}
  .g-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .art-title{font-size:15px}
  .lv-chip{padding:4px 10px;font-size:11.5px}
  .p-bar{width:56px}
  .topbar{padding:0 10px;gap:7px}
  .tb-btn{padding:0 10px;font-size:13px}
}
</style>
<script src="/kedu_ga.js" defer></script>
</head>
<body>

<!-- ═══ 갤러리 ═══ -->
<div class="screen" id="scr-gallery">
  <div class="topbar">
    <a class="logo" href="/draw/"><span class="kk">K-edu</span> <span class="badge">케이아트 · 명화</span></a>
    <div class="tb-spacer"></div>
    <a class="tb-btn" href="/draw/" style="text-decoration:none">🎨 자유 그리기</a>
  </div>
  <div class="g-scroll"><div class="g-wrap">
    <div class="hero">
      <h1>번호를 따라 칠하면,<br><span class="grad">명화가 태어나요</span></h1>
      <p>칸마다 적힌 번호와 같은 색을 골라 칠해 보세요. 마지막 칸을 채우는 순간 작품이 완성돼요.</p>
    </div>
    <div class="g-grid" id="g-grid">
      <button class="photo-card" id="photo-card" type="button">
        <span class="pc-emoji">📷</span>
        <span class="pc-txt">
          <span class="pc-title">내 사진으로 명화 만들기</span>
          <span class="pc-sub" style="display:block">내 얼굴, 우리 강아지, 좋아하는 풍경 — 어떤 사진이든 번호 도안으로 바뀌어요.</span>
          <span class="pc-priv" style="display:block">🔒 사진은 서버로 전송되지 않아요. 이 기기 안에서만 처리돼요.</span>
        </span>
        <span class="pc-btn">사진 고르기</span>
      </button>
      <!-- 명화 카드: JS 생성 -->
    </div>
  </div></div>
</div>

<!-- ═══ 칠하기 ═══ -->
<div class="screen hidden" id="scr-paint">
  <div class="topbar">
    <button class="tb-btn" id="btn-back">← 갤러리</button>
    <div class="p-title" id="p-title"></div>
    <div class="tb-spacer"></div>
    <div class="p-prog"><div class="p-bar"><i id="p-bar-i"></i></div><span class="p-pct" id="p-pct">0%</span></div>
    <button class="tb-btn" id="btn-hint" title="지금 색으로 칠할 칸 찾아가기">🔍 찾기</button>
    <button class="tb-btn" id="btn-fit" title="전체 보기">⛶</button>
  </div>
  <div id="stage-wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="proc" class="hidden">
      <div class="pr-emoji">🖼️</div>
      <div class="pr-txt" id="pr-txt">도안을 만드는 중…</div>
      <div class="pr-sub" id="pr-sub"></div>
      <div class="pr-bar"><i id="pr-bar-i"></i></div>
    </div>
  </div>
  <div class="pal-bar" id="pal-bar"></div>
</div>

<!-- ═══ 완성 ═══ -->
<div id="done-ov" class="hidden">
  <div class="d-card">
    <div class="d-big" id="d-big">🎉 완성!</div>
    <div class="d-art" id="d-art"></div>
    <div class="d-artist" id="d-artist"></div>
    <div class="d-desc" id="d-desc"></div>
    <div class="d-btns">
      <button id="d-gallery">갤러리로</button>
      <button class="prim" id="d-save">⬇ 그림 저장</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="lv-modal">
  <div class="modal">
    <h2 id="lm-title"></h2>
    <div class="m-sub" id="lm-sub"></div>
    <div id="lm-list"></div>
    <button class="m-close" id="lm-close">닫기</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   KMP — 명화 도안 엔진 (순수 파이프라인, 테스트 대상)
   픽셀 → 팔레트 스냅 → 영역 라벨링 → 작은 영역 병합 →
   테두리 추적 → 단순화·부드럽게 → 번호 위치(POI)
   ════════════════════════════════════════════════════════════ */
window.KMP = (function(){

function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}

function nearestColor(r,g,b,pal){let bi=0,bd=Infinity;for(let i=0;i<pal.length;i++){const p=pal[i],dr=r-p[0],dg=g-p[1],db=b-p[2],d=dr*dr*2+dg*dg*4+db*db*3;if(d<bd){bd=d;bi=i}}return bi}

/* RGBA 버퍼 → 팔레트 인덱스 격자 */
function snapImage(data,W,H,pal){
  const idx=new Int16Array(W*H);
  for(let p=0,q=0;p<W*H;p++,q+=4)idx[p]=nearestColor(data[q],data[q+1],data[q+2],pal);
  return idx;
}

/* k-means 팔레트 추출 (사진용) — 밝기 분위수 초기화로 결정적 */
function kmeans(data,W,H,k,iters){
  iters=iters||12;
  const N=W*H,step=Math.max(1,Math.floor(N/9000)),samp=[];
  for(let p=0;p<N;p+=step){const q=p*4;samp.push([data[q],data[q+1],data[q+2]])}
  samp.sort((a,b)=>(a[0]*2+a[1]*4+a[2])-(b[0]*2+b[1]*4+b[2]));
  const cents=[];
  for(let i=0;i<k;i++){const s=samp[Math.min(samp.length-1,Math.floor((i+0.5)/k*samp.length))];cents.push([s[0],s[1],s[2]])}
  const sums=new Float64Array(k*3),cnts=new Int32Array(k);
  for(let it=0;it<iters;it++){
    sums.fill(0);cnts.fill(0);
    for(let s=0;s<samp.length;s++){
      const px=samp[s],ci=nearestColor(px[0],px[1],px[2],cents);
      sums[ci*3]+=px[0];sums[ci*3+1]+=px[1];sums[ci*3+2]+=px[2];cnts[ci]++;
    }
    for(let i=0;i<k;i++)if(cnts[i]>0){cents[i][0]=sums[i*3]/cnts[i];cents[i][1]=sums[i*3+1]/cnts[i];cents[i][2]=sums[i*3+2]/cnts[i]}
  }
  return cents.map(c=>[Math.round(c[0]),Math.round(c[1]),Math.round(c[2])]);
}

/* 4방향 연결 영역 라벨링 */
function labelRegions(idx,W,H){
  const labels=new Int32Array(W*H).fill(-1);
  const stack=new Int32Array(W*H);
  const regionColor=[],regionArea=[];
  let count=0;
  for(let s=0;s<W*H;s++){
    if(labels[s]!==-1)continue;
    const c=idx[s];let top=0;stack[top++]=s;labels[s]=count;let area=0;
    while(top>0){
      const p=stack[--top];area++;
      const x=p%W,y=(p-x)/W;
      if(x>0&&labels[p-1]===-1&&idx[p-1]===c){labels[p-1]=count;stack[top++]=p-1}
      if(x<W-1&&labels[p+1]===-1&&idx[p+1]===c){labels[p+1]=count;stack[top++]=p+1}
      if(y>0&&labels[p-W]===-1&&idx[p-W]===c){labels[p-W]=count;stack[top++]=p-W}
      if(y<H-1&&labels[p+W]===-1&&idx[p+W]===c){labels[p+W]=count;stack[top++]=p+W}
    }
    regionColor.push(c);regionArea.push(area);count++;
  }
  return{labels,count,regionColor,regionArea};
}

/* 작은 영역 병합 — 가장 작은 영역부터 색이 가장 비슷한 이웃에 흡수.
   minArea 미달이 없고 alive<=target이 될 때까지. */
function mergeRegions(lab,pal,opts){
  const{labels,count,regionColor,regionArea}=lab;
  const W=opts.W,H=opts.H,minArea=opts.minArea||0,target=opts.target||Infinity;
  const parent=new Int32Array(count);for(let i=0;i<count;i++)parent[i]=i;
  function find(i){while(parent[i]!==i){parent[i]=parent[parent[i]];i=parent[i]}return i}
  const area=Float64Array.from(regionArea);
  const color=Int16Array.from(regionColor);
  const adj=new Array(count);
  for(let i=0;i<count;i++)adj[i]=new Map();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){

  }
  function canon(r){ /* 인접표를 현재 루트 기준으로 정리 */

  const heap=[];

/* 영역 테두리 추적 — 격자 모서리를 시계 방향 유향 간선으로 잇는다.
   꼭짓점에서 갈림길이면 오른쪽 회전 우선(핀치 지점 분리). */
function traceAll(flabels,W,H,nRegions){
  const maps=new Array(nRegions);
  for(let i=0;i<nRegions;i++)maps[i]=new Map();
  const VW=W+1;
  function addEdge(r,k1,k2){const m=maps[r];let arr=m.get(k1);if(!arr){arr=[];m.set(k1,arr)}arr.push(k2)}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const p=y*W+x,r=flabels[p];
    if(y===0||flabels[p-W]!==r)addEdge(r,y*VW+x,y*VW+x+1);
    if(x===W-1||flabels[p+1]!==r)addEdge(r,y*VW+x+1,(y+1)*VW+x+1);
    if(y===H-1||flabels[p+W]!==r)addEdge(r,(y+1)*VW+x+1,(y+1)*VW+x);
    if(x===0||flabels[p-1]!==r)addEdge(r,(y+1)*VW+x,y*VW+x);
  }
  const TURN_SCORE=[2,3,0,1]; /* 직진2 우회전3 후진0 좌회전1 */
  function dirOf(dx,dy){return dx===1?0:(dy===1?1:(dx===-1?2:3))}
  const loopsPer=new Array(nRegions);
  for(let r=0;r<nRegions;r++){
    const m=maps[r],loops=[];
    for(const k0 of Array.from(m.keys())){
      let a0=m.get(k0);
      if(!a0||!a0.length)continue;
      const loop=[];let cur=k0,prevDir=-1,guard=0;
      while(guard++<400000){
        const a=m.get(cur);
        if(!a||!a.length)break;
        let pick=0;
        if(a.length>1&&prevDir>=0){
          let bs=-1;
          for(let i=0;i<a.length;i++){
            const nk=a[i],nx=nk%VW,ny=(nk-nx)/VW,cx=cur%VW,cy=(cur-cx)/VW;
            const d=dirOf(nx-cx,ny-cy),sc=TURN_SCORE[(d-prevDir+4)%4];
            if(sc>bs){bs=sc;pick=i}
          }
        }
        const nk=a[pick];a.splice(pick,1);if(!a.length)m.delete(cur);
        const cx=cur%VW,cy=(cur-cx)/VW,nx=nk%VW,ny=(nk-nx)/VW;
        prevDir=dirOf(nx-cx,ny-cy);
        loop.push(cx,cy);
        cur=nk;
        if(cur===k0)break;
      }
      if(loop.length>=8)loops.push(loop);
    }
    loopsPer[r]=loops;
  }
  return loopsPer;
}

/* 더글러스-포이커 단순화 (닫힌 루프) */
function rdp(loop,eps){
  const n=loop.length/2;
  if(n<6)return loop.slice();
  const keep=new Uint8Array(n);keep[0]=1;keep[n>>1]=1; /* 닫힘 대비 두 앵커 */
  const st=[[0,n>>1],[n>>1,n]];
  while(st.length){
    const[i0,i1]=st.pop();
    const ax=loop[i0*2],ay=loop[i0*2+1];
    const bi=i1%n,bx=loop[bi*2],by=loop[bi*2+1];
    const dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy||1;
    let md=-1,mi=-1;
    for(let i=i0+1;i<i1;i++){
      const px=loop[i*2]-ax,py=loop[i*2+1]-ay;
      const t=Math.max(0,Math.min(1,(px*dx+py*dy)/len2));
      const ex=px-t*dx,ey=py-t*dy,d=ex*ex+ey*ey;
      if(d>md){md=d;mi=i}
    }
    if(md>eps*eps){keep[mi]=1;st.push([i0,mi],[mi,i1])}
  }
  const out=[];
  for(let i=0;i<n;i++)if(keep[i]){out.push(loop[i*2],loop[i*2+1])}
  return out;
}

/* 체이킨 부드럽게 (닫힌 루프 1회) */
function chaikin(loop){
  const n=loop.length/2,out=[];
  for(let i=0;i<n;i++){
    const x0=loop[i*2],y0=loop[i*2+1];
    const j=(i+1)%n,x1=loop[j*2],y1=loop[j*2+1];
    out.push(x0*0.75+x1*0.25,y0*0.75+y1*0.25,x0*0.25+x1*0.75,y0*0.25+y1*0.75);
  }
  return out;
}

function loopsToPath(loops,eps){
  let d='';
  for(const raw of loops){
    const s=chaikin(rdp(raw,eps));
    const n=s.length/2;
    if(n<3)continue;
    d+='M'+s[0].toFixed(1)+' '+s[1].toFixed(1);
    for(let i=1;i<n;i++)d+='L'+s[i*2].toFixed(1)+' '+s[i*2+1].toFixed(1);
    d+='Z';
  }
  return d;
}

/* 번호 위치 — 테두리에서 가장 먼 안쪽 점 (BFS 거리 변환) */
function computePOI(flabels,W,H,n){
  const dist=new Int32Array(W*H);
  const q=new Int32Array(W*H);let qt=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const p=y*W+x,r=flabels[p];
    if(x===0||y===0||x===W-1||y===H-1||flabels[p-1]!==r||flabels[p+1]!==r||flabels[p-W]!==r||flabels[p+W]!==r){dist[p]=1;q[qt++]=p}
  }
  let qh=0;
  while(qh<qt){
    const p=q[qh++],x=p%W,y=(p-x)/W,r=flabels[p],d=dist[p]+1;
    if(x>0&&!dist[p-1]&&flabels[p-1]===r){dist[p-1]=d;q[qt++]=p-1}
    if(x<W-1&&!dist[p+1]&&flabels[p+1]===r){dist[p+1]=d;q[qt++]=p+1}
    if(y>0&&!dist[p-W]&&flabels[p-W]===r){dist[p-W]=d;q[qt++]=p-W}
    if(y<H-1&&!dist[p+W]&&flabels[p+W]===r){dist[p+W]=d;q[qt++]=p+W}
  }
  const best=new Int32Array(n).fill(-1),bd=new Int32Array(n);
  for(let p=0;p<W*H;p++){const r=flabels[p];if(dist[p]>bd[r]){bd[r]=dist[p];best[r]=p}}
  return{best,bd};
}

/* ── 도안 생성 (명화·사진 공용) ── */
async function buildModel(imgData,W,H,palRGB,opts){
  prog(18,'색을 고르는 중…');await tick();
  const idx=KMP.snapImage(imgData,W,H,palRGB);
  prog(38,'칸을 나누는 중…');await tick();
  const lab=KMP.labelRegions(idx,W,H);
  prog(56,'칸을 다듬는 중…');await tick();
  const merged=KMP.mergeRegions(lab,palRGB,{W,H,minArea:opts.minArea,target:opts.target});
  prog(74,'테두리를 그리는 중…');await tick();
  const loopsPer=KMP.traceAll(merged.flabels,W,H,merged.count);
  prog(88,'번호를 매기는 중…');await tick();
  const poi=KMP.computePOI(merged.flabels,W,H,merged.count);
  /* 쓰인 색만 추려 1번부터 번호 */
  const used=[...new Set(Array.from(merged.color))].sort((a,b)=>a-b);
  const dispOf=new Map();used.forEach((c,i)=>dispOf.set(c,i+1));
  const pal=used.map(c=>{const p=palRGB[c];return '#'+((1<<24)|(p[0]<<16)|(p[1]<<8)|p[2]).toString(16).slice(1)});
  const regions=[];
  const counts=new Array(used.length).fill(0);
  for(let r=0;r<merged.count;r++){
    const path=KMP.loopsToPath(loopsPer[r],0.75);
    if(!path)continue;
    const p=poi.best[r],cx=p%W,cy=(p-cx)/W;
    const num=dispOf.get(merged.color[r]);
    counts[num-1]++;
    regions.push({id:regions.length,num,hex:pal[num-1],path,cx:cx+0.5,cy:cy+0.5,bd:poi.bd[r],area:merged.area[r]});
  }
  prog(100,'거의 다 됐어요!');await tick();
  return{W,H,pal,regions,counts};
}

async function buildArtwork(art,levelIdx){
  const lv=art.levels[levelIdx];
  const W=art.gw,H=art.gh;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  if(!ctx)return null;
  ctx.save();ctx.scale(W/art.vw,H/art.vh);
  art.paint(ctx,lv.detail,KMP.mulberry32(art.id.length*777+lv.detail));
  ctx.restore();
  const data=ctx.getImageData(0,0,W,H).data;
  const A=W*H;
  const caps=[60,130,260,520];
  return buildModel(data,W,H,art.palette.map(KMP.hex2rgb),
    {minArea:Math.max(4,A/MIN_AREA_DIV[lv.detail-1]),target:caps[lv.detail-1]});
}

/* ── 갤러리 ── */
function buildGallery(){
  const grid=$('g-grid');
  for(const art of ARTWORKS){
    const card=document.createElement('div');card.className='art-card';
    let thumb='';
    try{
      const tw=280,th=Math.round(280*art.vh/art.vw);
      const cv=document.createElement('canvas');cv.width=tw;cv.height=th;
      const ctx=cv.getContext('2d');
      if(ctx){ctx.scale(tw/art.vw,th/art.vh);art.paint(ctx,2,KMP.mulberry32(7));thumb=cv.toDataURL('image/png')}
    }catch(e){}
    const chips=art.levels.map((lv,i)=>{
      const st=loadProgress(art.id,i);
      let pct='';
      if(st&&st.t){const p=Math.round(st.f.length/st.t*100);
        if(p>0)pct='<span class="pct'+(p>=100?' full':'')+'">'+(p>=100?'✓':p+'%')+'</span>'}
      return '<button class="lv-chip lv'+(i+1)+'" data-art="'+art.id+'" data-lv="'+i+'">'+lv.name+pct+'</button>';
    }).join('');
    card.innerHTML=(thumb?'<img class="art-thumb" src="'+thumb+'" alt="">':'<div class="art-thumb"></div>')+
      '<div class="art-body"><div><div class="art-title">'+art.emoji+' '+art.title+'</div>'+
      '<div class="art-artist">'+art.artist+' · '+art.year+'</div></div>'+
      '<div class="lv-row">'+chips+'</div></div>';
    grid.appendChild(card);
  }
  grid.addEventListener('click',e=>{
    const b=e.target.closest('.lv-chip');
    if(!b)return;
    const art=ARTWORKS.find(a=>a.id===b.dataset.art);
    startArtwork(art,+b.dataset.lv);
  });
}

  PHOTO_LV.forEach((lv,i)=>{
    const b=document.createElement('button');b.className='lv-btn';
    b.innerHTML='<span class="lb-ico">'+LV_ICO[i]+'</span><span><span class="lb-name">'+lv.name+'</span>'+
      '<div class="lb-desc">색 '+lv.colors+'가지 · 약 '+lv.target+'칸</div></span>'+
      '<span class="lb-right">'+(i>=2?'도전!':'')+'</span>';
    b.onclick=()=>{$('lv-modal').classList.add('hidden');startPhoto(i)};
    list.appendChild(b);
  });
  $('lv-modal').classList.remove('hidden');
}

/* ── 시작 ── */
async function startArtwork(art,levelIdx){
  state.art=art;state.levelIdx=levelIdx;state.isPhoto=false;state.done=false;
  showScreen('paint');
  $('p-title').textContent=art.emoji+' '+art.title+' · '+art.levels[levelIdx].name;
  stage.classList.remove('done-anim');stage.innerHTML='';
  $('pal-bar').innerHTML='';
  showProc(art.title+' — '+art.artist);
  await tick();
  const model=await buildArtwork(art,levelIdx);
  if(!model){hideProc();return}
  state.model=model;
  state.filled=new Set();
  const saved=loadProgress(art.id,levelIdx);
  if(saved&&saved.t===model.regions.length)state.filled=new Set(saved.f.filter(i=>i<model.regions.length));
  renderModel();
  hideProc();
}

async function startPhoto(lvIdx){
  if(!pendingPhoto)return;
  const lv=PHOTO_LV[lvIdx];
  state.art={id:'photo',title:'나만의 작품',emoji:'📷',artist:'내 사진',year:'오늘',
    desc:'세상에 한 점뿐인 도안이에요. 사진은 서버로 가지 않고, 이 기기 안에서 도안이 되었어요.'};
  state.levelIdx=lvIdx;state.isPhoto=true;state.done=false;
  showScreen('paint');
  $('p-title').textContent='📷 나만의 작품 · '+lv.name;
  stage.classList.remove('done-anim');stage.innerHTML='';
  $('pal-bar').innerHTML='';
  showProc('사진은 서버로 전송되지 않아요');
  await tick();
  const{data,W,H}=pendingPhoto;
  prog(10,'사진에서 색을 뽑는 중…');await tick();
  const pal=KMP.kmeans(data,W,H,lv.colors);
  const A=W*H;
  const model=await buildModel(data,W,H,pal,{minArea:Math.max(4,A/MIN_AREA_DIV[lvIdx]),target:lv.target});
  state.model=model;state.filled=new Set();
  renderModel();
  hideProc();
}

/* ── 렌더 ── */
function renderModel(){
  const m=state.model;
  let fills='',nums='';
  for(const r of m.regions){
    fills+='<path class="rg" data-rid="'+r.id+'" d="'+r.path+'" fill="#FDFDFC"/>';
    const fs=Math.min(16,Math.max(3.5,r.bd*0.9));
    nums+='<text data-nid="'+r.id+'" x="'+r.cx.toFixed(1)+'" y="'+r.cy.toFixed(1)+'" font-size="'+fs.toFixed(1)+'">'+r.num+'</text>';
  }
  stage.setAttribute('viewBox','0 0 '+m.W+' '+m.H);
  stage.innerHTML='<g>'+fills+'</g><g>'+nums+'</g>';
  state.pathEls=[];state.textEls=[];
  stage.querySelectorAll('.rg').forEach(p=>state.pathEls[+p.dataset.rid]=p);
  stage.querySelectorAll('text').forEach(t=>state.textEls[+t.dataset.nid]=t);
  /* 저장된 진행 복원 */
  for(const rid of state.filled)paintEl(rid,false);
  buildChips();
  const firstInc=firstIncompleteColor();
  selectColor(firstInc>=0?firstInc:0);
  fitView();
  updateProgress();
  if(state.filled.size===m.regions.length&&m.regions.length)celebrate(true);
}

function buildChips(){
  const m=state.model,bar=$('pal-bar');bar.innerHTML='';
  m.pal.forEach((hex,i)=>{
    const b=document.createElement('button');b.className='pchip';b.dataset.ci=i;
    b.innerHTML='<span class="sw" style="background:'+hex+'"></span><span class="pn">'+(i+1)+'</span><span class="rem"></span>';
    b.onclick=()=>selectColor(i);
    bar.appendChild(b);
  });
  updateChips();
}
function remainOf(ci){
  let n=0;
  for(const r of state.model.regions)if(r.num===ci+1&&!state.filled.has(r.id))n++;
  return n;
}
function updateChips(){
  document.querySelectorAll('.pchip').forEach(b=>{
    const ci=+b.dataset.ci,rem=remainOf(ci);
    b.querySelector('.rem').textContent=rem===0?'✓ 완료':rem+'칸';
    b.classList.toggle('donec',rem===0);
    b.classList.toggle('on',ci===state.sel);
  });
}
function firstIncompleteColor(){
  for(let i=0;i<state.model.pal.length;i++)if(remainOf(i)>0)return i;
  return -1;
}
function selectColor(ci){
  state.sel=ci;
  for(const r of state.model.regions){
    const el=state.pathEls[r.id];
    if(!el)continue;
    el.classList.toggle('sel-hi',!state.filled.has(r.id)&&r.num===ci+1);
  }
  updateChips();
  const chip=document.querySelector('.pchip[data-ci="'+ci+'"]');
  if(chip)chip.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

/* ── 칠하기 ── */
function paintEl(rid,anim){
  const r=state.model.regions[rid],el=state.pathEls[rid];
  if(!el)return;
  el.style.fill=r.hex;el.style.stroke=r.hex;
  el.classList.remove('sel-hi');
  if(anim)el.classList.add('justfilled');
  const t=state.textEls[rid];if(t)t.remove();
}
function tapRegion(rid){
  if(state.done)return;
  const r=state.model.regions[rid];
  if(!r||state.filled.has(rid))return;
  if(r.num===state.sel+1){
    state.filled.add(rid);
    paintEl(rid,true);
    saveProgress();
    updateProgress();
    if(remainOf(state.sel)===0){
      updateChips();
      const nx=firstIncompleteColor();
      if(nx>=0)selectColor(nx);
      else celebrate(false);
    }else updateChips();
  }else{
    const el=state.pathEls[rid];
    el.classList.add('wrongf');
    setTimeout(()=>el.classList.remove('wrongf'),320);
    const chip=document.querySelector('.pchip.on');
    if(chip){chip.classList.add('wiggle');setTimeout(()=>chip.classList.remove('wiggle'),320)}
  }
}
function updateProgress(){
  const m=state.model,p=m.regions.length?Math.round(state.filled.size/m.regions.length*100):0;
  $('p-bar-i').style.width=p+'%';
  $('p-pct').textContent=p+'%';
}

/* ── 완성 ── */
function celebrate(silent){
  state.done=true;
  stage.classList.add('done-anim');
  $('d-big').textContent=state.isPhoto?'🎉 나만의 명화 완성!':'🎉 완성!';
  $('d-art').textContent=state.art.emoji+' '+state.art.title;
  $('d-artist').textContent=state.art.artist+' · '+state.art.year;
  $('d-desc').textContent=state.art.desc;
  $('done-ov').classList.remove('hidden');
  if(!silent)confetti();
}
function confetti(){
  const cols=state.model.pal;
  for(let i=0;i<46;i++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2+Math.random()*1.6)+'s';
    d.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4400);
  }
}
function savePNG(){
  const m=state.model,S=2;
  const cv=document.createElement('canvas');cv.width=m.W*S;cv.height=m.H*S;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.scale(S,S);
  for(const r of m.regions){
    const p=new Path2D(r.path);
    ctx.fillStyle=state.filled.has(r.id)?r.hex:'#FDFDFC';
    ctx.fill(p);
    if(state.filled.has(r.id)){ctx.strokeStyle=r.hex;ctx.lineWidth=0.7;ctx.stroke(p)}
  }
  const a=document.createElement('a');
  a.download='케이아트_명화_'+state.art.title.replace(/\s/g,'')+'.png';
  a.href=cv.toDataURL('image/png');a.click();
}

/* ── 뷰 (확대·이동) ── */
function applyView(){
  const V=state.V;
  stage.setAttribute('viewBox',V.x+' '+V.y+' '+V.w+' '+V.h);
}
function fitView(){
  const m=state.model;
  state.V={x:0,y:0,w:m.W,h:m.H};
  applyView();
}
function viewScale(){
  const r=wrap.getBoundingClientRect(),V=state.V;
  return Math.min(r.width/V.w,r.height/V.h);
}
function clientToUser(cx,cy){
  const r=wrap.getBoundingClientRect(),V=state.V,s=viewScale();
  const ox=(r.width-V.w*s)/2,oy=(r.height-V.h*s)/2;
  return[V.x+(cx-r.left-ox)/s,V.y+(cy-r.top-oy)/s];
}
function zoomAt(cx,cy,f){
  const m=state.model,V=state.V;
  const[ux,uy]=clientToUser(cx,cy);
  let nw=V.w/f;
  nw=Math.max(m.W/30,Math.min(m.W*1.15,nw));
  const nf=V.w/nw;
  V.x=ux-(ux-V.x)/nf;V.y=uy-(uy-V.y)/nf;
  V.w=V.w/nf;V.h=V.h/nf;
  applyView();
}
function animateViewTo(tx,ty,tw,th){
  const V=state.V,s={...V},t0=performance.now();
  const step=now=>{
    const t=Math.min(1,(now-t0)/320),e=1-Math.pow(1-t,3);
    V.x=s.x+(tx-s.x)*e;V.y=s.y+(ty-s.y)*e;
    V.w=s.w+(tw-s.w)*e;V.h=s.h+(th-s.h)*e;
    applyView();
    if(t<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function hint(){
  const m=state.model;
  const cx0=state.V.x+state.V.w/2,cy0=state.V.y+state.V.h/2;
  let best=null,bd=Infinity;
  for(const r of m.regions){
    if(state.filled.has(r.id)||r.num!==state.sel+1)continue;
    const d=(r.cx-cx0)*(r.cx-cx0)+(r.cy-cy0)*(r.cy-cy0);
    if(d<bd){bd=d;best=r}
  }
  if(!best)return;
  const tw=Math.max(m.W/9,Math.min(m.W,best.bd*16));
  const th=tw*state.V.h/state.V.w;
  animateViewTo(best.cx-tw/2,best.cy-th/2,tw,th);
}

/* 포인터: 탭=칠하기, 드래그=이동, 두 손가락=확대 */
const ptrs=new Map();
let downInfo=null,pinch0=null;
wrap.addEventListener('pointerdown',e=>{
  wrap.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)downInfo={x:e.clientX,y:e.clientY,t:e.target,moved:false};
  else if(ptrs.size===2){
    const[a,b]=[...ptrs.values()];
    pinch0={d:Math.hypot(a.x-b.x,a.y-b.y)};
    downInfo=null;
  }
});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&downInfo){
    if(Math.hypot(e.clientX-downInfo.x,e.clientY-downInfo.y)>8){downInfo.moved=true;wrap.classList.add('dragging')}
    if(downInfo.moved){
      const s=viewScale();
      state.V.x-=dx/s;state.V.y-=dy/s;
      applyView();
    }
  }else if(ptrs.size===2&&pinch0){
    const[a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0.d>0)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch0.d);
    pinch0.d=d;
    const s=viewScale();
    state.V.x-=dx/s/2;state.V.y-=dy/s/2;
    applyView();
  }
});
function endPtr(e){
  if(ptrs.size===1&&downInfo&&!downInfo.moved){
    const rid=downInfo.t&&downInfo.t.dataset?downInfo.t.dataset.rid:null;
    if(rid!=null&&rid!=='')tapRegion(+rid);
  }
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch0=null;
  if(ptrs.size===0){downInfo=null;wrap.classList.remove('dragging')}
}
wrap.addEventListener('pointerup',endPtr);
wrap.addEventListener('pointercancel',endPtr);
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15);
},{passive:false});
wrap.addEventListener('dblclick',e=>zoomAt(e.clientX,e.clientY,1.7));

/* ── 사진 업로드 ── */
$('photo-card').addEventListener('click',()=>$('file-in').click());
$('file-in').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f)return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const long=Math.max(img.naturalWidth,img.naturalHeight);
    const sc=Math.min(1,480/long);
    const W=Math.max(2,Math.round(img.naturalWidth*sc)),H=Math.max(2,Math.round(img.naturalHeight*sc));
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0,W,H);
    pendingPhoto={data:ctx.getImageData(0,0,W,H).data,W,H};
    openPhotoLevels();
  };
  img.onerror=()=>URL.revokeObjectURL(url);
  img.src=url;
});

/* ── 버튼 ── */
$('btn-back').onclick=()=>{
  $('done-ov').classList.add('hidden');
  showScreen('gallery');
  refreshGalleryChips();
};
$('btn-hint').onclick=hint;
$('btn-fit').onclick=fitView;
$('d-gallery').onclick=()=>{$('done-ov').classList.add('hidden');showScreen('gallery');refreshGalleryChips()};
$('d-save').onclick=savePNG;
$('lm-close').onclick=()=>$('lv-modal').classList.add('hidden');
$('lv-modal').addEventListener('click',e=>{if(e.target.id==='lv-modal')$('lv-modal').classList.add('hidden')});

function refreshGalleryChips(){
  document.querySelectorAll('#g-grid .lv-chip').forEach(b=>{
    const st=loadProgress(b.dataset.art,+b.dataset.lv);
    let old=b.querySelector('.pct');if(old)old.remove();
    if(st&&st.t){const p=Math.round(st.f.length/st.t*100);
      if(p>0){const s=document.createElement('span');s.className='pct'+(p>=100?' full':'');s.textContent=p>=100?'✓':p+'%';b.appendChild(s)}}
  });
}

buildGallery();
})();

<title>[시안 v14] 만나서 반가워요! · 말차례를 알아봐요</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
/* ===== [시안 v14] 풀스크린 + 자기주도 배선 + 발문 흐름 + 순차 애니 + 클릭 뒤집기 =====
   발문 중심 설계: 관찰 → 질문 → 사고 → 답. "말차례"=청록 개념어, 상황 강조=산호빨강. */
:root{
  --paper:#FBF7F1; --ink:#243043; --ink-soft:#62708A;
  --coral:#FF6B4A; --coral-deep:#E0512E; --coral-soft:#FFE3DA;
  --teal:#1FA8A0; --teal-deep:#147F79; --teal-soft:#D6F1EF;
  --gold:#F6B526; --emph:#F0451F; --line:#ECE3D6; --mark:#FFE08A;
  --f-title:'Jua',sans-serif; --f-body:'Gowun Dodum',sans-serif;
  --shadow:0 14px 34px -18px rgba(36,48,67,.4);
}
*{margin:0; padding:0; box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--f-body); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; overflow:hidden;}

@keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
@keyframes pop{0%{opacity:0; transform:scale(.4);}60%{opacity:1; transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes popBig{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes mark{from{background-size:0 100%;} to{background-size:100% 100%;}}
@keyframes clashIn{0%{opacity:0; transform:scale(.3) rotate(-8deg);}55%{opacity:1; transform:scale(1.2) rotate(4deg);}100%{transform:scale(1) rotate(0);}}

.topbar{display:flex; align-items:center; gap:18px; padding:14px clamp(18px,4vw,40px); background:#fff; border-bottom:2px solid var(--line); flex-shrink:0;}
.pill{font-family:var(--f-title); background:var(--coral); color:#fff; padding:6px 16px; border-radius:999px; font-size:clamp(15px,1.8vw,20px);}
.where{font-size:clamp(14px,1.6vw,18px); color:var(--ink-soft);}
.where b{color:var(--ink);}
.dots{display:flex; gap:8px; margin-left:auto;}
.dot{width:12px; height:12px; border-radius:50%; background:var(--line); cursor:pointer; transition:transform .2s,background .2s;}
.dot:hover{transform:scale(1.2);}
.dot.active{background:var(--coral); transform:scale(1.3);}
.dot.done{background:var(--teal);}
.score{font-family:var(--f-title); background:#FFF8E1; color:#F57F17; padding:6px 16px; border-radius:999px; font-size:clamp(15px,1.8vw,20px);}

.stage{flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:0 clamp(20px,5vw,64px);}
.stage-inner{margin:auto; width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; padding:clamp(24px,5vh,56px) 0 clamp(100px,13vh,128px);}
.eyebrow{font-family:var(--f-title); color:var(--coral); font-size:clamp(16px,2.2vw,24px); letter-spacing:.5px; margin-bottom:10px; animation:fadeUp .4s ease both;}
.eyebrow.teal{color:var(--teal);}
h2.t{font-family:var(--f-title); font-size:clamp(30px,5vw,58px); line-height:1.18; color:var(--ink); margin-bottom:clamp(16px,3vh,30px); font-weight:400; animation:fadeUp .4s .1s ease both;}

/* "말차례" 개념어 = 청록 강조 / 상황·행동 강조 = 산호빨강 */
.mc{color:var(--teal-deep); font-weight:bold;}
.emph{color:var(--emph); font-weight:bold;}

.key{display:inline-block; font-family:var(--f-title); color:var(--ink); font-size:clamp(20px,2.9vw,34px); line-height:1.5; background-image:linear-gradient(transparent 56%, var(--mark) 56%); background-repeat:no-repeat; background-size:100% 100%; padding:0 10px; margin-top:clamp(10px,2vh,18px); animation:mark .5s ease both;}
.key.seq{animation:fadeUp .4s 1.5s ease both, mark .5s 1.6s ease both;}

.bub{background:#fff; border:2px solid var(--line); border-radius:22px; padding:clamp(16px,2.6vw,26px) clamp(20px,3.2vw,34px); font-size:clamp(19px,2.5vw,30px); line-height:1.6; max-width:880px; box-shadow:var(--shadow); animation:fadeUp .4s .25s ease both;}

.talk{display:flex; flex-direction:column; gap:clamp(10px,1.8vh,18px); width:100%; max-width:820px; margin:clamp(6px,1.5vh,12px) 0;}
.say{display:flex; align-items:flex-end; gap:14px; animation:fadeUp .5s ease both;}
.say.right{flex-direction:row-reverse;}
.talk .say:nth-of-type(1){animation-delay:.3s;}
.talk .say:nth-of-type(2){animation-delay:.9s;}
.who{width:clamp(48px,6vw,72px); height:clamp(48px,6vw,72px); border-radius:50%; display:grid; place-items:center; font-size:clamp(26px,3.4vw,42px); flex-shrink:0; box-shadow:0 5px 0 rgba(0,0,0,.08);}
.who.a{background:var(--coral-soft);} .who.b{background:var(--teal-soft);}
.line{background:#fff; border:4px solid var(--coral-soft); border-radius:22px; padding:clamp(12px,1.8vw,18px) clamp(16px,2.4vw,26px); font-size:clamp(18px,2.3vw,28px); line-height:1.4; text-align:left; max-width:74%; box-shadow:var(--shadow);}
.say.b .line{border-color:var(--teal-soft);}
.line .nm{display:block; font-family:var(--f-title); font-size:clamp(14px,1.6vw,19px); margin-bottom:3px;}
.say.a .nm{color:var(--coral-deep);} .say.b .nm{color:var(--teal-deep);}
.say.dim{opacity:.32; filter:grayscale(.3);}
.turn{font-family:var(--f-title); font-size:clamp(15px,1.9vw,23px); color:var(--coral-deep); background:var(--coral-soft); border-radius:999px; padding:7px 20px; margin-top:clamp(8px,1.5vh,14px); display:inline-block; animation:fadeUp .4s 1.4s ease both;}
.clash{font-family:var(--f-title); font-size:clamp(40px,6vw,68px); color:var(--emph); margin:6px 0; animation:clashIn .5s 1.5s ease both;}

/* 발문 — 부딪침 멘트 + 답 보기 버튼 */
.hot{font-family:var(--f-title); color:var(--emph); font-size:clamp(22px,3vw,38px); margin:clamp(6px,1.2vh,12px) 0; animation:fadeUp .4s 2s ease both;}
.reveal{font-family:var(--f-title); background:#fff; border:3px solid var(--coral); color:var(--coral-deep); border-radius:999px; padding:clamp(10px,1.4vw,15px) clamp(22px,2.8vw,38px); font-size:clamp(17px,2.1vw,26px); cursor:pointer; margin-top:clamp(10px,2vh,18px); animation:fadeUp .4s 2.4s ease both; transition:transform .15s,background .2s;}
.reveal:hover{background:var(--coral-soft); transform:translateY(-2px);}
.hidden{display:none;}

/* ★ 방법 4장 카드 — 클릭해서 뒤집기 */
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,2.2vw,26px); width:100%; max-width:920px; margin-top:clamp(6px,1.5vh,12px);}
.mcard{position:relative; background:#fff; border:4px solid var(--coral-soft); border-radius:24px; padding:clamp(18px,2.4vw,30px) clamp(20px,2.8vw,34px); text-align:left; box-shadow:0 6px 0 var(--coral-soft); cursor:pointer; min-height:clamp(120px,15vh,150px); animation:pop .45s ease both; transition:border-color .25s,box-shadow .25s;}
.mcard .mnum{font-family:var(--f-title); color:var(--teal); font-size:clamp(20px,2.6vw,30px); margin-bottom:clamp(7px,1.2vh,12px);}
.mcard .mtext{font-size:clamp(18px,2.3vw,28px); line-height:1.5; color:var(--ink);}
.mcard .mtext b{font-family:var(--f-title); font-weight:400; color:var(--ink);}
.mcard .mhint{position:absolute; inset:0; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:clamp(6px,1vh,10px); background:#fff; border-radius:20px; padding:0 clamp(20px,2.8vw,34px); transition:opacity .3s;}
.mcard .mhint .mhn{font-family:var(--f-title); color:var(--teal); font-size:clamp(20px,2.6vw,30px);}
.mcard .mhint .mho{font-family:var(--f-title); color:var(--ink-soft); font-size:clamp(17px,2.2vw,25px);}
.mcard.open .mhint{opacity:0; pointer-events:none;}
.mcard.open{border-color:var(--coral); box-shadow:0 6px 0 var(--coral);}
.mcard.open .mhint{opacity:0; pointer-events:none;}

.ways{display:flex; flex-direction:column; gap:clamp(10px,1.6vh,16px); width:100%; max-width:680px; margin-top:clamp(8px,1.6vh,16px);}
.way{display:flex; align-items:center; gap:16px; background:#fff; border:3px solid var(--coral-soft); border-radius:20px; padding:clamp(12px,1.8vw,18px) clamp(16px,2.4vw,26px); font-size:clamp(18px,2.3vw,28px); text-align:left; box-shadow:0 5px 0 var(--coral-soft);}
.way b{font-family:var(--f-title); font-weight:400; color:var(--coral-deep);}
.way .ic{font-size:clamp(28px,3.6vw,44px); flex-shrink:0;}

.ox{display:flex; gap:clamp(22px,5vw,48px); justify-content:center; margin-top:clamp(14px,2.5vh,26px);}
.pick{width:clamp(96px,12vw,150px); height:clamp(96px,12vw,150px); border-radius:50%; border:6px solid; background:#fff; font-family:var(--f-title); font-size:clamp(48px,7vw,86px); cursor:pointer; transition:transform .1s;}
.pick[data-v="O"]{color:var(--teal); border-color:var(--teal-soft); box-shadow:0 8px 0 var(--teal-soft);}
.pick[data-v="X"]{color:var(--emph); border-color:var(--coral-soft); box-shadow:0 8px 0 var(--coral-soft);}
.pick:active{transform:translateY(5px);}
.pick.correct{background:var(--teal); color:#fff; border-color:var(--teal-deep); box-shadow:0 8px 0 var(--teal-deep); animation:popBig .5s ease;}
.pick.wrong{background:#FFE0DA; border-color:var(--emph); animation:shake .35s;}
.fb{margin-top:clamp(14px,2.5vh,24px); min-height:32px; font-family:var(--f-title); font-size:clamp(20px,2.6vw,32px); color:var(--teal-deep);}
.fb.bad{color:var(--emph);}

.nav{position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:flex-end; gap:12px; padding:14px clamp(18px,4vw,40px); background:linear-gradient(to top,var(--paper) 62%,transparent);}
.navbtn{font-family:var(--f-title); font-size:clamp(16px,2vw,24px); border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:clamp(10px,1.4vw,15px) clamp(22px,2.8vw,40px); cursor:pointer; transition:transform .15s;}
.navbtn:hover{transform:translateY(-2px);}
.navbtn.sec{margin-right:auto;}
.navbtn.primary{background:var(--coral); color:#fff; border-color:var(--coral);}
.navbtn:disabled{opacity:.35; cursor:default; transform:none;}

@media (max-width:560px){ .mgrid{grid-template-columns:1fr;} .where{display:none;} .line{max-width:70%;} .nav{flex-wrap:wrap;} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important;} }
</style>
</head>

const LESSON_MAX=60;
let cur=0, score=0, maxScore=0;
const stage=document.getElementById('stage'), scoreEl=document.getElementById('score');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');
const dotsWrap=document.getElementById('dots');

slides.forEach((s,i)=>{ const d=document.createElement('div'); d.className='dot'; d.onclick=()=>go(i); dotsWrap.appendChild(d); });
const dots=[...dotsWrap.children];

function render(){
  const s=slides[cur];
  stage.innerHTML=`<div class="stage-inner"><div class="eyebrow ${s.ebc||''}">${s.eb}</div><h2 class="t">${s.t}</h2>${s.html}</div>`;
  dots.forEach((d,i)=>{ d.classList.toggle('active',i===cur); d.classList.toggle('done',i<cur); });
  prevB.disabled=cur===0; nextB.textContent=cur===slides.length-1?'끝 ✓':'다음 ▷';
  if(cur===slides.length-1){ if(window.kedu&&window.kedu.recordLessonEnd) window.kedu.recordLessonEnd(score, LESSON_MAX); }
  tracker.done(cur);
  // 발문 답 보기
  const rb=stage.querySelector('#revealBtn');
  if(rb) rb.onclick=()=>{ const a=stage.querySelector('#ans'); if(a)a.classList.remove('hidden'); rb.style.display='none'; };
  // 방법 카드 클릭 뒤집기
  stage.querySelectorAll('.mcard').forEach(c=>{ c.onclick=()=>c.classList.toggle('open'); });
  if(s.correct) bindPicks(s);
}
function bindPicks(s){
  let done=false;
  stage.querySelectorAll('.pick').forEach(btn=>{
    btn.onclick=()=>{
      if(done) return;
      const ok=btn.dataset.v===s.correct;
      const fb=stage.querySelector('.fb');
      if(ok){
        done=true; btn.classList.add('correct');
        if(fb)fb.textContent='맞아요! 잘했어요 🎉';
        if(s.log){score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        stage.querySelectorAll('.pick').forEach(b=>{if(b!==btn)b.style.opacity=.4;});
      }else{
        btn.classList.add('wrong');
        if(fb){fb.textContent='다시 한 번 생각해 볼까요?'; fb.classList.add('bad');}
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>btn.classList.remove('wrong'),350);
      }
    };
  });
}
function go(n){ if(n>=0&&n<slides.length){ cur=n; render(); } }
prevB.onclick=()=>go(cur-1);
nextB.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
document.getElementById('hint').onclick=()=>{
  const hints={
    '4':'친구 말이 끝난 뒤에 손을 들었어요. 말차례를 지켰을까요?',
    '5':'친구가 말하는 도중에 끼어들었어요. 끝까지 들었나요?',
    '6':'“내가 말해도 될까?” 하고 물어봤어요. 좋은 방법이에요!',
    '7':'친구 목소리를 덮어 버렸어요. 친구의 말차례를 빼앗은 걸까요?',
    '8':'눈을 보며 끝까지 들었어요. 그다음에 말했어요.',
    '9':'다른 친구에게 물었는데 내가 먼저 대답했어요. 그 친구의 차례였어요.'
  };
  if(hints[cur]) alert('💡 ' + hints[cur]);
  else alert('💡 친구가 말할 때 끝까지 들었는지 생각해 봐요!');
};
document.getElementById('replay').onclick=()=>{ render(); };
render();
</script>
</body>
</html>

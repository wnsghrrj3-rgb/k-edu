<!DOCTYPE html>
<html lang="ko">
<head>

<title>만나서 반가워요! · 말차례를 알아봐요</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
/* ===== 디자인 헌법 v11 준수: 저학년(1·2) 토큰 — g1 자기주도와 동일 ===== */
:root{
  --c-main:#42A5F5; --c-deep:#1976D2; --c-soft:#E3F2FD; --c-sub:#64B5F6;
  --c-ink:#1565C0; --c-bg:#F0F7FF; --c-emph:#DC2626;
  --c-a:#42A5F5;    /* 친구 1 = 메인 파랑 */
  --c-b:#FF8A65;    /* 친구 2 = 대비 코랄 */
  --fs-title:clamp(20px,5.2cqw,32px);
  --fs-heading:clamp(17px,4.2cqw,24px);
  --fs-body:clamp(15px,3.6cqw,21px);
  --fs-caption:clamp(12px,2.7cqw,16px);
  --fs-label:clamp(11px,2.3cqw,14px);
  --em-sm:clamp(28px,6cqw,40px); --em-md:clamp(40px,9cqw,60px); --em-lg:clamp(54px,12cqw,80px);
}
*{margin:0; padding:0; box-sizing:border-box;}
body{background:var(--c-bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; font-family:'Jua',sans-serif;}

@keyframes ka-fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
@keyframes ka-pop{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.12);}100%{opacity:1; transform:scale(1);}}
@keyframes ka-popBig{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes ka-pulse{0%,100%{transform:scale(1); box-shadow:0 4px 14px rgba(66,165,245,.32);}50%{transform:scale(1.04); box-shadow:0 6px 20px rgba(66,165,245,.5);}}
@keyframes ka-shake{0%,100%{transform:none;}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

/* ===== 헌법 카드 골격 ===== */
.ka{
  container-type:inline-size; background:#fff;
  border-radius:clamp(16px,3cqw,24px); aspect-ratio:5/4;
  padding:clamp(14px,3cqw,22px) clamp(18px,4cqw,32px);
  font-family:'Jua',sans-serif; color:#333;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  display:flex; flex-direction:column; max-width:1024px; width:100%; margin:0 auto;
}
.ka-h{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); margin-bottom:clamp(12px,3cqw,18px);}
.ka-lb{background:#F4F4F8; border:none; padding:clamp(5px,1.4cqw,8px) clamp(8px,2cqw,14px); border-radius:clamp(8px,1.8cqw,12px); color:#555; font-family:inherit; font-size:var(--fs-label); display:flex; align-items:center; gap:5px; flex-shrink:0; cursor:pointer;}
.ka-bar{flex:1; height:clamp(3px,.7cqw,5px); background:var(--c-bg); border-radius:999px; overflow:hidden;}
.ka-bar>div{height:100%; background:var(--c-main); border-radius:999px; transition:width .3s;}
.ka-pg{color:var(--c-deep); font-family:'Nunito',sans-serif; font-weight:800; font-size:var(--fs-label); flex-shrink:0;}
.ka-sc{background:#FFF8E1; color:#F57F17; padding:clamp(3px,.9cqw,5px) clamp(8px,2cqw,12px); border-radius:999px; font-size:var(--fs-caption); flex-shrink:0; display:flex; align-items:center; gap:4px;}

.ka-m{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; text-align:center;}
.ka-tag{background:#FFF8E1; color:#F57F17; padding:clamp(3px,1cqw,6px) clamp(10px,2.4cqw,14px); border-radius:30px; font-size:var(--fs-caption); margin-bottom:clamp(8px,2cqw,12px); display:inline-block;}
.ka-t{font-size:var(--fs-title); line-height:1.4; color:var(--c-deep); margin-bottom:clamp(12px,3cqw,18px); font-weight:400; animation:ka-fadeUp .4s .15s ease both;}
.ka-bub{background:var(--c-soft); border-radius:clamp(10px,2.4cqw,16px); padding:clamp(10px,2.5cqw,16px) clamp(14px,3.4cqw,22px); font-size:var(--fs-body); line-height:1.7; color:#333; max-width:600px; animation:ka-fadeUp .4s .4s ease both;}
.emph{color:var(--c-emph);}

/* ===== 대화 말풍선 (말차례 시각화) ===== */
.talk{display:flex; flex-direction:column; gap:clamp(8px,2cqw,14px); width:100%; max-width:620px; margin:clamp(6px,1.5cqw,10px) 0;}
.say{display:flex; align-items:flex-end; gap:clamp(6px,1.6cqw,10px); animation:ka-fadeUp .4s ease both;}
.say.right{flex-direction:row-reverse;}
.who{width:clamp(40px,9cqw,58px); height:clamp(40px,9cqw,58px); border-radius:50%; display:grid; place-items:center; font-size:clamp(22px,5cqw,34px); flex-shrink:0; box-shadow:0 4px 0 rgba(0,0,0,.1);}
.who.a{background:var(--c-soft);}
.who.b{background:#FFE7DD;}
.line{position:relative; background:#fff; border:clamp(3px,.6cqw,4px) solid var(--c-soft); border-radius:clamp(12px,2.6cqw,18px); padding:clamp(8px,2cqw,12px) clamp(12px,3cqw,18px); font-size:var(--fs-body); line-height:1.5; color:#333; text-align:left; max-width:78%;}
.say.b .line{border-color:#FFD2C2;}
.line .nm{display:block; font-size:var(--fs-caption); color:#999; margin-bottom:2px;}
.say.dim{opacity:.32; filter:grayscale(.3);}
.turn{font-size:var(--fs-caption); color:var(--c-deep); background:var(--c-soft); border-radius:999px; padding:clamp(4px,1cqw,6px) clamp(10px,2.4cqw,16px); margin-top:clamp(6px,1.5cqw,10px); display:inline-block;}
.clash{font-size:var(--em-md); color:var(--c-emph); animation:ka-shake .5s ease;}

/* 말차례 방법 카드 */
.ways{display:flex; flex-direction:column; gap:clamp(7px,1.7cqw,11px); width:100%; max-width:560px; margin-top:clamp(6px,1.5cqw,10px);}
.way{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); background:var(--c-soft); border-radius:clamp(10px,2.4cqw,16px); padding:clamp(8px,2cqw,13px) clamp(12px,3cqw,18px); font-size:var(--fs-body); color:#333; text-align:left; animation:ka-fadeUp .4s ease both;}
.way .ic{font-size:clamp(24px,5cqw,34px); flex-shrink:0;}

/* O / X 판단 */
.ox{display:flex; gap:clamp(14px,4cqw,28px); justify-content:center; margin-top:clamp(8px,2cqw,12px);}
.pick{width:clamp(78px,18cqw,116px); height:clamp(78px,18cqw,116px); border-radius:50%; border:clamp(4px,.9cqw,6px) solid var(--c-soft); background:#fff; font-family:'Jua'; font-size:clamp(38px,9cqw,60px); cursor:pointer; box-shadow:0 6px 0 var(--c-soft); transition:transform .1s;}
.pick[data-v="O"]{color:var(--c-main);}
.pick[data-v="X"]{color:var(--c-b);}
.pick:active{transform:translateY(4px); box-shadow:0 2px 0 var(--c-soft);}
.pick.correct{background:var(--c-main); color:#fff; border-color:var(--c-deep); box-shadow:0 6px 0 var(--c-deep); animation:ka-popBig .5s ease;}
.pick.wrong{background:#FFE0E0; border-color:var(--c-emph); animation:ka-shake .35s;}
.fb{margin-top:clamp(8px,2cqw,12px); min-height:26px; font-size:var(--fs-body); color:var(--c-deep); max-width:560px;}
.fb.bad{color:var(--c-emph);}

/* 푸터 */
.ka-f{display:grid; grid-template-columns:1fr 1.3fr 1fr 1.3fr; gap:clamp(5px,1.4cqw,8px); margin-top:clamp(10px,2.6cqw,15px);}
.ka-nav{background:#F4F4F8; color:#2A2A35; border:none; padding:clamp(8px,2.2cqw,12px) 6px; font-size:var(--fs-caption); border-radius:clamp(10px,2.5cqw,14px); cursor:pointer; font-family:inherit;}
.ka-nav-next{background:var(--c-main); color:#fff;}
.ka-nav:disabled{opacity:.4; cursor:default;}

@container (max-width:420px){
  .ka-lb span{display:none;}
  .ka-f{grid-template-columns:1fr 1fr;}
  .line{max-width:72%;}
}
</style>
</head>

<script>
/* ===== tracker: 정답 로깅 + 완주 기록 ===== */
const tracker={
  answer(i,ok){ if(window.kedu&&window.kedu.recordAnswer) window.kedu.recordAnswer(LESSON_ID+'_s'+i, ok, null, null); },
  done(i){}

/* ===== 슬라이드 정의 (11슬: ① 2 / ② 3 / ③ 4 / ④ 2 · 문제 6슬 ×10 = 60) =====
   2학년 1학기 국어 1단원 「만나서 반가워요!」 3차시 — 말차례를 알아봐요
   성취기준 [2국01-03] 상대의 말을 집중하여 듣고 말차례를 지키며 대화한다.
   ※ 교과서·지도서 본문/삽화 미게재. 학습 목표·활동 의도만 차용, 예시 대화 자체 구성. */
const slides=[

      <div class="say right"><div class="who b">😀</div><div class="line"><span class="nm">수아</span>아, 그랬구나! 재미있었어?</div></div>
    </div>
    <div class="ka-bub">친구와 이야기할 때, 한 사람이 말하면<br>다른 사람은 듣고 그다음에 말해요.<br>이렇게 번갈아 말하는 차례가 있어요.</div>`},

  {stage:'만나기', tag:'① 무엇이 잘못됐을까',
   t:'두 사람의 말이 부딪쳤어요',
   html:`<div class="talk">
      <div class="say"><div class="who a">😮</div><div class="line"><span class="nm">지호</span>제가 좋아하는 건 공룡이고요, 그래서…</div></div>
      <div class="say right"><div class="who b">😣</div><div class="line"><span class="nm">수아</span>나도! 나도 공룡 알아!</div></div>
    </div>
    <div class="clash">⚡ 꽝!</div>
    <div class="ka-bub">지호가 <span class="emph">말하는 중</span>인데 수아가 끼어들었어요.<br>두 사람이 한꺼번에 말하면 잘 들리지 않아요.</div>`},

  // ── ② 엔진 전반: 개념 (3) ──
  {stage:'엔진전반', tag:'② 말차례란?',
   t:'말차례는 차례차례 말하는 거예요',
   html:`<div class="talk">
      <div class="say"><div class="who a">🙂</div><div class="line">먼저 말해요</div></div>
      <div class="say right dim"><div class="who b">😊</div><div class="line">끝까지 듣고 기다려요</div></div>
    </div>
    <span class="turn">지금 말차례 — 지호</span>
    <div class="ka-bub">한 사람이 말할 때 다른 사람은 <span class="emph">끝까지 듣고</span>,<br>말이 끝나면 그다음에 말해요.<br>이 차례를 <span class="emph">말차례</span>라고 해요.</div>`},

  {stage:'엔진전반', tag:'② 지키는 방법',
   t:'말차례를 지키는 방법',
   html:`<div class="ways">
      <div class="way"><span class="ic">👂</span>친구가 말할 때는 끝까지 들어요.</div>
      <div class="way"><span class="ic">✋</span>하고 싶은 말이 있으면 손을 들고 기다려요.</div>
      <div class="way"><span class="ic">👀</span>친구의 말이 끝났는지 보고 말해요.</div>
    </div>`},

  {stage:'엔진전반', tag:'② 함께 생각해요', log:true, correct:'O',
   t:'이 친구는 말차례를 지켰나요?',
   html:`<div class="ka-bub">친구가 발표하는 동안 <span class="emph">조용히 기다렸다가</span>,<br>발표가 끝난 뒤에 손을 들고 말했어요.</div>
    <div class="ox">
      <button class="pick" data-v="O">O</button>
      <button class="pick" data-v="X">X</button></div>
    <div class="fb" id="fb"></div>`},

  // ── ③ 엔진 후반: O/X 판단 (4) ──
  {stage:'엔진후반', tag:'③ 말차례를 지켰나요', log:true, correct:'X',
   t:'이 친구는 말차례를 지켰나요?',
   html:`<div class="ka-bub">친구가 이야기하는 <span class="emph">중간에</span><br>“나도 알아!” 하고 큰 소리로 끼어들었어요.</div>
    <div class="ox">
      <button class="pick" data-v="O">O</button>
      <button class="pick" data-v="X">X</button></div>
    <div class="fb" id="fb"></div>`},

  {stage:'엔진후반', tag:'③ 말차례를 지켰나요', log:true, correct:'O',
   t:'이 친구는 말차례를 지켰나요?',
   html:`<div class="ka-bub">친구의 말이 끝난 것을 보고<br>“<span class="emph">내가 말해도 될까?</span>” 하고 물어본 뒤에 말했어요.</div>
    <div class="ox">
      <button class="pick" data-v="O">O</button>
      <button class="pick" data-v="X">X</button></div>
    <div class="fb" id="fb"></div>`},

  {stage:'엔진후반', tag:'③ 말차례를 지켰나요', log:true, correct:'X',
   t:'이 친구는 말차례를 지켰나요?',
   html:`<div class="ka-bub">친구가 말하고 있는데<br><span class="emph">더 큰 목소리로</span> 내 이야기를 시작했어요.</div>
    <div class="ox">
      <button class="pick" data-v="O">O</button>
      <button class="pick" data-v="X">X</button></div>

   html:`<div class="ka-bub">친구가 말할 때 <span class="emph">눈을 보며</span> 고개를 끄덕이고,<br>다 들은 뒤에 자기 이야기를 했어요.</div>
    <div class="ox">
      <button class="pick" data-v="O">O</button>

    <div class="fb" id="fb"></div>`},

   t:'이 친구는 말차례를 지켰나요?',
   html:`<div class="ka-bub">선생님이 다른 친구에게 물었는데,<br>내가 <span class="emph">먼저 큰 소리로</span> 대답을 해 버렸어요.</div>
    <div class="ox">
      <button class="pick" data-v="O">O</button>
      <button class="pick" data-v="X">X</button></div>
    <div class="fb" id="fb"></div>`},

  {stage:'표현정리', tag:'④ 오늘 배운 것',
   t:'말차례를 지켜요 🌟',
   html:`<div class="ka-bub" style="max-width:560px;">
      대화에는 <span class="emph">말차례</span> 가 있어요.<br>
      친구가 말할 때 끝까지 듣고,<br>
      하고 싶은 말은 <span class="emph">손을 들고 기다려요.</span></div>
    <div class="ways" style="margin-top:clamp(10px,2.5cqw,16px);">
      <div class="way"><span class="ic">👂</span>끝까지 듣기</div>

const LESSON_ID='g2_kor_u1_l03_v1';
const LESSON_MAX=60;
let cur=0, score=0, maxScore=0;
const main=document.getElementById('main');
const bar=document.getElementById('bar'), pg=document.getElementById('pg'), scoreEl=document.getElementById('score');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');

function render(){
  const s=slides[cur];
  main.innerHTML=`<span class="ka-tag">${s.tag}</span><h2 class="ka-t">${s.t}</h2>${s.html}`;
  bar.style.width=((cur+1)/slides.length*100)+'%';
  pg.textContent=`${cur+1} / ${slides.length}`;
  prevB.disabled=cur===0; nextB.disabled=cur===slides.length-1;
  if(cur===slides.length-1){ if(window.kedu&&window.kedu.recordLessonEnd) window.kedu.recordLessonEnd(score, LESSON_MAX); }
  tracker.done(cur);
  if(s.correct) bindPicks(s);
}
function bindPicks(s){
  let done=false;
  main.querySelectorAll('.pick').forEach(btn=>{
    btn.onclick=()=>{
      if(done) return;
      const ok=btn.dataset.v===s.correct;
      const fb=main.querySelector('.fb');
      if(ok){
        done=true;
        btn.classList.add('correct');
        if(fb)fb.textContent='맞아요! 잘했어요 🎉';
        if(s.log){score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        main.querySelectorAll('.pick').forEach(b=>{if(b!==btn)b.style.opacity=.4;});
      }else{
        btn.classList.add('wrong');
        if(fb){fb.textContent='다시 한 번 생각해 볼까요?'; fb.classList.add('bad');}
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>btn.classList.remove('wrong'),350);
      }
    };
  });
}
prevB.onclick=()=>{if(cur>0){cur--; render();}};
nextB.onclick=()=>{if(cur<slides.length-1){cur++; render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextB.click();if(e.key==='ArrowLeft')prevB.click();});
document.getElementById('hint').onclick=()=>{
  const hints={
    '4':'친구 말이 끝난 뒤에 손을 들었어요. 말차례를 지켰을까요?',
    '5':'친구가 말하는 도중에 끼어들었어요. 끝까지 들었나요?',
    '6':'“내가 말해도 될까?” 하고 물어봤어요. 좋은 방법이에요!',
    '7':'친구 목소리를 덮어 버렸어요. 친구의 말차례를 빼앗은 걸까요?',
    '8':'눈을 보며 끝까지 들었어요. 그다음에 말했어요.',
    '9':'다른 친구에게 물었는데 내가 먼저 대답했어요. 그 친구의 차례였어요.'
  };
  if(hints[cur]) alert('💡 ' + hints[cur]);
  else alert('💡 친구가 말할 때 끝까지 들었는지 생각해 봐요!');
};
document.getElementById('replay').onclick=()=>{/* 음성 보조층 — 추후 mp3 연결 */};
render();
</script>

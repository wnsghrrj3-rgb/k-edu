<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 문장 — 아침활동 · 케이에듀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--kedu-title:'Gowun Batang','Gowun Dodum',serif}</style>
<style>
/* ═══════════════════════════════════════════════════════════════
   오늘의 문장 — 소리의 재료로 짠 화면
   아침 하늘(종이) · 말풍선(말하기) · 리듬 점(박자) · 해도장(성취 기록)
   주황은 오직 도장에만 쓴다. 누르는 것은 파랑.
   한자 화면이 '먹과 종이'라면, 여기는 '소리와 입'이다.
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sky:#EFF4FA;          /* 아침 하늘 */
  --sky-deep:#E3EBF4;     /* 하늘 그늘 */
  --ink:#22303F;          /* 글자 */
  --ink-soft:#5D6E80;
  --mist:#94A4B5;         /* 안개 — 흐린 글 */
  --line:#D7E2ED;         /* 경계선 */
  --card:#FFFFFF;
  --sun:#EE9B2E;          /* 해 — 도장에만 */
  --sun-deep:#CE7F13;
  --blue:#3C6FB2;         /* 누르는 것 */
  --blue-soft:#E7EFFA;
  --ok:#38876A;
  --radius:18px;
  --shadow:0 2px 16px rgba(30,50,80,.07);
}
body{font-family:'Gowun Dodum',sans-serif;background:var(--sky);min-height:100vh;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 50% -10%, #F8FBFF 0%, var(--sky) 55%)}

.nav{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.nav-logo{font-family:var(--kedu-title);font-size:20px;text-decoration:none;color:var(--ink)}
.nav-logo .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sun);
  margin-right:8px;vertical-align:1px}
.nav a.back{font-size:13.5px;color:var(--ink-soft);text-decoration:none}

.wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px}

/* ── 머리 ─────────────────────────────────────────── */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 16px;flex-wrap:wrap}
.head .day{font-family:var(--kedu-title);font-size:22px}
.head .day small{font-size:13px;color:var(--mist);margin-left:8px}
.head .pat{font-family:var(--kedu-title);font-size:13.5px;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.head .pat b{color:var(--ink);margin-left:4px}
.head .pat span{color:var(--mist);margin-left:7px;font-size:12.5px}
.head .nav-ch{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 13px;
  font-family:var(--kedu-title);font-size:14px;color:var(--ink);cursor:pointer;text-decoration:none}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.quiet{color:var(--ink-soft)}

/* ── 여정 ─────────────────────────────────────────── */
.journey{display:flex;align-items:center;justify-content:center;gap:0;margin:0 0 18px}
.jstep{display:flex;align-items:center;gap:8px;font-family:var(--kedu-title);font-size:14px;color:var(--mist)}
.jstep .b{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--mist)}
.jstep.on{color:var(--ink)}
.jstep.on .b{border-color:var(--ink);color:var(--ink)}
.jstep.done{color:var(--ink-soft)}
.jstep.done .b{background:var(--sun);border-color:var(--sun);color:#FFF9EF}
.jline{width:30px;height:1.5px;background:var(--line);margin:0 7px}

/* ── 무대 ─────────────────────────────────────────── */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 18px 22px;text-align:center;position:relative}
.sheet .corner{position:absolute;top:14px;right:16px;font-size:12.5px;color:var(--mist)}
.sheet .corner b{color:var(--ink-soft)}

/* ── 말풍선: 오늘 문장이 사는 곳 ───────────────────── */
.bubble{position:relative;display:inline-block;max-width:100%;background:var(--blue-soft);
  border:1.5px solid #CFE0F4;border-radius:20px;padding:20px 22px 18px;margin:10px 0 4px}
.bubble::after{content:'';position:absolute;left:34px;bottom:-11px;width:0;height:0;
  border:11px solid transparent;border-top-color:var(--blue-soft);border-bottom:0}
.bubble.quiet{background:#F4F7FB;border-color:var(--line)}
.bubble.quiet::after{border-top-color:#F4F7FB}

.sent{font-family:'Nunito','Gowun Dodum',sans-serif;font-weight:700;
  font-size:clamp(21px,5.2vw,30px);line-height:1.5;
  display:flex;flex-wrap:wrap;gap:5px 9px;justify-content:center}
.sent .w{opacity:0;transform:translateY(6px);transition:opacity .32s ease, transform .32s ease;
  cursor:pointer;border-radius:9px;padding:1px 4px;background:transparent;border:0;font:inherit;color:inherit}
.sent .w.in{opacity:1;transform:none}
.sent .w.lit{background:#FFF0D8}
.sent .w.fresh{box-shadow:inset 0 -8px 0 #FFE3B0}
.sent .w:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.sent .w{transition:none;opacity:1;transform:none}}

.ko{font-size:15.5px;color:var(--ink-soft);margin-top:14px;min-height:24px;
  opacity:0;transition:opacity .4s ease}
.ko.in{opacity:1}

.say{font-size:14.5px;color:var(--ink-soft);min-height:24px;margin-top:12px}
.say.good{color:var(--ok)}
.say.oops{color:var(--sun-deep)}

/* ── 새 낱말 배지 ─────────────────────────────────── */
.fresh-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.fresh-lab{font-size:12.5px;color:var(--mist);width:100%;margin-bottom:2px}
.badge{border:1.5px solid #F2D9AC;background:#FFF8EC;border-radius:16px;padding:7px 15px;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:600;font-size:15px;color:var(--sun-deep);
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3}
/* 뜻은 낱말 바로 아래 — 1막은 만나는 자리다. 감추면 원장에 뜻이 있어도 못 만난다 */
.badge .gl{font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:11.5px;color:var(--ink-soft)}
.badge:active{transform:scale(.96)}

/* ── 어제 문장 ─────────────────────────────────────── */
.yday{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.yday .lab{font-size:12px;color:var(--mist);margin-bottom:5px}
.yday button{all:unset;cursor:pointer;font-family:'Nunito',sans-serif;font-size:15px;color:var(--ink-soft);
  border-bottom:1px dotted var(--mist);padding-bottom:1px}
.yday .yk{font-size:12.5px;color:var(--mist);margin-top:4px}
.yday button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* ── 리듬 점: 박자를 짚어 준다 ─────────────────────── */
.beats{display:flex;gap:10px;justify-content:center;align-items:center;margin:2px 0 10px;height:16px}
.beats i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.beats.go i{animation:beat 1.5s ease-in-out infinite}
.beats.go i:nth-child(2){animation-delay:.5s}
.beats.go i:nth-child(3){animation-delay:1s}
@keyframes beat{0%,100%{background:var(--line);transform:none}18%{background:var(--blue);transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.beats.go i{animation:none;background:var(--blue)}}

/* ── 타일 조립 ─────────────────────────────────────── */
.slotline{min-height:56px;border-bottom:2px dashed var(--line);margin:8px auto 14px;max-width:560px;
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;padding:8px 4px 12px}
.slotline .ph{font-size:13.5px;color:var(--mist)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;margin:0 auto}
.tile{border:1.5px solid var(--line);background:#FCFDFF;border-radius:12px;padding:10px 14px;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:600;font-size:clamp(16px,4vw,19px);color:var(--ink)}
.tile:active{transform:scale(.96)}
.tile.used{opacity:.28;cursor:default;border-style:dashed}
.tile.placed{border-color:var(--ok);background:#F1F9F5;cursor:pointer}
.tile.no{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tile.no{animation:none}}
.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ── 도장 받침: 다섯 번의 기록 ─────────────────────── */
.tray{display:flex;gap:9px;justify-content:center;margin:18px auto 4px;flex-wrap:wrap}
.cell{width:44px;height:38px;border:1.5px solid var(--line);border-radius:12px;background:#FCFDFF;position:relative}
.cell.now{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.cell .stamp{position:absolute;inset:3px;border-radius:9px;background:var(--sun);color:#FFF9EF;
  display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1}
.cell .stamp::after{content:'';position:absolute;left:9px;bottom:-6px;width:0;height:0;
  border:6px solid transparent;border-top-color:var(--sun);border-bottom:0}
.cell .stamp.pop{animation:stamp .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.1);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cell .stamp.pop{animation:none}}
.tray-label{font-size:12.5px;color:var(--mist);margin-bottom:6px}

/* 큰 해도장 */
.bigsun{width:104px;height:104px;border-radius:50%;background:var(--sun);color:#FFF9EF;margin:18px auto 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--kedu-title);box-shadow:0 6px 20px rgba(206,127,19,.28)}
.bigsun .c{font-size:38px;line-height:1}
.bigsun .t{font-size:11px;letter-spacing:2px;opacity:.9;margin-top:4px}
.bigsun.pop{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}

/* ── 버튼 ─────────────────────────────────────────── */
.row{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.bt{border:1.5px solid var(--ink);background:var(--ink);color:#FFF;border-radius:13px;
  padding:12px 22px;font-family:var(--kedu-title);font-size:16px;cursor:pointer}
.bt.line{background:transparent;color:var(--ink-soft);border-color:var(--line)}
.bt.sound{background:var(--blue);border-color:var(--blue);color:#FFF}
.bt:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.nodata{font-size:13.5px;color:var(--ink-soft);background:var(--blue-soft);border-radius:12px;
  padding:12px 14px;margin:12px auto 0;max-width:460px;line-height:1.75}

/* ── 둘러보기 ─────────────────────────────────────── */
.browse-bar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 18px;margin-bottom:16px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.browse-bar label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:6px}
.browse-bar select{font-family:inherit;font-size:15px;padding:10px 13px;border:1.5px solid var(--line);
  border-radius:12px;background:#FCFDFF;color:var(--ink)}
.browse-meta{font-size:13px;color:var(--ink-soft);flex:1;min-width:200px;line-height:1.7}
.week{margin-bottom:16px}
.week h3{font-family:var(--kedu-title);font-size:15px;color:var(--ink-soft);margin:0 2px 9px;
  display:flex;align-items:baseline;gap:8px}
.week h3 small{font-size:12px;color:var(--mist)}
.wlist{display:flex;flex-direction:column;gap:7px}
.wrow{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 14px;
  display:flex;gap:12px;align-items:baseline;text-decoration:none;color:var(--ink);position:relative}
.wrow .n{font-family:var(--kedu-title);font-size:12.5px;color:var(--mist);min-width:46px}
.wrow .s{font-family:'Nunito',sans-serif;font-weight:600;font-size:15.5px;flex:1;min-width:0}
.wrow .k{font-size:12.5px;color:var(--mist);flex-shrink:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .mini{position:absolute;top:8px;right:8px;width:15px;height:15px;border-radius:50%;background:var(--sun)}
@media (max-width:560px){.wrow{flex-wrap:wrap}.wrow .k{max-width:none;white-space:normal}}

.credit{margin-top:26px;font-size:11.5px;color:var(--mist);text-align:center;line-height:1.7}

/* ── 미리보기로 열었을 때 ─────────────────────────────
   교실 공용 기기에서 선생님이 미리 돌려 보는 일이 잦다. 그때 도장이 찍히면
   아이가 아직 만나지도 않은 날이 이미 끝난 것으로 남는다. 그래서 기록을 끄고,
   끈 사실을 화면에 적는다 — 조용히 다르게 도는 화면은 신뢰를 잃는다. */
.peeknote{background:#FFF6E3;border:1px solid #F0DCB4;color:#8A6320;border-radius:12px;
  padding:9px 13px;margin-bottom:12px;font-size:12.5px;line-height:1.65}

@media print{
  .nav,.head .nav-ch,.journey,.sheet,.row,.credit,.browse-bar select,.bt,.peeknote{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .wrow{break-inside:avoid}
}
</style>
</head>
<body>

<div class="nav">
  <a class="nav-logo" href="/morning/"><span class="dot"></span>오늘의 문장</a>
  <a class="back" id="backlink" href="/morning/">← 아침활동</a>
</div>

<div class="wrap" id="app"></div>

<script src="/kedu/quiz/templates/english_data.js"></script>
<script src="/english/v3/engine/k-tts.js"></script>
<script>
(function(){
  'use strict';
  var D = (window.KQuiz && window.KQuiz.englishData) || null;
  var app = document.getElementById('app');
  if (!D) { app.innerHTML = '<div class="sheet">문장 자료를 불러오지 못했어요. 새로고침해 주세요.</div>'; return; }

  var ROUNDS = 5;                       // 한 문장 = 다섯 번 (한자 열 번의 영어판)
  var st = { grade:3, di:1, stage:1, round:1, browse:false, met:false, peek:false };

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
  function total(){ return D.maxDay(st.grade); }
  function day(){ return D.day(st.grade, st.di); }

  /* ── 소리: 있으면 쓰고 없으면 조용히 넘어간다 ──
     교실 스피커가 없거나 브라우저가 막아도 활동 자체는 굴러가야 한다. */
  function tts(){ return window.KTTS || null; }
  function hasSound(){ var T = tts(); if (!T) return false;
    try { return T.available() !== false; } catch(e){ return true; } }
  function speakSent(t){ var T = tts(); if (!T) return Promise.resolve(false);
    try { return Promise.resolve(T.sentence(t, { interrupt:true })); } catch(e){ return Promise.resolve(false); } }
  function speakWord(t){ var T = tts(); if (!T) return Promise.resolve(false);
    try { return Promise.resolve(T.word(bare(t), { natural:true, interrupt:true })); } catch(e){ return Promise.resolve(false); } }
  function bare(t){ return String(t).replace(/[.,!?]/g, ''); }
  /* 모바일은 첫 터치 안에서 열어 줘야 소리가 난다 */
  (function unlockOnce(){
    function go(){ var T = tts(); if (T && T.unlock) { try { T.unlock(); } catch(e){} }
      document.removeEventListener('click', go, true); }
    document.addEventListener('click', go, true);
  })();

  /* ── 성취 기록(문장별 완주)은 이 기기에 남는다 ── */
  function doneMap(){
    try { return JSON.parse(localStorage.getItem('kedu_english_done_g'+st.grade) || '{}'); }
    catch(e){ return {}; }
  }
  function markDone(){
    if (st.peek) return;                 /* 미리보기로 열었으면 아무것도 남기지 않는다 */
    try { var m = doneMap(); m[st.di] = 1;
      localStorage.setItem('kedu_english_done_g'+st.grade, JSON.stringify(m)); } catch(e){}
  }

  /* ── 주소 풀기: c키·grade/day 모두 받는다 ── */
  function fromUrl(){
    var q = new URLSearchParams(location.search);
    var peek = q.get('peek') === '1';
    var key = q.get('key') || '';
    var m = key.match(/^g(\d)_english_c(\d{1,3})$/);
    if (m) return { grade:+m[1], di:+m[2], browse:false, peek:peek };
    var g = +q.get('grade') || D.grades()[0];
    if (q.get('day')) return { grade:g, di:+q.get('day'), browse:false, peek:peek };
    return { grade:g, di:1, browse:true, peek:peek };
  }
  /* 화면 안의 통로(전체·주차 목록)는 peek 를 계속 물고 간다 —
     한 번 미리보기로 들어왔는데 옆으로 한 칸 옮기자 기록이 살아나면 안 된다. */
  function peekQs(){ return st.peek ? '&peek=1' : ''; }
  function peekNote(){
    return st.peek
      ? '<div class="peeknote">미리보기로 열었어요 — 여기서 무엇을 해도 <b>기록이 남지 않아요</b>. '
        + '아이들이 만날 화면 그대로예요.</div>'
      : '';
  }
  function clamp(){
    if (D.grades().indexOf(st.grade) < 0) st.grade = D.grades()[0];
    st.di = Math.min(Math.max(st.di||1, 1), total() || 1);
  }

  /* ══════════════ 공통 조각 ══════════════ */

  function journeyHtml(){
    var names = ['만나기','다섯 번','넓히기'];
    return '<div class="journey">' + names.map(function(n,i){
      var k = i+1;
      var cls = k < st.stage ? 'done' : (k === st.stage ? 'on' : '');
      return (i? '<div class="jline"></div>':'')
        + '<div class="jstep '+cls+'"><div class="b">'+(k<st.stage?'✓':k)+'</div>'+n+'</div>';
    }).join('') + '</div>';
  }
  /* ★「몇 주 · 무슨 요일」은 이 화면이 알 수 없다 — 영어를 어느 요일에 넣을지는
     교사 시간표(ma_routines)가 정하고 원장에는 그 정보가 없다. 1일째가 월요일이라는
     근거는 어디에도 없었다. 화면은 원장이 아는 것(일째·전체 문장 수·틀)만 말한다. */
  function headHtml(){
    var p = D.patOf(st.grade, st.di);
    return peekNote()
      + '<div class="head">'
      + '<div class="day">'+st.grade+'학년 '+st.di+'일째 문장'
      +   '<small>모두 '+total()+'문장</small></div>'
      + (p ? '<div class="pat">오늘의 틀 <b>'+esc(p.ko)+'</b>'
             + '<span>'+p.len+'일 중 '+p.idx+'일째</span></div>' : '')
      + '<div class="nav-ch">'
      +   '<button class="chip" id="pv" type="button"'+(st.di<=1?' disabled':'')+'>← 어제</button>'
      +   '<button class="chip" id="nx" type="button"'+(st.di>=total()?' disabled':'')+'>내일 →</button>'
      +   '<a class="chip quiet" href="/morning/sents.html?grade='+st.grade+peekQs()+'">전체</a>'
      + '</div></div>';
  }
  function wireHead(){
    var pv = document.getElementById('pv'), nx = document.getElementById('nx');
    if (pv) pv.onclick = function(){ gotoDay(st.di-1); };
    if (nx) nx.onclick = function(){ gotoDay(st.di+1); };
  }
  function gotoDay(i){
    if (i < 1 || i > total()) return;
    st.di = i; st.stage = 1; st.round = 1; st.met = false; render();
  }
  function sentHtml(tiles, cls){
    /* 낱말 사이에 진짜 공백을 둔다 — flex 는 공백 텍스트를 칸으로 세지 않으므로 보기엔 그대로지만,
       화면을 긁어 복사하거나 낭독기가 읽을 때 'I'mgoing' 이 아니라 문장으로 읽힌다. */
    return '<div class="sent'+(cls?' '+cls:'')+'">' + tiles.map(function(t,i){
      return '<button type="button" class="w" data-w="'+i+'">'+esc(t)+'</button>';
    }).join(' ') + '</div>';
  }
  /* 문장 낱말을 하나씩 켠다 — 소리가 먼저 오고 글자가 따라온다 */
  function revealWords(root, delay, after){
    var ws = Array.prototype.slice.call(root.querySelectorAll('.w'));
    ws.forEach(function(el, i){
      setTimeout(function(){ el.classList.add('in'); }, delay + i*170);
    });
    setTimeout(function(){ if (after) after(); }, delay + ws.length*170 + 120);
  }
  function wireWordTaps(root){
    Array.prototype.slice.call(root.querySelectorAll('.w')).forEach(function(el){
      el.onclick = function(){
        el.classList.add('lit');
        setTimeout(function(){ el.classList.remove('lit'); }, 700);
        speakWord(el.textContent);
      };
    });
  }

  /* ── 타일 조립기: 2막·3막이 함께 쓴다 ──
     정답 순서와 어긋난 타일은 자리에 놓이지 않는다(흔들림).
     같은 글자가 두 번 나오는 문장(you, / you!)은 글자로 대조하므로 어느 쪽을 눌러도 된다. */
  function mountAssembler(opt){
    var slot = document.getElementById(opt.slotId), pool = document.getElementById(opt.poolId);
    var say = document.getElementById(opt.sayId);
    var want = opt.tiles, pos = 0;
    var order = want.map(function(t,i){ return {t:t,i:i}; }).sort(function(){ return Math.random()-0.5; });
    pool.innerHTML = order.map(function(o,i){
      return '<button type="button" class="tile" data-p="'+i+'">'+esc(o.t)+'</button>';
    }).join('');
    slot.innerHTML = '<span class="ph">'+esc(opt.placeholder || '낱말을 순서대로 눌러 문장을 만들어요')+'</span>';

    function paint(){
      if (!pos) { slot.innerHTML = '<span class="ph">'+esc(opt.placeholder || '낱말을 순서대로 눌러 문장을 만들어요')+'</span>'; return; }
      slot.innerHTML = want.slice(0, pos).map(function(t){
        return '<span class="tile placed">'+esc(t)+'</span>';
      }).join('');
    }
    Array.prototype.slice.call(pool.querySelectorAll('.tile')).forEach(function(b){
      b.onclick = function(){
        if (b.classList.contains('used')) return;
        if (b.textContent === want[pos]) {
          b.classList.add('used'); pos++;
          paint();
          if (pos >= want.length) {
            if (say) { say.className = 'say good'; say.textContent = opt.doneMsg || '문장 완성!'; }
            if (opt.onDone) opt.onDone();
          } else if (say) {
            say.className = 'say'; say.textContent = (want.length - pos) + '낱말 남았어요';
          }
        } else {
          b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
          if (say) { say.className = 'say oops'; say.textContent = '그 낱말이 아니에요. 소리를 다시 들어 볼까요?'; }
        }
      };
    });
    return { reset: function(){ pos = 0; paint();
      Array.prototype.slice.call(pool.querySelectorAll('.tile')).forEach(function(b){ b.classList.remove('used'); }); } };
  }

  /* ══════════════ 1막 · 만나기 ══════════════
     소리가 먼저 온다. 글자는 그 뒤를 따라온다. 뜻은 마지막이다. */
  function renderMeet(){
    var x = day();
    if (!x) { app.innerHTML = '<div class="sheet"><div class="nodata">이 학년은 아직 문장이 준비되지 않았어요.</div></div>'; return; }
    var y = st.di > 1 ? D.day(st.grade, st.di-1) : null;

    app.innerHTML = headHtml() + journeyHtml()
      + '<div class="sheet">'
      /* 예전엔 여기에 원장 내부 코드 'P4' 가 그대로 떴다 — 아이가 읽을 말이 아니다.
         틀은 이제 머리에서 아이 말(「좋아함」)로 선다. */
      + '<div class="beats" id="beats"><i></i><i></i><i></i></div>'
      + '<div class="bubble">' + sentHtml(x.tiles) + '</div>'
      + '<div class="ko" id="ko">'+esc(x.ko)+'</div>'
      + (x['new'] && x['new'].length
          ? '<div class="fresh-row" id="fresh"><div class="fresh-lab">오늘 처음 만나는 낱말 — 눌러서 들어 보세요</div>'
            + D.glossesOf(st.grade, st.di).map(function(it){
                /* 낱말 + 뜻. 뜻은 원장(gloss)에서만 온다 — 화면이 지어내지 않는다 */
                return '<button type="button" class="badge" data-n="'+esc(it.unit)+'"><span>'+esc(it.unit)+'</span>'
                  + (it.ko ? '<span class="gl">'+esc(it.ko)+'</span>' : '') + '</button>'; }).join('')
            + '</div>'
          : '')
      + '<div class="row">'
      +   '<button class="bt sound" id="replay" type="button">🔊 다시 듣기</button>'
      +   '<button class="bt" id="go-say" type="button">다섯 번 말하러 가기</button>'
      + '</div>'
      + (y ? '<div class="yday"><div class="lab">어제 만난 문장</div>'
             + '<button type="button" id="yb">'+esc(y.sent)+'</button>'
             + '<div class="yk">'+esc(y.ko)+'</div></div>' : '')
      + '</div>' + creditHtml();
    wireHead();

    var sheet = app.querySelector('.sheet');
    var beats = document.getElementById('beats');
    var koEl = document.getElementById('ko');

    function play(){
      beats.classList.add('go');
      speakSent(x.sent);
      revealWords(sheet, 260, function(){
        beats.classList.remove('go');
        koEl.classList.add('in');
        st.met = true;
      });
    }
    play();
    document.getElementById('replay').onclick = function(){ speakSent(x.sent); };
    document.getElementById('go-say').onclick = function(){ st.stage = 2; st.round = 1; render(); };
    wireWordTaps(sheet);

    /* 새 낱말은 문장 안에서도 밑줄로 표시한다 — 어디가 새것인지 눈으로 잡힌다 */
    if (x['new'] && x['new'].length) {
      var news = {}; x['new'].forEach(function(w){ news[w] = 1; });
      Array.prototype.slice.call(sheet.querySelectorAll('.sent .w')).forEach(function(el, i){
        var unit = (x.words || [])[i];
        if (unit && news[unit]) el.classList.add('fresh');
      });
      Array.prototype.slice.call(document.querySelectorAll('#fresh .badge')).forEach(function(b){
        b.onclick = function(){ speakWord(b.dataset.n); };
      });
    }
    if (y) document.getElementById('yb').onclick = function(){ speakSent(y.sent); };
  }

  /* ══════════════ 2막 · 다섯 번 ══════════════
     매회 = 소리 내어 함께 말하기 + 타일 조립.
     마이크 채점은 하지 않는다. 조립 성공이 그 회의 도장이다.

     ★비계 계단 1-2-2 (2026-08-16 재배분). 이전은 2-2-1 이었다 —
     가장 쉬운 회(문장 보고)가 40%를 먹고, 이 설계의 목적지인 "소리만 듣고 재생"이
     20%뿐이었다. 5가 3단 계단에 안 나눠떨어져서 생긴 배분이지 의도한 무게중심이 아니었다.
     1막에서 문장·소리·뜻을 이미 다 만났으므로 「보고 말하기」는 손에 익히는 1회면 족하다.
     남은 넷을 뜻만 2 · 소리만 2 로 주어 무게중심을 뒤로 옮긴다.
       1회 문장 보고 → 2·3회 뜻만 보고 → 4·5회 소리만 듣고

     ★5회차는 소리가 저절로 오지 않는다(autoHear:false). 비계 축소의 마지막 한 칸은
     "도움을 없애는 것"이 아니라 "도움을 불러야 오게 하는 것"이다 — 🔊 다시 듣기는 그대로 있고
     누르면 언제든 온다. 4회와 5회가 조건이 같아 마지막 회가 그냥 반복이 되던 것도 이걸로 갈린다.
     소리 없는 기기에서는 어차피 아무것도 울리지 않으므로 동작이 완전히 같다(설계 §4 D3확정 ②). */
  function roundCfg(r){
    if (r <= 1) return { show:'sent', label:'보고 말하기', autoHear:true,
                         lead:'문장을 보면서 <b>소리 내어</b> 함께 말해요' };
    if (r <= 3) return { show:'ko',   label:'뜻만 보고',   autoHear:true,
                         lead:'이번엔 <b>뜻만</b> 보고 말해 볼까요?' };
    if (r <= 4) return { show:'none', label:'소리만 듣고', autoHear:true,
                         lead:'이번엔 <b>소리만</b> 듣고 만들어 보세요' };
    return           { show:'none', label:'혼자서',     autoHear:false,
                         lead:'마지막! <b>혼자서</b> 만들어 보세요 — 소리가 필요하면 눌러요' };
  }
  function trayHtml(){
    var out = '';
    for (var i = 1; i <= ROUNDS; i++) {
      out += '<div class="cell'+(i===st.round?' now':'')+'" data-r="'+i+'">'
        + (i < st.round ? '<div class="stamp">💬</div>' : '') + '</div>';
    }
    return '<div class="tray-label">다섯 번 말하면 해도장을 찍어요</div><div class="tray">'+out+'</div>';
  }
  function renderSay(){
    var x = day(), cfg = roundCfg(st.round);
    app.innerHTML = headHtml() + journeyHtml()
      + '<div class="sheet">'
      + '<div class="corner"><b>'+st.round+'번째</b> · '+esc(cfg.label)+'</div>'
      + '<div class="beats" id="beats"><i></i><i></i><i></i></div>'
      + (cfg.show === 'sent'
          ? '<div class="bubble">' + sentHtml(x.tiles, 'allin') + '</div>'
          : '<div class="bubble quiet"><div style="font-size:15px;color:var(--ink-soft);line-height:1.7">'
            + (cfg.show === 'ko' ? esc(x.ko) : '소리를 듣고 떠올려 보세요')
            + '</div></div>')
      + '<div style="font-size:14px;color:var(--ink-soft);margin-top:10px">'+cfg.lead+'</div>'
      + '<div class="slotline" id="slot"></div>'
      + '<div class="pool" id="pool"></div>'
      + '<div class="say" id="say"></div>'
      + trayHtml()
      + '<div class="row">'
      +   '<button class="bt sound" id="hear" type="button">🔊 다시 듣기</button>'
      +   '<button class="bt line" id="again" type="button">이 번 다시</button>'
      + '</div>'
      + '</div>' + creditHtml();
    wireHead();

    var sheet = app.querySelector('.sheet');
    if (cfg.show === 'sent') {
      Array.prototype.slice.call(sheet.querySelectorAll('.sent .w')).forEach(function(el){ el.classList.add('in'); });
      wireWordTaps(sheet);
    }
    var beats = document.getElementById('beats');
    function hear(){
      beats.classList.add('go');
      speakSent(x.sent);
      setTimeout(function(){ beats.classList.remove('go'); }, 2200);
    }
    if (cfg.autoHear) hear();                 // 소리로 시작한다 — 합창의 신호
    document.getElementById('hear').onclick = hear;   // 마지막 회에도 부르면 온다
    document.getElementById('again').onclick = function(){ renderSay(); };

    mountAssembler({
      slotId:'slot', poolId:'pool', sayId:'say', tiles:x.tiles,
      placeholder: cfg.show === 'none' ? '들은 대로 낱말을 눌러 보세요' : '낱말을 순서대로 눌러 문장을 만들어요',
      doneMsg: '좋아요! 소리 내어 한 번 더 말해 볼까요?',
      onDone: finishRound
    });
  }
  function finishRound(){
    var say = document.getElementById('say');
    var cellNow = document.querySelector('.cell[data-r="'+st.round+'"]');
    if (cellNow) {
      cellNow.classList.remove('now');
      cellNow.innerHTML = '<div class="stamp pop">💬</div>';
    }
    if (st.round >= ROUNDS) {
      setTimeout(function(){ st.stage = 3; render(); }, 700);
    } else {
      st.round++;
      if (say) { say.className = 'say good'; say.textContent = st.round + '번째로 갈까요?'; }
      setTimeout(function(){ if (st.stage === 2) renderSay(); }, 650);
    }
  }

  /* ══════════════ 3막 · 넓히기 ══════════════
     외운 문장을 다시 뱉는 게 아니라, 같은 틀에 새 재료를 끼운다.
     넓히기 문장이 없는 날(도입일)은 지어내지 않는다 — 오늘 낱말을 다시 만난다. */
  function renderWiden(){
    var x = day(), ex = x.expand;
    var inner;
    if (ex && ex.sent) {
      var tiles = String(ex.sent).split(/\s+/).filter(Boolean);
      inner = '<div class="corner">넓히기</div>'
        + '<div style="font-size:14.5px;color:var(--ink-soft);line-height:1.75;margin-bottom:6px">'
        +   '오늘 문장의 <b>틀</b>은 그대로, 재료만 바꿔요.<br>'
        +   '<span style="font-size:13.5px;color:var(--mist)">' + esc(x.sent) + '</span></div>'
        + '<div class="bubble quiet"><div style="font-size:16px;color:var(--ink)">'+esc(ex.ko)+'</div></div>'
        + '<div class="slotline" id="slot"></div>'
        + '<div class="pool" id="pool"></div>'
        + '<div class="say" id="say"></div>'
        + '<div class="row">'
        +   '<button class="bt line" id="hint" type="button">🔊 오늘 문장 듣기</button>'
        +   '<button class="bt" id="fin" type="button" disabled>오늘 문장 끝내기</button>'
        + '</div>';
    } else {
      var news = (x['new'] || []);
      inner = '<div class="corner">넓히기</div>'
        + '<div class="nodata">오늘은 새 문장을 만들지 않아요. 아직 배운 낱말만으로는 이 틀에 끼울 재료가 모자라거든요.<br>'
        +   '대신 오늘 낱말을 한 번 더 만나요.</div>'
        + (news.length
            ? '<div class="fresh-row" style="margin-top:16px">'
              /* 여기도 1막과 같은 배지다 — 한 화면에서만 뜻이 보이면 아이는 어느 쪽이 진짜인지 모른다 */
              + D.glossesOf(st.grade, st.di).map(function(it){
                  return '<button type="button" class="badge" data-n="'+esc(it.unit)+'"><span>'+esc(it.unit)+'</span>'
                    + (it.ko ? '<span class="gl">'+esc(it.ko)+'</span>' : '') + '</button>'; }).join('')
              + '</div>'
            : '<div class="bubble" style="margin-top:14px">' + sentHtml(x.tiles, 'allin') + '</div>')
        + '<div class="say" id="say"></div>'
        + '<div class="row">'
        +   '<button class="bt sound" id="hint" type="button">🔊 오늘 문장 듣기</button>'
        +   '<button class="bt" id="fin" type="button">오늘 문장 끝내기</button>'
        + '</div>';
    }
    app.innerHTML = headHtml() + journeyHtml() + '<div class="sheet">' + inner + '</div>' + creditHtml();
    wireHead();

    var sheet = app.querySelector('.sheet');
    Array.prototype.slice.call(sheet.querySelectorAll('.sent .w')).forEach(function(el){ el.classList.add('in'); });
    wireWordTaps(sheet);
    Array.prototype.slice.call(sheet.querySelectorAll('.badge')).forEach(function(b){
      b.onclick = function(){ speakWord(b.dataset.n); };
    });
    document.getElementById('hint').onclick = function(){ speakSent(x.sent); };
    var fin = document.getElementById('fin');
    fin.onclick = renderDone;

    if (ex && ex.sent) {
      mountAssembler({
        slotId:'slot', poolId:'pool', sayId:'say',
        tiles: String(ex.sent).split(/\s+/).filter(Boolean),
        placeholder:'뜻을 보고 새 문장을 만들어 보세요',
        doneMsg:'새 문장을 만들었어요!',
        onDone: function(){
          fin.disabled = false;
          speakSent(ex.sent);
        }
      });
    }
  }

  /* ── 마무리: 해도장 ── */
  function renderDone(){
    var x = day();
    markDone();
    app.innerHTML = headHtml() + journeyHtml().replace('jstep on','jstep done')
      + '<div class="sheet">'
      + '<div class="bigsun pop"><div class="c">☀</div><div class="t">'+st.di+'일째</div></div>'
      + '<div style="font-family:var(--kedu-title);font-size:19px;margin-top:4px">오늘 문장, 내 것이 됐어요!</div>'
      + '<div class="bubble quiet" style="margin-top:14px"><div style="font-family:\'Nunito\',sans-serif;'
      +   'font-weight:700;font-size:19px">'+esc(x.sent)+'</div>'
      +   '<div style="font-size:13.5px;color:var(--ink-soft);margin-top:6px">'+esc(x.ko)+'</div></div>'
      + '<div class="row">'
      +   '<a class="bt" href="/morning/" style="text-decoration:none">확인 문제 풀러 가기</a>'
      +   '<button class="bt line" id="onemore" type="button">한 번 더 말하기</button>'
      + '</div>'
      + '</div>' + creditHtml();
    wireHead();
    document.getElementById('onemore').onclick = function(){ st.stage = 2; st.round = 1; render(); };
    speakSent(x.sent);
  }

  /* ══════════════ 둘러보기(교사·전체) ══════════════ */
  /* ★묶음 단위 = 주(X) → 틀(O). 「5일 = 1주」는 영어가 매일 배정된다는 가정 위에 서 있었는데
     그 가정의 근거가 없다(교사가 요일을 정한다). 틀은 원장이 아는 유일한 묶음이고,
     설계 §2 의 목적지(낱문장 암기가 아니라 틀 획득)가 그제야 화면에 보인다. */
  function renderBrowse(){
    var done = doneMap(), n = total(), groups = D.patGroups(st.grade);
    var out = peekNote()
      + '<div class="browse-bar">'
      + '<div><label for="g">학년</label><select id="g">'
      + D.grades().map(function(g){ return '<option value="'+g+'"'+(g===st.grade?' selected':'')+'>'+g+'학년</option>'; }).join('')
      + '</select></div>'
      + '<div class="browse-meta"><b>'+st.grade+'학년</b>은 하루 한 문장, 모두 <b>'+n+'문장</b> · '
      +   '틀 <b>'+groups.length+'</b>가지예요. 문장을 누르면 그날 활동이 열려요.</div>'
      + '<button class="bt line" id="print" type="button">인쇄</button>'
      + '</div>';
    for (var w = 0; w < groups.length; w++) {
      var gp = groups[w], rows = '';
      for (var i = gp.from; i <= gp.to; i++) {
        var x = D.day(st.grade, i);
        rows += '<a class="wrow" href="/morning/sents.html?grade='+st.grade+'&day='+i+peekQs()+'">'
          + (done[i] ? '<span class="mini"></span>' : '')
          + '<span class="n">'+i+'일째</span>'
          + '<span class="s">'+esc(x.sent)+'</span>'
          + '<span class="k">'+esc(x.ko)+'</span></a>';
      }
      out += '<div class="week"><h3>'+gp.no+'. '+esc(gp.ko)
        + ' <small>'+gp.from+(gp.to>gp.from?'~'+gp.to:'')+'일째</small></h3>'
        + '<div class="wlist">'+rows+'</div></div>';
    }
    app.innerHTML = out + creditHtml();
    document.getElementById('g').onchange = function(){ st.grade = +this.value; render(); };
    document.getElementById('print').onclick = function(){ window.print(); };
  }

  function creditHtml(){
    return '<p class="credit">' + (hasSound()
      ? '문장 소리 — 케이에듀 소리 엔진(KTTS)'
      : '이 기기는 소리를 낼 수 없어요. 선생님과 함께 소리 내어 말해 보세요.') + '</p>';
  }

  function render(){
    clamp();
    if (st.browse) return renderBrowse();
    if (st.stage === 1) return renderMeet();
    if (st.stage === 2) return renderSay();
    return renderWiden();
  }

  var u = fromUrl();

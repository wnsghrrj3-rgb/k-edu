<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침활동 관리 — 케이에듀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap" rel="stylesheet">
<style>:root{--kedu-title:'Hakgyoansim Moheomga','Jua',sans-serif}</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8EF8;--primary-light:#EBF4FF;--pink:#FF85A1;
  --bg:#F4F6FB;--card:#fff;--ink:#1A202C;--sub:#718096;--faint:#A0AEC0;--border:#E7ECF3;
  --radius:20px;--shadow:0 2px 18px rgba(33,52,94,.07);--done:#22A06B;--warn:#E8A33D;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
.nav{background:var(--card);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.nav-logo{font-family:var(--kedu-title);font-size:21px;text-decoration:none;color:var(--ink)}
.nav-logo .kk{background:linear-gradient(135deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.wrap{max-width:780px;margin:0 auto;padding:26px 18px 80px}
.loading{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);font-size:14px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
.card h2{font-family:var(--kedu-title);font-size:18px;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--faint);margin-bottom:16px;line-height:1.6}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
label{font-size:13px;color:var(--sub);font-weight:500}
select,input[type=number],input[type=text]{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--ink)}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.day{border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.day .n{font-family:var(--kedu-title);font-size:15px;margin-bottom:8px}
.day select{width:100%;padding:7px 4px;font-size:12.5px;text-align:center}

.btn{border:none;border-radius:13px;padding:12px 18px;font-family:var(--kedu-title);font-size:15px;cursor:pointer;background:var(--primary);color:#fff}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--primary-light);color:var(--primary)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.line{background:transparent;border:1px solid var(--border);color:var(--sub)}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum .b{background:var(--bg);border-radius:14px;padding:14px;text-align:center}
.sum .v{font-family:var(--kedu-title);font-size:24px}
.sum .l{font-size:11.5px;color:var(--faint);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:500;padding:0 6px 8px}
td{padding:11px 6px;border-top:1px solid var(--border);vertical-align:middle}
td.name{font-weight:700}
.chip{display:inline-block;border-radius:50px;padding:3px 11px;font-size:11.5px;font-weight:700}
.c-none{background:#FDF0F0;color:#D45B5B}
.c-sub{background:#EBF4FF;color:var(--primary)}
.c-grd{background:#E4F7EE;color:var(--done)}
.fbin{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font-family:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#1A202C;color:#fff;padding:12px 22px;border-radius:50px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
.msg{text-align:center;padding:34px 20px;color:var(--sub);font-size:14.5px;line-height:1.7}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/teacher/"><span class="kk">케이에듀</span> 아침활동</a>
  <span style="font-size:13px;color:var(--sub);font-weight:600" id="me"></span>
</nav>

<div class="wrap" id="wrap">
  <div class="loading"><div class="spin"></div>불러오는 중…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu_config.js"></script>
<script>
(function(){
  'use strict';
  var db = getKeduDb();
  var wrap = document.getElementById('wrap');
  var DOWS = [['mon','월'],['tue','화'],['wed','수'],['thu','목'],['fri','금']];
  var SUBJECTS = [['','—'],['hanja','한자']];   // 과목이 늘면 여기만 추가하면 화면이 따라온다
  var SUBJECT_KO = { hanja:'한자', english:'영어', math:'수학', korean:'국어' };
  var state = { classes:[], cc:null, routine:null, session:null, board:null };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},1800); }

  function render(){
    var r = state.routine || { grade:1, days:{}, question_count:10, active:true };
    var classOpts = state.classes.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===state.cc?' selected':'')+'>'+esc(c.label||c.code)+'</option>';
    }).join('');

    var dayCells = DOWS.map(function(d){
      var cur = (r.days||{})[d[0]] || '';
      var opts = SUBJECTS.map(function(s){
        return '<option value="'+s[0]+'"'+(s[0]===cur?' selected':'')+'>'+s[1]+'</option>';
      }).join('');
      return '<div class="day"><div class="n">'+d[1]+'</div><select data-dow="'+d[0]+'">'+opts+'</select></div>';
    }).join('');

    var gradeOpts = [1,2,3,4,5,6].map(function(g){
      return '<option value="'+g+'"'+(g===r.grade?' selected':'')+'>'+g+'학년</option>';
    }).join('');

    var html =
      '<div class="card">'
      + '<h2>요일 시간표</h2>'
      + '<div class="hint">한 번 정해 두면 매일 아침 그날 것이 저절로 올라갑니다. 진도는 회차가 하나씩 자동으로 넘어가고, 한 바퀴 다 돌면 복습으로 이어집니다.</div>'
      + '<div class="row">'
      +   '<label>학급</label><select id="cc">'+classOpts+'</select>'
      +   '<label>학년</label><select id="grade">'+gradeOpts+'</select>'
      +   '<label>문항 수</label><input type="number" id="qc" min="5" max="20" value="'+(r.question_count||10)+'" style="width:74px">'
      + '</div>'
      + '<div class="days">'+dayCells+'</div>'
      + '<div class="row" style="margin-bottom:0">'
      +   '<button class="btn" id="save">시간표 저장</button>'
      +   '<button class="btn line sm" id="preview">오늘 것 미리 보기</button>'
      + '</div>'
      + '</div>'
      + '<div id="board"></div>';

    wrap.innerHTML = html;
    document.getElementById('cc').onchange = function(){ state.cc = this.value; loadClassData(); };
    document.getElementById('save').onclick = saveRoutine;
    document.getElementById('preview').onclick = function(){ loadBoard(true); };
    renderBoard();
  }

  function saveRoutine(){
    var days = {};
    document.querySelectorAll('[data-dow]').forEach(function(s){ if(s.value) days[s.dataset.dow] = s.value; });
    db.rpc('ma_set_routine', {
      p_class_code_id: state.cc,
      p_grade: Number(document.getElementById('grade').value),
      p_days: days,
      p_question_count: Number(document.getElementById('qc').value),
      p_active: true
    }).then(function(res){
      if (res.data && res.data.status === 'ok') { toast('시간표를 저장했어요'); loadClassData(); }
      else toast('저장하지 못했어요');
    });
  }

  function renderBoard(){
    var el = document.getElementById('board'); if(!el) return;
    var b = state.board;
    if (!b) { el.innerHTML = ''; return; }
    if (b.status === 'off_day' || b.status === 'no_routine') {
      el.innerHTML = '<div class="card"><div class="msg">오늘은 아침활동이 없는 날이에요.</div></div>'; return;
    }
    if (b.status !== 'ok') { el.innerHTML=''; return; }

    var s = b.session, sm = b.summary || {};
    var rows = (b.rows||[]).map(function(r){
      var chip = !r.submitted ? '<span class="chip c-none">미제출</span>'
               : r.status === 'graded' ? '<span class="chip c-grd">확인함</span>'
               : '<span class="chip c-sub">제출</span>';
      var auto = r.submitted ? (r.auto_score + ' / ' + r.auto_max) : '-';
      var mins = r.spent_sec ? Math.round(r.spent_sec/60)+'분' : '';
      return '<tr data-pid="'+r.student_profile_id+'">'
        + '<td class="name">'+esc(r.nickname)+'</td>'
        + '<td>'+chip+'</td>'
        + '<td>'+esc(auto)+'</td>'
        + '<td style="color:var(--faint);font-size:12px">'+mins+'</td>'
        + '<td style="width:38%">'+(r.submitted
            ? '<input class="fbin" placeholder="한마디 남기기" value="'+esc(r.feedback||'')+'">'
            : '<span style="color:var(--faint);font-size:12px">—</span>')+'</td>'
        + '<td>'+(r.submitted?'<button class="btn ghost sm act">저장</button>':'')+'</td>'
        + '</tr>';
    }).join('');

    el.innerHTML = '<div class="card">'
      + '<h2>오늘 현황 — '+esc(SUBJECT_KO[s.subject]||s.subject)+' '+(s.mode==='review'?'복습':s.step+'회차')+'</h2>'
      + '<div class="hint">'+esc(s.run_date)+' · '+esc(s.lesson_key)+'</div>'
      + '<div class="sum">'
      +   '<div class="b"><div class="v">'+(sm.total||0)+'</div><div class="l">전체</div></div>'
      +   '<div class="b"><div class="v" style="color:var(--primary)">'+(sm.submitted||0)+'</div><div class="l">제출</div></div>'
      +   '<div class="b"><div class="v" style="color:var(--warn)">'+((sm.total||0)-(sm.submitted||0))+'</div><div class="l">미제출</div></div>'
      + '</div>'
      + '<div class="row"><button class="btn ghost sm" id="bulk">자동 점수 한꺼번에 확정</button></div>'
      + '<table><thead><tr><th>이름</th><th>상태</th><th>점수</th><th>걸린 시간</th><th>피드백</th><th></th></tr></thead>'
      + '<tbody>'+rows+'</tbody></table>'
      + '</div>';

    document.getElementById('bulk').onclick = function(){
      db.rpc('ma_grade', { p_session_id: s.id }).then(function(){ toast('자동 점수를 확정했어요'); loadBoard(); });
    };
    el.querySelectorAll('.act').forEach(function(btn){
      btn.onclick = function(){
        var tr = btn.closest('tr');
        db.rpc('ma_grade', {
          p_session_id: s.id,
          p_student_profile_id: tr.dataset.pid,
          p_feedback: tr.querySelector('.fbin').value
        }).then(function(){ toast('저장했어요'); loadBoard(); });
      };
    });
  }

  function loadBoard(force){
    return db.rpc('ma_today', { p_class_code_id: state.cc }).then(function(res){
      var t = res.data || {};
      if (t.status !== 'ok') { state.board = { status:t.status }; renderBoard(); return; }
      state.session = t;
      return db.rpc('ma_board', { p_session_id: t.session_id }).then(function(r2){
        state.board = r2.data; renderBoard();
      });
    });
  }

  function loadClassData(){
    return db.from('ma_routines').select('*').eq('class_code_id', state.cc).maybeSingle()
      .then(function(r){ state.routine = r.data; render(); return loadBoard(); });
  }

  db.auth.getUser().then(function(u){
    if (!u || !u.data || !u.data.user) { location.href = '/auth/'; return; }
    db.from('teachers').select('id,name').eq('user_id', u.data.user.id).maybeSingle().then(function(t){
      if (!t.data) { wrap.innerHTML = '<div class="card"><div class="msg">교사 계정으로 로그인해 주세요.</div></div>'; return; }
      document.getElementById('me').textContent = t.data.name + ' 선생님';
      db.from('class_codes').select('id,code,label').eq('teacher_id', t.data.id).eq('is_active', true)
        .then(function(c){
          state.classes = c.data || [];
          if (!state.classes.length) { wrap.innerHTML = '<div class="card"><div class="msg">먼저 학급을 만들어 주세요.</div></div>'; return; }
          state.cc = state.classes[0].id;
          loadClassData();
        });
    });
  });
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

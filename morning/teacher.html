<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침활동 — 케이에듀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--kedu-title:'Gowun Batang','Gowun Dodum',serif}</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8EF8;--primary-light:#EBF4FF;--pink:#FF85A1;
  --bg:#F4F6FB;--card:#fff;--ink:#1A202C;--sub:#718096;--faint:#A0AEC0;--border:#E7ECF3;
  --radius:20px;--shadow:0 2px 18px rgba(33,52,94,.07);--shadow-lg:0 18px 50px rgba(33,52,94,.16);
  --done:#22A06B;--warn:#E8A33D;
}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
.nav{background:var(--card);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.nav-logo{font-family:var(--kedu-title);font-size:21px;text-decoration:none;color:var(--ink)}
.nav-logo .kk{background:linear-gradient(135deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.wrap{max-width:640px;margin:0 auto;padding:26px 18px 80px}
.loading{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);font-size:14px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.card h2{font-family:var(--kedu-title);font-size:19px;margin-bottom:6px}
.hint{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:16px}

.big-btn{display:block;width:100%;border:none;border-radius:16px;padding:18px;font-family:var(--kedu-title);
  font-size:19px;cursor:pointer;background:linear-gradient(135deg,#5B8EF8,#7B6EF6);color:#fff;
  box-shadow:0 8px 24px rgba(91,142,248,.35);transition:transform .12s}
.big-btn:active{transform:scale(.98)}
.big-btn:disabled{opacity:.55;cursor:not-allowed}
.btn{border:none;border-radius:13px;padding:11px 16px;font-family:var(--kedu-title);font-size:14px;cursor:pointer;background:var(--primary);color:#fff}
.btn.ghost{background:var(--primary-light);color:var(--primary)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.line{background:transparent;border:1px solid var(--border);color:var(--sub)}

input[type=text],select,input[type=number]{font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--border);border-radius:13px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--primary)}
label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin-bottom:7px}
.row2{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-bottom:14px}

.ok-banner{background:linear-gradient(135deg,#E4F7EE,#EBF4FF);border-radius:var(--radius);padding:22px;margin-bottom:16px;text-align:center}
.ok-banner .big{font-size:38px;margin-bottom:6px}
.ok-banner b{font-family:var(--kedu-title);font-size:18px;display:block;margin-bottom:4px}
.ok-banner span{font-size:13.5px;color:var(--sub);line-height:1.6}
.code-chip{display:inline-block;background:var(--card);border:2px dashed var(--primary);border-radius:14px;
  padding:10px 22px;font-family:var(--kedu-title);font-size:26px;letter-spacing:5px;color:var(--primary);margin:10px 0 4px}

details{border:1px solid var(--border);border-radius:14px;padding:0;margin-top:14px}
details summary{cursor:pointer;padding:13px 16px;font-size:13.5px;color:var(--sub);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:'▾';color:var(--faint)}
details[open] summary::after{content:'▴'}
details .inner{padding:4px 16px 16px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px}
.day{border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center}
.day .n{font-family:var(--kedu-title);font-size:14px;margin-bottom:7px}
.day select{padding:6px 2px;font-size:12px;text-align:center;border-radius:9px}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum .b{background:var(--bg);border-radius:14px;padding:14px;text-align:center}
.sum .v{font-family:var(--kedu-title);font-size:24px}
.sum .l{font-size:11.5px;color:var(--faint);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:500;padding:0 6px 8px}
td{padding:11px 6px;border-top:1px solid var(--border);vertical-align:middle}
td.name{font-weight:700}
.chip{display:inline-block;border-radius:50px;padding:3px 11px;font-size:11.5px;font-weight:700}
.c-none{background:#FDF0F0;color:#D45B5B}
.c-sub{background:#EBF4FF;color:var(--primary)}
.c-grd{background:#E4F7EE;color:var(--done)}
.fbin{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;font-family:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#1A202C;color:#fff;padding:12px 22px;border-radius:50px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
.msg{text-align:center;padding:34px 20px;color:var(--sub);font-size:14.5px;line-height:1.7}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.step-dot{width:26px;height:5px;border-radius:3px;background:var(--border)}
.step-dot.on{background:var(--primary)}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/teacher/"><span class="kk">케이에듀</span> 아침활동</a>
  <span style="font-size:13px;color:var(--sub);font-weight:600" id="me"></span>
</nav>

<div class="wrap" id="wrap">
  <div class="loading"><div class="spin"></div>준비 중…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu/quiz/templates/hanja_data.js"></script>
<script src="/kedu_config.js"></script>
<script>
(function(){
  'use strict';
  var db = getKeduDb();
  var wrap = document.getElementById('wrap');
  var DOWS = [['mon','월'],['tue','화'],['wed','수'],['thu','목'],['fri','금']];
  var SUBJECTS = [['','—'],['hanja','한자'],['math','수학']];
  var SUBJECT_KO = { hanja:'한자', english:'영어', math:'수학', korean:'국어' };
  var SUBJECT_UNIT = { hanja:'하루 한 자', math:'하루 한 차시' };
  /* 요일 시간표를 사람 말로 — 과목이 하나면 '한자 하루 한 자', 섞이면 '월·화 한자, 목·금 수학' */
  function routineTxt(r){
    var days = (r&&r.days)||{}, order=['mon','tue','wed','thu','fri'], KO={mon:'월',tue:'화',wed:'수',thu:'목',fri:'금'};
    var by={}; order.forEach(function(d){ var s=days[d]; if(s){ (by[s]=by[s]||[]).push(KO[d]); } });
    var subs=Object.keys(by);
    if(!subs.length) return '아직 과목이 없어요';
    if(subs.length===1){ var s=subs[0]; return (SUBJECT_KO[s]||s)+' <b>'+(SUBJECT_UNIT[s]||'하루 한 걸음')+'</b>'; }
    return subs.map(function(s){ return by[s].join('·')+'요일 '+(SUBJECT_KO[s]||s)+'('+(SUBJECT_UNIT[s]||'')+')'; }).join(', ');
  }
  var ALL_HANJA = { mon:'hanja', tue:'hanja', wed:'hanja', thu:'hanja', fri:'hanja' };
  var state = { teacher:null, classes:[], cc:null, routine:null, board:null };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},2000); }
  function cur(){ return state.classes.find(function(c){ return c.id===state.cc; }) || {}; }
  function genCode(){ var ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s=''; for(var i=0;i<6;i++) s+=ch[Math.floor(Math.random()*ch.length)]; return s; }
  /* lesson_key(g4_hanja_c015)에서 오늘 글자를 꺼낸다 — 데이터가 없으면 조용히 생략 */
  function todayCharTag(sess){
    try {
      var m = (sess.lesson_key||'').match(/^g(\d)_hanja_c(\d{1,3})$/);
      if (!m || !window.KQuiz || !KQuiz.hanjaData) return '';
      var x = KQuiz.hanjaData.all(+m[1])[+m[2]-1];
      return x ? ' 「'+x.c+'」 '+x.hun+' '+x.eum : '';
    } catch(e){ return ''; }
  }
  function dots(n){ return '<div class="steps">'+[1,2,3].map(function(i){return '<div class="step-dot'+(i<=n?' on':'')+'"></div>';}).join('')+'</div>'; }

  /* ═══ 1단계: 반이 없다 → 이 자리에서 만든다 ═══ */
  function renderMakeClass(){
    wrap.innerHTML = dots(1) + '<div class="card">'
      + '<h2>🌅 우리 반부터 만들게요</h2>'
      + '<div class="hint">이름과 학년만 정하면 끝이에요. 학급코드는 저절로 만들어져요.</div>'
      + '<div class="row2">'
      + '<div><label>반 이름</label><input type="text" id="cls-name" placeholder="예: 1학년 1반" maxlength="20"></div>'
      + '<div><label>학년</label><select id="cls-grade">'
      + [1,2,3,4,5,6].map(function(g){return '<option value="'+g+'">'+g+'학년</option>';}).join('')
      + '</select></div></div>'
      + '<button class="big-btn" id="mk">반 만들기</button>'
      + '</div>';
    document.getElementById('mk').onclick = async function(){
      var name = document.getElementById('cls-name').value.trim() || '내 학급';
      var grade = Number(document.getElementById('cls-grade').value);
      this.disabled = true;
      var r = await db.from('class_codes').insert({
        code: genCode(), label: name, grade: grade, semester: 1,
        is_active: true, teacher_id: state.teacher.id, consent_confirmed: false
      }).select().single();
      if (r.error) { toast('만들지 못했어요: '+r.error.message); this.disabled=false; return; }
      state.classes.push(r.data); state.cc = r.data.id;
      renderStartRoutine();   // 만들자마자 바로 다음 단계
    };
  }

  /* ═══ 2단계: 시간표가 없다 → 버튼 하나로 시작 ═══ */
  function renderStartRoutine(){
    var c = cur();
    wrap.innerHTML = dots(2) + '<div class="card">'
      + '<h2>매일 아침, 한자 한 자</h2>'
      + '<div class="hint"><b>'+esc(c.label||'우리 반')+'</b>에 월~금 아침마다 새 한자 <b>한 자</b>가 올라가요.<br>'
      + '획순 보고 → 열 번 따라 쓰고 → 낱말까지, 그리고 확인 문제로 마무리.<br>'
      + '진도도 채점도 저절로 — 선생님은 결과만 보면 끝!</div>'
      + '<button class="big-btn" id="go">매일 아침 한자 시작하기</button>'
      + '<details><summary>요일·문항 수 직접 정하기</summary><div class="inner">'
      + '<div class="days">'
      + DOWS.map(function(d){ return '<div class="day"><div class="n">'+d[1]+'</div>'
          + '<select data-dow="'+d[0]+'">'
          + SUBJECTS.map(function(s){ return '<option value="'+s[0]+'"'+(s[0]==='hanja'?' selected':'')+'>'+s[1]+'</option>'; }).join('')
          + '</select></div>'; }).join('')
      + '</div>'
      + '<label>문항 수</label><input type="number" id="qc" min="5" max="20" value="10" style="width:100px">'
      + '<div style="margin-top:12px"><button class="btn ghost" id="go2">이 설정으로 시작</button></div>'
      + '</div></details>'
      + '</div>';
    function start(days, qc){
      db.rpc('ma_set_routine', {
        p_class_code_id: state.cc, p_grade: cur().grade || 1,
        p_days: days, p_question_count: qc, p_active: true
      }).then(function(res){
        if (res.data && res.data.status === 'ok') { loadClassData(); }
        else toast('저장하지 못했어요');
      });
    }
    document.getElementById('go').onclick = function(){ start(ALL_HANJA, 10); };
    document.getElementById('go2').onclick = function(){
      var days = {};
      document.querySelectorAll('[data-dow]').forEach(function(s){ if(s.value) days[s.dataset.dow]=s.value; });
      start(days, Number(document.getElementById('qc').value) || 10);
    };
  }

  /* ═══ 3단계(평상시): 다 돼 있다 → 학급코드 + 오늘 현황 ═══ */
  function renderReady(){
    var c = cur(), r = state.routine || {};
    var classOpts = state.classes.map(function(x){
      return '<option value="'+x.id+'"'+(x.id===state.cc?' selected':'')+'>'+esc(x.label||x.code)+'</option>';
    }).join('');
    var dayTxt = DOWS.filter(function(d){ return (r.days||{})[d[0]]; })
                     .map(function(d){ return d[1]; }).join('·') || '없음';

    wrap.innerHTML =
      '<div class="ok-banner">'
      + '<div class="big">✅</div>'
      + '<b>아침활동이 돌아가고 있어요</b>'
      + '<span><b>'+(r.grade||c.grade||1)+'학년</b> 과정으로, '+esc(dayTxt)+'요일 아침마다 '
        + routineTxt(r)+'와 확인 문제 '
        + (r.question_count||10)+'개가 저절로 올라가요.</span>'
      + '<div style="margin-top:10px"><span style="font-size:12.5px;color:var(--sub)">학생들은 이 코드로 우리 반에 들어와요</span><br>'
      + '<span class="code-chip">'+esc(c.code||'')+'</span></div>'
      + (Object.keys(r.days||{}).some(function(d){ return (r.days||{})[d]==='hanja'; })
          ? '<div style="margin-top:12px"><a class="btn ghost" style="text-decoration:none;display:inline-block" '
            + 'href="/morning/chars.html?grade='+(r.grade||c.grade||1)+'">오늘 나가는 한자 보기</a></div>'
          : '')
      + '</div>'
      + (state.classes.length>1
          ? '<div class="card" style="padding:14px 18px"><label style="margin:0 0 6px">학급</label><select id="cc">'+classOpts+'</select></div>'
          : '')
      + '<div id="board"></div>'
      + '<div class="card" style="padding:16px 18px">'
      + '<details><summary>설정 바꾸기 (학년·요일·문항 수)</summary><div class="inner">'
      + '<div class="days">'
      + DOWS.map(function(d){
          var v = (r.days||{})[d[0]] || '';
          return '<div class="day"><div class="n">'+d[1]+'</div><select data-dow="'+d[0]+'">'
            + SUBJECTS.map(function(s){ return '<option value="'+s[0]+'"'+(s[0]===v?' selected':'')+'>'+s[1]+'</option>'; }).join('')
            + '</select></div>'; }).join('')
      + '</div>'
      + '<label>학년</label><select id="rgrade" style="width:140px">'
      + [1,2,3,4,5,6].map(function(g){
          return '<option value="'+g+'"'+(g===(r.grade||c.grade||1)?' selected':'')+'>'+g+'학년</option>'; }).join('')
      + '</select>'
      + '<div class="hint" style="margin:6px 0 14px">학년마다 배우는 내용이 통째로 달라요. '
        + '바꾸면 <b>진도가 1회차부터 다시</b> 시작해요.</div>'
      + '<label>문항 수</label><input type="number" id="qc" min="5" max="20" value="'+(r.question_count||10)+'" style="width:100px">'
      + '<div style="margin-top:12px"><button class="btn" id="save">저장</button></div>'
      + '</div></details></div>';

    var sel = document.getElementById('cc');
    if (sel) sel.onchange = function(){ state.cc = this.value; loadClassData(); };
    document.getElementById('save').onclick = function(){
      var days = {};
      document.querySelectorAll('[data-dow]').forEach(function(s){ if(s.value) days[s.dataset.dow]=s.value; });
      var newGrade = Number(document.getElementById('rgrade').value) || 1;
      var oldGrade = (state.routine||{}).grade || cur().grade || 1;
      // 학년을 바꾸면 진도가 1회차로 되돌아간다(서버가 같은 트랜잭션에서 처리). 되돌릴 수 없으니 한 번 묻는다.
      if (newGrade !== oldGrade &&
          !confirm(oldGrade+'학년 → '+newGrade+'학년으로 바꿀까요?\n\n'
                   +'배우는 내용이 통째로 달라져서, 진도가 1회차부터 다시 시작해요.\n'
                   +'지금까지 제출한 기록은 그대로 남아요.')) return;
      db.rpc('ma_set_routine', {
        p_class_code_id: state.cc, p_grade: newGrade,
        p_days: days, p_question_count: Number(document.getElementById('qc').value)||10, p_active: true
      }).then(function(res){
        if (res.data && res.data.status==='ok'){
          toast(res.data.grade_changed ? newGrade+'학년으로 바꿨어요 (진도 1회차부터)' : '저장했어요');
          loadClassData();
        }
        else toast('저장하지 못했어요');
      });
    };
    loadBoard();
  }

  /* ═══ 오늘 현황판 ═══ */
  function renderBoard(){
    var el = document.getElementById('board'); if(!el) return;
    var b = state.board;
    if (!b) { el.innerHTML=''; return; }
    if (b.status === 'off_day') {
      el.innerHTML = '<div class="card"><div class="msg">오늘은 아침활동이 없는 요일이에요.<br>다음 요일 아침에 저절로 올라가요.</div></div>'; return;
    }
    if (b.status !== 'ok') { el.innerHTML=''; return; }
    var s = b.session, sm = b.summary || {};
    var rows = (b.rows||[]).map(function(r){
      var chip = !r.submitted ? '<span class="chip c-none">미제출</span>'
               : r.status === 'graded' ? '<span class="chip c-grd">확인함</span>'
               : '<span class="chip c-sub">제출</span>';
      var auto = r.submitted ? (r.auto_score + ' / ' + r.auto_max) : '-';
      return '<tr data-pid="'+r.student_profile_id+'">'
        + '<td class="name">'+esc(r.nickname)+'</td><td>'+chip+'</td><td>'+esc(auto)+'</td>'
        + '<td style="width:40%">'+(r.submitted
            ? '<input class="fbin" placeholder="한마디 남기기" value="'+esc(r.feedback||'')+'">'
            : '<span style="color:var(--faint);font-size:12px">—</span>')+'</td>'
        + '<td>'+(r.submitted?'<button class="btn ghost sm act">저장</button>':'')+'</td></tr>';
    }).join('');
    el.innerHTML = '<div class="card">'
      + '<h2>오늘 — '+esc(SUBJECT_KO[s.subject]||s.subject)+' '
      +   (s.mode==='review' ? '복습' : s.step+'일째'+todayCharTag(s))+'</h2>'
      + (s.lesson_key ? '<div style="margin:-2px 0 12px"><a href="/morning/chars.html?key='+esc(s.lesson_key)+'" '
          + 'style="font-size:13px;color:var(--primary);text-decoration:none">오늘 글자 활동 열기 (획순·쓰기·낱말) →</a></div>' : '')
      + '<div class="sum">'
      + '<div class="b"><div class="v">'+(sm.total||0)+'</div><div class="l">전체</div></div>'
      + '<div class="b"><div class="v" style="color:var(--primary)">'+(sm.submitted||0)+'</div><div class="l">제출</div></div>'
      + '<div class="b"><div class="v" style="color:var(--warn)">'+((sm.total||0)-(sm.submitted||0))+'</div><div class="l">미제출</div></div>'
      + '</div>'
      + ((sm.submitted||0)>0 ? '<div style="margin-bottom:12px"><button class="btn ghost sm" id="bulk">자동 점수 한꺼번에 확정</button></div>' : '')
      + ((sm.total||0)===0
          ? '<div class="msg" style="padding:18px">아직 학생이 없어요. 위 학급코드로 초대해 보세요!</div>'
          : '<table><thead><tr><th>이름</th><th>상태</th><th>점수</th><th>피드백</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>')
      + '</div>';
    var bulk = document.getElementById('bulk');
    if (bulk) bulk.onclick = function(){
      db.rpc('ma_grade', { p_session_id: s.id }).then(function(){ toast('확정했어요'); loadBoard(); });
    };
    el.querySelectorAll('.act').forEach(function(btn){
      btn.onclick = function(){
        var tr = btn.closest('tr');
        db.rpc('ma_grade', { p_session_id: s.id, p_student_profile_id: tr.dataset.pid,
          p_feedback: tr.querySelector('.fbin').value
        }).then(function(){ toast('저장했어요'); loadBoard(); });
      };
    });
  }

  function loadBoard(){
    return db.rpc('ma_today', { p_class_code_id: state.cc }).then(function(res){
      var t = res.data || {};
      if (t.status !== 'ok') { state.board = { status:t.status }; renderBoard(); return; }
      return db.rpc('ma_board', { p_session_id: t.session_id }).then(function(r2){
        state.board = r2.data; renderBoard();
      });
    });
  }

  function loadClassData(){
    return db.from('ma_routines').select('*').eq('class_code_id', state.cc).maybeSingle()
      .then(function(r){
        state.routine = r.data;
        if (!r.data) renderStartRoutine();
        else renderReady();
      });
  }

  db.auth.getUser().then(function(u){
    if (!u || !u.data || !u.data.user) { location.href = '/auth/'; return; }
    db.from('teachers').select('id,name').eq('user_id', u.data.user.id).maybeSingle().then(function(t){
      if (!t.data) {
        wrap.innerHTML = '<div class="card"><div class="msg">선생님 계정으로 로그인해 주세요.<br><br>'
          + '<button class="btn" onclick="location.href=\'/auth/\'">로그인하러 가기</button></div></div>';
        return;
      }
      state.teacher = t.data;
      document.getElementById('me').textContent = t.data.name + ' 선생님';
      db.from('class_codes').select('id,code,label,grade').eq('teacher_id', t.data.id).eq('is_active', true)
        .then(function(c){
          state.classes = c.data || [];
          if (!state.classes.length) { renderMakeClass(); return; }   // 반이 없으면 이 자리에서 만든다
          state.cc = state.classes[0].id;
          loadClassData();
        });
    });
  });
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

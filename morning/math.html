<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침수학 미리 보기 — 아침활동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8EF8;--primary-light:#EBF4FF;
  --bg:#F4F6FB;--card:#fff;--ink:#1A202C;--sub:#718096;--faint:#A0AEC0;--border:#E7ECF3;
  --radius:20px;--shadow:0 2px 18px rgba(33,52,94,.07);--done:#22A06B;
  --kedu-title:'Gowun Batang','Gowun Dodum',serif;
}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px}
.top .brand{font-family:var(--kedu-title);font-weight:700;color:var(--primary)}
.top .t{font-family:var(--kedu-title);font-size:17px}
.top a{margin-left:auto;color:var(--sub);text-decoration:none;font-size:13.5px}
.page{max-width:840px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
h2{font-family:var(--kedu-title);font-size:19px;margin-bottom:6px}
.hint{font-size:13.5px;color:var(--sub);line-height:1.7}
.pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:5px}
select,input{font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--ink)}
.meta{margin-top:14px;padding:12px 14px;background:var(--primary-light);border-radius:14px;font-size:14px;line-height:1.7}
.meta b{color:var(--primary)}
.msg{color:var(--sub);font-size:14px;padding:18px 0;text-align:center;line-height:1.7}
.spin{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{font-size:12.5px;color:var(--faint);text-align:center;margin-top:8px;line-height:1.7}
.back{margin-top:10px;font-family:inherit;font-size:13.5px;padding:7px 12px;border:1px solid var(--primary);border-radius:999px;background:#fff;color:var(--primary);cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <span class="brand">케이에듀</span><span class="t" id="ttl">아침수학 미리 보기</span>
  <a href="/morning/teacher.html">← 아침활동으로</a>
</div>
<div class="page">
  <div class="card">
    <h2>아침에 나갈 문제를 미리 볼 수 있어요</h2>
    <div class="hint">학생들이 푸는 것과 같은 방식으로 문제가 만들어져요. 정답도 함께 보이고,
      <b>다시 뽑기</b>를 누르면 같은 차시에서 다른 문제가 나와요 — 학생마다 문제가 조금씩 다른 것도 이 방식이에요.</div>
    <div class="pick">
      <div><label>학년</label><select id="g"></select></div>
      <div><label>단원</label><select id="u"></select></div>
      <div><label>차시</label><select id="d"></select></div>
    </div>
    <div class="meta" id="meta">불러오는 중…</div>
    <button class="back" id="back" type="button" style="display:none">오늘 차시로 ↩</button>
  </div>
  <div class="card"><div id="mount"><div class="msg"><div class="spin"></div>문제를 준비하는 중…</div></div></div>
  <div class="foot">이 화면은 미리보기예요. 학생 기록에는 아무것도 남지 않아요.</div>
</div>

<script src="/kedu/quiz/kquiz-core.js"></script>
<script src="/kedu/quiz/kquiz-ui.js"></script>
<script>
(function(){
  'use strict';
  var GRADES = [1,2,3,4,5,6];
  /* ★진도일(today)은 c키 통로로 들어왔을 때만 안다 (2026-09-07 §11-7 잔여 닫음).
       교사 화면이 `ma_today` 에서 받은 그날 몫을 `?key=g3_math_c015` 로 넘겨 준다. `?grade&day` 는
       아무 날이나 여는 통로라 이 차시가 오늘 몫인지 이 화면은 알 길이 없다 — 모르면 `today = null`.
       key 와 day 를 **함께** 받는다(오늘로 들어와도 옆 차시를 둘러봐야 하고, 그때도 「오늘이 며칠째인지」를
       잃지 않아야 「오늘 차시로 ↩」이 성립한다). 이름·뜻은 sents_preview.html·chars.html 과 같다 —
       다르면 다음 사람이 한쪽만 고친다. */
  function fromUrl(){
    var q = new URLSearchParams(location.search);
    var m = (q.get('key') || '').match(/^g([1-6])_math_c(\d{1,3})$/);
    var d = +q.get('day') || 0;
    if (m) return { grade:+m[1], day: d || +m[2], today:+m[2] };
    var g = Math.min(6, Math.max(1, +q.get('grade') || 1));
    return { grade:g, day: d || 1, today:null };
  }
  var st = fromUrl(); st.loaded = {}; st.units = {};
  /* 지금 보고 있는 차시가 「오늘 몫」임을 이 화면이 근거를 갖고 말할 수 있는가 */
  function onToday(){ return st.today != null && st.day === st.today; }
  function dayW(){ return onToday() ? '오늘' : '이 날'; }
  var backBtn = document.getElementById('back'), ttl = document.getElementById('ttl');
  var gSel = document.getElementById('g'), uSel = document.getElementById('u'), dSel = document.getElementById('d');
  var meta = document.getElementById('meta'), mount = document.getElementById('mount');

  gSel.innerHTML = GRADES.map(function(g){
    return '<option value="'+g+'"'+(g===st.grade?' selected':'')+'>'+g+'학년</option>'; }).join('');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* 학생 화면과 같은 규칙으로 파일 목록을 푼다(카탈로그 → 그 학년 단원 전부 + math_morning) */
  function filesFor(grade){
    return fetch('/kedu/quiz/catalog.json').then(function(r){ return r.json(); }).then(function(cat){
      var units = (cat.units || cat.list || []).filter(function(u){
        return u.subject === 'math' && u.grade === grade;
      }).sort(function(a,b){ return a.unitNo - b.unitNo; });
      if (!units.length) throw new Error('catalog 에 g'+grade+' 수학 단원이 없음');
      var files = units.map(function(u){ return '/kedu/quiz/templates/'+u.key+'.js'; });
      files.push('/kedu/quiz/templates/math_lessons.js');
      files.push('/kedu/quiz/templates/math_morning.js');
      return files;
    });
  }
  function loadScripts(list, done, fail){
    var i = 0;
    (function next(){
      if (i >= list.length) return done();
      var s = document.createElement('script');
      s.src = list[i++]; s.onload = next; s.onerror = fail;
      document.head.appendChild(s);
    })();
  }

  function keyOf(grade, day){ return 'g'+grade+'_math_c'+('00'+day).slice(-3); }

  /* 명세 메타로 '몇 단원(이름) 어떤 차시' 를 만든다 — 자기주도 차시 제목이 그대로 뜬다 */
  function unitName(def){
    var m = (def && def.lesson_meta) || null;
    if (!m) return String(def && def.source || '');
    var lNice = String(m.l).replace(/^0+/,'').replace(/_0?/g,'·');
    return m.unitName + '(' + m.unitNo + '단원) — ' + (m.title || (lNice + '차시'))
      + (m.mode === 'review' ? ' · 이날은 그동안 배운 것으로 복습해요' : '');
  }

  /* 사다리(일차 순서)를 단원 묶음으로 편다 — 일차와 차시는 1:1 이라 내부 키는 그대로 일차다 */
  function unitsFor(grade){
    var order = (KQuiz.core.mathMorningOrder ? KQuiz.core.mathMorningOrder(grade) : []) || [];
    var units = [], byNo = {};
    order.forEach(function(d, i){
      var u = byNo[d.unitNo];
      if (!u) { u = byNo[d.unitNo] = { unitNo: d.unitNo, name: d.unitName, lessons: [] }; units.push(u); }
      u.lessons.push({ day: i + 1, l: d.l, title: d.title, mode: d.mode });
    });
    return units;
  }
  function lessonLabel(les){
    var lNice = String(les.l).replace(/^0+/,'').replace(/_0?/g,'·');
    return (les.title || (lNice + '차시')) + (les.mode === 'review' ? ' (복습 구성)' : '');
  }

  function fillPickers(grade){
    var units = unitsFor(grade);
    st.units[grade] = units;
    var total = units.reduce(function(a,u){ return a + u.lessons.length; }, 0);
    if (st.today != null && (st.today < 1 || st.today > total)) st.today = null;
    if (st.day > total || st.day < 1) st.day = st.today != null ? st.today : 1;

    var cur = units.filter(function(u){
      return u.lessons.some(function(les){ return les.day === st.day; });
    })[0] || units[0];

    uSel.innerHTML = units.map(function(u){
      return '<option value="'+u.unitNo+'"'+(u===cur?' selected':'')+'>'
        + u.unitNo + '단원 ' + esc(u.name) + '</option>';
    }).join('');
    fillLessons(cur);
    return total;
  }

  function fillLessons(unit){
    dSel.innerHTML = unit.lessons.map(function(les){
      return '<option value="'+les.day+'"'+(les.day===st.day?' selected':'')+'>'
        + esc(lessonLabel(les)) + '</option>';
    }).join('');
    if (+dSel.value !== st.day) { st.day = +dSel.value; }
  }

  function draw(){
    var key = keyOf(st.grade, st.day);
    if (!KQuiz.core.has(key)) {
      meta.innerHTML = '아직 준비되지 않은 차시예요.';
      mount.innerHTML = '<div class="msg">이 학년·일차는 문제가 없어요.</div>';
      return;
    }
    var def = KQuiz.core.getDef ? KQuiz.core.getDef(key) : null;
    var total = ((KQuiz.core.mathMorningOrder && KQuiz.core.mathMorningOrder(st.grade)) || []).length;
    /* 「오늘 몫」 배지는 onToday() 일 때만 — `?grade=` 로 열린 화면은 아무 날이나 보는 통로다 */
    meta.innerHTML = (onToday() ? '<b>오늘 몫</b> · ' : '') + '<b>'+st.grade+'학년</b> — '
      + (def ? '<b>'+esc(unitName(def))+'</b>' : '')
      + '<br><span style="color:var(--sub)">아침수학 순서로는 <b>'+st.day+'일째</b>예요. '
      + '한 학기에 모두 '+total+'일치가 있고, 다 나가면 복습으로 다시 돌아요.</span>';
    if (ttl) ttl.textContent = onToday() ? '오늘 나가는 수학' : '아침수학 미리 보기';
    /* ★정직해지면서 정보가 줄면 안 된다 — 오늘 몫을 벗어나면 「오늘 차시로 ↩」이 뜬다 */
    if (backBtn) backBtn.style.display = (st.today != null && st.day !== st.today) ? '' : 'none';
    KQuiz.mount(mount, { mode:'teacher', lesson:key, n:10 });
    /* 주소가 진도일을 계속 물고 간다 — 새로고침으로 오늘을 잊으면 ↩ 통로가 조용히 사라진다 */
    var u = new URL(location.href);
    if (st.today != null){ u.searchParams.set('key', keyOf(st.grade, st.today)); u.searchParams['delete']('grade'); }
    else { u.searchParams.set('grade', st.grade); }
    u.searchParams.set('day', st.day);
    history.replaceState(null, '', u);
  }

  function loadGrade(grade){
    mount.innerHTML = '<div class="msg"><div class="spin"></div>문제를 준비하는 중…</div>';
    meta.textContent = '불러오는 중…';
    if (st.loaded[grade]) { fillPickers(grade); draw(); return; }
    filesFor(grade).then(function(files){
      loadScripts(files, function(){
        st.loaded[grade] = true;
        fillPickers(grade);
        draw();
      }, function(){
        meta.textContent = '';
        mount.innerHTML = '<div class="msg">문제를 불러오지 못했어요.<br>잠시 뒤에 다시 열어 주세요.</div>';
      });
    })['catch'](function(){
      meta.textContent = '';
      mount.innerHTML = '<div class="msg">문제를 불러오지 못했어요.</div>';
    });
  }

  /* 학년을 바꾸면 진도일도 함께 버린다 — 다른 학년의 차시를 이 학년의 「오늘」이라 부르면 안 된다 */
  gSel.onchange = function(){ st.grade = +this.value; st.day = 1; st.today = null; loadGrade(st.grade); };
  if (backBtn) backBtn.onclick = function(){ if (st.today != null){ st.day = st.today; fillPickers(st.grade); draw(); } };
  uSel.onchange = function(){
    var units = st.units[st.grade] || [];
    var u = units.filter(function(x){ return x.unitNo === +uSel.value; })[0];
    if (!u) return;
    st.day = u.lessons[0].day;      // 단원을 바꾸면 그 단원 첫 차시부터
    fillLessons(u);
    draw();
  };
  dSel.onchange = function(){ st.day = +this.value; draw(); };
  loadGrade(st.grade);
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

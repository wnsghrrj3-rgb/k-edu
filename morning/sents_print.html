<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침영어 인쇄물 — 오늘의 문장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<!--
  교사용 인쇄물 (설계-아침영어-v1.md D6)

  두 판형만 둔다. 교실에서 실제로 쓰이는 쓰임이 둘이기 때문이다.
    · 카드   — 하루 한 장. 칠판 옆·교실 문에 붙여 두고 아침마다 함께 읽는다. 그래서 크다.
    · 틀 묶음표 — 한 틀에 속한 문장을 한 장으로. 알림장·가정통신문에 끼워 보낸다. 그래서 촘촘하다.
    ★2026-08-18 D8-ⓔ: 예전엔 '주간표(그 주 다섯 문장)'였다. 「5일=1주·1일째=월요일」은
      영어가 매일 배정된다는 가정 위에 서 있었는데 그 가정의 근거가 없다 — 요일은 교사
      시간표(ma_routines)가 정하고 원장에는 없다. 원장이 아는 묶음은 틀뿐이라 틀로 갈아탔다.

  재료는 오직 원장(english_data.js)에서 온다. 없는 날은 지어내지 않고 있는 만큼만 낸다.
  '뜻 숨기기'는 장식이 아니다 — 아침 합창 때 한국어가 먼저 눈에 들어오면
  아이들이 영어를 읽지 않고 뜻을 읽는다.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#2FA37A;--primary-light:#E8F6F0;--bg:#F4F8F6;--card:#fff;
  --ink:#1A202C;--sub:#718096;--faint:#A0AEC0;--border:#E4EDE9;--new:#E76F51;
  --kedu-title:'Gowun Batang','Gowun Dodum',serif;--en:'Nunito',sans-serif;
}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ── 도구막대 (인쇄되지 않는다) ── */
.bar{background:#fff;border-bottom:1px solid var(--border);padding:12px 18px;
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;position:sticky;top:0;z-index:5}
.bar .brand{font-family:var(--kedu-title);font-weight:700;color:var(--primary);margin-right:4px}
.bar label{font-size:12.5px;color:var(--sub);margin-right:4px}
.bar select{font-family:inherit;font-size:14.5px;padding:8px 11px;border:1px solid var(--border);
  border-radius:11px;background:#fff;color:var(--ink)}
.btn{font-family:inherit;font-size:14px;padding:9px 15px;border-radius:11px;cursor:pointer;
  border:1.5px solid var(--primary);background:#fff;color:var(--primary)}
.btn.fill{background:var(--primary);color:#fff}
.btn.on{background:var(--primary-light)}
.bar .sp{margin-left:auto}
.bar a{color:var(--sub);text-decoration:none;font-size:13.5px}
.grp{display:inline-flex;gap:6px;align-items:center}

/* ── 종이 ── */
.sheet{background:#fff;width:210mm;min-height:297mm;margin:18px auto;padding:16mm 15mm;
  box-shadow:0 2px 18px rgba(26,70,55,.08);border-radius:4px}
.sheet + .sheet{margin-top:14px}
.shead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:14mm}
.shead .ttl{font-family:var(--kedu-title);font-size:20px;font-weight:700}
.shead .sub{font-size:13px;color:var(--sub)}
.shead .who{margin-left:auto;font-size:13px;color:var(--faint)}

/* 카드 판형 */
.card-sent{font-family:var(--en);font-weight:700;font-size:58px;line-height:1.3;letter-spacing:-.4px;
  word-break:keep-all;text-align:center;margin:4mm 0}
.card-ko{font-family:var(--kedu-title);font-size:25px;color:#3C4A5A;text-align:center;margin-top:6mm}
.card-tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:12mm}
.card-tiles span{font-family:var(--en);font-weight:600;font-size:21px;border:1.5px solid var(--border);
  border-radius:12px;padding:8px 15px}
.blk{margin-top:12mm;border-top:1px dashed var(--border);padding-top:7mm}
.blk h3{font-size:13px;color:var(--faint);letter-spacing:.5px;margin-bottom:8px}
.words span{display:inline-block;font-family:var(--en);font-weight:600;font-size:19px;
  border:1.5px solid #F0C9BB;color:var(--new);border-radius:14px;padding:6px 15px;margin:0 8px 8px 0}
.words span em{font-family:var(--kedu-title);font-style:normal;font-weight:400;font-size:14px;
  color:var(--sub);margin-left:8px;padding-left:9px;border-left:1px solid #F0C9BB}
.wk .n em{font-style:normal;color:#6B7280}
.exp{font-family:var(--en);font-weight:600;font-size:24px}
.exp em{display:block;font-family:var(--kedu-title);font-style:normal;font-size:16px;color:var(--sub);margin-top:5px}
.none{font-size:14px;color:var(--faint)}
.card-foot{margin-top:14mm;font-size:12.5px;color:var(--faint);text-align:center;line-height:1.8}

/* 틀 묶음표 판형 */
.wk{width:100%;border-collapse:collapse;table-layout:fixed}
.wk th,.wk td{border:1px solid var(--border);padding:9px 11px;vertical-align:top;text-align:left}
.wk th{background:var(--primary-light);font-family:var(--kedu-title);font-size:13.5px;color:#1D6B51;font-weight:700}
.wk th.d{width:20mm}
.wk .s{font-family:var(--en);font-weight:700;font-size:19px;line-height:1.45;word-break:keep-all}
.wk .k{font-family:var(--kedu-title);font-size:14px;color:#4A5568;margin-top:5px}
.wk .n{font-size:12.5px;color:var(--new);margin-top:6px}
.wk tr{break-inside:avoid}
.wknote{margin-top:9mm;font-size:12.5px;color:var(--sub);line-height:1.9}
.wknote b{color:var(--ink)}
.signrow{margin-top:12mm;display:flex;gap:14px;font-size:13px;color:var(--faint)}
.signrow div{flex:1;border-top:1px solid var(--border);padding-top:7px}

/* 뜻 숨기기 */
body.noko .card-ko,body.noko .wk .k,body.noko .exp em,
body.noko .words span em,body.noko .wk .n em{visibility:hidden}

.miss{max-width:600px;margin:60px auto;background:#fff;border-radius:16px;padding:26px;
  text-align:center;color:var(--sub);line-height:1.8}

@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  .bar{display:none!important}
  .sheet{width:auto;min-height:auto;margin:0;padding:14mm 13mm;box-shadow:none;border-radius:0;
    break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">케이에듀</span>
  <div class="grp"><label for="g">학년</label><select id="g"></select></div>
  <div class="grp"><label for="d">일차</label><select id="d"></select></div>
  <div class="grp">
    <button class="btn" id="mCard" type="button">카드 (하루 한 장)</button>
    <button class="btn" id="mWeek" type="button">틀 묶음표 (한 틀 한 장)</button>
  </div>
  <button class="btn" id="ko" type="button">뜻 숨기기</button>
  <button class="btn fill" id="go" type="button">🖨 인쇄</button>
  <span class="sp"></span>
  <a href="/morning/sents_preview.html">← 미리보기로</a>
</div>

<div id="out"></div>

<script src="/kedu/quiz/templates/english_data.js"></script>
<script>
(function(){
  'use strict';
  var D = (window.KQuiz && window.KQuiz.englishData) || null;
  var out = document.getElementById('out');
  if (!D) { out.innerHTML = '<div class="miss">문장 자료를 불러오지 못했어요. 새로고침해 주세요.</div>'; return; }

  var q = new URLSearchParams(location.search);
  var GRADES = D.grades();
  var wantG = +q.get('grade');
  var st = {
    grade: GRADES.indexOf(wantG) >= 0 ? wantG : GRADES[0],
    day: +q.get('day') || 1,
    mode: q.get('mode') === 'week' ? 'week' : 'card',
    noko: q.get('ko') === '0'
  };

  var gSel = document.getElementById('g'), dSel = document.getElementById('d');
  var bCard = document.getElementById('mCard'), bWeek = document.getElementById('mWeek');
  var bKo = document.getElementById('ko');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function total(){ return D.maxDay(st.grade); }
  function clamp(){
    if (GRADES.indexOf(st.grade) < 0) st.grade = GRADES[0];
    st.day = Math.min(Math.max(st.day||1, 1), total() || 1);
  }
  /* 틀 정보는 원장 단일 통로에서만 온다 — 인쇄물이 스스로 계산하지 않는다 */
  function pat(i){ return D.patOf(st.grade, i); }

  /* 학년 목록은 원장이 정한다 — 화면에 학년을 박으면 원장 없는 학년이 뜬다 */
  gSel.innerHTML = GRADES.map(function(g){
    return '<option value="'+g+'">'+g+'학년</option>'; }).join('');

  function fillDays(){
    var n = total();
    dSel.innerHTML = '';
    for (var i = 1; i <= n; i++){
      var o = document.createElement('option');
      o.value = i;
      var pp = pat(i);
      o.textContent = i + '일째' + (pp ? ' · ' + pp.ko : '');
      dSel.appendChild(o);
    }
    gSel.value = st.grade; dSel.value = st.day;
  }

  /* ── 카드: 하루 한 장 ── */
  function cardHtml(){
    var x = D.day(st.grade, st.day);
    if (!x) return '<div class="miss">이 학년·일차는 문장이 없어요.</div>';
    var nw = x['new'] || [], px = pat(st.day);
    return '<div class="sheet">'
      + '<div class="shead"><span class="ttl">오늘의 문장</span>'
      +   '<span class="sub">'+st.grade+'학년 · '+st.day+'일째'
      +   (px ? ' · 틀 '+esc(px.ko)+' ('+px.len+'일 중 '+px.idx+'일째)' : '')+'</span>'
      +   '<span class="who">아침활동 · 케이에듀</span></div>'
      + '<div class="card-sent">'+esc(x.sent)+'</div>'
      + '<div class="card-ko">'+esc(x.ko)+'</div>'
      + '<div class="card-tiles">'+x.tiles.map(function(t){
          return '<span>'+esc(t)+'</span>'; }).join('')+'</div>'
      + '<div class="blk"><h3>오늘 처음 만나는 낱말</h3><div class="words">'
      + (nw.length ? D.glossesOf(st.grade, st.day).map(function(it){
                       return '<span>'+esc(it.unit)
                         + (it.ko ? '<em>'+esc(it.ko)+'</em>' : '')+'</span>'; }).join('')
                   : '<span class="none">없어요 — 그동안 배운 낱말만으로 된 문장이에요.</span>')
      + '</div></div>'
      + '<div class="blk"><h3>넓히기 — 같은 틀로 지어 보는 문장</h3>'
      + (x.expand ? '<div class="exp">'+esc(x.expand.sent)+'<em>'+esc(x.expand.ko)+'</em></div>'
                  : '<span class="none">이 날은 재료가 아직 모자라요. 오늘 문장을 한 번 더 조립해요.</span>')
      + '</div>'
      + '<div class="card-foot">함께 읽기 → 손으로 가리고 말하기 → 짝과 주고받기<br>'
      +   '모든 낱말은 오늘까지 배운 것으로만 되어 있어요.</div>'
      + '</div>';
  }

  /* ── 틀 묶음표: 그 문장이 속한 틀 전부 (원장 끝을 넘으면 있는 만큼만) ── */
  function weekHtml(){
    var px = pat(st.day);
    if (!px) return '<div class="miss">이 학년·일차는 틀을 알 수 없어요.</div>';
    var from = px.from, to = Math.min(px.to, total());
    var rows = '', any = false;
    for (var i = from; i <= to; i++){
      var x = D.day(st.grade, i);
      if (!x) continue;
      any = true;
      var nw = (x['new'] || []);
      rows += '<tr><th class="d">'+i+'일째<br><span style="font-weight:400;font-size:12px">틀 안 '
        + (i - from + 1) + '/' + (to - from + 1) + '</span></th>'
        + '<td><div class="s">'+esc(x.sent)+'</div>'
        +   '<div class="k">'+esc(x.ko)+'</div>'
        +   (nw.length ? '<div class="n">새 낱말 · '+D.glossesOf(st.grade, i).map(function(it){
              return esc(it.unit) + (it.ko ? ' <em>'+esc(it.ko)+'</em>' : ''); }).join(' · ')+'</div>' : '')
        + '</td></tr>';
    }
    if (!any) return '<div class="miss">이 틀에는 문장이 없어요.</div>';
    return '<div class="sheet">'
      + '<div class="shead"><span class="ttl">아침영어 — '+px.no+'. '+esc(px.ko)+'</span>'
      +   '<span class="sub">'+st.grade+'학년 · '+from+(to>from?'~'+to:'')+'일째 · 하루 한 문장</span>'
      +   '<span class="who">아침활동 · 케이에듀</span></div>'
      + '<table class="wk"><tbody>'+rows+'</tbody></table>'
      + '<div class="wknote">아침마다 한 문장씩 함께 읽고, 다섯 번 말해 보고, 같은 틀로 새 문장을 지어 봅니다.<br>'
      +   '문장의 모든 낱말은 <b>그날까지 배운 것</b>으로만 되어 있어, 모르는 말을 만나는 날이 없습니다.<br>'
      +   '집에서는 <b>한 번 소리 내어 읽기</b>면 충분합니다. 외우지 않아도 됩니다.</div>'
      + '<div class="signrow"><div>읽은 날 표시</div><div>보호자 확인</div></div>'
      + '</div>';
  }

  function syncBar(){
    bCard.classList.toggle('on', st.mode === 'card');
    bWeek.classList.toggle('on', st.mode === 'week');
    bKo.textContent = st.noko ? '뜻 보이기' : '뜻 숨기기';
    bKo.classList.toggle('on', st.noko);
    document.body.classList.toggle('noko', st.noko);
  }

  function render(){
    clamp(); fillDays(); syncBar();
    out.innerHTML = st.mode === 'week' ? weekHtml() : cardHtml();
    var u = new URL(location.href);
    u.searchParams.set('grade', st.grade);
    u.searchParams.set('day', st.day);
    u.searchParams.set('mode', st.mode);
    if (st.noko) u.searchParams.set('ko', '0'); else u.searchParams.delete('ko');
    history.replaceState(null, '', u);
  }

  gSel.onchange = function(){ st.grade = +this.value; st.day = 1; render(); };
  dSel.onchange = function(){ st.day = +this.value; render(); };
  bCard.onclick = function(){ st.mode = 'card'; render(); };
  bWeek.onclick = function(){ st.mode = 'week'; render(); };
  bKo.onclick   = function(){ st.noko = !st.noko; render(); };
  document.getElementById('go').onclick = function(){ window.print(); };

  render();
})();
</script>
</body>
</html>

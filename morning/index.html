<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침활동 — 케이에듀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--kedu-title:'Gowun Batang','Gowun Dodum',serif}</style>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8EF8;--primary-light:#EBF4FF;--pink:#FF85A1;
  --bg:#F4F6FB;--card:#fff;--ink:#1A202C;--sub:#718096;--faint:#A0AEC0;--border:#E7ECF3;
  --radius:20px;--shadow:0 2px 18px rgba(33,52,94,.07);--shadow-lg:0 18px 50px rgba(33,52,94,.16);
  --done:#22A06B;--warm:#FFB454;
}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.nav{background:var(--card);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.nav-logo{font-family:var(--kedu-title);font-size:21px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.nav-logo .kk{background:linear-gradient(135deg,var(--primary),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-me{font-size:13px;color:var(--sub);font-weight:600}
.wrap{max-width:680px;margin:0 auto;padding:26px 18px 80px}

.loading{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);font-size:14px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{background:linear-gradient(135deg,#5B8EF8,#7B6EF6);border-radius:var(--radius);padding:26px 24px;color:#fff;box-shadow:var(--shadow-lg);margin-bottom:18px}
.hero .date{font-size:13px;opacity:.85;margin-bottom:6px}
.hero h1{font-family:var(--kedu-title);font-size:27px;line-height:1.25;margin-bottom:10px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,.22);border-radius:50px;padding:4px 13px;font-size:12.5px;font-weight:500}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
.card h2{font-family:var(--kedu-title);font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.msg{text-align:center;padding:40px 20px;color:var(--sub);font-size:15px;line-height:1.7}
.msg .big{font-size:44px;display:block;margin-bottom:12px}

.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-family:var(--kedu-title);font-size:17px;cursor:pointer;background:var(--primary);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--primary-light);color:var(--primary)}

.result{text-align:center;padding:8px 0 4px}
.score{font-family:var(--kedu-title);font-size:46px;color:var(--primary);line-height:1.1}
.score small{font-size:20px;color:var(--faint)}
.fb{background:#FFF8EC;border:1px solid #FFE6BF;border-radius:14px;padding:14px 16px;margin-top:14px;font-size:14.5px;line-height:1.65;text-align:left}
.fb b{color:#B7791F;display:block;margin-bottom:4px;font-size:13px}
.pill{display:inline-block;background:#E4F7EE;color:var(--done);border-radius:50px;padding:5px 14px;font-size:12.5px;font-weight:700;margin-top:10px}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--bg);border-radius:14px;padding:14px 10px;text-align:center}
.stat .v{font-family:var(--kedu-title);font-size:23px;color:var(--ink)}
.stat .l{font-size:11.5px;color:var(--faint);margin-top:3px}
.hist{margin-top:14px}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}
.hrow .d{color:var(--faint);width:52px;flex-shrink:0}
.hrow .s{color:var(--sub);flex:1}
.hrow .p{font-weight:700}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;width:64px;flex-shrink:0}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/"><span class="kk">케이에듀</span></a>
  <span class="nav-me" id="me"></span>
</nav>

<div class="wrap" id="wrap">
  <div class="loading"><div class="spin"></div>오늘 아침활동을 가져오는 중…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu_config.js"></script>
<script src="/kedu/quiz/kquiz-core.js"></script>
<script src="/kedu/quiz/kquiz-ui.js"></script>
<script>
(function(){
  'use strict';
  var db = getKeduDb();
  var wrap = document.getElementById('wrap');
  var SUBJECT_KO = { hanja:'한자', english:'영어', math:'수학', korean:'국어' };
  var SUBJECT_ICON = { hanja:'漢', english:'A', math:'＋', korean:'가' };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function todayKo(){
    var d=new Date(), w=['일','월','화','수','목','금','토'][d.getDay()];
    return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+w+'요일';
  }
  function show(html){ wrap.innerHTML = html; }
  function card(inner){ return '<div class="card">'+inner+'</div>'; }

  /* 한자 세트(g1_hanja_s01)는 hanja_data + hanja 두 파일이 필요하다.
     수학·국어 단원 세트는 기존 규칙(g1_math_u3 → g1_math_u3.js)을 그대로 따른다. */
  function templateFiles(lesson){
    var m = lesson.match(/^g\d+_([a-z]+)_s\d+$/);
    if (m) return ['/kedu/quiz/templates/'+m[1]+'_data.js', '/kedu/quiz/templates/'+m[1]+'.js'];
    var u = lesson.match(/^(g\d+_[a-z]+_u\d+)/);
    return u ? ['/kedu/quiz/templates/'+u[1]+'.js'] : null;
  }
  function loadScripts(list, done, fail){
    var i = 0;
    (function next(){
      if (i >= list.length) return done();
      var s = document.createElement('script');
      s.src = list[i++]; s.onload = next; s.onerror = fail;
      document.head.appendChild(s);
    })();
  }

  function renderOff(dow){
    show(card('<div class="msg"><span class="big">🌤️</span>오늘은 아침활동이 없는 날이에요.<br>내일 다시 만나요!</div>'));
  }
  function renderNoRoutine(){
    show(card('<div class="msg"><span class="big">📋</span>아직 아침활동이 준비되지 않았어요.<br>선생님께 여쭤보세요.</div>'));
  }

  function heroHtml(t){
    var ko = SUBJECT_KO[t.subject] || t.subject;
    var modeTag = t.mode === 'review' ? '복습' : (t.step + '회차');
    return '<div class="hero">'
      + '<div class="date">'+todayKo()+'</div>'
      + '<h1>오늘의 아침활동<br>'+esc(ko)+'</h1>'
      + '<div class="meta"><span class="tag">'+esc(modeTag)+'</span>'
      + '<span class="tag">'+t.question_count+'문제</span>'
      + (t.mode==='review'?'<span class="tag">그동안 배운 것 되짚기</span>':'')
      + '</div></div>';
  }

  /* 이미 제출한 경우: 결과와 선생님 피드백 */
  function renderDoneState(t){
    var my = t.my || {};
    var sc = (my.score != null ? my.score : my.auto_score);
    var mx = my.auto_max != null ? my.auto_max : t.question_count;
    var h = heroHtml(t) + card(
      '<div class="result">'
      + '<div class="score">'+esc(sc)+'<small> / '+esc(mx)+'</small></div>'
      + '<div class="pill">오늘 것 다 했어요 ✓</div>'
      + (my.feedback ? '<div class="fb"><b>선생님 말씀</b>'+esc(my.feedback)+'</div>' : '')
      + '</div>'
      + '<button class="btn ghost" id="again" style="margin-top:16px">한 번 더 풀어보기</button>'
    );
    show(h + '<div id="stats"></div>');
    document.getElementById('again').onclick = function(){ startQuiz(t, true); };
    loadStats();
  }

  /* 풀이 시작 */
  function startQuiz(t, isRetry){
    var files = templateFiles(t.lesson_key);
    if (!files) { show(card('<div class="msg">문제를 찾지 못했어요.</div>')); return; }
    show(heroHtml(t) + card('<div id="mount"></div>'));
    var mount = document.getElementById('mount');
    mount.innerHTML = '<div class="loading"><div class="spin"></div>문제를 준비하는 중…</div>';

    loadScripts(files, function(){
      if (!KQuiz.core.has(t.lesson_key)) {
        mount.innerHTML = '<div class="msg">아직 준비 중인 문제예요.</div>'; return;
      }
      KQuiz.mount(mount, {
        mode:'student', lesson:t.lesson_key, n:t.question_count, seed:Number(t.seed),
        onSubmit: function(p){
          // p = {set,seed,n,score,max,spent_sec,items} — kquiz-ui가 조립해서 넘겨준다
          var payload = {
            v:1, tool:'morning', subject:t.subject, kind:'auto',
            score:p.score, max:p.max, spent_sec:p.spent_sec,
            detail:{ set:p.set, seed:p.seed, n:p.n, items:p.items }
          };
          return db.rpc('ma_submit', { p_session_id:t.session_id, p_payload:payload })
            .then(function(){ return load(); });
        }
      });
    }, function(){ mount.innerHTML = '<div class="msg">문제를 불러오지 못했어요.</div>'; });
  }

  /* 누적 기록 */
  function loadStats(){
    db.rpc('ma_stats', { p_days:60 }).then(function(res){
      var s = res.data; if (!s || s.status !== 'ok') return;
      var o = s.overall || {}, recent = (s.recent||[]).slice(0,7);
      if (!o.sessions) return;
      var rows = recent.map(function(r){
        var sc = r.score != null ? r.score : r.auto_score, mx = r.auto_max || 10;
        var pct = mx ? Math.round(100*sc/mx) : 0;
        var d = String(r.run_date||'').slice(5).replace('-','/');
        return '<div class="hrow"><span class="d">'+esc(d)+'</span>'
             + '<span class="s">'+esc(SUBJECT_KO[r.subject]||r.subject)+(r.mode==='review'?' 복습':' '+r.step+'회차')+'</span>'
             + '<span class="bar"><i style="width:'+pct+'%"></i></span>'
             + '<span class="p">'+esc(sc)+'</span></div>';
      }).join('');
      document.getElementById('stats').innerHTML = card(
        '<h2>📈 내 기록</h2>'
        + '<div class="stat-row">'
        + '<div class="stat"><div class="v">'+o.sessions+'</div><div class="l">한 날</div></div>'
        + '<div class="stat"><div class="v">'+o.correct+'</div><div class="l">맞힌 개수</div></div>'
        + '<div class="stat"><div class="v">'+(o.rate!=null?o.rate+'%':'-')+'</div><div class="l">정답률</div></div>'
        + '</div><div class="hist">'+rows+'</div>'
      );
    });
  }

  /* 진입 */
  function load(){
    return db.rpc('ma_today').then(function(res){
      var t = res.data;
      if (!t || t.status === 'no_profile') {
        show(card('<div class="msg"><span class="big">🔑</span>먼저 우리 반으로 들어와 주세요.</div>'
          + '<button class="btn" onclick="location.href=\'/auth/\'">들어가기</button>'));
        return;
      }
      if (t.status === 'no_routine') return renderNoRoutine();
      if (t.status === 'off_day')   return renderOff(t.dow);
      if (t.status !== 'ok')        return show(card('<div class="msg">잠시 뒤에 다시 열어 주세요.</div>'));

      if (t.my && t.my.submitted) { renderDoneState(t); }
      else {
        show(heroHtml(t) + card(
          '<div class="msg" style="padding:22px 10px 18px">'
          + '<span class="big">'+(SUBJECT_ICON[t.subject]||'✏️')+'</span>'
          + '오늘은 <b>'+esc(SUBJECT_KO[t.subject]||t.subject)+'</b> '+(t.mode==='review'?'복습':t.step+'회차')+'예요.<br>'
          + t.question_count+'문제를 풀어 볼까요?</div>'
          + '<button class="btn" id="go">시작하기</button>'
        ) + '<div id="stats"></div>');
        document.getElementById('go').onclick = function(){ startQuiz(t); };
        loadStats();
      }
    });
  }

  db.auth.getUser().then(function(u){
    if (u && u.data && u.data.user) {
      db.from('student_profiles').select('nickname').eq('user_id', u.data.user.id).maybeSingle()
        .then(function(p){ if(p.data) document.getElementById('me').textContent = p.data.nickname; });
    }
    load();
  });
})();
</script>
<script src="/kedu_back.js"></script>
</body>
</html>

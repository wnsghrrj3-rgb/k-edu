<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 한자 — 아침활동 · 케이에듀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--kedu-title:'Gowun Batang','Gowun Dodum',serif}</style>
<style>
/* ═══════════════════════════════════════════════════════════════
   오늘의 한자 — 서예의 재료로 짠 화면
   화선지(종이) · 먹(글씨) · 미자격(연습 칸) · 인주(도장 = 성취 기록)
   붉은색은 오직 도장에만 쓴다. 버튼은 먹과 종이로.
   ═══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#F6F1E5;        /* 화선지 */
  --paper-deep:#EFE7D5;   /* 화선지 그늘 */
  --ink:#26262E;          /* 먹 */
  --ink-soft:#5A5A66;     /* 옅은 먹 */
  --sand:#A89E8A;         /* 모래 — 흐린 글 */
  --grid:#DCD2BC;         /* 미자격 선 */
  --seal:#C0392F;         /* 인주 — 도장에만 */
  --seal-deep:#9C2B22;
  --indigo:#44618F;       /* 쪽빛 — 누르는 것들 */
  --indigo-soft:#E8EDF5;
  --card:#FDFBF5;
  --ok:#3E7C4F;
  --radius:18px;
  --shadow:0 2px 16px rgba(60,50,30,.08);
}
body{font-family:'Gowun Dodum',sans-serif;background:var(--paper);min-height:100vh;color:var(--ink);
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 50% -10%, #FBF7EC 0%, var(--paper) 55%)}

.nav{background:rgba(253,251,245,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--grid);
  height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.nav-logo{font-family:var(--kedu-title);font-size:20px;text-decoration:none;color:var(--ink)}
.nav-logo .dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--seal);
  margin-right:8px;transform:rotate(8deg);vertical-align:1px}
.nav a.back{font-size:13.5px;color:var(--ink-soft);text-decoration:none}

.wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px}

/* ── 머리: 며칠째 무슨 글자 ─────────────────────────── */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 16px;flex-wrap:wrap}
.head .day{font-family:var(--kedu-title);font-size:22px}
.head .day small{font-size:13px;color:var(--sand);margin-left:8px}
.head .nav-ch{display:flex;gap:6px}
.chip{border:1px solid var(--grid);background:var(--card);border-radius:12px;padding:8px 13px;
  font-family:var(--kedu-title);font-size:14px;color:var(--ink);cursor:pointer;text-decoration:none}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.quiet{color:var(--ink-soft)}

/* ── 여정: 만나기 → 열 번 쓰기 → 낱말 ─────────────────── */
.journey{display:flex;align-items:center;justify-content:center;gap:0;margin:0 0 18px}
.jstep{display:flex;align-items:center;gap:8px;font-family:var(--kedu-title);font-size:14px;color:var(--sand)}
.jstep .b{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--grid);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--sand)}
.jstep.on{color:var(--ink)}
.jstep.on .b{border-color:var(--ink);color:var(--ink)}
.jstep.done{color:var(--ink-soft)}
.jstep.done .b{background:var(--seal);border-color:var(--seal);color:#FFF7F0;transform:rotate(-6deg)}
.jline{width:34px;height:1.5px;background:var(--grid);margin:0 8px}

/* ── 화선지 무대 ──────────────────────────────────── */
.sheet{background:var(--card);border:1px solid var(--grid);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px 18px 22px;text-align:center;position:relative}
.sheet .corner{position:absolute;top:14px;right:16px;font-size:12.5px;color:var(--sand)}
.sheet .corner b{color:var(--ink-soft)}

/* 미자격 종이: 가로세로 + 대각 점선 */
.mija{width:min(320px,78vw);aspect-ratio:1/1;margin:6px auto 0;position:relative;background:#FFFDF8;
  border:2px solid var(--grid);border-radius:10px;overflow:hidden}
.mija::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,
    linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,
    linear-gradient(45deg, transparent calc(50% - .75px), var(--paper-deep) calc(50% - .75px),
      var(--paper-deep) calc(50% + .75px), transparent calc(50% + .75px)),
    linear-gradient(-45deg, transparent calc(50% - .75px), var(--paper-deep) calc(50% - .75px),
      var(--paper-deep) calc(50% + .75px), transparent calc(50% + .75px))}
.mija > div, .mija > svg{position:relative;z-index:1}
.mija svg{touch-action:none}
.mija.big{width:min(380px,84vw)}

.hy-line{font-family:var(--kedu-title);font-size:clamp(24px,5.5vw,34px);margin:16px 0 2px;
  opacity:0;transform:translateY(8px);transition:opacity .5s ease .2s, transform .5s ease .2s}
.hy-line.in{opacity:1;transform:none}
.hy-sub{font-size:14px;color:var(--ink-soft);min-height:22px}
@media (prefers-reduced-motion:reduce){.hy-line{transition:none;opacity:1;transform:none}}

.say{font-size:14.5px;color:var(--ink-soft);min-height:24px;margin-top:12px}
.say.good{color:var(--ok)}
.say.oops{color:var(--seal-deep)}

/* ── 도장 받침: 열 번 쓰기의 기록 ─────────────────────── */
.tray{display:flex;gap:7px;justify-content:center;margin:16px auto 4px;flex-wrap:wrap;max-width:420px}
.cell{width:34px;height:34px;border:1.5px solid var(--grid);border-radius:8px;background:#FFFDF8;position:relative}
.cell::before{content:'';position:absolute;inset:0;
  background:
    linear-gradient(var(--paper-deep),var(--paper-deep)) center/100% 1px no-repeat,
    linear-gradient(var(--paper-deep),var(--paper-deep)) center/1px 100% no-repeat}
.cell.now{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
.cell .seal{position:absolute;inset:3px;border-radius:6px;background:var(--seal);color:#FFF7F0;
  display:flex;align-items:center;justify-content:center;font-family:var(--kedu-title);
  font-size:17px;transform:rotate(-7deg);z-index:1}
.cell .seal.pop{animation:stamp .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-7deg) scale(2.1);opacity:0}60%{opacity:1}100%{transform:rotate(-7deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.cell .seal.pop{animation:none}}
.tray-label{font-size:12.5px;color:var(--sand);margin-bottom:6px}

/* 큰 낙관: 열 번을 다 썼을 때 */
.bigseal{width:96px;height:96px;border-radius:16px;background:var(--seal);color:#FFF7F0;margin:18px auto 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-6deg);
  font-family:var(--kedu-title);box-shadow:0 6px 18px rgba(156,43,34,.3)}
.bigseal .c{font-size:44px;line-height:1.1}
.bigseal .t{font-size:11px;letter-spacing:2px;opacity:.85}
.bigseal.pop{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}

/* ── 낱말 마당 ────────────────────────────────────── */
.wordy{margin-top:6px}
.wordy .lead{font-size:14px;color:var(--ink-soft);margin-bottom:14px;line-height:1.7}
.wcards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:8px}
.wcard{border:1.5px solid var(--grid);background:#FFFDF8;border-radius:14px;padding:13px 16px;cursor:pointer;
  min-width:120px;transition:transform .12s}
.wcard:active{transform:scale(.97)}
.wcard .hj{font-family:var(--kedu-title);font-size:23px;letter-spacing:2px}
.wcard .hj .hit{color:var(--seal)}
.wcard .ko{font-size:13px;color:var(--sand);margin-top:5px;min-height:19px}
.wcard.flip .ko{color:var(--ink-soft)}
.wcard.lock{border-color:var(--ok);cursor:default}
.wcard.pick{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
.mcol{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:0 auto}
.mitem{border:1.5px solid var(--grid);background:#FFFDF8;border-radius:13px;padding:13px 10px;cursor:pointer;
  font-size:15px}
.mitem.hj{font-family:var(--kedu-title);font-size:20px;letter-spacing:2px}
.mitem.pick{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
.mitem.lock{border-color:var(--ok);color:var(--sand);cursor:default}
.mitem.no{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.mitem.no{animation:none}}
.findword{font-family:var(--kedu-title);font-size:46px;letter-spacing:6px;margin:8px 0 4px}
.findword button{all:unset;cursor:pointer;padding:2px 5px;border-radius:8px}
.findword button:focus-visible{outline:3px solid var(--indigo)}
.findword button.no{animation:shake .3s;color:var(--sand)}
.findword button.yes{color:var(--seal)}

/* ── 버튼 ────────────────────────────────────────── */
.row{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.bt{border:1.5px solid var(--ink);background:var(--ink);color:#FDFBF5;border-radius:13px;
  padding:12px 22px;font-family:var(--kedu-title);font-size:16px;cursor:pointer}
.bt.line{background:transparent;color:var(--ink-soft);border-color:var(--grid)}
.bt:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}

.nodata{font-size:13.5px;color:var(--ink-soft);background:var(--indigo-soft);border-radius:12px;
  padding:12px 14px;margin:12px auto 0;max-width:420px;line-height:1.7}

/* ── 둘러보기(교사·전체) ─────────────────────────────── */
.browse-bar{background:var(--card);border:1px solid var(--grid);border-radius:var(--radius);
  padding:15px 18px;margin-bottom:16px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.browse-bar label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:6px}
.browse-bar select{font-family:inherit;font-size:15px;padding:10px 13px;border:1.5px solid var(--grid);
  border-radius:12px;background:#FFFDF8;color:var(--ink)}
.browse-meta{font-size:13px;color:var(--ink-soft);flex:1;min-width:200px;line-height:1.7}
.stepbox{margin-bottom:18px}
.stepbox h3{font-family:var(--kedu-title);font-size:15px;color:var(--ink-soft);margin:0 2px 9px;
  display:flex;align-items:baseline;gap:8px}
.stepbox h3 small{font-size:12px;color:var(--sand)}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.wg{background:var(--card);border:1px solid var(--grid);border-radius:13px;padding:12px 6px 10px;
  text-align:center;cursor:pointer;position:relative;text-decoration:none;color:var(--ink)}
.wg .d{font-size:10.5px;color:var(--sand)}
.wg .c{font-family:var(--kedu-title);font-size:33px;line-height:1.2;margin:2px 0}
.wg .h{font-size:11px;color:var(--ink-soft)}
.wg .mini{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:4px;background:var(--seal);
  color:#FFF7F0;font-size:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--kedu-title);transform:rotate(-8deg)}
@media (max-width:520px){.wgrid{grid-template-columns:repeat(5,1fr)}.wg .c{font-size:26px}.wg .h{display:none}}

.credit{margin-top:26px;font-size:11.5px;color:var(--sand);text-align:center;line-height:1.7}
.credit a{color:var(--sand)}
/* 교실 공용 기기에서 교사가 먼저 돌려 보면 아이가 만나지도 않은 날이 끝난 것으로 남는다.
   그래서 기록을 끄고, 끈 사실을 화면에 적는다 — 조용히 다르게 도는 화면은 신뢰를 잃는다. */
.peeknote{background:#FFF6E3;border:1px solid #F0DCB4;color:#8A6320;border-radius:12px;
  padding:9px 13px;margin-bottom:12px;font-size:12.5px;line-height:1.65}

@media print{
  .nav,.head .nav-ch,.journey,.sheet,.row,.credit,.browse-bar select,.bt,.peeknote{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .wg{break-inside:avoid}
}
</style>
</head>
<body>

<div class="nav">
  <a class="nav-logo" href="/morning/"><span class="dot"></span>오늘의 한자</a>
  <a class="back" id="backlink" href="/morning/">← 아침활동</a>
</div>

<div class="wrap" id="app"></div>

<script src="/kedu/quiz/templates/hanja_data.js"></script>
<script src="/kedu/hanja/hanzi-writer.min.js"></script>
<script>
(function(){
  'use strict';
  var D = (window.KQuiz && window.KQuiz.hanjaData) || null;
  var HW = window.HanziWriter || null;
  var app = document.getElementById('app');
  if (!D) { app.innerHTML = '<div class="sheet">한자 자료를 불러오지 못했어요. 새로고침해 주세요.</div>'; return; }

  var ROUNDS = 10;                     // 한 글자 = 열 번 쓰기
  var st = { grade:1, ci:1, stage:1,   // stage 1 만나기 · 2 쓰기 · 3 낱말
             round:1, browse:false, writer:null, met:false, today:null, peek:false };

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
  function total(){ return D.all(st.grade).length; }
  function ch(){ return D.all(st.grade)[st.ci-1]; }

  /* ── 성취 기록(글자별 완주)은 이 기기에 남는다 ── */
  function doneMap(){
    try { return JSON.parse(localStorage.getItem('kedu_hanja_done_g'+st.grade) || '{}'); }
    catch(e){ return {}; }
  }
  function markDone(){
    if (st.peek) return;                 /* 미리보기로 열었으면 아무것도 남기지 않는다 */
    try {
      var m = doneMap(); m[st.ci] = 1;
      localStorage.setItem('kedu_hanja_done_g'+st.grade, JSON.stringify(m));
    } catch(e){}
  }

  /* ── 획순 자료: 한 글자 2KB, 그때그때 ── */
  var cache = {};
  function loadStrokes(c){
    if (c in cache) return Promise.resolve(cache[c]);
    return fetch('/kedu/hanja/strokes/'+encodeURIComponent(c)+'.json')
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ cache[c]=j; return j; })
      .catch(function(){ cache[c]=null; return null; });
  }
  function charLoader(c, onLoad, onErr){ loadStrokes(c).then(function(j){ j?onLoad(j):onErr(); }); }

  /* ── 주소 풀기: c키·옛 s키·grade/char 모두 받는다 ──
     ★D8-ⓗ: **진도일(today)은 c키 통로로 들어왔을 때만 안다.** 아침활동 허브(`/morning/`)와
       교사 현황판이 서버에서 받은 그날 몫을 `?key=g4_hanja_c015` 로 넘겨 준다. 반면
       `?grade&char` 는 둘러보기·교사 미리보기가 **아무 날이나** 여는 통로라, 그 글자가
       오늘 몫인지 이 화면은 알 길이 없다. 모르면서 「오늘」이라 말하면 지어내기다.
       모르면 `today = null` 로 두고, 화면은 「이 글자」라고만 말한다.
     ★옛 s키(회차)는 10자 묶음의 **첫 글자**로만 열린다 — 그 글자가 오늘 몫이라는 근거가
       아니므로 today 를 주지 않는다(하루 1자 전환 전의 통로다).
     ★이름·뜻은 `sents.html` 과 같게 뒀다(onToday·dayW·peekQs·peekNote) — 다르면
       다음 사람이 한쪽만 고친다. */
  function fromUrl(){
    var q = new URLSearchParams(location.search);
    var peek = q.get('peek') === '1';
    var key = q.get('key') || '';
    var m = key.match(/^g(\d)_hanja_c(\d{1,3})$/);
    if (m) return { grade:+m[1], ci:+m[2], today:+m[2], browse:false, peek:peek };
    m = key.match(/^g(\d)_hanja_s(\d{1,2})$/);               // 옛 회차 키 → 그 회차 첫 글자
    if (m) return { grade:+m[1], ci:(+m[2]-1)*10+1, today:null, browse:false, peek:peek };
    var g = +q.get('grade') || 1;
    if (q.get('char')) return { grade:g, ci:+q.get('char'), today:null, browse:false, peek:peek };
    return { grade:g, ci:1, today:null, browse: q.get('char') == null && !key, peek:peek };
  }
  /* 지금 보고 있는 글자가 「오늘 몫」임을 이 화면이 근거를 갖고 말할 수 있는가 */
  function onToday(){ return st.today != null && st.ci === st.today; }
  function charW(){ return onToday() ? '오늘 글자' : '이 글자'; }
  function dayW(){  return onToday() ? '오늘' : '이 날'; }
  /* 화면 안의 통로(전체·둘러보기 격자)는 peek 를 계속 물고 간다 —
     한 번 미리보기로 들어왔는데 옆으로 한 칸 옮기자 기록이 살아나면 안 된다. */
  function peekQs(){ return st.peek ? '&peek=1' : ''; }
  function peekNote(){
    return st.peek
      ? '<div class="peeknote">미리보기로 열었어요 — 여기서 무엇을 해도 <b>기록이 남지 않아요</b>. '
        + '아이들이 만날 화면 그대로예요.</div>'
      : '';
  }
  /* 원장이 아는 묶음 = 10자 step. 「주」는 원장에 없다(요일·주 배정은 교사 시간표 소관). */
  function stepInfo(){
    var sz = D.STEP_SIZE || 10, si = Math.floor((st.ci-1)/sz) + 1;
    var body = D.step(st.grade, si) || [];
    return { no:si, cnt:D.stepCount(st.grade), within:st.ci-(si-1)*sz, size:body.length };
  }
  /* ★`ci` 는 구간 안으로 당기지만 `today` 는 **당기지 않는다** — 당기면 「엉뚱한 글자를
       오늘이라 우기는」 상태가 만들어진다. 구간 밖이면 조용히 버린다.
       학년마다 자수가 다르므로(50·50·50·75·75·100) 이 검사는 실제로 작동한다. */
  function clamp(){
    if (D.grades().indexOf(st.grade) < 0) st.grade = D.grades()[0];
    st.ci = Math.min(Math.max(st.ci||1, 1), total());
    if (st.today != null && (st.today < 1 || st.today > (total() || 0))) st.today = null;
  }

  /* ══════════════ 오늘의 활동 ══════════════ */

  function journeyHtml(){
    var names = ['만나기','열 번 쓰기','낱말'];
    return '<div class="journey">' + names.map(function(n,i){
      var k = i+1;
      var cls = k < st.stage ? 'done' : (k === st.stage ? 'on' : '');
      return (i? '<div class="jline"></div>':'')
        + '<div class="jstep '+cls+'"><div class="b">'+(k<st.stage?'✓':k)+'</div>'+n+'</div>';
    }).join('') + '</div>';
  }
  /* ★D8-ⓗ: 예전엔 머리가 `['월','화','수','목','금'][(일째-1)%5]` 로 요일을 만들어
       「2주 화」라 적었다. **1일째가 월요일이라는 근거는 어디에도 없다** — 한자를 어느 요일에
       넣을지는 교사 시간표(`ma_routines`)가 정하고 원장에는 없다. 주 2회 반이면 11일째는
       실제로 6주째이고, 매일 넣은 반이라도 첫날이 수요일이면 그날부터 전부 어긋난다.
       이동 칩 「← 어제」·「내일 →」도 같은 종류다 — 다음 글자가 **하루 뒤**라는 주장인데
       원장은 일차 사이의 간격을 쥐고 있지 않다.
     ★주(모름) → 묶음(앎)으로 갈았다. 원장이 아는 묶음은 10자 step 뿐이다.
     ★정직해지면서 정보가 줄면 안 된다 — 오늘 몫을 벗어나면 「오늘 글자로 ↩」이 뜬다.
       칩 이름만 바꾸고 이걸 안 넣으면, 예전엔 「어제」라는 거짓말이 최소한 「움직였다」는
       사실은 알려 줬는데 그마저 사라진다. */
  function headHtml(){
    var si = stepInfo();
    return peekNote() + '<div class="head">'
      + '<div class="day">'+st.grade+'학년 '+st.ci+'일째 글자'
      +   '<small>'+(onToday() ? '오늘 글자 · ' : '')
      +   si.no+'번째 묶음(모두 '+si.cnt+') · '+si.size+'자 중 '+si.within+'번째'
      +   ' · 모두 '+total()+'자</small></div>'
      + '<div class="nav-ch">'
      +   '<button class="chip" id="pv" type="button"'+(st.ci<=1?' disabled':'')+'>← 이전 글자</button>'
      +   '<button class="chip" id="nx" type="button"'+(st.ci>=total()?' disabled':'')+'>다음 글자 →</button>'
      +   (st.today != null && !onToday()
            ? '<button class="chip" id="bk" type="button">오늘 글자로 ↩</button>' : '')
      +   '<a class="chip quiet" href="/morning/chars.html?grade='+st.grade+peekQs()+'">전체</a>'
      + '</div></div>';
  }
  function wireHead(){
    document.getElementById('pv').onclick = function(){ gotoChar(st.ci-1); };
    document.getElementById('nx').onclick = function(){ gotoChar(st.ci+1); };
    var bk = document.getElementById('bk');
    if (bk) bk.onclick = function(){ gotoChar(st.today); };
  }
  function gotoChar(i){
    if (i < 1 || i > total()) return;
    st.ci = i; st.stage = 1; st.round = 1; st.met = false; render();
  }

  /* ── 1막 · 만나기: 글자가 먼저 그어지고, 훈음이 뒤따라 온다 ── */
  function renderMeet(){
    var x = ch();
    app.innerHTML = headHtml() + journeyHtml()
      + '<div class="sheet">'
      + '<div class="corner" id="sc"></div>'
      + '<div class="mija big"><div id="tgt"></div></div>'
      + '<div class="hy-line" id="hy">'+esc(x.hun)+' <b>'+esc(x.eum)+'</b></div>'
      + '<div class="hy-sub" id="hs"></div>'
      + '<div class="row">'
      +   '<button class="bt line" id="replay" type="button">획순 한 번 더</button>'
      +   '<button class="bt" id="go-write" type="button">쓰러 가기</button>'
      + '</div>'
      + '</div>' + creditHtml();
    wireHead();
    document.getElementById('go-write').onclick = function(){ st.stage = 2; st.round = 1; render(); };

    var tgt = document.getElementById('tgt');
    loadStrokes(x.c).then(function(data){
      if (!tgt.isConnected) return;
      var hy = document.getElementById('hy');
      if (!data || !HW) {
        tgt.innerHTML = '<div style="font-family:var(--kedu-title);font-size:min(220px,58vw);line-height:1.35">'+esc(x.c)+'</div>';
        document.getElementById('replay').disabled = true;
        document.getElementById('hs').innerHTML =
          '이 글자는 획순 자료가 아직 없어요. 뜻과 낱말은 그대로 배울 수 있어요.';
        hy.classList.add('in');
        return;
      }
      document.getElementById('sc').innerHTML = '<b>'+data.strokes.length+'획</b>';
      var size = tgt.parentNode.clientWidth || 340;
      var w = HW.create(tgt, x.c, {
        width:size, height:size, padding:12,
        showCharacter:false, showOutline:false,
        strokeColor:'#26262E', outlineColor:'#DCD2BC',
        strokeAnimationSpeed:1, delayBetweenStrokes:170,
        charDataLoader: charLoader
      });
      st.writer = w;
      function play(){
        w.animateCharacter({ onComplete:function(){ hy.classList.add('in'); st.met = true; } });
      }
      play();
      document.getElementById('replay').onclick = play;
    });
  }

  /* ── 2막 · 열 번 쓰기: 갈수록 도움이 줄어든다 ──
     1~3회 보고 쓰기(옅은 본이 깔림) · 4~7회 떠올려 쓰기(본 없음)
     8~10회 혼자 쓰기(본 없음 · 판정이 더 깐깐해짐 — 선에 맞아야 그어진다) */
  function roundCfg(r){
    if (r <= 3) return { outline:true,  hintAfter:2, leniency:1.0,  label:'보고 쓰기' };
    if (r <= 7) return { outline:false, hintAfter:2, leniency:1.0,  label:'떠올려 쓰기' };
    return           { outline:false, hintAfter:3, leniency:0.85, label:'혼자 쓰기' };
  }
  function trayHtml(){
    var x = ch(), out = '';
    for (var i = 1; i <= ROUNDS; i++) {
      out += '<div class="cell'+(i===st.round?' now':'')+'" data-r="'+i+'">'
        + (i < st.round ? '<div class="seal">'+esc(x.c)+'</div>' : '') + '</div>';
    }
    return '<div class="tray-label">열 번 쓰면 큰 도장을 찍어요</div><div class="tray">'+out+'</div>';
  }
  function renderWrite(){
    var x = ch(), cfg = roundCfg(st.round);
    app.innerHTML = headHtml() + journeyHtml()
      + '<div class="sheet">'
      + '<div class="corner"><b>'+st.round+'번째</b> · '+esc(cfg.label)+'</div>'
      + '<div style="font-family:var(--kedu-title);font-size:19px;margin-bottom:2px">'+esc(x.hun)+' '+esc(x.eum)+'</div>'
      + '<div class="hy-sub">'+(cfg.outline ? '옅은 글씨를 따라 순서대로 써 보세요'
                                            : '이번엔 본 없이! 획 순서를 떠올려 보세요')+'</div>'
      + '<div class="mija" style="margin-top:10px"><div id="tgt"></div></div>'
      + '<div class="say" id="say"></div>'
      + trayHtml()
      + '<div class="row">'
      +   '<button class="bt line" id="peek" type="button">획순 보기</button>'
      +   '<button class="bt line" id="again" type="button">이 번 다시</button>'
      + '</div>'
      + '</div>' + creditHtml();
    wireHead();
    mountQuiz(x, cfg);
  }
  function mountQuiz(x, cfg){
    var tgt = document.getElementById('tgt'), say = document.getElementById('say');
    loadStrokes(x.c).then(function(data){
      if (!tgt.isConnected) return;
      if (!data || !HW) {
        tgt.innerHTML = '<div class="nodata">이 글자는 획순 자료가 아직 없어서 쓰기 연습을 건너뛰어요.</div>';
        document.getElementById('peek').disabled = true;
        document.getElementById('again').disabled = true;
        var skip = document.createElement('button');
        skip.className = 'bt'; skip.type = 'button'; skip.textContent = '낱말 배우러 가기';
        skip.onclick = function(){ st.stage = 3; render(); };
        tgt.parentNode.parentNode.querySelector('.row').appendChild(skip);
        return;
      }
      tgt.innerHTML = '';
      var size = tgt.parentNode.clientWidth || 300;
      var w = HW.create(tgt, x.c, {
        width:size, height:size, padding:10,
        showCharacter:false,
        showOutline:cfg.outline,
        leniency:cfg.leniency,                       // 선에 맞게 긋지 않으면 그어지지 않는다
        strokeColor:'#26262E', outlineColor:'#CFC5AC',
        highlightColor:'#C0392F', drawingColor:'#26262E', drawingWidth:20,
        charDataLoader: charLoader
      });
      st.writer = w;
      w.quiz({
        showHintAfterMisses: cfg.hintAfter,          // 그래도 막히면 그 획만 보여준다
        onMistake: function(res){
          say.className = 'say oops';
          say.textContent = '선이 어긋났어요. '+res.strokeNum+'번째 획, 천천히 다시!';
        },
        onCorrectStroke: function(res){
          say.className = 'say good';
          say.textContent = res.strokesRemaining > 0 ? '좋아요, '+res.strokesRemaining+'획 남았어요' : '';
        },
        onComplete: function(){ finishRound(); }
      });
      document.getElementById('peek').onclick = function(){
        // 보는 건 자유지만, 이 번은 처음부터 다시 쓴다 — 보고 넘어가기 방지
        w.cancelQuiz && w.cancelQuiz();
        w.animateCharacter({ onComplete: function(){ renderWrite(); } });
        say.className = 'say'; say.textContent = '눈에 담았으면, 처음부터 다시 써 볼까요?';
      };
      document.getElementById('again').onclick = function(){ renderWrite(); };
    });
  }
  function finishRound(){
    var say = document.getElementById('say');
    var cellNow = document.querySelector('.cell[data-r="'+st.round+'"]');
    if (cellNow) {
      cellNow.classList.remove('now');
      cellNow.innerHTML = '<div class="seal pop">'+esc(ch().c)+'</div>';
    }
    if (st.round >= ROUNDS) {
      say.className = 'say good'; say.textContent = '';
      setTimeout(function(){ st.stage = 3; render(); }, 650);
    } else {
      st.round++;
      say.className = 'say good';
      say.textContent = st.round + '번째 종이를 폈어요';
      setTimeout(function(){ if (st.stage === 2) renderWrite(); }, 600);
    }
  }

  /* ── 3막 · 낱말: 오늘 글자가 사는 낱말들 ── */
  function words(){ return D.wordsWith(ch().c, st.grade); }
  function hjHtml(word){
    var c = ch().c;
    return Array.prototype.map.call(word, function(g){
      return g === c ? '<span class="hit">'+esc(g)+'</span>' : esc(g);
    }).join('');
  }
  function renderWords(){
    var x = ch(), ws = words();
    var inner;
    if (!ws.length) {
      inner = '<div class="nodata">「'+esc(x.c)+'」'+(x.hun)+' '+(x.eum)+' — 이 글자로 된 낱말은 아직 사전에 없어요.<br>'
        + dayW()+'은 글자만으로도 충분해요!</div>'
        + '<div class="row"><button class="bt" id="fin" type="button">'+charW()+' 끝내기</button></div>';
    } else if (ws.length === 1) {
      // 낱말이 하나면: 낱말 속에서 오늘 글자를 찾는다
      var w0 = ws[0];
      inner = '<div class="wordy">'
        + '<div class="lead">「'+esc(w0.word)+'」은(는) <b>'+esc(w0.ko)+'</b>라는 뜻이에요.<br>'
        + '이 낱말에서 '+dayW()+' 배운 <b>'+esc(x.hun)+' '+esc(x.eum)+'</b>를 찾아 눌러 보세요.</div>'
        + '<div class="findword" id="fw">'
        + Array.prototype.map.call(w0.word, function(g,i){
            return '<button type="button" data-c="'+esc(g)+'">'+esc(g)+'</button>'; }).join('')
        + '</div><div class="say" id="wsay"></div>'
        + '<div class="row" style="display:none" id="finrow"><button class="bt" id="fin" type="button">'+charW()+' 끝내기</button></div>'
        + '</div>';
    } else {
      // 낱말이 여럿이면: 낱말 ↔ 뜻 짝짓기
      var shuffled = ws.map(function(w,i){ return {ko:w.ko, i:i}; })
        .sort(function(){ return Math.random()-.5; });
      inner = '<div class="wordy">'
        + '<div class="lead">'+charW()+' <span style="color:var(--seal);font-family:var(--kedu-title)">'+esc(x.c)+'</span>'
        + ' 이(가) 사는 낱말들이에요.<br>낱말과 뜻을 <b>짝지어</b> 보세요.</div>'
        + '<div class="mcol">'
        + '<div>' + ws.map(function(w,i){
            return '<div class="mitem hj" data-w="'+i+'" role="button" tabindex="0">'+hjHtml(w.word)+'</div>';
          }).join('<div style="height:9px"></div>') + '</div>'
        + '<div>' + shuffled.map(function(s){
            return '<div class="mitem" data-k="'+s.i+'" role="button" tabindex="0">'+esc(s.ko)+'</div>';
          }).join('<div style="height:9px"></div>') + '</div>'
        + '</div><div class="say" id="wsay"></div>'
        + '<div class="row" style="display:none" id="finrow"><button class="bt" id="fin" type="button">'+charW()+' 끝내기</button></div>'
        + '</div>';
    }
    app.innerHTML = headHtml() + journeyHtml()
      + '<div class="sheet">'
      + '<div class="corner">낱말 마당</div>'
      + inner + '</div>' + creditHtml();
    wireHead();
    wireWords(ws);
  }
  function wireWords(ws){
    var x = ch(), say = document.getElementById('wsay');
    var fin = document.getElementById('fin');
    if (fin) fin.onclick = renderDone;
    if (!ws.length) return;

    if (ws.length === 1) {
      document.querySelectorAll('#fw button').forEach(function(b){
        b.onclick = function(){
          if (b.dataset.c === x.c) {
            b.classList.add('yes');
            say.className = 'say good'; say.textContent = '찾았어요! 「'+ws[0].word+'」 — '+ws[0].ko;
            document.getElementById('finrow').style.display = 'flex';
          } else {
            b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
            say.className = 'say oops'; say.textContent = '그 글자가 아니에요. '+(onToday()?'오늘':'방금')+' 쓴 글자를 떠올려 보세요.';
          }
        };
      });
      return;
    }
    var pickW = null, locked = 0;
    function items(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
    items('.mitem.hj').forEach(function(el){
      el.onclick = function(){
        if (el.classList.contains('lock')) return;
        items('.mitem.hj').forEach(function(e){ e.classList.remove('pick'); });
        el.classList.add('pick'); pickW = +el.dataset.w;
      };
      el.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.onclick(); } };
    });
    items('.mitem:not(.hj)').forEach(function(el){
      el.onclick = function(){
        if (el.classList.contains('lock') || pickW == null) return;
        if (+el.dataset.k === pickW) {
          el.classList.add('lock');
          var w = document.querySelector('.mitem.hj[data-w="'+pickW+'"]');
          w.classList.add('lock'); w.classList.remove('pick');
          pickW = null; locked++;
          say.className = 'say good';
          say.textContent = locked === ws.length ? '' : '맞았어요! '+(ws.length-locked)+'짝 남았어요';
          if (locked === ws.length) {
            say.textContent = '다 짝지었어요!';
            document.getElementById('finrow').style.display = 'flex';
          }
        } else {
          el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
          say.className = 'say oops'; say.textContent = '다시 생각해 볼까요?';
        }
      };
      el.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.onclick(); } };
    });
  }

  /* ── 마무리: 큰 낙관 ── */
  function renderDone(){
    var x = ch();
    markDone();
    app.innerHTML = headHtml() + journeyHtml().replace('jstep on','jstep done')
      + '<div class="sheet">'
      + '<div class="bigseal pop"><div class="c">'+esc(x.c)+'</div><div class="t">成</div></div>'
      + '<div style="font-family:var(--kedu-title);font-size:20px;margin-top:4px">'
      +   esc(x.hun)+' '+esc(x.eum)+', '+(onToday()?'오늘 것':'한 글자')+' 완성!</div>'
      + '<div class="hy-sub" style="margin-top:6px">열 번 쓰고 낱말까지 — '
      +   (st.ci >= total() ? '이 학년 글자를 모두 만났어요.' : '다음 글자가 기다려요.')+'</div>'
      + '<div class="row">'
      +   '<a class="bt" href="/morning/" style="text-decoration:none">확인 문제 풀러 가기</a>'
      +   '<button class="bt line" id="onemore" type="button">한 번 더 쓰기</button>'
      + '</div>'
      + '</div>' + creditHtml();
    wireHead();
    document.getElementById('onemore').onclick = function(){ st.stage = 2; st.round = 1; render(); };
  }

  /* ══════════════ 둘러보기(교사·전체) ══════════════ */
  /* ★D8-ⓗ: 격자도 5자씩 「N주」로 묶고 칸마다 요일을 적고 있었다 — 머리와 같은 지어내기다.
       원장이 아는 묶음은 10자 step 뿐이라 그것으로 갈았고, 칸 라벨은 일차로 바꿨다.
       「N주면 다 만나요」도 걷어냈다 — 며칠 만에 다 만나는지는 교사 시간표가 정한다. */
  function renderBrowse(){
    var done = doneMap(), all = D.all(st.grade), sz = D.STEP_SIZE || 10;
    var steps = D.stepCount(st.grade);
    var out = peekNote() + '<div class="browse-bar">'
      + '<div><label for="g">학년</label><select id="g">'
      + D.grades().map(function(g){ return '<option value="'+g+'"'+(g===st.grade?' selected':'')+'>'+g+'학년</option>'; }).join('')
      + '</select></div>'
      + '<div class="browse-meta"><b>'+st.grade+'학년</b>은 하루 한 자, 모두 <b>'+all.length+'자</b> — '
      +   '<b>'+steps+'개 묶음</b>으로 나뉘어요. 글자를 누르면 그 활동이 열려요.</div>'
      + '<button class="bt line" id="print" type="button">인쇄</button>'
      + '</div>';
    for (var w = 0; w < steps; w++) {
      var cs = all.slice(w*sz, w*sz+sz);
      out += '<div class="stepbox"><h3>'+(w+1)+'번째 묶음 <small>'+(w*sz+1)+'~'+(w*sz+cs.length)+'일째</small></h3><div class="wgrid">'
        + cs.map(function(x,i){
            var ci = w*sz+i+1;
            return '<a class="wg" href="/morning/chars.html?grade='+st.grade+'&char='+ci+peekQs()+'">'
              + (done[ci] ? '<div class="mini">'+esc(x.c)+'</div>' : '')
              + '<div class="d">'+ci+'일째</div>'
              + '<div class="c">'+esc(x.c)+'</div>'
              + '<div class="h">'+esc(x.hun)+' '+esc(x.eum)+'</div></a>';
          }).join('')
        + '</div></div>';
    }
    app.innerHTML = out + creditHtml();
    document.getElementById('g').onchange = function(){
      st.grade = +this.value;
      st.today = null;        /* 4학년 15일째로 들어와 3학년으로 옮기면 그 15일째는 오늘이 아니다 */
      render();
    };
    document.getElementById('print').onclick = function(){ window.print(); };
  }

  function creditHtml(){
    return '<p class="credit">획순 자료 — <a href="https://github.com/skishore/makemeahanzi" rel="noopener">Make Me A Hanzi</a>'
      + ' (Arphic Public License) · 획순 엔진 — <a href="https://github.com/chanind/hanzi-writer" rel="noopener">Hanzi Writer</a> (MIT)</p>';
  }

  function render(){
    clamp();
    if (st.browse) return renderBrowse();
    if (st.stage === 1) return renderMeet();
    if (st.stage === 2) return renderWrite();
    return renderWords();
  }

  var u = fromUrl();
  st.grade = u.grade; st.ci = u.ci; st.browse = u.browse; st.today = u.today; st.peek = u.peek;
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>번쩍 궤짝과 불꽃 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#0b1630}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#0b1630;color:#ffe9b0;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem;pointer-events:none}#coins img.art{height:1em}
#coins.pop{animation:cpop .4s}@media (max-width:520px){#coins{top:auto;bottom:calc(32px + env(safe-area-inset-bottom,0px))}}@keyframes cpop{40%{transform:scale(1.3)}}
/* 띠: 「모두 ?개」 → 닫히면 「모두 3개」(교과서 말) — 눌러도 뒤의 궤짝으로. 말이 긴 띠(이야기)는 마디 사이에서 접힌다 */
#tray{pointer-events:none}#tray i.w{font-size:.62em;opacity:.95}#tray i.op{font-style:normal;padding:0 .05em}#tray .dots u{width:.36em;height:.36em}#tray b.dotsb{background:transparent;min-width:auto;padding:0 .1em}
#tray.story{flex-wrap:wrap;justify-content:center;row-gap:.16em;font-size:clamp(1.18rem,4.6vw,2.3rem);border-radius:1.1em;padding:.3em .7em;column-gap:.4em;max-width:96vw;white-space:normal}#tray.story i.w{font-size:.8em}
#tray.num1 b{min-width:1.8em;height:1.6em;font-size:1.25em}
/* 단추 줄(choose.js row) — 덧문이 열린 동안은 조금 흐리게(눌러도 물결 + 「닫히면 눌러 줘」) · 들썩 */
#choose.hold button{filter:saturate(.55) brightness(.92)}#choose button.bob{animation:chbob .45s}@keyframes chbob{40%{transform:translateY(-12px)}}
#choose.eq button{width:auto;min-width:200px;height:84px;padding:0 20px;font-size:2.3rem;letter-spacing:.02em;white-space:nowrap}
@media (max-width:520px){#choose.eq{flex-direction:column;gap:8px}#choose.eq button{min-width:190px;height:58px;font-size:1.8rem}}
@media (max-height:560px) and (min-aspect-ratio:1/1){html #tray{top:calc(6px + env(safe-area-inset-top,0px))!important;font-size:1.9rem!important}#marbles{left:auto!important;right:calc(132px + env(safe-area-inset-right,0px));transform:none!important}html #choose.row button{min-height:84px;width:70px;font-size:2.2rem;padding:6px 2px}html #choose button{width:70px;height:70px;font-size:2.3rem}html #choose.eq button{height:56px;font-size:1.6rem}html #choose.row button.dot .dots u{width:9px;height:9px;border-width:1.5px}html #choose.row button.dot .dots,html #choose.row button.dot .dots i{gap:2px}}
/* 하나씩 세어지는 수(통 위) · 묶음의 수 · 수 팻말 · 덧문의 숫자 */
.cnt{position:fixed;z-index:3;transform:translate(-50%,-100%);min-width:1.45em;padding:1px 6px;border-radius:999px;background:#fff4d6;color:#4a2a0c;border:3px solid #8a5a2b;font-weight:900;font-size:1.3rem;line-height:1.25;text-align:center;pointer-events:none;display:none}.cnt.on{display:block;animation:cntpop .3s}.cnt.all{background:#ffd34d}@keyframes cntpop{0%{transform:translate(-50%,-60%) scale(.3)}}
@media (max-width:520px){.cnt{font-size:1.1rem;border-width:2px;padding:0 5px}}
.gsum{position:fixed;z-index:3;transform:translate(-50%,-50%);background:#ffd34d;color:#4a2a0c;border:4px solid #8a5a2b;border-radius:14px;padding:2px 12px;font-weight:900;font-size:1.8rem;line-height:1.2;pointer-events:none;display:none}.gsum.on{display:block;animation:cntpop .3s}.gsum.away{opacity:.35}
.fsign{position:fixed;z-index:3;transform:translate(-50%,-100%);pointer-events:none;display:none}.fsign.on{display:block}.fsign canvas{display:block}.fsign.pop canvas{animation:spop .4s}@keyframes spop{40%{transform:scale(1.25)}}
#doornum{position:fixed;z-index:3;transform:translate(-50%,-50%);pointer-events:none;display:none}#doornum.on{display:block;animation:dnflash .25s}#doornum canvas{display:block;filter:drop-shadow(0 0 18px rgba(255,230,140,.95))}@keyframes dnflash{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}}
/* 고르는 묶음 · 쪽이 들썩(헛누름 — 답은 짚지 않음) · 물러난 묶음 */
#home .row .fl{display:inline-flex;align-items:flex-end;gap:2px}#home .row .fl i{font-style:normal;font-size:.7em}
</style>
</head>
<body>
<canvas id="c"></canvas>

</html>

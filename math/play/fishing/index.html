<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>낚시 섬 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;pointer-events:none}
#line{position:fixed;z-index:2;width:3px;background:rgba(255,255,255,.95);transform-origin:top center;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 0 2px rgba(0,0,0,.35)}
#fade{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
/* 물고기 등의 수(작은 팻말) · 지금 채우는 통의 팻말은 크게, 다른 통은 옅게 */
.sign.fs{min-width:34px;height:34px;padding:0 7px;font-size:1.2rem;border-width:3px;border-radius:10px;box-shadow:0 3px 0 rgba(60,30,5,.3);letter-spacing:-.08em}
.sign.fs::after{height:8px;width:4px;margin-left:-2px}
.sign.fs.dots{font-size:.82rem;letter-spacing:0}
.sign.fs.gold{background:#ffd34d;border-color:#b98400}
.sign.off{opacity:.55;transform:translate(-50%,-100%) scale(.82)}
.sign.done{background:#c8f2ae;border-color:#3e8a2b}
#rod{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,244,214,.92);border:4px solid #8a5a2b;border-radius:18px;padding:6px 10px;font-family:inherit;font-weight:900;color:#4a2a0c;box-shadow:0 5px 0 rgba(60,30,5,.3);opacity:.6;cursor:pointer}
#rod.can{opacity:1;animation:rodpop 1.2s infinite}@keyframes rodpop{50%{transform:scale(1.07)}}#rod .pic img.art{height:56px;width:auto;display:block}#rod .pr{display:flex;align-items:center;gap:4px;font-size:1.15rem}#rod .pr img.art{height:1em}
@media (max-width:520px){#rod .pic img.art{height:40px}#rod{padding:4px 8px}}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:1rem;pointer-events:none}#coins img.art{height:1em}
#streak{top:calc(52px + env(safe-area-inset-top,0px))!important}
#bookBtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(52px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(255,244,214,.92);border:3px solid #8a5a2b;border-radius:999px;padding:3px 12px 3px 6px;font-family:inherit;font-weight:900;font-size:1rem;color:#4a2a0c;cursor:pointer}#bookBtn img.art{height:1.7em}
#bookBtn.new{animation:bkpop .6s 2}@keyframes bkpop{50%{transform:scale(1.25)}}
#book{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#book .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#fff4d6;border:6px solid #b9853b;border-radius:24px;padding:14px;max-width:min(96vw,640px)}
#book .grid span{background:#e6f4fb;border-radius:14px;padding:6px;display:flex;align-items:center;justify-content:center}#book .grid img.art{width:100%;height:auto;filter:brightness(0);opacity:.28}#book .grid span.on{background:#fff}#book .grid span.on img.art{filter:none;opacity:1}
#streak{top:calc(92px + env(safe-area-inset-top,0px))!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/math/play/plaza/">← 광장</a>
<div id="line"></div>
<div id="fade"></div>
<div id="loading">바다로 가는 중…</div>
<script type="module" src="./fishing.js?v=14"></script>
</body>
</html>

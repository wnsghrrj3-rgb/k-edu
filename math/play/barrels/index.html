<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>통 부두 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;pointer-events:none}
#fade{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
/* 배 팻말(실을 수 · 처음엔 식일 수도) · 깔판 팻말 「10」 */
.sign.ship{font-size:2.3rem;min-width:76px;height:64px;padding:0 14px;white-space:nowrap}
.sign.ship.expr{font-size:1.7rem}
.sign.fs{min-width:34px;height:32px;padding:0 7px;font-size:1.15rem;border-width:3px;border-radius:9px;box-shadow:0 3px 0 rgba(60,30,5,.3)}
.sign.fs::after{height:7px;width:4px;margin-left:-2px}
.sign.done{background:#c8f2ae;border-color:#3e8a2b}
.sign.gain{background:#ffd34d;border-color:#b98400;font-size:1.5rem;height:46px;padding:0 12px;gap:4px;white-space:nowrap}.sign.gain img.art{height:1em;vertical-align:-.12em}.sign.gain::after{display:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:1rem;pointer-events:none}#coins img.art{height:1em}
#streak{top:calc(52px + env(safe-area-inset-top,0px))!important}
@media (max-width:520px){.sign.ship{font-size:1.9rem;height:54px}.sign.ship.expr{font-size:1.4rem}#tray{top:calc(52px + env(safe-area-inset-top,0px))!important;font-size:1.4rem!important}#streak{top:calc(96px + env(safe-area-inset-top,0px))!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/math/play/plaza/">← 광장</a>
<div id="fade"></div>
<div id="loading">부두로 가는 중…</div>
<script type="module" src="./barrels.js?v=1"></script>
</body>
</html>

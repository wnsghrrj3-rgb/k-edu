<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>저울에 올려 보기 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#bfe6f5}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#bfe6f5;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem;pointer-events:none}#coins img.art{height:1em}
#coins.pop{animation:cpop .4s}@media (max-width:520px){#coins{top:auto;bottom:calc(32px + env(safe-area-inset-bottom,0px))}}@keyframes cpop{40%{transform:scale(1.3)}}
#tray{pointer-events:none}#tray i.w{font-size:.6em;opacity:.97}
@media (max-height:560px) and (min-aspect-ratio:1/1){html #tray{top:calc(8px + env(safe-area-inset-top,0px))!important;font-size:2.1rem!important}#marbles{left:auto!important;right:calc(132px + env(safe-area-inset-right,0px));transform:none!important}}   /* 낮은 가로: 띠를 맨 위에 작게 · 구슬은 오른쪽 위 등불 옆으로(물체 몫을 남긴다) */
/* 자루의 숫자 꼬리표(자루를 따라다닌다 — 평면 안에서 돌지 않음) */
.tag{position:fixed;z-index:3;transform:translate(-50%,-100%);pointer-events:none;transition:opacity .3s}
.tag.off{display:none}.tag canvas{display:block}.tag.dim{opacity:.42}
.tag.lit canvas{filter:brightness(1.15) drop-shadow(0 0 9px #ffd34d) drop-shadow(0 0 3px #fff3b0)}
.tag.bob{animation:tbob .45s}@keyframes tbob{40%{margin-top:-14px}}
/* 가려진 자루의 천(꼬리표를 덮는다 — 다 나오면 걷힌다) */
#cloth{position:fixed;z-index:4;pointer-events:none;border-radius:14px;background:repeating-linear-gradient(135deg,#c8553d 0 12px,#d9714f 12px 24px);border:4px solid #8a3a26;box-shadow:0 6px 0 rgba(60,20,5,.3);opacity:0;transition:opacity .45s,transform .45s}
#cloth.on{opacity:1}#cloth.lift{opacity:0;transform:translateY(-40px) rotate(-8deg)}
#cloth::after{content:"";position:absolute;left:50%;top:-12px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#8a3a26}
/* 손님 말풍선(가로 화면 — 전화기 세로는 띠가 대신한다) */
#bubble{position:fixed;z-index:4;transform:translate(-50%,-100%);background:#fff;color:#12314a;border:4px solid #12314a;border-radius:20px;padding:8px 16px;font-weight:900;font-size:1.35rem;white-space:nowrap;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-10px;border:10px solid transparent;border-top-color:#12314a}
#bubble.pop{animation:bpop .35s}@keyframes bpop{40%{transform:translate(-50%,-100%) scale(1.15)}}
/* 새는 모래(알갱이 몇 개 — 화면 꾸밈 · 숫자 · 눈금 없음) */
#sand{position:fixed;z-index:2;width:14px;height:44px;margin-left:-7px;pointer-events:none;display:none}
#sand.on{display:block}#sand i{position:absolute;left:5px;top:0;width:4px;height:4px;border-radius:50%;background:#e6c27a;animation:sandfall .7s linear infinite}
#sand i:nth-child(2){left:7px;animation-delay:.18s}#sand i:nth-child(3){left:3px;animation-delay:.35s}#sand i:nth-child(4){left:6px;animation-delay:.52s}
@keyframes sandfall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:.1}}
/* 맞게 찍은 자루 쪽에 서는 깃발 · 풀 흩날림 */
.flagpin{position:fixed;z-index:4;font-size:2.4rem;line-height:1;transform:translate(-50%,-100%);pointer-events:none;animation:fpin .4s}.flagpin img.art{height:1em;width:auto}@keyframes fpin{0%{transform:translate(-50%,-60%) scale(.2)}}
.puff{position:fixed;z-index:2;width:9px;height:5px;border-radius:5px;background:#5fae3e;pointer-events:none;animation:puff .9s ease-out forwards}@keyframes puff{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
/* 나들이 끝 줄: 오늘 실어 보낸 자루의 꼬리표 */
#home .row img.ns{height:2.2em;width:auto;vertical-align:middle}
</style>
</head>

</html>

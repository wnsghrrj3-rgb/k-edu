<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#bfe6f5}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#bfe6f5;color:#12314a;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.45);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem;pointer-events:none}#coins img.art{height:1em}
#coins.pop{animation:cpop .4s}@keyframes cpop{40%{transform:scale(1.3)}}
@media (max-width:520px){#coins{top:auto;bottom:calc(32px + env(safe-area-inset-bottom,0px))}}
/* 띠: 「7은 ?」 · 「2씩 4묶음은 ?」(교과서 말 · 곱하기 기호 없음) — 눌러도 뒤의 세계로 */
#tray{pointer-events:none}#tray i.w{font-size:.62em;opacity:.95;margin-left:-.18em}#tray b.run{background:#ffe9a8}#tray b.run.tick{animation:runtick .3s}@keyframes runtick{40%{transform:scale(1.25)}}
/* 주문 줄: 쪽지가 줄에 걸린다(맨 왼쪽이 지금 문제) */
#orders{position:fixed;z-index:4;transform:translate(-50%,-50%);display:none;align-items:flex-start;gap:10px;padding:10px 14px 4px;pointer-events:none}#orders.on{display:flex}
#orders::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#7b5a3a;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#orders.shake{animation:ordshake .5s ease-in-out infinite}@keyframes ordshake{25%{transform:translate(-50%,-50%) rotate(-1.4deg)}75%{transform:translate(-50%,-50%) rotate(1.4deg)}}
.ord{position:relative;width:76px;min-height:88px;padding:12px 4px 6px;background:#fffdf4;border:3px solid #c8a46a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;color:#4a2a0c;font-weight:900;box-shadow:0 4px 0 rgba(60,30,5,.25);transform-origin:50% 0;transition:transform .45s,opacity .45s;pointer-events:auto;cursor:pointer}.ord.in{animation:ordin .35s backwards}
.ord::before{content:"";position:absolute;top:-8px;left:50%;width:12px;height:14px;margin-left:-6px;border-radius:3px;background:#b57a3c;border:2px solid #6b4423}
.ord .num{font-size:2rem;line-height:1}.ord .cnt2{font-size:1.05rem;line-height:1;white-space:nowrap}
.ord.cur{border-color:#e08a2c;box-shadow:0 0 0 4px rgba(255,176,32,.45),0 4px 0 rgba(60,30,5,.25)}.ord.gold{border-color:#ffcf3a;background:#fff6cf;box-shadow:0 0 0 4px rgba(255,207,58,.75),0 0 16px rgba(255,207,58,.8)}
.ord.more{opacity:.72;filter:saturate(.7)}.ord.more .np{opacity:.6}
.ord.torn{transform:translateY(-60px) rotate(-18deg);opacity:0}.ord.blow{transform:translateY(-30px) rotate(25deg);opacity:.2}.ord.wig{animation:ordwig .5s}
@keyframes ordin{0%{transform:translateY(-40px) rotate(-10deg);opacity:0}70%{transform:rotate(4deg)}}@keyframes ordwig{25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
/* 쪽지 · 끝 장면의 작은 접시(물고기 = 점 · 둘은 나란히 · 다섯은 주사위 꼴) */
.np{position:relative;display:inline-block;width:46px;height:30px;border-radius:50%;background:#fff;border:2.5px solid #b08550;box-shadow:inset 0 -3px 0 rgba(176,133,80,.25)}
.np u{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#e0662c;border:1.5px solid #a8431a;box-sizing:border-box}
.np.big{width:58px;height:38px}.np.big u{width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
#home .row .np{width:1.6em;height:1.05em}#home .row .np u{width:.32em;height:.32em;margin:-.16em 0 0 -.16em}
/* 수 팻말(D06 통 위) · 뛰어 세는 수 · 찍힌 수 */
#tubsign{position:fixed;z-index:3;transform:translate(-50%,-100%);display:none;pointer-events:none}#tubsign.on{display:block}#tubsign b{position:relative;display:block;min-width:1.7em;padding:2px 10px;background:linear-gradient(#d9a566,#b47b3e);color:#3a2108;border:4px solid #6b4423;border-radius:12px;font-weight:900;font-size:2.4rem;line-height:1.1;text-align:center;box-shadow:0 5px 0 rgba(60,30,5,.35)}#tubsign b::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:14px;margin-left:-3px;background:#6b4423}@media (max-width:520px){#tubsign b{font-size:1.8rem;border-width:3px;padding:1px 8px}}
.lab{position:fixed;z-index:3;transform:translate(-50%,-100%);min-width:1.6em;padding:1px 7px;border-radius:999px;background:#fff4d6;color:#4a2a0c;border:3px solid #8a5a2b;font-weight:900;font-size:1.35rem;line-height:1.25;text-align:center;pointer-events:none;display:none}.lab.on{display:block;animation:labpop .3s}.lab.all{background:#ffd34d}.lab.lit{background:#ffd34d;box-shadow:0 0 14px rgba(255,207,58,.9)}@keyframes labpop{0%{transform:translate(-50%,-60%) scale(.3)}}
@media (max-width:520px){.lab{font-size:1.05rem;border-width:2px;padding:0 5px}.ord{width:62px;min-height:74px;padding:10px 3px 5px}.ord .num{font-size:1.6rem}.ord .cnt2{font-size:.9rem}.np{width:38px;height:25px}.np u{width:8px;height:8px;margin:-4px 0 0 -4px}#orders{gap:6px;padding:9px 8px 3px}}
/* 카드가 들썩(헛누름 — 답은 짚지 않음) */
#choose button.bob{animation:chbob .45s}@keyframes chbob{40%{transform:translateY(-12px)}}
@media (max-height:560px) and (min-aspect-ratio:1/1){html #tray{top:calc(6px + env(safe-area-inset-top,0px))!important;font-size:1.45rem!important}#marbles{left:auto!important;right:calc(132px + env(safe-area-inset-right,0px));transform:none!important}html #choose button{width:68px;height:68px;font-size:2.1rem}html #choose button.word{width:112px;min-height:84px;font-size:1.5rem;padding:6px;gap:5px}.ord{width:56px;min-height:64px;padding:9px 2px 4px}.ord .num{font-size:1.35rem}.np{width:34px;height:22px}.np u{width:7px;height:7px;margin:-3.5px 0 0 -3.5px}}
</style>

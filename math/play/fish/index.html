<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>낚시 섬 · 수학 놀이터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{background:#2a9fd0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:manipulation}
.sky{position:fixed;left:0;right:0;top:0;height:36%;background:linear-gradient(#6ec3f4,#c9edff);z-index:0}
.sea{position:fixed;left:0;right:0;top:36%;bottom:0;background:linear-gradient(#35b0dc 0%,#1b7fb4 55%,#0f4f86 100%);z-index:0;overflow:hidden}
.sea::before{content:"";position:absolute;left:-10%;right:-10%;top:-14px;height:28px;background:radial-gradient(circle at 20px 0,#c9edff 18px,transparent 19px) 0 0/40px 28px repeat-x;opacity:.9;animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(40px)}}
.deco span{position:fixed;font-size:3.4rem;z-index:0;pointer-events:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;z-index:5}
.pill{background:rgba(10,20,40,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1.05rem;text-decoration:none}
.coin{display:flex;align-items:center;gap:8px}.coin i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 60%,#c98a00);display:inline-block}.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.25)}}
/* 배 */
#boat{position:fixed;left:50%;top:36%;transform:translate(-50%,-78%);z-index:3;display:flex;align-items:flex-end;gap:10px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-74%) rotate(-1deg)}}
.hull{position:relative;background:#b9743a;border:5px solid #7a4a1e;border-radius:10px 10px 60px 60px/10px 10px 46px 46px;padding:10px 16px 14px;display:flex;align-items:flex-end;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.cat{font-size:clamp(3rem,8vw,4.6rem);line-height:1}.cat.yay{animation:hopp .45s 2}@keyframes hopp{50%{transform:translateY(-16px)}}
.say{position:absolute;left:8px;top:-44px;background:#fff;border:3px solid #2b2f3a;border-radius:16px;padding:3px 12px;font-weight:900;font-size:1.05rem;color:#2b2f3a;white-space:nowrap;opacity:0;transition:opacity .25s}
.bucket{background:#e9f6ff;border:5px solid #4a7ea8;border-radius:10px 10px 18px 18px;padding:6px;display:grid;grid-template-columns:repeat(5,clamp(22px,4.4vw,34px));gap:4px}
.bucket.tip{animation:tip .45s}@keyframes tip{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.bucket.go{transition:transform .7s,opacity .7s;transform:translate(60vw,-30px);opacity:0}
.bucket i{aspect-ratio:1;border-radius:7px;background:rgba(40,90,130,.16);border:2px dashed rgba(40,90,130,.35)}
.bucket i.on{background:#ffb347;border:2px solid #c9731a;animation:drop .25s}.bucket i.c1{background:#ff8f6b;border-color:#c9502a}.bucket i.c2{background:#7fd6a8;border-color:#2f9e68}.bucket i.c3{background:#b79bff;border-color:#6a4fd0}
@keyframes drop{from{transform:scale(.3)}}
.lv{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;color:#0d3a5c;font-weight:800;font-size:.9rem;text-align:center;white-space:nowrap}
/* 물고기 */
.fish{position:fixed;z-index:2;font-size:var(--s);line-height:1;padding:0;border:0;background:none;font-family:inherit;cursor:pointer;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.fish .e{display:block;transform:scaleX(var(--f))}
.fish b{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);min-width:1.25em;height:1.25em;line-height:1.25em;border-radius:50%;background:#fff;color:#12314a;font-size:calc(var(--s)*.42);font-weight:900;text-align:center;border:3px solid #12314a}
.fish small{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);display:flex;gap:3px}.fish small u{width:8px;height:8px;border-radius:50%;background:#ffe27a;border:1px solid #9a7a10}
.fish.up{transition:left .45s ease-in,top .45s cubic-bezier(.2,-.5,.6,1),opacity .45s;opacity:.2;pointer-events:none}
.fish.back{animation:shake .4s}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
#line{position:fixed;z-index:1;width:3px;background:#fff;transform-origin:top center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast{position:fixed;left:50%;top:44%;transform:translate(-50%,0);background:rgba(10,20,40,.82);color:#fff;font-weight:900;font-size:clamp(1.2rem,3.4vw,2rem);border-radius:20px;padding:14px 26px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:6;text-align:center}
.bub{position:fixed;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.5);z-index:1;animation:rise linear infinite}@keyframes rise{to{transform:translateY(-70vh);opacity:0}}
</style>
</head>
<body>
<div class="sky"></div><div class="sea" id="sea"></div>
<div class="deco"><span style="left:6%;top:6%;font-size:4.4rem">☀️</span><span style="left:26%;top:9%">☁️</span><span style="left:72%;top:5%">☁️</span><span style="right:3%;top:17%;font-size:4.6rem">🏝️</span></div>
<div class="hud"><a class="pill" href="/math/play/island/">← 광장 섬</a><div class="pill coin" id="coinBox"><i></i><span id="coins">0</span></div></div>
<div class="lv" id="lv"></div>
<div id="boat"><div class="hull"><span class="say" id="say"></span><span class="cat" id="cat">🐱</span><div class="bucket" id="bucket"></div></div></div>
<div id="line"></div><div class="toast" id="toast"></div>
<script type="module" src="./fish.js?v=1"></script>
</body>
</html>

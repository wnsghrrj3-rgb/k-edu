<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>창고 문 열어 주기 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem;pointer-events:none}#coins img.art{height:1em}
#coins.pop{animation:cpop .4s}@media (max-width:520px){#coins{top:auto;bottom:calc(32px + env(safe-area-inset-bottom,0px))}}@keyframes cpop{40%{transform:scale(1.3)}}
#tray{pointer-events:none}#tray i.w{font-size:.62em;opacity:.95}#tray b.done{font-size:.62em;min-width:1.6em;height:1.3em;animation:none}
/* 숫자 문패: 못에 걸려 있다(평면 안에서 돌지 않음 — 뒤집힘은 세로 축으로만) · 누름은 캔버스가 받는다 */
.door-sign{position:fixed;z-index:3;transform:translate(-50%,-100%);pointer-events:none;perspective:600px}
.door-sign .card{position:relative;transition:transform .45s;transform-style:preserve-3d}
.door-sign.flip .card{transform:rotateY(180deg)}
.door-sign canvas{display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.door-sign canvas.bk{position:absolute;left:0;top:0;transform:rotateY(180deg)}
.door-sign.bob .card{animation:sbob .45s}@keyframes sbob{40%{transform:translateY(-10px)}}
.door-sign.flip.bob .card{animation:sbobf .45s}@keyframes sbobf{0%,100%{transform:rotateY(180deg)}40%{transform:rotateY(180deg) translateY(-10px)}}
.door-sign.rattle .card{animation:srat .4s}@keyframes srat{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.door-sign.big canvas{filter:drop-shadow(0 0 10px rgba(255,210,80,.6))}
.door-sign.off{display:none}
/* 쿨쿨(문이 다 닫히면) */
.zz{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;color:#33456a;border:3px solid #33456a;border-radius:16px;padding:4px 12px;font-weight:900;font-size:1.3rem;pointer-events:none;animation:zz 1.6s ease-out forwards}@keyframes zz{0%{opacity:0;margin-top:10px}20%{opacity:1}100%{opacity:0;margin-top:-30px}}
/* 나들이 끝 줄: 오늘 연 문패가 1 부터 차례로 한 번씩 반짝 */
#home .row img.ns{height:2.4em;width:auto;vertical-align:middle}
#home .row b.ns{animation:nsflash .5s calc(var(--k) * .35s + .8s)}@keyframes nsflash{50%{transform:scale(1.25);filter:brightness(1.35) drop-shadow(0 0 8px #ffd34d)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/math/play/go/">← 수학 길</a>
<div id="loading">창고 문을 여는 중…</div>
<script type="module" src="./match.js?v=1"></script>
</body>
</html>

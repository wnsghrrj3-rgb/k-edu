<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>다리 길 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s}
#hint{position:fixed;z-index:7;font-size:3rem;line-height:1;margin:-8px 0 0 -18px;pointer-events:none;opacity:0;transition:opacity .3s,transform 1.5s ease-in-out;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;pointer-events:none}
#map{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:grid;grid-template-columns:repeat(2,18px);gap:3px;padding:6px;background:rgba(10,20,40,.45);border-radius:10px;pointer-events:none}
#map u{width:18px;height:18px;border-radius:4px;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.55)}#map u.on{background:#e9c98a;border:2px solid #fff4d6}
.piece{position:fixed;z-index:8;font-size:2.4rem;line-height:1;margin:-20px 0 0 -20px;pointer-events:none;transition:transform .8s cubic-bezier(.3,-.3,.6,1),opacity .8s}
#fade{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
.piece img.art,#hint img.art{height:1em;width:auto}
#cargo{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:grid;grid-template-columns:auto auto;gap:10px 16px;align-items:center;justify-items:center;background:rgba(255,244,214,.94);border:4px solid #8a5a2b;border-radius:20px;padding:10px 14px;box-shadow:0 6px 0 rgba(60,30,5,.3);max-width:calc(100vw - 24px)}
#cargo .need{display:flex;gap:8px}#cargo .need b{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff4d6;border:3px solid #8a5a2b;border-radius:12px;font-size:1.6rem;font-weight:900;color:#4a2a0c}
#cargo .coins{display:flex;align-items:center;gap:6px;font-size:1.5rem;font-weight:900;color:#4a2a0c}#cargo .coins img.art{height:1.2em}
#cargo.poor .coins{animation:cgblink .8s infinite}@keyframes cgblink{50%{transform:scale(1.18);color:#c0392b}}
#cargo .bund{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#cargo .bund button{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:5px 0;border:3px solid #8a5a2b;border-radius:14px;background:#ffd98a;font-family:inherit;font-weight:900;font-size:1.3rem;color:#4a2a0c;cursor:pointer}
#cargo .bund button img.art{height:26px}#cargo .bund button:disabled{opacity:.35}
#cargo .go{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#35b0dc;font-size:2.2rem;box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}#cargo .go:disabled{opacity:.4}#cargo .go img.art{height:1em}
#cargo.short .coins{animation:cgblink .8s infinite}
#cargo .mk{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:6px;background:#ffd35c;color:#3b2408;border:3px solid #fff;border-radius:999px;padding:4px 16px;font-weight:900;font-size:1.05rem;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}#cargo .mk img.art{height:1.1em}
@media (max-width:520px){#cargo{gap:6px 8px;padding:8px 10px}#cargo .need b{min-width:34px;height:34px;font-size:1.2rem}#cargo .coins{font-size:1.2rem}#cargo .bund{flex-wrap:nowrap;gap:5px}#cargo .bund button{width:44px;font-size:1.05rem;padding:3px 0}#cargo .bund button img.art{height:18px}#cargo .go{width:56px;height:56px;font-size:1.7rem}}
.sign.rs{min-width:34px;height:34px;padding:0 7px;font-size:1.25rem;border-width:3px;border-radius:10px;background:#fff;box-shadow:0 3px 0 rgba(60,30,5,.3)}.sign.rs::after{display:none}
</style>
</head>

</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>다리 길 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s}
#hint{position:fixed;z-index:7;font-size:3rem;line-height:1;margin:-8px 0 0 -18px;pointer-events:none;opacity:0;transition:opacity .3s,transform 1.5s ease-in-out;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;pointer-events:none}
.sign{position:fixed;z-index:3;transform:translate(-50%,-100%);min-width:54px;height:54px;padding:0 10px;display:flex;align-items:center;justify-content:center;background:#fff4d6;color:#4a2a0c;border:4px solid #8a5a2b;border-radius:14px;font-weight:900;font-size:2rem;line-height:1;pointer-events:none;box-shadow:0 5px 0 rgba(60,30,5,.35)}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:16px;margin-left:-3px;background:#8a5a2b;border-radius:0 0 3px 3px}
.sign.pop{animation:pop .35s}@keyframes pop{40%{transform:translate(-50%,-100%) scale(1.3)}}
#tray{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:10px;background:rgba(10,20,40,.5);border-radius:999px;padding:6px 18px;color:#fff;font-weight:900;font-size:1.7rem;line-height:1;pointer-events:none}
#tray.on{display:flex}#tray b{min-width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:#fff4d6;color:#4a2a0c;border-radius:10px;padding:0 6px;animation:pop2 .4s}#tray i{font-style:normal}
#tray b.hole{background:transparent;color:#fff;border:3px dashed #fff}#tray b.done{background:#ffd34d}@keyframes pop2{0%{transform:scale(.3)}70%{transform:scale(1.25)}}
#pick{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:6;display:none;gap:22px}#pick.on{display:flex}
#pick button{width:92px;height:92px;border-radius:24px;border:5px solid #8a5a2b;background:#fff4d6;color:#4a2a0c;font-weight:900;font-size:2.6rem;line-height:1;font-family:inherit;box-shadow:0 7px 0 rgba(60,30,5,.4);cursor:pointer;touch-action:manipulation;transition:transform .5s,opacity .5s}
#pick button:active{transform:translateY(4px)}#pick button.away{transform:translateY(40px) rotate(12deg);opacity:.15}
#fade{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/math/play/">← 놀이터</a>
<div id="tray"></div><div id="pick"></div>
<div id="fade"></div>
<div id="loading">다리를 놓는 중…</div>
<script type="module" src="./bridge.js?v=3"></script>
</body>
</html>

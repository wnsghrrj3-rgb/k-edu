<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 놀이터 · K-edu</title>
<script src="/kedu_scope.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(1100px 600px at 50% -10%,#3b2a6b 0%,#1a1c3d 45%,#0c1020 100%) fixed;color:#fff;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:48px 20px;text-align:center}
.k{font-size:.8rem;letter-spacing:.3em;color:#8fe3ff;font-weight:800}h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:900;margin:10px 0 8px}
p{color:#c3cee4;line-height:1.7}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:30px}
a.door{display:block;text-decoration:none;color:#fff;background:linear-gradient(160deg,#2b2f66,#1b1d42);border:3px solid rgba(255,211,92,.6);border-radius:24px;padding:28px 22px;text-align:left;transition:transform .15s}
a.door:hover{transform:translateY(-4px);border-color:#ffd35c}
a.door b{display:block;font-size:1.5rem;margin-bottom:6px;color:#ffd35c}a.door small{display:inline-block;margin-bottom:10px;font-size:.74rem;font-weight:800;color:#06121f;background:#8fe3ff;border-radius:999px;padding:2px 10px}
a.door span{font-size:.95rem;line-height:1.65;color:#d6def0}
a.back{position:fixed;left:14px;top:12px;color:#8fa3c2;text-decoration:none;font-size:.9rem}
</style>
</head>
<body>
<a class="back" href="/">← 케이에듀</a>
<main>
  <span class="k">K-EDU</span><h1>수학 놀이터</h1>
  <p>1·2학년 기초 수학을 놀면서. 아직 맛보기예요.</p>
  <div class="doors">
    <a class="door" href="./island/"><small>새로 · 느낌 맛보기</small><b>섬 탐험</b><span>내 캐릭터로 섬을 걷고 뛰어 건너요. 징검돌, 수 다리, 그리고 보물 상자. 방향키나 화면 막대로 움직여요.</span></a>
    <a class="door" href="./cards/"><small>혼자서 · 깊게</small><b>수 카드 모험</b><span>수 카드를 골라 몬스터 수에 딱 맞춰요. 방을 깰 때마다 능력을 골라 일곱 방 끝의 골렘까지. 판마다 다른 모험.</span></a>
    <a class="door" href="/kmotion/taste/"><small>교실에서 · 한 판</small><b>놀이 열 가지</b><span>칸 채우기, 수 과일 베기, 수직선 폴짝, 볼링, 갈림길 달리기… 점수와 콤보로 짧게 한 판씩. 터치로도 몸으로도.</span></a>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 놀이터 · K-edu</title>
<script src="/kedu_scope.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:linear-gradient(#6ec3f4 0%,#c9edff 46%,#35b0dc 46.2%,#1b7fb4 100%) fixed;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(10,20,40,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1.05rem;text-decoration:none}
.coin{display:flex;align-items:center;gap:8px}.coin i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 60%,#c98a00);display:inline-block}
.deco span{position:fixed;pointer-events:none;font-size:3.6rem;filter:drop-shadow(0 6px 4px rgba(0,0,0,.14));z-index:0}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;position:relative;z-index:1;width:100%}
h1{font-size:clamp(2.4rem,9vw,4.6rem);font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.22)}
.isle{font-size:clamp(6rem,24vw,11rem);line-height:1;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 14px 10px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
a.go{display:inline-block;text-decoration:none;background:#ffd35c;color:#3b2408;border:6px solid #fff;border-radius:999px;padding:16px 46px;font-size:clamp(1.5rem,5.4vw,2.3rem);font-weight:900;box-shadow:0 10px 0 rgba(0,0,0,.22);animation:pulse 1.6s ease-in-out infinite}
a.go:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.22);animation:none}
@keyframes pulse{50%{transform:scale(1.05)}}
.more{position:relative;z-index:1;font-size:.85rem;color:#d7ecfa;text-align:center;line-height:2}
.more a{color:#fff;font-weight:700;margin:0 7px;white-space:nowrap}
</style>
</head>
<body>
<div class="deco"><span data-art="deco.sun" style="left:7%;top:9%;font-size:4.6rem"></span><span data-art="deco.cloud" style="left:28%;top:15%"></span><span data-art="deco.cloud" style="right:12%;top:8%"></span><span data-art="deco.sailboat" style="right:9%;top:36%"></span></div>
<div class="top"><a class="pill" href="/">← 케이에듀</a><div class="pill coin"><i></i><span id="coins">0</span></div></div>
<main>
  <h1>수학 놀이터</h1>
  <div class="isle" data-art="deco.isle"></div>
  <a class="go" id="go" href="./island/">섬으로 가기 ▶</a>
</main>
<p class="more">맛보기 · <a href="./shop/">가게 섬</a><a href="./fish/">낚시 섬</a><a href="./cards/">수 카드 모험</a><a href="/kmotion/taste/">놀이 열 가지</a></p>
<script type="module">
import { wallet, paint } from './common/kit.js?v=2';
paint(); document.getElementById('coins').textContent = wallet.coins();
</script>
</body>
</html>

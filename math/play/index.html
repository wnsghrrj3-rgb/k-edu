<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 놀이터 · K-edu</title>
<script src="/kedu_scope.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:linear-gradient(#6ec3f4 0%,#c9edff 46%,#35b0dc 46.2%,#1b7fb4 100%) fixed;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(10,20,40,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1.05rem;text-decoration:none}
.coin{display:flex;align-items:center;gap:8px}.coin i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 60%,#c98a00);display:inline-block}
.deco span{position:fixed;pointer-events:none;font-size:3.6rem;filter:drop-shadow(0 6px 4px rgba(0,0,0,.14));z-index:0}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;position:relative;z-index:1;width:100%}
h1{font-size:clamp(2.4rem,9vw,4.6rem);font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.22)}
.isle{font-size:clamp(6rem,24vw,11rem);line-height:1;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 14px 10px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
a.go{display:inline-block;text-decoration:none;background:#ffd35c;color:#3b2408;border:6px solid #fff;border-radius:999px;padding:16px 46px;font-size:clamp(1.5rem,5.4vw,2.3rem);font-weight:900;box-shadow:0 10px 0 rgba(0,0,0,.22);animation:pulse 1.6s ease-in-out infinite}
a.go:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.22);animation:none}
@keyframes pulse{50%{transform:scale(1.05)}}
main{padding-top:10px}
.isle{font-size:clamp(3.4rem,13vw,5.6rem)}
.grp{position:relative;z-index:1;width:100%;max-width:980px;margin-top:20px}
.grp h2{display:inline-block;background:rgba(10,20,40,.55);border-radius:999px;padding:5px 16px;font-size:1.05rem;font-weight:900;margin-bottom:10px}
.grp h2 small{font-size:.8em;font-weight:700;opacity:.85;margin-left:6px}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
a.door{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;background:#fff8e6;color:#3b2408;border:4px solid #fff;border-radius:22px;padding:14px 8px 12px;box-shadow:0 7px 0 rgba(0,0,0,.2);text-align:center;touch-action:manipulation}
a.door:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
a.door .pic{font-size:2.7rem;line-height:1.15;height:3.2rem;display:flex;align-items:center;justify-content:center}
a.door .pic img.art{height:3rem;width:auto}
a.door b{font-size:1.15rem;font-weight:900;word-break:keep-all}
a.door span.say{font-size:.82rem;font-weight:700;color:#7a5a36;word-break:keep-all;line-height:1.35}
a.door.road{background:#ffd35c;border-color:#fff}
@media (max-width:520px){.doors{grid-template-columns:repeat(2,1fr);gap:10px}a.door .pic{font-size:2.2rem;height:2.7rem}a.door b{font-size:1.02rem}}
</style>
</head>
<body>
<div class="deco"><span data-art="deco.sun" style="left:7%;top:9%;font-size:4.6rem"></span><span data-art="deco.cloud" style="left:28%;top:15%"></span><span data-art="deco.cloud" style="right:12%;top:8%"></span><span data-art="deco.sailboat" style="right:9%;top:36%"></span></div>
<div class="top"><a class="pill" href="/">← 케이에듀</a><div class="pill coin"><i></i><span id="coins">0</span></div></div>
<main>
  <h1>수학 놀이터</h1>
  <div class="isle" data-art="deco.isle"></div>
  <a class="go" id="go" href="./plaza/">섬으로 가기 ▶</a>
</main>
<section class="grp"><h2>수학 길<small>1학년 1학기 · 차례대로</small></h2><div class="doors">
<a class="door road" href="./go/"><span class="pic" data-art="flag"></span><b>수학 길</b><span class="say">세기 · 담아 주기 · 가르기</span></a>
</div></section>
<section class="grp"><h2>바다 놀이<small>골라서</small></h2><div class="doors">
<a class="door" href="./plaza/"><span class="pic" data-art="deco.palm"></span><b>광장</b><span class="say">나무로 짓기 · 남은 수</span></a>
<a class="door" href="./bridge/"><span class="pic" data-art="plaza.wood"></span><b>다리 길</b><span class="say">수만큼 놓고 모두 더하기</span></a>
<a class="door" href="./fishing/"><span class="pic" data-art="fish.tropical"></span><b>낚시 섬</b><span class="say">통을 딱 맞게 채우기</span></a>
<a class="door" href="./market/"><span class="pic" data-art="market.barrel"></span><b>항구 장터</b><span class="say">담아 주기 · 거스름돈</span></a>
<a class="door" href="./treasure/"><span class="pic" data-art="board.course"></span><b>보물 길</b><span class="say">쪽지의 수만큼 걷기</span></a>
<a class="door" href="./barrels/"><span class="pic" data-art="shop.box"></span><b>통 부두</b><span class="say">열 개 묶음과 낱개</span></a>
<a class="door" href="./rowboats/"><span class="pic" data-art="deco.sailboat"></span><b>나룻배 나루</b><span class="say">같은 수씩 묶어 세기</span></a>
</div></section>
<section class="grp"><h2>그 밖의 놀이</h2><div class="doors">
<a class="door" href="./shop/"><span class="pic" data-art="board.shop"></span><b>가게 섬</b><span class="say">하루 장사 · 값 · 거스름</span></a>
<a class="door" href="./cards/"><span class="pic" data-art="shop.memo"></span><b>수 카드 모험</b><span class="say">카드로 하는 셈</span></a>
<a class="door" href="/kmotion/taste/"><span class="pic" data-art="hint.hand"></span><b>놀이 열 가지</b><span class="say">몸으로 하는 놀이</span></a>
</div></section>
<script type="module">
import { wallet, paint } from './common/kit.js?v=8';
paint(); document.getElementById('coins').textContent = wallet.coins();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수 카드 모험 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#ffd35c;--ink:#0c1020;--mint:#6dffb0;--rose:#ff6b81}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0c1020}html,body{height:100%;color:#fff;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;overflow:hidden;user-select:none}
#app{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column}
.bg{position:fixed;inset:0;background:radial-gradient(1200px 700px at 50% -10%,#4a3486 0%,#232552 42%,#0c1020 100%);z-index:-2}
.bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(60,48,110,0) 0%,rgba(46,38,92,.9) 22%,#1b1838 100%);border-top:3px solid rgba(160,140,255,.25)}
.bg i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.1}}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.map{display:flex;gap:6px;align-items:center;flex:1;min-width:220px}
.map b{min-width:34px;height:30px;padding:0 7px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);font-size:.62rem;display:flex;align-items:center;justify-content:center;color:#9fb1cc;font-weight:800}
.map b.done{background:var(--mint);color:#06301c;border-color:var(--mint)}.map b.now{background:var(--gold);color:#2b1c00;border-color:#fff;transform:scale(1.2)}
.map s{flex:1;height:3px;background:rgba(255,255,255,.18);max-width:26px}
.hearts{display:flex;gap:4px}.hearts i{width:24px;height:22px;background:var(--rose);clip-path:path('M12 21C-6 9 4-4 12 5 20-4 30 9 12 21Z');transition:.3s}.hearts i.off{background:rgba(255,255,255,.15)}
.cry{font-weight:900;color:#8fe3ff}.relics{display:flex;gap:6px;flex-wrap:wrap}
.relics span{background:rgba(255,211,92,.16);border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:800;cursor:help}
.relics span.pop{animation:pop .6s}
@keyframes pop{30%{transform:scale(1.5);background:var(--gold);color:#2b1c00}}
.stage{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px);padding:6px 14px 10px;min-height:0}
.me{width:clamp(90px,15vw,170px);flex:none;text-align:center;font-size:.8rem;font-weight:800;color:#cfd8ee}.me svg{width:100%;height:auto;filter:drop-shadow(0 12px 12px rgba(0,0,0,.5));animation:bob 2.8s ease-in-out infinite}.me.cast svg{animation:cast .35s}
@keyframes cast{40%{transform:translateX(26px) rotate(6deg)}}
.field{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2.4vw,30px);min-height:0;max-width:760px}
.mon{position:relative;width:clamp(120px,21vw,210px);text-align:center;cursor:pointer;transition:transform .15s}
.mon:active{transform:scale(.96)}.mon svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45));animation:bob 2.4s ease-in-out infinite}
.mon:nth-child(2) svg{animation-delay:-.8s}.mon:nth-child(3) svg{animation-delay:-1.6s}
@keyframes bob{50%{transform:translateY(-7px)}}
.mon::before{content:"";position:absolute;left:8%;right:8%;bottom:34px;height:18px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(4px)}
.mon .hp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(2rem,5.4vw,3.4rem);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.45);pointer-events:none}
.gauge{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:center;min-height:16px;margin:2px auto 0;max-width:150px}
.gauge i{width:11px;height:14px;border-radius:3px;background:rgba(255,255,255,.2);transition:background .15s}
.gauge i.ok{background:var(--mint);box-shadow:0 0 8px var(--mint)}.gauge i.part{background:var(--gold)}.gauge i.over{background:var(--rose)}
.gauge u{display:block;width:130px;height:12px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;text-decoration:none}.gauge u b{display:block;height:100%;background:var(--gold)}.gauge u b.ok{background:var(--mint)}.gauge u b.over{background:var(--rose)}
.gauge em{font-style:normal;font-weight:900;font-size:.8rem;color:var(--rose);margin-left:4px}
.gauge[data-s=ok]{animation:hot .5s infinite}.gauge[data-s=no]::after{content:attr(title);color:#9fb6ff;font-size:.72rem;font-weight:800}
.coach{text-align:center;font-size:clamp(.95rem,2.4vw,1.25rem);font-weight:800;color:#fff;background:rgba(255,211,92,.14);border:2px solid rgba(255,211,92,.5);border-radius:16px;margin:0 14px;padding:8px 14px;min-height:2.4em}
.coach:empty{visibility:hidden}
.hand.glow .card:not(.sel){animation:deal .3s backwards,nudge 1.1s ease-in-out infinite}.field.glow .mon:not(.dead) svg{filter:drop-shadow(0 0 14px #fff)}.btn.glow{animation:hot .7s infinite;background:var(--gold);color:#2b1c00}
@keyframes nudge{50%{transform:translateY(-8px)}}
#tutBar{position:fixed;left:50%;transform:translateX(-50%);top:52px;font-size:.8rem;font-weight:800;color:var(--gold);z-index:3}
.mon .nm{font-size:.8rem;color:#cfd8ee;font-weight:700;margin-top:2px}.mon .tip{font-size:.66rem;color:var(--gold);min-height:1em}
.mon .cd{position:absolute;right:2px;top:-4px;background:#232a52;border:2px solid #8fa3ff;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:900}
.mon .cd.hot{background:var(--rose);border-color:#fff;animation:hot .6s infinite}
@keyframes hot{50%{transform:scale(1.15)}}
.mon.hit svg{animation:shake .35s}.mon.dead{opacity:0;transform:scale(.3) rotate(20deg);transition:.45s;pointer-events:none}
.mon.aim{outline:3px dashed rgba(255,255,255,.5);outline-offset:6px;border-radius:20px}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fl{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-weight:900;font-size:clamp(1.3rem,3.4vw,2.2rem);white-space:nowrap;pointer-events:none;animation:fl 1.1s forwards;text-shadow:0 3px 0 rgba(0,0,0,.5)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px)}}
.expr{text-align:center;font-size:clamp(1.5rem,4.4vw,2.6rem);font-weight:900;min-height:1.5em;letter-spacing:.04em}
.expr small{font-size:.5em;color:#9fb1cc;font-weight:700}.expr .q{color:var(--gold)}
.bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 12px}
.acts{display:flex;gap:6px;align-items:center;font-size:.8rem;color:#b9c6dc;font-weight:700}.acts i{width:20px;height:20px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}.acts i.off{background:rgba(255,255,255,.15);box-shadow:none}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--gold);color:#2b1c00;border:0;border-radius:999px;padding:12px 26px;font-size:1.05rem;font-weight:900}
.btn.sub{background:rgba(255,255,255,.12);color:#fff}.btn:disabled{opacity:.4}
.hand{display:flex;justify-content:center;gap:clamp(6px,1.6vw,14px);padding:24px 10px 26px;flex-wrap:wrap}
.card{position:relative;width:clamp(64px,12.5vw,108px);aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;border:3px solid #fff;background:linear-gradient(160deg,#fff7df,#ffd98a);color:#3b2408;font-size:clamp(1.8rem,5vw,3rem);font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .14s,box-shadow .14s;animation:deal .3s backwards}
@keyframes deal{from{transform:translateY(60px);opacity:0}}
.card.sel{transform:translateY(-22px);box-shadow:0 22px 22px rgba(0,0,0,.4),0 0 0 4px var(--gold)}
.card .dots{display:grid;grid-template-columns:repeat(5,7px);gap:3px;justify-content:center;min-height:17px}.card .dots i{width:7px;height:7px;border-radius:50%;background:#b0742a}
.card.neg{background:linear-gradient(160deg,#dff1ff,#8ac6ff)}.card.dbl{background:linear-gradient(160deg,#f1e4ff,#c59bff)}
.card .mod{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);display:flex;gap:4px;white-space:nowrap;z-index:2}
.card .mod b{background:#1d2450;color:#fff;border:2px solid #fff;border-radius:999px;font-size:.72rem;padding:2px 8px}
.ov{position:fixed;inset:0;background:rgba(6,8,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;z-index:5;overflow:auto}
.ov.hidden{display:none}.k{font-size:.8rem;letter-spacing:.3em;color:#8fe3ff;font-weight:800}
h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:900}p{color:#c3cee4;line-height:1.7;max-width:620px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button{background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 15px;font-weight:800}
.row button.btn{background:var(--gold);color:#2b1c00;border:0;padding:14px 40px;font-size:1.2rem;font-weight:900}.row button.btn.sub{background:rgba(255,255,255,.14);color:#fff;font-size:1rem;padding:14px 22px}
.row button.on{background:#8fe3ff;color:#06121f;border-color:#8fe3ff}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pick button{width:min(250px,80vw);background:linear-gradient(160deg,#2b2f66,#1b1d42);border:3px solid var(--gold);border-radius:20px;color:#fff;padding:18px 14px;text-align:center}
.pick button b{display:block;font-size:1.25rem;color:var(--gold);margin-bottom:8px}.pick button span{font-size:.92rem;line-height:1.5;color:#d6def0}
.pick button em{display:block;font-style:normal;font-size:2.6rem;font-weight:900;margin-bottom:4px}
.dex{font-size:.85rem;color:#b9c6dc}.rules{font-size:.92rem;text-align:left;background:rgba(255,255,255,.06);border-radius:16px;padding:14px 18px;line-height:1.9}
.rules b{color:var(--gold)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0}.flash.on{animation:fla .5s}
@keyframes fla{20%{opacity:.5}100%{opacity:0}}
a.back{position:fixed;left:12px;top:10px;color:#8fa3c2;text-decoration:none;font-size:.85rem;z-index:6}
.big{font-size:3.6rem;font-weight:900;color:var(--gold)}
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="flash" id="flash"></div>
<div id="tutBar"></div>
<div id="app">
  <div class="top"><div class="map" id="map"></div><div class="relics" id="relics"></div><div class="cry" id="cry"></div><div class="hearts" id="hearts"></div></div>
  <div class="stage"><div class="me" id="me"></div><div class="field" id="field"></div></div>
  <div class="coach" id="coach"></div>
  <div class="expr" id="expr"></div>
  <div class="bar"><div class="acts" id="acts"></div><button class="btn sub" id="endTurn">내 차례 끝</button></div>
  <div class="hand" id="hand"></div>
</div>

<section class="ov" id="title">
  <a class="back" href="/math/play/">← 수학 놀이터</a>
  <span class="k">수학 놀이터 · 맛보기</span><h1>수 카드 모험</h1>
  <p><b style="color:#ffd35c">수 카드를 더해서 몬스터 수에 딱 맞추는 모험</b><br>처음이면 「시작」을 누르면 하는 법부터 손으로 해 봐요.</p>
  <div class="row" id="rTerm"></div>
  <div class="row" id="rSum"><button data-v="show">도움 눈금 켜기</button><button data-v="hide">혼자 셈하기</button></div>
  <div class="row" id="rHard"></div>
  <div class="row"><button class="btn" id="go">시작</button><button class="btn sub" id="howto">하는 법 보기</button></div>
  <div class="dex" id="dex"></div>
</section>
<section class="ov hidden" id="tutEnd"><span class="k">하는 법 끝</span><h1>이제 진짜 모험!</h1><p>일곱 방을 지나 골렘을 만나요. 방을 깰 때마다 능력을 하나 골라요.<br>몬스터 머리 위 숫자가 「곧 공격!」이 되기 전에 쓰러뜨려요.</p><button class="btn" id="tutGo">모험 떠나기</button></section>
<section class="ov hidden" id="reward"><span class="k" id="rwK">방을 깼어!</span><h1>하나를 골라요</h1><div class="pick" id="rwPick"></div></section>
<section class="ov hidden" id="rest"><span class="k">쉼터</span><h1>모닥불이 따뜻해</h1><p>하트를 2개 채우고 다음 방으로 가요.</p><button class="btn" id="restGo">쉬고 가기</button></section>
<section class="ov hidden" id="end"><span class="k" id="eK"></span><div class="big" id="eScore"></div><h1 id="eTitle"></h1><p id="eLine"></p><p id="eGrow" style="color:#6dffb0;font-weight:800"></p><div class="row"><button class="btn" id="again">한 번 더</button><button class="btn sub" id="toTitle">처음으로</button></div></section>
<script type="module" src="./ui.js?v=3"></script>
</body>
</html>

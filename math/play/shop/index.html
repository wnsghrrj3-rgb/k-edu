<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>가게 섬 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{background:#8fd3f4}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:manipulation}
#app{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column}
.sky{position:fixed;inset:0;background:linear-gradient(#6ec3f4 0%,#bfe9ff 34%,#35b0dc 34.2%,#2a9fd0 44%,#f2dfa8 44.2%,#ecd292 100%);z-index:-3}
.deco{position:fixed;inset:0;z-index:-1;pointer-events:none}.deco span{position:absolute;font-size:3.4rem;filter:drop-shadow(0 6px 4px rgba(0,0,0,.12))}.deco .cl{animation:drift 18s ease-in-out infinite alternate}.deco .boat{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
.hudgap{height:calc(50px + env(safe-area-inset-top,0px));flex:none}
@keyframes pop{40%{transform:scale(1.25)}}
/* 가게 */
.shop{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 12px 12px;min-height:0}
.roof{height:clamp(34px,7vh,58px);margin:0 4%;border-radius:18px 18px 0 0;background:repeating-linear-gradient(90deg,#ff6b6b 0 9%,#fff 9% 18%);box-shadow:0 8px 0 rgba(0,0,0,.12)}
.roof b{display:block;text-align:center;line-height:clamp(34px,7vh,58px);font-size:clamp(1rem,2.6vw,1.5rem);color:#7a2a12;font-weight:900;background:rgba(255,244,214,.92);width:max-content;margin:0 auto;padding:0 22px;border-radius:0 0 14px 14px}
.inside{background:#fff4d6;border:6px solid #b9853b;border-top:0;margin:0 4%;padding:10px 14px 0;display:flex;flex-direction:column;gap:8px}
.front{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:clamp(150px,30vh,250px)}
.guest{position:relative;width:clamp(120px,22vw,200px);text-align:center;transition:transform .5s,opacity .5s}
.guest.out{transform:translateX(-160%);opacity:0}.guest.in{transform:none;opacity:1}.guest.bye{transform:translateX(160%);opacity:0}
.guest .face{font-size:clamp(4rem,11vw,7rem);line-height:1;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.guest.happy .face{animation:hopp .5s 2}.guest.sad .face{animation:shake .4s}
@keyframes hopp{50%{transform:translateY(-22px)}}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.bubble{position:absolute;left:78%;bottom:74%;min-width:150px;max-width:44vw;background:#fff;border:4px solid #2b2f3a;border-radius:22px;padding:8px 12px;font-size:clamp(1.3rem,3.6vw,2.1rem);font-weight:900;color:#2b2f3a;line-height:1.25;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.15);z-index:2}
.bubble::after{content:"";position:absolute;left:14px;bottom:-16px;border:9px solid transparent;border-top-color:#2b2f3a}
.bubble .pics{white-space:normal;display:inline-block;max-width:260px;font-size:.82em;letter-spacing:.02em}
.bubble small{display:block;font-size:.55em;color:#c0392b}
.wait{height:8px;border-radius:999px;background:rgba(0,0,0,.12);margin-top:6px;overflow:hidden}.wait i{display:block;height:100%;width:100%;background:#35d07f;border-radius:999px}
.counter{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:12px}
.basket{position:relative;min-width:clamp(220px,40vw,400px);min-height:clamp(96px,18vh,150px);background:#d9a05b;border:5px solid #8a5a2b;border-radius:14px 14px 26px 26px;padding:8px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;align-content:start;font-size:clamp(1.5rem,4vw,2.4rem);text-align:center;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.basket span{cursor:pointer;animation:drop .22s}.basket .box{grid-column:span 5;background:#fff4d6;border:3px solid #8a5a2b;border-radius:10px;font-size:.62em;padding:2px 0;letter-spacing:.04em}
@keyframes drop{from{transform:translateY(-30px) scale(.6);opacity:0}}
.give{align-self:center;background:#ffd35c;color:#3b2408;border:5px solid #fff;border-radius:50%;width:clamp(84px,14vw,120px);height:clamp(84px,14vw,120px);font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.2);font-family:inherit}
.give:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}.give.glow{animation:pop .7s infinite}
.shelf{display:flex;gap:10px;justify-content:center;padding:10px 0 12px;border-top:6px solid #b9853b;background:#ffe9b8;margin:0 -14px;flex-wrap:wrap}
.crate{position:relative;width:clamp(86px,15vw,130px);background:#c98b4a;border:5px solid #8a5a2b;border-radius:14px;padding:6px 4px 4px;text-align:center;font-size:clamp(2.2rem,6vw,3.4rem);box-shadow:0 6px 0 rgba(0,0,0,.2);font-family:inherit;line-height:1.1}
.crate:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.crate small{display:block;font-size:.9rem;font-weight:900;color:#fff4d6}
.crate.new{animation:pop .5s 3}.crate.lock{filter:grayscale(1);opacity:.45;pointer-events:none}
.lv{font-size:.85rem;color:#7a2a12;font-weight:800;text-align:center}
.lvbar{height:10px;background:rgba(0,0,0,.12);border-radius:999px;overflow:hidden;margin:2px 22% 0}.lvbar i{display:block;height:100%;width:0;background:#ff8a3d;border-radius:999px;transition:width .5s}
</style>
</head>
<body>
<div class="sky"></div><div class="deco"><span data-art="deco.sun" style="left:8%;top:9%;font-size:4.6rem"></span><span class="cl" data-art="deco.cloud" style="left:30%;top:12%"></span><span class="cl" data-art="deco.cloud" style="left:66%;top:7%;animation-delay:-9s"></span><span data-art="deco.palm" style="right:5%;top:16%;font-size:5rem"></span><span data-art="deco.palm" style="left:3%;top:24%;font-size:4rem"></span><span class="boat" data-art="deco.sailboat" style="left:74%;top:24%"></span></div>
<div id="app">
  <div class="hudgap"></div>
  <div class="shop">
    <div class="roof"><b id="shopName">과일 가게</b></div>
    <div class="inside">
      <div class="lv" id="lvT"></div><div class="lvbar"><i id="lvBar"></i></div>
      <div class="front">
        <div class="guest out" id="guest"><div class="bubble" id="bubble"></div><span class="face" id="face"></span><div class="wait"><i id="wait"></i></div></div>
        <div class="counter"><div class="basket" id="basket"></div><button class="give" id="give">여기요!</button></div>
      </div>
      <div class="shelf" id="shelf"></div>
    </div>
  </div>
</div>
<script type="module" src="./shop.js?v=3"></script>
</body>
</html>

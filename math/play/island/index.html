<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>섬 탐험 · 수학 놀이터</title>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#7cc8f0;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none;z-index:2}
.pill{background:rgba(10,20,40,.55);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1.05rem;backdrop-filter:blur(6px);pointer-events:auto;text-decoration:none}
.coin{display:flex;align-items:center;gap:8px}.coin i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 60%,#c98a00);display:inline-block}
#msg{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(10,20,40,.7);color:#fff;border-radius:18px;padding:12px 22px;font-weight:800;font-size:clamp(1rem,2.6vw,1.35rem);text-align:center;transition:opacity .5s;pointer-events:none;z-index:2;max-width:86vw}
#big{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s}
#big b{font-size:clamp(2.2rem,7vw,4.4rem);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,210,80,.9);font-weight:900}
#big span{font-size:1.2rem;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#stick,#jump{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:2;display:none}
#stick{left:26px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.55)}
#stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.85)}
#jump{right:26px;width:104px;height:104px;border-radius:50%;background:rgba(255,211,92,.9);border:4px solid #fff;font-weight:900;font-size:1.3rem;color:#3b2408}
.touch #stick,.touch #jump{display:block}
#arrow{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2;pointer-events:none;text-align:center;color:#fff;font-weight:800;font-size:.9rem;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#arrow svg{display:block;margin:0 auto 2px;width:44px;height:44px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><a class="pill" href="/math/play/">← 놀이터</a><div class="pill coin"><i></i><span id="coins">0</span></div></div>
<div id="msg"></div>
<div id="big"><b id="bigT"></b><span id="bigS"></span></div>
<div id="arrow"><svg viewBox="0 0 44 44" id="arrowSvg"><path d="M22 4 38 34 22 27 6 34Z" fill="#ffd35c" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg><span id="arrowT"></span></div>
<div id="stick"><i></i></div><button id="jump">점프</button>
<script type="module" src="./island.js?v=3"></script>
</body>
</html>

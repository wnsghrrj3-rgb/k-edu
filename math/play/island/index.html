<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>광장 섬 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{background:#7cc8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#msg{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(10,20,40,.7);color:#fff;border-radius:18px;padding:12px 22px;font-weight:800;font-size:clamp(1rem,2.6vw,1.35rem);text-align:center;transition:opacity .5s;pointer-events:none;z-index:2;max-width:86vw}
#big{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none;z-index:5;opacity:0;transition:opacity .4s}
#big b{font-size:clamp(2.2rem,7vw,4.4rem);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,210,80,.9);font-weight:900}
#big span{font-size:1.2rem;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#big.over{justify-content:flex-end;padding-bottom:16vh}
#stick,#jump{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:2;display:none}
#stick{left:26px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.55)}
#stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.85)}
#jump{right:26px;width:104px;height:104px;border-radius:50%;background:rgba(255,211,92,.9);border:4px solid #fff;font-weight:900;font-size:1.3rem;color:#3b2408}
.touch #stick,.touch #jump{display:block}
#arrow{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2;pointer-events:none;text-align:center;color:#fff;font-weight:800;font-size:.9rem;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#arrow svg{display:block;margin:0 auto 2px;width:44px;height:44px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
/* 게시판 — 다가가면 뜨는 「오늘의 부탁」 */
#board{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));width:min(92vw,470px);transform:translate(-50%,-12px) scale(.94);opacity:0;transition:opacity .3s,transform .3s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:4;background:#fff4d6;border:6px solid #b9853b;border-radius:20px;padding:10px 14px 12px;box-shadow:0 10px 0 rgba(0,0,0,.2);color:#4a2c0a}
#board.on{opacity:1;transform:translate(-50%,0)}
#board h2{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:900;text-align:center;margin-bottom:6px}
#board .q{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #e2c88e;border-radius:14px;padding:7px 10px;margin-top:7px;min-height:58px}
#board .q .ic{font-size:clamp(1.6rem,5vw,2.1rem);line-height:1;flex:none}
#board .q .tx{flex:1;font-weight:900;font-size:clamp(1rem,3.1vw,1.22rem);line-height:1.3}
#board .q .pips{display:flex;gap:4px;margin-top:4px}#board .q .pips u{width:13px;height:13px;border-radius:50%;border:2px solid #c9a35c;background:#fff;text-decoration:none}#board .q .pips u.on{background:#ffb347;border-color:#c9731a}
#board .q .st{flex:none;width:54px;height:54px;border-radius:50%;border:3px dashed #e2c88e;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.95rem;color:transparent}
#board .q.done .st{border:4px double #e5484d;color:#e5484d;transform:rotate(-14deg)}
#board .q.thunk .st{animation:thunk .45s cubic-bezier(.2,1.6,.4,1)}@keyframes thunk{from{transform:rotate(-14deg) scale(2.6);opacity:0}}
#board .foot{margin-top:9px;text-align:center;font-weight:800;font-size:clamp(.9rem,2.7vw,1.05rem);color:#7a4a1e}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="board"></div>
<div id="msg"></div>
<div id="big"><b id="bigT"></b><span id="bigS"></span></div>
<div id="arrow"><svg viewBox="0 0 44 44" id="arrowSvg"><path d="M22 4 38 34 22 27 6 34Z" fill="#ffd35c" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg><span id="arrowT"></span></div>
<div id="stick"><i></i></div><button id="jump">점프</button>
<script type="module" src="./island.js?v=8"></script>
</body>
</html>

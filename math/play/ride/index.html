<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>들락날락 동물 집 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#bfe6f5}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#bfe6f5;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem;pointer-events:none}#coins img.art{height:1em}
#coins.pop{animation:cpop .4s}@media (max-width:520px){#coins{top:auto;bottom:calc(32px + env(safe-area-inset-bottom,0px))}}@keyframes cpop{40%{transform:scale(1.3)}}
/* 띠: 말(B06)은 마디마다 한 덩이 — 좁으면 마디 사이에서 줄이 접힌다 · 식(B07~)은 크게 한 줄. 아이가 채운 칸(fill)은 눌러서 돌려놓을 수 있다 */
#tray{pointer-events:none;flex-wrap:wrap;justify-content:center;row-gap:.16em;max-width:96vw}
#tray:not(.story){flex-wrap:nowrap;max-width:none}
#tray.story{font-size:clamp(1.18rem,4.5vw,2.3rem);border-radius:1.1em;padding:.3em .7em;column-gap:.5em;left:2vw!important;right:2vw;margin:0 auto;width:fit-content;transform:none!important}
#tray .cl{display:inline-flex;align-items:center;gap:.14em;white-space:nowrap}#tray .cl i{font-style:normal}
#tray.story b{min-width:1.5em;height:1.5em;font-size:1.18em}
#tray b.done.sym{background:#dff1ff;color:#12406a}#tray b.fill{pointer-events:auto;cursor:pointer;background:#ffe9a8;box-shadow:0 .09em 0 rgba(60,30,5,.45)}#tray b.sym{background:#dff1ff;color:#12406a}
#tray b.hole.blank{color:transparent}#tray b.back{animation:cellback .45s}@keyframes cellback{30%{transform:translateY(10px) rotate(8deg)}}
#tray i.op{font-style:normal;padding:0 .05em}
#readline{position:fixed;left:50%;transform:translateX(-50%);z-index:5;background:#fff;color:#12314a;border:4px solid #12314a;border-radius:20px;padding:6px 18px;font-weight:900;font-size:clamp(1.05rem,3.6vw,1.6rem);white-space:nowrap;pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.18);display:none}#readline.on{display:block;animation:rpop .35s}@keyframes rpop{0%{transform:translateX(-50%) scale(.6)}}
#choose button.bob{animation:chbob .45s}@keyframes chbob{40%{transform:translateY(-12px)}}
#choose button.blown{transition:transform 2.4s cubic-bezier(.2,.6,.4,1);transform:translate(var(--bx,160px),var(--by,60px)) rotate(720deg);z-index:2}
@media (max-height:560px) and (min-aspect-ratio:1/1){html #tray{top:calc(6px + env(safe-area-inset-top,0px))!important}html #tray:not(.story){font-size:2rem!important}html #tray.story{font-size:1.2rem}#marbles{left:auto!important;right:calc(132px + env(safe-area-inset-right,0px));transform:none!important}
  html #choose button{width:64px;height:64px;font-size:2.2rem;border-radius:18px;border-width:4px}html #choose.tiles button{width:56px;height:56px;font-size:2rem}html #tray.story{top:calc(46px + env(safe-area-inset-top,0px))!important}#readline{font-size:1rem;padding:3px 12px;border-width:3px}}   /* 낮은 가로: 띠를 맨 위에 작게 · 카드도 작게 · 구슬은 오른쪽 위 등불 옆으로(집과 마당 몫을 남긴다) */
/* 문패(B08 · B09 — 고른 수가 걸린다 · 화면 그림) */
#plate{position:fixed;z-index:3;transform:translate(-50%,0);pointer-events:none;transition:opacity .3s}#plate.off{display:none}#plate canvas{display:block;transition:transform .35s}
#plate.set canvas{animation:plpop .35s}@keyframes plpop{40%{transform:scale(1.25)}}#plate.away canvas{transform:translateY(46px) rotate(14deg);opacity:.2}
#plate.blown canvas{transition:transform 2.4s cubic-bezier(.2,.6,.4,1);transform:translate(var(--bx,150px),var(--by,70px)) rotate(720deg)}#plate.bob canvas{animation:chbob .45s}
/* 발자국(창 아래 — 누르면 장면을 한 번 더 본다 · 그림은 common/art.js 이름표 ride.paw · 둥근 판은 소리 단추와 같은 화면 단추 꼴) */
#paw{position:fixed;z-index:3;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,244,214,.94);border:4px solid #8a5a2b;box-shadow:0 4px 0 rgba(60,30,5,.35);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1}#paw.off{display:none}#paw img.art{height:1em;width:auto}
#paw.bob{animation:pawbob .45s}@keyframes pawbob{40%{transform:scale(1.25)}}#paw.small{width:44px;height:44px;margin:-22px 0 0 -22px;font-size:22px}
/* 하나씩 세어지는 수(동물 머리 위) · 무리 이름표(식의 수 아래) · 마당에 찍힌 수 · 방울 */
.cnt{position:fixed;z-index:3;transform:translate(-50%,-100%);min-width:1.5em;padding:1px 6px;border-radius:999px;background:#12314a;color:#fff;font-weight:900;font-size:1.25rem;line-height:1.3;text-align:center;pointer-events:none;display:none}.cnt.on{display:block;animation:cntpop .3s}@keyframes cntpop{0%{transform:translate(-50%,-60%) scale(.3)}}
.grp{position:fixed;z-index:3;transform:translate(-50%,0);background:#fff4d6;color:#4a2a0c;border:3px solid #8a5a2b;border-radius:12px;padding:1px 9px;font-weight:900;font-size:1.05rem;white-space:nowrap;pointer-events:none;display:none}.grp.on{display:block;animation:cntpop2 .3s}.grp.all{background:#ffd34d}@keyframes cntpop2{0%{transform:translate(-50%,10px) scale(.4)}}
#stamp{position:fixed;z-index:3;transform:translate(-50%,-50%);pointer-events:none;display:none;transition:left .55s cubic-bezier(.3,-.2,.5,1),top .55s cubic-bezier(.3,-.2,.5,1)}#stamp.on{display:block}#stamp.hit canvas{animation:sthit .4s}@keyframes sthit{0%{transform:scale(1.7)}60%{transform:scale(.9)}}
.jingle{position:fixed;z-index:3;transform:translate(-50%,-100%);font-size:1.25rem;line-height:1;pointer-events:none;display:none;filter:drop-shadow(0 0 6px #ffd34d)}.jingle.on{display:block;animation:jing .7s ease-in-out infinite}@keyframes jing{50%{transform:translate(-50%,-100%) rotate(18deg)}}
/* 해 질 녘(시계 — 숫자 · 눈금 없음): 기우는 해 · 저녁 빛 */
#sun{position:fixed;z-index:2;left:26px;font-size:2rem;line-height:1;transform:translate(-50%,-50%);pointer-events:none;display:none;filter:drop-shadow(0 0 10px rgba(255,170,60,.9))}#sun.on{display:block}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(to bottom,rgba(255,140,60,.55),rgba(90,50,120,.5))}
#home .row img.ns{height:2.2em;width:auto;vertical-align:middle}html #home .row{gap:6px 16px}   /* 오늘 연 수(합) 아홉 — 붙어 있으면 큰 수 하나로 읽혀서 사이를 띄운다 */
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/math/play/go/">← 수학 길</a>
<div id="loading">집을 짓는 중…</div>
<script type="module" src="./ride.js?v=3"></script>
</body>
</html>

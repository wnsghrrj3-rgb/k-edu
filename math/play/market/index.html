<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}

#app{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column}

/* 가게 */

.hammer i{display:flex;gap:3px}.hammer i u{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #b99a60}.hammer i u.on{background:#ff8a3d;border-color:#c9731a}
/* 줄 선 손님 */

.bubble.wide{max-width:none;z-index:4;font-size:clamp(1rem,2.8vw,1.5rem)}
.bubble small{display:block;font-size:.6em;color:#c0392b;white-space:normal}
.bubble em{display:block;font-style:normal;font-size:.7em;color:#9a5b10}
.wait{width:80%;height:8px;border-radius:999px;background:rgba(0,0,0,.12);margin-top:6px;overflow:hidden}.wait i{display:block;height:100%;width:100%;background:#35d07f;border-radius:999px}
/* 계산대 */
.counter{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,16px);padding:6px 0 8px}

.basket{position:relative;flex:0 1 auto;min-width:clamp(150px,40vw,400px);min-height:clamp(84px,15vh,130px);background:#d9a05b;border:5px solid #8a5a2b;border-radius:14px 14px 26px 26px;padding:6px 8px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;align-content:start;font-size:clamp(1.3rem,3.6vw,2.2rem);text-align:center;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12);transition:min-width .4s,min-height .4s}

.basket span{cursor:pointer;animation:drop .22s}.basket .box{grid-column:span 5;background:#fff4d6;border:3px solid #8a5a2b;border-radius:10px;font-size:.55em;padding:2px 0;letter-spacing:.04em;line-height:1.2}

.give{flex:none;background:#ffd35c;color:#3b2408;border:5px solid #fff;border-radius:50%;width:clamp(78px,13vw,116px);height:clamp(78px,13vw,116px);font-size:clamp(1.05rem,2.7vw,1.45rem);font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.2);font-family:inherit}
.give:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.2)}.give.glow{animation:pop .7s infinite}

.crate.new{animation:pop .5s 3}
/* 꾸미기 판 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}

.sheet.on .card{transform:none}
.sheet h2{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900;color:#5a3410;margin-bottom:12px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:4px solid #e2c88e;border-radius:18px;padding:10px 4px 10px;font-family:inherit;color:#4a2c0a;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.item:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.item .pic{font-size:clamp(2.6rem,9vw,3.8rem);line-height:1.1}

.item .price{display:flex;align-items:center;gap:4px;background:#ffd35c;border-radius:999px;padding:2px 12px;font-weight:900;font-size:clamp(1rem,3vw,1.2rem)}
.item.no{filter:grayscale(.75);opacity:.7}.item.no .price{background:#e6e0d2}
.item .more{font-size:.85rem;font-weight:800;color:#9a5b10;min-height:1.2em}

.sheet .close{display:block;margin:14px auto 0;background:#fff;border:4px solid #b9853b;border-radius:999px;padding:6px 26px;font-family:inherit;font-weight:900;font-size:1.05rem;color:#5a3410}
.sheet .empty{text-align:center;font-weight:900;font-size:1.2rem;color:#5a3410;padding:22px 0}
/* M03 — 하루 · 값 · 거스름 · 빵집 */
.roof.bakery{background:repeating-linear-gradient(90deg,#b0703a 0 9%,#fff4d6 9% 18%)}.roof.bakery.awning{background:repeating-linear-gradient(90deg,#b0703a 0 9%,#fff4d6 9% 18%)}.roof.bakery.awning::after{background:radial-gradient(circle at 50% 0,#b0703a 9px,transparent 10px) 0 0/22px 16px repeat-x}
.bar .mid{display:flex;align-items:center;gap:8px}
.pips{display:flex;gap:3px}.pips u{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #c9a35c}.pips u.on{background:#7a4a1e;border-color:#7a4a1e}
.till{display:flex;align-items:center;gap:4px;background:#fff;border:3px solid #e2c88e;border-radius:999px;padding:1px 10px 1px 6px;font-weight:900;color:#5a3410;font-size:clamp(.95rem,2.5vw,1.15rem)}.till span{font-size:1.25em;line-height:1}.till.up{animation:pop .4s}
@media (max-width:520px){.hammer .t{display:none}.hearts{padding:3px 6px;font-size:.88rem}}
.crate .tag{position:absolute;right:-8px;top:-10px;min-width:30px;height:30px;line-height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 60%,#c98a00);border:3px solid #fff;color:#4a2c0a;font-size:.95rem;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.crate .stock{position:absolute;left:4px;top:3px;font-size:.78rem;font-weight:900;color:#fff4d6;background:rgba(0,0,0,.28);border-radius:999px;padding:0 6px;line-height:1.4}
.crate.empty{filter:grayscale(1);opacity:.45}
.btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.btns .give.long{font-size:clamp(.85rem,2.2vw,1.1rem);line-height:1.15}
.btns .give.alt{background:#fff;font-size:clamp(.9rem,2.3vw,1.15rem)}
.tray{flex:0 1 auto;min-width:clamp(150px,40vw,400px);min-height:clamp(84px,15vh,130px);background:#fff;border:5px solid #b9853b;border-radius:18px;padding:6px 10px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.tray .row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;min-height:42px}
.tray .row.chg{border-top:3px dashed #e2c88e;padding-top:6px}
.tray .row.chg:empty::before{content:"";width:40px;height:40px;border-radius:50%;border:3px dashed #e2c88e}
.c1,.c10{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:900;color:#5a3410;font-family:inherit;line-height:1;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.18);background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 62%,#c98a00);border:3px solid #a8730a;cursor:pointer;padding:0}
.c1{width:34px;height:34px;font-size:1rem}.c10{width:48px;height:48px;font-size:1.15rem;background:radial-gradient(circle at 35% 30%,#ffe9c2,#e8a35a 62%,#a8622a);border-color:#7a4214;color:#fff}
.c1.in,.c10.in{animation:drop .22s}
.drawer{display:none;gap:14px;justify-content:center;align-items:flex-end;padding:8px 0 10px;border-top:6px solid #b9853b;background:#e9d3a8;margin:0 -12px;flex-wrap:wrap}
.paying-change .drawer{display:flex}.paying-change .shelf{display:none}
.drawer .pile{display:flex;flex-wrap:wrap;gap:4px;max-width:46%;justify-content:center;background:#fff4d6;border:4px solid #8a5a2b;border-radius:14px;padding:6px}
/* 아침·저녁 판 */
.sheet.day .card{background:linear-gradient(#fff7e0,#ffe9b8)}
.sheet.night .card{background:linear-gradient(#ffe0c2,#f7c6a3)}
.shopsel{display:flex;gap:10px;justify-content:center;margin-bottom:10px}.shopsel button{font-family:inherit;font-weight:900;font-size:1.05rem;border:4px solid #e2c88e;background:#fff;border-radius:999px;padding:5px 16px;color:#5a3410}.shopsel button.on{border-color:#ff8a3d;background:#ffd35c}
.memo{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:4px dashed #c9a35c;border-radius:16px;padding:8px 12px;font-weight:900;font-size:clamp(1.15rem,3.8vw,1.6rem);color:#4a2c0a;margin-bottom:10px;word-break:keep-all;text-align:center}
.load{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.boxes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-end;min-height:120px;background:rgba(255,255,255,.5);border-radius:14px;padding:8px}

.cart{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:120px;background:rgba(255,255,255,.5);border-radius:14px;padding:8px}
.cart .on{display:flex;flex-wrap:wrap-reverse;gap:4px;justify-content:center;max-width:100%}
.cart .cartpic{font-size:clamp(2.4rem,8vw,3.4rem);line-height:1}
.meter{position:relative;height:22px;border-radius:999px;background:#fff;border:3px solid #c9a35c;margin:14px 4px 4px;overflow:visible}

.meter b{position:absolute;top:-9px;bottom:-9px;width:4px;margin-left:-2px;background:#e5574d;border-radius:2px}
.meter.ok i{background:#35d07f}

.go-open:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.eve{display:grid;grid-template-columns:1.4fr .8fr 1fr;gap:8px;align-items:end}
.heap{position:relative;overflow:hidden;min-height:150px;background:rgba(255,255,255,.55);border-radius:16px;touch-action:none;cursor:pointer}
.heap .c1{position:absolute;pointer-events:none}.heap .tens{position:absolute;left:6px;top:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px;z-index:2}.heap .tens .c10{pointer-events:auto}
.stack{display:flex;flex-direction:column-reverse;align-items:center;min-height:150px;justify-content:flex-start;background:rgba(255,255,255,.35);border-radius:16px;padding:6px 0;cursor:pointer}
.stack .c1{margin-top:-20px;box-shadow:0 2px 0 rgba(0,0,0,.25)}.stack .c1:last-child{margin-top:0}
.safe{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:150px;background:rgba(255,255,255,.55);border-radius:16px;padding:6px}
.safe .pic{font-size:2.4rem;line-height:1}.safe .bund{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}.safe .bund u{display:block;width:18px;height:26px;border-radius:6px;background:repeating-linear-gradient(#ffc21a 0 4px,#c98a00 4px 6px);text-decoration:none}.safe .bund u.l{width:14px;height:6px;border-radius:50%;background:#ffc21a;align-self:flex-end}
.evsum{text-align:center;font-weight:900;color:#5a3410;font-size:clamp(1.3rem,4.4vw,2rem);margin-top:10px;min-height:1.4em}
.evsum small{display:block;font-size:.55em;color:#7a4a1e}

/* ── N05 3D 항구 장터: 같은 가게 화면 위에 3D 무대. 손님 얼굴·기다림 막대·지붕·바구니 그림은 3D 쪽이 맡는다. */
html{background:#9fd8f0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.sky,.deco,.roof,.pot{display:none!important}
#app{z-index:1;pointer-events:none}
.shop{padding-bottom:0}
.inside{pointer-events:auto;background:rgba(255,244,214,.9);border-bottom:0;border-radius:22px 22px 0 0}
.line{position:fixed;inset:0;display:block;pointer-events:none;z-index:2;min-height:0}
.guest{position:absolute;width:auto;transform:translate(-50%,-100%);transition:opacity .4s;pointer-events:none}
.guest.out,.guest.bye{transform:translate(-50%,-100%);opacity:0}

.guest.sel .bubble{box-shadow:0 0 0 4px #ffd35c,0 6px 0 rgba(0,0,0,.18)}
.guest.happy .bubble{animation:hopp .5s 2}.guest.sad .bubble{animation:shake .4s}
@keyframes hopp{50%{transform:translateY(-12px)}}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.counter{min-height:0;padding:4px 0 6px}
#basket{display:none!important}
.counter .btns{flex-direction:row}
.counter .give{width:clamp(70px,10vw,96px);height:clamp(70px,10vw,96px);font-size:clamp(.95rem,2.2vw,1.2rem)}
.shelf{padding:6px 0 8px}
.crate{width:clamp(60px,11vw,96px);font-size:clamp(1.6rem,4.4vw,2.5rem)}
.hint3{position:fixed;z-index:2;transform:translate(-50%,-100%);background:rgba(10,20,40,.6);color:#fff;font-weight:900;border-radius:999px;padding:1px 9px;font-size:.9rem;pointer-events:none;white-space:nowrap}
#streak{top:calc(58px + env(safe-area-inset-top,0px))!important}

<body data-mode="3d">
<canvas id="c"></canvas>
<div class="sky"></div><div class="deco"><span data-art="deco.sun" style="left:8%;top:8%;font-size:4.6rem"></span><span class="cl" data-art="deco.cloud" style="left:30%;top:11%"></span><span class="cl" data-art="deco.cloud" style="left:66%;top:6%;animation-delay:-9s"></span><span data-art="deco.palm" style="right:5%;top:14%;font-size:5rem"></span><span data-art="deco.palm" style="left:3%;top:21%;font-size:4rem"></span><span class="boat" data-art="deco.sailboat" style="left:74%;top:21%"></span></div>
<div id="app">
  <div class="hudgap"></div>
  <div class="shop" id="shop">
    <div class="roof" id="roof"><b id="shopName">과일 가게</b><span class="hang bell" id="bell" data-art="shop.bell" hidden></span><span class="hang lamp" id="lamp" data-art="shop.lamp" hidden></span></div>
    <div class="inside">
      <div class="bar"><div class="hearts" id="hearts"></div><div class="mid"><div class="pips" id="dayPips"></div><div class="till" id="till" hidden><span data-art="shop.till"></span><b id="tillN">0</b></div></div><button class="hammer" id="hammer"><span data-art="shop.hammer"></span><b class="t">가게 꾸미기</b><i id="restPips"></i></button></div>
      <div class="line" id="line"></div>
      <div class="counter"><span class="pot" data-art="shop.pot"></span><div class="basket" id="basket"></div><div class="tray" id="coinTray" hidden><div class="row" id="trayPaid"></div><div class="row chg" id="trayChg" hidden></div></div><div class="btns"><button class="give" id="give">여기요!</button><button class="give" id="take" hidden>받기</button><button class="give alt" id="more" hidden>더<br>줘야지?</button></div><span class="pot" data-art="shop.pot"></span></div>
      <div class="shelf" id="shelf"></div>
      <div class="drawer" id="drawer"></div>
    </div>
  </div>
</div>
<div class="sheet" id="sheet"><div class="card" id="sheetCard"></div></div>
<div id="loading">장터로 가는 중…</div>
<script type="module" src="../shop/shop.js?v=20"></script>
<script type="module" src="./scene3d.js?v=13"></script>
</body>
</html>

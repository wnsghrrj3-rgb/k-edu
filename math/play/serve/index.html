<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>손님에게 담아 주기 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem;pointer-events:none}#coins img.art{height:1em}
#coins.pop{animation:cpop .4s}@media (max-width:520px){#coins{top:auto;bottom:calc(32px + env(safe-area-inset-bottom,0px))}}@keyframes cpop{40%{transform:scale(1.3)}}
/* 띠: 손님의 말 「셋 주세요」 → 「셋을 줬어요」 — 눌러도 뒤로 */
#tray{pointer-events:none}#tray i.w{font-size:.62em;opacity:.95}
/* 바구니 · 접시 위의 수(0 이 찍힘 · 남은 수) */
#tally{position:fixed;z-index:3;transform:translate(-50%,-100%);display:flex;align-items:center;gap:10px;background:#fff4d6;color:#4a2a0c;border:4px solid #8a5a2b;border-radius:16px;padding:6px 12px;font-weight:900;font-size:2.3rem;line-height:1;pointer-events:none;box-shadow:0 5px 0 rgba(60,30,5,.35)}
#tally::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:12px;margin-left:-3px;background:#8a5a2b;border-radius:0 0 3px 3px}
#tally .dots u{width:15px;height:15px}#tally.pop{animation:tpop .35s}@keyframes tpop{40%{transform:translate(-50%,-100%) scale(1.25)}}
@media (max-width:520px){#tally{font-size:1.8rem;padding:4px 9px;gap:7px}#tally .dots u{width:11px;height:11px}}
/* 손님 말풍선: 점 무늬(다섯씩 한 줄) 또는 「…」 · 「더 줘」 — 누르면 다시 보고 다시 듣는다 */
.order{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;color:#12314a;border:4px solid #12314a;border-radius:18px;padding:8px 12px;font-weight:900;font-size:1.5rem;line-height:1.1;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 rgba(0,0,0,.18);min-width:58px;text-align:center}
.order::after{content:"";position:absolute;left:50%;top:100%;margin-left:-9px;border:9px solid transparent;border-top-color:#12314a}
.order .dots u{width:18px;height:18px}.order.pop{animation:opop .35s}@keyframes opop{40%{transform:translate(-50%,-100%) scale(1.2)}}.order.shake{animation:oshake .4s}@keyframes oshake{25%{margin-left:-5px}75%{margin-left:5px}}
@media (max-width:520px){.order .dots u{width:13px;height:13px}.order{padding:5px 8px;font-size:1.2rem}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/math/play/go/">← 수학 길</a>
<div id="loading">가게 문을 여는 중…</div>
<script type="module" src="./serve.js?v=10"></script>
</body>
</html>

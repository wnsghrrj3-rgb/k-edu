<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>수학 길 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:linear-gradient(to bottom,#5fb8ea 0%,#bfe6f5 42%,#7fcbe8 46%,#2b9fd2 100%) fixed;min-height:100%}html,body{font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
body{min-height:100vh}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
/* 고르는 화면: 단원마다 한 줄(꼬리표 + 깃발) — 가르기 틀 들머리에서 옮겨 옴(모양 그대로) */
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:58px 16px calc(44px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(10,30,50,.25),rgba(10,30,50,.6))}
#gate .tag{background:#fff4d6;color:#4a2a0c;border:4px solid #b9853b;border-radius:999px;padding:6px 18px;font-weight:900;font-size:clamp(.95rem,3.2vw,1.25rem)}
#gate .title{color:#fff;font-weight:900;font-size:clamp(1.6rem,6vw,2.6rem);text-shadow:0 3px 0 rgba(0,0,0,.35)}
#gate .unit{display:flex;flex-direction:column;align-items:center;gap:8px}#gate .unit.ghost{opacity:.48;filter:grayscale(.5)}#gate .unit.ghost .tag{font-style:italic}
#gate .pole{width:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px dashed rgba(255,255,255,.7);border-radius:20px;padding:10px 6px;color:#fff;opacity:.85}#gate .pole .stick{width:5px;height:2.6rem;border-radius:3px;background:rgba(255,255,255,.85)}#gate .pole .nm{font-weight:800;font-size:.85rem;word-break:keep-all;text-align:center}
@media (max-width:520px){#gate .pole{width:100px}#gate .pole .stick{height:2.1rem}}
#gate .flags{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:920px}
#gate .flag{width:128px;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.88);border:4px solid #9aa7b3;border-radius:20px;padding:10px 6px;font-family:inherit;color:#1d3a50;cursor:pointer;touch-action:manipulation;position:relative}
#gate .flag .pic{font-size:2.6rem;line-height:1;transform-origin:20% 90%}#gate .flag .nm{font-weight:900;font-size:1rem;line-height:1.25;word-break:keep-all;text-align:center}
#gate .flag.locked{opacity:.55;filter:grayscale(1);cursor:default}
#gate .flag.open{border-color:#ffb020;background:#fff8e6;animation:openglow 1.4s infinite}@keyframes openglow{50%{box-shadow:0 0 0 7px rgba(255,176,32,.45)}}
#gate .flag.won{border-color:#3e8a2b;background:#effbe6}#gate .flag.won .pic{animation:wave 1.6s ease-in-out infinite}@keyframes wave{50%{transform:rotate(-12deg) skewX(-6deg)}}
#gate .flag .star{position:absolute;right:6px;top:4px;font-size:1.3rem}
#gate .flag.nudge{animation:nudge 1s ease-in-out infinite}@keyframes nudge{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#gate .flag.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#gate .can{background:rgba(255,255,255,.9);border-radius:16px;padding:8px 16px;color:#1d3a50;font-weight:800;font-size:.95rem;max-width:min(92vw,560px)}
#gate .can b{display:block;font-size:.85rem;color:#3e8a2b}#gate .can p{line-height:1.5}
/* 「오늘의 번쩍」 단추(T09 — 깃발 줄들 위 · 꺼짐 · 켜짐 · 터짐) */
#gate .today{display:flex;align-items:center;gap:12px;min-width:min(92vw,360px);background:linear-gradient(135deg,#1b2a55,#33407a);color:#fff;border:4px solid #ffd34d;border-radius:22px;padding:10px 18px;font-family:inherit;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 0 rgba(0,0,0,.25);position:relative}
#gate .today .pic{font-size:calc(2.4rem + var(--best,0) * .12rem);line-height:1}#gate .today .tx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}#gate .today .nm{font-weight:900;font-size:1.3rem}#gate .today .sub{font-weight:800;font-size:.9rem;opacity:.92;word-break:keep-all}
#gate .today.on .pic{animation:fusefl .7s ease-in-out infinite}@keyframes fusefl{50%{filter:drop-shadow(0 0 10px #ffb347) brightness(1.25);transform:rotate(-6deg)}}#gate .today.on{animation:openglow 1.4s infinite}
#gate .today .rings{display:flex;gap:4px;margin-left:auto}#gate .today .rings i{font-style:normal;width:2.1rem;height:2.1rem;border-radius:50%;border:3px solid #ffd34d;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:rgba(255,211,77,.18)}
#gate .today .rings i b{font-weight:400}#gate .today .rings i.empty{background:transparent;border-style:dashed;border-color:rgba(255,211,77,.75)}#gate .today .rings i.empty b{opacity:.28;filter:grayscale(1)}
#gate .today.off{background:linear-gradient(135deg,#5b6170,#7a8090);border-color:#c9ced6;filter:grayscale(.6);opacity:.8;cursor:default}#gate .today.done{background:linear-gradient(135deg,#2a2150,#4a2f6a);border-color:#ff9fd0}
#gate .today.shake{animation:shake .35s}
@media (max-width:520px){#gate .flag{width:100px}#gate .flag .pic{font-size:2.1rem}#gate .flag .nm{font-size:.86rem}}
</style>
</head>
<body>
<a class="back" href="/math/play/">← 놀이터</a>
<div id="gate"></div>
<script type="module" src="./go.js?v=13"></script>
</body>
</html>

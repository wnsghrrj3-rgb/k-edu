<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>두 배에 나눠 싣기 · 수학 놀이터</title>
<script src="/kedu_scope.js"></script>
<script type="importmap">{ "imports": { "three": "/labs/vendor/three185/three.module.min.js", "three/addons/": "/labs/vendor/three185/addons/" } }</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html{background:#9fd8f0}html,body{height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
.back{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:31;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:1rem;text-decoration:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:#9fd8f0;color:#1d4a63;font-weight:900;font-size:1.3rem;transition:opacity .5s;pointer-events:none}
#note{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:32;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:3px 14px;font-size:.78rem;font-weight:700;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#coins{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(54px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;background:rgba(10,20,40,.5);color:#fff;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem;pointer-events:none}#coins img.art{height:1em}
#coins.pop{animation:cpop .4s}@media (max-width:520px){#coins{top:auto;bottom:calc(32px + env(safe-area-inset-bottom,0px))}}@keyframes cpop{40%{transform:scale(1.3)}}
#fade{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
/* 배 팻말: 빨간 배 ● · 파란 배 ▲(색을 못 가려도 무늬로) */
.sign.red{border-color:#d23a2f;box-shadow:0 5px 0 rgba(140,25,15,.35)}.sign.red::after{background:#d23a2f}
.sign.blue{border-color:#2c6fd6;box-shadow:0 5px 0 rgba(20,60,140,.35)}.sign.blue::after{background:#2c6fd6}
.sign small{font-size:.5em!important;opacity:1!important}.sign.red small{color:#d23a2f}.sign.blue small{color:#2c6fd6}
.sign.ask{animation:askblink 1s infinite}@keyframes askblink{50%{background:#ffe48a}}
.sign.done{background:#c8f2ae;border-color:#3e8a2b}
.sign.dim{opacity:.5}
/* 수 셋(띠 바로 아래 · 가운데 · 크게) */
#choose{position:fixed;z-index:7;display:none;gap:18px;transform:translateX(-50%)}#choose.on{display:flex}
#choose button{width:104px;height:104px;border-radius:26px;border:6px solid #8a5a2b;background:#fff4d6;color:#4a2a0c;font-weight:900;font-size:3.4rem;line-height:1;font-family:inherit;box-shadow:0 8px 0 rgba(60,30,5,.4),0 10px 24px rgba(0,0,0,.25);cursor:pointer;touch-action:manipulation;transition:transform .5s,opacity .5s;animation:chin .45s backwards}
#choose button:nth-child(2){animation-delay:.08s}#choose button:nth-child(3){animation-delay:.16s}@keyframes chin{0%{transform:translateY(-30px) scale(.4);opacity:0}70%{transform:scale(1.12)}}
#choose button:active{transform:translateY(4px)}#choose button.away{transform:translateY(40px) rotate(12deg);opacity:.15;pointer-events:none;animation:none}
@media (max-width:520px){#choose button{width:84px;height:84px;font-size:2.7rem;border-radius:22px;border-width:5px}#choose{gap:12px}}
#tray b.hole.ask{animation:holeask 1s infinite}@keyframes holeask{50%{background:rgba(255,211,77,.55);transform:scale(1.08)}}
/* 띠: 가르기 「5를 가르면 2와 ?」 · 모으기 「1과 1을 모으면 ?」 · 여러 가지로 「7을 가르면 2와5 · 3과4 · ?」 */
#tray i.w{font-size:.62em;opacity:.9}#tray b.red{box-shadow:inset 0 -.12em 0 #d23a2f}#tray b.blue{box-shadow:inset 0 -.12em 0 #2c6fd6}#tray b.way{font-size:.62em;min-width:auto;padding:0 .3em;flex-direction:row;gap:.2em}#tray b.way.hit{animation:waypop .5s 3}@keyframes waypop{50%{transform:scale(1.3);background:#ffd34d}}
/* 안개: 짐 더미 위 */
#fog{position:fixed;z-index:2;pointer-events:none;opacity:0;transition:opacity .8s;border-radius:40%;background:radial-gradient(ellipse at 30% 50%,rgba(255,255,255,.97),rgba(240,246,250,.92) 45%,rgba(230,240,246,0) 72%),radial-gradient(ellipse at 70% 45%,rgba(255,255,255,.95),rgba(235,243,248,.85) 40%,rgba(230,240,246,0) 70%);filter:blur(2px)}
#fog.on{opacity:1}
/* 들머리: 깃발 다섯 */
#gate{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:64px 16px calc(40px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(10,30,50,.25),rgba(10,30,50,.6))}
#gate .tag{background:#fff4d6;color:#4a2a0c;border:4px solid #b9853b;border-radius:999px;padding:6px 18px;font-weight:900;font-size:clamp(.95rem,3.2vw,1.25rem)}
#gate .title{color:#fff;font-weight:900;font-size:clamp(1.6rem,6vw,2.6rem);text-shadow:0 3px 0 rgba(0,0,0,.35)}
#gate .flags{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:760px}
#gate .flag{width:128px;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.88);border:4px solid #9aa7b3;border-radius:20px;padding:10px 6px;font-family:inherit;color:#1d3a50;cursor:pointer;touch-action:manipulation;position:relative}
#gate .flag .pic{font-size:2.6rem;line-height:1;transform-origin:20% 90%}#gate .flag .nm{font-weight:900;font-size:1rem;line-height:1.25;word-break:keep-all;text-align:center}
#gate .flag.locked{opacity:.55;filter:grayscale(1);cursor:default}
#gate .flag.open{border-color:#ffb020;background:#fff8e6;animation:openglow 1.4s infinite}@keyframes openglow{50%{box-shadow:0 0 0 7px rgba(255,176,32,.45)}}
#gate .flag.won{border-color:#3e8a2b;background:#effbe6}#gate .flag.won .pic{animation:wave 1.6s ease-in-out infinite}@keyframes wave{50%{transform:rotate(-12deg) skewX(-6deg)}}
#gate .flag .star{position:absolute;right:6px;top:4px;font-size:1.3rem}
#gate .flag.nudge{animation:nudge 1s ease-in-out infinite}@keyframes nudge{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#gate .can{background:rgba(255,255,255,.9);border-radius:16px;padding:8px 16px;color:#1d3a50;font-weight:800;font-size:.95rem;max-width:min(92vw,560px)}
#gate .can b{display:block;font-size:.85rem;color:#3e8a2b}#gate .can p{line-height:1.5}
@media (max-width:520px){#gate .flag{width:100px}#gate .flag .pic{font-size:2.1rem}#gate .flag .nm{font-size:.86rem}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/math/play/">← 놀이터</a>
<div id="fog"></div>
<div id="choose"></div>
<div id="fade"></div>
<div id="loading">선착장으로 가는 중…</div>
<script type="module" src="./split.js?v=2"></script>
</body>
</html>

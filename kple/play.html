<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>케이플 — 참가</title>
<link rel="stylesheet" href="kple.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../kedu_config.js"></script>
  <script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>
<body>
<script src="/kedu_back.js"></script>
<div id="root">
  <div class="kp-gate" id="gate">
    <div class="kp-logo">케이<span>플</span></div>
    <div class="kp-sub">방코드를 입력하고 들어가요</div>
    <div class="kp-field">
      <label>방코드</label>
      <input class="kp-input code" id="code" maxlength="4" autocomplete="off" inputmode="text" placeholder="ABCD">
    </div>
    <div class="kp-field">
      <label>내 이름(별명)</label>
      <input class="kp-input" id="name" maxlength="10" autocomplete="off" placeholder="예: 햇살이">
    </div>
    <button class="kp-btn kp-enter" id="enter">들어가기 ▶</button>
    <div class="kp-err" id="err"></div>
  </div>
</div>
<div class="kp-conn" id="conn">연결 준비…</div>

<script src="kple-core.js"></script>
<script src="games/quiz-show.js"></script>
<script src="games/speed-quiz.js"></script>
<script src="games/co-draw.js"></script>
<script src="games/catch-mind.js"></script>
<script src="/labs/livestage-core.js"></script>
<script src="games/live-stage.js"></script>
<script src="kple-party.js"></script>
<script>
(function () {
  var root = document.getElementById('root');
  var conn = document.getElementById('conn');
  var gateHTML = root.innerHTML;   // 방코드 입력 화면 보존
  var activeCtx = null;
  var activeParty = null;
  function setConn(t, cls) { conn.textContent = t; conn.className = 'kp-conn' + (cls ? ' ' + cls : ''); }

  function bindGate() {
    var codeEl = document.getElementById('code');
    var nameEl = document.getElementById('name');
    var errEl = document.getElementById('err');
    if (!codeEl) return;
    codeEl.addEventListener('input', function () { codeEl.value = codeEl.value.toUpperCase(); });

    /* 초대 링크(?code=ABCD)로 왔으면 방코드를 미리 채운다 — 학생은 이름만 넣으면 됨 (2026-08-27) */
    try {
      var qc = new URLSearchParams(location.search).get('code');
      if (qc) {
        qc = qc.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
        if (qc.length === 4) { codeEl.value = qc; if (nameEl) nameEl.focus(); }
      }
    } catch (e) {}

    document.getElementById('enter').onclick = function () {
      var code = codeEl.value.trim().toUpperCase();
      var name = nameEl.value.trim();
      errEl.textContent = '';
      if (code.length < 4) { errEl.textContent = '방코드 4자리를 입력해요'; return; }
      if (!name) { errEl.textContent = '이름을 입력해요'; return; }
      if (!window.supabase) { setConn('Supabase 로드 실패 (망 확인)', 'err'); return; }

      root.innerHTML = '<div class="kp-play" id="play"></div>';
      var playEl = document.getElementById('play');
      var ctx;
      // 게임은 미지정 — 호스트가 welcome 으로 알려주면 그 게임으로 동적 마운트
      try { ctx = Kple.join(code, name, { el: playEl }); }
      catch (e) { setConn(String(e.message || e), 'err'); root.innerHTML = gateHTML; bindGate(); return; }
      activeCtx = ctx;
      if (window.KpleParty) { try { activeParty = KpleParty.attachPlayer(ctx, { el: playEl }); } catch (e) {} }
      ctx.on('status', function (s) {
        if (s === 'SUBSCRIBED') setConn('연결됨 · 방 ' + code, 'ok');
        else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setConn('연결 오류: ' + s, 'err');
        else setConn(s);
      });
      try { history.pushState({ kple: 'play' }, ''); } catch (e) {}
      setHomeBtn();
    };
  }

  function backToGate() {
    if (activeParty) { try { activeParty.dispose(); } catch (e) {} activeParty = null; }
    if (activeCtx) { try { activeCtx.leave(); } catch (e) {} activeCtx = null; }
    root.innerHTML = gateHTML;
    bindGate();
    setConn('연결 준비…', '');
    setHomeBtn();
  }

  // 참가 화면에서 뒤로가기: 방을 나가고 방코드 입력 화면으로 복귀
  window.addEventListener('popstate', function () {
    if (activeCtx) backToGate();
  });
  window.addEventListener('beforeunload', function () { if (activeCtx) { try { activeCtx.leave(); } catch (e) {} } });

  /* 좌상단 버튼은 공용 것 하나만 쓴다 (2026-08-27 동선 점검 — 자체 버튼과 공용 버튼이
     같은 자리에 두 개 겹쳐 있었다). 방에 들어가 있는 동안만 문구·행동을 바꾼다. */
  var homeBtn = document.getElementById('kedu-back');
  function setHomeBtn() {
    if (!homeBtn) homeBtn = document.getElementById('kedu-back');
    if (!homeBtn) return;
    homeBtn.textContent = activeCtx ? '← 방 나가기'
      : (window.KEDU_BACK ? window.KEDU_BACK.label : '🏠 케이에듀로 가기');
  }
  document.addEventListener('click', function (e) {   // 방에 있는 동안은 방 나가기로 가로챈다
    if (!activeCtx) return;
    var t = e.target && e.target.closest && e.target.closest('#kedu-back');
    if (!t) return;
    e.preventDefault(); history.back();
  }, true);

  bindGate();
  setHomeBtn();
})();
</script>
</body>
</html>

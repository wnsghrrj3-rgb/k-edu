<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케이플 — 진행(전자칠판)</title>
<link rel="stylesheet" href="kple.css">
<style>
  /* K0 덱 고르기 오버레이 (host 전용 · kple.css 불변) */
  .kp-deck-ov{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;
    background:rgba(10,16,32,.72);backdrop-filter:blur(3px);padding:20px;font-family:inherit;}
  .kp-deck-box{position:relative;width:min(560px,94vw);max-height:88vh;overflow:auto;
    background:#141d33;color:#eef2ff;border-radius:20px;padding:26px 24px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .kp-deck-x{position:absolute;top:12px;right:14px;width:34px;height:34px;border:none;border-radius:10px;
    background:rgba(255,255,255,.1);color:#eef2ff;font-size:22px;line-height:1;cursor:pointer;}
  .kp-deck-x:hover{background:rgba(255,255,255,.2);}
  .kp-deck-h{font-size:22px;font-weight:800;margin:2px 0 16px;}
  .kp-deck-go{width:100%;border:none;border-radius:14px;padding:15px;cursor:pointer;font-family:inherit;
    background:var(--kp-yellow,#ffd23f);color:#1a2540;font-size:18px;font-weight:800;text-align:left;margin-bottom:6px;}
  .kp-deck-go span{display:block;font-size:13px;font-weight:600;opacity:.7;margin-top:3px;}
  .kp-deck-go:hover{filter:brightness(1.04);}
  .kp-deck-sec{font-size:14px;font-weight:800;opacity:.85;margin:18px 2px 10px;}
  .kp-dk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kp-dk-card{border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:13px 12px;cursor:pointer;
    background:rgba(255,255,255,.05);color:#eef2ff;text-align:left;font-family:inherit;transition:.12s;}
  .kp-dk-card:hover{background:rgba(255,255,255,.12);border-color:var(--kp-yellow,#ffd23f);transform:translateY(-1px);}
  .kp-dk-t{font-size:15px;font-weight:700;margin-bottom:3px;}
  .kp-dk-s{font-size:12px;opacity:.65;}
  .kp-deck-note{font-size:13px;line-height:1.55;opacity:.75;background:rgba(255,255,255,.05);
    border-radius:12px;padding:12px 14px;}
  .kp-lt{margin:2px 0 10px;}
  .kp-lt-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;}
  .kp-lt-sep{width:1px;height:20px;background:rgba(255,255,255,.16);margin:0 2px;}
  .kp-lt-pill{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;background:transparent;color:inherit;}
  .kp-lt-pill.on{background:var(--kp-yellow,#ffd23f);color:#1a1a1a;border-color:transparent;}
  .kp-lt-units{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .kp-lt-u{border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:12px 6px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;background:rgba(255,255,255,.05);color:inherit;}
  .kp-lt-u:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:var(--kp-yellow,#ffd23f);}
  .kp-lt-u:disabled{opacity:.6;cursor:default;}
  @media(max-width:420px){.kp-dk-grid{grid-template-columns:1fr;}.kp-lt-units{grid-template-columns:repeat(3,1fr);}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../kedu_config.js"></script>
  <script src="/kedu_gate.js"></script>
<script src="/kedu_boxbar.js"></script>
</head>
<body>
<button id="kedu-home" title="케이에듀 시작 화면으로" style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;border:none;background:#fff;color:#1a2540;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);font-family:inherit;">🏠 케이에듀로 가기</button>
<div class="kp-app" id="app">
  <div class="kp-stage">
    <div class="kp-big">케이<span style="color:var(--kp-yellow)">플</span></div>
    <div class="kp-dim">게임을 골라 방을 만드세요</div>
    <div class="kp-pick">
      <button class="kp-pick-card" data-game="quiz_show">
        <div class="kp-pick-emoji">🎯</div>
        <div class="kp-pick-title">객관식 퀴즈쇼</div>
        <div class="kp-pick-desc">함께 풀고 정답 공개</div>
      </button>
      <button class="kp-pick-card" data-game="speed_quiz">
        <div class="kp-pick-emoji">⚡</div>
        <div class="kp-pick-title">스피드 퀴즈</div>
        <div class="kp-pick-desc">빠를수록 점수↑</div>
      </button>
      <button class="kp-pick-card" data-game="co_draw">
        <div class="kp-pick-emoji">🎨</div>
        <div class="kp-pick-title">협동 캔버스</div>
        <div class="kp-pick-desc">반 전체가 함께 그리기</div>
      </button>
      <button class="kp-pick-card" data-game="catch_mind">
        <div class="kp-pick-emoji">✏️</div>
        <div class="kp-pick-title">캐치마인드</div>
        <div class="kp-pick-desc">그리고 맞히기</div>
      </button>
      <button class="kp-pick-card" data-game="live_stage">
        <div class="kp-pick-emoji">🎪</div>
        <div class="kp-pick-title">살아나는 무대</div>
        <div class="kp-pick-desc">그린 그림이 칠판에서 살아 움직여요</div>
      </button>
    </div>
  </div>
</div>
<div class="kp-conn" id="conn">연결 준비…</div>

<script src="kple-core.js"></script>
<script src="games/quiz-show.js"></script>
<script src="games/speed-quiz.js"></script>
<script src="games/co-draw.js"></script>
<script src="games/catch-mind.js"></script>
<script src="/labs/livestage-core.js"></script>
<script src="games/live-stage.js"></script>
<script src="kple-deck.js"></script>
<script src="kple-party.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var conn = document.getElementById('conn');
  var pickHTML = app.innerHTML;   // 게임 선택 화면 보존
  var activeCtx = null;
  var activeParty = null;
  function setConn(t, cls) { conn.textContent = t; conn.className = 'kp-conn' + (cls ? ' ' + cls : ''); }

  // 실제 방 열기 (config = 덱 주입 결과 또는 {})
  function startHosted(game, config) {
    var ctx;
    try { ctx = Kple.host(game, { el: app, config: config || {} }); }
    catch (e) { setConn(String(e.message || e), 'err'); return; }
    activeCtx = ctx;
    if (window.KpleParty) { try { activeParty = KpleParty.attach(ctx, { el: app }); } catch (e) {} }
    ctx.on('status', function (s) {
      if (s === 'SUBSCRIBED') setConn('연결됨 · 방 ' + ctx.roomCode, 'ok');
      else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setConn('연결 오류: ' + s + ' (망 차단 가능성)', 'err');
      else setConn(s);
    });
    try { history.pushState({ kple: 'game' }, ''); } catch (e) {}
    setHomeBtn();
  }

  var DRAW_GAMES = { co_draw: 1, catch_mind: 1, live_stage: 1 };   // 덱=주제·어휘 중심 (문항 없어도 열림)

  // ── 우리 반 배운 것: 차시 데이터(window.LESSONS) 온디맨드 로드 ──
  // 파일=단원 하나. 키는 u{단원}_l{차시} (학년·과목 접두 없음 → 한 번에 한 파일만).
  // 화이트리스트(아래 매니페스트)에 있는 파일만 로드 — URL 파라미터 임의 주입 차단.
  var UNIT_MAP = { 1: { 국어: [1,2,3,4,5,6,7], 수학: [1,2,3,4,5,6] },
                   2: { 국어: [1,2,3,4,5,6,7,8], 수학: [1,2,3,5,6] } };
  var SUBJ_SLUG = { 국어: 'korean', 수학: 'math' };
  var UNIT_MANIFEST = {};   // file -> {grade, subject, unit}
  Object.keys(UNIT_MAP).forEach(function (g) {
    Object.keys(UNIT_MAP[g]).forEach(function (subj) {
      UNIT_MAP[g][subj].forEach(function (u) {
        UNIT_MANIFEST['g' + g + '_' + SUBJ_SLUG[subj] + '_u' + u] = { grade: +g, subject: subj, unit: u };
      });
    });
  });
  var _deckCache = {};
  function loadLessonDeck(file) {
    if (!UNIT_MANIFEST[file]) return Promise.reject(new Error('알 수 없는 차시'));
    if (_deckCache[file]) return Promise.resolve(_deckCache[file]);
    return new Promise(function (res, rej) {
      function finish() {
        var keys = Object.keys(window.LESSONS || {}).filter(function (k) { return /^u\d+_l\d+$/.test(k); });
        if (!keys.length) { rej(new Error('빈 차시')); return; }
        var deck = KpleDeck.from({ lessons: keys });
        if (!deck || !deck.items || !deck.items.length) { rej(new Error('문항 없음')); return; }
        var m = UNIT_MANIFEST[file];
        deck.title = m.grade + '학년 ' + m.subject + ' ' + m.unit + '단원';
        _deckCache[file] = deck; res(deck);
      }
      window.LESSONS = {};   // 단원 격리(키 충돌 방지)
      if (typeof window.__kpleLoadUnit === 'function') {   // 테스트 심(가짜 로더)
        try { window.__kpleLoadUnit(file); finish(); } catch (e) { rej(e); } return;
      }
      var s = document.createElement('script');
      s.src = '../kedu/teacher/data/' + file + '.js';
      s.onload = finish;
      s.onerror = function () { rej(new Error('차시 로드 실패')); };
      document.head.appendChild(s);
    });
  }

  // 덱 고르기 오버레이: 바로 시작(샘플) / 그냥 놀기(놀이덱) / 우리 반 배운 것(차시 트리)
  function chooseDeck(game, cb) {
    if (!window.KpleDeck) { cb({}); return; }        // 어댑터 없으면 안전하게 바로 시작
    var cat = KpleDeck.playCatalog();
    var playCards = cat.map(function (d) {
      return '<button class="kp-dk-card" data-play="' + d.id + '">' +
        '<div class="kp-dk-t">' + d.title + '</div>' +
        '<div class="kp-dk-s">' + d.subject + ' · ' + d.count + '문항</div></button>';
    }).join('');
    var ov = document.createElement('div');
    ov.className = 'kp-deck-ov';
    ov.innerHTML =
      '<div class="kp-deck-box">' +
        '<button class="kp-deck-x" data-act="close" aria-label="닫기">×</button>' +
        '<div class="kp-deck-h">무엇으로 놀까요?</div>' +
        '<button class="kp-deck-go" data-act="sample">▶ 바로 시작 <span>샘플 문제로 가볍게</span></button>' +
        '<div class="kp-deck-sec">🎲 그냥 놀기</div>' +
        '<div class="kp-dk-grid">' + playCards + '</div>' +
        '<div class="kp-deck-sec">📚 우리 반 배운 것</div>' +
        '<div class="kp-lt" data-role="tree"></div>' +
        '<div class="kp-deck-note">케이티처에서 차시를 열고 「▶ 케이플로 열기」를 눌러도 그 차시 문제가 바로 들어와요.</div>' +
      '</div>';
    document.body.appendChild(ov);
    function done(config) { try { ov.remove(); } catch (e) {} cb(config); }
    function consume(deck) {
      var config = KpleDeck.toGame(deck, game);
      if (!config && !DRAW_GAMES[game]) { setConn('이 게임엔 이 덱을 쓸 수 없어요 (문항 부족)', 'err'); return false; }
      done(config || {}); return true;
    }
    ov.querySelector('[data-act="close"]').onclick = function () { try { ov.remove(); } catch (e) {} };
    ov.querySelector('[data-act="sample"]').onclick = function () { done({}); };
    [].forEach.call(ov.querySelectorAll('[data-play]'), function (b) {
      b.onclick = function () { consume(KpleDeck.from(b.getAttribute('data-play'))); };
    });
    renderLessonTree(ov.querySelector('[data-role="tree"]'), consume);
  }

  // 학년 → 과목 → 단원 트리. 단원 클릭 시 그 차시 덱을 로드해 consume(deck).
  function renderLessonTree(host, consume) {
    var grade = 1, subject = '수학';
    function pill(label, on, attr) {
      return '<button class="kp-lt-pill' + (on ? ' on' : '') + '" ' + attr + '>' + label + '</button>';
    }
    function draw() {
      var units = (UNIT_MAP[grade] && UNIT_MAP[grade][subject]) || [];
      host.innerHTML =
        '<div class="kp-lt-row">' + pill('1학년', grade === 1, 'data-g="1"') + pill('2학년', grade === 2, 'data-g="2"') +
          '<span class="kp-lt-sep"></span>' + pill('국어', subject === '국어', 'data-s="국어"') + pill('수학', subject === '수학', 'data-s="수학"') + '</div>' +
        '<div class="kp-lt-units">' + units.map(function (u) {
          return '<button class="kp-lt-u" data-u="' + u + '">' + u + '단원</button>';
        }).join('') + '</div>';
      [].forEach.call(host.querySelectorAll('[data-g]'), function (b) { b.onclick = function () { grade = +b.getAttribute('data-g'); draw(); }; });
      [].forEach.call(host.querySelectorAll('[data-s]'), function (b) { b.onclick = function () { subject = b.getAttribute('data-s'); draw(); }; });
      [].forEach.call(host.querySelectorAll('[data-u]'), function (b) {
        b.onclick = function () {
          var file = 'g' + grade + '_' + SUBJ_SLUG[subject] + '_u' + b.getAttribute('data-u');
          b.textContent = '불러오는 중…'; b.disabled = true;
          loadLessonDeck(file).then(consume).catch(function (e) {
            setConn(String((e && e.message) || e), 'err'); b.textContent = b.getAttribute('data-u') + '단원'; b.disabled = false;
          });
        };
      });
    }
    draw();
  }

  function bindCards() {
    [].forEach.call(document.querySelectorAll('.kp-pick-card'), function (card) {
      card.onclick = function () {
        if (!window.supabase) { setConn('Supabase 로드 실패 (망 확인)', 'err'); return; }
        var game = card.getAttribute('data-game');
        chooseDeck(game, function (config) { startHosted(game, config); });
      };
    });
  }

  function backToPick() {
    if (activeParty) { try { activeParty.dispose(); } catch (e) {} activeParty = null; }
    if (activeCtx) { try { activeCtx.close(); } catch (e) {} activeCtx = null; }
    app.innerHTML = pickHTML;
    bindCards();
    setConn('연결 준비…', '');
    setHomeBtn();
  }

  // 진행 중 게임에서 뒤로가기: 방을 닫고 게임 선택으로 복귀(학생 연결 끊김 → 확인)
  window.addEventListener('popstate', function () {
    if (!activeCtx) return;
    if (!confirm('진행 중인 게임 방을 닫고 게임 선택으로 돌아갈까요? (참가한 학생 연결이 끊겨요)')) {
      try { history.pushState({ kple: 'game' }, ''); } catch (e) {}
      return;
    }
    backToPick();
  });

  var homeBtn = document.getElementById('kedu-home');
  function setHomeBtn() { homeBtn.textContent = activeCtx ? '← 게임 선택' : '🏠 케이에듀로 가기'; }
  // 진행 중이면 게임 선택(앱 홈)으로 — 뒤로가기와 동일 경로(popstate가 확인·복귀 처리)
  // 선택 화면이면 케이에듀 시작점으로
  homeBtn.onclick = function () {
    if (activeCtx) { history.back(); }
    else { location.href = '/?role=teacher'; }
  };

  bindCards();
  setHomeBtn();

  // 도킹 수신부: ?deck=<파일>&game=<게임id> → 그 차시 덱 로드 후 바로 방 열기.
  // (케이티처 「▶ 케이플로 열기」가 이 URL을 만든다 — 생성부는 케이티처 쪽·게이트 후.)
  (function () {
    var q = {};
    (location.search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return; var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    if (!q.deck || !q.game || !window.KpleDeck) return;
    if (!/^(quiz_show|speed_quiz|co_draw|catch_mind|live_stage)$/.test(q.game)) return;
    if (!window.supabase) { setConn('Supabase 로드 실패 (망 확인)', 'err'); return; }
    setConn('차시 불러오는 중…', '');
    loadLessonDeck(q.deck).then(function (deck) {
      var config = KpleDeck.toGame(deck, q.game);
      if (!config && !DRAW_GAMES[q.game]) { setConn('이 차시로는 이 게임을 열 수 없어요 (문항 부족)', 'err'); return; }
      startHosted(q.game, config || {});
    }).catch(function (e) { setConn(String((e && e.message) || e), 'err'); });
  })();
})();
</script>
</body>
</html>

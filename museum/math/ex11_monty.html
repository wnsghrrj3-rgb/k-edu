  #stage-canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  #premise{ position:fixed; left:50%; bottom:11vh; transform:translateX(-50%) translateY(8px);
            opacity:0; transition:opacity 1.6s ease, transform 1.6s var(--ease-rise);
            font-family:'Gowun Batang',serif; font-size:clamp(14px,1.9vw,20px);
            letter-spacing:.12em; color:var(--ink-faint); text-align:center; white-space:nowrap;
            pointer-events:none; z-index:40; }
  #premise.is-in{ opacity:1; transform:translateX(-50%) translateY(0); }
  #premise.is-out{ opacity:0; }
  #overlay{ position:fixed; inset:0; z-index:50; pointer-events:none;
            display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
            padding-bottom:5vh; gap:20px; }
  #overlay > *{ pointer-events:auto; }
  #formula{ opacity:0; transform:translateY(8px); transition:opacity 1.2s ease, transform 1.2s var(--ease-rise);
            font-family:'Gowun Batang',serif; font-size:clamp(19px,2.7vw,30px); letter-spacing:.09em;
            color:var(--ink); text-align:center; }
  #formula.is-in{ opacity:1; transform:translateY(0); }
  #formula .num{ font-family:'Jua',sans-serif; color:var(--brass); }
  #formula .small{ display:block; margin-top:12px; font-size:clamp(13px,1.6vw,17px);
                   color:var(--ink-faint); letter-spacing:.05em; }
  #reexp{ opacity:0; transition:opacity 1s ease; display:flex; flex-direction:column; align-items:center; gap:9px; }
  #reexp.is-in{ opacity:1; }
  #reexp .whisper{ font-family:'Gowun Dodum',sans-serif; font-size:clamp(13px,1.6vw,16px);
                   color:var(--ink-dim); letter-spacing:.08em; }
  #reexp .whisper .num{ font-family:'Jua',sans-serif; color:var(--brass); }
  #reexp .track{ position:relative; width:min(380px,72vw); }
  #reexp input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:2px;
     background:var(--brass-dim); outline:none; }
  #reexp input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
     background:var(--brass); box-shadow:0 0 12px var(--brass-glow); cursor:pointer; }
  #reexp input[type=range]::-moz-range-thumb{ width:16px; height:16px; border:none; border-radius:50%;
     background:var(--brass); box-shadow:0 0 12px var(--brass-glow); cursor:pointer; }
</style>

<!-- E1 순수 로직 — 렌더 0줄. 이 블록은 동결(바이트 불변). -->
<script id="monty-pure">
(function(root,factory){
  if(typeof module==='object'&&module.exports) module.exports=factory();
  else root.KMuseumMonty=factory();
})(typeof self!=='undefined'?self:this,function(){
  'use strict';
  function hostOpens(n, prize, pick, r){     // 진행자가 여는 문 — ≠pick·≠prize, 복수면 r로 결정
    var cands=[];
    for(var d=0; d<n; d++) if(d!==pick && d!==prize) cands.push(d);
    var i=Math.min(cands.length-1, Math.floor((r||0)*cands.length));
    return cands[i];
  }
  function remaining3(pick, opened){         // n=3 전용 — 남은 문
    for(var d=0; d<3; d++) if(d!==pick && d!==opened) return d;
    return -1;
  }
  function switchTarget(n, prize, pick, r){  // n개 문: 진행자가 n−2개를 열고 남긴 문
    if(pick!==prize) return prize;           // 처음이 틀렸으면 남은 문 = 상
    var cands=[];
    for(var d=0; d<n; d++) if(d!==pick) cands.push(d);
    var i=Math.min(cands.length-1, Math.floor((r||0)*cands.length));
    return cands[i];                          // 처음이 맞았으면 r이 남길 빈 문을 고름
  }
  function playRound(n, prize, pick, doSwitch, r){
    var final_ = doSwitch ? switchTarget(n, prize, pick, r) : pick;
    var opened = (n===3) ? hostOpens(3, prize, pick, r) : -1;
    return { win: final_===prize, opened: opened, final: final_ };
  }
  function enumerate3(){                     // 상 3 × 선택 3 전수 — 지키기/바꾸기 승수
    var keep=0, sw=0, total=0;
    for(var prize=0; prize<3; prize++)
      for(var pick=0; pick<3; pick++){
        total++;
        if(playRound(3, prize, pick, false, 0.5).win) keep++;
        if(playRound(3, prize, pick, true,  0.5).win) sw++;
      }
    return { keep:keep, sw:sw, total:total };
  }
  function enumerateN(n){                    // 문 n개 전수 — {keep, sw, total=n²}
    var keep=0, sw=0, total=0;
    for(var prize=0; prize<n; prize++)
      for(var pick=0; pick<n; pick++){
        total++;
        if(pick===prize) keep++;
        if(playRound(n, prize, pick, true, 0.5).win) sw++;
      }
    return { keep:keep, sw:sw, total:total };
  }
  function pKeep(n){ return { num:1n, den:BigInt(n) }; }
  function pSwitch(n){ return { num:BigInt(n-1), den:BigInt(n) }; }
  function permille(frac){                   // 천분율 — 부동소수 0, BigInt 반올림
    var num=frac.num*1000n, q=num/frac.den, r=num%frac.den;
    if(r*2n>=frac.den) q+=1n;
    return Number(q);
  }
  function simulate(rnd, doSwitch, rounds){  // 시드 고정 시 재현
    var wins=0, log=[];
    for(var i=0;i<rounds;i++){
      var prize=Math.floor(rnd()*3), pick=Math.floor(rnd()*3), r=rnd();
      var res=playRound(3, prize, pick, doSwitch, r);
      if(res.win) wins++;
      log.push({ prize:prize, pick:pick, win:res.win });
    }
    return { wins:wins, rounds:rounds, log:log };
  }
  return { hostOpens:hostOpens, remaining3:remaining3, switchTarget:switchTarget,
           playRound:playRound, enumerate3:enumerate3, enumerateN:enumerateN,
           pKeep:pKeep, pSwitch:pSwitch, permille:permille, simulate:simulate };
});
</script>

<canvas id="stage-canvas"></canvas>
<div id="premise">문 하나 뒤에만 상이 있습니다 — 고르시면, 빈 문 하나를 열어 드리죠</div>

<div id="overlay">
  <div id="formula"></div>
  <div id="reexp">
    <div class="whisper" id="reexp-whisper"></div>
    <div class="track"><input type="range" id="reexp-range" min="3" max="100" step="1" value="3"></div>
  </div>
</div>

<script src="../core/museum.js"></script>
<script>
(function(){
  'use strict';
  var B = window.KMuseumMonty;
  var canvas = document.getElementById('stage-canvas');
  var stage = Museum.stage(canvas);
  Museum.exit();                  // §5.6 들어온 사람은 나갈 수 있어야 한다

  // ── §8.6 칠판 — 문제는 무대에 상주한다(칠판 문법) ───────────────
  var BQ = '문 하나 뒤에만 상이 있습니다 — 빈 문이 열린 뒤, 바꾸는 게 나을까요?';
  var BA = '처음의 문은 끝까지 — 셋 중 하나였다';
  var kboard = Museum.board({
    question: BQ, answer: BA,
    slots: [{id:'keep', label:'지킨 밤'}, {id:'switch', label:'바꾼 밤'}],
    tick: function(b){
      var k=0, sw=0, kn=0, sn=0;
      try{
        var L=S.log||[];
        for(var i=0;i<L.length;i++){
          var e=L[i];
          var switched = (e.mode==='ghostSwitch') || (e.mode==='manual' && e.final!==e.pick);
          if(switched){ sn++; if(e.win) sw++; } else { kn++; if(e.win) k++; }
        }
      }catch(e){}
      var m=Math.max(1, kn, sn);
      b.mark('keep',   Math.min(1, k/m));
      b.mark('switch', Math.min(1, sw/m));
      if(sw>k) b.lit('switch');
      if((S.phase==='after'||S.phase==='afterglow'||S.betrayed) && !b.isAfter()) b.resolve();
    }
  });
  var rnd = Museum.rng(Date.now() % 2147483647);

  var NIGHT0='#050508', NIGHT2='#0d0d16', NIGHT3='#151422';
  var BRASS='#c9a961', BRASS_DIM='rgba(201,169,97,.16)';
  var FLAME='#e8c27a', FLAME_CORE='#f2e3bd', EMBER='#d99a5b';
  var INKF='#5f584a';

  /* ── 공간 — 문 셋 + 좌우 선반(각 5×12=60) ─────────────────────────── */
  var DOORS=[ {x:560,y:430}, {x:800,y:430}, {x:1040,y:430} ];
  var DW=150, DH=230;
  var CAP=60;
  function shelfPos(side, idx){              // side 0=지킨 밤(좌) 1=바꾼 밤(우)
    var col=idx%5, row=Math.floor(idx/5);
    var x0 = side===0 ? 120 : 1330;
    return { x: x0+col*32, y: 130+row*40 };
  }

  /* ── 상태 ────────────────────────────────────────────────────────── */
  var S = {
    phase:'enter',              // enter → play → storm → betrayed → after
    introT:0,
    stagePhase:'pick',          // 판 내부: pick → opened → resolve → settle
    prize:-1, pick:-1, opened:-1, finalPick:-1, roundWin:false,
    roundT:0,
    shelves:[[],[]],            // [{win}] — 좌=지킴, 우=바꿈
    tokens:[],                  // 날아가는 토큰
    log:[],                     // {prize,pick,final,win,mode}
    manual:0,
    stormT:0, stormBeat:0.9,
    forcePrizes:[],
    frozen:false,
    ghostN:3,
    time:0,
    betrayPt:null
  };
  window.addEventListener('museum:freeze',   function(){ S.frozen=true; });
  window.addEventListener('museum:unfreeze', function(){ S.frozen=false; });

  function nextPrize(){
    return S.forcePrizes.length ? S.forcePrizes.shift() : Math.floor(rnd()*3);
  }
  function newRound(){
    S.stagePhase='pick'; S.prize=nextPrize();
    S.pick=-1; S.opened=-1; S.finalPick=-1; S.roundT=0;
  }

  /* ── 선반 적재 ───────────────────────────────────────────────────── */
  function settle(side, win, fromX, fromY){
    if(S.shelves[side].length>=CAP) return;
    var idx=S.shelves[side].length;
    S.shelves[side].push({ win:win, seed:rnd()*6.28 });
    var to=shelfPos(side, idx);
    S.tokens.push({ x:fromX, y:fromY, tx:to.x, ty:to.y, t:0, win:win });
    if(win) Museum.sound.play('click_light', side===0?-0.2:0.2);
    checkFull();
  }
  function checkFull(){
    if(S.phase==='betrayed'||S.phase==='after') return;
    if(S.shelves[0].length>=CAP && S.shelves[1].length>=CAP){
      S.phase='betrayed';
      var c=shelfPos(1, 29);
      S.betrayPt={ x:c.x+64, y:c.y+20 };
      var box=canvas.getBoundingClientRect(), sc=stage._scale||1;
      var px=(box.width-1600*sc)/2 + S.betrayPt.x*sc;
      var py=(box.height-900*sc)/2 + S.betrayPt.y*sc;
      Museum.betray({ x: box.width? px/box.width:0.72, y: box.height? py/box.height:0.4 })
            .then(showAfterglow);
    }
  }

  /* ── 입력 — 문을 고르는 손(§8.5 원칙1) ────────────────────────────── */
  function doorAt(lx,ly){
    for(var i=0;i<3;i++){
      var d=DOORS[i];
      if(Math.abs(lx-d.x)<DW/2+18 && Math.abs(ly-d.y)<DH/2+18) return i;
    }
    return -1;
  }
  function tapDoor(i){
    if(Museum.isLocked()) return;
    if(i<0||i>2) return;
    if(S.phase==='enter'){ beginPlay(); }
    if(S.phase==='storm'){ S.stormBeat=Math.max(0.12, S.stormBeat*0.86); return; }
    if(S.phase!=='play') return;
    if(S.stagePhase==='pick'){
      S.pick=i; S.stagePhase='opening'; S.roundT=0;
      Museum.sound.play('clack');
    } else if(S.stagePhase==='opened'){
      if(i===S.opened) return;               // 열린 문은 무시
      S.finalPick=i; S.stagePhase='resolve'; S.roundT=0;
      Museum.sound.play('clack');
    }
  }
  canvas.addEventListener('pointerdown', function(e){
    var p=stage.toLogical(e.clientX, e.clientY);
    tapDoor(doorAt(p.x, p.y));
    if(S.phase==='storm') S.stormBeat=Math.max(0.12, S.stormBeat*0.86);
  });

  /* ── 막 전환 ─────────────────────────────────────────────────────── */
  function beginPlay(){
    S.phase='play';
    var pm=document.getElementById('premise');
    pm.classList.remove('is-in'); pm.classList.add('is-out');
    newRound();
  }
  function beginStorm(){
    S.phase='storm'; S.stormT=0; S.stormBeat=0.9;
  }
  function showAfterglow(){
    S.phase='after';
    var a=0, b=0, i;
    for(i=0;i<S.shelves[0].length;i++) if(S.shelves[0][i].win) a++;
    for(i=0;i<S.shelves[1].length;i++) if(S.shelves[1][i].win) b++;
    var f=document.getElementById('formula');
    f.innerHTML='지킨 밤 <span class="num">'+a+'</span>촛불 — 바꾼 밤 <span class="num">'+b+'</span>촛불'+
                '<span class="small">처음 맞을 확률은 1/3 — 바꾸면 나머지 전부, 2/3. 열린 문은 그 몫을 옮겨 주었을 뿐이다</span>';
    f.classList.add('is-in');
    Museum.plaque({ title:'바꿔야 이기는 문',
                    story:'처음의 문은 끝까지, 셋 중 하나였다.', small:false });
    Museum.ticket.grant({ id:'m11_monty', title:'바꿔야 이기는 문', drawFn:ticketArt });
    document.getElementById('reexp').classList.add('is-in');
    updateWhisper(parseInt(document.getElementById('reexp-range').value,10));
  }
  function ticketArt(c,w,h){
    c.fillStyle=NIGHT0; c.fillRect(0,0,w,h);
    for(var i=0;i<3;i++){
      var dx=w/2+(i-1)*36;
      c.strokeStyle= i===2 ? BRASS : BRASS_DIM;
      c.lineWidth=2;
      c.strokeRect(dx-13, h*0.3, 26, 52);
    }
    var g=c.createRadialGradient(w/2+36,h*0.3+26,2,w/2+36,h*0.3+26,26);
    g.addColorStop(0,FLAME_CORE); g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g; c.fillRect(w/2+36-26,h*0.3,52,52);
    c.fillStyle='#ddd6c4'; c.font='12px sans-serif'; c.textAlign='center';
    c.fillText('2/3', w/2, h*0.78);
  }

  /* ── 재체험 슬라이더 — 문 n개면 바꾸면 (n−1)/n ────────────────────── */
  function updateWhisper(n){
    S.ghostN=n;
    var pm=B.permille(B.pSwitch(n));
    var whole=Math.floor(pm/10), dec=pm%10;
    document.getElementById('reexp-whisper').innerHTML=
      '문이 <span class="num">'+n+'</span>개라면 — 바꾸면 <span class="num">'+whole+'.'+dec+'%</span>';
  }
  document.getElementById('reexp-range').addEventListener('input', function(e){
    updateWhisper(parseInt(e.target.value,10));
    Museum.sound.play('click_light', (parseInt(e.target.value,10)-3)/97-0.5);
  });

  /* ── 유령 한 판(로직만 — 정직: 무보정) ────────────────────────────── */
  function ghostRound(){
    var prize=Math.floor(rnd()*3), pick=Math.floor(rnd()*3), r=rnd();
    var keepWin=(pick===prize);
    var swRes=B.playRound(3, prize, pick, true, r);
    S.log.push({ prize:prize, pick:pick, final:pick,        win:keepWin,   mode:'ghostKeep' });
    S.log.push({ prize:prize, pick:pick, final:swRes.final, win:swRes.win, mode:'ghostSwitch' });
    settle(0, keepWin,   DOORS[0].x, DOORS[0].y);
    settle(1, swRes.win, DOORS[2].x, DOORS[2].y);
  }

  /* ── 갱신 ────────────────────────────────────────────────────────── */
  function tick(dt){
    if(S.frozen) return;
    S.time+=dt;

    // 토큰 비행
    for(var i=S.tokens.length-1;i>=0;i--){
      var tk=S.tokens[i];
      tk.t+=dt/0.7;
      if(tk.t>=1) S.tokens.splice(i,1);
    }

    if(S.phase==='enter'){
      S.introT+=dt;
      if(S.introT>2.2 && !S._premised){
        S._premised=true;
        document.getElementById('premise').classList.add('is-in');
      }
      return;
    }
    if(S.phase==='play'){
      S.roundT+=dt;
      if(S.stagePhase==='opening' && S.roundT>0.55){
        S.opened=B.hostOpens(3, S.prize, S.pick, rnd());
        S.stagePhase='opened'; S.roundT=0;
        Museum.sound.play('creak', -0.2);
      } else if(S.stagePhase==='resolve' && S.roundT>0.8){
        var win=(S.finalPick===S.prize);
        S.roundWin=win;
        var switched=(S.finalPick!==S.pick);
        S.log.push({ prize:S.prize, pick:S.pick, final:S.finalPick, win:win, mode:'manual' });
        if(win) Museum.sound.play('chime'); else Museum.sound.play('creak', -0.4);
        settle(switched?1:0, win, DOORS[S.finalPick].x, DOORS[S.finalPick].y);
        S.stagePhase='settle'; S.roundT=0;
        S.manual++;
      } else if(S.stagePhase==='settle' && S.roundT>0.9){
        if(S.manual>=6) beginStorm();
        else newRound();
      }
      return;
    }
    if(S.phase==='storm'){
      S.stormT+=dt;
      if(S.stormT>=S.stormBeat){
        S.stormT=0;
        S.stormBeat=Math.max(0.12, S.stormBeat*0.965);
        ghostRound();
      }
    }
  }

  /* ── 그리기 ──────────────────────────────────────────────────────── */
  function ease(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  function drawShelves(c){
    for(var side=0; side<2; side++){
      var arr=S.shelves[side];
      // 빈 소켓은 그리지 않는다 — 앉은 판만큼만(진행도 암시 차단)
      for(var i=0;i<arr.length;i++){
        var p=shelfPos(side,i), e=arr[i];
        if(e.win){
          var flick=1+0.12*Math.sin(S.time*7+e.seed);
          c.drawImage(stage.glow(20,'rgba(232,194,122,.45)'), p.x-20, p.y-20);
          c.fillStyle=FLAME;
          c.beginPath(); c.ellipse(p.x, p.y-1, 2.2, 4.2*flick, 0, 0, 6.29); c.fill();
          c.fillStyle=FLAME_CORE;
          c.beginPath(); c.ellipse(p.x, p.y, 1.0, 1.8, 0, 0, 6.29); c.fill();
        } else {
          c.fillStyle=BRASS_DIM;
          c.fillRect(p.x-1.5, p.y-1.5, 3, 3);
        }
      }
    }
    if(S.phase==='betrayed'||S.phase==='after'){
      var c1=shelfPos(1,29);
      c.drawImage(stage.glow(150,'rgba(232,194,122,.28)'), c1.x+64-150, c1.y+20-150);
    }
  }

  function drawDoors(c){
    var sweep = S.phase==='enter' ? Math.min(1, S.introT/1.8) : 1;
    for(var i=0;i<3;i++){
      if(S.phase==='enter' && sweep < (i+0.6)/3) continue;
      var d=DOORS[i];
      var isPick=(i===S.pick), isOpened=(i===S.opened), isFinal=(i===S.finalPick);
      // 문짝
      c.fillStyle = isOpened ? NIGHT0 : NIGHT3;
      c.fillRect(d.x-DW/2, d.y-DH/2, DW, DH);
      c.strokeStyle = isPick&&S.stagePhase!=='pick' ? BRASS : BRASS_DIM;
      c.lineWidth=2;
      c.strokeRect(d.x-DW/2, d.y-DH/2, DW, DH);
      // 손잡이
      if(!isOpened){
        c.fillStyle=BRASS;
        c.beginPath(); c.arc(d.x+DW/2-22, d.y, 4.5, 0, 6.29); c.fill();
      }
      // 선택 글로우
      if(isPick && (S.stagePhase==='opening'||S.stagePhase==='opened')){
        c.drawImage(stage.glow(40,'rgba(201,169,97,.3)'), d.x-40, d.y-DH/2-16-40);
      }
      // 남은 문 숨쉼(바꿈의 초대)
      if(S.stagePhase==='opened' && !isPick && !isOpened){
        var br=0.5+0.5*Math.sin(S.time*2.3);
        c.drawImage(stage.glow(46,'rgba(201,169,97,'+(0.12+0.2*br)+')'), d.x-46, d.y-46);
      }
      // 개봉 결과
      if(S.stagePhase==='settle' && isFinal){
        if(S.roundWin){
          var ft=Math.min(1, S.roundT/0.5);
          c.drawImage(stage.glow(Math.round(50+40*ft),'rgba(242,227,189,.5)'), d.x-(50+40*ft), d.y-(50+40*ft));
          c.fillStyle=FLAME_CORE;
          c.beginPath(); c.ellipse(d.x, d.y-10*ft, 4+2*ft, 14+18*ft, 0, 0, 6.29); c.fill();
        } else {
          c.fillStyle=NIGHT0;
          c.fillRect(d.x-DW/2+6, d.y-DH/2+6, DW-12, DH-12);
        }
      }
      // 스포트(주광원 1 — 중앙 상단)
    }
    var g=c.createRadialGradient(800, 210, 10, 800, 210, 420);
    g.addColorStop(0,'rgba(201,169,97,.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g; c.fillRect(800-420, 210-260, 840, 620);
    // 유령의 밤 — 두 실루엣
    if(S.phase==='storm'){
      var sway=Math.sin(S.time*3)*6;
      c.fillStyle='rgba(217,154,91,.25)';
      c.beginPath(); c.arc(430+sway, 640, 16, 0, 6.29); c.fill();
      c.beginPath(); c.arc(1170-sway, 640, 16, 0, 6.29); c.fill();
      c.drawImage(stage.glow(30,'rgba(217,154,91,.2)'), 430+sway-30, 640-30);
      c.drawImage(stage.glow(30,'rgba(217,154,91,.2)'), 1170-sway-30, 640-30);
    }
  }

  function drawTokens(c){
    for(var i=0;i<S.tokens.length;i++){
      var tk=S.tokens[i], t=ease(Math.min(1,tk.t));
      var px=tk.x+(tk.tx-tk.x)*t;
      var py=tk.y+(tk.ty-tk.y)*t - Math.sin(t*3.14)*60;
      c.drawImage(stage.glow(14, tk.win?'rgba(232,194,122,.5)':'rgba(138,115,63,.35)'), px-14, py-14);
      c.fillStyle= tk.win ? EMBER : BRASS_DIM;
      c.beginPath(); c.arc(px, py, 3, 0, 6.29); c.fill();
    }
  }

  stage.add({
    update:tick,
    draw:function(c){
      c.fillStyle=NIGHT2;
      c.fillRect(-1600,-900,4800,2700);
      drawShelves(c); drawDoors(c); drawTokens(c);
      var vg=c.createRadialGradient(800,430,220,800,430,950);
      vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(5,5,8,.85)');
      c.fillStyle=vg; c.fillRect(-1600,-900,4800,2700);
    }
  });

  /* ── 부팅 ────────────────────────────────────────────────────────── */
  Museum.sound.roomtone();
  Museum.curtainIn();
  stage.start();

  /* ── 테스트 훅 ───────────────────────────────────────────────────── */
  window.__M11 = {
    S:S, B:B, tapDoor:tapDoor, tick:tick,
    skipIntro:beginPlay, ghostRound:ghostRound,
    forcePrizes:function(arr){ S.forcePrizes=arr.slice(); }
  };

  stage.add(kboard.scene);          // 칠판은 무대 위에 상주한다
  window.__BOARD = kboard;
})();
</script>

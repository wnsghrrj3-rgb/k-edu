  function decode(s){
    return s.split('|').map(function(r){
      return r.split(',').map(function(p){
        var a=p.split(' ');
        return [parseFloat(a[0]), parseFloat(a[1])];
      });
    });
  }

  function mercY(lat){
    var la=Math.max(-84.5, Math.min(84.5, lat));
    return Math.log(Math.tan(Math.PI/4 + la*D/2));
  }
  function invMercY(y){ return (2*Math.atan(Math.exp(y)) - Math.PI/2)/D; }
  function mercX(lon){ return lon*D; }
  function scaleAt(lat){ return 1/Math.cos(lat*D); }
  function areaScaleAt(lat){ var c=Math.cos(lat*D); return 1/(c*c); }

  // 로드리게스 회전 — 축 = 적도 위 경도(lon0+90°). 위도를 dDeg만큼 내린다(강체 회전 = 면적 정확 보존).
  function rotateLat(pt, lon0, dDeg){
    var lam=pt[0]*D, phi=pt[1]*D, th=dDeg*D;
    var v=[Math.cos(phi)*Math.cos(lam), Math.cos(phi)*Math.sin(lam), Math.sin(phi)];
    var l0=lon0*D;
    var a=[-Math.sin(l0), Math.cos(l0), 0];
    var ct=Math.cos(th), st=Math.sin(th);
    var av=[ a[1]*v[2]-a[2]*v[1], a[2]*v[0]-a[0]*v[2], a[0]*v[1]-a[1]*v[0] ];
    var ad=a[0]*v[0]+a[1]*v[1]+a[2]*v[2];
    var w=[ v[0]*ct + av[0]*st + a[0]*ad*(1-ct),
            v[1]*ct + av[1]*st + a[1]*ad*(1-ct),
            v[2]*ct + av[2]*st + a[2]*ad*(1-ct) ];
    var n=Math.sqrt(w[0]*w[0]+w[1]*w[1]+w[2]*w[2]);
    w=[w[0]/n, w[1]/n, w[2]/n];
    return [ Math.atan2(w[1], w[0])/D, Math.asin(Math.max(-1,Math.min(1,w[2])))/D ];
  }
  function landAt(id, lat){
    var L=DATA[id], d=L.lat0-lat;
    if(Math.abs(d)<1e-12) return rings(id).map(function(r){ return r.map(function(p){ return [p[0],p[1]]; }); });
    return rings(id).map(function(r){
      return r.map(function(p){ return rotateLat(p, L.lon0, d); });
    });

  function unwrap(ring){
    var o=[[ring[0][0], ring[0][1]]];
    for(var i=1;i<ring.length;i++){
      var lo=ring[i][0], prev=o[i-1][0];
      while(lo-prev>180) lo-=360;
      while(lo-prev<-180) lo+=360;
      o.push([lo, ring[i][1]]);
    }
    return o;

  function vec(p){
    var la=p[0]*D, ph=p[1]*D, c=Math.cos(ph);
    return [c*Math.cos(la), c*Math.sin(la), Math.sin(ph)];

  function sphericalArea(rs){
    var a=0;
    for(var k=0;k<rs.length;k++){
      var r=rs[k];
      if(r[0][0]===r[r.length-1][0] && r[0][1]===r[r.length-1][1]) r=r.slice(0,-1);
      if(r.length<3) continue;
      var v=r.map(vec), e=0, o=v[0];
      for(var i=1;i<v.length-1;i++){
        var b=v[i], c=v[i+1];
        var cr=[ b[1]*c[2]-b[2]*c[1], b[2]*c[0]-b[0]*c[2], b[0]*c[1]-b[1]*c[0] ];
        var num=o[0]*cr[0]+o[1]*cr[1]+o[2]*cr[2];
        var den=1 + (o[0]*b[0]+o[1]*b[1]+o[2]*b[2])
                  + (b[0]*c[0]+b[1]*c[1]+b[2]*c[2])
                  + (c[0]*o[0]+c[1]*o[1]+c[2]*o[2]);
        e += 2*Math.atan2(num, den);

      a += Math.abs(e)*R*R;

  function planarArea(rs){                    // 메르카토르 평면 면적 = 화면 크기의 순수 표현

    return a;
  }
  function km2(id){ return DATA[id].km2; }

  // 극 안전 위도 — 나라를 이 밖으로 돌리면 극을 넘는다(면적 보존이 성립하는 영역의 경계).
  var LIMIT=84;
  var _s={};
  function maxAbsLat(rs){
    var m=0;
    for(var k=0;k<rs.length;k++) for(var i=0;i<rs[k].length;i++){
      var a=Math.abs(rs[k][i][1]); if(a>m) m=a;
    }
    return m;
  }
  function safeRange(id){                     // 극을 넘지 않는 목표위도 구간 [lo, hi]
    if(_s[id]) return _s[id];
    var hi=0, lo=0, v;
    for(v=0; v<=LIMIT; v++){ if(maxAbsLat(landAt(id, v))>LIMIT) break; hi=v; }
    for(v=0; v>=-LIMIT; v--){ if(maxAbsLat(landAt(id, v))>LIMIT) break; lo=v; }
    _s[id]=[lo,hi];
    return _s[id];
  }
  function safeLat(id){                       // |목표위도| 상한 (lat0와 같은 부호 쪽)
    var r=safeRange(id);
    return DATA[id].lat0>=0 ? r[1] : -r[0];
  }
  function clampSafe(id, lat){
    var r=safeRange(id);
    return Math.max(r[0], Math.min(r[1], lat));
  }
  function inSafe(id, lat){
    var r=safeRange(id);
    return lat>=r[0] && lat<=r[1];
  }

  return { DATA:DATA, PUBLISHED:PUBLISHED, ORDER:ORDER, LIMIT:LIMIT,
           rings:rings, bgRings:bgRings, decode:decode,
           mercX:mercX, mercY:mercY, invMercY:invMercY,
           scaleAt:scaleAt, areaScaleAt:areaScaleAt,
           rotateLat:rotateLat, landAt:landAt, maxAbsLat:maxAbsLat,
           safeRange:safeRange, safeLat:safeLat, clampSafe:clampSafe, inSafe:inSafe,
           sphericalArea:sphericalArea, planarArea:planarArea, km2:km2 };
});
</script>

<canvas id="stage-canvas"></canvas>
<div id="premise">학교에서 본, 그 세계지도입니다.</div>
<div id="overlay">
  <div id="formula"></div>
  <div id="reexp"><div class="track"><input type="range" min="0" max="80" value="0" step="1" aria-hidden="true"></div></div>
</div>

<script src="../core/museum.js"></script>
<script>
(function(){
  'use strict';
  var PURE = window.KMuseumMap;
  var canvas = document.getElementById('stage-canvas');
  if(!canvas || !window.Museum){ return; }
  var stage = Museum.stage(canvas);
  Museum.grip(canvas);            // §5.5 손을 놓치지 않는다 — 캔버스 밖·취소된 포인터 방어

  // ── §8.6 칠판 — 문제는 무대에 상주한다(칠판 문법) ───────────────
  var BQ = '그린란드와 콩고민주공화국 — 실제로는, 어느 쪽이 클까요?';
  var BA = '그린란드는 한 뼘도 줄지 않았다 — 지도가, 부풀렸을 뿐이다';
  var kboard = Museum.board({
    question: BQ, answer: BA,
    slots: [{id:'greenland', label:'그린란드'}, {id:'congo', label:'콩고민주공화국'}],
    tick: function(b){
      // 지도 위에서 두 나라가 차지하는 크기 — 끌어내리면 칠판에서 줄어든다.
      // 이 전시가 세 번 죽은 이유는 무엇을 견주는지 관람자가 몰랐기 때문이다.
      var g=0, c=0;
      try {
        g = PURE.planarArea(PURE.landAt('greenland', S.lat['greenland']));
        c = PURE.planarArea(PURE.landAt('congo',     S.lat['congo']));
      } catch(e){}
      var top = Math.max(g, c, 1e-9);
      b.mark('greenland', Math.min(1, g/top));
      b.mark('congo',     Math.min(1, c/top));
      if(S.betrayed || S.phase==='after') b.lit('congo');
      if((S.phase==='after'||S.betrayed) && !b.isAfter()) b.resolve();
    }
  });
  var W = stage.W, H = stage.H;

  // ── 무대 = 지도 ──────────────────────────────────────────────────
  var LAT_TOP=83.8, LAT_BOT=-56;
  var MAPW=1200, MAPX=(W-MAPW)/2;
  var PX = MAPW/(2*Math.PI);                      // 메르카토르 1단위 = px
  var MAPY = 74;                                  // 지도 상단(LAT_TOP)의 y
  var YTOP = PURE.mercY(LAT_TOP);
  function sx(lon){ return MAPX + (lon+180)/360*MAPW; }
  function sy(lat){ return MAPY + (YTOP - PURE.mercY(lat))*PX; }
  function latAtY(y){ return PURE.invMercY(YTOP - (y-MAPY)/PX); }

  var AUTO_IDS=['russia','canada','sweden','norway','finland'];
  var HAND_NEEDED=3;                              // 손으로 끌어볼 나라 수 → 그린란드 초대

  // ── 상태 ─────────────────────────────────────────────────────────
  var S = {
    phase:'boot',            // boot→drag→settled→auto→betrayed→after
    lat:{}, moved:{}, handMoves:0,
    invited:false, grabbed:null, grabOff:0, hover:null, wallAt:-9, wallId:null,
    settleAt:0, autoAt:0, autoIdx:0, autoStep:0.9, autoFrom:0, autoTo:0, autoT:0,
    picked:'greenland', betrayed:false, time:0
  };
  PURE.ORDER.forEach(function(id){ S.lat[id]=PURE.DATA[id].lat0; S.moved[id]=false; });

  var shapeCache={};
  function shapeOf(id){
    var key=id+'@'+S.lat[id].toFixed(2);
    if(shapeCache[key]) return shapeCache[key];
    shapeCache={};                                 // 한 나라만 움직인다 — 캐시 1장
    shapeCache[key]=PURE.landAt(id, S.lat[id]);
    return shapeCache[key];
  }
  function homeLimit(id){ return PURE.DATA[id].lat0; }
  // 손의 밴드 — 위도가 아니라 **화면 배율**로 잡는다.
  // 홈 대비 1.25배 이내면 눈에 띄지 않는다(예측 심기 유지) — 그 한도까지 남북 양방향을 연다.
  // 위도로만 잡으면 호주는 남쪽 0px, 브라질은 32px에서 벽에 박는다(조작이 죽는다).
  var MAXGAIN=1.25, _band={};
  function bandOf(id){
    if(_band[id]!=null) return _band[id];
    var a=Math.abs(homeLimit(id))*Math.PI/180;
    var g0=1/(Math.cos(a)*Math.cos(a));                             // 홈의 화면 배율 sec²
    var L=Math.acos(1/Math.sqrt(g0*MAXGAIN))*180/Math.PI;
    _band[id]=Math.min(45, L);
    return _band[id];
  }
  function clampLat(id, lat){
    if(S.phase==='after') return PURE.clampSafe(id, lat);           // 여운 = 위도 해금(극 안전 구간까지)
    if(id==='greenland') return Math.max(0, Math.min(homeLimit(id), lat));  // 그린란드 = 제 위도와 적도 사이(배반의 축)
    var L=bandOf(id);
    return Math.max(-L, Math.min(L, PURE.clampSafe(id, lat)));
  }

  // ── 배반 ─────────────────────────────────────────────────────────
  function triggerBetray(){
    if(S.betrayed) return;
    S.betrayed=true; S.phase='betrayed';
    Museum.betray({ x:sx(PURE.DATA.greenland.lon0)/W, y:sy(0)/H }).then(function(){ enterAfter(); });
  }
  function enterAfter(){
    S.phase='after';
    var P=PURE.PUBLISHED;
    var f=document.getElementById('formula');
    f.innerHTML='그린란드는 한 뼘도 줄지 않았다 &mdash; 지도가 부풀렸을 뿐이다'
      +'<span class="small">그린란드 '+P.greenland.toLocaleString()+' km&sup2; &middot; 아프리카 약 '+P.africa.toLocaleString()+' km&sup2; &mdash; 열네 배'
      +'<br>콩고민주공화국 '+P.congo.toLocaleString()+' km&sup2; &mdash; 그린란드보다 크다</span>';
    f.classList.add('is-in');
    Museum.plaque({ title:'거짓말하는 지도',
      story:'이 지도는 항해를 위한 것이었다 — 메르카토르(1569). 뱃길의 방향은 정확하고, 나라의 크기는 거짓이다. 손잡이로 위도를 바꿔 보세요. 북쪽으로 갈수록 화면 위의 나라는 부풀어 오릅니다.',
      fine:'MERCATOR PROJECTION · 1569' });
    Museum.ticket.grant({ id:'s8_map', title:'거짓말하는 지도', fine:'사람들의 밤',
      drawFn:function(c,w,h){
        c.strokeStyle='rgba(242,234,216,.55)'; c.lineWidth=0.8;
        for(var i=1;i<4;i++){ c.beginPath(); c.moveTo(w*0.12, h*0.15+i*h*0.18); c.lineTo(w*0.88, h*0.15+i*h*0.18); c.stroke(); }
        c.strokeStyle='rgba(242,234,216,.95)'; c.lineWidth=1.4;
        c.beginPath();                                    // 부푼 그린란드
        c.moveTo(w*0.30,h*0.16); c.lineTo(w*0.46,h*0.24); c.lineTo(w*0.40,h*0.48); c.lineTo(w*0.24,h*0.40); c.closePath(); c.stroke();
        c.beginPath();                                    // 진짜 그린란드
        c.moveTo(w*0.62,h*0.66); c.lineTo(w*0.68,h*0.69); c.lineTo(w*0.66,h*0.78); c.lineTo(w*0.60,h*0.75); c.closePath(); c.stroke();
      }});
    Museum.sound.play('paper');
    document.getElementById('reexp').classList.add('is-in');
  }

  // ── 여운 슬라이더 — 위도의 손잡이 ────────────────────────────────
  var slider=document.querySelector('#reexp input');
  slider.addEventListener('input', function(){
    if(!S.betrayed || S.phase!=='after') return;
    setLatBySlider(parseInt(slider.value,10)||0);
  });
  function setLatBySlider(v){
    var id=S.picked, h=homeLimit(id);
    S.lat[id] = clampLat(id, (h<0 ? -v : v));
    Museum.sound.play('paper');
  }
  function chalkLat(){
    var id=S.picked;
    var v=Math.abs(Math.round(S.lat[id]));
    var ko=PURE.DATA[id].ko;
    if(v<3) return ko+' — 적도에서는, 있는 그대로';
    var m=PURE.areaScaleAt(v);
    var say = m<1.6 ? '조금 부푼다'
            : m<2.6 ? '두 배로 부푼다'
            : m<6   ? '네 배로 부푼다'
            : m<12  ? '여덟 배로 부푼다'
            : '열 배 넘게 부푼다';
    return ko+' — '+(homeLimit(id)<0?'남위 ':'북위 ')+v+'도에서, 화면 위에서는 '+say;
  }

  // ── 입력: 끌어내리다 ─────────────────────────────────────────────
  function hit(p){
    for(var i=0;i<PURE.ORDER.length;i++){
      var id=PURE.ORDER[i];
      if(S.phase!=='after' && !S.invited && id==='greenland') continue;   // 초대 전엔 잡히지 않는다
      if(S.phase!=='after' && AUTO_IDS.indexOf(id)>=0) continue;          // 북쪽은 기계의 몫
      var rs=shapeOf(id);
      for(var k=0;k<rs.length;k++){
        if(inPoly(p, rs[k])) return id;
      }
    }
    return null;
  }
  function inPoly(p, ring){
    var inside=false;
    for(var i=0,j=ring.length-1;i<ring.length;j=i++){
      var xi=sx(ring[i][0]), yi=sy(ring[i][1]);
      var xj=sx(ring[j][0]), yj=sy(ring[j][1]);
      if(((yi>p.y)!==(yj>p.y)) && (p.x < (xj-xi)*(p.y-yi)/((yj-yi)||1e-9)+xi)) inside=!inside;
    }
    return inside;
  }
  function grab(id, atLat){
    S.grabbed=id; S.picked=id;
    // 잡은 자리가 손에 붙는다 — 나라가 커서로 순간이동하지 않는다
    S.grabOff = (typeof atLat==='number') ? (S.lat[id]-atLat) : 0;
    if(S.phase==='boot') S.phase='drag';
    canvas.classList.add('is-dragging');
    Museum.sound.play('creak',{pitch:0.1});
  }
  function dragTo(lat){
    if(!S.grabbed) return;
    var id=S.grabbed;
    var c=clampLat(id, lat);
    if(Math.abs(lat-c)>0.8 && S.time-S.wallAt>0.40){        // 벽에 밀어붙인다 — 지도가 거부한다(고장이 아니라 벽이다)
      S.wallAt=S.time; S.wallId=id;
      Museum.sound.play('creak',{pitch:0.55});
    }
    S.lat[id]=c;
    if(!S.moved[id] && Math.abs(S.lat[id]-homeLimit(id))>4){
      S.moved[id]=true;
      if(AUTO_IDS.indexOf(id)<0 && id!=='greenland'){ S.handMoves++; }
      if(S.handMoves>=HAND_NEEDED) S.invited=true;
    }
  }
  function release(){
    if(!S.grabbed) return;
    var id=S.grabbed; S.grabbed=null; S.grabOff=0;
    canvas.classList.remove('is-dragging');
    if(S.phase==='after') return;
    if(id==='greenland' && Math.abs(S.lat[id])<3.0){    // 적도에 눌러앉는다 — 스프링 복귀 없음
      S.lat[id]=0;
      S.phase='settled'; S.settleAt=S.time+0.9;
      Museum.sound.play('clack');
      return;
    }
    S.lat[id]=homeLimit(id);                             // 스프링 복귀
    Museum.sound.play('paper');
  }
  function handsFree(){
    return !Museum.isLocked() && S.phase!=='auto' && S.phase!=='settled' && S.phase!=='betrayed';
  }
  canvas.addEventListener('pointerdown', function(e){
    if(!handsFree()) return;
    var p=stage.toLogical(e.clientX,e.clientY);
    var id=hit(p);
    if(id){
      grab(id, latAtY(p.y));
      if(canvas.setPointerCapture && e.pointerId!=null){ try{ canvas.setPointerCapture(e.pointerId); }catch(_){} }
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if(Museum.isLocked()) return;
    var p=stage.toLogical(e.clientX,e.clientY);
    if(S.grabbed){ dragTo(latAtY(p.y)+S.grabOff); return; }
    S.hover = handsFree() ? hit(p) : null;                       // 잡을 수 있는 것은 손이 먼저 안다
    canvas.classList.toggle('is-over', !!S.hover);
  });
  canvas.addEventListener('pointerleave', function(){ S.hover=null; canvas.classList.remove('is-over'); });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  // ── 기계의 밤 — 북쪽이 스스로 내려온다 ───────────────────────────
  function startAuto(){
    S.phase='auto'; S.autoIdx=0; S.autoStep=0.9; S.autoT=0;
    S.autoFrom=PURE.DATA[AUTO_IDS[0]].lat0; S.autoTo=0;
    Museum.sound.play('curtain');
  }
  function autoTick(dt){
    if(S.autoIdx>=AUTO_IDS.length){ triggerBetray(); return; }
    S.autoT+=dt;
    var id=AUTO_IDS[S.autoIdx];
    var k=Math.min(1, S.autoT/S.autoStep);
    var e=k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    S.lat[id]=S.autoFrom + (S.autoTo-S.autoFrom)*e;
    S.moved[id]=true;
    if(k>=1){
      Museum.sound.play('clack');
      S.autoIdx++; S.autoT=0;
      S.autoStep=Math.max(0.35, S.autoStep*0.85);
      if(S.autoIdx<AUTO_IDS.length){ S.autoFrom=PURE.DATA[AUTO_IDS[S.autoIdx]].lat0; }
      else { triggerBetray(); }
    }
  }

  // ── 무대 씬 ──────────────────────────────────────────────────────
  function drawRings(ctx, rs, fill, stroke, lw, dash){
    ctx.lineWidth=lw;
    if(dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
    for(var k=0;k<rs.length;k++){
      var r=rs[k];
      if(r.length<3) continue;
      ctx.beginPath();
      ctx.moveTo(sx(r[0][0]), sy(r[0][1]));
      for(var i=1;i<r.length;i++) ctx.lineTo(sx(r[i][0]), sy(r[i][1]));
      ctx.closePath();
      if(fill){ ctx.fillStyle=fill; ctx.fill(); }
      if(stroke){ ctx.strokeStyle=stroke; ctx.stroke(); }
    }
    ctx.setLineDash([]);
  }

  stage.add({
    update:function(dt){
      if(Museum.isLocked()) return;
      S.time+=dt;
      if(S.phase==='settled' && S.time>=S.settleAt) startAuto();
      if(S.phase==='auto' && !S.betrayed) autoTick(dt);
    },
    draw:function(ctx){
      var breath=0.5+0.5*Math.sin(S.time*2.0);
      // 위도선 — 무대 소품(수치 라벨 0)
      ctx.setLineDash([]);
      [-60,-30,30,60].forEach(function(la){
        ctx.strokeStyle='rgba(95,88,74,.32)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(MAPX, sy(la)); ctx.lineTo(MAPX+MAPW, sy(la)); ctx.stroke();
      });
      var lit = (S.grabbed||S.hover) && S.phase!=='after';   // 나라를 잡으면 적도가 살아난다
      ctx.strokeStyle = lit ? 'rgba(201,169,97,'+(0.52+0.26*breath).toFixed(2)+')' : 'rgba(201,169,97,.34)';
      ctx.lineWidth = lit ? 2.4 : 1.4;
      ctx.beginPath(); ctx.moveTo(MAPX, sy(0)); ctx.lineTo(MAPX+MAPW, sy(0)); ctx.stroke();
      ctx.lineWidth=1;

      // 배경 육지
      drawRings(ctx, PURE.bgRings(), 'rgba(242,234,216,.07)', 'rgba(168,158,136,.20)', 1);

      // 떠난 자리 — 분필 유령 윤곽
      PURE.ORDER.forEach(function(id){
        if(!S.moved[id] || Math.abs(S.lat[id]-homeLimit(id))<0.5) return;
        drawRings(ctx, PURE.rings(id), null, 'rgba(168,158,136,.34)', 1, [4,5]);
      });

      // 나라들
      PURE.ORDER.forEach(function(id){
        var away=Math.abs(S.lat[id]-homeLimit(id))>0.5;
        var held=(S.grabbed===id), over=(S.hover===id && !S.grabbed);
        var wall=(S.wallId===id) ? Math.max(0, 1-(S.time-S.wallAt)/0.30) : 0;   // 벽의 잔향
        var a = held ? .46 : over ? .40 : away ? .36 : .30;
        var st = wall>0 ? 'rgba(201,169,97,'+(0.95).toFixed(2)+')'
               : held ? 'rgba(201,169,97,.95)' : over ? 'rgba(201,169,97,.80)' : 'rgba(201,169,97,.58)';
        drawRings(ctx, shapeOf(id), 'rgba(242,234,216,'+(a+0.10*wall).toFixed(2)+')', st,
                  (held||over)?1.9+1.6*wall:1.4);
      });

      // 초대의 숨결
      var inv=null;
      if(S.phase==='drag' && S.invited && !S.moved.greenland) inv='greenland';
      else if(S.handMoves===0 && !S.moved.brazil && (S.phase==='boot'||S.phase==='drag')) inv='brazil';
      if(inv && S.grabbed!==inv){
        drawRings(ctx, shapeOf(inv), null,
          'rgba(242,234,216,'+(0.34+0.50*breath).toFixed(2)+')', 3.0);
      }

      // 여운의 분필
      if(S.phase==='after'){
        ctx.font='19px "Gowun Dodum", sans-serif';
        ctx.fillStyle='rgba(242,234,216,.85)'; ctx.textAlign='center';
        ctx.fillText(chalkLat(), W*0.5, 44);
      }
    }
  });
  stage.start();
  Museum.sound.roomtone(true);
  Museum.curtainIn();
  setTimeout(function(){ document.getElementById('premise').classList.add('is-in'); }, 900);

  // ── 테스트 훅 ─────────────────────────────────────────────────────
  window.__S8 = {
    S:S, PURE:PURE,
    sx:sx, sy:sy, latAtY:latAtY, shapeOf:shapeOf, clampLat:clampLat,
    grab:grab, dragTo:dragTo, release:release, hit:hit,
    startAuto:startAuto, autoTick:autoTick, chalkLat:chalkLat,
    setLatBySlider:setLatBySlider, homeLimit:homeLimit,
    AUTO_IDS:AUTO_IDS, HAND_NEEDED:HAND_NEEDED
  };

  stage.add(kboard.scene);         // 칠판은 무대 위에 상주한다
  window.__BOARD = kboard;
})();
</script>
</body>

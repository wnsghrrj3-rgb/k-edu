<style>
/* ===== 디자인 헌법 v11 준수: 저학년 토큰 (l08_09 복사 계승) =====
   10~11차시 = 소단원 2 (듣기·말하기 트랙). 8~9차시와 대칭. 한글 트랙 메커닉 미사용.
   재활용 부품: .posture-pair/.posture-card(.static) · .pledge-list · .clue-list · .icon-row. 새 CSS 0개. */
:root{
  --c-main:#42A5F5; --c-deep:#1976D2; --c-soft:#E3F2FD; --c-sub:#64B5F6;
  --c-ink:#1565C0; --c-bg:#F0F7FF; --c-emph:#DC2626; --c-ok:#2E7D32;
  --fs-title:clamp(20px,5.2cqw,32px);
  --fs-heading:clamp(17px,4.2cqw,24px);
  --fs-body:clamp(15px,3.6cqw,21px);
  --fs-caption:clamp(12px,2.7cqw,16px);
  --fs-label:clamp(11px,2.3cqw,14px);
  --em-sm:clamp(28px,6cqw,40px); --em-md:clamp(40px,9cqw,60px); --em-lg:clamp(54px,12cqw,80px);
}
*{margin:0; padding:0; box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--c-bg); display:flex; align-items:center; justify-content:center; padding:12px; font-family:'Jua',sans-serif; overflow:hidden;}

@keyframes ka-fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
@keyframes ka-pop{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.12);}100%{opacity:1; transform:scale(1);}}
@keyframes ka-popBig{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes ka-shake{0%,100%{transform:none;}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

/* ===== 헌법 카드 골격 ===== */
.ka{
  container-type:inline-size; background:#fff;
  border-radius:clamp(16px,3cqw,24px); aspect-ratio:5/4;
  width:min(1024px, calc((100vh - 24px) * 5 / 4), calc(100vw - 24px));
  padding:clamp(12px,2.6cqw,20px) clamp(16px,3.4cqw,28px);
  font-family:'Jua',sans-serif; color:#333;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  display:flex; flex-direction:column; margin:0 auto;
}
.ka-h{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); margin-bottom:clamp(12px,3cqw,18px);}
.ka-lb{background:#F4F4F8; border:none; padding:clamp(5px,1.4cqw,8px) clamp(8px,2cqw,14px); border-radius:clamp(8px,1.8cqw,12px); color:#555; font-family:inherit; font-size:var(--fs-label); display:flex; align-items:center; gap:5px; flex-shrink:0; cursor:pointer;}
.ka-bar{flex:1; height:clamp(3px,.7cqw,5px); background:var(--c-bg); border-radius:999px; overflow:hidden;}
.ka-bar>div{height:100%; background:var(--c-main); border-radius:999px; transition:width .3s;}
.ka-pg{color:var(--c-deep); font-family:'Nunito',sans-serif; font-weight:800; font-size:var(--fs-label); flex-shrink:0;}
.ka-sc{background:#FFF8E1; color:#F57F17; padding:clamp(3px,.9cqw,5px) clamp(8px,2cqw,12px); border-radius:999px; font-size:var(--fs-caption); flex-shrink:0; display:flex; align-items:center; gap:4px;}

/* 메인 */
.ka-m{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; text-align:center; width:100%; overflow-y:auto;}
.ka-tag{background:#FFF8E1; color:#F57F17; padding:clamp(3px,1cqw,6px) clamp(10px,2.4cqw,14px); border-radius:30px; font-size:var(--fs-caption); margin-bottom:clamp(8px,2cqw,12px); display:inline-block;}
.ka-t{font-size:var(--fs-title); line-height:1.3; color:var(--c-deep); margin-bottom:clamp(8px,2cqw,14px); font-weight:400; animation:ka-fadeUp .4s .15s ease both;}
.ka-bub{background:var(--c-soft); border-radius:clamp(10px,2.4cqw,16px); padding:clamp(8px,2cqw,14px) clamp(12px,3cqw,20px); font-size:var(--fs-body); line-height:1.55; color:#333; max-width:620px; animation:ka-fadeUp .4s .4s ease both;}
.emph{color:var(--c-emph);}

/* 비교/찾기 카드 (l08_09 계승 — 듣기·말하기 핵심 메커닉) */
.posture-pair{display:flex; gap:clamp(14px,3.4cqw,24px); justify-content:center; flex-wrap:wrap; margin:clamp(4px,1cqw,8px) 0;}
.posture-card{width:clamp(100px,22cqw,150px); padding:clamp(10px,2.4cqw,16px); border-radius:clamp(14px,3cqw,20px); border:clamp(3px,.7cqw,4px) solid var(--c-soft); background:#fff; cursor:pointer; box-shadow:0 5px 0 var(--c-soft); display:flex; flex-direction:column; align-items:center; gap:clamp(6px,1.6cqw,10px);}
.posture-card:active{transform:translateY(3px); box-shadow:0 2px 0 var(--c-soft);}
.posture-card.correct{background:var(--c-main); color:#fff; border-color:var(--c-deep); box-shadow:0 5px 0 var(--c-deep); animation:ka-popBig .5s ease;}
.posture-card.wrong{background:#FFE0E0; border-color:var(--c-emph); animation:ka-shake .35s;}
.posture-card.static{cursor:default; box-shadow:0 4px 12px rgba(0,0,0,.06);}
.posture-emoji{font-size:clamp(38px,9cqw,62px);}
.posture-cap{font-size:var(--fs-caption); color:#555;}
.posture-card.correct .posture-cap{color:#fff;}
.posture-name{font-size:var(--fs-label); color:var(--c-deep); background:var(--c-soft); border-radius:999px; padding:2px clamp(8px,2cqw,12px);}
.posture-card.correct .posture-name{color:var(--c-deep);}

/* 자세 5요소 미리보기 한 줄 (슬2) */
.icon-row{display:flex; gap:clamp(8px,2.2cqw,16px); justify-content:center; flex-wrap:wrap; margin:clamp(6px,1.6cqw,10px) 0;}
.icon-chip{display:flex; flex-direction:column; align-items:center; gap:clamp(3px,.8cqw,6px); animation:ka-pop .4s ease both;}
.icon-chip .em{font-size:clamp(30px,7cqw,48px);}
.icon-chip .lb{font-size:var(--fs-caption); color:var(--c-deep);}

/* 다짐 체크 (l08_09 .pledge-list 계승) */
.pledge-list{display:flex; flex-direction:column; gap:clamp(8px,2cqw,12px); max-width:480px; margin:clamp(6px,1.6cqw,10px) auto;}
.pledge-item{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); padding:clamp(10px,2.4cqw,14px) clamp(14px,3cqw,18px); background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(12px,2.6cqw,18px); cursor:pointer; font-size:var(--fs-body); color:var(--c-deep); text-align:left;}
.pledge-item.checked{background:var(--c-soft); border-color:var(--c-main);}
.pledge-check{width:clamp(24px,5.4cqw,32px); height:clamp(24px,5.4cqw,32px); border-radius:50%; border:clamp(3px,.7cqw,4px) solid var(--c-main); display:grid; place-items:center; flex-shrink:0; background:#fff; color:transparent; font-weight:bold;}
.pledge-item.checked .pledge-check{background:var(--c-main); color:#fff;}

/* 보기 카드 / 들은 이야기 (l08_09 .clue-list 계승) */
.clue-list{display:flex; flex-direction:column; gap:clamp(5px,1.2cqw,8px); max-width:500px; margin:clamp(4px,1cqw,8px) auto;}
.clue-item{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); padding:clamp(6px,1.6cqw,10px) clamp(12px,3cqw,16px); background:#fff; border:clamp(2px,.5cqw,3px) solid var(--c-soft); border-radius:clamp(10px,2.4cqw,14px); font-size:var(--fs-body); color:#333; text-align:left;}
.clue-no{width:clamp(22px,5cqw,30px); height:clamp(22px,5cqw,30px); border-radius:50%; background:var(--c-main); color:#fff; display:grid; place-items:center; font-family:'Nunito'; font-weight:800; font-size:var(--fs-caption); flex-shrink:0;}
.clue-item b{color:var(--c-deep);}

/* 들려줄 이야기 박스 (슬11 — clue-list 기반, 강조 톤) */
.story-box{background:#FFF8E1; border:clamp(2px,.5cqw,3px) solid #FFD54F; border-radius:clamp(12px,2.6cqw,16px); padding:clamp(10px,2.4cqw,16px) clamp(14px,3cqw,20px); max-width:520px; margin:clamp(4px,1cqw,8px) auto; font-size:var(--fs-body); line-height:1.6; color:#5D4037;}
.story-box .em{font-size:clamp(26px,6cqw,40px); display:block; margin-bottom:4px;}

/* 피드백 줄 */
.fb{margin-top:clamp(8px,2cqw,12px); min-height:26px; font-size:var(--fs-caption); color:var(--c-deep);}
.fb.bad{color:var(--c-emph);}

/* 푸터 */
.ka-f{display:grid; grid-template-columns:1fr 1.3fr 1fr 1.3fr; gap:clamp(5px,1.4cqw,8px); margin-top:clamp(10px,2.6cqw,15px);}
.ka-nav{background:#F4F4F8; color:#2A2A35; border:none; padding:clamp(8px,2.2cqw,12px) 6px; font-size:var(--fs-caption); border-radius:clamp(10px,2.5cqw,14px); cursor:pointer; font-family:inherit;}
.ka-nav-next{background:var(--c-main); color:#fff;}
.ka-nav:disabled{opacity:.4; cursor:default;}

@container (max-width:420px){
  .ka-lb span{display:none;}
  .ka-f{grid-template-columns:1fr 1fr;}
}
</style>

const LESSON_ID='g1_kor_u2_l10_11_v1';
const LESSON_MAX=50;
let cur=0, score=0, maxScore=0;
const main=document.getElementById('main');
const bar=document.getElementById('bar'), pg=document.getElementById('pg'), scoreEl=document.getElementById('score');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');

function render(){
  const s=slides[cur];
  main.innerHTML=`<span class="ka-tag">${s.tag}</span><h2 class="ka-t">${s.t}</h2>${s.html}`;
  bar.style.width=((cur+1)/slides.length*100)+'%';
  pg.textContent=`${cur+1} / ${slides.length}`;
  prevB.disabled=cur===0; nextB.disabled=cur===slides.length-1;
  if(cur===slides.length-1){ if(window.kedu&&window.kedu.recordLessonEnd) window.kedu.recordLessonEnd(score, LESSON_MAX); }
  tracker.done(cur);
  // 비교/찾기 인터랙션 (정답 있는 슬만)
  if(s.correct && main.querySelector('.posture-card:not(.static)')) bindPosture(s);
  // 다짐 토글
  if(main.querySelector('.pledge-item')) bindPledge();
}
function bindPosture(s){
  let done=false;
  main.querySelectorAll('.posture-card:not(.static)').forEach(card=>{
    card.onclick=()=>{
      if(done) return;
      const ok=card.dataset.v===s.correct;
      card.classList.add(ok?'correct':'wrong');
      const fb=main.querySelector('.fb');
      if(ok){
        done=true;
        if(fb){fb.textContent=s.fbOk||'맞아요! 바른 자세예요. ✨'; fb.classList.remove('bad');}
        if(s.log){score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        main.querySelectorAll('.posture-card:not(.static)').forEach(c=>{if(c!==card)c.style.opacity=.4;});
      }else{
        if(fb){fb.textContent=s.fbBad||'다시 한 번 살펴봐요.'; fb.classList.add('bad');}
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>card.classList.remove('wrong'),350);
      }
    };
  });
}
function bindPledge(){
  main.querySelectorAll('.pledge-item').forEach(item=>{
    item.onclick=()=>{ item.classList.toggle('checked'); };
  });
}
prevB.onclick=()=>{if(cur>0){cur--; render();}};
nextB.onclick=()=>{if(cur<slides.length-1){cur++; render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextB.click();if(e.key==='ArrowLeft')prevB.click();});
document.getElementById('hint').onclick=()=>{
  const s=slides[cur];
  if(s.hint) alert('힌트: '+s.hint);
  else alert('힌트: 하나씩 천천히 살펴봐요.');
};
document.getElementById('replay').onclick=()=>{/* 음성 보조층 — 추후 mp3 연결 */};
render();
</script>

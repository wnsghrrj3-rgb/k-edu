<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<title>여러 가지 낱말을 익혀요 · 마무리하기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --c-main:#42A5F5; --c-deep:#1976D2; --c-soft:#E3F2FD; --c-sub:#64B5F6;
  --c-ink:#1565C0; --c-bg:#F0F7FF; --c-emph:#DC2626; --c-ok:#2E7D32;
  --c-strong:#FB8C00; --c-strong-soft:#FFF3E0;
  --fs-title:clamp(20px,5.2cqw,32px); --fs-heading:clamp(17px,4.2cqw,24px);
  --fs-body:clamp(15px,3.6cqw,21px); --fs-caption:clamp(12px,2.7cqw,16px); --fs-label:clamp(11px,2.3cqw,14px);
}
*{margin:0; padding:0; box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--c-bg); display:flex; align-items:center; justify-content:center; padding:12px; font-family:'Jua',sans-serif; overflow:hidden;}
@keyframes ka-fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
@keyframes ka-pop{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.12);}100%{opacity:1; transform:scale(1);}}
@keyframes ka-popBig{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes ka-shake{0%,100%{transform:none;}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
.ka{container-type:inline-size; background:#fff; border-radius:clamp(16px,3cqw,24px); aspect-ratio:5/4; width:min(1024px, calc((100vh - 24px) * 5 / 4), calc(100vw - 24px)); padding:clamp(12px,2.6cqw,20px) clamp(16px,3.4cqw,28px); font-family:'Jua',sans-serif; color:#333; box-shadow:0 4px 16px rgba(0,0,0,.08); display:flex; flex-direction:column; margin:0 auto;}
.ka-h{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); margin-bottom:clamp(12px,3cqw,18px);}
.ka-lb{background:#F4F4F8; border:none; padding:clamp(5px,1.4cqw,8px) clamp(8px,2cqw,14px); border-radius:clamp(8px,1.8cqw,12px); color:#555; font-family:inherit; font-size:var(--fs-label); display:flex; align-items:center; gap:5px; flex-shrink:0;}
.ka-bar{flex:1; height:clamp(3px,.7cqw,5px); background:var(--c-bg); border-radius:999px; overflow:hidden;}
.ka-bar>div{height:100%; background:var(--c-main); border-radius:999px; transition:width .3s;}
.ka-pg{color:var(--c-deep); font-family:'Nunito',sans-serif; font-weight:800; font-size:var(--fs-label); flex-shrink:0;}
.ka-sc{background:#FFF8E1; color:#F57F17; padding:clamp(3px,.9cqw,5px) clamp(8px,2cqw,12px); border-radius:999px; font-size:var(--fs-caption); flex-shrink:0; display:flex; align-items:center; gap:4px;}
.ka-m{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; text-align:center; width:100%; overflow-y:auto;}
.ka-tag{background:#FFF8E1; color:#F57F17; padding:clamp(3px,1cqw,6px) clamp(10px,2.4cqw,14px); border-radius:30px; font-size:var(--fs-caption); margin-bottom:clamp(8px,2cqw,12px); display:inline-block;}
.ka-t{font-size:var(--fs-title); line-height:1.3; color:var(--c-deep); margin-bottom:clamp(8px,2cqw,14px); font-weight:400; animation:ka-fadeUp .4s .15s ease both;}
.ka-bub{background:var(--c-soft); border-radius:clamp(10px,2.4cqw,16px); padding:clamp(8px,2cqw,14px) clamp(12px,3cqw,20px); font-size:var(--fs-body); line-height:1.55; color:#333; max-width:620px; animation:ka-fadeUp .4s .4s ease both;}
.emph{color:var(--c-emph);}
.build{display:flex; align-items:center; gap:clamp(8px,2cqw,14px); flex-wrap:wrap; justify-content:center; margin:clamp(4px,1cqw,8px) 0;}
.syl{width:clamp(64px,15cqw,104px); height:clamp(64px,15cqw,104px); background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(14px,3cqw,22px); display:grid; place-items:center; font-size:clamp(36px,8cqw,58px); color:var(--c-deep); box-shadow:0 5px 0 var(--c-soft); animation:ka-pop .5s ease both;}
.op{font-size:clamp(24px,5cqw,38px); color:#aaa;}
.make-stage{display:flex; align-items:center; gap:clamp(10px,2.6cqw,18px); flex-wrap:wrap; justify-content:center; margin:clamp(4px,1cqw,8px) 0;}
.make-pic{font-size:clamp(48px,11cqw,80px);}
.fb{margin-top:clamp(8px,2cqw,12px); min-height:26px; font-size:var(--fs-caption); color:var(--c-deep);}
.fb.bad{color:var(--c-emph);}
/* 그림/이름 고르기 */
.wordpick{display:flex; gap:clamp(12px,3cqw,22px); flex-wrap:wrap; justify-content:center; margin-top:clamp(8px,2cqw,12px);}
.wcard{display:flex; flex-direction:column; align-items:center; gap:clamp(4px,1cqw,7px); min-width:clamp(90px,20cqw,140px); padding:clamp(12px,2.8cqw,18px) clamp(10px,2.4cqw,16px); border-radius:clamp(14px,3cqw,20px); border:clamp(3px,.7cqw,4px) solid var(--c-soft); background:#fff; cursor:pointer; box-shadow:0 5px 0 var(--c-soft);}
.wcard:active{transform:translateY(3px); box-shadow:0 2px 0 var(--c-soft);}
.wcard .wc-pic{font-size:clamp(34px,7.6cqw,52px);}
.wcard .wc-word{font-size:clamp(24px,5.4cqw,40px); color:var(--c-deep);}
.wcard.correct{background:var(--c-soft); border-color:var(--c-main); box-shadow:0 5px 0 var(--c-deep); animation:ka-popBig .5s ease;}
.wcard.correct .wc-word{color:var(--c-ok);}
.wcard.wrong{background:#FFE0E0; border-color:var(--c-emph); animation:ka-shake .35s;}
/* 짝 잇기 */
.match{display:flex; gap:clamp(20px,5cqw,52px); justify-content:center; margin:clamp(6px,1.6cqw,10px) 0;}
.match-col{display:flex; flex-direction:column; gap:clamp(8px,2cqw,12px);}
.match-col-h{font-size:var(--fs-caption); color:#888; margin-bottom:2px;}
.match-card{min-width:clamp(80px,18cqw,118px); padding:clamp(10px,2.4cqw,15px) clamp(12px,2.8cqw,18px); border-radius:clamp(12px,2.6cqw,18px); border:clamp(3px,.7cqw,4px) solid var(--c-soft); background:#fff; font-family:'Jua'; font-size:clamp(24px,5.4cqw,38px); color:var(--c-deep); cursor:pointer; box-shadow:0 4px 0 var(--c-soft); text-align:center;}
.match-card:active{transform:translateY(2px);}
.match-card.sel{border-color:var(--c-main); background:var(--c-soft); box-shadow:0 4px 0 var(--c-deep);}
.match-card.paired{border-color:var(--c-ok); background:#E8F5E9; color:var(--c-ok); box-shadow:0 4px 0 #A5D6A7; pointer-events:none;}
.match-card.miss{animation:ka-shake .35s;}
/* 낱말 모으기 (색칠) — 의미 기준(data-hit 수기) */
.collect{display:flex; flex-wrap:wrap; gap:clamp(7px,1.8cqw,12px); justify-content:center; margin:clamp(4px,1cqw,8px) auto; max-width:600px;}
.chip{padding:clamp(8px,2cqw,13px) clamp(12px,2.8cqw,18px); border-radius:clamp(12px,2.6cqw,18px); border:clamp(3px,.7cqw,4px) solid var(--c-soft); background:#fff; font-family:'Jua'; font-size:clamp(20px,4.6cqw,32px); color:var(--c-deep); cursor:pointer; box-shadow:0 4px 0 var(--c-soft);}
.chip:active{transform:translateY(2px);}
.chip.painted{background:var(--c-soft); border-color:var(--c-main); color:var(--c-ok); box-shadow:0 4px 0 var(--c-deep); animation:ka-pop .35s ease;}
.chip.miss{animation:ka-shake .35s;}
.chip.done-dim{opacity:.45; pointer-events:none;}
/* 따라 쓰기 */
.trace-wrap{display:flex; flex-direction:column; gap:clamp(8px,2cqw,12px); margin:clamp(4px,1cqw,8px) 0; align-items:center;}
.trace-row{display:flex; align-items:center; gap:clamp(8px,2cqw,14px); flex-wrap:wrap; justify-content:center;}
.trace-pic{font-size:clamp(32px,7cqw,48px); flex-shrink:0;}
.trace-word{display:flex; gap:clamp(4px,1cqw,7px);}
.trace-cell{width:clamp(44px,10cqw,68px); height:clamp(44px,10cqw,68px); border:clamp(3px,.7cqw,4px) dashed var(--c-sub); border-radius:clamp(10px,2.2cqw,14px); display:grid; place-items:center; font-size:clamp(28px,6cqw,44px); color:#BBDEFB; background:#fff; cursor:pointer;}
.trace-cell.done{border-style:solid; border-color:var(--c-deep); color:var(--c-deep); background:var(--c-soft); animation:ka-pop .35s ease;}
/* 주제 미리보기 / 정리 */
.read-list{display:flex; flex-wrap:wrap; gap:clamp(8px,2.2cqw,16px); justify-content:center; margin:clamp(4px,1cqw,8px) 0;}
.read-card{display:flex; flex-direction:column; align-items:center; gap:clamp(3px,.9cqw,6px); padding:clamp(10px,2.4cqw,16px) clamp(14px,3cqw,20px); border-radius:clamp(12px,2.6cqw,18px); background:var(--c-soft); min-width:clamp(96px,22cqw,140px);}
.read-pic{font-size:clamp(34px,7.4cqw,52px);}
.read-word{font-size:clamp(20px,4.6cqw,32px); color:var(--c-deep);}
.recap{display:flex; flex-direction:column; gap:clamp(8px,2cqw,12px); max-width:540px; margin:clamp(6px,1.6cqw,10px) auto;}
.recap-item{display:flex; align-items:center; gap:clamp(10px,2.4cqw,14px); padding:clamp(10px,2.6cqw,15px) clamp(14px,3cqw,20px); background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(14px,3cqw,20px); font-size:var(--fs-body); color:var(--c-deep); text-align:left; animation:ka-fadeUp .4s ease both;}
.recap-ic{font-size:clamp(26px,6cqw,38px); flex-shrink:0;}
.ka-f{display:grid; grid-template-columns:1fr 1.3fr 1fr 1.3fr; gap:clamp(5px,1.4cqw,8px); margin-top:clamp(10px,2.6cqw,15px);}
.ka-nav{background:#F4F4F8; color:#2A2A35; border:none; padding:clamp(8px,2.2cqw,12px) 6px; font-size:var(--fs-caption); border-radius:clamp(10px,2.5cqw,14px); cursor:pointer; font-family:inherit;}
.ka-nav-next{background:var(--c-main); color:#fff;}
.ka-nav:disabled{opacity:.4; cursor:default;}
@container (max-width:420px){ .ka-lb span{display:none;} .ka-f{grid-template-columns:1fr 1fr;} .match{gap:clamp(14px,4cqw,28px);} }
/* 글자판 찾기 (신규 메커닉) */
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(5px,1.4cqw,9px); max-width:clamp(240px,62cqw,380px); margin:clamp(6px,1.6cqw,10px) auto;}
.gcell{aspect-ratio:1; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(10px,2.2cqw,14px); background:#fff; font-family:'Jua'; font-size:clamp(22px,5cqw,36px); color:var(--c-deep); cursor:pointer; box-shadow:0 4px 0 var(--c-soft); display:grid; place-items:center;}
.gcell:active{transform:translateY(2px);}
.gcell.found{background:var(--c-soft); border-color:var(--c-main); color:var(--c-ok); box-shadow:0 4px 0 var(--c-deep); animation:ka-pop .35s ease;}
.gcell.miss{animation:ka-shake .35s;}
/* 세로 모바일(폭 600px 이하·세로): 5/4 카드가 화면 높이의 1/3만 쓰고 콘텐츠가 0.33까지 축소되던 것을 세로로 꽉 채운다. 가로·데스크톱은 그대로 */
@media (max-width:600px) and (orientation:portrait){
  html,body{height:100%;}
  body{height:100dvh; min-height:0;}
  .ka{aspect-ratio:auto; width:100%; height:100%; max-height:none;}
}
</style>

<script>
const tracker={
  answer(i,ok){ if(window.kedu&&window.kedu.recordAnswer) window.kedu.recordAnswer(LESSON_ID+'_s'+i, ok, null, null); },

/* ===== 13~14차시(마무리하기 + 기초 다지기) 13슬: ① 만나기 2 → ② 전반 3 → ③ 후반 5(심장) → ④ 정리 3 =====
   학습 목표: 단원에서 배운 낱말을 글자판에서 찾고, 학습 도구어(없다·있다·읽다·차례)를 익혀 단원을 마무리한다.
   ★ 신규 메커닉 — 글자판 찾기(bindGrid): 목표 낱말의 글자를 글자판에서 찾아 누른다(data-answer = 정답 칸 인덱스).
   심장 = ③ 기초 다지기(학습 도구어 익히기) + 따라 쓰기 + 단원 종합 수수께끼.
   ★ 로깅 O = 글자판①·글자 수 모으기·글자판②·학습도구어 3문항·종합 수수께끼.
      스스로 돌아보기(자기평가·표현)·정리·마무리 = 로깅 X·완주 ✓(사회적 비교 차단).
   ★ 학습 도구어 뜻(지도서): 없다=실제로 있지 않은 상태 / 있다=어느 곳에 머무름 / 읽다=글자를 소리 내어 말함 / 차례=순서 있게 돌아오는 기회.
   ★ 저작권: 지도서 평가 활동(글자판·이어말하기) 의도만 차용. 글자판은 자체 재구성, 모두 보편 낱말.
*/
const slides=[
  // ── ① 만나기 ──
  {tag:'① 단원 마무리',
   t:'배운 낱말을 마무리해요',
   html:`<div class="make-stage"><div class="make-pic">🏁</div></div>
    <div class="ka-bub">몸·가족·음식·학교·이웃… 많은 낱말을 익혔어요!<br>오늘은 <span class="emph">글자판</span>에서 낱말을 찾고,<br>새로운 낱말도 몇 개 더 익히며 마무리해요. 🔎</div>`},

  {tag:'① 무엇을 할까',
   t:'두 가지로 마무리해요',
   html:`<div class="read-list">
      <div class="read-card"><div class="read-pic">🔠</div><div class="read-word">글자판 찾기</div></div>
      <div class="read-card"><div class="read-pic">📘</div><div class="read-word">기초 다지기</div></div>
    </div>
    <div class="ka-bub">글자판에서 배운 낱말을 찾고,<br>새 낱말 '없다·있다·읽다·차례'도 익혀요. 🗂️</div>`},

  // ── ② 엔진 전반 ──
  {tag:'② 글자판 찾기', log:true,
   t:'글자판에서 "선생님"을 찾아요',
   html:`<div class="ka-bub" style="margin-bottom:12px">글자판에서 <b>선생님</b>을 찾아 글자를 차례대로 눌러요.</div>
    <div class="grid" id="grid" data-answer="0,1,2">
      <button class="gcell">선</button><button class="gcell">생</button><button class="gcell">님</button><button class="gcell">칠</button>
      <button class="gcell">판</button><button class="gcell">책</button><button class="gcell">상</button><button class="gcell">연</button>
      <button class="gcell">필</button><button class="gcell">친</button><button class="gcell">구</button><button class="gcell">운</button>
      <button class="gcell">동</button><button class="gcell">장</button><button class="gcell">시</button><button class="gcell">소</button>
    </div>
    <div class="fb" id="gridFb"></div>`},

  {tag:'② 글자 수로 모으기', log:true,
   t:'두 글자 낱말을 모두 칠해요',
   html:`<div class="ka-bub" style="margin-bottom:12px">아래에서 <b>두 글자</b>로 된 낱말을 모두 찾아 눌러 색칠해요.</div>
    <div class="collect" id="collect">
      <button class="chip" data-hit="1">국수</button>
      <button class="chip" data-hit="0">선생님</button>
      <button class="chip" data-hit="1">김치</button>
      <button class="chip" data-hit="0">도서관</button>
      <button class="chip" data-hit="1">친구</button>
      <button class="chip" data-hit="0">할머니</button>
      <button class="chip" data-hit="1">버스</button>
      <button class="chip" data-hit="0">소방서</button>
    </div>
    <div class="fb" id="collectFb"></div>`},

  {tag:'② 글자판 찾기', log:true,
   t:'글자판에서 "꽃집"을 찾아요',
   html:`<div class="ka-bub" style="margin-bottom:12px">글자판에서 <b>꽃집</b>을 찾아 글자를 차례대로 눌러요.</div>
    <div class="grid" id="grid" data-answer="0,1">
      <button class="gcell">꽃</button><button class="gcell">집</button><button class="gcell">빵</button><button class="gcell">은</button>
      <button class="gcell">행</button><button class="gcell">도</button><button class="gcell">서</button><button class="gcell">관</button>
      <button class="gcell">병</button><button class="gcell">원</button><button class="gcell">치</button><button class="gcell">과</button>
      <button class="gcell">가</button><button class="gcell">구</button><button class="gcell">점</button><button class="gcell">소</button>
    </div>
    <div class="fb" id="gridFb"></div>`},

  // ── ③ 엔진 후반 (심장 = 기초 다지기) ──
  {tag:'③ 기초 다지기', log:true,
   t:'글자를 소리 내어 말하는 것은?',
   html:`<div class="make-stage"><div class="make-pic">📖</div></div>
    <div class="ka-bub" style="margin-bottom:12px">책의 글자를 보고 소리 내어 말하는 것을 무엇이라고 할까요?</div>
    <div class="wordpick">
      <div class="wcard" data-ok="1"><div class="wc-word">읽다</div></div>
      <div class="wcard" data-ok="0"><div class="wc-word">없다</div></div>
      <div class="wcard" data-ok="0"><div class="wc-word">차례</div></div>
    </div>
    <div class="fb"></div>`},

  {tag:'③ 기초 다지기', log:true,
   t:'순서대로 돌아오는 기회는?',
   html:`<div class="make-stage"><div class="make-pic">🔢</div></div>
    <div class="ka-bub" style="margin-bottom:12px">한 명씩 순서 있게 돌아오는 기회를 무엇이라고 할까요?</div>

const LESSON_ID='g1_kor_u4_l13_14_v1';
const LESSON_MAX=70;
let cur=0, score=0, maxScore=0;
const main=document.getElementById('main');
const bar=document.getElementById('bar');
const pg=document.getElementById('pg');
const scoreEl=document.getElementById('score');
const prevB=document.getElementById('prev');
const nextB=document.getElementById('next');

function render(){
  const s=slides[cur];
  main.innerHTML=`<span class="ka-tag">${s.tag}</span><h2 class="ka-t">${s.t}</h2>${s.html}`;
  bar.style.width=((cur+1)/slides.length*100)+'%';
  pg.textContent=`${cur+1} / ${slides.length}`;
  prevB.disabled=cur===0; nextB.disabled=cur===slides.length-1;
  if(cur===slides.length-1){ if(window.kedu&&window.kedu.recordLessonEnd) window.kedu.recordLessonEnd(score, LESSON_MAX); }
  tracker.done(cur);
  if(main.querySelector('#match')) bindMatch(s);
  if(main.querySelector('#collect')) bindCollect(s);
  if(main.querySelector('.wcard')) bindWordPick(s);
  if(main.querySelector('#grid')) bindGrid(s);
  if(main.querySelector('.trace-cell')) bindTrace();
}
function bindWordPick(s){
  let done=false;
  main.querySelectorAll('.wcard').forEach(card=>{
    card.onclick=()=>{
      if(done) return;
      const ok=card.dataset.ok==='1';
      const fb=main.querySelector('.fb');
      if(ok){
        done=true;
        card.classList.add('correct');
        if(fb){fb.textContent='잘 골랐어요! 🎉'; fb.classList.remove('bad');}
        if(s.log){score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        main.querySelectorAll('.wcard').forEach(c=>{if(c!==card)c.style.opacity=.4;});
      }else{
        card.classList.add('wrong');
        if(fb){fb.textContent='다시 한 번 생각해 봐요.'; fb.classList.add('bad');}
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>card.classList.remove('wrong'),350);
      }
    };
  });
}
function bindMatch(s){
  const board=main.querySelector('#match');
  const fb=main.querySelector('#matchFb');
  const cards=board.querySelectorAll('.match-card');
  const total=cards.length/2;
  let sel=null, paired=0, logged=false;
  cards.forEach(card=>{
    card.onclick=()=>{
      if(card.classList.contains('paired')) return;
      if(!sel){ sel=card; card.classList.add('sel'); return; }
      if(sel===card){ card.classList.remove('sel'); sel=null; return; }
      if(sel.dataset.pair===card.dataset.k && card.dataset.pair===sel.dataset.k){
        sel.classList.remove('sel'); sel.classList.add('paired'); card.classList.add('paired');
        sel=null; paired++;
        if(paired===total){
          fb.textContent='몸과 하는 일을 모두 잘 이었어요! 🎉'; fb.classList.remove('bad');
          if(s.log && !logged){logged=true; score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        }else{ fb.textContent='좋아요! 다음 짝도 이어 봐요.'; fb.classList.remove('bad'); }
      }else{
        const w1=sel, w2=card;
        w1.classList.add('miss'); w2.classList.add('miss');
        fb.textContent='짝이 아니에요. 몸으로 하는 일을 다시 생각해 봐요.'; fb.classList.add('bad');
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>{w1.classList.remove('miss','sel'); w2.classList.remove('miss');},350);
        sel=null;
      }
    };
  });
}
function bindCollect(s){
  const board=main.querySelector('#collect');
  const fb=main.querySelector('#collectFb');
  const chips=board.querySelectorAll('.chip');
  const targets=board.querySelectorAll('.chip[data-hit="1"]').length;
  let painted=0, logged=false;
  chips.forEach(chip=>{
    chip.onclick=()=>{
      if(chip.classList.contains('painted')) return;
      if(chip.dataset.hit==='1'){
        chip.classList.add('painted'); painted++;
        if(painted===targets){
          chips.forEach(c=>{if(c.dataset.hit!=='1')c.classList.add('done-dim');});
          fb.textContent='주제에 맞는 낱말을 모두 찾았어요! 🎉'; fb.classList.remove('bad');
          if(s.log && !logged){logged=true; score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        }else{ fb.textContent=`좋아요! ${painted}개 찾았어요. 더 찾아봐요.`; fb.classList.remove('bad'); }
      }else{
        chip.classList.add('miss');
        fb.textContent='이 낱말은 주제에 맞지 않아요. 다시 살펴봐요.'; fb.classList.add('bad');
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>chip.classList.remove('miss'),350);
      }
    };
  });
}
function bindTrace(){
  const cells=main.querySelectorAll('.trace-cell');
  const fb=main.querySelector('#traceFb');
  const total=cells.length;
  let done=0;
  cells.forEach(c=>{
    c.onclick=()=>{
      if(c.classList.contains('done')) return;
      c.classList.add('done'); done++;
      if(done===total){ fb.innerHTML='모두 따라 썼어요! 또박또박 잘 썼어요. 🎉'; }
      else { fb.innerHTML=`잘하고 있어요! <b>${done}</b>글자 따라 썼어요.`; }
    };
  });
}
function bindGrid(s){
  const board=main.querySelector('#grid');
  const fb=main.querySelector('#gridFb');
  const answer=board.dataset.answer.split(',').map(Number);
  const cells=board.querySelectorAll('.gcell');
  let found=0, logged=false;
  cells.forEach((cell,idx)=>{
    cell.onclick=()=>{
      if(cell.classList.contains('found')) return;
      if(answer.includes(idx)){
        cell.classList.add('found'); found++;
        if(found===answer.length){
          fb.textContent='낱말을 모두 찾았어요! \uD83C\uDF89'; fb.classList.remove('bad');
          if(s.log && !logged){logged=true; score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        }else{ fb.textContent='좋아요! '+found+'글자 찾았어요.'; fb.classList.remove('bad'); }
      }else{
        cell.classList.add('miss');
        fb.textContent='그 글자는 아니에요. 다시 찾아봐요.'; fb.classList.add('bad');
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>cell.classList.remove('miss'),350);
      }
    };
  });
}
prevB.onclick=()=>{if(cur>0){cur--; render();}};
nextB.onclick=()=>{if(cur<slides.length-1){cur++; render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextB.click();if(e.key==='ArrowLeft')prevB.click();});
document.getElementById('hint').onclick=()=>{
  if(main.querySelector('#match')) alert('힌트: 왼쪽을 하나 누른 뒤, 어울리는 짝을 오른쪽에서 눌러요.');
  else if(main.querySelector('#grid')) alert('힌트: 찾을 낱말의 글자를 차례대로 글자판에서 찾아 눌러요.');
  else if(main.querySelector('#collect')) alert('힌트: 주제에 맞는 낱말만 모두 눌러요. 천천히 읽어 보면 알 수 있어요.');
  else if(main.querySelector('.wcard')) alert('힌트: 그림과 설명을 천천히 떠올려 보면 알맞은 낱말을 찾을 수 있어요.');
  else alert('힌트: 천천히 소리 내어 읽어 보면 답을 찾을 수 있어요.');
};
document.getElementById('replay').onclick=()=>{/* 음성 보조층 — 추후 mp3 연결 */};
render();
</script>

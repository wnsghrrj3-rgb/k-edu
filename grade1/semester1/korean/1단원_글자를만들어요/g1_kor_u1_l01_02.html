<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu_tracker.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글자를 만들어요 · 단원 시작</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --c-main:#42A5F5; --c-deep:#1976D2; --c-soft:#E3F2FD; --c-sub:#64B5F6;
  --c-ink:#1565C0; --c-bg:#F0F7FF; --c-emph:#DC2626;
  --c-ja:#42A5F5;
  --c-mo:#FF8A65;
  --fs-title:clamp(20px,5.2cqw,32px);
  --fs-heading:clamp(17px,4.2cqw,24px);
  --fs-body:clamp(15px,3.6cqw,21px);
  --fs-caption:clamp(12px,2.7cqw,16px);
  --fs-label:clamp(11px,2.3cqw,14px);
  --em-sm:clamp(28px,6cqw,40px); --em-md:clamp(40px,9cqw,60px); --em-lg:clamp(54px,12cqw,80px);
}
*{margin:0; padding:0; box-sizing:border-box;}
body{background:var(--c-bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; font-family:'Jua',sans-serif;}

@keyframes ka-fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
@keyframes ka-pop{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.12);}100%{opacity:1; transform:scale(1);}}
@keyframes ka-popBig{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes ka-shake{0%,100%{transform:none;}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
@keyframes ka-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.ka{
  container-type:inline-size; background:#fff;
  border-radius:clamp(16px,3cqw,24px); aspect-ratio:5/4;
  padding:clamp(14px,3cqw,22px) clamp(18px,4cqw,32px);
  font-family:'Jua',sans-serif; color:#333;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  display:flex; flex-direction:column; max-width:1024px; width:100%; margin:0 auto;
}
.ka-h{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); margin-bottom:clamp(12px,3cqw,18px);}
.ka-lb{background:#F4F4F8; border:none; padding:clamp(5px,1.4cqw,8px) clamp(8px,2cqw,14px); border-radius:clamp(8px,1.8cqw,12px); color:#555; font-family:inherit; font-size:var(--fs-label); display:flex; align-items:center; gap:5px; flex-shrink:0;}
.ka-bar{flex:1; height:clamp(3px,.7cqw,5px); background:var(--c-bg); border-radius:999px; overflow:hidden;}
.ka-bar>div{height:100%; background:var(--c-main); border-radius:999px; transition:width .3s;}
.ka-pg{color:var(--c-deep); font-family:'Nunito',sans-serif; font-weight:800; font-size:var(--fs-label); flex-shrink:0;}
.ka-sc{background:#FFF8E1; color:#F57F17; padding:clamp(3px,.9cqw,5px) clamp(8px,2cqw,12px); border-radius:999px; font-size:var(--fs-caption); flex-shrink:0; display:flex; align-items:center; gap:4px;}

.ka-m{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; text-align:center;}
.ka-tag{background:#FFF8E1; color:#F57F17; padding:clamp(3px,1cqw,6px) clamp(10px,2.4cqw,14px); border-radius:30px; font-size:var(--fs-caption); margin-bottom:clamp(8px,2cqw,12px); display:inline-block;}
.ka-t{font-size:var(--fs-title); line-height:1.4; color:var(--c-deep); margin-bottom:clamp(12px,3cqw,18px); font-weight:400; animation:ka-fadeUp .4s .15s ease both;}
.ka-bub{background:var(--c-soft); border-radius:clamp(10px,2.4cqw,16px); padding:clamp(10px,2.5cqw,16px) clamp(14px,3.4cqw,22px); font-size:var(--fs-body); line-height:1.7; color:#333; max-width:600px; animation:ka-fadeUp .4s .4s ease both;}
.emph{color:var(--c-emph);}

.build{display:flex; align-items:center; gap:clamp(8px,2cqw,14px); flex-wrap:wrap; justify-content:center; margin:clamp(8px,2cqw,14px) 0;}
.syl{width:clamp(64px,15cqw,104px); height:clamp(64px,15cqw,104px); background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(14px,3cqw,22px); display:grid; place-items:center; font-size:clamp(36px,8cqw,58px); color:var(--c-deep); box-shadow:0 5px 0 var(--c-soft); animation:ka-pop .5s ease both;}
.jamo{width:clamp(52px,12cqw,84px); height:clamp(52px,12cqw,84px); border-radius:clamp(12px,2.6cqw,18px); display:grid; place-items:center; font-size:clamp(30px,6.5cqw,48px); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.12); animation:ka-pop .5s ease both;}
.jamo.ja{background:var(--c-ja);} .jamo.mo{background:var(--c-mo);}
.op{font-size:clamp(24px,5cqw,38px); color:#aaa;}
.legend{display:flex; gap:clamp(12px,3cqw,20px); font-size:var(--fs-caption); margin-top:clamp(8px,2cqw,12px); flex-wrap:wrap; justify-content:center;}
.legend span{display:flex; align-items:center; gap:6px;}
.dot{width:clamp(14px,3cqw,18px); height:clamp(14px,3cqw,18px); border-radius:5px;}
.dot.ja{background:var(--c-ja);} .dot.mo{background:var(--c-mo);}

/* 단원 표지용 큰 이모지 */
.cover-emojis{display:flex; gap:clamp(10px,2.5cqw,18px); flex-wrap:wrap; justify-content:center; margin:clamp(10px,2.5cqw,16px) 0; font-size:var(--em-lg);}
.cover-emojis>span{animation:ka-bounce 1.8s ease-in-out infinite;}
.cover-emojis>span:nth-child(2){animation-delay:.3s;}
.cover-emojis>span:nth-child(3){animation-delay:.6s;}

/* 자모음자 친구들 — 한 줄 또는 두 줄로 늘어놓기 */
.jamo-line{display:flex; gap:clamp(5px,1.2cqw,8px); flex-wrap:wrap; justify-content:center; margin:clamp(6px,1.5cqw,10px) 0;}
.jamo-line .jamo{width:clamp(40px,9cqw,58px); height:clamp(40px,9cqw,58px); font-size:clamp(22px,5cqw,34px); border-radius:clamp(8px,1.8cqw,12px);}

/* 동물 카드 행 — 동물 이모지 + 자모음자 */
.animal-row{display:flex; align-items:center; gap:clamp(8px,2cqw,14px); flex-wrap:wrap; justify-content:center; margin:clamp(8px,2cqw,14px) 0;}
.animal{font-size:var(--em-md);}
.card-pair{display:flex; gap:clamp(4px,1cqw,6px);}
.card-pair .jamo{width:clamp(40px,9cqw,58px); height:clamp(40px,9cqw,58px); font-size:clamp(22px,5cqw,34px); border-radius:clamp(8px,1.8cqw,12px);}

/* 고르기 */
.picks{display:flex; gap:clamp(10px,2.4cqw,16px); flex-wrap:wrap; justify-content:center; margin-top:clamp(8px,2cqw,12px);}
.pick{min-width:clamp(72px,16cqw,100px); padding:clamp(12px,3cqw,18px) clamp(14px,3cqw,20px); border-radius:clamp(14px,3cqw,20px); border:clamp(3px,.7cqw,4px) solid var(--c-soft); background:#fff; font-family:'Jua'; font-size:clamp(26px,6cqw,42px); color:var(--c-deep); cursor:pointer; box-shadow:0 5px 0 var(--c-soft);}
.pick:active{transform:translateY(3px); box-shadow:0 2px 0 var(--c-soft);}
.pick.correct{background:var(--c-main); color:#fff; border-color:var(--c-deep); box-shadow:0 5px 0 var(--c-deep); animation:ka-popBig .5s ease;}
.pick.wrong{background:#FFE0E0; border-color:var(--c-emph); animation:ka-shake .35s;}
.slot{width:clamp(64px,15cqw,104px); height:clamp(64px,15cqw,104px); border:clamp(3px,.7cqw,4px) dashed var(--c-main); border-radius:clamp(14px,3cqw,22px); display:grid; place-items:center; font-size:clamp(36px,8cqw,58px); color:var(--c-main); background:#fff;}
.slot.filled{border-style:solid; background:var(--c-main); color:#fff; box-shadow:0 5px 0 var(--c-deep);}
.fb{margin-top:clamp(8px,2cqw,12px); min-height:26px; font-size:var(--fs-caption); color:var(--c-deep);}
.fb.bad{color:var(--c-emph);}

/* 단원 미리보기 카드 */
.preview-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(clamp(110px,24cqw,160px), 1fr)); gap:clamp(8px,2cqw,14px); max-width:640px; margin-top:clamp(8px,2cqw,12px); width:100%;}
.preview-card{background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(12px,2.6cqw,18px); padding:clamp(10px,2.4cqw,16px) clamp(8px,2cqw,12px); display:flex; flex-direction:column; align-items:center; gap:6px;}
.preview-card .num{background:var(--c-main); color:#fff; width:clamp(28px,6cqw,38px); height:clamp(28px,6cqw,38px); border-radius:50%; display:grid; place-items:center; font-family:'Nunito'; font-weight:800; font-size:var(--fs-caption);}
.preview-card .label{font-size:clamp(14px,3.2cqw,18px); color:var(--c-deep); text-align:center; line-height:1.3;}

/* 푸터 */
.ka-f{display:grid; grid-template-columns:1fr 1.3fr 1fr 1.3fr; gap:clamp(5px,1.4cqw,8px); margin-top:clamp(10px,2.6cqw,15px);}
.ka-nav{background:#F4F4F8; color:#2A2A35; border:none; padding:clamp(8px,2.2cqw,12px) 6px; font-size:var(--fs-caption); border-radius:clamp(10px,2.5cqw,14px); cursor:pointer; font-family:inherit;}
.ka-nav-next{background:var(--c-main); color:#fff;}
.ka-nav:disabled{opacity:.4; cursor:default;}

@container (max-width:420px){
  .ka-lb span{display:none;}
  .ka-f{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb">📚 <span>차시 목록</span></button>
    <div class="ka-bar"><div id="bar" style="width:9%"></div></div>
    <span class="ka-pg" id="pg">1 / 11</span>
    <span class="ka-sc">⭐ <b id="score">0</b></span>
  </div>
  <div class="ka-m" id="main"></div>
  <div class="ka-f">
    <button class="ka-nav ka-nav-prev" id="prev">◁ 이전</button>
    <button class="ka-nav" id="replay">🔊 다시</button>

</div>

<script>
const tracker={
  answer(i,ok){ if(window.kedu&&window.kedu.recordAnswer) window.kedu.recordAnswer(LESSON_ID+'_s'+i, ok, null, null); },
  done(i){}
};
/* 11슬 (① 2 / ② 4 / ③ 3 / ④ 2) — 단원 도입 준비 학습 */
const slides=[
  // ── ① 만나기 (2) ──
  {stage:'만나기', tag:'① 첫 만남',
   t:'1단원 · 글자를 만들어요 ✏️',
   html:`<div class="cover-emojis"><span>🌳</span><span>🚂</span><span>🍇</span></div>
    <div class="ka-bub">자음자와 모음자가 만나면 글자가 돼요!<br>이번 단원에서는 <span class="emph">받침이 없는 글자</span>를 함께 만들어 봐요.</div>`},

  {stage:'만나기', tag:'① 우리 주변',
   t:'우리 주변에는 글자가 가득해요',

      <span>🏫</span><span>📚</span><span>🍱</span><span>🚌</span></div>
    <div class="ka-bub">학교, 가게, 책, 버스…<br>어디에서 글자를 본 적 있나요?</div>`},

  // ── ② 미리 만나기 (4) ──
  {stage:'엔진전반', tag:'② 자음자 친구들',
   t:'자음자는 파란색 친구들이에요',
   html:`<div class="jamo-line">
      <div class="jamo ja">ㄱ</div><div class="jamo ja">ㄴ</div><div class="jamo ja">ㄷ</div>
      <div class="jamo ja">ㄹ</div><div class="jamo ja">ㅁ</div><div class="jamo ja">ㅂ</div>
      <div class="jamo ja">ㅅ</div></div>
    <div class="jamo-line">
      <div class="jamo ja">ㅇ</div><div class="jamo ja">ㅈ</div><div class="jamo ja">ㅊ</div>
      <div class="jamo ja">ㅋ</div><div class="jamo ja">ㅌ</div><div class="jamo ja">ㅍ</div>
      <div class="jamo ja">ㅎ</div></div>
    <div class="ka-bub" style="font-size:var(--fs-caption); max-width:480px;">한글 놀이마당에서 만났던 친구들이지요?<br>이름을 천천히 말해 봐요.</div>`},

  {stage:'엔진전반', tag:'② 모음자 친구들',
   t:'모음자는 주황색 친구들이에요',
   html:`<div class="jamo-line">
      <div class="jamo mo">ㅏ</div><div class="jamo mo">ㅑ</div><div class="jamo mo">ㅓ</div>
      <div class="jamo mo">ㅕ</div><div class="jamo mo">ㅗ</div></div>
    <div class="jamo-line">
      <div class="jamo mo">ㅛ</div><div class="jamo mo">ㅜ</div><div class="jamo mo">ㅠ</div>
      <div class="jamo mo">ㅡ</div><div class="jamo mo">ㅣ</div></div>
    <div class="ka-bub" style="font-size:var(--fs-caption); max-width:480px;">모음자도 잘 기억나지요?<br>혼자서도 소리가 잘 나는 친구들이에요.</div>`},

  {stage:'엔진전반', tag:'② 글자 만들기 1',
   t:'동물이 들고 있는 카드로 글자를 만들면?',
   html:`<div class="animal-row">
      <div class="animal">🐰</div>
      <div class="card-pair"><div class="jamo ja">ㄴ</div><div class="jamo mo">ㅏ</div></div>
      <div class="animal">🦊</div>
      <div class="card-pair"><div class="jamo ja">ㅁ</div><div class="jamo mo">ㅜ</div></div>
      <div class="op">=</div>
      <div class="syl">나</div><div class="syl">무</div></div>
    <div class="ka-bub" style="font-size:var(--fs-caption);">ㄴ+ㅏ 는 ‘나’, ㅁ+ㅜ 는 ‘무’.<br>두 글자를 모으면 <span class="emph">나무</span> 가 돼요!</div>`},

  {stage:'엔진전반', tag:'② 글자 만들기 2',
   t:'한 번 더 만들어 볼까요?',
   html:`<div class="animal-row">
      <div class="animal">🐻</div>
      <div class="card-pair"><div class="jamo ja">ㄱ</div><div class="jamo mo">ㅣ</div></div>
      <div class="animal">🐼</div>
      <div class="card-pair"><div class="jamo ja">ㅊ</div><div class="jamo mo">ㅏ</div></div>
      <div class="op">=</div>
      <div class="syl">기</div><div class="syl">차</div></div>
    <div class="ka-bub" style="font-size:var(--fs-caption);">ㄱ+ㅣ 는 ‘기’, ㅊ+ㅏ 는 ‘차’.<br>모으면 <span class="emph">기차</span> 가 돼요! 🚂</div>`},

  // ── ③ 직접 해보기 (3) — 본 학습 아닌 점검 ──
  {stage:'엔진후반', tag:'③ 자음자 찾기', log:true, correct:'ㅅ',
   t:'‘사과’ 의 ‘사’ 에서 자음자는?',
   html:`<div class="build"><div class="animal" style="font-size:var(--em-md);">🍎</div><div class="syl">사</div></div>
    <div class="picks">
      <button class="pick" data-v="ㄱ">ㄱ</button>
      <button class="pick" data-v="ㅅ">ㅅ</button>
      <button class="pick" data-v="ㅏ">ㅏ</button></div>
    <div class="legend"><span><i class="dot ja"></i> 자음자</span><span><i class="dot mo"></i> 모음자</span></div>`},

  {stage:'엔진후반', tag:'③ 모음자 찾기', log:true, correct:'ㅗ',
   t:'‘포도’ 의 ‘포’ 에서 모음자는?',
   html:`<div class="build"><div class="animal" style="font-size:var(--em-md);">🍇</div><div class="syl">포</div></div>
    <div class="picks">
      <button class="pick" data-v="ㅍ">ㅍ</button>
      <button class="pick" data-v="ㅗ">ㅗ</button>
      <button class="pick" data-v="ㅣ">ㅣ</button></div>
    <div class="legend"><span><i class="dot ja"></i> 자음자</span><span><i class="dot mo"></i> 모음자</span></div>`},

  {stage:'엔진후반', tag:'③ 글자 만들기', log:true, correct:'가', slot:true,
   t:'ㄱ 과 ㅏ 가 만나면 무슨 글자?',
   html:`<div class="build">
      <div class="jamo ja">ㄱ</div><div class="op">+</div><div class="jamo mo">ㅏ</div>
      <div class="op">=</div><div class="slot" id="slotA">?</div></div>
    <div class="picks">
      <button class="pick" data-v="고">고</button>
      <button class="pick" data-v="가">가</button>
      <button class="pick" data-v="구">구</button></div>
    <div class="fb" id="fbA"></div>`},

  // ── ④ 다음 차시 안내 (2) ──
  {stage:'표현정리', tag:'④ 단원 미리보기',
   t:'이번 단원에서 배울 것 🔍',
   html:`<div class="preview-grid">
      <div class="preview-card"><div class="num">1</div><div class="label">자음자와 모음자<br>찾기</div></div>
      <div class="preview-card"><div class="num">2</div><div class="label">받침이 없는<br>글자 짜임</div></div>
      <div class="preview-card"><div class="num">3</div><div class="label">바른 자세로<br>읽고 쓰기</div></div>
      <div class="preview-card"><div class="num">4</div><div class="label">여러 가지<br>모음자</div></div>
    </div>
    <div class="ka-bub" style="font-size:var(--fs-caption); max-width:520px; margin-top:clamp(8px,2cqw,12px);">차근차근 한 가지씩 함께 해봐요!</div>`},

  {stage:'표현정리', tag:'④ 준비 끝',
   t:'다음 시간에는… 🌟',
   html:`<div class="ka-bub" style="text-align:center; max-width:560px;">
      <b>글자에서 자음자와 모음자 찾기</b><br>를 함께 해볼 거예요.</div>
    <div class="build" style="margin-top:clamp(10px,2.5cqw,16px);">
      <div class="syl">파</div><div class="op">=</div>
      <div class="jamo ja">ㅍ</div><div class="op">+</div><div class="jamo mo">ㅏ</div></div>
    <div class="ka-bub" style="font-size:var(--fs-caption); max-width:480px; margin-top:clamp(6px,1.5cqw,10px);">‘파’ 같은 글자도 둘로 나누어 볼 거예요!</div>`},
];

const LESSON_ID='g1_kor_u1_l01_02_v1';
const LESSON_MAX=30;
let cur=0, score=0, maxScore=0;
const main=document.getElementById('main');
const bar=document.getElementById('bar'), pg=document.getElementById('pg'), scoreEl=document.getElementById('score');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');

function render(){
  const s=slides[cur];
  main.innerHTML=`<span class="ka-tag">${s.tag}</span><h2 class="ka-t">${s.t}</h2>${s.html}`;
  bar.style.width=((cur+1)/slides.length*100)+'%';
  pg.textContent=`${cur+1} / ${slides.length}`;
  prevB.disabled=cur===0; nextB.disabled=cur===slides.length-1;
  if(cur===slides.length-1){ if(window.kedu&&window.kedu.recordLessonEnd) window.kedu.recordLessonEnd(score, LESSON_MAX); }
  tracker.done(cur);
  if(s.correct) bindPicks(s);
}
function bindPicks(s){
  let done=false;
  main.querySelectorAll('.pick').forEach(btn=>{
    btn.onclick=()=>{
      if(done) return;
      const ok=btn.dataset.v===s.correct;
      btn.classList.add(ok?'correct':'wrong');
      const slot=s.slot?main.querySelector('.slot'):null;
      const fb=main.querySelector('.fb');
      if(ok){
        done=true;
        if(slot){slot.textContent=s.correct; slot.classList.add('filled');}
        if(fb)fb.textContent='잘했어요! 🎉';
        if(s.log){score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        main.querySelectorAll('.pick').forEach(b=>{if(b!==btn)b.style.opacity=.4;});
      }else{
        if(fb){fb.textContent='다시 한 번 볼까요?'; fb.classList.add('bad');}
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>btn.classList.remove('wrong'),350);
      }
    };
  });
}
prevB.onclick=()=>{if(cur>0){cur--; render();}};
nextB.onclick=()=>{if(cur<slides.length-1){cur++; render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextB.click();if(e.key==='ArrowLeft')prevB.click();});
document.getElementById('hint').onclick=()=>{
  const s=slides[cur];
  const hints={
    '6':'사과의 ‘사’… 파란색 친구를 찾아봐요!',
    '7':'포도의 ‘포’… 주황색 친구를 찾아봐요!',
    '8':'ㄱ 옆에 ㅏ 가 서면? 천천히 소리 내 봐요.'
  };
  if(hints[cur]) alert('💡 ' + hints[cur]);
  else if(s.correct) alert('💡 글자를 천천히 소리 내어 읽어 봐요!');
};
document.getElementById('replay').onclick=()=>{/* 음성 보조층 — 추후 mp3 연결 */};
render();
</script>

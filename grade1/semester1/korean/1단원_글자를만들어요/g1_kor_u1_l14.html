<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu_tracker.js"></script>
<meta name="kedu-lesson-id" content="g1_kor_u1_l14_v1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글자를 만들어요 · 낱말 만들고 또박또박 읽기 (마무리)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
/* ===== 디자인 헌법 v11 준수: 저학년 토큰 (l09_11 / l13 동일 결) ===== */
:root{
  --c-main:#42A5F5; --c-deep:#1976D2; --c-soft:#E3F2FD; --c-sub:#64B5F6;
  --c-ink:#1565C0; --c-bg:#F0F7FF; --c-emph:#DC2626;
  --c-ja:#42A5F5; --c-mo:#FF8A65;
  --c-good:#66BB6A; --c-good-deep:#388E3C;
  --c-trace:#E0E0E0; --c-trace-on:#1976D2;
  --fs-title:clamp(20px,5.2cqw,32px);
  --fs-heading:clamp(17px,4.2cqw,24px);
  --fs-body:clamp(15px,3.6cqw,21px);
  --fs-caption:clamp(12px,2.7cqw,16px);
  --fs-label:clamp(11px,2.3cqw,14px);
  --em-sm:clamp(28px,6cqw,40px); --em-md:clamp(40px,9cqw,60px); --em-lg:clamp(54px,12cqw,80px);
}
*{margin:0; padding:0; box-sizing:border-box;}
body{background:var(--c-bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; font-family:'Jua',sans-serif;}

@keyframes ka-fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
@keyframes ka-pop{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.12);}100%{opacity:1; transform:scale(1);}}
@keyframes ka-popBig{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes ka-pulse{0%,100%{transform:scale(1); box-shadow:0 4px 14px rgba(66,165,245,.32);}50%{transform:scale(1.04); box-shadow:0 6px 20px rgba(66,165,245,.5);}}
@keyframes ka-shake{0%,100%{transform:none;}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
@keyframes ka-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

.ka{
  container-type:inline-size; background:#fff;
  border-radius:clamp(16px,3cqw,24px); aspect-ratio:5/4;
  padding:clamp(14px,3cqw,22px) clamp(18px,4cqw,32px);
  font-family:'Jua',sans-serif; color:#333;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  display:flex; flex-direction:column; max-width:1024px; width:100%; margin:0 auto;
}
.ka-h{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); margin-bottom:clamp(12px,3cqw,18px);}
.ka-lb{background:#F4F4F8; border:none; padding:clamp(5px,1.4cqw,8px) clamp(8px,2cqw,14px); border-radius:clamp(8px,1.8cqw,12px); color:#555; font-family:inherit; font-size:var(--fs-label); display:flex; align-items:center; gap:5px; flex-shrink:0; cursor:pointer;}
.ka-bar{flex:1; height:clamp(3px,.7cqw,5px); background:var(--c-bg); border-radius:999px; overflow:hidden;}
.ka-bar>div{height:100%; background:var(--c-main); border-radius:999px; transition:width .3s;}
.ka-pg{color:var(--c-deep); font-family:'Nunito',sans-serif; font-weight:800; font-size:var(--fs-label); flex-shrink:0;}
.ka-sc{background:#FFF8E1; color:#F57F17; padding:clamp(3px,.9cqw,5px) clamp(8px,2cqw,12px); border-radius:999px; font-size:var(--fs-caption); flex-shrink:0; display:flex; align-items:center; gap:4px;}

.ka-m{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; text-align:center;}
.ka-tag{background:#FFF8E1; color:#F57F17; padding:clamp(3px,1cqw,6px) clamp(10px,2.4cqw,14px); border-radius:30px; font-size:var(--fs-caption); margin-bottom:clamp(8px,2cqw,12px); display:inline-block;}
.ka-t{font-size:var(--fs-title); line-height:1.4; color:var(--c-deep); margin-bottom:clamp(12px,3cqw,18px); font-weight:400; animation:ka-fadeUp .4s .15s ease both;}
.ka-bub{background:var(--c-soft); border-radius:clamp(10px,2.4cqw,16px); padding:clamp(10px,2.5cqw,16px) clamp(14px,3.4cqw,22px); font-size:var(--fs-body); line-height:1.7; color:#333; max-width:600px; animation:ka-fadeUp .4s .4s ease both;}
.emph{color:var(--c-emph);}

/* 자모 / 글자 블록 */
.build{display:flex; align-items:center; gap:clamp(8px,2cqw,14px); flex-wrap:wrap; justify-content:center; margin:clamp(8px,2cqw,14px) 0;}
.syl{width:clamp(64px,15cqw,104px); height:clamp(64px,15cqw,104px); background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(14px,3cqw,22px); display:grid; place-items:center; font-size:clamp(36px,8cqw,58px); color:var(--c-deep); box-shadow:0 5px 0 var(--c-soft); animation:ka-pop .5s ease both;}
.syl.sm{width:clamp(52px,12cqw,80px); height:clamp(52px,12cqw,80px); font-size:clamp(28px,6.2cqw,44px);}
.jamo{width:clamp(52px,12cqw,84px); height:clamp(52px,12cqw,84px); border-radius:clamp(12px,2.6cqw,18px); display:grid; place-items:center; font-size:clamp(30px,6.5cqw,48px); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.12); animation:ka-pop .5s ease both;}
.jamo.ja{background:var(--c-ja);} .jamo.mo{background:var(--c-mo);}
.op{font-size:clamp(24px,5cqw,38px); color:#aaa;}

/* 자모 회상 보드 */
.jamo-wall{display:flex; flex-direction:column; gap:clamp(8px,2cqw,12px); max-width:680px; width:100%;}
.jamo-row{display:flex; flex-wrap:wrap; gap:clamp(4px,1cqw,7px); justify-content:center; align-items:center;}
.jamo-row .lbl{font-size:var(--fs-caption); color:#888; min-width:60px; text-align:right; margin-right:6px;}
.jchip{width:clamp(34px,7.6cqw,46px); height:clamp(34px,7.6cqw,46px); border-radius:clamp(7px,1.6cqw,10px); display:grid; place-items:center; font-family:'Jua'; font-size:clamp(18px,4cqw,26px); box-shadow:0 3px 0 rgba(0,0,0,.1);}
.jchip.ja{background:var(--c-ja); color:#fff;}
.jchip.mo{background:var(--c-mo); color:#fff;}

/* 픽 */
.picks{display:flex; gap:clamp(10px,2.4cqw,16px); flex-wrap:wrap; justify-content:center; margin-top:clamp(8px,2cqw,12px);}
.pick{min-width:clamp(72px,16cqw,100px); padding:clamp(12px,3cqw,18px) clamp(14px,3cqw,20px); border-radius:clamp(14px,3cqw,20px); border:clamp(3px,.7cqw,4px) solid var(--c-soft); background:#fff; font-family:'Jua'; font-size:clamp(26px,6cqw,42px); color:var(--c-deep); cursor:pointer; box-shadow:0 5px 0 var(--c-soft);}
.pick:active{transform:translateY(3px); box-shadow:0 2px 0 var(--c-soft);}
.pick.correct{background:var(--c-main); color:#fff; border-color:var(--c-deep); box-shadow:0 5px 0 var(--c-deep); animation:ka-popBig .5s ease;}
.pick.wrong{background:#FFE0E0; border-color:var(--c-emph); animation:ka-shake .35s;}

.slot{width:clamp(64px,15cqw,104px); height:clamp(64px,15cqw,104px); border:clamp(3px,.7cqw,4px) dashed var(--c-main); border-radius:clamp(14px,3cqw,22px); display:grid; place-items:center; font-size:clamp(36px,8cqw,58px); color:var(--c-main); background:#fff;}
.slot.filled{border-style:solid; background:var(--c-main); color:#fff; box-shadow:0 5px 0 var(--c-deep);}
.fb{margin-top:clamp(8px,2cqw,12px); min-height:26px; font-size:var(--fs-caption); color:var(--c-deep);}
.fb.bad{color:var(--c-emph);}

/* 그림 두 글자 골라요 */
.choose2{display:flex; align-items:center; gap:clamp(8px,2cqw,14px); justify-content:center; flex-wrap:wrap; margin-bottom:clamp(6px,1.5cqw,10px);}
.choose2 .pic{font-size:var(--em-lg);}
.choose2 .word-picks{display:flex; gap:clamp(10px,2.4cqw,16px); flex-wrap:wrap;}

/* 짝 잇기 — 모음자 ↔ 이름 */
.match-grid{display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,2.4cqw,16px); max-width:480px; width:100%;}
.match-col{display:flex; flex-direction:column; gap:clamp(8px,2cqw,12px);}
.match-cell{background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(12px,2.6cqw,18px); padding:clamp(8px,2cqw,12px); display:flex; align-items:center; justify-content:center; gap:clamp(6px,1.5cqw,10px); cursor:pointer; font-family:'Jua'; min-height:clamp(50px,11cqw,68px); box-shadow:0 4px 0 var(--c-soft);}
.match-cell .mc-mo{font-size:clamp(26px,5.8cqw,38px); color:var(--c-mo);}
.match-cell .mc-name{font-size:clamp(20px,4.6cqw,28px); color:var(--c-deep);}
.match-cell.sel{background:#FFF8E1; border-color:#FFB300;}
.match-cell.done{background:#E8F5E9; border-color:var(--c-good-deep); cursor:default; opacity:.85;}
.match-cell.miss{animation:ka-shake .35s;}

/* 보기 자모 박스 (지도서 142쪽 활동) */
.boxset{background:#FFFDE7; border:clamp(3px,.7cqw,4px) solid #FFB300; border-radius:clamp(12px,2.6cqw,16px); padding:clamp(8px,2cqw,12px); display:flex; flex-direction:column; align-items:center; gap:6px; max-width:520px; width:100%;}
.boxset .lbl{font-size:var(--fs-caption); color:#F57F17;}
.boxset .chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}

/* 또박또박 읽기 카드 */
.read-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(8px,2cqw,12px); max-width:520px; width:100%;}
.read-card{background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(12px,2.6cqw,16px); padding:clamp(10px,2.4cqw,14px); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:0 4px 0 var(--c-soft);}
.read-card .rc-word{font-size:clamp(22px,5cqw,32px); color:var(--c-deep);}
.read-card .rc-cnt{font-size:var(--fs-caption); color:#888;}
.read-card.read{background:#E8F5E9; border-color:var(--c-good-deep); animation:ka-popBig .4s ease;}
.read-card:active{transform:translateY(2px); box-shadow:0 2px 0 var(--c-soft);}

/* 글씨 따라 쓰기 — 점선 글자 클릭으로 채우기 */
.trace-grid{display:flex; gap:clamp(12px,3cqw,20px); flex-wrap:wrap; justify-content:center; max-width:640px;}
.trace-cell{display:flex; flex-direction:column; align-items:center; gap:6px;}
.trace-cell .t-pic{font-size:var(--em-md);}
.trace-syl{width:clamp(72px,16cqw,108px); height:clamp(72px,16cqw,108px); border:clamp(3px,.7cqw,4px) dashed var(--c-trace); border-radius:clamp(12px,2.6cqw,18px); display:grid; place-items:center; font-size:clamp(40px,9cqw,62px); color:var(--c-trace); cursor:pointer; background:#fff; font-family:'Jua'; transition:all .25s;}
.trace-syl.done{border-style:solid; border-color:var(--c-trace-on); color:var(--c-trace-on); background:#E3F2FD; box-shadow:0 4px 0 var(--c-soft); animation:ka-pop .4s ease;}
.trace-cell .t-word{font-size:var(--fs-caption); color:#888;}

/* 자기 평가 — 별 3차원 */
.sa-grid{display:flex; flex-direction:column; gap:clamp(8px,2cqw,12px); max-width:520px; width:100%;}
.sa-row{display:flex; align-items:center; gap:clamp(8px,2cqw,12px); background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(10px,2.4cqw,14px); padding:clamp(8px,2cqw,12px) clamp(10px,2.4cqw,14px);}
.sa-q{flex:1; font-size:var(--fs-body); color:var(--c-deep); text-align:left;}
.sa-stars{display:flex; gap:4px;}
.sa-star{font-size:clamp(22px,5cqw,32px); cursor:pointer; color:#ddd; transition:color .15s; user-select:none;}
.sa-star.on{color:#FFC107;}
.sa-msg{margin-top:clamp(8px,2cqw,12px); font-size:var(--fs-caption); color:var(--c-deep); min-height:24px;}

/* 단원 회상 — 7개 학습 목표 */
.wrap-row{display:flex; flex-direction:column; gap:clamp(6px,1.5cqw,10px); max-width:600px; width:100%;}
.wr{background:#fff; border:clamp(3px,.7cqw,4px) solid var(--c-soft); border-radius:clamp(10px,2.4cqw,14px); padding:clamp(8px,2cqw,12px) clamp(10px,2.4cqw,14px); display:flex; align-items:center; gap:clamp(8px,2cqw,12px); animation:ka-pop .4s ease both;}
.wr .w-no{width:clamp(28px,6cqw,38px); height:clamp(28px,6cqw,38px); background:var(--c-main); color:#fff; border-radius:50%; display:grid; place-items:center; font-family:'Nunito'; font-weight:800; font-size:var(--fs-caption); flex-shrink:0;}
.wr .w-txt{font-size:var(--fs-caption); color:#333; text-align:left;}

/* 푸터 */
.ka-f{display:grid; grid-template-columns:1fr 1.3fr 1fr 1.3fr; gap:clamp(5px,1.4cqw,8px); margin-top:clamp(10px,2.6cqw,15px);}
.ka-nav{background:#F4F4F8; color:#2A2A35; border:none; padding:clamp(8px,2.2cqw,12px) 6px; font-size:var(--fs-caption); border-radius:clamp(10px,2.5cqw,14px); cursor:pointer; font-family:inherit;}
.ka-nav-next{background:var(--c-main); color:#fff;}
.ka-nav:disabled{opacity:.4; cursor:default;}

@container (max-width:420px){
  .ka-lb span{display:none;}
  .ka-f{grid-template-columns:1fr 1fr;}
  .read-grid{grid-template-columns:1fr;}
}
</style>

</head>

<script>

const tracker={

/* ===== 슬라이드 정의 (15슬: ① 2 / ② 4 / ③ 5 / ④ 4)

   지도서 142~145쪽(국어 마무리·다지기) + 국활 14·16쪽(국어동) + 평가 자료 1·2.
   메커닉 = 회상 보드 / M5 짝 잇기(모음자-이름) / M1 비슷한 글자 고르기 /
             자모 결합 만들기(M1) / M11 읽기 카운트 / M8 따라쓰기(클릭 채움) /
             self_assessment 3차원 (수학 1단원 cycle 14 패턴).
   ===== */
const slides=[

  // ───────────── ① 만나기 (2) ─────────────
  {stage:'만나기', tag:'① 첫 만남',
   t:'1단원을 마무리해요 🎉',
   html:`<div class="build" style="gap:clamp(8px,2cqw,12px);">

      <div class="jamo mo" style="width:clamp(46px,10cqw,68px); height:clamp(46px,10cqw,68px); font-size:clamp(24px,5.4cqw,36px);">모</div>

      <div class="syl sm" style="font-size:clamp(22px,5cqw,32px);">말</div></div>
    <div class="ka-bub">자음자·모음자 → 글자 → 낱말!<br>오늘은 배운 내용을 다시 굴리고 <span class="emph">자기 점검</span> 해 봐요.</div>`},

  {stage:'만나기', tag:'① 학습 문제',
   t:'낱말을 만들고 또박또박 읽어요',
   html:`<div class="build" style="gap:clamp(10px,2.4cqw,16px);">
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
        <div style="font-size:var(--em-md);">📝</div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">

      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
        <div style="font-size:var(--em-md);">✏️</div>
        <div style="font-size:var(--fs-caption); color:#888;">쓰기</div></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
        <div style="font-size:var(--em-md);">⭐</div>
        <div style="font-size:var(--fs-caption); color:#888;">점검</div></div>
    </div>
    <div class="ka-bub">단원에서 배운 자음자·모음자로 낱말을 만들고,<br>또박또박 읽고 따라 써 본 뒤 스스로 점검해 봐요.</div>`},

  // ───────────── ② 엔진 전반: 회상·점검 (4) ─────────────

  {stage:'엔진전반', tag:'② 자모 회상',
   t:'우리가 배운 자음자와 모음자',
   html:`<div class="jamo-wall">
      <div class="jamo-row"><span class="lbl">자음자</span>
        <div class="jchip ja">ㄱ</div><div class="jchip ja">ㄴ</div><div class="jchip ja">ㄷ</div>
        <div class="jchip ja">ㄹ</div><div class="jchip ja">ㅁ</div><div class="jchip ja">ㅂ</div>
        <div class="jchip ja">ㅅ</div><div class="jchip ja">ㅇ</div><div class="jchip ja">ㅈ</div>
        <div class="jchip ja">ㅊ</div><div class="jchip ja">ㅋ</div><div class="jchip ja">ㅌ</div>
        <div class="jchip ja">ㅍ</div><div class="jchip ja">ㅎ</div>

        <div class="jchip mo">ㅕ</div><div class="jchip mo">ㅗ</div><div class="jchip mo">ㅛ</div>
        <div class="jchip mo">ㅜ</div><div class="jchip mo">ㅠ</div><div class="jchip mo">ㅡ</div>
        <div class="jchip mo">ㅣ</div>
      </div>
      <div class="jamo-row"><span class="lbl">+모음자</span>
        <div class="jchip mo">ㅐ</div><div class="jchip mo">ㅔ</div><div class="jchip mo">ㅒ</div>
        <div class="jchip mo">ㅖ</div><div class="jchip mo">ㅘ</div><div class="jchip mo">ㅙ</div>
        <div class="jchip mo">ㅚ</div><div class="jchip mo">ㅝ</div><div class="jchip mo">ㅞ</div>
        <div class="jchip mo">ㅟ</div><div class="jchip mo">ㅢ</div>

const LESSON_ID='g1_kor_u1_l14_v1';
const LESSON_MAX=60;
let cur=0, score=0, maxScore=0;
const main=document.getElementById('main');
const bar=document.getElementById('bar'), pg=document.getElementById('pg'), scoreEl=document.getElementById('score');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');

function render(){
  const s=slides[cur];
  main.innerHTML=`<span class="ka-tag">${s.tag}</span><h2 class="ka-t">${s.t}</h2>${s.html}`;
  bar.style.width=((cur+1)/slides.length*100)+'%';
  pg.textContent=`${cur+1} / ${slides.length}`;
  prevB.disabled=cur===0; nextB.disabled=cur===slides.length-1;
  if(cur===slides.length-1){ if(window.kedu&&window.kedu.recordLessonEnd) window.kedu.recordLessonEnd(score, LESSON_MAX); }
  tracker.done(cur);
  if(s.matchMode) bindMatch(s);
  else if(s.readMode) bindRead(s);
  else if(s.traceMode) bindTrace(s);
  else if(s.selfMode) bindSelf(s);
  else if(s.correct) bindPicks(s);
}

function bindPicks(s){
  let done=false;
  main.querySelectorAll('.pick').forEach(btn=>{
    btn.onclick=()=>{
      if(done) return;
      const ok=btn.dataset.v===s.correct;
      btn.classList.add(ok?'correct':'wrong');
      let target=null;
      if(s.slot) target=main.querySelector('.slot');
      else if(s.slotSel) target=main.querySelector(s.slotSel);
      const fb=main.querySelector('.fb');
      if(ok){
        done=true;
        if(target){target.textContent=s.correct; target.classList.add('filled');}
        if(fb)fb.textContent='잘했어요! 🎉';
        if(s.log!==false){score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        main.querySelectorAll('.pick').forEach(b=>{if(b!==btn)b.style.opacity=.4;});
      }else{
        if(fb){fb.textContent='다시 한 번 볼까요?'; fb.classList.add('bad');}
        if(s.log!==false)tracker.answer(cur,false);
        setTimeout(()=>btn.classList.remove('wrong'),350);
      }
    };
  });
}

function bindMatch(s){
  let sel=null, matched=0, total=4, logged=false;
  const cells=main.querySelectorAll('.match-cell');
  cells.forEach(c=>{
    c.onclick=()=>{
      if(c.classList.contains('done')) return;
      if(!sel){
        sel=c; c.classList.add('sel');
      }else if(sel===c){
        c.classList.remove('sel'); sel=null;
      }else{
        if(sel.dataset.side===c.dataset.side){
          sel.classList.remove('sel');
          sel=c; c.classList.add('sel');
          return;
        }
        if(sel.dataset.k===c.dataset.k){
          sel.classList.remove('sel'); sel.classList.add('done');
          c.classList.add('done');
          matched++;
          const fb=main.querySelector('.fb');
          if(matched===total){
            if(fb)fb.textContent='모두 이었어요! 🎉';
            if(!logged){score+=10; maxScore+=10; scoreEl.textContent=score; tracker.answer(cur,true); logged=true;}
          }else{
            if(fb)fb.textContent=`잘했어요! ${matched}/${total}`;
          }
          sel=null;
        }else{
          c.classList.add('miss');
          sel.classList.add('miss');
          const lastSel=sel;
          setTimeout(()=>{
            c.classList.remove('miss','sel');
            lastSel.classList.remove('miss','sel');
          },360);
          const fb=main.querySelector('.fb');
          if(fb){fb.textContent='다시 한 번 살펴봐요'; fb.classList.add('bad'); setTimeout(()=>fb.classList.remove('bad'),700);}
          if(!logged) tracker.answer(cur,false);
          sel=null;
        }
      }
    };
  });
}

function bindRead(s){
  main.querySelectorAll('.read-card').forEach(c=>{
    let cnt=0;
    const cntEl=c.querySelector('.rc-cnt');
    c.onclick=()=>{
      cnt++;
      cntEl.textContent=`읽은 횟수: ${cnt}`;
      c.classList.add('read');
      setTimeout(()=>c.classList.remove('read'),420);
    };
  });
}

function bindTrace(s){
  let done=0, total=main.querySelectorAll('.trace-syl').length;
  main.querySelectorAll('.trace-syl').forEach(t=>{
    t.onclick=()=>{
      if(t.classList.contains('done')) return;
      t.classList.add('done');
      done++;
      if(done===total){
        tracker.done(cur);
      }
    };
  });
}

function bindSelf(s){
  const picked={};
  const total=main.querySelectorAll('.sa-row').length;
  const msg=main.querySelector('#saMsg');
  main.querySelectorAll('.sa-row').forEach(row=>{
    const dim=row.dataset.dim;
    const stars=row.querySelectorAll('.sa-star');
    stars.forEach(st=>{
      st.onclick=()=>{
        const v=parseInt(st.dataset.v);
        picked[dim]=v;
        stars.forEach(s=>{
          s.classList.toggle('on', parseInt(s.dataset.v)<=v);
        });
        if(Object.keys(picked).length===total){
          const sum=Object.values(picked).reduce((a,b)=>a+b,0);
          const avg=sum/total;
          if(avg>=2.5) msg.textContent='✨ 단원 내용을 잘 익혔어요! 다음 단원도 자신 있게!';
          else if(avg>=1.5) msg.textContent='🌱 한 번 더 천천히 살펴보면 더 단단해질 거예요.';
          else msg.textContent='📚 어려운 글자를 다시 한 번 만나 봐요. 선생님과 함께 해도 좋아요.';
        }
      };
    });
  });
}

prevB.onclick=()=>{if(cur>0){cur--; render();}};
nextB.onclick=()=>{if(cur<slides.length-1){cur++; render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextB.click();if(e.key==='ArrowLeft')prevB.click();});

document.getElementById('hint').onclick=()=>{
  const hints={
    '3':'ㅐ는 ‘애’, ㅚ는 ‘외’, ㅟ는 ‘위’, ㅘ는 ‘와’ 소리예요.',
    '4':'🦵 다 + 리. ‘ㅏ’ 가 들어가야 ‘다’ 가 돼요.',
    '5':'🌰 도 + 토 + 리. ‘토’ 의 모음자는 ‘ㅗ’ 예요.',
    '6':'🤍 두 + 부. ㄷ+ㅜ → 두, ㅂ+ㅜ → 부!',
    '7':'🚂 기 + 차. ㄱ+ㅣ → 기, ㅊ+ㅏ → 차!',
    '8':'🦋 나 + 비. ㄴ+ㅏ → 나, ㅂ+ㅣ → 비!',
    '9':'카드를 한 번씩 누르며 천천히 또박또박 읽어 봐요.',
    '10':'점선 글자를 누르면 또렷한 글씨로 바뀌어요. 세 글자 모두 채워 봐요.',
    '11':'세 가지 점검 항목 모두 별을 골라야 메시지가 보여요.'
  };
  if(hints[cur]) alert('💡 ' + hints[cur]);
  else alert('💡 천천히 살펴봐요!');
};
document.getElementById('replay').onclick=()=>{/* 음성 보조층 — 추후 mp3 연결 */};
render();

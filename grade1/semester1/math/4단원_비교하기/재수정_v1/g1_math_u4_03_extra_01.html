// 시각 부품 함수
// ════════════════════════════════════════════════

function row(items, mode) {
  return '<div class="visual-row">' + items.map(it =>
    '<div class="visual-item"><div class="visual-emoji">' + it.e + '</div>' +
    (it.name ? '<div class="visual-name">' + it.name + '</div>' : '') + '</div>'
  ).join('') + '</div>';
}

function bars(items) {
  return '<div class="visual-stack">' + items.map(it =>
    '<div class="visual-bar" style="width:' + it.w + '%;background:linear-gradient(90deg,' + it.c + ' 0%,' + lighten(it.c) + ' 100%);border-color:' + darken(it.c) + ';"><span class="visual-bar-label">' + it.name + '</span></div>'
  ).join('') + '</div>';
}

function barsAligned(items) {
  return bars(items);
}

function three(items) {
  return '<div class="visual-three">' + items.map(it =>
    '<div class="visual-item"><div class="visual-emoji" style="font-size:clamp(' + (40+it.w/3) + 'px,' + (6+it.w/15) + 'vw,' + (60+it.w/2) + 'px);">' + it.e + '</div><div class="visual-name">' + it.name + '</div></div>'
  ).join('') + '</div>';
}

function lighten(hex) {
  const map = {'#FFA726':'#FFD54F','#42A5F5':'#90CAF9','#66BB6A':'#A5D6A7','#EF5350':'#EF9A9A','#AB47BC':'#CE93D8','#26A69A':'#80CBC4'};
  return map[hex] || hex;
}
function darken(hex) {
  const map = {'#FFA726':'#F57C00','#42A5F5':'#1565C0','#66BB6A':'#388E3C','#EF5350':'#C62828','#AB47BC':'#7B1FA2','#26A69A':'#00897B'};
  return map[hex] || hex;
}

QUESTIONS.forEach((q, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');
  slide.dataset.slide = String(i + 1);
  slide.innerHTML =
    '<h1 class="q-title">문제 ' + (i + 1) + ' / 20</h1>' +
    '<div class="q-sub">' + q.q + '</div>' +
    q.visual +
    '<div class="choices">' +
      q.choices.map((c, j) =>
        '<button class="choice" data-idx="' + j + '" data-q="' + i + '">' + c + '</button>'
      ).join('') +
    '</div>' +
    '<div class="feedback" id="fb-' + i + '">정답이에요! ⭐</div>';
  slides.appendChild(slide);
});

// 결과 슬
const resultSlide = document.createElement('div');
resultSlide.className = 'slide';
resultSlide.dataset.slide = '21';
resultSlide.innerHTML =
  '<div class="result-stage">' +
    '<div class="result-icon" id="r-icon">🎉</div>' +
    '<div class="result-score" id="r-score">⭐ 0 / 100</div>' +
    '<div class="result-stars" id="r-stars">⭐⭐⭐⭐⭐</div>' +
    '<div class="result-msg" id="r-msg">모두 맞혔어요! 정말 잘 했어요</div>' +
    '<button class="retry-btn" onclick="retry()">🔁 다시 풀기</button>' +
  '</div>';
slides.appendChild(resultSlide);

// ════════════════════════════════════════════════
// 진행·점수·메카닉
// ════════════════════════════════════════════════

const TOTAL = 21;
let cur = 0;
let score = 0;
let correctCount = 0;
const answered = new Array(20).fill(false);

function updateUI() {
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === cur));
  document.getElementById('pg').textContent = (cur+1) + ' / ' + TOTAL;
  document.getElementById('bar').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('prev').disabled = (cur === 0);

  // 다음 버튼: 문제 슬에서는 정답 맞히면 활성화. 결과 슬에서는 비활성.
  const next = document.getElementById('next');
  if (cur === TOTAL - 1) {
    next.disabled = true;
    next.classList.remove('hl');
  } else if (cur < 20) {
    next.disabled = !answered[cur];
    next.classList.toggle('hl', answered[cur]);
  } else {
    next.disabled = false;
  }
}

function goNext() {
  if (cur < TOTAL - 1) {
    cur++;
    updateUI();
    if (cur === 20) renderResult();
  }
}
function goPrev() { if (cur > 0) { cur--; updateUI(); } }

let muted = false;
function toggleMute() {
  muted = !muted;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
}

function addScore(n) {
  score += n;
  document.getElementById('score').textContent = '⭐ ' + score;
  if (window.keduTracker && window.keduTracker.recordScore) {
    window.keduTracker.recordScore('g1_math_u4_03_extra_01', score);
  }
}

// 4지선다 클릭 처리
document.addEventListener('click', e => {
  const btn = e.target.closest('.choice');
  if (!btn) return;
  const qIdx = parseInt(btn.dataset.q);
  const cIdx = parseInt(btn.dataset.idx);
  if (answered[qIdx]) return;

  const ans = QUESTIONS[qIdx].ans;
  if (cIdx === ans) {
    btn.classList.add('correct');
    answered[qIdx] = true;
    correctCount++;
    addScore(5);
    document.getElementById('fb-' + qIdx).classList.add('show');
    document.querySelectorAll('.slide.active .choice').forEach(b => b.disabled = true);
    updateUI();
  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
});

function renderResult() {
  const pct = Math.round((correctCount / 20) * 100);
  document.getElementById('r-score').textContent = '⭐ ' + score + ' / 100';

  let stars, msg, icon;
  if (pct === 100) { stars = '⭐⭐⭐⭐⭐'; msg = '모두 맞혔어요! 정말 잘 했어요'; icon = '🎉'; }
  else if (pct >= 80) { stars = '⭐⭐⭐⭐'; msg = '거의 다 맞혔어요! 잘 했어요'; icon = '😊'; }
  else if (pct >= 60) { stars = '⭐⭐⭐'; msg = '잘 했어요! 한 번 더 살펴봐요'; icon = '💪'; }
  else if (pct >= 40) { stars = '⭐⭐'; msg = '조금 더 살펴봐요'; icon = '🤔'; }
  else { stars = '⭐'; msg = '한 번 더 학습해 봐요'; icon = '📚'; }

  document.getElementById('r-stars').textContent = stars;
  document.getElementById('r-msg').textContent = msg;
  document.getElementById('r-icon').textContent = icon;
}

function retry() {
  cur = 0;
  score = 0;
  correctCount = 0;
  answered.fill(false);
  document.getElementById('score').textContent = '⭐ 0';
  document.querySelectorAll('.choice').forEach(b => {
    b.classList.remove('correct', 'wrong');
    b.disabled = false;
  });
  document.querySelectorAll('.feedback').forEach(f => f.classList.remove('show'));
  updateUI();
}

updateUI();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  tb_21 모으기와 가르기 (1) — 메카닉 데모 v4
  ────────────────────────────────────────────────────────
  v3 빵꾸 정정:
    ❌ 사과 width·height clamp(48px, 7.5vw, 72px) = v2보다 큼 → viewport 다시 깨짐
    ❌ font-size clamp(34px, 5.5vw, 56px) 너무 큼

  v4 박힘:
    ✅ 사과 width·height clamp(32px, 4.8vw, 48px) (v3의 65%)
    ✅ font-size clamp(22px, 3.5vw, 36px)
    ✅ 모든 영역 min-height·max-height 명확
    ✅ flex 결 단순화 (이중 flex: 1 박힘 제거)

  본질 결 (v3 그대로):
    슬1 모으기: 사과 5개 좌·우 흩어짐 → 한 개씩 가운데 박음 (5번 손가락 행위)
    슬2 가르기: 사과 5개 가운데 → 한 개씩 좌·우 박음 (5번 손가락 행위)
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="kedu-lesson-id" content="g1_math_tb_21_demo_v4">
<title>모으기와 가르기 · K-edu 1학년 수학</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../math-common.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #F0F7FF;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
  touch-action: manipulation;
}

@keyframes ka-fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ka-pop { 0% { opacity: 0; transform: scale(0.3); } 60% { opacity: 1; transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
@keyframes ka-pulse { 0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(66,165,245,0.32); } 50% { transform: scale(1.04); box-shadow: 0 6px 20px rgba(66,165,245,0.5); } }
@keyframes ka-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,167,38,0.35); } 50% { box-shadow: 0 0 0 8px rgba(255,167,38,0.15); } }
@keyframes ka-celebrate { 0% { transform: scale(1); } 30% { transform: scale(1.15) rotate(-3deg); } 60% { transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }

.ka {
  background: white; width: 100vw; height: 100vh; height: 100dvh;
  padding: clamp(8px, 1.5vw, 14px) clamp(12px, 2.2vw, 22px);
  color: #333; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}

.ka-h { display: flex; align-items: center; gap: clamp(6px, 1.2vw, 10px); margin-bottom: clamp(6px, 1.2vw, 10px); flex-shrink: 0; }
.ka-lb { background: #F4F4F8; border: none; padding: clamp(4px, 0.9vw, 7px) clamp(8px, 1.5vw, 12px); border-radius: clamp(8px, 1.5vw, 12px); cursor: pointer; font-family: inherit; color: #555; flex-shrink: 0; font-size: clamp(11px, 1.7vw, 14px); }
.ka-bar { flex: 1; height: clamp(3px, 0.5vw, 5px); background: #F0F7FF; border-radius: 999px; overflow: hidden; min-width: clamp(40px, 6vw, 80px); }
.ka-bar > div { height: 100%; background: #42A5F5; border-radius: 999px; transition: width 0.45s ease; }
.ka-pg { color: #1976D2; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: clamp(11px, 1.7vw, 14px); flex-shrink: 0; }
.ka-mute { background: #F4F4F8; border: none; padding: clamp(4px, 0.9vw, 7px); border-radius: clamp(8px, 1.5vw, 12px); cursor: pointer; flex-shrink: 0; color: #1976D2; font-size: clamp(12px, 2vw, 16px); width: clamp(28px, 4.5vw, 36px); height: clamp(28px, 4.5vw, 36px); display: flex; align-items: center; justify-content: center; }

.ka-m { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; position: relative; overflow: hidden; }
.slide { display: none; flex-direction: column; align-items: center; height: 100%; width: 100%; animation: ka-fadeUp 0.45s ease both; }
.slide.active { display: flex; }
.slide-title { font-size: clamp(18px, 3.2vw, 28px); margin: 0 0 clamp(4px, 0.8vw, 7px); line-height: 1.3; color: #1976D2; font-weight: 400; text-align: center; flex-shrink: 0; }
.slide-sub   { font-size: clamp(12px, 2vw, 16px); color: #607D8B; margin-bottom: clamp(8px, 1.5vw, 12px); text-align: center; flex-shrink: 0; }

/* ─── 사과 (컴팩트) ─── */
.apple {
  font-size: clamp(22px, 3.5vw, 36px);
  display: inline-flex; align-items: center; justify-content: center;
  width: clamp(32px, 4.8vw, 48px); height: clamp(32px, 4.8vw, 48px);
  cursor: grab; user-select: none;
  touch-action: none;
  border-radius: 50%;
  transition: transform 0.2s, filter 0.2s;
  position: relative;
  line-height: 1;
  animation: ka-pop 0.4s ease both;
  flex-shrink: 0;
}
.apple:active { cursor: grabbing; transform: scale(1.15); }
.apple.dragging { z-index: 100; transform: scale(1.2); filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25)); }
.apple.placed { animation: ka-pop 0.4s ease both, ka-celebrate 0.5s ease 0.4s; cursor: default; }

/* ─── 슬1 모으기 ─── */
.merge-stage {
  flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: center;
  width: 100%; max-width: var(--mw-md); padding: clamp(6px, 1.2vw, 10px);
  gap: clamp(8px, 1.5vw, 14px);
  min-height: 0;
}
.merge-sources {
  display: flex; gap: clamp(8px, 1.5vw, 14px);
  flex-shrink: 0;
}
.source-pile {
  flex: 1;
  display: flex; flex-wrap: wrap; gap: clamp(3px, 0.7vw, 6px);
  align-items: center; justify-content: center;
  padding: clamp(6px, 1.2vw, 10px);
  background: #F8FBFF; border-radius: clamp(10px, 1.6vw, 14px);
  min-height: clamp(45px, 7vw, 65px);
}
.merge-arrow {
  text-align: center; font-size: clamp(14px, 2.4vw, 20px); color: #FFA726;
  flex-shrink: 0; line-height: 1;
}
.merge-bowl {
  width: 100%;
  background: #FFF8E1; border: 3px dashed #FFD54F; border-radius: clamp(12px, 2vw, 16px);
  display: flex; flex-wrap: wrap; gap: clamp(3px, 0.7vw, 6px);
  align-items: center; justify-content: center;
  padding: clamp(8px, 1.5vw, 12px);
  min-height: clamp(60px, 9vw, 85px);
  position: relative;
  transition: background 0.3s, border-color 0.3s;
  animation: ka-glow 2s ease-in-out infinite;
  flex-shrink: 0;
}
.merge-bowl.has-items { animation: none; }
.merge-bowl.full { background: #FFE082; border-color: #FFB300; border-style: solid; }
.merge-count {
  position: absolute; top: clamp(-10px, -1.5vw, -12px); right: clamp(8px, 1.5vw, 12px);
  background: #F57F17; color: white;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  padding: clamp(2px, 0.5vw, 4px) clamp(8px, 1.5vw, 12px);
  border-radius: 999px;
  font-size: clamp(12px, 2vw, 16px);
  box-shadow: 0 2px 8px rgba(245,127,23,0.4);
  min-width: clamp(36px, 5.5vw, 48px); text-align: center;
}

/* ─── 슬2 가르기 ─── */
.split-stage {
  flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: center;
  width: 100%; max-width: var(--mw-md); padding: clamp(6px, 1.2vw, 10px);
  gap: clamp(8px, 1.5vw, 14px);
  min-height: 0;
}
.split-source {
  width: 100%;
  background: #FFF8E1; border: 3px solid #FFD54F; border-radius: clamp(12px, 2vw, 16px);
  padding: clamp(8px, 1.5vw, 12px);
  display: flex; flex-wrap: wrap; gap: clamp(3px, 0.7vw, 6px);
  align-items: center; justify-content: center;
  min-height: clamp(50px, 8vw, 70px);
  position: relative;
  flex-shrink: 0;
}
.split-source-count {
  position: absolute; top: clamp(-10px, -1.5vw, -12px); left: clamp(8px, 1.5vw, 12px);
  background: #F57F17; color: white;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  padding: clamp(2px, 0.5vw, 4px) clamp(8px, 1.5vw, 12px);
  border-radius: 999px;
  font-size: clamp(12px, 2vw, 16px);
  box-shadow: 0 2px 8px rgba(245,127,23,0.4);
}
.split-arrow {
  text-align: center; font-size: clamp(14px, 2.4vw, 20px); color: #1976D2;
  flex-shrink: 0; line-height: 1;
}
.split-bins {
  display: flex; gap: clamp(8px, 1.5vw, 14px);
  flex-shrink: 0;
}
.split-bin {
  flex: 1;
  background: #E3F2FD; border: 3px dashed #90CAF9; border-radius: clamp(10px, 1.6vw, 14px);
  padding: clamp(8px, 1.5vw, 12px);
  display: flex; flex-wrap: wrap; gap: clamp(3px, 0.7vw, 6px);
  align-items: center; justify-content: center;
  position: relative;
  min-height: clamp(60px, 9vw, 85px);
  transition: background 0.3s, border-color 0.3s;
}
.split-bin.bin-right { background: #FCE4EC; border-color: #F48FB1; }
.split-bin.has-items { border-style: solid; }
.split-bin-count {
  position: absolute; top: clamp(-10px, -1.5vw, -12px); right: clamp(8px, 1.5vw, 12px);
  background: white;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  padding: clamp(2px, 0.5vw, 4px) clamp(8px, 1.5vw, 12px);
  border-radius: 999px;
  font-size: clamp(12px, 2vw, 16px);
  color: #1976D2;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  min-width: clamp(36px, 5.5vw, 48px); text-align: center;
}
.split-bin.bin-right .split-bin-count { color: #C2185B; }

.ka-f { display: flex; justify-content: space-between; align-items: center; padding-top: clamp(6px, 1.2vw, 10px); flex-shrink: 0; }
.ka-prev, .ka-next {
  background: #1976D2; color: white; border: none;
  padding: clamp(6px, 1.2vw, 10px) clamp(14px, 2.6vw, 22px);
  border-radius: clamp(10px, 1.7vw, 14px);
  font-family: inherit; font-size: clamp(12px, 2vw, 16px);
  cursor: pointer;
  transition: background 0.2s;
}
.ka-prev { background: #B0BEC5; }
.ka-next:hover { background: #1565C0; }
.ka-next.hl { animation: ka-pulse 1.4s ease-in-out infinite; }
.ka-prev:disabled, .ka-next:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
</style>
</head>
<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="window.history.back()">← 종료</button>
    <div class="ka-bar"><div id="bar" style="width:50%"></div></div>
    <div class="ka-pg" id="pg">1 / 2</div>
    <button class="ka-mute" id="mute" onclick="toggleMute()">🔊</button>
  </div>

  <div class="ka-m">
    <!-- 슬1: 모으기 -->
    <div class="slide active" data-slide="1">
      <h1 class="slide-title">사과를 모아 볼까요?</h1>
      <div class="slide-sub">사과를 하나씩 가운데로 옮겨 보세요</div>
      <div class="merge-stage">
        <div class="merge-sources">
          <div class="source-pile">
            <span class="apple" data-id="L1">🍎</span>
            <span class="apple" data-id="L2">🍎</span>
          </div>
          <div class="source-pile">
            <span class="apple" data-id="R1">🍎</span>
            <span class="apple" data-id="R2">🍎</span>
            <span class="apple" data-id="R3">🍎</span>
          </div>
        </div>
        <div class="merge-arrow">⬇</div>
        <div class="merge-bowl" id="merge-bowl">
          <div class="merge-count" id="merge-count">0</div>
        </div>
      </div>
    </div>

    <!-- 슬2: 가르기 -->
    <div class="slide" data-slide="2">
      <h1 class="slide-title">사과를 갈라 볼까요?</h1>
      <div class="slide-sub">사과를 하나씩 두 자리로 나눠 보세요</div>
      <div class="split-stage">
        <div class="split-source" id="split-source">
          <div class="split-source-count" id="split-source-count">5</div>
          <span class="apple" data-id="S1">🍎</span>
          <span class="apple" data-id="S2">🍎</span>
          <span class="apple" data-id="S3">🍎</span>
          <span class="apple" data-id="S4">🍎</span>
          <span class="apple" data-id="S5">🍎</span>
        </div>
        <div class="split-arrow">⬇</div>
        <div class="split-bins">
          <div class="split-bin bin-left" id="split-bin-left">
            <div class="split-bin-count" id="split-bin-left-count">0</div>
          </div>
          <div class="split-bin bin-right" id="split-bin-right">
            <div class="split-bin-count" id="split-bin-right-count">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="ka-f">
    <button class="ka-prev" id="prev" onclick="goPrev()" disabled>← 이전</button>
    <button class="ka-next hl" id="next" onclick="goNext()">다음 →</button>
  </div>
</div>

<script>
let cur = 0;
const total = 2;

function updateUI() {
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === cur));
  document.getElementById('pg').textContent = (cur+1) + ' / ' + total;
  document.getElementById('bar').style.width = ((cur+1)/total*100) + '%';
  document.getElementById('prev').disabled = (cur === 0);
  document.getElementById('next').disabled = (cur >= total-1);
}
function goNext() { if (cur < total-1) { cur++; updateUI(); } }
function goPrev() { if (cur > 0) { cur--; updateUI(); } }

let muted = false;
function toggleMute() {
  muted = !muted;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
}

function bindDrag(apple, dropTargets, onDrop) {
  function startDrag(e) {
    if (apple.classList.contains('placed')) return;
    e.preventDefault();
    const rect = apple.getBoundingClientRect();
    const isTouch = e.type === 'touchstart';
    const point = isTouch ? e.touches[0] : e;
    const offsetX = point.clientX - rect.left;
    const offsetY = point.clientY - rect.top;

    apple.classList.add('dragging');
    apple.style.position = 'fixed';
    apple.style.left = (point.clientX - offsetX) + 'px';
    apple.style.top = (point.clientY - offsetY) + 'px';
    apple.style.pointerEvents = 'none';

    function onMove(ev) {
      ev.preventDefault();
      const p = ev.type === 'touchmove' ? ev.touches[0] : ev;
      apple.style.left = (p.clientX - offsetX) + 'px';
      apple.style.top = (p.clientY - offsetY) + 'px';
      dropTargets.forEach(t => {
        const r = t.el.getBoundingClientRect();
        const cx = p.clientX, cy = p.clientY;
        const over = cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
        t.el.style.transform = over ? 'scale(1.02)' : '';
      });
    }
    function onEnd(ev) {
      const p = ev.type === 'touchend' ? ev.changedTouches[0] : ev;
      let dropped = null;
      dropTargets.forEach(t => {
        const r = t.el.getBoundingClientRect();
        const cx = p.clientX, cy = p.clientY;
        if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) dropped = t;
        t.el.style.transform = '';
      });
      apple.classList.remove('dragging');
      apple.style.position = '';
      apple.style.left = '';
      apple.style.top = '';
      apple.style.pointerEvents = '';
      if (dropped) {
        dropped.el.appendChild(apple);
        apple.classList.add('placed');
        if (onDrop) onDrop();
      }
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, {passive: false});
    document.addEventListener('touchend', onEnd);
  }
  apple.addEventListener('mousedown', startDrag);
  apple.addEventListener('touchstart', startDrag, {passive: false});
}

// 슬1 모으기
(function() {
  const bowl = document.getElementById('merge-bowl');
  const count = document.getElementById('merge-count');
  function update() {
    const n = bowl.querySelectorAll('.apple').length;
    count.textContent = n;
    bowl.classList.toggle('has-items', n > 0);
    bowl.classList.toggle('full', n === 5);
  }
  document.querySelectorAll('.merge-stage .apple').forEach(a => bindDrag(a, [{el: bowl}], update));
})();

// 슬2 가르기
(function() {
  const bL = document.getElementById('split-bin-left');
  const bR = document.getElementById('split-bin-right');
  const lc = document.getElementById('split-bin-left-count');
  const rc = document.getElementById('split-bin-right-count');
  const sc = document.getElementById('split-source-count');
  const src = document.getElementById('split-source');
  function update() {
    lc.textContent = bL.querySelectorAll('.apple').length;
    rc.textContent = bR.querySelectorAll('.apple').length;
    sc.textContent = src.querySelectorAll('.apple').length;
    bL.classList.toggle('has-items', bL.querySelectorAll('.apple').length > 0);
    bR.classList.toggle('has-items', bR.querySelectorAll('.apple').length > 0);
  }
  document.querySelectorAll('#split-source .apple').forEach(a => bindDrag(a, [{el: bL}, {el: bR}], update));
})();

updateUI();
</script>
</body>
</html>

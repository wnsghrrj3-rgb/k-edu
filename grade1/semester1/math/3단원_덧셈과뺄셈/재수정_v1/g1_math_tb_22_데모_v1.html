<!DOCTYPE html>
<!--
  tb_22 모으기와 가르기 (2) — 메카닉 데모 v1
  ════════════════════════════════════════════════════════════
  cycle 37 박음 (math)

  설계 출처:
    - kedu/2026-05-09_math_3단원_매핑_v1초안.md (l.49 + l.72)

  학습 본질 (매핑 .md l.49):
    한 수의 여러 가지 가르기 방식 (예: 7 = 1+6 = 2+5 = 3+4 = 4+3 = 5+2 = 6+1)
    → "한 답이 아닌 여러 가능성"이 본질. 한 답 메카닉(4지선다)으론 본질 안 살아남.

  데모 박는 결 (2슬):
    슬1: 분할 트리 — 한 수(7) → 학생이 여러 결로 가르기 박음 (학생 능동 결, 결마다 트리 노드 박힘)
    슬2: 등가 묶음 매칭 — 같은 합(7) 묶음 카드들 → 학생이 같은 합 묶음끼리 분류 결

  검증 자리:
    재수정_v1/ 안 박음. 라이브 갈아엎음 X. 차시 목록 등록 X.
    베프·준호 URL 직접 진입 검증.

  검증 포인트 (베프 박을 결):
    1. 분할 트리 — 학생이 가르기 결로 박는 결이 1학년에게 동작 가능한가
    2. 분할 트리 — 여러 결 박는 결이 "여러 가능성" 본질 닿는가
    3. 등가 묶음 매칭 — 같은 합 묶음끼리 분류 결이 본질 닿는가, 무효 4종 매칭(좌·우 줄 잇기)과 본질 다른가
    4. 메카닉 두 결 합쳐 tb_22 학습 본질 박혔는가

  ⛔ 무효 4종 결 X:
    매칭(좌·우 줄 잇기), TAP, POND, 종합 ▢
-->

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #F0F7FF;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
  touch-action: manipulation;
}

@keyframes ka-fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ka-pop { 0% { opacity: 0; transform: scale(0.3); } 60% { opacity: 1; transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
@keyframes ka-pulse { 0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(66,165,245,0.32); } 50% { transform: scale(1.04); box-shadow: 0 6px 20px rgba(66,165,245,0.5); } }
@keyframes ka-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,167,38,0.35); } 50% { box-shadow: 0 0 0 8px rgba(255,167,38,0.15); } }
@keyframes ka-celebrate { 0% { transform: scale(1); } 30% { transform: scale(1.15) rotate(-3deg); } 60% { transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes ka-branch { from { opacity: 0; transform: scale(0.7) translateY(-8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

.ka {
  background: white; width: 100vw; height: 100vh; height: 100dvh;
  padding: clamp(8px, 1.5vw, 14px) clamp(12px, 2.2vw, 22px);
  color: #333; display: flex; flex-direction: column;

}

.ka-h { display: flex; align-items: center; gap: clamp(6px, 1.2vw, 10px); margin-bottom: clamp(6px, 1.2vw, 10px); flex-shrink: 0; }
.ka-lb { background: #F4F4F8; border: none; padding: clamp(4px, 0.9vw, 7px) clamp(8px, 1.5vw, 12px); border-radius: clamp(8px, 1.5vw, 12px); cursor: pointer; font-family: inherit; color: #555; flex-shrink: 0; font-size: clamp(11px, 1.7vw, 14px); }
.ka-bar { flex: 1; height: clamp(3px, 0.5vw, 5px); background: #F0F7FF; border-radius: 999px; overflow: hidden; min-width: clamp(40px, 6vw, 80px); }
.ka-bar > div { height: 100%; background: #42A5F5; border-radius: 999px; transition: width 0.45s ease; }
.ka-pg { color: #1976D2; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: clamp(11px, 1.7vw, 14px); flex-shrink: 0; }
.ka-mute { background: #F4F4F8; border: none; padding: clamp(4px, 0.9vw, 7px); border-radius: clamp(8px, 1.5vw, 12px); cursor: pointer; flex-shrink: 0; color: #1976D2; font-size: clamp(12px, 2vw, 16px); width: clamp(28px, 4.5vw, 36px); height: clamp(28px, 4.5vw, 36px); display: flex; align-items: center; justify-content: center; }

.ka-m { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; position: relative; overflow: hidden; }
.slide { display: none; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.5vw, 14px); height: 100%; width: 100%; animation: ka-fadeUp 0.45s ease both; }
.slide.active { display: flex; }

/* ─── 슬1: 분할 트리 ─── */
.tree-stage {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; max-width: var(--mw-md); padding: clamp(6px, 1.2vw, 10px);
  gap: clamp(10px, 1.8vw, 16px);
  min-height: 0;
}
.tree-root {
  background: #FFF8E1; border: 3px solid #FFD54F; border-radius: 50%;
  width: clamp(70px, 11vw, 100px); height: clamp(70px, 11vw, 100px);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: clamp(32px, 5.4vw, 56px); color: #F57F17;
  box-shadow: 0 4px 14px rgba(245,127,23,0.25);
  flex-shrink: 0;
}
.tree-input-row {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(8px, 1.5vw, 14px);
  flex-shrink: 0;
}
.tree-input-blank {
  display: inline-flex; align-items: center; justify-content: center;
  width: clamp(48px, 7.5vw, 72px); height: clamp(48px, 7.5vw, 72px);
  background: white; border: 3px dashed #90CAF9; border-radius: clamp(10px, 1.6vw, 14px);
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: clamp(26px, 4.4vw, 40px); color: #1976D2;
  cursor: pointer; transition: all 0.2s;
}
.tree-input-blank.active { animation: ka-pulse 1.4s ease-in-out infinite; }
.tree-input-blank.filled { border-style: solid; background: #E3F2FD; }
.tree-plus { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: clamp(22px, 3.8vw, 32px); color: #FFA726; }
.tree-confirm {
  background: #1976D2; color: white; border: none;
  padding: clamp(8px, 1.5vw, 12px) clamp(14px, 2.6vw, 22px);
  border-radius: clamp(10px, 1.7vw, 14px);

}
.tree-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
.tree-confirm:hover:not(:disabled) { background: #1565C0; }

.tree-branches {
  display: flex; flex-wrap: wrap; gap: clamp(6px, 1.2vw, 10px);
  justify-content: center;

}

  display: inline-flex; align-items: center; gap: clamp(4px, 0.8vw, 7px);
  background: #E8F5E9; border: 2px solid #66BB6A; border-radius: clamp(10px, 1.6vw, 14px);

}
.tree-keypad {

}
.tree-key {
  background: white; border: 2px solid #E3F2FD; border-radius: clamp(8px, 1.4vw, 12px);
  padding: clamp(6px, 1.2vw, 10px) 0;

/* ─── 슬2: 등가 묶음 매칭 ─── */
.match-stage {
  flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: center;
  width: 100%; max-width: var(--mw-md); padding: clamp(6px, 1.2vw, 10px);
  gap: clamp(10px, 1.8vw, 16px);

}

}

  background: #F8FBFF; border-radius: clamp(12px, 2vw, 16px);

  flex-shrink: 0;
}
.match-card {
  display: inline-flex; align-items: center; gap: clamp(3px, 0.7vw, 6px);
  background: white; border: 2px solid #B3E5FC; border-radius: clamp(10px, 1.6vw, 14px);
  padding: clamp(6px, 1.2vw, 10px) clamp(10px, 1.8vw, 14px);
  font-family: 'Nunito', sans-serif; font-weight: 800;
  font-size: clamp(15px, 2.5vw, 21px); color: #1976D2;
  cursor: grab; user-select: none; touch-action: none;
  transition: transform 0.2s, filter 0.2s;
  position: relative; animation: ka-pop 0.4s ease both;
}
.match-card:active { cursor: grabbing; transform: scale(1.1); }
.match-card.dragging { z-index: 100; transform: scale(1.15); filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25)); }
.match-card.placed { cursor: default; }
.match-bins { display: flex; gap: clamp(8px, 1.5vw, 14px); flex-shrink: 0; }
.match-bin {
  flex: 1;
  background: #FFF8E1; border: 3px dashed #FFD54F; border-radius: clamp(12px, 2vw, 16px);
  padding: clamp(10px, 1.8vw, 14px);
  display: flex; flex-wrap: wrap; gap: clamp(4px, 0.9vw, 8px);
  align-items: flex-start; justify-content: center;
  position: relative;
  min-height: clamp(70px, 11vw, 100px);
  transition: background 0.3s, border-color 0.3s;
}
.match-bin.bin-other { background: #FCE4EC; border-color: #F48FB1; }
.match-bin.has-items { border-style: solid; }
.match-bin-label {
  position: absolute; top: clamp(-10px, -1.5vw, -12px); left: 50%; transform: translateX(-50%);
  background: #F57F17; color: white;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  padding: clamp(3px, 0.6vw, 5px) clamp(10px, 1.8vw, 14px);
  border-radius: 999px;
  font-size: clamp(12px, 2vw, 16px);
  box-shadow: 0 2px 8px rgba(245,127,23,0.4);
  white-space: nowrap;
}
.match-bin.bin-other .match-bin-label { background: #C2185B; }
.match-feedback {
  font-size: clamp(13px, 2.2vw, 18px);
  color: #2E7D32; text-align: center;
  flex-shrink: 0;
  min-height: clamp(18px, 2.8vw, 24px);
}
.match-feedback.wrong { color: #C62828; }

.ka-f { display: flex; justify-content: space-between; align-items: center; padding-top: clamp(6px, 1.2vw, 10px); flex-shrink: 0; }
.ka-prev, .ka-next {
  background: #1976D2; color: white; border: none;
  padding: clamp(6px, 1.2vw, 10px) clamp(14px, 2.6vw, 22px);
  border-radius: clamp(10px, 1.7vw, 14px);
  font-family: inherit; font-size: clamp(12px, 2vw, 16px);
  cursor: pointer; transition: background 0.2s;
}
.ka-prev { background: #B0BEC5; }
.ka-next:hover { background: #1565C0; }
.ka-next.hl { animation: ka-pulse 1.4s ease-in-out infinite; }
.ka-prev:disabled, .ka-next:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
</style>
</head>
<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="window.history.back()">← 종료</button>
    <div class="ka-bar"><div id="bar" style="width:50%"></div></div>
    <div class="ka-pg" id="pg">1 / 2</div>
    <button class="ka-mute" id="mute" onclick="toggleMute()">🔊</button>
  </div>

  <div class="ka-m">
    <!-- ════ 슬1: 분할 트리 ════ -->
    <div class="slide active" data-slide="1">
      <h1 class="slide-title">7은 어떻게 가를 수 있을까?</h1>
      <div class="slide-sub">두 자리에 들어갈 수를 골라 보세요. 여러 가지 결로 박을 수 있어요!</div>
      <div class="tree-stage">
        <div class="tree-root">7</div>
        <div class="tree-input-row">
          <button class="tree-input-blank active" id="tree-left">?</button>
          <span class="tree-plus">+</span>
          <button class="tree-input-blank" id="tree-right">?</button>
          <button class="tree-confirm" id="tree-confirm" disabled>박기</button>
        </div>
        <div class="tree-keypad" id="tree-keypad">
          <button class="tree-key" data-num="1">1</button>
          <button class="tree-key" data-num="2">2</button>
          <button class="tree-key" data-num="3">3</button>
          <button class="tree-key" data-num="4">4</button>
          <button class="tree-key" data-num="5">5</button>
          <button class="tree-key" data-num="6">6</button>
          <button class="tree-key" data-num="0">지우기</button>
        </div>
        <div class="tree-branches" id="tree-branches"></div>
        <div class="tree-feedback" id="tree-fb">7을 가르는 결을 박아 보세요</div>
      </div>
    </div>

    <!-- ════ 슬2: 등가 묶음 매칭 ════ -->
    <div class="slide" data-slide="2">
      <h1 class="slide-title">같은 합끼리 모아 볼까요?</h1>
      <div class="match-stage">
        <div class="match-prompt">합이 <strong style="color:#F57F17;">7</strong>인 묶음과 <strong style="color:#C2185B;">8</strong>인 묶음으로 갈라 박으세요</div>
        <div class="match-pool" id="match-pool">
          <div class="match-card" data-id="c1" data-sum="7">3+4</div>
          <div class="match-card" data-id="c2" data-sum="8">5+3</div>
          <div class="match-card" data-id="c3" data-sum="7">1+6</div>
          <div class="match-card" data-id="c4" data-sum="8">2+6</div>
          <div class="match-card" data-id="c5" data-sum="7">2+5</div>
          <div class="match-card" data-id="c6" data-sum="8">4+4</div>
        </div>
        <div class="match-bins">
          <div class="match-bin" id="bin-7" data-target="7">
            <div class="match-bin-label">합 = 7</div>
          </div>
          <div class="match-bin bin-other" id="bin-8" data-target="8">
            <div class="match-bin-label">합 = 8</div>
          </div>
        </div>
        <div class="match-feedback" id="match-fb">묶음 카드를 끌어다 박아 보세요</div>
      </div>
    </div>
  </div>

  <div class="ka-f">
    <button class="ka-prev" id="prev" onclick="goPrev()" disabled>← 이전</button>
    <button class="ka-next hl" id="next" onclick="goNext()">다음 →</button>
  </div>
</div>

<script>
let cur = 0;
const TOTAL = 2;

function updateUI() {
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === cur));
  document.getElementById('pg').textContent = (cur+1) + ' / ' + TOTAL;
  document.getElementById('bar').style.width = ((cur+1)/TOTAL*100) + '%';
  document.getElementById('prev').disabled = (cur === 0);
  document.getElementById('next').disabled = (cur >= TOTAL-1);
}
function goNext() { if (cur < TOTAL-1) { cur++; updateUI(); } }
function goPrev() { if (cur > 0) { cur--; updateUI(); } }

let muted = false;
function toggleMute() {
  muted = !muted;
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
}

/* ─── 슬1 분할 트리 결 ─── */
(function() {
  const TARGET = 7;
  const left = document.getElementById('tree-left');
  const right = document.getElementById('tree-right');
  const confirm = document.getElementById('tree-confirm');
  const branches = document.getElementById('tree-branches');
  const fb = document.getElementById('tree-fb');
  const keypad = document.getElementById('tree-keypad');
  let active = left;
  const found = new Set();
  let lVal = null, rVal = null;

  function setActive(el) {
    [left, right].forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    active = el;
  }
  left.addEventListener('click', () => setActive(left));
  right.addEventListener('click', () => setActive(right));

  function updateConfirm() {
    confirm.disabled = !(lVal !== null && rVal !== null);
  }

  keypad.querySelectorAll('.tree-key').forEach(key => {
    key.addEventListener('click', () => {
      const n = key.dataset.num;
      if (n === '0') {
        if (active === left) { left.textContent = '?'; left.classList.remove('filled'); lVal = null; }
        else { right.textContent = '?'; right.classList.remove('filled'); rVal = null; }
      } else {
        active.textContent = n;
        active.classList.add('filled');
        if (active === left) { lVal = parseInt(n, 10); setActive(right); }
        else { rVal = parseInt(n, 10); }
      }
      updateConfirm();
    });
  });

  confirm.addEventListener('click', () => {
    if (lVal === null || rVal === null) return;
    const sum = lVal + rVal;
    if (sum !== TARGET) {
      fb.textContent = lVal + ' + ' + rVal + ' = ' + sum + '이에요. 7이 되는 결을 박아 보세요';
      fb.classList.add('wrong');
      return;
    }
    const key = lVal + '+' + rVal;
    if (found.has(key)) {
      fb.textContent = '이 결은 이미 박았어요! 다른 결도 박아 보세요';
      fb.classList.add('wrong');
      return;
    }
    found.add(key);
    const b = document.createElement('div');
    b.className = 'tree-branch';
    b.innerHTML = '<span>' + lVal + '</span><span style="color:#FFA726;">+</span><span>' + rVal + '</span>';
    branches.appendChild(b);
    fb.classList.remove('wrong');
    fb.textContent = '박혔어요! 다른 결도 박아 보세요 (' + found.size + '개 박힘)';
    left.textContent = '?'; left.classList.remove('filled'); lVal = null;
    right.textContent = '?'; right.classList.remove('filled'); rVal = null;
    setActive(left);
    updateConfirm();
  });
})();

/* ─── 슬2 등가 묶음 매칭 결 ─── */
(function() {
  const pool = document.getElementById('match-pool');
  const bin7 = document.getElementById('bin-7');
  const bin8 = document.getElementById('bin-8');
  const fb = document.getElementById('match-fb');
  const total = pool.querySelectorAll('.match-card').length;
  let solved = false;

  function bindDrag(card) {
    function startDrag(e) {
      if (card.classList.contains('placed') || solved) return;
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      const isTouch = e.type === 'touchstart';
      const point = isTouch ? e.touches[0] : e;
      const offsetX = point.clientX - rect.left;
      const offsetY = point.clientY - rect.top;
      card.classList.add('dragging');
      card.style.position = 'fixed';
      card.style.left = (point.clientX - offsetX) + 'px';
      card.style.top = (point.clientY - offsetY) + 'px';
      card.style.pointerEvents = 'none';
      const targets = [bin7, bin8];
      function onMove(ev) {
        ev.preventDefault();
        const p = ev.type === 'touchmove' ? ev.touches[0] : ev;
        card.style.left = (p.clientX - offsetX) + 'px';
        card.style.top = (p.clientY - offsetY) + 'px';
        targets.forEach(t => {
          const r = t.getBoundingClientRect();
          const over = p.clientX >= r.left && p.clientX <= r.right && p.clientY >= r.top && p.clientY <= r.bottom;
          t.style.transform = over ? 'scale(1.02)' : '';
        });
      }
      function onEnd(ev) {
        const p = ev.type === 'touchend' ? ev.changedTouches[0] : ev;
        let dropped = null;
        targets.forEach(t => {
          const r = t.getBoundingClientRect();
          if (p.clientX >= r.left && p.clientX <= r.right && p.clientY >= r.top && p.clientY <= r.bottom) dropped = t;
          t.style.transform = '';
        });
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.pointerEvents = '';
        if (dropped) {
          const targetSum = parseInt(dropped.dataset.target, 10);
          const cardSum = parseInt(card.dataset.sum, 10);
          if (targetSum === cardSum) {
            dropped.appendChild(card);
            card.classList.add('placed');
            dropped.classList.add('has-items');
            update();
          } else {
            fb.textContent = '합이 ' + cardSum + '이라 ' + targetSum + ' 자리에 안 박혀요';
            fb.classList.add('wrong');
            setTimeout(() => { fb.textContent = '묶음 카드를 끌어다 박아 보세요'; fb.classList.remove('wrong'); }, 1400);
          }
        }
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchmove', onMove, {passive: false});
      document.addEventListener('touchend', onEnd);
    }
    card.addEventListener('mousedown', startDrag);
    card.addEventListener('touchstart', startDrag, {passive: false});
  }
  function update() {
    const placed = document.querySelectorAll('.match-card.placed').length;
    if (placed === total && !solved) {
      solved = true;
      fb.textContent = '모두 박혔어요! 같은 합 묶음끼리 모았어요';
      fb.classList.remove('wrong');
    }
  }
  pool.querySelectorAll('.match-card').forEach(bindDrag);
})();

updateUI();
</script>
</body>
</html>

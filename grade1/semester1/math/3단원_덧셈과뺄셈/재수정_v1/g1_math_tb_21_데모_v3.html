<!DOCTYPE html>
<!--
  tb_21 모으기와 가르기 (1) — 메카닉 데모 v3
  ────────────────────────────────────────────────────────
  v2 빵꾸 정정 (학습 본질 차원):
    ❌ 묶음 드래그 합치기 (한 번 끌면 알아서 합쳐짐, 결과만 봄)
    ❌ 슬라이더 분할 (자동 분할, 슬라이더는 어른 도구)
    → 진짜 본질 X = 학생이 "직접 모으고/나누는 행위"를 안 함

  v3 박힘 결 = 사과 개별 드래그:
    슬1 합치기: 사과 5개가 좌·우 흩어져 있음 → 학생이 한 개씩 가운데로 끔 (5번 손가락 행위)
    슬2 가르기: 사과 5개 가운데 → 학생이 한 개씩 좌·우로 끔 (5번 손가락 행위)

  본질: 학생 손가락이 5번 박혀야 모으기·가르기 행위가 진짜 박힘.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="kedu-lesson-id" content="g1_math_tb_21_demo_v3">
<title>모으기와 가르기 · K-edu 1학년 수학</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../math-common.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #F0F7FF;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
  touch-action: manipulation;
}

@keyframes ka-fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes ka-pop { 0% { opacity: 0; transform: scale(0.3); } 60% { opacity: 1; transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
@keyframes ka-pulse { 0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(66,165,245,0.32); } 50% { transform: scale(1.04); box-shadow: 0 6px 20px rgba(66,165,245,0.5); } }
@keyframes ka-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,167,38,0.35); } 50% { box-shadow: 0 0 0 8px rgba(255,167,38,0.15); } }
@keyframes ka-celebrate { 0% { transform: scale(1); } 30% { transform: scale(1.15) rotate(-3deg); } 60% { transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }

/* ─── 카드 ─── */
.ka {
  background: white; width: 100vw; height: 100vh; height: 100dvh;
  padding: clamp(10px, 1.8vw, 18px) clamp(14px, 2.5vw, 26px);
  color: #333; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}

/* 헤더 */
.ka-h { display: flex; align-items: center; gap: clamp(6px, 1.2vw, 10px); margin-bottom: clamp(8px, 1.5vw, 14px); flex-shrink: 0; }
.ka-lb { background: #F4F4F8; border: none; padding: clamp(4px, 0.9vw, 7px) clamp(8px, 1.5vw, 12px); border-radius: clamp(8px, 1.5vw, 12px); cursor: pointer; font-family: inherit; color: #555; flex-shrink: 0; font-size: clamp(11px, 1.7vw, 14px); }
.ka-bar { flex: 1; height: clamp(3px, 0.5vw, 5px); background: #F0F7FF; border-radius: 999px; overflow: hidden; min-width: clamp(40px, 6vw, 80px); }
.ka-bar > div { height: 100%; background: #42A5F5; border-radius: 999px; transition: width 0.45s ease; }
.ka-pg { color: #1976D2; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: clamp(11px, 1.7vw, 14px); flex-shrink: 0; }
.ka-mute { background: #F4F4F8; border: none; padding: clamp(4px, 0.9vw, 7px); border-radius: clamp(8px, 1.5vw, 12px); cursor: pointer; flex-shrink: 0; color: #1976D2; font-size: clamp(12px, 2vw, 16px); width: clamp(28px, 4.5vw, 36px); height: clamp(28px, 4.5vw, 36px); display: flex; align-items: center; justify-content: center; }

/* 메인 */
.ka-m { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; position: relative; overflow: hidden; }
.slide { display: none; flex-direction: column; align-items: center; height: 100%; width: 100%; animation: ka-fadeUp 0.45s ease both; }
.slide.active { display: flex; }
.slide-title { font-size: clamp(20px, 3.6vw, 32px); margin: 0 0 clamp(6px, 1.2vw, 10px); line-height: 1.3; color: #1976D2; font-weight: 400; text-align: center; flex-shrink: 0; }
.slide-sub   { font-size: clamp(13px, 2.2vw, 18px); color: #607D8B; margin-bottom: clamp(8px, 1.6vw, 14px); text-align: center; flex-shrink: 0; }

/* ─── 공용 사과 결 ─── */
.apple {
  font-size: clamp(34px, 5.5vw, 56px);
  display: inline-flex; align-items: center; justify-content: center;
  width: clamp(48px, 7.5vw, 72px); height: clamp(48px, 7.5vw, 72px);
  cursor: grab; user-select: none;
  touch-action: none;
  border-radius: 50%;
  transition: transform 0.2s, filter 0.2s;
  position: relative;
  line-height: 1;
  animation: ka-pop 0.4s ease both;
}
.apple:active { cursor: grabbing; transform: scale(1.15); }
.apple.dragging { z-index: 100; transform: scale(1.2); filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25)); }
.apple.placed { animation: ka-pop 0.4s ease both, ka-celebrate 0.5s ease 0.4s; cursor: default; }

/* ─── 슬1: 모으기 (사과 개별 → 가운데) ─── */
.merge-stage {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  width: 100%; max-width: var(--mw-md); padding: clamp(8px, 1.5vw, 14px);
  position: relative;
  min-height: 0;
}
.merge-sources {
  display: flex; justify-content: space-between; width: 100%;
  gap: clamp(10px, 2vw, 18px);
  flex-shrink: 0;
}
.source-pile {
  flex: 1;
  display: flex; flex-wrap: wrap; gap: clamp(4px, 0.8vw, 8px);
  align-items: center; justify-content: center;
  padding: clamp(8px, 1.4vw, 12px);
  background: #F8FBFF; border-radius: clamp(10px, 1.6vw, 14px);
  min-height: clamp(60px, 10vw, 90px);
}
.merge-target {
  width: 100%;
  display: flex; flex-direction: column; align-items: center;
  margin-top: clamp(10px, 2vw, 16px);
  flex: 1;
  min-height: 0;
}
.merge-label {
  font-size: clamp(13px, 2.2vw, 18px); color: #FFA726;
  margin-bottom: clamp(4px, 0.8vw, 7px);
  display: flex; align-items: center; gap: 6px;
}
.merge-bowl {
  width: 100%; flex: 1;
  background: #FFF8E1; border: 3px dashed #FFD54F; border-radius: clamp(14px, 2.4vw, 20px);
  display: flex; flex-wrap: wrap; gap: clamp(4px, 0.8vw, 8px);
  align-items: center; justify-content: center;
  padding: clamp(10px, 1.8vw, 16px);
  min-height: clamp(80px, 13vw, 120px);
  position: relative;
  transition: background 0.3s, border-color 0.3s;
  animation: ka-glow 2s ease-in-out infinite;
}
.merge-bowl.has-items { animation: none; }
.merge-bowl.full { background: #FFE082; border-color: #FFB300; border-style: solid; }
.merge-count {
  position: absolute; top: clamp(-12px, -1.8vw, -14px); right: clamp(8px, 1.5vw, 12px);
  background: #F57F17; color: white;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  padding: clamp(3px, 0.6vw, 5px) clamp(10px, 1.8vw, 14px);
  border-radius: 999px;
  font-size: clamp(13px, 2.2vw, 18px);
  box-shadow: 0 2px 8px rgba(245,127,23,0.4);
  min-width: clamp(40px, 6.5vw, 56px); text-align: center;
}

/* ─── 슬2: 가르기 (사과 개별 → 좌·우) ─── */
.split-stage {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  width: 100%; max-width: var(--mw-md); padding: clamp(8px, 1.5vw, 14px);
  min-height: 0;
}
.split-source {
  width: 100%;
  background: #FFF8E1; border: 3px solid #FFD54F; border-radius: clamp(14px, 2.4vw, 20px);
  padding: clamp(10px, 1.8vw, 14px);
  display: flex; flex-wrap: wrap; gap: clamp(4px, 0.8vw, 8px);
  align-items: center; justify-content: center;
  min-height: clamp(70px, 11vw, 100px);
  position: relative;
  flex-shrink: 0;
}
.split-source-count {
  position: absolute; top: clamp(-12px, -1.8vw, -14px); left: clamp(8px, 1.5vw, 12px);
  background: #F57F17; color: white;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  padding: clamp(3px, 0.6vw, 5px) clamp(10px, 1.8vw, 14px);
  border-radius: 999px;
  font-size: clamp(13px, 2.2vw, 18px);
  box-shadow: 0 2px 8px rgba(245,127,23,0.4);
}
.split-bins {
  display: flex; gap: clamp(10px, 2vw, 16px); width: 100%;
  margin-top: clamp(10px, 2vw, 16px);
  flex: 1;
  min-height: 0;
}
.split-bin {
  flex: 1;
  background: #E3F2FD; border: 3px dashed #90CAF9; border-radius: clamp(12px, 2vw, 16px);
  padding: clamp(10px, 1.8vw, 14px);
  display: flex; flex-wrap: wrap; gap: clamp(4px, 0.8vw, 8px);
  align-items: center; justify-content: center;
  position: relative;
  min-height: clamp(80px, 13vw, 120px);
  transition: background 0.3s, border-color 0.3s;
}
.split-bin.bin-right { background: #FCE4EC; border-color: #F48FB1; }
.split-bin.has-items { border-style: solid; }
.split-bin-count {
  position: absolute; top: clamp(-12px, -1.8vw, -14px); right: clamp(8px, 1.5vw, 12px);
  background: white;
  font-family: 'Nunito', sans-serif; font-weight: 800;
  padding: clamp(3px, 0.6vw, 5px) clamp(10px, 1.8vw, 14px);
  border-radius: 999px;
  font-size: clamp(13px, 2.2vw, 18px);
  color: #1976D2;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  min-width: clamp(40px, 6.5vw, 56px); text-align: center;
}
.split-bin.bin-right .split-bin-count { color: #C2185B; }

/* 푸터 */
.ka-f { display: flex; justify-content: space-between; align-items: center; padding-top: clamp(8px, 1.5vw, 14px); flex-shrink: 0; }
.ka-prev, .ka-next {
  background: #1976D2; color: white; border: none;
  padding: clamp(6px, 1.3vw, 11px) clamp(16px, 3vw, 26px);
  border-radius: clamp(10px, 1.7vw, 14px);
  font-family: inherit; font-size: clamp(13px, 2.2vw, 18px);
  cursor: pointer;
  transition: background 0.2s;
}
.ka-prev { background: #B0BEC5; }
.ka-next:hover { background: #1565C0; }
.ka-next.hl { animation: ka-pulse 1.4s ease-in-out infinite; }
.ka-prev:disabled, .ka-next:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
</style>
</head>
<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="window.history.back()">← 종료</button>
    <div class="ka-bar"><div id="bar" style="width:50%"></div></div>
    <div class="ka-pg" id="pg">1 / 2</div>
    <button class="ka-mute" id="mute" onclick="toggleMute()">🔊</button>
  </div>

  <div class="ka-m">
    <!-- 슬1: 모으기 (사과 개별 → 가운데) -->
    <div class="slide active" data-slide="1">
      <h1 class="slide-title">사과를 모아 볼까요?</h1>
      <div class="slide-sub">사과를 하나씩 잡아서 가운데 자리로 옮겨 보세요</div>
      <div class="merge-stage">
        <div class="merge-sources">
          <div class="source-pile" id="source-left" data-side="left">
            <span class="apple" data-from="left" data-id="L1">🍎</span>
            <span class="apple" data-from="left" data-id="L2">🍎</span>
          </div>
          <div class="source-pile" id="source-right" data-side="right">
            <span class="apple" data-from="right" data-id="R1">🍎</span>
            <span class="apple" data-from="right" data-id="R2">🍎</span>
            <span class="apple" data-from="right" data-id="R3">🍎</span>
          </div>
        </div>
        <div class="merge-target">
          <div class="merge-label">⬇ 여기에 모아요</div>
          <div class="merge-bowl" id="merge-bowl">
            <div class="merge-count" id="merge-count">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 슬2: 가르기 (사과 개별 → 좌·우) -->
    <div class="slide" data-slide="2">
      <h1 class="slide-title">사과를 갈라 볼까요?</h1>
      <div class="slide-sub">사과를 하나씩 잡아서 두 자리로 나눠 보세요</div>
      <div class="split-stage">
        <div class="split-source" id="split-source">
          <div class="split-source-count" id="split-source-count">5</div>
          <span class="apple" data-from="source" data-id="S1">🍎</span>
          <span class="apple" data-from="source" data-id="S2">🍎</span>
          <span class="apple" data-from="source" data-id="S3">🍎</span>
          <span class="apple" data-from="source" data-id="S4">🍎</span>
          <span class="apple" data-from="source" data-id="S5">🍎</span>
        </div>
        <div class="split-bins">
          <div class="split-bin bin-left" id="split-bin-left" data-side="left">
            <div class="split-bin-count" id="split-bin-left-count">0</div>
          </div>
          <div class="split-bin bin-right" id="split-bin-right" data-side="right">
            <div class="split-bin-count" id="split-bin-right-count">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="ka-f">
    <button class="ka-prev" id="prev" onclick="goPrev()" disabled>← 이전</button>
    <button class="ka-next hl" id="next" onclick="goNext()">다음 →</button>
  </div>
</div>

<script>
let cur = 0;
const total = 2;

function updateUI() {
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === cur));
  document.getElementById('pg').textContent = (cur+1) + ' / ' + total;
  document.getElementById('bar').style.width = ((cur+1)/total*100) + '%';
  document.getElementById('prev').disabled = (cur === 0);
  document.getElementById('next').disabled = (cur >= total-1);
}
function goNext() { if (cur < total-1) { cur++; updateUI(); } }
function goPrev() { if (cur > 0) { cur--; updateUI(); } }

let muted = false;
function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('mute');
  btn.textContent = muted ? '🔇' : '🔊';
}

// ═══════════════════════════════════════════════════════
// 사과 개별 드래그 결 — 공용 라이브러리
// 박힘 결: 사과를 잡아서 drop 자리에 놓으면 그 자리로 이동·고정
// ═══════════════════════════════════════════════════════
function makeApplesDraggable(rootSelector, dropTargets, onDrop) {
  // dropTargets: [{el, accept: 'any'|fn}]
  const root = document.querySelector(rootSelector);
  if (!root) return;
  root.querySelectorAll('.apple').forEach(apple => {
    bindDrag(apple, dropTargets, onDrop);
  });
}

function bindDrag(apple, dropTargets, onDrop) {
  function startDrag(e) {
    if (apple.classList.contains('placed')) return;
    e.preventDefault();
    const rect = apple.getBoundingClientRect();
    const isTouch = e.type === 'touchstart';
    const point = isTouch ? e.touches[0] : e;
    const offsetX = point.clientX - rect.left;
    const offsetY = point.clientY - rect.top;

    // 본 자리 placeholder (보이지 않게 자리 유지 X = 자리 사라짐 결, flex 자동 정렬)
    apple.classList.add('dragging');
    apple.style.position = 'fixed';
    apple.style.left = (point.clientX - offsetX) + 'px';
    apple.style.top = (point.clientY - offsetY) + 'px';
    apple.style.pointerEvents = 'none';

    function onMove(ev) {
      ev.preventDefault();
      const p = ev.type === 'touchmove' ? ev.touches[0] : ev;
      apple.style.left = (p.clientX - offsetX) + 'px';
      apple.style.top = (p.clientY - offsetY) + 'px';

      // 드롭 자리 hover 결
      dropTargets.forEach(t => {
        const r = t.el.getBoundingClientRect();
        const cx = p.clientX, cy = p.clientY;
        const over = cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
        t.el.style.transform = over ? 'scale(1.02)' : '';
      });
    }
    function onEnd(ev) {
      const p = ev.type === 'touchend' ? ev.changedTouches[0] : ev;
      let dropped = null;
      dropTargets.forEach(t => {
        const r = t.el.getBoundingClientRect();
        const cx = p.clientX, cy = p.clientY;
        if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
          dropped = t;
        }
        t.el.style.transform = '';
      });

      apple.classList.remove('dragging');
      apple.style.position = '';
      apple.style.left = '';
      apple.style.top = '';
      apple.style.pointerEvents = '';

      if (dropped) {
        // 드롭 자리에 박음 (DOM 이동)
        dropped.el.appendChild(apple);
        apple.classList.add('placed');
        if (onDrop) onDrop(apple, dropped);
      }

      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, {passive: false});
    document.addEventListener('touchend', onEnd);
  }
  apple.addEventListener('mousedown', startDrag);
  apple.addEventListener('touchstart', startDrag, {passive: false});
}

// ─── 슬1: 모으기 ───
(function setupMerge() {
  const bowl = document.getElementById('merge-bowl');
  const count = document.getElementById('merge-count');

  function updateCount() {
    const n = bowl.querySelectorAll('.apple').length;
    count.textContent = n;
    bowl.classList.toggle('has-items', n > 0);
    bowl.classList.toggle('full', n === 5);
  }

  document.querySelectorAll('#source-left .apple, #source-right .apple').forEach(apple => {
    bindDrag(apple, [{el: bowl}], updateCount);
  });
})();

// ─── 슬2: 가르기 ───
(function setupSplit() {
  const binLeft = document.getElementById('split-bin-left');
  const binRight = document.getElementById('split-bin-right');
  const leftCount = document.getElementById('split-bin-left-count');
  const rightCount = document.getElementById('split-bin-right-count');
  const sourceCount = document.getElementById('split-source-count');
  const source = document.getElementById('split-source');

  function updateCount() {
    const l = binLeft.querySelectorAll('.apple').length;
    const r = binRight.querySelectorAll('.apple').length;
    const s = source.querySelectorAll('.apple').length;
    leftCount.textContent = l;
    rightCount.textContent = r;
    sourceCount.textContent = s;
    binLeft.classList.toggle('has-items', l > 0);
    binRight.classList.toggle('has-items', r > 0);
  }

  document.querySelectorAll('#split-source .apple').forEach(apple => {
    bindDrag(apple, [{el: binLeft}, {el: binRight}], updateCount);
  });
})();

updateUI();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<script src="/kedu_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/kedu_tracker.js"></script>
<meta name="kedu-lesson-id" content="g5_kor_u5_l01_v1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단원 시작 — 배울 내용 살펴보기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&family=Gowun+Dodum&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
/* ===== 5학년 국어 5단원 「의논하며 토의해요」 · 자기주도 통합 엔진 (5학년 라인) =====
   1단원 g5_u1 엔진 계승. 고학년 톤 — 차분한 서늘 배경 + 인디고 포인트 + 청록 정답.
   제목·강조 = Noto Sans KR 700/800, 본문 = Gowun Dodum. 이모지는 보조 기호로만 소형 사용.
   개념어(관점·토의·협력)=청록(.mc), 관점이 드러나는 표현 강조=주홍(.emph). */
:root{
  --paper:#F6F7FB; --ink:#1B2437; --ink-soft:#64748B;
  --indigo:#5B54D6; --indigo-deep:#403AB4; --indigo-soft:#E7E5FB;
  --teal:#0E9488; --teal-deep:#0B7268; --teal-soft:#D6F0EC;
  --gold:#E8A317; --emph:#D6452F; --line:#E3E7F0; --mark:#FFE9A8;
  --ok:#2E9E5B; --ok-soft:#D8F0E0;
  --f-title:'Noto Sans KR',sans-serif; --f-body:'Gowun Dodum',sans-serif;
  --shadow:0 14px 34px -20px rgba(27,36,55,.38);
}
*{margin:0; padding:0; box-sizing:border-box;}
html,body{height:100%;}
body{font-family:var(--f-body); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; overflow:hidden;}

@keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
@keyframes pop{0%{opacity:0; transform:scale(.4);}60%{opacity:1; transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes popBig{0%{opacity:0; transform:scale(.3);}60%{opacity:1; transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes mark{from{background-size:0 100%;} to{background-size:100% 100%;}}

/* ===== 상단바 ===== */
.topbar{display:flex; align-items:center; gap:14px; padding:13px clamp(16px,4vw,40px); background:#fff; border-bottom:2px solid var(--line); flex-shrink:0;}
.lb{font-family:var(--f-title); background:#F4F0E8; color:#6B5E4A; border:none; padding:7px 14px; border-radius:999px; font-size:clamp(13px,1.6vw,17px); cursor:pointer; flex-shrink:0;}
.lb:hover{background:#ECE5D8;}
.pill{font-family:var(--f-title); background:var(--teal); color:#fff; padding:6px 16px; border-radius:999px; font-size:clamp(14px,1.8vw,19px); flex-shrink:0;}
.where{font-size:clamp(13px,1.6vw,18px); color:var(--ink-soft);}
.where b{color:var(--ink);}
.dots{display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; max-width:42%;}
.dot{width:11px; height:11px; border-radius:50%; background:var(--line); cursor:pointer; transition:transform .2s,background .2s;}
.dot:hover{transform:scale(1.2);}
.dot.active{background:var(--indigo); transform:scale(1.3);}
.dot.done{background:var(--teal);}
.score{font-family:var(--f-title); background:#FFF8E1; color:#F57F17; padding:6px 15px; border-radius:999px; font-size:clamp(14px,1.8vw,19px); flex-shrink:0;}

/* ===== 무대 ===== */
.stage{flex:1; display:flex; flex-direction:column; overflow-y:auto; padding:0 clamp(18px,5vw,64px);}
.stage-inner{margin:auto; width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; padding:clamp(20px,4vh,48px) 0 clamp(96px,12vh,120px);}
.ka-tag{font-family:var(--f-title); color:var(--indigo); font-size:clamp(13px,1.6vw,17px); font-weight:800; letter-spacing:.4px; margin-bottom:9px; animation:fadeUp .4s ease both;}
.ka-t{font-family:var(--f-title); font-size:clamp(24px,3.6vw,40px); letter-spacing:-.4px; line-height:1.2; color:var(--ink); margin-bottom:clamp(14px,2.6vh,28px); font-weight:700; animation:fadeUp .4s .1s ease both;}
.mc{color:var(--teal-deep); font-weight:bold;}
.emph{color:var(--emph); font-weight:bold;}
.ka-t .emph,.ka-t b{color:var(--indigo-deep);}

/* 장면(이모지 그림 + 대사) */
.scene{display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.6vh,16px); margin:clamp(4px,1.4vh,12px) 0; animation:fadeUp .45s .15s ease both;}
.scene-pic{font-size:clamp(30px,5.4vw,54px); line-height:1.25; opacity:.92;}
.scene-say{background:#fff; border:3px solid var(--teal-soft); border-radius:20px; padding:clamp(10px,1.8vw,16px) clamp(16px,2.6vw,26px); font-size:clamp(18px,2.4vw,28px); color:var(--ink); box-shadow:var(--shadow); max-width:760px; line-height:1.5;}

/* 설명 말풍선 */
.ka-bub{background:#fff; border:2px solid var(--line); border-radius:22px; padding:clamp(15px,2.4vw,26px) clamp(20px,3vw,34px); font-size:clamp(18px,2.4vw,29px); line-height:1.6; max-width:860px; box-shadow:var(--shadow); animation:fadeUp .4s .25s ease both;}
.ka-bub b{font-family:var(--f-title); font-weight:700;}

/* 정리 리스트 */
.recap{display:flex; flex-direction:column; gap:clamp(9px,1.6vh,16px); width:100%; max-width:720px; margin-top:clamp(4px,1.2vh,10px);}
.recap-item{display:flex; align-items:center; gap:14px; background:#fff; border:3px solid var(--teal-soft); border-radius:20px; padding:clamp(12px,1.8vw,18px) clamp(16px,2.4vw,26px); font-size:clamp(17px,2.3vw,28px); text-align:left; box-shadow:0 5px 0 var(--teal-soft); animation:fadeUp .45s ease both;}
.recap-item b{font-family:var(--f-title); font-weight:700; color:var(--teal-deep);}
.recap-ic{font-size:clamp(20px,2.6vw,30px); flex-shrink:0;}

/* 소개 글 한 문단 */
.sentence{display:inline-block; background:#fff; border:4px solid var(--teal-soft); border-radius:20px; padding:clamp(14px,2.4vw,24px) clamp(20px,3.2vw,34px); font-size:clamp(20px,2.9vw,34px); color:var(--teal-deep); box-shadow:0 5px 0 var(--teal-soft); max-width:760px; line-height:1.8; font-family:var(--f-title); font-weight:700; margin:clamp(4px,1.2vh,10px) auto; animation:fadeUp .4s .2s ease both;}

/* 낱말·태도 고르기 (로깅) */
.wordpick{display:flex; gap:clamp(12px,2.2vw,22px); flex-wrap:wrap; justify-content:center; width:100%; max-width:880px; margin-top:clamp(6px,1.4vh,12px);}
.wcard{flex:1 1 200px; max-width:320px; min-height:clamp(96px,14vh,140px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(6px,1.2vh,12px); background:#fff; border:4px solid var(--indigo-soft); border-radius:22px; padding:clamp(14px,2.2vw,24px); box-shadow:0 6px 0 var(--indigo-soft); cursor:pointer; transition:transform .12s,border-color .2s,box-shadow .2s; animation:pop .4s ease both;}
.wcard:hover{transform:translateY(-3px);}
.wc-pic{font-size:clamp(24px,3.4vw,38px); line-height:1;}
.wc-word{font-size:clamp(17px,2.3vw,27px); color:var(--ink); line-height:1.4; font-family:var(--f-title); font-weight:700;}
.wcard.correct{border-color:var(--teal); background:var(--teal-soft); box-shadow:0 6px 0 var(--teal); animation:popBig .5s ease;}
.wcard.wrong{border-color:var(--emph); background:var(--indigo-soft); animation:shake .35s;}

/* 모으기 (로깅) */
.collect{display:flex; gap:clamp(10px,1.8vw,18px); flex-wrap:wrap; justify-content:center; width:100%; max-width:820px; margin-top:clamp(6px,1.4vh,12px);}
.chip{background:#fff; border:3px solid var(--indigo-soft); border-radius:999px; padding:clamp(11px,1.7vw,17px) clamp(18px,2.6vw,30px); font-size:clamp(16px,2.2vw,26px); color:var(--ink); cursor:pointer; box-shadow:0 5px 0 var(--indigo-soft); transition:transform .12s,border-color .2s,box-shadow .2s; font-family:var(--f-title); font-weight:700;}
.chip:hover{transform:translateY(-2px);}
.chip.painted{border-color:var(--teal); background:var(--teal-soft); color:var(--teal-deep); box-shadow:0 5px 0 var(--teal); animation:pop .4s ease;}
.chip.miss{border-color:var(--emph); animation:shake .35s;}
.chip.done-dim{opacity:.34; filter:grayscale(.3);}

/* 짝짓기 (로깅) */
.match{display:flex; gap:clamp(20px,5vw,56px); justify-content:center; width:100%; max-width:760px; margin-top:clamp(6px,1.4vh,12px);}
.match-col{display:flex; flex-direction:column; gap:clamp(10px,1.6vh,16px); flex:1;}
.match-col-h{font-family:var(--f-title); color:var(--ink-soft); font-size:clamp(15px,1.9vw,22px); margin-bottom:2px;}
.match-card{display:flex; align-items:center; justify-content:center; gap:8px; background:#fff; border:3px solid var(--indigo-soft); border-radius:18px; padding:clamp(12px,1.8vw,18px) clamp(10px,1.6vw,18px); font-size:clamp(17px,2.2vw,27px); color:var(--ink); cursor:pointer; box-shadow:0 5px 0 var(--indigo-soft); transition:transform .12s,border-color .2s,box-shadow .2s; font-family:var(--f-title); font-weight:700;}
.match-card:hover{transform:translateY(-2px);}
.match-card.sel{border-color:var(--indigo); box-shadow:0 5px 0 var(--indigo);}
.match-card.paired{border-color:var(--teal); background:var(--teal-soft); box-shadow:0 5px 0 var(--teal); cursor:default;}
.match-card.miss{border-color:var(--emph); animation:shake .35s;}
.mc-ic{font-size:1.15em;}

/* 따라 쓰기 (완주) */
.trace-wrap{display:flex; flex-direction:column; gap:clamp(10px,1.6vh,16px); width:100%; max-width:680px; margin-top:clamp(6px,1.4vh,12px);}
.trace-row{display:flex; align-items:center; gap:14px;}
.trace-pic{font-size:clamp(28px,3.8vw,44px); flex-shrink:0;}
.trace-word{display:flex; gap:clamp(6px,1vw,10px); flex-wrap:wrap;}
.trace-cell{width:clamp(48px,7vw,72px); height:clamp(48px,7vw,72px); display:grid; place-items:center; background:#fff; border:3px dashed var(--indigo); border-radius:16px; font-family:var(--f-title); font-size:clamp(24px,3.6vw,40px); color:var(--indigo-soft); cursor:pointer; transition:color .2s,background .2s,border-style .2s;}
.trace-cell.done{color:var(--teal-deep); background:var(--teal-soft); border-style:solid; border-color:var(--teal); animation:pop .35s ease;}

/* 자기 점검 (완주) */
.selfcheck{display:flex; flex-direction:column; gap:clamp(9px,1.5vh,14px); width:100%; max-width:640px; margin-top:clamp(6px,1.4vh,12px);}
.sc-row{display:flex; align-items:center; gap:14px; background:#fff; border:3px solid var(--line); border-radius:18px; padding:clamp(12px,1.8vw,18px) clamp(16px,2.4vw,24px); font-size:clamp(17px,2.2vw,27px); color:var(--ink); text-align:left; cursor:pointer; transition:border-color .2s,background .2s;}
.sc-row b{font-family:var(--f-title); font-weight:700; color:var(--teal-deep);}
.sc-box{width:clamp(30px,4vw,44px); height:clamp(30px,4vw,44px); flex-shrink:0; display:grid; place-items:center; border:3px solid var(--indigo-soft); border-radius:11px; color:transparent; font-size:clamp(18px,2.4vw,28px); transition:all .2s;}
.sc-row.checked{border-color:var(--teal); background:var(--teal-soft);}
.sc-row.checked .sc-box{background:var(--teal); border-color:var(--teal); color:#fff;}

/* 말하기·쓰기 무대 (발화 유도, 로깅X) */
.stage-box{background:var(--indigo-soft); border:4px dashed var(--indigo); border-radius:22px; padding:clamp(16px,2.6vw,26px); max-width:640px; margin:clamp(4px,1.2vh,10px) auto; font-size:clamp(18px,2.4vw,28px); color:var(--indigo-deep); line-height:1.6; animation:fadeUp .4s .2s ease both;}
.stage-box small{display:block; margin-top:8px; font-size:.74em; color:var(--ink-soft); line-height:1.5;}
.stage-do{margin-top:clamp(10px,1.8vh,16px); padding:clamp(10px,1.6vw,15px) clamp(20px,3vw,34px); background:var(--indigo); color:#fff; border:none; border-radius:999px; font-family:var(--f-title); font-size:clamp(17px,2.2vw,26px); cursor:pointer; box-shadow:0 5px 0 var(--indigo-deep);}
.stage-do:active{transform:translateY(4px); box-shadow:0 1px 0 var(--indigo-deep);}
.stage-do.done{background:var(--teal); box-shadow:0 5px 0 var(--teal-deep);}

/* 따라 읽기 (완주) */
.read-lines{display:flex; flex-direction:column; gap:clamp(9px,1.5vh,14px); width:100%; max-width:680px; margin-top:clamp(6px,1.4vh,12px);}
.read-line{display:flex; align-items:center; gap:14px; background:#fff; border:3px solid var(--teal-soft); border-radius:18px; padding:clamp(12px,1.8vw,18px) clamp(16px,2.4vw,24px); font-size:clamp(18px,2.4vw,28px); color:var(--ink); text-align:left; cursor:pointer; box-shadow:0 5px 0 var(--teal-soft); transition:transform .12s,background .2s; font-family:var(--f-title); font-weight:700;}
.read-line:hover{transform:translateX(3px);}
.rl-num{width:clamp(30px,4vw,42px); height:clamp(30px,4vw,42px); flex-shrink:0; display:grid; place-items:center; background:var(--teal-soft); color:var(--teal-deep); border-radius:50%; font-size:clamp(16px,2vw,24px);}
.read-line.read{background:var(--teal-soft); border-color:var(--teal);}


/* 대화 카드 (표시 전용) — 말차례가 오가는 대화를 좌우로 배치 */
.talk{display:flex; flex-direction:column; gap:clamp(8px,1.4vh,14px); width:100%; max-width:780px; margin:clamp(4px,1.2vh,10px) auto; animation:fadeUp .4s .15s ease both;}
.turn{display:flex; align-items:flex-start; gap:10px; max-width:88%;}
.turn.r{align-self:flex-end; flex-direction:row-reverse; text-align:right;}
.turn-name{font-family:var(--f-title); font-weight:700; font-size:clamp(13px,1.7vw,17px); color:var(--ink-soft); padding-top:9px; flex-shrink:0; min-width:44px;}
.turn-say{background:#fff; border:2px solid var(--line); border-radius:18px; padding:clamp(10px,1.6vw,16px) clamp(14px,2.2vw,22px); font-size:clamp(16px,2vw,23px); line-height:1.6; color:var(--ink); box-shadow:var(--shadow); text-align:left;}
.turn.r .turn-say{background:var(--indigo-soft); border-color:var(--indigo-soft);}
.turn-say small{display:block; margin-top:5px; font-size:.76em; color:var(--ink-soft);}
.turn-act{font-size:.82em; color:var(--ink-soft);}

/* 지문 블록 — 이야기·글 읽기 */
.story{background:#fff; border:2px solid var(--line); border-left:6px solid var(--indigo); border-radius:16px; padding:clamp(14px,2.2vw,24px) clamp(16px,2.6vw,28px); font-size:clamp(16px,1.95vw,22px); line-height:1.85; color:var(--ink); text-align:left; max-width:820px; margin:clamp(4px,1.2vh,10px) auto; box-shadow:var(--shadow); animation:fadeUp .4s .2s ease both;}
.story p+p{margin-top:.75em;}
.story .q{color:var(--indigo-deep); font-weight:700;}
.story .mark{background:linear-gradient(transparent 58%, var(--mark) 58%);}

/* 두 칸 비교판 */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,2vw,20px); width:100%; max-width:820px; margin:clamp(4px,1.2vh,10px) auto;}
.g2-box{background:#fff; border:3px solid var(--line); border-radius:18px; padding:clamp(12px,1.9vw,20px); text-align:left; font-size:clamp(15px,1.9vw,21px); line-height:1.6; box-shadow:0 4px 0 var(--line);}
.g2-box h4{font-family:var(--f-title); font-weight:800; font-size:clamp(15px,1.9vw,20px); color:var(--indigo-deep); margin-bottom:8px;}
.g2-box.good{border-color:var(--teal-soft); box-shadow:0 4px 0 var(--teal-soft);}
.g2-box.good h4{color:var(--teal-deep);}
@media (max-width:620px){ .grid2{grid-template-columns:1fr;} .turn{max-width:100%;} }

/* 피드백 */
.fb{margin-top:clamp(12px,2vh,22px); min-height:30px; font-family:var(--f-title); font-size:clamp(18px,2.4vw,30px); color:var(--teal-deep); animation:fadeUp .3s ease both;}
.fb.bad{color:var(--emph);}

/* ===== 하단 내비 ===== */
.nav{position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:flex-end; gap:11px; padding:13px clamp(16px,4vw,40px); background:linear-gradient(to top,var(--paper) 62%,transparent);}
.navbtn{font-family:var(--f-title); font-size:clamp(15px,1.9vw,23px); border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:clamp(9px,1.3vw,14px) clamp(18px,2.6vw,38px); cursor:pointer; transition:transform .15s;}
.navbtn:hover{transform:translateY(-2px);}
.navbtn.sec{margin-right:auto;}
.navbtn.primary{background:var(--indigo); color:#fff; border-color:var(--indigo);}
.navbtn:disabled{opacity:.35; cursor:default; transform:none;}

@media (max-width:560px){ .where{display:none;} .wcard{flex:1 1 140px;} .match{gap:clamp(14px,4vw,28px);} .dots{max-width:50%;} .nav{flex-wrap:wrap;} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important;} }
</style>

</head>
<body>

<div class="topbar">
  <button class="lb" onclick="location.href='../index.html'">📚 차시 목록</button>
  <span class="pill">1차시</span>
  <span class="where">국어 5-1 · <b>5. 의논하며 토의해요</b></span>
  <div class="dots" id="dots"></div>
  <span class="score">⭐ <b id="score">0</b></span>
</div>

<div class="stage" id="stage"><div class="stage-inner" id="main"></div></div>

<div class="nav">
  <button class="navbtn sec" id="prev">◁ 이전</button>
  <button class="navbtn" id="replay">🔊 다시</button>
  <button class="navbtn" id="hint">💡 힌트</button>
  <button class="navbtn primary" id="next">다음 ▷</button>
</div>

<script>
/* ===== 1차시(준비 — 배울 내용 살펴보기) 13슬 =====
   학습 목표: 관점의 뜻을 알고, 문제를 다양한 관점에서 살펴보아야 하는 까닭을 안다.
   정답 로깅 4슬(관점의 뜻 · 서로 다른 조언 모으기 · 여러 관점으로 보는 까닭 · 받아들일 때 생각할 점) = 40점.
   ★ 저작권: 교과서 225쪽 갈등 상황 말풍선 세 개, 226쪽 「당나귀를 팔러 간 아버지와 아들」
     (아주머니·노인·농부·청년의 말) 전면 미인용. 자체 상황(사다리를 옮기는 두 사람)과
     자체 갈등 상황으로 대체. 관점의 뜻은 표준 국어 지식.
   ※ 성취기준 [6국02-04]·[6국01-06] 도입. 역량 = 비판적·창의적 사고. */
const slides=[

      <div class="recap-item"><span class="recap-ic">⚖️</span>다만 들은 대로 따르지 말고 <b>견주어 판단</b>합니다</div>

const tracker={
  answer(i,ok){ if(window.kedu&&window.kedu.recordAnswer) window.kedu.recordAnswer(LESSON_ID+'_s'+i, ok, null, null); },
  done(i){}
};
const LESSON_ID='g5_kor_u5_l01_v1';
const LESSON_MAX=40;
let cur=0, score=0;
const stage=document.getElementById('stage');
const main=document.getElementById('main');
const scoreEl=document.getElementById('score');
const prevB=document.getElementById('prev');
const nextB=document.getElementById('next');
const dotsWrap=document.getElementById('dots');

slides.forEach((s,i)=>{ const d=document.createElement('div'); d.className='dot'; d.onclick=()=>go(i); dotsWrap.appendChild(d); });
const dots=[...dotsWrap.children];

function render(){
  const s=slides[cur];
  main.innerHTML=`<span class="ka-tag">${s.tag}</span><h2 class="ka-t">${s.t}</h2>${s.html}`;
  stage.scrollTop=0;
  dots.forEach((d,i)=>{ d.classList.toggle('active',i===cur); d.classList.toggle('done',i<cur); });
  prevB.disabled=cur===0;
  nextB.textContent=cur===slides.length-1?'끝 ✓':'다음 ▷';
  if(cur===slides.length-1){ if(window.kedu&&window.kedu.recordLessonEnd) window.kedu.recordLessonEnd(score, LESSON_MAX); }
  tracker.done(cur);
  if(main.querySelector('#match')) bindMatch(s);
  if(main.querySelector('#collect')) bindCollect(s);
  if(main.querySelector('.wcard')) bindWordPick(s);
  if(main.querySelector('.trace-cell')) bindTrace();
  if(main.querySelector('.read-line')) bindRead();
  if(main.querySelector('.sc-row')) bindCheck();
  if(main.querySelector('#stageDo')) bindStage();
}
function bindWordPick(s){
  let done=false;
  main.querySelectorAll('.wcard').forEach(card=>{
    card.onclick=()=>{
      if(done) return;
      const ok=card.dataset.ok==='1';
      const fb=main.querySelector('.fb');
      if(ok){
        done=true;
        card.classList.add('correct');
        if(fb){fb.textContent=s.okMsg||'정확합니다! 🎉'; fb.classList.remove('bad');}
        if(s.log){score+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        main.querySelectorAll('.wcard').forEach(c=>{if(c!==card)c.style.opacity=.4;});
      }else{
        card.classList.add('wrong');
        if(fb){fb.textContent='다시 한 번 생각해 보세요.'; fb.classList.add('bad');}
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>card.classList.remove('wrong'),350);
      }
    };
  });
}
function bindMatch(s){
  const board=main.querySelector('#match');
  const fb=main.querySelector('#matchFb');
  const cards=board.querySelectorAll('.match-card');
  const total=cards.length/2;
  let sel=null, paired=0, logged=false;
  cards.forEach(card=>{
    card.onclick=()=>{
      if(card.classList.contains('paired')) return;
      if(!sel){ sel=card; card.classList.add('sel'); return; }
      if(sel===card){ card.classList.remove('sel'); sel=null; return; }
      if(sel.dataset.pair===card.dataset.k && card.dataset.pair===sel.dataset.k){
        sel.classList.remove('sel'); sel.classList.add('paired'); card.classList.add('paired');
        sel=null; paired++;
        if(paired===total){
          fb.textContent=s.matchMsg||'모두 알맞게 이었습니다! 🎉'; fb.classList.remove('bad');
          if(s.log && !logged){logged=true; score+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        }else{ fb.textContent='좋습니다. 다음 짝도 이어 보세요.'; fb.classList.remove('bad'); }
      }else{
        const w1=sel, w2=card;
        w1.classList.add('miss'); w2.classList.add('miss');
        fb.textContent='짝이 아닙니다. 다시 살펴보세요.'; fb.classList.add('bad');
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>{w1.classList.remove('miss','sel'); w2.classList.remove('miss');},350);
        sel=null;
      }
    };
  });
}
function bindCollect(s){
  const board=main.querySelector('#collect');
  const fb=main.querySelector('#collectFb');
  const chips=board.querySelectorAll('.chip');
  const targets=board.querySelectorAll('.chip[data-hit="1"]').length;
  let painted=0, logged=false;
  chips.forEach(chip=>{
    chip.onclick=()=>{
      if(chip.classList.contains('painted')) return;
      if(chip.dataset.hit==='1'){
        chip.classList.add('painted'); painted++;
        if(painted===targets){
          chips.forEach(c=>{if(c.dataset.hit!=='1')c.classList.add('done-dim');});
          fb.textContent=s.collectMsg||'알맞은 것을 모두 찾았습니다! 🎉'; fb.classList.remove('bad');
          if(s.log && !logged){logged=true; score+=10; scoreEl.textContent=score; tracker.answer(cur,true);}
        }else{ fb.textContent=`좋습니다. ${painted}개 찾았어요. 남은 것도 찾아보세요.`; fb.classList.remove('bad'); }
      }else{
        chip.classList.add('miss');
        fb.textContent='이것은 아닙니다. 다시 살펴보세요.'; fb.classList.add('bad');
        if(s.log)tracker.answer(cur,false);
        setTimeout(()=>chip.classList.remove('miss'),350);
      }
    };
  });
}
function bindTrace(){
  const cells=main.querySelectorAll('.trace-cell');
  const fb=main.querySelector('#traceFb');
  const total=cells.length;
  let done=0;
  cells.forEach(c=>{
    c.onclick=()=>{
      if(c.classList.contains('done')) return;
      c.classList.add('done'); done++;
      if(fb){ if(done===total) fb.innerHTML='모두 따라 썼어요! 또박또박 잘 썼어요. 🎉'; else fb.innerHTML=`잘하고 있어요! <b>${done}</b>글자 따라 썼어요.`; }
    };
  });
}
function bindRead(){
  const lines=main.querySelectorAll('.read-line');
  const fb=main.querySelector('#readFb');
  const total=lines.length;
  let done=0;
  lines.forEach(l=>{
    l.onclick=()=>{
      if(l.classList.contains('read')) return;
      l.classList.add('read'); done++;
      if(fb){ if(done===total) fb.innerHTML='끝까지 읽었습니다! 🎉'; else fb.innerHTML=`<b>${done}</b>줄 읽었습니다.`; }
    };
  });
}
function bindCheck(){
  main.querySelectorAll('.sc-row').forEach(r=>{ r.onclick=()=>{ r.classList.toggle('checked'); }; });
}
function bindStage(){
  const btn=main.querySelector('#stageDo');
  const fb=main.querySelector('#stageFb');
  btn.onclick=()=>{ btn.classList.add('done'); btn.textContent='✅ 완료'; if(fb) fb.textContent=btn.dataset.fb||'잘했습니다! 👏'; };
}
function go(n){ if(n>=0&&n<slides.length){ cur=n; render(); } }
prevB.onclick=()=>go(cur-1);
nextB.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
document.getElementById('hint').onclick=()=>{
  const s=slides[cur];
  if(s.hint){ alert('💡 '+s.hint); return; }
  if(main.querySelector('#match')) alert('💡 왼쪽 항목을 먼저 누르고, 짝이 되는 것을 이어 누르세요.');
  else if(main.querySelector('.wcard')) alert('💡 말과 행동, 그리고 상황을 함께 살펴보면 답이 보입니다.');
  else if(main.querySelector('#collect')) alert('💡 조건에 맞는 것만 모두 고르세요. 하나가 아닐 수 있습니다.');
  else if(main.querySelector('.trace-cell')) alert('💡 한 칸씩 또박또박 따라 쓰세요.');
  else if(main.querySelector('.read-line')) alert('💡 한 줄씩 눈으로 읽으며 눌러 확인하세요.');
  else if(main.querySelector('#stageDo')) alert('💡 실제로 말해 보거나 공책에 써 본 뒤 버튼을 누르세요.');
  else alert('💡 천천히 다시 읽어 보면 실마리를 찾을 수 있습니다.');
};
document.getElementById('replay').onclick=()=>{ render(); };
render();
</script>

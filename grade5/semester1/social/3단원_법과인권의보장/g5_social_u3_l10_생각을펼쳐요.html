생각을 펼쳐요, 지도서 p.316~317) 근거
학습 목표: 「법과 인권의 보장」에서 공부한 내용을 바탕으로 창의·융합 활동을 할 수 있다.
수업 기법 및 전략: 창의적으로 문제 해결하기 · 장애물 없는 생활 환경 제안하기
융합 교과: 사회, 미술 / 핵심 역량: 비판적 사고력, 정보 활용 능력
직접조작: 제안서 짓는 판(신규 패턴 — 고쳐 짓기형 / 내기 전에는 몇 번이든 고쳐 쓸 수 있다)
  ⭐ 앞의 서른네 종은 전부 **한 번 놓은 것을 되돌리지 못했다.** 카드를 놓으면 잠겼고, 걸음을
     세우면 잠겼고, 별표를 주면 그 종이에 남았다. 되돌리는 자리는 l07의 「다시 배분하기」
     하나뿐이었고 그것도 **전부 초기화**였다. 이번만 **한 칸만 골라 바꾼다** — 「어디에」를
     바꿔도 「무엇을」과 「무엇을 위해」는 그대로 남는다. 제안하는 글은 더 알맞은 것이
     떠오르면 그 자리만 고쳐 쓰는 것이기 때문이다.
  ⭐ **판은 조각 하나에는 옳고 그름을 말하지 않는다.** 무엇을 골라도 판은 고른 것을 종이에
     옮겨 적기만 한다. 「제안서 내기」를 눌러야 비로소 **세 조각이 서로 맞물리는지**를 본다 —
     제안 한 줄은 「어디에·무엇을·무엇을 위해」가 모여야 말이 되기 때문이다.
     ⚠️ 가장 가까운 앞선 패턴은 u2 l09 「동시 짓는 책상」(초고·퇴고 2회전형)의 **판정 미룸**이다.
        다른 점 — 거기서는 네 자리를 채우는 동안 **무엇을 놓아도 받아 주고** 「다시 읽어 보기」가
        네 줄을 통째로 훑었다면, 여기서는 판이 **조각들 사이의 맞물림**만 보고 **어긋난 벌 하나만**
        짚는다. 그리고 짚인 뒤에도 잠기는 것이 없다(고쳐서 다시 내면 된다).
  ⭐ **어긋났을 때 판은 알맞은 조각을 말하지 않는다.** 「놓을 곳과 시설이 서로 맞지 않아요」
     「시설과 까닭이 서로 맞지 않아요」까지만이다. 어느 벌을 다시 볼지만 알려 준다.
  ① **세 벌(어디에·무엇을·무엇을 위해)을 아무 차례로나 채우기**(순서 강제 0 · 정답 조합 넷 —
     어느 제안을 지어도 좋다) → ② **제안서 내기**(맞물림 판정) → ③ **우리 반이 낸 다른 제안**
     세 줄이 펼쳐진다(지도 방법 "각자 제안한 시설을 학급 전체가 공유할 수 있도록 한다")
     → ④ 마무리 3택(정답 자리 1).
  ⚠️ 세 벌 전량 고정 리터럴 — 난수 0. 「어디에」 네 갈래는 교과서 p.151 「학교의 여러 시설」
     원문 갈래(학교 내부 시설·위생 시설·안내 시설·기타 시설), 「무엇을」 네 줄은 지도서 p.317
     예시 답안 원문, 「무엇을 위해」 네 줄은 그 시설이 하는 일을 어린이 말로 적은 것이다
     (학술 용어 0 · 창작 사례 0).
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 벌·조각·마무리 번호(`Number.isInteger`) /
     ③ 세 칸이 차기 전 「제안서 내기」 무시(순서) / ④ **제안서를 낸 뒤 고치기·재제출 무시** /
     ⑤ 같은 조각 재선택 무시 / ⑥ 제안서를 내기 전 마무리 무시(순서) /
     ⑦ 어긋난 벌만 짚기(알맞은 조각 비노출) / ⑧ 안내가 떠 있는 동안 재클릭 무시(`bpBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.bp-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
  ⚠️ 활동 2(실현된 모습을 그림으로 나타내기)는 **화면에서 흉내내지 않는다** — 교과서가 요구하는
     것은 색칠 도구로 종이에 직접 그리는 일이고, 조작이 다루는 것은 **제안 한 줄을 짓는 일**이다
     (정직 원칙, l09 규약 승계).
지도서 근거(16차시 p.316~317):
  [동기 유발] 단원을 공부하며 기억에 남는 내용·느낀 점 3종 — 법이 일상생활 속 많은 부분에
    영향을 미치고 있다는 점 / 법을 지키고 인권을 존중하는 태도를 살펴본 것 /
    나의 인권뿐만 아니라 다른 사람의 인권도 소중하다는 것.
  [학습 문제] 단원에서 공부한 내용을 바탕으로 창의·융합 활동을 해 봅시다.
  [제도 원문 p.150] 우리 사회는 사람들이 일상에서 편리하게 이동하고 생활할 수 있는 환경을
    만들기 위해 **법에 근거하여** 「장애물 없는 생활 환경 인증 제도」를 시행하고 있다. 이는
    **어린이, 노인, 장애인, 임산부 등을 비롯한 모든 사람**이 건물이나 시설 등을 이용할 때
    불편을 느끼지 않도록 **설계하고 관리하는 것을 평가하는 제도**이다.
  [달라지는 학교 모습 2종] 시각 장애가 있는 사람이 안전하게 출입할 수 있도록 학교 현관에
    점자 블록을 설치했습니다 / 휠체어를 탄 사람이 편리하게 출입할 수 있도록 교실 출입문의
    폭을 정해 두었습니다.
  [활동 1 p.151] 학교의 여러 시설 — 학교 내부 시설(교실 출입문·복도·계단·경사로·승강기) /
    위생 시설(화장실 출입문·대변기·소변기·세면대) / 안내 시설(안내판·점자 블록) /
    기타 시설(급식실·강당·장애인 전용 주차 구역). 예 = 강당의 무대를 오르내릴 수 있는
    경사로를 만들고 벽에 안전 손잡이를 설치합니다.
  [예시 답안 1] 강당의 무대를 오르내릴 수 있는 경사로를 만들고 벽에 안전 손잡이를 설치한다 /
    교실 출입문의 문턱을 없앤다 / 학교의 층마다 장애인 전용 화장실을 설치한다 /
    학교 출입 현관에 음성 지원 학교 안내판을 설치한다.
  [발표 예 3종] 우리 학교에 장애인 전용 화장실이 생겼으면 좋겠습니다 / 우리 학교의 복도에
    점자 블록을 설치하면 좋겠습니다 / 강당 무대에 리프트나 경사로를 설치하면 좋겠습니다.
  [활동 2] 1에서 제안한 내용이 실현된 모습을 그림으로 나타내 봅시다(준비물 = 색칠 도구).
    지도서 예시 답안 2 = 강당 무대에 경사로 설치 / 문턱을 없앤 교실 출입문.
  [지도 방법] 다양한 사진과 그림을 활용하여 제도를 쉽게 설명한다 / **기준을 주지 않으면
    학생들이 활동하기에 어려울 수 있으므로** 학교 내부 시설, 위생 시설, 안내 시설, 기타 시설
    등으로 나눠 살펴볼 장소를 미리 제시한다 / **각자 제안한 시설을 학급 전체가 공유**할 수
    있도록 한다.
  [핵심 역량] 설치됐으면 하는 시설을 꼼꼼하게 살펴보며 **비판적 사고력**을, 지금까지 공부했던
    내용과 인터넷 검색을 활용하여 추가로 제안하고 싶은 시설을 작성하는 과정에서
    **정보 활용 능력**을 기를 수 있다. 융합 교과 = 사회, 미술.
  [정리] 차시 예고 = 다음 시간에는 「법과 인권의 보장」에서 공부한 내용을 정리해 보겠습니다.
⚠️ 설계 원칙:
  · **17차시(단원 마무리) 침범 0** — 생각 그물·교실 놀이·단원 평가 0. 「정리해요」는
    차시 예고 두 자리에서만(스모크가 개수 대조).
  · **9~15차시는 회수만** — 인권 침해 사례·해결 방법 토의·보호 노력·실천 활동은 도입과
    문항에서 낱말로만 되짚고 다시 가르치지 않는다. 동네 아홉 칸·토의 종이·별표·학교 답사
    다섯 곳·실천 차례표 0. 인권 사진전·포스터 전시회·손수 제작물 0.
  · **교사용 참고 자료 0** — 인증 기관·인증 등급·심사 절차·「장애인 등의 편의 증진 보장에
    관한 법률」 등 법령 이름·인증 건수·배리어 프리·유니버설 디자인 용어 0.
  · **실제 인증 건물·학교를 특정해 그리거나 인용하지 않는다** · 누리집 주소 0 · 신문 인용 0.
  · **기본권 학술 용어 0**(주제① 규약 승계) · 구제 절차 0 · 국가 인권 위원회 0.
  · **학생 이름 0 · 우리나라 지역 이름 0 · 본문·문항 연도·금액·비율 0.**
  · 정서 — 우리 학교를 모자란 곳으로 그리지 않는다. 이미 갖춘 것(점자 블록·출입문 폭)을
    먼저 보여 주고, 제안은 부족해서가 아니라 **더 나아지기 위해** 쓴다. 시설을 이용하기
    어려운 사람을 안쓰러운 대상이 아니라 **함께 학교를 쓰는 사람**으로 쓴다.
  · 3단원 색 **#7E22CE(보라)** — CSS 변수값만 바꾸고 변수명은 그대로 두어 엔진 코드를 무수정 승계한다.

/* ===== 직접조작 — 제안서 짓는 판(신규 패턴 — 고쳐 짓기형) =====
   BP_WHERE·BP_WHAT·BP_WHY = 세 벌의 조각. 교과서 p.151 「학교의 여러 시설」 네 갈래와
   지도서 p.317 예시 답안 네 줄에서 그대로 왔다(고정 리터럴 — 난수 0).
   ⭐ 판은 조각 하나하나에는 옳고 그름을 말하지 않는다. 「제안서 내기」를 눌러야 비로소
      세 조각이 서로 맞물리는지를 본다. 제안 한 줄은 세 조각이 모여야 말이 되기 때문이다.
   ⭐ 그리고 제안서를 내기 전에는 **이미 고른 조각도 몇 번이든 바꿀 수 있다** — 한 벌만 골라
      바꾸면 나머지 두 벌은 그대로 남는다(부분 되돌리기).
   ⭐ 맞물리지 않으면 판은 **어느 벌이 어긋났는지만** 말하고 알맞은 조각은 말하지 않는다.
   정답 조합은 넷(같은 번호끼리) — 어느 것을 지어도 좋다. */
const BP_SLOT = ['어디에','무엇을','무엇을 위해'];
const BP_WHERE = [
  {t:'강당의 무대에',   s:'강당의 무대',   cat:'기타 시설'},
  {t:'교실 출입문에',   s:'교실 출입문',   cat:'학교 내부 시설'},
  {t:'학교의 층마다',   s:'학교의 층마다', cat:'위생 시설'},
  {t:'학교 출입 현관에', s:'학교 출입 현관', cat:'안내 시설'}
];
const BP_WHAT = [
  {t:'오르내릴 수 있는 경사로를 만들고 벽에 안전 손잡이를 설치합니다', s:'경사로와 안전 손잡이'},

];
const BP_WHY = [
  {t:'무대에 오르내리기 어려운 사람도 무대에 설 수 있도록', s:'무대에 오르내리도록'},
  {t:'휠체어를 탄 사람이 문턱에 걸리지 않고 드나들 수 있도록', s:'문턱에 걸리지 않도록'},
  {t:'어느 층에 있어도 멀리 돌아가지 않고 이용할 수 있도록', s:'가까운 층에서 쓰도록'},
  {t:'글자를 읽기 어려운 사람도 안내를 들을 수 있도록',     s:'안내를 들을 수 있도록'}
];
const BP_FIN = [
  '내가 불편하지 않은 곳은 살펴보지 않아도 돼요.',
  '어린이, 노인, 장애인, 임산부 등을 비롯한 모든 사람이 불편을 느끼지 않도록 학교를 살펴봐야 해요.',
  '학교 시설은 어른들이 정하는 것이니 학생은 제안하지 않아도 돼요.'
];

function bpFilled(st){ return st.bpSel.every(v=>v!=null); }
function bpLine(i){ return BP_WHERE[i].t+' '+BP_WHY[i].t+' '+BP_WHAT[i].t+'.'; }

/* 판 — 제안서 종이 세 칸. 채운 칸만 글이 적히고, 확정 전에는 어떤 정오 표시도 없다. */
function bpCanvas(st){
  const L=['어디에','무엇을','무엇을 위해'];
  const POOL=[BP_WHERE,BP_WHAT,BP_WHY];
  let g='';
  g+=`<text x="160" y="14" font-size="9.2" fill="#581C87" text-anchor="middle" font-weight="800">📄 우리 학교에 제안하고 싶은 시설</text>`;
  for(let t=0;t<3;t++){
    const y=22+t*34, v=st.bpSel[t], got=(v!=null);
    g+=`<rect x="8" y="${y}" width="304" height="30" rx="7" fill="${got?'#FFFDF5':'#F8FAFC'}" stroke="${got?'#E7D9A8':'#CBD5E0'}" stroke-width="1.4" ${got?'':'stroke-dasharray="3 3"'}/>`;
    g+=`<rect x="14" y="${y+6}" width="52" height="18" rx="5" fill="${got?'#B45309':'#CBD5E0'}"/>`;
    g+=`<text x="40" y="${y+18.5}" font-size="7.2" fill="#fff" text-anchor="middle" font-weight="800">${L[t]}</text>`;
    g+=`<text x="74" y="${y+19}" font-size="7.8" fill="${got?'#3F3A2C':'#94A3B8'}" font-weight="${got?800:700}">${got?POOL[t][v].s:'아직 비어 있어요'}</text>`;
  }
  if(st.bpOk){
    g+=`<rect x="8" y="126" width="304" height="18" rx="6" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.3"/>`;
    g+=`<text x="160" y="138" font-size="7.6" fill="#581C87" text-anchor="middle" font-weight="800">제안서를 냈어요 — 학급 전체가 함께 나눠요</text>`;
  } else {
    g+=`<rect x="8" y="126" width="304" height="18" rx="6" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1.3" stroke-dasharray="3 3"/>`;
    g+=`<text x="160" y="138" font-size="7.6" fill="#94A3B8" text-anchor="middle" font-weight="700">세 칸이 모여야 제안 한 줄이 돼요</text>`;
  }
  return `<svg viewBox="0 0 320 152"><rect width="320" height="152" fill="#ffffff"/>${g}</svg>`;
}

function bpPanel(st){
  const done = st.bpFin!=null;
  const POOL=[BP_WHERE,BP_WHAT,BP_WHY];
  let right='';
  const cnt = st.bpSel.filter(v=>v!=null).length;
  right+=`<div class="dw-step">📄 제안서 ${st.bpOk?'완성':'짓는 중'} · 채운 칸 ${cnt} / 3</div>`;

  if(done){
    const i=st.bpSel[0];
    right+=`<div class="dw-card"><div class="pt">📄 내가 낸 제안서</div>
      <div>${bpLine(i)}</div>
      <div style="margin-top:5px">이 제안이 실현된 모습을 <b>그림으로 나타내</b> 보면, 우리 학교가 어떻게 달라질지 한눈에 보여요.</div>
      <div style="margin-top:5px;color:#64748B">판은 조각 하나하나에는 아무 말도 하지 않았어요. <b>세 조각이 모여야</b> 제안 한 줄이 되니까요.</div></div>`;
  } else if(st.bpOk){
    right+=`<div class="bp-q">우리 학교에 제안할 시설을 찾으려면 어떻게 해야 할까요?</div>`;
    right+=`<div class="bp-fin">${BP_FIN.map((f,k)=>
      `<button class="${st.bpWrongF===k?'no':''}" onclick="bpFinish(${k})">${f}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="bp-q">「어디에 · 무엇을 · 무엇을 위해」 세 칸을 채워 제안 한 줄을 지어요.</div>`;
    right+=`<div class="bp-tabs">${BP_SLOT.map((nm,t)=>
      `<button class="${st.bpTab===t?'cur':''}" onclick="bpTabTo(${t})">${nm}<span class="dot">${st.bpSel[t]==null?'비어 있어요':'채웠어요'}</span></button>`).join('')}</div>`;
    right+=`<div class="bp-list">${POOL[st.bpTab].map((x,k)=>
      `<button class="${st.bpSel[st.bpTab]===k?'on':''}" onclick="bpPick(${st.bpTab},${k})">${x.t}</button>`).join('')}</div>`;
    right+=`<button class="bp-send ${bpFilled(st)?(st.bpWrongSend?'no':''):'off'}" onclick="bpSubmit()">📄 제안서 내기</button>`;
  }

  if(!done && (cnt>0 || st.bpOk)){
    right+=`<div class="bp-draft"><span class="sh">📄 지금까지 지은 제안</span>`;
    for(let t=0;t<3;t++){
      const v=st.bpSel[t];
      right+=`<div class="row"><b>${BP_SLOT[t]}</b> ${v==null?'<span class="em">아직 비어 있어요</span>':POOL[t][v].t}</div>`;
    }
    right+=`</div>`;
  }
  if(st.bpOk){
    const mine=st.bpSel[0];
    right+=`<div class="bp-share"><span class="sh">🗣️ 우리 반이 낸 다른 제안</span>${
      [0,1,2,3].filter(i=>i!==mine).map(i=>`<div class="row">${bpLine(i)}</div>`).join('')}</div>`;
  }
  if(st.bpMsg) right+=`<div class="dw-msg${st.bpWarn?' warn':''}">${st.bpMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">📄 우리 학교에 제안하고 싶은 시설을 한 줄로 지어 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${bpCanvas(st)}<div class="cvcap">제안서를 내기 전에는 몇 번이든 고쳐 쓸 수 있어요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    <div class="sum-item"><span class="n">③</span><div>제안 한 줄은 <b style="color:var(--green)">어디에·무엇을·무엇을 위해</b>가 모여야 말이 돼요. 내기 전까지는 얼마든지 고쳐 쓸 수 있어요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--red)">나에게 편한 것이 모두에게 편한 것은 아니에요.</b> 여럿의 눈으로 함께 살펴보고 각자 제안한 시설을 학급 전체가 나눌 때, 모든 사람이 편한 학교에 가까워져요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">「법과 인권의 보장」에서 공부한 내용을 정리</b>해요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"「장애물 없는 생활 환경 인증 제도」가 무엇인지 설명할 수 있어요","지식·이해",st)}
    ${selfCheck(1,"학교의 여러 시설을 갈래로 나눠 살펴보고 제안하고 싶은 시설을 쓸 수 있어요","과정·기능",st)}
    ${selfCheck(2,"모든 사람이 불편을 느끼지 않는 학교를 만들려는 마음을 갖게 됐어요","가치·태도",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">「법과 인권의 보장」 정리</b>!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,area,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span class="tagx">${area}</span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l10";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  bpTab:0, bpSel:[null,null,null], bpOk:false, bpFin:null,
  bpWrongSend:false, bpWrongF:null, bpMsg:null, bpWarn:false, bpBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function bpRender(){ main.innerHTML = slides[state.idx].render(state); }

/* 벌 바꾸기 — 어느 벌이든 아무 차례로나 열 수 있다(순서 강제 0) */
function bpTabTo(t){
  if(state.bpFin!=null) return;                                        // 가드① 확정 후 전체 잠금
  if(state.bpBusy) return;                                             // 가드⑧ 안내 표시 중 재클릭 무시
  if(state.bpOk) return;                                               // 가드④ 제안서를 낸 뒤에는 고치지 않는다
  if(!Number.isInteger(t) || t<0 || t>=BP_SLOT.length) return;          // 가드② 무효 벌 번호
  state.bpTab=t; state.bpWrongSend=false; state.bpMsg=null; state.bpWarn=false;
  bpRender();
}

/* ① 조각 고르기 — ⭐ 판은 조각 하나에는 옳고 그름을 말하지 않는다(이 패턴의 핵심) */
function bpPick(t,k){
  if(state.bpFin!=null) return;                                        // 가드①
  if(state.bpBusy) return;                                             // 가드⑧
  if(state.bpOk) return;                                               // 가드④ 확정 뒤 고치기 무시
  if(!Number.isInteger(t) || t<0 || t>=BP_SLOT.length) return;          // 가드② 무효 벌 번호
  const pool = [BP_WHERE,BP_WHAT,BP_WHY][t];
  if(!Number.isInteger(k) || k<0 || k>=pool.length) return;             // 가드② 무효 조각 번호
  if(state.bpSel[t]===k) return;                                       // 가드⑤ 같은 조각 재선택 무시
  const changed = state.bpSel[t]!=null;                                // ⭐ 부분 되돌리기 — 이 벌만 바뀐다
  state.bpSel[t]=k; state.bpTab=t; state.bpWrongSend=false; state.bpWarn=false;
  state.bpMsg = changed
    ? '<b>'+BP_SLOT[t]+'</b> 칸을 다시 골랐어요. 나머지 칸은 그대로예요.'
    : (bpFilled(state)
        ? '세 칸이 모두 찼어요. <b>제안서 내기</b>를 눌러 봐요.'
        : '<b>'+BP_SLOT[t]+'</b> 칸을 채웠어요. 남은 칸도 채워 봐요.');
  playBlip(); bpRender();
}

/* ② 제안서 내기 — ⭐ 판은 여기에서 처음으로 맞물림을 본다 */
function bpSubmit(){
  if(state.bpFin!=null) return;                                        // 가드①
  if(state.bpBusy) return;                                             // 가드⑧
  if(state.bpOk) return;                                               // 가드④ 두 번 내지 않는다
  if(!bpFilled(state)){                                                // 가드③ 세 칸 전 확정 무시(순서)
    state.bpWrongSend=true; state.bpWarn=true; state.bpBusy=true;
    state.bpMsg='아직 <b>비어 있는 칸</b>이 있어요. 세 칸이 모여야 제안 한 줄이 돼요.';
    playThud(); bpRender();
    setTimeout(()=>{ state.bpWrongSend=false; state.bpMsg=null; state.bpWarn=false; state.bpBusy=false; bpRender(); },1600);
    return;
  }
  const [w,f,y]=state.bpSel;
  if(w!==f){                                                           // ⭐ 어긋난 벌만 짚는다 — 알맞은 조각은 말하지 않는다
    state.bpWrongSend=true; state.bpWarn=true; state.bpBusy=true; state.bpTab=1;
    state.bpMsg='<b>놓을 곳과 시설</b>이 서로 맞지 않아요. 그곳에서 사람들이 무엇을 하는지 다시 생각해 봐요.';
    playThud(); bpRender();
    setTimeout(()=>{ state.bpWrongSend=false; state.bpMsg=null; state.bpWarn=false; state.bpBusy=false; bpRender(); },1600);
    return;
  }
  if(y!==f){
    state.bpWrongSend=true; state.bpWarn=true; state.bpBusy=true; state.bpTab=2;
    state.bpMsg='<b>시설과 까닭</b>이 서로 맞지 않아요. 그 시설이 하는 일을 다시 읽어 봐요.';
    playThud(); bpRender();
    setTimeout(()=>{ state.bpWrongSend=false; state.bpMsg=null; state.bpWarn=false; state.bpBusy=false; bpRender(); },1600);
    return;
  }
  state.bpOk=true; state.bpWrongSend=false; state.bpWarn=false;
  state.bpMsg='제안 한 줄이 됐어요 — <b>'+bpLine(w)+'</b>';
  playChime(); bpRender();
}

/* ③ 마무리 3택 — 이 조작에서 옳고 그름이 있는 마지막 칸 */
function bpFinish(k){
  if(state.bpFin!=null) return;                                        // 가드①
  if(state.bpBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=BP_FIN.length) return;           // 가드② 무효 마무리 번호
  if(!state.bpOk) return;                                              // 가드⑥ 제안서를 내기 전 마무리 무시(순서)
  if(k===BP_FIN_OK){
    state.bpFin=k; state.bpWrongF=null; state.bpMsg=null; state.bpWarn=false;
    playChime(); bpRender(); return;
  }
  state.bpWrongF=k; state.bpWarn=true; state.bpBusy=true;
  state.bpMsg = k===0
    ? '나에게 불편하지 않은 곳도 <b>누군가에게는 불편할 수 있어요.</b> 함께 살펴봐야 해요.'
    : '학생도 학교를 쓰는 사람이에요. <b>제안하는 것부터</b> 우리가 할 수 있는 일이지요.';
  playThud(); bpRender();
  setTimeout(()=>{ if(state.bpWrongF===k){ state.bpWrongF=null; state.bpMsg=null; state.bpWarn=false; } state.bpBusy=false; bpRender(); },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 주제② l11 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

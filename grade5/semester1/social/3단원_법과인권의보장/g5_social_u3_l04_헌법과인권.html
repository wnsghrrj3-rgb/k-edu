K-edu 사회 5-1 · 3단원 법과 인권의 보장 · 주제① 법의 역할과 인권 · 4차시(l04)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사03-01] · 교과서 p.123~127 · 지도서(대단원3 **6~7차시** 헌법에 담긴 인권 보장 사례를 찾아볼까요,
지도서 p.253~265) 근거
학습 목표: 헌법에 담긴 인권 보장 사례를 찾을 수 있다.
수업 기법 및 전략: 개념 파악하기 · 조사하기 · 자료 제작하기
직접조작: 인권 소책자 만들기(신규 패턴 — 층이 물린 제작형 / 앞선 선택이 뒤의 정답을 바꾼다)
  ⭐ 앞의 스물여덟 종은 **정답이 판에 고정돼 있었다.**
     상황 여섯 장이든 검색어 여덟이든 장면 여섯이든, 어느 자리의 답인지는 판이 미리 정해 두었고
     학생이 무엇을 먼저 골랐든 그 답은 달라지지 않았다.
     이번만 다르다 — **내가 첫 층에서 무엇을 골랐느냐에 따라 둘째 층의 후보와 정답이 통째로 바뀐다.**
     「차별받지 않아요」를 담기로 한 면과 「정치에 참여해요」를 담기로 한 면은
     **같은 자리에서 서로 다른 것을 정답으로 요구한다.** 판정 기준이 처음으로 **내 선택 위에 얹힌다.**
     왜냐하면 이 차시가 만드는 것이 답안이 아니라 **소책자**이기 때문이다 —
     소책자의 한 면은 “**헌법에 담긴 인권**”과 “**인권이 실제 생활에 적용된 모습**”이 짝을 이루어야
     비로소 한 면이 된다(지도서 지도 꿀 Tip: “소책자의 각 면에는 제목, 헌법에 담긴 인권,
     인권이 실제 생활에 적용된 모습, 관련한 모습을 그린 그림이나 사진 등을 담을 수 있다”).
  ⭐ 그리고 **만든 것을 조작 안에서 다시 읽는다.** 다섯 면을 다 만들면 「📖 소책자 넘겨 보기」가 열리고,
     ◀ ▶로 자기가 만든 면을 처음부터 넘겨 본다. **넘겨 보기 전에는 마무리가 열리지 않는다(가드⑦)** —
     지도서 [친구와 활동]이 만든 소책자를 **발표하고 전시하며 돌아다니며 관람**하게 하기 때문이다.
  ① **헌법에 담긴 인권 고르기** — 다섯 가운데 남은 것 하나(어느 것부터 담아도 된다. **정답 없음**).
  ② **실제 생활에 적용된 모습 둘 찾기** — 네 후보 가운데 **그 인권의 모습 둘**(교과서 원문 2종).
     후보 넷은 ①에서 고른 인권에 따라 통째로 달라진다. 둘을 다 찾으면 한 면이 접혀 소책자에 쌓인다.
  ③ 다섯 면 완성 → **소책자 넘겨 보기**(◀ ▶ · 판정 없음).
  ④ 마무리 3택 — **인권의 뜻**
     = “사람이 태어나면서 당연히 가지는 권리로, 사람이라면 누구나 누려야 할 기본적인 권리”(지도서 원문).
  ⚠️ 인권 다섯·생활 모습 열·후보 네 벌은 모두 **고정 리터럴 — 난수 0**.
     후보 안의 정답 자리도 리터럴이고, 열 자리에 0·1·2·3이 각각 두 번 이상 온다.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 인권·모습·면·마무리 번호(`Number.isInteger`) /
     ③ 인권을 고르기 전 모습 클릭 무시(순서 강제) / ④ 이미 만든 인권 재선택 무시 /
     ⑤ 이미 찾은 모습 재클릭 무시 / ⑥ 다섯 면 전 넘겨 보기 무시 · 넘겨 보기 전 면 넘김 무시 /
     ⑦ **소책자를 한 번도 넘겨 보지 않았으면 마무리 무시**(만든 것을 다시 읽어야 한다) /
     ⑧ 안내가 떠 있는 동안 재클릭 무시(`bkBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.bk-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
지도서 근거(6~7차시 p.253~265):
  [동기 유발] 우리가 살아갈 때 꼭 필요한 것 — 편하게 쉬고 잠을 잘 수 있는 집 / 배고플 때 먹을 음식 /
    서로를 존중하고 배려할 수 있어야 함 / 차별받지 않고 평등한 대우를 받아야 함.
  [학습 문제] 헌법에 담긴 인권 보장 사례를 찾아봅시다.
  [전개 1] **인권** = 사람이 태어나면서 당연히 가지는 권리로, 사람이라면 누구나 누려야 할 기본적인 권리.
    인권의 특징 넷 — ① 태어나는 순간부터 주어짐 ② 성별, 나이, 국적 등에 관계없이 누구나 누림
    ③ 차별 없이 평등하게 주어짐 ④ 다른 사람이 힘이나 권력으로 함부로 빼앗을 수 없음.
    일상생활에서 누리고 있는 인권 — 학교에서 교육을 받음 / 집에서 맛있는 음식을 먹고 편안하게 잠을 잠 /
    아프면 약을 먹거나 병원에서 치료받을 수 있음.
    ⚠️ 지도 꿀 Tip: “인권이 막연하게 느껴질 수 있으므로 인권의 특징, 필요성, 사례 등과 관련지어
    다양한 생각을 할 수 있도록 지도한다.”
  [전개 2] **헌법 = 우리나라의 최고법.** 담긴 내용 — 국가 운영 원칙 / 국민의 자유와 권리를 보장하는 내용 /
    인권을 보장하는 내용. **헌법에 기본적인 인권을 정해 놓은 까닭 =
    국가 권력이 개인의 기본적인 인권을 함부로 침해할 수 없도록 하기 위해서.**
  [스스로 활동 p.124~125] 헌법에 담긴 인권 보장 다섯과 그 모습(원문) —
    ① 모든 국민이 차별받지 않고 동등하게 대우받음 → 회사의 직원 채용 과정에서 성별·나이·국적 등으로
       차별받지 않음 / 종교나 신체적 특징 등의 이유로 차별받지 않음.
    ② 국가의 간섭을 받지 않고 자유롭게 생각하고 행동할 수 있음 → 자신이 원하는 곳에서 살고 자유롭게
       이동함 / 자신이 원하는 직업을 선택함.
    ③ 국가의 정치 의사 형성 과정에 참여할 수 있음 → 선거에서 후보자로 나올 수 있음 /
       선거권을 가지고 투표함.
    ④ 권리가 침해되었을 때 국가에 일정한 행위를 요구할 수 있음 → 권리를 회복하려고 법원에서 재판을
       받음 / 행정 복지 센터에 민원을 접수함.
    ⑤ 더 나은 삶을 살 수 있도록 국가에 요구할 수 있음 → 건강하고 쾌적한 환경에서 생활함 /
       능력에 따라 균등하게 교육을 받음.
  [할 수 있어요 p.126] ‘국가 법령 정보 센터’ 누리집에서 ‘대한민국 헌법’ 검색 →
    총 **10개의 장**, **130개의 조항**. **제2장 국민의 권리와 의무**에서 보장하는 인권 —
    **제14조** 모든 국민은 거주·이전의 자유를 가진다 /
    **제34조 제1항** 모든 국민은 인간다운 생활을 할 권리를 가진다.
    조사 방법 = 책을 찾아본다 / 인터넷으로 조사한다 / 어른께 여쭤본다.
    실제 생활에 적용된 모습 예 = 방학에 멀리 여행을 간다 / 살고 싶은 곳으로 이사를 간다 /
    합당한 대가를 지불하고 책을 구입한다 / 성별, 장애, 출신지, 인종 등에 관계없이 모두가 교실에서
    함께 공부하고 교육받을 수 있다.
  [친구와 활동 p.127] **소책자 만들기** — 헌법에 담긴 인권을 소개하는 소책자를 만들어 발표하고 교실에 전시.
    알게 된 점 = 헌법을 직접 검색해 보면서 제2장의 내용을 더 자세하게 살펴볼 수 있었다 /
    헌법에서 정한 인권의 내용이 어렵다고 생각했는데 다양한 사례를 여러 가지 형식으로 표현하면서
    친근하게 느껴졌다.
  [6~7차시 주요 내용 정리] 1. 인권의 뜻 2. 인권의 특징 넷 3. 헌법에 담긴 인권 보장 다섯.
  [정리] 차시 예고 = 법을 지키고 인권을 존중하는 태도 기르기.
⚠️ 설계 원칙:
  · **8차시(법을 지키고 인권을 존중하는 태도) 선행 침범 0** — 준법·존중하는 태도 기르기·실천 다짐 0.
    ‘존중’은 [동기 유발] 예시 답안 한 자리에서만 쓴다.
  · **주제②(인권 침해 사례·인권 보호 활동) 선행 침범 0** — 인권 침해 사례·인권 보호 활동·구제 기관 0.
    ⚠️ ‘침해’라는 낱말 자체는 6~7차시 원문에 두 번 있다(“함부로 침해할 수 없도록” /
    “권리가 침해되었을 때 국가에 일정한 행위를 요구”)—그 두 자리에서만 쓴다.
  · 교사용 참고 자료 0 — **기본권 다섯의 학술 용어(평등권·자유권·참정권·청구권·사회권) 0**,
    인간으로서의 존엄과 가치·행복 추구권 0, 세계 인권 선언(조문·연도·국제 연합) 0,
    인권의 세대별 권리 0, 신분제·최저 임금·만 18세·참고 도서 0.
    → 교과서 본문과 「주요 내용 정리」가 **용어 없이 서술로만** 제시하므로 그대로 따른다.
  · 헌법 조항은 [할 수 있어요] 원문 둘(**제14조 · 제34조 제1항**)과 구성 수치(10개 장·130개 조항)만
    슬라이드에 두고, **문항에서는 조항 번호를 묻지 않는다**(내용으로만 묻는다).
  · **우리나라 지역 이름 0 · 학생 이름 0 · 문항 내 연도·금액·비율 0.**
  · 정서 — 인권은 “누가 잘해서 받는 것”이 아니다. 마무리 오답 두 개가 그 오개념을 정면으로 다룬다.
  · 3단원 색 **#7E22CE(보라)** — CSS 변수값만 바꾸고 변수명은 그대로 두어 엔진 코드를 무수정 승계한다.

  font-size:clamp(12.5px,2.1vw,15px);line-height:1.6;color:#1E3A8A;max-width:640px}
.tipbox b{color:#1D4ED8}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#EDE9FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#581C87;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#FBF7FF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 인권 소책자 만들기(층이 물린 제작형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;

.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.bk-q{background:var(--bub);border-radius:9px;padding:6px 10px;font-size:clamp(11px,1.86vw,13.2px);

.bk-list button:hover{border-color:var(--green);background:var(--bub)}
.bk-list button.got{border-color:var(--green);background:var(--bub);color:var(--green-d);cursor:default}

.bk-nav .pgn{text-align:center;font-weight:800;color:var(--green-d);font-size:clamp(10.6px,1.8vw,12.8px)}

.bk-back{border:2px solid #CBD5E0;background:#fff;color:#475569;border-radius:10px;padding:6px 8px;

.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}

const BK_OPT = [

/* 문구를 칸 폭에 맞춰 도막으로 나눈다(좌표 리터럴이라 jsdom은 폭을 못 본다) */
function bkWrap(s,n,max){
  const w=s.split(' '); const out=[]; let cur='';
  for(const t of w){ if((cur+' '+t).trim().length>n && cur){ out.push(cur); cur=t; } else { cur=(cur?cur+' ':'')+t; } }
  if(cur) out.push(cur);
  return out.slice(0,max||3);
}
function bkMade(st,i){ return st.bkBook.some(b=>b.hr===i); }

/* 판 — 위: 만들고 있는 면 · 아래: 소책자(쌓임 / 넘겨 보기) */

  const p=st.bkPick;

  }

  for(let k=0;k<2;k++){
    const y=96+k*16;
    const got = (p!=null && st.bkGot.length>k) ? HR[p].life[st.bkGot[k]] : null;
    if(got==null){
      g+=`<rect x="22" y="${y}" width="276" height="14" rx="4" fill="#fff" stroke="#E7D9A8" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      g+=`<text x="160" y="${y+10}" font-size="7.4" fill="#C7B893" text-anchor="middle">빈 칸</text>`;
    } else {
      g+=`<rect x="22" y="${y}" width="276" height="14" rx="4" fill="#fff" stroke="#7E22CE" stroke-width="1.2"/>`;
      g+=`<text x="28" y="${y+10}" font-size="6.8" fill="#475569">${got}</text>`;
    }
  }
  // 소책자
  g+=`<rect x="12" y="138" width="296" height="104" rx="12" fill="#F8FAFC" stroke="#7E22CE" stroke-width="2"/>`;
  if(st.bkView==null){
    g+=`<text x="160" y="156" font-size="10" fill="#581C87" text-anchor="middle" font-weight="800">📖 내 소책자 ${st.bkBook.length} / ${BK_GOAL}</text>`;
    for(let k=0;k<BK_GOAL;k++){
      const x=20+k*58, b=st.bkBook[k];
      if(b==null){
        g+=`<rect x="${x}" y="164" width="52" height="66" rx="6" fill="#fff" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="4 3"/>`;
        g+=`<text x="${x+26}" y="200" font-size="7.6" fill="#C7CBD3" text-anchor="middle">빈 면</text>`;
      } else {
        g+=`<rect x="${x}" y="164" width="52" height="66" rx="6" fill="#FFFDF5" stroke="#7E22CE" stroke-width="1.6"/>`;
        g+=`<text x="${x+26}" y="178" font-size="7.6" fill="#7E22CE" text-anchor="middle" font-weight="800">${k+1}</text>`;
        HR[b.hr].s.split('\n').forEach((ln,j)=>{

    g+=`<text x="50" y="196" font-size="7.4" fill="#8A6D3B" font-weight="800">실제 생활에 적용된 모습</text>`;

  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function bkPanel(st){
  if(!st.bkBook) st.bkBook=[];
  const done = st.bkFin!=null;
  const full = st.bkBook.length>=BK_GOAL;
  let right='';
  right+=`<div class="dw-step">📖 만든 면 ${st.bkBook.length} / ${BK_GOAL}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">📖 인권 소책자를 다 만들었어요</div>
      <div>다섯 면에 담은 것은 모두 <b>헌법에 담긴 인권</b>이고, 그 옆의 것은 그 인권이
      <b>실제 생활에 나타난 모습</b>이에요. 헌법에 담긴 인권은 우리 주변에서 이렇게 다양하게 보장돼요.</div>

  } else if(full){
    if(st.bkView==null && !st.bkRead){
      right+=`<div class="bk-q">다섯 면을 다 만들었어요. 소책자를 처음부터 넘겨 봐요.</div>`;
      right+=`<button class="bk-open" onclick="bkOpen()">📖 소책자 넘겨 보기</button>`;
    } else {
      right+=`<div class="bk-q">내가 만든 소책자를 넘겨 봐요.</div>`;
      right+=`<div class="bk-nav"><button onclick="bkMove(-1)">◀</button>
        <span class="pgn">${(st.bkView==null?0:st.bkView)+1} / ${BK_GOAL}</span>
        <button onclick="bkMove(1)">▶</button></div>`;
      if(st.bkRead){
        right+=`<div class="bk-q">그래서 인권이란 무엇일까요?</div>`;
        right+=`<div class="bk-fin">${BK_FIN.map((f,k)=>
          `<button class="${st.bkWrongF===k?'no':''}" onclick="bkFinish(${k})">${f}</button>`).join('')}</div>`;
      }
    }
  } else if(st.bkPick==null){
    right+=`<div class="bk-q">이번 면에 담을 <b>헌법에 담긴 인권</b>을 골라 봐요.</div>`;
    const rest=[];
    for(let i=0;i<HR.length;i++) if(!bkMade(st,i)) rest.push(i);
    right+=`<div class="bk-list">${rest.map(i=>
      `<button onclick="bkPickHr(${i})">${HR[i].h}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="bk-q">이 인권이 <b>실제 생활에 나타난 모습</b> 둘을 찾아요. (${st.bkGot.length} / 2)</div>`;
    right+=`<div class="bk-list">${BK_OPT[st.bkPick].map((o,k)=>{
      const isGot = o[0]===st.bkPick && st.bkGot.indexOf(o[1])>=0;
      return `<button class="${isGot?'got':(st.bkWrongL===k?'no':'')}" onclick="bkPickLife(${k})">${isGot?'✓ ':''}${HR[o[0]].life[o[1]]}</button>`;
    }).join('')}</div>`;
    right+=`<button class="bk-back" onclick="bkBack()">↩ 다른 인권으로</button>`;
  }
  if(st.bkMsg) right+=`<div class="dw-msg${st.bkWarn?' warn':''}">${st.bkMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">📖 헌법에 담긴 인권을 소개하는 소책자를 만들어 봐요</b></div>

}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l04";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  bkPick:null, bkGot:[], bkBook:[], bkView:null, bkRead:false, bkFin:null,
  bkWrongL:null, bkWrongF:null, bkMsg:null, bkWarn:false, bkBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function bkRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 헌법에 담긴 인권 고르기 — 정답 없음(어느 것부터 담아도 된다) */
function bkPickHr(i){
  if(state.bkFin!=null) return;                                     // 가드① 확정 후 전체 잠금
  if(state.bkBusy) return;                                          // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(i) || i<0 || i>=HR.length) return;            // 가드② 무효 인권 번호
  if(bkMade(state,i)){                                              // 가드④ 이미 만든 인권 재선택 무시
    state.bkMsg='이미 소책자에 담은 인권이에요. 다른 인권을 골라 봐요.'; state.bkWarn=true;
    playThud(); bkRender(); return;
  }
  if(state.bkPick!=null) return;                                    // 바꾸려면 「↩ 다른 인권으로」
  state.bkPick=i; state.bkGot=[]; state.bkWrongL=null;
  state.bkMsg=null; state.bkWarn=false;
  playBlip(); bkRender();
}

/* ② 실제 생활에 적용된 모습 둘 찾기 — 후보와 정답이 ①의 선택에 따라 달라진다 */
function bkPickLife(k){
  if(state.bkFin!=null) return;                                     // 가드①
  if(state.bkBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>3) return;                     // 가드② 무효 모습 번호
  if(state.bkPick==null) return;                                    // 가드③ 인권을 고르기 전 무시(순서)
  const o = BK_OPT[state.bkPick][k];
  if(o[0]===state.bkPick){
    if(state.bkGot.indexOf(o[1])>=0) return;                        // 가드⑤ 이미 찾은 모습 재클릭 무시
    state.bkGot.push(o[1]); state.bkWrongL=null; state.bkWarn=false;
    if(state.bkGot.length>=2){
      state.bkBook.push({hr:state.bkPick, got:state.bkGot.slice()});
      const n=state.bkBook.length;
      state.bkPick=null; state.bkGot=[];
      state.bkMsg = n>=BK_GOAL
        ? `${n}번째 면이 완성됐어요. 다섯 면을 모두 만들었어요.`
        : `${n}번째 면이 완성됐어요. 다음 면도 만들어 볼까요?`;
      playChime(); bkRender(); return;
    }
    state.bkMsg='하나 찾았어요. 이 인권이 나타난 모습이 하나 더 있어요.';
    playBlip(); bkRender(); return;
  }
  state.bkWrongL=k; state.bkWarn=true; state.bkBusy=true;
  state.bkMsg=`그것은 <b>「${HR[o[0]].h}」</b>가 실제 생활에 나타난 모습이에요. 지금 만드는 면과는 짝이 맞지 않아요.`;
  playThud(); bkRender();
  setTimeout(()=>{ if(state.bkWrongL===k){ state.bkWrongL=null; state.bkBusy=false; bkRender(); } else { state.bkBusy=false; } },1600);
}

/* ↩ 다른 인권으로 — 만들던 면을 비운다 */
function bkBack(){
  if(state.bkFin!=null) return;                                     // 가드①
  if(state.bkBusy) return;                                          // 가드⑧
  state.bkPick=null; state.bkGot=[]; state.bkWrongL=null; state.bkWarn=false;
  state.bkMsg='만들던 면을 비웠어요. 다른 인권을 골라 봐요.';
  playBlip(); bkRender();
}

/* ③ 소책자 넘겨 보기 — 만든 것을 다시 읽는다 */
function bkOpen(){
  if(state.bkFin!=null) return;                                     // 가드①
  if(state.bkBusy) return;                                          // 가드⑧
  if(state.bkBook.length < BK_GOAL) return;                          // 가드⑥ 다섯 면 전 넘겨 보기 무시
  state.bkView=0; state.bkRead=true;
  state.bkMsg='내가 만든 소책자예요. ◀ ▶로 넘겨 보고, 마지막 물음에 답해 봐요.';
  state.bkWarn=false; playChime(); bkRender();
}
function bkMove(d){
  if(state.bkFin!=null) return;                                     // 가드①
  if(state.bkBusy) return;                                          // 가드⑧
  if(!Number.isInteger(d)) return;                                   // 가드②
  if(state.bkView==null) return;                                     // 가드⑥ 넘겨 보기 전 면 넘김 무시
  const n = state.bkView + d;
  if(n<0 || n>=state.bkBook.length) return;                          // 가드② 범위 밖 면 번호 무시
  state.bkView=n; state.bkMsg=null; state.bkWarn=false;
  playBlip(); bkRender();
}

/* ④ 마무리 — 인권의 뜻 */
function bkFinish(k){
  if(state.bkFin!=null) return;                                     // 가드①
  if(state.bkBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=BK_FIN.length) return;        // 가드② 무효 마무리 번호
  if(state.bkBook.length < BK_GOAL) return;                          // 다섯 면 미완성
  if(!state.bkRead) return;                                         // 가드⑦ 소책자를 넘겨 보기 전 무시
  if(k===BK_FIN_OK){
    state.bkFin=k; state.bkWrongF=null; state.bkMsg=null; state.bkWarn=false;
    playChime(); bkRender(); return;
  }
  state.bkWrongF=k; state.bkWarn=true; state.bkBusy=true;
  state.bkMsg = k===1
    ? '인권은 <b>태어나는 순간부터</b> 주어져요. 어른이 되어야 생기는 것이 아니에요.'
    : '인권은 상이 아니에요. <b>차별 없이 평등하게</b> 누구에게나 주어져요.';
  playThud(); bkRender();
  setTimeout(()=>{ if(state.bkWrongF===k){ state.bkWrongF=null; state.bkMsg=null; state.bkWarn=false; state.bkBusy=false; bkRender(); } else { state.bkBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u3_l05_태도기르기.html'; } // l05 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

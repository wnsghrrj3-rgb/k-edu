성취기준 [6사03-01] · 교과서 p.110~113 · 지도서(대단원3 **2차시** 법이 무엇인지 알아볼까요, 지도서 p.224~235) 근거
학습 목표: 법이 무엇인지 설명할 수 있다.
수업 기법 및 전략: 돌아가며 말하기 · 의견 나누기
직접조작: 자물쇠 서랍(신규 패턴 — 비대칭 판정형)
  ⭐ 앞의 스물다섯 종은 전부 **판이 양쪽을 똑같이 재었다**. 두 갈래로 나누든, 관문에 대든,
     겹침을 따지든, 어느 쪽을 골라도 판은 같은 잣대로 옳고 그름을 돌려주었다.
     이번만 다르다 — **한쪽 서랍만 판정한다.**
     · **법 서랍**은 넣을 때마다 자물쇠가 걸리는지 아닌지를 돌려준다(판정한다).
     · **양심 서랍**은 무엇을 넣든 그냥 받아 준다. 아무것도 재지 않는다(판정하지 않는다).
     왜냐하면 그것이 실제 법과 양심의 차이이기 때문이다 —
     법은 국가가 재고, 양심은 아무도 재지 않는다(지도서 p.230 “법은 지키지 않으면 국가로부터
     제재를 받는다는 점에서 양심에 따라 자율적으로 지키는 약속이나 규칙과 구별된다”).
     학생은 “양심 서랍은 왜 다 받아 주지?”를 겪으면서 **강제성**의 뜻에 닿는다.
  ① 상황 카드 여섯 장(교과서 p.112 [친구와 활동] 원문 6종) 가운데 하나를 고른다.
  ② 두 서랍 가운데 하나에 넣는다 — 「법 서랍」 / 「양심 서랍」.
  ③ 판정 —
     · 법 서랍 + 법이 필요한 상황 → **철컥 잠긴다.** 카드가 법 서랍에 고정되고 더는 건드릴 수 없다.
     · 법 서랍 + 법이 필요하지 않은 상황 → **자물쇠가 걸리지 않고 카드가 되돌아온다.**
       “지키지 않아도 나라가 벌을 주지 않으니 자물쇠가 걸리지 않아요.”
     · 양심 서랍 + 무엇이든 → **언제나 들어가고 잠기지 않는다.** 언제든 도로 꺼낼 수 있다.
       다만 법이 필요한 상황을 넣으면 판 아래 「그래서 오늘 이 마을에서는」 칸에
       그 상황의 결과가 뜬다(지도서 예시 답안 원문 — 안전에 큰 위협 / 큰 사고 / 상점 주인의 큰 피해).
       ⚠️ 이때도 **막지 않는다.** 판은 알려 주기만 하고, 꺼낼지 말지는 학생이 정한다.
  ④ 법 서랍에 **자물쇠 셋**이 걸려야 마무리 3택이 열린다(순서 강제).
     마무리 = 법의 뜻 빈칸 — 「사회 구성원이 반드시 지켜야 하는 ( )이 있는 규범」 → **강제성**.
  ⚠️ 상황 여섯 장과 그 판정(SIT.law)은 **고정 리터럴 — 난수 0**.
     레이아웃 측정이 필요 없고, jsdom에서 잠김·되돌아옴·결과 표시를 그대로 검증할 수 있다.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 상황 번호(`Number.isInteger`) /
     ③ 무효 서랍 번호 / ④ 카드를 고르기 전 서랍 클릭 무시(순서 강제) /
     ⑤ 이미 잠긴 카드 재선택 무시 / ⑥ 잠긴 카드 도로 꺼내기 무시 /
     ⑦ 무효 마무리 번호 / ⑧ 자물쇠 셋이 걸리기 전 마무리 무시(순서 강제).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
지도서 근거(2차시 p.224~235):
  [동기 유발] 생각을 열어요 — 자전거를 타고 횡단보도를 건너면 안 되는 까닭 생각하기
    → 위험하기 때문이다 / 법에 정해져 있기 때문이다 / 횡단보도를 건너는 다른 사람을 다치게 할 수 있다.
    ⚠️ 학생들이 자신의 생각을 자유롭게 이야기할 수 있도록 편안한 분위기를 유도한다.
  [학습 문제] 법이 무엇인지 알아봅시다.
  [전개 1] 일상생활에서 지켜야 할 약속이나 규칙 알아보기 — 학교(바르고 고운 말 쓰기 / 실내에서 걷기),
    영화관(휴대 전화 꺼 두기 / 앞 좌석에 다리 올리지 않기 / 쓰레기 가지고 나가기),
    공원(쓰레기 아무 데나 버리지 않기 / 나무·꽃·시설물 훼손하지 않기 / 큰 소리로 소란 피우지 않기),
    그 밖의 장소(미술관 — 차례대로 줄 서기·사진 촬영 함부로 하지 않기 / 수영장 — 몸을 씻고 들어가기·물 밖에서 걷기 /
    도서관 — 다른 사람에게 방해되지 않도록 조용히 하기).
    핵심 질문 — 지키지 않으면? 다툼이나 갈등이 생긴다 / 피해를 겪는 사람이 생긴다.
    지키게 하려면? 어기면 벌을 준다 / 잘 지킬 수 있도록 제도를 만든다.
  [전개 2] 법의 특징 살펴보기 — 핵심 질문 「법은 무엇인가요?」 =
    **사회 구성원이 반드시 지켜야 하는 강제성이 있는 규범.**
    규범 = 행동하거나 판단할 때 따라야 할 기준. 핵심 질문 「법을 지키지 않으면?」 = **국가로부터 제재를 받는다.**
    제재 = 법이나 규정을 어겼을 때 국가가 행하는 처벌이나 금지 행위.
  [친구와 활동] 법이 필요한 상황 찾아보기 — 여섯 상황.
    법이 필요: 차에서 안전벨트를 하지 않는 상황 / 횡단보도에서 신호를 지키지 않는 상황 /
      상점에서 물건값을 내지 않고 가져가는 상황.
    법이 필요하지 않음: 웃어른에게 인사하지 않는 상황 / 길에 떨어진 쓰레기를 줍지 않는 상황 /
      형제끼리 말다툼하는 상황. 까닭 = 심각하게 위험한 상황은 아니다 /
      법보다는 사람들의 양심에 따라 자율적으로 지키는 것과 더 관련이 있다 /
      지키지 않아도 법의 제재를 받지 않는다.
  [풍덩 사회 속으로] 세계에는 어떤 법이 있을까 — 미국 캘리포니아주(어린이 책가방 무게 제한 → 성장하는
    어린이의 건강을 해치지 않도록) / 싱가포르(공공장소에서 껌을 씹지 못하게 함 → 씹다 뱉은 껌으로 생긴
    문제를 해결하려고) / 이탈리아 토리노(반려견을 하루에 세 번 이상 산책시키도록 → 동물을 보호하려고).
    법에는 그 나라의 문화와 가치 등이 반영될 수 있다.
  [2차시 주요 내용 정리] 1. 법의 의미 = 사회 구성원이 반드시 지켜야 하는 강제성이 있는 규범.
    2. 법의 특징 ① 모두가 반드시 지켜야 하는 강제성이 있음 ② 법을 지키지 않으면 국가로부터 제재를 받음.
  [정리] 차시 예고 = 일상생활 속 법 알아보기.
⚠️ 설계 원칙:
  · **3~4차시(일상생활 속 법) 선행 침범 0** — 개별 법 이름(「도로 교통법」·「저작권법」·「학교 급식법」 등),
    법이 우리 생활에 주는 영향, 법 사례 조사는 하나도 다루지 않는다.
  · **5차시(법의 역할) 선행 침범 0** — ‘법의 역할’·‘개인의 권리 보호’·‘사회 질서 유지’ 0.
  · **6~7차시(헌법에 담긴 인권 보장) 선행 침범 0** — 인권·헌법·기본권·세계 인권 선언 0.
  · **8차시 이후(준법 태도·인권 침해·인권 보호) 선행 침범 0.**
  · 교사용 참고 자료(「도로 교통법」 조문, 사회 규범 표, 착한 사마리아인의 법, 정의론, 법과 도덕 비교표,
    참고 도서, 활동지 가지치기 예시 답안)는 넣지 않는다.
  · **지역 이름 0**(우리나라 시·도·시·군 이름). 나라 이름은 [풍덩 사회 속으로] 원문 3개만 유지한다.
  · **학생 이름 0 · 문항 내 연도·금액·수치 0.**
  · 정서 — 자물쇠가 걸리지 않는 것을 ‘틀렸다’로 다루지 않는다. 양심 서랍은 무엇을 넣어도 받아 주고,
    법이 필요한 상황을 넣었을 때도 벌이 아니라 **그래서 무슨 일이 생기는지**만 알려 준다.
  · 3단원 색 **#7E22CE(보라)** — CSS 변수값만 바꾸고 변수명은 그대로 두어 엔진 코드를 무수정 승계한다.

.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 자물쇠 서랍(비대칭 판정형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.lk-pool{display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.lk-pool button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10px,1.7vw,12.4px);transition:.15s;
  line-height:1.35;text-align:left}
.lk-pool button:hover{border-color:var(--green);background:var(--bub)}
.lk-pool button.on{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.lk-pool button.mind{border-color:var(--cyan);background:#FBF7FF;color:var(--green-d)}
.lk-drawers{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.lk-drawers button{border:2px solid var(--green);background:#fff;color:var(--green-d);border-radius:10px;
  padding:8px 6px;cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.4px,1.78vw,12.8px);line-height:1.35}
.lk-drawers button:hover{background:var(--bub)}
.lk-drawers button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.lk-back{border:2px solid #CBD5E0;background:#fff;color:#475569;border-radius:10px;padding:6px 8px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10px,1.7vw,12.2px)}
.lk-back:hover{border-color:var(--green);color:var(--green-d)}
.lk-town{background:#FFFBEB;border:2px solid #FCD34D;border-radius:10px;padding:7px 11px;
  font-size:clamp(10.6px,1.8vw,12.8px);line-height:1.5;color:#78350F;animation:fadeUp .3s ease both}
.lk-town .th{font-weight:800;color:#B45309;margin-bottom:3px}
.lk-fin{display:flex;flex-direction:column;gap:5px}
.lk-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left}
.lk-fin button:hover{background:var(--bub)}
.lk-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

   ⚠️ 까닭 문구는 지도서 p.230 예시 답안 원문을 그대로 옮겼다. */
const SIT = [

   town:'상점 주인이 큰 피해를 입었어요.'},
  {s:'형제 말다툼',   t:'형제끼리 말다툼하는 상황',                   law:false,

];
const LK_GOAL = 3;                        // 법 서랍에 걸려야 하는 자물쇠 수 = law:true 세 장
const LK_DRAWER = ['법 서랍','양심 서랍'];
const LK_FIN = ['강제성','자율성','부탁'];
const LK_FIN_OK = 0;

function lkIn(arr,i){ return arr.indexOf(i)>=0; }
function lkFree(st,i){ return !lkIn(st.lkLock,i) && !lkIn(st.lkMind,i); }

/* 서랍 판 — 왼쪽 법 서랍(잠김) · 오른쪽 양심 서랍(안 잠김) */
function lkCanvas(st){
  const lock=st.lkLock, mind=st.lkMind;
  let g='';
  // 법 서랍
  g+=`<rect x="12" y="34" width="140" height="206" rx="12" fill="#F3E8FF" stroke="#7E22CE" stroke-width="2.4"/>`;
  g+=`<text x="82" y="20" font-size="12" fill="#581C87" text-anchor="middle" font-weight="800">법 서랍</text>`;
  g+=`<text x="82" y="50" font-size="9" fill="#7E22CE" text-anchor="middle" font-weight="700">맞으면 철컥 잠겨요</text>`;
  for(let k=0;k<LK_GOAL;k++){
    const y=62+k*30, i=lock[k];
    if(i==null){
      g+=`<rect x="22" y="${y}" width="120" height="24" rx="6" fill="#fff" stroke="#C4B5FD" stroke-width="1.6" stroke-dasharray="4 3"/>`;
      g+=`<text x="82" y="${y+16}" font-size="9" fill="#A78BFA" text-anchor="middle">빈 칸</text>`;
    } else {
      g+=`<rect x="22" y="${y}" width="120" height="24" rx="6" fill="#fff" stroke="#7E22CE" stroke-width="1.8"/>`;
      g+=`<text x="74" y="${y+16}" font-size="9.5" fill="#581C87" text-anchor="middle" font-weight="700">${SIT[i].s}</text>`;
      g+=`<rect x="124" y="${y+8}" width="11" height="9" rx="2" fill="#DDD6FE" stroke="#7E22CE" stroke-width="1.2"/>`;
      g+=`<path d="M126.5 ${y+8} L126.5 ${y+5} A3 3 0 0 1 132.5 ${y+5} L132.5 ${y+8}" fill="none" stroke="#7E22CE" stroke-width="1.2"/>`;
    }
  }
  g+=`<text x="82" y="176" font-size="10.5" fill="#581C87" text-anchor="middle" font-weight="800">자물쇠 ${lock.length} / ${LK_GOAL}</text>`;
  g+=`<text x="82" y="204" font-size="8.6" fill="#7E22CE" text-anchor="middle">지키지 않으면</text>`;
  g+=`<text x="82" y="216" font-size="8.6" fill="#7E22CE" text-anchor="middle">국가로부터 제재를 받아요</text>`;
  // 양심 서랍
  g+=`<rect x="168" y="34" width="140" height="206" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.4"/>`;
  g+=`<text x="238" y="20" font-size="12" fill="#475569" text-anchor="middle" font-weight="800">양심 서랍</text>`;
  g+=`<text x="238" y="50" font-size="9" fill="#64748B" text-anchor="middle" font-weight="700">무엇이든 그냥 받아 줘요</text>`;
  const show=Math.min(6, mind.length + (mind.length<6?1:0));
  for(let k=0;k<Math.max(1,show);k++){
    const y=62+k*28, i=mind[k];
    if(i==null){
      g+=`<rect x="178" y="${y}" width="120" height="22" rx="6" fill="#fff" stroke="#CBD5E0" stroke-width="1.6" stroke-dasharray="4 3"/>`;
      g+=`<text x="238" y="${y+15}" font-size="9" fill="#94A3B8" text-anchor="middle">빈 칸</text>`;
    } else {
      g+=`<rect x="178" y="${y}" width="120" height="22" rx="6" fill="#fff" stroke="#94A3B8" stroke-width="1.8"/>`;
      g+=`<text x="232" y="${y+15}" font-size="9.5" fill="#334155" text-anchor="middle" font-weight="700">${SIT[i].s}</text>`;
      if(SIT[i].law) g+=`<circle cx="290" cy="${y+11}" r="4" fill="#F59E0B"/>`;
    }
  }
  g+=`<text x="238" y="232" font-size="8.6" fill="#64748B" text-anchor="middle">아무것도 재지 않아요 — 잠기지 않아요</text>`;
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function lkPanel(st){
  if(!st.lkLock) st.lkLock=[];
  if(!st.lkMind) st.lkMind=[];
  const done = st.lkFin!=null;
  const full = st.lkLock.length>=LK_GOAL;
  let right='';
  right+=`<div class="dw-step">🔒 법 서랍의 자물쇠 ${st.lkLock.length} / ${LK_GOAL}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">⚖️ 법이 무엇인지 알았어요</div>
      <div>법 서랍에 걸린 세 상황은 지키지 않으면 <b>국가로부터 제재</b>를 받아요.
      양심 서랍에 넣은 일들은 <b style="color:#475569">아무도 재지 않아요</b> — 그래서 자물쇠도 걸리지 않았지요.
      바로 이 차이가 <b>강제성</b>이에요.</div>
      <div style="margin-top:5px;color:#64748B">법 = 사회 구성원이 반드시 지켜야 하는 <b>강제성</b>이 있는 <b>규범</b>이에요.</div></div>`;
  } else {
    if(st.lkPick!=null){
      right+=`<div class="dw-msg">고른 상황 — <b>${SIT[st.lkPick].t}</b><br>어느 서랍에 넣어 볼까요?</div>`;
      right+=`<div class="lk-drawers">${LK_DRAWER.map((d,k)=>
        `<button class="${st.lkWrongD===k?'no':''}" onclick="lkPut(${k})">${d}</button>`).join('')}</div>`;
    } else {
      right+=`<div class="dw-msg">상황 카드를 하나 골라 봐요.</div>`;
    }
    const rest=[];
    for(let i=0;i<SIT.length;i++) if(lkFree(st,i)) rest.push(i);
    if(rest.length){
      right+=`<div class="lk-pool">${rest.map(i=>
        `<button class="${st.lkPick===i?'on':''}" onclick="lkPickSit(${i})">${SIT[i].t}</button>`).join('')}</div>`;
    } else {
      right+=`<div class="dw-msg">여섯 상황이 모두 서랍에 들어갔어요.</div>`;
    }
    if(st.lkMind.length){
      right+=`<div class="dw-step">🫱 양심 서랍에서 도로 꺼내기</div>`;
      right+=`<div class="lk-pool">${st.lkMind.map(i=>
        `<button class="mind" onclick="lkTakeBack(${i})">↩ ${SIT[i].t}</button>`).join('')}</div>`;
    }
    const towns=st.lkMind.filter(i=>SIT[i].law);
    if(towns.length){
      right+=`<div class="lk-town"><div class="th">🏙️ 그래서 오늘 이 마을에서는</div>
        ${towns.map(i=>`· ${SIT[i].town}`).join('<br>')}</div>`;
    }
    if(full){
      right+=`<div class="dw-step">📖 빈칸을 채워 법의 뜻을 완성해요</div>`;
      right+=`<div class="dw-msg">법은 사회 구성원이 반드시 지켜야 하는 <b>( )</b>이 있는 규범이에요.</div>`;
      right+=`<div class="lk-fin">${LK_FIN.map((f,k)=>
        `<button class="${st.lkWrongF===k?'no':''}" onclick="lkFinish(${k})">${f}</button>`).join('')}</div>`;
    }
  }
  if(st.lkMsg) right+=`<div class="dw-msg${st.lkWarn?' warn':''}">${st.lkMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🔒 상황 카드를 두 서랍에 넣어 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${lkCanvas(st)}<div class="cvcap">법 서랍만 자물쇠로 판정해요. 양심 서랍은 아무것도 재지 않아요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

};

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function lkRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 상황 카드 고르기 */
function lkPickSit(i){
  if(state.lkFin!=null) return;                                    // 가드① 확정 후 전체 잠금
  if(!Number.isInteger(i) || i<0 || i>=SIT.length) return;          // 가드② 무효 상황 번호
  if(lkIn(state.lkLock,i)){                                        // 가드⑤ 이미 잠긴 카드 재선택 무시
    state.lkMsg='이미 법 서랍에 잠긴 상황이에요.'; state.lkWarn=true;
    playThud(); lkRender(); return;
  }
  if(lkIn(state.lkMind,i)) return;                                  // 양심 서랍의 카드는 ‘도로 꺼내기’로만 다룬다
  state.lkPick=i; state.lkWrongD=null; state.lkWarn=false;
  state.lkMsg=`<b>${SIT[i].t}</b> — 이 일은 어느 서랍에 넣어야 할까요?`;
  playBlip(); lkRender();
}

/* ② 서랍에 넣기 — 법 서랍만 판정한다(비대칭) */
function lkPut(d){
  if(state.lkFin!=null) return;                                    // 가드①
  if(!Number.isInteger(d) || d<0 || d>=LK_DRAWER.length) return;    // 가드③ 무효 서랍 번호
  if(state.lkPick==null) return;                                    // 가드④ 카드를 고르기 전 서랍 클릭 무시(순서)
  const i=state.lkPick, o=SIT[i];
  if(d===0){
    // 법 서랍 — 판정한다
    if(o.law){
      state.lkLock.push(i); state.lkPick=null; state.lkWrongD=null; state.lkWarn=false;
      state.lkMsg=`철컥! <b>자물쇠가 걸렸어요.</b> ${o.why} 이런 일은 지키지 않으면 <b>국가로부터 제재</b>를 받아요.`;
      playChime(); lkRender(); return;
    }
    state.lkWrongD=0; state.lkWarn=true;
    state.lkMsg=`자물쇠가 걸리지 않고 카드가 되돌아왔어요. ${o.why} 지키지 않아도 나라가 벌을 주지는 않거든요.`;
    playThud(); lkRender();
    setTimeout(()=>{ if(state.lkWrongD===0){ state.lkWrongD=null; lkRender(); } },1600);
    return;
  }
  // 양심 서랍 — 판정하지 않는다. 무엇이든 받아 준다
  state.lkMind.push(i); state.lkPick=null; state.lkWrongD=null;
  if(o.law){
    state.lkWarn=false;
    state.lkMsg=`양심 서랍은 <b>아무것도 재지 않아요.</b> 그래서 이 카드도 그냥 들어갔어요. 다만 아래 마을을 한번 보세요.`;
  } else {
    state.lkWarn=false;
    state.lkMsg=`양심 서랍에 들어갔어요. ${o.why}`;
  }
  playBlip(); lkRender();
}

/* ③ 양심 서랍에서 도로 꺼내기 — 잠긴 카드는 꺼낼 수 없다 */
function lkTakeBack(i){
  if(state.lkFin!=null) return;                                    // 가드①
  if(!Number.isInteger(i) || i<0 || i>=SIT.length) return;          // 가드②
  if(lkIn(state.lkLock,i)){                                        // 가드⑥ 잠긴 카드 도로 꺼내기 무시
    state.lkMsg='법 서랍은 한번 잠기면 열 수 없어요.'; state.lkWarn=true;
    playThud(); lkRender(); return;
  }
  const at=state.lkMind.indexOf(i); if(at<0) return;
  state.lkMind.splice(at,1); state.lkPick=i; state.lkWarn=false;
  state.lkMsg=`<b>${SIT[i].t}</b> — 도로 꺼냈어요. 다시 골라 넣어 봐요.`;
  playBlip(); lkRender();
}

/* ④ 마무리 — 법의 뜻 빈칸 */
function lkFinish(k){
  if(state.lkFin!=null) return;                                    // 가드①
  if(!Number.isInteger(k) || k<0 || k>=LK_FIN.length) return;       // 가드⑦ 무효 마무리 번호
  if(state.lkLock.length < LK_GOAL) return;                         // 가드⑧ 자물쇠 셋 미완성 시 무시(순서)
  if(k===LK_FIN_OK){
    state.lkFin=k; state.lkWrongF=null; state.lkMsg=null; state.lkWarn=false;
    playChime(); lkRender(); return;
  }
  state.lkWrongF=k; state.lkWarn=true;
  state.lkMsg = k===1
    ? '자율성은 <b>스스로 정해서</b> 지키는 것이에요. 법은 모두가 반드시 지켜야 해요.'
    : '법은 부탁이 아니에요. <b>반드시</b> 지켜야 하는 규범이지요.';
  playThud(); lkRender();
  setTimeout(()=>{ if(state.lkWrongF===k){ state.lkWrongF=null; state.lkMsg=null; state.lkWarn=false; lkRender(); } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u3_l02_일상속법.html'; } // l02 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

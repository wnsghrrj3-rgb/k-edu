성취기준 [6사03-02] · 교과서 p.144~149 · 지도서(대단원3 **14~15차시** 생활 속에서 인권 보호를
실천해 볼까요, 지도서 p.306~315) 근거
학습 목표: 생활 속에서 인권 보호를 실천할 수 있다.
수업 기법 및 전략: 모둠 토의 · 모둠별로 실천물 제작하기
직접조작: 실천 활동 차례표(신규 패턴 — 차례 세우기형 / 판이 다음 걸음을 말해 주지 않는다)
  ⭐ 앞의 서른세 종은 전부 **판이 다음에 무엇을 할 차례인지 알려 주었다.** 어느 판이든 발문이
     "이제 쓰임새를 골라요" "이제 제안을 적어요"처럼 **다음 걸음을 지정해 주었고**, 학생은
     지정된 자리에서 고르기만 했다. 이번만 **판이 다음 걸음을 말해 주지 않는다.**
     「이렇게 해 봐요」의 걸음이 **섞여서** 놓이고, 무엇이 먼저인지를 학생이 정한다.
     근거는 교과서 p.145~147의 세 활동이 모두 **번호가 매겨진 절차**로 제시되기 때문이다 —
     차례가 있다는 것은 앞의 걸음이 끝나야 할 수 있는 일이 있다는 뜻이다.
  ⭐ **틀린 걸음을 눌러도 판은 무엇이 먼저인지 말하지 않는다.** 안내는
     「그 걸음보다 먼저 해야 할 일이 남아 있어요」까지만이다. 정답 번호를 흘리면
     이 패턴의 신규성이 그 자리에서 무너지므로, 안내 문구에 걸음 이름·번호를 넣지 않는다.
  ⭐ **어느 활동을 골랐어도 마지막 걸음은 닮아 있었다** — 게시판·복도·누리집은 모두
     다른 사람이 볼 수 있는 곳이다. 차례표를 다 세우면 판이 세 활동의 마지막 걸음을
     나란히 펼치고 그 닮은 점을 3택으로 묻는다(정답 자리 1).
  ① **활동 고르기**(세 가지 중 하나 · **정답 없음** — 모둠 토의로 정하는 자리)
  → ② **걸음 세우기**(섞인 걸음 가운데 지금 차례에 맞는 것 · 사진전 5 · 포스터 4 · 손수 제작물 5)
  → ③ **마지막 걸음 견주기**(3택 · 정답 자리 1) → ④ 마무리 3택(정답 자리 2).
  ⚠️ 세 활동의 걸음 전량 교과서 원문 · 섞인 순서(`deck`)도 **고정 리터럴 — 난수 0**.
     어느 활동이든 **첫 카드가 첫 걸음이 아니다**(섞임이 실제로 일하는지 스모크가 대조).
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 활동·걸음·견주기·마무리 번호(`Number.isInteger`) /
     ③ 활동을 고르기 전 걸음 세우기 무시(순서) / ④ **차례가 아닌 걸음 무시**(이 패턴의 핵심) /
     ⑤ 이미 세운 걸음 재선택 무시 · 활동 재선택 무시 /
     ⑥ **걸음을 다 세우기 전 견주기 무시**(순서) / ⑦ 견주기 전 마무리 무시(순서) /
     ⑧ 안내가 떠 있는 동안 재클릭 무시(`odBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.od-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
  ⚠️ 실물 제작(사진 촬영·그리기·영상 편집)은 화면에서 흉내내지 않는다 — 교과서가 요구하는 것은
     실제 모둠 활동이고, 조작이 다루는 것은 **그 활동의 차례**다(정직 원칙).
지도서 근거(14~15차시 p.306~315):
  [동기 유발] 인권을 존중하고 보호하는 사회를 만들기 위한 노력 셋 — 주변에서 일어나는 인권 침해
    문제에 **관심**을 가진다 / 인권 보호를 위해 우리가 **할 수 있는 일을 찾아본다** /
    **생활 속에서 작은 일부터 실천**한다.
  [핵심 질문 p.144] 우리가 생활 속에서 실천할 수 있는 인권 보호 활동 = **인권을 존중하는 말
    사용하기 · 이웃 돕기 봉사 활동하기 · 인권 보호 캠페인 참여하기** 등.
  [본문 p.144] 인권을 존중하고 보호하는 사회를 만들려면 **우리 모두의 관심과 꾸준한 노력**이
    필요하다. 인권 보호를 위해 내가 할 수 있는 일을 찾아보고, 생활 속에서 작은 일부터 실천하면
    모든 사람의 인권을 존중하는 사회를 만들어 갈 수 있다.
    · 마음가짐 3종 = 함께 실천할 수 있는 방법을 찾아본다 / 관심을 가지고 **나부터** 실천하려고
      노력한다 / **나의 인권이 소중한 만큼 다른 사람의 인권도 소중하다.**
  [친구와 활동] 인권 보호 실천 방법 셋 — **인권 사진전 · 인권 포스터 전시회 ·
    인권 손수 제작물(UCC) 전시회.** 모둠별로 토의하여 한 가지를 선택한다.
    · 「이렇게 해 봐요」 걸음 = 교과서 p.145·146·147 원문 전량(5 · 4 · 5).
  [선택 1 예시 p.145] 사진 설명(건물 출입구에 계단만 있어서 휠체어를 탄 사람이 들어가지 못했습니다) /
    인권 보호 방법(경사로를 설치하면 편리하게 이동할 수 있습니다) /
    이 사진을 찍은 까닭(자유롭게 이동할 수 있는 사회가 되었으면 좋겠습니다).
  [선택 2 발표 예시] "인권은 우리의 빛" — 태양이 없으면 지구에서 사람이 살기 어렵듯이
    인권이 없으면 인간다운 삶을 살 수 없음을 표현했다(지도서 예시 답안).
  [별별 직업 p.148] **사회 복지사** — 하는 일과 필요한 것(교과서 원문 두 문단).
  [재미있게 확인해요 p.149] 인권 ○✕ 퀴즈 여섯 문장.
  [얼마나 잘했을까 p.149] 지식·이해 / 과정·기능 / 가치·태도 3영역 자기 평가.
  [정리] 차시 예고 = 생각을 펼쳐요 · 다음 시간 준비물 = 색칠 도구.
  14~15차시 주요 내용 정리 2항.
⚠️ 설계 원칙:
  · **16~17차시(생각을 펼쳐요 · 단원 마무리) 침범 0** — 생각 그물·교실 놀이 0.
    「생각을 펼쳐요」와 「색칠 도구」는 **차시 예고 두 자리에서만**(스모크가 개수 대조).
  · **9~13차시는 회수만** — 인권 침해 사례·해결 방법 토의·보호 노력은 도입과 문항에서 낱말로만
    되짚고 다시 가르치지 않는다. 동네 아홉 칸·토의 종이·별표·학교 답사 다섯 곳 0.
  · **공모전 수상작(포스터·영상) 재현 0** — 남의 작품이므로 그리지 않고 인용하지 않는다.
    활동의 **형식**(문구·그림·설명 글)과 지도서 **학생 예시 답안**만 쓴다.
    누리집 주소·공모전 링크·신문 인용·인용 연도 0.
  · **교사용 참고 자료 0** — 점자의 창안과 역사(6점식·점형 수·창안자 이름·훈맹정음·평양 점자·
    제생원), 한국 사회 복지사 협회의 업무 목록·정신 보건 사회 복지사, 사회 복지사 구조 기사
    (지역·나이·연도·경력), 활동지 314쪽의 국제 구호 단체 3종, 참고 도서 0.
  · **학생 이름 0** — [재미있게 확인해요]의 우승자 찾기는 네 사람의 답안이 교과서 축쇄본에서
    복원되지 않으므로 **재현하지 않는다**(l05 정직 원칙 승계). 여섯 문장의 옳고 그름만 다루고
    "교과서를 펼쳐 직접 풀어 보면 더 재미있어요"로 넘긴다.
  · **우리나라 지역 이름 0 · 기관 인용 이름 0 · 본문·문항 연도·금액·비율 0.**
  · **기본권 학술 용어 0**(주제① 규약 승계) · 세계 인권 선언·인권의 세대별 권리 0 ·
    구제 절차(진정·헌법 재판소·권고) 0.
  · 정서 — 실천을 숙제로 만들지 않는다. 활동 고르기에는 정답을 두지 않고, 마무리 오답 둘이

.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}
.check .tagx{flex-shrink:0;background:var(--bub);color:var(--green-d);border-radius:6px;padding:2px 7px;
  font-size:clamp(10.5px,1.8vw,12.5px);font-weight:800}

/* 직접조작 — 실천 활동 차례표(차례 세우기형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-canvas .slot{cursor:default}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}

.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.od-q{background:var(--bub);border-radius:9px;padding:6px 10px;font-size:clamp(11px,1.86vw,13.2px);

.od-list{display:flex;flex-direction:column;gap:4px;max-height:178px;overflow-y:auto}

  line-height:1.35;text-align:left}
.od-list button:hover{border-color:var(--green);background:var(--bub)}
.od-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}

   `steps` = 그 활동의 「이렇게 해 봐요」 원문 전량 · 차례대로 담겨 있다(정답 차례 = 배열 순서).
   `deck`  = 판에 섞여서 놓이는 순서 — ⭐ **고정 리터럴(난수 0)**. 어느 활동이든 첫 카드가 첫 걸음이 아니다.

   ODR_CMP = 세 활동의 마지막 걸음을 견주는 3택(정답 자리 1).

const ODR_CMP = [
  '셋 다 색칠 도구를 쓰는 것으로 끝나요.',
  '셋 다 만든 것을 많은 사람이 볼 수 있도록 알리는 것으로 끝나요.',

const ODR_CMP_OK = 1;
const ODR_FIN = [
  '인권 보호는 큰일을 할 수 있을 때까지 기다렸다가 한꺼번에 해야 해요.',

];
const ODR_FIN_OK = 2;

function odAct(st){ return st.odAct==null ? null : ODR_ACT[st.odAct]; }
function odTotal(st){ const a=odAct(st); return a? a.steps.length : 0; }
function odDoneAll(st){ return st.odAct!=null && st.odSet.length>=odTotal(st); }
function odSetAlready(st,i){ return st.odSet.indexOf(i)>=0; }

/* 판 — 위쪽 = 활동 셋(고른 것만 켜진다), 아래쪽 = 차례표 칸(세운 만큼 채워진다). */
function odCanvas(st){
  let g='';
  const a=odAct(st), total=odTotal(st);
  g+=`<text x="160" y="14" font-size="9.2" fill="#581C87" text-anchor="middle" font-weight="800">📋 실천 활동 차례표 — ${st.odAct==null?'활동을 골라요':st.odSet.length+' / '+total}</text>`;
  for(let k=0;k<ODR_ACT.length;k++){
    const x=6+k*103, on=(st.odAct===k), off=(st.odAct!=null && st.odAct!==k);
    g+=`<g class="slot"${st.odAct==null?` onclick="odPick(${k})" style="cursor:pointer"`:''}>`;
    g+=`<rect x="${x}" y="22" width="96" height="30" rx="8" fill="${on?'#F3E8FF':(off?'#F8FAFC':'#fff')}" stroke="${on?'#7E22CE':'#CBD5E0'}" stroke-width="${on?2.2:1.4}"/>`;
    g+=`<text x="${x+48}" y="35" font-size="7.4" fill="${on?'#7E22CE':(off?'#CBD5E0':'#94A3B8')}" text-anchor="middle" font-weight="800">${ODR_ACT[k].tag}</text>`;
    g+=`<text x="${x+48}" y="47" font-size="7.6" fill="${on?'#581C87':(off?'#CBD5E0':'#475569')}" text-anchor="middle" font-weight="800">${ODR_ACT[k].name.replace('(UCC) 전시회','').replace(' 전시회','')}</text>`;
    g+=`</g>`;
  }
  if(st.odAct==null){
    g+=`<rect x="8" y="62" width="304" height="76" rx="10" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    g+=`<text x="160" y="96" font-size="8.6" fill="#94A3B8" text-anchor="middle" font-weight="700">모둠별로 토의해 한 가지를 골라요</text>`;
    g+=`<text x="160" y="112" font-size="7.8" fill="#94A3B8" text-anchor="middle" font-weight="700">무엇을 골라도 괜찮아요 — 고른 활동의 차례표가 열려요</text>`;
  } else {
    const rows=Math.ceil(total/1);
    const h=Math.floor(72/total), top=64;
    for(let s=0;s<total;s++){
      const y=top+s*(h+2), got=(s<st.odSet.length), idx=got?st.odSet[s]:null;
      g+=`<rect x="8" y="${y}" width="304" height="${h}" rx="6" fill="${got?'#FFFDF5':'#F8FAFC'}" stroke="${got?'#E7D9A8':'#CBD5E0'}" stroke-width="1.3" ${got?'':'stroke-dasharray="3 3"'}/>`;
      g+=`<circle cx="22" cy="${y+h/2}" r="6.4" fill="${got?'#B45309':'#CBD5E0'}"/>`;
      g+=`<text x="22" y="${y+h/2+2.6}" font-size="7.2" fill="#fff" text-anchor="middle" font-weight="800">${s+1}</text>`;
      g+=`<text x="34" y="${y+h/2+2.8}" font-size="7.6" fill="${got?'#3F3A2C':'#94A3B8'}" font-weight="${got?800:700}">${got?a.short[idx]:'아직 비어 있어요'}</text>`;
    }
    if(odDoneAll(st)){
      g+=`<rect x="8" y="${top+total*(h+2)+2}" width="304" height="${Math.max(14,138-(top+total*(h+2)+2))}" rx="6" fill="#F3E8FF" stroke="#7E22CE" stroke-width="1.3"/>`;
      g+=`<text x="160" y="${top+total*(h+2)+13}" font-size="7.8" fill="#581C87" text-anchor="middle" font-weight="800">차례표를 다 세웠어요 — 마지막 걸음을 견주어 봐요</text>`;
    }
  }
  return `<svg viewBox="0 0 320 152"><rect width="320" height="152" fill="#ffffff"/>${g}
    <text x="160" y="148" font-size="7.4" fill="#94A3B8" text-anchor="middle">판은 다음에 무엇을 세울 차례인지 알려 주지 않아요</text></svg>`;
}

function odPanel(st){
  const done = st.odFin!=null, a=odAct(st), total=odTotal(st);
  let right='';
  right+=`<div class="dw-step">📋 ${st.odAct==null?'활동 고르기':a.name+' · 차례 '+st.odSet.length+' / '+total}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">📋 실천 활동 차례표를 다 세웠어요</div>
      <div>내가 고른 활동은 <b>${a.name}</b>이고, 첫 걸음은 <b>${a.short[0]}</b>, 마지막 걸음은 <b>${a.short[total-1]}</b>이었어요.</div>
      <div style="margin-top:5px">세 활동의 마지막 걸음은 모두 <b>많은 사람이 볼 수 있도록 알리는 걸음</b>이었어요 — 만든 것을 알려야 인권 보호의 중요성이 퍼져 나가니까요.</div>
      <div style="margin-top:5px;color:#64748B">판은 <b>다음 걸음을 알려 주지 않았어요.</b> 차례는 내가 세운 것이에요.</div></div>`;
  } else if(st.odCmp!=null){
    right+=`<div class="od-q">생활 속에서 인권 보호를 실천하려면 어떻게 해야 할까요?</div>`;
    right+=`<div class="od-fin">${ODR_FIN.map((f,k)=>
      `<button class="${st.odWrongF===k?'no':''}" onclick="odFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(odDoneAll(st)){
    right+=`<div class="od-q">세 활동의 <b>마지막 걸음</b>을 견주어 보면 무엇이 닮았나요?</div>`;
    right+=`<div class="od-plan"><span class="sh">🔍 세 활동의 마지막 걸음</span>${ODR_ACT.map(x=>
      `<div class="row"><b>${x.name}</b> — ${x.steps[x.steps.length-1]}</div>`).join('')}</div>`;
    right+=`<div class="od-fin">${ODR_CMP.map((c,k)=>
      `<button class="${st.odWrongC===k?'no':''}" onclick="odCompare(${k})">${c}</button>`).join('')}</div>`;
  } else if(st.odAct==null){
    right+=`<div class="od-q">어떤 방법으로 인권 보호를 실천해 볼까요?</div>`;
    right+=`<div class="od-list">${ODR_ACT.map((x,k)=>
      `<button onclick="odPick(${k})">${x.tag} · ${x.name}</button>`).join('')}</div>`;
    right+=`<div class="dw-msg">셋 가운데 <b>무엇을 골라도 괜찮아요.</b> 모둠별로 토의해 한 가지를 정하는 자리예요.</div>`;
  } else {
    right+=`<div class="od-q">${st.odSet.length+1}번째 걸음으로 무엇을 해야 할까요?</div>`;
    right+=`<div class="od-list">${a.deck.map(i=>
      `<button class="${st.odWrongS===i?'no':(odSetAlready(st,i)?'set':'')}" onclick="odStep(${i})">${a.steps[i]}</button>`).join('')}</div>`;
  }

  if(st.odAct!=null && st.odSet.length>0){
    right+=`<div class="od-plan"><span class="sh">📋 세운 차례</span>${st.odSet.map((i,s)=>
      `<div class="row"><b>${s+1}</b> ${a.steps[i]}</div>`).join('')}</div>`;
  }
  if(st.odMsg) right+=`<div class="dw-msg${st.odWarn?' warn':''}">${st.odMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">📋 실천 방법을 골라 「이렇게 해 봐요」의 차례를 세워 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${odCanvas(st)}<div class="cvcap">무엇이 먼저인지는 내가 정해요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    <div class="oxrow"><span class="mk x">✕</span><div>공공 편의 시설은 장애인만 이용할 수 있습니다. <b style="color:var(--red)">— 많은 사람이 편리하게 이용하도록 설치한 것이에요.</b></div></div>
    <div class="oxrow"><span class="mk x">✕</span><div>인권 보호를 위해 편견과 차별을 가져야 합니다. <b style="color:var(--red)">— 편견과 차별은 인권 침해의 원인이 돼요.</b></div></div>
  </div>
  <div class="note">교과서를 펼쳐 ○✕ 퀴즈 대회로 직접 풀어 보면 더 재미있어요.</div>`
    :`<div class="note">여섯 문장이 맞는지 틀리는지 스스로 판단해 봐요.</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','생활 속에서 인권 보호를 실천하기')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">①</span><div>우리가 생활 속에서 실천할 수 있는 인권 보호 활동에는 <b style="color:var(--green)">인권을 존중하는 말 사용하기, 이웃 돕기 봉사 활동하기, 인권 보호 캠페인 참여하기</b> 등이 있어요.</div></div>
    <div class="sum-item"><span class="n">②</span><div>인권 보호 실천 방법에는 <b style="color:var(--green)">인권 사진전, 인권 포스터 전시회, 인권 손수 제작물 전시회</b> 등이 있어요. 모둠별로 토의해 한 가지를 골라 활동해요.</div></div>
    <div class="sum-item"><span class="n">③</span><div>어느 방법이든 <b style="color:var(--green)">차례</b>가 있고, 마지막 걸음은 모두 <b style="color:var(--green)">많은 사람이 볼 수 있도록 알리는 걸음</b>이에요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--red)">인권 보호는 큰일을 기다리는 것이 아니에요.</b> 인권 보호를 위해 내가 할 수 있는 일을 찾아 <b>생활 속에서 작은 일부터</b> 실천하면 모든 사람의 인권을 존중하는 사회를 만들어 갈 수 있어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">생각을 펼쳐요</b> 활동을 해요 — 준비물은 색칠 도구예요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"인권이 무엇인지 알고, 생활 속 인권 침해 사례를 찾아 설명할 수 있어요","지식·이해",st)}
    ${selfCheck(1,"인권 침해 문제의 해결 방안을 제시하고, 친구들과 토의할 수 있어요","과정·기능",st)}
    ${selfCheck(2,"일상생활에서 인권 보호를 실천하려는 태도를 갖게 됐어요","가치·태도",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">생각을 펼쳐요</b> 활동!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,area,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span class="tagx">${area}</span><span>${label}</span></div>`;
}


/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l09";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  odAct:null, odSet:[], odCmp:null, odFin:null,
  odWrongS:null, odWrongC:null, odWrongF:null, odMsg:null, odWarn:false, odBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function odRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 활동 고르기 — 정답 없음(지도서 "모둠별로 토의하여 세 가지 활동 중 한 가지를 선택") */
function odPick(k){
  if(state.odFin!=null) return;                                        // 가드① 확정 후 전체 잠금
  if(state.odBusy) return;                                             // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(k) || k<0 || k>=ODR_ACT.length) return;          // 가드② 무효 활동 번호
  if(state.odAct!=null) return;                                        // 가드⑤ 활동 재선택 무시
  state.odAct=k; state.odSet=[]; state.odWarn=false; state.odWrongS=null;
  state.odMsg='<b>「'+ODR_ACT[k].name+'」</b>을(를) 골랐어요. 걸음이 <b>섞여서</b> 놓여 있어요 — 무엇이 첫 걸음일까요?';
  playBlip(); odRender();
}

/* ② 걸음 세우기 — ⭐ 판은 다음 걸음을 말해 주지 않는다(이 패턴의 핵심) */
function odStep(i){
  if(state.odFin!=null) return;                                        // 가드①
  if(state.odBusy) return;                                             // 가드⑧
  if(state.odAct==null) return;                                        // 가드③ 활동을 고르기 전 무시(순서)
  const a=ODR_ACT[state.odAct];
  if(!Number.isInteger(i) || i<0 || i>=a.steps.length) return;          // 가드② 무효 걸음 번호
  if(odDoneAll(state)) return;                                         // 다 세운 뒤에는 받지 않는다
  if(odSetAlready(state,i)){                                           // 가드⑤ 이미 세운 걸음 재선택 무시
    state.odWrongS=i; state.odWarn=true; state.odBusy=true;
    state.odMsg='그 걸음은 <b>이미 차례표에 세웠어요.</b> 남은 걸음 가운데에서 골라요.';
    playThud(); odRender();
    setTimeout(()=>{ if(state.odWrongS===i){ state.odWrongS=null; state.odMsg=null; state.odWarn=false; } state.odBusy=false; odRender(); },1600);
    return;
  }
  if(i!==state.odSet.length){                                          // 가드④ ★ 차례가 아닌 걸음 무시(핵심)
    state.odWrongS=i; state.odWarn=true; state.odBusy=true;
    state.odMsg='그 걸음보다 <b>먼저 해야 할 일</b>이 남아 있어요. 앞의 걸음을 다시 살펴봐요.';
    playThud(); odRender();
    setTimeout(()=>{ if(state.odWrongS===i){ state.odWrongS=null; state.odMsg=null; state.odWarn=false; } state.odBusy=false; odRender(); },1600);
    return;
  }
  state.odSet.push(i); state.odWrongS=null; state.odWarn=false;
  state.odMsg = odDoneAll(state)
    ? '차례표를 다 세웠어요. 이제 <b>세 활동의 마지막 걸음</b>을 견주어 봐요.'
    : '<b>'+state.odSet.length+'번째 걸음</b>으로 세웠어요. 다음에는 무엇을 해야 할까요?';
  playBlip(); odRender();
}

/* ③ 마지막 걸음 견주기 — 셋이 닮은 까닭 */
function odCompare(k){
  if(state.odFin!=null) return;                                        // 가드①
  if(state.odBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=ODR_CMP.length) return;          // 가드② 무효 견주기 번호
  if(!odDoneAll(state)) return;                                        // 가드⑥ 다 세우기 전 견주기 무시(순서)
  if(state.odCmp!=null) return;                                        // 한 번만 고른다
  if(k===ODR_CMP_OK){
    state.odCmp=k; state.odWrongC=null; state.odWarn=false;
    state.odMsg='맞아요. 게시판도 복도도 누리집도 <b>다른 사람이 볼 수 있는 곳</b>이에요.';
    playBlip(); odRender(); return;
  }
  state.odWrongC=k; state.odWarn=true; state.odBusy=true;
  state.odMsg = k===0
    ? '색칠 도구는 포스터를 그릴 때 쓰는 것이었지요. 사진전과 손수 제작물의 마지막 걸음도 다시 읽어 봐요.'
    : '세 걸음 모두 <b>다른 사람이 보는 곳</b>에 내놓는 일이었어요. 다시 읽어 봐요.';
  playThud(); odRender();
  setTimeout(()=>{ if(state.odWrongC===k){ state.odWrongC=null; state.odMsg=null; state.odWarn=false; } state.odBusy=false; odRender(); },1600);
}

/* ④ 마무리 3택 — 이 조작에서 옳고 그름이 있는 마지막 자리 */
function odFinish(k){
  if(state.odFin!=null) return;                                        // 가드①
  if(state.odBusy) return;                                             // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=ODR_FIN.length) return;          // 가드② 무효 마무리 번호
  if(state.odCmp==null) return;                                        // 가드⑦ 견주기 전 마무리 무시(순서)
  if(k===ODR_FIN_OK){
    state.odFin=k; state.odWrongF=null; state.odMsg=null; state.odWarn=false;
    playChime(); odRender(); return;
  }
  state.odWrongF=k; state.odWarn=true; state.odBusy=true;
  state.odMsg = k===0
    ? '큰일을 기다릴 필요는 없어요. <b>생활 속에서 작은 일부터</b> 실천하면 돼요.'
    : '어린이도 지금 할 수 있는 일이 있어요 — 인권을 존중하는 말 사용하기처럼요.';
  playThud(); odRender();
  setTimeout(()=>{ if(state.odWrongF===k){ state.odWrongF=null; state.odMsg=null; state.odWarn=false; state.odBusy=false; odRender(); } else { state.odBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u3_l10_생각을펼쳐요.html'; } // 주제② l10 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

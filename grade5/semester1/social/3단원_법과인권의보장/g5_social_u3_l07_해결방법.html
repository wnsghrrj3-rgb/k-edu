영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사03-02] · 교과서 p.135~138 · 지도서(대단원3 **10~11차시** 인권 침해를 해결할 수 있는
방법을 알아볼까요, 지도서 p.285~296) 근거
학습 목표: 인권 침해를 해결할 수 있는 방법을 토의할 수 있다.
수업 기법 및 전략: 신문 기사 활용하기 · 복수 선택 질적 의사 결정 토의하기
직접조작: 토의 종이 판(신규 패턴 — 배분형 / 판이 옳고 그름을 갖지 않는다)
  ⭐ 앞의 서른한 종은 전부 **판이 옳고 그름을 돌려주었다.** 자물쇠가 걸리거나 걸리지 않거나,
     침해인지 지켜짐인지 — 어느 판이든 학생이 무엇을 누르면 맞다·아니다가 돌아왔다.
     이번만 다르다. **판이 옳고 그름을 갖지 않는다.** 별표 셋(☆☆☆·☆☆·☆)을 어느 해결 방법에
     주든 판은 잘 골랐다고도, 틀렸다고도 하지 않는다. 판은 **세기만 하고**, 결과(모둠 의견 세 가지)는
     학생의 배분이 만든다. 그것이 복수 선택 질적 의사 결정 토의이기 때문이다 —
     지도서 p.289 "복수 선택 질적 의사 결정을 하는 목적은 개인의 의사를 좀 더 정확하게
     반영하기 위해서이다."
  ⭐ 대신 판이 재는 것이 하나 있다 — **"자신이 제시한 해결 방법을 제외한 것 중"이라는 토의 규칙.**
     내가 낸 종이 두 장에 별표를 주려 하면 판이 받지 않고 그 까닭을 말한다.
     옳고 그름이 아니라 **토의의 규칙**을 재는 것이다(지도서 "차등 투표를 할 때 자신의 의견을
     제외한 나머지 친구들의 의견에 투표해야 함을 안내한다").
  ⭐ **다시 배분하기** — 별표를 도로 거두고 다시 나누어 줄 수 있다. 배분을 바꾸면
     모둠 의견 세 가지가 실제로 바뀐다. 그것을 눈으로 보는 것이 이 패턴의 눈이다.
  ① **내 토의 종이 두 장 내기** — 여덟 장 가운데 두 장(교과서 "자신이 생각한 인권 침해 문제의
     해결 방법을 두 개의 토의 종이에 한 가지씩 씁니다").
  ② **별표 배분** — 내가 내지 않은 여섯 장 가운데 세 장에 ☆☆☆ → ☆☆ → ☆ 순서로.
  ③ **집계** — 판이 친구 별표와 내 별표를 더해 **가장 많은 별표를 받은 세 가지**를
     「우리 모둠의 의견」으로 띄운다(교과서 원문 절차 4). 동점은 종이 번호가 앞선 것부터.
  ④ 마무리 3택 — 이 조작에서 **옳고 그름이 있는 단 하나의 자리**.
  ⚠️ 여덟 장·친구 별표·마무리 3택은 모두 **고정 리터럴 — 난수 0**.
     친구 별표 합 = 18(친구 셋 × 3+2+1). 내 종이 두 장에도 친구 별표가 붙어 있는 것이 옳다 —
     친구들도 자기 것만 빼고 투표하기 때문이다.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 종이·마무리 번호(`Number.isInteger`) /
     ③ 내 종이 두 장을 내기 전 별표 무시(순서 강제) / ④ **내가 낸 종이에 별표 무시**(토의 규칙 —
     이 패턴의 핵심) / ⑤ 이미 낸 종이 재선택 무시 · 두 장 넘겨 내기 무시 /
     ⑥ 이미 별표를 받은 종이에 다시 주기 무시 / ⑦ **별표 셋을 다 주기 전 마무리 무시**(순서 강제) /
     ⑧ 안내가 떠 있는 동안 재클릭 무시(`dpBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.dp-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
지도서 근거(10~11차시 p.285~296):
  [동기 유발] 도서관을 어리다는 이유로 출입하지 못하게 한다면? → 기분이 나쁘고 당황스러울 것 같다.
    인권이 침해되었을 때 생기는 문제 = **일상생활에서 불편함을 겪는다 / 인간다운 삶을 누리지 못할 수 있다.**
  [스스로 활동 p.135] 국회 도서관 청소년 이용 제한 — 18세 미만 청소년은 국회 도서관을 이용할 수 없다.
    도서관 측 이유 = 법 제정 활동을 지원하는 것이 주 업무이므로 청소년이 입장하면 업무에 지장이
    생길 수 있고, 전문 서적 중심이라 청소년 학습용 자료는 매우 적다.
    · 인권 침해 문제 = **나이가 어리다는 이유로 청소년의 국회 도서관 이용을 제한하는 것.**
    · [핵심 질문] 원인 = **청소년이 입장하면 업무를 방해할 것이라는 편견 / 청소년은 전문 서적을
      읽지 않을 것이라는 생각.**
    · 주 업무 = 법 제정 활동을 지원하는 것.
  [할 수 있어요 p.136~137] 복수 선택 질적 의사 결정 토의 4단계 —
    1 자신이 생각한 해결 방법을 두 개의 토의 종이에 한 가지씩 쓴다.
    2 각자 쓴 해결 방법을 한 명씩 돌아가며 발표하고, 책상 가운데에 토의 종이를 내어놓는다.
      (발표할 때는 **그렇게 생각한 이유나 근거**를 함께 제시한다.)
    3 자신이 제시한 해결 방법을 제외한 것 중 효과적이라고 생각하는 것을 각자 세 가지씩 선택해
      별표 셋 ☆☆☆ · 둘 ☆☆ · 하나 ☆를 표시한다.
    4 가장 많은 별표를 받은 해결 방법 세 가지를 모둠의 의견으로 결정하고 학급 앞에서 발표한다.
    · 사이버 폭력 문제의 해결 방법(교과서 원문 3) = 사이버 폭력 예방 캠페인 벌이기 /
      사이버 윤리 교육 늘리기 / 사이버 폭력의 처벌 강화하기.
    · 원인(예시 답안) = 사이버 폭력 문제의 심각성에 대한 인식 부족, 처벌 부족.
    · 발표 원문 = "우리 모둠이 선택한 인권 침해 문제는 사이버 폭력 문제입니다.
      이 문제의 해결 방법으로는 …가 있습니다."
  [정리 자세 3종 p.288] ① 스스로 인권을 지키려고 노력해야 한다 ② 주변의 인권 침해 문제를 찾아
    해결하는 데 관심을 가져야 한다 ③ 인권 침해를 당한 사람의 어려움을 공감하고 상대방의 입장을
    존중해야 한다.
  [미디어 활동 p.138] 신문 기사 두 편 — 어느 청소년이 나이가 어리다는 이유로 출입을 거부당하자
    캠페인을 벌이고, 선생님과 함께 인터넷과 헌법을 찾아 의견서를 작성해 국가 인권 위원회에 제출했다.
    국가 인권 위원회는 '18세 미만인 사람의 국회 도서관 이용 제한은 나이에 따른 차별'이라며
    국회 도서관장에게 이용 제한 요건을 줄일 수 있는 방법을 마련해 시행할 것을 권고했고,
    국회 도서관은 이용 신청서를 한 번만 작성하면 자료를 자유롭게 이용할 수 있는
    **'청소년 자유 이용제'**를 실시하게 됐다.
    · [정보 활용] 개방하면 좋은 점 = 청소년이 읽고 싶은 다양한 전문 서적을 읽을 수 있다 /
      나이 제한 없이 사람들이 동등하게 국회 도서관을 이용할 수 있다.
  [꼭 기억해요] 인권이 침해되면 일상생활에서 불편함을 겪거나, 인간다운 삶을 누리기 어렵다(○).
  [정리] 차시 예고 = 우리 사회의 인권 보호 노력 알아보기.
⚠️ 설계 원칙:
  · **12~13차시(우리 사회의 인권 보호 노력) 침범 0** — 배려 시설·물건(임산부 배려석·큰 글자 도서·
    어린이 전용 세면대·경사로·점자 블록·옐로 카펫·장애인 전용 화장실·주차 구역) 0,
    학교의 인권 교육·학교 규칙 0, 국가의 노력·사회 보장 제도 0.
  · **14~15차시(인권 보호 실천) 침범 0** — 실천 계획·실천물 만들기 0.
    「캠페인」은 교과서 원문 해결 방법 카드와 미디어 활동 기사 두 자리에서만 등장한다.
  · **교사용 참고 자료 0** — 의사 결정의 역사(독재·다수결·전문가·만장일치), 정문성 인용,
    인권 감수성, 인권 침해 구제 절차(헌법 재판소·헌법 소원·국가 배상·형사 보상·고소·고발·민사 소송),
    참고 도서, 국회 도서관 연혁, 다른 나라 의회 도서관 0.
  · **학생 이름 0** — 신문 기사의 인물은 「어느 청소년」으로 치환하고 과외 교사는 「선생님」으로 둔다.
    **우리나라 지역 이름 0 · 본문·문항 내 연도·금액·비율 0**(기사 날짜 0, 나이 14 0).
    '18세 미만'은 이 사례의 실체이므로 그 자리에서만 남긴다.
  · **국가 인권 위원회**는 이 차시 교과서 원문(미디어 활동)의 해결 과정 서술에서만 쓰고,
    기관의 구실이나 진정 절차를 설명하지 않는다.
  · 정서 — 별표를 어디에 주든 판은 나무라지 않는다. 판이 재는 것은 토의 규칙 하나뿐이다.
    국회 도서관을 나쁜 곳으로 그리지 않는다(제한한 이유를 그대로 싣고, 뒤에 열린 과정까지 보여 준다).
  · 3단원 색 **#7E22CE(보라)** — CSS 변수값만 바꾸고 변수명은 그대로 두어 엔진 코드를 무수정 승계한다.

  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#EDE9FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#581C87;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#FBF7FF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}
.check .tagx{flex-shrink:0;background:var(--bub);color:var(--green-d);border-radius:6px;padding:2px 7px;
  font-size:clamp(10.5px,1.8vw,12.5px);font-weight:800}

/* 직접조작 — 토의 종이 판(배분형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-canvas .paper{cursor:pointer}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dp-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;

.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}

  font-weight:800;color:var(--green-d);line-height:1.45}

.dp-prob .sh{font-weight:800;color:#8A6D3B;display:block;margin-bottom:2px}
.dp-rank{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto}
.dp-rank div{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:5px 9px;
  font-weight:700;color:var(--ink);font-size:clamp(10px,1.7vw,12.2px);line-height:1.35}
.dp-rank div.top{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.dp-fin{display:flex;flex-direction:column;gap:5px}
.dp-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.2px,1.74vw,12.6px);text-align:left;line-height:1.4}
.dp-fin button:hover{background:var(--bub)}
.dp-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.dp-reset{border:2px solid #CBD5E0;background:#F8FAFC;color:#475569;border-radius:9px;padding:5px 10px;

.dp-reset:hover{border-color:var(--green);color:var(--green)}
.paper-note{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;

  animation:fadeUp .4s ease both}
.paper-note .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}

.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}

/* ===== 직접조작 — 토의 종이 판(신규 패턴 — 배분형) =====
   DP_CARD = 여덟 장 고정 리터럴(난수 0). 0~2는 교과서 p.137 원문 해결 방법 3종.
   FRIEND_STAR = 친구 셋이 이미 붙인 별표(고정 리터럴, 합 18 = 3명 × (3+2+1)).
   ⭐ 내가 낸 두 장에도 친구 별표가 붙어 있는 것이 옳다 — 친구들도 자기 것만 빼고 투표하기 때문이다.
   ⭐ 판은 별표를 어디에 주든 옳고 그름을 돌려주지 않는다. 세기만 한다. */
const DP_PROB = '사이버 폭력 문제';
const DP_CARD = [
  {s:'예방 캠페인 벌이기',      f:'사이버 폭력 예방 캠페인 벌이기'},
  {s:'사이버 윤리 교육 늘리기', f:'사이버 윤리 교육 늘리기'},
  {s:'처벌 강화하기',          f:'사이버 폭력의 처벌 강화하기'},
  {s:'온라인 약속 함께 정하기', f:'온라인에서 지킬 약속을 학급에서 함께 정하기'},
  {s:'이야기 들어 주기',        f:'사이버 폭력을 당한 친구의 이야기를 들어 주기'},
  {s:'그냥 지나치지 않기',      f:'사이버 폭력을 보면 그냥 지나치지 않고 알리기'},
  {s:'상처 주는 말 하지 않기',  f:'대화방에서 상처가 되는 말을 하지 않기로 약속하기'},
  {s:'심각한 까닭 알아보기',    f:'사이버 폭력이 얼마나 심각한지 함께 알아보기'}
];
const FRIEND_STAR = [4,3,3,2,2,2,1,1];   // 합 18
const DP_MINE_N = 2;                      // 내가 내는 토의 종이 수
const DP_GRADE = [3,2,1];                 // ☆☆☆ → ☆☆ → ☆ 순서로 소진
const DP_TOP_N = 3;                       // 모둠 의견으로 정해지는 수
const DP_FIN = [
  '별표를 아무 곳에나 주어도 모둠 의견은 똑같이 정해져요.',
  '내가 낸 해결 방법에 별표를 몰아주면 내 의견이 뽑혀요.',
  '좋다고 생각하는 만큼 별표를 나누어 주면, 내 생각이 결과에 더 정확하게 담겨요.'
];
const DP_FIN_OK = 2;

function dpIsMine(st,i){ return st.dpMine.indexOf(i)>=0; }
function dpStarCount(st){ return Object.keys(st.dpStar).length; }
function dpNextGrade(st){ return DP_GRADE[dpStarCount(st)]; }
function dpStars(n){ return '☆'.repeat(n); }
function dpTotal(st,i){ return FRIEND_STAR[i] + (st.dpStar[i]||0); }
/* 집계 — 합계 내림차순, 동점은 종이 번호가 앞선 것부터(판정 아님, 세기만 함) */
function dpRankAll(st){
  return DP_CARD.map((c,i)=>i).sort((a,b)=> dpTotal(st,b)-dpTotal(st,a) || a-b );
}
function dpTop(st){ return dpRankAll(st).slice(0,DP_TOP_N); }

/* 판 — 여덟 장을 2열 4행으로. 판은 옳고 그름을 표시하지 않는다. */
function dpCanvas(st){
  let g='';
  const given=dpStarCount(st);
  g+=`<text x="160" y="15" font-size="9.4" fill="#581C87" text-anchor="middle" font-weight="800">📄 책상 가운데 토의 종이 여덟 장 — 내 종이 ${st.dpMine.length} / ${DP_MINE_N} · 준 별표 ${given} / 3</text>`;
  for(let i=0;i<DP_CARD.length;i++){
    const col=i%2, row=(i-col)/2;
    const x=8+col*156, y=28+row*52;
    const mine=dpIsMine(st,i), my=st.dpStar[i]||0;
    let stroke='#CBD5E0', fill='#fff';
    if(mine){ stroke='#94A3B8'; fill='#F1F5F9'; }
    if(my){ stroke='#B45309'; fill='#FFF8E1'; }
    g+=`<g class="paper" onclick="dpTap(${i})">`;
    g+=`<rect x="${x}" y="${y}" width="148" height="46" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${my||mine?2:1.5}"/>`;
    g+=`<text x="${x+8}" y="${y+16}" font-size="8.4" fill="#334155" font-weight="800">${DP_CARD[i].s}</text>`;
    g+=`<text x="${x+8}" y="${y+32}" font-size="7.4" fill="#64748B" font-weight="700">친구 별표 ${FRIEND_STAR[i]}</text>`;
    if(my){
      g+=`<rect x="${x+60}" y="${y+22}" width="44" height="14" rx="7" fill="#FDE68A"/>`;
      g+=`<text x="${x+82}" y="${y+32}" font-size="7.2" fill="#92400E" text-anchor="middle" font-weight="800">내 ${dpStars(my)}</text>`;
    } else if(mine){
      g+=`<rect x="${x+60}" y="${y+22}" width="44" height="14" rx="7" fill="#E2E8F0"/>`;
      g+=`<text x="${x+82}" y="${y+32}" font-size="7.2" fill="#475569" text-anchor="middle" font-weight="800">내 종이</text>`;
    }
    g+=`<rect x="${x+112}" y="${y+14}" width="28" height="20" rx="7" fill="${my?'#FEF3C7':'#F8FAFC'}" stroke="${my?'#B45309':'#CBD5E0'}" stroke-width="1.2"/>`;
    g+=`<text x="${x+126}" y="${y+28}" font-size="9.4" fill="${my?'#92400E':'#475569'}" text-anchor="middle" font-weight="800">${dpTotal(st,i)}</text>`;
    g+=`</g>`;
  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}
    <text x="160" y="242" font-size="7.6" fill="#94A3B8" text-anchor="middle">오른쪽 칸의 숫자 = 친구 별표 + 내 별표</text></svg>`;
}

function dpPanel(st){
  const done = st.dpFin!=null;
  const given = dpStarCount(st);
  const picked = st.dpMine.length>=DP_MINE_N;
  let right='';
  right+=`<div class="dp-step">📄 내 종이 ${st.dpMine.length} / ${DP_MINE_N} · 준 별표 ${given} / 3</div>`;
  right+=`<div class="dp-prob"><span class="sh">우리 모둠이 고른 인권 침해 문제</span>${DP_PROB} — 원인은 문제의 심각성에 대한 인식 부족, 처벌 부족이라고 정리했어요.</div>`;

  if(done){
    const top=dpTop(st);
    right+=`<div class="dw-card"><div class="pt">📄 우리 모둠의 의견이 정해졌어요</div>
      <div>우리 모둠이 선택한 인권 침해 문제는 <b>${DP_PROB}</b>입니다. 이 문제의 해결 방법으로는
      ${top.map(i=>DP_CARD[i].f).join(', ')}가 있습니다.</div>
      <div style="margin-top:5px;color:#64748B">판은 어느 종이에 별표를 주어야 옳은지 <b>알려 주지 않았어요.</b> 판은 세기만 했고, 이 결과는 <b>여러분이 별표를 어떻게 나누어 주었는지</b>가 만든 것이에요.</div></div>`;
  } else if(given>=DP_GRADE.length){
    right+=`<div class="dp-q">별표를 나누어 주고 나니 무엇을 알게 됐나요?</div>`;
    right+=`<div class="dp-fin">${DP_FIN.map((f,k)=>
      `<button class="${st.dpWrongF===k?'no':''}" onclick="dpFinish(${k})">${f}</button>`).join('')}</div>`;
    right+=`<button class="dp-reset" onclick="dpReset()">↺ 별표를 도로 거두고 다시 나누어 주기</button>`;
  } else if(!picked){
    right+=`<div class="dp-q">어느 해결 방법을 내 토의 종이로 낼까요?</div>`;
    right+=`<div class="dw-msg">먼저 <b>내가 생각한 해결 방법 두 가지</b>를 골라 책상 가운데에 내어놓아요. 왼쪽 종이를 눌러 봐요.</div>`;
  } else {
    right+=`<div class="dp-q">${dpStars(dpNextGrade(st))} 를 어느 해결 방법에 줄까요?</div>`;
    right+=`<div class="dw-msg">${given===0?'가장 좋은 해결 방법이라고 생각하는 것에 <b>☆☆☆</b>를 줘요.':given===1?'그다음 해결 방법에 <b>☆☆</b>를 줘요.':'마지막으로 <b>☆</b>를 줘요.'} <b>내가 낸 종이는 빼고</b> 골라요.</div>`;
  }

  if(given>0 && !done){
    const rank=dpRankAll(st).slice(0,DP_TOP_N);
    right+=`<div class="dp-rank">${rank.map((i,k)=>
      `<div class="top">${k+1}위 · ${DP_CARD[i].s} — 별표 ${dpTotal(st,i)}</div>`).join('')}</div>`;
  }
  if(st.dpMsg) right+=`<div class="dw-msg${st.dpWarn?' warn':''}">${st.dpMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">📄 토의 종이에 별표를 나누어 주고, 우리 모둠의 의견을 정해 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${dpCanvas(st)}<div class="cvcap">어디에 별표를 주어야 옳은지는 정해져 있지 않아요 — 판은 세기만 해요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,area,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span class="tagx">${area}</span><span>${label}</span></div>`;
}

const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  dpMine:[], dpStar:{}, dpFin:null,
  dpWrongF:null, dpMsg:null, dpWarn:false, dpBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function dpRender(){ main.innerHTML = slides[state.idx].render(state); }

/* 종이 클릭 — 단계에 따라 갈라진다(내 종이 내기 → 별표 주기) */
function dpTap(i){
  if(state.dpMine.length < DP_MINE_N) dpPickMine(i);
  else dpGiveStar(i);
}

/* ① 내 토의 종이 두 장 내기 */
function dpPickMine(i){
  if(state.dpFin!=null) return;                                      // 가드① 확정 후 전체 잠금
  if(state.dpBusy) return;                                           // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(i) || i<0 || i>=DP_CARD.length) return;        // 가드② 무효 종이 번호
  if(state.dpMine.length >= DP_MINE_N) return;                       // 가드⑤ 두 장 넘겨 내기 무시
  if(dpIsMine(state,i)){                                             // 가드⑤ 이미 낸 종이 재선택 무시
    state.dpMsg='이미 내어놓은 종이예요. 다른 해결 방법을 골라 봐요.'; state.dpWarn=true;
    playThud(); dpRender(); return;
  }
  state.dpMine.push(i);
  state.dpWarn=false;
  state.dpMsg = state.dpMine.length>=DP_MINE_N
    ? '두 장을 모두 내어놓았어요. 이제 <b>내가 낸 종이는 빼고</b> 세 장에 별표를 나누어 줘요.'
    : '<b>「'+DP_CARD[i].f+'」</b>를 내어놓았어요. 한 장 더 골라 봐요.';
  playBlip(); dpRender();
}

/* ② 별표 배분 — ☆☆☆ → ☆☆ → ☆ 순서 (판은 옳고 그름을 돌려주지 않는다) */
function dpGiveStar(i){
  if(state.dpFin!=null) return;                                      // 가드①
  if(state.dpBusy) return;                                           // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=DP_CARD.length) return;        // 가드②
  if(state.dpMine.length < DP_MINE_N) return;                        // 가드③ 내 종이 두 장 전 별표 무시(순서)
  if(dpStarCount(state) >= DP_GRADE.length) return;                  // 별표 소진
  if(dpIsMine(state,i)){                                             // 가드④ ★ 내가 낸 종이에는 별표 무시(토의 규칙)
    state.dpMsg='<b>자신이 제시한 해결 방법</b>은 빼고 골라요. 친구들이 낸 종이 가운데에서 골라 봐요.';
    state.dpWarn=true; state.dpBusy=true;
    playThud(); dpRender();
    setTimeout(()=>{ state.dpBusy=false; state.dpMsg=null; state.dpWarn=false; dpRender(); },1600);
    return;
  }
  if(state.dpStar[i]){                                               // 가드⑥ 이미 별표를 받은 종이 무시
    state.dpMsg='이 종이에는 이미 <b>'+dpStars(state.dpStar[i])+'</b>를 주었어요. 다른 종이를 골라 봐요.';
    state.dpWarn=true; playThud(); dpRender(); return;
  }
  const g=dpNextGrade(state);
  state.dpStar[i]=g;
  state.dpWarn=false;
  const left=DP_GRADE.length-dpStarCount(state);
  state.dpMsg='<b>「'+DP_CARD[i].f+'」</b>에 '+dpStars(g)+'를 주었어요. '
    + (left>0 ? '남은 별표는 '+dpStars(DP_GRADE[dpStarCount(state)])+' 예요.'
              : '세 장에 모두 주었어요. 별표를 세어 보니 순위가 이렇게 됐네요.');
  playBlip(); dpRender();
}

/* ↺ 다시 배분 — 배분을 바꾸면 결과가 바뀐다(이 패턴의 눈) */
function dpReset(){
  if(state.dpFin!=null) return;                                      // 가드①
  if(state.dpBusy) return;                                           // 가드⑧
  state.dpStar={}; state.dpWrongF=null; state.dpWarn=false;
  state.dpMsg='별표를 도로 거두었어요. <b>다르게 나누어 주면 모둠 의견도 달라져요.</b> 다시 골라 봐요.';
  playBlip(); dpRender();
}

/* ③ 마무리 3택 — 이 조작에서 옳고 그름이 있는 단 하나의 자리 */
function dpFinish(k){
  if(state.dpFin!=null) return;                                      // 가드①
  if(state.dpBusy) return;                                           // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=DP_FIN.length) return;         // 가드② 무효 마무리 번호
  if(dpStarCount(state) < DP_GRADE.length) return;                    // 가드⑦ 별표 셋 전 마무리 무시
  if(k===DP_FIN_OK){
    state.dpFin=k; state.dpWrongF=null; state.dpMsg=null; state.dpWarn=false;
    playChime(); dpRender(); return;
  }
  state.dpWrongF=k; state.dpWarn=true; state.dpBusy=true;
  state.dpMsg = k===0
    ? '별표를 <b>다시 나누어 주면</b> 순위가 달라져요. 아래 단추로 도로 거두고 다르게 주어 봐요.'
    : '<b>자신이 제시한 해결 방법</b>에는 별표를 줄 수 없었지요. 그래서 내 의견만 뽑히게 할 수는 없어요.';
  playThud(); dpRender();
  setTimeout(()=>{ if(state.dpWrongF===k){ state.dpWrongF=null; state.dpMsg=null; state.dpWarn=false; state.dpBusy=false; dpRender(); } else { state.dpBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u3_l08_인권보호노력.html'; } // 주제② l08 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

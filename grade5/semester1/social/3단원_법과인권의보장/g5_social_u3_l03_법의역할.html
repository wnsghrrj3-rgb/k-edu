K-edu 사회 5-1 · 3단원 법과 인권의 보장 · 주제① 법의 역할과 인권 · 3차시(l03)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사03-01] · 교과서 p.119~122 · 지도서(대단원3 **5차시** 법의 역할을 알아볼까요, 지도서 p.245~252) 근거
학습 목표: 법의 역할을 설명할 수 있다.
수업 기법 및 전략: **IF 기법** · 의견 나누기 · 신문 기사 활용하기
직접조작: 법 스위치 판(신규 패턴 — 가정(IF) 대조형 / 판에 세상이 둘이다)
  ⭐ 앞의 스물일곱 종은 전부 **세상 하나 위에서만 재었다.**
     검색을 하든, 서랍에 넣든, 고리를 잇든, 판이 다루는 세상은 언제나 **지금 이대로의 세상** 하나였다.
     이번만 다르다 — **판에 세상이 둘이다.**
     같은 장면에 「**법이 있는 오늘**」과 「**법이 없다면**」이 두 겹으로 겹쳐 있고,
     학생이 **스위치를 내려 법을 걷어 내면** 그 장면이 어떻게 달라지는지가 뜬다.
     왜냐하면 이 차시의 수업 기법이 「**IF 기법**」이고, 지도서 전개가 두 번에 걸쳐
     같은 발문을 되풀이하기 때문이다 — “각 상황에서 **법이 없다면 어떤 일이 생길지** 이야기해 봅시다.”
     지도서 학습 안내도 그대로다 — “법이 없거나 법을 지키지 않으면 어떤 일이 일어날지 떠올려 보는
     활동을 제시했다. 어떤 일이 벌어질 수 있는지 생각해 보며 **법의 필요성을 파악**하도록 한다.”
  ⭐ 그래서 **판정이 가정에는 붙지 않는다.** 법을 걷어 내는 일에는 옳고 그름이 없다 — 무엇을 걷어 내도
     판은 그냥 보여 준다. 판정은 **법을 다시 돌려놓은 뒤**에 온다:
     “그래서 이 법은 그동안 무슨 일을 하고 있었나요?”
     걷어 내 보지 않으면 역할 3택이 아예 열리지 않고(가드④),
     걷어 낸 채로도 열리지 않는다(가드⑤). **두 세상을 다 보아야 역할이 보인다.**
  ① **장면 고르기** — 여섯 장면(교과서 p.120·121 [활동] 원문).
  ② **「법을 걷어 내 봐요」** — 장면이 회색으로 바뀌고 「법이 없다면」에 생길 일이 뜬다(판정 0).
  ③ **「법을 다시 올려요」** — 장면이 돌아오고 그제야 **역할 3택**이 열린다(판정 있음).
     맞히면 그 장면이 「개인의 권리 보호」 / 「사회 질서 유지」 두 칸 가운데 알맞은 쪽에 **저절로 적힌다.**
     학생은 세부 역할을 고르면서 두 큰 갈래가 채워지는 것을 눈으로 본다.
  ④ 여섯 장면을 다 분류하면 마무리 3택 — **법이 필요한 까닭**
     = “문제가 발생했을 때 법은 사람들 사이의 **갈등이나 다툼을 해결하는 기준**이 되기 때문입니다.”(지도서 원문)
  ⚠️ 장면 여섯·「법이 없다면」 문구·역할 3택은 모두 **고정 리터럴 — 난수 0**.
     장면 i의 정답 세부 역할도 i라서 판정이 한 줄로 검증된다.
     역할 3택은 언제나 **두 갈래가 섞여** 있어(권리 쪽 + 질서 쪽) 고를 때마다 두 갈래를 견주게 된다.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 장면·역할·마무리 번호(`Number.isInteger`) /
     ③ 장면을 고르기 전 스위치 무시(순서 강제) / ④ **법을 걷어 내 보기 전 역할 3택 무시**(순서 강제) /
     ⑤ **법을 걷어 낸 채로는 역할 3택 무시**(법을 돌려놓아야 함 — 두 세상 구조의 핵심 가드) /
     ⑥ 이미 분류한 장면 재선택 무시 / ⑦ 여섯 장면 전 마무리 무시(순서 강제) /
     ⑧ 안내가 떠 있는 동안 재클릭 무시(`swBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.sw-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
지도서 근거(5차시 p.245~252):
  [동기 유발] 법의 보호를 받은 경험 — 아침 등굣길에 교통경찰관이 있어서 안전하게 등교한다 /
    집에 불이 났을 때 소방관이 출동해 불을 빨리 꺼 주셔서 큰 피해를 막을 수 있었다.
  [학습 문제] 법의 역할을 알아봅시다.
  [스스로 활동 p.119] 법의 필요성 탐구하기 — 폐수를 계속해서 함부로 버린다면?
    → 하천이 오염되어 심각한 환경 문제가 발생한다 / 하천에서 악취가 나서 숨 쉬기가 힘들어진다 /
      물이 오염되어 하천에 사는 생물이 살아가기 어려워진다 / 하천이 오염되어 사람들이 마시는 물에 영향을 줄 수 있다.
    필요한 법 = 공장에서 폐수를 버릴 수 없도록 하는 법 / 환경을 오염시키면 벌금을 부과할 수 있는 법.
    **법이 필요한 까닭 = 문제가 발생했을 때 법은 사람들 사이의 갈등이나 다툼을 해결하는 기준이 되기 때문이다.**
  [전개 1 p.120] 법의 역할 — **개인의 권리 보호**. 네 장면 —
    ① 개인 사이에 다툼이 생겨 재판을 받는 모습 → 개인 간에 다툼이 생겼을 때 법에 따라 재판하여 해결한다.
    ② 물에 빠진 사람을 구조하는 모습 → 법은 사고나 화재 등의 위험으로부터 개인의 생명을 보호한다.
    ③ 전화번호 대신 개인 안심 번호를 쓰도록 하는 안내문 → 법은 생년월일, 전화번호 등의 개인 정보를 보호한다.
    ④ 화재 현장에 소방차가 출동해 불을 끄는 모습 → 법은 개인의 재산을 보호한다.
    법이 없다면 = 개인 사이에 분쟁이 생길 때마다 해결하는 데에 어려움을 겪고 시간이 오래 걸릴 수 있다 /
      사고나 화재 등의 위험을 겪을 때 보호받을 수 없다.
    핵심 질문 = **법은 개인의 권리를 보호합니다.**
  [전개 2 p.121] 법의 역할 — **사회 질서 유지**. 네 장면 —
    ① 특수 경찰이 순찰을 도는 모습 → 법은 범죄나 사고를 예방한다.
    ② 교통경찰관이 도로 위에서 교통 단속을 하는 모습 → 법은 도로 위 교통질서를 유지한다.
    ③ 환경미화원이 거리를 청소하는 모습 → 법을 통해 깨끗하고 쾌적한 생활 환경에서 생활할 수 있다.
    ④ 공정 거래 위원회의 모습 → 법을 통해 공정한 경제 질서를 유지한다.
    법이 없다면 = 각종 범죄가 발생하여 우리의 안전이 위협을 받는다 /
      교통사고가 자주 발생하여 인명 피해가 많이 발생한다 / 깨끗하고 쾌적한 생활 환경이 유지되기 어렵다 /
      공정한 경제 질서가 무너져 사회가 혼란해진다.
    핵심 질문 = **법은 사회 질서를 유지하여 우리가 안전하게 살아가게 합니다.**
  [미디어 활동 p.122] 신문 기사 두 건 —
    가 = 동의 없이 사진을 사회 관계망 서비스에 올려 초상권을 침해한 문제 → 손해 배상 청구 →
      법원이 손해 배상금을 지급하고 무단으로 게시한 사진을 사용하지 못하도록 판결 = **개인의 권리 보호**.
    나 = 소방차 전용 구역에 불법 주차를 하거나 진입을 가로막는 방해 행위를 하면 과태료를 내게 하는 법을
      만듦 = **사회 질서 유지**.
    핵심 질문 = 개인의 권리를 보호하고, 사회 질서를 유지합니다.
  [5차시 주요 내용 정리] 1. 법의 필요성 = 사람들 사이의 갈등이나 다툼을 해결하는 기준이 됨.
    2. 법의 역할 ① 개인의 권리 보호(개인 사이의 분쟁 해결, 개인의 생명이나 재산 보호, 개인 정보 보호 등)
       ② 사회 질서 유지(사고나 범죄 예방, 교통질서 유지, 공정한 경제 질서 유지, 환경 보호 등).
  [정리] 차시 예고 = 헌법에 담긴 인권 보장 사례 찾기. 준비물 = 도화지, 색칠 도구.
⚠️ 설계 원칙:
  · **6~7차시(헌법에 담긴 인권 보장) 선행 침범 0** — 헌법의 뜻·기본권·인권의 뜻·세계 인권 선언 0.
    「헌법」·「인권」은 **차시 예고 두 자리에서 다음 차시 제목으로만** 등장한다(‘인권’은 META 두 자리 추가).
  · **8차시 이후(준법 태도·인권 침해·인권 보호) 선행 침범 0** — 준법·인권 침해·인권 보호 0.
    ⚠️ [미디어 활동] 나의 ‘불법 주차·과태료’는 5차시 원문이라 싣되, ‘지켜야 한다’는 **태도 진술은 0**.
  · 교사용 참고 자료 0 — 법의 기능 다섯(이익 조정·공익의 추구·법의 지배·법치주의·형법·민사법),
    민사 재판/형사 재판의 원고·피고, 공정 거래 위원회의 소속과 기능 넷, 개인 정보의 법적 정의,
    참고 도서, 기사 날짜, 금액 예시가 전부 0.
  · **우리나라 지역 이름 0**(사진 해설의 제주공항·세종특별자치시 어진동 포함) · **학생 이름 0** ·
    **문항 내 연도·금액·비율 0.**
  · 정서 — 「법이 없다면」은 겁을 주려는 자리가 아니다. 지도서 예시 답안 원문만 쓰고,
    걷어 낸 세상에 오래 머물지 않도록 **법을 다시 올려야 다음으로 넘어가게** 했다.

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#EDE9FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#581C87;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#FBF7FF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 법 스위치 판(가정(IF) 대조형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.sw-q{background:var(--bub);border-radius:9px;padding:6px 10px;font-size:clamp(11px,1.86vw,13.2px);
  font-weight:800;color:var(--green-d);line-height:1.45}
.sw-list{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow-y:auto}
.sw-list button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10px,1.7vw,12.2px);transition:.15s;
  line-height:1.35;text-align:left}
.sw-list button:hover{border-color:var(--green);background:var(--bub)}
.sw-list button.on{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.sw-off{border:2px solid var(--red);background:#fff;color:var(--red);border-radius:10px;padding:9px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.8px,1.82vw,13px)}
.sw-off:hover{background:#FEE2E2}
.sw-on{border:2px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:9px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.8px,1.82vw,13px)}
.sw-on:hover{background:var(--green-d)}
.sw-roles{display:flex;flex-direction:column;gap:5px}
.sw-roles button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.2px,1.74vw,12.6px);text-align:left;line-height:1.4}
.sw-roles button:hover{background:var(--bub)}
.sw-roles button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.sw-back{border:2px solid #CBD5E0;background:#fff;color:#475569;border-radius:10px;padding:6px 8px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10px,1.7vw,12.2px)}
.sw-back:hover{border-color:var(--green);color:var(--green-d)}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* 문구를 칸 폭에 맞춰 도막으로 나눈다(좌표 리터럴이라 jsdom은 폭을 못 본다) */
function swWrap(s,n,max){
  const w=s.split(' '); const out=[]; let cur='';
  for(const t of w){ if((cur+' '+t).trim().length>n && cur){ out.push(cur); cur=t; } else { cur=(cur?cur+' ':'')+t; } }
  if(cur) out.push(cur);
  return out.slice(0,max||3);
}
function swHas(st,i){ return st.swBook.some(b=>b.scn===i); }
/* 장면 아이콘 — 법을 걷어 내면 회색으로 바뀐다 */
function swIcon(k,off){

    lock:`<rect x="10" y="18" width="24" height="20" rx="4" fill="${f}" stroke="${c}" stroke-width="2"/><path d="M15 18 L15 12 A7 7 0 0 1 29 12 L29 18" fill="none" stroke="${c}" stroke-width="2"/><circle cx="22" cy="28" r="3" fill="${c}"/>`,
    patrol:`<circle cx="22" cy="14" r="8" fill="${f}" stroke="${c}" stroke-width="1.8"/><rect x="12" y="5" width="20" height="6" rx="2" fill="${c}"/><path d="M8 40 Q22 22 36 40 Z" fill="${c}"/>`,
    traffic:`<rect x="14" y="4" width="16" height="32" rx="4" fill="${f}" stroke="${c}" stroke-width="1.8"/><circle cx="22" cy="12" r="3.6" fill="${off?'#CBD5E0':'#DC2626'}"/><circle cx="22" cy="20" r="3.6" fill="${off?'#CBD5E0':'#FCD34D'}"/><circle cx="22" cy="28" r="3.6" fill="${off?'#CBD5E0':'#22C55E'}"/><rect x="4" y="38" width="36" height="4" fill="${c}"/>`,

  };
  return g[k]||'';
}

/* 판 — 위: 장면 창(두 세상) · 아래: 두 갈래 칸 */
function swCanvas(st){
  const p=st.swPick, off=st.swOff;
  let g='';
  // 장면 창
  const bg = (p!=null && off) ? '#F1F5F9' : '#ffffff';
  g+=`<rect x="12" y="8" width="296" height="112" rx="12" fill="${bg}" stroke="${(p!=null&&off)?'#DC2626':'#7E22CE'}" stroke-width="2.2"/>`;
  if(p==null){
    g+=`<text x="160" y="62" font-size="11" fill="#94A3B8" text-anchor="middle" font-weight="700">장면을 하나 골라 봐요</text>`;
  } else {
    const S=SCN[p];
    // 배지
    const bt = off ? '법이 없다면' : '법이 있는 오늘';
    g+=`<rect x="${off?196:188}" y="16" width="${off?100:108}" height="18" rx="9" fill="${off?'#FEE2E2':'#F3E8FF'}" stroke="${off?'#DC2626':'#7E22CE'}" stroke-width="1.4"/>`;
    g+=`<text x="${off?246:242}" y="29" font-size="9.4" fill="${off?'#DC2626':'#581C87'}" text-anchor="middle" font-weight="800">${bt}</text>`;
    g+=`<g transform="translate(24,20)">${swIcon(S.icon,off)}</g>`;
    swWrap(S.t,15,2).forEach((ln,j)=>{
      g+=`<text x="80" y="${40+j*14}" font-size="9.6" fill="${off?'#94A3B8':'#334155'}" font-weight="700">${ln}</text>`; });
    if(off){
      swWrap(S.ifn,32,3).forEach((ln,j)=>{
        g+=`<text x="24" y="${78+j*13}" font-size="8.4" fill="#B91C1C">${ln}</text>`; });
    } else {
      g+=`<text x="24" y="82" font-size="8.6" fill="#7E22CE" font-weight="700">법이 이 장면을 지켜 주고 있어요.</text>`;
      g+=`<text x="24" y="97" font-size="8.4" fill="#64748B">스위치를 내려 법을 걷어 내 보면 무엇이 달라질까요?</text>`;
    }
  }
  // 두 갈래 칸
  for(let s=0;s<2;s++){
    const x=12+s*152;
    g+=`<rect x="${x}" y="128" width="144" height="114" rx="12" fill="${s===0?'#FAF5FF':'#F8FAFC'}" stroke="${s===0?'#7E22CE':'#9333EA'}" stroke-width="2"/>`;
    g+=`<text x="${x+72}" y="146" font-size="9.8" fill="#581C87" text-anchor="middle" font-weight="800">${SIDE[s]}</text>`;
    const mine=st.swBook.filter(b=>SCN[b.scn].side===s);
    for(let k=0;k<3;k++){
      const y=152+k*30, b=mine[k];
      if(b==null){
        g+=`<rect x="${x+8}" y="${y}" width="128" height="26" rx="6" fill="#fff" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="4 3"/>`;
        g+=`<text x="${x+72}" y="${y+17}" font-size="8.4" fill="#C7CBD3" text-anchor="middle">빈 칸</text>`;
      } else {
        g+=`<rect x="${x+8}" y="${y}" width="128" height="26" rx="6" fill="#fff" stroke="#7E22CE" stroke-width="1.6"/>`;
        g+=`<text x="${x+14}" y="${y+11}" font-size="8.6" fill="#581C87" font-weight="800">${SCN[b.scn].n}</text>`;
        swWrap(ROLE[b.role],18,1).forEach(ln=>{
          g+=`<text x="${x+14}" y="${y+22}" font-size="7.2" fill="#475569">${ln}</text>`; });
      }
    }
  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function swPanel(st){
  if(!st.swBook) st.swBook=[];
  const done = st.swFin!=null;
  const full = st.swBook.length>=SW_GOAL;
  let right='';
  right+=`<div class="dw-step">🔀 분류한 장면 ${st.swBook.length} / ${SW_GOAL}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">⚖️ 법의 역할을 알았어요</div>
      <div>법을 걷어 낸 세상을 보고 나서야, 법이 그동안 무슨 일을 하고 있었는지 보였지요.
      법은 <b>개인의 권리를 보호</b>하고, <b>사회 질서를 유지</b>해요.</div>
      <div style="margin-top:5px;color:#64748B">그리고 문제가 생겼을 때 법은 사람들 사이의 <b>갈등이나 다툼을 해결하는 기준</b>이 돼요.</div></div>`;
  } else if(full){
    right+=`<div class="sw-q">법이 필요한 까닭은 무엇일까요?</div>`;
    right+=`<div class="sw-roles">${SW_FIN.map((f,k)=>
      `<button class="${st.swWrongF===k?'no':''}" onclick="swFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(st.swPick==null){
    right+=`<div class="sw-q">장면을 하나 골라 봐요.</div>`;
    const rest=[];
    for(let i=0;i<SCN.length;i++) if(!swHas(st,i)) rest.push(i);
    right+=`<div class="sw-list">${rest.map(i=>
      `<button onclick="swPickScene(${i})">${SCN[i].t}</button>`).join('')}</div>`;
  } else if(!st.swSeen){
    right+=`<div class="sw-q">이 장면에서 법을 걷어 내면 어떤 일이 생길까요?</div>`;
    right+=`<button class="sw-off" onclick="swToggle()">⬇ 법을 걷어 내 봐요</button>`;
    right+=`<button class="sw-back" onclick="swBack()">↩ 다른 장면으로</button>`;
  } else if(st.swOff){
    right+=`<div class="sw-q">법이 없다면 이런 일이 생겨요. 법을 다시 돌려놓아요.</div>`;
    right+=`<div class="dw-msg warn">${SCN[st.swPick].ifn}</div>`;
    right+=`<button class="sw-on" onclick="swToggle()">⬆ 법을 다시 올려요</button>`;
  } else {
    right+=`<div class="sw-q">그래서 이 법은 그동안 무슨 일을 하고 있었나요?</div>`;
    right+=`<div class="sw-roles">${SW_OPT[st.swPick].map((r,k)=>
      `<button class="${st.swWrongR===k?'no':''}" onclick="swPickRole(${k})">${ROLE[r]}</button>`).join('')}</div>`;
    right+=`<button class="sw-back" onclick="swBack()">↩ 다른 장면으로</button>`;
  }
  if(st.swMsg) right+=`<div class="dw-msg${st.swWarn?' warn':''}">${st.swMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🔀 법을 걷어 내 보고, 다시 올려 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${swCanvas(st)}<div class="cvcap">한 장면에 세상이 둘이에요 — 법이 있는 오늘과 법이 없다면</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";

  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l03";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  swPick:null, swOff:false, swSeen:false, swBook:[], swFin:null,
  swWrongR:null, swWrongF:null, swMsg:null, swWarn:false, swBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function swRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 장면 고르기 */
function swPickScene(i){
  if(state.swFin!=null) return;                                     // 가드① 확정 후 전체 잠금
  if(state.swBusy) return;                                          // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(i) || i<0 || i>=SCN.length) return;           // 가드② 무효 장면 번호
  if(swHas(state,i)){                                               // 가드⑥ 이미 분류한 장면 재선택 무시
    state.swMsg='이미 분류한 장면이에요. 다른 장면을 골라 봐요.'; state.swWarn=true;
    playThud(); swRender(); return;
  }
  if(state.swPick!=null) return;                                    // 다른 장면으로 가려면 「↩ 다른 장면으로」
  state.swPick=i; state.swOff=false; state.swSeen=false;
  state.swWrongR=null; state.swMsg=null; state.swWarn=false;
  playBlip(); swRender();
}

/* ② 스위치 — 법을 걷어 냈다가 다시 올린다. 이 자리에는 판정이 없다 */
function swToggle(){
  if(state.swFin!=null) return;                                     // 가드①
  if(state.swBusy) return;                                          // 가드⑧
  if(state.swPick==null) return;                                    // 가드③ 장면을 고르기 전 스위치 무시(순서)
  state.swOff = !state.swOff;
  if(state.swOff){
    state.swSeen = true;
    state.swMsg = '법을 걷어 냈어요. <b>옳고 그름을 재지 않아요</b> — 무엇이 달라지는지만 보여 줘요.';
  } else {
    state.swMsg = '법을 다시 올렸어요. 그럼 이 법은 그동안 무슨 일을 하고 있었을까요?';
  }
  state.swWarn=false; playBlip(); swRender();
}

/* ③ 역할 고르기 — 두 세상을 다 보아야 열린다 */
function swPickRole(k){
  if(state.swFin!=null) return;                                     // 가드①
  if(state.swBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>2) return;                     // 가드② 무효 역할 번호
  if(state.swPick==null) return;
  if(!state.swSeen) return;                                         // 가드④ 걷어 내 보기 전 무시(순서)
  if(state.swOff) return;                                           // 가드⑤ 걷어 낸 채로는 무시(법을 돌려놓아야 함)
  const r = SW_OPT[state.swPick][k], want = SCN[state.swPick].role;
  if(r===want){
    state.swBook.push({scn:state.swPick, role:r});
    const side = SCN[state.swPick].side;
    state.swPick=null; state.swOff=false; state.swSeen=false;
    state.swWrongR=null; state.swWarn=false;
    state.swMsg = state.swBook.length>=SW_GOAL
      ? `「${SIDE[side]}」 칸에 적었어요. 여섯 장면을 모두 분류했어요.`
      : `「${SIDE[side]}」 칸에 적었어요. 다른 장면도 살펴볼까요?`;
    playChime(); swRender(); return;
  }
  state.swWrongR=k; state.swWarn=true; state.swBusy=true;
  const other = ROLE_SIDE[r]===SCN[state.swPick].side
    ? `그것은 「${SCN[SCN.findIndex(s=>s.role===r)].n}」 장면에서 하는 일이에요.`
    : `그것은 <b>${SIDE[ROLE_SIDE[r]]}</b> 쪽에서 하는 일이에요.`;
  state.swMsg = other + ' 걷어 냈을 때 무엇이 달라졌는지 다시 떠올려 봐요.';
  playThud(); swRender();
  setTimeout(()=>{ if(state.swWrongR===k){ state.swWrongR=null; state.swBusy=false; swRender(); } else { state.swBusy=false; } },1600);
}

/* ↩ 다른 장면으로 */
function swBack(){
  if(state.swFin!=null) return;                                     // 가드①
  if(state.swBusy) return;                                          // 가드⑧
  state.swPick=null; state.swOff=false; state.swSeen=false;
  state.swWrongR=null; state.swWarn=false;
  state.swMsg='다른 장면을 골라 봐요.';
  playBlip(); swRender();
}

/* ④ 마무리 — 법이 필요한 까닭 */
function swFinish(k){
  if(state.swFin!=null) return;                                     // 가드①
  if(state.swBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SW_FIN.length) return;        // 가드② 무효 마무리 번호
  if(state.swBook.length < SW_GOAL) return;                          // 가드⑦ 여섯 장면 전 무시(순서)
  if(k===SW_FIN_OK){
    state.swFin=k; state.swWrongF=null; state.swMsg=null; state.swWarn=false;
    playChime(); swRender(); return;
  }
  state.swWrongF=k; state.swWarn=true; state.swBusy=true;
  state.swMsg = k===1
    ? '기준이 사람마다 다르면 다툼을 해결할 수 없어요. 법은 <b>모두에게 같은 기준</b>이에요.'
    : '법은 문제가 생긴 뒤에만 쓰이는 것이 아니라, 늘 우리 곁에서 일하고 있었어요.';
  playThud(); swRender();
  setTimeout(()=>{ if(state.swWrongF===k){ state.swWrongF=null; state.swMsg=null; state.swWarn=false; state.swBusy=false; swRender(); } else { state.swBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // ⚠️ l04 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

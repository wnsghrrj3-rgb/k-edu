K-edu 사회 5-1 · 3단원 법과 인권의 보장 · 주제① 법의 역할과 인권 · 2차시(l02)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사03-01] · 교과서 p.114~118 · 지도서(대단원3 **3~4차시** 일상생활 속 법을 알아볼까요, 지도서 p.236~244) 근거
학습 목표: 일상생활 속 법을 설명할 수 있다.
수업 기법 및 전략: 조사하기 · 돌아가며 말하기
직접조작: 생활 법령 검색대(신규 패턴 — 검색·수집형 / 판이 처음엔 비어 있다)
  ⭐ 앞의 스물여섯 종은 전부 **판이 후보를 먼저 다 펼쳐 놓았다.**
     카드 여섯 장이든, 낱말 마흔다섯 개든, 방안 네 장이든, 학생은 **보이는 것 가운데서** 골랐다.
     이번만 다르다 — **판이 처음에는 아무것도 보여 주지 않는다.**
     검색창이 비어 있고 결과 목록도 비어 있다. 학생이 **알고 싶은 주제를 스스로 정해**
     검색어로 넣고 「찾기」를 눌러야, 그제야 그 주제의 법이 목록으로 **불려 나온다.**
     조작이 「고르기」에서 「불러오기」로 바뀐 첫 자리다.
     왜냐하면 이 차시의 수업 기법이 「**조사하기**」이고,
     교과서 [스스로 활동]이 정확히 그 차례이기 때문이다 —
     “누리집에 접속하여 목록에서 **알고 싶은 주제를 선택**한 후 법의 내용을 살펴봅시다.”
     지도서 활동 의도도 그대로다 — “학생들이 **자신과 관련한 법 혹은 관심 있는 주제의 법**을
     조사하고 그 내용을 정리해 보면서 법에 대해 관심을 가질 수 있도록 한 활동이다.”
  ⭐ 그래서 **검색어 여덟 가운데 어느 넷을 골라도 된다.** 정해진 차례가 없다.
     “찾아보고 싶은 주제는 무엇인가요?”라는 지도서 발문에 정답이 없는 것과 같다.
  ① **검색어 고르기** — 여덟 낱말(등굣길·학교 급식·놀이터·창작물·순찰·쓰레기·진료·화재) 가운데 하나.
  ② **「찾기」** — 그때 비로소 결과 목록에 법 **세 건**이 뜬다(맞는 법 1 + 다른 주제의 법 2).
  ③ **법 고르기** — 맞으면 법 이름과 내용이 뜨고, 틀리면 **그 법이 어느 검색어에 있는지 알려 준다**
     (“「의료법」은 ‘진료’와 관련된 법이에요. 검색어 「진료」로 찾아보면 만날 수 있어요.”)
     — 막아 세우지 않고 다른 검색어로 넘겨준다.
  ④ **영향 고르기** — 법을 찾은 뒤에야 “이 법이 있어서 우리 생활은 어떻게 될까요?” 3택이 열린다.
     맞히면 그 한 줄까지 함께 **조사 수첩**에 적힌다. 이것이 지도서 전개의 마지막 단계
     「**법이 우리 생활에 주는 영향 살펴보기**」다 — 법을 찾는 데서 끝나지 않는다.
  ⑤ 수첩 **네 칸**이 다 차야 마무리 3택이 열린다(순서 강제).
     마무리 = 핵심 질문 「법은 우리 생활에 어떤 영향을 주고 있나요?」
     → 교과서 p.117 본문 원문 “**법은 일상생활 곳곳에 적용됩니다. 우리 사회의 많은 일이 법에 따라
     이루어지고 있습니다.**”
  ⚠️ 법 여덟 종·결과 목록·영향 3택은 모두 **고정 리터럴 — 난수 0**.
     검색어 i의 정답 법도 i라서, 결과 목록과 영향 목록 어디에 놓여도 판정이 한 줄로 검증된다.
     레이아웃 측정이 필요 없고, jsdom에서 검색·수집·수첩 상태를 그대로 대조할 수 있다.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 검색어·법·영향·마무리 번호(`Number.isInteger`) /
     ③ 검색어를 고르기 전 「찾기」 무시(순서 강제) / ④ 「찾기」 전 결과 목록 클릭 무시(순서 강제) /
     ⑤ 법을 고르기 전 영향 3택 무시(순서 강제) / ⑥ 이미 수첩에 담은 검색어 재선택 무시 /
     ⑦ 네 칸이 차기 전 마무리 무시(순서 강제) / ⑧ 안내가 떠 있는 동안 재클릭 무시(`srBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.sr-q`로 떼어 **상시 노출**한다(u2 l06에서 하니스가 잡은 결함의 규약 승계).
지도서 근거(3~4차시 p.236~244):
  [동기 유발] 알고 있거나 들어 본 법 떠올리기 — 개인 정보를 보호하는 법 / 학교 폭력을 예방하는 법.
    법이 있어서 좋은 점 — 우리가 안전하게 살 수 있도록 도와준다 / 법의 보호 아래 행복한 생활을 할 수 있다.
  [학습 문제] 일상생활 속 법을 알아봅시다.
  [전개 1] 학교생활과 관련한 법 살펴보기(교과서 p.114) —
    「도로 교통법」이 있어 안전하게 등교합니다 / 「초·중등 교육법」에 따라 학교에서 교육을 받습니다 /
    「학교 급식법」이 있어 영양가 있고 안전한 급식을 먹을 수 있습니다 /
    「어린이 놀이 시설 안전 관리법」이 있어 안전한 놀이터를 이용할 수 있습니다.
  [스스로 활동 p.115] 일상생활 속 법 찾아보기 — ‘찾기 쉬운 생활 법령 정보’ 누리집에 접속 →
    ‘책자형 생활 법령’ 선택 → 목록에서 알고 싶은 주제 선택 → 법의 내용 살펴보기.
    찾아보고 싶은 주제 = 식품 안전 / 환경 / 어린이. 정리 예시 = 「식품 안전 기본법」·「환경법」·「아동 복지법」.
    느낀 점 = 우리 생활 속 다양한 부분에 법이 적용되고 있다 / 법이 우리 생활에 많은 영향을 미치고 있다 /
    우리가 안전하게 생활하고 있는 것은 법 때문이라는 생각이 들었다.
  [친구와 활동 p.116~117] 일상생활 속 다양한 법 탐구하기 — 아홉 장면과 그 법(원문 전량) —
    ① 창작물에 정당한 비용을 내고 이용 → 「저작권법」 ② 경찰이 순찰 → 「경찰관 직무 집행법」
    ③ 새로 지은 건물의 안전 확인 → 「건축법」 ④ 공원 쓰레기를 집으로 가져감 → 「자연환경 보전법」
    ⑤ 소방관이 화재 신고를 받고 출동 → 「소방 기본법」 ⑥ 어린이 보호 구역 상황 → 「도로 교통법」
    ⑦ 서비스 센터 방문 → 「소비자 기본법」 ⑧ 음식점에서 음식을 만들어 팖 → 「식품 안전 기본법」
    ⑨ 환자가 진찰을 받음 → 「의료법」.
    교과서 p.117 본문 = 법은 일상생활 곳곳에 적용됩니다. 우리 사회의 많은 일이 법에 따라 이루어지고 있습니다.
  [전개 3] 법이 우리 생활에 주는 영향 살펴보기 — 법을 정해 놓은 까닭(지도서 예시 답안 원문) —
    「식품 안전 기본법」 = 건강하고 안전한 식생활을 할 수 있도록 보장하기 위해서 /
    「자연환경 보전법」 = 생태계와 자연환경을 보호하고 국민이 건강한 생활을 할 수 있도록 하기 위해서 /
    「소방 기본법」 = 화재를 예방하고, 재난·재해 등 위급한 상황에서 국민의 생명과 재산을 보호하기 위해서 /
    「도로 교통법」 = 도로에서 일어나는 위험과 장애를 방지·제거하여 안전하고 원활한 교통을 확보하기 위해서.
  [별별 직업 속으로 p.118] 특별 사법 경찰 — 세금·농수산물·교통·환경·근로 등 특수하고 전문적인 분야를 수사한다.
    그 분야에서 법이 잘 지켜지고 있는지, 불법 행위가 이뤄지지 않는지 꼼꼼하게 살펴본다.
    되려면 = 먼저 해당 분야의 공무원이어야 하고, 법률에 관한 지식과 수사 역량이 필요하다.
  [3~4차시 주요 내용 정리] 1. 학교생활과 관련한 법 사례 4종 / 2. 일상생활과 관련한 법 사례 2종
    (「저작권법」이 있어 개인의 창작물을 보호할 수 있음 / 「식품 안전 기본법」에 따라 건강하고 안전한 먹을거리를 얻음).
  [정리] 차시 예고 = 법의 역할.
⚠️ 설계 원칙:
  · **5차시(법의 역할) 선행 침범 0** — ‘법이 없거나 지키지 않으면 어떤 일이 일어날지’,
    개인의 권리 보호, 사회 질서 유지, 분쟁·갈등의 해결, 재판이 전부 0.
    「법의 역할」은 **차시 예고 두 자리와 주제명(META)에서만** 이름으로 등장한다.
  · **6~7차시(헌법에 담긴 인권 보장) 선행 침범 0** — 헌법·기본권·세계 인권 선언 0.
    ‘인권’은 META 단원명·주제명 두 자리에서만 쓴다(주제 이름이 「법의 역할과 인권」이라 불가피).
  · **8차시 이후(준법 태도·인권 침해·인권 보호) 선행 침범 0** — 준법·인권 침해·인권 보호 0.
    ⚠️ 교과서 ⑥ ‘어린이 보호 구역에 불법 주정차’ 장면은 **법을 어긴 장면**이라 8차시(법을 지키는 태도)와 맞닿는다.
    그래서 화면에 싣지 않고, 「도로 교통법」은 **등굣길** 맥락으로만 다룬다.
  · 2차시(l01) 낱말 **강제성·제재·규범**은 회수 한 자리에서만 되받는다(새로 가르치지 않는다).
  · 교사용 참고 자료 0 — 솔로몬 로 파크, 이로운 법, 법 교육 프로그램, 법제처·어린이 법제처 누리집,
    「형사 소송법」, 「경찰학 사전」, 「폐기물 관리법」, 「근로 기준법」, 「교육 기본법」,
    참고 도서, 특별 사법 경찰의 급수·연혁·사고 현장 지명, 활동지 벌금 액수가 전부 0.
  · **우리나라 지역 이름 0 · 학생 이름 0 · 문항 내 연도·금액·비율 0.**
  · 정서 — 틀린 선택을 ‘틀렸다’로 세우지 않고 **어느 검색어에 가면 만날 수 있는지** 알려 준다.
    조사는 헤매면서 하는 일이기 때문이다.
  · 3단원 색 **#7E22CE(보라)** — CSS 변수값만 바꾸고 변수명은 그대로 두어 엔진 코드를 무수정 승계한다.

.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.scene.wide{width:clamp(240px,44vw,420px)}
.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}
.tipbox{background:#EFF6FF;border:2px solid #BFDBFE;border-radius:12px;padding:10px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.6;color:#1E3A8A;max-width:640px}
.tipbox b{color:#1D4ED8}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#EDE9FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#581C87;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#FBF7FF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 생활 법령 검색대(검색·수집형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.sr-q{background:var(--bub);border-radius:9px;padding:6px 10px;font-size:clamp(11px,1.86vw,13.2px);
  font-weight:800;color:var(--green-d);line-height:1.45}
.sr-keys{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:150px;overflow-y:auto}
.sr-keys button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:6px 6px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.2px,1.72vw,12.4px);transition:.15s;line-height:1.3}
.sr-keys button:hover{border-color:var(--green);background:var(--bub)}
.sr-keys button.on{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.sr-go{border:2px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:8px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.8px,1.82vw,13px)}
.sr-go:hover{background:var(--green-d)}
.sr-list{display:flex;flex-direction:column;gap:4px;max-height:176px;overflow-y:auto}
.sr-list button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;
  font-family:inherit;color:var(--ink);font-size:clamp(10px,1.7vw,12.2px);transition:.15s;line-height:1.35;text-align:left}
.sr-list button:hover{border-color:var(--green);background:var(--bub)}
.sr-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.sr-list button .ln{font-weight:800;color:var(--green-d);display:block}
.sr-back{border:2px solid #CBD5E0;background:#fff;color:#475569;border-radius:10px;padding:6px 8px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10px,1.7vw,12.2px)}
.sr-back:hover{border-color:var(--green);color:var(--green-d)}
.sr-fin{display:flex;flex-direction:column;gap:5px}
.sr-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.2px,1.74vw,12.6px);text-align:left;line-height:1.4}
.sr-fin button:hover{background:var(--bub)}
.sr-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

function srJong(s){ const c=s.charCodeAt(s.length-1); if(c<0xAC00||c>0xD7A3) return 0; return (c-0xAC00)%28; }
function srRo(s){ const j=srJong(s); return (j===0||j===8)?'로':'으로'; }

/* 영향 한 줄을 칸 폭에 맞춰 두 도막으로 나눈다 */
function srWrap(s,n){
  const w=s.split(' '); const out=[]; let cur='';
  for(const t of w){ if((cur+' '+t).trim().length>n && cur){ out.push(cur); cur=t; } else { cur=(cur?cur+' ':'')+t; } }
  if(cur) out.push(cur);
  return out.slice(0,2);
}

      g+=`<text x="160" y="${y+21}" font-size="9" fill="#C7B893" text-anchor="middle">빈 칸</text>`;
    } else {
      const L=LAW[b.law];
      g+=`<rect x="22" y="${y}" width="276" height="34" rx="7" fill="#fff" stroke="#7E22CE" stroke-width="1.7"/>`;
      g+=`<text x="30" y="${y+14}" font-size="${srFit(L.name)}" fill="#581C87" font-weight="800">「${L.name}」</text>`;
      const lines=srWrap(L.eff,26);
      lines.forEach((ln,j)=>{ g+=`<text x="30" y="${y+25+j*9}" font-size="7.4" fill="#475569">${ln}</text>`; });
      g+=`<text x="290" y="${y+14}" font-size="10" fill="#7E22CE" text-anchor="end" font-weight="800">✓</text>`;
    }
  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function srPanel(st){
  if(!st.srBook) st.srBook=[];
  const done = st.srFin!=null;
  const full = st.srBook.length>=SR_GOAL;
  let right='';
  right+=`<div class="dw-step">🔎 조사 수첩 ${st.srBook.length} / ${SR_GOAL}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">📒 일상생활 속 법을 찾았어요</div>
      <div>검색어를 바꿀 때마다 <b>다른 법</b>이 나왔어요. 등굣길에도, 급식실에도, 놀이터에도, 병원에도 법이 있었지요.
      <b>법은 일상생활 곳곳에 적용</b>되고, 우리 사회의 많은 일이 법에 따라 이루어지고 있어요.</div>
      <div style="margin-top:5px;color:#64748B">수첩에 적은 법들은 저마다 우리 생활을 지켜 주는 <b>영향</b>을 주고 있어요.</div></div>`;
  } else if(full){
    right+=`<div class="sr-q">법은 우리 생활에 어떤 영향을 주고 있나요?</div>`;
    right+=`<div class="sr-fin">${SR_FIN.map((f,k)=>
      `<button class="${st.srWrongF===k?'no':''}" onclick="srFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(!st.srFound){
    right+=`<div class="sr-q">알고 싶은 주제를 골라 검색어로 넣어 봐요.</div>`;
    const rest=[];
    for(let i=0;i<LAW.length;i++) if(!srHas(st,i)) rest.push(i);
    right+=`<div class="sr-keys">${rest.map(i=>
      `<button class="${st.srKey===i?'on':''}" onclick="srPickKey(${i})">${LAW[i].key}</button>`).join('')}</div>`;
    if(st.srKey!=null) right+=`<button class="sr-go" onclick="srSearch()">🔍 찾기</button>`;
  } else if(st.srLaw==null){
    right+=`<div class="sr-q">「${LAW[st.srKey].key}」${srRo(LAW[st.srKey].key)} 찾은 세 건이에요. 알맞은 법을 골라요.</div>`;
    right+=`<div class="sr-list">${SR_RES[st.srKey].map((w,k)=>
      `<button class="${st.srWrongL===k?'no':''}" onclick="srPickLaw(${k})"><span class="ln">「${LAW[w].name}」</span>${LAW[w].what}</button>`).join('')}</div>`;
    right+=`<button class="sr-back" onclick="srBack()">↩ 다른 검색어로</button>`;
  } else {
    right+=`<div class="dw-msg">찾았어요 — <b>「${LAW[st.srLaw].name}」</b><br>${LAW[st.srLaw].what}</div>`;
    right+=`<div class="sr-q">이 법이 있어서 우리 생활은 어떻게 될까요?</div>`;
    right+=`<div class="sr-fin">${SR_EFF[st.srKey].map((w,k)=>
      `<button class="${st.srWrongE===k?'no':''}" onclick="srPickEff(${k})">${LAW[w].eff}</button>`).join('')}</div>`;
  }
  if(st.srMsg) right+=`<div class="dw-msg${st.srWarn?' warn':''}">${st.srMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🔎 검색어를 넣어 일상생활 속 법을 찾아 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${srCanvas(st)}<div class="cvcap">찾기 전에는 아무것도 나오지 않아요. 검색어를 넣어야 목록이 나타나요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

  <div class="ka-grp"><div class="scene-row">${sceneCard('job','특별 사법 경찰','wide')}</div>
  ${st.revealed?`<div class="answer-box"><b>세금, 농수산물, 교통, 환경, 근로</b> 등 특수하고 전문적인 분야를 수사해요. 그 분야에서 <span class="ka-emph">법이 잘 지켜지고 있는지, 불법 행위가 이뤄지지 않는지</span> 꼼꼼하게 살펴보지요. 되려면 먼저 <b>그 분야의 공무원</b>이어야 하고, 법률에 관한 지식과 수사 역량이 필요해요.</div>`
    :`<div class="note">전문적인 분야를 맡는 경찰이 있어요.</div><button class="reveal-btn" onclick="reveal()">답 보기</button>`}
  </div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','일상생활 속 법')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">①</span><div>학교생활 — <b style="color:var(--green)">「도로 교통법」</b>에 따라 안전하게 등교하고, <b style="color:var(--green)">「초·중등 교육법」</b>에 따라 학교에서 공부해요.</div></div>
    <div class="sum-item"><span class="n">②</span><div>학교생활 — <b style="color:var(--green)">「학교 급식법」</b>에 따라 영양가 있고 안전한 급식을 먹고, <b style="color:var(--green)">「어린이 놀이 시설 안전 관리법」</b>에 따라 안전한 놀이터를 이용해요.</div></div>
    <div class="sum-item"><span class="n">③</span><div>일상생활 — <b style="color:var(--green)">「저작권법」</b>이 있어 개인의 창작물을 보호할 수 있고, <b style="color:var(--green)">「식품 안전 기본법」</b>에 따라 건강하고 안전한 먹을거리를 얻어요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--red)">법은 일상생활 곳곳에 적용</b>돼요. 우리 사회의 많은 일이 법에 따라 이루어지고 있어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">법의 역할</b>을 알아봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"일상생활 속 법을 찾아 설명할 수 있어요",st)}
    ${selfCheck(1,"법이 우리 생활에 주는 영향을 말할 수 있어요",st)}
    ${selfCheck(2,"알고 싶은 주제의 법을 조사하는 차례를 알아요",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 학습을 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">법의 역할</b>!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l02";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  srKey:null, srFound:false, srLaw:null, srBook:[], srFin:null,
  srWrongL:null, srWrongE:null, srWrongF:null, srMsg:null, srWarn:false, srBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function srRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 검색어 고르기 */
function srPickKey(i){
  if(state.srFin!=null) return;                                     // 가드① 확정 후 전체 잠금
  if(state.srBusy) return;                                          // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(i) || i<0 || i>=LAW.length) return;           // 가드② 무효 검색어 번호
  if(srHas(state,i)){                                               // 가드⑥ 이미 담은 검색어 재선택 무시
    state.srMsg='이미 조사 수첩에 적은 주제예요. 다른 주제를 골라 봐요.'; state.srWarn=true;
    playThud(); srRender(); return;
  }
  if(state.srFound) return;                                         // 찾은 뒤에는 「↩ 다른 검색어로」를 거친다
  state.srKey=i; state.srMsg=null; state.srWarn=false;
  playBlip(); srRender();
}

/* ② 찾기 — 이때 비로소 목록이 나타난다 */
function srSearch(){
  if(state.srFin!=null) return;                                     // 가드①
  if(state.srBusy) return;                                          // 가드⑧
  if(state.srKey==null) return;                                     // 가드③ 검색어를 고르기 전 「찾기」 무시(순서)
  if(state.srFound) return;
  state.srFound=true; state.srLaw=null; state.srWrongL=null; state.srWarn=false;
  state.srMsg=`「${LAW[state.srKey].key}」${srRo(LAW[state.srKey].key)} 찾았어요. 세 건 가운데 <b>알맞은 법</b>은 무엇일까요?`;
  playBlip(); srRender();
}

/* ③ 법 고르기 — 틀리면 어느 검색어에 있는지 알려 준다 */
function srPickLaw(k){
  if(state.srFin!=null) return;                                     // 가드①
  if(state.srBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>2) return;                     // 가드② 무효 법 번호
  if(!state.srFound) return;                                        // 가드④ 「찾기」 전 목록 클릭 무시(순서)
  if(state.srLaw!=null) return;
  const w = SR_RES[state.srKey][k];
  if(w===state.srKey){
    state.srLaw=w; state.srWrongL=null; state.srWarn=false;
    state.srMsg=null;
    playChime(); srRender(); return;
  }
  state.srWrongL=k; state.srWarn=true; state.srBusy=true;
  state.srMsg=`「${LAW[w].name}」은 ‘${LAW[w].key}’와 관련된 법이에요. 검색어 「${LAW[w].key}」${srRo(LAW[w].key)} 찾아보면 만날 수 있어요.`;
  playThud(); srRender();
  setTimeout(()=>{ if(state.srWrongL===k){ state.srWrongL=null; state.srBusy=false; srRender(); } else { state.srBusy=false; } },1600);
}

/* ④ 영향 고르기 — 맞히면 수첩 한 칸이 채워진다 */
function srPickEff(k){
  if(state.srFin!=null) return;                                     // 가드①
  if(state.srBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>2) return;                     // 가드② 무효 영향 번호
  if(state.srLaw==null) return;                                     // 가드⑤ 법을 고르기 전 영향 3택 무시(순서)
  const w = SR_EFF[state.srKey][k];
  if(w===state.srKey){
    state.srBook.push({key:state.srKey, law:state.srLaw});
    state.srKey=null; state.srFound=false; state.srLaw=null;
    state.srWrongE=null; state.srWarn=false;
    state.srMsg=state.srBook.length>=SR_GOAL
      ? '조사 수첩 네 칸이 모두 찼어요. 마지막 물음에 답해 봐요.'
      : '조사 수첩에 적었어요. 다른 주제도 찾아볼까요?';
    playChime(); srRender(); return;
  }
  state.srWrongE=k; state.srWarn=true; state.srBusy=true;
  state.srMsg=`그것은 「${LAW[w].name}」이 우리 생활에 주는 영향이에요. 다시 골라 봐요.`;
  playThud(); srRender();
  setTimeout(()=>{ if(state.srWrongE===k){ state.srWrongE=null; state.srBusy=false; srRender(); } else { state.srBusy=false; } },1600);
}

/* ↩ 다른 검색어로 — 찾은 결과를 버리고 검색창으로 돌아간다 */
function srBack(){
  if(state.srFin!=null) return;                                     // 가드①
  if(state.srBusy) return;                                          // 가드⑧
  state.srKey=null; state.srFound=false; state.srLaw=null;
  state.srWrongL=null; state.srWrongE=null; state.srWarn=false;
  state.srMsg='검색창을 비웠어요. 다른 주제를 골라 봐요.';
  playBlip(); srRender();
}

/* ⑤ 마무리 — 핵심 질문 */
function srFinish(k){
  if(state.srFin!=null) return;                                     // 가드①
  if(state.srBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SR_FIN.length) return;        // 가드② 무효 마무리 번호
  if(state.srBook.length < SR_GOAL) return;                          // 가드⑦ 네 칸 미완성 시 무시(순서)
  if(k===SR_FIN_OK){
    state.srFin=k; state.srWrongF=null; state.srMsg=null; state.srWarn=false;
    playChime(); srRender(); return;
  }
  state.srWrongF=k; state.srWarn=true; state.srBusy=true;
  state.srMsg = k===0
    ? '특별한 곳에만 있는 것이 아니에요. 등굣길에도, 급식실에도, 놀이터에도 법이 있었지요.'
    : '오늘 찾은 법들은 <b>지금 우리</b>의 생활을 지켜 주고 있어요.';
  playThud(); srRender();
  setTimeout(()=>{ if(state.srWrongF===k){ state.srWrongF=null; state.srMsg=null; state.srWarn=false; state.srBusy=false; srRender(); } else { state.srBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u3_l03_법의역할.html'; } // l03 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

K-edu 사회 5-1 · 3단원 법과 인권의 보장 · 주제① 법의 역할과 인권 · 5차시(l05) — **주제① 마무리 차시**
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사03-01] · 교과서 p.128~131 · 지도서(대단원3 **8차시** 법을 지키고 인권을 존중하는 태도를
길러 볼까요, 지도서 p.266~273) 근거
학습 목표: 법을 지키고 인권을 존중하는 태도를 기를 수 있다.
수업 기법 및 전략: 문제 해결하기 · 의사 결정 및 실천하기
직접조작: 캠페인 게시판(신규 패턴 — 올리고 읽는 형 / 판이 묻지 않고 내가 올린다)
  ⭐ 앞의 스물아홉 종은 전부 **판이 묻고 학생이 답했다.**
     서랍에 넣든, 검색하든, 스위치를 내리든, 소책자를 만들든 — 방향은 언제나 **판 → 학생**이었다.
     이번만 다르다. 마지막 걸음이 **답하기가 아니라 읽기**다.
     내가 만든 카드가 게시판에 올라가고, 그 아래에는 **다른 아이들이 이미 올려 둔 카드 셋**이 걸려 있다.
     나는 그 카드들을 열어 읽고 **공감(♥)을 누른다.** 셋을 다 읽어야 마무리가 열린다(가드⑦).
     왜냐하면 지도서 [친구와 활동]이 캠페인을 **올리는 데서 끝내지 않기** 때문이다 —
     “친구가 제작한 콘텐츠에 **댓글 및 공감을 표시하면서 소통**하고, 궁금한 부분은 질문하도록 지도한다.”
  ⭐ 그리고 **판이 “셋 다 맞다”고 말하는 첫 3택**이 있다.
     ③단계 「왜 그래야 할까요?」의 세 선택지는 **전부 지도서 핵심 질문 예시 답안**이다 —
     “다른 사람에게 피해를 주지 않기 위해서 / 자신과 다른 사람의 권리를 보호하기 위해서 /
     모두가 조화롭고 안정된 삶을 누리기 위해서.”
     그래서 이 자리에는 **판정이 없다.** 무엇을 고르든 그대로 내 카드에 적힌다.
     지금까지 스물아홉 종의 3택은 언제나 하나만 옳았다. 이 차시가 다루는 것이 지식이 아니라
     **태도**이기 때문에, 판이 태도의 이유를 하나로 좁히지 않는다.
  ① **상황 고르기** — 법을 어기는 상황 셋(교과서 p.128 원문).
  ② **어떻게 행동해야 할까 3택** — 그 상황에서 법을 지키는 행동(교과서 원문). **판정 있음.**
  ③ **왜 그래야 할까 3택** — **셋 다 정답**(판정 없음). 고른 것이 카드에 적힌다.
  ④ 카드가 **해시태그(#)와 함께 게시판에 올라간다.** 세 장을 다 올리면 →
  ⑤ **친구들이 올린 카드 셋 읽고 공감 누르기**(판정 없음 · 셋을 다 읽어야 마무리가 열린다).
  ⑥ 마무리 3택 — **인권을 존중해야 하는 까닭**
     = “나의 권리가 소중한 만큼 다른 사람의 권리도 소중하기 때문입니다.”(지도서 원문)
  ⚠️ 상황 셋·행동 3택·까닭 셋·친구 카드 셋은 모두 **고정 리터럴 — 난수 0**.
     행동 3택의 정답 자리는 [1,2,0]으로 세 자리에 한 번씩 온다.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 상황·행동·까닭·친구 카드·마무리 번호
     (`Number.isInteger`) / ③ 상황을 고르기 전 행동 3택 무시(순서 강제) /
     ④ **행동을 맞히기 전 까닭 3택 무시**(순서 강제) / ⑤ 이미 올린 상황 재선택 무시 /
     ⑥ 세 장을 다 올리기 전 친구 카드 읽기 무시 · 이미 읽은 카드 재클릭 무시 /
     ⑦ **친구 카드 셋을 다 읽기 전 마무리 무시**(읽어야 끝난다) /
     ⑧ 안내가 떠 있는 동안 재클릭 무시(`cpBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.cp-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
지도서 근거(8차시 p.266~273):
  [동기 유발] 법을 지킨 경험 — 자동차를 탈 때 안전띠를 착용했다 / 친구의 사진을 사회 관계망 서비스에
    게시하려고 친구의 동의를 구했다. 법을 지키지 못했거나 지키지 않는 모습을 본 경험 —
    과제에 인용한 자료의 출처를 밝히지 않은 적이 있다 / 무단 횡단을 하는 사람을 본 적이 있다.
  [학습 문제] 법을 지키고 인권을 존중하는 태도를 길러 봅시다.
  [전개 1] **법을 지키는 태도의 중요성** — 다른 사람에게 피해를 주지 않기 위해서 /
    자신과 다른 사람의 권리를 보호하기 위해서 / 모두가 조화롭고 안정된 삶을 누리기 위해서.
  [스스로 활동 p.128] 법을 어기는 상황 셋과 그 까닭·지켜야 할 행동(원문) —
    ① 인터넷에 다른 사람을 비방하는 글을 올림 → 다른 사람의 명예를 훼손하는 것이기 때문 →
       인터넷에서 바르고 고운 말을 사용한다.
    ② 보행 신호를 지키지 않고 횡단보도를 건넘 → 본인뿐만 아니라 다른 사람의 안전도 위협할 수 있기
       때문 → 횡단보도에서는 보행 신호에 따라 파란불이 켜지면 건넌다.
    ③ 친구의 사진을 허락 없이 공유함 → 초상권을 침해하는 것이기 때문 →
       사회 관계망 서비스에 올릴 때에는 먼저 친구의 허락을 받는다.
  [스스로 활동 p.129] **인권을 존중하는 태도** 점검하기 — 인권을 존중해야 하는 까닭 =
    인권은 모두가 누려야 할 권리이기 때문 / **나의 권리가 소중한 만큼 다른 사람의 권리도 소중하기 때문.**
    느낀 점 = 나의 권리는 잘 누리고 있는데 친구의 권리를 존중하지 못한 경우가 있었다 /
    나와 생각이 다른 친구의 말도 잘 들어 줘야겠다는 생각이 들었다.
    ⚠️ 지도 꿀 Tip: “‘예’, ‘아니오’를 **몇 가지 체크했는지 여부에 중점을 두지 않도록** 한다.
    잘 지키지 못하고 있는 부분에 대해 서로 의견을 공유하고, 잘 지킬 수 있는 방안을 함께 생각해 본다.”
  [친구와 활동 p.130] **캠페인 활동** — 캠페인의 목적 = 사람들에게 무언가에 대한 중요성을 알리고
    함께 참여하도록 하기 위해서. 온라인 게시판을 선택 → 콘텐츠 제작 → **해시태그(#)**를 붙여 올림 →
    친구가 만든 콘텐츠에 **댓글 및 공감**을 표시하며 소통.
    실천 의지 다짐(원문 3종) = 법을 잘 지켜야 다른 사람에게 피해를 주지 않고 우리 모두의 안전을 보호할
    수 있습니다. 저는 신호등의 신호를 잘 지켜 횡단보도를 건너겠습니다. /
    다른 사람의 권리를 보호하는 것이 자기의 권리를 보호하는 것입니다. 저는 친구의 생각이 내 생각과
    달라도 이야기를 잘 들어 주고 존중하겠습니다. /
    나의 권리가 소중한 만큼 다른 사람의 권리도 소중합니다. 저는 친구가 싫어하는 별명을 부르지 않겠습니다.
  [재미있게 확인해요 p.131] 주제에서 공부한 내용을 문제로 풀어 **책의 위치 정보(239바98)**를 모으고
    책의 제목 **「우리 생활 속 법」**을 맞히는 활동.
    ⚠️ 문제 낱말 조각은 교과서 축쇄본이 깨져 원문을 복원할 수 없으므로 **재현하지 않는다**(정직 원칙).
    활동의 형식과 지도서가 명시한 정답(위치 정보·책 제목)만 소개한다.
  [얼마나 잘했을까] 주제① 자기 평가 — **지식·이해 / 과정·기능 / 가치·태도** 세 영역.
  [8차시 주요 내용 정리] 1. 법을 지키는 태도의 중요성 ① 나와 다른 사람의 권리를 보호할 수 있음
    ② 모두가 조화롭고 안정된 삶을 누릴 수 있음. 2. 인권을 존중하는 태도 = 나의 권리가 소중한 만큼
    다른 사람의 권리도 소중하게 여겨야 함.
  [정리] 차시 예고 = 일상생활에서 인권이 침해되는 사례 살펴보기(주제②).
⚠️ 설계 원칙:
  · **주제②(인권이 침해되는 사례·인권 보호 활동·구제 기관) 선행 침범 0** —
    ‘인권이 침해되는 사례’는 **차시 예고 두 자리에서만** 다음 차시 이름으로 등장한다.
    ⚠️ ‘초상권을 침해’는 8차시 [스스로 활동] 원문이라 그 자리에서만 쓴다.
  · **기본권 다섯의 학술 용어 0**(l04 규약 승계) · 세계 인권 선언·인권의 세대별 권리 0.
  · 교사용 자료 0 — 과정 중심 평가 채점 기준·평가 결과 피드백·핵심 역량표·참고 도서 0.

    **문항 내 연도·금액·비율 0**(책의 위치 정보 239바98은 지도서 정답 원문이라 슬라이드 한 자리에만).

.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#EDE9FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#581C87;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#FBF7FF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}
.check .tagx{flex-shrink:0;background:var(--bub);color:var(--green-d);border-radius:6px;padding:2px 7px;
  font-size:clamp(10.5px,1.8vw,12.5px);font-weight:800}

/* 직접조작 — 캠페인 게시판(올리고 읽는 형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.cp-q{background:var(--bub);border-radius:9px;padding:6px 10px;font-size:clamp(11px,1.86vw,13.2px);
  font-weight:800;color:var(--green-d);line-height:1.45}
.cp-free{background:#ECFDF5;border:2px solid #A7F3D0;border-radius:9px;padding:5px 9px;
  font-size:clamp(10px,1.7vw,12px);font-weight:700;color:#065F46;line-height:1.4}
.cp-list{display:flex;flex-direction:column;gap:4px;max-height:172px;overflow-y:auto}
.cp-list button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10px,1.7vw,12.2px);transition:.15s;
  line-height:1.35;text-align:left}
.cp-list button:hover{border-color:var(--green);background:var(--bub)}
.cp-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.cp-list button.read{border-color:var(--green);background:var(--bub);color:var(--green-d);cursor:default}
.cp-list button .hh{display:block;font-weight:800;color:var(--green-d)}
.cp-fin{display:flex;flex-direction:column;gap:5px}
.cp-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.2px,1.74vw,12.6px);text-align:left;line-height:1.4}
.cp-fin button:hover{background:var(--bub)}
.cp-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.cp-back{border:2px solid #CBD5E0;background:#fff;color:#475569;border-radius:10px;padding:6px 8px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10px,1.7vw,12.2px)}
.cp-back:hover{border-color:var(--green);color:var(--green-d)}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* 문구를 칸 폭에 맞춰 도막으로 나눈다(좌표 리터럴이라 jsdom은 폭을 못 본다) */
function cpWrap(s,n,max){
  const w=s.split(' '); const out=[]; let cur='';
  for(const t of w){ if((cur+' '+t).trim().length>n && cur){ out.push(cur); cur=t; } else { cur=(cur?cur+' ':'')+t; } }
  if(cur) out.push(cur);
  return out.slice(0,max||3);
}
function cpPosted(st,i){ return st.cpBoard.some(b=>b.sit===i); }

/* 판 — 위: 만들고 있는 카드 · 아래: 캠페인 게시판(내 카드 셋 + 친구 카드 셋) */
function cpCanvas(st){
  const p=st.cpPick;
  let g='';
  // 만들고 있는 카드
  g+=`<rect x="12" y="8" width="296" height="104" rx="12" fill="#FAF5FF" stroke="#7E22CE" stroke-width="2.2"/>`;
  g+=`<text x="24" y="26" font-size="8.6" fill="#8A6D3B" font-weight="800">내가 만드는 캠페인 카드</text>`;
  if(p==null){
    g+=`<rect x="22" y="34" width="276" height="66" rx="8" fill="#fff" stroke="#C4B5FD" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    g+=`<text x="160" y="72" font-size="9" fill="#B9A7D6" text-anchor="middle">상황을 하나 골라 봐요</text>`;
  } else {
    const S=SIT[p];
    g+=`<rect x="22" y="34" width="276" height="66" rx="8" fill="#fff" stroke="#7E22CE" stroke-width="1.6"/>`;
    cpWrap(S.t,40,1).forEach(ln=>{ g+=`<text x="30" y="48" font-size="7.4" fill="#64748B">${ln}</text>`; });
    if(st.cpAct==null){
      g+=`<text x="30" y="66" font-size="7.6" fill="#C7B893">→ 어떻게 행동할지 아직 정하지 않았어요</text>`;
    } else {
      cpWrap('→ '+S.act,40,1).forEach(ln=>{ g+=`<text x="30" y="66" font-size="7.6" fill="#581C87" font-weight="800">${ln}</text>`; });
    }
    if(st.cpWhy==null){
      g+=`<text x="30" y="82" font-size="7.2" fill="#C7B893">왜 그래야 할까요?</text>`;
    } else {
      cpWrap(WHYS[st.cpWhy],44,1).forEach(ln=>{ g+=`<text x="30" y="82" font-size="7" fill="#475569">${ln}</text>`; });
    }
    g+=`<rect x="30" y="88" width="${Math.min(S.tag.length*5.6+10,180)}" height="10" rx="5" fill="#F3E8FF"/>`;
    g+=`<text x="35" y="96" font-size="6.6" fill="#581C87" font-weight="800">${S.tag}</text>`;
  }
  // 게시판
  g+=`<rect x="12" y="120" width="296" height="122" rx="12" fill="#F8FAFC" stroke="#7E22CE" stroke-width="2"/>`;
  g+=`<text x="160" y="136" font-size="9.8" fill="#581C87" text-anchor="middle" font-weight="800">📌 캠페인 게시판 — 내가 올린 카드 ${st.cpBoard.length} / ${CP_GOAL}</text>`;
  for(let k=0;k<CP_GOAL;k++){
    const x=20+k*96, b=st.cpBoard[k];
    if(b==null){
      g+=`<rect x="${x}" y="142" width="88" height="44" rx="7" fill="#fff" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="4 3"/>`;
      g+=`<text x="${x+44}" y="168" font-size="7.4" fill="#C7CBD3" text-anchor="middle">빈 자리</text>`;
    } else {
      const S=SIT[b.sit];
      g+=`<rect x="${x}" y="142" width="88" height="44" rx="7" fill="#FAF5FF" stroke="#7E22CE" stroke-width="1.6"/>`;
      g+=`<text x="${x+44}" y="154" font-size="6.4" fill="#581C87" text-anchor="middle" font-weight="800">${S.tag}</text>`;
      cpWrap(S.act,15,2).forEach((ln,j)=>{
        g+=`<text x="${x+44}" y="${165+j*9}" font-size="6" fill="#475569" text-anchor="middle">${ln}</text>`; });
      g+=`<text x="${x+44}" y="183" font-size="6" fill="#7E22CE" text-anchor="middle" font-weight="800">♥ 올림</text>`;
    }
  }
  g+=`<text x="160" y="200" font-size="8.6" fill="#8A6D3B" text-anchor="middle" font-weight="800">친구들이 올린 카드</text>`;
  for(let k=0;k<FRIEND.length;k++){
    const x=20+k*96, read=st.cpRead.indexOf(k)>=0;

  }
  return `<svg viewBox="0 0 320 250"><rect width="320" height="250" fill="#ffffff"/>${g}</svg>`;
}

function cpPanel(st){
  if(!st.cpBoard) st.cpBoard=[];
  const done = st.cpFin!=null;
  const full = st.cpBoard.length>=CP_GOAL;
  const readAll = st.cpRead.length>=FRIEND.length;
  let right='';
  right+=`<div class="dw-step">📌 올린 카드 ${st.cpBoard.length} / ${CP_GOAL} · 읽은 카드 ${st.cpRead.length} / ${FRIEND.length}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">📌 캠페인을 마쳤어요</div>
      <div>내가 올린 카드도, 친구들이 올린 카드도 모두 같은 말을 하고 있었어요 —
      <b>법을 지키는 것은 나와 우리 모두의 권리를 보호하는 일</b>이라는 것.</div>
      <div style="margin-top:5px;color:#64748B">그리고 <b>나의 권리가 소중한 만큼 다른 사람의 권리도 소중해요.</b></div></div>`;
  } else if(full && readAll){
    right+=`<div class="cp-q">인권을 존중해야 하는 까닭은 무엇일까요?</div>`;
    right+=`<div class="cp-fin">${CP_FIN.map((f,k)=>
      `<button class="${st.cpWrongF===k?'no':''}" onclick="cpFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(full){
    right+=`<div class="cp-q">친구들이 올린 카드를 읽고 공감을 눌러 봐요.</div>`;
    right+=`<div class="cp-list">${FRIEND.map((f,k)=>{
      const read=st.cpRead.indexOf(k)>=0;
      return `<button class="${read?'read':''}" onclick="cpReadCard(${k})"><span class="hh">${read?'♥':'♡'} ${f.who} ${f.tag}</span>${f.t}</button>`;
    }).join('')}</div>`;
  } else if(st.cpPick==null){
    right+=`<div class="cp-q">캠페인 카드로 만들 상황을 골라 봐요.</div>`;
    const rest=[];
    for(let i=0;i<SIT.length;i++) if(!cpPosted(st,i)) rest.push(i);
    right+=`<div class="cp-list">${rest.map(i=>
      `<button onclick="cpPickSit(${i})">${SIT[i].t}</button>`).join('')}</div>`;
  } else if(st.cpAct==null){
    right+=`<div class="cp-q">이 상황에서 <b>법을 지키려면</b> 어떻게 행동해야 할까요?</div>`;
    right+=`<div class="cp-list">${ACT_OPT[st.cpPick].map((a,k)=>
      `<button class="${st.cpWrongA===k?'no':''}" onclick="cpPickAct(${k})">${SIT[a].act}</button>`).join('')}</div>`;
    right+=`<button class="cp-back" onclick="cpBack()">↩ 다른 상황으로</button>`;
  } else {
    right+=`<div class="cp-q">왜 그래야 할까요? 카드에 적을 말을 골라요.</div>`;
    right+=`<div class="cp-free">이 물음에는 <b>정답이 하나가 아니에요.</b> 셋 다 맞는 말이니 마음에 드는 것을 골라요.</div>`;
    right+=`<div class="cp-fin">${WHYS.map((wy,k)=>
      `<button onclick="cpPickWhy(${k})">${wy}</button>`).join('')}</div>`;
  }
  if(st.cpMsg) right+=`<div class="dw-msg${st.cpWarn?' warn':''}">${st.cpMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">📌 캠페인 카드를 만들어 올리고, 친구들의 카드를 읽어 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${cpCanvas(st)}<div class="cvcap">게시판에는 친구들이 올린 카드도 함께 걸려 있어요</div></div>
      <div class="dw-right">${right}</div>
    </div>

    <div class="note">다음은 <b style="color:var(--amber)">일상생활에서 인권이 침해되는 사례</b>!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,area,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span class="tagx">${area}</span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l05";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  cpPick:null, cpAct:null, cpWhy:null, cpBoard:[], cpRead:[], cpFin:null,
  cpWrongA:null, cpWrongF:null, cpMsg:null, cpWarn:false, cpBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function cpRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 상황 고르기 */
function cpPickSit(i){
  if(state.cpFin!=null) return;                                     // 가드① 확정 후 전체 잠금
  if(state.cpBusy) return;                                          // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(i) || i<0 || i>=SIT.length) return;           // 가드② 무효 상황 번호
  if(cpPosted(state,i)){                                            // 가드⑤ 이미 올린 상황 재선택 무시
    state.cpMsg='이미 게시판에 올린 상황이에요. 다른 상황을 골라 봐요.'; state.cpWarn=true;
    playThud(); cpRender(); return;
  }
  if(state.cpPick!=null) return;                                    // 바꾸려면 「↩ 다른 상황으로」
  state.cpPick=i; state.cpAct=null; state.cpWhy=null; state.cpWrongA=null;
  state.cpMsg=null; state.cpWarn=false;
  playBlip(); cpRender();
}

/* ② 법을 지키는 행동 3택 — 판정 있음 */
function cpPickAct(k){
  if(state.cpFin!=null) return;                                     // 가드①
  if(state.cpBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>2) return;                     // 가드② 무효 행동 번호
  if(state.cpPick==null) return;                                    // 가드③ 상황을 고르기 전 무시(순서)
  if(state.cpAct!=null) return;
  const a = ACT_OPT[state.cpPick][k];
  if(a===state.cpPick){
    state.cpAct=a; state.cpWrongA=null; state.cpWarn=false;
    state.cpMsg='카드에 적었어요. 이제 <b>왜 그래야 하는지</b>도 적어 볼까요?';
    playChime(); cpRender(); return;
  }
  state.cpWrongA=k; state.cpWarn=true; state.cpBusy=true;
  state.cpMsg=`그것은 <b>「${SIT[a].n}」</b> 상황에서 지켜야 할 행동이에요. 지금 고른 상황을 다시 읽어 봐요.`;
  playThud(); cpRender();
  setTimeout(()=>{ if(state.cpWrongA===k){ state.cpWrongA=null; state.cpBusy=false; cpRender(); } else { state.cpBusy=false; } },1600);
}

/* ③ 왜 그래야 할까 — ⭐ 셋 다 정답이라 판정이 없다 */
function cpPickWhy(k){
  if(state.cpFin!=null) return;                                     // 가드①
  if(state.cpBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=WHYS.length) return;          // 가드② 무효 까닭 번호
  if(state.cpPick==null) return;
  if(state.cpAct==null) return;                                     // 가드④ 행동을 맞히기 전 무시(순서)
  state.cpWhy=k;
  state.cpBoard.push({sit:state.cpPick, why:k});
  const n=state.cpBoard.length;
  state.cpPick=null; state.cpAct=null; state.cpWhy=null; state.cpWrongA=null;
  state.cpWarn=false;
  state.cpMsg = n>=CP_GOAL
    ? `카드를 올렸어요. 세 장을 모두 올렸으니 이제 <b>친구들이 올린 카드</b>를 읽어 봐요.`
    : `카드를 올렸어요. 다른 상황도 만들어 볼까요?`;
  playChime(); cpRender();
}

/* ↩ 다른 상황으로 */
function cpBack(){
  if(state.cpFin!=null) return;                                     // 가드①
  if(state.cpBusy) return;                                          // 가드⑧
  state.cpPick=null; state.cpAct=null; state.cpWhy=null; state.cpWrongA=null; state.cpWarn=false;
  state.cpMsg='만들던 카드를 비웠어요. 다른 상황을 골라 봐요.';
  playBlip(); cpRender();
}

/* ⑤ 친구 카드 읽고 공감 누르기 — 판정 없음 */
function cpReadCard(k){
  if(state.cpFin!=null) return;                                     // 가드①
  if(state.cpBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=FRIEND.length) return;        // 가드② 무효 친구 카드 번호
  if(state.cpBoard.length < CP_GOAL) return;                         // 가드⑥ 세 장 전 읽기 무시
  if(state.cpRead.indexOf(k)>=0) return;                             // 가드⑥ 이미 읽은 카드 재클릭 무시
  state.cpRead.push(k);
  state.cpMsg = state.cpRead.length>=FRIEND.length
    ? '친구들의 카드를 모두 읽었어요. 마지막 물음에 답해 봐요.'
    : `${FRIEND[k].who}의 카드에 공감을 남겼어요.`;
  state.cpWarn=false; playChime(); cpRender();
}

/* ⑥ 마무리 — 인권을 존중해야 하는 까닭 */
function cpFinish(k){
  if(state.cpFin!=null) return;                                     // 가드①
  if(state.cpBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=CP_FIN.length) return;        // 가드② 무효 마무리 번호
  if(state.cpBoard.length < CP_GOAL) return;                         // 세 장 미완성
  if(state.cpRead.length < FRIEND.length) return;                    // 가드⑦ 친구 카드를 다 읽기 전 무시
  if(k===CP_FIN_OK){
    state.cpFin=k; state.cpWrongF=null; state.cpMsg=null; state.cpWarn=false;
    playChime(); cpRender(); return;
  }
  state.cpWrongF=k; state.cpWarn=true; state.cpBusy=true;
  state.cpMsg = k===1
    ? '내 권리만 지키면 친구의 권리는 누가 지켜 줄까요? <b>인권은 모두가 누려야 할 권리</b>예요.'
    : '점검표는 <b>개수를 세는 것이 목적이 아니에요.</b> 잘 지키지 못한 부분을 함께 이야기하는 것이 중요해요.';
  playThud(); cpRender();
  setTimeout(()=>{ if(state.cpWrongF===k){ state.cpWrongF=null; state.cpMsg=null; state.cpWarn=false; state.cpBusy=false; cpRender(); } else { state.cpBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u3_l06_인권침해사례.html'; } // 주제② l06 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

K-edu 사회 5-1 · 3단원 법과 인권의 보장 · 주제② 일상생활 속 인권 보호 · 8차시(l08)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사03-02] · 교과서 p.139~143 · 지도서(대단원3 **12~13차시** 우리 사회의 인권 보호 노력을
알아볼까요, 지도서 p.297~305) 근거
학습 목표: 우리 사회의 인권 보호 노력을 설명할 수 있다.
수업 기법 및 전략: 짝 토의 · 학교 시설 답사하기
직접조작: 학교 답사 수첩(신규 패턴 — 돌아다니기형 / 판이 한 번에 한 곳만 보여 준다)
  ⭐ 앞의 서른두 종은 전부 **판이 전체를 한 화면에 펼쳐 놓았다.** 토의 종이 여덟 장이든, 동네 아홉 칸이든,
     소책자 다섯 면이든, 무엇이 있는지는 언제나 처음부터 다 보였고 학생은 그 안에서 **고르기만** 했다.
     이번만 **판이 한 번에 한 곳만 보여 준다.** 학교에는 다섯 곳(교문 앞·주차장·현관·복도·계단)이 있고,
     **지금 서 있는 곳에 있는 것만 찾을 수 있다.** 계단 점자 블록은 계단에 가야 보이고,
     옐로 카펫은 교문 앞으로 나가야 보인다. **걸어서 옮겨 다니는 것 자체가 조작의 한 걸음이다** —
     지도서 [친구와 활동]이 "학교 현관부터 복도, 계단, 교실 등 학교 구석구석을 **돌아다니며**
     인권 보호 시설을 찾아봐요"라고 하기 때문이다(지도 꿀 Tip "우리 학교의 교문 주변부터 복도, 계단,
     교실 등을 살펴보며").
  ⭐ **찾기만 해서는 수첩이 채워지지 않는다.** 교과서 활동지가 「시설이나 물건 / 쓰임새」 두 칸이므로,
     시설을 찾은 뒤 **쓰임새 3택**을 이어야 한 줄이 적힌다. 오답 안내는 **주인 자리를 짚어 준다**
     ("그것은 「○○」의 쓰임새예요" — l06 규약 승계).
  ⭐ **수첩의 마지막 칸만은 학교에 없는 것을 적는다** — [스스로 활동]의 "인권 보호를 위해 제안하고
     싶은 시설 및 물건과 그 까닭". 방금 찾은 여섯 가지 가운데 하나를 제안란에 넣으려 하면
     판이 받지 않고 **어디에서 찾았는지를 말해 준다.** 옳고 그름이 아니라 **제안의 규칙**이다(가드⑦).
  ① **곳 옮기기**(다섯 곳 · 순서 자유) → ② **그곳의 시설 찾기**(지금 있는 곳의 것만)
  → ③ **쓰임새 3택**(지도서 원문 · 정답 자리 [1,2,0,2,0,1]) → 여섯 줄이 채워지면
  → ④ **제안 한 줄**(학교에 아직 없는 것) → ⑤ 마무리 3택 = 이 조작에서 옳고 그름이 있는 단 하나.
  ⚠️ 다섯 곳·여섯 시설·쓰임새 후보 세 벌 전량 **고정 리터럴 — 난수 0**.
     자리 i의 정답 쓰임새도 i(판정이 한 줄로 검증된다) · 후보 여섯 벌이 서로 모두 다름.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 곳·시설·쓰임새·제안·마무리 번호(`Number.isInteger`) /
     ③ **지금 있는 곳에 없는 시설 찾기 무시**(이 패턴의 핵심) / ④ 시설을 고르기 전 쓰임새 3택 무시(순서) /
     ⑤ **쓰임새 3택이 열려 있는 동안 다른 곳 이동 무시** / ⑥ 이미 찾은 시설 재선택 무시 /
     ⑦ 여섯 가지 전 제안 무시 · 제안 전 마무리 무시(순서) · **이미 찾은 것 제안 무시**(제안의 규칙) /
     ⑧ 안내가 떠 있는 동안 재클릭 무시(`spBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.sp-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
지도서 근거(12~13차시 p.297~305):
  [동기 유발] 우리 사회에서 사회적으로 보호가 필요한 사람들 = **어린이나 노인, 임산부 등.**
  [스스로 활동 p.139] 배려하기 위한 시설이나 물건 — 어린이 = **어린이 전용 세면대**,
    노인 = 도서관의 **큰 글자 도서**, 임산부 = 버스나 지하철의 **임산부 배려석.**
    · 제안하고 싶은 것과 까닭(예시 답안) = **휠체어 맞춤 놀이터**(장애가 있는 어린이도 비장애 어린이와
      마찬가지로 신나게 놀 수 있는 권리가 있기 때문) / **어린이 전용 화장실**(어린이는 어른보다 몸이
      작아서 일반 화장실을 사용하는 데 어려움이 있기 때문).
  [교과서 p.140] 학교의 인권 보호 시설 여섯 — 장애인 전용 화장실 · 장애인 전용 주차 구역 · 경사로 ·
    계단 점자 블록 · 복도 안전 손잡이 · 옐로 카펫. 쓰임새는 지도서 p.298 원문 여섯 줄을 그대로 쓴다.
  [친구와 활동 p.141] 학교에 있는 인권 보호 시설이나 물건을 찾아 **쓰임새 쓰기**.
    활동지 예시 행 = **음성 지원 학교 안내판** / 시각 장애인이 학교의 주요 시설을 알 수 있도록 음성으로 안내.
  [핵심 질문] 시설 외의 학교의 노력 = **인권 교육**(인권을 존중하고 더불어 살아갈 수 있도록) /
    **선생님과 학생, 학부모가 함께 인권 보호를 위한 규칙 만들기.**
    그 결과 = 학교에서 **모두가 안전하게 생활하며 평등하게 교육을 받을 수 있다.**
    우리 학교 규칙 예 = 학급 회의를 열어 모두 함께 의견 나누기 / 운동장 사용 시간을 학년별로 정해
    모두가 안전하고 공평하게 사용하기.
  [교과서 p.142] 국가의 인권 보호 노력 넷 — 법과 제도 마련 / **사회 보장 제도 시행** /
    **공공 편의 시설 설치** / **인권 교육 지원·인권 캠페인 활동.**
    · **사회 보장 제도** = 질병, 실업, 장애, 노령, 빈곤 등으로 어려움에 처한 사람들을 돕고,
      모든 국민의 인간다운 생활을 보장하기 위한 제도.
    · 국가 인권 위원회 = 국민의 인권 의식 향상을 위해 다양한 인권 교육을 지원하고,
      국가나 개인에 의한 인권 침해 사례를 조사하고 인권이 침해된 사람을 도우며,
      인권 보호를 위한 정책을 제안하고 검토하기도 한다.
    · 인권 교육이 중요한 까닭 = 나의 인권이 소중한 만큼 다른 사람의 인권도 소중하다는 것을
      아는 것이 중요하기 때문 / 인권 교육을 통해 인권 의식이 향상될 수 있기 때문.
  [풍덩 사회 속으로 p.143] **무장애 통합 놀이터** — 어린이는 마음껏 뛰어놀 수 있는 권리가 있지만
    몸이 불편한 장애가 있는 어린이가 즐겁게 놀 수 있는 놀이터는 많지 않았다. 오늘날에는 장애와 상관없이
    모든 어린이가 함께 어울려 놀 수 있는 무장애 통합 놀이터가 생겨나고 있다.
    · 등받이가 있어서 안전하게 그네를 탈 수 있다 / 휠체어나 유아차를 탄 어린이도 이용할 수 있는
      놀이기구가 있다 / 휠체어나 유아차를 탄 어린이가 안전하게 이동할 수 있는 경사로가 있다.
  [꼭 기억해요] ① 어린이는 학교에서만 인권을 보호받을 수 있다(×) ② 국가는 사회 구성원의 인권 보호를
    위한 **사회 보장** 제도를 마련한다.
  [정리] 차시 예고 = 생활 속에서 인권 보호 실천하기.
⚠️ 설계 원칙:
  · **14~15차시(생활 속 인권 보호 실천) 침범 0** — 실천 계획·실천물 만들기·인권 표어 만들기·
    사진 촬영·영상 편집 0. 「실천」은 **차시 예고 두 자리에서만**(스모크가 개수 대조).
    ⚠️ 지도서 활동지(p.304 우리 반 인권 표어 만들기)는 만들기 활동이므로 이 차시 조작에 넣지 않는다.
  · **16~17차시(생각을 펼쳐요·단원 마무리) 침범 0.**
  · **9~11차시는 회수만** — 인권 침해 사례·해결 방법 토의는 도입과 정리에서 낱말로만 되짚고
    다시 가르치지 않는다. 별표 배분·토의 종이·국회 도서관 0.
  · **교사용 참고 자료 0** — 배리어 프리 용어, 국가 인권 위원회의 조직·업무 넷·「국가 인권 위원회법」·
    국제 인권 조약·헌법 조항 번호, 인권 교육의 방법 세 분류와 권리·책임, 인권 보호 단체(언론 인권 센터·
    한국 인권 재단·인권 연대), 옐로 카펫의 태양광 램프·알루미늄 스티커·감속 비율·도로 교통 공단,
    통합 놀이터 집계 수치·비율·무장애 연대·참고 도서 0.
  · **학생 이름 0 · 우리나라 지역 이름 0 · 기관 인용 이름 0 · 본문·문항 연도·금액·비율 0.**
  · **기본권 학술 용어 0**(주제① 규약 승계) · 세계 인권 선언·인권의 세대별 권리 0.
  · 국가 인권 위원회는 **이 차시 교과서 원문의 하는 일 세 가지**까지만 쓰고 진정 절차·구제 기관 설명은
    하지 않는다(l07에서 미룬 몫이 여기까지다).
  · 정서 — 학교를 모자란 곳으로 그리지 않는다. 여섯 가지를 모두 찾을 수 있게 두고, 마지막 제안은
    부족해서가 아니라 **더 나아지기 위해** 적는 것으로 쓴다. 장애가 있는 어린이를 안쓰러운 대상으로
    그리지 않고 **함께 놀 권리**를 가진 사람으로 쓴다.
  · 3단원 색 **#7E22CE(보라)** — CSS 변수값만 바꾸고 변수명은 그대로 두어 엔진 코드를 무수정 승계한다.

.tipbox b{color:#1D4ED8}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#EDE9FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#581C87;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#FBF7FF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}
.check .tagx{flex-shrink:0;background:var(--bub);color:var(--green-d);border-radius:6px;padding:2px 7px;
  font-size:clamp(10.5px,1.8vw,12.5px);font-weight:800}

/* 직접조작 — 학교 답사 수첩(돌아다니기형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-canvas .place{cursor:pointer}
.dw-canvas .fac{cursor:pointer}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.sp-q{background:var(--bub);border-radius:9px;padding:6px 10px;font-size:clamp(11px,1.86vw,13.2px);
  font-weight:800;color:var(--green-d);line-height:1.45}
.sp-list{display:flex;flex-direction:column;gap:4px;max-height:174px;overflow-y:auto}
.sp-list button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10px,1.7vw,12.2px);transition:.15s;
  line-height:1.35;text-align:left}
.sp-list button:hover{border-color:var(--green);background:var(--bub)}
.sp-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.sp-note{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:7px 9px;
  font-size:clamp(10.2px,1.74vw,12.4px);line-height:1.45;color:#3F3A2C;max-height:132px;overflow-y:auto}
.sp-note .sh{font-weight:800;color:#8A6D3B;display:block;margin-bottom:3px}
.sp-note div.row{border-top:1px dashed #E7D9A8;padding-top:3px;margin-top:3px}
.sp-note div.row b{color:#8A6D3B}
.sp-fin{display:flex;flex-direction:column;gap:5px}
.sp-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.2px,1.74vw,12.6px);text-align:left;line-height:1.4}
.sp-fin button:hover{background:var(--bub)}
.sp-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper-note{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper-note .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ===== 직접조작 — 학교 답사 수첩(신규 패턴 — 돌아다니기형) =====
   SP_PLACE = 다섯 곳 고정 리터럴. SP_FAC = 여섯 시설 고정 리터럴(난수 0) — 교과서 p.140 여섯 종.
   `p` = 그 시설이 있는 곳. ⭐ **판은 지금 서 있는 곳의 시설만 보여 준다.**
   SP_OPT = 쓰임새 후보 세 벌 — ⭐ 자리 i의 정답 쓰임새도 i(판정이 한 줄로 검증된다).
   SP_SUG = 마지막 칸 후보 — `have`가 있는 것은 이미 학교에서 찾은 것이므로 제안이 되지 않는다(가드⑦). */
const SP_PLACE = ['교문 앞','주차장','현관','복도','계단'];
const SP_FAC = [
  {s:'장애인 전용 화장실', p:3, u:'장애가 있는 사람이 편리하게 이용할 수 있도록 변기 옆에 안전 손잡이 등이 마련됐어요.'},

  {s:'옐로 카펫', p:0, u:'어린이 교통사고를 예방하기 위해 횡단보도 진입로의 바닥과 벽면을 노랗게 칠해 만든 교통 안전시설이에요.'}
];
const SP_OPT = [[2,0,3],[4,5,1],[2,5,1],[0,4,3],[4,0,2],[3,5,2]];   // 정답 자리 [1,2,0,2,0,1]
const SP_SUG = [
  {s:'휠체어 맞춤 놀이터', have:null, why:'장애가 있는 어린이도 비장애 어린이와 마찬가지로 신나게 놀 수 있는 권리가 있기 때문이에요.'},
  {s:'경사로', have:2, why:null},
  {s:'어린이 전용 화장실', have:null, why:'어린이는 어른보다 몸이 작아서 일반 화장실을 사용하는 데 어려움이 있기 때문이에요.'},
  {s:'옐로 카펫', have:5, why:null},
  {s:'계단 점자 블록', have:3, why:null}
];
const SP_FIN = [
  '인권 보호 시설은 현관 한곳에 모여 있었어요.',
  '학교 구석구석에 나뉘어 있어서, 돌아다니며 살펴봐야 모두 찾을 수 있었어요.',
  '인권 보호 시설은 어린이만을 위해 마련한 것이에요.'
];
const SP_FIN_OK = 1;

function spFound(st,i){ return st.spFound.indexOf(i)>=0; }
function spHere(st){ return SP_FAC.map((f,i)=>i).filter(i=>SP_FAC[i].p===st.spAt); }
function spDoneAll(st){ return st.spFound.length>=SP_FAC.length; }
function spOwnerOf(k){ return SP_FAC[k].s; }

/* 판 — 위쪽 = 학교 지도(다섯 곳), 아래쪽 = **지금 있는 곳에 있는 것만**. */
function spCanvas(st){
  let g='';
  g+=`<text x="160" y="14" font-size="9.2" fill="#581C87" text-anchor="middle" font-weight="800">🏫 학교를 돌아다니며 찾아요 — 수첩 ${st.spFound.length} / ${SP_FAC.length}</text>`;
  for(let p=0;p<SP_PLACE.length;p++){
    const x=6+p*63, here=(p===st.spAt);
    const got=SP_FAC.map((f,i)=>i).filter(i=>SP_FAC[i].p===p && spFound(st,i)).length;
    g+=`<g class="place" onclick="spGo(${p})">`;
    g+=`<rect x="${x}" y="22" width="56" height="34" rx="8" fill="${here?'#F3E8FF':'#fff'}" stroke="${here?'#7E22CE':'#CBD5E0'}" stroke-width="${here?2.2:1.4}"/>`;
    g+=`<text x="${x+28}" y="40" font-size="8" fill="${here?'#581C87':'#475569'}" text-anchor="middle" font-weight="800">${SP_PLACE[p]}</text>`;
    g+=`<text x="${x+28}" y="51" font-size="7" fill="${got?'#B45309':'#94A3B8'}" text-anchor="middle" font-weight="700">${got?'✓ '+got:'· · ·'}</text>`;
    g+=`</g>`;
    if(p<SP_PLACE.length-1) g+=`<path d="M${x+56} 39 L${x+63} 39" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="2 2"/>`;
  }
  g+=`<text x="160" y="72" font-size="9" fill="#7E22CE" text-anchor="middle" font-weight="800">지금 있는 곳 — 「${SP_PLACE[st.spAt]}」</text>`;

  if(spDoneAll(st)){
    g+=`<rect x="8" y="80" width="304" height="58" rx="10" fill="#FFFDF5" stroke="#E7D9A8" stroke-width="1.8" stroke-dasharray="5 3"/>`;
    if(st.spSug!=null){
      g+=`<text x="160" y="103" font-size="8.6" fill="#8A6D3B" text-anchor="middle" font-weight="800">마지막 칸 — 「${SP_SUG[st.spSug].s}」</text>`;
      g+=`<text x="160" y="120" font-size="7.6" fill="#8A6D3B" text-anchor="middle" font-weight="700">우리 학교에 아직 없어서 제안한 것이에요</text>`;
    } else {
      g+=`<text x="160" y="103" font-size="8.6" fill="#8A6D3B" text-anchor="middle" font-weight="800">여섯 칸을 다 채웠어요 — 마지막 칸이 남았어요</text>`;
      g+=`<text x="160" y="120" font-size="7.6" fill="#8A6D3B" text-anchor="middle" font-weight="700">우리 학교에 아직 없어서 제안하고 싶은 것을 골라요</text>`;
    }
  } else {
    const here=spHere(st);
    const n=here.length;
    for(let j=0;j<n;j++){
      const i=here[j];
      const x=(n===1)?86:(8+j*156), got=spFound(st,i), open=(st.spOpen===i);
      g+=`<g class="fac" onclick="spFind(${i})">`;
      g+=`<rect x="${x}" y="80" width="148" height="58" rx="9" fill="${got?'#F1F5F9':(open?'#FFF8E1':'#fff')}" stroke="${got?'#94A3B8':(open?'#B45309':'#7E22CE')}" stroke-width="${open?2.2:1.6}"/>`;
      g+=`<text x="${x+74}" y="104" font-size="8.4" fill="${got?'#64748B':'#334155'}" text-anchor="middle" font-weight="800">${SP_FAC[i].s}</text>`;
      g+=`<text x="${x+74}" y="122" font-size="7.4" fill="${got?'#64748B':'#7E22CE'}" text-anchor="middle" font-weight="700">${got?'✓ 수첩에 적었어요':(open?'쓰임새를 골라요':'눌러서 살펴봐요')}</text>`;
      g+=`</g>`;
    }
    if(n===0){
      g+=`<rect x="8" y="80" width="304" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E0" stroke-width="1.4" stroke-dasharray="4 3"/>`;
      g+=`<text x="160" y="113" font-size="8.4" fill="#94A3B8" text-anchor="middle" font-weight="700">이곳에서는 찾을 것이 보이지 않아요 — 다른 곳으로 가 봐요</text>`;
    }
  }
  return `<svg viewBox="0 0 320 158"><rect width="320" height="158" fill="#ffffff"/>${g}
    <text x="160" y="152" font-size="7.4" fill="#94A3B8" text-anchor="middle">위쪽 지도를 눌러 다른 곳으로 걸어가요 — 판은 한 번에 한 곳만 보여 줘요</text></svg>`;
}

function spPanel(st){
  const done = st.spFin!=null;
  let right='';
  right+=`<div class="dw-step">🏫 수첩 ${st.spFound.length} / ${SP_FAC.length} · 지금 있는 곳 「${SP_PLACE[st.spAt]}」</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">🏫 우리 학교 답사 수첩을 다 채웠어요</div>
      <div>우리 학교에는 <b>${SP_FAC.map(f=>f.s).join(', ')}</b>가 있어요. 그리고 아직 없어서 제안하고 싶은 것은 <b>${SP_SUG[st.spSug].s}</b>예요 — ${SP_SUG[st.spSug].why}</div>
      <div style="margin-top:5px;color:#64748B">판은 <b>한 번에 한 곳만</b> 보여 주었어요. 한곳에 서 있었다면 여섯 가지를 다 찾을 수 없었을 거예요.</div></div>`;
  } else if(st.spSug!=null){
    right+=`<div class="sp-q">돌아다니며 찾아보니 무엇을 알게 됐나요?</div>`;
    right+=`<div class="sp-fin">${SP_FIN.map((f,k)=>
      `<button class="${st.spWrongF===k?'no':''}" onclick="spFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(spDoneAll(st)){
    right+=`<div class="sp-q">우리 학교에 아직 없어서 제안하고 싶은 것은 무엇인가요?</div>`;
    right+=`<div class="sp-list">${SP_SUG.map((s,k)=>
      `<button class="${st.spWrongS===k?'no':''}" onclick="spSuggest(${k})">${s.s}</button>`).join('')}</div>`;
  } else if(st.spOpen!=null){
    right+=`<div class="sp-q">「${SP_FAC[st.spOpen].s}」의 쓰임새는 무엇일까요?</div>`;
    right+=`<div class="sp-list">${SP_OPT[st.spOpen].map((k,j)=>
      `<button class="${st.spWrongU===j?'no':''}" onclick="spUse(${j})">${SP_FAC[k].u}</button>`).join('')}</div>`;
  } else {
    right+=`<div class="sp-q">이곳에는 어떤 인권 보호 시설이 있을까요?</div>`;
    right+=`<div class="dw-msg">지금 있는 곳의 칸을 눌러 살펴보고, 없으면 <b>위쪽 지도에서 다른 곳으로 걸어가요.</b></div>`;
  }

  if(st.spFound.length>0){
    right+=`<div class="sp-note"><span class="sh">📓 답사 수첩</span>${st.spFound.map(i=>
      `<div class="row"><b>${SP_FAC[i].s}</b> — ${SP_FAC[i].u}</div>`).join('')}${
      st.spSug!=null?`<div class="row"><b>제안 · ${SP_SUG[st.spSug].s}</b> — ${SP_SUG[st.spSug].why}</div>`:''}</div>`;
  }
  if(st.spMsg) right+=`<div class="dw-msg${st.spWarn?' warn':''}">${st.spMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🏫 학교를 돌아다니며 인권 보호 시설을 찾고, 쓰임새를 적어 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${spCanvas(st)}<div class="cvcap">지금 서 있는 곳에 있는 것만 찾을 수 있어요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    <div class="sum-item"><span class="n">①</span><div>우리 사회는 어린이·노인·임산부처럼 사회적으로 보호가 필요한 사람들을 배려하기 위한 <b style="color:var(--green)">시설이나 물건</b>을 마련해 인권을 보호해요 — 어린이 전용 세면대, 큰 글자 도서, 임산부 배려석 등.</div></div>
    <div class="sum-item"><span class="n">②</span><div>학교는 <b style="color:var(--green)">인권 보호 시설</b>을 갖추고, <b style="color:var(--green)">인권 교육</b>을 하며, 선생님과 학생, 학부모가 함께 <b style="color:var(--green)">규칙</b>을 만들어요.</div></div>
    <div class="sum-item"><span class="n">③</span><div>국가는 <b style="color:var(--green)">법과 제도 마련 · 사회 보장 제도 시행 · 공공 편의 시설 설치 · 인권 교육과 캠페인 활동</b>으로 사회 구성원의 인간다운 생활을 보장하고자 노력해요.</div></div>
    <div class="sum-item"><span class="n">★</span><div><b style="color:var(--red)">어린이는 학교에서만 인권을 보호받는 것이 아니에요.</b> 우리 주변 곳곳에 인권을 보호하려는 노력이 있어요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">생활 속에서 인권 보호를 실천</b>해 봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"우리 사회의 인권 보호 노력을 설명할 수 있어요","지식·이해",st)}
    ${selfCheck(1,"학교의 인권 보호 시설을 찾아 쓰임새를 말할 수 있어요","과정·기능",st)}
    ${selfCheck(2,"주변의 인권 보호 노력에 관심을 갖는 마음을 길렀어요","가치·태도",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">생활 속에서 인권 보호를 실천</b>하기!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,area,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span class="tagx">${area}</span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  spAt:0, spFound:[], spOpen:null, spSug:null, spFin:null,
  spWrongU:null, spWrongS:null, spWrongF:null, spMsg:null, spWarn:false, spBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function spRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 곳 옮기기 — ⭐ 걸어서 옮겨 다니는 것이 조작의 한 걸음 */
function spGo(p){
  if(state.spFin!=null) return;                                       // 가드① 확정 후 전체 잠금
  if(state.spBusy) return;                                            // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(p) || p<0 || p>=SP_PLACE.length) return;        // 가드② 무효 곳 번호
  if(state.spOpen!=null){                                             // 가드⑤ 쓰임새 3택 중 이동 무시
    state.spMsg='먼저 <b>「'+SP_FAC[state.spOpen].s+'」의 쓰임새</b>를 골라 수첩에 적고 움직여요.';
    state.spWarn=true; playThud(); spRender(); return;
  }
  if(p===state.spAt) return;
  state.spAt=p; state.spWarn=false;
  state.spMsg='<b>「'+SP_PLACE[p]+'」</b>(으)로 걸어왔어요. 이곳에 무엇이 있는지 살펴봐요.';
  playBlip(); spRender();
}

/* ② 시설 찾기 — ⭐ 지금 서 있는 곳의 것만 찾을 수 있다 */
function spFind(i){
  if(state.spFin!=null) return;                                       // 가드①
  if(state.spBusy) return;                                            // 가드⑧
  if(!Number.isInteger(i) || i<0 || i>=SP_FAC.length) return;          // 가드② 무효 시설 번호
  if(SP_FAC[i].p !== state.spAt) return;                              // 가드③ ★ 다른 곳의 시설 무시(핵심)
  if(state.spOpen!=null) return;                                      // 한 가지씩 살펴본다
  if(spFound(state,i)){                                               // 가드⑥ 이미 찾은 시설 재선택 무시
    state.spMsg='「'+SP_FAC[i].s+'」은(는) 이미 수첩에 적었어요. 다른 곳으로 가 봐요.';
    state.spWarn=true; playThud(); spRender(); return;
  }
  state.spOpen=i; state.spWarn=false; state.spWrongU=null;
  state.spMsg='<b>「'+SP_FAC[i].s+'」</b>을(를) 찾았어요. 이제 <b>쓰임새</b>를 골라 수첩에 적어요.';
  playBlip(); spRender();
}

/* ③ 쓰임새 3택 — 오답 안내가 주인 자리를 짚어 준다(l06 규약 승계) */
function spUse(j){
  if(state.spFin!=null) return;                                       // 가드①
  if(state.spBusy) return;                                            // 가드⑧
  if(!Number.isInteger(j) || j<0 || j>=3) return;                      // 가드② 무효 쓰임새 번호
  if(state.spOpen==null) return;                                      // 가드④ 시설을 고르기 전 무시(순서)
  const fac=state.spOpen, picked=SP_OPT[fac][j];
  if(picked!==fac){
    state.spWrongU=j; state.spWarn=true; state.spBusy=true;
    state.spMsg='그것은 <b>「'+spOwnerOf(picked)+'」</b>의 쓰임새예요. 다시 살펴봐요.';
    playThud(); spRender();
    setTimeout(()=>{ if(state.spWrongU===j){ state.spWrongU=null; state.spMsg=null; state.spWarn=false; } state.spBusy=false; spRender(); },1600);
    return;
  }
  state.spFound.push(fac); state.spOpen=null; state.spWrongU=null; state.spWarn=false;
  state.spMsg = spDoneAll(state)
    ? '여섯 칸을 모두 채웠어요. 이제 <b>우리 학교에 아직 없어서 제안하고 싶은 것</b>을 마지막 칸에 적어요.'
    : '<b>「'+SP_FAC[fac].s+'」</b>을(를) 쓰임새와 함께 수첩에 적었어요. 남은 곳으로 걸어가 봐요.';
  playBlip(); spRender();
}

/* ④ 마지막 칸 — ⭐ 이미 찾은 것은 제안이 되지 않는다(제안의 규칙) */
function spSuggest(k){
  if(state.spFin!=null) return;                                       // 가드①
  if(state.spBusy) return;                                            // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SP_SUG.length) return;          // 가드② 무효 제안 번호
  if(!spDoneAll(state)) return;                                       // 가드⑦ 여섯 가지 전 제안 무시(순서)
  if(state.spSug!=null) return;                                       // 한 번만 적는다
  const g=SP_SUG[k];
  if(g.have!=null){                                                   // 가드⑦ ★ 이미 찾은 것 제안 무시
    state.spWrongS=k; state.spWarn=true; state.spBusy=true;
    state.spMsg='「'+g.s+'」은(는) 우리 학교 <b>'+SP_PLACE[SP_FAC[g.have].p]+'</b>에서 이미 찾았어요. <b>아직 없는 것</b>을 제안해 봐요.';
    playThud(); spRender();
    setTimeout(()=>{ if(state.spWrongS===k){ state.spWrongS=null; state.spMsg=null; state.spWarn=false; } state.spBusy=false; spRender(); },1600);
    return;
  }
  state.spSug=k; state.spWrongS=null; state.spWarn=false;
  state.spMsg='<b>「'+g.s+'」</b>을(를) 제안했어요. 까닭도 함께 적었어요 — '+g.why;
  playBlip(); spRender();
}

/* ⑤ 마무리 3택 — 이 조작에서 옳고 그름이 있는 단 하나 */
function spFinish(k){
  if(state.spFin!=null) return;                                       // 가드①
  if(state.spBusy) return;                                            // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=SP_FIN.length) return;          // 가드② 무효 마무리 번호
  if(state.spSug==null) return;                                       // 가드⑦ 제안 전 마무리 무시(순서)
  if(k===SP_FIN_OK){
    state.spFin=k; state.spWrongF=null; state.spMsg=null; state.spWarn=false;
    playChime(); spRender(); return;
  }
  state.spWrongF=k; state.spWarn=true; state.spBusy=true;
  state.spMsg = k===0
    ? '현관에서는 <b>경사로</b>만 보였지요. 계단 점자 블록은 계단까지 걸어가야 보였어요.'
    : '옐로 카펫은 어린이를, 큰 글자 도서는 노인을 배려한 것이었지요. <b>모두를 위한</b> 것이에요.';
  playThud(); spRender();
  setTimeout(()=>{ if(state.spWrongF===k){ state.spWrongF=null; state.spMsg=null; state.spWarn=false; state.spBusy=false; spRender(); } else { state.spBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // 주제② l09 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

K-edu 사회 5-1 · 3단원 법과 인권의 보장 · 주제② 일상생활 속 인권 보호 · 6차시(l06) — **주제② 진입 차시**
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사03-02] · 교과서 p.132~134 · 지도서(대단원3 **9차시** 일상생활에서 인권이 침해되는 사례를
살펴볼까요, 지도서 p.274~284) 근거
학습 목표: 일상생활 속 인권 침해 사례를 설명할 수 있다.
수업 기법 및 전략: 모둠 토의 · 돌아가며 말하기
직접조작: 동네 살펴보기 판(신규 패턴 — 가려내기형 / 판이 과제를 짚어 주지 않는다)
  ⭐ 앞의 서른 종은 전부 **판이 "이것이 과제다"라는 테두리를 내밀었다.**
     카드 여섯 장이든 검색 결과 세 건이든 장면 목록이든 — 무엇을 다뤄야 하는지는 언제나
     판이 구획해서 보여 주었고, 학생은 그 테두리 안에서 골랐다.
     이번만 다르다. **동네 그림 하나가 통째로 주어지고, 어디에 인권 침해가 있는지 판이 짚어 주지 않는다.**
     아홉 자리에는 인권이 침해되는 자리 여섯과 인권이 지켜지는 자리 셋이 섞여 있고,
     학생이 하나하나 눌러 살펴보고 **가려내야** 한다. 이 차시가 기르는 것이 바로 그
     **알아차리는 눈**이기 때문이다 — 지도 꿀 Tip: "편견이나 차별, 폭력, 사생활 침해, 시설 부족,
     안전 문제 등으로 인권이 침해되는 모습을 학생들의 경험 속에서 떠올려 볼 수 있도록 한다."
  ⭐ **지켜지는 자리 셋은 [생각을 열어요]의 인권 보호 제품 원문**(높낮이가 다양한 손잡이 /
     발을 이용해 문을 열 수 있는 발잡이 / 승강기 점자 버튼)이다. 침해만 가득한 동네를 그리지
     않기 위해서이고, 지켜짐을 침해와 나란히 두어야 가려내는 눈이 실제로 일하기 때문이다.
  ① **자리 고르기** — 아홉 자리 어느 것이든(순서 자유). 장면이 열린다.
  ② **판정 2택** — 「인권이 침해되고 있어요 / 인권이 잘 지켜지고 있어요」.
     지켜지는 자리는 여기서 완료(설치한 까닭 리빌). 침해 자리는 다음 단계로.
  ③ **까닭 3택** — 왜 인권 침해인가(교과서·지도서 예시 답안 원문). 오답을 고르면
     **그 까닭의 주인 자리를 짚어 준다** — "그것은 「○○」에서 일어난 인권 침해의 까닭이에요."
  ④ ㉮·㉯·㉰ 세 사례는 까닭을 맞히면 **「이대로 두면?」**이 함께 뜬다(지도서 원문 —
     "인권 침해 사례가 발생한 까닭을 생각해 보는 것에서 그치지 않고, 이러한 문제가 지속되면
     발생할 수 있는 문제를 생각해 보고" — 판정 없는 리빌).
  ⑤ 아홉 자리를 다 가려내면 마무리 3택 = 지도서 정리 원문
     "인권은 누구에게나 소중한 것이지만 일상생활 곳곳에서 인권 침해가 일어나기도 합니다."
  ⚠️ 아홉 자리·판정·까닭 후보는 모두 **고정 리터럴 — 난수 0**. 까닭 후보는 여섯 침해 까닭
     풀에서 뽑고 **자리 i의 정답 까닭도 i**라 판정이 한 줄로 검증된다(l02·l03 규약 승계).
     까닭 정답 자리 [0,1,2,2,0,1](각 자리 2회) · 마무리 정답 자리 1.
  ⚠️ 가드 8종: ① 마무리 확정 후 전체 잠금 / ② 무효 자리·판정·까닭·마무리 번호
     (`Number.isInteger`) / ③ 자리를 고르기 전 판정 2택 무시(순서 강제) /
     ④ **판정을 맞히기 전 까닭 3택 무시**(순서 강제) / ⑤ 이미 가려낸 자리 재선택 무시 /
     ⑥ **까닭 3택이 열려 있는 동안 다른 자리 이동 무시**(살펴보던 자리를 끝내고 이동) /
     ⑦ **아홉 자리를 다 가려내기 전 마무리 무시** / ⑧ 안내가 떠 있는 동안 재클릭 무시(`tnBusy`).
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
  ⚠️ 발문은 안내 문구에 밀리지 않게 `.tn-q`로 떼어 **상시 노출**한다(u2 l06 규약 승계).
지도서 근거(9차시 p.274~284):
  [생각을 열어요] 인권 보호를 위해 설치한 생활 속 제품 — 높낮이가 다양한 손잡이 / 발을 이용해
    문을 열 수 있는 발잡이 / 승강기 점자 버튼. 핵심 질문 = 설치한 까닭 → 키가 작은 사람도
    손잡이를 잡을 수 있도록 / 시각 장애가 있는 사람이 승강기 버튼을 누를 수 있도록 /
    손을 사용하기 힘든 사람이 발을 이용해 문을 쉽게 열 수 있도록 / **사람들의 인권을 보호하기 위해서.**
  [전개] **인권 침해 = 성별, 나이, 신체적 특징, 종교, 국적 등으로 인권을 보호받지 못하는 것.**
    일상생활에서 **편견이나 차별, 폭력, 사생활 침해, 시설 부족, 안전 문제** 등으로 인권이
    침해되는 모습을 찾아볼 수 있다.
  [스스로 활동 p.133] 인권 침해 3장면 — 휠체어를 탄 사람이 경사로가 없어 식당에 출입하지 못함 /
    온라인 공간의 단체 대화방에서 사이버 폭력을 당함("난 ○○가 정말 싫어") /
    공사장 소음으로 몹시 괴로워함. 그림 해설 = 시설 부족, 사이버 폭력, 안전 문제.
  [핵심 질문] 우리 주변에서 볼 수 있는 인권 침해 사례(예시 답안) — 키가 작다고 놀림 /
    여자라는 이유로 함께 축구를 하지 않음 / 책상 서랍 속 일기장을 몰래 봄 /
    외국인 근로자가 임금 차별을 받는 모습(텔레비전) / 연예인이 악성 댓글로 힘들어한다는 신문 기사 /
    피부색이 다르다는 이유로 놀림 / 학교 주변 공사장에 큰 차들이 많이 다녀 등하교가 위험함.
  [친구와 활동 p.134] 각 사례가 인권 침해인 까닭 —
    ㉮ 다른 나라에서 온 사람이 우리나라 사람과 똑같이 일하고도 **외국인이라는 이유로 월급을
       적게 받는 차별**을 받음. → 지속되면 = 우리나라에서 일하는 외국인 근로자들이 불만을 품게 됨.
    ㉯ 집 앞에 고층 건물이 생기면서 **햇빛을 받을 수 있는 권리**를 침해받음(하루 종일 햇빛이
       들어오지 않아 낮에도 전등을 켜고 생활). → 지속되면 = 생활에 불편함을 겪는 사람이 늘어남.
    ㉰ 길가에 마구 버려진 쓰레기의 악취와 자동차 매연으로 **건강하고 쾌적한 환경에서 생활할 수
       있는 권리와 안전**을 침해받음(숨이 막히고, 코가 아프고 목이 따가워 병원에 다녀옴).
       → 지속되면 = 오염된 환경에서 생활하면서 아픈 사람이 늘어남.
  [꼭 기억해요] 1. 모든 사람이 안전하고 행복한 생활을 하려면 인권이 보호되어야 합니다(○).
    2. 일상생활에서 편견이나 (차별), 폭력, 사생활 침해, 시설 부족, 안전 문제 등으로 인권이
    침해되는 모습을 찾아볼 수 있습니다.
  [9차시 주요 내용 정리] 1. 인권 침해의 뜻. 2. 사례 ① 휠체어를 탄 사람이 경사로가 없어 건물에
    들어가지 못하는 경우 ② 온라인 공간의 단체 대화방에서 사이버 폭력을 당하는 경우.
  [정리] "인권은 누구에게나 소중한 것이지만 일상생활 곳곳에서 인권 침해가 일어나기도 합니다."
    차시 예고 = 인권 침해를 해결할 수 있는 방법 알아보기.
  [주제 개관 일반화] 인권이 침해되면 일상생활에서 불편함을 겪거나, 인간다운 삶을 누리지 못할 수 있다.
  [주제 도입 p.132] 이 주제를 공부하면 ① 인권 침해 사례를 찾아 해결 방안을 제시하고 토의할 수
    있습니다 ② 일상생활에서 인권 보호를 실천할 수 있습니다.
⚠️ 설계 원칙:
  · **10~11차시(인권 침해 해결 방법) 침범 0** — 국회 도서관 사례·원인 탐구·토의 절차 0.
    「해결」은 주제 도입 1 + 차시 예고 2 자리에서만 등장한다(스모크가 개수 대조).
  · **12~15차시(인권 보호 노력·실천) 침범 0** — 학교·국가의 노력, 사회 보장 제도, 인권 보호
    실천 활동 0. [생각을 열어요]의 인권 보호 제품 셋은 9차시 원문이라 그 자리에서만 쓰되
    "사람들의 인권을 보호하기 위해 설치"까지만 쓰고 **누가 설치했는지(학교·국가)는 쓰지 않는다.**
  · 교사용 참고 자료 0 — **유니버설 디자인**(용어·원칙 7종)·인권 의식 실태 조사 통계·
    외국인 임금 체납 금액·일조권과 「건축법」·환경권·스톡홀름 선언·국제 연합·참고 도서·
    KTV 영상 누리집 0. **문항·본문 내 연도·금액·비율 0.**
  · **학생 이름 0** — 교과서의 송이·지호는 「어느 학생」으로 치환하고 사례 기호는 ㉮·㉯·㉰.
    **우리나라 지역 이름 0.**
  · 정서 — 침해 장면으로 겁을 주지 않는다. 오판정은 "다시 봐요"로 받고 막지 않는다.
    지켜지는 자리 셋을 함께 두어 동네가 침해로만 가득한 그림이 되지 않게 한다.
    대화방 문구는 교과서 원문("난 ○○가 정말 싫어")만 쓰고 늘리지 않는다.

.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#EDE9FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#581C87;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#FBF7FF;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}
.check .tagx{flex-shrink:0;background:var(--bub);color:var(--green-d);border-radius:6px;padding:2px 7px;
  font-size:clamp(10.5px,1.8vw,12.5px);font-weight:800}

/* 직접조작 — 동네 살펴보기 판(가려내기형) */
.dw-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-canvas .spot{cursor:pointer}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.tn-q{background:var(--bub);border-radius:9px;padding:6px 10px;font-size:clamp(11px,1.86vw,13.2px);
  font-weight:800;color:var(--green-d);line-height:1.45}
.tn-scene{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:7px 10px;
  font-size:clamp(10.6px,1.8vw,12.8px);line-height:1.5;color:#3F3A2C;animation:fadeUp .3s ease both}
.tn-scene .sh{font-weight:800;color:#8A6D3B;display:block;margin-bottom:2px}
.tn-list{display:flex;flex-direction:column;gap:4px;max-height:176px;overflow-y:auto}
.tn-list button{border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10px,1.7vw,12.2px);transition:.15s;
  line-height:1.35;text-align:left}
.tn-list button:hover{border-color:var(--green);background:var(--bub)}
.tn-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.tn-fin{display:flex;flex-direction:column;gap:5px}
.tn-fin button{border:2px solid var(--cyan);background:#fff;color:var(--green-d);border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.2px,1.74vw,12.6px);text-align:left;line-height:1.4}
.tn-fin button:hover{background:var(--bub)}
.tn-fin button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(126,34,206,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

function tnWrap(s,n,max){
  const w=s.split(' '); const out=[]; let cur='';
  for(const t of w){ if((cur+' '+t).trim().length>n && cur){ out.push(cur); cur=t; } else { cur=(cur?cur+' ':'')+t; } }
  if(cur) out.push(cur);
  return out.slice(0,max||3);
}
function tnIsDone(st,i){ return st.tnDone.indexOf(i)>=0; }

/* 판 — 3×3 아홉 자리. 판은 어느 자리가 침해인지 미리 표시하지 않는다. */
function tnCanvas(st){
  let g='';
  g+=`<text x="160" y="16" font-size="9.8" fill="#581C87" text-anchor="middle" font-weight="800">🔎 우리 동네 살펴보기 — 가려낸 자리 ${st.tnDone.length} / ${TN_SPOT.length}</text>`;
  for(let i=0;i<TN_SPOT.length;i++){
    const col=i%3, row=(i-col)/3;
    const x=12+col*100, y=24+row*66;
    const done=tnIsDone(st,i), sel=st.tnPick===i;
    const bad=i<TN_BAD_N;
    let stroke='#CBD5E0', fill='#fff', dash='';
    if(done){ stroke = bad?'#DC2626':'#16A34A'; fill = bad?'#FEF2F2':'#F0FDF4'; }
    else if(sel){ stroke='#7E22CE'; fill='#FAF5FF'; }
    else { dash=' stroke-dasharray="4 3"'; }
    g+=`<g class="spot" onclick="tnPickSpot(${i})">`;
    g+=`<rect x="${x}" y="${y}" width="96" height="62" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${sel||done?2:1.5}"${dash}/>`;
    g+=`<text x="${x+48}" y="${y+16}" font-size="8" fill="#334155" text-anchor="middle" font-weight="800">${TN_SPOT[i].mk?TN_SPOT[i].mk+' ':''}${TN_SPOT[i].n}</text>`;
    if(done){
      if(bad){
        g+=`<rect x="${x+24}" y="${y+26}" width="48" height="16" rx="8" fill="#FEE2E2"/>`;
        g+=`<text x="${x+48}" y="${y+37}" font-size="7.4" fill="#991B1B" text-anchor="middle" font-weight="800">침해</text>`;
      } else {
        g+=`<rect x="${x+22}" y="${y+26}" width="52" height="16" rx="8" fill="#DCFCE7"/>`;
        g+=`<text x="${x+48}" y="${y+37}" font-size="7.4" fill="#166534" text-anchor="middle" font-weight="800">지켜짐</text>`;
      }
      g+=`<text x="${x+48}" y="${y+54}" font-size="6.6" fill="${bad?'#DC2626':'#16A34A'}" text-anchor="middle" font-weight="800">${bad?'가려냈어요':'확인했어요'}</text>`;
    } else if(sel){
      g+=`<text x="${x+48}" y="${y+38}" font-size="7.2" fill="#7E22CE" text-anchor="middle" font-weight="800">살펴보는 중…</text>`;
      g+=`<text x="${x+48}" y="${y+52}" font-size="6.6" fill="#9333EA" text-anchor="middle">오른쪽을 봐요</text>`;
    } else {
      g+=`<circle cx="${x+48}" cy="${y+36}" r="9" fill="none" stroke="#94A3B8" stroke-width="1.6"/>`;
      g+=`<path d="M${x+54} ${y+42} L${x+60} ${y+48}" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>`;
      g+=`<text x="${x+48}" y="${y+58}" font-size="6.6" fill="#94A3B8" text-anchor="middle">눌러서 살펴봐요</text>`;
    }
    g+=`</g>`;
  }
  return `<svg viewBox="0 0 320 224"><rect width="320" height="224" fill="#ffffff"/>${g}</svg>`;
}

function tnPanel(st){
  const done = st.tnFin!=null;
  const all = st.tnDone.length>=TN_SPOT.length;
  let right='';
  right+=`<div class="dw-step">🔎 가려낸 자리 ${st.tnDone.length} / ${TN_SPOT.length} — 침해 ${st.tnDone.filter(i=>i<TN_BAD_N).length} · 지켜짐 ${st.tnDone.filter(i=>i>=TN_BAD_N).length}</div>`;

  if(done){
    right+=`<div class="dw-card"><div class="pt">🔎 동네를 다 살펴봤어요</div>
      <div>아홉 자리 가운데 <b>인권이 침해되는 자리 여섯</b>과 <b>인권이 지켜지는 자리 셋</b>을 가려냈어요.
      판은 어느 자리가 침해인지 알려 주지 않았지요 — <b>알아차리는 눈</b>이 오늘의 공부예요.</div>
      <div style="margin-top:5px;color:#64748B">인권은 누구에게나 소중하지만, <b>일상생활 곳곳</b>에서 인권 침해가 일어나기도 해요.</div></div>`;
  } else if(all){
    right+=`<div class="tn-q">동네를 다 살펴보고 무엇을 알게 됐나요?</div>`;
    right+=`<div class="tn-fin">${TN_FIN.map((f,k)=>
      `<button class="${st.tnWrongF===k?'no':''}" onclick="tnFinish(${k})">${f}</button>`).join('')}</div>`;
  } else if(st.tnPick==null){
    right+=`<div class="tn-q">어느 자리부터 살펴볼까요?</div>`;
    right+=`<div class="dw-msg">아홉 자리 가운데 <b>어디에서 인권이 침해되고 있는지</b>는 판이 알려 주지 않아요. 왼쪽 동네에서 자리를 하나 눌러 직접 살펴봐요.</div>`;
  } else {
    const S=TN_SPOT[st.tnPick];
    right+=`<div class="tn-scene"><span class="sh">${S.mk?S.mk+' ':''}${S.n}</span>${S.s}</div>`;
    if(!st.tnJudged){
      right+=`<div class="tn-q">이곳의 인권은 어떤가요?</div>`;
      right+=`<div class="tn-list">${TN_JUDGE.map((j,k)=>
        `<button class="${st.tnWrongJ===k?'no':''}" onclick="tnJudge(${k})">${j}</button>`).join('')}</div>`;
    } else {
      right+=`<div class="tn-q">왜 인권 침해일까요?</div>`;
      right+=`<div class="tn-list">${CAUSE_OPT[st.tnPick].map((c,k)=>
        `<button class="${st.tnWrongC===k?'no':''}" onclick="tnCause(${k})">${CAUSES[c]}</button>`).join('')}</div>`;
    }
  }
  if(st.tnMsg) right+=`<div class="dw-msg${st.tnWarn?' warn':''}">${st.tnMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🔎 우리 동네를 살펴보고, 인권이 침해되는 자리를 가려내 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${tnCanvas(st)}<div class="cvcap">어느 자리가 침해인지는 표시돼 있지 않아요 — 직접 살펴보고 가려내요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

    ${selfCheck(0,"인권 침해가 무엇인지 설명할 수 있어요","지식·이해",st)}
    ${selfCheck(1,"일상생활 속 인권 침해 사례를 찾아 그 까닭을 말할 수 있어요","과정·기능",st)}
    ${selfCheck(2,"내 주변의 인권 침해에 관심을 갖는 태도를 길렀어요","가치·태도",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 공부를 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">인권 침해를 해결할 수 있는 방법</b>!</div>
  </div>`;
}});

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,area,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span class="tagx">${area}</span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u3_l06";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  tnPick:null, tnJudged:false, tnDone:[], tnFin:null,
  tnWrongJ:null, tnWrongC:null, tnWrongF:null, tnMsg:null, tnWarn:false, tnBusy:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function tnRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 자리 고르기 — 어느 자리든(순서 자유) */
function tnPickSpot(i){
  if(state.tnFin!=null) return;                                     // 가드① 확정 후 전체 잠금
  if(state.tnBusy) return;                                          // 가드⑧ 안내 표시 중 재클릭 무시
  if(!Number.isInteger(i) || i<0 || i>=TN_SPOT.length) return;       // 가드② 무효 자리 번호
  if(tnIsDone(state,i)){                                            // 가드⑤ 이미 가려낸 자리 재선택 무시
    state.tnMsg='이미 가려낸 자리예요. 아직 살펴보지 않은 자리를 눌러 봐요.'; state.tnWarn=true;
    playThud(); tnRender(); return;
  }
  if(state.tnJudged){                                               // 가드⑥ 까닭 3택이 열려 있는 동안 이동 무시
    state.tnMsg='지금 살펴보는 자리의 <b>까닭</b>을 먼저 골라 봐요.'; state.tnWarn=true;
    playThud(); tnRender(); return;
  }
  state.tnPick=i; state.tnJudged=false; state.tnWrongJ=null; state.tnWrongC=null;
  state.tnMsg=null; state.tnWarn=false;
  playBlip(); tnRender();
}

/* ② 판정 2택 — 침해인가 지켜짐인가 */
function tnJudge(k){
  if(state.tnFin!=null) return;                                     // 가드①
  if(state.tnBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>1) return;                     // 가드② 무효 판정 번호
  if(state.tnPick==null) return;                                    // 가드③ 자리를 고르기 전 무시(순서)
  if(state.tnJudged) return;
  const i=state.tnPick, bad=i<TN_BAD_N, ans=bad?0:1;
  if(k===ans){
    if(bad){
      state.tnJudged=true; state.tnWrongJ=null; state.tnWarn=false;
      state.tnMsg='맞아요, 이곳에서는 <b>인권이 침해되고 있어요.</b> 그렇다면 왜 침해일까요?';
      playChime(); tnRender(); return;
    }
    state.tnDone.push(i); state.tnPick=null; state.tnWrongJ=null; state.tnWarn=false;
    state.tnMsg='<b>'+TN_SPOT[i].n+'</b> — '+TN_SPOT[i].why+(state.tnDone.length>=TN_SPOT.length?' 이제 아홉 자리를 다 가려냈어요!':'');
    playChime(); tnRender(); return;
  }
  state.tnWrongJ=k; state.tnWarn=true; state.tnBusy=true;
  state.tnMsg = bad
    ? '다시 봐요. 이 자리에는 <b>어려움을 겪는 사람</b>이 있어요. 무엇 때문인지 장면을 다시 읽어 봐요.'
    : '이것은 사람들의 <b>인권을 보호하기 위해 설치한 것</b>이에요. 누가 이 제품 덕분에 편해질지 생각해 봐요.';
  playThud(); tnRender();
  setTimeout(()=>{ if(state.tnWrongJ===k){ state.tnWrongJ=null; state.tnBusy=false; tnRender(); } else { state.tnBusy=false; } },1600);
}

/* ③ 까닭 3택 — 침해 자리만(왜 인권 침해인가) */
function tnCause(k){
  if(state.tnFin!=null) return;                                     // 가드①
  if(state.tnBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>2) return;                     // 가드② 무효 까닭 번호
  if(state.tnPick==null) return;                                    // 가드③
  if(!state.tnJudged) return;                                       // 가드④ 판정을 맞히기 전 무시(순서)
  const i=state.tnPick, c=CAUSE_OPT[i][k];
  if(c===i){
    state.tnDone.push(i); state.tnPick=null; state.tnJudged=false;
    state.tnWrongC=null; state.tnWarn=false;
    let m='<b>'+TN_SPOT[i].n+'</b> 자리를 가려냈어요. '+CAUSES[i];
    if(TN_SPOT[i].next) m+='<br><b>이대로 두면?</b> — '+TN_SPOT[i].next;
    if(state.tnDone.length>=TN_SPOT.length) m+='<br>이제 아홉 자리를 다 가려냈어요!';
    state.tnMsg=m;
    playChime(); tnRender(); return;
  }
  state.tnWrongC=k; state.tnWarn=true; state.tnBusy=true;
  state.tnMsg=`그것은 <b>「${TN_SPOT[c].n}」</b>에서 일어난 인권 침해의 까닭이에요. 지금 살펴보는 장면을 다시 읽어 봐요.`;
  playThud(); tnRender();
  setTimeout(()=>{ if(state.tnWrongC===k){ state.tnWrongC=null; state.tnBusy=false; tnRender(); } else { state.tnBusy=false; } },1600);
}

/* ④ 마무리 — 동네를 다 살펴보고 알게 된 것 */
function tnFinish(k){
  if(state.tnFin!=null) return;                                     // 가드①
  if(state.tnBusy) return;                                          // 가드⑧
  if(!Number.isInteger(k) || k<0 || k>=TN_FIN.length) return;        // 가드② 무효 마무리 번호
  if(state.tnDone.length < TN_SPOT.length) return;                   // 가드⑦ 아홉 자리 전 마무리 무시
  if(k===TN_FIN_OK){
    state.tnFin=k; state.tnWrongF=null; state.tnMsg=null; state.tnWarn=false;
    playChime(); tnRender(); return;
  }
  state.tnWrongF=k; state.tnWarn=true; state.tnBusy=true;
  state.tnMsg = k===0
    ? '오늘 살펴본 아홉 자리는 모두 <b>우리 동네</b>였어요. 인권 침해는 일상생활 곳곳에서 일어나기도 해요.'
    : '인권이 침해되면 <b>일상생활에서 불편함을 겪거나, 인간다운 삶을 누리지 못할 수</b> 있어요.';
  playThud(); tnRender();
  setTimeout(()=>{ if(state.tnWrongF===k){ state.tnWrongF=null; state.tnMsg=null; state.tnWarn=false; state.tnBusy=false; tnRender(); } else { state.tnBusy=false; } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u3_l07_해결방법.html'; } // 주제② l07 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

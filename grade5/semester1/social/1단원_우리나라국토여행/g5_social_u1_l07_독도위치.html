<!--
K-edu 사회 5-1 · 1단원 우리나라 국토 여행 · ② 소중한 우리 땅, 독도 · 7차시(l07)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사01-02] · 교과서 p.30~33 · 지도서(대단원1 주제② 8차시, 지도서 p.70~73) 근거
⚠️ 주제② 첫 차시 — 성취기준이 [6사01-01] → [6사01-02]로 전환됨.
직접조작: 인터넷 지도로 독도 가는 길 찾기(신규 패턴 — 화면 조작형)
  [디지털+ 할 수 있어요]를 승계. 인터넷 지도 화면 도식 위에서 4단계를 차례로 진행하며,
  각 단계마다 후보 3개 중 알맞은 것을 고름.
  ① 어떤 기능을 누를까(길 찾기) → ② 도착지에 무엇을 입력할까(독도항)
  → ③ 교통수단은 무엇으로 할까(자동차) → ④ 경로에서 반드시 거치는 곳은(울릉도)
  정답=blip·단계 잠금·화면 갱신, 오답=thud·shake(600ms). 4단계 완주 시 chime + 전체 경로 리빌.
  ⚠️ 단계 격리 가드(다른 단계의 정답 키를 호출해도 무시) / 무효키 가드 / 완주 후 잠금.
지도서 근거:
  [생각을 열어요] 독도 사랑 작품전 감상 — '독도' 글자 만들기·포스터·퍼즐 작품, 느낌 나누기
    (예시 답안: 독도는 우리의 고유한 땅이다 / 아름다운 독도를 지켜 나가야 한다).
  [독도의 위치] 우리나라 영토의 **동쪽 끝**에 있는 섬 / **동해**상에 위치 /
    행정구역상 **경상북도 울릉군**에 속하며 **울릉도에서 87.4 km**(죽변에서 울릉도까지 130.3 km) /
    맑은 날 울릉도의 독도 전망대에서 독도를 눈으로 직접 볼 수 있음
    → 울릉도 사람들이 독도의 존재를 알고 **예로부터 우리 영토로 인식**해 옴.
  [독도의 중요성 4항] ① 우리나라 동쪽 끝에 있어 **영토의 경계**를 알려 줌 /
    ② 우리나라·일본·러시아로 둘러싸인 동해에 있어 **교통과 군사** 면에서 중요(배·비행기 관찰,
       최전방 기지, 어업 종사 국민 보호·선박 긴급 대피) /
    ③ 다양하고 희귀한 동식물이 살고 독특한 지형이 있어 **연구 가치**가 큼(화산 활동으로 생긴 섬) /
    ④ 주변 바다에 **수산 자원과 천연자원**이 풍부해 경제적 가치가 큼.
  [디지털+ 할 수 있어요] 인터넷 지도 접속 → '길 찾기' → 출발지에 우리 학교·집 주소, 도착지에 '독도항' →
    교통수단 '자동차' 선택(대중교통은 검색 시각에 따라 경로가 달라져 자동차가 좋음) → 확대·축소로 전체 경로 확인.
    동해에 점선으로 표시된 **항로(뱃길)** 살펴보기. 울릉도로 가는 배를 탈 수 있는 항구 =
    강릉항·묵호항·후포항·영일만항·포항구항. **독도에는 공항이 없어 비행기로 갈 수 없고**,
    다른 나라 사람도 우리나라에 들어와 우리와 같은 방법으로 가야 함(**영토 주권**).
  [꼭 기억해요] 1 독도는 우리나라 영토의 남쪽 끝에 있는 섬이다(✕ — 동쪽 끝) /
    2 독도는 우리나라·일본·러시아로 둘러싸인 '동해'에 있어 교통과 군사 면에서 중요하다.
  차시 예고 = 독도의 자연환경.
⚠️ 동식물·지형·자원의 자세한 내용은 9~10차시(l08) 연결 내용이므로 이 차시에서는 '중요성'의 근거 수준으로만 다룸.
정직 원칙: 지도·인터넷 지도 화면은 위치 관계를 나타낸 도식(실제 축척 지도·실제 화면이 아님).
  거리(87.4 km·130.3 km)와 항구 이름은 교과서·지도서 명시값만 사용하되, 암기 평가는 하지 않음.
⚠️ l08 미양산 — goNextLesson = 허브.

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 지도·화면은 위치 관계를 나타낸 도식(실제 축척 지도·실제 화면이 아님). */

const NAVMAP = `<svg viewBox="0 0 100 105" preserveAspectRatio="none">

</svg>`;

function navBoard(st){
  if(!st.nDone) st.nDone = [];
  if(st.nWrong===undefined) st.nWrong = null;
  const cur = st.nDone.length;
  const allDone = cur >= NAV_N;

  // 화면 안 입력칸
  const f1 = cur>=1;               // 길 찾기 눌림
  const f2 = cur>=2;               // 도착지 입력
  const f3 = cur>=3;               // 교통수단
  let routeHTML='';
  if(cur>=4){
    routeHTML = `<svg viewBox="0 0 100 105" preserveAspectRatio="none">
      <defs><marker id="narw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker></defs>
      <line x1="26" y1="60" x2="44" y2="49" stroke="#B45309" stroke-width="1.4" marker-end="url(#narw)"/>
      <line x1="48" y1="48" x2="67" y2="53" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#narw)"/>
      <line x1="73" y1="55" x2="83" y2="57" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#narw)"/>
    </svg>`;
  }
  const screen = `<div class="nav-screen">
    <div class="nav-top"><span class="dot"></span><span class="dot"></span>
      <span class="url">${f1?'인터넷 지도 · 길 찾기':'인터넷 지도'}</span></div>
    <div class="nav-body">${NAVMAP}${routeHTML}
      <div class="nav-field${f1?' set':''}" style="top:5%">${f1?'출발 · 우리 학교':'출발지'}</div>
      <div class="nav-field${f2?' set':''}" style="top:17%">${f2?'도착 · 독도항':'도착지'}</div>
      <div class="nav-field${f3?' set':''}" style="top:29%">${f3?'🚗 자동차 경로':'교통수단'}</div>
    </div></div>`;

  let panel;
  if(allDone){
    panel = `<div class="nav-card">
      <div class="pt">🗺️ 독도로 가는 길을 찾았어요</div>
      <div>우리 학교 → 동해안의 <b>항구</b> → 배를 타고 <b>울릉도</b> → <b>독도</b>. 동해에 점선으로 표시된 <b>항로(뱃길)</b>를 따라가요.</div>
      <div style="margin-top:5px;color:#64748B">독도에는 <b style="color:#DC2626">공항이 없어</b> 비행기로 바로 갈 수 없어요. 다른 나라 사람도 우리나라에 들어와 우리와 같은 방법으로 가야 해요.</div>
    </div>`;
  } else {
    const st4 = NAVSTEPS[cur];
    const optHTML = st4.opts.map(o=>{
      const no = st.nWrong===o.k;
      return `<button class="nopt${no?' no':''}" onclick="pickNav('${st4.k}','${o.k}')">${o.label}</button>`;
    }).join('');
    panel = `<div class="nav-q">${cur+1}. ${st4.q}</div><div class="nav-opts">${optHTML}</div>`;
  }

  const tags = st.nDone.map((d,i)=>`<span class="nav-tag">${i+1} ${NAVSTEPS[i].tag}</span>`).join('');
  const last = cur>0 && !allDone ? `<div class="note" style="text-align:left;color:var(--cyan);font-weight:700">${NAVSTEPS[cur-1].say}</div>` : '';

  return `<div style="width:100%;max-width:700px;margin:0 auto">
    <div style="text-align:center;margin-bottom:7px"><b style="color:var(--green)">🗺️ 인터넷 지도로 독도 가는 길을 찾아봐요</b></div>
    <div class="nav-wrap">
      ${screen}
      <div class="nav-step">
        ${tags?`<div class="nav-done">${tags}</div>`:''}
        ${panel}
        ${last}
        ${allDone?'':`<div class="note" style="text-align:left">(${cur} / ${NAV_N} 단계)</div>`}
      </div>
    </div></div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];

  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function pickNav(step,k){
  const si = NAVSTEPS.findIndex(x=>x.k===step);
  if(si<0) return;                                       // 무효 단계 가드
  if(!state.nDone) state.nDone=[];
  if(state.nDone.length>=NAV_N) return;                  // 완주 후 잠금
  if(si!==state.nDone.length) return;                    // 단계 격리 가드
  const st = NAVSTEPS[si];
  if(!st.opts.some(o=>o.k===k)) return;                  // 무효키 가드
  if(st.ans===k){
    state.nDone.push(k);
    state.nWrong=null;
    const allDone = state.nDone.length>=NAV_N;
    allDone ? playChime() : playBlip();
    main.innerHTML = slides[state.idx].render(state);
  } else {
    state.nWrong=k;
    playThud();
    main.innerHTML = slides[state.idx].render(state);
    setTimeout(()=>{ if(state.nWrong===k){ state.nWrong=null; main.innerHTML=slides[state.idx].render(state); } },600);
  }
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // ⚠️ l08 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

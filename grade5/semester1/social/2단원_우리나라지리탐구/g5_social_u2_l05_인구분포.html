K-edu 사회 5-1 · 2단원 우리나라 지리 탐구 · 주제② 우리나라의 인구 분포 · 5차시(l05)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사02-02] · 교과서 p.80~82 · 지도서(대단원2 **9차시** 인구 분포가 무엇인지 알아볼까요, 지도서 p.172~178) 근거
학습 목표: 인구 분포의 의미와 인구 분포에 영향을 주는 환경을 설명할 수 있다.
직접조작: 인구 분포 마인드맵(신규 패턴 — 가지 허브·비선형 완성형)
  ⭐ 지도서 수업 기법이 「**마인드맵 완성하기**」이고 활동지(p.177)가 정확히 마인드맵이라,
     조작 무대 자체를 마인드맵으로 삼았다. 지금까지의 조작은 전부 **한 줄로 강제된 선형**이었는데
     이번은 **비선형**이다 — 중앙 「인구 분포」에서 가지 셋이 뻗어 있고, 어느 가지부터 열어도 된다.
     가지마다 과제의 **종류가 다르고**(3택 / 짝짓기+분류 / 환산), 셋을 다 채워야 중앙이 완성된다.
  가지 ㉠ 「의미」 — 3택. 오답 둘이 곧 이 차시의 이웃 낱말이다.
     ‘일정한 지역에 살고 있는 사람의 수’ = **인구**의 뜻 / ‘일정한 넓이 안에 사는 사람의 수’ = **인구 밀도**의 뜻.
     세 낱말을 서로 밀어 구분시키는 자리라, 오답 안내가 “그건 ○○의 뜻이에요”로 갈린다.
  가지 ㉡ 「영향을 주는 환경」 — 두 마디. ① 교과서 p.81 [스스로 활동] 말풍선 세 장을 각각 환경 이름에 잇고
     (회사에 취직 → 일자리 / 아이의 공부 → 교육 / 날씨가 좋아서 → 기후),
     ② 그다음 환경 칩 다섯 장을 **자연환경 / 인문환경** 두 칸으로 가른다.
     ⭐ 지도 꿀 Tip(“모여 사는 데 영향을 주는 자연환경과 인문환경의 종류에는 각각 어떤 것들이 있는지 확인”)이 ②의 설계 근거다.
  가지 ㉢ 「인구 밀도」 — 환산. ① 두 지역의 땅이 **넓이에 비례한 크기**로 놓여 있고, 사람을 땅 위에 놓으면
     강원 쪽이 훨씬 넓어 흩어진다. ② 「1 km²로 나누어 보기」를 눌러야 격자가 그어지고 한 칸당 사람 수가 나온다.
     ③ 그다음에야 결론 3택이 열린다(교과서 p.82 ○표 문장 직이식).
     ⭐ 지도서 활동 의도 원문(“서로 다른 넓이의 땅에 사람들이 얼마나 모여 사는지를 비교하기 위해
        **1 km²의 면적에 사는 사람의 수로 변환하여 비교하는 과정을 도해화**한 활동”)을 조작 그대로 옮겼다.
     ⭐ 지도 꿀 Tip(“인구가 모여 사는 정도를 알아볼 때는 **인구수와 함께 땅의 넓이도 고려**해야 함”)이
        ①→②의 순서 강제 자체가 됐다 — 나누기 전에는 결론을 고를 수 없다.
  ⚠️ 가드 8종: 세 가지 완성 후 전체 잠금 / 무효 가지·선택·칩·칸 번호(`Number.isInteger`) /
     열리지 않은 가지 입력 무시 / 이미 완성한 가지 재입력 무시 / 말풍선 셋을 다 잇기 전 분류 무시(순서) /
     담기 전 나누기·나누기 전 결론 무시(순서) / 말풍선을 고르지 않은 채 환경 지정 무시 / 오답 안내 표시 중 재클릭 무시.
  재시도 허용(감점 없음).
지도서 근거:
  [동기 유발] 생각을 열어요(교과서 p.80) — 일자리가 많은 ◇◇시로 이사하려는 사람, ◇◇시의 대학교로 진학하려는 학생.
    “위와 같은 사례가 많아지면 ◇◇시에는 어떤 일이 일어날까요?” → 예시 답안 = 살 집이 부족해지고 교통이 혼잡해진다 /
    지역에 활력이 넘치고 경제가 발전한다 / 다양한 사람이 모이면서 문화가 발전해 더 많은 사람을 불러 모은다.
  [학습 문제] 인구 분포가 무엇인지 알아봅시다.
  [전개 1] 인구 = 일정한 지역에 살고 있는 사람의 수. 인구 분포 = 인구가 모이거나 흩어져 있는 정도.
    인구 분포는 기후·지형 등의 **자연환경**과 교통·일자리·교육 등의 **인문환경**에 영향을 받는다.
    핵심 질문 답 = 기후가 온화하면 살기 좋다 / 산지보다 평평한 땅에 사람이 많이 산다 /
      교통이 발달해 이동하기 편리한 곳에 모인다 / 일자리가 많은 곳에 모인다 / 교육 환경이 좋은 곳에 모여 산다.
    여러 환경이 주는 영향의 정도는 같지 않고, 사람들이 중요하게 여기는 정도나 문화에 따라 다르며
      시간이 흘러 생각이나 직업이 바뀌면 영향을 주는 정도도 달라진다.
  [스스로 활동 · p.81] 사람들이 사는 곳을 정하는 데 영향을 준 환경 찾기 — 말풍선 세 장.
    “이 지역에 있는 회사에 취직해서 이사 왔어요”(일자리) / “아이의 공부를 위해 이 지역에서 살아요”(교육) /
    “날씨가 좋아서 이곳에서 살아요”(기후).
  [전개 2] 인구 밀도 = 일정한 넓이(1 km²) 안에 사는 사람의 수로, 인구가 모여 있는 정도를 나타냄.
    지역마다 다른 인구 분포는 각 지역의 인구 밀도를 살펴보면 알 수 있고,
    **대체로 도시가 발달한 지역에서 인구 밀도가 높게 나타난다**.
    인구 밀도를 알아볼 때 필요한 자료 = 땅 넓이와 인구수.
  [스스로 활동 · p.82] 서울특별시·강원특별자치도 인구 밀도 비교 — 원문값 그대로.
    서울특별시 약 605 km² · 약 9,384,512명 · 약 15,506명/km²
    강원특별자치도 약 16,831 km² · 약 1,528,014명 · 약 91명/km²
    ○표 문장 = “서울특별시는 강원특별자치도보다 면적이 (좁지만), 사람이 많이 살고 있어 인구 밀도가 (높습니다).”
  [꼭 기억해요] 1. 인구가 모이거나 흩어져 있는 정도를 (인구 분포)라고 합니다.
    2. 대체로 도시가 발달한 지역에서 인구 밀도가 높게 나타납니다. (○)
  [9차시 주요 내용 정리] ① 인구 분포의 의미 ② 영향을 주는 환경(자연환경 / 인문환경) ③ 인구 밀도(의미 / 알 수 있는 사실).
    → 16슬 정리를 이 세 항 그대로 옮겼다.
  [차시 예고] 다음 시간에는 우리나라의 인구 분포를 알아보겠습니다.
⚠️ 설계 원칙:
  · 지도상의 유의점(“우리나라의 인구 분포에 대한 **사실적 지식의 습득보다는 정보 파악, 일반화 도출** 등을 강조한다”,
    “지도나 그래프 등의 자료를 분석하고 **자료가 의미하는 바를 탐색**하는 활동이 되도록 한다”)을 따라
    문항을 전부 **뜻·판단·자료 해석**형으로 짰다. 지역 이름이나 수치를 외우게 하는 문항은 0.
    적용 1번은 넓이·인구 밀도 수치를 **문항 안에 제시하고 해석하게** 하므로 암기 문항이 아니다.
  · **10차시 이후 선행 침범 0** — 1960년/현재 인구분포도, 수도권·비수도권, 인구 구조(10차시),
    인구 분포의 불균형에 따른 문제점(11~12차시), 해결 노력·국가 균형 발전·혁신 도시·고향 사랑 기부제(13~14차시)가 모두 0이다.
    ⚠️ 동기 유발 예시 답안 중 “빈집이 늘어난다 / 학교가 폐교된다”는 지도서 9차시 안에 있긴 하지만
    11~12차시(인구가 감소하는 지역의 문제)와 같은 내용이라 **넣지 않았다**. 동기 유발은 ‘사람이 모이는 쪽’만 쓴다.
  · 통계 지도(1961년 인구분포도)는 **10차시 자료**이므로 이 차시에 넣지 않는다.
  · 교사용 참고 자료(인구 정태·동태, 센서스, 중위 연령, 조출생률, 인구 보너스, 인구학·인구 지리학,
    산술적·지리적·농업·경제적 인구 밀도)는 성취기준 밖이므로 0.
  · 회수 — 자연환경 ‘기후’는 주제①(l01~l04), ‘지형’은 1단원에서 이미 배운 낱말이라 정리 슬라이드에서 한 번 되받는다.
⚠️ l04 → l05 소프트체인 · goNextLesson = 허브(l06 미양산).

/* ===== 직접조작 — 인구 분포 마인드맵(신규 패턴 — 가지 허브·비선형 완성형) =====
   중앙 「인구 분포」에서 가지 셋이 뻗어 있다. 어느 가지부터 열어도 되고(비선형),
   가지마다 과제의 종류가 다르다. 셋을 다 채워야 중앙이 완성된다.
   ㉠ 의미 — 3택(이웃 낱말 둘이 오답)
   ㉡ 영향을 주는 환경 — 말풍선 3장 짝짓기 → 환경 칩 5장을 자연/인문으로 분류
   ㉢ 인구 밀도 — 사람 놓기 → 1 km²로 나누기 → 결론 3택(교과서 ○표 문장) */

const MM_BRANCH = ['의미','영향을 주는 환경','인구 밀도'];

/* ㉠ 의미 — 오답 둘이 곧 이웃 낱말이다 */
const MM_MEAN = [
  {t:'일정한 지역에 살고 있는 사람의 수', k:'pop'},
  {t:'인구가 모이거나 흩어져 있는 정도', k:'ok'},
  {t:'일정한 넓이 안에 사는 사람의 수',   k:'den'}
];
const MM_MEAN_OK = 1;

/* ㉡ 영향을 주는 환경 — 교과서 p.81 [스스로 활동] 말풍선 세 장 */
const MM_ENVS = [
  {n:'기후',   t:0},
  {n:'지형',   t:0},
  {n:'교통',   t:1},
  {n:'일자리', t:1},
  {n:'교육',   t:1}
];
const MM_BINS = ['자연환경','인문환경'];
const MM_BUBS = [
  {t:'이 지역에 있는 회사에 취직해서 이사 왔어요', a:3},
  {t:'아이의 공부를 위해 이 지역에서 살아요',      a:4},
  {t:'날씨가 좋아서 이곳에서 살아요',              a:0}
];

/* ㉢ 인구 밀도 — 교과서 p.82 [스스로 활동] 원문값 */
const MM_REG = [
  {n:'서울특별시',     area:605,   pop:9384512, den:15506, box:{w:30,h:26}},
  {n:'강원특별자치도', area:16831, pop:1528014, den:91,    box:{w:112,h:78}}
];
const MM_CONC = [
  '서울특별시는 강원특별자치도보다 면적이 넓어서 인구 밀도가 높습니다',
  '서울특별시는 강원특별자치도보다 면적이 좁지만, 사람이 많이 살고 있어 인구 밀도가 높습니다',
  '두 지역은 사는 사람 수가 다르므로 인구 밀도를 견줄 수 없습니다'
];
const MM_CONC_OK = 1;

/* 상태 판정 헬퍼 */
function mmBubDone(st){ return st.mmBub.filter(x=>x!=null).length >= MM_BUBS.length; }
function mmSortDone(st){ return st.mmSort.filter(x=>x!=null).length >= MM_ENVS.length; }
function mmDoneAt(st,b){
  if(b===0) return st.mmMean != null;
  if(b===1) return mmBubDone(st) && mmSortDone(st);
  return st.mmConc != null;
}
function mmAllDone(st){ return mmDoneAt(st,0) && mmDoneAt(st,1) && mmDoneAt(st,2); }
function mmCount(st){ return [0,1,2].filter(b=>mmDoneAt(st,b)).length; }

/* 마인드맵 캔버스 — 가지 셋의 상태를 한눈에 */
function mmCanvas(st){
  const all = mmAllDone(st);
  const d0 = mmDoneAt(st,0), d1 = mmDoneAt(st,1), d2 = mmDoneAt(st,2);
  const col = (done,open)=> done ? '#276749' : (open ? '#0E7490' : '#94A3B8');
  const fil = (done,open)=> done ? '#DFF0E7' : (open ? '#DCF0F5' : '#F8FAFC');
  let g = `<rect width="320" height="280" fill="#F8FAFC"/>`;
  // 중앙
  g += `<rect x="110" y="122" width="100" height="38" rx="12" fill="${all?'#276749':'#0E7490'}"/>`;
  g += `<text x="160" y="140" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="800">인구 분포</text>`;
  g += `<text x="160" y="153" font-size="8.4" fill="#DCF0F5" text-anchor="middle">${all?'마인드맵 완성!':`가지 ${mmCount(st)} / 3`}</text>`;
  // 잇는 선
  g += `<path d="M110 132 L82 84" stroke="${col(d0,st.mmOpen===0)}" stroke-width="${d0?2.6:2}" fill="none"/>`;
  g += `<path d="M210 132 L238 84" stroke="${col(d1,st.mmOpen===1)}" stroke-width="${d1?2.6:2}" fill="none"/>`;
  g += `<path d="M160 160 L160 206" stroke="${col(d2,st.mmOpen===2)}" stroke-width="${d2?2.6:2}" fill="none"/>`;
  // 가지 ㉠ 의미
  g += `<rect x="8" y="14" width="140" height="70" rx="10" fill="${fil(d0,st.mmOpen===0)}" stroke="${col(d0,st.mmOpen===0)}" stroke-width="${st.mmOpen===0?2.8:2}"/>`;
  g += `<text x="78" y="30" font-size="10" fill="${col(d0,st.mmOpen===0)}" text-anchor="middle" font-weight="800">㉠ 의미 ${d0?'✔':''}</text>`;
  if(d0){
    g += `<text x="78" y="48" font-size="8.4" fill="#334155" text-anchor="middle">인구가 모이거나</text>`;
    g += `<text x="78" y="60" font-size="8.4" fill="#334155" text-anchor="middle">흩어져 있는 정도</text>`;
    g += `<text x="78" y="75" font-size="7.8" fill="#276749" text-anchor="middle">인구 = 사는 사람의 수</text>`;
  } else {
    g += `<text x="78" y="52" font-size="8.4" fill="#94A3B8" text-anchor="middle">인구 분포란</text>`;
    g += `<text x="78" y="64" font-size="8.4" fill="#94A3B8" text-anchor="middle">무엇일까요?</text>`;
  }
  // 가지 ㉡ 영향을 주는 환경
  g += `<rect x="172" y="14" width="140" height="70" rx="10" fill="${fil(d1,st.mmOpen===1)}" stroke="${col(d1,st.mmOpen===1)}" stroke-width="${st.mmOpen===1?2.8:2}"/>`;
  g += `<text x="242" y="30" font-size="10" fill="${col(d1,st.mmOpen===1)}" text-anchor="middle" font-weight="800">㉡ 영향을 주는 환경 ${d1?'✔':''}</text>`;
  if(d1){
    g += `<text x="242" y="47" font-size="8.2" fill="#334155" text-anchor="middle">자연환경 — 기후 · 지형</text>`;
    g += `<text x="242" y="60" font-size="8.2" fill="#334155" text-anchor="middle">인문환경 — 일자리 ·</text>`;
    g += `<text x="242" y="72" font-size="8.2" fill="#334155" text-anchor="middle">교통 · 교육</text>`;
  } else {
    const nb = st.mmBub.filter(x=>x!=null).length, ns = st.mmSort.filter(x=>x!=null).length;
    g += `<text x="242" y="50" font-size="8.4" fill="#94A3B8" text-anchor="middle">말풍선 ${nb} / 3</text>`;
    g += `<text x="242" y="64" font-size="8.4" fill="#94A3B8" text-anchor="middle">환경 나누기 ${ns} / 5</text>`;
  }
  // 가지 ㉢ 인구 밀도 — 넓이에 비례한 땅 + 사람 + 격자
  g += `<rect x="30" y="206" width="260" height="68" rx="10" fill="${fil(d2,st.mmOpen===2)}" stroke="${col(d2,st.mmOpen===2)}" stroke-width="${st.mmOpen===2?2.8:2}"/>`;
  g += `<text x="160" y="220" font-size="10" fill="${col(d2,st.mmOpen===2)}" text-anchor="middle" font-weight="800">㉢ 인구 밀도 ${d2?'✔':''}</text>`;
  MM_REG.forEach((r,i)=>{
    const cx = i===0 ? 92 : 224, top = 226, bw = r.box.w, bh = r.box.h*0.52;
    const x0 = cx - bw/2, y0 = top + (28 - bh/2);
    const strk = i===0 ? '#0E7490' : '#64748B', fillc = i===0 ? '#DCF0F5' : '#F1F5F9';
    g += `<rect x="${x0}" y="${y0}" width="${bw}" height="${bh}" fill="${fillc}" stroke="${strk}" stroke-width="1.6"/>`;
    if(st.mmFill>=2){
      for(let k=1;k<4;k++){ g += `<line x1="${x0+bw*k/4}" y1="${y0}" x2="${x0+bw*k/4}" y2="${y0+bh}" stroke="${strk}" stroke-width=".7" opacity=".7"/>`; }
      for(let k=1;k<3;k++){ g += `<line x1="${x0}" y1="${y0+bh*k/3}" x2="${x0+bw}" y2="${y0+bh*k/3}" stroke="${strk}" stroke-width=".7" opacity=".7"/>`; }
    }
    if(st.mmFill>=1){
      const pts = i===0
        ? [[-9,-5],[-3,-5],[3,-5],[9,-5],[-9,5],[-3,5],[3,5],[9,5]]
        : [[-44,-16],[-14,-8],[18,-18],[42,-4],[-32,14],[6,16],[38,18],[-4,-2]];
      pts.forEach(p=>{ g += person(cx+p[0], top+28+p[1], .62, i===0?'#0E7490':'#64748B'); });
    }
    g += `<text x="${cx}" y="${top+50}" font-size="7.6" fill="#334155" text-anchor="middle" font-weight="800">${r.n}</text>`;
    if(st.mmFill>=2){ g += `<text x="${cx}" y="${top+60}" font-size="8.4" fill="${i===0?'#B45309':'#475569'}" text-anchor="middle" font-weight="800">약 ${r.den.toLocaleString('en-US')}명/km²</text>`; }
    else { g += `<text x="${cx}" y="${top+60}" font-size="7.4" fill="#94A3B8" text-anchor="middle">${st.mmFill>=1?'아직 모여 있는 정도를 몰라요':'땅 넓이만 보여요'}</text>`; }
  });
  return `<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* 조작 패널 — 왼쪽 마인드맵, 오른쪽 현재 가지의 과제 */
function mmPanel(st){
  const all = mmAllDone(st);
  const tabs = MM_BRANCH.map((n,b)=>{
    const fin = mmDoneAt(st,b);
    const cls = (fin?'fin':'') + (st.mmOpen===b?' on':'');
    return `<button class="${cls}" onclick="openBranch(${b})">${['㉠','㉡','㉢'][b]} ${n}${fin?' ✔':''}</button>`;
  }).join('');

  let right = '';
  if(all){
    right = `<div class="mm-card"><div class="pt">🌳 마인드맵을 완성했어요</div>
      인구가 모이거나 흩어져 있는 정도가 <b>인구 분포</b>예요. 인구 분포는 <b>기후·지형</b> 같은 자연환경과
      <b>일자리·교통·교육</b> 같은 인문환경에 영향을 받아요. 모여 있는 정도는 1 km² 안에 사는 사람 수인
      <b>인구 밀도</b>로 알 수 있어요.</div>
      <div class="mm-msg">서울특별시는 강원특별자치도보다 면적이 <b>좁지만</b>, 사람이 많이 살고 있어 인구 밀도가 <b>높아요</b>.</div>`;
  } else if(st.mmOpen==null){
    right = `<div class="mm-step">가지를 하나 골라 열어 보세요</div>
      <div class="mm-msg">가운데 <b>인구 분포</b>에서 가지 셋이 뻗어 있어요. <b>어느 가지부터 열어도 괜찮아요.</b>
      셋을 모두 채우면 마인드맵이 완성돼요.</div>`;
  } else if(st.mmOpen===0){
    const fin = mmDoneAt(st,0);
    right = `<div class="mm-step">㉠ 의미 — ${fin?'채웠어요':'인구 분포의 뜻을 골라요'}</div>`;
    right += `<div class="pk-list">` + MM_MEAN.map((m,k)=>{
      let cls = '';
      if(fin && k===st.mmMean) cls='on';
      else if(fin) cls='set';
      if(st.mmWrong===k) cls='no';
      return `<button class="${cls}" onclick="pickMean(${k})">${m.t}</button>`;
    }).join('') + `</div>`;
    if(st.mmMsg) right += `<div class="mm-msg ${st.mmWarn?'warn':''}">${st.mmMsg}</div>`;
  } else if(st.mmOpen===1){
    const bd = mmBubDone(st), sd = mmSortDone(st);
    right = `<div class="mm-step">㉡ ${!bd?'말풍선마다 영향을 준 환경을 이어요':(sd?'채웠어요':'환경을 두 갈래로 나눠요')}</div>`;
    if(!bd || !sd){
      right += `<div class="pk-list">` + MM_BUBS.map((b,i)=>{
        const set = st.mmBub[i]!=null;
        const cls = set ? 'set' : (st.mmBubCur===i ? 'on' : '');
        const tail = set ? ` → <b>${MM_ENVS[st.mmBub[i]].n}</b>` : '';
        return `<button class="${cls}" onclick="pickBub(${i})">${b.t}${tail}</button>`;
      }).join('') + `</div>`;
    }
    if(!bd){
      right += `<div class="env-row">` + MM_ENVS.map((e,k)=>
        `<button class="${st.mmWrong===k?'no':''}" onclick="pickEnv(${k})">${e.n}</button>`).join('') + `</div>`;
    } else {
      right += MM_ENVS.map((e,ci)=>{
        const cur = st.mmSort[ci];
        const btns = MM_BINS.map((bn,bi)=>
          `<button class="${cur===bi?'on':''} ${st.mmWrongChip===ci*10+bi?'no':''}" onclick="sortChip(${ci},${bi})">${bn}</button>`).join('');
        return `<div class="chip-row"><span class="lbl">${ci+1}. ${e.n}</span><span class="chip-btns">${btns}</span></div>`;
      }).join('');
    }
    if(st.mmMsg) right += `<div class="mm-msg ${st.mmWarn?'warn':''}">${st.mmMsg}</div>`;
  } else {
    const fin = mmDoneAt(st,2);
    right = `<div class="mm-step">㉢ ${st.mmFill===0?'사람을 땅 위에 놓아 봐요':(st.mmFill===1?'1 km²로 나누어 봐요':(fin?'채웠어요':'알맞은 문장을 골라요'))}</div>`;
    right += `<button class="stepbtn" ${st.mmFill>=1?'disabled':''} onclick="fillStep()">① 사람을 땅 위에 놓기</button>`;
    right += `<button class="stepbtn" ${st.mmFill!==1?'disabled':''} onclick="fillStep()">② 1 km²로 나누어 보기</button>`;
    if(st.mmFill>=2){
      right += `<div class="pk-list">` + MM_CONC.map((c,k)=>{
        let cls='';
        if(fin && k===st.mmConc) cls='on'; else if(fin) cls='set';
        if(st.mmWrongConc===k) cls='no';
        return `<button class="${cls}" onclick="pickConc(${k})">${c}</button>`;
      }).join('') + `</div>`;
    }
    if(st.mmMsg) right += `<div class="mm-msg ${st.mmWarn?'warn':''}">${st.mmMsg}</div>`;
  }

  return `<div class="mm-wrap">
    <div class="mm-tabs">${tabs}</div>
    <div class="mm-body">
      <div class="mm-canvas">${mmCanvas(st)}<div class="cvcap">가운데 「인구 분포」에서 가지 셋이 뻗어 나가요</div></div>
      <div class="mm-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u2_l05";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  mmOpen:null, mmMean:null,
  mmBub:[null,null,null], mmBubCur:null,
  mmSort:[null,null,null,null,null],
  mmFill:0, mmConc:null,
  mmWrong:null, mmWrongChip:null, mmWrongConc:null, mmMsg:null, mmWarn:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function mmRender(){ main.innerHTML = slides[state.idx].render(state); }
function mmClear(){ state.mmWrong=null; state.mmWrongChip=null; state.mmWrongConc=null; state.mmWarn=false; }

/* 가지 열기 — 비선형(어느 가지부터든 가능) */
function openBranch(b){
  if(mmAllDone(state)) return;                                     // ① 완성 후 전체 잠금
  if(!(Number.isInteger(b) && b>=0 && b<MM_BRANCH.length)) return; // ② 무효 가지 번호(정수만)
  state.mmOpen = b; state.mmMsg=null; state.mmBubCur=null; mmClear();
  playBlip(); mmRender();
}

/* ㉠ 의미 — 3택 */
function pickMean(k){
  if(mmAllDone(state)) return;                                     // ①
  if(state.mmOpen!==0) return;                                     // ③ 열리지 않은 가지 입력 무시
  if(mmDoneAt(state,0)) return;                                    // ④ 이미 완성한 가지 재입력 무시
  if(!(Number.isInteger(k) && k>=0 && k<MM_MEAN.length)) return;   // ②
  if(state.mmWrong!=null) return;                                  // ⑧ 오답 안내 표시 중 재클릭 무시
  if(k===MM_MEAN_OK){
    state.mmMean=k; mmClear();
    state.mmMsg='가지 ㉠을 채웠어요. <b>인구가 모이거나 흩어져 있는 정도</b>가 인구 분포예요.';
    playChime(); mmRender();
    if(mmAllDone(state)) finishMap();
    return;
  }
  state.mmWrong=k; state.mmWarn=true;
  state.mmMsg = MM_MEAN[k].k==='pop'
    ? '그건 <b>인구</b>의 뜻이에요. 인구 분포는 그 인구가 어떻게 퍼져 있는지를 말해요.'
    : '그건 <b>인구 밀도</b>의 뜻이에요. 인구 밀도는 가지 ㉢에서 만나요.';
  playThud(); mmRender();
  setTimeout(()=>{ if(state.mmWrong===k){ mmClear(); state.mmMsg=null; mmRender(); } },1800);
}

/* ㉡-① 말풍선 고르기 */
function pickBub(i){
  if(mmAllDone(state)) return;                                     // ①
  if(state.mmOpen!==1) return;                                     // ③
  if(mmDoneAt(state,1)) return;                                    // ④
  if(!(Number.isInteger(i) && i>=0 && i<MM_BUBS.length)) return;   // ②
  if(state.mmBub[i]!=null) return;                                 // 이미 이은 말풍선은 다시 고르지 않는다
  if(state.mmWrong!=null) return;                                  // ⑧
  state.mmBubCur=i; mmClear();
  state.mmMsg='이 사람이 사는 곳을 정하는 데 영향을 준 <b>환경</b>을 아래에서 골라요.';
  playBlip(); mmRender();
}

/* ㉡-① 환경 지정 */
function pickEnv(k){
  if(mmAllDone(state)) return;                                     // ①
  if(state.mmOpen!==1) return;                                     // ③
  if(mmDoneAt(state,1)) return;                                    // ④
  if(mmBubDone(state)) return;                                     // 말풍선이 다 채워졌으면 이 마디는 끝
  if(!(Number.isInteger(k) && k>=0 && k<MM_ENVS.length)) return;   // ②
  if(state.mmBubCur==null){                                        // ⑦ 말풍선을 고르지 않은 채 환경 지정 무시
    state.mmMsg='먼저 <b>말풍선</b>을 하나 고른 다음 환경을 골라요.'; state.mmWarn=true;
    playThud(); mmRender(); return;
  }
  if(state.mmWrong!=null) return;                                  // ⑧
  const i = state.mmBubCur;
  if(k===MM_BUBS[i].a){
    state.mmBub[i]=k; state.mmBubCur=null; mmClear();
    state.mmMsg = mmBubDone(state)
      ? '세 말풍선을 모두 이었어요. 이제 환경 다섯을 <b>자연환경</b>과 <b>인문환경</b>으로 나눠요.'
      : `<b>${MM_ENVS[k].n}</b>의 영향이에요. 남은 말풍선을 이어요.`;
    if(mmBubDone(state)) playChime(); else playBlip();
    mmRender(); return;
  }
  state.mmWrong=k; state.mmWarn=true;
  state.mmMsg='말풍선을 다시 읽어 봐요. 이 사람이 말한 <b>까닭</b>과 이어지는 환경은 따로 있어요.';
  playThud(); mmRender();
  setTimeout(()=>{ if(state.mmWrong===k){ mmClear(); state.mmMsg=null; mmRender(); } },1800);
}

/* ㉡-② 환경 칩을 자연환경 / 인문환경으로 나누기 */
function sortChip(ci,bi){
  if(mmAllDone(state)) return;                                     // ①
  if(state.mmOpen!==1) return;                                     // ③
  if(mmDoneAt(state,1)) return;                                    // ④
  if(!mmBubDone(state)) return;                                    // ⑤ 말풍선 셋을 다 잇기 전 분류 무시(순서)
  if(!(Number.isInteger(ci) && ci>=0 && ci<MM_ENVS.length)) return;// ②
  if(!(Number.isInteger(bi) && bi>=0 && bi<MM_BINS.length)) return;// ②
  if(state.mmSort[ci]!=null) return;                               // 이미 나눈 칩 재선택 무시
  if(state.mmWrongChip!=null) return;                              // ⑧
  if(bi===MM_ENVS[ci].t){
    state.mmSort[ci]=bi; mmClear();
    state.mmMsg = mmSortDone(state)
      ? '가지 ㉡을 채웠어요. <b>자연환경</b>은 기후·지형, <b>인문환경</b>은 일자리·교통·교육이에요.'
      : `<b>${MM_ENVS[ci].n}</b>은(는) ${MM_BINS[bi]}이에요.`;
    if(mmSortDone(state)) playChime(); else playBlip();
    mmRender();
    if(mmAllDone(state)) finishMap();
    return;
  }
  const key = ci*10+bi;
  state.mmWrongChip=key; state.mmWarn=true;
  state.mmMsg = MM_ENVS[ci].t===0
    ? `<b>${MM_ENVS[ci].n}</b>은(는) 사람이 만든 것이 아니라 <b>자연</b>이 만든 환경이에요.`
    : `<b>${MM_ENVS[ci].n}</b>은(는) <b>사람</b>이 만들어 놓은 환경이에요.`;
  playThud(); mmRender();
  setTimeout(()=>{ if(state.mmWrongChip===key){ mmClear(); state.mmMsg=null; mmRender(); } },1800);
}

/* ㉢-①② 사람 놓기 → 1 km²로 나누기 */
function fillStep(){
  if(mmAllDone(state)) return;                                     // ①
  if(state.mmOpen!==2) return;                                     // ③
  if(mmDoneAt(state,2)) return;                                    // ④
  if(state.mmFill>=2) return;                                      // ⑥ 이미 나눈 뒤에는 무시
  state.mmFill++; mmClear();
  state.mmMsg = state.mmFill===1
    ? '사람을 땅 위에 놓았어요. 그런데 <b>땅 넓이가 서로 달라서</b> 아직 어디에 더 모여 사는지 알기 어려워요.'
    : '<b>1 km²</b> 안에 사는 사람 수로 바꿔 봤어요. 서울특별시는 약 <b>15,506명</b>, 강원특별자치도는 약 <b>91명</b>이에요.';
  if(state.mmFill===2) playChime(); else playBlip();
  mmRender();
}

/* ㉢-③ 결론 — 교과서 p.82 ○표 문장 */
function pickConc(k){
  if(mmAllDone(state)) return;                                     // ①
  if(state.mmOpen!==2) return;                                     // ③
  if(mmDoneAt(state,2)) return;                                    // ④
  if(state.mmFill<2) return;                                       // ⑥ 나누기 전 결론 무시(순서)
  if(!(Number.isInteger(k) && k>=0 && k<MM_CONC.length)) return;   // ②
  if(state.mmWrongConc!=null) return;                              // ⑧
  if(k===MM_CONC_OK){
    state.mmConc=k; mmClear();
    state.mmMsg='가지 ㉢을 채웠어요. 좁은 땅에 사람이 많이 살면 <b>인구 밀도가 높아요</b>.';
    playChime(); mmRender();
    if(mmAllDone(state)) finishMap();
    return;
  }
  state.mmWrongConc=k; state.mmWarn=true;
  state.mmMsg = k===0
    ? '서울특별시는 강원특별자치도보다 면적이 <b>좁아요</b>. 넓이를 다시 봐요.'
    : '땅 넓이와 사는 사람의 수를 함께 보면 <b>1 km² 안의 사람 수</b>로 견줄 수 있어요.';
  playThud(); mmRender();
  setTimeout(()=>{ if(state.mmWrongConc===k){ mmClear(); state.mmMsg=null; mmRender(); } },1800);
}

/* 세 가지가 모두 채워지면 중앙이 완성된다 */
function finishMap(){
  state.mmOpen=null; state.mmBubCur=null; state.mmMsg=null; mmClear();
  playChime(); mmRender();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // ⚠️ l06 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

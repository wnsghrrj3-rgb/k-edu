K-edu 사회 5-1 · 2단원 우리나라 지리 탐구 · 주제① 우리나라의 기후 · 2차시(l02)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사02-01] · 교과서 p.63~67 · 지도서(대단원2 **3~4차시** 우리나라의 계절별 기후 특징을 살펴볼까요, 지도서 p.135~143) 근거
학습 목표: 우리나라의 계절별 기후 특징을 설명할 수 있다.
직접조작: 계절 바람 다이얼(신규 패턴 — 인과 연쇄형)
  ① 계절 두 개(여름·겨울) 가운데 하나를 골라 작업대를 연다.
  ② 그 계절에 바람이 **어디에서** 불어오는지 3택 → 정답이면 국토 도식에 화살표가 실제로 그려진다.
  ③ 그 바람의 **성질** 칩 4개(뜨겁다·차갑다·습하다·건조하다) 중 알맞은 둘을 고른다.
  ④ 둘을 채우면 그 계절이 확정되어 지도 아래 **기온 막대·강수 막대가 그 계절 값으로 자란다**(바람 → 기온·강수 인과 리빌).
  ⑤ 두 계절을 모두 채우면 마지막 종합 3택(“남쪽과 북쪽의 기온 차이가 더 큰 계절은?”)이 열린다 → **겨울**.
  ⚠️ 조작 무대의 기온·강수 표시는 계절 경향을 나타낸 **정성 막대**이며, 구체 수치는 5·6슬(지도서 원문값)에서만 다룬다.
  ⚠️ 가드 6종: 확정 후 전체 잠금 / 계절 미선택 시 출처·성질 클릭 무시(순서) / 확정된 계절 재작업 무시 /
     무효 번호(계절·출처·성질·결론) / 두 계절 완성 전 종합 3택 무시 / 이미 고른 성질 칩 재선택 무시.
지도서 근거:
  [동기 유발] 동요 ‘겨울바람’ — 손과 발을 시리게 하는 차가운 바람 / 여름 바람은 뜨겁고 축축함
    → 계절마다 바람이 불어오는 곳의 환경이 다르기 때문.
  [학습 문제] 우리나라의 계절별 기후 특징을 알아봅시다.
  [전개 1] 계절별 바람의 방향과 성질 — 겨울에는 북서쪽의 육지에서 차갑고 건조한 바람이 불어와 추워지고,
    여름에는 남쪽의 바다에서 뜨겁고 습한 바람이 불어와 더워지고 비가 많이 내린다.
  [스스로 활동①] 일기 예보를 읽고 계절 고르기 — “북서쪽에서 찬 바람이 불어와 기온이 5~10 ℃ 낮아지겠다” → 겨울.
  [전개 2] 계절별 평균 기온 분포 — 등온선은 기온이 같은 곳을 연결한 선.
    여름 평균: 중강진 21.4 ℃ · 서울 24.7 ℃ · 서귀포 24.9 ℃ (중강진↔서귀포 3.5 ℃ 차)
    겨울 평균: 중강진 -12.8 ℃ · 서울 -0.3 ℃ · 서귀포 8.3 ℃ (중강진↔서귀포 21.1 ℃ 차)
    → 핵심 질문: 남쪽과 북쪽의 기온 차이는 **겨울에 더 크다**. 대체로 남쪽으로 갈수록 기온이 높아진다.
  [스스로 활동②] 같은 2월인데 인천은 눈 쌓인 거리, 제주는 무를 수확 →
    제주의 겨울 평균 기온이 인천보다 높아 더 따뜻하기 때문.
  [전개 3] 연 강수량과 계절별 분포 — 파란색이 진할수록 강수량이 많고, 남쪽으로 갈수록 진해진다.
    월별 강수량: 중강진 637.7 mm · 서울 1417.9 mm · 제주 1502.3 mm(연 강수량),
    세 지역 모두 여름에 가장 많고 겨울에 가장 적다. 여름에 연 강수량의 절반 이상이 내린다.
  [전개 4] 계절별 기후 특성과 생활 모습 — 봄: 온화·건조하나 변화가 심함, 농사 시작·꽃놀이 /
    여름: 덥고 비가 잦음, 바다·숲에서 더위 피하기 / 가을: 맑고 건조, 단풍놀이·수확 /
    겨울: 춥고 건조하며 눈, 따뜻한 옷·겨울 스포츠.
  [스스로 활동③] 계절의 영향을 가장 많이 받는 축제 = **눈꽃 축제**(눈이 많이 내리는 겨울에 열기 유리).
    ⚠️ 지도 꿀 Tip — 불꽃 축제는 비가 오면 열 수 없으나 이는 일시적인 기상 현상이므로 **기후가 아니라 날씨의 영향**.
  [꼭 기억해요] 여름 = 남쪽에서 뜨겁고 **습한** 바람 / 겨울 = 북서쪽에서 차갑고 **건조한** 바람.
    “여름에 평균 기온이 높고 겨울에 강수량이 가장 많다” → **✕**(강수량은 여름에 가장 많다).
  차시 예고 = 우리나라에서 발생하는 자연재해와 그 피해를 줄이려는 노력.
⚠️ 설계 원칙:
  · 지도서 유의점 — “내륙과 해안, 산지와 평야 등 지형에 따른 세부적인 기온 차이는 성취기준을 벗어난 내용”
    / “지역별 강수량의 차이를 지나치게 깊게 다루지 않도록 유의” / “지역별 기후 특성으로 학습 범위를 확대하지 않고
    각 분포도에서 알 수 있는 **공통적인 사실을 일반화**하는 데 중점” → 지역 고유의 기후 설명 0.
  · 위 유의점에 따라 대구(지형 영향으로 서귀포보다 여름 기온이 높은 예외)는 화면에 넣지 않았다.
    중강진·서울·서귀포(기온) / 중강진·서울·제주(강수)만 사용 — 모두 지도서 원문값이며 남북 경향이 일관된다.
  · 자연재해·기후변화(5~8차시) 선행 침범 0, 인구 분포(주제②) 침범 0.
  · 계절풍이라는 학술 용어 대신 “계절에 따라 불어오는 바람”으로 서술(교과서 표현 준수).
  · 적용 3번은 [스스로 활동③] 그대로 — 불꽃 축제를 오답지에 두어 ‘날씨 ↔ 기후’ 구분(l01)을 한 번 더 친다.
⚠️ l01 → l02 소프트체인 · l02 → l03 소프트체인(2026-08-04 재배선).
-->

<title>우리나라의 계절별 기후 특징을 살펴볼까요 · 사회 5-1</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#0E7490; --green-d:#0C4A6E; --cyan:#276749;
  --bg:#F1F8FA; --bub:#DCF0F5; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#B45309; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:var(--bub);color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.scene.wide{width:clamp(240px,44vw,420px)}
.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F5FBFC;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 계절 바람 다이얼(인과 연쇄형) */
.dw-wrap{width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dw-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.dw-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dw-canvas svg{width:100%;height:auto;display:block}
.dw-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.dw-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.dw-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.dw-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.sn-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sn-row button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 4px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--ink);font-size:clamp(10.5px,1.8vw,13px);transition:.15s}
.sn-row button:hover{border-color:var(--green);background:var(--bub)}
.sn-row button.on{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.sn-row button.fin{border-color:var(--cyan);background:#DFF0E7;color:#1C4D35;cursor:default}
.wd-list{display:flex;flex-direction:column;gap:5px}
.wd-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.4px,1.78vw,12.8px);text-align:left;transition:.15s}
.wd-list button:hover{border-color:var(--green);background:var(--bub)}
.wd-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pr-grid button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 3px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.4px,1.78vw,12.8px);transition:.15s}
.pr-grid button:hover{border-color:var(--green);background:var(--bub)}
.pr-grid button.got{border-color:var(--green);background:var(--bub);color:var(--green-d);cursor:default}
.pr-grid button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.wd-conc{display:flex;flex-direction:column;gap:5px}
.wd-conc button{border:2px solid var(--cyan);background:#fff;color:#1C4D35;border-radius:10px;padding:7px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left}
.wd-conc button:hover{background:#DFF0E7}
.wd-conc button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.paper .src{margin-top:6px;font-size:clamp(11px,1.9vw,13px);color:#8A6D3B;text-align:right}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(14,116,144,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}

/* ===== 직접조작 — 계절 바람 다이얼(신규 패턴 — 인과 연쇄형) =====
   계절 → 바람이 불어오는 곳 → 바람의 성질 → 그 계절의 기온·강수가 자란다(인과).
   두 계절을 모두 채우면 남북 기온 차이가 더 큰 계절을 묻는 종합 3택이 열린다.
   ⚠️ 무대의 기온·강수 막대는 계절 경향을 나타낸 정성 표시이며, 수치는 5·6슬에서만 다룬다. */
const WD_SEASON  = ['여름','겨울'];
const WD_FROM    = ['북서쪽 육지에서','남쪽 바다에서','동쪽 하늘 높은 곳에서'];
const WD_FROM_OK = [1, 0];                       // 여름 = 남쪽 바다 / 겨울 = 북서쪽 육지
const WD_PROP    = ['뜨겁다','차갑다','습하다','건조하다'];
const WD_PROP_OK = [[0,2], [1,3]];               // 여름 = 뜨겁고 습함 / 겨울 = 차갑고 건조함
const WD_RESULT  = [
  {t:'높아요', r:'많아요', th:38, rh:38, tc:'#DC2626', rc:'#1D4ED8'},
  {t:'낮아요', r:'적어요', th:8,  rh:7,  tc:'#60A5FA', rc:'#93C5FD'}
];
const WD_WHEN    = ['여름', '겨울', '두 계절이 똑같다'];
const WD_WHEN_OK = 1;

function wdDone(st,i){ return st.wdFrom[i]!=null && st.wdProp[i].length===2; }
function wdAll(st){ return wdDone(st,0) && wdDone(st,1); }

function wdCanvas(st){
  let arrows = '';
  if(wdDone(st,1)){
    arrows += `<path d="M16 20 L58 56" stroke="#1D4ED8" stroke-width="3.4" stroke-linecap="round" marker-end="url(#wa1)"/>`;
    arrows += `<path d="M32 12 L74 48" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#wa1)"/>`;
    arrows += `<text x="14" y="72" font-size="9.5" fill="#1D4ED8" font-weight="800">겨울 · 차갑고 건조</text>`;
  }
  if(wdDone(st,0)){
    arrows += `<path d="M300 140 L256 104" stroke="#DC2626" stroke-width="3.4" stroke-linecap="round" marker-end="url(#wa2)"/>`;
    arrows += `<path d="M280 152 L236 118" stroke="#F87171" stroke-width="3" stroke-linecap="round" marker-end="url(#wa2)"/>`;
    arrows += `<text x="212" y="146" font-size="9.5" fill="#DC2626" font-weight="800">여름 · 뜨겁고 습함</text>`;
  }

  let bars = '';
  for(let i=0;i<2;i++){
    const x = 22 + i*152, R = WD_RESULT[i], on = wdDone(st,i);
    bars += `<rect x="${x}" y="168" width="132" height="62" rx="9" fill="${on?'#F8FAFC':'#FBFDFE'}" stroke="${on?'#0E7490':'#E2E8F0'}" stroke-width="1.6" ${on?'':'stroke-dasharray="4 3"'}/>`;
    bars += `<text x="${x+66}" y="182" font-size="10" text-anchor="middle" font-weight="800" fill="${on?'#0C4A6E':'#94A3B8'}">${WD_SEASON[i]}</text>`;
    if(on){
      bars += `<text x="${x+30}" y="224" font-size="9" text-anchor="middle" fill="#B45309" font-weight="800">기온</text>`;
      bars += `<rect x="${x+20}" y="${214-R.th}" width="20" height="${R.th}" rx="4" fill="${R.tc}"/>`;
      bars += `<text x="${x+30}" y="${208-R.th}" font-size="8.5" text-anchor="middle" fill="#334155" font-weight="800">${R.t}</text>`;
      bars += `<text x="${x+96}" y="224" font-size="9" text-anchor="middle" fill="#0E7490" font-weight="800">강수</text>`;
      bars += `<rect x="${x+86}" y="${214-R.rh}" width="20" height="${R.rh}" rx="4" fill="${R.rc}"/>`;
      bars += `<text x="${x+96}" y="${208-R.rh}" font-size="8.5" text-anchor="middle" fill="#334155" font-weight="800">${R.r}</text>`;
    } else {
      bars += `<text x="${x+66}" y="206" font-size="9.5" text-anchor="middle" fill="#94A3B8">아직 비어 있어요</text>`;
    }
    bars += `<line x1="${x+10}" y1="214" x2="${x+122}" y2="214" stroke="#CBD5E0" stroke-width="1.2"/>`;
  }

  return `<svg viewBox="0 0 320 240"><rect width="320" height="240" fill="#ffffff"/>
    <g transform="translate(100,8) scale(1.14)">
      <path d="${KPATH}" fill="#E6EFE4" stroke="#94A3B8" stroke-width="1.6"/>
      <path d="${JEJU}" fill="#E6EFE4" stroke="#94A3B8" stroke-width="1.4"/>
    </g>
    ${arrows}${bars}
    <defs>
      <marker id="wa1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1D4ED8"/></marker>
      <marker id="wa2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    </defs></svg>`;
}

function wdPanel(st){
  const fixed = st.wdWhen != null;
  const all = wdAll(st);
  const cur = st.wdSea;
  let right = '';
  const cnt = (wdDone(st,0)?1:0) + (wdDone(st,1)?1:0);
  right += `<div class="dw-step">🌬️ 채운 계절 ${cnt} / 2</div>`;

  if(fixed){
    right += `<div class="dw-card"><div class="pt">🌤️ 계절별 기후 특징을 찾았어요</div>
      <div><b>여름</b>에는 남쪽 바다에서 뜨겁고 습한 바람이 불어와 <b>기온이 높고 비가 많이</b> 내려요.
      <b>겨울</b>에는 북서쪽 육지에서 차갑고 건조한 바람이 불어와 <b>기온이 낮고 비가 적어요</b>.</div>
      <div style="margin-top:5px">남쪽과 북쪽의 기온 차이는 <b style="color:#0E7490">겨울</b>에 더 커요.
      여름에는 남북이 모두 더워 차이가 작지만, 겨울에는 북쪽만 크게 추워지기 때문이에요.</div></div>`;
  } else if(all){
    right += `<div class="dw-msg">두 계절을 모두 채웠어요. 바람이 기온과 강수를 어떻게 바꾸었는지 보이나요?</div>`;
    right += `<div class="dw-step">🔎 남쪽과 북쪽의 기온 차이가 더 큰 계절은 언제일까요?</div>`;
    right += `<div class="wd-conc">${WD_WHEN.map((o,k)=>
      `<button class="${st.wdWrongWhen===k?'no':''}" onclick="pickWhen(${k})">${o}</button>`).join('')}</div>`;
  } else {
    right += `<div class="sn-row">${WD_SEASON.map((s,i)=>{
      const cls = wdDone(st,i) ? 'fin' : (cur===i ? 'on' : '');
      return `<button class="${cls}" onclick="pickSeason(${i})">${s}${wdDone(st,i)?' ✓':''}</button>`;
    }).join('')}</div>`;

    if(cur==null){
      right += `<div class="dw-msg">먼저 알아볼 <b>계절</b>을 골라요.</div>`;
    } else if(st.wdFrom[cur]==null){
      right += `<div class="dw-step">① ${WD_SEASON[cur]}에는 바람이 어디에서 불어올까요?</div>`;
      right += `<div class="wd-list">${WD_FROM.map((o,k)=>
        `<button class="${st.wdWrongFrom===k?'no':''}" onclick="pickFrom(${k})">${o}</button>`).join('')}</div>`;
    } else {
      right += `<div class="dw-step">② 그 바람은 어떤 성질일까요? <b>둘</b>을 골라요 (${st.wdProp[cur].length}/2)</div>`;
      right += `<div class="pr-grid">${WD_PROP.map((o,k)=>{
        const got = st.wdProp[cur].indexOf(k)>=0;
        return `<button class="${got?'got':(st.wdWrongProp===k?'no':'')}" onclick="pickProp(${k})">${o}${got?' ✓':''}</button>`;
      }).join('')}</div>`;
    }
  }
  if(st.wdMsg) right += `<div class="dw-msg${st.wdWarn?' warn':''}">${st.wdMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🌬️ 계절을 골라 바람을 따라가 봐요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${wdCanvas(st)}<div class="cvcap">바람이 정해지면 그 계절의 기온·강수가 함께 정해지는 무대예요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

const LS_KEY = "kedu_progress_g5_social_u2_l02";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  wdSea:null, wdFrom:[null,null], wdProp:[[],[]], wdWhen:null,
  wdWrongFrom:null, wdWrongProp:null, wdWrongWhen:null, wdMsg:null, wdWarn:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function wdRender(){ main.innerHTML = slides[state.idx].render(state); }

/* 계절 고르기 */
function pickSeason(i){
  if(state.wdWhen!=null) return;                                   // ① 확정 후 전체 잠금
  if(!(i>=0 && i<WD_SEASON.length)) return;                        // ④ 무효 계절 번호
  if(wdDone(state,i)){                                             // ③ 이미 채운 계절 재작업 무시
    state.wdMsg = `<b>${WD_SEASON[i]}</b>은(는) 이미 다 채웠어요.`; state.wdWarn = true;
    playThud(); wdRender(); return;
  }
  state.wdSea = i; state.wdMsg = null; state.wdWarn = false;
  state.wdWrongFrom = null; state.wdWrongProp = null;
  playBlip(); wdRender();
}

/* ① 바람이 불어오는 곳 */
function pickFrom(k){
  if(state.wdWhen!=null) return;                                   // 확정 후 잠금
  if(state.wdSea==null) return;                                    // ② 계절 미선택 순서 가드
  if(!(k>=0 && k<WD_FROM.length)) return;                          // ④ 무효 번호
  const i = state.wdSea;
  if(state.wdFrom[i]!=null) return;                                // 이미 정한 단계
  if(k===WD_FROM_OK[i]){
    state.wdFrom[i] = k; state.wdWrongFrom = null; state.wdWarn = false;
    state.wdMsg = `<b>${WD_SEASON[i]}</b>에는 ${WD_FROM[k]} 바람이 불어와요. 이제 그 바람의 성질을 골라요.`;
    playBlip(); wdRender(); return;
  }
  state.wdWrongFrom = k; state.wdWarn = true;
  state.wdMsg = k===2
    ? '바람은 하늘 높은 곳이 아니라 <b>땅이나 바다</b>를 지나 불어와요.'
    : `${WD_SEASON[i]}에 불어오는 바람이 맞는지 다시 생각해 봐요.`;
  playThud(); wdRender();
  setTimeout(()=>{ if(state.wdWrongFrom===k){ state.wdWrongFrom=null; state.wdMsg=null; state.wdWarn=false; wdRender(); } },1600);
}

/* ② 바람의 성질 두 가지 */
function pickProp(k){
  if(state.wdWhen!=null) return;                                   // 확정 후 잠금
  if(state.wdSea==null) return;                                    // ② 계절 미선택 순서 가드
  if(!(k>=0 && k<WD_PROP.length)) return;                          // ④ 무효 번호
  const i = state.wdSea;
  if(state.wdFrom[i]==null){                                       // 단계 순서 가드
    state.wdMsg = '먼저 바람이 <b>어디에서</b> 불어오는지 정해요.'; state.wdWarn = true;
    playThud(); wdRender(); return;
  }
  if(state.wdProp[i].indexOf(k)>=0) return;                        // ⑥ 이미 고른 칩 재선택 무시
  if(WD_PROP_OK[i].indexOf(k)>=0){
    state.wdProp[i].push(k); state.wdWrongProp = null; state.wdWarn = false;
    if(state.wdProp[i].length>=2){
      const R = WD_RESULT[i];
      state.wdMsg = `<b>${WD_SEASON[i]}</b> 완성! 이 바람 때문에 ${WD_SEASON[i]}에는 기온이 <b>${R.t}</b> 강수량이 <b>${R.r}</b>.`;
      state.wdSea = null;
      playChime();
    } else {
      state.wdMsg = `‘${WD_PROP[k]}’ 좋아요. 하나 더 골라요.`;
      playBlip();
    }
    wdRender(); return;
  }
  state.wdWrongProp = k; state.wdWarn = true;
  state.wdMsg = `‘${WD_PROP[k]}’은(는) ${WD_SEASON[i]}에 불어오는 바람의 성질이 아니에요.`;
  playThud(); wdRender();
  setTimeout(()=>{ if(state.wdWrongProp===k){ state.wdWrongProp=null; state.wdMsg=null; state.wdWarn=false; wdRender(); } },1600);
}

/* ③ 종합 — 남북 기온 차이가 더 큰 계절 */
function pickWhen(k){
  if(state.wdWhen!=null) return;                                   // 확정 후 잠금
  if(!wdAll(state)) return;                                        // ⑤ 두 계절 완성 전 무시
  if(!(k>=0 && k<WD_WHEN.length)) return;                          // ④ 무효 번호
  if(k===WD_WHEN_OK){
    state.wdWhen = k; state.wdWrongWhen = null; state.wdMsg = null; state.wdWarn = false;
    playChime(); wdRender(); return;
  }
  state.wdWrongWhen = k; state.wdWarn = true;
  state.wdMsg = k===0
    ? '여름에는 남쪽도 북쪽도 모두 더워서 차이가 <b>작아요</b>. 다시 골라 봐요.'
    : '두 계절의 차이는 같지 않아요. 한쪽이 훨씬 큽니다.';
  playThud(); wdRender();
  setTimeout(()=>{ if(state.wdWrongWhen===k){ state.wdWrongWhen=null; state.wdMsg=null; state.wdWarn=false; wdRender(); } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u2_l03_자연재해.html'; } // l02 → l03 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

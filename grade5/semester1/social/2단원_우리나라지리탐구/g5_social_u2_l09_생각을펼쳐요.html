K-edu 사회 5-1 · 2단원 우리나라 지리 탐구 · 주제② 우리나라의 인구 분포 · 9차시(l09) [생각을 펼쳐요]
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사02-01]·[6사02-02] 통합 적용 · 교과서 p.98~99 · 지도서(대단원2 **15차시** 생각을 펼쳐요, 지도서 p.208~209) 근거
학습 목표: ‘우리나라 지리 탐구’에서 공부한 내용을 바탕으로 창의·융합 활동을 할 수 있다.
융합 교과: 사회 · 국어 · 미술 / 핵심 역량: 창의적 사고력 · 정보 활용 능력
직접조작: 동시 짓는 책상(신규 패턴 — 초고·퇴고 2회전형)
  ⭐ 지금까지 스물세 종의 조작은 **누를 때마다 그 자리에서 곧바로 옳고 그름이 판가름**났다
     (잇기·쌓기·환산·대조·고리·잣대 모두 그렇다). 이번만 다르다 —
     **초고를 쓸 때는 아무 줄이나 받아 준다.** 판정이 뒤로 미뤄진다.
     네 줄을 다 채우고 「다시 읽어 보기」를 눌러야 그제서야 판이 **네 줄을 한꺼번에 훑어**
     걸리는 줄만 짚는다. 그리고 **통과한 줄은 잠긴 채 남고 짚인 줄만 바꾼다** —
     처음으로 조작이 “다 만든 것을 통째로 다시 보고 **일부만 고치는**” 구조다.
     지도서 유의점(“지은 동시를 **다시 읽어 보며** 이야기로 쓴 내용이 잘 나타나도록 **고칩니다**”)이
     안내 문구가 아니라 **조작의 두 번째 회전** 자체가 된다.
  ① 주제 고르기 — 교과서 보기 그대로. **정답 없음**(학생이 표현하고 싶은 것을 고른다).
     고르면 왼쪽 원고 위쪽에 그 주제의 **이야기**(교과서 2번 결과물)가 함께 열린다.
  ② 초고 — 줄 후보 일곱 장을 눌러 **위에서부터 차례로** 네 줄을 채운다. 여기서는 **막지 않는다**.
  ③ 퇴고 — 「다시 읽어 보기」를 누르면 **세 가지 사유**로 걸린 줄을 짚는다.
     ㉠ 이야기에 없는 이야기예요(내가 겪은 일에서 나온 줄이어야 해요)
     ㉡ 이야기를 줄이지 않고 그대로 옮겼어요(동시는 짧게 줄여서 써요)
     ㉢ 무엇을 공부했는지 드러나지 않아요(고른 주제가 보이게 써요)
     ⚠️ 주제마다 걸리는 줄이 ㉠㉡㉢ **하나씩** + 통과 네 장으로 배치돼 있다 — 세 사유가 전부 한 번씩 일한다.
     짚인 줄은 후보 목록에서 잠기고, **짚인 자리만** 새 줄로 바꾼다. 통과한 줄은 건드릴 수 없다.
  ④ 시화 — 네 줄이 모두 통과하면 **동시와 어울리는 그림 3택**이 열린다.
     오답 둘은 각각 “예쁘지만 이 동시와 상관없는 장면” / “주제는 맞지만 이 동시가 말하지 않은 장면”이다.
  ⚠️ 가드 8종: 시화 확정 후 전체 잠금 / 무효 주제·줄·시화 번호(`Number.isInteger`) /
     주제를 고르기 전 줄 클릭 무시(순서 강제) / 이미 놓인 줄 재클릭 무시 · 짚혀 잠긴 줄 재사용 무시 /
     네 줄 미완성 시 「다시 읽어 보기」 무시(순서 강제) / 짚인 줄이 남아 있는 동안 재검 무시(고치기 먼저) /
     네 줄이 통과하기 전 시화 무시(순서 강제) / 안내 표시 중 재클릭 무시. 재시도 허용(감점 없음).
  ⚠️ 확정 전에는 **다른 주제로 바꿔** 처음부터 다시 쓸 수 있다(바꾸면 그 주제의 원고가 지워진다).
  ⚠️ 정직 원칙: 이 차시의 진짜 활동은 **학생이 종이에 자기 동시를 짓고 시화를 그리는 일**이다.
     자기주도 파일은 **동시를 짓는 차례와 고쳐 쓰는 눈**을 겪게 하는 데까지만 하고,
     화면에서 고른 줄이 학생의 동시를 대신하지 않는다는 것을 조작 완료 안내에 명시한다.
     ⚠️ **줄의 차례**는 조작에서 판정하지 않는다 — 동시의 차례는 정답이 하나가 아니기 때문이다.
     후보 목록을 이야기 차례대로 두어 자연스럽게 익히게 하고, 지도서 유의점(“글의 순서를 잘 생각하며”)은
     **적용 4번 문항**으로 한 번 짚는다. 교실 활동(모둠에서 시화 바꿔 보기)도 결과를 앞질러 주지 않는다.
지도서 근거(15차시 p.208~209):
  [동기 유발] ‘우리나라 지리 탐구’에서 공부한 내용은 무엇인가요? →
    우리나라 기후의 특징 / 우리나라에서 발생하는 자연재해와 그에 대비하는 노력 /
    기후변화로 심해지는 자연재해와 이에 대응하는 기후 행동 / 우리나라 인구 분포의 특징 /
    인구 분포의 불균형으로 나타나는 문제와 해결 방법.
  [학습 문제] 단원에서 공부한 내용을 바탕으로 창의·융합 활동을 해 봅시다.
  [활동 1 · 교과서 p.98] 동시로 만들어 꾸미고 싶은 **주제를 선택**한다. 보기 =
    우리나라 기후의 특징 / 자연재해에 대비하기 위한 노력 / 기후변화에 대응하는 기후 행동 /
    우리나라 인구 분포의 특징 / 우리나라 인구 분포의 불균형 / (직접 정하기).
  [활동 2 · p.98] 선택한 주제와 관련한 **경험이나 생각**을 정리해 **이야기로 쓴다**.
    유의점 = 주제에 대한 **내 생각과 경험**이 잘 드러나게 / 주제에서 **공부한 내용**이 잘 드러나게 /
    **글의 순서**를 잘 생각하며 쓴다.
    교과서 예시(주제 = 우리나라 인구 분포의 불균형) 원문을 그대로 이식했다.
  [활동 3 · p.99] 이야기를 바탕으로 **동시를 짓고 그림을 그려 꾸민다**(준비물 = 색칠 도구).
    동시 유의점 = 자기 **생각·경험·느낌**이 잘 드러나게 / **운율**을 잘 표현 /
    **다시 읽어 보며 이야기로 쓴 내용이 잘 나타나도록 고친다**.
    그림 유의점 = **동시의 내용을 잘 나타내는 장면**을 그린다.
    교과서 예시 시화(운동장 요일제)와 지도서 예시 답안 시화(노란 손수건) 원문을 그대로 이식했다.
  [정리] 친구들이 만든 시화를 **바꿔 보며 느낀 점**을 발표한다. 차시 예고 = 단원 마무리.
⚠️ 설계 원칙:
  · **10차시(단원 마무리) 선행 침범 0** — 생각 그물·교실 놀이·낱말 보기 상자는 0.
  · 교사용 참고 자료(참고 도서, 폐교 재활용 미술관 읽기 자료, 청년 마을 지원 금액·개수,
    고향 사랑 기부제 금액·공제율)는 성취기준 밖이므로 0.
  · **지역 이름 0.** 문항 내 연도·금액·수치 0.
  · 회수 — 기후·날씨·기온·강수·바람(l01~l02) / 자연재해·기상 특보·국민 행동 요령(l03) /
    기후변화·기후 행동(l04) / 인구 분포·인구 밀도(l05~l06) / 불균형·수도권·비수도권(l07~l08)은
    앞 차시에서 배운 낱말이라 되받아 쓴다.
  · 정서 — 잘 지은 동시와 못 지은 동시를 가르지 않는다. 걸린 줄도 “틀린 줄”이 아니라
    **이 이야기에서 나오지 않은 줄**로만 말한다.
⚠️ l08 → l09 소프트체인 · goNextLesson = l10 「2단원 마무리」.

@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);

  color:var(--muted);font-weight:700;background:#F8FAFC}
.pm-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.pm-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.pm-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.pm-msg.warn{border-left-color:var(--red)}
.pm-msg b{color:var(--green)}
.pm-story{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:10px;padding:8px 11px;
  font-size:clamp(10.6px,1.8vw,12.8px);line-height:1.55;color:#3F3A2C;max-height:104px;overflow-y:auto}
.pm-story .sh{font-weight:800;color:#8A6D3B;margin-bottom:3px;font-size:clamp(10.4px,1.76vw,12.4px)}
.pm-list{display:flex;flex-direction:column;gap:5px}
.pm-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.4px,1.77vw,12.8px);
  text-align:left;transition:.15s;line-height:1.4}
.pm-list button:hover{border-color:var(--green);background:var(--bub)}
.pm-list button.used{opacity:.45;border-style:dashed;cursor:default;background:#F8FAFC}
.pm-list button.out{opacity:.5;border-style:dashed;cursor:default;text-decoration:line-through}
.pm-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.pm-review{border:2px solid var(--amber);background:#FFF8E1;color:var(--amber);border-radius:10px;
  padding:9px 10px;cursor:pointer;font-family:inherit;font-weight:800;
  font-size:clamp(10.6px,1.8vw,12.8px);transition:.15s}
.pm-review:hover:not(:disabled){background:#FDECC8}
.pm-review:disabled{opacity:.42;cursor:default;border-style:dashed}
.pm-flag{background:#FEE2E2;border:2px solid var(--red);border-radius:10px;padding:8px 11px;
  font-size:clamp(10.6px,1.8vw,12.8px);line-height:1.5;color:#991B1B;animation:fadeUp .3s ease both}
.pm-flag .fl{font-weight:800;color:#B91C1C}
.pm-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.pm-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.pm-gauge{display:flex;align-items:center;gap:5px}
.pm-gauge .dot{width:15px;height:15px;border-radius:50%;border:2px solid #CBD5E0;background:#fff}
.pm-gauge .dot.on{border-color:var(--green);background:var(--green)}
.pm-gauge .dot.bad{border-color:var(--red);background:#FEE2E2}
.pm-gauge .tx{font-size:clamp(10px,1.7vw,12.4px);font-weight:800;color:#475569;margin-left:3px}
.pm-q{font-size:clamp(11.4px,1.93vw,13.8px);font-weight:800;color:var(--green-d);line-height:1.5;padding:0 2px}
.pm-stamp{display:inline-flex;align-items:center;gap:4px;font-size:clamp(9.6px,1.62vw,11.6px);font-weight:800;
  color:#1C4D35;background:#F0FDF4;border:1px solid #9BC7AE;border-radius:7px;padding:3px 7px;align-self:flex-start}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.poem{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 18px;

  animation:fadeUp .4s ease both}
.poem .pt{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13.5px,2.3vw,17px)}
.tipbox{background:#E0F2FE;border-radius:12px;padding:10px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#0C4A6E;max-width:660px;border-left:4px solid #0369A1}
@media(max-width:620px){ .pm-body{grid-template-columns:1fr} }

.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}

   교과서 예시 시화(운동장 요일제)와 지도서 예시 시화(노란 손수건)의 글은 원문 그대로 옮겼고,
   그림 자리는 도식으로만 나타낸다 — 그려야 할 그림을 앞질러 보여 주지 않는다.
   ⚠️ 지역 이름은 쓰지 않는다. 학생 이름도 쓰지 않는다. */

/* 사람 도형 */
function figure(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <circle cx="0" cy="-6" r="3.4" fill="${col}"/>
    <path d="M-4.2 6 q0 -7 4.2 -7 q4.2 0 4.2 7 Z" fill="${col}"/></g>`;
}
/* 집 도형 */
function roof(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-9 0 L0 -8 L9 0 Z" fill="${col}"/>
    <rect x="-6.4" y="0" width="12.8" height="9" fill="${col}" opacity=".75"/></g>`;
}
/* 건물 도형 */
function block(x,y,w,h,col){
  let win="";
  for(let r=0;r<Math.floor(h/9);r++){ for(let c=0;c<Math.floor(w/7);c++){
    win += `<rect x="${x+3+c*7}" y="${y-h+5+r*9}" width="3.4" height="4.4" fill="#ffffff" opacity=".72"/>`; } }
  return `<g><rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="1.6" fill="${col}"/>${win}</g>`;
}
/* 이름표 상자 */
function plate(x,y,w,h,txt,fs,bg,st,tc){
  const lines = txt.split('|');
  let t='';
  lines.forEach((ln,i)=>{ t += `<text x="${x+w/2}" y="${y+(h-(lines.length-1)*(fs+2))/2+fs*0.36+i*(fs+2)}" font-size="${fs}" fill="${tc}" text-anchor="middle" font-weight="700">${ln}</text>`; });
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${bg}" stroke="${st}" stroke-width="1.4"/>${t}</g>`;
}

/* 상태 판정 헬퍼 */
function pmTopicSet(st){ return st.pmTopic!=null; }
function pmTopicObj(st){ return pmTopicSet(st) ? PM_TOPICS[st.pmTopic] : null; }
function pmFilled(st){ return st.pmRows.every(x=>x!=null); }
function pmHasFlag(st){ return st.pmFlags.some(x=>x!=null); }
function pmPassed(st){ return st.pmPass===true; }
function pmAllDone(st){ return pmPassed(st) && st.pmPic!=null; }
function pmOutList(st){ return pmTopicSet(st) ? st.pmOut[st.pmTopic] : []; }
function pmRowState(st,i){
  if(st.pmRows[i]==null) return 'empty';
  if(st.pmFlags[i]!=null) return 'bad';
  if(st.pmOkR[i]) return 'ok';
  return 'draft';
}
/* 캔버스 폭에 맞춰 줄을 최대 두 도막으로 나눈다 — 넘치면 말줄임 */
function pmWrap(t){
  const LIM=17;
  if(t.length<=LIM) return [t];
  let cut=t.lastIndexOf(' ',LIM); if(cut<6) cut=LIM;
  const a=t.slice(0,cut).trim();
  let b=t.slice(cut).trim();
  if(b.length>LIM) b=b.slice(0,LIM-1)+'…';
  return [a,b];
}

/* 원고 캔버스 — 제목 · 네 줄 · 그림 칸 */
function pmCanvas(st){
  const T = pmTopicObj(st);
  const head = T
    ? `<rect x="12" y="6" width="200" height="21" rx="7" fill="#FFFDF5" stroke="#B45309" stroke-width="1.8"/>
       <text x="112" y="20" font-size="9" fill="#8A6D3B" text-anchor="middle" font-weight="800">${T.title}</text>`
    : `<rect x="12" y="6" width="200" height="21" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/>
       <text x="112" y="20" font-size="8.6" fill="#94A3B8" text-anchor="middle" font-weight="800">? 어떤 주제로 지어 볼까요</text>`;

  const rows = [0,1,2,3].map(i=>{
    const y = 32 + i*27;
    const s = pmRowState(st,i);
    const fill = s==='ok' ? '#F0FDF4' : s==='bad' ? '#FEE2E2' : s==='draft' ? '#DCF0F5' : '#F8FAFC';
    const stk  = s==='ok' ? '#3F9169' : s==='bad' ? '#DC2626' : s==='draft' ? '#0E7490' : '#94A3B8';
    const dash = s==='empty' ? ' stroke-dasharray="4 3"' : '';
    const box = `<rect x="12" y="${y}" width="200" height="24" rx="6" fill="${fill}" stroke="${stk}" stroke-width="1.6"${dash}/>`;
    const num = `<text x="6" y="${y+16}" font-size="7.6" fill="#94A3B8" font-weight="800">${i+1}</text>`;
    if(s==='empty'){
      return `${num}${box}<text x="112" y="${y+16}" font-size="8" fill="#94A3B8" text-anchor="middle" font-weight="700">${i+1}번째 줄이 비어 있어요</text>`;
    }
    const L = pmTopicObj(st).lines[st.pmRows[i]];
    const parts = pmWrap(L.t);
    const tc = s==='ok' ? '#1C4D35' : s==='bad' ? '#991B1B' : '#0C4A6E';
    const txt = parts.map((p,k)=>`<text x="112" y="${parts.length===1?y+16:y+11+k*10}" font-size="7.4" fill="${tc}" text-anchor="middle" font-weight="700">${p}</text>`).join("");
    const wave = s==='bad'
      ? `<path d="M28 ${y+21} q6 -3 12 0 q6 3 12 0 q6 -3 12 0 q6 3 12 0 q6 -3 12 0 q6 3 12 0 q6 -3 12 0 q6 3 12 0 q6 -3 12 0 q6 3 12 0 q6 -3 12 0 q6 3 12 0 q6 -3 12 0" stroke="#DC2626" stroke-width="1.2" fill="none"/>
         <text x="203" y="${y+10}" font-size="8" fill="#DC2626" font-weight="800">✎</text>`
      : '';
    const check = s==='ok' ? `<path d="M199 ${y+10} L202 ${y+14} L208 ${y+6}" stroke="#3F9169" stroke-width="2" fill="none" stroke-linecap="round"/>` : '';
    return `${num}${box}${txt}${wave}${check}`;
  }).join("");

  const pic = st.pmPic!=null
    ? `<rect x="12" y="142" width="200" height="40" rx="8" fill="#ffffff" stroke="#3F9169" stroke-width="2"/>
       <text x="112" y="156" font-size="7.8" fill="#3F9169" text-anchor="middle" font-weight="800">시화 · 함께 그릴 장면</text>
       ${pmWrap(pmTopicObj(st).pic.opts[st.pmPic]).map((p,k)=>`<text x="112" y="${168+k*10}" font-size="7.4" fill="#1C4D35" text-anchor="middle" font-weight="700">${p}</text>`).join("")}`
    : (pmPassed(st)

/* 조작 패널 — 왼쪽 원고, 오른쪽 지금 할 일 */
function pmPanel(st){
  const T = pmTopicObj(st);
  const out = pmOutList(st);

  const tags = PM_TOPICS.map((p,i)=>`<span class="tag ${st.pmTopic===i?'on':''}">${p.short}</span>`).join("");
  const head = `<div class="pm-head">${tags}${(pmTopicSet(st)&&!pmAllDone(st))?`<button class="swap" onclick="swapTopic()">다른 주제로 바꾸기</button>`:''}</div>`;

  const storyBox = T ? `<div class="pm-story"><div class="sh">내가 쓴 이야기 · ${T.theme}</div>${T.story}</div>` : '';

  const lineList = (T)=>T.lines.map((L,k)=>{
    const used = st.pmRows.indexOf(k)>=0;
    const dead = out.indexOf(k)>=0;
    const cls = dead ? 'out' : (used ? 'used' : '');
    return `<button class="${cls}${st.pmWrongLine===k?' no':''}" onclick="pickLine(${k})">${L.t}</button>`;
  }).join("");

  const dots = [0,1,2,3].map(i=>{
    const s = pmRowState(st,i);
    return `<span class="dot ${s==='ok'?'on':''}${s==='bad'?' bad':''}"></span>`;
  }).join("");

  let right = "";
  if(pmAllDone(st)){
    right = `<div class="pm-step">시화까지 마쳤어요</div>
      <div class="pm-stamp">🖈 ${T.title} · 네 줄과 그림이 모였어요</div>
      <div class="pm-card"><div class="pt">⭐ 동시를 짓는 차례</div>
        주제를 고르고 → 겪은 일을 <b>이야기</b>로 쓰고 → 이야기를 <b>줄여서 동시</b>로 짓고 →
        <b>다시 읽어 보며 고치고</b> → 동시의 내용을 나타내는 <b>그림</b>을 그려요.</div>
      <div class="pm-msg">여기서 고른 줄은 <b>연습</b>이에요. 진짜 동시는 <b>내가 겪은 일</b>로 종이에 직접 지어 봐요. 교실에서는 줄의 차례도 바꿔 보고, 친구들과 시화를 바꿔 보며 좋은 점을 찾아 주어요.</div>`;
  } else if(!pmTopicSet(st)){
    const list = PM_TOPICS.map((p,i)=>`<button onclick="pickTopic(${i})">${p.theme}</button>`).join("");
    right = `<div class="pm-step">① 어떤 주제로 지어 볼까요</div>
      <div class="pm-msg ${st.pmWarn?'warn':''}">${st.pmMsg||'이 단원에서 공부한 내용 가운데 하나를 골라 봐요. <b>정답은 없어요</b> — 마음에 드는 것을 고르면 돼요.'}</div>
      <div class="pm-list">${list}</div>`;
  } else if(pmHasFlag(st)){
    const flags = [0,1,2,3].map(i=>{
      if(st.pmFlags[i]==null) return '';
      const R = PM_REASONS[st.pmFlags[i]];
      const L = T.lines[st.pmRows[i]];
      return `<div class="pm-flag"><span class="fl">${i+1}번째 줄 — ${R.tag}</span><br>${L.why||''} ${R.tip}</div>`;
    }).join("");
    right = `<div class="pm-step">③ 짚인 줄을 고쳐 써요</div>
      <div class="pm-gauge">${dots}<span class="tx">${st.pmOkR.filter(Boolean).length} / 4 통과</span></div>
      ${flags}
      <div class="pm-msg ${st.pmWarn?'warn':''}">${st.pmMsg||'짚인 줄부터 차례로 바꿔요. <b>통과한 줄은 그대로</b> 두면 돼요.'}</div>
      <div class="pm-list">${lineList(T)}</div>`;
  } else if(!pmPassed(st)){
    const canReview = pmFilled(st);
    right = `<div class="pm-step">② 네 줄을 채워 초고를 써요 · ${T.title}</div>
      ${storyBox}
      <div class="pm-gauge">${dots}<span class="tx">${st.pmRows.filter(x=>x!=null).length} / 4 줄</span></div>
      <div class="pm-msg ${st.pmWarn?'warn':''}">${st.pmMsg||'이야기의 차례를 생각하며 <b>위에서부터</b> 한 줄씩 놓아 봐요. 초고니까 마음껏 놓아도 괜찮아요.'}</div>
      <div class="pm-list">${lineList(T)}</div>
      <button class="pm-review" ${canReview?'':'disabled'} onclick="reviewPoem()">📖 다시 읽어 보기</button>`;
  } else {
    const P = T.pic;
    const list = P.opts.map((o,k)=>`<button class="${st.pmWrongPic===k?'no':''}" onclick="pickPic(${k})">${o}</button>`).join("");
    right = `<div class="pm-step">④ 네 줄이 모두 통과했어요</div>
      <div class="pm-gauge">${dots}<span class="tx">4 / 4 통과</span></div>
      <div class="pm-msg ${st.pmWarn?'warn':''}">${st.pmMsg||'이제 동시와 어울리는 그림을 골라 <b>시화</b>를 완성해요.'}</div>
      <div class="pm-q">${P.q}</div>
      <div class="pm-list">${list}</div>`;
  }
  return `<div class="pm-wrap">${head}
    <div class="pm-body">${pmCanvas(st)}<div class="pm-right">${right}</div></div>
  </div>`;
}

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function pmRender(){ main.innerHTML = slides[state.idx].render(state); }
function pmClear(){ state.pmWrongLine=null; state.pmWrongPic=null; state.pmWarn=false; }

/* ① 주제 고르기 — 정답 없음 */
function pickTopic(i){
  if(pmAllDone(state)) return;                                          // ① 확정 후 전체 잠금
  if(state.pmTopic!=null) return;                                       // 이미 고른 뒤에는 swapTopic으로만
  if(!(Number.isInteger(i) && i>=0 && i<PM_TOPICS.length)) return;       // ② 무효 번호
  state.pmTopic=i;
  state.pmRows=[null,null,null,null]; state.pmFlags=[null,null,null,null];
  state.pmOkR=[false,false,false,false]; state.pmPass=false; state.pmPic=null;
  pmClear();
  state.pmMsg = `<b>${PM_TOPICS[i].theme}</b> 이 주제로 지어 볼게요. 이야기를 읽고 <b>위에서부터</b> 네 줄을 채워 봐요.`;
  playBlip(); pmRender();
}
/* 주제 바꾸기 — 확정 전에는 언제든 처음부터 다시 쓴다 */
function swapTopic(){
  if(pmAllDone(state)) return;                                          // ①
  if(state.pmTopic==null) return;
  state.pmOut[state.pmTopic]=[];
  state.pmTopic=null;
  state.pmRows=[null,null,null,null]; state.pmFlags=[null,null,null,null];
  state.pmOkR=[false,false,false,false]; state.pmPass=false; state.pmPic=null;
  pmClear();
  state.pmMsg = '주제를 다시 골라 봐요. 앞서 쓴 원고는 지워졌어요.';
  state.pmSwaps++;
  playBlip(); pmRender();
}
/* ② 초고 — 여기서는 막지 않는다. 짚인 자리가 있으면 그 자리부터 바꾼다 */
function pickLine(k){
  if(pmAllDone(state)) return;                                          // ①
  if(!pmTopicSet(state)) return;                                        // ③ 주제 전 줄 클릭 무시(순서)
  const T = PM_TOPICS[state.pmTopic];
  if(!(Number.isInteger(k) && k>=0 && k<T.lines.length)) return;         // ②
  if(state.pmWrongLine!=null) return;                                   // ⑧ 안내 표시 중 재클릭 무시
  if(state.pmOut[state.pmTopic].indexOf(k)>=0){                         // ④ 짚혀 잠긴 줄 재사용 무시
    state.pmWrongLine=k; state.pmWarn=true;
    state.pmMsg = '이 줄은 앞에서 <b>짚였던 줄</b>이에요. 다른 줄을 골라 봐요.';
    playThud(); pmRender();
    setTimeout(()=>{ if(state.pmWrongLine===k){ pmClear(); state.pmMsg=null; pmRender(); } },1600);
    return;
  }
  if(state.pmRows.indexOf(k)>=0){                                       // ④ 이미 놓인 줄 재클릭 무시
    state.pmWrongLine=k; state.pmWarn=true;
    state.pmMsg = '이 줄은 <b>이미 원고에 놓여</b> 있어요.';
    playThud(); pmRender();
    setTimeout(()=>{ if(state.pmWrongLine===k){ pmClear(); state.pmMsg=null; pmRender(); } },1600);
    return;
  }
  let target = state.pmFlags.findIndex(x=>x!=null);                     // 짚인 자리가 먼저
  if(target<0) target = state.pmRows.indexOf(null);                     // 없으면 빈 자리
  if(target<0) return;                                                  // 네 줄이 다 찼고 짚인 곳도 없다 → 재검 차례
  const wasFix = state.pmFlags[target]!=null;
  state.pmRows[target]=k; state.pmFlags[target]=null; state.pmOkR[target]=false;
  pmClear();
  state.pmMsg = wasFix
    ? `${target+1}번째 줄을 바꿨어요. ` + (pmHasFlag(state) ? '남은 줄도 고쳐 봐요.' : '이제 <b>다시 읽어 보기</b>를 눌러 확인해요.')
    : `${target+1}번째 줄에 놓았어요. ` + (pmFilled(state) ? '네 줄이 다 찼어요. <b>다시 읽어 보기</b>를 눌러 봐요.' : '다음 줄을 놓아 봐요.');
  playBlip(); pmRender();
}
/* ③ 퇴고 — 네 줄을 한꺼번에 훑어 세 사유로 짚는다 */
function reviewPoem(){
  if(pmAllDone(state)) return;                                          // ①
  if(!pmTopicSet(state)) return;                                        // ③
  if(pmPassed(state)) return;
  if(!pmFilled(state)){                                                 // ⑤ 네 줄 미완성 시 무시(순서)
    state.pmWarn=true;
    state.pmMsg = '아직 <b>비어 있는 줄</b>이 있어요. 네 줄을 모두 채운 뒤에 다시 읽어 봐요.';
    playThud(); pmRender(); return;
  }
  if(pmHasFlag(state)){                                                 // ⑥ 짚인 줄이 남아 있는 동안 재검 무시
    state.pmWarn=true;
    state.pmMsg = '<b>짚인 줄</b>을 먼저 고쳐 주세요. 고친 다음에 다시 읽어 볼 수 있어요.';
    playThud(); pmRender(); return;
  }
  const T = PM_TOPICS[state.pmTopic];
  let bad = 0;
  for(let i=0;i<4;i++){
    const L = T.lines[state.pmRows[i]];
    if(L.bad!=null){
      state.pmFlags[i]=L.bad; state.pmOkR[i]=false; bad++;
      if(state.pmOut[state.pmTopic].indexOf(state.pmRows[i])<0) state.pmOut[state.pmTopic].push(state.pmRows[i]);
    } else {
      state.pmFlags[i]=null; state.pmOkR[i]=true;
    }
  }
  state.pmReviews++;
  pmClear();
  if(bad===0){
    state.pmPass=true;
    state.pmMsg = '네 줄이 모두 <b>이야기에서 나온 줄</b>이에요! 이제 어울리는 그림을 골라 시화를 완성해요.';
    playChime(); pmRender(); return;
  }
  state.pmWarn=true;
  state.pmMsg = `다시 읽어 보니 <b>${bad}줄</b>이 걸렸어요. 통과한 줄은 그대로 두고 <b>짚인 줄만</b> 바꿔요.`;
  playThud(); pmRender();
}
/* ④ 시화 — 네 줄이 통과해야 열린다 */
function pickPic(k){
  if(pmAllDone(state)) return;                                          // ①
  if(!pmPassed(state)) return;                                          // ⑦ 통과 전 시화 무시(순서)
  const P = PM_TOPICS[state.pmTopic].pic;
  if(!(Number.isInteger(k) && k>=0 && k<P.opts.length)) return;          // ②
  if(state.pmWrongPic!=null) return;                                    // ⑧
  if(k===P.ok){
    state.pmPic=k; pmClear(); state.pmMsg=P.yes;
    playChime(); pmRender(); return;
  }
  state.pmWrongPic=k; state.pmWarn=true;
  state.pmMsg = P.no[k < P.ok ? k : k-1];
  playThud(); pmRender();
  setTimeout(()=>{ if(state.pmWrongPic===k){ pmClear(); state.pmMsg=null; pmRender(); } },1800);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u2_l10_단원마무리.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

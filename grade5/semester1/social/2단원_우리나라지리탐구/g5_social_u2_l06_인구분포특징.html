K-edu 사회 5-1 · 2단원 우리나라 지리 탐구 · 주제② 우리나라의 인구 분포 · 6차시(l06)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사02-02] · 교과서 p.83~85 · 지도서(대단원2 **10차시** 우리나라의 인구 분포를 알아볼까요, 지도서 p.179~185) 근거
학습 목표: 우리나라의 인구 분포 특징을 설명할 수 있다.
직접조작: 인구분포도 시간 손잡이(신규 패턴 — 두 시점 대조·되돌아보기형)
  ⭐ 지도서 수업 기법이 「**통계 자료 분석하기**」이고 사회과 과정·기능이 “인구 분포 관련 **그래프와 지도를 해석**하여
     인구 분포의 특징을 파악”이다. 그리고 활동지(p.184)가 **1960년 ↔ 2023년 비교**다.
     그래서 무대를 **같은 지도 한 장**으로 두고, 그 위에 **연도 손잡이**를 얹었다.
  ⭐ 지금까지 스무 종의 조작은 전부 **한 번 지나가면 끝나는 단방향**이었다. 이번은 **되돌아갈 수 있는 축(시간)** 위에 있다 —
     읽기를 마친 시점으로는 손잡이를 **자유롭게 오갈 수 있고**, 오가도 빗금과 판독 결과가 그대로 보존된다.
     비교란 두 번 보는 일이라서, 되돌아가기를 막으면 조작이 학습 내용과 어긋난다.
  ① 1960년 자리 — 지도의 아홉 칸 가운데 인구 밀도가 **250명/km² 이상**인 칸에 빗금을 긋는다(4칸).
     ⭐ 교과서 p.83 [스스로 활동] 원문(“지도에서 인구 밀도가 **250명/km² 이상인 지역에 빗금을 그어** 봅시다”)을 조작 그대로 옮겼다.
     낮은 칸을 누르면 그 칸의 범례 구간을 짚어 거부한다. 네 칸을 다 그어야 판독 3택이 열린다.
  ② 손잡이를 2023년으로 옮기면 **같은 지도의 색이 바뀐다**. 다시 진한 네 칸에 빗금을 긋고 판독한다.
  ③ 두 시점을 다 읽어야 **대조란**이 열린다 — “더 큰 영향을 주게 된 환경은?”(자연환경 ↔ 인문환경).
     대조는 두 시점을 오가며 견줄 수 있는 상태에서만 열린다.
  ⚠️ 가드 8종: 완성 후 전체 잠금 / 무효 칸·시점·판독·대조 번호(`Number.isInteger`) /
     아직 열리지 않은 시점으로 이동 무시(1960 판독 전 2023 잠금) / 빗금 넉 줄 전 판독 무시(순서) /
     250명/km² 미만 칸 거부 안내 / 이미 그은 칸 재클릭 무시 / 두 시점 판독 전 대조 무시(순서) /
     오답 안내 표시 중 재클릭 무시. 재시도 허용(감점 없음).
  ⚠️ 정직 원칙: 아홉 칸 지도는 방위로 나눈 **도식**이며 실제 인구분포도가 아니다. 칸에는 지역 이름을 쓰지 않는다
     (지도상의 유의점 — 사실적 지식보다 정보 파악·일반화 도출).
지도서 근거:
  [동기 유발] 사람들은 주로 어떤 곳에 모여 살까요? — 기후가 온화한 곳 / 땅이 평평한 곳 / 일자리가 많은 곳 /
    교통이 편리한 곳 / 교육 환경이 좋은 곳. (전시 학습 되돌아보기 = 5차시 회수)
  [학습 문제] 우리나라의 인구 분포를 알아봅시다.
  [전개 1 · 과거] 과거 우리나라는 **벼농사 중심의 농업 사회**였다. 이때는 **자연환경의 영향**을 많이 받아
    **기후가 온화하고 평야가 발달한 지역**에 인구가 주로 분포했다. 반면 **연평균 기온이 낮고 산지가 많은 지역**은
    인구 밀도가 낮았다. 1960년에는 동쪽보다 **남쪽과 서쪽**에 사람들이 많이 모여 살았다.
    [스스로 활동 · p.83] 250명/km² 이상 지역에 빗금 → 평야(연두색) 지역과 위치 비교.
    예시 답안 = “서해안과 남해안 등 평야가 발달한 지역은 농사짓기에 유리해서 인구가 모여 살았다.”
  [전개 2 · 오늘날] **1960년대 이후 산업화**로 도시가 발달하면서 도시 수가 크게 늘었고, 인구 분포는 자연환경보다
    **일자리, 교통 등 인문환경**의 영향을 크게 받게 됐다. 많은 사람이 **촌락에서 도시로** 이동했고,
    그 결과 우리나라 **인구 100명 중 92명 정도가 도시**에 모여 살면서 촌락 지역은 인구가 줄었다.
    2023년 인구는 주로 **수도권과 대도시**에 모여 산다. **2020년 이후 수도권으로 인구가 집중해 오늘날
    우리나라 인구의 절반 정도가 수도권**에 살고 있다.
    자료 해설 원문 = 경기도의 인구는 **1,400만 명에 조금 못 미치고**, 서울특별시에는 **9백만 명이 넘게** 살고 있다 /
    수도권 전입 100명 환산 자료에서 **일자리, 교육, 주택** 등의 목적으로 전입한 사람이 많고 **가장 큰 사유는 직업**이다.
    핵심 질문 답 = 인구 분포가 자연환경보다 인문환경의 영향을 크게 받는 까닭 — 산업 발달에 따라 농업·어업·임업에
    종사하는 사람보다 **공업이나 서비스업에 종사하는 사람이 많기** 때문이다.
  [전개 3 · 인구 구조] 인구 분포의 불균형은 각 지역의 **인구 구조**에도 영향을 미쳤다. 일자리, 교육 등을 위해
    **청장년층이 모인 수도권**과 **청장년층이 빠져나간 비수도권**에서 인구 구조가 서로 다르게 나타난다.
    [스스로 활동 · p.85] 경기도(수도권) 유소년층 12% · 청장년층 73% · 노년층 15% /
    경상북도(비수도권) 유소년층 10% · 청장년층 66% · 노년층 24% — 원문값 그대로.
    ○표 문장 = 수도권은 “비수도권보다 (**청장년층**) 인구 비율이 높습니다” / 비수도권은 “수도권보다 (**노년층**) 인구 비율이 높습니다”.
    붙임딱지 원문 = “일자리와 교육 기회를 찾아 청장년층 인구가 모여” / “일자리와 교육 기회가 적어 청장년층 인구가 빠져나가”.
  [낱말] 수도권 = 수도를 중심으로 이루어진 대도시권으로, 우리나라의 수도권은 **서울특별시, 인천광역시, 경기도**로 이루어져 있음.
    인구 구조 = 인구를 **나이, 성별 등의 기준으로 나누어 본 짜임새**.
    산업화 = **농업 중심에서 공업, 서비스업 중심으로 생산 활동이 변하는 현상**.
    촌락 = 주로 시골에서 여러 집이 모여 사는 곳.
  [꼭 기억해요] 1. 오늘날 우리나라의 인구 분포는 (**인문환경**)의 영향을 크게 받습니다.
    2. 오늘날에는 우리나라 인구의 절반 정도가 **수도권**에 모여 살고 있습니다.
  [10차시 주요 내용 정리] 1. 과거 인구 분포의 특징 ① 국토의 남서쪽 평야 지대에 많은 인구가 분포함 ② 주로 자연환경의 영향을 받음.
    2. 오늘날 인구 분포의 특징 ① 수도권으로의 인구 집중이 심함 ② 인구 분포의 불균형이 나타남.
    3. 수도권과 비수도권의 인구 구조 — 일자리가 풍부한 수도권에는 청장년층 인구 비율이 높고, 비수도권에는 수도권보다 노년층 인구 비율이 높음.
    → 16슬 정리를 이 세 항 그대로 옮겼다.
  [지도 꿀 Tip] 인구분포도에서 인구 밀도가 높은 지역을 우리나라 전도에서 찾아 어떤 지역인지 확인함으로써
    인구의 **수도권과 대도시 집중 현상**을 파악해 보도록 지도한다.
  [차시 예고] 다음 시간에는 인구 분포의 불균형에 따른 문제점을 알아보겠습니다.
⚠️ 설계 원칙:
  · 지도상의 유의점(“우리나라의 인구 분포에 대한 **사실적 지식의 습득보다는 정보 파악, 일반화 도출**을 강조한다”,
    “**지도나 그래프 등의 자료를 분석**하고 자료가 의미하는 바를 탐색하는 활동이 되도록 한다”)을 따라
    문항을 전부 **자료 해석·판단**형으로 짰다. 지역 이름을 외우게 하는 문항은 0이고,
    조작의 아홉 칸에도 지역 이름을 붙이지 않았다(방위만). 수도권의 범위는 교과서 **낱말 정의**라 예외로 다룬다.
  · **11차시 이후 선행 침범 0** — 인구 분포의 불균형으로 나타난 **문제점**(주택 부족·교통 혼잡·일손 부족·빈집·폐교 등)과
    해결 노력(국가 균형 발전·혁신 도시·고향 사랑 기부제)이 전부 0이다.
    ⚠️ 다만 낱말 **‘인구 분포의 불균형’ 자체는 10차시 소관**이다 — 교과서 p.85 본문(“이러한 인구 분포의 불균형은
    각 지역의 인구 구조에도 영향을 미쳤습니다”)과 지도서 「10차시 주요 내용 정리」 2-②(“인구 분포의 불균형이 나타남”)에
    명시돼 있다. 그래서 **불균형이 나타난다는 사실 진술까지만 쓰고, 그로 인한 문제와 해결은 쓰지 않는다**.
  · 연도는 **1960년·2023년만** 쓴다 — 두 시점을 견주는 것이 이 차시의 내용이라 연도가 곧 자료의 뜻이다.
    그 밖의 연도(1961·2020·2024 등 자료 출처 연도)와 통계 기관 이름은 0.
  · 교사용 참고 자료(인구 접근도·인구 중심점·권역별 인구 비중·2035년 전망·KOSIS 통계 놀이터·서울 자치구별 전입,
    생산 가능 인구·고령 인구 같은 경제학 용어)는 성취기준 밖이므로 0.
  · 회수 — **인구 분포·인구 밀도·자연환경·인문환경**은 5차시(l05)에서 배운 낱말이라 되받아 쓰고,
    **기후·평야**는 주제①과 1단원에서 배운 낱말이라 정리 슬라이드에서 한 번 짚는다.
⚠️ l05 → l06 → l07 소프트체인.

.scene.wide{width:clamp(240px,44vw,420px)}
.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F5FBFC;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 인구분포도 시간 손잡이(두 시점 대조·되돌아보기형) */
.tl-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tl-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tl-tabs button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 6px;cursor:pointer;
  font-family:inherit;font-weight:800;color:#475569;font-size:clamp(11px,1.86vw,13.6px);transition:.15s;line-height:1.3}
.tl-tabs button:hover{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.tl-tabs button.on{border-color:var(--green);background:var(--green);color:#fff}
.tl-tabs button.fin{border-color:var(--cyan);background:#DFF0E7;color:#1C4D35}
.tl-tabs button.fin.on{background:var(--cyan);color:#fff}
.tl-tabs button.lock{opacity:.45;cursor:default;border-style:dashed}
.tl-body{display:grid;grid-template-columns:1.06fr 1fr;gap:10px;align-items:start}
.tl-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.tl-canvas svg{width:100%;height:auto;display:block}
.tl-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.tl-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.tl-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.tl-msg.warn{border-left-color:var(--red)}
.tl-msg b{color:var(--green)}
.tl-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.tl-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.tl-gauge{display:flex;align-items:center;gap:5px}
.tl-gauge .dot{width:15px;height:15px;border-radius:5px;border:2px solid #CBD5E0;background:#fff}
.tl-gauge .dot.on{border-color:var(--green);background:var(--green)}
.tl-gauge .tx{font-size:clamp(10px,1.7vw,12.4px);font-weight:800;color:#475569;margin-left:3px}
.tl-q{font-size:clamp(11.4px,1.93vw,13.8px);font-weight:800;color:var(--green-d);line-height:1.5;padding:0 2px}
.tl-list{display:flex;flex-direction:column;gap:5px}
.tl-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.4px,1.77vw,12.8px);
  text-align:left;transition:.15s;line-height:1.4}
.tl-list button:hover{border-color:var(--green);background:var(--bub)}
.tl-list button.set{opacity:.5;border-style:dashed;cursor:default}
.tl-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.tl-legend{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.tl-legend span{display:inline-flex;align-items:center;gap:3px;font-size:clamp(8.6px,1.5vw,10.4px);
  font-weight:700;color:#475569;background:#F8FAFC;border:1px solid var(--line);border-radius:6px;padding:2px 5px}
.tl-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.stepbtn{border:2px solid var(--amber);background:#FFF8E1;color:var(--amber);border-radius:10px;padding:9px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.6px,1.8vw,13px);transition:.15s}
.stepbtn:hover{background:#FDECC8}
.stepbtn:disabled{opacity:.42;cursor:default}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#E0F2FE;border-radius:12px;padding:10px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#0C4A6E;max-width:660px;border-left:4px solid #0369A1}
@media(max-width:620px){ .tl-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(14,116,144,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}
</style><script src="/kedu_gate.js"></script>
</head>
<body>
<div class="ka">
  <div class="ka-h">
    <button class="ka-lb" onclick="goHub()">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>
      <span>차시 목록</span>
    </button>
    <div class="ka-bar"><div id="bar"></div></div>
    <div class="ka-pg" id="pg">1 / 18</div>
    <div class="ka-sc">
      <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#B45309"/></svg>
      <span class="ka-sc-n" id="score">0</span><span class="ka-sc-u">점</span>
    </div>
  </div>

  <div class="ka-m" id="main"></div>

  <div class="ka-f">
    <button class="ka-nav ka-nav-prev" id="prev" onclick="prev()">← 이전</button>
    <button class="ka-nav mob-hide" id="listen" disabled title="음성은 준비 중이에요">
      <svg viewBox="0 0 16 16"><path d="M 3 6 L 3 10 L 6 10 L 10 13 L 10 3 L 6 6 Z" fill="currentColor"/><path d="M 12 5 Q 14 8 12 11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      다시 듣기
    </button>
    <button class="ka-nav" id="hint" onclick="useHint()">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="4" fill="currentColor"/><rect x="6" y="9.5" width="4" height="2.5" fill="currentColor"/><rect x="6.5" y="12.5" width="3" height="1" fill="currentColor"/></svg>
      힌트
    </button>
    <button class="ka-nav ka-nav-next" id="next" onclick="next()">다음 →</button>
  </div>
</div>

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 모든 그림은 내용을 나타낸 도식이며 실제 사진·통계 지도가 아니다.
   서울특별시·강원특별자치도의 넓이·인구·인구 밀도 여섯 값은 교과서 p.82 [스스로 활동]의 원문 수치를 그대로 옮겼다.
   ⚠️ 1961년 인구분포도는 10차시 자료이므로 이 차시에는 넣지 않는다. */

/* 사람 도형 — 인구를 나타내는 최소 도식 */
function person(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <circle cx="0" cy="-6" r="3.4" fill="${col}"/>
    <path d="M-4.2 6 q0 -7 4.2 -7 q4.2 0 4.2 7 Z" fill="${col}"/></g>`;
}
/* 집 도형 */
function house(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-9 0 L0 -8 L9 0 Z" fill="${col}"/>
    <rect x="-6.4" y="0" width="12.8" height="9" fill="${col}" opacity=".75"/></g>`;
}
/* 말풍선 */
function bubble(x,y,w,h,txt,fs){
  const lines = txt.split('|');
  let t='';
  lines.forEach((ln,i)=>{ t += `<text x="${x+w/2}" y="${y+15+i*(fs+3)}" font-size="${fs}" fill="#334155" text-anchor="middle">${ln}</text>`; });
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="#ffffff" stroke="#0E7490" stroke-width="1.8"/>
    <path d="M${x+w/2-5} ${y+h} L${x+w/2+5} ${y+h} L${x+w/2} ${y+h+7} Z" fill="#ffffff" stroke="#0E7490" stroke-width="1.8"/>${t}</g>`;
}

/* 우리나라 모양 — 도식(주제① l02에서 쓴 것을 그대로 승계) */
const KPATH = "M50 6 L61 10 L69 21 L67 33 L73 43 L71 55 L63 65 L65 77 L59 91 L51 103 L43 111 L37 107 L39 95 L33 85 L31 71 L25 59 L27 45 L21 35 L25 23 L35 13 Z";
const JEJU  = "M30 118 a7 4.2 0 1 0 14 0 a7 4.2 0 1 0 -14 0";

/* 인구 밀도 범례 — 교과서 p.83~84 인구분포도 범례 6단계 원문 */
const DEN_COL = ["#F1F5F9","#CFE8EF","#8ECFDF","#4FA9C4","#1F7D9C","#0C4A6E"];
const DEN_LAB = ["100 미만","100~250","250~500","500~1,000","1,000~5,000","5,000 이상"];
/* 아홉 칸 — 방위로만 나눈 도식. 지역 이름은 붙이지 않는다(지도상의 유의점). */
const CELL = ["북서","북부","북동","중서","중부","중동","남서","남부","남동"];
const COLX = [20,38,56], ROWY = [4,40,76], CW = 18, CH = 36;
/* 1960년 — 남쪽과 서쪽이 진하다(국토의 남서쪽 평야 지대) */
const DEN_1960 = [1,0,0, 3,1,0, 2,2,2];
/* 2023년 — 수도권이 가장 진하고, 대도시가 흩어져 진하다 */
const DEN_2023 = [1,0,0, 5,2,0, 1,2,3];
const DEN_TH = 2; /* 250명/km² 이상 = 범례 3번째 칸부터 */
function denseCells(b){ return b.map((v,i)=>v>=DEN_TH?i:-1).filter(i=>i>=0); }
function cellX(i){ return COLX[i%3]; }
function cellY(i){ return ROWY[Math.floor(i/3)]; }

/* 인구분포도 도식 — 아홉 칸을 우리나라 모양으로 잘라 색칠한다 */
function denMap(id,bands,ox,oy,sc){
  const cells = bands.map((v,i)=>`<rect x="${cellX(i)}" y="${cellY(i)}" width="${CW}" height="${CH}" fill="${DEN_COL[v]}"/>`).join("");
  return `<g transform="translate(${ox},${oy}) scale(${sc})">
    <defs><clipPath id="${id}"><path d="${KPATH}"/><path d="${JEJU}"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect x="18" y="2" width="58" height="122" fill="#F1F5F9"/>${cells}
      <rect x="26" y="114" width="20" height="10" fill="${DEN_COL[bands[7]]}"/></g>
    <path d="${KPATH}" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="${JEJU}" fill="none" stroke="#475569" stroke-width="1.2"/>
  </g>`;
}
function denLegend(x,y,fs){
  return DEN_COL.map((c,i)=>`<g transform="translate(${x},${y+i*13})">
    <rect x="0" y="0" width="10" height="9" fill="${c}" stroke="#94A3B8" stroke-width=".6"/>
    <text x="14" y="7.6" font-size="${fs}" fill="#334155">${DEN_LAB[i]}</text></g>`).join("");
}

/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 모든 그림은 내용을 나타낸 도식이며 실제 사진·통계 지도가 아니다.
*/
const SVG = {
  /* 동기 유발 — 사람들은 주로 어떤 곳에 모여 살까요 */
  open:`<svg viewBox="0 0 320 180"><rect width="320" height="180" fill="#F8FAFC"/>
    <text x="160" y="24" font-size="12" fill="#0E7490" text-anchor="middle" font-weight="800">사람들은 주로 어떤 곳에 모여 살까요?</text>
    ${[["기후가 온화한 곳",16,44,'#DDEFD2','#3F7A3A'],["땅이 평평한 곳",166,44,'#DDEFD2','#3F7A3A'],
       ["일자리가 많은 곳",16,88,'#DCF0F5','#0C4A6E'],["교통이 편리한 곳",166,88,'#DCF0F5','#0C4A6E'],
       ["교육 환경이 좋은 곳",91,132,'#DCF0F5','#0C4A6E']].map(d=>`<g transform="translate(${d[1]},${d[2]})">
      <rect x="0" y="0" width="138" height="34" rx="10" fill="${d[3]}" stroke="${d[4]}" stroke-width="1.6"/>
      <text x="69" y="22" font-size="10.4" fill="${d[4]}" text-anchor="middle" font-weight="800">${d[0]}</text></g>`).join("")}
    <text x="160" y="176" font-size="8.6" fill="#64748B" text-anchor="middle">지난 시간에 배운 자연환경과 인문환경이에요</text></svg>`,

  /* 1960년 인구 분포 */
  past:`<svg viewBox="0 0 320 200"><rect width="320" height="200" fill="#F8FAFC"/>
    <text x="16" y="20" font-size="11.5" fill="#0C4A6E" font-weight="800">1960년 인구 분포</text>
    ${denMap('mp1',DEN_1960,26,26,1.32)}
    ${denLegend(206,44,8.4)}
    <text x="206" y="36" font-size="9" fill="#475569" font-weight="800">인구 밀도(명/km²)</text>
    <text x="130" y="70" font-size="9.6" fill="#0C4A6E" font-weight="800">서쪽</text>
    <text x="130" y="150" font-size="9.6" fill="#0C4A6E" font-weight="800">남쪽</text>
    <path d="M126 66 L112 62" stroke="#0C4A6E" stroke-width="1.4" fill="none"/>
    <path d="M126 146 L108 142" stroke="#0C4A6E" stroke-width="1.4" fill="none"/>
    <text x="16" y="190" font-size="8.6" fill="#64748B">동쪽보다 남쪽과 서쪽에 사람이 많이 모여 살았어요</text></svg>`,

  /* 벼농사 중심의 농업 사회 */
  farm:`<svg viewBox="0 0 320 190"><rect width="320" height="190" fill="#F5FBF3"/>
    <rect x="0" y="120" width="320" height="70" fill="#DDEFD2"/>
    <text x="160" y="24" font-size="12" fill="#276749" text-anchor="middle" font-weight="800">벼농사 중심의 농업 사회</text>
    <g>${[0,1,2,3,4,5,6,7].map(i=>`<g transform="translate(${22+i*36},130)">
      <path d="M0 20 L0 6 M0 12 L-5 2 M0 12 L5 2" stroke="#3F7A3A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M10 20 L10 8 M10 13 L5 4 M10 13 L15 4" stroke="#3F7A3A" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>`).join("")}</g>
    <line x1="0" y1="120" x2="320" y2="120" stroke="#9DBF92" stroke-width="1.6"/>
    <path d="M12 118 L96 100 L96 118 Z" fill="#BFD9B2"/>
    <path d="M226 118 L300 92 L300 118 Z" fill="#A9BFB3"/>
    <text x="60" y="114" font-size="8.6" fill="#3F5B38" text-anchor="middle" font-weight="700">평야</text>
    <text x="266" y="112" font-size="8.6" fill="#3F5B38" text-anchor="middle" font-weight="700">산지</text>

/* ===== 직접조작 — 인구분포도 시간 손잡이(신규 패턴 — 두 시점 대조·되돌아보기형) =====
   같은 지도 한 장 위에 연도 손잡이가 얹혀 있다. 손잡이를 옮기면 색칠이 바뀐다.
   ① 1960년에서 250명/km² 이상인 네 칸에 빗금 → 판독 3택
   ② 2023년으로 옮겨 같은 일을 한 번 더 → 판독 3택
   ③ 두 시점을 다 읽어야 대조란이 열린다.
   ⭐ 읽기를 마친 시점으로는 손잡이를 자유롭게 오갈 수 있고, 오가도 빗금과 판독이 보존된다.
      비교는 두 번 보는 일이라, 되돌아가기를 막으면 조작이 학습 내용과 어긋난다.
*/
const TL_YEAR = ["1960년","2023년"];
const TL_BANDS = [DEN_1960, DEN_2023];

/* 시점별 판독 3택 */
const TL_READ = [

    ok:1,
    no:["산지가 많고 기온이 낮은 지역은 오히려 인구 밀도가 <b>낮았어요</b>. 빗금이 어디에 몰렸는지 다시 봐요.",
        "빗금은 <b>서쪽과 남쪽 바닷가 가까이</b>에 몰려 있어요. 바다에서 먼 곳이 아니에요."],

    ok:2,
    no:["촌락은 오히려 인구가 <b>줄었어요</b>. 가장 진한 칸이 어디인지 다시 봐요.",
        "산과 숲이 많은 칸은 색이 <b>옅어요</b>. 빗금은 그쪽이 아니에요."],
    yes:"오늘날에는 <b>수도권과 대도시</b>에 인구가 모여 살아요. 우리나라 인구의 <b>절반 정도</b>가 수도권에 살고 있지요." }

const TL_CMP = {
  q:"두 시점을 견주면, 오늘날 인구 분포에 더 큰 영향을 주게 된 환경은 무엇일까요?",

};

/* 상태 판정 헬퍼 */
function tlNeed(y){ return denseCells(TL_BANDS[y]).length; }
function tlHatchDone(st,y){ return st.tlHatch[y].length >= tlNeed(y); }
function tlYearDone(st,y){ return st.tlRead[y]!=null; }
function tlBothRead(st){ return tlYearDone(st,0) && tlYearDone(st,1); }
function tlAllDone(st){ return tlBothRead(st) && st.tlCmp!=null; }

/* 지도 캔버스 — 손잡이가 가리키는 시점의 색칠을 그린다 */
function tlCanvas(st){
  const y = st.tlYear, bands = TL_BANDS[y], hat = st.tlHatch[y];
  const cells = bands.map((v,i)=>`<rect x="${cellX(i)}" y="${cellY(i)}" width="${CW}" height="${CH}" fill="${DEN_COL[v]}"/>`).join("");
  const hatched = hat.map(i=>`<rect x="${cellX(i)}" y="${cellY(i)}" width="${CW}" height="${CH}" fill="url(#tlhx)"/>`).join("");
  const hits = bands.map((v,i)=>{
    const bad = st.tlWrongCell===i;
    return `<rect id="tlcell${i}" x="${cellX(i)}" y="${cellY(i)}" width="${CW}" height="${CH}"
      fill="${bad?'rgba(220,38,38,.22)':'transparent'}" stroke="${bad?'#DC2626':'#94A3B8'}"
      stroke-width="${bad?1.6:0.8}" stroke-dasharray="2 2" style="cursor:pointer"
      onclick="hatchCell(${i})"></rect>`;
  }).join("");
  const legend = DEN_COL.map((c,i)=>`<g transform="translate(112,${i===0?30:30+i*13+(i>=DEN_TH?7:0)})">
    <rect x="0" y="0" width="9" height="8.4" fill="${c}" stroke="#94A3B8" stroke-width=".5"/>
    <text x="12.6" y="7" font-size="7.4" fill="#334155">${DEN_LAB[i]}</text></g>`).join("");
  return `<div class="tl-canvas"><svg viewBox="0 0 200 158">
    <rect width="200" height="158" fill="#fff"/>
    <defs>
      <clipPath id="tlclip"><path d="${KPATH}"/><path d="${JEJU}"/></clipPath>
      <pattern id="tlhx" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5" stroke="#B45309" stroke-width="1.8"/></pattern>
    </defs>
    <text x="10" y="13" font-size="9.6" fill="#0C4A6E" font-weight="800">${TL_YEAR[y]} 인구 분포</text>
    <g transform="translate(4,17)">
      <g clip-path="url(#tlclip)"><rect x="18" y="2" width="58" height="122" fill="#F1F5F9"/>${cells}
        <rect x="26" y="114" width="20" height="10" fill="${DEN_COL[bands[7]]}"/></g>
      <g clip-path="url(#tlclip)">${hatched}</g>
      <path d="${KPATH}" fill="none" stroke="#475569" stroke-width="1.5"/>
      <path d="${JEJU}" fill="none" stroke="#475569" stroke-width="1.2"/>
      ${hits}
    </g>
    <text x="112" y="22" font-size="7.8" fill="#475569" font-weight="800">인구 밀도(명/km²)</text>
    ${legend}
    <line x1="110" y1="${30+DEN_TH*13+1}" x2="196" y2="${30+DEN_TH*13+1}" stroke="#B45309" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="112" y="${30+DEN_TH*13-1}" font-size="7" fill="#B45309" font-weight="800">↑ 250명/km² 아래</text>
    <text x="112" y="152" font-size="7" fill="#B45309" font-weight="800">↓ 250명/km² 이상</text>
  </svg><div class="cvcap">아홉 칸으로 나눈 도식이에요 · 실제 지도가 아니에요</div></div>`;
}

/* 조작 패널 — 왼쪽 지도, 오른쪽 지금 할 일 */
function tlPanel(st){
  const y = st.tlYear;
  const openable = [true, tlYearDone(st,0)];
  const tabs = TL_YEAR.map((t,i)=>{
    let cls = (i===y?'on':'') + (tlYearDone(st,i)?' fin':'') + (openable[i]?'':' lock');
    return `<button class="${cls}" onclick="goYear(${i})">${openable[i]?'':'🔒 '}${t}${tlYearDone(st,i)?' ✓':''}</button>`;
  }).join("");

  let right = "";
  if(tlAllDone(st)){
    right = `<div class="tl-step">두 시점 대조 — 다 읽었어요</div>
      <div class="tl-card"><div class="pt">⭐ 인구 분포가 이렇게 바뀌었어요</div>
        1960년에는 국토의 <b>남서쪽 평야 지대</b>에 인구가 모여 <b>자연환경</b>의 영향을 크게 받았고,
        오늘날에는 <b>수도권과 대도시</b>에 인구가 모여 <b>인문환경</b>의 영향을 크게 받아요.</div>
      <div class="tl-msg">손잡이를 옮기며 두 지도를 얼마든지 다시 견주어 봐도 좋아요.</div>`;
  } else if(!tlHatchDone(st,y)){
    const need = tlNeed(y), have = st.tlHatch[y].length;

  <div class="ka-bub">인구 분포의 <b>불균형</b>은 각 지역의 <b>인구 구조</b>에도 영향을 미쳤어요. 일자리와 교육 기회를 찾아 <span class="ka-emph">청장년층이 모인 수도권</span>과, 청장년층이 빠져나간 <span class="ka-emph">비수도권</span>은 인구 구조가 서로 다르게 나타나요.</div>
  <div class="ka-grp"><div class="scene-row">${sceneCard('age','[스스로 활동] 수도권과 비수도권의 인구 구조','wide')}</div>
    <div class="scene-row">${sceneCard('capm','수도권','wide')}</div>
    <div class="note">수도권은 비수도권보다 <b>청장년층</b> 인구 비율이 높고, 비수도권은 수도권보다 <b>노년층</b> 인구 비율이 높아요.</div></div>`});
// 7 살펴보기 — 직접조작(인구분포도 시간 손잡이)
slides.push({stage:2,badge:"개념",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s2">${star()} 살펴보기</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">두 시점의 지도를 견주어 봐요</h2>
  <div class="ka-grp">${tlPanel(st)}</div>`});
// 8~15 문제
Q.forEach((q,i)=>{
  const apply = i>=4;
  slides.push({stage:apply?4:3, badge:apply?"적용":"확인", q:i, render:(st)=>questionHTML(q,i,st)});
});
// 16 정리: 요약 — 지도서 10차시 주요 내용 정리 3항
slides.push({stage:5,badge:"정리",render:()=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">오늘 배운 내용을 정리해요</h2>
  <div class="ka-grp"><div class="scene-row">${sceneCard('done','1960년과 2023년','wide')}</div>
  <div class="sum-list">
    <div class="sum-item"><span class="n">①</span><div><b style="color:var(--green)">과거 인구 분포의 특징</b> — 국토의 <b style="color:var(--green)">남서쪽 평야 지대</b>에 많은 인구가 분포했고, 주로 <b style="color:var(--green)">자연환경</b>의 영향을 받았어요.</div></div>
    <div class="sum-item"><span class="n">②</span><div><b style="color:var(--green)">오늘날 인구 분포의 특징</b> — <b style="color:var(--green)">수도권으로의 인구 집중</b>이 심하고, 인구 분포의 <b style="color:var(--green)">불균형</b>이 나타나요.</div></div>
    <div class="sum-item"><span class="n">③</span><div><b style="color:var(--green)">수도권과 비수도권의 인구 구조</b> — 일자리가 풍부한 수도권에는 <b style="color:var(--green)">청장년층</b> 인구 비율이 높고, 비수도권에는 수도권보다 <b style="color:var(--green)">노년층</b> 인구 비율이 높아요.</div></div>
    <div class="sum-item"><span class="n">★</span><div>오늘날 우리나라의 인구 분포는 <b style="color:var(--red)">인문환경</b>의 영향을 크게 받고, 인구의 <b style="color:var(--red)">절반 정도가 수도권</b>에 모여 살아요. 자연환경인 <b style="color:var(--red)">기후</b>는 주제 「우리나라의 기후」에서, <b style="color:var(--red)">평야</b>는 1단원에서 배운 낱말이에요.</div></div>
  </div>
  <div class="note">다음 시간에는 <b style="color:var(--green)">인구 분포의 불균형에 따른 문제점</b>을 알아봐요.</div></div>`});
// 17 정리: 자기 평가
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t">스스로 돌아봐요</h2>
  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"과거 우리나라 인구 분포의 특징을 설명할 수 있어요",st)}
    ${selfCheck(1,"오늘날 우리나라 인구 분포의 특징을 그래프와 지도로 설명할 수 있어요",st)}
    ${selfCheck(2,"수도권과 비수도권의 인구 구조가 어떻게 다른지 말할 수 있어요",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 학습을 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">인구 분포의 불균형에 따른 문제점</b>!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u2_l06";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  tlYear:0,
  tlHatch:[[],[]], tlRead:[null,null], tlCmp:null,
  tlWrongCell:null, tlWrongRead:null, tlWrongCmp:null, tlMsg:null, tlWarn:false,
  tlVisits:0,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function tlRender(){ main.innerHTML = slides[state.idx].render(state); }
function tlClear(){ state.tlWrongCell=null; state.tlWrongRead=null; state.tlWrongCmp=null; state.tlWarn=false; }

/* 손잡이 옮기기 — 읽기를 마친 시점으로는 자유롭게 되돌아갈 수 있다 */
function goYear(y){
  if(!(Number.isInteger(y) && y>=0 && y<TL_YEAR.length)) return;   // ② 무효 시점 번호(정수만)
  if(y===1 && !tlYearDone(state,0)) return;                        // ③ 아직 열리지 않은 시점 이동 무시
  if(state.tlYear===y) return;
  state.tlYear = y; state.tlMsg=null; tlClear();
  state.tlVisits++;
  playBlip(); tlRender();
}

/* ① 빗금 긋기 — 250명/km² 이상인 칸만 */
function hatchCell(i){
  if(tlAllDone(state)) return;                                     // ① 완성 후 전체 잠금
  if(!(Number.isInteger(i) && i>=0 && i<CELL.length)) return;      // ②
  const y = state.tlYear;
  if(tlHatchDone(state,y)) return;                                 // 이미 넉 줄을 다 그은 시점은 더 받지 않음
  if(state.tlHatch[y].indexOf(i)>=0) return;                       // ⑥ 이미 그은 칸 재클릭 무시
  if(state.tlWrongCell!=null) return;                              // ⑧ 오답 안내 표시 중 재클릭 무시
  const band = TL_BANDS[y][i];
  if(band < DEN_TH){                                               // ⑤ 250명/km² 미만 칸 거부
    state.tlWrongCell=i; state.tlWarn=true;
    state.tlMsg = `<b>${CELL[i]}</b> 칸은 <b>${DEN_LAB[band]}명/km²</b>예요. 250명/km²보다 낮으니 빗금을 긋지 않아요.`;
    playThud(); tlRender();
    setTimeout(()=>{ if(state.tlWrongCell===i){ tlClear(); state.tlMsg=null; tlRender(); } },1800);
    return;
  }
  state.tlHatch[y].push(i); tlClear();
  if(tlHatchDone(state,y)){
    state.tlMsg = `${TL_YEAR[y]}의 빗금을 다 그었어요. 이제 <b>어떤 곳인지</b> 읽어 봐요.`;
    playChime();
  } else {
    state.tlMsg = `<b>${CELL[i]}</b> 칸에 빗금을 그었어요. (${DEN_LAB[band]}명/km²)`;
    playBlip();
  }
  tlRender();
}

/* ② 판독 3택 */
function pickRead(k){
  if(tlAllDone(state)) return;                                     // ①
  const y = state.tlYear;
  if(!tlHatchDone(state,y)) return;                                // ④ 빗금 넉 줄 전 판독 무시(순서)
  if(tlYearDone(state,y)) return;                                  // 이미 읽은 시점 재입력 무시
  const R = TL_READ[y];
  if(!(Number.isInteger(k) && k>=0 && k<R.opts.length)) return;    // ②
  if(state.tlWrongRead!=null) return;                              // ⑧
  if(k===R.ok){
    state.tlRead[y]=k; tlClear();
    state.tlMsg = R.yes + (tlBothRead(state)
      ? ' 이제 <b>두 시점을 견주어</b> 봐요.'
      : ` 손잡이를 <b>${TL_YEAR[y===0?1:0]}</b>으로 옮겨 같은 일을 한 번 더 해 봐요.`);
    playChime(); tlRender();
    return;
  }
  state.tlWrongRead=k; state.tlWarn=true;
  state.tlMsg = R.no[k < R.ok ? k : k-1];
  playThud(); tlRender();
  setTimeout(()=>{ if(state.tlWrongRead===k){ tlClear(); state.tlMsg=null; tlRender(); } },1800);
}

/* ③ 두 시점 대조 */
function pickCmp(k){
  if(tlAllDone(state)) return;                                     // ①
  if(!tlBothRead(state)) return;                                   // ⑦ 두 시점 판독 전 대조 무시(순서)
  if(!(Number.isInteger(k) && k>=0 && k<TL_CMP.opts.length)) return; // ②
  if(state.tlWrongCmp!=null) return;                               // ⑧
  if(k===TL_CMP.ok){
    state.tlCmp=k; tlClear(); state.tlMsg=null;
    playChime(); tlRender();
    return;
  }
  state.tlWrongCmp=k; state.tlWarn=true;
  state.tlMsg = TL_CMP.no[k < TL_CMP.ok ? k : k-1];
  playThud(); tlRender();
  setTimeout(()=>{ if(state.tlWrongCmp===k){ tlClear(); state.tlMsg=null; tlRender(); } },1800);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u2_l07_불균형문제.html'; }
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
</script>

성취기준 [6사02-02] · 교과서 p.86~90 · 지도서(대단원2 **11~12차시** 인구 분포의 불균형에 따른 문제점을 알아볼까요, 지도서 p.186~191) 근거
학습 목표: 우리나라 인구 분포의 불균형에 따른 문제점을 설명할 수 있다.
직접조작: 되풀이되는 고리 잇기(신규 패턴 — 순환 완성형)
  ⭐ 지도서 수업 기법이 「**사례 탐구하기**」이고, 이 차시의 핵심 인지 구조는 지도서 핵심 질문의 답에 그대로 적혀 있다 —
     “인구가 집중하는 지역은 일자리와 시설이 **다시** 늘어나고, 늘어난 일자리와 시설로 **더 많은** 인구가 모이게 됩니다.”
     비수도권도 같은 모양이다 — “이러한 문제들은 **다시** 사람들을 떠나게 하여 지역의 생활 환경은 더 나빠질 수 있습니다.”
     즉 이 차시가 가르치는 것은 사건의 목록이 아니라 **되풀이되는 고리**다.
  ⭐ 지금까지 스물한 종의 조작은 전부 **끝이 있는 길** 위에 있었다(줄·가지·축·되돌아보기 모두 끝점이 있다).
     이번은 **끝이 없는 고리**다 — 마지막 마디를 채우는 순간 화살표가 **처음 마디로 되돌아 이어지고**,
     그 자리에서 “이 일이 되풀이된다”가 눈으로 보인다. 고리가 닫혀야만 결과란이 열린다.
  ① 고리 ㉠ 수도권 — 시작 마디는 주어져 있다(“사람들이 수도권으로 모여요”). 남은 두 마디를 차례로 채운다.
     ② 일자리와 시설이 더 늘어나요 → ③ 늘어난 일자리와 시설을 찾아 더 많은 사람이 모여요 → 화살표가 ①로 되돌아간다.
     고리가 닫히면 **결과 3택**이 열린다(주택 부족·교통 혼잡·환경 문제).
  ② 고리 ㉡ 비수도권 — ① 청장년층이 수도권으로 빠져나가요(주어짐) →
     ② 상점·병원·학교가 줄어들어요 → ③ 생활이 불편해져 사람들이 더 떠나요 → 되돌아간다.
     결과 3택(빈집·폐교가 늘고 일손이 부족해짐).
  ③ 두 고리를 다 닫아야 **마무리 3택**이 열린다 — “두 고리가 함께 돌면 우리나라 전체에는?”(국가 경쟁력).
  ⭐ 마친 고리로는 자유롭게 오갈 수 있고, 오가도 채운 마디와 결과가 보존된다(읽기 전용).
  ⚠️ 가드 8종: 완성 후 전체 잠금 / 무효 고리·마디·선택 번호(`Number.isInteger`) /
     아직 열리지 않은 고리 이동 무시(㉠ 결과 전 ㉡ 잠금) / 앞 마디 미완성 시 뒤 마디 선택 무시(순서 강제) /
     고리가 닫히기 전 결과 3택 무시(순서) / 이미 채운 마디 재입력 무시 /
     두 고리 완성 전 마무리 무시 / 오답 안내 표시 중 재클릭 무시. 재시도 허용(감점 없음).
  ⚠️ 정직 원칙: 고리 도식은 인과의 흐름을 나타낸 **개념 도식**이며 통계 자료가 아니다.
지도서 근거:
  [동기 유발 · 전시 학습 되돌아보기] 2020년대 우리나라 인구 분포의 특징 = **수도권으로의 인구 집중**이 두드러졌다 /
    인구 구조는 수도권에 **청장년층** 비율이 높고 비수도권에 **노년층** 비율이 높다. (= 10차시 회수)
  [학습 문제] 우리나라 인구 분포의 불균형에 따른 문제점을 살펴봅시다.
  [전개 1 · 수도권] 인구가 국토의 일부 지역에 집중하면 여러 가지 문제가 생길 수 있다. 수도권에서는 너무 많은 인구 때문에
    **일자리 부족 문제, 주택 문제, 환경 오염, 교통 혼잡과 시설 부족 문제** 등이 나타나기도 한다.
    교과서 본문 원문 3매 = “**주택이 부족해지고 주택 가격이 오릅니다**” / “**쓰레기가 많이 생겨 처리하기 어려워집니다**” /
    “**도로에 차가 많아 교통 체증이 생기고, 지하철이나 버스에 승객이 많아져 혼잡합니다**”.
    사진 해설 = ① 평지에 집 지을 자리가 부족해 **언덕까지 집을 지은 모습과 고층 아파트** ② 쓰레기 배출량 증가 + 매립지·소각장 부지 부족.
    핵심 질문 답 = 수도권 인구가 계속 늘어나면 → 일자리와 시설이 부족해져 **새로운 인구를 위한 일자리와 시설이 늘어나고**,
    **늘어난 일자리와 시설로 더 많은 인구가 모이게 된다**. → 수도권 집중은 더욱 심해지고 비수도권 인구는 계속 줄어든다.
    수도권의 많은 인구는 새로운 시설이나 일자리를 수도권으로 모여들게 하는 요인이 되기도 하며,
    이러한 현상이 계속되면 **수도권과 비수도권 사이의 격차가 커지고 인구 분포의 불균형도 심해진다**.
  [미디어 활동 · p.87] 최근 10년간 비수도권의 20대 청년 약 **60만 명**이 수도권으로 이동했다
    (2013~2022년 수도권 20대 **순이동 인구 59만 1,000명**). 주요 원인은 **취업과 학업**이며,
    임금·일자리·경제 성장 정도의 차이, 편의 시설·문화 및 의료 서비스 차이, 대학 진학 등이 영향을 준다.
    빈칸 요약 예시 답안 = “**비수도권** 지역의 20대 청년이 **수도권**(으)로 이동했다.”
    까닭 예시 답안 = 수도권의 **일자리와 교육 기회, 편의 시설** 등을 찾아 청장년층 인구가 모여들었기 때문이다.
    영향 예시 답안 = 수도권에 사람이 더 모여들면 수도권과 비수도권의 **격차가 커져 국토 균형 발전이 어려워진다**.
    ⚠️ 기사 원문은 옮기지 않고 사실만 자체 문장으로 재구성했다. 신문사 이름·통계 기관 이름은 0.
  [전개 2 · 비수도권] 사람들이 빠져나간 비수도권에서는 **각종 시설 감소, 빈집 증가, 폐업, 일자리 감소** 등의 문제가 나타난다.
    청장년층 인구가 수도권으로 이동하면서 **노년층 인구 비중이 높아지고 일손이 부족해지기도** 한다.
    이러한 문제들은 **다시 사람들을 떠나게 하여** 지역의 생활 환경은 더 나빠질 수 있다.
    빈집 = **환경 문제와 안전 문제, 범죄 문제**가 발생할 수 있다. 병원이 사라지면 = 치료를 받으러 먼 지역으로 가야 한다.
    학교가 폐교되면 = 다양한 교육 활동을 하기 어렵고 먼 곳의 학교에 다녀야 한다.
    [친구와 활동 · p.88] 상점이나 공장이 사라지면? 예시 답안 = **생활에 필요한 물건을 구하기 어려워지고 일자리가 줄어
    다른 지역으로 옮겨 가는 사람이 늘어난다**.
  [미디어 활동 · p.89] 1학년 신입생이 없는 초등학교가 **2022년 121곳에서 2024년 157곳**으로 늘었다.
    수도권에는 **9개 학교**만 신입생이 없고, 비수도권에서 1학년 신입생이 없는 학교는 **148개**다.
    빈칸 요약 예시 답안 = “1학년 신입생이 없는 초등학교 수는 **비수도권** 지역에서 많이 나타났다.”
    원인 예시 답안 = 우리나라의 인구가 수도권으로 집중함에 따라 **인구 분포의 불균형이 심해져** 비수도권에서 많이 나타났다.
    ⚠️ 시·도별 개수(전북 34 등)는 지역 이름 암기로 흐를 수 있어 쓰지 않고, **수도권 9 / 비수도권 148** 대비만 쓴다.
  [낱말] 순이동 = 거주지를 옮겨 지역으로 **들어온 인구수에서 나간 인구수를 뺀 값**.
    국가 경쟁력 = 한 나라가 **경제, 기술, 사회, 정치 등 다양한 분야에서 다른 나라와 경쟁하는 힘**.
  [본문 마무리] 인구 분포의 불균형은 수도권과 비수도권의 문제에 그치지 않고 **국가 경쟁력을 떨어뜨릴 수 있다**.
    따라서 수도권과 비수도권의 **지역 격차를 줄이고, 국토의 균형 발전을 위해 노력하는 것이 중요**하다.
  [풍덩 사회 속으로] **식품 사막** = 신선 식품을 손쉽게 구할 수 없거나 장 보기가 어려운 지역.
    까닭 = 지역의 인구가 줄면서 신선 식품이 팔리지 않자 **상점이 있어도 신선 식품을 들여놓지 않기 때문**이다.
    문제 = 신선 식품을 구할 수 없어 **건강한 식생활이 어려워진다**. 대안 = **이동형(이동식) 상점**.
  [꼭 기억해요] 1. 수도권에서는 인구가 지나치게 집중하여 **교통 혼잡** 문제가 나타납니다. (○)
    2. 인구 분포의 **불균형**은 국가 경쟁력을 떨어뜨릴 수 있습니다.
  [11~12차시 주요 내용 정리] 1. 인구가 집중하는 수도권에서 나타나는 문제 ① 주택 부족과 주택 가격 상승 ② 교통과 주차 문제
    ③ 쓰레기 증가와 환경 문제 ④ 인구 집중과 환경 악화로 삶의 질 저하.
    2. 인구가 감소하는 비수도권에서 나타나는 문제 ① 시설과 일자리 감소 ② 빈집과 폐교 발생
    ③ 병원·도서관 등 생활 편의 시설 감소 ④ 청장년층 유출로 일손 부족. → 16슬 정리를 이 두 항 그대로 옮겼다.
  [지도 꿀 Tip] 20대 청년들이 수도권으로 옮겨 간 까닭과 이런 현상이 계속되면 나타날 문제를 함께 생각해 보도록 지도한다 /
    1학년 신입생이 없는 초등학교는 주로 어떤 지역에 분포하고 있는지 살펴보도록 지도한다.
  [차시 예고] 다음 시간에는 인구 분포의 불균형을 해결하기 위한 다양한 노력을 살펴보겠습니다.
⚠️ 설계 원칙:
  · **13~14차시(l08) 선행 침범 0** — 해결을 위한 **구체적 노력·정책**(수도권 집중 억제 정책, 비수도권 장려 정책,
    혁신 도시, 공공 기관 지방 이전, 국가 균형 발전 사업, 고향 사랑 기부제, 인구 감소 지역 지정 등)이 전부 0이다.
    ⚠️ 다만 **“지역 격차를 줄이고 국토의 균형 발전을 위해 노력하는 것이 중요하다”는 방향 진술은 11~12차시 소관**이다 —
    교과서 p.89 본문에 그대로 실려 있다. 그래서 **노력이 중요하다는 데까지만 쓰고, 어떤 노력인지는 쓰지 않는다**.
    풍덩의 **이동형 상점**도 11~12차시 풍덩 자료라 예외가 아니라 소관 안이다.
  · 교사용 참고 자료(균형 발전 1.0/2.0 패러다임, 지방 시대 위원회, 기회 발전 특구, 생산 연령 인구·고령화,
    쇼핑 난민, 지역별 의료비 통계, 인구 감소 지역 지정 기준)는 성취기준 밖이므로 0.
  · 지역 이름은 **수도권의 범위(서울특별시·인천광역시·경기도)**만 쓴다 — 10차시에서 배운 낱말 정의라 회수 대상이다.
    시·도별 순위·개수를 외우게 하는 문항은 0(지도상의 유의점 — 사실적 지식보다 정보 파악·일반화 도출).
  · 연도·수치는 지도서·교과서 원문값만 쓴다 — 60만 명 / 59만 1,000명 / 2013~2022년 / 2022년 121곳 / 2024년 157곳 /
    수도권 9개 · 비수도권 148개. 그 밖의 수치와 출처 기관명은 0.
  · 회수 — **수도권·비수도권·인구 분포·불균형·청장년층·노년층**은 10차시(l06)에서, **인구 밀도·인문환경**은 9차시(l05)에서
    배운 낱말이라 되받아 쓴다.
  · 정서 — 특정 지역을 뒤떨어진 곳으로 그리지 않는다. 문제는 **지역 사이의 격차**이지 어느 한 지역의 흠이 아니다.

  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.ka-tags{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ka-bg{background:var(--amber-bg);color:var(--amber);padding:5px 14px;border-radius:30px;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}
.ka-bg.s5{background:var(--bub);color:var(--green)}
.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.scene{width:clamp(120px,20vw,160px);border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;
  display:flex;flex-direction:column;animation:pop .4s ease both}
.scene svg{width:100%;height:clamp(74px,11vw,96px);display:block}
.scene .cap{padding:7px 4px;text-align:center;font-weight:700;font-size:clamp(13px,2.1vw,16px);color:var(--ink);background:#F8FAFC}
.scene.wide{width:clamp(240px,44vw,420px)}
.scene.wide svg{height:clamp(120px,20vw,200px)}
.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F5FBFC;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 되풀이되는 고리 잇기(순환 완성형) */
.cy-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.cy-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cy-tabs button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 6px;cursor:pointer;
  font-family:inherit;font-weight:800;color:#475569;font-size:clamp(11px,1.86vw,13.6px);transition:.15s;line-height:1.3}
.cy-tabs button:hover{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.cy-tabs button.on{border-color:var(--green);background:var(--green);color:#fff}
.cy-tabs button.fin{border-color:var(--cyan);background:#DFF0E7;color:#1C4D35}
.cy-tabs button.fin.on{background:var(--cyan);color:#fff}
.cy-tabs button.lock{opacity:.45;cursor:default;border-style:dashed}
.cy-body{display:grid;grid-template-columns:1.06fr 1fr;gap:10px;align-items:start}
.cy-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}

.cy-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);

.cy-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.cy-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.cy-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.cy-msg.warn{border-left-color:var(--red)}
.cy-msg b{color:var(--green)}
.cy-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.cy-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.cy-gauge{display:flex;align-items:center;gap:5px}
.cy-gauge .dot{width:15px;height:15px;border-radius:50%;border:2px solid #CBD5E0;background:#fff}
.cy-gauge .dot.on{border-color:var(--green);background:var(--green)}
.cy-gauge .tx{font-size:clamp(10px,1.7vw,12.4px);font-weight:800;color:#475569;margin-left:3px}
.cy-q{font-size:clamp(11.4px,1.93vw,13.8px);font-weight:800;color:var(--green-d);line-height:1.5;padding:0 2px}
.cy-list{display:flex;flex-direction:column;gap:5px}
.cy-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.4px,1.77vw,12.8px);
  text-align:left;transition:.15s;line-height:1.4}
.cy-list button:hover{border-color:var(--green);background:var(--bub)}
.cy-list button.set{opacity:.5;border-style:dashed;cursor:default}
.cy-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.cy-loop{display:inline-flex;align-items:center;gap:4px;font-size:clamp(9.6px,1.62vw,11.6px);font-weight:800;
  color:#8A6D3B;background:#FFFDF5;border:1px solid #E7D9A8;border-radius:7px;padding:3px 7px;align-self:flex-start}
.stepbtn{border:2px solid var(--amber);background:#FFF8E1;color:var(--amber);border-radius:10px;padding:9px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.6px,1.8vw,13px);transition:.15s}
.stepbtn:hover{background:#FDECC8}
.stepbtn:disabled{opacity:.42;cursor:default}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.tipbox{background:#E0F2FE;border-radius:12px;padding:10px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#0C4A6E;max-width:660px;border-left:4px solid #0369A1}
@media(max-width:620px){ .cy-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(14,116,144,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 모든 그림은 내용을 나타낸 도식이며 실제 사진·통계 지도가 아니다.
   청년 이동 인구(약 60만 명 / 순이동 59만 1,000명)와 신입생이 없는 초등학교 수
   (2022년 121곳 → 2024년 157곳 / 수도권 9 · 비수도권 148)는 교과서 p.87·p.89 원문 수치를 그대로 옮겼다.
   ⚠️ 특정 지역을 뒤떨어진 곳으로 그리지 않는다 — 문제는 지역 사이의 격차이지 어느 한 지역의 흠이 아니다. */

/* 사람 도형 */
function person(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <circle cx="0" cy="-6" r="3.4" fill="${col}"/>
    <path d="M-4.2 6 q0 -7 4.2 -7 q4.2 0 4.2 7 Z" fill="${col}"/></g>`;
}
/* 집 도형 */
function house(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-9 0 L0 -8 L9 0 Z" fill="${col}"/>
    <rect x="-6.4" y="0" width="12.8" height="9" fill="${col}" opacity=".75"/></g>`;
}
/* 건물 도형 */
function tower(x,y,w,h,col){
  let win="";
  for(let r=0;r<Math.floor(h/9);r++){ for(let c=0;c<Math.floor(w/7);c++){
    win += `<rect x="${x+3+c*7}" y="${y-h+5+r*9}" width="3.4" height="4.4" fill="#ffffff" opacity=".72"/>`; } }
  return `<g><rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="1.6" fill="${col}"/>${win}</g>`;
}
/* 말풍선 */
function bubble(x,y,w,h,txt,fs){
  const lines = txt.split('|');
  let t='';
  lines.forEach((ln,i)=>{ t += `<text x="${x+w/2}" y="${y+15+i*(fs+3)}" font-size="${fs}" fill="#334155" text-anchor="middle">${ln}</text>`; });
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="#ffffff" stroke="#0E7490" stroke-width="1.8"/>
    <path d="M${x+w/2-5} ${y+h} L${x+w/2+5} ${y+h} L${x+w/2} ${y+h+7} Z" fill="#ffffff" stroke="#0E7490" stroke-width="1.8"/>${t}</g>`;
}

const SVG = {
  /* 1 [동기 유발] 지난 시간 되돌아보기 — 수도권과 비수도권 */
  open:`<svg viewBox="0 0 320 180"><rect width="320" height="180" fill="#F8FAFC"/>
    <rect x="10" y="24" width="144" height="132" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="1.6"/>
    <rect x="166" y="24" width="144" height="132" rx="10" fill="#F0FDF4" stroke="#3F9169" stroke-width="1.6"/>
    <text x="82" y="40" font-size="11" fill="#0C4A6E" text-anchor="middle" font-weight="800">수도권</text>
    <text x="238" y="40" font-size="11" fill="#1C4D35" text-anchor="middle" font-weight="800">비수도권</text>
    ${tower(26,120,20,44,"#3E7C93")}${tower(52,120,20,56,"#2C6A80")}${tower(78,120,20,38,"#4E8CA2")}
    ${tower(104,120,20,50,"#2C6A80")}${tower(130,120,18,32,"#5C99AE")}
    ${house(190,120,1.05,"#4E8C6A")}${house(226,120,1.05,"#5F9B78")}${house(262,120,1.05,"#4E8C6A")}
    ${[32,46,60,74,88,102,116,130,40,54,68,82,96,110,124].map((x,i)=>person(x,142-(i>7?12:0),.72,"#0C4A6E")).join("")}
    ${[196,232,268].map(x=>person(x,142,.72,"#1C4D35")).join("")}
    <text x="82" y="166" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">사람이 많이 모여 살아요</text>
    <text x="238" y="166" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">사람이 줄어들고 있어요</text>
    <text x="160" y="17" font-size="9.6" fill="#64748B" text-anchor="middle">지난 시간에 배운 우리나라의 인구 분포</text></svg>`,

  /* 2 수도권에서 나타나는 문제 — 개요 */
  city:`<svg viewBox="0 0 320 190"><rect width="320" height="190" fill="#F8FAFC"/>
    <text x="160" y="17" font-size="10.4" fill="#0C4A6E" text-anchor="middle" font-weight="800">인구가 집중하는 수도권에서는</text>
    ${tower(16,86,22,50,"#3E7C93")}${tower(44,86,22,62,"#2C6A80")}${tower(72,86,22,44,"#4E8CA2")}
    ${tower(100,86,22,56,"#2C6A80")}${tower(128,86,22,38,"#5C99AE")}

    ${[24,44,64,84,104,124,144].map(x=>person(x,110,.66,"#0C4A6E")).join("")}
    <g>
      <rect x="166" y="30" width="142" height="30" rx="8" fill="#FFF8E1" stroke="#B45309" stroke-width="1.4"/>
      <text x="237" y="49" font-size="10" fill="#8A6D3B" text-anchor="middle" font-weight="700">주택 부족 · 가격 상승</text>
      <rect x="166" y="66" width="142" height="30" rx="8" fill="#FFF8E1" stroke="#B45309" stroke-width="1.4"/>

/* 상태 판정 헬퍼 */
function cyFilled(st,L){ return st.cyNode[L].filter(v=>v!=null).length; }
function cyClosed(st,L){ return cyFilled(st,L) >= CY[L].nodes.length; }
function cyLoopDone(st,L){ return cyClosed(st,L) && st.cyRes[L]!=null; }
function cyBothDone(st){ return cyLoopDone(st,0) && cyLoopDone(st,1); }
function cyAllDone(st){ return cyBothDone(st) && st.cyFin!=null; }
/* 지금 채울 차례인 마디 번호(없으면 -1) */
function cyCursor(st,L){ const n=st.cyNode[L]; for(let i=0;i<n.length;i++){ if(n[i]==null) return i; } return -1; }

/* 마디 상자 */
function cyBox(x,y,lines,mode,col){
  const on = mode==='on', cur = mode==='cur';
  const fill = on ? '#F0F9FB' : (cur ? '#FFF8E1' : '#F8FAFC');
  const stk  = on ? col : (cur ? '#B45309' : '#94A3B8');
  const dash = on ? '' : (cur ? '' : ' stroke-dasharray="4 3"');
  const tcol = on ? '#0F172A' : (cur ? '#8A6D3B' : '#94A3B8');
  const t = lines.map((ln,i)=>`<text x="${x+70}" y="${y+(lines.length===1?21:15)+i*13}" font-size="8.2" fill="${tcol}" text-anchor="middle" font-weight="700">${ln}</text>`).join("");
  return `<g><rect x="${x}" y="${y}" width="140" height="34" rx="8" fill="${fill}" stroke="${stk}" stroke-width="1.8"${dash}/>${t}</g>`;
}

/* 고리 캔버스 — 마지막 마디가 채워지면 되돌아가는 화살표가 그려진다 */
function cyCanvas(st){
  const L = st.cyLoop, C = CY[L], cur = cyCursor(st,L), closed = cyClosed(st,L);
  let boxes = cyBox(18,8,C.seed,'on',C.color);
  for(let i=0;i<C.nodes.length;i++){
    const y = 58 + i*50;
    const picked = st.cyNode[L][i];
    if(picked!=null) boxes += cyBox(18,y,C.nodes[i].fill,'on',C.color);
    else boxes += cyBox(18,y,["? 여기에 들어갈 일을","골라 봐요"], i===cur?'cur':'off', C.color);
  }
  const down = [42,92].map((y,i)=>{
    const lit = st.cyNode[L][i]!=null || i===cur;
    const c = st.cyNode[L][i]!=null ? C.color : (i===cur ? '#B45309' : '#CBD5E0');
    return `<g><path d="M88 ${y} L88 ${y+12}" stroke="${c}" stroke-width="${lit?2.6:2}" fill="none"/>
      <path d="M83 ${y+11} L88 ${y+17} L93 ${y+11} Z" fill="${c}"/></g>`;
  }).join("");
  const back = closed
    ? `<g><path d="M158 125 Q184 125 184 100 L184 50 Q184 25 158 25" stroke="${C.color}" stroke-width="2.6" fill="none"/>
        <path d="M164 20 L156 25 L164 30 Z" fill="${C.color}"/>
        <text x="196" y="78" font-size="7.6" fill="${C.color}" text-anchor="middle" font-weight="800" transform="rotate(90 196 78)">되풀이돼요</text></g>`
    : `<g><path d="M158 125 Q184 125 184 100 L184 50 Q184 25 158 25" stroke="#CBD5E0" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
        <text x="196" y="78" font-size="7.6" fill="#94A3B8" text-anchor="middle" font-weight="800" transform="rotate(90 196 78)">아직 열린 길</text></g>`;
  return `<div class="cy-canvas"><svg viewBox="0 0 208 158">
    <rect width="208" height="158" fill="#fff"/>
    ${back}${down}${boxes}
  </svg><div class="cvcap">일이 이어지는 흐름을 나타낸 도식이에요</div></div>`;
}

/* 조작 패널 — 왼쪽 고리, 오른쪽 지금 할 일 */
function cyPanel(st){
  const L = st.cyLoop, C = CY[L], cur = cyCursor(st,L);
  const openable = [true, cyLoopDone(st,0)];
  const tabs = CY.map((c,i)=>{
    const cls = (i===L?'on':'') + (cyLoopDone(st,i)?' fin':'') + (openable[i]?'':' lock');
    return `<button class="${cls}" onclick="goLoop(${i})">${openable[i]?'':'🔒 '}${c.tab}${cyLoopDone(st,i)?' ✓':''}</button>`;
  }).join("");

  let right = "";
  if(cyAllDone(st)){
    right = `<div class="cy-step">두 고리를 다 이었어요</div>
      <div class="cy-card"><div class="pt">⭐ 되풀이되는 두 고리</div>
        수도권에서는 사람이 모여 <b>시설과 일자리가 늘고, 그래서 더 모이는 일</b>이 되풀이되고,
        비수도권에서는 사람이 떠나 <b>시설이 줄고, 그래서 더 떠나는 일</b>이 되풀이돼요.
        그 사이에서 <b>지역 격차</b>가 점점 커져요.</div>
      <div class="cy-msg">탭을 눌러 두 고리를 얼마든지 다시 견주어 봐도 좋아요.</div>`;
  } else if(!cyClosed(st,L)){
    const N = C.nodes[cur], need = C.nodes.length, have = cyFilled(st,L);
    const list = N.opts.map((o,k)=>`<button class="${st.cyWrongNode===k?'no':''}" onclick="pickNode(${k})">${o}</button>`).join("");
    const dots = Array.from({length:need},(_,i)=>`<span class="dot ${i<have?'on':''}"></span>`).join("");
    right = `<div class="cy-step">${C.title} · 마디 ${cur+2} 잇기</div>
      <div class="cy-msg ${st.cyWarn?'warn':''}">${st.cyMsg||'앞 마디에서 이어지는 일을 골라 봐요.'}</div>
      <div class="cy-gauge">${dots}<span class="tx">${have} / ${need}</span></div>
      <div class="cy-q">${N.q}</div>
      <div class="cy-list">${list}</div>`;
  } else if(st.cyRes[L]==null){
    const R = C.result;
    const list = R.opts.map((o,k)=>`<button class="${st.cyWrongRes===k?'no':''}" onclick="pickRes(${k})">${o}</button>`).join("");
    right = `<div class="cy-step">${C.title} · 고리가 닫혔어요</div>
      <div class="cy-loop">🔁 화살표가 처음으로 되돌아갔어요</div>
      <div class="cy-msg ${st.cyWarn?'warn':''}">${st.cyMsg||'고리가 한 번 돌 때마다 같은 일이 되풀이돼요.'}</div>
      <div class="cy-q">${R.q}</div>
      <div class="cy-list">${list}</div>`;
  } else if(!cyBothDone(st)){
    right = `<div class="cy-step">${C.title} — 다 이었어요</div>
      <div class="cy-msg">${st.cyMsg||`이 고리를 다 이었어요. 탭을 눌러 <b>${CY[L===0?1:0].tab}</b> 고리도 이어 봐요.`}</div>`;
  } else {
    const list = CY_FIN.opts.map((o,k)=>`<button class="${st.cyWrongFin===k?'no':''}" onclick="pickFin(${k})">${o}</button>`).join("");
    right = `<div class="cy-step">③ 두 고리를 함께 보기</div>
      <div class="cy-msg ${st.cyWarn?'warn':''}">${st.cyMsg||'두 고리를 나란히 떠올려 봐요.'}</div>
      <div class="cy-q">${CY_FIN.q}</div>
      <div class="cy-list">${list}</div>
      <div class="cy-msg">탭을 옮겨 두 고리를 <b>번갈아 보며</b> 골라도 좋아요.</div>`;
  }
  return `<div class="cy-wrap">
    <div class="cy-tabs">${tabs}</div>
    <div class="cy-body">${cyCanvas(st)}<div class="cy-right">${right}</div></div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function cyRender(){ main.innerHTML = slides[state.idx].render(state); }
function cyClear(){ state.cyWrongNode=null; state.cyWrongRes=null; state.cyWrongFin=null; state.cyWarn=false; }

/* 고리 옮기기 — 마친 고리로는 자유롭게 되돌아갈 수 있다 */
function goLoop(L){
  if(!(Number.isInteger(L) && L>=0 && L<CY.length)) return;        // ② 무효 고리 번호(정수만)
  if(L===1 && !cyLoopDone(state,0)) return;                        // ③ 아직 열리지 않은 고리 이동 무시
  if(state.cyLoop===L) return;
  state.cyLoop = L; state.cyMsg=null; cyClear();
  state.cyVisits++;
  playBlip(); cyRender();
}

/* ① 마디 잇기 — 앞 마디부터 차례로만 채운다 */
function pickNode(k){
  if(cyAllDone(state)) return;                                     // ① 완성 후 전체 잠금
  const L = state.cyLoop, cur = cyCursor(state,L);
  if(cur < 0) return;                                              // ⑥ 이미 다 채운 고리 재입력 무시
  const N = CY[L].nodes[cur];
  if(!(Number.isInteger(k) && k>=0 && k<N.opts.length)) return;    // ②
  if(state.cyWrongNode!=null) return;                              // ⑧ 오답 안내 표시 중 재클릭 무시
  if(k===N.ok){
    state.cyNode[L][cur]=k; cyClear();
    state.cyMsg = N.yes;
    playChime(); cyRender();
    return;
  }
  state.cyWrongNode=k; state.cyWarn=true;
  state.cyMsg = N.no[k < N.ok ? k : k-1];
  playThud(); cyRender();
  setTimeout(()=>{ if(state.cyWrongNode===k){ cyClear(); state.cyMsg=null; cyRender(); } },1800);
}

/* ② 결과 3택 — 고리가 닫혀야 열린다 */
function pickRes(k){
  if(cyAllDone(state)) return;                                     // ①
  const L = state.cyLoop;
  if(!cyClosed(state,L)) return;                                   // ⑤ 고리가 닫히기 전 결과 무시(순서)
  if(state.cyRes[L]!=null) return;                                 // ⑥ 이미 고른 결과 재입력 무시
  const R = CY[L].result;
  if(!(Number.isInteger(k) && k>=0 && k<R.opts.length)) return;    // ②
  if(state.cyWrongRes!=null) return;                               // ⑧
  if(k===R.ok){
    state.cyRes[L]=k; cyClear();
    state.cyMsg = R.yes + (cyBothDone(state)
      ? ' 이제 <b>두 고리를 함께</b> 봐요.'
      : ` 탭을 눌러 <b>${CY[L===0?1:0].tab}</b> 고리도 이어 봐요.`);
    playChime(); cyRender();
    return;
  }
  state.cyWrongRes=k; state.cyWarn=true;
  state.cyMsg = R.no[k < R.ok ? k : k-1];
  playThud(); cyRender();
  setTimeout(()=>{ if(state.cyWrongRes===k){ cyClear(); state.cyMsg=null; cyRender(); } },1800);
}

/* ③ 두 고리 마무리 */
function pickFin(k){
  if(cyAllDone(state)) return;                                     // ①
  if(!cyBothDone(state)) return;                                   // ⑦ 두 고리 완성 전 마무리 무시(순서)
  if(!(Number.isInteger(k) && k>=0 && k<CY_FIN.opts.length)) return; // ②
  if(state.cyWrongFin!=null) return;                               // ⑧
  if(k===CY_FIN.ok){
    state.cyFin=k; cyClear(); state.cyMsg=null;
    playChime(); cyRender();
    return;
  }
  state.cyWrongFin=k; state.cyWarn=true;
  state.cyMsg = CY_FIN.no[k < CY_FIN.ok ? k : k-1];
  playThud(); cyRender();
  setTimeout(()=>{ if(state.cyWrongFin===k){ cyClear(); state.cyMsg=null; cyRender(); } },1800);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../index.html'; } // ⚠️ l08 미양산 — 허브 복귀
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

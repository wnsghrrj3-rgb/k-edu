K-edu 사회 5-1 · 2단원 우리나라 지리 탐구 · 단원 마무리 · 16차시(l10)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사02-01]·[6사02-02] 통합 정리 · 교과서 p.100~103 · 지도서(대단원2 **16차시** 단원 마무리, 지도서 p.210~211) 근거
학습 목표: ‘우리나라 지리 탐구’에서 공부한 내용을 생각 그물과 교실 놀이로 정리할 수 있다.
수업 기법 및 전략: 돌아가며 말하기 · 교실 놀이하기
직접조작: 에너지 채우기 놀이 판(신규 패턴 — 겹침 판정형)
  ⭐ 앞의 스물네 종은 전부 **내가 옳으면 그만큼 나아갔다**. 잇기·쌓기·환산·대조·고리·잣대·퇴고 모두
     옳고 그름 하나로 결과가 정해졌다. 이번만 다르다 — **옳아도 아무 일이 일어나지 않을 수 있다.**
     낱말을 넣어 옳은 문장을 말해도 **같은 낱말을 쓴 친구가 한 명도 없으면 아무도 칸을 칠하지 못한다**
     (교과서 p.102 규칙 4 원문). 판정 축이 처음으로 둘이다 —
     ㉠ 내가 옳은 문장을 만들었는가(내 몫) + ㉡ 그 낱말을 쓴 사람이 또 있는가(내 손 밖의 일).
     그래서 판을 채우는 첫 단계부터 **친구들도 떠올릴 만한 낱말인가**를 생각하게 된다.
     이 놀이의 전략이 곧 “단원에서 중요한 낱말이 무엇이었나”를 되짚는 일이 되는 구조다.
  ① 판 채우기 — 교과서 |보기| **45개 원문 전량**에서 골라 놀이 판 **16칸**을 채운다.
     이미 판에 있는 낱말은 다시 넣을 수 없고, 「마지막 낱말 빼기」로 되돌릴 수 있다.
     16칸이 다 차야 「놀이 시작」이 열린다(순서 강제).
  ② 내 차례 — 아직 말하지 않은 낱말 하나를 고르면 **그 낱말이 들어간 문장 3택**이 열린다.
     정답 자리는 낱말 차례에 따라 0·1·2로 돌아간다(`egAt(i)=i%3`).
     · 옳은 문장 → **겹침 판정**. 그 낱말을 쓴 사람이 둘 이상이면 **그 사람들 모두** 한 칸씩 칠한다.
       한 명도 없으면 아무도 칠하지 못하고, 그 칸은 **바꿀 수 있는 칸**이 된다(교과서 별표 규칙 —
       자기만 쓴 용어는 다음 자기 차례에 아직 쓰지 않은 다른 용어로 바꿀 수 있다, 한 번에 하나만).
     · 틀린 문장 → 아무도 칠하지 못하고 차례가 넘어간다. 그 낱말은 **다시 말할 수 있다**(교과서 별표 규칙).
  ③ 친구 차례 — 「다음 차례 →」를 누르면 친구 ㉠·㉡·㉢이 차례로 자기 판의 낱말을 말한다.
     친구가 말한 낱말을 **내가 썼으면 내 칸도 칠해진다** — 그래서 겹치는 낱말을 쓸수록 유리하다.
  ④ 에너지 **8칸**을 먼저 채운 사람이 이긴다. 지도서 “놀이 인원에 따라 승리하는 에너지 칸 개수를
     조정할 수 있습니다”에 따라 넷이서 짧게 하도록 정했고, 그 사실을 판 아래 캡션에 적었다.
  ⚠️ 친구 셋의 놀이 판(`EG_FRIEND`)과 말하는 차례(`EG_SAY`)는 **고정 리터럴 — 난수 0**이라
     jsdom에서 겹침 계산·에너지 누적·승패까지 그대로 검증할 수 있다.
     친구끼리의 겹침도 설계했다 — ㉠∩㉡ 4개, ㉠∩㉢ 4개, **㉡∩㉢ 0개**.
     흔한 낱말을 고른 학생은 3~4번째 차례에 이기고, 아무도 안 쓸 낱말만 고른 학생은
     5번째 차례에 친구 ㉠이 먼저 8칸을 채워 끝난다 — 어느 쪽이든 놀이는 반드시 끝난다.
  ⚠️ 가드 8종: ① 놀이가 끝난 뒤 전체 잠금 / ② 무효 낱말·칸·문장 번호(`Number.isInteger`) /
     ③ 판이 다 차기 전 「놀이 시작」 무시 · 시작 뒤 판 고치기 무시(순서 강제) /
     ④ 내 차례가 아닐 때 낱말 클릭 무시 · 내 차례에 말하지 않고 차례 넘기기 무시 /
     ⑤ 이미 말한 낱말 재사용 무시 / ⑥ 문장이 열려 있는 동안 다른 클릭 무시 /
     ⑦ 문장이 열리지 않았을 때 문장 클릭 무시 / ⑧ 같은 낱말을 판에 두 번 넣기 무시.
     재시도 허용(감점 없음). 조작에는 점수가 붙지 않는다.
낱말 사전: 교과서 p.102 |보기| **45개 전량**에 각각 **옳은 문장 1 + 그 낱말을 잘못 쓴 문장 2**를 달았다.
  틀린 문장은 대부분 **이웃 낱말과 뒤바뀐 것**이다(날씨↔기후 / 인구↔인구 분포 / 인구 분포↔인구 밀도 /
  자연환경↔인문환경 / 수도권↔비수도권 / 여름↔겨울 / 한파↔폭염 / 가뭄↔홍수 …).
  그래서 문장 3택 자체가 단원 낱말의 **경계 확인**이 된다.
지도서 근거(16차시 p.210~211):
  [동기 유발] 단원에서 공부한 내용은 무엇인가요? — 기후가 무엇인지 / 계절별 기후 특징 /
    자연재해와 피해를 줄이려는 노력 / 기후변화로 심해지는 자연재해와 기후 행동 /
    인구 분포가 무엇인지 / 우리나라의 인구 분포 / 불균형에 따른 문제점 / 불균형을 해결하려는 노력.
    ⚠️ 학생들이 자기 생각을 자유롭게 이야기할 수 있도록 편안한 분위기를 유도한다(정답 강요 금지).
  [학습 문제] 단원에서 공부한 내용을 다양한 방법으로 정리해 봅시다.
  [전개 1] ‘생각 그물을 완성해요’ — 빈칸을 채우며 정리한다. **스스로 떠올려 할 수 있도록** 지도한다.
    생각 그물 뼈대(교과서 p.100~101) = 우리나라의 기후(뜻 · 기온·강수·바람) ·
    계절별 기후 특징(봄 온화·건조 / 여름 기온 높고 강수량 절반 이상 집중, 남쪽 바다에서 뜨겁고 습한 바람 /
    가을 맑고 건조 / 겨울 춥고 건조, 북서쪽 육지에서 차갑고 건조한 바람) ·
    자연재해(뜻 · 황사·폭염·호우와 홍수·태풍·한파·가뭄·폭설 · 기상 특보 발표 등 피해를 줄이려는 노력) ·
    기후변화(연평균 기온 상승 · 계절 길이 변화 · 자연재해 심화 · 기후 행동) ·
    인구 분포(인구 · 인구 분포 · 인구 밀도 · 과거 자연환경 → 오늘날 인문환경) ·
    불균형에 따른 문제(수도권: 일자리 부족·주택 문제·환경 오염·교통 혼잡·시설 부족 /
    비수도권: 시설 감소·빈집 증가·폐업·일자리 감소·일손 부족) ·
    해결 노력(정부: 공공 기관 이전·고향 사랑 기부제·청년 마을·지역 기업 육성·교육 기관과 지방 자치 단체 지원 /
    지역: 지역 특색 정책·주거와 교육 환경 개선·일자리 만들기 / 국가 경쟁력 약화 → 균형 발전 유도).
  [전개 2] ‘교실 놀이를 함께해요’ — 에너지 채우기 놀이. 준비물 = 연필, 지우개.
    ① 놀이 판에 주요 용어 16개를 쓴다 ② 순서를 정한다 ③ 자기 용어 하나로 옳은 문장을 말한다.
    같은 용어를 쓴 친구가 한 명 이상 있으면 그 용어를 쓴 사람들 **모두** 에너지 칸을 색칠한다.
    ④ 문장을 만들지 못하거나 같은 용어를 쓴 친구가 없으면 **아무도** 색칠하지 못하고 차례를 넘긴다.
    ⑤ 에너지를 먼저 다 채운 사람이 승리한다. * 인원에 따라 칸 수 조정 가능.
    * 자기만 쓴 용어는 다음 자기 차례에 사용하지 않은 다른 용어로 바꿀 수 있다(한 번에 한 개만).
    * 문장을 만들지 못한 용어는 자기 차례가 돌아왔을 때 다시 문장을 만들어 말할 수 있다.
  [정리] 계절별 기후 특징 / 기후변화로 나타나는 자연재해의 심각성 / 우리나라 인구 분포 특징 /
    불균형에 따른 문제점과 해결 방안을 이야기한다. 차시 예고 = 3단원 ‘법과 인권의 보장’ 도입 활동.
⚠️ 설계 원칙:
  · **3단원(법과 인권의 보장) 선행 침범 0** — 차시 예고에서 단원 이름만 말한다.
    법·인권·헌법·기본권·인권 침해는 전부 0.
  · **지역 이름 0 · 학생 이름 0 · 문항 내 연도·금액·수치 0**(‘1 km²’는 인구 밀도의 정의라 유지).
  · 교사용 참고 자료(단원 평가 문항 원문, 참고 도서, 인구 구조 비율 수치, 신문 기사 사례)는 넣지 않는다.
  · 생각 그물은 교과서 뼈대를 도식으로 옮기되 **두 칸을 비워 두고 [답 보기]로 확인**하게 했다 —
    교실에서 손으로 채우는 활동지를 통째로 대신하지 않는다(l05·l09에서 쓴 정직 규약 승계).
  · 정서 — 놀이의 승패를 성적처럼 다루지 않는다. 완료 안내에서 “이기고 지는 것보다
    낱말을 떠올려 옳은 문장으로 만들어 본 것이 오늘의 공부”라고 명시한다.
  · u1 l12(1단원 마무리)의 **말판·주사위 / 자산 누적형**과 겹치지 않는다 —
    이번 조작에는 말·주사위·상금·구매가 하나도 없다.
⚠️ 2단원 마지막 차시 — goNextLesson = 3단원 l01(법이 무엇인지) 소프트체인.

.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F5FBFC;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 에너지 채우기 놀이 판(겹침 판정형) */
.eg-wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.eg-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.eg-head .tag{background:#F1F5F9;border:2px solid var(--line);border-radius:9px;padding:5px 10px;
  font-size:clamp(10px,1.7vw,12.4px);font-weight:800;color:#475569}
.eg-head .tag.on{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.eg-head .swap{margin-left:auto;border:2px solid #CBD5E0;background:#fff;border-radius:9px;padding:5px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;color:#475569;font-size:clamp(9.6px,1.62vw,11.6px)}
.eg-head .swap:hover{border-color:var(--green);color:var(--green-d);background:var(--bub)}
.eg-body{display:grid;grid-template-columns:1.04fr 1fr;gap:10px;align-items:start}
.eg-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.eg-canvas svg{width:100%;height:auto;display:block}
.eg-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.eg-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.eg-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.eg-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.2px,1.9vw,13.6px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.eg-msg.warn{border-left-color:var(--red)}
.eg-msg b{color:var(--green)}
.eg-msg.warn b{color:#B91C1C}
.eg-q{font-size:clamp(11.4px,1.93vw,13.8px);font-weight:800;color:var(--green-d);line-height:1.5;padding:0 2px}
.eg-pool{display:flex;flex-wrap:wrap;gap:4px;max-height:196px;overflow-y:auto;padding:6px;
  border:2px solid var(--line);border-radius:10px;background:#F8FAFC}
.eg-chip{border:2px solid #CBD5E0;background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;

.eg-chip:hover{border-color:var(--green);background:var(--bub)}
.eg-chip.used{opacity:.4;border-style:dashed;cursor:default;background:#EDF2F7}
.eg-list{display:flex;flex-direction:column;gap:5px}
.eg-list button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;

  text-align:left;transition:.15s;line-height:1.42}
.eg-list button:hover{border-color:var(--green);background:var(--bub)}
.eg-row{display:flex;gap:6px;flex-wrap:wrap}
.eg-go{flex:1;border:2px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:9px 10px;

.eg-go:hover:not(:disabled){background:var(--green-d);border-color:var(--green-d)}
.eg-go:disabled{opacity:.42;cursor:default;border-style:dashed;background:#94A3B8;border-color:#94A3B8}
.eg-undo{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:9px 10px;cursor:pointer;
  font-family:inherit;font-weight:800;color:#475569;font-size:clamp(10.2px,1.74vw,12.4px)}
.eg-undo:disabled{opacity:.42;cursor:default;border-style:dashed}
.eg-swap{flex:1;border:2px solid var(--amber);background:#FFF8E1;color:var(--amber);border-radius:10px;padding:9px 10px;
  cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(10.4px,1.77vw,12.6px)}
.eg-swap:hover{background:#FDECC8}
.eg-tip{background:#E0F2FE;border-radius:10px;padding:8px 11px;font-size:clamp(10.4px,1.77vw,12.6px);
  line-height:1.55;color:#0C4A6E;border-left:4px solid #0369A1}
.eg-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(11.6px,1.98vw,14px);line-height:1.55;animation:pop .35s ease both}
.eg-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.paper .src{margin-top:6px;font-size:clamp(11px,1.9vw,13px);color:#8A6D3B;text-align:right}
.tipbox{background:#E0F2FE;border-radius:12px;padding:10px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#0C4A6E;max-width:660px;border-left:4px solid #0369A1}
@media(max-width:620px){ .eg-body{grid-template-columns:1fr} }


/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}

/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 모든 그림은 정리 도식이며 사진이 아니다.
   생각 그물은 교과서 p.100~101의 뼈대를 그대로 옮긴 것이고,
   교실에서 손으로 채우는 활동지 자체를 대신하지 않는다.
   ⚠️ 지역 이름 0 · 학생 이름 0 · 연도 0. */

/* 이름표 상자 */
function plate(x,y,w,h,txt,fs,bg,st,tc){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${bg||'#fff'}" stroke="${st||'#94A3B8'}" stroke-width="1.6"/>`+
    `<text x="${x+w/2}" y="${y+h/2+fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${tc||'#0F172A'}">${txt}</text>`;
}
/* 두 줄 이름표 */
function plate2(x,y,w,h,t1,t2,fs,bg,st,tc){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${bg||'#fff'}" stroke="${st||'#94A3B8'}" stroke-width="1.6"/>`+
    `<text x="${x+w/2}" y="${y+h/2-fs*0.15}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${tc||'#0F172A'}">${t1}</text>`+
    `<text x="${x+w/2}" y="${y+h/2+fs*1.05}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${tc||'#0F172A'}">${t2}</text>`;
}
/* 잇는 선 */
function link(x1,y1,x2,y2,col){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col||'#94A3B8'}" stroke-width="1.6"/>`;
}
/* 화살표 */
function arrow(x1,y1,x2,y2,col){
  const c=col||'#0E7490';
  const dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/L, uy=dy/L;
  const bx=x2-ux*7, by=y2-uy*7, px=-uy*4, py=ux*4;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="2"/>`+
    `<polygon points="${x2},${y2} ${bx+px},${by+py} ${bx-px},${by-py}" fill="${c}"/>`;
}
/* 사람 도형 */
function figure(x,y,s,col){
  const c=col||'#0E7490';
  return `<circle cx="${x}" cy="${y}" r="${3.4*s}" fill="${c}"/>`+
    `<path d="M ${x-3.6*s} ${y+11*s} q ${3.6*s} ${-6*s} ${7.2*s} 0 z" fill="${c}"/>`;
}
/* 에너지 칸 도형(작은 사각) */
function cell(x,y,w,on){
  return `<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="3" fill="${on?'#0E7490':'#fff'}" stroke="${on?'#0E7490':'#CBD5E0'}" stroke-width="1.5"/>`;
}

/* ===== 직접조작 — 에너지 채우기 놀이 판(신규 패턴 — 겹침 판정형) =====
   ⭐ 스물네 종의 조작은 모두 **내가 옳으면 그만큼 나아갔다**.
      이번만 다르다 — **옳아도 아무 일이 일어나지 않을 수 있다.**
      낱말을 넣어 옳은 문장을 말해도 **같은 낱말을 쓴 친구가 한 명도 없으면 아무도 칸을 칠하지 못한다.**
      판정 축이 처음으로 둘이다: ㉠ 내가 옳은 문장을 만들었는가(내 몫) +
      ㉡ 그 낱말을 쓴 친구가 있는가(내 손 밖의 일).
      그래서 판을 채울 때부터 **친구들도 떠올릴 만한 낱말인가**를 생각하게 된다 — 교과서 놀이의 전략 그대로.
   ⚠️ 보기 낱말 45개는 교과서 p.102 |보기| 원문 전량. 낱말마다 옳은 문장 하나와
      그 낱말을 잘못 쓴 문장 둘을 두었다(정답 자리는 낱말 차례에 따라 0·1·2로 돌아간다).
   ⚠️ 친구 셋의 놀이 판과 말하는 차례는 고정 리터럴 — 난수 0이라 jsdom에서 전 과정을 그대로 검증한다.
   ⚠️ 이기는 에너지 칸 수는 8 — 지도서 “놀이 인원에 따라 승리하는 에너지 칸 개수를 조정할 수 있습니다”에 따라
      넷이서 짧게 하도록 정했고, 판 아래 캡션에 그 사실을 적었다. */

const EG_SLOTS = 16;          // 놀이 판 칸 수 (교과서 원문)
const EG_GOAL  = 8;           // 이기는 에너지 칸 수 (지도서 조정 규칙에 따라 정함)
const EG_NAMES = ["나","친구 ㉠","친구 ㉡","친구 ㉢"];
/* 친구 셋의 놀이 판 — 고정 리터럴(난수 0) */
const EG_FRIEND = [
  [0,1,3,7,12,19,20,21,23,24,25,28,29,31,42,44],
  [0,4,9,10,12,15,16,21,22,24,34,35,36,38,40,41],
  [1,5,6,7,8,11,13,14,17,18,23,26,27,28,30,39]
];
/* 친구가 말하는 차례 — 고정 리터럴. 모두 자기 판 안의 낱말이다 */
const EG_SAY = [
  [0,24,7,29,28,12,20,21,1,23],
  [12,9,21,35,0,15,24,34,22,4],
  [28,14,23,27,1,6,17,5,13,30]
];
/* 조사 고르기 — 마지막 글자의 받침을 보고 을/를·은/는·(으)로를 자동으로 가른다 */
function egJong(t){ const c=t.charCodeAt(t.length-1); return (c>=0xAC00&&c<=0xD7A3) ? (c-0xAC00)%28 : 0; }
function egJ(t,a,b){ return t + (egJong(t)?a:b); }
function egQ(t,a,b){ return '「'+t+'」' + (egJong(t)?a:b); }
function egRo(t){ const j=egJong(t); return t + ((j===0||j===8)?'로':'으로'); }
/* 정답 문장의 자리 — 낱말 차례에 따라 0·1·2로 돌아간다 */
function egAt(i){ return i%3; }
function egOpts(i){
  const d=EG_W[i], at=egAt(i), out=[];
  let c=0; for(let k=0;k<3;k++) out.push(k===at ? d.ok : d.no[c++]);
  return out;
}
/* 상태 판정 헬퍼 */
function egFilled(st){ return st.egBoard.filter(x=>x!=null).length; }
function egReady(st){ return egFilled(st)===EG_SLOTS; }
function egHas(st,i){ return st.egBoard.indexOf(i)>=0; }
/* 그 낱말을 쓴 사람 모두 — 0=나, 1~3=친구 */
function egHolders(st,i){
  const out=[]; if(egHas(st,i)) out.push(0);
  EG_FRIEND.forEach((b,k)=>{ if(b.indexOf(i)>=0) out.push(k+1); });
  return out;
}
function egMyTurn(st){ return st.egTurn===0; }
function egOver(st){ return st.egDone===true; }
function egUnsaid(st){ const o=[]; st.egBoard.forEach((v,s)=>{ if(v!=null && !st.egSaid[s]) o.push(s); }); return o; }

/* 놀이 판 캔버스 — 낱말 16칸 + 네 사람 에너지 */
function egCanvas(st){
  const cellW=80, cellH=30, gapX=4, gapY=4, x0=4, y0=30;
  let g='';
  for(let s=0;s<EG_SLOTS;s++){
    const r=Math.floor(s/4), c=s%4;
    const x=x0+c*(cellW+gapX), y=y0+r*(cellH+gapY);
    const v=st.egBoard[s];
    const said=v!=null && st.egSaid[s];
    const pend=(st.egSwapSlot===s);
    const bg = v==null ? '#F8FAFC' : (pend ? '#FEF3C7' : (said ? '#E2E8F0' : '#fff'));
    const stk = v==null ? '#CBD5E0' : (pend ? '#B45309' : (said ? '#94A3B8' : '#0E7490'));
    g+=`<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" rx="6" fill="${bg}" stroke="${stk}" stroke-width="1.6"/>`;
    if(v!=null){
      const t=EG_W[v].w, fs = t.length>=9 ? 7.4 : (t.length>=7 ? 8.4 : 10);
      g+=`<text x="${x+cellW/2}" y="${y+cellH/2+fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${said?'#64748B':'#0F172A'}">${t}</text>`;
      if(said) g+=`<line x1="${x+8}" y1="${y+cellH/2}" x2="${x+cellW-8}" y2="${y+cellH/2}" stroke="#94A3B8" stroke-width="1.2"/>`;
    } else {
      g+=`<text x="${x+cellW/2}" y="${y+cellH/2+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#CBD5E0">${s+1}</text>`;
    }
  }
  let e='';
  for(let p=0;p<4;p++){
    const y=180+p*22;
    e+=`<text x="4" y="${y+11}" font-size="9.4" font-weight="800" fill="${p===0?'#0C4A6E':'#475569'}">${EG_NAMES[p]}</text>`;
    for(let k=0;k<EG_GOAL;k++){
      const on = st.egEn[p]>k;
      e+=`<rect x="${44+k*17}" y="${y}" width="14" height="14" rx="3" fill="${on?(p===0?'#0E7490':'#94A3B8'):'#fff'}" stroke="${on?(p===0?'#0E7490':'#94A3B8'):'#CBD5E0'}" stroke-width="1.4"/>`;
    }
    e+=`<text x="188" y="${y+11}" font-size="9.4" font-weight="800" fill="${p===0?'#0C4A6E':'#475569'}">${st.egEn[p]} / ${EG_GOAL}</text>`;
    if(st.egWin===p) e+=`<text x="222" y="${y+11}" font-size="9.4" font-weight="800" fill="#B45309">승리!</text>`;
  }
  const head = egOver(st) ? '놀이 끝' : (egReady(st) ? (egMyTurn(st)?'내 차례':EG_NAMES[st.egTurn]+' 차례') : `놀이 판 채우기 ${egFilled(st)} / ${EG_SLOTS}`);
  return `<div class="eg-canvas"><svg viewBox="0 0 340 290" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="290" fill="#F8FAFC"/>
  <text x="4" y="18" font-size="11.4" font-weight="800" fill="#0C4A6E">에너지 채우기 놀이 판 — ${head}</text>
  ${g}

/* 조작 패널 — 왼쪽 놀이 판, 오른쪽 지금 할 일 */
function egPanel(st){
  let r='';
  if(egOver(st)){
    const win = st.egWin;
    r += `<div class="eg-card"><div class="pt">${win===0?'내가 이겼어요!':'먼저 채운 사람은 '+EG_NAMES[win]+'!'}</div>
      에너지 칸을 먼저 ${EG_GOAL}개 채워서 놀이가 끝났어요. 이기고 지는 것보다, <b>낱말을 떠올려 옳은 문장으로 만들어 본 것</b>이 오늘의 공부예요.
      교실에서는 친구들과 직접 판을 그려 놀이해 봐요.</div>`;
    if(st.egMsg) r += `<div class="eg-msg">${st.egMsg}</div>`;
    return `<div class="eg-wrap"><div class="eg-head"><span class="tag on">놀이 끝</span></div>
      <div class="eg-body">${egCanvas(st)}<div class="eg-right">${r}</div></div></div>`;
  }
  /* ① 판 채우기 · 낱말 바꾸기 */
  if(!st.egStarted || st.egSwapMode){
    const head = st.egSwapMode
      ? `<div class="eg-step">낱말 바꾸기 — <b>${EG_W[st.egBoard[st.egSwapSlot]].w}</b> 대신 쓸 낱말을 골라요</div>`
      : `<div class="eg-step">① 놀이 판 16칸을 채워요 (${egFilled(st)} / ${EG_SLOTS})</div>`;
    const pool = EG_W.map((d,i)=>{
      const used=egHas(st,i);
      return `<button class="eg-chip${used?' used':''}" ${used?'disabled':''} onclick="egPut(${i})">${d.w}</button>`;
    }).join('');
    r += head;
    if(st.egMsg) r += `<div class="eg-msg${st.egWarn?' warn':''}">${st.egMsg}</div>`;
    r += `<div class="eg-pool">${pool}</div>`;
    if(!st.egSwapMode){
      r += `<div class="eg-row"><button class="eg-undo" ${egFilled(st)===0?'disabled':''} onclick="egUndo()">마지막 낱말 빼기</button>
        <button class="eg-go" ${egReady(st)?'':'disabled'} onclick="egStart()">놀이 시작 →</button></div>`;
      r += `<div class="eg-tip">💡 옳은 문장을 말해도 <b>같은 낱말을 쓴 친구가 없으면</b> 아무도 칸을 칠하지 못해요. 친구들도 떠올릴 만한 낱말인지 생각하며 골라요.</div>`;
    }
    return `<div class="eg-wrap"><div class="eg-head">
      <span class="tag${egReady(st)?' on':''}">① 판 채우기</span><span class="tag">② 문장 말하기</span><span class="tag">③ 에너지 ${EG_GOAL}칸</span></div>
      <div class="eg-body">${egCanvas(st)}<div class="eg-right">${r}</div></div></div>`;
  }
  /* ② 놀이 */
  r += `<div class="eg-step">${st.egRound}번째 차례 — ${egMyTurn(st)?'내 차례예요':EG_NAMES[st.egTurn]+'의 차례예요'}</div>`;
  if(st.egMsg) r += `<div class="eg-msg${st.egWarn?' warn':''}">${st.egMsg}</div>`;
  if(egMyTurn(st)){
    if(st.egSel!=null){
      const wi=st.egBoard[st.egSel];
      r += `<div class="eg-q">「${EG_W[wi].w}」라고 말하려고 해요. 이 낱말이 들어간 <b>옳은 문장</b>을 골라요</div>`;
      r += `<div class="eg-list">`+egOpts(wi).map((t,j)=>
        `<button onclick="egSent(${j})">${t}</button>`).join('')+`</div>`;
    } else if(st.egTurnDone){
      r += `<div class="eg-row"><button class="eg-go" onclick="egNextTurn()">다음 차례 →</button></div>`;
    } else {
      const un=egUnsaid(st);
      if(st.egSwapSlot!=null)
        r += `<div class="eg-row"><button class="eg-swap" onclick="egSwapOpen()">「${EG_W[st.egBoard[st.egSwapSlot]].w}」 바꾸기</button></div>`;
      if(un.length===0){
        r += `<div class="eg-msg">말할 수 있는 낱말이 남지 않았어요. 차례를 넘겨요.</div>
          <div class="eg-row"><button class="eg-go" onclick="egNextTurn()">다음 차례 →</button></div>`;
      } else {
        r += `<div class="eg-q">내 판에서 낱말을 하나 골라요</div>`;
        r += `<div class="eg-list">`+un.map(s=>`<button onclick="egSay(${s})">${EG_W[st.egBoard[s]].w}</button>`).join('')+`</div>`;
      }
    }
  } else {
    r += `<div class="eg-row"><button class="eg-go" onclick="egNextTurn()">다음 차례 →</button></div>`;
  }
  return `<div class="eg-wrap"><div class="eg-head">
    <span class="tag on">① 판 채우기</span><span class="tag${egMyTurn(st)?' on':''}">② 문장 말하기</span><span class="tag">③ 에너지 ${EG_GOAL}칸</span>
    <button class="swap" onclick="egRule()">놀이 규칙</button></div>
    <div class="eg-body">${egCanvas(st)}<div class="eg-right">${r}</div></div></div>`;
}

/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u2_l10";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  egBoard:new Array(EG_SLOTS).fill(null), egSaid:new Array(EG_SLOTS).fill(false),
  egEn:[0,0,0,0], egFc:[0,0,0], egTurn:0, egRound:0,
  egStarted:false, egTurnDone:false, egSel:null,
  egSwapSlot:null, egSwapMode:false, egSwapUsed:0,
  egMsg:null, egWarn:false, egDone:false, egWin:null, egSays:0, egMiss:0,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);

  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';

  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function egRender(){ main.innerHTML = slides[state.idx].render(state); }
function egClear(){ state.egMsg=null; state.egWarn=false; }
function egNames(list){ return list.map(h=>EG_NAMES[h]).join(' · '); }
/* 승패 판정 — 먼저 EG_GOAL칸을 채운 사람. 동시에 채우면 앞 차례(나부터)가 이긴다 */
function egCheckWin(){
  for(let p=0;p<4;p++){
    if(state.egEn[p]>=EG_GOAL){ state.egWin=p; state.egDone=true; playChime(); return true; }
  }
  return false;
}
/* 겹침 판정 — 그 낱말을 쓴 사람이 둘 이상일 때만 모두 색칠한다 */
function egAward(i,speaker){
  const hold=egHolders(state,i);
  if(hold.length>=2){
    hold.forEach(h=>{ state.egEn[h]++; });
    return {hit:true, hold:hold};
  }
  return {hit:false, hold:hold};
}

/* ① 놀이 판 채우기 — 보기 상자에서 낱말을 집어 넣는다 */
function egPut(i){
  if(egOver(state)) return;                                             // 가드① 놀이 끝난 뒤 전체 잠금
  if(!Number.isInteger(i) || i<0 || i>=EG_W.length) return;             // 가드② 무효 낱말 번호
  if(state.egStarted && !state.egSwapMode) return;                      // 가드③ 놀이 시작 뒤에는 바꾸기로만
  if(egHas(state,i)){                                                   // 가드⑧ 같은 낱말 두 번 넣기 금지
    state.egMsg=egQ(EG_W[i].w,'은','는')+' 이미 판에 있어요. 같은 낱말은 한 칸에만 쓸 수 있어요.';
    state.egWarn=true; playThud(); egRender(); return;
  }
  egClear();
  if(state.egSwapMode){
    const s=state.egSwapSlot;
    const old=EG_W[state.egBoard[s]].w;
    state.egBoard[s]=i; state.egSaid[s]=false;
    state.egSwapMode=false; state.egSwapSlot=null; state.egSwapUsed++;
    state.egMsg='「'+old+'」 대신 「'+EG_W[i].w+'」 썼어요. 이제 이 낱말로 말해 볼 수 있어요.';
    playBlip(); egRender(); return;
  }
  const s=state.egBoard.indexOf(null);
  if(s<0) return;
  state.egBoard[s]=i; state.egSaid[s]=false;
  playBlip(); egRender();
}
/* 마지막에 넣은 낱말 빼기 */
function egUndo(){
  if(egOver(state)) return;                                             // 가드①
  if(state.egStarted || state.egSwapMode) return;                       // 가드③ 놀이가 시작되면 뺄 수 없다
  egClear();
  let last=-1; state.egBoard.forEach((v,s)=>{ if(v!=null) last=s; });
  if(last<0) return;
  state.egBoard[last]=null; state.egSaid[last]=false;
  playThud(); egRender();
}
/* 놀이 시작 — 16칸이 다 차야 열린다 */
function egStart(){
  if(egOver(state)) return;                                             // 가드①
  if(state.egStarted) return;
  if(!egReady(state)){                                                  // 가드③ 순서 강제
    state.egMsg='아직 판이 다 차지 않았어요. 낱말 '+EG_SLOTS+'개를 모두 채워야 놀이를 시작할 수 있어요.';
    state.egWarn=true; playThud(); egRender(); return;
  }
  egClear();
  state.egStarted=true; state.egTurn=0; state.egRound=1; state.egTurnDone=false;
  state.egMsg='내 차례부터 시작해요. 내 판의 낱말 하나를 골라 그 낱말이 들어간 <b>옳은 문장</b>을 말해요.';
  playBlip(); egRender();
}
/* ② 내 차례 — 낱말 고르기 */
function egSay(s){
  if(egOver(state)) return;                                             // 가드①
  if(!Number.isInteger(s) || s<0 || s>=EG_SLOTS) return;                // 가드② 무효 칸 번호
  if(!state.egStarted) return;                                          // 가드③ 순서 강제
  if(!egMyTurn(state) || state.egTurnDone) return;                      // 가드④ 내 차례가 아닐 때 무시
  if(state.egSel!=null) return;                                         // 가드⑥ 문장이 열려 있는 동안 무시
  if(state.egBoard[s]==null) return;
  if(state.egSaid[s]){                                                  // 가드⑤ 이미 말한 낱말 재사용 금지
    state.egMsg=egQ(EG_W[state.egBoard[s]].w,'은','는')+' 이미 말한 낱말이에요.';
    state.egWarn=true; playThud(); egRender(); return;
  }
  egClear();
  state.egSel=s; state.egSays++;
  playBlip(); egRender();
}
/* ② 내 차례 — 문장 고르기. 옳아도 겹치는 친구가 없으면 아무도 칠하지 못한다 */
function egSent(j){
  if(egOver(state)) return;                                             // 가드①
  if(!Number.isInteger(j) || j<0 || j>2) return;                        // 가드② 무효 문장 번호
  if(state.egSel==null) return;                                         // 가드⑦ 문장이 열리지 않았으면 무시
  const s=state.egSel, wi=state.egBoard[s];
  egClear();
  if(j!==egAt(wi)){
    state.egSel=null; state.egTurnDone=true; state.egMiss++;
    state.egMsg='그 문장은 '+egQ(EG_W[wi].w,'을','를')+' 잘못 쓴 문장이에요. 문장을 만들지 못하면 <b>아무도</b> 칸을 칠하지 못하고 차례가 넘어가요. 이 낱말은 다음 내 차례에 다시 말할 수 있어요.';
    state.egWarn=true; playThud(); egRender(); return;
  }
  state.egSaid[s]=true; state.egSel=null; state.egTurnDone=true;
  const res=egAward(wi,0);
  if(res.hit){
    state.egMsg='옳은 문장이에요! '+egQ(EG_W[wi].w,'을','를')+' 쓴 사람은 <b>'+egNames(res.hold)+'</b> — 모두 에너지 한 칸을 칠해요.';
    playBlip();
  } else {
    state.egSwapSlot=s;
    state.egMsg='문장은 옳아요. 그런데 '+egQ(EG_W[wi].w,'을','를')+' 쓴 친구가 <b>한 명도 없어요</b> — 이번에는 아무도 칸을 칠하지 못해요. 다음 내 차례에 이 낱말을 <b>다른 낱말로 바꿀</b> 수 있어요.';
    state.egWarn=true; playThud();
  }
  egCheckWin(); egRender();
}
/* 나만 쓴 낱말 바꾸기 — 한 번에 한 낱말만(교과서 규칙) */
function egSwapOpen(){
  if(egOver(state)) return;                                             // 가드①
  if(!state.egStarted) return;                                          // 가드③
  if(!egMyTurn(state) || state.egTurnDone) return;                      // 가드④
  if(state.egSel!=null) return;                                         // 가드⑥
  if(state.egSwapSlot==null) return;
  egClear();
  state.egSwapMode=true;
  state.egMsg='바꿀 낱말을 하나 고르세요. <b>한 번에 한 낱말만</b> 바꿀 수 있어요.';
  egRender();
}
/* ③ 다음 차례 — 친구는 자기 판의 낱말을 차례대로 말한다(고정 리터럴) */
function egNextTurn(){
  if(egOver(state)) return;                                             // 가드①
  if(!state.egStarted) return;                                          // 가드③ 순서 강제
  if(state.egSwapMode) return;
  if(state.egSel!=null) return;                                         // 가드⑥ 문장이 열려 있으면 무시
  if(egMyTurn(state) && !state.egTurnDone && egUnsaid(state).length>0){  // 가드④ 내 차례엔 말을 먼저
    state.egMsg='아직 내 차례예요. 낱말을 하나 골라 문장을 말해 봐요.';
    state.egWarn=true; playThud(); egRender(); return;
  }
  egClear();
  state.egTurnDone=false;
  if(state.egTurn===3){ state.egTurn=0; state.egRound++;
    state.egMsg='다시 내 차례예요. 아직 말하지 않은 낱말을 골라요.'; egRender(); return; }
  state.egTurn=state.egTurn+1;
  const f=state.egTurn-1, q=EG_SAY[f];
  const wi=q[state.egFc[f] % q.length];
  state.egFc[f]=state.egFc[f]+1;
  const res=egAward(wi,state.egTurn);
  if(res.hit) state.egMsg=EG_NAMES[state.egTurn]+' 차례 — 「'+EG_W[wi].w+'」라고 말했어요. 같은 낱말을 쓴 사람은 <b>'+egNames(res.hold)+'</b> — 모두 한 칸씩 칠해요.';
  else { state.egMsg=EG_NAMES[state.egTurn]+' 차례 — 「'+EG_W[wi].w+'」라고 말했어요. 그런데 그 낱말을 쓴 사람이 <b>더 없어서</b> 아무도 칸을 칠하지 못했어요.'; state.egWarn=true; }
  egCheckWin(); egRender();
}
/* 놀이 규칙 다시 보기 */
function egRule(){
  if(egOver(state)) return;                                             // 가드①
  state.egMsg='① 내 낱말 하나로 옳은 문장을 말해요. ② 같은 낱말을 쓴 사람이 <b>둘 이상</b>이면 그 사람들 모두 한 칸을 칠해요. ③ 문장을 못 만들거나 겹치는 사람이 없으면 <b>아무도</b> 칠하지 못해요. ④ 에너지 '+EG_GOAL+'칸을 먼저 채우면 이겨요.';
  state.egWarn=false; egRender();
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='../3단원_법과인권의보장/g5_social_u3_l01_법이란.html'; } // 2단원 → 3단원 l01 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

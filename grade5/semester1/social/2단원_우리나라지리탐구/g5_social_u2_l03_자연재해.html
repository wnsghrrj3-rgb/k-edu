K-edu 사회 5-1 · 2단원 우리나라 지리 탐구 · 주제① 우리나라의 기후 · 3차시(l03)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사02-01] · 교과서 p.68~72 · 지도서(대단원2 **5~6차시** 우리나라에서 발생하는 자연재해와 그 피해를 줄이려는 노력을 알아볼까요, 지도서 p.144~152) 근거
학습 목표: 우리나라에서 발생하는 자연재해와 그 피해를 줄이려는 노력을 설명할 수 있다.
직접조작: 재난 상황실(신규 패턴 — 스트림 판정·소거형)
  ① 소식이 한 장씩 차례로 들어온다(큐 10장). 앞의 소식을 처리해야 다음 소식이 올라온다.
  ② 학생은 그 소식이 어느 계절에 자주 발생하는 자연재해인지 판정해 계절 칸(봄·여름·여름~초가을·겨울)에 담는다.
  ③ 기후와 관계가 적은 것(지진·화산 활동)은 **'기후와 관계가 적어요' 칸으로 보낸다**(소거).
  ④ 열 장을 모두 처리하면 상황판 머리가 **기상 특보(태풍 주의보)**로 바뀐다.
  ⑤ 마지막으로 국민 행동 요령 3택 → **외출을 삼가고 바람에 넘어지기 쉬운 시설물을 미리 정리한다**.
  ⚠️ 지도서 유의점("자연재해 중 지진이나 화산 활동은 기후와 관계가 적으므로 본 차시에서는 다루지 않음")을
     소거 칸이라는 조작 자체로 옮겼다. 두 재해는 조작의 안내에만 나오고 슬라이드 본문·문항에는 넣지 않았다.
  ⚠️ 가드 6종: 확정 후 전체 잠금 / 소식이 남아 있으면 행동 요령 3택 무시(순서) / 무효 칸 번호 /
     무효 행동 요령 번호 / 큐가 빈 뒤 칸 클릭 무시 / 오답 안내 표시 중 재클릭 무시.
  오답 안내 3분기가 곧 학습 내용 — ① 기후 재해를 소거 칸으로 → "이것은 기후와 관련해 발생하는 자연재해예요" /
     ② 지진·화산을 계절 칸으로 → "기후와 관계가 적어요. 계절 칸에 담지 않아요" / ③ 계절 오답 → 해당 계절이 아님.
  재시도 허용(감점 없음).
지도서 근거:
  [동기 유발] 겪었거나 영상으로 본 자연재해 — "지난여름에 비가 많이 내려 도로가 물에 잠긴 것을 본 적이 있습니다" /
    "다른 나라에서 가뭄으로 산불이 발생한 모습을 본 적이 있습니다".
  [학습 문제] 우리나라에서 발생하는 자연재해와 피해를 줄이려는 노력을 살펴봅시다.
  [전개 1] 자연재해의 뜻 — 홍수, 태풍, 한파 등 피할 수 없는 자연 현상으로 사람들이 입는 생명이나 재산상의 피해.
    계절에 따라 바람·기온·강수량의 차이가 커서 다양한 자연 현상이 나타난다.
  [전개 1] 계절별 자연재해 — 봄: 황사·가뭄 / 여름: 폭염·호우·홍수 / 여름과 가을: 태풍 / 겨울: 폭설·한파.
    황사 = 중국이나 몽골의 사막에서 발생한 모래 먼지가 바람을 타고 우리나라로 날아와 가라앉는 현상(호흡기 질병·눈병).
    가뭄 = 오랫동안 비가 오지 않거나 매우 적게 오는 기간이 지속되는 현상(농작물이 말라 죽음).
    폭염 = 일상생활을 어렵게 할 정도로 매우 심한 더위. 호우 = 비가 많이 내리는 현상(제방 붕괴·지하도 침수).
    홍수 = 비가 많이 내려 물이 흘러넘치는 현상(농경지·도로·주택 침수).
    태풍 = 대체로 남서쪽에서 북동쪽으로 진행하며 많은 비와 강한 바람을 몰고 옴(선박 침몰·농작물 쓰러짐).
    폭설 = 짧은 시간 동안 눈이 많이 내리는 현상, 대설이라고도 함(눈사태·도로 통제).
    한파 = 기온이 갑자기 내려가면서 발생하는 추위(수도 동파·저체온증·동상).
  [핵심 질문] 계절마다 다른 자연재해가 발생하는 까닭 = 계절마다 바람·기온·강수의 정도가 달라 기후 특성이 다르기 때문.
  [핵심 질문] 인간 활동으로 자연재해가 더 심해지는 사례 = 숲을 농경지로 개간하여 가뭄·홍수 발생, 도로를 만든 후 산사태.
  ⚠️ [유의] 자연재해 중 지진이나 화산 활동은 기후와 관계가 적으므로 본 차시에서는 다루지 않는다.
  [전개 2] 대비 노력 — 각종 시설 마련 + 정기적 재난 대비 훈련 + 기상 특보 발표 + 긴급 재난 문자.
    기상 특보 = 자연재해를 주의시키려고 제공하는 정보로서 '◯◯ 주의보', '◯◯ 경보' 등으로 발표.
    국민 행동 요령 = 자연재해 등에 의한 피해를 막기 위해 국민 누구나 해야 할 일을 정해 놓은 목록.
    가뭄 → 저수지·댐, 숲 가꾸기, 물 아껴 쓰기 / 호우·홍수 → 재난 경보 방송 장치, 하천 바닥 정비, 제방 높이기 /
    폭설 → 도로 열선, 모래·염화 칼슘 / 폭염 → 그늘막, 무더위 쉼터, 도로 살수 시설 /
    태풍 → 재난 정보를 듣고 안전한 곳으로 이동, 배수로 정비, 낡은 창문 보강 / 한파 → 보일러·배관 정비.
  [미디어 활동] 태풍 상륙 예상으로 전국에 태풍 주의보·경보가 발령된 신문 기사 →
    피해 = 도로·주택·농경지 침수, 강한 바람에 농작물이 쓰러지고 나무가 부러짐 →
    대비 = 외출을 삼가고 바람에 쓰러지거나 넘어지기 쉬운 시설물들을 미리 정리해 둔다.
  [별별 직업] 예보 분석관 — 관측한 기상 현상과 과거의 기상 자료를 분석해 앞으로의 날씨를 예측하고,
    산업·농업·해양·항공·환경 등에 기상 정보를 제공해 자연재해에 대비하도록 돕는다.
    필요한 것 = 기상학·물리학·지구 과학 등 전문 지식 + 새로운 기술과 지식을 학습하려는 자세.
  [꼭 기억해요] 1. 우리나라에서는 가뭄·폭염·태풍·한파 등 기후와 관련한 자연재해가 발생한다.
    2. 자연재해가 발생하면 기상 특보에 주목하면서 국민 행동 요령을 실천해야 한다.
  차시 예고 = 기후변화로 심해지는 자연재해와 대응 노력 알아보기.
⚠️ 설계 원칙:
  · 기후변화·지구 온난화·계절 길이 변화·연평균 기온 상승(7~8차시)은 **선행 침범 0** — 차시 예고에서 제목으로만.
  · 인구 분포(주제②) 침범 0. 문항에 연도 0. 지진·화산은 조작의 소거 칸·안내에만 등장(문항 0).
  · [할 수 있어요] 대비 노력 조사·공유와 활동지(우리 지역의 대비 노력)는 교실에서 실제 조사·공유로 하는 활동이라
    결과를 앞질러 주지 않고, 이 차시는 판정과 행동 선택까지만 다룬다(과학 g5 u3 l07 선례).
  · 태풍의 순기능·열대야·장마·측우기 등 교사용 참고 자료는 성취기준 밖이므로 0.
⚠️ l02 → l03 소프트체인 · l03 → l04 소프트체인.
-->

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green:#0E7490; --green-d:#0C4A6E; --cyan:#276749;
  --bg:#F1F8FA; --bub:#DCF0F5; --ink:#0F172A; --muted:#64748B;
  --amber-bg:#FFF8E1; --amber:#B45309; --red:#DC2626;
  --card:#ffffff; --line:#E2E8F0;
}
html,body{height:100%}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes popBig{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes drawLine{to{transform:scaleX(1)}}
@keyframes shakeNo{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.ka{background:var(--card);border-radius:18px;width:100%;max-width:1024px;height:min(92vh,820px);
  padding:18px clamp(16px,3vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.10);
  display:flex;flex-direction:column;animation:fadeUp .5s ease both}

/* 헤더 */
.ka-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ka-lb{background:#F1F5F9;border:none;padding:7px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;flex-shrink:0;font-size:13px}
.ka-lb svg{width:15px;height:15px}
.ka-bar{flex:1;height:5px;background:var(--bg);border-radius:999px;overflow:hidden}
.ka-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px;transition:width .35s ease;width:6%}
.ka-pg{color:var(--green);font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.ka-sc{background:var(--amber-bg);color:var(--amber);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:700}
.ka-sc svg{width:14px;height:14px}
.ka-sc-n{font-family:'Nunito',sans-serif;font-weight:800;font-size:16px}
.ka-sc-u{font-size:12px}

/* 메인 */
.ka-m{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}

  display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ka-bg.s2{background:#E0F2FE;color:#0369A1}
.ka-bg.s3{background:#EDE9FE;color:#6D28D9}
.ka-bg.s4{background:#FCE7F3;color:#BE185D}

.ka-bg svg{width:13px;height:13px}
.ka-meta{font-size:13px;color:var(--muted)}
.ka-t{font-size:clamp(20px,3.4vw,29px);margin-bottom:16px;line-height:1.4;color:var(--green);letter-spacing:-.3px;font-weight:700;animation:fadeUp .4s .15s ease both}
.ka-bub{background:var(--bub);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.7;
  margin-bottom:16px;border-left:4px solid var(--green);animation:fadeUp .4s .3s ease both}
.ka-emph{position:relative;display:inline-block;font-weight:700;color:var(--green)}
.ka-emph::after{content:'';position:absolute;bottom:2px;left:0;right:0;height:3px;background:var(--red);border-radius:2px;transform:scaleX(0);transform-origin:left;animation:drawLine .6s .6s ease forwards}

/* 시각 자료 */
.ka-grp{display:flex;flex-direction:column;align-items:center;gap:14px}
.scene-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

  display:flex;flex-direction:column;animation:pop .4s ease both}

/* 발문 답 보기 */

  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}

  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

.dw-msg.warn{border-left-color:var(--red)}
.dw-msg b{color:var(--green)}
.dw-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.dw-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.bin-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.bin-grid button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:8px 3px;cursor:pointer;
  font-family:inherit;font-weight:800;color:var(--ink);font-size:clamp(10.4px,1.78vw,12.8px);transition:.15s}
.bin-grid button:hover{border-color:var(--green);background:var(--bub)}
.bin-grid button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.bin-skip button{width:100%;border:2px dashed #94A3B8;background:#F8FAFC;border-radius:10px;padding:8px 6px;
  cursor:pointer;font-family:inherit;font-weight:700;color:#475569;font-size:clamp(10.2px,1.74vw,12.4px);transition:.15s}
.bin-skip button:hover{border-color:var(--green);color:var(--green-d);background:var(--bub)}
.bin-skip button.no{border-color:var(--red);background:#FEE2E2;color:#B91C1C;animation:shakeNo .4s ease}
.act-list{display:flex;flex-direction:column;gap:5px}
.act-list button{border:2px solid var(--cyan);background:#fff;color:#1C4D35;border-radius:10px;padding:8px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left}
.act-list button:hover{background:#DFF0E7}
.act-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.paper .src{margin-top:6px;font-size:clamp(11px,1.9vw,13px);color:#8A6D3B;text-align:right}
@media(max-width:620px){ .dw-body{grid-template-columns:1fr} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(14,116,144,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

/* ===== 직접조작 — 재난 상황실(신규 패턴 — 스트림 판정·소거형) =====
   소식이 한 장씩 차례로 들어온다(큐). 학생은 그 소식이 어느 계절에 자주 발생하는 자연재해인지
   판정해 계절 칸에 담고, 기후와 관계가 적은 것(지진·화산 활동)은 '오늘 다루지 않아요' 칸으로 보낸다.
   열 장을 모두 처리하면 상황판에 태풍 주의보가 뜨고, 마지막으로 국민 행동 요령 3택을 고른다.
   ⚠️ 지도서 유의점("지진이나 화산 활동은 기후와 관계가 적으므로 본 차시에서는 다루지 않는다")을
      소거 칸이라는 조작 자체로 옮겼다. 두 재해는 칸 이름표와 안내에만 나오고 문항에는 넣지 않는다. */
const DR_BINS = ['봄','여름','여름~초가을','겨울'];
const DR_SKIP = 4;                                   // 기후와 관계가 적은 자연재해를 보내는 칸
const DR_CARDS = [
  {n:'황사',      d:'사막에서 생긴 모래 먼지가 바람을 타고 날아와 가라앉아요', bin:0},
  {n:'가뭄',      d:'오랫동안 비가 오지 않아 농작물이 말라 죽어요',            bin:0},
  {n:'폭염',      d:'일상생활이 어려울 만큼 심한 더위가 이어져요',             bin:1},
  {n:'호우',      d:'비가 많이 내려 제방이 무너지고 지하도가 잠겨요',          bin:1},
  {n:'지진',      d:'땅속의 힘 때문에 땅이 흔들려 건물이 무너져요',            bin:4},
  {n:'홍수',      d:'물이 흘러넘쳐 농경지와 도로와 주택이 잠겨요',             bin:1},
  {n:'태풍',      d:'많은 비와 강한 바람을 몰고 남서쪽에서 북동쪽으로 지나가요', bin:2},
  {n:'화산 활동', d:'땅속의 뜨거운 물질이 땅 밖으로 뿜어져 나와요',            bin:4},
  {n:'폭설',      d:'짧은 시간 동안 눈이 많이 내려 길이 막혀요',               bin:3},
  {n:'한파',      d:'기온이 갑자기 내려가 수도가 얼고 동상 피해를 봐요',       bin:3}
];
const DR_ACT = [
  '창문을 활짝 열어 바람이 지나가게 한다',
  '외출을 삼가고 바람에 넘어지기 쉬운 시설물을 미리 정리한다',
  '기상 특보는 어른들의 일이니 평소처럼 지낸다'
];
const DR_ACT_OK = 1;

function drLeft(st){ return DR_CARDS.length - st.drIdx; }
function drAllIn(st){ return st.drIdx >= DR_CARDS.length; }

function drCanvas(st){
  const done = drAllIn(st);
  let head = '';
  if(done){
    head += `<rect x="8" y="6" width="304" height="58" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2.2"/>`;
    head += `<path d="M28 46 l11 -19 l11 19 Z" fill="#FDE68A" stroke="#B45309" stroke-width="1.6"/>`;
    head += `<text x="39" y="44" font-size="10" fill="#B45309" text-anchor="middle" font-weight="800">!</text>`;
    head += `<text x="60" y="30" font-size="11.5" fill="#B45309" font-weight="800">기상 특보 — 태풍 주의보</text>`;
    head += `<text x="60" y="48" font-size="9.5" fill="#334155">전국 곳곳에 태풍 주의보가 발령됐어요</text>`;
  } else {
    const c = DR_CARDS[st.drIdx];
    head += `<rect x="8" y="6" width="304" height="58" rx="10" fill="#fff" stroke="#0E7490" stroke-width="2.2"/>`;
    head += `<rect x="8" y="6" width="304" height="18" rx="10" fill="#0E7490"/>`;
    head += `<text x="160" y="19" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="800">들어온 소식 ${st.drIdx+1} / ${DR_CARDS.length}</text>`;
    head += `<text x="160" y="40" font-size="11.5" fill="#0C4A6E" text-anchor="middle" font-weight="800">${c.n}</text>`;
    head += `<text x="160" y="56" font-size="9" fill="#334155" text-anchor="middle">${c.d}</text>`;
  }

  let bins = '';
  const bx = [8,84,160,236], TONE = [
    {bg:'#FFFBEB', ln:'#B45309'}, {bg:'#FEF2F2', ln:'#DC2626'},
    {bg:'#FDF2F8', ln:'#BE185D'}, {bg:'#EFF6FF', ln:'#1D4ED8'}
  ];
  for(let b=0;b<4;b++){
    const T = TONE[b], got = st.drBins[b];
    bins += `<rect x="${bx[b]}" y="72" width="72" height="86" rx="9" fill="${T.bg}" stroke="${T.ln}" stroke-width="${st.drWrongBin===b?'2.6':'1.8'}"/>`;
    bins += `<text x="${bx[b]+36}" y="87" font-size="${b===2?'8':'10'}" fill="${T.ln}" text-anchor="middle" font-weight="800">${DR_BINS[b]}</text>`;
    if(got.length===0){
      bins += `<text x="${bx[b]+36}" y="122" font-size="8.5" fill="#94A3B8" text-anchor="middle">아직 없어요</text>`;
    } else {
      got.forEach((ci,k)=>{
        bins += `<rect x="${bx[b]+7}" y="${94+k*20}" width="58" height="17" rx="6" fill="#ffffff" stroke="${T.ln}" stroke-width="1.4"/>`;
        bins += `<text x="${bx[b]+36}" y="${106+k*20}" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">${DR_CARDS[ci].n}</text>`;
      });
    }
  }

  const sk = st.drBins[DR_SKIP];
  bins += `<rect x="8" y="164" width="304" height="44" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="${st.drWrongBin===DR_SKIP?'2.6':'1.8'}" stroke-dasharray="5 3"/>`;
  bins += `<text x="160" y="180" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="800">기후와 관계가 적어 오늘은 다루지 않아요</text>`;
  if(sk.length===0){
    bins += `<text x="160" y="198" font-size="8.5" fill="#94A3B8" text-anchor="middle">아직 없어요</text>`;
  } else {
    sk.forEach((ci,k)=>{
      bins += `<rect x="${86+k*80}" y="186" width="72" height="17" rx="6" fill="#ffffff" stroke="#94A3B8" stroke-width="1.4"/>`;
      bins += `<text x="${122+k*80}" y="198" font-size="9" fill="#475569" text-anchor="middle" font-weight="700">${DR_CARDS[ci].n}</text>`;
    });
  }

  let foot = '';
  if(st.drAct != null){
    foot += `<rect x="8" y="214" width="304" height="42" rx="9" fill="#DCF0F5" stroke="#0E7490" stroke-width="2"/>`;
    foot += `<text x="160" y="232" font-size="10" fill="#0C4A6E" text-anchor="middle" font-weight="800">기상 특보에 주목하고 국민 행동 요령을 실천해요</text>`;
    foot += `<text x="160" y="248" font-size="9" fill="#0C4A6E" text-anchor="middle">피할 수 없는 자연 현상이지만 피해는 줄일 수 있어요</text>`;
  } else {
    foot += `<rect x="8" y="214" width="304" height="42" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.6"/>`;
    foot += `<text x="160" y="232" font-size="10" fill="#64748B" text-anchor="middle" font-weight="700">남은 소식 ${drLeft(st)}장</text>`;
    foot += `<text x="160" y="248" font-size="9" fill="#94A3B8" text-anchor="middle">${done?'이제 국민 행동 요령을 골라요':'소식을 알맞은 칸으로 보내요'}</text>`;
  }

  return `<svg viewBox="0 0 320 264"><rect width="320" height="264" fill="#ffffff"/>${head}${bins}${foot}</svg>`;
}

function drPanel(st){
  const fixed = st.drAct != null;
  const done = drAllIn(st);
  let right = '';
  right += `<div class="dr-step">🚨 처리한 소식 ${st.drIdx} / ${DR_CARDS.length}</div>`;

  if(fixed){
    right += `<div class="dw-card"><div class="pt">🌦️ 자연재해와 대비를 알아냈어요</div>
      <div>기후와 관련해 발생하는 자연재해는 <b>계절마다 달라요</b>. 봄에는 황사와 가뭄, 여름에는 폭염과 호우와 홍수,
      여름에서 가을 사이에는 태풍, 겨울에는 폭설과 한파가 자주 발생해요.</div>
      <div style="margin-top:5px">자연재해는 피할 수 없지만 <b>피해는 줄일 수</b> 있어요. 기상 특보와 긴급 재난 문자에 주목하고,
      자연재해에 맞는 <b>국민 행동 요령</b>을 알아 두고 실천하면 돼요.</div></div>`;
  } else if(done){
    right += `<div class="dw-msg">열 장을 모두 처리했어요. 상황판에 <b>태풍 주의보</b>가 떴어요.</div>`;
    right += `<div class="dr-step">🔎 이때 어떻게 행동해야 할까요?</div>`;
    right += `<div class="act-list">${DR_ACT.map((o,k)=>
      `<button class="${st.drWrongAct===k?'no':''}" onclick="pickAct(${k})">${o}</button>`).join('')}</div>`;
  } else {
    right += `<div class="dr-step">① 이 소식은 어느 칸으로 보낼까요?</div>`;
    right += `<div class="bin-grid">${DR_BINS.map((b,k)=>
      `<button class="${st.drWrongBin===k?'no':''}" onclick="pickBin(${k})">${b}</button>`).join('')}</div>`;
    right += `<div class="bin-skip"><button class="${st.drWrongBin===DR_SKIP?'no':''}" onclick="pickBin(${DR_SKIP})">기후와 관계가 적어요</button></div>`;
  }
  if(st.drMsg) right += `<div class="dw-msg${st.drWarn?' warn':''}">${st.drMsg}</div>`;

  return `<div class="dw-wrap">
    <div style="text-align:center"><b style="color:var(--green)">🚨 들어오는 소식을 알맞은 칸으로 보내요</b></div>
    <div class="dw-body">
      <div class="dw-canvas">${drCanvas(st)}<div class="cvcap">계절마다 자주 발생하는 자연재해를 모으는 상황판이에요</div></div>
      <div class="dw-right">${right}</div>
    </div>
  </div>`;
}

function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u2_l03";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  drIdx:0, drBins:[[],[],[],[],[]], drAct:null,
  drWrongBin:null, drWrongAct:null, drMsg:null, drWarn:false,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}

const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function drRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 소식을 칸으로 보내기 */
function pickBin(k){
  if(state.drAct!=null) return;                                    // ① 확정 후 전체 잠금
  if(!(k>=0 && k<=DR_SKIP)) return;                                // ③ 무효 칸 번호
  if(drAllIn(state)) return;                                       // ⑤ 큐가 빈 뒤 칸 클릭 무시
  if(state.drWrongBin!=null) return;                               // ⑥ 오답 안내 표시 중 재클릭 무시
  const c = DR_CARDS[state.drIdx];
  if(k===c.bin){
    state.drBins[k].push(state.drIdx);
    state.drIdx++; state.drWrongBin = null; state.drWarn = false;
    if(k===DR_SKIP){
      state.drMsg = `<b>${c.n}</b>은(는) 기후와 관계가 적어 오늘은 다루지 않아요.`;
    } else {
      state.drMsg = `<b>${c.n}</b>은(는) <b>${DR_BINS[k]}</b>에 자주 발생해요.`;
    }
    if(drAllIn(state)){ state.drMsg = '열 장을 모두 처리했어요. 상황판을 봐요.'; playChime(); }
    else playBlip();
    drRender(); return;
  }
  state.drWrongBin = k; state.drWarn = true;
  if(k===DR_SKIP){
    state.drMsg = `<b>${c.n}</b>은(는) 기후와 관련해 발생하는 자연재해예요. 어느 계절에 자주 발생하는지 생각해 봐요.`;
  } else if(c.bin===DR_SKIP){
    state.drMsg = `<b>${c.n}</b>은(는) 기후와 관계가 적어요. 계절 칸에 담지 않아요.`;
  } else {
    state.drMsg = `<b>${c.n}</b>은(는) <b>${DR_BINS[k]}</b>에 자주 발생하는 자연재해가 아니에요.`;
  }
  playThud(); drRender();
  setTimeout(()=>{ if(state.drWrongBin===k){ state.drWrongBin=null; state.drMsg=null; state.drWarn=false; drRender(); } },1600);
}

/* ② 국민 행동 요령 */
function pickAct(k){
  if(state.drAct!=null) return;                                    // 확정 후 잠금
  if(!drAllIn(state)) return;                                      // ② 소식이 남아 있으면 무시(순서)
  if(!(k>=0 && k<DR_ACT.length)) return;                           // ④ 무효 번호
  if(k===DR_ACT_OK){
    state.drAct = k; state.drWrongAct = null; state.drMsg = null; state.drWarn = false;
    playChime(); drRender(); return;
  }
  state.drWrongAct = k; state.drWarn = true;
  state.drMsg = k===0
    ? '창문을 열면 강한 바람이 그대로 들어와요. 낡은 창문은 <b>미리 보강</b>해 두어야 해요.'
    : '국민 행동 요령은 <b>누구나</b> 해야 할 일을 정해 놓은 목록이에요.';
  playThud(); drRender();
  setTimeout(()=>{ if(state.drWrongAct===k){ state.drWrongAct=null; state.drMsg=null; state.drWarn=false; drRender(); } },1600);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u2_l04_기후변화.html'; } // l03 → l04 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

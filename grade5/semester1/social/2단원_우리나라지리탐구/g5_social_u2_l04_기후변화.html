K-edu 사회 5-1 · 2단원 우리나라 지리 탐구 · 주제① 우리나라의 기후 · 4차시(l04)
영역 1 본 차시 (자기주도) · 18슬 · 사회 탐구 5단계(들어가기·살펴보기·확인·적용·정리) · 만점 100
성취기준 [6사02-01] · 교과서 p.73~79 · 지도서(대단원2 **7~8차시** 기후변화로 심해지는 자연재해와 대응 노력을 알아볼까요, 지도서 p.153~167) 근거
학습 목표: 기후변화로 심해지는 자연재해와 대응 노력을 설명할 수 있다.
직접조작: 기후 행동 수첩(신규 패턴 — 선택·기록·되돌아보기형)
  ⭐ 지도서 유의점("기후변화로 심화하는 자연재해의 발생을 막기 위해 **스스로 실천할 기후 행동을 선택하고
     실천 결과를 반성**하게 함으로써 생활 속에서 기후 행동을 실천하는 태도를 기르는 데 중점을 둔다")이
     이 차시의 설계 축이다. 그래서 조작이 **선택에서 끝나지 않고** 기록 → 되돌아보기까지 세 단계로 간다.
  ① 고르기 — 후보 아홉 장에서 「내가 매일 스스로 실천할 수 있는 기후 행동」 네 장을 골라 수첩에 적는다.
     후보는 세 종류가 섞여 있다. ㉠ 개인이 매일 스스로 할 수 있는 것 5장(정답 후보)
     ㉡ 기후 행동이지만 **주체가 다른 것** 2장(기업·정부와 국회) ㉢ 기후 행동이 **아닌 것** 2장.
     ⭐ 지도 꿀 Tip("기후 행동에 포함될 것과 아닌 것을 구분할 수 있는 준거를 각자 생각하도록")과
        지도서 발문("매일매일 실천할 수 있는 일 / 스스로 실천할 수 있는 일을 넣는 것이 좋다")
        두 준거를 **거부 안내 3분기**라는 조작 자체로 옮겼다.
  ② 기록 — 네 줄에 각각 실천 결과 ○(잘함) · △(보통) · ×(부족)를 표시한다.
     ⚠️ 정직 원칙 — 실제로 일주일을 지낸 것이 아니므로 결과에 정답을 두지 않는다(어느 표시든 통과).
        지도서 정리 발문 자체가 "기후 행동 목록을 작성한 사람들은 **오늘 내가 한 일들에 대해 반성**해 봅시다"이고
        예시 답안 네 건이 모두 '오늘은 ○/△/×'라서, 무대도 **오늘 하루 기준**으로 안내한다.
  ③ 되돌아보기 — 네 줄이 다 채워지면 마지막 3택이 열린다. 정답 = 어려웠던 까닭을 생각해 내일도 이어서 실천한다.
     오답 두 개는 이 차시에서 가장 있을 법한 빗나감이다 — 「쉬운 것만 남긴다」 / 「나 하나 해도 달라지지 않는다」.
     후자는 [재미있게 확인해요] ✕문항("기후 행동은 특별한 사람들만 참여할 수 있습니다")과 같은 자리다.
  ⚠️ 가드 7종: 확정 후 전체 잠금 / 네 장을 다 고르기 전 기록 무시(순서) / 기록 미완성 시 되돌아보기 무시(순서) /
     무효 카드·표시·되돌아보기 번호 / 이미 고른 카드 재선택 무시 / 네 장 초과 선택 불가 / 오답 안내 표시 중 재클릭 무시.
  거부 안내 3분기가 곧 학습 내용 — ㉠ 기업 → "기후 행동이 맞지만 **기업**이 하는 일이에요" /
     ㉡ 정부와 국회 → "**정부와 국회**가 하는 일이에요" / ㉢ 기후 행동 아님 → "기후변화를 막는 일이 아니에요".
  재시도 허용(감점 없음).
지도서 근거:
  [동기 유발] 세계 펭귄의 날(4월 25일) — 지구 온난화와 서식지 파괴로 사라져 가는 펭귄을 보호하려고 정한 날.
    빙하가 녹으면 펭귄이 살 수 없고, 우리나라도 많은 곳이 물에 잠기게 된다.
  [학습 문제] 기후변화로 심해지는 자연재해와 대응 노력을 알아봅시다.
  [전개 1] 오늘날 인간 활동으로 지구 온난화가 심해져 전 세계적으로 기후변화가 나타난다.
    지구 온난화 = 지구의 기온이 높아지는 현상. 인간 활동 = 숲을 파괴하거나 석유와 석탄을 지나치게 사용하는 행위.
    연평균 기온 변화 = 1912~1920년 12.0 ℃ → 2011~2020년 13.9 ℃ (1.9 ℃ 상승, 10년마다 약 0.2 ℃씩 상승).
      그래프 원문 11개 값 그대로 = 12.0 12.1 12.2 12.3 12.5 12.6 12.8 13.0 13.6 13.7 13.9
    계절 길이 변화 = 봄 85→91일 / 여름 98→118일(+20) / 가을 73→69일 / 겨울 109→87일(-22).
      지도서 그래프 해설 "봄과 가을은 길이의 변화가 거의 없지만"을 그대로 따랐다.
  [전개 1] 기후변화의 영향으로 자연재해를 점점 예측하기 어려워지고, 강도가 세지고 발생 횟수도 많아져
    인명 피해와 경제적 피해가 커지고 있다.
    폭염·이상 고온 = 8월 1일 서울 최고 기온 39.6 ℃, 홍천 41 ℃(관측 이래 가장 심한 폭염) /
      어느 해 겨울 평균 기온 2.4 ℃(역대 두 번째로 따뜻한 겨울), 2월 전국 이상 고온.
    극한 호우·홍수 = 관측 이래 가장 오랫동안 이어진 장마·역대 두 번째 강수량 /
      관측 이래 세 번째로 비가 많이 내린 장마, 짧은 기간에 많은 비 → 전국 산사태·홍수.
    태풍 = 평균적으로 일 년에 서너 개가 영향을 주지만 일곱 개가 영향을 준 해도 있었고,
      관측 이래 처음으로 우리나라를 남에서 북으로 관통한 태풍도 있었다.
  [미디어 활동] 신문 기사 — 상반기 역대 가장 긴 227일 가뭄 → 여름 역대 가장 많은 장맛비 /
    좁은 지역에 집중되는 호우 증가로 전국 침수 / 12월 초 이상 고온 뒤 하루 이틀 사이 한파.
    예시 답안 = 기후변화로 자연재해가 자주 발생하고 정도도 심해져 '역대급', '역사상' 자연재해가 자주 발생한다.
    ⭐ 지도 꿀 Tip = 장마는 자연재해라기보다 기상 현상이며, 장마 기간 중 강수량이 많으면 호우라는 자연재해가 된다.
  [전개 2] 기후 행동 = 기후변화를 막으려는 모든 노력. 에너지 절약, 친환경·재활용 제품, 대중교통 이용 등.
    따라서 기후 행동은 **누구나** 참여할 수 있다.
    세계 = 2015년 '파리 협정'을 채택해 기온 상승을 2 ℃ 이내로 유지하고 1.5 ℃를 넘기지 않도록 약속.
    정부·국회 = 기후변화에 대응하는 정부 기구를 설치하고, 법과 제도를 만들어 관련 산업의 발전을 지원.
    기업 = 친환경 재료를 이용해 제품을 만들고, 생산 과정에서 발생하는 오염 물질을 줄임.
    개인 = 기후변화의 문제를 알리고 기후 행동을 장려하는 캠페인을 벌이거나 다양한 정책을 제안.
  [친구와 활동] 일주일 동안 실천할 기후 행동을 쓰고, 실천 결과를 ○·△·×로 표시해 친구들과 이야기하기.
    예시 답안 = 일회용품 사용하지 않기, 가까운 거리는 걸어 다니기, 자가용 대신 자전거나 대중교통 이용하기,
      에어컨 대신 선풍기 사용하기, 우리 지역에서 생산한 농산물 먹기, 전기 아껴 쓰기, 물 아껴 쓰기, 손수건 사용하기.
  [풍덩 사회 속으로] 학교에서도 기후 행동을 실천할 수 있다 — 교실에서 식물 키우기·재활용 예술 작품 만들기,
    텃밭에서 기른 채소를 이웃과 나누기, 한 달에 한 번 채식 급식, 급식 남기지 않기, 빈 교실·화장실 전등 끄기.
  [꼭 기억해요] 1. 우리나라는 기후변화의 영향으로 연평균 기온이 올라가고 계절 길이가 달라지고 있습니다.
    2. 기후변화를 막으려는 모든 노력을 (기후 행동)이라고 합니다.
  [재미있게 확인해요] 주제 마무리 ○✕ 4항 — 남쪽으로 갈수록 기온이 높아진다(○) / 기후는 매일 다르게 나타난다(✕) /
    기후 행동은 특별한 사람들만 참여할 수 있다(✕) / 기후변화로 자연재해가 심해지고 있다(○).
    → 적용 3번에 4중 회수로 직이식(l01 날씨↔기후 · l02 남북 기온 · l03 자연재해 · l04 기후 행동).
  [얼마나 잘했을까] 주제 자기 평가 3항을 17슬에 원문 그대로 옮겼다.
⚠️ 설계 원칙:
  · 이 차시는 **주제① 마지막 차시**여서 [재미있게 확인해요]·[얼마나 잘했을까]가 함께 붙는다(지도서 학습 흐름 그대로).
  · 인구 분포(주제②) 침범 0.
  · 교사용 참고 자료(IPCC · 교토 의정서 · 아레니우스 · 극한 호우 mm 기준 · 크릴새우 · 탄소 발자국 누리집)는 성취기준 밖이므로 0.
  · **탄소 중립 · 2050 탄소 중립 녹색 성장 위원회**는 교과서 본문이 아니라 지도서 사진 해설·발문에만 있는 고유명이라
    넣지 않고 교과서 본문 표현인 "정부 기구"로 옮겼다. 파리 협정은 교과서 본문에 있으므로 그대로 쓴다.
  · 연도 고유명은 슬라이드 자료값에서도 빼고 "어느 해"로 옮겼다(l03 규약 승계). 다만 **파리 협정 2015년**과
    **연평균 기온 구간(1912~1920 / 2011~2020)**은 자료 자체의 뜻이 연도에 있어 원문대로 둔다.
    문항에서는 연도 암기를 묻지 않고 수치를 제시해 판단하게 한다.
  · 지진·화산은 l03에서 소거한 대로 이 차시에도 0.
  · [친구와 활동]의 실제 일주일 실천·공유와 [과정 중심 평가] 카드 뉴스 만들기는 교실에서 실제로 하는 활동이라
    결과를 앞질러 주지 않는다(과학 g5 u3 l07·사회 u2 l03 선례).

.note{font-size:clamp(13px,2.1vw,16px);color:var(--muted);text-align:center}

/* 발문 답 보기 */
.reveal-btn{background:#fff;border:2px solid var(--green);color:var(--green);font-weight:700;font-family:inherit;
  padding:10px 22px;border-radius:12px;cursor:pointer;font-size:clamp(14px,2.3vw,17px);margin-top:4px}
.reveal-btn:hover{background:var(--bub)}
.answer-box{background:var(--amber-bg);border-radius:14px;padding:14px 20px;font-size:clamp(15px,2.4vw,19px);
  line-height:1.7;border-left:4px solid var(--amber);animation:fadeUp .4s ease both;max-width:640px}

/* 문제 */
.q-stem{font-size:clamp(16px,2.6vw,21px);font-weight:700;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:620px}
.opt{background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:clamp(14px,2.3vw,17px);
  font-weight:500;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--green);background:var(--bub)}
.opt.correct{border-color:var(--green);background:var(--bub);animation:pop .4s ease}
.opt.wrong{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:clamp(14px,2.3vw,17px);line-height:1.6;text-align:center;animation:fadeUp .35s ease both;max-width:620px}
.fb.ok{color:var(--green);font-weight:700}
.hint{margin-top:12px;background:#E0F2FE;border-radius:12px;padding:11px 16px;font-size:clamp(13px,2.2vw,16px);
  line-height:1.6;color:#0C4A6E;max-width:560px;animation:fadeUp .35s ease both}

/* 정리 자기평가 */
.sum-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.sum-item{display:flex;gap:10px;align-items:flex-start;background:#F5FBFC;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:clamp(14px,2.3vw,17px);line-height:1.5}
.sum-item .n{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.check{display:flex;align-items:center;gap:9px;background:#F8FAFC;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:clamp(13px,2.2vw,16px);font-weight:500}
.check .box{width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check.on{border-color:var(--green);background:var(--bub)}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:'✓';color:#fff;font-weight:800;font-size:14px}

/* 직접조작 — 기후 행동 수첩(선택·기록·되돌아보기형) */
.nb-wrap{width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.nb-body{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:start}
.nb-canvas{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.nb-canvas svg{width:100%;height:auto;display:block}
.nb-canvas .cvcap{padding:5px 6px;text-align:center;font-size:clamp(9.5px,1.6vw,11.5px);
  color:var(--muted);font-weight:700;background:#F8FAFC}
.nb-right{display:flex;flex-direction:column;gap:6px;min-width:0}
.nb-step{font-size:clamp(10.5px,1.75vw,13px);font-weight:800;color:var(--green)}
.nb-msg{background:#F8FAFC;border:2px solid var(--line);border-left:4px solid var(--green);border-radius:10px;
  padding:8px 12px;font-size:clamp(11.4px,1.93vw,13.8px);line-height:1.55;color:#334155;animation:fadeUp .3s ease both}
.nb-msg.warn{border-left-color:var(--red)}
.nb-msg b{color:var(--green)}
.nb-card{background:#fff;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;
  font-size:clamp(12px,2.05vw,14.5px);line-height:1.55;animation:pop .35s ease both}
.nb-card .pt{font-weight:800;color:var(--amber);margin-bottom:4px;font-size:clamp(12.5px,2.15vw,15px)}
.act-grid{display:flex;flex-direction:column;gap:4px;max-height:196px;overflow-y:auto;padding-right:2px}
.act-grid button{border:2px solid #CBD5E0;background:#fff;border-radius:10px;padding:7px 9px;cursor:pointer;
  font-family:inherit;font-weight:700;color:var(--ink);font-size:clamp(10.2px,1.74vw,12.6px);
  text-align:left;transition:.15s;line-height:1.35}
.act-grid button:hover{border-color:var(--green);background:var(--bub)}
.act-grid button.taken{opacity:.42;border-style:dashed;cursor:default}
.act-grid button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.mark-row{display:flex;align-items:center;gap:6px}
.mark-row .lbl{flex:1;min-width:0;font-size:clamp(10px,1.7vw,12.4px);font-weight:700;color:#334155;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark-btns{display:flex;gap:4px;flex-shrink:0}
.mark-btns button{width:30px;border:2px solid #CBD5E0;background:#fff;border-radius:8px;padding:5px 0;
  cursor:pointer;font-family:inherit;font-weight:800;color:#475569;font-size:clamp(11px,1.9vw,13.5px);transition:.15s}
.mark-btns button:hover{border-color:var(--green);background:var(--bub);color:var(--green-d)}
.mark-btns button.on{border-color:var(--green);background:var(--green);color:#fff}
.look-list{display:flex;flex-direction:column;gap:5px}
.look-list button{border:2px solid var(--cyan);background:#fff;color:#1C4D35;border-radius:10px;padding:8px 10px;
  cursor:pointer;font-family:inherit;font-weight:700;font-size:clamp(10.5px,1.8vw,13px);text-align:left;line-height:1.35}
.look-list button:hover{background:#DFF0E7}
.look-list button.no{border-color:var(--red);background:#FEE2E2;animation:shakeNo .4s ease}
.paper{background:#FFFDF5;border:2px solid #E7D9A8;border-radius:12px;padding:12px 16px;
  font-size:clamp(12.5px,2.1vw,15px);line-height:1.65;color:#3F3A2C;max-width:660px;
  animation:fadeUp .4s ease both}
.paper .ph{font-weight:800;color:#8A6D3B;margin-bottom:6px;font-size:clamp(13px,2.2vw,16px)}
.paper .src{margin-top:6px;font-size:clamp(11px,1.9vw,13px);color:#8A6D3B;text-align:right}
.tipbox{background:#E0F2FE;border-radius:12px;padding:10px 16px;font-size:clamp(12.5px,2.1vw,15px);
  line-height:1.6;color:#0C4A6E;max-width:660px;border-left:4px solid #0369A1}
@media(max-width:620px){ .nb-body{grid-template-columns:1fr} .act-grid{max-height:none} }

/* 종료 */
.end-score{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(40px,9vw,66px);color:var(--amber);animation:popBig .5s ease both;text-align:center}
.end-msg{font-size:clamp(17px,3vw,24px);font-weight:700;color:var(--green);text-align:center;margin-top:4px}

/* 푸터 */
.ka-f{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;margin-top:14px}
.ka-nav{background:#F1F5F9;color:var(--ink);border:none;padding:12px 6px;font-size:clamp(13px,2.3vw,16px);border-radius:12px;
  cursor:pointer;font-family:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.ka-nav svg{width:16px;height:16px}
.ka-nav:disabled{opacity:.4;cursor:not-allowed}
.ka-nav-prev{color:var(--muted)}
.ka-nav-next{background:var(--green);color:#fff;font-size:clamp(14px,2.5vw,17px);box-shadow:0 4px 14px rgba(14,116,144,.32)}
.ka-nav-next:disabled{background:#94A3B8;box-shadow:none}

.end3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.end3 a{text-decoration:none;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;font-size:clamp(13px,2.2vw,16px);font-family:inherit}
.end3 .a1{background:var(--amber-bg);color:var(--amber)}
.end3 .a2{background:var(--green);color:#fff}
.end3 .a3{background:#F1F5F9;color:var(--muted)}

@media(max-width:560px){
  .ka-lb span{display:none}
  .ka-meta{display:none}
  .opts{grid-template-columns:1fr}
  .ka-f{grid-template-columns:1fr 1fr}
  .ka-nav.mob-hide{display:none}
}

<body>
<div class="ka">
  <div class="ka-h">

      <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#B45309"/></svg>

    </button>
    <button class="ka-nav ka-nav-next" id="next" onclick="next()">다음 →</button>
  </div>
</div>

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 모든 그림은 내용을 나타낸 도식이며 실제 사진·관측 자료가 아니다.
   연평균 기온 11개 값과 계절 길이 네 값은 지도서 p.153 그래프의 원문 수치를 그대로 옮겼다. */
const KPATH = "M50 6 L61 10 L69 21 L67 33 L73 43 L71 55 L63 65 L65 77 L59 91 L51 103 L43 111 L37 107 L39 95 L33 85 L31 71 L25 59 L27 45 L21 35 L25 23 L35 13 Z";
const JEJU  = "M30 118 a7 4.2 0 1 0 14 0 a7 4.2 0 1 0 -14 0";

/* 그래프 원문값 — 지도서 p.153 */
const TEMP_V = [12.0,12.1,12.2,12.3,12.5,12.6,12.8,13.0,13.6,13.7,13.9];
const SEAS_OLD = {봄:85, 여름:98, 가을:73, 겨울:109};
const SEAS_NEW = {봄:91, 여름:118, 가을:69, 겨울:87};

function penguin(x,y,s){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <ellipse cx="0" cy="0" rx="10" ry="14" fill="#1E293B"/>
    <ellipse cx="0" cy="2" rx="6" ry="10" fill="#F8FAFC"/>
    <circle cx="0" cy="-14" r="7.5" fill="#1E293B"/>
    <circle cx="-2.6" cy="-15" r="1.5" fill="#fff"/><circle cx="2.6" cy="-15" r="1.5" fill="#fff"/>
    <path d="M-2 -11 L2 -11 L0 -7 Z" fill="#F59E0B"/>
    <path d="M-10 -2 q-5 6 -2 11" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M10 -2 q5 6 2 11" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-6 13 l-5 3 l5 1 Z" fill="#F59E0B"/><path d="M6 13 l5 3 l-5 1 Z" fill="#F59E0B"/></g>`;
}

const SVG = {
  // 동기 유발 — 세계 펭귄의 날
  peng:`<svg viewBox="0 0 320 170"><rect width="320" height="170" fill="#EFF6FF"/>
    <circle cx="272" cy="30" r="14" fill="#FDE68A"/>
    <path d="M0 108 L52 78 L104 108 Z" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M212 108 L262 74 L316 108 Z" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.6"/>
    <rect x="0" y="108" width="320" height="30" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.6"/>
    <rect x="0" y="138" width="320" height="32" fill="#7DA9C7" opacity=".8"/>
    <path d="M0 146 Q40 140 80 146 T160 146 T240 146 T320 146" stroke="#4C82A8" stroke-width="2" fill="none"/>
    ${penguin(126,96,1)}${penguin(160,100,.82)}${penguin(190,96,.94)}
    <path d="M96 120 l16 8 l-16 6 Z" fill="#BFDBFE" stroke="#60A5FA" stroke-width="1.2"/>
    <rect x="70" y="10" width="180" height="34" rx="10" fill="#ffffff" stroke="#0E7490" stroke-width="2"/>
    <text x="160" y="26" font-size="11.5" fill="#0C4A6E" text-anchor="middle" font-weight="800">4월 25일 · 세계 펭귄의 날</text>
    <text x="160" y="39" font-size="9" fill="#334155" text-anchor="middle">지구 온난화로 사라져 가는 펭귄을 지키려고 정했어요</text>
    <text x="160" y="162" font-size="10" fill="#0C4A6E" text-anchor="middle" font-weight="700">빙하가 녹으면 펭귄만의 일로 끝나지 않아요</text></svg>`,

  // 기후변화의 원인 흐름도
  warm:`<svg viewBox="0 0 320 176"><rect width="320" height="176" fill="#F8FAFC"/>
    <rect x="8" y="18" width="92" height="66" rx="10" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
    <text x="54" y="38" font-size="11" fill="#0369A1" text-anchor="middle" font-weight="800">인간 활동</text>
    <text x="54" y="55" font-size="8.6" fill="#334155" text-anchor="middle">숲을 파괴함</text>
    <text x="54" y="70" font-size="8.6" fill="#334155" text-anchor="middle">석유·석탄을 많이 씀</text>
    <path d="M104 51 L124 51" stroke="#64748B" stroke-width="2.4" marker-end="url(#wm1)"/>
    <rect x="128" y="18" width="92" height="66" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="174" y="38" font-size="11" fill="#B45309" text-anchor="middle" font-weight="800">지구 온난화</text>
    <text x="174" y="57" font-size="8.6" fill="#334155" text-anchor="middle">지구의 기온이</text>
    <text x="174" y="70" font-size="8.6" fill="#334155" text-anchor="middle">높아지는 현상</text>
    <path d="M224 51 L244 51" stroke="#64748B" stroke-width="2.4" marker-end="url(#wm1)"/>
    <rect x="220" y="18" width="92" height="66" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="266" y="38" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="800">기후변화</text>
    <text x="266" y="57" font-size="8.6" fill="#334155" text-anchor="middle">전 세계에서</text>
    <text x="266" y="70" font-size="8.6" fill="#334155" text-anchor="middle">나타나요</text>
    <rect x="8" y="96" width="304" height="30" rx="9" fill="#fff" stroke="#0E7490" stroke-width="2"/>
    <text x="160" y="115" font-size="11.5" fill="#0C4A6E" text-anchor="middle" font-weight="800">우리나라에서는 이렇게 나타나요</text>
    <rect x="8" y="132" width="148" height="34" rx="9" fill="#DCF0F5" stroke="#0E7490" stroke-width="1.8"/>
    <text x="82" y="146" font-size="10" fill="#0C4A6E" text-anchor="middle" font-weight="800">연평균 기온 상승</text>
    <text x="82" y="159" font-size="8.6" fill="#334155" text-anchor="middle">해마다 조금씩 올라가요</text>
    <rect x="164" y="132" width="148" height="34" rx="9" fill="#DCF0F5" stroke="#0E7490" stroke-width="1.8"/>
    <text x="238" y="146" font-size="10" fill="#0C4A6E" text-anchor="middle" font-weight="800">계절 길이 변화</text>
    <text x="238" y="159" font-size="8.6" fill="#334155" text-anchor="middle">여름이 길어지고 겨울이 짧아져요</text>
    <defs><marker id="wm1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker></defs></svg>`,

  // 연평균 기온 변화 — 원문 11개 값
  temp:(()=>{ let b='';
    TEMP_V.forEach((v,i)=>{
      const h = Math.round((v-11.8)/2.2*94), x = 24+i*26, y = 142-h;
      const hi = (i===0 || i===TEMP_V.length-1);
      b += `<rect x="${x}" y="${y}" width="18" height="${h}" rx="3" fill="${hi?'#0E7490':'#93CDDD'}" stroke="${hi?'#0C4A6E':'#6BB6CC'}" stroke-width="1"/>`;
      if(hi) b += `<text x="${x+9}" y="${y-5}" font-size="9.5" fill="#0C4A6E" text-anchor="middle" font-weight="800">${v.toFixed(1)}</text>`;
    });
    return `<svg viewBox="0 0 320 180"><rect width="320" height="180" fill="#F8FAFC"/>
    <text x="160" y="17" font-size="11" fill="#0C4A6E" text-anchor="middle" font-weight="800">우리나라 연평균 기온의 변화 (℃)</text>
    <line x1="16" y1="142" x2="308" y2="142" stroke="#94A3B8" stroke-width="1.6"/>
    ${b}
    <text x="33" y="156" font-size="8" fill="#64748B" text-anchor="middle">1912~1920년</text>
    <text x="289" y="156" font-size="8" fill="#64748B" text-anchor="middle">2011~2020년</text>
    <rect x="16" y="162" width="292" height="14" rx="6" fill="#DCF0F5" stroke="#0E7490" stroke-width="1.4"/>
    <text x="162" y="172" font-size="9" fill="#0C4A6E" text-anchor="middle" font-weight="700">10년마다 약 0.2 ℃씩 올라 모두 1.9 ℃ 높아졌어요</text></svg>`; })(),

  // 계절 길이 변화 — 원문 네 값
  seas:(()=>{ const TONE={봄:['#FEF3C7','#B45309'], 여름:['#FEE2E2','#DC2626'], 가을:['#FDF2F8','#BE185D'], 겨울:['#EFF6FF','#1D4ED8']};
    const ORD=['봄','여름','가을','겨울'], W=272, X0=26;
    function band(src,y){ let x=X0, out='';
      ORD.forEach(k=>{ const w = src[k]/365*W, T=TONE[k];
        out += `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="26" fill="${T[0]}" stroke="${T[1]}" stroke-width="1.4"/>`;
        out += `<text x="${(x+w/2).toFixed(1)}" y="${y+12}" font-size="8.6" fill="${T[1]}" text-anchor="middle" font-weight="800">${k}</text>`;
        out += `<text x="${(x+w/2).toFixed(1)}" y="${y+22}" font-size="8.4" fill="#334155" text-anchor="middle">${src[k]}일</text>`;
        x += w; });
      return out; }
    return `<svg viewBox="0 0 320 176"><rect width="320" height="176" fill="#F8FAFC"/>
    <text x="160" y="17" font-size="11" fill="#0C4A6E" text-anchor="middle" font-weight="800">계절 길이의 변화</text>
    <text x="16" y="40" font-size="8.6" fill="#64748B" font-weight="700">예전</text>
    ${band(SEAS_OLD,30)}
    <text x="16" y="86" font-size="8.6" fill="#64748B" font-weight="700">요즘</text>

   ① 고르기 — 후보 아홉 장에서 「내가 매일 스스로 실천할 수 있는 기후 행동」 네 장을 골라 수첩에 적는다.

   ⭐ 지도서 유의점("스스로 실천할 기후 행동을 선택하고 실천 결과를 반성하게 한다")을
      선택에서 끝나지 않는 세 단계 무대로 옮겼다. */

function cbPanel(st){
  const done = st.cbLk != null;
  let right = '';
  right += `<div class="nb-step">📓 적은 행동 ${st.cbSel.length} / ${CB_PICK_N} · 표시한 줄 ${st.cbMk.filter(x=>x!=null).length} / ${CB_PICK_N}</div>`;

  if(done){
    right += `<div class="nb-card"><div class="pt">🌱 기후 행동을 알아냈어요</div>
      <div><b>기후 행동</b>은 기후변화를 막으려는 <b>모든 노력</b>이에요. 세계 여러 나라와 정부·국회, 기업, 개인이
      저마다 할 수 있는 일을 해요. 그래서 기후 행동은 <b>누구나</b> 참여할 수 있어요.</div>
      <div style="margin-top:5px">수첩에는 <b>매일매일 스스로</b> 실천할 수 있는 일을 적어요. 적는 것으로 끝나지 않고
      실천한 뒤에 <b>돌아보는 일</b>까지 이어져야 생활 속에서 계속할 수 있어요.</div></div>`;
  } else if(!cbPicked(st)){
    right += `<div class="nb-step">① 내가 매일 스스로 실천할 수 있는 기후 행동을 골라요</div>`;
    right += `<div class="act-grid">${CB_CARDS.map((c,k)=>{
      const taken = st.cbSel.indexOf(k) >= 0;
      return `<button class="${taken?'taken':''}${st.cbWrong===k?' no':''}" onclick="pickAction(${k})">${taken?'✔ ':''}${c.n}</button>`;
    }).join('')}</div>`;
  } else if(!cbMarked(st)){
    right += `<div class="nb-step">② 오늘 하루를 돌아보며 실천 결과를 표시해요</div>`;
    right += st.cbSel.map((ci,r)=>{
      const nm = CB_CARDS[ci].n;
      return `<div class="mark-row"><span class="lbl">${r+1}. ${nm}</span>
        <span class="mark-btns">${CB_MARKS.map((m,mi)=>
          `<button class="${st.cbMk[r]===mi?'on':''}" title="${m.t}" onclick="markRow(${r},${mi})">${m.s}</button>`).join('')}</span></div>`;
    }).join('');
  } else {
    const rough = st.cbMk.some(x=>x!==0);
    right += `<div class="nb-msg">${rough
      ? '○이 아닌 줄이 있네요. 실천이 어려운 날도 있어요.'
      : '네 줄을 모두 잘 실천했어요.'} 이제 <b>어떻게 할까요?</b></div>`;
    right += `<div class="nb-step">③ 돌아보기</div>`;
    right += `<div class="look-list">${CB_LOOK.map((o,k)=>
      `<button class="${st.cbWrongLook===k?'no':''}" onclick="pickLook(${k})">${o}</button>`).join('')}</div>`;
  }
  if(st.cbMsg) right += `<div class="nb-msg${st.cbWarn?' warn':''}">${st.cbMsg}</div>`;

  return `<div class="nb-wrap">
    <div style="text-align:center"><b style="color:var(--green)">📓 고르고 · 적고 · 돌아봐요</b></div>
    <div class="nb-body">
      <div class="nb-canvas">${cbCanvas(st)}<div class="cvcap">내가 실천할 기후 행동을 적고 결과를 돌아보는 수첩이에요</div></div>
      <div class="nb-right">${right}</div>
    </div>
  </div>`;
}

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function cbRender(){ main.innerHTML = slides[state.idx].render(state); }

/* ① 기후 행동 고르기 */
function pickAction(k){
  if(state.cbLk!=null) return;                                     // ① 확정 후 전체 잠금
  if(!(Number.isInteger(k) && k>=0 && k<CB_CARDS.length)) return;  // ④ 무효 카드 번호(정수만)
  if(cbPicked(state)) return;                                      // ⑥ 네 장 초과 선택 불가
  if(state.cbSel.indexOf(k)>=0) return;                            // ⑤ 이미 고른 카드 재선택 무시
  if(state.cbWrong!=null) return;                                  // ⑦ 오답 안내 표시 중 재클릭 무시
  const c = CB_CARDS[k];
  if(c.k==='me'){
    state.cbSel.push(k); state.cbWrong=null; state.cbWarn=false;
    state.cbMsg = cbPicked(state)
      ? '네 줄을 모두 적었어요. 이제 <b>오늘 하루</b>를 돌아보며 결과를 표시해요.'
      : `<b>${c.n}</b>을(를) 수첩에 적었어요. ${cbLeft(state)}개 더 골라요.`;
    if(cbPicked(state)) playChime(); else playBlip();
    cbRender(); return;
  }
  state.cbWrong = k; state.cbWarn = true;
  if(c.k==='firm'){
    state.cbMsg = '기후 행동이 맞지만 <b>기업</b>이 하는 일이에요. 수첩에는 내가 <b>스스로</b> 할 수 있는 일을 적어요.';
  } else if(c.k==='gov'){
    state.cbMsg = '기후 행동이 맞지만 <b>정부와 국회</b>가 하는 일이에요. 수첩에는 내가 <b>스스로</b> 할 수 있는 일을 적어요.';
  } else {
    state.cbMsg = '이것은 기후변화를 막는 일이 <b>아니에요</b>. 오히려 에너지를 더 쓰게 돼요.';
  }
  playThud(); cbRender();
  setTimeout(()=>{ if(state.cbWrong===k){ state.cbWrong=null; state.cbMsg=null; state.cbWarn=false; cbRender(); } },1800);
}

/* ② 실천 결과 표시 — 정답 없음(오늘 하루를 돌아보는 자리) */
function markRow(r,m){
  if(state.cbLk!=null) return;                                     // ① 확정 후 전체 잠금
  if(!cbPicked(state)) return;                                     // ② 네 장을 다 고르기 전에는 무시(순서)
  if(!(Number.isInteger(r) && r>=0 && r<CB_PICK_N)) return;        // ④ 무효 줄 번호(정수만)
  if(!(Number.isInteger(m) && m>=0 && m<CB_MARKS.length)) return;  // ④ 무효 표시 번호(정수만)
  state.cbMk[r] = m; state.cbWarn=false; state.cbWrong=null;
  state.cbMsg = cbMarked(state)
    ? '네 줄을 모두 표시했어요. 이제 <b>돌아볼</b> 차례예요.'
    : `${r+1}번 줄에 <b>${CB_MARKS[m].s}</b>를 표시했어요.`;
  if(cbMarked(state)) playChime(); else playBlip();
  cbRender();
}

/* ③ 되돌아보기 */
function pickLook(k){
  if(state.cbLk!=null) return;                                     // ① 확정 후 잠금
  if(!cbMarked(state)) return;                                     // ③ 기록이 끝나지 않으면 무시(순서)
  if(!(Number.isInteger(k) && k>=0 && k<CB_LOOK.length)) return;   // ④ 무효 번호(정수만)
  if(state.cbWrongLook!=null) return;                              // ⑦ 오답 안내 표시 중 재클릭 무시
  if(k===CB_LOOK_OK){
    state.cbLk = k; state.cbWrongLook=null; state.cbMsg=null; state.cbWarn=false;
    playChime(); cbRender(); return;
  }
  state.cbWrongLook = k; state.cbWarn = true;
  state.cbMsg = k===0
    ? '쉬운 것만 남기면 <b>실천</b>은 늘지 않아요. 어려웠던 까닭을 먼저 생각해 봐요.'
    : '기후 행동은 <b>누구나</b> 참여할 수 있어요. 한 사람 한 사람의 실천이 모여요.';
  playThud(); cbRender();
  setTimeout(()=>{ if(state.cbWrongLook===k){ state.cbWrongLook=null; state.cbMsg=null; state.cbWarn=false; cbRender(); } },1800);
}

function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u2_l05_인구분포.html'; } // l04 → l05 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();

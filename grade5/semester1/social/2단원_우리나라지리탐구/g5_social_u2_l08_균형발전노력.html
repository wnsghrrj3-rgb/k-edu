성취기준 [6사02-02] · 교과서 p.91~97 · 지도서(대단원2 **13~14차시** 인구 분포의 불균형을 해결하기 위한 다양한 노력을 살펴볼까요, 지도서 p.192~200) 근거
학습 목표: 인구 분포의 불균형을 해결하기 위한 노력을 설명할 수 있다.
직접조작: 해결 방안 잣대 대기(신규 패턴 — 심사·기각형 / 세 관문 통과형)
  ⭐ 지도서 수업 기법이 「**토의·토론 학습, 사례 탐구하기**」이고, 교과서 p.94는 방안을 내는 데서 끝나지 않는다 —
     [내가 생각한 해결 방안 평가하기]로 **세 가지 잣대**를 준다.
     ① 문제의 원인을 해결하는 데 도움이 되는 방안인지 판단합니다.
     ② 도덕적으로 옳은 방안인지 살펴봅니다.
     ③ 해결 방안에 필요한 비용이나 노력을 고려해 실현할 수 있는 방안인지 평가합니다.
     지도서 활동 의도도 그대로다 — “정책의 효과, 파생되는 문제점 등이 **다각적으로 검토**되어야 함을 확인하는 활동”.
  ⭐ 지금까지 스물두 종의 조작은 전부 **맞는 것을 찾아 채우는** 일이었다(잇기·쌓기·환산·대조·고리 모두 그렇다).
     이번은 **내가 고른 것을 잣대에 대어 재는** 일이다 — 걸린 방안은 “틀린 답”이 아니라
     **어느 잣대에서 걸린 안**이고, 그 잣대가 **왜 걸렸는지 말해 준다**.
     조작의 결과가 처음으로 ○/✕가 아니라 **통과 / 기각 사유**다.
  ① 단계 — 해결하고 싶은 **문제**를 고른다(일자리 부족 / 폐교 증가 / 편의 시설 부족 — 지도서 p.94~95 예시 3종 그대로).
  ② 단계 — 그 문제에 대한 **방안 네 장** 중 하나를 고르고, **세 관문을 왼쪽부터 차례로** 눌러 대 본다.
     하나라도 걸리면 그 방안은 **기각**되고(문에 ✕가 찍혀 남는다), 다른 방안을 골라 다시 심사한다.
     ⚠️ 문제마다 걸리는 잣대가 **①②③ 하나씩 + 통과 한 장**으로 배치돼 있다 — 세 잣대가 전부 실제로 한 번씩 일한다.
  ③ 단계 — 세 관문을 다 통과한 방안에 **「우리 모둠의 방안」 도장**이 찍히고, 그때 마무리 3택이 열린다
     (교과서 p.97 [재미있게 확인해요] 문장 완성 = **수도권 / 불균형**).
  ⭐ 확정 전에는 **다른 문제로 바꿔** 처음부터 심사할 수 있다(바꾸면 그 문제의 심사가 초기화된다).
  ⚠️ 가드 8종: 확정 후 전체 잠금 / 무효 문제·방안·관문·마무리 번호(`Number.isInteger`) /
     문제를 고르기 전 방안 선택 무시(순서 강제) / 방안을 고르기 전 관문 무시(순서 강제) /
     앞 관문을 통과하기 전 뒤 관문 무시(관문 순서 강제) / 이미 기각된 방안 재심사 무시 ·
     이미 통과한 관문 재클릭 무시 / 세 관문 통과 전 마무리 무시 / 기각 안내 표시 중 재클릭 무시. 재시도 허용(감점 없음).
  ⚠️ 정직 원칙: 심사대 도식은 **생각하는 차례**를 나타낸 개념 도식이며 실제 심사 제도가 아니다.
     기각된 방안도 “나쁜 생각”이 아니라 **이 잣대에서 걸린 생각**으로만 말한다.
지도서 근거:
  [동기 유발 · 전시 학습 되돌아보기] 수도권 = 주택 문제·교통 혼잡과 주차 문제·시설 부족·쓰레기 처리·삶의 질 저하 /
    비수도권 = 시설과 일자리 감소·일손 부족·빈집 증가·폐교 / 국가적으로는 **국가 균형 발전이 어려워져 국가 경쟁력이 떨어진다**. (= 11~12차시 회수)
  [학습 문제] 인구 분포의 불균형을 해결하기 위한 다양한 노력을 알아봅시다.
  [전개 1 · 정부의 노력 p.91] 정부는 **국가 균형 발전을 담당하는 기구**를 두고 **제도와 법**을 만들어 시행하고 있다.
    또한 **공공 기관 이전, 지역 기업 육성, 교육 기관과 지방 자치 단체 지원** 등을 통해 각 지역의 발전을 돕고 있다.
    · **공공 기관 이전** — 공공 기관을 수도권에서 전국 곳곳으로 옮겨 **인구 이동과 지역 발전을 유도**합니다.
      (공공 기관 직원과 가족 등 인구가 이동해 가고, 지역에 일자리가 생긴다.)
    · **고향 사랑 기부제 시행** — 고향이나 관심 지역에 기부하면 **답례품과 세금 혜택**을 주는 제도를 시행합니다.
      (지방의 재정을 돕고, 나아가 국가 균형 발전을 유도할 수 있다.)
    · **로컬 브랜딩 사업 지원** — 지역의 **자원과 문화** 등을 활용하여 **지역만의 매력**을 만드는 사업을 지원해 사람들을 끌어모읍니다.
      (지역의 관광 자원이나 특산물, 역사 등을 바탕으로 홍보할 거리를 만드는 일.)
    · **청년 마을 만들기** — 청년 마을을 만들어 **정착을 지원**함으로써 **지역 청년의 유출을 줄입니다**.
      (다른 지역의 청장년층이 지역을 체험하고 거주할 수 있도록 돕는 사업.)
    사진 해설 = ① 기차당 뚝방 마켓 — 둑방 벼룩시장, 지역 주민이 만든 물건을 싸게 팔아 관광객을 불러 모은다.
      ② 이바구 마을 — 청년 기획자들이 사회적 경제 창업을 진행하며 지역과의 상생을 추구하는 청년 마을 사업.
  [전개 2 · 지역의 노력 p.92] 인구가 빠져나가 어려움을 겪는 지역에서는 지역 발전을 위해 다양한 노력을 기울이고 있다.
    지역에 **새로운 일자리**를 만들거나 **지역 특색을 살린 정책**을 시행하고,
    **주거·교육 환경 개선, 문화생활 지원, 창업 지원** 등을 바탕으로 살기 좋은 지역을 만들어 인구를 끌어들이고 있다.
    · **디지털 관광 주민증 발급** — 관광객에게 발급해 지역을 **관광지로 활성화**합니다. (관광지·식당에서 할인을 받을 수 있다.)
    · **작은 학교 살리기** — 악기 연주나 스포츠 활동 등 **특별 교육과정을 운영**하고 **학교 시설을 개선**하는 정책을 폅니다.
    · **혁신 도시 건설** — 혁신 도시를 만들어 **기업을 끌어들이고 일자리를 늘립니다**.
    [낱말] **혁신 도시** = 공공 기관의 이전을 계기로 지역의 **새로운 성장 동력**을 만드는 **미래형 도시**.
    [묻고 답하기] 지역에 새로운 일자리를 어떻게 만드나요? → 지역의 **문화, 역사, 관광 자원**을 활용하거나
      나라에서 **특별한 산업을 지원**하면 새로운 일자리를 만들 수 있습니다.
  [미디어 활동 · p.93] 주민 참여 발전 사업의 수익을 주민에게 나누어 주는 지역의 사례.
    연간 최대 **600만 원**의 ‘햇빛 연금’, **18세 미만**의 청소년·어린이에게 연간 **40만 원**의 ‘햇빛 아동 수당’.
    **2022년까지 감소하던 인구가 2023년부터 증가**하기 시작했다. 앞으로 **해상 풍력 발전**을 시행해 ‘바람 연금’을 줄 계획이다.
    [정보 활용] 정책이 인구 증가로 이어진 과정 카드 순서 =
      **주민이 참여할 수 있는 사업을 만든다 → 주민들이 사업에 적극 참여한다 → 주민의 소득이 늘어 생활 수준이 좋아진다
      → 지역 경제가 활발해져 새로운 산업이 생겨난다 → 지역이 발전하고 인구가 증가한다.**
    특징 = **외부의 지원에 의존하지 않고 스스로 주민 소득을 높이는 주민 참여 사업**이다.
    ⚠️ 기사 원문은 옮기지 않고 사실만 자체 문장으로 재구성했다. 신문사 이름은 0.
  [친구와 활동 · p.94~95] 해결 방안 생각하기 = ① 불균형이 나타난 **원인을 줄이거나 없애는** 방법을 찾는다
    ② **수도권 인구를 분산**하는 방법을 생각한다 ③ **비수도권에 사람들이 모이게** 하는 방법을 생각한다.
    내가 생각한 해결 방안 평가하기 = ① **문제의 원인을 해결하는 데 도움**이 되는 방안인지 판단한다
    ② **도덕적으로 옳은** 방안인지 살펴본다 ③ 필요한 **비용이나 노력**을 고려해 **실현할 수 있는** 방안인지 평가한다.
    토의 = 붙임쪽지를 차례로 붙이고 설명 → 장단점과 실현 가능성 의견을 뒷면에 적기 → 고쳐 가장 적합한 방안을 모둠 방안으로 정하기.
    예시 답안 = 일자리 부족 → **비수도권에 공장을 세우면 공장 건설 비용을 지원해 주는 정책** /
      폐교 증가 → **작은 학교 살리기로 교육 프로그램 지원** / 시설 부족 → **이동형 상점 운영 지원**.
    ⚠️ 붙임쪽지·모둠 토의는 **교실에서 손으로 하는 활동**이라 결과를 앞질러 주지 않는다 —
    자기주도 파일에서는 **평가 잣대 세 가지를 조작으로 옮기는 데까지만** 한다.
  [별별 직업 · p.96] **로컬 크리에이터** = 지역의 **자원과 문화 특성에 혁신적인 생각을 결합**해 **사업적 가치**를 만들고
    새롭게 **상품화**하는 일을 한다. 지역 특산물을 개발해 제품을 만들거나 상점을 열고, 지역 고유의 문화를 관광객에게 제공한다.
    지역에 **새로운 가치와 활력**을 가져올 수 있어 인구 분포의 불균형을 해결할 대안으로 주목받는다.
    필요한 것 = 지역 특성을 잘 아는 것 / 사회 현상과 소비자 욕구 변화에 민감할 것 / 새로운 시각 / 꾸준한 실천 의지 / 소통과 협력.
  [주제 마무리 · 재미있게 확인해요 p.97] 옳은 설명 카드의 글자를 모아 문장 완성 —
    정답 = 우리나라의 인구는 **수도권**에 집중되어 있어 인구 분포가 **불균형**합니다.
    옳은 설명 = 교통 혼잡 문제 발생 / 교육·문화 시설이 많은 곳에 사람이 모여 삶 / 일자리가 많아질수록 인구가 늘어남 /
      비수도권에서는 인구 감소를 막으려고 다양한 노력을 함 / 오늘날 인구 분포는 인문환경의 영향을 크게 받음 /
      비수도권의 인구를 늘리려고 공공 기관을 옮김.
    옳지 않은 설명 = 수도권이 노년층 비율이 높다 / 수도권에 빈집이 많다 / 병원이 인구 감소 지역에 더 많다 /
      비수도권 인구가 늘어나고 있다 / 인구 분포가 교통의 영향을 받지 않는다 / 인구가 줄어드는 지역에 학교가 많아진다.
  [얼마나 잘했을까 p.97] ① 우리나라 인구 분포의 특징과 문제점, 해결 노력을 설명할 수 있다
    ② 통계 자료를 이용하여 우리나라 인구 분포의 특징을 파악할 수 있다
    ③ 인구 분포의 불균형과 문제점을 이해하고 국토 균형 발전 노력에 동참하는 태도를 갖게 됐다. → 17슬 자기 평가를 이 3항 그대로 옮겼다.
  [13~14차시 주요 내용 정리] ① 공공 기관의 지방 이전과 혁신 도시 유치 ② 로컬 브랜딩 사업 ③ 고향 사랑 기부제
    ④ 청년 마을 만들기 ⑤ 디지털 관광 주민증 발급 ⑥ 작은 학교 살리기. → 16슬 정리를 이 여섯 항 그대로 옮겼다.
  [지도 꿀 Tip] 학생의 관점에서 방안을 생각한 후 **개인에서 모둠으로 집단을 확장하며** 토의하도록 지도한다 /
    주제에서 공부한 내용을 먼저 정리하고, 문제의 **옳고 그름을 판단**해 보도록 지도한다.
  [차시 예고] 다음 시간에는 생각을 펼쳐요.
⚠️ 설계 원칙:
  · **9차시(생각을 펼쳐요)·10차시(단원 마무리) 선행 침범 0.**
    다만 **[재미있게 확인해요]·[얼마나 잘했을까]는 13~14차시 정리 단계 소관**이다 — 지도서 정리에 그대로 적혀 있다.
  · 교사용 참고 자료(균형 발전 종합 정보 시스템, 지방 시대 위원회, 기회 발전 특구, 인구 감소 지역 지정 기준,
    지역별 의료비 통계, 식품 사막 재론, 참고 도서)는 성취기준 밖이므로 0.
  · **지역 이름 0.** 교과서 사진·기사에 개별 시·군 이름이 나오지만 지도상의 유의점(사실적 지식보다 정보 파악·일반화 도출)에 따라
    지역명을 외우게 하지 않는다 — 사례는 **어떤 지역**·**한 지역**으로만 쓴다. 문항 내 지역명·연도 0.
  · 수치는 교과서 원문값만 쓴다 — 연간 최대 600만 원 / 18세 미만 연간 40만 원 / 2022년까지 감소·2023년부터 증가.

<script>
/* ===== 시각 자료(SVG 씬) — 도식 =====
   ⚠️ 정직 원칙: 모든 그림은 내용을 나타낸 도식이며 실제 사진·통계 지도가 아니다.
   주민 참여 발전 사업의 수치(연간 최대 600만 원 / 18세 미만 연간 40만 원 / 2022년까지 감소 → 2023년부터 증가)는
   교과서 p.93 원문값을 그대로 옮겼다. 공공 기관 이전 수의 시·도별 개수는 쓰지 않는다.
   ⚠️ 지역 이름은 쓰지 않는다 — 사례는 '어떤 지역'·'한 지역'으로만 그린다. */

/* 사람 도형 */
function figure(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <circle cx="0" cy="-6" r="3.4" fill="${col}"/>
    <path d="M-4.2 6 q0 -7 4.2 -7 q4.2 0 4.2 7 Z" fill="${col}"/></g>`;
}
/* 집 도형 */
function roof(x,y,s,col){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-9 0 L0 -8 L9 0 Z" fill="${col}"/>
    <rect x="-6.4" y="0" width="12.8" height="9" fill="${col}" opacity=".75"/></g>`;
}
/* 건물 도형 */
function block(x,y,w,h,col){
  let win="";
  for(let r=0;r<Math.floor(h/9);r++){ for(let c=0;c<Math.floor(w/7);c++){
    win += `<rect x="${x+3+c*7}" y="${y-h+5+r*9}" width="3.4" height="4.4" fill="#ffffff" opacity=".72"/>`; } }
  return `<g><rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="1.6" fill="${col}"/>${win}</g>`;
}
/* 이름표 상자 */
function plate(x,y,w,h,txt,fs,bg,st,tc){
  const lines = txt.split('|');
  let t='';
  lines.forEach((ln,i)=>{ t += `<text x="${x+w/2}" y="${y+(h-(lines.length-1)*(fs+2))/2+fs*0.36+i*(fs+2)}" font-size="${fs}" fill="${tc}" text-anchor="middle" font-weight="700">${ln}</text>`; });
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${bg}" stroke="${st}" stroke-width="1.4"/>${t}</g>`;
}

const SVG = {

/* 상태 판정 헬퍼 */
function jdProbSet(st){ return st.jdProb!=null; }
function jdPlanSet(st){ return jdProbSet(st) && st.jdPlan!=null; }
function jdPassed(st){ return st.jdGate; }                       // 지금 방안이 지난 관문 수
function jdStamped(st){ return jdPlanSet(st) && st.jdGate>=JD_GATES.length; }
function jdAllDone(st){ return jdStamped(st) && st.jdFin!=null; }
function jdOutList(st){ return jdProbSet(st) ? st.jdOut[st.jdProb] : []; }

/* 심사대 캔버스 — 방안 카드가 세 관문을 지나 도장까지 간다 */
function jdCanvas(st){
  const P = jdProbSet(st) ? JD_PROBS[st.jdProb] : null;
  const plan = jdPlanSet(st) ? P.plans[st.jdPlan] : null;
  const stamped = jdStamped(st);

  const probBox = P
    ? `<rect x="10" y="6" width="188" height="22" rx="7" fill="#FFF8E1" stroke="#B45309" stroke-width="1.6"/>
       <text x="104" y="20" font-size="8.6" fill="#8A6D3B" text-anchor="middle" font-weight="800">고른 문제 · ${P.title}</text>`
    : `<rect x="10" y="6" width="188" height="22" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/>
       <text x="104" y="20" font-size="8.6" fill="#94A3B8" text-anchor="middle" font-weight="800">? 어떤 문제를 풀지 골라 봐요</text>`;

  const planLines = plan ? splitPlan(plan.t) : null;
  const planBox = plan
    ? `<rect x="10" y="36" width="188" height="26" rx="7" fill="#DCF0F5" stroke="#0E7490" stroke-width="1.8"/>
       ${planLines.map((ln,i)=>`<text x="104" y="${planLines.length===1?53:48+i*11}" font-size="7.8" fill="#0C4A6E" text-anchor="middle" font-weight="700">${ln}</text>`).join("")}`
    : `<rect x="10" y="36" width="188" height="26" rx="7" fill="#F8FAFC" stroke="${P?'#B45309':'#94A3B8'}" stroke-width="1.6" stroke-dasharray="4 3"/>
       <text x="104" y="53" font-size="8.2" fill="${P?'#8A6D3B':'#94A3B8'}" text-anchor="middle" font-weight="800">${P?'? 재어 볼 방안을 골라 봐요':'먼저 문제를 골라요'}</text>`;

  const arrow1 = `<path d="M104 28 L104 34" stroke="${P?'#B45309':'#CBD5E0'}" stroke-width="2"/>
    <path d="M100 33 L104 38 L108 33 Z" fill="${P?'#B45309':'#CBD5E0'}"/>`;
  const arrow2 = `<path d="M104 62 L104 68" stroke="${plan?'#0E7490':'#CBD5E0'}" stroke-width="2"/>
    <path d="M100 67 L104 72 L108 67 Z" fill="${plan?'#0E7490':'#CBD5E0'}"/>`;

  const gates = JD_GATES.map((g,i)=>{
    const x = 10 + i*65;
    const passed = plan && st.jdGate>i;
    const blocked = st.jdWrongGate===i;
    const now = plan && st.jdGate===i && !blocked;
    const fill = passed ? '#DFF0E7' : (blocked ? '#FEE2E2' : (now ? '#FFF8E1' : '#F8FAFC'));
    const stk  = passed ? '#3F9169' : (blocked ? '#DC2626' : (now ? '#B45309' : '#94A3B8'));
    const dash = (passed||blocked||now) ? '' : ' stroke-dasharray="4 3"';
    const mark = passed
      ? `<path d="M${x+22} 96 L${x+27} 102 L${x+37} 90" stroke="#3F9169" stroke-width="3" fill="none" stroke-linecap="round"/>`
      : (blocked
        ? `<path d="M${x+22} 90 L${x+37} 103 M${x+37} 90 L${x+22} 103" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>`
        : `<rect x="${x+23}" y="90" width="13" height="14" rx="2" fill="none" stroke="${now?'#B45309':'#94A3B8'}" stroke-width="2"/>
           <circle cx="${x+33}" cy="97" r="1.4" fill="${now?'#B45309':'#94A3B8'}"/>`);
    return `<g><rect x="${x}" y="76" width="58" height="36" rx="7" fill="${fill}" stroke="${stk}" stroke-width="1.6"${dash}/>
      <text x="${x+29}" y="87" font-size="8" fill="${stk}" text-anchor="middle" font-weight="800">${i+1}번 잣대</text>
      ${mark}</g>`;
  }).join("");

  const arrow3 = `<path d="M104 112 L104 118" stroke="${stamped?'#3F9169':'#CBD5E0'}" stroke-width="2"/>
    <path d="M100 117 L104 122 L108 117 Z" fill="${stamped?'#3F9169':'#CBD5E0'}"/>`;

  const stamp = stamped
    ? `<rect x="34" y="122" width="140" height="28" rx="9" fill="#F0FDF4" stroke="#3F9169" stroke-width="2.2"/>
       <text x="104" y="134" font-size="8.6" fill="#1C4D35" text-anchor="middle" font-weight="800">우리 모둠의 방안</text>
       <text x="104" y="145" font-size="7.6" fill="#3F9169" text-anchor="middle" font-weight="700">세 잣대를 모두 지났어요</text>`
    : `<rect x="34" y="122" width="140" height="28" rx="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/>

  return `<div class="jd-canvas"><svg viewBox="0 0 208 158">

    ${probBox}${arrow1}${planBox}${arrow2}${gates}${arrow3}${stamp}
  </svg><div class="cvcap">방안을 재어 보는 차례를 나타낸 도식이에요</div></div>`;
}
/* 방안 문구를 캔버스 폭에 맞춰 두 줄로 나눈다 */
function splitPlan(t){
  if(t.length<=15) return [t];
  const mid = Math.floor(t.length/2);
  let cut = t.indexOf(' ', mid);
  if(cut<0) cut = t.lastIndexOf(' ', mid);
  if(cut<0) cut = mid;
  return [t.slice(0,cut).trim(), t.slice(cut).trim()];
}

/* 조작 패널 — 왼쪽 심사대, 오른쪽 지금 할 일 */
function jdPanel(st){
  const P = jdProbSet(st) ? JD_PROBS[st.jdProb] : null;
  const out = jdOutList(st);

  const tags = JD_PROBS.map((p,i)=>`<span class="tag ${st.jdProb===i?'on':''}">${p.short}</span>`).join("");
  const head = `<div class="jd-head">${tags}${(jdProbSet(st)&&!jdAllDone(st))?`<button class="swap" onclick="swapProb()">다른 문제 고르기</button>`:''}</div>`;

  let right = "";
  if(jdAllDone(st)){
    right = `<div class="jd-step">심사를 마쳤어요</div>
      <div class="jd-card"><div class="pt">⭐ 좋은 방안을 고르는 세 잣대</div>
        ① 문제의 <b>원인</b>을 푸는 데 도움이 되는지, ② <b>도덕적으로 옳은지</b>,
        ③ 드는 <b>비용과 노력</b>을 생각할 때 <b>해낼 수 있는지</b>를 함께 살펴야 해요.
        하나만 보고 정하면 좋아 보이던 방안도 다른 잣대에서 걸릴 수 있어요.</div>
      <div class="jd-msg">교실에서는 이렇게 고른 방안을 <b>모둠 친구들과 나누며</b> 더 좋은 방안으로 고쳐 가요.</div>`;
  } else if(!jdProbSet(st)){
    const list = JD_PROBS.map((p,i)=>`<button onclick="pickProb(${i})">${p.title} — ${p.line}</button>`).join("");
    right = `<div class="jd-step">① 어떤 문제를 풀어 볼까요</div>
      <div class="jd-msg ${st.jdWarn?'warn':''}">${st.jdMsg||'인구 분포의 불균형으로 비수도권에 나타난 문제 가운데 하나를 골라 봐요.'}</div>
      <div class="jd-list">${list}</div>`;
  } else if(!jdPlanSet(st)){
    const list = P.plans.map((p,k)=>{
      const dead = out.indexOf(k)>=0;
      return `<button class="${dead?'out':''}${st.jdWrongPlan===k?' no':''}" onclick="pickPlan(${k})">${p.t}</button>`;
    }).join("");
    right = `<div class="jd-step">② 재어 볼 방안을 골라요 · ${P.title}</div>
      <div class="jd-msg ${st.jdWarn?'warn':''}">${st.jdMsg||'방안을 하나 골라 세 잣대에 차례로 대 봐요.'}</div>
      <div class="jd-list">${list}</div>`;
  } else if(!jdStamped(st)){
    const g = st.jdGate;
    const gates = JD_GATES.map((G,i)=>{
      const cls = (st.jdGate>i?'pass':'') + (st.jdWrongGate===i?' no':'') + (st.jdGate===i&&st.jdWrongGate==null?' now':'') + (st.jdGate<i?' lock':'');
      return `<button class="${cls}" onclick="pickGate(${i})">${G.short}</button>`;
    }).join("");

      <div class="jd-list">${list}</div>`;
  }
  return `<div class="jd-wrap">${head}

Q.forEach((q,i)=>{

// 16 정리: 요약 — 지도서 13~14차시 주요 내용 정리 6항
slides.push({stage:5,badge:"정리",render:()=>`

    <div class="sum-item"><span class="n">⑤</span><div><b style="color:var(--green)">디지털 관광 주민증 발급</b> — 인구가 줄어드는 지역을 <b style="color:var(--green)">관광지로 활성화</b>해요.</div></div>
    <div class="sum-item"><span class="n">⑥</span><div><b style="color:var(--green)">작은 학교 살리기</b> — 특별 교육과정을 운영하고 시설을 개선해 <b style="color:var(--green)">교육 환경</b>을 좋게 만들어요.</div></div>
    <div class="sum-item"><span class="n">★</span><div>[별별 직업] <b style="color:var(--red)">로컬 크리에이터</b>는 지역의 자원과 문화 특성에 <b style="color:var(--red)">새로운 생각</b>을 결합해 상품과 가치를 만드는 사람이에요. 지역에 새로운 활력을 가져와 불균형을 해결할 대안으로 주목받고 있어요.</div></div>
  </div>
  <div class="scene-row">${sceneCard('maker','[별별 직업] 로컬 크리에이터','wide')}</div>

// 17 정리: 자기 평가 — 교과서 p.97 [얼마나 잘했을까] 3항
slides.push({stage:5,badge:"정리",render:(st)=>`
  <div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>

  <div class="ka-grp"><div class="sum-list">
    ${selfCheck(0,"우리나라 인구 분포의 특징과 문제점, 해결 노력을 설명할 수 있어요",st)}
    ${selfCheck(1,"통계 자료를 이용하여 우리나라 인구 분포의 특징을 파악할 수 있어요",st)}
    ${selfCheck(2,"인구 분포의 불균형과 문제점을 이해하고 국토 균형 발전 노력에 동참하는 태도를 갖게 됐어요",st)}
  </div><div class="note">잘 떠오르지 않는 곳은 앞 슬라이드를 다시 살펴봐도 좋아요.</div></div>`});
// 18 종료
slides.push({stage:5,badge:"정리",end:true,render:()=>{
  const s=state.score, msg = s>=100?"완벽해요!":s>=80?"잘했어요!":s>=60?"고생했어요!":"다시 해도 좋아요!";
  return `<div class="ka-tags"><div class="ka-bg s5">${star()} 정리</div><div class="ka-meta">${META}</div></div>
  <h2 class="ka-t" style="text-align:center">오늘 학습을 마쳤어요!</h2>
  <div class="ka-grp">
    <div class="end-score">\u2B50 ${s} <span style="font-size:.5em;color:#94A3B8">/ 100</span></div>
    <div class="end-msg">${msg}</div>
    <div class="note">다음은 <b style="color:var(--amber)">생각을 펼쳐요</b>!</div>
  </div>`;
}});
/* ===== 헬퍼 ===== */
function star(){return `<svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>`;}
function questionHTML(q,i,st){
  const qs = st.q[i];
  const opts = q.opts.map((o,k)=>{
    let cls="opt";
    if(qs.done && k===q.correct) cls+=" correct";
    if(qs.wrongPick===k) cls+=" wrong";
    return `<button class="${cls}" ${qs.done?'disabled':''} onclick="pick(${i},${k})">${o}</button>`;
  }).join("");
  let fb="";
  if(qs.done) fb=`<div class="fb ok">⭕ 정답이에요! +${q.pts}점<br><span style="font-weight:500;color:#0F172A">${q.reason}</span></div>`;
  else if(qs.wrongPick!=null) fb=`<div class="fb" style="color:#DC2626;font-weight:700">다시 해 봐요.</div>`;
  let hintHTML="";
  if(qs.hint>=1) hintHTML+=`<div class="hint">💡 ${q.h1}</div>`;
  if(qs.hint>=2) hintHTML+=`<div class="hint">💡 ${q.h2}</div>`;
  return `<div class="ka-tags"><div class="ka-bg ${i>=4?'s4':'s3'}">${star()} ${i>=4?'적용 문제':'확인 문제'} ${(i%4)+1}/4</div><div class="ka-meta">${META}</div></div>
  <div class="ka-grp" style="align-items:stretch">
    <div class="q-stem">${q.stem}</div>
    ${q.scene?`<div style="display:flex;justify-content:center;margin-bottom:6px">${sceneCard(q.scene,'')}</div>`:''}
    <div class="opts">${opts}</div>
    ${fb}${hintHTML}
  </div>`;
}
function selfCheck(k,label,st){
  return `<div class="check ${st.self[k]?'on':''}" onclick="toggleSelf(${k})"><span class="box"></span><span>${label}</span></div>`;
}

/* ===== 상태·엔진 ===== */
const LS_KEY = "kedu_progress_g5_social_u2_l08";
const state = {
  idx:0, score:0,
  q: Q.map(()=>({done:false,hint:0,wrongPick:null,wrongCount:0})),
  self:[false,false,false],
  revealed:false,
  jdProb:null, jdPlan:null, jdGate:0, jdOut:[[],[],[]], jdFin:null,
  jdWrongPlan:null, jdWrongGate:null, jdWrongFin:null, jdMsg:null, jdWarn:false,
  jdSwaps:0,
  startTs: Date.now(),
  attempt: 1
};
try{
  const prev = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(prev && prev.attempt_count) state.attempt = prev.attempt_count+1;
}catch(e){}
const main=document.getElementById('main');
function render(){
  const s=slides[state.idx];
  state.revealed = false;
  if(s.reveal){ state.revealed = !!s._revealed; }
  main.innerHTML = s.render(state);
  document.getElementById('pg').textContent = (state.idx+1)+" / 18";
  document.getElementById('bar').style.width = ((state.idx+1)/18*100)+"%";
  document.getElementById('score').textContent = state.score;
  document.getElementById('prev').disabled = state.idx===0;
  const hintBtn=document.getElementById('hint');
  hintBtn.style.visibility = (s.q!=null && !state.q[s.q].done) ? 'visible':'hidden';
  const nextBtn=document.getElementById('next');
  if(s.end){ nextBtn.style.display='none'; showEndButtons(); }
  else { nextBtn.style.display=''; removeEndButtons();
    nextBtn.disabled = (s.q!=null && !state.q[s.q].done);
    nextBtn.textContent = '다음 →';
  }
  main.scrollTop=0;
}
function next(){ if(state.idx<slides.length-1){ state.idx++; render(); } }
function prev(){ if(state.idx>0){ state.idx--; render(); } }
function reveal(){ const s=slides[state.idx]; s._revealed=true; state.revealed=true; main.innerHTML=s.render(state); }

/* 효과음(브라우저에서만, jsdom 안전 가드) */
let _actx=null;
function _ac(){ try{ if(typeof window==='undefined') return null; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; if(!_actx) _actx=new C(); return _actx; }catch(e){ return null; } }
function playBlip(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=680; g.gain.value=.06; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.stop(t+.2);}catch(e){} }
function playThud(){ const a=_ac(); if(!a) return; try{ const o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=170; g.gain.value=.05; o.connect(g); g.connect(a.destination); const t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+.16); o.stop(t+.18);}catch(e){} }
function playChime(){ const a=_ac(); if(!a) return; try{ [523,659,784].forEach((f,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(a.destination); const t=a.currentTime+i*.12; o.start(t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.stop(t+.25);});}catch(e){} }

function jdRender(){ main.innerHTML = slides[state.idx].render(state); }
function jdClear(){ state.jdWrongPlan=null; state.jdWrongGate=null; state.jdWrongFin=null; state.jdWarn=false; }

/* ① 문제 고르기 */
function pickProb(i){
  if(jdAllDone(state)) return;                                        // ① 확정 후 전체 잠금
  if(state.jdProb!=null) return;                                      // 이미 고른 뒤에는 swapProb로만 바꾼다
  if(!(Number.isInteger(i) && i>=0 && i<JD_PROBS.length)) return;      // ② 무효 번호
  state.jdProb=i; state.jdPlan=null; state.jdGate=0; jdClear();
  state.jdMsg = `<b>${JD_PROBS[i].title}</b> 이 문제를 풀어 볼게요. 방안을 하나 골라 세 잣대에 대 봐요.`;
  playBlip(); jdRender();
}
/* 문제 바꾸기 — 확정 전에는 언제든 처음부터 다시 잰다 */
function swapProb(){
  if(jdAllDone(state)) return;                                        // ①
  if(state.jdProb==null) return;
  state.jdOut[state.jdProb] = [];
  state.jdProb=null; state.jdPlan=null; state.jdGate=0; jdClear();
  state.jdMsg = '문제를 다시 골라 봐요. 앞서 재어 본 결과는 지워졌어요.';
  state.jdSwaps++;
  playBlip(); jdRender();
}
/* ② 방안 고르기 */
function pickPlan(k){
  if(jdAllDone(state)) return;                                        // ①
  if(!jdProbSet(state)) return;                                       // ③ 문제를 고르기 전 방안 선택 무시(순서)
  if(state.jdPlan!=null) return;                                      // 이미 심사 중이면 무시
  const P = JD_PROBS[state.jdProb];
  if(!(Number.isInteger(k) && k>=0 && k<P.plans.length)) return;       // ②
  if(state.jdOut[state.jdProb].indexOf(k)>=0){                        // ⑥ 이미 기각된 방안 재심사 무시
    state.jdWrongPlan=k; state.jdWarn=true;
    state.jdMsg = '이 방안은 앞에서 <b>걸렸던 방안</b>이에요. 다른 방안을 골라 봐요.';
    playThud(); jdRender();
    setTimeout(()=>{ if(state.jdWrongPlan===k){ jdClear(); state.jdMsg=null; jdRender(); } },1600);
    return;
  }
  if(state.jdWrongPlan!=null) return;                                 // ⑧ 안내 표시 중 재클릭 무시
  state.jdPlan=k; state.jdGate=0; jdClear();
  state.jdMsg = '이 방안을 <b>1번 잣대</b>부터 차례로 대 봐요.';
  playBlip(); jdRender();
}
/* ③ 관문에 대 보기 — 왼쪽부터 차례로만 */
function pickGate(g){
  if(jdAllDone(state)) return;                                        // ①
  if(!jdPlanSet(state)) return;                                       // ④ 방안을 고르기 전 관문 무시(순서)
  if(!(Number.isInteger(g) && g>=0 && g<JD_GATES.length)) return;      // ②
  if(g !== state.jdGate) return;                                      // ⑤ 앞 관문 통과 전 뒤 관문 무시 · 지난 관문 재클릭 무시
  if(state.jdWrongGate!=null) return;                                 // ⑧
  const plan = JD_PROBS[state.jdProb].plans[state.jdPlan];
  if(plan.fail === g){
    state.jdWrongGate=g; state.jdWarn=true;
    state.jdMsg = `<b>${g+1}번 잣대에서 걸렸어요.</b> ${plan.why} 다른 방안을 골라 다시 재어 봐요.`;
    playThud(); jdRender();
    setTimeout(()=>{
      if(state.jdWrongGate===g){
        if(state.jdOut[state.jdProb].indexOf(state.jdPlan)<0) state.jdOut[state.jdProb].push(state.jdPlan);
        state.jdPlan=null; state.jdGate=0; jdClear();
        state.jdMsg = '걸린 방안은 잠갔어요. 남은 방안 가운데 하나를 골라 봐요.';
        jdRender();
      }
    },2200);
    return;
  }
  state.jdGate = g+1; jdClear();
  state.jdMsg = (plan.notes && plan.notes[g] ? plan.notes[g]+' ' : '')
    + (state.jdGate>=JD_GATES.length
      ? '세 잣대를 <b>모두 지났어요!</b> 이 방안에 도장을 찍었어요.'
      : `<b>${state.jdGate+1}번 잣대</b>도 대 봐요.`);
  playChime(); jdRender();
}
/* ④ 마무리 — 세 관문을 다 지나야 열린다 */
function pickFin(k){
  if(jdAllDone(state)) return;                                        // ①
  if(!jdStamped(state)) return;                                       // ⑦ 세 관문 통과 전 마무리 무시(순서)
  if(!(Number.isInteger(k) && k>=0 && k<JD_FIN.opts.length)) return;   // ②
  if(state.jdWrongFin!=null) return;                                  // ⑧
  if(k===JD_FIN.ok){
    state.jdFin=k; jdClear(); state.jdMsg=JD_FIN.yes;
    playChime(); jdRender();
    return;
  }
  state.jdWrongFin=k; state.jdWarn=true;
  state.jdMsg = JD_FIN.no[k < JD_FIN.ok ? k : k-1];
  playThud(); jdRender();
  setTimeout(()=>{ if(state.jdWrongFin===k){ jdClear(); state.jdMsg=null; jdRender(); } },1800);
}
function pick(i,k){
  const qs=state.q[i], q=Q[i];
  if(qs.done) return;
  if(k===q.correct){
    qs.done=true; qs.wrongPick=null;
    let gained=q.pts;
    if(qs.hint===1) gained-=2; if(qs.hint===2) gained-=5;
    if(gained<0) gained=0;
    state.score+=gained;
    document.getElementById('score').textContent=state.score;
    render();
  } else {
    qs.wrongPick=k; qs.wrongCount++;
    main.innerHTML=slides[state.idx].render(state);
    setTimeout(()=>{ qs.wrongPick=null; if(state.idx===slides.findIndex(s=>s.q===i)) main.innerHTML=slides[state.idx].render(state); },700);
  }
}
function useHint(){
  const s=slides[state.idx]; if(s.q==null) return;
  const qs=state.q[s.q]; if(qs.done) return;
  if(qs.hint<2){ qs.hint++; main.innerHTML=s.render(state); }
}
function toggleSelf(k){ state.self[k]=!state.self[k]; main.innerHTML=slides[state.idx].render(state); }

/* 종료 화면 버튼/저장 */
function showEndButtons(){
  removeEndButtons();
  const wrap=document.createElement('div'); wrap.className='end3'; wrap.id='end3';
  wrap.innerHTML=`
    <a class="a1" href="#" onclick="return false" title="문제 더 풀기는 준비 중이에요">📘 문제 더 풀기</a>
    <a class="a2" href="#" onclick="goNextLesson(event);return false">다음 차시 →</a>
    <a class="a3" href="#" onclick="goHub();return false">차시 목록</a>`;
  document.querySelector('.ka-f').after(wrap);
  saveProgress();
}
function removeEndButtons(){ const e=document.getElementById('end3'); if(e) e.remove(); }
function goNextLesson(e){ location.href='g5_social_u2_l09_생각을펼쳐요.html'; } // l08 → l09 소프트체인
function goHub(){ location.href='../index.html'; }

function saveProgress(){
  const dur=Math.round((Date.now()-state.startTs)/1000);
  const data={
    score:state.score, max_score:100, completed:true,
    completed_at:new Date().toISOString(),
    first_attempt_score: (()=>{try{const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');return p&&p.first_attempt_score!=null?p.first_attempt_score:state.score;}catch(e){return state.score;}})(),
    attempt_count: state.attempt,
    hint_used: state.q.map(x=>x.hint),
    wrong_count: state.q.map(x=>x.wrongCount),
    duration_sec: dur, last_slide: 18
  };
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if(window.kedu && window.kedu.recordLessonEnd && !window.__keduScored){
    window.__keduScored = true;
    window.kedu.recordLessonEnd(state.score, 100);
  }
}

render();
